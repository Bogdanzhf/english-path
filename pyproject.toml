[project]
name = "english-path"
version = "0.1.0"
description = "English Path — платформа для изучения английского языка от A1 до C2"
requires-python = ">=3.11,<4.0"
dependencies = ["fastapi (>=0.142.2,<0.143.0)", "uvicorn[standard] (>=0.54.0,<0.55.0)", "sqlalchemy (>=2.1.3,<3.0.0)", "pyyaml (>=6.0.3,<7.0.0)", "pydantic (>=2.13.5,<3.0.0)"]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "edge-tts (>=7.3.1)",
    "imageio-ffmpeg (>=0.6.0)",
]
