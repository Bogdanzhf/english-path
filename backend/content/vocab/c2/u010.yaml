title: Nature, weather and animals
title_ru: Природа, погода и животные
topic: nature
words:
- apex predator | n | ˈeɪpeks ˈpredətə | ˈeɪpeks ˈpredətər | высший хищник | an animal at the top of the food chain | The shark is an *apex predator*. | Акула — высший хищник.
- 'blight | n | blaɪt |  | бедствие, напасть | something that spoils | Litter is a *blight* on the city. | Мусор — бич города. | гл.: blight — губить'
- echolocation | n | ˌekələʊˈkeɪʃən | ˌekoʊloʊˈkeɪʃən | эхолокация | finding objects by sound | Bats use *echolocation*. | Летучие мыши используют эхолокацию.
- gale | n | ɡeɪl |  | шторм, сильный ветер | a very strong wind | The *gale* blew down trees. | Шторм повалил деревья.
- magpie | n | ˈmæɡpaɪ |  | сорока | a black and white bird | A *magpie* stole the ring. | Сорока утащила кольцо.
- 'moor | n | mɔː | mʊr | вересковая пустошь | open wild land with grass and heather | We walked across the *moors*. | Мы шли по вересковым пустошам. | гл.: moor — швартовать'
- parasitic | adj | ˌpærəˈsɪtɪk | ˌperəˈsɪtɪk | паразитический | living off another | It's a *parasitic* worm. | Это паразитический червь.
- rift | n | rɪft |  | разлом; разрыв (в отношениях) | a crack; a serious disagreement | There's a *rift* between the brothers. | Между братьями разлад.
- scavenger | n | ˈskævɪndʒə | ˈskævəndʒər | падальщик | an animal that eats dead animals | Vultures are *scavengers*. | Грифы — падальщики.
- shimmer | v | ˈʃɪmə | ˈʃɪmər | мерцать, переливаться | to shine with a soft light | The lake *shimmered* in the moonlight. | Озеро мерцало в лунном свете.
- vermin | n | ˈvɜːmɪn | ˈvɜːrmɪn | вредители (крысы, мыши) | small harmful animals | Rats are *vermin*. | Крысы — вредители.
- whirlwind | n | ˈwɜːlwɪnd | ˈhwɜːrlwɪnd | вихрь | a strong spinning wind; a fast series of events | It was a *whirlwind* romance. | Это был стремительный роман.
