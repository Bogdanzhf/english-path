reading:
  title: When the Sky Turned Black
  title_ru: Когда небо почернело
  text: |
    In the early twentieth century, thousands of families moved to the southern Great Plains of the United States. The government promised ample land, and rain was abundant in those years. Farmers ploughed up millions of acres of native prairie grass to plant wheat. For a while, they prospered.

    But the prairie grass had done something important: its deep roots held the soil in place and kept its moisture. When the grass was gone, the land was unprotected. In the 1930s, a severe drought struck. Year after year, the rain failed. The region became arid, and the dry topsoil turned to dust.

    Then the winds came. Huge dust storms, called "black blizzards", swept across the plains and moved inland for hundreds of kilometres. On 14 April 1935, known as "Black Sunday", a wall of dust turned day into night. People were caught outside and couldn't see their own hands. Dust got into houses, food and lungs; many people, especially children, developed "dust pneumonia". Dust from Kansas even reached the cities of the East Coast, falling on ships far out at sea.

    The Dust Bowl, as the region became known, deprived hundreds of thousands of farmers of their livelihoods. It coincided with the Great Depression, one of the worst economic crises in history. Food was scarce, and families grumbled that the land itself had turned against them. Some prayed and fasted for rain. Many rugged families had sworn an oath never to abandon their farms. Nonetheless, about 2.5 million people eventually left, most heading west to California.

    The government responded by making farmers eligible for payments if they used new methods, such as planting trees as windbreaks and rotating crops. Gradually, the land recovered. Today, scientists speculate that climate change could bring similar droughts in the future. The Dust Bowl remains a powerful lesson: when we damage the land, the consequences can be catastrophic.
  ru: |
    В начале XX века тысячи семей переехали на юг Великих равнин США. Правительство обещало много земли, а дождей в те годы было в избытке. Фермеры распахали миллионы акров исконных степных трав, чтобы сеять пшеницу. Какое-то время они процветали.

    Но степные травы делали нечто важное: их глубокие корни удерживали почву и сохраняли в ней влагу. Когда трав не стало, земля осталась беззащитной. В 1930-х годах разразилась жестокая засуха. Год за годом не было дождей. Регион стал засушливым, а сухой верхний слой почвы превратился в пыль.

    А потом пришли ветры. Огромные пыльные бури, прозванные «чёрными метелями», проносились по равнинам и уходили на сотни километров вглубь страны. 14 апреля 1935 года, в «Чёрное воскресенье», стена пыли превратила день в ночь. Люди, оказавшиеся на улице, не видели собственных рук. Пыль проникала в дома, еду и лёгкие; у многих, особенно детей, развивалась «пыльная пневмония». Пыль из Канзаса долетала даже до городов Восточного побережья и оседала на кораблях далеко в море.

    «Пыльный котёл», как стали называть этот регион, лишил сотни тысяч фермеров средств к существованию. Это совпало с Великой депрессией — одним из худших экономических кризисов в истории. Еды не хватало, и семьи ворчали, что сама земля восстала против них. Некоторые молились и постились, прося дождя. Многие стойкие семьи клялись никогда не бросать свои фермы. Тем не менее около 2,5 миллиона человек в итоге уехали, в основном на запад, в Калифорнию.

    Правительство ответило тем, что фермеры получали право на выплаты, если применяли новые методы: высаживали лесополосы для защиты от ветра и чередовали культуры. Постепенно земля восстановилась. Сегодня учёные предполагают, что изменение климата может принести похожие засухи в будущем. «Пыльный котёл» остаётся мощным уроком: когда мы губим землю, последствия могут быть катастрофическими.
  questions:
  - q: What did the prairie grass do?
    options:
    - It caused the drought
    - It held the soil in place and kept moisture
    - It fed cattle only
    - It attracted rain
    answer: 1
  - q: What happened on 'Black Sunday'?
    options:
    - A huge flood
    - A wall of dust turned day into night
    - A tornado destroyed a city
    - The banks closed
    answer: 1
  - q: How did the government help farmers?
    options:
    - It gave them free land in California
    - It paid them to use new methods like windbreaks
    - It banned farming
    - It built cathedrals
    answer: 1
  - tf: The Dust Bowl coincided with the Great Depression.
    answer: true
  - tf: Almost all families stayed on their farms.
    answer: false
