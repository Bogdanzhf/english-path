title: Travel and transport
title_ru: Путешествия и транспорт
topic: travel
words:
- autopilot | n | ˌɔːtəʊˈpaɪlət | ˈɔːtoʊpaɪlət | автопилот | a system that flies a plane automatically | I've been on *autopilot* all day. | Весь день я действовал на автомате.
- conduit | n | ˈkɒndjuːɪt | ˈkɑːnduːɪt | канал, проводник | a channel for passing things | The company was a *conduit* for illegal money. | Компания служила каналом для отмывания денег.
- conurbation | n | kɒnəˈbeɪʃən | kɒnəbˈeɪʃən | агломерация | a large urban area of joined towns | Greater Manchester is a huge *conurbation*. | Большой Манчестер — огромная агломерация.
- ecotourism | n | ˈekətɔːrɪzəm |  | экотуризм | tourism that protects nature | *Ecotourism* is growing in Costa Rica. | В Коста-Рике развивается экотуризм.
- edifice | n | ˈedɪfɪs | ˈedəfəs | здание, сооружение | a large impressive building | The cathedral is a magnificent *edifice*. | Собор — величественное сооружение.
- globetrotter | n | ˈɡləʊbtrɒtə | ˈɡloʊbtrɔːtər | заядлый путешественник | a person who travels a lot | She's a real *globetrotter*. | Она объездила весь мир.
- habitation | n | ˌhæbɪˈteɪʃən | ˌhæbəˈteɪʃən | проживание, жильё | living in a place | The house is unfit for human *habitation*. | Дом непригоден для жилья.
- helm | n | helm |  | штурвал; руководство | the wheel of a ship; control | She's at the *helm* of the company. | Она во главе компании.
- locomotive | n | ˌləʊkəˈməʊtɪv | ˌloʊkəˈmoʊtɪv | локомотив | a train engine | The old steam *locomotive* is in a museum. | Старый паровоз стоит в музее.
- mariner | n | ˈmærɪnə | ˈmærɪnər | мореплаватель | a sailor | Ancient *mariners* used the stars to find their way. | Древние мореплаватели ориентировались по звёздам.
- megacity | n | ˈmeɡəsɪti |  | мегаполис | a city with over 10 million people | Tokyo is a *megacity*. | Токио — мегаполис.
- overtourism | n | ˌəʊvəˈtʊərɪzəm | ˌoʊvərˈtʊrɪzəm | чрезмерный туризм | too many tourists in one place | Venice suffers from *overtourism*. | Венеция страдает от наплыва туристов.
- pedestrian | adj | pəˈdestriən |  | банальный, скучный | ordinary and boring | The film's plot is rather *pedestrian*. | Сюжет фильма довольно банален.
- vicinity | n | vɪˈsɪnɪti | vəˈsɪnəti | окрестность | the nearby area | There are shops in the *vicinity*. | Поблизости есть магазины.
