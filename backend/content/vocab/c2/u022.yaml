title: 'Describing: qualities'
title_ru: 'Описание: свойства и признаки'
topic: describing
words:
- advantageous | adj | ədvɑːnˈteɪdʒəs | ˌædvənˈteɪdʒəs | выгодный | giving an advantage | It's an *advantageous* position. | Это выгодное положение.
- bogus | adj | ˈbəʊɡəs | ˈboʊɡəs | фальшивый, поддельный | fake | He used a *bogus* passport. | Он воспользовался поддельным паспортом.
- brink | n | brɪŋk |  | грань, край | the edge | They're on the *brink* of war. | Они на грани войны.
- constrained | adj | kənˈstreɪnd |  | ограниченный; скованный | limited; not relaxed | We're *constrained* by budget. | Нас ограничивает бюджет.
- deliberate | v | dɪˈlɪbɜːeɪt | dɪˈlɪbəreɪt | обдумывать, совещаться | to think carefully | The jury *deliberated* for hours. | Присяжные совещались несколько часов. | произн. dɪˈlɪbəreɪt
- derelict | adj | ˈderɪlɪkt | ˈderəlɪkt | заброшенный, ветхий | empty and in bad condition | It's a *derelict* building. | Это заброшенное здание.
- dilapidated | adj | dɪˈlæpɪdeɪtɪd |  | ветхий, полуразрушенный | old and in very bad condition | They bought a *dilapidated* farmhouse. | Они купили ветхий фермерский дом.
- eminent | adj | ˈemɪnənt | ˈemənənt | выдающийся, видный | famous and respected | He's an *eminent* scientist. | Он выдающийся учёный.
- exalted | adj | ɪɡˈzɒltɪd | ɪɡˈzɔːltɪd | высокий, возвышенный | of high rank | She holds an *exalted* position. | Она занимает высокое положение.
- ignominious | adj | ˌɪɡnəˈmɪnɪəs | ˌɪɡnəˈmɪniəs | позорный | embarrassing | It was an *ignominious* defeat. | Это было позорное поражение.
- interlocking | adj | ˌɪntəˈlɒkɪŋ | ˈɪntərlɑːkɪŋ | взаимосвязанный, сцепленный | fitting together | They are *interlocking* problems. | Это взаимосвязанные проблемы.
- laudatory | adj | ˈlɔːdətɔːri |  | хвалебный | expressing praise | The review was *laudatory*. | Отзыв был хвалебным.
- oblique | adj | əˈbliːk |  | косвенный; наклонный | indirect; sloping | He made an *oblique* reference to the scandal. | Он вскользь упомянул скандал.
- opulent | adj | ˈɒpjʊlənt | ˈɑːpjələnt | роскошный | rich and luxurious | They live in an *opulent* house. | Они живут в роскошном доме.
- patchy | adj | ˈpætʃi |  | неравномерный, отрывочный | uneven | My knowledge of history is *patchy*. | Мои знания истории отрывочны.
- prone | adj | prəʊn | proʊn | склонный, подверженный | likely to suffer from | He's *prone* to headaches. | Он склонен к головным болям.
- seedy | adj | ˈsiːdi |  | захудалый, сомнительный | dirty and unpleasant | It's a *seedy* bar. | Это сомнительный бар.
- stringent | adj | ˈstrɪndʒənt |  | строгий | very strict | There are *stringent* safety rules. | Действуют строгие правила безопасности.
- vis-a-vis | prep | ˈvizəvi | ˈviːzəvi | по отношению к, в сравнении с | in relation to | What's our position *vis-a-vis* the competition? | Каково наше положение по сравнению с конкурентами?
- vortex | n | ˈvɔːteks | ˈvɔːrteks | вихрь, водоворот | a spinning mass | They were sucked into a *vortex* of debt. | Их затянуло в водоворот долгов.
