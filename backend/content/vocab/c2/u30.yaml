reading:
  title: "The Tragedy of Burke and Wills"
  title_ru: "Трагедия Бёрка и Уиллса"
  text: |
    In 1860, much of the Australian continent was still unknown to European settlers. No one had crossed the vast, dry outback from south to north. The colony of Victoria organized an expedition with a dual purpose: to explore the interior scientifically and to win glory for Melbourne by being the first to reach the northern coast.

    The expedition comprised nineteen men, twenty-three horses, twenty-six camels imported from India and an enormous amount of equipment — including a Chinese gong and heavy wooden tables. Its leader, Robert O'Hara Burke, was a police officer with almost no experience of exploration. His deputy, William Wills, was a young surveyor who carried instruments such as a thermometer, a compass and binoculars and kept careful notes. Temperatures often rose above 110 degrees Fahrenheit.

    The journey was slow. Impatient, Burke split the group, leaving the bulk of the supplies behind. At Cooper Creek, he left a small party at a camp in a grove of trees with orders to wait three months. Then Burke, Wills and two other men set off on a shortcut north. After weeks of struggle, they reached the mangrove swamps near the northern coast. Although they never actually saw the open sea, they had fulfilled their main goal.

    The return was a disaster. They ran out of food, and one man died. When the three survivors finally staggered back to Cooper Creek, they found the camp empty. The waiting party had left that very morning, after more than four months — just nine hours earlier. It was one of the cruellest coincidences in the history of exploration.

    The paradox of their fate is that they starved in a land where Aboriginal people had lived successfully for tens of thousands of years. Local Yandruwandha people gave them fish and seeds, but Burke, distrustful, sometimes refused their help. Burke and Wills died. Only one man, John King, survived — kept alive by Aboriginal people until a rescue party found him months later, when the explorers' whereabouts were finally discovered.

    Paintings and monuments later depicted the two leaders as heroes. Today, many historians argue that their mistakes outweighed their courage, and that the real lesson of the story is the knowledge of those who had lived in the outback all along.
  ru: |
    В 1860 году значительная часть Австралийского континента всё ещё оставалась неизвестной европейским поселенцам. Никто не пересёк огромную засушливую глубинку с юга на север. Колония Виктория организовала экспедицию с двойной целью: научно исследовать внутренние районы и прославить Мельбурн, первым добравшись до северного побережья.

    В экспедицию входили девятнадцать человек, двадцать три лошади, двадцать шесть верблюдов, привезённых из Индии, и огромное количество снаряжения — в том числе китайский гонг и тяжёлые деревянные столы. Её руководитель, Роберт О'Хара Бёрк, был полицейским почти без опыта исследований. Его заместитель Уильям Уиллс был молодым топографом: он нёс приборы — термометр, компас и бинокль — и вёл подробные записи. Температура часто поднималась выше 110 градусов по Фаренгейту.

    Продвигались медленно. Нетерпеливый Бёрк разделил группу, оставив основную часть припасов позади. У ручья Купер-Крик он оставил небольшой отряд в лагере в роще с приказом ждать три месяца. Затем Бёрк, Уиллс и ещё двое отправились коротким путём на север. После недель борьбы они достигли мангровых болот у северного побережья. Хотя открытого моря они так и не увидели, главная цель была достигнута.

    Обратный путь обернулся катастрофой. Еда кончилась, один человек умер. Когда трое выживших наконец добрели до Купер-Крика, лагерь оказался пуст. Ожидавший отряд ушёл в то же утро, прождав больше четырёх месяцев, — всего за девять часов до их возвращения. Это было одно из самых жестоких совпадений в истории исследований.

    Парадокс их судьбы в том, что они умерли от голода на земле, где аборигены успешно жили десятки тысяч лет. Местные жители из народа яндрувандха давали им рыбу и семена, но недоверчивый Бёрк порой отказывался от их помощи. Бёрк и Уиллс погибли. Выжил лишь один — Джон Кинг: его выходили аборигены, пока спасательный отряд не нашёл его спустя месяцы, когда наконец стало известно местонахождение исследователей.

    Позже на картинах и памятниках двух руководителей изображали героями. Сегодня многие историки считают, что их ошибки перевешивали их отвагу и что настоящий урок этой истории — в знаниях тех, кто всё это время жил в глубинке.
  questions:
    - q: "What was the expedition's goal?"
      options: ["To find gold", "To cross the continent from south to north", "To meet Aboriginal people", "To build a railway"]
      answer: 1
    - q: "Why was the camp at Cooper Creek empty?"
      options: ["It had been attacked", "The waiting party had left just nine hours earlier", "It was never built", "They went to the wrong place"]
      answer: 1
    - q: "Who survived?"
      options: ["Burke", "Wills", "John King, helped by Aboriginal people", "Nobody"]
      answer: 2
    - tf: "Burke was a very experienced explorer."
      answer: false
    - tf: "Aboriginal people offered the explorers food."
      answer: true
