title: Actions and movement
title_ru: Действия и движение
topic: actions
words:
- ad-lib | v | ˈædˈlɪb |  | импровизировать | to speak without preparing | He forgot his lines and *ad-libbed*. | Он забыл текст и стал импровизировать.
- brandish | v | ˈbrændɪʃ |  | размахивать | to wave a weapon | He *brandished* a knife. | Он размахивал ножом.
- clinch | v | klɪntʃ |  | добиться, решить (окончательно) | to settle a deal or win | They *clinched* the title. | Они завоевали титул.
- 'cocoon | v | kəˈkuːn |  | укутывать, оберегать | to protect completely | She was *cocooned* in a blanket. | Она закуталась в плед. | сущ.: cocoon — кокон'
- contrive | v | kənˈtraɪv |  | ухитриться; подстроить | to manage cleverly; to arrange dishonestly | He *contrived* to meet her. | Он ухитрился встретиться с ней.
- engender | v | ɪnˈdʒendə | enˈdʒendər | порождать | to cause a feeling | The policy *engendered* anger. | Политика вызвала гнев.
- envisage | v | ɪnˈvɪsɪdʒ | enˈvɪzɪdʒ | предусматривать, представлять | to imagine as possible | I don't *envisage* any problems. | Я не предвижу проблем.
- etch | v | etʃ |  | гравировать; врезаться (в память) | to cut into a surface; to remain in memory | The moment is *etched* in my memory. | Этот момент врезался мне в память.
- fabricate | v | ˈfæbrɪkeɪt | ˈfæbrəkeɪt | фабриковать; изготавливать | to invent false information; to make | He *fabricated* evidence. | Он сфабриковал улики.
- hoist | v | hɔɪst |  | поднимать (с помощью тросов) | to lift up | They *hoisted* the flag. | Они подняли флаг.
- hound | v | haʊnd |  | преследовать, травить | to chase or harass someone constantly | The elephants were *hounded* by poachers for decades. | Десятилетиями слонов преследовали браконьеры. | сущ. hound — гончая
- huddle | v | ˈhʌdl |  | сбиваться в кучу, ютиться | to gather closely | We *huddled* around the fire. | Мы сгрудились у костра.
- overlay | v | ˈəʊvɜːleɪ | ˈoʊvərleɪ | покрывать, накладывать | to put on top | The image was *overlaid* with text. | На изображение наложили текст.
- perch | v | pɜːtʃ | pɜːrtʃ | присесть, примоститься | to sit on the edge | She *perched* on the arm of the chair. | Она примостилась на подлокотнике кресла.
- posit | v | ˈpɒsɪt | ˈpɑːzət | постулировать, выдвигать | to suggest as a basis for argument | The theory *posits* that life began in water. | Теория утверждает, что жизнь зародилась в воде.
- rebound | v | rɪˈbaʊnd | riːˈbaʊnd | отскакивать; восстанавливаться | to bounce back | Prices *rebounded* quickly. | Цены быстро восстановились.
- stabilise | v | ˈsteɪbəlaɪz | stˈeɪbəlaɪz | стабилизировать(ся) | to become stable | Prices have *stabilised*. | Цены стабилизировались. | амер. stabilize
- unravel | v | ʌnˈrævl | ənˈrævl | распутывать(ся); рушиться | to undo; to fall apart | The plan began to *unravel*. | План начал рушиться.
- vandalize | v | ˈvændəlaɪz |  | крушить, портить (умышленно) | to damage property on purpose | Someone *vandalized* the bus stop. | Кто-то разгромил остановку. | брит. также vandalise
