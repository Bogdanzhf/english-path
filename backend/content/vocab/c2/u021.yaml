title: Communication and language
title_ru: Общение и язык
topic: communication
words:
- allude | v | əˈluːd |  | намекать | to mention indirectly | He *alluded* to his past. | Он намекнул на своё прошлое. | allude to sth
- babble | v | ˈbæbl |  | лепетать, болтать | to talk quickly and foolishly | The baby *babbled* happily. | Малыш радостно лепетал.
- coax | v | kəʊks | koʊks | уговаривать, задабривать | to persuade gently | She *coaxed* the cat out of the tree. | Она выманила кошку с дерева.
- condone | v | kənˈdəʊn | kənˈdoʊn | мириться, попустительствовать | to accept bad behaviour | I don't *condone* violence. | Я не оправдываю насилие.
- connote | v | kəˈnəʊt | kəˈnoʊt | подразумевать, иметь оттенок значения | to suggest an extra meaning | "Home" *connotes* warmth. | Слово «дом» вызывает ощущение тепла.
- denote | v | dɪˈnəʊt | dɪˈnoʊt | обозначать | to be a sign of something | A red flag *denotes* danger. | Красный флаг обозначает опасность.
- deprecate | v | ˈdeprɪkeɪt | ˈdeprəkeɪt | осуждать, не одобрять | to disapprove of | He *deprecates* violence. | Он осуждает насилие. | self-deprecating — самоироничный
- disparage | v | dɪˈspærɪdʒ | dɪˈsperɪdʒ | принижать, отзываться пренебрежительно | to say something is worthless | Don't *disparage* other people's work. | Не принижай чужую работу.
- disseminate | v | dɪˈsemɪneɪt |  | распространять | to spread information widely | Copies were made to *disseminate* the text. | Делались копии, чтобы распространить текст.
- familiarise | v | fəˈmɪliəraɪz | fəmˈɪliəraɪz | знакомить | to help someone learn about | *Familiarise* yourself with the rules. | Ознакомьтесь с правилами. | амер. familiarize
- feign | v | feɪn |  | притворяться, симулировать | to pretend | He *feigned* illness. | Он прикинулся больным.
- grumble | v | ˈɡrʌmbl |  | ворчать | to complain in a low voice | The farmers *grumbled* about the low prices. | Фермеры ворчали из-за низких цен.
- herald | v | ˈherəld |  | возвещать, предвещать | to be a sign of | The discovery *heralds* a new era. | Открытие возвещает новую эру.
- interrogate | v | ɪnˈterəɡeɪt | ˌɪnˈterəɡeɪt | допрашивать | to question closely | Police *interrogated* the suspect. | Полиция допросила подозреваемого.
- laud | v | lɔːd |  | восхвалять | to praise | The film was *lauded* by critics. | Критики превозносили фильм.
- liaise | v | ˈlɪeɪz | lˈɪeɪz | поддерживать связь, взаимодействовать | to work together and share information | She *liaises* with clients. | Она поддерживает связь с клиентами.
- mediate | v | ˈmiːdɪeɪt | ˈmiːdiːeɪt | быть посредником | to help two sides agree | The UN *mediated* the talks. | ООН выступила посредником на переговорах.
- rebuke | v | rɪˈbjuːk | riːbˈjuːk | упрекать, делать выговор | to criticise sharply | He was *rebuked* for being late. | Ему сделали выговор за опоздание.
- reproach | v | rɪˈprəʊtʃ | riːˈproʊtʃ | упрекать | to criticise gently | She *reproached* him for being late. | Она упрекнула его в опоздании.
- solicit | v | səˈlɪsɪt |  | просить, добиваться | to ask for | They *solicited* donations. | Они собирали пожертвования.
- stipulate | v | ˈstɪpjəleɪt |  | оговаривать, ставить условием | to state as a condition | The contract *stipulates* a deadline. | Договор оговаривает срок.
- succumb | v | səˈkʌm |  | поддаться; умереть (от болезни) | to give in; to die | He *succumbed* to temptation. | Он поддался искушению.
- vindicate | v | ˈvɪndɪkeɪt | ˈvɪndəkeɪt | оправдывать, подтверждать правоту | to prove right | The results *vindicated* her decision. | Результаты подтвердили правильность её решения.
