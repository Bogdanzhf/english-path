title: Character and personality
title_ru: Характер и личность
topic: feelings
words:
- angst | n | æŋst | ɑːŋkst | тревога, экзистенциальная тоска | deep anxiety | The novel is full of teenage *angst*. | Роман полон подростковой тоски.
- didactic | adj | dɪˈdæktɪk | daɪˈdæktɪk | назидательный | intended to teach | The film is too *didactic*. | Фильм слишком назидательный.
- emulation | n | ˌemjʊˈleɪʃən | ˌemjəˈleɪʃən | подражание; эмуляция | copying someone you admire | His success is worthy of *emulation*. | Его успех достоин подражания.
- euphoria | n | juːˈfɔːriə |  | эйфория | extreme happiness | There was *euphoria* after the win. | После победы царила эйфория.
- fractious | adj | ˈfrækʃəs |  | раздражительный, склочный | easily annoyed; causing trouble | The children were tired and *fractious*. | Дети устали и капризничали.
- grievance | n | ˈɡriːvəns |  | обида, жалоба | a complaint about unfair treatment | Workers have many *grievances*. | У рабочих много претензий.
- haughty | adj | ˈhɔːti |  | надменный | proud and unfriendly | She gave him a *haughty* look. | Она надменно взглянула на него.
- indolent | adj | ˈɪndələnt |  | ленивый, праздный | lazy | He was an *indolent* student. | Он был ленивым студентом.
- ingratiating | adj | ɪnˈɡreɪʃɪeɪtɪŋ | ˌɪŋˈɡreɪʃiːeɪtɪŋ | заискивающий | trying too hard to please | He gave an *ingratiating* smile. | Он заискивающе улыбнулся.
- malice | n | ˈmælɪs | ˈmæləs | злоба, злой умысел | the wish to harm | There was no *malice* in his words. | В его словах не было злобы.
- melancholy | n | ˈmelənkɒli | ˈmelənkɑːli | меланхолия, грусть | deep sadness | A feeling of *melancholy* came over her. | Её охватила меланхолия.
- nostalgia | n | nəˈstældʒə | nɔːˈstældʒə | ностальгия | longing for the past | I feel *nostalgia* for my childhood. | Я ностальгирую по детству.
- pedantic | adj | peˈdɑːntɪk | pəˈdæntɪk | педантичный | too worried about small details | Don't be so *pedantic*! | Не будь таким занудой!
- rapture | n | ˈræptʃə | ˈræptʃər | восторг, упоение | great joy | The audience listened in *rapture*. | Зрители слушали в восторге.
- surreptitious | adj | sərɪpˈtɪʃəs | ˌsɜːrəpˈtɪʃəs | тайный, скрытный | done secretly | She took a *surreptitious* look at her phone. | Она украдкой взглянула на телефон.
- taciturn | adj | ˈtæsɪtɜːn | ˈtæsɪtɜːrn | неразговорчивый | not saying much | He's a *taciturn* man. | Он неразговорчивый человек.
- tetchy | adj | ˈtetʃi | tˈetʃi | раздражительный (брит.) | easily annoyed | He gets *tetchy* when he's tired. | Когда он устаёт, становится раздражительным.
- vehement | adj | ˈviːəmənt |  | яростный, страстный | showing very strong feelings | There was *vehement* opposition to the plan. | План встретил яростное сопротивление.
