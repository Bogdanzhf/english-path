title: Events and situations
title_ru: События и ситуации
topic: events
words:
- solitude | n | ˈsɒlɪtjuːd | ˈsɑːlətuːd | уединение, одиночество | being alone, especially by choice | He spent his last years in *solitude*. | Последние годы он провёл в уединении.
- tumult | n | ˈtjuːmʌlt | ˈtuːmʌlt | смятение, шум | a state of noise and confusion | The ground was in *tumult* as people ran. | На земле царило смятение, люди бежали.
