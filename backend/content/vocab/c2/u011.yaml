title: Phrasal verbs
title_ru: Фразовые глаголы
topic: phrasal
words:
- gloss over | phv |  |  | замалчивать, сглаживать | to avoid talking about a problem | He *glossed over* the mistakes. | Он замял ошибки.
- hammer out | phv |  |  | выработать (в спорах) | to reach an agreement after long discussion | They *hammered out* a deal. | Они выработали соглашение.
- hanker after | phv |  |  | страстно желать | to want very much | She *hankers after* a big house. | Она мечтает о большом доме.
- mull over | phv |  |  | обдумывать | to think carefully about | I'll *mull over* your offer. | Я обдумаю ваше предложение.
- paper over | phv |  |  | замазывать (проблемы) | to hide a problem without solving it | They *papered over* their differences. | Они замяли свои разногласия.
- pore over | phv |  |  | корпеть над, изучать | to study carefully | She *pored over* the map. | Она внимательно изучала карту.
- rake in | phv |  |  | загребать (деньги) | to earn a lot of money | The film *raked in* millions. | Фильм собрал миллионы.
- rattle off | phv |  |  | отбарабанить | to say quickly from memory | She *rattled off* the names. | Она быстро перечислила имена.
- ride out | phv |  |  | переждать, пережить | to survive a difficult time | We *rode out* the storm. | Мы переждали бурю.
- stave off | phv |  |  | предотвращать, отсрочивать | to prevent for a while | I ate a snack to *stave off* hunger. | Я перекусил, чтобы заглушить голод.
- while away | phv |  |  | коротать (время) | to spend time pleasantly | We *whiled away* the afternoon reading. | Мы скоротали день за чтением.
- whittle down | phv |  |  | постепенно сокращать | to reduce gradually | They *whittled down* the list to five. | Список постепенно сократили до пяти.
