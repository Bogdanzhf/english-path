title: Idioms
title_ru: Идиомы
topic: idioms
words:
- a baptism of fire | phr |  |  | боевое крещение | a difficult first experience | My first day was *a baptism of fire*. | Первый день стал для меня боевым крещением.
- 'a Catch-22 | phr |  |  | заколдованный круг, безвыходная ситуация | a problem with no solution because of contradictory rules | It''s *a Catch-22*: no job without experience, no experience without a job. | Замкнутый круг: без опыта не берут на работу, а без работы нет опыта.'
- a fait accompli | phr |  |  | свершившийся факт | something already done that can't be changed | The decision was presented as *a fait accompli*. | Решение преподнесли как свершившийся факт.
- a hornet's nest | phr |  |  | осиное гнездо | a situation causing anger | His comments stirred up *a hornet's nest*. | Его слова разворошили осиное гнездо.
- a moot point | phr |  |  | спорный (и уже неважный) вопрос | a question that can't be decided or doesn't matter now | Whether he was right is *a moot point*. | Был ли он прав — вопрос спорный.
- a poisoned chalice | phr |  |  | отравленная чаша (выгодное, но губительное предложение) | something that seems good but brings trouble | The job proved to be *a poisoned chalice*. | Эта должность оказалась отравленной чашей.
- a Pyrrhic victory | phr |  |  | пиррова победа | a win that costs too much | It was *a pyrrhic victory*. | Это была пиррова победа.
- a red herring | phr |  |  | ложный след, отвлекающий манёвр | something that distracts from the real issue | The clue was *a red herring*. | Улика оказалась ложным следом.
- a sea change | phr |  |  | коренной перелом | a big change | There's been *a sea change* in attitudes. | Отношение кардинально изменилось.
- a storm in a teacup | phr |  |  | буря в стакане воды | a lot of fuss about nothing | The argument was *a storm in a teacup*. | Ссора оказалась бурей в стакане воды.
- a wild goose chase | phr |  |  | бессмысленная погоня, напрасные поиски | a hopeless search | It was *a wild goose chase*. | Это были напрасные поиски.
- an Achilles' heel | phr |  |  | ахиллесова пята | a weak point | Maths is my *Achilles' heel*. | Математика — моя ахиллесова пята.
- beyond the pale | phr |  |  | за гранью дозволенного | unacceptable | His behaviour was *beyond the pale*. | Его поведение было за гранью.
- bury the hatchet | phr |  |  | зарыть топор войны | to stop arguing | It's time to *bury the hatchet*. | Пора зарыть топор войны.
- carte blanche | phr |  |  | карт-бланш | complete freedom to act | She was given *carte blanche* to redesign the office. | Ей дали карт-бланш на переделку офиса.
- damn with faint praise | phr |  |  | хвалить так, что выходит критика | to praise weakly, showing you don't like it | Critics tend to *damn with faint praise* films they dislike. | Критики обычно сдержанно хвалят фильмы, которые им не нравятся, — и это звучит как приговор.
- have an axe to grind | phr |  |  | преследовать личные цели | to have a selfish reason for something | He *has an axe to grind* with the company. | У него личные счёты с компанией.
- in dire straits | phr |  |  | в отчаянном положении | in a very difficult situation | The company is *in dire straits*. | Компания в бедственном положении.
- in the offing | phr |  |  | на горизонте, предстоящий | likely to happen soon | A pay rise is *in the offing*. | Намечается повышение зарплаты.
- kick the can down the road | phr |  |  | откладывать решение проблемы | to delay dealing with a problem | Politicians keep *kicking the can down the road*. | Политики всё откладывают решение проблемы.
- par for the course | phr |  |  | обычное дело | normal and expected | Delays are *par for the course* here. | Задержки здесь обычное дело.
- put the cart before the horse | phr |  |  | ставить телегу впереди лошади | to do things in the wrong order | Don't *put the cart before the horse*. | Не делай всё задом наперёд.
- rest on your laurels | phr |  |  | почивать на лаврах | to stop trying after success | Don't *rest on your laurels*. | Не почивай на лаврах.
- ride roughshod over | phr |  |  | попирать, не считаться с | to ignore others' feelings or rights | He *rode roughshod over* everyone's objections. | Он проигнорировал все возражения.
- the jury is still out | phr |  |  | вопрос ещё не решён | people haven't decided yet | *The jury is still out* on the new policy. | О новой политике пока нет единого мнения.
- the lion's share | phr |  |  | львиная доля | the biggest part | He took *the lion's share* of the profits. | Он забрал львиную долю прибыли.
- the thin end of the wedge | phr |  |  | начало опасной тенденции | a small change that will lead to bigger bad ones | This tax is *the thin end of the wedge*. | Этот налог — только начало.
- the writing on the wall | phr |  |  | дурное предзнаменование | signs that something bad will happen | He saw *the writing on the wall* and resigned. | Он почувствовал, к чему идёт, и ушёл в отставку.
- toe the line | phr |  |  | подчиняться правилам | to obey the rules | You must *toe the line* here. | Здесь нужно соблюдать правила.
