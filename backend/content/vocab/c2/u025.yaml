title: Communication and language
title_ru: Общение и язык
topic: communication
words:
- denote | v | dɪˈnəʊt | dɪˈnoʊt | обозначать | to be a sign of something | A red flag *denotes* danger. | Красный флаг обозначает опасность.
- disseminate | v | dɪˈsemɪneɪt |  | распространять | to spread information widely | Copies were made to *disseminate* the text. | Делались копии, чтобы распространить текст.
