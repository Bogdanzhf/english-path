title: Actions and movement
title_ru: Действия и движение
topic: actions
words:
- circumnavigate | v | ˌsɜːkəmˈnævɪɡeɪt | ˌsɜːrkəmˈnævəɡeɪt | плавать вокруг, огибать | to sail around | Magellan's crew *circumnavigated* the globe. | Команда Магеллана обогнула земной шар.
- collide | v | kəˈlaɪd |  | сталкиваться | to hit something while moving | Two ships *collided* in the fog. | Два корабля столкнулись в тумане. | collision — столкновение
- dribble | v | ˈdrɪbl |  | капать; вести мяч | to flow in drops; to move a ball with small kicks | He *dribbled* past two players. | Он обвёл двух игроков.
- ebb | v | eb |  | убывать, спадать | to flow away; to become weaker | His strength began to *ebb*. | Его силы начали иссякать. | ebb and flow — прилив и отлив
- emulate | v | ˈemjuleɪt |  | подражать, равняться | to try to copy someone you admire | Children *emulate* the behaviour of adults. | Дети подражают поведению взрослых.
- fluctuate | v | ˈflʌktʃuːeɪt | ˈflʌktʃəweɪt | колебаться | to change often | Prices *fluctuate* daily. | Цены меняются каждый день.
- gravitate | v | ˈɡrævɪteɪt |  | тяготеть, притягиваться | to be attracted towards | Young people *gravitate* to cities. | Молодёжь тянется в города.
- loiter | v | ˈlɔɪtə | ˈlɔɪtər | слоняться, околачиваться | to stand around without purpose | Teenagers *loiter* outside the shop. | Подростки болтаются у магазина.
- negate | v | nɪˈɡeɪt |  | сводить на нет; отрицать | to cancel the effect of | The price rise *negated* our savings. | Рост цен свёл на нет нашу экономию.
- protrude | v | prəˈtruːd | proʊˈtruːd | выступать, торчать | to stick out | A nail *protruded* from the wall. | Из стены торчал гвоздь.
- quiver | v | ˈkwɪvə | ˈkwɪvər | дрожать, трепетать | to shake slightly | Her lips *quivered*. | Её губы дрожали.
- reverberate | v | rɪˈvɜːbəreɪt | rɪˈvɜːrbəreɪt | отражаться (эхом), иметь отголоски | to echo; to have a lasting effect | The news *reverberated* around the world. | Новость облетела весь мир.
- situate | v | ˈsɪtʃueɪt |  | располагать, размещать | to put in a particular place | The museum is *situated* in the town centre. | Музей расположен в центре города. | чаще be situated
- squirm | v | skwɜːm | skwɜːrm | извиваться, ёрзать (от неловкости) | to twist your body; to feel embarrassed | He *squirmed* in his seat. | Он ёрзал на стуле.
- subsist | v | səbˈsɪst |  | существовать, кормиться | to stay alive with very little money or food | Many families *subsisted* on fishing. | Многие семьи кормились рыбной ловлей.
- swivel | v | ˈswɪvl |  | вращаться, поворачиваться | to turn around a central point | He *swivelled* in his chair. | Он повернулся на стуле.
- teem | v | tiːm |  | кишеть | to be full of | The river *teems* with fish. | Река кишит рыбой.
- topple | v | ˈtɒpl | ˈtɑːpl | опрокидывать; свергать | to fall over; to remove from power | The government was *toppled*. | Правительство было свергнуто.
- trifle | n | ˈtraɪfl |  | пустяк; трайфл (десерт) | something unimportant; a layered dessert | Don't worry about such *trifles*. | Не переживай из-за пустяков.
