title: Actions and movement
title_ru: Действия и движение
topic: actions
words:
- collide | v | kəˈlaɪd |  | сталкиваться | to hit something while moving | Two ships *collided* in the fog. | Два корабля столкнулись в тумане. | collision — столкновение
- emulate | v | ˈemjuleɪt |  | подражать, равняться | to try to copy someone you admire | Children *emulate* the behaviour of adults. | Дети подражают поведению взрослых.
- situate | v | ˈsɪtʃueɪt |  | располагать, размещать | to put in a particular place | The museum is *situated* in the town centre. | Музей расположен в центре города. | чаще be situated
- subsist | v | səbˈsɪst |  | существовать, кормиться | to stay alive with very little money or food | Many families *subsisted* on fishing. | Многие семьи кормились рыбной ловлей.
