- additive | n | ˈædɪtɪv | ˈædətɪv | добавка | a substance added to food | The food contains no *additives*. | В продукте нет добавок.
- contraption | n | kənˈtræpʃən |  | приспособление, штуковина | a strange machine | He built a strange *contraption*. | Он построил странную штуковину.
- culinary | adj | ˈkjʊlɪnəri | ˈkjuːlɪneri | кулинарный | relating to cooking | She has great *culinary* skills. | У неё отличные кулинарные способности.
- delicatessen | n | ˈdelɪkætesən | ˌdelɪkəˈtesən | магазин деликатесов | a shop selling special foods | I bought cheese at the *delicatessen*. | Я купил сыр в магазине деликатесов. | сокр. deli
- gastronomy | n | ɡæˈstrɒnəmi | ɡæˈstrɑːnəmi | гастрономия | the art of good eating | Lyon is famous for its *gastronomy*. | Лион славится гастрономией.
- ore | n | ɔː | ɔːr | руда | rock from which metal can be obtained | Australia exports huge amounts of iron *ore*. | Австралия экспортирует огромное количество железной руды.
