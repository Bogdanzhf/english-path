reading:
  title: Silence Above the Clouds
  title_ru: Тишина над облаками
  text: |
    I had read about the monastery beforehand, but nothing prepared me for the journey. From the village, a narrow winding path climbed for three hours up the side of the mountain. As I walked, the weather deteriorated. Clouds rolled in, and the valley below became a blurred grey mass. By the time I reached the gate, the temperature had fallen to a few degrees above zero, and my teeth were chattering. I zipped my jacket up to my chin.

    From the outside, the building was simple. Its stone exterior, built into the cliff, had hardly changed in six hundred years. But when the heavy door opened, an elderly monk greeted me with outstretched arms and a warm smile. "You look like you need soup," he said in perfect English. The monks were wonderfully hospitable. They led me to a small kitchen, where steam condensed on the cold windows, and gave me a bowl of hearty bean soup and bread they had baked that morning.

    About twenty monks live there. They rise at four for prayers and spend their days working in silence: baking, repairing the buildings and tending a small plant nursery. Supplies are limited; a parcel of food and post arrives by donkey once a week. Yet the monks were far from gloomy. Brother Thomas, the oldest, had a wonderful sense of humor and told stories about the years he had spent teaching music before taking his vows. He still loved classical music and confessed that he sometimes listened to a Mozart concerto on an old radio.

    That evening, I sat in the chapel during prayers. Candlelight lit the monks' faces in profile, and their voices filled the darkness. Outside, it was minus five degrees centigrade, but I hardly noticed.

    I had expected the silence to feel lonely. Instead, it felt full. The next morning, as I walked back down to the village and the old manor house where I was staying, I realized I had not checked my phone for a whole day — and I hadn't missed it at all.
  ru: |
    Я заранее читал о монастыре, но ничто не подготовило меня к дороге. От деревни узкая извилистая тропа три часа поднималась по склону горы. Пока я шёл, погода портилась. Набежали облака, и долина внизу превратилась в размытую серую массу. К тому времени как я добрался до ворот, температура опустилась до нескольких градусов выше нуля, и у меня стучали зубы. Я застегнул куртку до подбородка.

    Снаружи здание выглядело просто. Его каменный фасад, встроенный в скалу, почти не изменился за шестьсот лет. Но когда тяжёлая дверь отворилась, пожилой монах встретил меня с распростёртыми объятиями и тёплой улыбкой. «Вам, похоже, не помешает суп», — сказал он на безупречном английском. Монахи были удивительно гостеприимны. Они отвели меня на маленькую кухню, где пар оседал на холодных окнах, и дали миску сытного фасолевого супа и хлеб, испечённый тем утром.

    Там живут около двадцати монахов. Они встают в четыре утра на молитву и проводят дни в молчаливом труде: пекут хлеб, ремонтируют постройки и ухаживают за небольшим питомником растений. Припасов немного: посылку с едой и почтой раз в неделю привозит осёл. И всё же монахи были совсем не мрачными. Брат Томас, самый старший, обладал прекрасным чувством юмора и рассказывал истории о годах, когда преподавал музыку, до того как принять обеты. Он по-прежнему любил классическую музыку и признался, что иногда слушает концерт Моцарта по старому радиоприёмнику.

    В тот вечер я сидел в часовне во время молитвы. Свет свечей обрисовывал профили монахов, а их голоса наполняли темноту. Снаружи было минус пять по Цельсию, но я почти не замечал этого.

    Я ожидал, что тишина будет казаться одинокой. Вместо этого она была наполненной. На следующее утро, спускаясь обратно в деревню, к старой усадьбе, где я остановился, я понял, что целый день не заглядывал в телефон — и ни капли по нему не скучал.
  questions:
  - q: What happened to the weather during the climb?
    options:
    - It became sunny
    - It got worse
    - It started snowing heavily
    - It stayed the same
    answer: 1
  - q: How do supplies reach the monastery?
    options:
    - By helicopter
    - By donkey once a week
    - By car every day
    - The monks grow everything
    answer: 1
  - q: What did the narrator realize the next morning?
    options:
    - He had lost his phone
    - He hadn't checked his phone all day and didn't miss it
    - He wanted to become a monk
    - He was ill
    answer: 1
  - tf: The monks were gloomy and unfriendly.
    answer: false
  - tf: Brother Thomas used to teach music.
    answer: true
