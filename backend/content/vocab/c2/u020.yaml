title: Feelings and states
title_ru: Чувства и состояния
topic: feelings
words:
- afflicted | adj | əˈflɪktɪd |  | страдающий (от болезни, проблемы) | suffering from an illness or problem | Millions of people are *afflicted* by a fear of flying. | Миллионы людей страдают от страха полётов.
- devoid | adj | dɪˈvɔɪd |  | лишённый | completely without something | The island was almost *devoid* of trees. | Остров был почти лишён деревьев. | devoid of
- incredulous | adj | ɪnˈkredjələs | ɪnˈkredʒələs | недоверчивый | unable to believe something | She gave him an *incredulous* look. | Она недоверчиво посмотрела на него.
