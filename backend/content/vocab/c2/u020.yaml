title: Communication and language
title_ru: Общение и язык
topic: communication
words:
- allusion | n | əˈluːʒən |  | намёк, аллюзия | an indirect reference | The poem is full of *allusions* to the Bible. | Стихотворение полно библейских аллюзий.
- "articulate | adj | \x01ːˈtɪkjəleɪt | ɑːrˈtɪkjəleɪt | красноречивый, ясно выражающий мысли | able to express ideas clearly | She's very *articulate*. | Она очень красноречива. | гл.: articulate [ɑːˈtɪkjuleɪt] — чётко формулировать"
- articulation | n | ɑːˌtɪkjʊˈleɪʃən | ˌɑːrtɪkjəˈleɪʃən | артикуляция; выражение | clear speech; expressing ideas | Good *articulation* helps listeners. | Чёткая артикуляция помогает слушателям.
- 'axiom | n | ˈæksɪəm | ˈæksiəm | аксиома | a statement accepted as true | It''s an *axiom* that money can''t buy happiness. | Аксиома: счастье за деньги не купишь.'
- behest | n | bɪˈhest |  | веление, требование | a request or order | He came at the *behest* of his boss. | Он пришёл по требованию начальника.
- blurb | n | blɜːb | blɜːrb | аннотация (на обложке) | a short description on a book cover | The *blurb* made the book sound exciting. | Аннотация обещала захватывающую книгу.
- brevity | n | ˈbrevɪti | ˈbrevəti | краткость | using few words | *Brevity* is the soul of wit. | Краткость — сестра таланта.
- connotation | n | kɒnəʊˈteɪʃən | ˌkɑːnəˈteɪʃən | коннотация, дополнительный смысл | an extra meaning a word suggests | "Cheap" has negative *connotations*. | У слова «cheap» отрицательный оттенок.
- derision | n | dɪˈrɪʒən | dəˈrɪʒən | насмешка | laughter that shows contempt | His idea was met with *derision*. | Его идею встретили насмешками.
- disparagement | n | dɪˈspærɪdʒmənt |  | пренебрежение, умаление | saying something is worthless | There was no *disparagement* in her tone. | В её тоне не было пренебрежения.
- dissemination | n | dɪˌsemɪˈneɪʃən | dɪˌseməˈneɪʃən | распространение | spreading information | The *dissemination* of knowledge is vital. | Распространение знаний очень важно.
- euphemism | n | ˈjuːfəmɪzəm |  | эвфемизм | a polite word for something unpleasant | "Passed away" is a *euphemism* for "died". | «Ушёл из жизни» — эвфемизм для «умер».
- fabrication | n | ˌfæbrɪˈkeɪʃən |  | выдумка, фальсификация | a lie | His story was a complete *fabrication*. | Его история — полная выдумка.
- gambit | n | ˈɡæmbɪt |  | гамбит, хитрый ход | a planned move to gain an advantage | It was a clever opening *gambit*. | Это был умный первый ход.
- idiomatic | adj | ˌɪdɪəˈmætɪk | ˌɪdiəˈmætɪk | идиоматический | typical of natural speech | Her English is very *idiomatic*. | У неё очень естественный, живой английский.
- innuendo | n | ɪnnjuːˈendəʊ | ˌɪnjuːˈendoʊ | инсинуация, намёк | an indirect, usually unpleasant, suggestion | The article was full of *innuendo*. | Статья полна инсинуаций.
- interrogation | n | ɪnˌterəˈɡeɪʃən | ˌɪnˌterəˈɡeɪʃən | допрос | questioning by police | The suspect is under *interrogation*. | Подозреваемого допрашивают.
- "jargon | n | dʒ\x01ːɡən | ˈdʒɑːrɡən | жаргон (профессиональный) | special words of a profession | Avoid technical *jargon*. | Избегайте технического жаргона."
- mediation | n | ˌmiːdɪˈeɪʃən | ˌmiːdiːˈeɪʃən | посредничество | helping two sides agree | The dispute was settled through *mediation*. | Спор урегулировали через посредника.
- stipulation | n | ˌstɪpjʊˈleɪʃən | ˌstɪpjəˈleɪʃən | условие, оговорка | a condition in an agreement | There's a *stipulation* that you must stay a year. | Есть условие отработать год.
- testimonial | n | ˌtestɪˈməʊnɪəl | ˌtestəˈmoʊniəl | рекомендация, отзыв | a statement praising someone | The website has customer *testimonials*. | На сайте есть отзывы клиентов.
- truism | n | ˈtruːɪzəm |  | трюизм, банальность | an obvious truth | It's a *truism* that health matters. | Банально говорить, что здоровье важно.
- vernacular | n | vɜːˈnækjʊlə | vərˈnækjələr | разговорный язык, местный язык | the everyday language of a place | He wrote in the local *vernacular*. | Он писал на местном наречии.
