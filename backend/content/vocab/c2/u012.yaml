title: Arts and media
title_ru: Искусство и медиа
topic: arts
words:
- acrobatic | adj | ˌækrəˈbætɪk |  | акробатический | involving difficult movements | He made an *acrobatic* save. | Он совершил акробатический сейв.
- acrobatics | n | ˌækrəˈbætɪks |  | акробатика | difficult physical movements | The circus show had amazing *acrobatics*. | В цирковом шоу была потрясающая акробатика.
- allegorical | adj | ˌælɪˈɡɒrɪkl | ˌæləˈɡɔːrəkl | аллегорический | using symbols for deeper meaning | It's an *allegorical* tale. | Это аллегорическая история.
- allegory | n | ˈælɪɡəri | ˈæləɡɔːri | аллегория | a story with a hidden meaning | "Animal Farm" is an *allegory*. | «Скотный двор» — аллегория.
- anthology | n | ænˈθɒlədʒi | ænˈθɑːlədʒi | антология, сборник | a collection of poems or stories | It's an *anthology* of short stories. | Это сборник рассказов.
- "avant-garde | adj | əˈv\x01ːnˈɡ\x01ːd | əˈvɑːnˈɡɑːrd | авангардный | very new and experimental | He makes *avant-garde* films. | Он снимает авангардное кино."
- choreography | n | ˌkɔːrɪˈɒɡrəfi | ˌkɔːriːˈɑːɡrəfi | хореография | the steps of a dance | The *choreography* was stunning. | Хореография была потрясающей.
- cinematography | n | ˌsɪnɪməˈtɒɡrəfi | ˌsɪnɪməˈtɑːɡrəfi | операторская работа | the art of filming | The film's *cinematography* is beautiful. | Операторская работа в фильме прекрасна.
- curator | n | kjʊˈreɪtə | ˈkjʊrətər | куратор, хранитель | a person in charge of a museum collection | The *curator* showed us around. | Куратор провёл для нас экскурсию.
- echo chamber | n | ˈekəʊ ˈtʃeɪmbə | ˈekoʊ ˈtʃeɪmbər | эхо-камера | a space where people hear only views like their own | Social media can be an *echo chamber*. | Соцсети могут превращаться в эхо-камеру.
- fabled | adj | ˈfeɪbəld |  | легендарный, сказочный | famous; from legends | We visited the *fabled* city of Timbuktu. | Мы побывали в легендарном Тимбукту.
- melodious | adj | meˈləʊdɪəs | məˈloʊdiəs | мелодичный | pleasant to hear | She has a *melodious* voice. | У неё мелодичный голос.
- modernism | n | ˈmɒdənɪzəm | ˈmɑːdərnɪzəm | модернизм | a style that breaks with tradition | *Modernism* changed architecture. | Модернизм изменил архитектуру.
- paparazzi | n | ˌpɑːpəˈrɑːtsi | ˌpɑːpɑːˈrɔːziː | папарацци | photographers who follow celebrities | The *paparazzi* followed her everywhere. | Папарацци преследовали её повсюду.
- parable | n | ˈpærəbl | ˈperəbl | притча | a story with a moral | Jesus told many *parables*. | Иисус рассказывал много притч.
- philistine | n | ˈfɪlɪstaɪn | ˈfɪləstiːn | обыватель, мещанин | a person who doesn't appreciate art | He's a complete *philistine*. | Он совершенный обыватель.
- surrealism | n | səˈriəlɪzəm |  | сюрреализм | an art style with dreamlike images | Dalí is famous for *surrealism*. | Дали знаменит своим сюрреализмом.
