title: Thinking and opinions
title_ru: Мысли и мнения
topic: mind
words:
- agility | n | æˈdʒɪlɪti | əˈdʒɪləti | ловкость, гибкость | being agile | The gymnast showed great *agility*. | Гимнастка продемонстрировала большую ловкость.
- athleticism | n | æθˈletɪsɪzəm | æθˈletɪsɪzm | атлетизм, спортивность | physical strength and skill | His *athleticism* is impressive. | Его спортивная форма впечатляет.
- authenticity | n | ɔːθɪnˈtɪsɪti | ˌɔːθənˈtɪsɪti | подлинность | being real | Experts doubt the painting's *authenticity*. | Эксперты сомневаются в подлинности картины.
- avail | n | əˈveɪl |  | польза, толк | use or benefit (in phrases) | They tried every cure, but to no *avail*. | Они перепробовали все средства, но безрезультатно. | to no avail — тщетно
- eccentricity | n | ˌeksɪnˈtrɪsɪti | ˌeksənˈtrɪsəti | эксцентричность, чудачество | strange behaviour | His *eccentricity* made him famous. | Чудачества принесли ему известность.
- elasticity | n | ɪlɑːˈstɪsɪti | ˌiːˌlæsˈtɪsəti | эластичность | being elastic | Skin loses *elasticity* with age. | С возрастом кожа теряет упругость.
- ethos | n | ˈiːθəʊz | ˈiːθɑːs | дух, моральные принципы | the beliefs of a group | The school has a strong *ethos*. | У школы сильные традиции и ценности.
- ferocity | n | fəˈrɒsɪti | fəˈrɑːsəti | свирепость | fierceness | The storm hit with great *ferocity*. | Буря ударила с огромной силой.
- hindsight | n | ˈhaɪndsaɪt | ˈhaɪnsaɪt | взгляд в прошлое | understanding after an event | With *hindsight*, I should have left. | Задним числом понимаю, что надо было уйти.
- idiosyncrasy | n | ˈɪdɪɒsɪŋkrəsi | ˌɪdiːoʊˈsɪnkrəsiː | особенность, причуда | an unusual habit | Everyone has their *idiosyncrasies*. | У каждого свои причуды.
- individualism | n | ˌɪndɪˈvɪdʒuːəlɪzəm | ˌɪndɪvɪˈduːəlɪzəm | индивидуализм | valuing independence | American culture values *individualism*. | Американская культура ценит индивидуализм.
- indulgence | n | ɪnˈdʌldʒəns | ˌɪnˈdʌldʒəns | потворство; удовольствие | allowing yourself pleasure | Chocolate is my only *indulgence*. | Шоколад — моя единственная слабость.
- mediocrity | n | ˌmiːdɪˈɒkrɪti | ˌmiːdiːˈɑːkrəti | посредственность | being mediocre | He's surrounded by *mediocrity*. | Его окружает посредственность.
- merit | v | ˈmerɪt | ˈmerət | заслуживать | to deserve | The idea *merits* consideration. | Идея заслуживает рассмотрения.
- mystique | n | mɪˈstiːk |  | ореол таинственности | an air of mystery | The brand has a certain *mystique*. | У бренда есть некий ореол загадочности.
- posturing | n | ˈpɒstʃərɪŋ | ˈpɑːstʃərɪŋ | позёрство | behaviour meant to impress | It's just political *posturing*. | Это просто политическое позёрство.
- profitability | n | ˌprɒfɪtəˈbɪlɪti | ˌprɑːfɪtəˈbɪlɪti | рентабельность, прибыльность | being profitable | The company's *profitability* has improved. | Рентабельность компании выросла.
- ruminate | v | ˈruːmɪneɪt |  | размышлять | to think deeply | He *ruminated* on his past. | Он размышлял о прошлом.
- snobbery | n | ˈsnɒbəri | ˈsnɑːbəri | снобизм | looking down on others | There's a lot of *snobbery* about wine. | Вокруг вина много снобизма.
- spontaneity | n | spɒnˈteɪnɪti | ˌspɑːntəˈniəti | спонтанность | acting naturally without planning | Children have wonderful *spontaneity*. | Дети удивительно непосредственны.
- stoicism | n | ˈstəʊɪsɪzəm | ˈstoʊəsɪzəm | стоицизм | accepting hardship without complaint | She faced the illness with *stoicism*. | Она стоически переносила болезнь.
- tenacity | n | teˈnæsɪti | təˈnæsɪti | упорство | determination | She showed great *tenacity*. | Она проявила большое упорство.
- topography | n | təˈpɒɡrəfi | təˈpɑːɡrəfi | топография, рельеф | the physical features of land | The *topography* of the area is varied. | Рельеф местности разнообразен.
- treachery | n | ˈtretʃəri |  | предательство | betrayal | He was accused of *treachery*. | Его обвинили в предательстве.
- verisimilitude | n | ˈverɪsɪmɪlɪtjuːd | ˌverəsəˈmɪlətuːd | правдоподобие | seeming real | The film has great *verisimilitude*. | Фильм очень правдоподобен.
