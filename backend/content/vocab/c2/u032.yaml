- stoicism | n | ˈstəʊɪsɪzəm | ˈstoʊəsɪzəm | стоицизм | accepting hardship without complaint | She faced the illness with *stoicism*. | Она стоически переносила болезнь.
- tenacity | n | teˈnæsɪti | təˈnæsɪti | упорство | determination | She showed great *tenacity*. | Она проявила большое упорство.
- topography | n | təˈpɒɡrəfi | təˈpɑːɡrəfi | топография, рельеф | the physical features of land | The *topography* of the area is varied. | Рельеф местности разнообразен.
- treachery | n | ˈtretʃəri |  | предательство | betrayal | He was accused of *treachery*. | Его обвинили в предательстве.
