title: 'Describing: qualities'
title_ru: 'Описание: свойства и признаки'
topic: describing
words:
- anarchic | adj | æˈnɑːkɪk | æˈnɑːrkɪk | анархический, хаотичный | without control | The party was *anarchic*. | Вечеринка была хаотичной.
- burgeoning | adj | ˈbɜːdʒənɪŋ | ˈbɜːrdʒənɪŋ | быстро растущий | growing quickly | There's a *burgeoning* market for apps. | Рынок приложений быстро растёт.
- exact | v | ɪɡˈzækt |  | требовать, взыскивать | to demand and get | He *exacted* revenge. | Он отомстил.
- haphazard | adj | hæpˈhæzəd | hæpˈhæzərd | бессистемный | without order | The books were arranged in a *haphazard* way. | Книги стояли как попало.
- hypothetical | adj | ˌhaɪpəˈθetɪkl | ˌhaɪpəˈθetəkl | гипотетический | imagined, not real | It's a *hypothetical* question. | Это гипотетический вопрос.
- imperceptible | adj | ɪmpəˈseptəbl | ˌɪmpərˈseptɪbl | незаметный | too small to notice | The change was almost *imperceptible*. | Изменение было почти незаметным.
- inadvertent | adj | ˌɪnədˈvɜːtnt | ˌɪnədˈvɜːrtnt | неумышленный, нечаянный | not done on purpose | It was an *inadvertent* mistake. | Это была нечаянная ошибка.
- intrinsic | adj | ɪnˈtrɪnsɪk |  | внутренний, присущий | belonging to the basic nature of something | Sleep is *intrinsic* to good health. | Сон неотъемлем от хорошего здоровья.
- malleable | adj | ˈmæləbl | ˈmæliəbl | ковкий; податливый | easily shaped | Children's minds are *malleable*. | Детский ум податлив.
- moribund | adj | ˈmɔːrɪbʌnd | ˈmɔːrəbənd | умирающий, угасающий | dying; not active | The industry is *moribund*. | Отрасль угасает.
- nascent | adj | ˈneɪsənt |  | зарождающийся | just beginning | It's a *nascent* industry. | Это зарождающаяся отрасль.
- outmoded | adj | ˌaʊtˈməʊdɪd | ˌaʊtˈmoʊdɪd | устаревший | no longer fashionable or useful | These ideas are completely *outmoded*. | Эти идеи совершенно устарели.
- ponderous | adj | ˈpɒndərəs | ˈpɑːndərəs | тяжеловесный, медлительный | slow and heavy; boring | His writing style is *ponderous*. | У него тяжеловесный стиль.
- preeminent | adj | priːˈemɪnənt | priːˈemənənt | выдающийся, ведущий | the most important | She's the *preeminent* expert. | Она ведущий эксперт.
- prescriptive | adj | prɪˈskrɪptɪv | prɪskrˈɪptɪv | предписывающий, нормативный | telling people what to do | The rules are too *prescriptive*. | Правила слишком жёсткие.
- primeval | adj | praɪˈmiːvl |  | первобытный, древнейший | from the earliest times | It's a *primeval* forest. | Это первобытный лес.
- unadulterated | adj | ʌnəˈdʌltəreɪtɪd | ˌʌnəˈdʌltəreɪtɪd | чистый, неразбавленный | pure; complete | It was *unadulterated* joy. | Это была чистая радость.
- unfeasible | adj | ʌnˈfiːzəbl | ənˈfiːzəbl | неосуществимый | not possible | The plan is *unfeasible*. | План неосуществим.
- unobtrusive | adj | ʌnɒbˈtruːsɪv | ˌʌnəbˈtruːsɪv | ненавязчивый, незаметный | not noticeable | The service was *unobtrusive*. | Обслуживание было ненавязчивым.
- unsuspected | adj | ʌnsəˈspektɪd | ˌʌnsəˈspektɪd | неожиданный, непредвиденный | not known about | She revealed an *unsuspected* talent. | У неё обнаружился неожиданный талант.
