reading:
  title: Wear It Once, Throw It Away
  title_ru: Надел раз — выбросил
  text: |
    Twenty years ago, most clothing brands released new collections four times a year. Today, some fast-fashion companies add thousands of new items to their websites every week. Using intuitive apps, customers can order a dress on the tram home from work and receive it from a courier the next day. Prices are so low that many people wear a garment only a few times before throwing it away.

    The industry has been propelled by social media. Influencers post outfits that followers want to copy immediately, and many young people obsess over never being photographed in the same clothes twice. Shopping has also become a way to socialize and relax. But the true cost of this cheap clothing is hidden.

    Most fast fashion is produced in countries where wages are extremely low. In 2013, the Rana Plaza building in Bangladesh, which contained several garment factories, collapsed, killing more than 1,100 workers. Cracks had appeared in the walls the day before, but workers were ordered to return. The disaster unsettled consumers around the world and raised questions about whether brands should be legally liable for conditions in their suppliers' factories. Some companies were accused of trying to suppress information about where their clothes were made.

    The environmental impact is also enormous. The fashion industry is responsible for a significant share of global carbon emissions. Clothes are shipped as freight across oceans, and delivery vans make city streets more congested. Producing a single pair of jeans can use thousands of litres of water. Cheap synthetic fabrics release microplastics, and millions of tonnes of clothing end up in landfills every year.

    Change is possible. Some consumers now buy fewer, premium-quality items that last longer, or shop secondhand. Clothing swaps and repair workshops are becoming more popular. Being able to buy cheap clothes is a privilege, and the people who make them often pay the price. As one campaigner said: "We don't need to stop buying clothes. We just need to stop going overboard."
  ru: |
    Двадцать лет назад большинство брендов одежды выпускали новые коллекции четыре раза в год. Сегодня некоторые компании быстрой моды добавляют на свои сайты тысячи новинок каждую неделю. С помощью интуитивных приложений можно заказать платье в трамвае по дороге с работы и получить его от курьера на следующий день. Цены настолько низкие, что многие надевают вещь всего несколько раз, а потом выбрасывают.

    Рост отрасли подстегнули соцсети. Блогеры публикуют образы, которые подписчики хотят немедленно повторить, а многие молодые люди одержимы тем, чтобы никогда не появляться на фото в одной и той же одежде дважды. Шопинг стал ещё и способом общаться и отдыхать. Но истинная цена этой дешёвой одежды скрыта.

    Большая часть быстрой моды производится в странах с крайне низкими зарплатами. В 2013 году в Бангладеш рухнуло здание «Рана-Плаза», где размещались несколько швейных фабрик; погибли более 1100 рабочих. Накануне в стенах появились трещины, но работникам велели вернуться. Катастрофа встревожила покупателей по всему миру и подняла вопрос о том, должны ли бренды нести юридическую ответственность за условия на фабриках поставщиков. Некоторые компании обвиняли в том, что они пытались скрыть, где шьют их одежду.

    Огромно и воздействие на окружающую среду. На модную индустрию приходится значительная доля мировых выбросов углерода. Одежду перевозят морем через океаны, а фургоны доставки ещё больше загружают городские улицы. На производство одной пары джинсов может уходить несколько тысяч литров воды. Дешёвые синтетические ткани выделяют микропластик, а миллионы тонн одежды ежегодно оказываются на свалках.

    Изменения возможны. Некоторые покупатели теперь берут меньше вещей, но более высокого качества, которые дольше служат, или покупают подержанное. Набирают популярность обмен одеждой и мастерские по ремонту. Возможность покупать дешёвую одежду — привилегия, и платят за неё часто те, кто её шьёт. Как сказала одна активистка: «Нам не нужно переставать покупать одежду. Нужно просто перестать перегибать палку».
  questions:
  - q: How often do some fast-fashion companies add new items?
    options:
    - Four times a year
    - Every week
    - Once a year
    - Every month
    answer: 1
  - q: What happened at Rana Plaza in 2013?
    options:
    - A strike
    - The building collapsed, killing over 1,100 workers
    - A fire in a shop
    - A new factory opened
    answer: 1
  - q: What is one solution suggested in the text?
    options:
    - Buy more cheap clothes
    - Buy fewer, better-quality items or secondhand
    - Stop wearing clothes
    - Only shop online
    answer: 1
  - tf: Workers at Rana Plaza had been warned there were cracks in the walls.
    answer: true
  - tf: The fashion industry has a very small environmental impact.
    answer: false
