title: Shopping and money
title_ru: Покупки и деньги
topic: shopping
words:
- allot | v | əˈlɒt | əˈlɑːt | выделять, отводить | to give a share | Each speaker is *allotted* five minutes. | Каждому выступающему отводится пять минут.
- allotment | n | əˈlɒtmənt | əˈlɑːtmənt | участок (огородный); доля | a small piece of land for growing vegetables | He grows potatoes on his *allotment*. | Он выращивает картошку на огородном участке.
- 'annex | v | ˈæneks |  | аннексировать, присоединять | to take control of a territory | The country *annexed* the region. | Страна аннексировала регион. | сущ.: annex(e) — пристройка'
- "conglomerate | n | kənˈɡl\x01ːmɜːət | kənˈɡlɑːmərət | конгломерат | a large company made of many firms | He works for a media *conglomerate*. | Он работает в медиаконгломерате."
- cull | v | kʌl |  | отбраковывать, отстреливать | to kill some animals to reduce numbers | Farmers *culled* the sick cattle. | Фермеры забили больной скот.
- dole out | phv |  |  | раздавать | to give out | She *doled out* sweets to the kids. | Она раздала детям конфеты.
- eke out | phv |  |  | растягивать; с трудом зарабатывать | to make a small amount last; to earn with difficulty | They *eked out* a living from farming. | Они кое-как кормились фермерством.
- laissez-faire | adj | ˌleseɪ ˈfeə | ˌleseɪ ˈfer | невмешательства | not interfering | The government has a *laissez-faire* approach. | Правительство придерживается политики невмешательства.
- monetary policy | n | ˈmʌnɪtəri ˈpɒlɪsi | ˈmɑːnəteri ˈpɑːləsi | денежно-кредитная политика | how a central bank controls money | The bank changed its *monetary policy*. | Банк изменил денежно-кредитную политику.
- relinquish | v | rɪˈlɪnkwɪʃ | riːˈlɪŋkwɪʃ | отказываться, уступать | to give up | He *relinquished* control of the company. | Он отказался от контроля над компанией.
- remittance | n | rɪˈmɪtəns | rəˈmɪtəns | денежный перевод | money sent home by workers abroad | Families depend on *remittances*. | Семьи живут на переводы от родных из-за границы.
- stagnation | n | stæɡˈneɪʃən |  | застой, стагнация | a lack of growth | The economy is in *stagnation*. | Экономика в застое.
- subsidize | v | ˈsəbsɪdaɪz | ˈsʌbsɪdaɪz | субсидировать | to pay part of the cost | The government *subsidizes* public transport. | Государство дотирует общественный транспорт. | брит. также subsidise
- subsistence | n | sʌbˈsɪstəns | səbˈsɪstəns | выживание, прожиточный минимум | having just enough to live | They live on *subsistence* farming. | Они живут натуральным хозяйством.
