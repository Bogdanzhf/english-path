reading:
  title: Did the Luddites Hate Technology?
  title_ru: Ненавидели ли луддиты технику?
  text: |
    Today, the word "Luddite" is used to describe someone who dislikes new technology — a person who refuses to use a smartphone, for example. But the original Luddites were not simply afraid of machines. Their story is more complicated, and it has surprising relevance today.

    For centuries, cloth in England had been produced by skilled workers who wove and finished it by hand, often at home. Since medieval times, these crafts had been organized by guilds, and experienced weavers enjoyed considerable prestige and good wages. In the early nineteenth century, however, the textile industry underwent a radical transformation. New machines, made of iron and brass components, could produce cloth faster and more cheaply. Factory owners, oriented towards profit in an age of growing capitalism, began to replace skilled workers with machines operated by cheaper, unskilled labour, including children.

    The results were devastating for many communities. The value of traditional skills diminished almost overnight. A large proportion of weavers lost their jobs, and wages collapsed. Food prices were high because of the Napoleonic Wars, and families were starving.

    In 1811, groups of workers in the Midlands and the North began to break into factories at night and smash the new machines. They claimed to follow a mysterious leader called "General Ludd". The government responded harshly. It sent thousands of soldiers to the region and imposed the death penalty for breaking machines. Several Luddites were hanged.

    Historians have refuted the idea that the Luddites hated all technology. Many of them used machines themselves. What they opposed was the way technology was being used: to lower wages, destroy communities and increase the dependence of workers on factory owners, without any protection. Their protest was about fairness, not machines.

    The Industrial Revolution brought spectacular economic growth, but it also had serious drawbacks. Today, as artificial intelligence threatens to make some jobs obsolete, the Luddites' question seems far from archaic: who benefits from new technology, and who pays the price?
  ru: |
    Сегодня словом «луддит» называют человека, который не любит новые технологии, — например, отказывается пользоваться смартфоном. Но настоящие луддиты вовсе не просто боялись машин. Их история сложнее, и она удивительно актуальна сегодня.

    Веками ткань в Англии производили искусные мастера, которые ткали и отделывали её вручную, часто дома. Со Средних веков эти ремёсла объединялись в гильдии, а опытные ткачи пользовались немалым уважением и хорошо зарабатывали. Однако в начале XIX века текстильная промышленность пережила коренное преобразование. Новые машины из железных и латунных деталей могли производить ткань быстрее и дешевле. Владельцы фабрик, нацеленные на прибыль в эпоху растущего капитализма, стали заменять квалифицированных рабочих машинами, на которых работал более дешёвый неквалифицированный труд, в том числе детский.

    Для многих общин последствия были разрушительными. Ценность традиционных навыков почти в одночасье упала. Значительная часть ткачей лишилась работы, а зарплаты рухнули. Из-за Наполеоновских войн продукты были дорогими, и семьи голодали.

    В 1811 году группы рабочих в центральных и северных графствах начали по ночам врываться на фабрики и крушить новые машины. Они утверждали, что следуют за таинственным вождём — «генералом Луддом». Правительство ответило жёстко. Оно направило в регион тысячи солдат и ввело смертную казнь за поломку машин. Нескольких луддитов повесили.

    Историки опровергли представление о том, что луддиты ненавидели любую технику. Многие из них сами работали на станках. Они выступали против того, как использовалась техника: чтобы снижать зарплаты, разрушать общины и усиливать зависимость рабочих от фабрикантов без всякой защиты. Их протест был о справедливости, а не о машинах.

    Промышленная революция принесла впечатляющий экономический рост, но у неё были и серьёзные недостатки. Сегодня, когда искусственный интеллект грозит сделать некоторые профессии ненужными, вопрос луддитов кажется далеко не устаревшим: кто выигрывает от новых технологий, а кто платит за них?
  questions:
  - q: What does 'Luddite' mean today?
    options:
    - A skilled weaver
    - Someone who dislikes new technology
    - A factory owner
    - A soldier
    answer: 1
  - q: Why did factory owners use the new machines?
    options:
    - To help workers
    - To produce cloth faster and more cheaply
    - Because the government ordered it
    - To improve quality
    answer: 1
  - q: What did the Luddites really oppose, according to historians?
    options:
    - All technology
    - The way technology was used to lower wages and destroy communities
    - The king
    - Cheap cloth
    answer: 1
  - tf: The government responded gently to the Luddites.
    answer: false
  - tf: Many Luddites used machines themselves.
    answer: true
