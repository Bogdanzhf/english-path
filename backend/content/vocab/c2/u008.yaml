title: Work and jobs
title_ru: Работа и профессии
topic: work
words:
- cinematographer | n | ˌsɪnɪməˈtɒɡrəfə | ˌsɪnɪməˈtɑːɡrəfər | оператор (кино) | a person in charge of filming | The *cinematographer* won an Oscar. | Оператор получил «Оскар».
- headmistress | n | hedˈmɪstrəs | ˈhedmɪstrəs | директриса (школы) | a female head teacher | The *headmistress* called a meeting. | Директриса созвала собрание.
- hotelier | n | həʊˈteliə | hoʊˈteljər | владелец отеля | a person who owns or runs a hotel | He's a successful *hotelier*. | Он успешный владелец отелей.
- incumbent | n | ɪnˈkʌmbənt | ˌɪnˈkʌmbənt | действующий (в должности) | the person holding a position | The *incumbent* won the election. | Действующий президент победил на выборах.
- lyricist | n | ˈlɪrɪsɪst |  | автор текстов песен | a person who writes song lyrics | He's a brilliant *lyricist*. | Он блестящий автор текстов.
- magnate | n | ˈmæɡneɪt |  | магнат | a rich, powerful businessperson | He's a shipping *magnate*. | Он судоходный магнат.
- meritocracy | n | ˌmerɪˈtɒkrəsi | merɪˈtɔːkrəsi | меритократия | a system where people succeed by ability | Is our society a *meritocracy*? | Является ли наше общество меритократией?
- meritocratic | adj | ˌmerɪtəˈkrætɪk | mˌerɪtəkrˈætɪk | меритократический | based on ability | It's a *meritocratic* system. | Это система, основанная на заслугах.
- nepotism | n | ˈnepətɪzəm |  | кумовство | giving jobs to relatives | He was accused of *nepotism*. | Его обвинили в кумовстве.
- redundancy | n | rɪˈdʌndənsi |  | сокращение (штатов); избыточность | losing your job because it's no longer needed | There were 200 *redundancies*. | Сократили 200 человек.
- wordsmith | n | ˈwɜːdsmɪθ | ˈwɜːrdsmɪθ | мастер слова | a skilled writer | He's a true *wordsmith*. | Он настоящий мастер слова.
- zoologist | n | zuːˈɒlədʒɪst | zoʊˈɑːlədʒəst | зоолог | a scientist who studies animals | The *zoologist* studies gorillas. | Зоолог изучает горилл.
