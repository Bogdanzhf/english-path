title: Thinking and opinions
title_ru: Мысли и мнения
topic: mind
words:
- assimilate | v | əˈsɪmɪleɪt |  | ассимилироваться, усваивать | to become part of a group and adopt its culture; to fully understand information | Immigrants often *assimilate* into the local culture. | Иммигранты часто ассимилируются в местную культуру.
- chronology | n | krəˈnɒlədʒi | krəˈnɑːlədʒi | хронология | the order in which events happened | The *chronology* of the artist's work was confusing. | Хронология работ художника была запутанной.
- err | v | ɜː | ɜːr | ошибаться | to make a mistake | To *err* is human. | Человеку свойственно ошибаться.
