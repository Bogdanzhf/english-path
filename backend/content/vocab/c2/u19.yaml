    - q: "How often do some fast-fashion companies add new items?"
      options: ["Four times a year", "Every week", "Once a year", "Every month"]
      answer: 1
    - q: "What happened at Rana Plaza in 2013?"
      options: ["A strike", "The building collapsed, killing over 1,100 workers", "A fire in a shop", "A new factory opened"]
      answer: 1
    - q: "What is one solution suggested in the text?"
      options: ["Buy more cheap clothes", "Buy fewer, better-quality items or secondhand", "Stop wearing clothes", "Only shop online"]
      answer: 1
