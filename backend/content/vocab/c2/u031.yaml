title: Language for essays
title_ru: Язык аргументации
topic: essay
words:
- a double-edged sword | phr |  |  | палка о двух концах | something with good and bad effects | Fame is *a double-edged sword*. | Слава — палка о двух концах.
- by and large | phr |  |  | в целом, по большому счёту | generally | *By and large*, the trip was a success. | В целом поездка удалась.
- conducive to | phr |  |  | способствующий | helping something happen | Noise is not *conducive to* study. | Шум не способствует учёбе.
- contentious | adj | kənˈtenʃəs |  | спорный | causing disagreement | It's a *contentious* issue. | Это спорный вопрос.
- exacerbate | v | ɪɡˈzæsəbeɪt | ɪɡˈzæsərbeɪt | усугублять | to make worse | Stress can *exacerbate* the illness. | Стресс может усугубить болезнь.
- multifaceted | adj | ˌmʌltɪˈfæsetɪd | ˌmʌltiːˈfæsətɪd | многогранный | having many sides | It's a *multifaceted* problem. | Это многогранная проблема.
- myriad | adj | ˈmɪrɪæd | ˈmɪriəd | бесчисленный | very many | There are *myriad* reasons. | Причин бесчисленное множество.
- on balance | phr |  |  | взвесив всё | after considering all facts | *On balance*, I think we should go. | Взвесив всё, думаю, нам стоит поехать.
- paramount | adj | ˈpærəmaʊnt | ˈperəmaʊnt | первостепенный | most important | Safety is *paramount*. | Безопасность превыше всего.
- pervasive | adj | pəˈveɪsɪv | pərˈveɪsɪv | всепроникающий, повсеместный | spread everywhere | The smell was *pervasive*. | Запах был повсюду.
- salient | adj | ˈseɪliənt |  | основной, выдающийся | most noticeable or important | Here are the *salient* points. | Вот основные моменты.
- ubiquitous | adj | juːˈbɪkwɪtəs |  | вездесущий, повсеместный | found everywhere | Smartphones are *ubiquitous*. | Смартфоны повсюду.
