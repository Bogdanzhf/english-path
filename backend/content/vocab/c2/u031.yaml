title: Language for essays
title_ru: Язык аргументации
topic: essay
words:
- a double-edged sword | phr |  |  | палка о двух концах | something with good and bad effects | Fame is *a double-edged sword*. | Слава — палка о двух концах.
- by and large | phr |  |  | в целом, по большому счёту | generally | *By and large*, the trip was a success. | В целом поездка удалась.
- conducive to | phr |  |  | способствующий | helping something happen | Noise is not *conducive to* study. | Шум не способствует учёбе.
- contentious | adj | kənˈtenʃəs |  | спорный | causing disagreement | It's a *contentious* issue. | Это спорный вопрос.
- exacerbate | v | ɪɡˈzæsəbeɪt | ɪɡˈzæsərbeɪt | усугублять | to make worse | Stress can *exacerbate* the illness. | Стресс может усугубить болезнь.
- multifaceted | adj | ˌmʌltɪˈfæsetɪd | ˌmʌltiːˈfæsətɪd | многогранный | having many sides | It's a *multifaceted* problem. | Это многогранная проблема.
- myriad | adj | ˈmɪrɪæd | ˈmɪriəd | бесчисленный | very many | There are *myriad* reasons. | Причин бесчисленное множество.
- on balance | phr |  |  | взвесив всё | after considering all facts | *On balance*, I think we should go. | Взвесив всё, думаю, нам стоит поехать.
- paramount | adj | ˈpærəmaʊnt | ˈperəmaʊnt | первостепенный | most important | Safety is *paramount*. | Безопасность превыше всего.
- pervasive | adj | pəˈveɪsɪv | pərˈveɪsɪv | всепроникающий, повсеместный | spread everywhere | The smell was *pervasive*. | Запах был повсюду.
- salient | adj | ˈseɪliənt |  | основной, выдающийся | most noticeable or important | Here are the *salient* points. | Вот основные моменты.
- ubiquitous | adj | juːˈbɪkwɪtəs |  | вездесущий, повсеместный | found everywhere | Smartphones are *ubiquitous*. | Смартфоны повсюду.
reading:
  title: The Voice of Apollo
  title_ru: Голос Аполлона
  text: |
    For more than a thousand years, people from all over the ancient Greek world travelled to Delphi, a sacred site high on the slopes of Mount Parnassus. They came to consult the oracle — a priestess called the Pythia, who was believed to speak on behalf of the god Apollo. Kings asked whether they should go to war; cities asked where to found new colonies; ordinary people asked about marriage, illness and money.

    The rites were elaborate. Visitors first purified themselves with water from a sacred spring and offered gifts — a goat, a loaf of honey cake or, for the wealthy, gold and silver. The temple kept a detailed inventory of the treasures it received. On consultation days, the Pythia sat on a tall three-legged stool above a crack in the rock in the innermost room of the temple. Ancient writers describe how she breathed in sweet-smelling vapours, fell into a trance and gave answers that priests then interpreted.

    Her answers were famously ambiguous. When King Croesus of Lydia asked whether he should attack Persia, the oracle replied that if he did, "a great empire would fall". Croesus attacked — and the empire that fell was his own.

    For centuries, modern scholars doubted the stories about the vapours. Previous excavations found no crack in the rock beneath the temple. However, a team of geologists in the 1990s discovered two faults crossing directly under the site. They found evidence that sweet-smelling gases such as ethylene may once have risen from the rock. In small doses, these can produce a pleasant, trance-like state. Rather than a supernatural power, the Pythia's visions may have had a natural explanation.

    The temple's most famous inscription was simple: "Know thyself". It encouraged an inward search for wisdom rather than answers from outside. More than two thousand years later, that advice remains as relevant as ever. Today, Delphi is a World Heritage Site, and visitors from across the globe still climb the hill to see where Apollo is said to have spoken.
  ru: |
    Более тысячи лет люди со всего древнегреческого мира приезжали в Дельфы — священное место высоко на склонах горы Парнас. Они приходили за советом к оракулу — жрице по имени Пифия, которая, как верили, говорила от имени бога Аполлона. Цари спрашивали, начинать ли войну; города — где основать новые колонии; простые люди — о браке, болезнях и деньгах.

    Обряды были сложными. Сначала посетители очищались водой из священного источника и приносили дары — козу, медовую лепёшку или, если были богаты, золото и серебро. Храм вёл подробную опись полученных сокровищ. В дни прорицаний Пифия восседала на высоком треножнике над расщелиной в скале в самом сокровенном помещении храма. Древние авторы описывают, как она вдыхала сладковатые испарения, впадала в транс и давала ответы, которые затем толковали жрецы.

    Её ответы славились своей двусмысленностью. Когда лидийский царь Крёз спросил, стоит ли ему нападать на Персию, оракул ответил, что, если он это сделает, «падёт великое царство». Крёз напал — и пало его собственное царство.

    Веками современные учёные сомневались в рассказах об испарениях. Прежние раскопки не обнаружили под храмом никакой расщелины. Однако группа геологов в 1990-х годах обнаружила два разлома, пересекающихся прямо под этим местом. Они нашли свидетельства того, что из скалы когда-то могли подниматься сладковато пахнущие газы, например этилен. В малых дозах они вызывают приятное состояние, похожее на транс. Возможно, видения Пифии объяснялись не сверхъестественной силой, а природой.

    Самая знаменитая надпись храма была проста: «Познай самого себя». Она призывала искать мудрость внутри себя, а не получать ответы извне. Спустя более двух тысяч лет этот совет столь же актуален. Сегодня Дельфы — объект Всемирного наследия, и посетители со всего света по-прежнему поднимаются на холм, чтобы увидеть место, где, по преданию, говорил Аполлон.
  questions:
  - q: Who was the Pythia?
    options:
    - A Greek king
    - A priestess believed to speak for Apollo
    - A goddess
    - A geologist
    answer: 1
  - q: What happened to King Croesus?
    options:
    - He conquered Persia
    - His own empire fell
    - He became a priest
    - He ignored the oracle
    answer: 1
  - q: What did geologists discover in the 1990s?
    options:
    - Gold under the temple
    - Faults that may have released sweet-smelling gases
    - A hidden room
    - Apollo's statue
    answer: 1
  - tf: The oracle's answers were always clear and simple.
    answer: false
  - tf: '''Know thyself'' was a famous inscription at the temple.'
    answer: true
