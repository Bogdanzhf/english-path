title: Actions and movement
title_ru: Действия и движение
topic: actions
words:
- accrue | v | əˈkruː |  | накапливаться, начисляться | to increase over time | Interest *accrues* monthly. | Проценты начисляются ежемесячно.
- automate | v | ˈɔːtəmeɪt |  | автоматизировать | to make a process work by machines instead of people | The factory has *automated* most of its production. | Завод автоматизировал большую часть производства.
- cordon | v | ˈkɔːdn | ˈkɔːrdn | оцеплять | to surround to stop people entering | Police *cordoned* off the area. | Полиция оцепила район.
- curate | v | ˈkjʊrət |  | курировать; отбирать | to organise an exhibition; to choose content | She *curated* the exhibition. | Она была куратором выставки.
- dampen | v | ˈdæmpən |  | смачивать; ослаблять | to make wet; to reduce | The rain didn't *dampen* our spirits. | Дождь не испортил нам настроение.
- demystify | v | deˈmɪstɪfaɪ | diːˈmɪstəfaɪ | развеивать тайну, объяснять | to make easier to understand | The book *demystifies* science. | Книга делает науку понятной.
- detract | v | dɪˈtrækt |  | умалять, портить | to make something seem less good | The noise *detracted* from our enjoyment. | Шум портил нам удовольствие.
- disperse | v | dɪˈspɜːs | dɪˈspɜːrs | рассеивать(ся), расходиться | to spread out over a wide area | The crowd *dispersed* after the concert. | После концерта толпа разошлась.
- hamper | v | ˈhæmpə | ˈhæmpər | мешать, затруднять | to slow down progress | Bad weather *hampered* the search. | Плохая погода мешала поискам.
- 'hitch | v | hɪtʃ |  | цеплять; ехать автостопом | to fasten; to travel by getting free rides | We *hitched* a ride to town. | Мы поймали попутку до города. | сущ.: hitch — заминка'
- materialise | v | məˈtiərɪəlaɪz | mətˈiərɪəlaɪz | осуществляться, появляться | to happen or appear | The promised help never *materialised*. | Обещанная помощь так и не появилась. | амер. materialize
- 'mesh | v | meʃ |  | сочетаться | to fit together well | Our ideas *mesh* well. | Наши идеи хорошо сочетаются. | сущ.: mesh — сетка'
- pressurize | v | ˈpreʃɜːaɪz | ˈpreʃəraɪz | оказывать давление | to try to force someone | Don't *pressurize* me! | Не дави на меня! | брит. также pressurise
- proliferate | v | prəˈlɪfəreɪt | proʊˈlɪfəreɪt | быстро распространяться | to increase quickly in number | Fake news *proliferates* online. | Фейки быстро множатся в сети.
- prolong | v | prəˈlɒŋ | prəˈlɔːŋ | продлевать | to make something last longer | The voyage was *prolonged* by bad weather. | Плавание затянулось из-за плохой погоды.
- reconcile | v | ˈrekənsaɪl |  | примирять(ся) | to become friends again after an argument | After years of silence, father and son were *reconciled*. | После лет молчания отец и сын помирились.
- skew | v | skjuː |  | искажать | to make inaccurate | One result *skewed* the data. | Один результат исказил данные.
- temper | v | ˈtempə | ˈtempər | смягчать, умерять | to make less strong | He *tempered* his criticism with praise. | Он смягчил критику похвалой.
- wallow | v | ˈwɒləʊ | ˈwɑːloʊ | погрязнуть, упиваться | to enjoy a bad feeling too much | Stop *wallowing* in self-pity. | Хватит себя жалеть.
- wane | v | weɪn |  | ослабевать, убывать | to become weaker | His popularity has *waned*. | Его популярность упала.
