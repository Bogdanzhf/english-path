title: Actions and movement
title_ru: Действия и движение
topic: actions
words:
- accrue | v | əˈkruː |  | накапливаться, начисляться | to increase over time | Interest *accrues* monthly. | Проценты начисляются ежемесячно.
- automate | v | ˈɔːtəmeɪt |  | автоматизировать | to make a process work by machines instead of people | The factory has *automated* most of its production. | Завод автоматизировал большую часть производства.
- cordon | v | ˈkɔːdn | ˈkɔːrdn | оцеплять | to surround to stop people entering | Police *cordoned* off the area. | Полиция оцепила район.
- curate | v | ˈkjʊrət |  | курировать; отбирать | to organise an exhibition; to choose content | She *curated* the exhibition. | Она была куратором выставки.
- dampen | v | ˈdæmpən |  | смачивать; ослаблять | to make wet; to reduce | The rain didn't *dampen* our spirits. | Дождь не испортил нам настроение.
- demystify | v | deˈmɪstɪfaɪ | diːˈmɪstəfaɪ | развеивать тайну, объяснять | to make easier to understand | The book *demystifies* science. | Книга делает науку понятной.
- detract | v | dɪˈtrækt |  | умалять, портить | to make something seem less good | The noise *detracted* from our enjoyment. | Шум портил нам удовольствие.
- disperse | v | dɪˈspɜːs | dɪˈspɜːrs | рассеивать(ся), расходиться | to spread out over a wide area | The crowd *dispersed* after the concert. | После концерта толпа разошлась.
- hamper | v | ˈhæmpə | ˈhæmpər | мешать, затруднять | to slow down progress | Bad weather *hampered* the search. | Плохая погода мешала поискам.
- 'hitch | v | hɪtʃ |  | цеплять; ехать автостопом | to fasten; to travel by getting free rides | We *hitched* a ride to town. | Мы поймали попутку до города. | сущ.: hitch — заминка'
- materialise | v | məˈtiərɪəlaɪz | mətˈiərɪəlaɪz | осуществляться, появляться | to happen or appear | The promised help never *materialised*. | Обещанная помощь так и не появилась. | амер. materialize
- 'mesh | v | meʃ |  | сочетаться | to fit together well | Our ideas *mesh* well. | Наши идеи хорошо сочетаются. | сущ.: mesh — сетка'
- pressurize | v | ˈpreʃɜːaɪz | ˈpreʃəraɪz | оказывать давление | to try to force someone | Don't *pressurize* me! | Не дави на меня! | брит. также pressurise
- proliferate | v | prəˈlɪfəreɪt | proʊˈlɪfəreɪt | быстро распространяться | to increase quickly in number | Fake news *proliferates* online. | Фейки быстро множатся в сети.
- prolong | v | prəˈlɒŋ | prəˈlɔːŋ | продлевать | to make something last longer | The voyage was *prolonged* by bad weather. | Плавание затянулось из-за плохой погоды.
- reconcile | v | ˈrekənsaɪl |  | примирять(ся) | to become friends again after an argument | After years of silence, father and son were *reconciled*. | После лет молчания отец и сын помирились.
- skew | v | skjuː |  | искажать | to make inaccurate | One result *skewed* the data. | Один результат исказил данные.
- temper | v | ˈtempə | ˈtempər | смягчать, умерять | to make less strong | He *tempered* his criticism with praise. | Он смягчил критику похвалой.
- wallow | v | ˈwɒləʊ | ˈwɑːloʊ | погрязнуть, упиваться | to enjoy a bad feeling too much | Stop *wallowing* in self-pity. | Хватит себя жалеть.
- wane | v | weɪn |  | ослабевать, убывать | to become weaker | His popularity has *waned*. | Его популярность упала.
reading:
  title: The Water Bear
  title_ru: Водяной медведь
  text: |
    If you could look through a microscope at a piece of wet moss, you might see a bizarre creature slowly walking on eight stubby legs. It looks a little like a chubby bear with a tiny face. Scientists call it a tardigrade; most people call it a water bear. It is less than a millimetre long, and it may be the toughest animal on Earth.

    Tardigrades are aquatic animals, but they live almost everywhere in the biosphere: in mountains and deep oceans, in tropical forests and temperate gardens, even in the ice of Antarctica. Over 1,000 species have been identified. Most feed on plants or bacteria, which they digest using a special mouthpart, and some are parasites.

    What makes them remarkable is their extraordinary tolerance to extreme conditions. When their environment dries out, they undergo a dramatic transformation. They pull in their legs, curl into a dry ball called a "tun", and slow their metabolism to almost nothing. In this state, they can survive for years. Laboratory experiments have shown that tardigrades can withstand temperatures from almost −272 degrees Celsius to around 150 degrees, pressures six times greater than in the deepest ocean, and doses of radiation hundreds of times higher than would kill a human.

    Their most famous feat came in 2007, when scientists sent tardigrades into space on a satellite. They were exposed to the vacuum and radiation of space for ten days. After returning to Earth, many of them were rehydrated, woke up and even produced healthy young, showing that their reproductive systems had survived.

    How do they do it? Prominent researchers have found that tardigrades produce special proteins that protect the DNA in each cell's nucleus. Studying these proteins could help scientists preserve vaccines without refrigeration or protect astronauts on long journeys. Tardigrades are not indestructible — they are vulnerable when active and can be killed by long-term heat — but their resilience seems almost infinite. Some scientists believe they will be among the last survivors on Earth.
  ru: |
    Если бы вы посмотрели в микроскоп на кусочек влажного мха, вы могли бы увидеть причудливое существо, медленно шагающее на восьми коротких лапках. Оно немного похоже на пухлого медведя с крошечной мордочкой. Учёные называют его тихоходкой, а в народе — водяным медведем. Его длина меньше миллиметра, и, возможно, это самое выносливое животное на Земле.

    Тихоходки — водные животные, но живут они почти повсюду в биосфере: в горах и океанских глубинах, в тропических лесах и садах умеренного пояса, даже во льдах Антарктиды. Описано более 1000 видов. Большинство питается растениями или бактериями, которые переваривает с помощью особого ротового аппарата, а некоторые — паразиты.

    Удивительными их делает невероятная устойчивость к экстремальным условиям. Когда среда пересыхает, они претерпевают резкое превращение. Они втягивают лапки, сворачиваются в сухой комочек — так называемую «бочонковую форму» — и замедляют обмен веществ почти до нуля. В таком состоянии они могут жить годами. Лабораторные эксперименты показали, что тихоходки выдерживают температуру от почти −272 до примерно 150 градусов Цельсия, давление в шесть раз выше, чем в самой глубокой точке океана, и дозы радиации в сотни раз выше смертельных для человека.

    Их самый знаменитый подвиг случился в 2007 году, когда учёные отправили тихоходок в космос на спутнике. Десять дней они находились в вакууме и под космическим излучением. Вернувшись на Землю, многие из них после увлажнения ожили и даже дали здоровое потомство — значит, их репродуктивная система тоже уцелела.

    Как им это удаётся? Видные исследователи обнаружили, что тихоходки вырабатывают особые белки, защищающие ДНК в ядре каждой клетки. Изучение этих белков может помочь учёным хранить вакцины без холодильников или защищать астронавтов в долгих полётах. Тихоходки не неуязвимы: в активном состоянии они уязвимы, и их может убить длительная жара, — но их живучесть кажется почти бесконечной. Некоторые учёные считают, что они будут среди последних выживших на Земле.
  questions:
  - q: What do tardigrades do when their environment dries out?
    options:
    - They die immediately
    - They curl into a dry ball and slow their metabolism
    - They swim away
    - They find new water
    answer: 1
  - q: What happened to tardigrades sent into space in 2007?
    options:
    - They all died
    - Many survived and even had healthy young
    - They grew larger
    - They were lost
    answer: 1
  - q: How might studying tardigrade proteins help humans?
    options:
    - To make food tastier
    - To preserve vaccines without refrigeration
    - To build spaceships
    - To cure parasites
    answer: 1
  - tf: Tardigrades only live in Antarctica.
    answer: false
  - tf: Tardigrades are vulnerable when they are active.
    answer: true
