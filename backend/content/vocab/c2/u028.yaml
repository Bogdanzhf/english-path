title: Events and situations
title_ru: События и ситуации
topic: events
words:
- affectation | n | əfɪkˈteɪʃən | ˌæfekˈteɪʃən | жеманство, притворство | unnatural behaviour to impress | His accent is an *affectation*. | Его акцент — чистое позёрство.
- artifice | n | ˈɑːtɪfɪs | ˈɑːrtəfɪs | хитрость, уловка | clever tricks | She used every *artifice* to win. | Она пустила в ход все уловки, чтобы выиграть.
- brouhaha | n | braʊˈhɑːhə | ˈbruːhɑːhɑː | шумиха | a noisy fuss | There was a *brouhaha* over the decision. | Решение вызвало шумиху.
- calamity | n | kəˈlæmɪti | kəˈlæməti | бедствие | a disaster | The flood was a *calamity*. | Наводнение стало бедствием.
- circa | prep | ˈsɜːkə | ˈsɜːrkə | около, приблизительно (о датах) | approximately | The house was built *circa* 1850. | Дом построен около 1850 года. | сокр. c.
- din | n | dɪn |  | грохот, шум | a loud, unpleasant, continuous noise | I couldn't sleep because of the *din* from the street. | Я не мог уснуть из-за шума с улицы.
- dispersal | n | dɪˈspɜːsl | dɪˈspɜːrsl | рассеивание, разгон | spreading or sending away | Police ordered the *dispersal* of the crowd. | Полиция приказала разогнать толпу.
- drudgery | n | ˈdrʌdʒri | ˈdrʌdʒəri | тяжёлая монотонная работа | hard boring work | Housework can be *drudgery*. | Работа по дому может быть каторгой.
- enabler | n | eˈneɪblə | eˈneɪbələr | пособник; фактор, создающий возможности | someone or something that makes something possible | Technology is an *enabler* of change. | Технологии создают возможности для перемен.
- fluctuation | n | ˌflʌktʃuːˈeɪʃən |  | колебание | an irregular change | There are *fluctuations* in temperature. | Температура колеблется.
- happenstance | n | ˈhæpənstəns | ˈhæpənstæns | случайность | chance | We met by *happenstance*. | Мы встретились случайно.
- hazard | v | ˈhæzəd | ˈhæzərd | рискнуть (предположить) | to suggest a guess | I'd *hazard* a guess that he's forty. | Рискну предположить, что ему сорок.
- maelstrom | n | ˈmeɪlstrɒm | ˈmeɪlstrəm | водоворот | a violent situation | They were caught in a *maelstrom* of events. | Их затянуло в водоворот событий.
- promenade | n | ˌprɒməˈnɑːd | ˌprɑːməˈneɪd | набережная, променад | a path along the sea | We walked along the *promenade*. | Мы гуляли по набережной.
- provocation | n | prɒvəˈkeɪʃən | ˌprɑːvəˈkeɪʃən | провокация | an action to make someone angry | He reacted without *provocation*. | Он отреагировал без всякого повода.
- reconciliation | n | ˌrekənˌsɪlɪˈeɪʃən | ˌrekənˌsɪliːˈeɪʃən | примирение | becoming friends again | There's hope for *reconciliation*. | Есть надежда на примирение.
- vindication | n | ˌvɪndɪˈkeɪʃən | vɪndəˈkeɪʃən | оправдание, подтверждение правоты | proof that you were right | The result was a *vindication* of our approach. | Результат подтвердил правильность нашего подхода.
