title: Law and crime
title_ru: Закон и преступность
topic: law
words:
- clemency | n | ˈklemənsi |  | помилование, снисхождение | mercy in punishment | He asked for *clemency*. | Он просил о помиловании.
- contractual | adj | kənˈtræktʃuːəl |  | договорный | relating to a contract | It's a *contractual* obligation. | Это договорное обязательство.
- counsel | n | ˈkaʊnsl |  | совет; адвокат | advice; a lawyer in court | Seek legal *counsel*. | Обратитесь за юридической консультацией.
- deterrent | n | dɪˈtɜːrənt | dɪˈtɜːrrənt | сдерживающее средство | something that discourages | Prison is a *deterrent* to crime. | Тюрьма сдерживает преступность.
- exonerate | v | ɪɡˈzɒnəreɪt | ɪɡˈzɑːnəreɪt | снимать обвинение, реабилитировать | to show someone is not guilty | DNA evidence *exonerated* him. | Анализ ДНК доказал его невиновность.
- incarceration | n | ɪnˌkɑːsəˈreɪʃən | ˌɪnˌkɑːrsəˈreɪʃən | заключение в тюрьму | imprisonment | *Incarceration* rates are high. | Уровень заключения под стражу высокий.
- punitive | adj | ˈpjuːnɪtɪv | ˈpjuːnətɪv | карательный | intended as punishment | They took *punitive* measures. | Они приняли карательные меры.
- recidivism | n | rɪˈsɪdɪvɪzəm | rəˈsɪdɪvɪzəm | рецидивизм | committing crimes again | Education reduces *recidivism*. | Образование снижает рецидивизм.
