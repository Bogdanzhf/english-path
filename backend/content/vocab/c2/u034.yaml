title: Thinking and opinions
title_ru: Мысли и мнения
topic: mind
words:
- antithesis | n | ænˈtɪθəsɪs | ænˈtɪθəsəs | противоположность | the exact opposite | Love is the *antithesis* of hate. | Любовь — противоположность ненависти.
- apprehend | v | ˌæprɪˈhend |  | задерживать; постигать | to arrest; to understand | Police *apprehended* the thief. | Полиция задержала вора.
- aptitude | n | ˈæptɪtjuːd | ˈæptɪtuːd | способность, склонность | a natural ability to do something | She has an *aptitude* for languages. | У неё способности к языкам.
- archetype | n | ˈɑːkɪtaɪp | ˈɑːrkɪtaɪp | архетип, прообраз | a typical example | He's the *archetype* of a hero. | Он — архетипичный герой.
- assimilate | v | əˈsɪmɪleɪt |  | ассимилироваться, усваивать | to become part of a group and adopt its culture; to fully understand information | Immigrants often *assimilate* into the local culture. | Иммигранты часто ассимилируются в местную культуру.
- 'brood | v | bruːd |  | размышлять мрачно, хандрить | to think about something unhappy | Stop *brooding* about it. | Хватит хандрить из-за этого. | сущ.: brood — выводок'
- chronology | n | krəˈnɒlədʒi | krəˈnɑːlədʒi | хронология | the order in which events happened | The *chronology* of the artist's work was confusing. | Хронология работ художника была запутанной.
- condensation | n | kɒndɪnˈseɪʃən | ˌkɑːndənˈseɪʃən | конденсат | water drops on a cold surface | There's *condensation* on the window. | На окне конденсат.
- "confound | v | k\x01ːnfaʊnd | ˈkɑːnfaʊnd | ставить в тупик; опровергать | to confuse; to prove wrong | The results *confounded* the experts. | Результаты поставили экспертов в тупик."
- conjecture | n | kənˈdʒektʃə | kənˈdʒekʃər | догадка, предположение | a guess | That's pure *conjecture*. | Это чистые домыслы.
- crystallise | v | ˈkrɪstəlaɪz | krˈɪstɐlaɪz | кристаллизоваться; оформиться | to become clear | Her ideas *crystallised*. | Её идеи оформились. | амер. crystallize
- err | v | ɜː | ɜːr | ошибаться | to make a mistake | To *err* is human. | Человеку свойственно ошибаться.
- fallacy | n | ˈfæləsi |  | заблуждение | a false belief | It's a *fallacy* that money brings happiness. | Распространённое заблуждение, что деньги приносят счастье.
- hindrance | n | ˈhɪndrəns |  | помеха | something that makes things difficult | He's more of a *hindrance* than a help. | От него больше помех, чем помощи.
- "hypothesize | v | haɪˈp\x01ːθəsaɪz | haɪˈpɑːθəsaɪz | выдвигать гипотезу | to suggest as a possible explanation | Scientists *hypothesize* that life exists on Mars. | Учёные предполагают, что на Марсе есть жизнь. | брит. также hypothesise"
- inducement | n | ɪnˈdjuːsmənt | ˌɪnˈduːsmənt | стимул; взятка | something that persuades | They offered a cash *inducement*. | Они предложили денежное вознаграждение.
- knack | n | næk |  | сноровка, талант | a natural skill | She has a *knack* for languages. | У неё способности к языкам.
- preconception | n | ˌpriːkənˈsepʃən | priːkənˈsepʃən | предвзятое мнение | an opinion formed in advance | Forget your *preconceptions*. | Отбросьте предубеждения.
- predilection | n | ˌpriːdɪˈlekʃən | ˌpredəˈlekʃən | пристрастие | a strong liking | He has a *predilection* for spicy food. | У него пристрастие к острой еде.
- preoccupation | n | prɪˌɒkjʊˈpeɪʃən | priːˌɑːkjəˈpeɪʃən | озабоченность, поглощённость | thinking about something all the time | Her *preoccupation* with work worries me. | Меня беспокоит её зацикленность на работе.
- presuppose | v | ˌpriːsʌˈpəʊz | ˌpriːsəˈpoʊz | предполагать, подразумевать | to assume beforehand | The plan *presupposes* good weather. | План предполагает хорошую погоду.
- presupposition | n | ˌprisəpəˈzɪʃən | ˌpriːsəpəˈzɪʃən | предпосылка, допущение | something assumed | The argument rests on a false *presupposition*. | Аргумент основан на ложной предпосылке.
- substantiate | v | səbˈstænʃɪeɪt | səbˈstænʃiːeɪt | обосновывать, подтверждать | to prove with evidence | Can you *substantiate* your claim? | Можете подтвердить своё утверждение?
- virtuosity | n | ˌvɜːtjuːˈɒsɪti | vərtʃuːˈɑːsɪti | виртуозность | great skill | Her *virtuosity* on the violin is amazing. | Её виртуозная игра на скрипке поражает.
