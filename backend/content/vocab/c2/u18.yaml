reading:
  title: "The Most Underrated Health Habit"
  title_ru: "Самая недооценённая полезная привычка"
  text: |
    We spend about a third of our lives asleep — a huge chunk of time that might seem wasted. For centuries, many people saw sleep as unproductive, and in some professions, surviving on little sleep was considered almost glamorous. Today, scientists are outspoken: sleep is not a luxury but a biological necessity, intrinsic to almost every function of the body and brain.

    What happens when we don't sleep? In 1964, a seventeen-year-old American student named Randy Gardner stayed awake for eleven days as part of a school science project. As the ordeal went on, he became irritable, forgot things and began to see things that weren't there. Although he recovered after sleeping soundly for fourteen hours, scientists no longer allow such experiments, because they are now considered too dangerous.

    Research shows that sleep plays several vital roles. During deep sleep, the brain clears out waste products that build up during the day, and memories are moved into long-term storage. Hence, students who sleep after studying remember far more than those who stay up all night. Sleep also helps regulate hunger hormones; tired people tend to crave sugary snacks rather than healthy or gourmet meals.

    Unfortunately, modern life makes sleep difficult. Bright screens, the din of traffic, caffeine and stress all interfere with rest. In some countries, a culture of overwork has serious consequences: in Japan, there is even a word, "karoshi", meaning death from overwork. Health ministries now run campaigns to encourage better sleep habits.

    Some changes are simple: keep a regular bedtime, avoid screens and coffee in the evening, and keep your bedroom dark and cool. If you or your partner snores heavily, it is worth seeing a doctor, as it may indicate a breathing problem. In one particular success story, a school superintendent in the USA agreed to start lessons an hour later. Teenagers slept more, their grades improved, and car accidents involving young drivers fell. So next time someone makes a fuss about your early night, tell them you're doing something good for your brain.
  ru: |
    Около трети жизни мы проводим во сне — огромная часть времени, которая может показаться потраченной впустую. Веками многие считали сон непродуктивным, а в некоторых профессиях умение обходиться почти без сна считалось чуть ли не шиком. Сегодня учёные говорят прямо: сон — не роскошь, а биологическая необходимость, неотделимая почти от всех функций организма и мозга.

    Что происходит, когда мы не спим? В 1964 году семнадцатилетний американский школьник Рэнди Гарднер не спал одиннадцать дней в рамках школьного научного проекта. По мере того как длилось это испытание, он становился раздражительным, забывал вещи и начал видеть то, чего не было. Хотя после четырнадцати часов крепкого сна он восстановился, сегодня учёные не разрешают такие эксперименты — они считаются слишком опасными.

    Исследования показывают, что сон выполняет несколько жизненно важных функций. Во время глубокого сна мозг очищается от продуктов обмена, накопившихся за день, а воспоминания переходят в долговременную память. Поэтому студенты, которые спят после занятий, запоминают гораздо больше тех, кто не спит всю ночь. Сон также помогает регулировать гормоны голода: уставшие люди тянутся к сладким перекусам, а не к полезной или изысканной еде.

    К сожалению, современная жизнь мешает спать. Яркие экраны, шум транспорта, кофеин и стресс — всё это нарушает отдых. В некоторых странах культура переработок имеет серьёзные последствия: в Японии есть даже слово «кароси» — смерть от переутомления. Министерства здравоохранения теперь проводят кампании, призывающие к здоровому сну.

    Некоторые изменения просты: ложитесь в одно и то же время, избегайте экранов и кофе вечером, держите спальню тёмной и прохладной. Если вы или ваш партнёр сильно храпите, стоит обратиться к врачу — это может говорить о проблемах с дыханием. В одной показательной истории руководитель школьного округа в США согласился начинать уроки на час позже. Подростки стали больше спать, их оценки улучшились, а число аварий с участием молодых водителей сократилось. Так что в следующий раз, когда кто-то поднимет шум из-за того, что вы рано ложитесь, скажите, что делаете доброе дело для своего мозга.
