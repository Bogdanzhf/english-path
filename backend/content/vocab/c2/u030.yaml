title: 'Describing: same, different, true'
title_ru: 'Описание: сходство, точность, вероятность'
topic: describing
words:
- analogous | adj | əˈnæləɡəs |  | аналогичный, сходный | similar in some way | Crossing the outback was *analogous* to a voyage into space. | Пересечь глубинку было сродни полёту в космос.
- antithetical | adj | ˌæntɪˈθetɪkl | ˌæntəˈθetɪkl | противоположный | directly opposite | Violence is *antithetical* to our values. | Насилие противоречит нашим ценностям.
- arcane | adj | ɑːˈkeɪn | ˌɑːrˈkeɪn | тайный, непонятный | known by very few | The rules are *arcane*. | Правила понятны только посвящённым.
- axiomatic | adj | ˌæksɪəˈmætɪk | ˌæksiəˈmætɪk | самоочевидный | obviously true | It's *axiomatic* that health matters. | Само собой разумеется, что здоровье важно.
- bona fide | adj | ˈbəʊnə faɪd | ˈboʊnə faɪd | подлинный, добросовестный | genuine | She's a *bona fide* expert. | Она настоящий эксперт.
- cogent | adj | ˈkəʊdʒənt | ˈkoʊdʒənt | убедительный | clear and convincing | He made a *cogent* argument. | Он привёл убедительный довод.
- commensurate | adj | kəˈmensərət |  | соразмерный | matching in size or degree | Pay will be *commensurate* with experience. | Оплата будет соответствовать опыту.
- contextual | adj | kənˈtekstʃuːəl | ˌkɑːnˈtekstʃuːəl | контекстуальный | relating to context | We need more *contextual* information. | Нужно больше сведений о контексте.
- 'diffuse | v | dɪfˈjus | dɪfˈjuːs | рассеивать, распространять | to spread over a wide area | The curtains *diffuse* the sunlight. | Шторы рассеивают солнечный свет. | прил.: diffuse [dɪˈfjuːs] — рассеянный; не путать с defuse — разрядить (обстановку)'
- incongruous | adj | ɪnˈkɒnɡruːəs | ˌɪŋˈkɔːŋruːəs | неуместный, несообразный | strange in a situation | The modern building looks *incongruous* here. | Современное здание здесь выглядит чужеродно.
- inexorable | adj | ɪˈneksərəbl | ˌɪˈneksərəbl | неумолимый | impossible to stop | The *inexorable* rise of prices continues. | Неумолимый рост цен продолжается.
- infallible | adj | ɪnˈfæləbl | ˌɪnˈfæləbl | непогрешимый, безошибочный | never wrong | Nobody is *infallible*. | Никто не безгрешен.
- inscrutable | adj | ɪnˈskruːtəbl | ˌɪnsˈkruːtəbl | непостижимый, загадочный | impossible to understand | He has an *inscrutable* face. | У него непроницаемое лицо.
- irrevocable | adj | ɪrɪˈvɒkəbl | ˌɪˈrevəkəbl | бесповоротный | impossible to change | The decision is *irrevocable*. | Решение окончательное.
- paradoxical | adj | ˌpærəˈdɒksɪkl | ˌperəˈdɑːksɪkl | парадоксальный | seeming contradictory | It's *paradoxical* that more choice makes us less happy. | Парадоксально, но больший выбор делает нас менее счастливыми.
- spurious | adj | ˈspjʊrɪəs | ˈspɜːriəs | ложный, надуманный | false | The claim is *spurious*. | Утверждение ложное.
- tacit | adj | ˈtæsɪt |  | молчаливый, подразумеваемый | understood without being said | There was *tacit* agreement. | Было молчаливое согласие.
- tantamount | adj | ˈtɑːntəmaʊnt | ˈtæntəmaʊnt | равносильный | equal to | It's *tantamount* to theft. | Это равносильно краже.
- unequivocal | adj | ʌnɪˈkwɪvəkl | ˌʌniːˈkwɪvəkl | недвусмысленный | completely clear | The answer was an *unequivocal* no. | Ответом было однозначное «нет».
- verbatim | adv | vɜːˈbeɪtɪm | vərˈbeɪtəm | дословно | word for word | He repeated it *verbatim*. | Он повторил это слово в слово.
