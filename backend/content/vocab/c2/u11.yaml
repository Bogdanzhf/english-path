      options: ["They were cheap", "To work quickly, because graffiti is illegal", "His teacher told him to", "To make copies"]
      answer: 1
    - q: "What did Banksy do in one court case?"
      options: ["He revealed his name", "He chose to lose rather than reveal his name", "He sent a lawyer with a mask", "He won easily"]
      answer: 1
    - tf: "Banksy's identity has been officially confirmed."
      answer: false
