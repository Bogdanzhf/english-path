reading:
  title: "The Invisible Artist"
  title_ru: "Невидимый художник"
  text: |
    In October 2018, a painting by the street artist Banksy was sold at a London auction for over one million pounds. Seconds after the hammer fell, an alarm sounded, and the canvas began to slide down through its frame, where a hidden shredder cut it into strips. The audience gasped. The stunt made headlines around the world — and, ironically, increased the value of the half-destroyed work. It was renamed "Love is in the Bin".

    Banksy is one of the most famous artists in the world, yet nobody knows for certain who he is. He began painting graffiti in Bristol, England, in the 1990s. Because graffiti is illegal, he worked at night, using stencils so he could finish quickly — a discipline that became his trademark style. His work often appears suddenly on walls in cities around the world, from London to New York to the West Bank.

    His themes are political and often humorous: children releasing balloons, police officers kissing, rats carrying signs, soldiers having a pillow fight. He mocks war, consumerism and the art world itself. Many of his works have been a stimulus for public debate about issues like immigration, surveillance and chronic poverty.

    Over the years, there has been endless gossip and speculation about his identity. Journalists have used geographical data to implicate particular people, but no theory has been officially confirmed. Banksy communicates through a spokesperson and a website, and his team includes a company that verifies which works are genuine. In one court case, he chose to lose a legal battle rather than reveal his name to the judges and attorneys.

    Not everyone is a fan. Some fellow artists accuse him of selling out, and some councils have painted over his work. Yet other cities now act as guardians of his pieces, protecting them behind glass. Some works have been removed from walls and sold, and Banksy has donated money from his art to charities and refugee rescue ships. In an age when everyone shares everything online, perhaps his greatest artwork is his anonymity.
  ru: |
    В октябре 2018 года картина уличного художника Бэнкси была продана на лондонском аукционе более чем за миллион фунтов. Через несколько секунд после удара молотка раздался сигнал, и холст начал сползать вниз через раму, где спрятанный шредер разрезал его на полоски. Зал ахнул. Выходка попала в заголовки по всему миру и, по иронии, увеличила стоимость наполовину уничтоженной работы. Её переименовали в «Любовь в мусорном ведре».

    Бэнкси — один из самых известных художников в мире, но никто не знает наверняка, кто он. Он начал рисовать граффити в Бристоле (Англия) в 1990-х. Поскольку граффити незаконны, он работал по ночам и использовал трафареты, чтобы управляться быстро, — эта дисциплина стала его фирменным стилем. Его работы нередко внезапно появляются на стенах в городах по всему миру — от Лондона и Нью-Йорка до Западного берега реки Иордан.

    Его темы политические и часто остроумные: дети, отпускающие воздушные шары, целующиеся полицейские, крысы с плакатами, солдаты, дерущиеся подушками. Он высмеивает войну, общество потребления и сам мир искусства. Многие его работы стали толчком к общественному обсуждению таких проблем, как иммиграция, слежка и хроническая бедность.

    За эти годы о его личности ходило бесконечно много слухов и догадок. Журналисты использовали географические данные, чтобы указать на конкретных людей, но ни одна версия не была официально подтверждена. Бэнкси общается через представителя и сайт, а в его команду входит компания, проверяющая, какие работы подлинные. В одном судебном деле он предпочёл проиграть процесс, лишь бы не раскрывать своё имя судьям и адвокатам.

    Нравится он не всем. Некоторые коллеги-художники обвиняют его в продажности, а некоторые городские советы закрашивают его работы. Другие же города теперь берегут его произведения, защищая их стеклом. Некоторые работы сняли со стен и продали, а Бэнкси жертвовал деньги от своего искусства на благотворительность и спасательные суда для беженцев. В эпоху, когда каждый выкладывает всё в сеть, возможно, его величайшее произведение — его анонимность.
