title: 'Describing: size, shape and looks'
title_ru: 'Описание: размер, форма, внешний вид'
topic: describing
words:
- concentric | adj | kənˈsentrɪk |  | концентрический | (of circles) having the same centre | The cake was decorated with *concentric* circles of fruit. | Торт был украшен концентрическими кругами из фруктов.
- earthen | adj | ˈɜːθn | ˈɜːrθn | глиняный, земляной | made of clay or earth | Water was kept in large *earthen* pots. | Воду хранили в больших глиняных сосудах.
- spatial | adj | ˈspeɪʃl |  | пространственный | connected with space and the position of things | Architects need good *spatial* awareness. | Архитекторам нужно хорошее пространственное мышление.
