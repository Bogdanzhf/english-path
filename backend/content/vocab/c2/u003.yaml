title: 'Describing: size, shape and looks'
title_ru: 'Описание: размер, форма, внешний вид'
topic: describing
words:
- agile | adj | ˈædʒaɪl | ˈædʒl | ловкий, гибкий | able to move quickly | Cats are very *agile*. | Кошки очень ловкие.
- amorphous | adj | əˈmɔːfəs | əˈmɔːrfəs | аморфный, бесформенный | without a clear shape | It's an *amorphous* mass. | Это бесформенная масса.
- angular | adj | ˈænɡjʊlə | ˈæŋɡjələr | угловатый | with sharp angles | He has an *angular* face. | У него угловатое лицо.
- baroque | adj | bəˈrəʊk | bəˈroʊk | барочный; вычурный | in the style of the 17th century; very decorated | We visited a *baroque* church. | Мы осмотрели церковь в стиле барокко.
- capacious | adj | kəˈpeɪʃəs |  | вместительный | having a lot of space | She carried a *capacious* bag. | У неё была вместительная сумка.
- concentric | adj | kənˈsentrɪk |  | концентрический | (of circles) having the same centre | The cake was decorated with *concentric* circles of fruit. | Торт был украшен концентрическими кругами из фруктов.
- crippling | adj | ˈkrɪplɪŋ | ˈkrɪpəlɪŋ | разрушительный, непосильный | causing serious damage | They have *crippling* debts. | У них непосильные долги.
- daunting | adj | ˈdɔːntɪŋ |  | пугающий, обескураживающий | making you nervous about whether you can do it | It's a *daunting* task. | Это пугающая задача.
- earthen | adj | ˈɜːθn | ˈɜːrθn | глиняный, земляной | made of clay or earth | Water was kept in large *earthen* pots. | Воду хранили в больших глиняных сосудах.
- glitzy | adj | ˈɡlɪtsi |  | броский, гламурный | attractive in a showy way | It was a *glitzy* party. | Это была гламурная вечеринка.
- mold | v | məʊld | moʊld | лепить, формировать (амер.) | to shape | Parents *mold* their children's character. | Родители формируют характер детей. | брит. mould
- opacity | n | ɒˈpæsɪti | oʊˈpæsəti | непрозрачность; неясность | being hard to see through or understand | The *opacity* of the rules confuses people. | Непрозрачность правил сбивает людей с толку.
- opaque | adj | əʊˈpeɪk | oʊˈpeɪk | непрозрачный; неясный | not clear | The glass is *opaque*. | Стекло непрозрачное.
- ornate | adj | ɔːˈneɪt | ɔːrˈneɪt | богато украшенный, витиеватый | highly decorated | The palace has an *ornate* ceiling. | Во дворце богато украшенный потолок.
- palatable | adj | ˈpælətəbl |  | приемлемый; вкусный | acceptable; pleasant to eat | The plan was made more *palatable* to voters. | План сделали более приемлемым для избирателей.
- rickety | adj | ˈrɪkɪti | ˈrɪkəti | шаткий, ветхий | likely to break | Don't sit on that *rickety* chair. | Не садись на этот шаткий стул.
- 'scroll | n | skrəʊl | skroʊl | свиток | a roll of paper with writing | The ancient *scroll* was found in a cave. | Древний свиток нашли в пещере. | гл.: scroll — прокручивать'
- seismic | adj | ˈsaɪzmɪk |  | сейсмический; колоссальный | relating to earthquakes; huge | It was a *seismic* shift in politics. | Это был тектонический сдвиг в политике.
- spatial | adj | ˈspeɪʃl |  | пространственный | connected with space and the position of things | Architects need good *spatial* awareness. | Архитекторам нужно хорошее пространственное мышление.
- torrential | adj | təˈrenʃl | tɔːˈrenʃl | проливной | very heavy (about rain) | There was *torrential* rain. | Шёл проливной дождь.
- uncanny | adj | ʌnˈkæni | ənˈkæni | сверхъестественный, жуткий | strange and hard to explain | There's an *uncanny* resemblance. | Сходство просто поразительное.
