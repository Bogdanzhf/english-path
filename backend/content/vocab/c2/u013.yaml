title: Character and personality
title_ru: Характер и личность
topic: feelings
words:
- adept | adj | əˈdept |  | искусный, умелый | very skilled | She's *adept* at solving problems. | Она мастерски решает проблемы.
- austere | adj | ɔːˈstiə | ɔːˈstɪr | строгий, аскетичный | very simple; strict | The room was *austere*. | Комната была аскетичной.
- callous | adj | ˈkæləs |  | бессердечный, чёрствый | not caring about others | It was a *callous* remark. | Это было бессердечное замечание.
- conciliatory | adj | kənˈsɪlɪətəri | kənˈsɪliətɔːri | примирительный | intended to make peace | He made a *conciliatory* gesture. | Он сделал примирительный жест.
- confrontational | adj | kɒnfrənˈteɪʃənl | ˌkɑːnfrənˈteɪʃənl | конфронтационный, вызывающий | likely to cause arguments | His style is very *confrontational*. | Его манера очень вызывающая.
- deviant | adj | ˈdiːviənt |  | отклоняющийся от нормы | not normal or acceptable | They study *deviant* behaviour. | Они изучают девиантное поведение.
- erudite | adj | ˈeruːdaɪt | ˈerədaɪt | эрудированный | very knowledgeable | He's an *erudite* scholar. | Он эрудированный учёный.
- idiosyncratic | adj | ˌɪdɪˌɒsɪŋˈkrætɪk | ˌɪdiːoʊˌsɪnˈkrætɪk | своеобразный, особенный | unusual and individual | He has an *idiosyncratic* style. | У него своеобразный стиль.
- insular | adj | ˈɪnsjʊlə | ˈɪnsələr | замкнутый, ограниченный | not interested in other cultures | The village is very *insular*. | Деревня очень замкнутая.
- patronizing | adj | ˈpeɪtrənaɪzɪŋ |  | снисходительный, покровительственный | treating someone as less intelligent | Don't be so *patronizing*! | Не говори со мной так снисходительно! | брит. также patronising
- perverse | adj | pəˈvɜːs | pərˈvɜːrs | извращённый, упрямо неразумный | deliberately unreasonable | He takes a *perverse* pleasure in annoying people. | Ему доставляет странное удовольствие раздражать людей.
- precocious | adj | prɪˈkəʊʃəs | priːˈkoʊʃəs | не по годам развитый | developed earlier than usual | She was a *precocious* child. | Она была не по годам развитым ребёнком.
- reclusive | adj | rɪˈkluːsɪv | riːˈkluːsɪv | замкнутый, уединённый | avoiding people | The *reclusive* writer never gives interviews. | Писатель-затворник никогда не даёт интервью.
- solitary | adj | ˈsɒlətri | ˈsɑːləteri | одинокий, уединённый | alone; the only one | A *solitary* tree stood on the hill. | На холме стояло одинокое дерево.
- tenacious | adj | teˈneɪʃəs | təˈneɪʃəs | упорный, цепкий | not giving up | She's a *tenacious* fighter. | Она упорный боец.
- utilitarian | adj | ˌjuːtɪlɪˈteəriən | juːˌtɪləˈteriən | утилитарный, практичный | practical rather than attractive | The furniture is *utilitarian*. | Мебель сугубо практичная.
- venomous | adj | ˈvenəməs |  | ядовитый; злобный | containing venom; full of hate | It's a *venomous* snake. | Это ядовитая змея.
- wayward | adj | ˈweɪwəd | ˈweɪwərd | своенравный, непослушный | difficult to control | He was a *wayward* teenager. | Он был своенравным подростком.
