title: Feelings and states
title_ru: Чувства и состояния
topic: feelings
words:
- afflicted | adj | əˈflɪktɪd |  | страдающий (от болезни, проблемы) | suffering from an illness or problem | Millions of people are *afflicted* by a fear of flying. | Миллионы людей страдают от страха полётов.
- aghast | adj | əˈɡɑːst | əˈɡæst | в ужасе, ошеломлённый | shocked | She stared at him *aghast*. | Она смотрела на него в ужасе.
- attuned | adj | əˈtjuːnd | əˈtuːnd | настроенный, восприимчивый | understanding and sensitive to | She's *attuned* to her children's needs. | Она чутко понимает потребности детей.
- belligerence | n | bɪˈlɪdʒrəns | bəˈlɪdʒərəns | воинственность | aggressive behaviour | His *belligerence* scared people. | Его воинственность пугала людей.
- bereft | adj | bɪˈreft | bəˈreft | лишённый; опустошённый | lacking something; very sad | She was *bereft* after his death. | После его смерти она была безутешна.
- camaraderie | n | ˌkæməˈrɑːdəri | ˌkɑːməˈrɑːdəri | товарищество | friendship and trust in a group | There's great *camaraderie* in the team. | В команде царит дух товарищества.
- consternation | n | kɒnstəˈneɪʃən | ˌkɑːnstərˈneɪʃən | смятение, ужас | worry and shock | The news caused *consternation*. | Новость вызвала смятение.
- depressive | adj | dɪˈpresɪv |  | депрессивный | relating to depression | He suffers from *depressive* illness. | Он страдает депрессией.
- devoid | adj | dɪˈvɔɪd |  | лишённый | completely without something | The island was almost *devoid* of trees. | Остров был почти лишён деревьев. | devoid of
- elated | adj | ɪˈleɪtɪd | ɪˈleɪtəd | ликующий | very happy | We were *elated* by the news. | Мы ликовали от этой новости.
- flagging | adj | ˈflæɡɪŋ |  | ослабевающий | becoming weaker | Coffee revived my *flagging* energy. | Кофе взбодрил меня, когда силы были на исходе.
- forlorn | adj | ˈfɔːlɔːn | fərˈlɔːrn | заброшенный, несчастный | lonely and sad | The house looked *forlorn*. | Дом выглядел заброшенным.
- incredulous | adj | ɪnˈkredjələs | ɪnˈkredʒələs | недоверчивый | unable to believe something | She gave him an *incredulous* look. | Она недоверчиво посмотрела на него.
- malicious | adj | məˈlɪʃəs |  | злонамеренный | intending harm | It was a *malicious* rumour. | Это был злонамеренный слух.
- qualm | n | kwɑːm |  | сомнение, угрызение совести | a feeling of doubt | He had no *qualms* about lying. | Он врал без зазрения совести.
- revulsion | n | rɪˈvʌlʃən | riːˈvʌlʃən | отвращение | a strong feeling of disgust | I felt *revulsion* at the sight. | Это зрелище вызвало у меня отвращение.
- tedium | n | ˈtiːdiəm |  | скука | boredom | The *tedium* of the job wore me down. | Скука на работе меня вымотала.
reading:
  title: Jane Goodall and the Chimpanzees
  title_ru: Джейн Гудолл и шимпанзе
  text: |
    In 1960, a 26-year-old Englishwoman named Jane Goodall arrived at Gombe Stream, a forest reserve in Tanzania. She had no university degree, and many scientists were arrogant about her lack of training. There was also a strong bias against women in the field. But the famous anthropologist Louis Leakey believed that her patience and open mind made her the perfect person to study wild chimpanzees.

    At first, the chimps ran away whenever she approached. Day after day, Goodall climbed the steep trails above the creek, sat quietly and watched from a distance. Despite fatigue, heat and illness, she persisted. Slowly, the animals got used to her.

    A few months later, she made a discovery that shocked the scientific world. She saw a chimpanzee she had named David Greybeard pick up a twig, remove its leaves and push it into a termite mound. When he pulled it out, it was covered with termites, which he ate. He was making and using a tool. At the time, tool-making was perceived as the thing that separated humans from all other animals. When Leakey heard the news, he famously replied: "Now we must redefine tool, redefine man, or accept chimpanzees as humans."

    Goodall's methods were unusual. Instead of giving the chimps numbers, she gave them names, thereby treating them as individuals with personalities. Critics said this was unscientific. However, her detailed observations revealed that chimpanzees hug, kiss, comfort each other and form strong family bonds. She also observed darker behaviour, including nasty fights and even wars between groups. These findings challenged the stereotype of chimps as simple, primitive animals.

    Goodall went on to earn a PhD and became one of the most famous scientists in the world. Later, she dedicated her life to protecting chimpanzees and campaigning for animal welfare. Her work showed that the boundary between humans and other primates is far less clear than we once believed.
  ru: |
    В 1960 году 26-летняя англичанка Джейн Гудолл прибыла в Гомбе-Стрим — лесной заповедник в Танзании. У неё не было высшего образования, и многие учёные высокомерно относились к её неподготовленности. Кроме того, в этой области существовала сильная предвзятость по отношению к женщинам. Но знаменитый антрополог Луис Лики считал, что терпение и непредвзятость делают её идеальным человеком для изучения диких шимпанзе.

    Поначалу шимпанзе убегали, стоило ей приблизиться. День за днём Гудолл поднималась по крутым тропам над ручьём, тихо сидела и наблюдала издалека. Несмотря на усталость, жару и болезни, она не сдавалась. Постепенно животные к ней привыкли.

    Через несколько месяцев она сделала открытие, потрясшее научный мир. Она увидела, как шимпанзе, которого она назвала Дэвидом Седобородым, подобрал веточку, оборвал с неё листья и сунул в термитник. Когда он её вытащил, она была облеплена термитами, которых он съел. Он изготовил орудие и пользовался им. В то время изготовление орудий считалось тем, что отличает человека от всех остальных животных. Узнав об этом, Лики произнёс знаменитые слова: «Теперь нам придётся либо дать новое определение орудию, либо человеку, либо признать шимпанзе людьми».

    Методы Гудолл были необычными. Вместо номеров она давала шимпанзе имена, тем самым относясь к ним как к личностям со своим характером. Критики называли это ненаучным. Однако её подробные наблюдения показали, что шимпанзе обнимаются, целуются, утешают друг друга и образуют прочные семейные связи. Она наблюдала и более мрачное поведение — жестокие драки и даже войны между группами. Эти открытия разрушили стереотип о шимпанзе как о простых, примитивных животных.

    Впоследствии Гудолл получила докторскую степень и стала одним из самых известных учёных в мире. Позже она посвятила жизнь защите шимпанзе и борьбе за благополучие животных. Её работа показала, что граница между человеком и другими приматами гораздо менее чёткая, чем мы когда-то думали.
  questions:
  - q: Why did Louis Leakey choose Goodall?
    options:
    - She had a PhD
    - Her patience and open mind
    - She was a famous scientist
    - She lived in Tanzania
    answer: 1
  - q: What did Goodall see David Greybeard do?
    options:
    - Build a nest
    - Make and use a tool to catch termites
    - Speak to other chimps
    - Fight a leopard
    answer: 1
  - q: Why did critics call her methods unscientific?
    options:
    - She gave the chimps names
    - She didn't take notes
    - She fed the chimps
    - She worked alone
    answer: 0
  - tf: Goodall only observed peaceful behaviour in chimpanzees.
    answer: false
  - tf: Goodall later earned a PhD.
    answer: true
