title: Body and health
title_ru: Тело и здоровье
topic: body
words:
- ailing | adj | ˈeɪlɪŋ |  | больной, хворающий; в плохом состоянии | ill and not getting better; in a bad condition | She looked after her *ailing* mother. | Она ухаживала за больной матерью.
- antidote | n | ˈæntɪdəʊt | ˈænɪdoʊt | противоядие | a substance that stops poison | Laughter is the best *antidote* to stress. | Смех — лучшее противоядие от стресса.
- contagion | n | kənˈteɪdʒən |  | заражение, зараза | the spreading of disease or ideas | Fear of *contagion* kept people at home. | Страх заражения держал людей дома.
- corpse | n | kɔːps | kɔːrps | труп | a dead body | The police found a *corpse*. | Полиция нашла труп.
- exude | v | ɪɡˈzjuːd | ɪɡˈzuːd | излучать; выделять | to show a feeling strongly | She *exudes* confidence. | Она излучает уверенность.
- hypnotherapy | n | ˈhɪpnəʊθerəpi | hˈɪpnəʊθerəpi | гипнотерапия | treatment using hypnosis | He tried *hypnotherapy* to stop smoking. | Он пробовал бросить курить с помощью гипноза.
- hypochondriac | n | ˌhaɪpəʊˈkɒndrɪæk | ˌhaɪpəˈkɑːndriːæk | ипохондрик | a person who always thinks they are ill | Don't be such a *hypochondriac*! | Не будь таким мнительным!
- hysteria | n | hɪˈstiərɪə | hɪˈsteriə | истерия | uncontrolled excitement or fear | There was mass *hysteria*. | Началась массовая истерия.
- hysterical | adj | hɪˈsterɪkl |  | истеричный; уморительный | out of control; very funny | She became *hysterical*. | У неё началась истерика.
- inflame | v | ɪnˈfleɪm |  | разжигать, разгорячать | to make feelings stronger, especially anger | His speech *inflamed* the crowd. | Его речь распалила толпу.
- palate | n | ˈpælət |  | вкус, нёбо | the ability to recognize and enjoy good food and drink; the top of the mouth | The wine was too sweet for my *palate*. | Вино было слишком сладким на мой вкус.
- palliative care | n | ˈpæliətɪv keə | ˈpæliətɪv ker | паллиативная помощь | care that reduces pain for the dying | She works in *palliative care*. | Она работает в паллиативной медицине.
- physiological | adj | ˌfɪzɪəˈlɒdʒɪkl | ˌfɪziəˈlɑːdʒɪkl | физиологический | relating to how the body works | Stress has *physiological* effects. | Стресс имеет физиологические последствия.
- recuperate | v | rɪˈkjuːpəreɪt | rɪˈkuːpəreɪt | поправляться, восстанавливаться | to recover | He's *recuperating* after surgery. | Он восстанавливается после операции.
- recuperation | n | rɪˌkjuːpəˈreɪʃən | rɪˌkuːpəˈreɪʃən | выздоровление, восстановление | recovery | *Recuperation* will take weeks. | Восстановление займёт недели.
- resuscitate | v | rɪˈsʌsɪteɪt | riːˈsʌsɪteɪt | реанимировать; возрождать | to bring back to life | Doctors tried to *resuscitate* him. | Врачи пытались его реанимировать.
- resuscitation | n | rɪˌsʌsɪˈteɪʃən |  | реанимация | bringing back to life | He needed *resuscitation*. | Ему потребовалась реанимация.
- squint | v | skwɪnt |  | щуриться | to look with eyes partly closed | She *squinted* in the sun. | Она щурилась на солнце.
- wheeze | v | wiːz | hwiːz | хрипеть, сипеть | to breathe with a whistling sound | He was *wheezing* after the run. | После пробежки он хрипел.
