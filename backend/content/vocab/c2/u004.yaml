title: Body and health
title_ru: Тело и здоровье
topic: body
words:
- ailing | adj | ˈeɪlɪŋ |  | больной, хворающий; в плохом состоянии | ill and not getting better; in a bad condition | She looked after her *ailing* mother. | Она ухаживала за больной матерью.
- inflame | v | ɪnˈfleɪm |  | разжигать, разгорячать | to make feelings stronger, especially anger | His speech *inflamed* the crowd. | Его речь распалила толпу.
- palate | n | ˈpælət |  | вкус, нёбо | the ability to recognize and enjoy good food and drink; the top of the mouth | The wine was too sweet for my *palate*. | Вино было слишком сладким на мой вкус.
