reading:
  title: "Twenty-Seven Dollars"
  title_ru: "Двадцать семь долларов"
  text: |
    In 1976, Muhammad Yunus, an economics professor in Bangladesh, visited a poor village near his university. He met a woman who made bamboo stools. She had no money of her own, so she borrowed from a local moneylender to buy bamboo, and then she had to sell him the stools at a price he set. After repaying him, she earned just a few cents a day.

    Yunus made a list of forty-two people in the village who were trapped in the same way. The total amount they owed was just twenty-seven dollars. He lent them the money from his own pocket. To his surprise, every single person paid it back.

    Yunus then went to the banks, but they were indifferent. The poor had no property to offer as security, so bankers, focused on maximizing profits, regarded them as too risky. Some treated the idea with open contempt. So in 1983, Yunus founded his own institution, the Grameen Bank, dedicated to giving small loans to the poorest people — especially women — without asking for security.

    The system's strength was its simplicity. Borrowers formed small groups of five. As a precaution, each person was responsible for helping the others repay. With their loans, villagers started tiny enterprises: a woman might buy a cow and sell its milk; a farmer might buy seeds to sow tomatoes, or a spade to dig ditches and irrigate his crop. Preliminary studies showed that repayment rates were higher than at traditional banks, often above ninety-five percent.

    In 2006, Yunus and the Grameen Bank won the Nobel Peace Prize. The idea of "microfinance" spread around the world. However, it has not been free of criticism. In some countries, the market became saturated with lenders charging very high interest, and some borrowers fell into debt. Economists continue to debate how much microfinance really reduces poverty.

    Yunus describes himself not as a traditional capitalist but as a believer in "social business". For him, the monetary value of a loan matters less than the dignity it gives. As he once said, "Poverty does not belong in civilized human society."
  ru: |
    В 1976 году Мухаммад Юнус, профессор экономики из Бангладеш, побывал в бедной деревне рядом со своим университетом. Он познакомился с женщиной, которая делала бамбуковые табуреты. Своих денег у неё не было, поэтому она занимала у местного ростовщика на покупку бамбука, а затем была вынуждена продавать ему табуреты по назначенной им цене. Расплатившись, она зарабатывала всего несколько центов в день.

    Юнус составил список из сорока двух жителей деревни, попавших в такую же ловушку. Общая сумма их долгов составила всего двадцать семь долларов. Он одолжил им эти деньги из собственного кармана. К его удивлению, все до единого вернули долг.

    Тогда Юнус пошёл в банки, но тем было всё равно. У бедных не было имущества для залога, и банкиры, нацеленные на максимальную прибыль, считали их слишком рискованными. Некоторые относились к идее с открытым презрением. Поэтому в 1983 году Юнус основал собственное учреждение — «Грамин банк», посвятивший себя выдаче небольших займов беднейшим людям, особенно женщинам, без требования залога.

    Сила системы была в её простоте. Заёмщики объединялись в группы по пять человек. В качестве меры предосторожности каждый отвечал за то, чтобы помогать остальным вернуть долг. На займы жители деревень открывали крошечные предприятия: женщина могла купить корову и продавать молоко, фермер — семена, чтобы посеять помидоры, или лопату, чтобы прокопать канавы и орошать посевы. Предварительные исследования показали, что займы возвращали чаще, чем в обычных банках, — нередко более девяноста пяти процентов.

    В 2006 году Юнус и «Грамин банк» получили Нобелевскую премию мира. Идея «микрофинансирования» распространилась по всему миру. Однако и она не избежала критики. В некоторых странах рынок перенасытился кредиторами с очень высокими процентами, и часть заёмщиков влезла в долги. Экономисты до сих пор спорят, насколько микрофинансирование действительно сокращает бедность.

    Юнус называет себя не традиционным капиталистом, а сторонником «социального бизнеса». Для него денежная ценность займа значит меньше, чем достоинство, которое он даёт. Как он однажды сказал: «Бедности не место в цивилизованном обществе».
