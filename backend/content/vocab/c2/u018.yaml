title: Feelings and character
title_ru: Чувства и характер
topic: feelings
words:
- abhor | v | əbˈhɔː | æbˈhɔːr | питать отвращение | to hate | I *abhor* violence. | Я ненавижу насилие.
- abhorrent | adj | əbˈhɒrənt | æbˈhɔːrənt | отвратительный | morally disgusting | Racism is *abhorrent*. | Расизм отвратителен.
- averse | adj | əˈvɜːs | əˈvɜːrs | несклонный, против | not liking | I'm not *averse* to a glass of wine. | Я не против бокала вина.
- contemptuous | adj | kənˈtemptʃuːəs |  | презрительный | showing contempt | He gave a *contemptuous* laugh. | Он презрительно рассмеялся.
- daunt | v | dɔːnt |  | пугать, обескураживать | to make you feel less confident | She was not *daunted* by the task. | Задача её не испугала.
- disdainful | adj | dɪsˈdeɪnfl |  | высокомерный, презрительный | showing disdain | She was *disdainful* of cheap food. | Она презрительно относилась к дешёвой еде.
- enthuse | v | ɪnˈθjuːs | ɪnˈθuːz | восторгаться | to talk excitedly | She *enthused* about the trip. | Она с восторгом рассказывала о поездке.
- euphoric | adj | juːˈfɒrɪk | juːˈfɔːrɪk | эйфорический | extremely happy | The fans were *euphoric*. | Фанаты были в эйфории.
- hapless | adj | ˈhæpləs |  | злополучный, бедный | unlucky | The *hapless* tourist lost his passport. | Незадачливый турист потерял паспорт.
- indignant | adj | ɪnˈdɪɡnənt | ˌɪnˈdɪɡnənt | возмущённый | angry because of unfairness | She was *indignant* at the accusation. | Обвинение её возмутило.
- ingratiate | v | ɪnˈɡreɪʃɪeɪt | ˌɪŋˈɡreɪʃiːeɪt | снискать расположение, подлизываться | to try to make someone like you | He tried to *ingratiate* himself with the boss. | Он пытался подлизаться к начальнику.
- lament | v | ləˈment |  | оплакивать, сетовать | to express sadness | He *lamented* the loss of old traditions. | Он сетовал на утрату старых традиций.
- nonchalant | adj | ˈnɒnʃələnt | ˌnɑːnʃəˈlɑːnt | беспечный, невозмутимый | calm and not worried | He seemed *nonchalant* about the exam. | Он казался невозмутимым перед экзаменом.
- nostalgic | adj | nəˈstældʒɪk | nɔːˈstældʒɪk | ностальгический | longing for the past | The song makes me *nostalgic*. | Песня вызывает у меня ностальгию.
- rapturous | adj | ˈræptʃərəs |  | восторженный | very enthusiastic | She received *rapturous* applause. | Ей восторженно аплодировали.
- remorseful | adj | rɪˈmɔːsfl | rɪˈmɔːrsfl | полный раскаяния | feeling sorry | He was *remorseful* for what he did. | Он раскаивался в содеянном.
- wistful | adj | ˈwɪstfl |  | тоскливый, задумчивый | sadly thinking of something you can't have | She gave a *wistful* smile. | Она грустно улыбнулась.
