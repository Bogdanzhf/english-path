title: Society and politics
title_ru: Общество и политика
topic: society
words:
- artifact | n | ˈɑːtɪfækt | ˈɑːrtɪfækt | артефакт | an object made by people long ago | The museum displays *artifacts* from ancient Egypt. | В музее выставлены артефакты Древнего Египта. | брит. artefact
- assimilation | n | əˌsɪmɪˈleɪʃən | əˌsɪməˈleɪʃən | ассимиляция, усвоение | absorbing into a culture; learning | *Assimilation* of immigrants takes time. | Ассимиляция иммигрантов требует времени.
- austerity | n | ɔːˈsterɪti | ˌɔːˈsterɪti | жёсткая экономия; строгость | strict cuts in spending | The government introduced *austerity* measures. | Правительство ввело меры жёсткой экономии.
- banish | v | ˈbænɪʃ |  | изгонять | to send away | He was *banished* from the kingdom. | Его изгнали из королевства.
- besiege | v | bɪˈsiːdʒ |  | осаждать | to surround to attack; to overwhelm | The star was *besieged* by fans. | Звезду осаждали поклонники.
- blitz | n | blɪts |  | натиск, интенсивная кампания | a sudden big effort or attack | They launched an advertising *blitz*. | Они устроили массированную рекламную кампанию.
- contingent | n | kənˈtɪndʒənt |  | группа, контингент | a group of people from the same place or organization | A large *contingent* of climbers reached the camp. | В лагерь прибыла большая группа альпинистов. | прил. contingent on — зависящий от
- cultural divergence | n | ˈkʌltʃərəl daɪˈvɜːdʒəns | ˈkʌltʃərəl daɪˈvɜːrdʒəns | культурное расхождение | cultures becoming more different | Isolation leads to *cultural divergence*. | Изоляция ведёт к культурному расхождению.
- demagogue | n | ˈdeməɡɒɡ | ˈdeməɡɑːɡ | демагог | a leader who uses emotions to win support | He's a dangerous *demagogue*. | Он опасный демагог.
- heed | v | hiːd |  | прислушиваться, принимать во внимание | to pay attention to advice or a warning | He failed to *heed* the warnings. | Он не внял предупреждениям.
- hegemony | n | ˈhedʒɪməni | hiːˈdʒeməni | гегемония | control by one country or group | They challenged American *hegemony*. | Они бросили вызов американской гегемонии.
- hinder | v | ˈhɪndə | ˈhɪndər | мешать, препятствовать | to make something difficult to do or slow | Bad weather *hindered* the rescue. | Плохая погода мешала спасательной операции.
- insularity | n | ˌɪnsjʊˈlærɪti | ˌɪnsəˈlerɪti | замкнутость, ограниченность | not being interested in others | The *insularity* of the community is striking. | Замкнутость общины поражает.
- legion | n | ˈliːdʒən |  | легион, множество | a large group | He has a *legion* of fans. | У него легион поклонников.
- manoeuvre | n | məˈnuːvə | mənˈuːvɐ | манёвр | a skilful movement | It was a clever political *manoeuvre*. | Это был ловкий политический манёвр. | амер. maneuver
- mercantile | adj | ˈmɜːkɑːntaɪl | ˈmɜːrkəntaɪl | торговый, меркантильный | relating to trade | It's a *mercantile* city. | Это торговый город.
- minefield | n | ˈmaɪnfiːld |  | минное поле | an area with mines; a situation full of dangers | The topic is a political *minefield*. | Эта тема — политическое минное поле.
- monastic | adj | məˈnɑːstɪk | məˈnæstɪk | монашеский | relating to monks | He leads a *monastic* life. | Он ведёт монашеский образ жизни.
- parochial | adj | pæˈrɒkɪəl | pəˈroʊkiəl | приходской; узкий, ограниченный | narrow-minded | Their views are very *parochial*. | У них очень узкие взгляды.
- patronise | v | ˈpætrənaɪz | pˈætrənaɪz | относиться снисходительно; быть клиентом | to treat as less intelligent; to use a shop | Don't *patronise* me! | Не надо разговаривать со мной свысока! | амер. patronize
- philanthropy | n | fɪˈlænθrəpi |  | благотворительность, филантропия | giving money to help others | His *philanthropy* funded a new hospital. | На его пожертвования построили новую больницу.
- posterity | n | pɒˈsterɪti | pɑːˈsterəti | потомство, будущие поколения | people in the future | The letters were saved for *posterity*. | Письма сохранили для потомков.
- relegate | v | ˈrelɪɡeɪt | ˈreləɡeɪt | понижать (в статусе) | to move to a lower position | The team was *relegated*. | Команда вылетела в низший дивизион.
- 'retrospective | adj | ˌretrəʊˈspektɪv | ˌretrəˈspektɪv | ретроспективный; обратной силы | looking back | The law has *retrospective* effect. | Закон имеет обратную силу. | сущ.: retrospective — ретроспектива'
- 'splinter | v | ˈsplɪntə | ˈsplɪntər | раскалываться | to break into pieces or groups | The party *splintered* into factions. | Партия раскололась на фракции. | сущ.: splinter — заноза'
- xenophobia | n | ˌzenəˈfəʊbiə | ˌzenəˈfoʊbiə | ксенофобия | fear or hatred of foreigners | *Xenophobia* is on the rise. | Ксенофобия растёт.
