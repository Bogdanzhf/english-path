title: Science and research
title_ru: Наука и исследования
topic: science
words:
- anthropogenic | adj | ˌænθrəpəʊˈdʒenɪk | ˌænθrəpəˈdʒenɪk | антропогенный | caused by humans | Climate change is largely *anthropogenic*. | Изменение климата в основном вызвано человеком.
- anthropological | adj | ˌænθrəpəˈlɒdʒɪkl | ˌænθrəpəˈlɑːdʒəkl | антропологический | relating to anthropology | They did *anthropological* research. | Они провели антропологическое исследование.
- astrophysics | n | ˌæstrəˈfɪzɪks | ˌæstroʊˈfɪzɪks | астрофизика | the physics of stars and space | She studies *astrophysics*. | Она изучает астрофизику.
- attrition | n | əˈtrɪʃən |  | истощение, изматывание; убыль | gradual weakening; loss of staff | It was a war of *attrition*. | Это была война на истощение.
- clickbait | n | ˈklɪkbeɪt |  | кликбейт | content designed to make you click | That headline is just *clickbait*. | Этот заголовок — просто кликбейт.
- combustion | n | kəmˈbʌstʃən |  | горение, сгорание | burning | The car has an internal *combustion* engine. | У машины двигатель внутреннего сгорания.
- cosmic | adj | ˈkɒzmɪk | ˈkɑːzmɪk | космический; вселенский | relating to the universe | It's a *cosmic* mystery. | Это вселенская тайна.
- disruptive technology | n | dɪsˈrʌptɪv tekˈnɒlədʒi | dɪsˈrʌptɪv tekˈnɑːlədʒi | прорывная технология | technology that changes an industry | The smartphone was a *disruptive technology*. | Смартфон стал прорывной технологией.
- ecocide | n | ˈiːkəʊsaɪd | ˈiːkoʊsaɪd | экоцид | destruction of the natural environment | Activists call it *ecocide*. | Активисты называют это экоцидом.
- energy security | n | ˈenədʒi sɪˈkjɔːrɪti | ˈenərdʒi sɪkˈjʊrəti | энергетическая безопасность | having reliable energy supplies | *Energy security* is a priority. | Энергетическая безопасность — приоритет.
- epidemiology | n | ˌepɪˌdemɪˈɒlədʒi | ˌepəˌdemiːˈɑːlədʒi | эпидемиология | the study of the spread of disease | She's an expert in *epidemiology*. | Она эпидемиолог.
- fracking | n | ˈfrækɪŋ |  | гидроразрыв пласта, фрекинг | getting gas by breaking rock with water | *Fracking* is banned in some countries. | В некоторых странах фрекинг запрещён.
- gravitational | adj | ˌɡrævɪˈteɪʃənl |  | гравитационный | relating to gravity | Black holes have huge *gravitational* pull. | У чёрных дыр огромная сила притяжения.
- inconclusive | adj | ɪnkənˈkluːsɪv | ˌɪnkənˈkluːsɪv | неубедительный, не дающий ответа | not leading to a clear result | The tests were *inconclusive*. | Анализы не дали однозначного результата.
- interstellar | adj | ˌɪntəˈstelə | ˌɪntərˈstelər | межзвёздный | between stars | It's a film about *interstellar* travel. | Это фильм о межзвёздных путешествиях.
- kinetic | adj | kɪˈnetɪk | kəˈnetɪk | кинетический | relating to movement | It's *kinetic* energy. | Это кинетическая энергия.
- meteorological | adj | ˌmiːtiərəˈlɒdʒɪkl | ˌmiːtiərəˈlɑːdʒɪkl | метеорологический | connected with weather | *Meteorological* conditions delayed the launch. | Запуск отложили из-за погодных условий.
- meteorology | n | ˌmiːtiəˈrɒlədʒi | ˌmiːtiəˈrɑːlədʒi | метеорология | the scientific study of weather | Satellites have transformed *meteorology*. | Спутники преобразили метеорологию.
- paradigm shift | n | ˈpærədaɪm ʃɪft | ˈperədaɪm ʃɪft | смена парадигмы | a complete change in thinking | The internet caused a *paradigm shift*. | Интернет вызвал смену парадигмы.
- pathological | adj | ˌpæθəˈlɒdʒɪkl | ˌpæθəˈlɑːdʒɪkl | патологический | caused by illness; not reasonable or normal | He was a *pathological* liar. | Он был патологическим лжецом.
- proliferation | n | prəˌlɪfəˈreɪʃən | ˌproʊlɪfəˈreɪʃən | распространение, рост | rapid increase | The *proliferation* of nuclear weapons is a danger. | Распространение ядерного оружия опасно.
- replicable | adj | ˈreplɪkəbl |  | воспроизводимый | able to be repeated | Results must be *replicable*. | Результаты должны быть воспроизводимы.
- stratosphere | n | ˈstrætəsfiə | ˈstrætəsfɪr | стратосфера | the upper layer of the atmosphere | The balloon reached the *stratosphere*. | Шар достиг стратосферы.
- transmitter | n | trænˈsmɪtə | trænsˈmɪtər | передатчик | a device that sends signals | The radio *transmitter* was damaged. | Радиопередатчик был повреждён.
- unsustainable | adj | ʌnsəˈsteɪnəbl | ˌʌnsəˈsteɪnəbl | неустойчивый, невыносимый в долгосрочной перспективе | not able to continue | Current spending is *unsustainable*. | Нынешние расходы нельзя поддерживать долго.
- zoology | n | zuˈɒlədʒi | zoʊˈɑːlədʒi | зоология | the scientific study of animals | She has a degree in *zoology*. | У неё диплом по зоологии.
