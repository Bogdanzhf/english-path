title: Society and politics
title_ru: Общество и политика
topic: society
words:
- contingent | n | kənˈtɪndʒənt |  | группа, контингент | a group of people from the same place or organization | A large *contingent* of climbers reached the camp. | В лагерь прибыла большая группа альпинистов. | прил. contingent on — зависящий от
- heed | v | hiːd |  | прислушиваться, принимать во внимание | to pay attention to advice or a warning | He failed to *heed* the warnings. | Он не внял предупреждениям.
- hinder | v | ˈhɪndə | ˈhɪndər | мешать, препятствовать | to make something difficult to do or slow | Bad weather *hindered* the rescue. | Плохая погода мешала спасательной операции.
