title: Events and situations
title_ru: События и ситуации
topic: events
words:
- aberration | n | ˌæbəˈreɪʃən |  | отклонение, аномалия | something unusual | The bad result was an *aberration*. | Плохой результат был случайностью.
- adhesion | n | ədˈhiːʒən | ædˈhiːʒən | сцепление, прилипание | sticking | The tyres have good *adhesion*. | У шин хорошее сцепление.
- anonymity | n | ˌænəˈnɪmɪti |  | анонимность | not being known | He spoke on condition of *anonymity*. | Он говорил на условиях анонимности.
- banishment | n | ˈbænɪʃmənt |  | изгнание | being sent away | He lived in *banishment*. | Он жил в изгнании.
- conciliation | n | kənˌsɪlɪˈeɪʃən | kənˌsɪliːˈeɪʃən | примирение, урегулирование | ending a disagreement | The dispute went to *conciliation*. | Спор передали на примирительную процедуру.
- deprivation | n | dɪprɪˈveɪʃən | ˌdeprəˈveɪʃən | лишение, нужда | lacking basic things | Sleep *deprivation* is harmful. | Недосып вреден.
- elation | n | ɪˈleɪʃən |  | восторг, ликование | great happiness | I felt *elation* when I passed. | Сдав экзамен, я ликовал.
- eminence | n | ˈemɪnəns | ˈemənəns | известность, высокое положение | fame and importance | He rose to *eminence* as a lawyer. | Он стал видным юристом.
- equilibrium | n | ˌiːkwɪˈlɪbriəm | ˌiːkwəˈlɪbriəm | равновесие | balance | The market returned to *equilibrium*. | Рынок вернулся в равновесие.
- fruition | n | fruːˈɪʃən |  | осуществление | the successful result of a plan | The plan came to *fruition*. | План осуществился.
- materialism | n | məˈtiərɪəlɪzəm | məˈtɪriəlɪzəm | материализм, вещизм | caring too much about possessions | Modern *materialism* worries him. | Его беспокоит современный вещизм.
- menace | n | ˈmenɪs | ˈmenəs | угроза | a danger | Drunk drivers are a *menace*. | Пьяные водители — угроза обществу.
- milieu | n | ˈmiːljɜː | mɪlˈjʊ | среда, окружение | a social environment | He grew up in an artistic *milieu*. | Он вырос в творческой среде.
- notoriety | n | ˌnəʊtɔːˈraɪəti | ˌnoʊtəˈraɪəti | дурная слава | being famous for something bad | He gained *notoriety* as a liar. | Он прославился как лжец.
- opulence | n | ˈɒpjʊləns | ˈɑːpjələns | роскошь, богатство | great wealth | The *opulence* of the palace is stunning. | Роскошь дворца поражает.
- solitude | n | ˈsɒlɪtjuːd | ˈsɑːlətuːd | уединение, одиночество | being alone, especially by choice | He spent his last years in *solitude*. | Последние годы он провёл в уединении.
- tumult | n | ˈtjuːmʌlt | ˈtuːmʌlt | смятение, шум | a state of noise and confusion | The ground was in *tumult* as people ran. | На земле царило смятение, люди бежали.
