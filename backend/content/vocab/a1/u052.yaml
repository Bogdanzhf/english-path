title: Everyday phrases
title_ru: Разговорные фразы
topic: phrases
words:
- look at somebody/something | phr |  |  | смотреть на | to turn your eyes towards someone or something | *Look at* the board, please. | Посмотрите на доску, пожалуйста.
- look like somebody/something | phr |  |  | быть похожим на | to be similar in appearance | You *look like* your mother. | Ты похожа на маму.
- lots of... | phr |  |  | много, масса | a large number or amount of | There are *lots of* shops here. | Здесь масса магазинов.
- millions of... | phr |  |  | миллионы | a very large number of | *Millions of* people watch the show. | Миллионы людей смотрят это шоу.
- more than... | phr |  |  | больше, чем…; более | a larger number or amount than | It costs *more than* a hundred dollars. | Это стоит больше ста долларов.
- next time | phr |  |  | в следующий раз | on the next occasion | *Next time*, call me first. | В следующий раз сначала позвони.
- next year | phr |  |  | в следующем году | the year after this one | I'll finish school *next year*. | Я окончу школу в следующем году.
- no problem | phr |  |  | без проблем, не за что | used to say that you are happy to help | Thanks! — *No problem*. | Спасибо! — Не за что.
- of course | phr |  |  | конечно | certainly | Can I sit here? — *Of course*! | Можно мне сесть здесь? — Конечно!
- oh no! | phr |  |  | о нет! | used when something bad happens | *Oh no*! I forgot my keys! | О нет! Я забыл ключи!
- oh yes | phr |  |  | о да | used to agree strongly | *Oh yes*, I remember him. | О да, я его помню.
- on holiday | phr |  |  | в отпуске, на каникулах | having a holiday | We're going *on holiday* to Spain. | Мы едем в отпуск в Испанию.
- on Monday | phr |  |  | в понедельник | during Monday | The shop is closed *on Monday*. | В понедельник магазин закрыт. | on + день недели
- on television | phr |  |  | по телевизору | shown on TV | Is there anything good *on television*? | По телевизору что-нибудь интересное есть?
- on the beach | phr |  |  | на пляже | at the sandy area by the sea | We spent the day *on the beach*. | Мы провели день на пляже.
- on the floor | phr |  |  | на полу | lying on the floor | Your bag is *on the floor*. | Твоя сумка на полу.
- on the internet | phr |  |  | в интернете | using the internet | I read about it *on the internet*. | Я прочитал об этом в интернете.
- on the left | phr |  |  | слева | on the left side | The school is *on the left*. | Школа слева.
- on the phone | phr |  |  | по телефону | using the phone | She's *on the phone* right now. | Она сейчас разговаривает по телефону.
