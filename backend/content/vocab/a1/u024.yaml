title: Time and dates
title_ru: Время и даты
topic: time
words:
- April | n | ˈeɪprəl |  | апрель | the fourth month of the year | My birthday is in *April*. | Мой день рождения в апреле. | месяцы — с заглавной буквы
- August | n | ˈɔːɡəst | ˈɑːɡəst | август | the eighth month of the year | We always go to the sea in *August*. | Мы всегда ездим на море в августе. | названия месяцев пишутся с заглавной буквы
- century | n | ˈsentʃəri |  | век, столетие | a period of one hundred years | This church was built in the 15th *century*. | Эта церковь построена в XV веке.
- December | n | dɪˈsembə | dɪˈsembər | декабрь | the twelfth month of the year | Christmas is on the 25th of *December*. | Рождество — 25 декабря.
- February | n | ˈfebjəweri |  | февраль | the second month of the year | *February* is the shortest month. | Февраль — самый короткий месяц.
- Friday | n | ˈfraɪdeɪ |  | пятница | the day after Thursday | See you on *Friday*! | Увидимся в пятницу! | дни недели — с заглавной буквы
- January | n | ˈdʒænjuəri | ˈdʒænjueri | январь | the first month of the year | It's very cold here in *January*. | В январе здесь очень холодно.
- July | n | dʒuˈlaɪ |  | июль | the seventh month of the year | My birthday is in *July*. | Мой день рождения в июле. | ударение на второй слог
- June | n | dʒun | dʒuːn | июнь | the sixth month of the year | School finishes in *June*. | Учёба заканчивается в июне.
- midnight | n | ˈmɪdnaɪt |  | полночь | twelve o'clock at night | I went to bed at *midnight*. | Я лёг спать в полночь.
- moment | n | ˈməʊmənt | ˈmoʊmənt | момент, миг | a very short time | Wait a *moment*, please. | Подождите минутку, пожалуйста.
- month | n | mʌnθ |  | месяц | one of the twelve parts of a year | February is the shortest *month* of the year. | Февраль — самый короткий месяц в году.
- morning | n | ˈmɔːnɪŋ | ˈmɔːrnɪŋ | утро | the early part of the day | I drink coffee every *morning*. | Я пью кофе каждое утро. | in the morning — утром
- night | n | naɪt |  | ночь; вечер | the time when it is dark and people sleep | I couldn't sleep last *night*. | Я не мог уснуть прошлой ночью. | at night — ночью
- November | n | nəʊˈvembɜː | noʊˈvembər | ноябрь | the eleventh month of the year | It often rains in *November*. | В ноябре часто идут дожди.
- "October | n | \x01ːkˈtəʊbɜː | ɑːkˈtoʊbər | октябрь | the tenth month of the year | The leaves fall in *October*. | В октябре опадают листья."
- period | n | ˈpɪəriəd | ˈpɪriəd | период | a length of time | He lived in Japan for a short *period*. | Он недолго жил в Японии.
- September | n | sepˈtembɜː | sepˈtembər | сентябрь | the ninth month of the year | School starts in *September*. | Учёба начинается в сентябре.
- summer | n | ˈsʌmə | ˈsʌmər | лето | the warmest season of the year | We go to the sea every *summer*. | Каждое лето мы ездим на море.
- tonight | adv | təˈnaɪt |  | сегодня вечером (ночью) | this evening or night | What are you doing *tonight*? | Что ты делаешь сегодня вечером?
- week | n | wiːk |  | неделя | a period of seven days | We stayed in the hotel for one *week*. | Мы прожили в отеле одну неделю.
- year | n | jɪə | jɪr | год | a period of twelve months | We moved here three *years* ago. | Мы переехали сюда три года назад.
