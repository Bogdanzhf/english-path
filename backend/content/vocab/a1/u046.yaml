title: Arts and media
title_ru: Искусство и медиа
topic: arts
words:
- art | n | ɑːt | ɑːrt | искусство | paintings, music, theatre and other creative work | She is interested in modern *art*. | Она интересуется современным искусством.
- article | n | ˈɑːtɪkl | ˈɑːrtɪkl | статья | a piece of writing in a newspaper or magazine | I read an interesting *article* about sleep. | Я прочитал интересную статью о сне.
- band | n | bænd |  | музыкальная группа | a group of people who play music together | My brother plays the drums in a rock *band*. | Мой брат играет на барабанах в рок-группе.
- concert | n | ˈkɒnsət | ˈkɑːnsərt | концерт | a performance of music | We went to a rock *concert* last night. | Вчера вечером мы ходили на рок-концерт.
- design | n | dɪˈzaɪn |  | дизайн; проект | the way something is made to look | I love the *design* of this chair. | Мне нравится дизайн этого стула.
- draw | v | drɔː |  | рисовать (карандашом) | to make a picture with a pencil or pen | My son likes to *draw* animals. | Мой сын любит рисовать животных. | draw – drew – drawn
- fairy | n | ˈfeəri | ˈferi | фея | a small imaginary creature with magic powers | She dressed up as a *fairy*. | Она нарядилась феей. | fairy tale — сказка
- film | n | fɪlm |  | фильм | a story shown in a cinema or on TV | Let's watch a *film* tonight. | Давай посмотрим фильм вечером. | американское — movie
- movie | n | ˈmuːvi |  | фильм (амер.) | a film | What's your favourite *movie*? | Какой твой любимый фильм?
- museum | n | mjuˈziːəm |  | музей | a building where interesting old or valuable things are shown | The *museum* is free on Sundays. | По воскресеньям вход в музей бесплатный.
- music | n | ˈmjuːzɪk |  | музыка | sounds made by singing or playing instruments | What kind of *music* do you like? | Какую музыку ты любишь?
- 'news | n | njuːz |  | новости | information about recent events | Did you hear the *news*? | Ты слышал новости? | ед. ч.: the news is'
- newspaper | n | ˈnjuːzpeɪpə | ˈnuːzpeɪpər | газета | printed pages with news | My dad reads the *newspaper* every morning. | Папа читает газету каждое утро.
- page | n | peɪdʒ |  | страница | one side of a sheet of paper in a book | Open your books at *page* ten. | Откройте учебники на десятой странице.
- painting | n | ˈpeɪntɪŋ |  | картина; живопись | a picture made with paint | This *painting* is very old. | Эта картина очень старая.
- photograph | n | ˈfəʊtəɡrɑːf | ˈfoʊtəɡræf | фотография | a picture made with a camera | This is a *photograph* of my grandparents. | Это фотография моих бабушки и дедушки. | разг. photo
- piano | n | pɪˈænəʊ | piːˈænə | фортепиано, пианино | a large musical instrument with black and white keys | She plays the *piano* very well. | Она очень хорошо играет на пианино.
- picture | n | ˈpɪktʃə | ˈpɪktʃər | картинка, изображение; фото | a painting, drawing or photo | There's a *picture* of a horse on the wall. | На стене висит изображение лошади.
- programme | n | ˈprəʊɡræm | ˈproʊɡræm | программа, передача | a show on TV or radio | My favourite *programme* starts at eight. | Моя любимая передача начинается в восемь. | американское — program
- reader | n | ˈriːdə | ˈriːdər | читатель | a person who reads | She's a fast *reader*. | Она быстро читает.
- reading | n | ˈredɪŋ |  | чтение | the activity of reading | *Reading* is my hobby. | Чтение — моё хобби.
- section | n | ˈsekʃən |  | часть, раздел | one of the parts of something | Read the first *section* of the text. | Прочитайте первую часть текста.
- song | n | sɒŋ | sɔːŋ | песня | a short piece of music with words | This is my favourite *song*. | Это моя любимая песня.
- 'sound | n | saʊnd |  | звук | something that you hear | I heard a strange *sound* outside. | Я услышал странный звук снаружи. | гл. sound — звучать: That sounds great!'
- theatre | n | ˈθiətə | ˈθiətər | театр | a building where people watch plays | We went to the *theatre* last night. | Вчера вечером мы ходили в театр. | американское — theater
- word | n | wɜːd | wɜːrd | слово | a group of letters that has a meaning | What does this *word* mean? | Что означает это слово?
