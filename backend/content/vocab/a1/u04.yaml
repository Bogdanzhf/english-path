reading:
  title: "Grandpa's Habits"
  title_ru: "Привычки дедушки"
  text: |
    Every summer, Max stays with his grandfather in a small village near the mountains. Grandpa is eighty years old, but he is very healthy and active. Max frequently asks him, "What is your secret?"

    "It's simple," Grandpa says. "Good habits." He gets up early, and every morning he strolls around the village for an hour. He avoids fast food and eats lots of vegetables. In the evening, he reads instead of watching TV.

    Grandpa is also very patient and calm. When Max behaves badly, he never shouts or punishes him. Instead, he explains the issue and instructs him how to do things better. "Getting angry does not solve problems," he says.

    The people in the village love him. When they have a concern, they come to his house. Last year, they chose him to represent the village at a meeting in the city.

    Max does not expect to live like Grandpa, but he wants to try. Now he has a few new habits too. "None of them are hard," he says with a positive smile. "And I feel content and happy."
  ru: |
    Каждое лето Макс гостит у дедушки в маленькой деревне у гор. Дедушке восемьдесят лет, но он очень здоровый и активный. Макс часто спрашивает его: «В чём твой секрет?»

    «Всё просто, — говорит дедушка. — Хорошие привычки». Он рано встаёт и каждое утро час гуляет по деревне. Он избегает фастфуда и ест много овощей. Вечером он читает, а не смотрит телевизор.

    Ещё дедушка очень терпеливый и спокойный. Когда Макс плохо себя ведёт, он никогда не кричит и не наказывает его. Вместо этого он объясняет, в чём дело, и учит, как сделать лучше. «Злость проблем не решает», — говорит он.

    Жители деревни его любят. Когда их что-то беспокоит, они приходят к нему домой. В прошлом году они выбрали его представлять деревню на собрании в городе.

    Макс не рассчитывает жить так же, как дедушка, но хочет попробовать. Теперь у него тоже есть несколько новых привычек. «Ни одна из них не трудная, — говорит он с позитивной улыбкой. — И я чувствую себя довольным и счастливым».
  questions:
