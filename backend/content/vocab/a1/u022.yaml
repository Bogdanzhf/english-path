title: Time and dates
title_ru: Время и даты
topic: time
words:
- a.m. | adv | eɪ em |  | до полудня (утра) | before midday, used with times | The shop opens at 9 *a.m.* | Магазин открывается в 9 утра.
- after | prep | ˈɑːftə | ˈæftər | после | later than | Let's meet *after* lunch. | Давай встретимся после обеда.
- again | adv | əˈɡen | əˈɡeɪn | снова, ещё раз | one more time | Can you say that *again*? | Можете повторить?
- ago | adv | əˈɡəʊ | əˈɡoʊ | назад (о времени) | before now | I moved here two years *ago*. | Я переехал сюда два года назад.
- always | adv | ˈɔːlweɪz |  | всегда | at all times; every time | I *always* drink coffee in the morning. | Я всегда пью кофе по утрам.
- before | prep | bɪˈfɔː | ˌbiːˈfɔːr | до, перед | earlier than | Wash your hands *before* dinner. | Помой руки перед ужином.
- during | prep | ˈdjʊərɪŋ | ˈdʊrɪŋ | во время, в течение | at some time while something is happening | Please don't talk *during* the film. | Пожалуйста, не разговаривайте во время фильма.
- 'ever | adv | ˈevə | ˈevər | когда-либо | at any time | Have you *ever* been to London? | Ты когда-нибудь был в Лондоне? | обычно в вопросах: Have you ever…?'
- future | n | ˈfjuːtʃə | ˈfjuːtʃər | будущее | the time that will come | Nobody knows the *future*. | Никто не знает будущего. | in the future — в будущем
- May | n | meɪ |  | май | the fifth month of the year | The weather is lovely in *May*. | В мае прекрасная погода. | may (модальный глагол) — может быть, можно
- never | adv | ˈnevə | ˈnevər | никогда | not at any time | I have *never* seen snow. | Я никогда не видел снега.
- now | adv | naʊ |  | сейчас, теперь | at this time | I'm busy *now*. | Сейчас я занят.
- o'clock | adv | əˈklɒk | əˈklɑːk | час (о точном времени) | used with numbers to say the exact hour | It's three *o'clock*. | Сейчас три часа.
- often | adv | ˈɒfn | ˈɔːfn | часто | many times | How *often* do you go to the gym? | Как часто ты ходишь в спортзал? | t обычно не произносится
- once | adv | wɒns | wʌns | однажды; один раз | one time | I go swimming *once* a week. | Я плаваю раз в неделю.
- p.m. | adv | piː em |  | после полудня (дня, вечера) | after midday, used with times | The film starts at 7 *p.m.* | Фильм начинается в 7 вечера.
- soon | adv | suːn |  | скоро | in a short time | See you *soon*! | До скорого!
- then | adv | ðen |  | тогда; потом | at that time; after that | We had dinner and *then* went to the cinema. | Мы поужинали, а потом пошли в кино.
- today | adv | təˈdeɪ |  | сегодня | on this day | It's very hot *today*. | Сегодня очень жарко.
- twice | adv | twaɪs |  | дважды | two times | I've been to Paris *twice*. | Я был в Париже дважды.
- until | prep | ʌnˈtɪl | ənˈtɪl | до (какого-то времени) | up to a time | The shop is open *until* nine. | Магазин открыт до девяти.
- usually | adv | ˈjuːʒuːəli | ˈjuːʒəli | обычно | in most cases | I *usually* walk to work. | Обычно я хожу на работу пешком.
