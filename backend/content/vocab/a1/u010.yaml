title: Food and drink
title_ru: Еда и напитки
topic: food
words:
- banana | n | bəˈnɑːnə | bəˈnænə | банан | a long yellow fruit | Monkeys love *bananas*. | Обезьяны обожают бананы.
- bottle | n | ˈbɒtl | ˈbɑːtl | бутылка | a glass or plastic container for liquids | A *bottle* of water, please. | Бутылку воды, пожалуйста.
- burger | n | ˈbɜːɡə | ˈbɜːrɡər | бургер | a hamburger | I'd like a *burger* and fries. | Мне бургер и картошку фри.
- carrot | n | ˈkærət |  | морковь | a long orange vegetable | Rabbits eat *carrots*. | Кролики едят морковку.
- cooking | n | ˈkʊkɪŋ |  | приготовление пищи, кухня | the process of preparing food | Clay pots have been used for *cooking* for thousands of years. | Глиняные горшки используют для приготовления пищи тысячи лет.
- cream | n | kriːm |  | сливки; крем | the thick fat part of milk | Do you take *cream* in your coffee? | Вы пьёте кофе со сливками?
- diet | n | ˈdaɪət |  | рацион, питание; диета | the food that you usually eat | A healthy *diet* includes lots of vegetables. | Здоровый рацион включает много овощей. | be on a diet — сидеть на диете
- drink | v | drɪŋk |  | пить | to take liquid into your mouth and swallow it | You should *drink* more water. | Тебе стоит пить больше воды. | drink — drank — drunk
- eat | v | iːt |  | есть, кушать | to put food in your mouth and swallow it | We usually *eat* at seven. | Мы обычно едим в семь. | eat — ate — eaten
- fat | n | fæt |  | жир | an oily substance in food and in the body | Avocados are high in healthy *fats*. | Авокадо богаты полезными жирами.
- grape | n | ɡreɪp |  | виноград (ягода) | a small green or purple fruit that grows in bunches | These *grapes* are very sweet. | Этот виноград очень сладкий.
- hamburger | n | ˈhæmbɜːɡə | ˈhæmbərɡər | гамбургер | a round piece of meat in a bread roll | The kids want *hamburgers*. | Дети хотят гамбургеры.
- meal | n | miːl |  | приём пищи, еда | breakfast, lunch or dinner | We have three *meals* a day. | Мы едим три раза в день.
- onion | n | ˈʌniən | ˈʌnjən | лук (репчатый) | a round vegetable with a strong smell | Cutting *onions* makes me cry. | От нарезки лука я плачу.
- tomato | n | təˈmɑːtəʊ | təˈmeɪtoʊ | помидор | a soft red fruit eaten as a vegetable | She grows *tomatoes* to sell at the market. | Она выращивает помидоры на продажу.
- vegetable | n | ˈvedʒtəbl |  | овощ | a plant you eat, like a carrot or potato | Eat your *vegetables*! | Ешь овощи!
- yogurt | n | ˈjɒɡɜːt | ˈjoʊɡərt | йогурт | a thick food made from milk | I have *yogurt* with fruit for breakfast. | На завтрак я ем йогурт с фруктами.
