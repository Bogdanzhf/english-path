      options: ["He went left", "He went right", "He went home", "He sat down and slept"]
      answer: 1
    - q: "Why was the left path dangerous?"
      options: ["There were wolves", "Part of it had fallen into the valley", "It was too long", "It was closed by the police"]
      answer: 1
