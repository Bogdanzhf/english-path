title: Shopping and money
title_ru: Покупки и деньги
topic: shopping
words:
- buy | v | baɪ |  | покупать | to get something by paying money | I want to *buy* a new phone. | Я хочу купить новый телефон. | buy – bought – bought
- card | n | kɑːd | kɑːrd | карта, карточка; открытка | a small piece of plastic or paper | Can I pay by *card*? | Можно оплатить картой? | birthday card — открытка на день рождения
- customer | n | ˈkʌstəmə | ˈkʌstəmər | покупатель, клиент | a person who buys things from a shop or business | The shop was full of *customers*. | Магазин был полон покупателей.
- dollar | n | ˈdɒlə | ˈdɑːlər | доллар | the money of the USA and some other countries | It costs five *dollars*. | Это стоит пять долларов.
- market | n | ˈmɑːkɪt | ˈmɑːrkɪt | рынок | a place where people buy and sell things | We buy fruit at the *market* on Saturdays. | По субботам мы покупаем фрукты на рынке.
- 'money | n | ˈmʌni |  | деньги | coins and paper notes you use to buy things | I don''t have much *money*. | У меня мало денег. | неисчисляемое: money is'
- pay | v | peɪ |  | платить | to give money for something | Can I *pay* by card? | Можно расплатиться картой? | pay – paid – paid; pay for something
- present | n | ˈprezənt |  | подарок | something you give someone | Thank you for the *present*! | Спасибо за подарок! | the present — настоящее время
- price | n | praɪs |  | цена | the amount of money you pay for something | The *price* of the ticket is twenty euros. | Билет стоит двадцать евро.
- product | n | ˈprɒdʌkt | ˈprɑːdʌkt | продукт, товар | something that is made and sold | This shop sells natural beauty *products*. | Этот магазин продаёт натуральную косметику.
- sell | v | sel |  | продавать | to give something in exchange for money | They *sell* fresh fish at the market. | На рынке продают свежую рыбу. | sell — sold — sold
- shopping | n | ˈʃɒpɪŋ | ˈʃɑːpɪŋ | покупки, шопинг | buying things in shops | I go *shopping* on Saturdays. | По субботам я хожу за покупками.
- welcome | v | ˈwelkəm |  | приветствовать, радушно принимать | to greet someone in a friendly way when they arrive | They *welcomed* us with tea and cake. | Они встретили нас чаем с тортом. | You're welcome. — Пожалуйста (в ответ на спасибо).
