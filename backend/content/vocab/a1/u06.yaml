title: "Languages and Customs"
title_ru: "Языки и обычаи"
words:
  - "apart | adv | əˈpɑːt | əˈpɑːrt | врозь, отдельно; на расстоянии | not together; at a distance from each other | The two houses are ten metres *apart*. | Два дома стоят в десяти метрах друг от друга."
  - "attribute | n | ˈætrɪbjuːt | | качество, черта | a quality that someone or something has | Patience is an important *attribute* for a teacher. | Терпение — важное качество учителя."
  - "bilingual | adj | baɪˈlɪŋɡwəl | | двуязычный | able to speak two languages very well | Their children are *bilingual* — they speak English and Spanish. | Их дети двуязычные — говорят по-английски и по-испански."
  - "completely | adv | kəmˈpliːtli | | полностью, совершенно | totally; in every way | I *completely* forgot about the meeting. | Я совершенно забыл о встрече."
  - "dash | v | dæʃ | | мчаться, бросаться | to run somewhere very quickly | She *dashed* to the station to catch the train. | Она помчалась на вокзал, чтобы успеть на поезд."
  - "disgust | n | dɪsˈɡʌst | | отвращение | a strong feeling that something is very unpleasant | He looked at the dirty kitchen with *disgust*. | Он с отвращением посмотрел на грязную кухню."
  - "fashionable | adj | ˈfæʃnəbl | | модный | popular at a particular time | Short jackets are very *fashionable* this year. | Короткие куртки в этом году очень модные."
  - "foreign | adj | ˈfɒrən | ˈfɔːrən | иностранный | from another country | Learning a *foreign* language takes time. | Изучение иностранного языка требует времени. | g не произносится"
  - "gulf | n | ɡʌlf | | залив | a large area of sea that is partly surrounded by land | The ship sailed into the *gulf* at sunrise. | На рассвете корабль вошёл в залив."
  - "mirror | n | ˈmɪrə | ˈmɪrər | зеркало | a piece of glass in which you can see yourself | She looked at herself in the *mirror*. | Она посмотрела на себя в зеркало."
  - "natural | adj | ˈnætʃrəl | | природный, естественный | made by nature, not by people; normal | This juice is completely *natural* — no sugar is added. | Этот сок полностью натуральный — сахар не добавлен."
  - "nowadays | adv | ˈnaʊədeɪz | | в наши дни | at the present time, compared with the past | *Nowadays*, almost everyone has a mobile phone. | В наши дни почти у всех есть мобильный телефон."
  - "participant | n | pɑːˈtɪsɪpənt | pɑːrˈtɪsɪpənt | участник | a person who takes part in something | Every *participant* in the race got a medal. | Каждый участник забега получил медаль."
  - "ritual | n | ˈrɪtʃuəl | | ритуал, обряд | a set of actions that people always do in the same way | Drinking tea at five is a daily *ritual* in our family. | Чай в пять часов — ежедневный ритуал в нашей семье."
  - "spoken | adj | ˈspəʊkən | ˈspoʊkən | устный, разговорный | said aloud, not written | My *spoken* English is better than my written English. | Мой разговорный английский лучше письменного."
  - "sport | n | spɔːt | spɔːrt | спорт; вид спорта | a game or activity that needs physical effort | Tennis is my favourite *sport*. | Теннис — мой любимый вид спорта."
  - "surprised | adj | səˈpraɪzd | sərˈpraɪzd | удивлённый | feeling that something is unexpected | I was *surprised* to see him at the party. | Я удивился, увидев его на вечеринке."
  - "tense | adj | tens | | напряжённый | nervous and not able to relax | Everyone felt *tense* before the results were announced. | Все были напряжены перед объявлением результатов."
  - "totally | adv | ˈtəʊtəli | ˈtoʊtəli | полностью, совсем | completely | I *totally* agree with you. | Я полностью с тобой согласен."
  - "vague | adj | veɪɡ | | смутный, неясный | not clear or exact | He gave me only a *vague* answer. | Он дал мне лишь расплывчатый ответ."
reading:
  title: "Twins in Two Countries"
  title_ru: "Близнецы в двух странах"
  text: |
    Ana and Sofia are twins. When they were babies, they looked completely the same, like a girl and her mirror. But when they were ten, their family moved, and the girls grew up apart. Ana stayed with their grandmother in Spain, and Sofia moved with their parents to a city on the Gulf of Mexico.

    Nowadays, both sisters are twenty years old. Sofia is bilingual. Her spoken English is natural and fast, and she loves fashionable clothes. Ana speaks only a little English. She studies sport at university and is a participant in many races.

    Last summer, Ana visited Sofia for the first time in many years. At the airport, she felt tense. Her memories of her sister were vague. But when Sofia dashed towards her, Ana was surprised: they still had the same smile!

    Everything in the foreign city was new for Ana. Some things she liked, but some she looked at with disgust, like the huge plates of fried food. The sisters also had different rituals: Ana always had a long lunch, but Sofia ate a sandwich at her desk.

    "We are totally different," said Sofia on the last day. "But our most important attribute is the same. We love each other."
  ru: |
    Ана и София — близнецы. Когда они были малышками, они выглядели совершенно одинаково, как девочка и её отражение в зеркале. Но когда им было десять, семья переехала, и девочки выросли вдали друг от друга. Ана осталась с бабушкой в Испании, а София с родителями переехала в город на берегу Мексиканского залива.

    Сейчас обеим сёстрам по двадцать лет. София двуязычная. По-английски она говорит естественно и быстро, а ещё она любит модную одежду. Ана говорит по-английски совсем немного. Она изучает спорт в университете и участвует во многих забегах.

    Прошлым летом Ана впервые за много лет приехала к Софии. В аэропорту она нервничала. Воспоминания о сестре были смутными. Но когда София бросилась к ней, Ана удивилась: улыбка у них всё ещё была одинаковая!

    Всё в чужом городе было для Аны новым. Кое-что ей нравилось, а на кое-что она смотрела с отвращением — например, на огромные тарелки жареной еды. А ещё у сестёр были разные ритуалы: Ана всегда долго обедала, а София ела бутерброд за рабочим столом.

    «Мы совершенно разные, — сказала София в последний день. — Но самое главное качество у нас общее. Мы любим друг друга».
