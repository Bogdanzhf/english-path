title: Everyday phrases
title_ru: Разговорные фразы
topic: phrases
words:
- in summer | phr |  |  | летом | during the summer | We swim in the lake *in summer*. | Летом мы купаемся в озере.
- in the centre | phr |  |  | в центре | in the middle part | The hotel is *in the centre* of the city. | Отель находится в центре города.
- in the country | phr |  |  | за городом, в деревне | in the countryside | My grandparents live *in the country*. | Мои бабушка и дедушка живут за городом.
- in the future | phr |  |  | в будущем | at a time that will come | *In the future*, I want to live by the sea. | В будущем я хочу жить у моря.
- in the morning | phr |  |  | утром | during the morning | I go running *in the morning*. | Утром я бегаю.
- in the north | phr |  |  | на севере | in the northern part | It's colder *in the north*. | На севере холоднее.
- in the past | phr |  |  | в прошлом, раньше | at a time before now | *In the past*, people wrote letters by hand. | Раньше люди писали письма от руки.
- in the street | phr |  |  | на улице | in a road in a town | I met my teacher *in the street*. | Я встретил своего учителя на улице.
- in the summer | phr |  |  | летом (этим, тем) | during the summer | We went to Greece *in the summer*. | Летом мы ездили в Грецию.
- in town | phr |  |  | в городе, в центре | in the town or city centre | Let's meet *in town*. | Давай встретимся в центре.
- it is important to do something | phr |  |  | важно (сделать что-либо) | it is necessary to do something | *It is important to* drink water. | Важно пить воду.
- it takes ... | phr |  |  | требуется, занимает (время) | used to say how much time is needed | *It takes* an hour to get there. | Дорога туда занимает час.
- kind of somebody/something | phr |  |  | вид, разновидность (чего-либо) | a type of | What *kind of* films do you like? | Какие фильмы ты любишь?
- know how | phr |  |  | знать как, уметь | to have the skill to do something | Do you *know how* to swim? | Ты умеешь плавать?
- last time | phr |  |  | в прошлый раз | the most recent occasion | *Last time* we met, you were a student. | В прошлый раз, когда мы виделись, ты был студентом.
- last year | phr |  |  | в прошлом году | the year before this one | We moved here *last year*. | Мы переехали сюда в прошлом году.
- learn how to do something | phr |  |  | научиться (что-то делать) | to get the skill of doing something | I want to *learn how to* cook. | Я хочу научиться готовить.
- listen to somebody/something | phr |  |  | слушать (кого-либо, что-либо) | to pay attention to sounds or someone speaking | I *listen to* music on the bus. | Я слушаю музыку в автобусе.
- live with somebody | phr |  |  | жить с кем-либо | to share a home with someone | I *live with* my sister. | Я живу с сестрой.
