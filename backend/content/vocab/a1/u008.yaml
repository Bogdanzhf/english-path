title: Food and drink
title_ru: Еда и напитки
topic: food
words:
- 'bread | n | bred |  | хлеб | a food made from flour, water and yeast and baked | Could you buy some *bread* on your way home? | Купишь хлеба по дороге домой? | неисчисляемое: a loaf of bread — буханка'
- butter | n | ˈbʌtə | ˈbʌtər | сливочное масло | a soft yellow food made from cream | I like bread with *butter*. | Я люблю хлеб с маслом.
- cake | n | keɪk |  | торт, пирожное | a sweet food baked from flour, eggs, sugar and butter | She made a chocolate *cake* for my birthday. | Она испекла шоколадный торт мне на день рождения.
- candy | n | ˈkændi |  | конфета, сладости (амер.) | sweet food made with sugar | Don't eat too much *candy*. | Не ешь слишком много сладкого. | британское — sweets
- chocolate | n | ˈtʃɒklət | ˈtʃɑːklət | шоколад | a sweet brown food made from cocoa | Would you like a piece of *chocolate*? | Хочешь кусочек шоколада?
- coke | n | kəʊk | koʊk | кола | a type of brown sweet fizzy drink | Can I have a *Coke*, please? | Можно мне колу?
- cookie | n | ˈkʊki |  | печенье | a small flat sweet cake | She baked chocolate *cookies*. | Она испекла шоколадное печенье. | британское — biscuit
- corn | n | kɔːn | kɔːrn | кукуруза; зерно | a tall plant with yellow seeds that you can eat | We had grilled *corn* at the picnic. | На пикнике мы ели жареную кукурузу.
- egg | n | eɡ |  | яйцо | an oval thing produced by a bird, used as food | I had two *eggs* for breakfast. | На завтрак я съел два яйца.
- ice cream | n | aɪs kriːm |  | мороженое | a sweet frozen food made from milk | Children love *ice cream*. | Дети любят мороженое.
- juice | n | dʒuːs |  | сок | the liquid from fruit or vegetables | A glass of orange *juice*, please. | Стакан апельсинового сока, пожалуйста.
- pepper | n | ˈpepə | ˈpepər | перец | a powder used to give food a hot taste; a red, green or yellow vegetable | Add some salt and *pepper*. | Добавь немного соли и перца.
- pizza | n | ˈpiːtsə |  | пицца | a flat round bread with tomato and cheese on top | Let's order a *pizza*! | Давай закажем пиццу!
- potato | n | pəˈteɪtəʊ | pəˈteɪtoʊ | картофель | a vegetable that grows under the ground | I like baked *potatoes*. | Я люблю печёный картофель. | мн. ч. potatoes
- salad | n | ˈsæləd |  | салат | a dish of raw vegetables | I'll have a green *salad*. | Мне зелёный салат.
- sandwich | n | ˈsændwɪtʃ | ˈsæmwɪtʃ | бутерброд, сэндвич | two pieces of bread with food between them | He made a ham *sandwich*. | Он сделал бутерброд с ветчиной.
- soup | n | suːp |  | суп | a liquid food made from vegetables, meat or fish | This tomato *soup* is delicious. | Этот томатный суп очень вкусный.
