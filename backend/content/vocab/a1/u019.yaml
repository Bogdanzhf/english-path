title: Numbers and quantity
title_ru: Числа и количество
topic: numbers
words:
- cent | n | sent |  | цент | a small coin; 1/100 of a dollar or euro | It costs ninety *cents*. | Это стоит девяносто центов.
- enough | det | ɪˈnʌf | iːˈnʌf | достаточно | as much as you need | We have *enough* food for everyone. | У нас достаточно еды для всех. | old enough — достаточно взрослый
- euro | n | ˈjɔːrəʊ | ˈjuːroʊ | евро | the money used in many European countries | The ticket costs ten *euros*. | Билет стоит десять евро.
- few | det | fjuː |  | мало, немного; несколько | not many; a small number | Very *few* people came to the meeting. | На собрание пришло очень мало людей. | a few — несколько; few — мало
- first | det | fɜːst | fɜːrst | первый; сначала | before all others | This is my *first* visit to Rome. | Это мой первый визит в Рим.
- five | num | faɪv |  | пять | the number 5 | I have *five* cousins. | У меня пять двоюродных братьев и сестёр.
- four | num | fɔː | fɔːr | четыре | the number 4 | A table has *four* legs. | У стола четыре ножки.
- half | n | hɑːf | hæf | половина | one of two equal parts | I'll be there in *half* an hour. | Я буду через полчаса. | l не произносится; мн. ч. halves
- kilometre | n | ˈkɪləmiːtə | ˌkɪˈlɔːmʌtər | километр | 1,000 metres | The school is two *kilometres* from here. | Школа в двух километрах отсюда. | американское — kilometer
- lot | n | lɒt | lɑːt | много (a lot, lots) | a large number or amount | I have a *lot* of homework. | У меня много домашней работы. | a lot of / lots of
- metre | n | ˈmiːtə | ˈmiːtər | метр | 100 centimetres | The pool is twenty-five *metres* long. | Бассейн длиной двадцать пять метров. | американское — meter
- million | num | ˈmɪljən |  | миллион | 1,000,000 | The city has three *million* people. | В городе три миллиона жителей. | three million (без -s), но millions of people
- most | det | məʊst | moʊs | больше всего; большинство | the largest number or amount | *Most* people like music. | Большинство людей любит музыку.
- much | det | mʌtʃ |  | много (с неисчисляемыми) | a large amount of | I don't have *much* time. | У меня не так много времени. | How much? — сколько?
- pair | n | peə | per | пара | two things of the same kind used together | I need a new *pair* of shoes. | Мне нужна новая пара обуви.
- quarter | n | ˈkwɔːtə | ˈkwɔːrtər | четверть | one of four equal parts | I'll meet you at a *quarter* past six. | Встретимся в четверть седьмого.
- 'second | adj | ˈsekənd |  | второй | coming after the first | My office is on the *second* floor. | Мой офис на втором (брит. — третьем) этаже. | также сущ.: second — секунда'
- seven | num | ˈsevn |  | семь | the number 7 | There are *seven* days in a week. | В неделе семь дней.
- six | num | sɪks |  | шесть | the number 6 | The shop opens at *six*. | Магазин открывается в шесть.
- ten | num | ten |  | десять | the number 10 | I can count to *ten* in French. | Я умею считать до десяти по-французски.
- third | num | θɜːd | θɜːrd | третий | coming after the second | It's his *third* trip to Japan. | Это его третья поездка в Японию.
- three | num | θriː |  | три | the number 3 | We have *three* children. | У нас трое детей.
- two | num | tuː |  | два | the number 2 | I have *two* sisters. | У меня две сестры.
