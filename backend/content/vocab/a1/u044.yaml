title: Technology
title_ru: Технологии
topic: tech
words:
- camera | n | ˈkæmərə |  | фотоаппарат, камера | a device for taking photos or making videos | Don't forget your *camera* — the views are amazing! | Не забудь фотоаппарат — виды потрясающие!
- CD | n | ˌsiˈdi | ˌsiːˈdiː | компакт-диск | a disc that stores music or information | I bought the band's new *CD*. | Я купил новый диск этой группы.
- CD player | n | ˌsiˈdi ˈpleɪə | ˌsiːˈdiː ˈpleɪər | CD-плеер | a machine that plays CDs | My old *CD player* still works. | Мой старый CD-плеер всё ещё работает.
- computer | n | kəmˈpjuːtə | kəmˈpjuːtər | компьютер | an electronic machine for storing and using information | I use a *computer* at work. | На работе я пользуюсь компьютером.
- DVD | n | ˌdiˌviˈdi | ˌdiːˌviːˈdiː | DVD-диск | a disc with films or information | Let's watch a *DVD* tonight. | Давай посмотрим вечером фильм на DVD.
- 'email | n | iˈmeɪl | iːˈmeɪl | электронная почта; письмо по e-mail | a message sent over the internet | I got your *email*. | Я получил твоё письмо. | также гл.: email me — напиши мне'
- 'information | n | ˌɪnfəˈmeɪʃən | ˌɪnfərˈmeɪʃən | информация, сведения | facts about something | I need more *information* about the course. | Мне нужно больше информации о курсе. | неисчисляемое: a piece of information'
- internet | n | ˈɪntənet | ˈɪntərnet | интернет | the network that connects computers around the world | I found the recipe on the *internet*. | Я нашёл рецепт в интернете.
- message | n | ˈmesɪdʒ |  | сообщение | a short piece of written or spoken information | I sent you a *message* this morning. | Я отправил тебе сообщение сегодня утром.
- mobile phone | n | ˈməʊbl fəʊn | ˈmoʊbl foʊn | мобильный телефон | a phone you can carry with you | I left my *mobile phone* at home. | Я оставил мобильный телефон дома. | американское — cell phone
- online | adj | ˈɒnlaɪn | ˈɔːnlaɪn | онлайн, в интернете | connected to the internet | I bought the tickets *online*. | Я купил билеты в интернете.
- 'phone | n | fəʊn | foʊn | телефон | a device you use to talk to someone far away | Can I use your *phone*? | Можно воспользоваться твоим телефоном? | также гл.: phone me — позвони мне'
- radio | n | ˈreɪdɪəʊ | ˈreɪdiːoʊ | радио | a device for listening to programmes | I listen to the *radio* in the car. | Я слушаю радио в машине.
- telephone | n | ˈtelɪfəʊn | ˈteləfoʊn | телефон | a phone | The *telephone* is ringing. | Звонит телефон.
- television | n | ˈtelɪvɪʒən | ˈteləvɪʒən | телевидение; телевизор | a device that shows programmes; the programmes on it | What's on *television* tonight? | Что сегодня по телевизору?
- TV | n | ˈtiˈvi | ˈtiːˈviː | телевизор, ТВ | television | Turn off the *TV*, please. | Выключи, пожалуйста, телевизор.
- video | n | ˈvɪdɪəʊ | ˈvɪdiːoʊ | видео | a recording of moving pictures | She posted a funny *video*. | Она выложила смешное видео.
- website | n | ˈwebsaɪt |  | веб-сайт | a place on the internet with information | Check our *website* for details. | Подробности на нашем сайте.
