reading:
  title: The Pizza Mystery
  title_ru: Загадка с пиццей
  text: |
    Leo earns money by delivering pizza in the evenings. He works for a small restaurant that his aunt manages. The restaurant is popular, and Leo delivers to more than thirty customers every night.

    One week, something strange occurred. Every evening, one pizza disappeared. Leo set all the boxes on his bike, but when he arrived, one box was always empty. Customers were angry. They had to pay the delivery charge, but they didn't receive their food. It was a real mystery.

    Leo was worried. "Maybe someone thinks I'm the thief," he said to his aunt. She comforted him. "I know you would never steal anything," she said. "Let's find the actual thief."

    The next evening, Leo hid a small camera in the box. He delivered the pizzas as usual. On the way, he stopped at the gate of a big house to check his phone map. Later, they watched the video and were amazed. When Leo stopped, a big white dog came out of the gate, opened a box with its nose and took the pizza!

    Leo contacted the owner of the dog, an old man who lived alone. He was very embarrassed and paid for all the pizzas, including the charges. As a reward for solving the mystery, Leo's aunt gave him a free meal. And the old man? He is now one of their best customers — he orders two pizzas: one for him and one for his dog.
  ru: |
    Лео зарабатывает по вечерам, доставляя пиццу. Он работает в маленьком ресторане, которым управляет его тётя. Ресторан популярный, и каждый вечер Лео развозит заказы более чем тридцати клиентам.

    Однажды на неделе случилось что-то странное. Каждый вечер пропадала одна пицца. Лео ставил все коробки на велосипед, но, когда он приезжал, одна коробка всегда оказывалась пустой. Клиенты злились. Им приходилось платить за доставку, а еду они не получали. Это была настоящая загадка.

    Лео переживал. «Может, кто-то думает, что вор — я», — сказал он тёте. Она его успокоила. «Я знаю, что ты никогда ничего не украдёшь, — сказала она. — Давай найдём настоящего вора».

    На следующий вечер Лео спрятал в коробке маленькую камеру. Он развозил пиццу, как обычно. По дороге он остановился у ворот большого дома, чтобы посмотреть карту в телефоне. Позже они посмотрели видео и изумились. Когда Лео остановился, из ворот вышла большая белая собака, открыла носом коробку и утащила пиццу!

    Лео связался с хозяином собаки — пожилым мужчиной, который жил один. Тому стало очень неловко, и он заплатил за все пиццы, включая плату за доставку. В награду за разгаданную загадку тётя угостила Лео бесплатным ужином. А пожилой мужчина? Теперь он один из их лучших клиентов — заказывает две пиццы: одну себе, а другую своей собаке.
  questions:
  - q: Who manages the restaurant?
    options:
    - Leo
    - Leo's aunt
    - An old man
    - Leo's mother
    answer: 1
  - q: What was the problem?
    options:
    - Leo's bike was stolen
    - One pizza disappeared every evening
    - Customers didn't pay
    - The restaurant closed
    answer: 1
  - q: Who was the thief?
    options:
    - A customer
    - Leo's friend
    - A big white dog
    - A cat
    answer: 2
  - tf: Leo's aunt thought that Leo stole the pizzas.
    answer: false
  - tf: The old man now orders two pizzas.
    answer: true
