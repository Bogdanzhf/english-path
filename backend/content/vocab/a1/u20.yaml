title: "Goals and Opinions"
title_ru: "Цели и мнения"
words:
  - "achieve | v | əˈtʃiːv | | достигать | to succeed in doing something after trying hard | She *achieved* her dream of becoming a doctor. | Она осуществила мечту стать врачом."
  - "advise | v | ədˈvaɪz | | советовать | to tell someone what you think they should do | The doctor *advised* me to rest. | Врач посоветовал мне отдохнуть. | сущ. advice [ədˈvaɪs] — совет"
  - "already | adv | ɔːlˈredi | | уже | before now or sooner than expected | I've *already* eaten, thanks. | Спасибо, я уже поел."
  - "basic | adj | ˈbeɪsɪk | | базовый, основной | simple and the most important | I know some *basic* Spanish phrases. | Я знаю несколько простых фраз на испанском."
  - "bit | n | bɪt | | кусочек, немного | a small piece or amount | Can I have a *bit* of your sandwich? | Можно кусочек твоего бутерброда? | a bit — немного: a bit tired"
  - "consider | v | kənˈsɪdə | kənˈsɪdər | рассматривать, обдумывать | to think carefully about something | We are *considering* moving to the coast. | Мы подумываем о переезде на побережье. | consider + -ing"
  - "destroy | v | dɪˈstrɔɪ | | разрушать, уничтожать | to damage something so badly that it cannot be used | The fire *destroyed* the old school. | Пожар уничтожил старую школу."
  - "entertain | v | ˌentəˈteɪn | ˌentərˈteɪn | развлекать | to do something that people enjoy watching or listening to | The clown *entertained* the children. | Клоун развлекал детей."
  - "extra | adj | ˈekstrə | | дополнительный, лишний | more than usual or more than needed | Take an *extra* jumper — it might be cold. | Возьми ещё один свитер — может быть холодно."
  - "goal | n | ɡəʊl | ɡoʊl | цель; гол | something you want to achieve; a point in football | My *goal* is to speak English fluently. | Моя цель — свободно говорить по-английски."
  - "lie | v | laɪ | | лгать | to say something that is not true | Don't *lie* to me — I know the truth. | Не ври мне — я знаю правду. | lie — lied — lied (лгать); lie — lay — lain (лежать)"
  - "meat | n | miːt | | мясо | the flesh of animals used as food | I don't eat *meat* — I'm a vegetarian. | Я не ем мяса — я вегетарианец."
  - "opinion | n | əˈpɪnjən | | мнение | what you think about something | In my *opinion*, this is the best film of the year. | По-моему, это лучший фильм года."
  - "real | adj | rɪəl | ˈriːəl | настоящий, реальный | existing; not imagined or false | Is that a *real* diamond? | Это настоящий бриллиант?"
  - "reflect | v | rɪˈflekt | | отражать | to send back light, heat or an image | The lake *reflected* the mountains like a mirror. | Озеро отражало горы, как зеркало."
  - "regard | v | rɪˈɡɑːd | rɪˈɡɑːrd | считать, рассматривать | to think about someone or something in a certain way | Everyone *regards* him as a hero. | Все считают его героем. | regard as"
  - "serve | v | sɜːv | sɜːrv | подавать (еду); обслуживать; служить | to give food or drink to someone; to work for | Breakfast is *served* from seven to ten. | Завтрак подают с семи до десяти."
  - "vegetable | n | ˈvedʒtəbl | | овощ | a plant you eat, like a carrot or potato | Eat your *vegetables*! | Ешь овощи!"
  - "war | n | wɔː | wɔːr | война | fighting between countries or large groups | My grandfather fought in the *war*. | Мой дедушка воевал на войне."
  - "worth | adj | wɜːθ | wɜːrθ | стоящий; стоимостью | having a certain value; good enough to do | This old painting is *worth* a lot of money. | Эта старая картина стоит больших денег. | be worth + -ing: worth seeing"
reading:
  title: "The King's New Cook"
  title_ru: "Новый повар короля"
  text: |
    Long ago, there was a rich king who only ate meat. He regarded vegetables as food for poor people. Every day, his cooks served him huge plates of beef, chicken and pork. But the king was always tired and ill. His doctors advised him to change his diet, but he did not listen.

    One day, a young girl named Clara came to the palace. "I want to be your cook," she said. "My goal is to make you healthy." The king laughed. "Many cooks have already tried," he said. "But I'll give you one week."

    Clara considered the problem carefully. She knew the king would never eat a plate of plain vegetables. So she decided to lie — just a little bit. She cooked basic vegetable dishes but made them look and smell like meat. She also added extra herbs and spices.

    The king loved the food. Each evening, Clara also entertained him with stories about her travels. After a week, the king looked in the mirror and was surprised. The mirror reflected a healthy, happy man.

    When Clara told him the truth, the king was not angry. "In my opinion, you have achieved something real," he said. "You are worth more than all my gold." He did not destroy her trust — he made her his chief cook. And people say that during his long life, the king never started a single war, because a healthy king is a calm king.
  ru: |
    Давным-давно жил богатый король, который ел только мясо. Овощи он считал пищей бедняков. Каждый день повара подавали ему огромные тарелки говядины, курицы и свинины. Но король всегда был уставшим и больным. Врачи советовали ему изменить рацион, но он их не слушал.

    Однажды во дворец пришла девушка по имени Клара. «Я хочу стать вашим поваром, — сказала она. — Моя цель — сделать вас здоровым». Король рассмеялся. «Многие повара уже пробовали, — сказал он. — Но я дам тебе неделю».

    Клара тщательно обдумала задачу. Она знала, что король никогда не станет есть тарелку простых овощей. Поэтому она решила солгать — совсем немного. Она готовила простые овощные блюда, но делала так, чтобы они выглядели и пахли как мясо. А ещё она добавляла побольше трав и специй.

    Королю еда очень нравилась. А по вечерам Клара развлекала его рассказами о своих путешествиях. Через неделю король посмотрел в зеркало и удивился. Зеркало отражало здорового, счастливого человека.

    Когда Клара рассказала ему правду, король не рассердился. «По-моему, ты добилась чего-то настоящего, — сказал он. — Ты стоишь больше, чем всё моё золото». Он не разрушил её доверие — он сделал её главным поваром. А люди говорят, что за всю свою долгую жизнь король не начал ни одной войны, потому что здоровый король — спокойный король.
  questions:
    - q: "What did the king think about vegetables?"
      options: ["They were delicious", "They were food for poor people", "They were too expensive", "They were good for health"]
      answer: 1
    - q: "What was Clara's goal?"
      options: ["To become rich", "To make the king healthy", "To marry the king", "To start a war"]
      answer: 1
    - q: "How did Clara make the king eat vegetables?"
      options: ["She told him the truth", "She made them look and smell like meat", "She asked the doctors", "She hid them in cakes"]
      answer: 1
    - tf: "The king was angry when he learned the truth."
      answer: false
    - tf: "Clara became the king's chief cook."
      answer: true
