title: Everyday phrases
title_ru: Разговорные фразы
topic: phrases
words:
- too much | phr |  |  | слишком много | more than is good or necessary | Don't eat *too much* sugar. | Не ешь слишком много сахара.
- town centre | phr |  |  | центр города | the main part of a town | The *town centre* is very busy on Saturdays. | По субботам в центре города много народу.
- TV show | phr |  |  | телешоу, передача | a programme on TV | It's my favourite *TV show*. | Это моя любимая телепередача.
- wait for somebody/something | phr |  |  | ждать (кого-либо, что-либо) | to stay until someone comes or something happens | I'm *waiting for* the bus. | Я жду автобус.
- welcome to something | phr |  |  | добро пожаловать в | used to greet someone arriving in a place | *Welcome to* London! | Добро пожаловать в Лондон!
- what about...? | phr |  |  | как насчёт…?; а как же…? | used to make a suggestion or ask about someone | *What about* a pizza tonight? | Как насчёт пиццы вечером?
- work as something | phr |  |  | работать кем-либо | to have a particular job | He *works as* a driver. | Он работает водителем.
- work for somebody/something | phr |  |  | работать на (в компании) | to be employed by | She *works for* a big company. | Она работает в крупной компании.
- work hard | phr |  |  | усердно работать, трудиться | to put in a lot of effort | You need to *work hard* to pass the exam. | Чтобы сдать экзамен, нужно усердно заниматься.
- work together | phr |  |  | работать вместе | to do something as a team | Let's *work together* on this project. | Давай поработаем над этим проектом вместе.
- work with somebody | phr |  |  | работать с кем-либо | to do your job together with someone | I *work with* very nice people. | Я работаю с очень приятными людьми.
- would like | phr |  |  | хотел бы | used to say politely what you want | I *would like* a cup of tea. | Я бы хотел чашку чая. | I'd like = I would like
- would you like...? | phr |  |  | не хотите ли…? | used to offer something politely | *Would you like* some cake? | Не хотите торта?
- x hours a day | phr |  |  | X часов в день | (a number of) hours every day | I work eight *hours a day*. | Я работаю восемь часов в день.
- x times a... | phr |  |  | X раз в… | (a number of) times in a period | I go to the gym three *times a* week. | Я хожу в спортзал три раза в неделю.
- x years ago | phr |  |  | X лет назад | (a number of) years before now | We met five *years ago*. | Мы познакомились пять лет назад.
- x years later | phr |  |  | X лет спустя | (a number of) years after something | Two *years later*, they got married. | Через два года они поженились.
- x years old | phr |  |  | X лет (о возрасте) | used to say someone's age | My son is six *years old*. | Моему сыну шесть лет.
- you're welcome | phr |  |  | пожалуйста (в ответ на «спасибо») | used to reply politely when someone thanks you | Thank you! — *You're welcome*. | Спасибо! — Пожалуйста.
