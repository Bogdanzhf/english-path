title: Work and jobs
title_ru: Работа и профессии
topic: work
words:
- actor | n | ˈæktə | ˈæktər | актёр | a person who acts in films or plays | He's a famous *actor*. | Он известный актёр.
- business | n | ˈbɪznəs |  | бизнес; дело, фирма | buying and selling things; a company | My uncle has his own *business*. | У моего дяди свой бизнес. | on business — по делам
- company | n | ˈkʌmpəni |  | компания, фирма | a business that makes or sells things | She works for a big software *company*. | Она работает в крупной компании по разработке ПО.
- doctor | n | ˈdɒktə | ˈdɑːktər | врач, доктор | a person whose job is to treat ill people | You should see a *doctor* about that cough. | Тебе стоит сходить к врачу с этим кашлем.
- farm | n | fɑːm | fɑːrm | ферма | land and buildings used to grow crops or keep animals | They live on a *farm*. | Они живут на ферме.
- farmer | n | ˈfɑːmə | ˈfɑːrmər | фермер | a person who owns or works on a farm | The *farmer* has fifty cows. | У фермера пятьдесят коров.
- interview | n | ˈɪntəvjuː | ˈɪntərvjuː | собеседование; интервью | a meeting where someone asks you questions | I have a job *interview* tomorrow. | Завтра у меня собеседование.
- interviewer | n | ˈɪntəvjuːə | ˈɪntərvjuːər | интервьюер; тот, кто проводит собеседование | a person who asks the questions in an interview | The *interviewer* asked about my experience. | Интервьюер спросил о моём опыте.
- job | n | dʒɒb | dʒɑːb | работа | the work you do to earn money | He got a *job* at the patent office. | Он устроился на работу в патентное бюро.
- machine | n | məˈʃiːn |  | машина, аппарат | a piece of equipment that does a job | A fridge is a *machine* that uses electricity. | Холодильник — это аппарат, работающий на электричестве.
- meeting | n | ˈmiːtɪŋ |  | встреча, собрание | when people come together to talk | I have a *meeting* with my boss at three. | В три у меня встреча с начальником.
- model | n | ˈmɒdl | ˈmɑːdl | модель; макет | a person who wears clothes for photos; a small copy | She works as a *model*. | Она работает моделью.
- nurse | n | nɜːs | nɜːrs | медсестра, медбрат | a person who looks after ill people in a hospital | The *nurse* gave me some water. | Медсестра дала мне воды.
- policeman | n | pəˈliːsmən |  | полицейский | a man who is a police officer | A *policeman* helped us. | Нам помог полицейский. | нейтрально — police officer
- singer | n | ˈsɪŋɜː | ˈsɪŋər | певец, певица | a person who sings | She is my favourite *singer*. | Она моя любимая певица.
- teacher | n | ˈtiːtʃə | ˈtiːtʃər | учитель | a person whose job is teaching | Our *teacher* is very kind. | Наш учитель очень добрый.
- waiter | n | ˈweɪtə | ˈweɪtər | официант | a man who brings food in a restaurant | The *waiter* brought our drinks. | Официант принёс наши напитки.
- waitress | n | ˈweɪtrəs |  | официантка | a woman who brings food in a restaurant | The *waitress* gave us the menu. | Официантка дала нам меню.
- worker | n | ˈwɜːkə | ˈwɜːrkər | работник, рабочий | a person who works | The factory has 200 *workers*. | На фабрике 200 рабочих.
- writer | n | ˈraɪtə | ˈraɪtər | писатель | a person who writes books | Tolstoy was a great *writer*. | Толстой был великим писателем.
