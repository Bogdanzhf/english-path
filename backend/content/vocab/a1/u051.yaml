title: Communication and language
title_ru: Общение и язык
topic: communication
words:
- agree | v | əˈɡriː |  | соглашаться | to think the same as another person | My sister and I *agree* that summer is the best season. | Мы с сестрой согласны, что лето — лучшее время года.
- 'answer | v | ˈɑːnsə | ˈænsər | отвечать | to say or write something when someone asks a question | Please *answer* the question. | Пожалуйста, ответьте на вопрос. | также сущ.: answer — ответ'
- ask | v | ɑːsk | æsk | спрашивать; просить | to say something to get an answer or help | Can I *ask* you a question? | Можно задать тебе вопрос? | ask for — просить что-то
- bye | interj | baɪ |  | пока | goodbye | *Bye*! See you tomorrow. | Пока! До завтра.
- call | v | kɔːl |  | звонить; звать; называть | to phone someone; to give a name | I'll *call* you later. | Я тебе позже позвоню.
- describe | v | dɪˈskraɪb |  | описывать | to say or write what someone or something is like | Can you *describe* the man you saw? | Можете описать мужчину, которого вы видели?
- 'discuss | v | dɪˈskʌs |  | обсуждать | to talk about something with other people | We need to *discuss* the plan. | Нам нужно обсудить план. | без about: discuss the problem'
- explain | v | ɪkˈspleɪn | ɪksˈpleɪn | объяснять | to make something clear | Can you *explain* this rule? | Можете объяснить это правило? | explain something to someone
- grammar | n | ˈɡræmə | ˈɡræmər | грамматика | the rules of a language | English *grammar* isn't very difficult. | Английская грамматика не очень сложная.
- introduce | v | ˌɪntrəˈdjuːs | ˌɪntrəˈduːs | представлять, знакомить | to tell people each other's names | Let me *introduce* my wife. | Позвольте представить мою жену.
- last name | n | lɑːst neɪm | læs neɪm | фамилия | your family name | What's your *last name*? | Какая у тебя фамилия?
- 'order | v | ˈɔːdə | ˈɔːrdər | заказывать; приказывать | to ask for food or goods | Are you ready to *order*? | Вы готовы сделать заказ? | также сущ.: order — заказ; порядок'
- question | n | ˈkwestʃən |  | вопрос | something you ask | Can I ask you a *question*? | Можно задать вопрос?
- repeat | v | rɪˈpiːt | riːˈpiːt | повторять | to say or do something again | Could you *repeat* that, please? | Можете повторить?
- say | v | seɪ |  | говорить, сказать | to tell someone something with words | What did she *say*? | Что она сказала? | say – said – said; say something (to someone)
- sentence | v | ˈsentəns |  | приговаривать | to officially give a punishment in court | He was *sentenced* to ten years in prison. | Его приговорили к десяти годам тюрьмы. | сущ. sentence — приговор; предложение
- speak | v | spiːk |  | говорить, разговаривать | to use your voice to talk; to know a language | Do you *speak* English? | Вы говорите по-английски? | speak – spoke – spoken
- spell | v | spel |  | писать или произносить по буквам | to say or write the letters of a word | How do you *spell* your name? | Как пишется твоё имя?
- statement | n | ˈsteɪtmənt |  | утверждение; заявление | something that someone says or writes officially | Is this *statement* true or false? | Это утверждение верно или неверно?
- talk | v | tɔːk |  | разговаривать | to speak with someone | We *talked* for hours on the phone. | Мы часами разговаривали по телефону. | talk to/with someone about something
- teach | v | tiːtʃ |  | учить, преподавать | to help someone learn | She *teaches* English at a school. | Она преподаёт английский в школе. | teach – taught – taught
- tell | v | tel |  | рассказывать; говорить (кому-то) | to give information to someone | *Tell* me about your family. | Расскажи мне о своей семье. | tell – told – told; tell someone something
- thank | v | θæŋk |  | благодарить | to say that you are grateful | I want to *thank* you for your help. | Хочу поблагодарить тебя за помощь.
