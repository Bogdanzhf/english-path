title: Actions and movement
title_ru: Действия и движение
topic: actions
words:
- arrive | v | əˈraɪv |  | прибывать, приезжать | to reach a place at the end of a trip | Our train will *arrive* in Rome at six o'clock. | Наш поезд прибудет в Рим в шесть часов. | arrive at (здание, станция), arrive in (город, страна)
- be | v | biː |  | быть, являться; находиться | used to say what or where someone is | I *am* a student. | Я студент. | am / is / are; was / were; been
- born | v | bɔːn | bɔːrn | рождённый (be born — родиться) | (be born) to start your life | I *was born* in 1995. | Я родился в 1995 году.
- cost | v | kɒst | kɔːst | стоить | to have a certain price | How much does this jacket *cost*? | Сколько стоит эта куртка? | cost — cost — cost
- dance | v | dɑːns | dæns | танцевать | to move your body to music | Do you want to *dance*? | Хочешь потанцевать?
- 'fly | v | flaɪ |  | летать, лететь | to move through the air | Birds *fly* south in winter. | Зимой птицы летят на юг. | fly – flew – flown; сущ.: муха'
- hear | v | hɪə | hɪr | слышать | to notice sounds with your ears | Can you *hear* the birds singing? | Ты слышишь, как поют птицы? | hear — heard — heard
- include | v | ɪnˈkluːd |  | включать (в себя) | to have something as a part | The price *includes* breakfast. | В стоимость входит завтрак.
- keep | v | kiːp |  | сохранять, оставаться | to stay in a particular state | Drink plenty of water to *keep* healthy. | Пейте больше воды, чтобы оставаться здоровым. | keep — kept — kept
- listen | v | ˈlɪsn |  | слушать | to pay attention to sounds or words | *Listen* to me carefully. | Слушай меня внимательно. | listen to; t не произносится
- look | v | lʊk |  | смотреть; выглядеть | to turn your eyes towards something; to seem | *Look* at this photo! | Посмотри на эту фотографию! | You look tired. — Ты выглядишь усталым.
- miss | v | mɪs |  | скучать; опаздывать (на транспорт); пропускать | to feel sad that someone is not there; to fail to catch | I *miss* my family. | Я скучаю по семье. | miss the bus — опоздать на автобус
- ride | v | raɪd |  | ехать верхом, кататься | to sit on a horse or a bike and control it as it moves | I learned to *ride* a bike when I was five. | Я научился кататься на велосипеде в пять лет. | ride — rode — ridden
- see | v | siː |  | видеть | to notice something with your eyes | I can't *see* without my glasses. | Без очков я ничего не вижу. | see — saw — seen
- send | v | send |  | посылать, отправлять | to make something go to another place | I'll *send* you an email. | Я пришлю тебе письмо. | send – sent – sent
- share | v | ʃeə | ʃer | делиться; делить | to give part of something to another person; to use together | Let's *share* the pizza. | Давай поделим пиццу.
- 'show | v | ʃəʊ | ʃoʊ | показывать | to let someone see something | *Show* me your photos! | Покажи мне свои фотографии! | также сущ.: шоу, передача'
- spend | v | spend |  | тратить; проводить (время) | to use money; to pass time | I *spend* a lot of money on books. | Я трачу много денег на книги. | spend – spent – spent
- swim | v | swɪm |  | плавать | to move through water using your arms and legs | Can you *swim*? | Ты умеешь плавать? | swim — swam — swum
- wait | v | weɪt |  | ждать | to stay somewhere until something happens | *Wait* for me — I'll be back in five minutes! | Подожди меня — я вернусь через пять минут! | wait for somebody
- walk | v | wɔːk |  | идти пешком, гулять | to move on foot | Let's *walk* to the park. | Давай пройдёмся до парка пешком. | l не произносится
- watch | v | wɒtʃ | wɑːtʃ | смотреть, наблюдать | to look at something for some time | We *watched* the sunset from the beach. | Мы смотрели на закат с пляжа. | watch TV, но see a film
