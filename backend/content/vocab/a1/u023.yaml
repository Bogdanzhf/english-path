title: Actions and movement
title_ru: Действия и движение
topic: actions
words:
- add | v | æd |  | добавлять; складывать | to put something with something else | *Add* some sugar to the tea. | Добавь в чай сахар.
- become | v | bɪˈkʌm |  | становиться | to start to be | She wants to *become* a doctor. | Она хочет стать врачом. | become – became – become
- begin | v | bɪˈɡɪn |  | начинать(ся) | to start | The lesson *begins* at nine. | Урок начинается в девять. | begin – began – begun
- 'break | v | breɪk |  | ломать, разбивать | to make something go into pieces or stop working | Be careful, don''t *break* the glass. | Осторожно, не разбей стакан. | break – broke – broken; сущ.: перерыв'
- 'change | v | tʃeɪndʒ |  | менять(ся); переодеваться | to become or make different | The weather *changes* quickly here. | Погода здесь быстро меняется. | также сущ.: change — перемена; сдача'
- climb | v | klaɪm |  | взбираться, подниматься | to go up something using your hands and feet | We *climbed* to the top of the hill. | Мы забрались на вершину холма. | b не произносится
- die | v | daɪ |  | умирать | to stop living | Plants *die* without water. | Растения погибают без воды. | dying — умирающий
- dig | v | dɪɡ |  | копать | to make a hole in the ground | The dog is *digging* in the garden again. | Собака опять копает в саду. | dig — dug — dug
- fill | v | fɪl |  | наполнять; заполнять | to make something full | *Fill* the glass with water. | Наполни стакан водой. | fill in a form — заполнить бланк
- finish | v | ˈfɪnɪʃ |  | заканчивать | to come to an end; to stop doing | I *finish* work at six. | Я заканчиваю работу в шесть.
- grow | v | ɡrəʊ | ɡroʊ | расти; выращивать | to become bigger; to make plants grow | My grandpa *grows* tomatoes. | Мой дедушка выращивает помидоры. | grow – grew – grown
- happen | v | ˈhæpən |  | случаться, происходить | to take place, especially without being planned | What *happened* to your arm? | Что случилось с твоей рукой?
- improve | v | ɪmˈpruːv |  | улучшать(ся) | to become or make better | Regular walking *improves* your health. | Регулярная ходьба улучшает здоровье.
- join | v | dʒɔɪn |  | присоединяться; вступать | to become a member; to come together with | Do you want to *join* us? | Хочешь присоединиться к нам?
- open | v | ˈəʊpən | ˈoʊpən | открывать | to move something so that it is no longer closed | Could you *open* the window, please? | Не могли бы вы открыть окно?
- prepare | v | prɪˈpeə | priːˈper | готовить(ся) | to make something ready | I need to *prepare* for the exam. | Мне нужно готовиться к экзамену.
- put | v | pʊt |  | класть, ставить | to move something to a place | *Put* your bag on the chair. | Положи сумку на стул. | put – put – put
- start | v | stɑːt | stɑːrt | начинать(ся) | to begin | The lesson *starts* at nine. | Урок начинается в девять.
- stay | v | steɪ |  | оставаться; останавливаться (в гостинице) | to not leave; to live somewhere for a short time | We *stayed* at a small hotel. | Мы остановились в маленькой гостинице.
- throw | v | θrəʊ | θroʊ | бросать | to send something through the air with your hand | *Throw* the ball to me! | Брось мне мяч! | throw — threw — thrown
- wake | v | weɪk |  | просыпаться; будить | to stop sleeping | I *wake* early every day. | Я рано просыпаюсь каждый день. | wake – woke – woken; чаще wake up
- wash | v | wɒʃ | wɑːʃ | мыть; стирать | to clean with water | I *wash* my car every week. | Я мою машину каждую неделю.
