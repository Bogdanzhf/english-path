title: Events and situations
title_ru: События и ситуации
topic: events
words:
- action | n | ˈækʃən |  | действие; поступок; боевик (о фильме) | something you do | We need to take *action* now. | Нам нужно действовать сейчас. | action film — боевик
- beginning | n | bɪˈɡɪnɪŋ |  | начало | the first part of something | I didn't understand the *beginning* of the film. | Я не понял начало фильма.
- end | v | end |  | заканчивать(ся) | to finish or stop | The film *ends* at ten o'clock. | Фильм заканчивается в десять часов. | сущ. the end — конец
- fire | n | ˈfaɪə | ˈfaɪər | огонь; пожар | flames that burn things | Don't play with *fire*. | Не играй с огнём.
- life | n | laɪf |  | жизнь | the time when a person is alive; the way someone lives | He spent his whole *life* in this town. | Он прожил в этом городе всю жизнь. | мн. ч. lives
- mistake | n | mɪˈsteɪk |  | ошибка | something that is wrong | Everybody makes *mistakes*. | Все совершают ошибки. | make a mistake
- pardon | v | ˈpɑːdn | ˈpɑːrdn | прощать; помиловать | to forgive; to officially let a prisoner go free | The president *pardoned* the prisoner. | Президент помиловал заключённого. | Pardon? — Простите, что вы сказали?
- situation | n | ˌsɪtʃuːˈeɪʃən |  | ситуация, положение | the things that are happening at a time | It's a difficult *situation*. | Это сложная ситуация.
- success | n | səkˈses |  | успех | achieving what you wanted | The new treatment was a great *success*. | Новое лечение имело большой успех.
- thing | n | θɪŋ |  | вещь, предмет; дело | an object; a fact or event | What's that *thing* on the table? | Что это за штука на столе?
- time | n | taɪm |  | время; раз | minutes, hours, days; an occasion | What *time* is it? | Который час? | three times — три раза
reading:
  title: New Year Far from Home
  title_ru: Новый год вдали от дома
  text: |
    Ivan is from Russia, but this year he studies art at a university in London. In December, he felt very sad. For the first time in his life, he could not be at home with his family for New Year.

    In Russia, New Year is the biggest holiday of the year. Families decorate a green tree, wear their best clothes and have a big dinner together. At midnight, everyone makes a wish, and then people exchange presents. The holidays last until the seventh of January, when there is another celebration — Christmas.

    Ivan's friends at the university wanted to help him. There were students from seven different countries in his group. They decided to start a new tradition: an international New Year dinner. Everyone cooked a dish from their home country. Ivan made a big salad with red beetroot.

    The students booked a room in the university and invited people from the local community. More than forty people came. They told stories about holidays in their countries and played music. At midnight, they all made wishes together, the Russian way.

    When the party ended, Ivan called his family. "I miss you," he said. "But I'm not alone. I have a second family here."
  ru: |
    Иван из России, но в этом году он изучает искусство в университете в Лондоне. В декабре ему стало очень грустно. Впервые в жизни он не мог встретить Новый год дома с семьёй.

    В России Новый год — главный праздник года. Семьи наряжают зелёную ёлку, надевают лучшую одежду и устраивают большой ужин вместе. В полночь все загадывают желание, а потом обмениваются подарками. Праздники длятся до седьмого января, когда наступает ещё один праздник — Рождество.

    Друзья Ивана по университету захотели ему помочь. В его группе учились студенты из семи разных стран. Они решили начать новую традицию — международный новогодний ужин. Каждый приготовил блюдо своей страны. Иван сделал большой салат с красной свёклой.

    Студенты забронировали зал в университете и пригласили людей из местного сообщества. Пришло больше сорока человек. Они рассказывали о праздниках в своих странах и играли музыку. В полночь все вместе загадали желания — по-русски.

    Когда праздник закончился, Иван позвонил семье. «Я скучаю по вам, — сказал он. — Но я не один. Здесь у меня вторая семья».
  questions:
  - q: What does Ivan study in London?
    options:
    - History
    - Art
    - Music
    - Cooking
    answer: 1
  - q: When is Christmas in Russia?
    options:
    - On the 25th of December
    - On the 1st of January
    - On the 7th of January
    - In February
    answer: 2
  - q: What did Ivan cook for the dinner?
    options:
    - A cake
    - A salad with red beetroot
    - Soup
    - Chicken
    answer: 1
