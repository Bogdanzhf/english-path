title: Places and the city
title_ru: Город и места
topic: city
words:
- bookstore | n | ˈbʊkstɔː | ˈbʊkstɔːr | книжный магазин (амер.) | a shop that sells books | I bought this novel at a *bookstore*. | Я купил этот роман в книжном магазине. | британское — bookshop
- door | n | dɔː | dɔːr | дверь | the thing you open to go into a room or a building | Please close the *door* behind you. | Пожалуйста, закройте за собой дверь.
- front | n | frʌnt |  | передняя часть, перед | the side that faces forward | Let's sit at the *front*. | Давай сядем впереди. | in front of — перед
- garden | n | ˈɡɑːdn | ˈɡɑːrdn | сад | an area next to a house where plants grow | We grow tomatoes in our *garden*. | Мы выращиваем помидоры в саду.
- hometown | n | ˈhəʊmtaʊn | ˈhoʊmtaʊn | родной город | the town where you were born or grew up | My *hometown* is very small. | Мой родной город очень маленький.
- left | n | left |  | левая сторона, лево | the side opposite to right | The bank is on the *left*. | Банк слева. | turn left — повернуть налево
- north | n | nɔːθ | nɔːrθ | север | the direction to your left when you face the sunrise | We drove to the *north* of Italy. | Мы поехали на север Италии.
- office | n | ˈɒfɪs | ˈɔːfɪs | офис, контора | a room or building where people work at desks | My *office* is on the third floor. | Мой офис на третьем этаже.
- road | n | rəʊd | roʊd | дорога | a hard surface for cars to travel on | Be careful when you cross the *road*. | Будь осторожен, переходя дорогу.
- shop | v | ʃɒp | ʃɑːp | делать покупки | to go to shops to buy things | I love *shopping* for clothes. | Я обожаю ходить по магазинам за одеждой. | go shopping
- south | n | saʊθ |  | юг | the direction opposite to north | Birds fly *south* in winter. | Зимой птицы летят на юг.
- street | n | striːt |  | улица | a road in a town with buildings along it | They live on a quiet *street*. | Они живут на тихой улице.
- supermarket | n | ˈsuːpəmɑːkɪt | ˈsuːpərmɑːrkɪt | супермаркет | a large shop that sells food and other things | I buy food at the *supermarket*. | Я покупаю продукты в супермаркете.
- town | n | taʊn |  | город (небольшой) | a place with houses and shops, smaller than a city | I grew up in a small *town*. | Я вырос в маленьком городке.
- wall | n | wɔːl |  | стена | one of the sides of a room or building | There's a picture on the *wall*. | На стене висит картина.
- west | n | west |  | запад | the direction where the sun goes down | The sun sets in the *west*. | Солнце садится на западе.
- window | n | ˈwɪndəʊ | ˈwɪndoʊ | окно | an opening in a wall with glass | Can you open the *window*? | Можешь открыть окно?
