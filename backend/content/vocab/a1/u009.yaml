title: Actions and movement
title_ru: Действия и движение
topic: actions
words:
- check | v | tʃek |  | проверять; консультироваться | to look at something to make sure it is correct or safe; to ask someone | *Check* with your doctor before starting a new diet. | Посоветуйтесь с врачом, прежде чем начинать новую диету.
- cut | v | kʌt |  | резать; стричь | to divide something with a knife or scissors | Can you *cut* the bread, please? | Можешь нарезать хлеб? | cut – cut – cut
- do | v | du | duː | делать | to perform an action | What are you *doing*? | Что ты делаешь? | do – did – done; do homework, do sport
- face | v | feɪs |  | сталкиваться с; смотреть в лицо | to deal with a difficult situation | Women still *face* many barriers at work. | Женщины всё ещё сталкиваются с множеством барьеров на работе.
- find | v | faɪnd |  | находить | to see or get something you were looking for | I can't *find* my keys. | Не могу найти ключи. | find – found – found
- find out | phr |  |  | узнать, выяснить | to get information about something | I want to *find out* the truth. | Я хочу узнать правду.
- get | v | ɡet |  | получать; становиться; добираться | to receive something; to become; to arrive | I *got* a letter from my friend. | Я получил письмо от друга. | get – got – got; get tired, get home
- get up | phr |  |  | вставать (с постели) | to get out of bed | I *get up* at seven. | Я встаю в семь.
- give | v | ɡɪv |  | давать; дарить | to put something in someone's hand; to make a present | She *gave* me a book. | Она подарила мне книгу. | give – gave – given
- grow up | phr |  |  | вырастать, взрослеть | to become an adult | I *grew up* in a small town. | Я вырос в маленьком городе.
- help | v | help |  | помогать | to make things easier for someone | Can you *help* me carry these bags? | Поможешь донести эти сумки?
- let | v | let |  | позволять, разрешать | to allow someone to do something | My parents *let* me stay up late. | Родители разрешают мне ложиться поздно. | let's go — давай пойдём
- look for somebody/something | phr |  |  | искать | to try to find someone or something | I'm *looking for* my glasses. | Я ищу свои очки.
- lose | v | luːz |  | терять | to no longer have something | Many young people are *losing* their grandparents' language. | Многие молодые люди теряют язык своих бабушек и дедушек. | lose — lost — lost
- make | v | meɪk |  | делать, изготавливать; готовить | to produce or create something | She *makes* tea every morning. | Она каждое утро заваривает чай. | make – made – made; make a cake, make friends
- return | v | rɪˈtɜːn | riːˈtɜːrn | возвращаться; возвращать | to come or go back; to give something back | We *returned* home late. | Мы вернулись домой поздно.
- stand | v | stænd |  | стоять | to be on your feet | We had to *stand* for the whole journey. | Нам пришлось стоять всю дорогу. | stand — stood — stood; can't stand — терпеть не могу
- 'stop | v | stɒp | stɑːp | останавливать(ся); прекращать | to not move or not continue | The bus *stops* here. | Автобус останавливается здесь. | also n: bus stop — остановка'
- take | v | teɪk |  | брать; занимать (время); ехать на | to get something in your hands; to use a bus, train | *Take* an umbrella — it's raining. | Возьми зонт — идёт дождь. | take – took – taken; take a bus
- try | v | traɪ |  | пытаться; пробовать | to make an effort to do something; to test something | *Try* this cake! | Попробуй этот торт!
- turn | v | tɜːn | tɜːrn | поворачивать(ся) | to move in a different direction | *Turn* left at the bank. | Поверните налево у банка. | turn on / off — включить / выключить
- use | v | juːz |  | использовать, пользоваться | to do something with a thing for a purpose | Can I *use* your phone? | Можно воспользоваться твоим телефоном?
- wake up | phr |  |  | просыпаться; будить | to stop sleeping | I *woke up* at six. | Я проснулся в шесть.
