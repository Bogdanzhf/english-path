reading:
  title: The Night Nurse
  title_ru: Ночная медсестра
  text: |
    Mark worked as a clerk in a small office. His job was easy, but he did not enjoy it. He wanted a career where he could help people. So, at the age of thirty, he decided to study to become a nurse. It took a lot of effort, but three years later, he finished his course with excellent grades.

    Now Mark works at night in a big hospital. His job appears simple, but it is not. He looks after various patients: old people, children, people in pain and people after an operation. He often has to hurry from one room to another.

    One night, a young man entered the hospital. He had a terrible pain in his head, but he refused to stay. "I'm fine," he said. "I just want to go home." Mark sensed that something was wrong. He asked him to wait and informed the doctor.

    The doctor quickly located the problem: there was a small bleed in the man's brain. Without an operation, he could die. The man stayed, and the operation was a success.

    A week later, the young man came back to thank Mark. "You're a hero," he said. Mark smiled. "I'm not a hero," he said, though he felt very proud. "I just listen to my patients. That's the base of my job." Then he left to start his night shift.
  ru: |
    Марк работал клерком в маленьком офисе. Работа была лёгкой, но не приносила ему радости. Он хотел такую карьеру, где можно помогать людям. Поэтому в тридцать лет он решил выучиться на медбрата. Это потребовало больших усилий, но через три года он окончил курс с отличными оценками.

    Теперь Марк работает по ночам в большой больнице. Его работа кажется простой, но это не так. Он ухаживает за самыми разными пациентами: пожилыми людьми, детьми, людьми с болями и людьми после операции. Ему часто приходится спешить из одной палаты в другую.

    Однажды ночью в больницу вошёл молодой человек. У него ужасно болела голова, но он отказывался оставаться. «Я в порядке, — говорил он. — Я просто хочу домой». Марк почувствовал, что что-то не так. Он попросил его подождать и сообщил врачу.

    Врач быстро нашёл причину: в мозге у мужчины было небольшое кровоизлияние. Без операции он мог умереть. Мужчина остался, и операция прошла успешно.

    Через неделю молодой человек вернулся поблагодарить Марка. «Вы герой», — сказал он. Марк улыбнулся. «Я не герой, — сказал он, хотя и почувствовал большую гордость. — Я просто слушаю своих пациентов. Это основа моей работы». И он ушёл на ночную смену.
