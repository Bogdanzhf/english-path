title: 'Describing: time and age'
title_ru: 'Описание: время, новизна, возраст'
topic: describing
words:
- cheap | adj | tʃiːp |  | дешёвый | not costing much | This shirt was very *cheap*. | Эта рубашка была очень дешёвой.
- 'early | adj | ˈɜːli | ˈɜːrli | ранний; рано | before the usual time | I''m an *early* riser. | Я рано встаю. | также нар.: get up early — рано вставать'
- even | adv | ˈiːvən | ˈiːvɪn | даже | used to show something is surprising | *Even* my grandmother uses a smartphone. | Даже моя бабушка пользуется смартфоном.
- exciting | adj | ɪkˈsaɪtɪŋ |  | захватывающий, волнующий | making you feel excited | The match was very *exciting*. | Матч был очень захватывающим. | excited — взволнованный (о человеке)
- expensive | adj | ɪkˈspensɪv |  | дорогой | costing a lot of money | London is a very *expensive* city. | Лондон — очень дорогой город.
- fantastic | adj | fænˈtæstɪk |  | фантастический, потрясающий | extremely good | We had a *fantastic* holiday! | Отпуск был потрясающим!
- favourite | adj | ˈfeɪvrɪt | ˈfeɪvərɪt | любимый | liked more than others | Pizza is my *favourite* food. | Пицца — моя любимая еда. | американское — favorite
- final | adj | ˈfaɪnl |  | последний, окончательный | last | This is your *final* chance. | Это твой последний шанс.
- 'fine | adj | faɪn |  | хороший; в порядке | good; well | I''m *fine*, thanks. | Я в порядке, спасибо. | также сущ.: fine — штраф'
- high | adj | haɪ |  | высокий (по уровню) | greater than usual in amount or level | This cereal is *high* in sugar. | В этих хлопьях много сахара.
- late | adj | leɪt |  | поздний; опоздавший | after the usual or right time | Sorry I'm *late*! | Извините за опоздание!
- later | adv | ˈleɪtə | ˈleɪtər | позже, потом | after now or after another time | I'll call you *later*. | Я позвоню тебе позже.
- modern | adj | ˈmɒdn | ˈmɑːdərn | современный | new; of the present time | They live in a *modern* flat with big windows. | Они живут в современной квартире с большими окнами.
- new | adj | njuː |  | новый | not old; just made or bought | I like your *new* jacket. | Мне нравится твоя новая куртка.
- old | adj | əʊld | oʊld | старый; пожилой | having lived or existed for a long time | My grandfather is very *old*. | Мой дедушка очень пожилой. | How old are you? — Сколько тебе лет?
- 'past | n | pɑːst | pæst | прошлое | the time before now | In the *past*, people didn''t have phones. | Раньше у людей не было телефонов. | также предл.: half past five — половина шестого'
- real | adj | rɪəl | ˈriːəl | настоящий, реальный | existing; not imagined or false | Is that a *real* diamond? | Это настоящий бриллиант?
- same | adj | seɪm |  | тот же самый, одинаковый | not different | We live in the *same* street. | Мы живём на одной улице. | the same as — такой же, как
- sure | adj | ʃɔː | ʃʊr | уверенный | certain | Are you *sure*? | Ты уверен? | Sure! — Конечно!
- terrible | adj | ˈterəbl |  | ужасный | very bad | The food at that hotel was *terrible*. | Еда в том отеле была ужасной.
