title: Home and everyday life
title_ru: Дом и быт
topic: home
words:
- apartment | n | əˈpɑːtmənt | əˈpɑːrtmənt | квартира | a set of rooms for living in, in a larger building | Their *apartment* is on the fifth floor. | Их квартира на пятом этаже. | брит. flat
- bathroom | n | ˈbɑːθruːm | ˈbæθruːm | ванная комната | a room with a bath or shower | The *bathroom* is on the left. | Ванная слева. | в США — также туалет
- bedroom | n | ˈbedruːm |  | спальня | a room for sleeping in | Our flat has two *bedrooms*. | В нашей квартире две спальни.
- centre | n | ˈsentə | ˈsentər | центр | the middle of something | There's a fountain in the *centre* of the square. | В центре площади фонтан. | американское — center
- chair | n | tʃeə | tʃer | стул | a seat for one person with a back and four legs | Sit on this *chair*. | Садись на этот стул.
- classroom | n | ˈklɑːsruːm | ˈklæsruːm | класс, учебная комната | a room in a school where lessons happen | The *classroom* is on the first floor. | Класс на втором этаже.
- colour | n | ˈkʌlə | ˈkʌlər | цвет | red, blue, green, etc. | What's your favourite *colour*? | Какой твой любимый цвет? | американское — color
- cup | n | kʌp |  | чашка | a small container for hot drinks | Would you like a *cup* of tea? | Хотите чашку чая?
- dining room | n | ˈdaɪnɪŋ ruːm |  | столовая (комната) | a room where people eat meals | We eat in the *dining room* on Sundays. | По воскресеньям мы едим в столовой.
- dish | n | dɪʃ |  | блюдо; тарелка | food prepared in a particular way; a plate | Paella is a traditional Spanish *dish*. | Паэлья — традиционное испанское блюдо. | wash the dishes — мыть посуду
- house | n | haʊs |  | дом | a building where people live | They bought a new *house*. | Они купили новый дом.
- kitchen | n | ˈkɪtʃən |  | кухня | a room where you cook food | Mum is in the *kitchen*. | Мама на кухне.
- library | n | ˈlaɪbrəri | ˈlaɪbreri | библиотека | a place where you can read or borrow books | I go to the *library* every Saturday. | Я хожу в библиотеку каждую субботу.
- living room | n | ˈlɪvɪŋ ruːm |  | гостиная | the main room in a house for relaxing | We watch TV in the *living room*. | Мы смотрим телевизор в гостиной.
- piece | n | piːs |  | кусок; штука | a part of something | Would you like a *piece* of cake? | Хочешь кусочек торта? | a piece of paper — листок бумаги
- room | n | ruːm |  | комната; место | a part of a house with walls; space | My *room* is small but cosy. | Моя комната маленькая, но уютная.
- shower | n | ˈʃaʊɜː | ˈʃaʊər | душ | a device that sprays water to wash your body | I have a *shower* every morning. | Я принимаю душ каждое утро.
- sofa | n | ˈsəʊfə | ˈsoʊfə | диван | a long soft seat for two or more people | The dog is sleeping on the *sofa*. | Собака спит на диване.
- toilet | n | ˈtɔɪlət |  | туалет; унитаз | a room with a toilet; the bowl you use there | Where is the *toilet*, please? | Где здесь туалет?
