title: Place and direction
title_ru: Место и направление
topic: place
words:
- above | prep | əˈbʌv |  | над, выше | higher than something | There is a lamp *above* the table. | Над столом висит лампа.
- across | prep | əˈkrɒs | əˈkrɔːs | через, поперёк | from one side to the other side | We swam *across* the river. | Мы переплыли реку.
- around | prep | əˈraʊnd | əˈraʊn | вокруг; по | on every side of; in different parts of | We walked *around* the lake. | Мы прошлись вокруг озера.
- away | adv | əˈweɪ |  | прочь; далеко; в отъезде | to or at a distance | Go *away*! | Уходи! | far away — далеко
- behind | prep | bɪˈhaɪnd |  | позади, за | at the back of | The car park is *behind* the hotel. | Парковка за отелем.
- below | prep | bɪˈləʊ | biːˈloʊ | под, ниже | at a lower level than | The temperature is *below* zero. | Температура ниже нуля.
- between | prep | bɪˈtwiːn | biːtˈwiːn | между | in the space that separates two things | The bank is *between* the café and the shop. | Банк между кафе и магазином.
- down | adv | daʊn |  | вниз | to a lower place | Sit *down*, please. | Садитесь, пожалуйста.
- downstairs | adv | ˈdaʊnˈstez | ˈdaʊnˈsterz | внизу; вниз (по лестнице) | on or to a lower floor | Breakfast is ready — come *downstairs*! | Завтрак готов — спускайся!
- far | adv | fɑː | fɑːr | далеко | at a long distance | Is the station *far* from here? | Вокзал далеко отсюда? | far — farther/further — the farthest/furthest
- here | adv | ˈhiə | hiːr | здесь, тут; сюда | in or to this place | Come *here*! | Иди сюда!
- near | prep | ˈniə | nɪr | рядом с, около | not far from | I live *near* the station. | Я живу рядом с вокзалом.
- opposite | n | ˈɒpəzɪt | ˈɑːpəzət | противоположность | a thing that is completely different from another | Hot is the *opposite* of cold. | Горячий — противоположность холодного. | предлог opposite — напротив
- out | adv | aʊt |  | наружу; вне (дома) | away from the inside of a place | Let's go *out* tonight. | Давай сходим куда-нибудь вечером.
- outside | adv | ˈaʊtˈsaɪd |  | снаружи, на улице | not inside a building | The children are playing *outside*. | Дети играют на улице.
- over | prep | ˈəʊvə | ˈoʊvər | над; через; больше | above; across; more than | A plane flew *over* the house. | Над домом пролетел самолёт.
- there | adv | ðeə | ðer | там; туда | in or to that place | Put the box over *there*. | Поставь коробку вон туда. | there is / there are — есть, имеется
- through | prep | θruː |  | через, сквозь | from one side to the other side of | The train goes *through* a tunnel. | Поезд проходит через туннель.
- under | prep | ˈʌndə | ˈʌndər | под | below something | The cat is *under* the table. | Кошка под столом.
- up | adv | ʌp |  | вверх, наверх | to a higher place | Look *up*! | Посмотри наверх! | stand up — встать
- upstairs | adv | əpˈstez | əpˈsterz | наверху; наверх (по лестнице) | on or to a higher floor | My bedroom is *upstairs*. | Моя спальня наверху.
