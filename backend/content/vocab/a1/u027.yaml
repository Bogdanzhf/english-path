title: Function words
title_ru: Служебные слова
topic: grammar
words:
- as | prep | æz |  | как, в качестве | in the role of; like | She works *as* a nurse. | Она работает медсестрой.
- at | prep | æt |  | в, на, у (о месте); в (о времени) | used for a place or an exact time | Meet me *at* the station at five. | Встретимся на вокзале в пять. | at home, at night, at 5 o'clock
- by | prep | baɪ |  | у, возле; на (транспорте); к (сроку) | near; using; not later than | We went there *by* bus. | Мы поехали туда на автобусе.
- can | n | kæn |  | банка (жестяная) | a metal container for food or drink | He opened a *can* of cola. | Он открыл банку колы. | гл. can — мочь, уметь
- "cannot | v | kæn\x01ːt | ˈkænɑːt | не мочь, не уметь | the negative form of can | I *cannot* swim. | Я не умею плавать. | сокращённо can't"
- could | v | kʊd |  | мог, умел; не могли бы вы… | past of can; used to ask politely | *Could* you help me, please? | Не могли бы вы мне помочь?
- else | adv | els |  | ещё, кроме | other; more | Do you want anything *else*? | Хочешь чего-нибудь ещё? | someone else, something else, where else
- for | prep | fɔː | fɔːr | для; в течение | intended to be given to; used to show a length of time | This present is *for* you. | Этот подарок для тебя. | for two hours — в течение двух часов
- from | prep | frɒm | frʌm | из, от, с | showing where someone or something starts | This letter is *from* my aunt in Canada. | Это письмо от моей тёти из Канады.
- have to | v | hæv tuː |  | быть должным, приходиться | to need to do something | I *have to* get up early tomorrow. | Мне завтра нужно рано вставать. | don't have to — не обязательно
- into | prep | ˈɪntʊ | ˈɪntuː | в (движение внутрь) | moving to the inside of | She went *into* the shop. | Она вошла в магазин.
- must | v | mʌst |  | должен, обязан | used to say that something is necessary | You *must* wear a seat belt. | Ты должен пристегнуться. | mustn't — нельзя
- of | prep | ɒv | ʌv | (родительный падеж) из, о | belonging to; made from; containing | I would like a cup *of* tea. | Я бы хотел чашку чая. | the name of the street — название улицы
- should | v | ʃʊd |  | следует, стоит | used to give advice | You *should* see a doctor. | Тебе стоит сходить к врачу.
- than | conj | ðən | ðæn | чем (при сравнении) | used to compare things | My brother is taller *than* me. | Мой брат выше меня.
- 'to | prep | tuː |  | в, к, до | in the direction of; until | I''m going *to* the bank. | Я иду в банк. | также частица: to go — идти'
- will | v | wɪl |  | (вспом. глагол будущего времени) | used to talk about the future | I *will* call you tomorrow. | Я позвоню тебе завтра. | сокращённо 'll; won't = will not
- with | prep | wɪð |  | с | together; using | I live *with* my parents. | Я живу с родителями.
- would | v | wʊd |  | (вспом. глагол условного наклонения) бы | used to talk about imagined situations; used in polite requests | I *would* like a cup of tea. | Я бы хотел чашку чая. | I'd like = I would like
