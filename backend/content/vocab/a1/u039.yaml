title: Free time and sport
title_ru: Досуг и спорт
topic: leisure
words:
- activity | n | ækˈtɪvɪti | ækˈtɪvəti | занятие, деятельность | something you do for fun or work | Swimming is my favourite *activity*. | Плавание — моё любимое занятие.
- ball | n | bɔːl |  | мяч | a round object used in games | The dog ran after the *ball*. | Собака побежала за мячом.
- cinema | n | ˈsɪnəmə |  | кино, кинотеатр | a building where films are shown; films as an art | French *cinema* is famous worldwide. | Французское кино известно во всём мире. | амер. movie theater
- club | n | klʌb |  | клуб; секция | a group of people with the same interest; a place for dancing | I'm in the school chess *club*. | Я хожу в школьный шахматный клуб.
- dancer | n | ˈdɑːnsə | ˈdænsər | танцор, танцовщица | a person who dances | She is a ballet *dancer*. | Она балерина.
- dancing | n | ˈdɑːnsɪŋ | ˈdænsɪŋ | танцы | moving to music | I love *dancing*. | Я обожаю танцевать.
- doll | n | dɒl | dɑːl | кукла | a toy that looks like a small person | My daughter has a lot of *dolls*. | У моей дочери много кукол.
- event | n | ɪˈvent |  | событие, мероприятие | something important that happens | The concert was the biggest *event* of the year. | Концерт стал главным событием года.
- football | n | ˈfʊtbɔːl |  | футбол | a game where two teams kick a ball and try to score goals | We play *football* in the park every Sunday. | По воскресеньям мы играем в футбол в парке. | в США football — американский футбол, а футбол — soccer
- game | n | ɡeɪm |  | игра; матч | an activity with rules that people play to win | Chess is a *game* for two players. | Шахматы — игра для двоих.
- guitar | n | ɡɪˈtɑː | ɡɪˈtɑːr | гитара | a musical instrument with six strings | He plays the *guitar* in a band. | Он играет на гитаре в группе. | play the guitar — с артиклем
- hobby | n | ˈhɒbi | ˈhɑːbi | хобби, увлечение | something you do for fun in your free time | My *hobby* is photography. | Моё хобби — фотография.
- interest | n | ˈɪntrəst | ˈɪntərəst | интерес; увлечение | the feeling of wanting to know about something; a hobby | My main *interest* is music. | Моё главное увлечение — музыка.
- kite | n | kaɪt |  | воздушный змей | a toy made of paper or cloth that flies in the wind | The children are flying a *kite*. | Дети запускают воздушного змея.
- match | n | mætʃ |  | матч | a sports game between two teams or players | Did you watch the football *match* last night? | Ты смотрел вчера футбольный матч? | гл. match — подходить, сочетаться
- Olympics | n | əʊˈlɪmpɪks | oʊˈlɪmpɪks | Олимпийские игры | an international sports competition every four years | She won a medal at the *Olympics*. | Она завоевала медаль на Олимпиаде. | the Olympic Games
- party | n | ˈpɑːti | ˈpɑːrti | вечеринка, праздник; партия | a social event where people eat, drink and dance | I'm having a birthday *party* on Saturday. | В субботу у меня вечеринка в честь дня рождения.
- play | v | pleɪ |  | играть | to take part in a game or sport; to make music | Let's *play* football! | Давай сыграем в футбол! | play the piano — с артиклем; play football — без
- player | n | ˈpleɪə | ˈpleɪər | игрок | a person who plays a game or sport | He's a good tennis *player*. | Он хороший теннисист.
- practice | n | ˈpræktɪs |  | практика, обычай | a usual way of doing something | It was common *practice* to paint indoors. | Было принято писать картины в помещении. | брит. гл. practise
- sport | n | spɔːt | spɔːrt | спорт; вид спорта | a game or activity that needs physical effort | Tennis is my favourite *sport*. | Теннис — мой любимый вид спорта.
- surf | v | sɜːf | sɜːrf | заниматься сёрфингом | to ride on waves on a special board | We learned to *surf* in Portugal. | Мы научились сёрфингу в Португалии. | surf the Internet — бродить по интернету
- swimming | n | ˈswɪmɪŋ |  | плавание | the sport of moving through water | *Swimming* is good for your back. | Плавание полезно для спины.
- swimming pool | n | ˈswɪmɪŋ puːl |  | бассейн | a place filled with water for swimming | The hotel has a *swimming pool*. | В отеле есть бассейн.
- team | n | tiːm |  | команда | a group of people who work or play together | A *team* of scientists studied the bones. | Команда учёных исследовала кости.
- tennis | n | ˈtenɪs | ˈtenəs | теннис | a game for two or four players with rackets and a ball | We play *tennis* every Sunday. | Мы играем в теннис по воскресеньям.
- volleyball | n | ˈvɒlɪbɔːl | ˈvɑːliːbɔːl | волейбол | a game where two teams hit a ball over a high net | They're playing *volleyball* on the beach. | Они играют в волейбол на пляже.
- win | v | wɪn |  | выигрывать, побеждать | to be the best in a game or competition | Our team *won* the match! | Наша команда выиграла матч! | win – won – won
