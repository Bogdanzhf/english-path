title: "Animals and Helpers"
title_ru: "Животные-помощники"
words:
  - "animal | n | ˈænɪml | | животное | a living creature that is not a plant or a person | Elephants are the largest land *animals*. | Слоны — самые крупные наземные животные."
  - "bus | n | bʌs | | автобус | a large vehicle that carries many passengers | I take the *bus* to school every morning. | Каждое утро я езжу в школу на автобусе. | мн. ч. buses"
  - "cat | n | kæt | | кошка, кот | a small furry animal that people keep as a pet | Our *cat* sleeps on the sofa all day. | Наша кошка весь день спит на диване."
  - "command | n | kəˈmɑːnd | kəˈmænd | команда, приказ | an order that tells someone to do something | The dog understands simple *commands* like “sit”. | Собака понимает простые команды, вроде «сидеть»."
  - "depend | v | dɪˈpend | | зависеть; полагаться | to need someone or something; to be decided by something | Small children *depend* on their parents. | Маленькие дети зависят от родителей. | depend on — зависеть от; it depends — смотря как"
  - "dog | n | dɒɡ | dɔːɡ | собака | an animal with four legs that people often keep as a pet | My *dog* waits for me at the door every evening. | Каждый вечер моя собака ждёт меня у двери."
  - "door | n | dɔː | dɔːr | дверь | the thing you open to go into a room or a building | Please close the *door* behind you. | Пожалуйста, закройте за собой дверь."
  - "friend | n | frend | | друг, подруга | a person you know well and like | Tom is my best *friend*. | Том — мой лучший друг."
  - "hear | v | hɪə | hɪr | слышать | to notice sounds with your ears | Can you *hear* the birds singing? | Ты слышишь, как поют птицы? | hear — heard — heard"
  - "help | v | help | | помогать | to make things easier for someone | Can you *help* me carry these bags? | Поможешь донести эти сумки?"
  - "horse | n | hɔːs | hɔːrs | лошадь | a large animal that people ride | She learned to ride a *horse* when she was six. | Она научилась ездить верхом в шесть лет."
  - "hospital | n | ˈhɒspɪtl | ˈhɑːspɪtl | больница | a place where ill or injured people are treated | He stayed in *hospital* for three days. | Он пролежал в больнице три дня. | брит. in hospital, амер. in the hospital"
  - "leg | n | leɡ | | нога | one of the long body parts that you stand and walk on | A spider has eight *legs*. | У паука восемь ног."
  - "medical | adj | ˈmedɪkl | | медицинский | connected with medicine and treating illness | You need a *medical* certificate for this job. | Для этой работы нужна медицинская справка."
  - "open | v | ˈəʊpən | ˈoʊpən | открывать | to move something so that it is no longer closed | Could you *open* the window, please? | Не могли бы вы открыть окно?"
  - "pull | v | pʊl | | тянуть | to move something towards you | *Pull* the door — don't push it. | Тяните дверь на себя, а не толкайте."
  - "rabbit | n | ˈræbɪt | | кролик | a small animal with long ears and a short tail | The *rabbit* ate all the carrots in the garden. | Кролик съел всю морковь в огороде."
  - "school | n | skuːl | | школа | a place where children go to learn | What time does *school* start? | Во сколько начинаются уроки?"
  - "see | v | siː | | видеть | to notice something with your eyes | I can't *see* without my glasses. | Без очков я ничего не вижу. | see — saw — seen"
  - "service | n | ˈsɜːvɪs | ˈsɜːrvɪs | обслуживание; служба | work that helps people; the way staff treat customers | The *service* in this restaurant is excellent. | Обслуживание в этом ресторане отличное."
reading:
  title: "Max and His Eyes"
  title_ru: "Макс и его глаза"
  text: |
    Paul is twenty-eight years old, and he cannot see. He lost his sight after an accident when he was a child. But Paul lives a normal life. He has a job, he takes the bus to work, and he meets his friends on Fridays. He can do all this because of Max.

    Max is a service dog. He is a big, calm animal with soft brown fur. For two years, Max went to a special school for dogs. There, he learned many commands. He knows how to stop at the road, how to find a door and how to help Paul get on and off the bus.

    Paul depends on Max every day. When they walk in the street, Max gently pulls Paul to the left or to the right. When Paul hears a strange noise, Max is calm, so Paul is calm too.

    Not all service animals are dogs. Some hospitals use horses, cats and even rabbits to help ill people feel better. Children who are afraid of medical tests often relax when they touch a friendly animal.

    "People think that I help Max," Paul says with a smile. "They open doors for us and give him water. But really, Max helps me. He is my eyes, my legs and my best friend."
  ru: |
    Полу двадцать восемь лет, и он не видит. Он потерял зрение после несчастного случая в детстве. Но Пол живёт обычной жизнью. У него есть работа, он ездит туда на автобусе, а по пятницам встречается с друзьями. Всё это он может благодаря Максу.

    Макс — собака-помощник. Это крупное спокойное животное с мягкой коричневой шерстью. Два года Макс учился в специальной школе для собак. Там он выучил много команд. Он умеет останавливаться у дороги, находить дверь и помогать Полу заходить в автобус и выходить из него.

    Пол каждый день полагается на Макса. Когда они идут по улице, Макс мягко тянет Пола влево или вправо. Когда Пол слышит странный шум, Макс спокоен — и Пол тоже успокаивается.

    Не все животные-помощники — собаки. В некоторых больницах лошади, кошки и даже кролики помогают больным людям почувствовать себя лучше. Дети, которые боятся медицинских обследований, часто расслабляются, когда гладят дружелюбное животное.

    «Люди думают, что это я помогаю Максу, — говорит Пол с улыбкой. — Они открывают нам двери и дают ему воду. Но на самом деле это Макс помогает мне. Он мои глаза, мои ноги и мой лучший друг».
