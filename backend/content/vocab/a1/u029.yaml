title: 'Describing: good or bad'
title_ru: 'Описание: оценка — хорошо или плохо'
topic: describing
words:
- bad | adj | bæd |  | плохой | not good or not pleasant | Eating too much sugar is *bad* for your teeth. | Много сахара вредно для зубов. | bad — worse — the worst
- best | adj | best |  | лучший | better than all others | This is the *best* pizza I've ever eaten! | Это лучшая пицца, которую я когда-либо ел! | good — better — the best
- better | adj | ˈbetə | ˈbetər | лучше | more good | This phone is *better* than my old one. | Этот телефон лучше моего старого. | good – better – best
- correct | adj | kəˈrekt |  | правильный | right, without mistakes | Your answer is *correct*. | Твой ответ правильный.
- dangerous | adj | ˈdeɪndʒərəs |  | опасный | likely to hurt you | Swimming here is *dangerous*. | Плавать здесь опасно.
- difficult | adj | ˈdɪfɪkəlt | ˈdɪfəkəlt | трудный | not easy | Chinese is a *difficult* language. | Китайский — трудный язык.
- easy | adj | ˈiːzi |  | лёгкий, простой | not difficult | The test was *easy*. | Тест был лёгким. | easily — легко
- famous | adj | ˈfeɪməs |  | знаменитый | known by many people | Paris is *famous* for the Eiffel Tower. | Париж знаменит Эйфелевой башней.
- fun | n | fʌn |  | веселье, удовольствие | enjoyment; something that is enjoyable | We had a lot of *fun* at the party. | Мы отлично повеселились на вечеринке. | have fun — веселиться; it's fun — это весело
- good | adj | ɡʊd |  | хороший | of high quality; nice | That's a *good* idea! | Хорошая идея! | good – better – best
- great | adj | ɡreɪt |  | отличный, замечательный; великий | very good; very big or important | We had a *great* time at the beach. | Мы отлично провели время на пляже.
- important | adj | ɪmˈpɔːtənt | ˌɪmˈpɔːrtənt | важный | having a big effect or value | Sleep is *important* for your health. | Сон важен для здоровья.
- interesting | adj | ˈɪntrəstɪŋ | ˈɪntərəstɪŋ | интересный | making you want to know more | This is a very *interesting* book. | Это очень интересная книга. | interested — заинтересованный (о человеке)
- nice | adj | naɪs |  | приятный, хороший, милый | pleasant, kind | Have a *nice* day! | Хорошего дня!
- perfect | v | pəˈfekt | pərˈfekt | совершенствовать | to make something as good as possible | She spent years *perfecting* her technique. | Она годами совершенствовала технику. | прил. perfect [ˈpɜːfɪkt]
- popular | adj | ˈpɒpjələ | ˈpɑːpjələr | популярный | liked by many people | Football is very *popular* in Brazil. | Футбол очень популярен в Бразилии.
- special | adj | ˈspeʃl |  | особенный, специальный | different from usual, and often better | Today is a *special* day — it's our anniversary. | Сегодня особенный день — наша годовщина.
- useful | adj | ˈjuːsfl |  | полезный | helping you do something | This app is very *useful*. | Это приложение очень полезное.
- wonderful | adj | ˈwʌndəfl | ˈwʌndərfl | чудесный, замечательный | very good | We had a *wonderful* holiday. | У нас был чудесный отпуск.
- wrong | adj | rɒŋ | rɔːŋ | неправильный; не тот | not correct | Sorry, I think you have the *wrong* number. | Простите, вы, кажется, ошиблись номером.
