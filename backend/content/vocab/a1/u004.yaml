title: People and relationships
title_ru: Люди и отношения
topic: people
words:
- aunt | n | ɑːnt | ænt | тётя | the sister of your mother or father | My *aunt* lives in Paris. | Моя тётя живёт в Париже.
- brother | n | ˈbrʌðə | ˈbrʌðər | брат | a boy or man with the same parents as you | I have one *brother*. | У меня один брат.
- cousin | n | ˈkʌzn |  | двоюродный брат / сестра | the child of your uncle or aunt | My *cousin* lives in Canada. | Мой двоюродный брат живёт в Канаде. | ou читается как [ʌ]
- dad | n | dæd |  | папа | an informal word for father | My *dad* drives a red car. | Мой папа водит красную машину.
- daddy | n | ˈdædi |  | папочка | a word children use for father | *Daddy*, can we go to the park? | Папочка, мы можем пойти в парк?
- daughter | n | ˈdɔːtə | ˈdɔːtər | дочь | a female child of a parent | Their *daughter* is five years old. | Их дочери пять лет.
- grandfather | n | ˈɡrændfɑːðə | ˈɡrænfɑːðər | дедушка | the father of your mother or father | My *grandfather* tells funny stories. | Мой дедушка рассказывает смешные истории.
- grandma | n | ˈɡrændmɑː |  | бабушка (разг.) | an informal word for grandmother | We visit *grandma* every Sunday. | Мы навещаем бабушку каждое воскресенье.
- grandmother | n | ˈɡrændmʌðə | ˈɡrændmʌðər | бабушка | the mother of your mother or father | My *grandmother* is eighty. | Моей бабушке восемьдесят.
- grandpa | n | ˈɡrændpɑː |  | дедушка (разг.) | an informal word for grandfather | *Grandpa* likes fishing. | Дедушка любит рыбалку.
- grandparent | n | ˈɡrændpeərənt | ˈɡrændperənt | бабушка или дедушка | a parent of your mother or father | My *grandparents* live in the country. | Мои бабушка и дедушка живут за городом. | grandparents — бабушка и дедушка
- husband | n | ˈhʌsbənd | ˈhʌzbənd | муж | the man someone is married to | Her *husband* is a pilot. | Её муж — пилот.
- mom | n | mɒm | mɑːm | мама (амер.) | an informal word for mother (American) | *Mom*, where are my keys? | Мам, где мои ключи? | британское — mum
- mommy | n | ˈmɒmi | ˈmɑːmi | мамочка (амер.) | a word children use for mother | *Mommy*, I'm hungry! | Мамочка, я хочу есть!
- partner | n | ˈpɑːtnə | ˈpɑːrtnər | партнёр | a person you do something with; a husband, wife, boyfriend or girlfriend | She danced with her *partner* all night. | Она всю ночь танцевала со своим партнёром.
- sister | n | ˈsɪstə | ˈsɪstər | сестра | a girl or woman with the same parents as you | My *sister* is older than me. | Моя сестра старше меня.
- uncle | n | ˈʌŋkl |  | дядя | the brother of your mother or father | My *uncle* has a farm. | У моего дяди есть ферма.
- work | v | wɜːk | wɜːrk | работать | to do a job | My father *works* in a bank. | Мой отец работает в банке.
