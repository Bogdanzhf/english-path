title: People and relationships
title_ru: Люди и отношения
topic: people
words:
- aunt | n | ɑːnt | ænt | тётя | the sister of your mother or father | My *aunt* lives in Paris. | Моя тётя живёт в Париже.
- brother | n | ˈbrʌðə | ˈbrʌðər | брат | a boy or man with the same parents as you | I have one *brother*. | У меня один брат.
- cousin | n | ˈkʌzn |  | двоюродный брат / сестра | the child of your uncle or aunt | My *cousin* lives in Canada. | Мой двоюродный брат живёт в Канаде. | ou читается как [ʌ]
- dad | n | dæd |  | папа | an informal word for father | My *dad* drives a red car. | Мой папа водит красную машину.
