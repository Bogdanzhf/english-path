title: Food and drink
title_ru: Еда и напитки
topic: food
words:
- apple | n | ˈæpl |  | яблоко | a round fruit with red, green or yellow skin | I eat an *apple* every morning. | Я съедаю яблоко каждое утро.
- breakfast | n | ˈbrekfəst |  | завтрак | the first meal of the day | I usually have eggs and toast for *breakfast*. | На завтрак я обычно ем яйца и тосты. | have breakfast — завтракать
- cheese | n | tʃiːz |  | сыр | a food made from milk | I'd like a *cheese* sandwich. | Мне бутерброд с сыром.
- chicken | n | ˈtʃɪkɪn |  | курица | a bird kept for its eggs and meat; its meat | We had roast *chicken* for lunch. | На обед у нас была запечённая курица.
- coffee | n | ˈkɒfi | ˈkɑːfi | кофе | a hot drink made from roasted beans | Do you want a cup of *coffee*? | Хочешь чашку кофе?
- dinner | n | ˈdɪnə | ˈdɪnər | ужин, обед (главный приём пищи) | the main meal of the day, usually in the evening | What's for *dinner* tonight? | Что сегодня на ужин? | have dinner — ужинать
- food | n | fuːd |  | еда, пища | things that people and animals eat | Italian *food* is popular all over the world. | Итальянская кухня популярна во всём мире.
- fruit | n | fruːt |  | фрукт(ы) | the part of a plant that has seeds and is often sweet | Try to eat more *fruit* and vegetables. | Старайся есть больше фруктов и овощей. | обычно неисчисляемое
- ice | n | aɪs |  | лёд | frozen water | Put some *ice* in the juice. | Положи немного льда в сок.
- lunch | n | lʌntʃ |  | обед | a meal eaten in the middle of the day | We have *lunch* at one o'clock. | Мы обедаем в час.
- meat | n | miːt |  | мясо | the flesh of animals used as food | I don't eat *meat* — I'm a vegetarian. | Я не ем мяса — я вегетарианец.
- milk | n | mɪlk |  | молоко | a white drink from cows and other animals | The baby drinks *milk*. | Малыш пьёт молоко.
- rice | n | raɪs |  | рис | small white or brown grains cooked as food | We had chicken and *rice* for dinner. | На ужин у нас была курица с рисом.
- salt | n | sɒlt | sɔːlt | соль | a white substance used to make food taste better | Can you pass the *salt*? | Передай, пожалуйста, соль.
- sugar | n | ˈʃʊɡə | ˈʃʊɡər | сахар | a sweet substance from plants | Do you take *sugar* in your coffee? | Вам кофе с сахаром? | s читается как [ʃ]
- tea | n | tiː |  | чай | a hot drink made from dried leaves | Would you like a cup of *tea*? | Хотите чашку чая?
- water | n | ˈwɔːtə | ˈwɔːtər | вода | the clear liquid that falls as rain | Drink a lot of *water* when it's hot. | Пей много воды, когда жарко.
reading:
  title: The King's New Cook
  title_ru: Новый повар короля
  text: |
    Long ago, there was a rich king who only ate meat. He regarded vegetables as food for poor people. Every day, his cooks served him huge plates of beef, chicken and pork. But the king was always tired and ill. His doctors advised him to change his diet, but he did not listen.

    One day, a young girl named Clara came to the palace. "I want to be your cook," she said. "My goal is to make you healthy." The king laughed. "Many cooks have already tried," he said. "But I'll give you one week."

    Clara considered the problem carefully. She knew the king would never eat a plate of plain vegetables. So she decided to lie — just a little bit. She cooked basic vegetable dishes but made them look and smell like meat. She also added extra herbs and spices.

    The king loved the food. Each evening, Clara also entertained him with stories about her travels. After a week, the king looked in the mirror and was surprised. The mirror reflected a healthy, happy man.

    When Clara told him the truth, the king was not angry. "In my opinion, you have achieved something real," he said. "You are worth more than all my gold." He did not destroy her trust — he made her his chief cook. And people say that during his long life, the king never started a single war, because a healthy king is a calm king.
  ru: |
    Давным-давно жил богатый король, который ел только мясо. Овощи он считал пищей бедняков. Каждый день повара подавали ему огромные тарелки говядины, курицы и свинины. Но король всегда был уставшим и больным. Врачи советовали ему изменить рацион, но он их не слушал.

    Однажды во дворец пришла девушка по имени Клара. «Я хочу стать вашим поваром, — сказала она. — Моя цель — сделать вас здоровым». Король рассмеялся. «Многие повара уже пробовали, — сказал он. — Но я дам тебе неделю».

    Клара тщательно обдумала задачу. Она знала, что король никогда не станет есть тарелку простых овощей. Поэтому она решила солгать — совсем немного. Она готовила простые овощные блюда, но делала так, чтобы они выглядели и пахли как мясо. А ещё она добавляла побольше трав и специй.

    Королю еда очень нравилась. А по вечерам Клара развлекала его рассказами о своих путешествиях. Через неделю король посмотрел в зеркало и удивился. Зеркало отражало здорового, счастливого человека.

    Когда Клара рассказала ему правду, король не рассердился. «По-моему, ты добилась чего-то настоящего, — сказал он. — Ты стоишь больше, чем всё моё золото». Он не разрушил её доверие — он сделал её главным поваром. А люди говорят, что за всю свою долгую жизнь король не начал ни одной войны, потому что здоровый король — спокойный король.
  questions:
  - q: What did the king think about vegetables?
    options:
    - They were delicious
    - They were food for poor people
    - They were too expensive
    - They were good for health
    answer: 1
  - q: What was Clara's goal?
    options:
    - To become rich
    - To make the king healthy
    - To marry the king
    - To start a war
    answer: 1
  - q: How did Clara make the king eat vegetables?
    options:
    - She told him the truth
    - She made them look and smell like meat
    - She asked the doctors
    - She hid them in cakes
    answer: 1
  - tf: The king was angry when he learned the truth.
    answer: false
  - tf: Clara became the king's chief cook.
    answer: true
