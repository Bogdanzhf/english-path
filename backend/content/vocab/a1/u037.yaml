title: Education
title_ru: Учёба
topic: education
words:
- class | n | klɑːs | klæs | класс, социальный слой | a group in society with the same social and economic position | Paintings showed the life of the middle *class*. | Картины изображали жизнь среднего класса.
- classmate | n | ˈklɑːsmeɪt | ˈklæsmeɪt | одноклассник, однокурсник | a person in the same class as you | She is my *classmate*. | Она моя одноклассница.
- college | n | ˈkɒlɪdʒ | ˈkɑːlɪdʒ | колледж | a place where people study after school | My brother goes to *college*. | Мой брат учится в колледже.
- course | n | kɔːs | kɔːrs | курс (обучения); трасса | a series of lessons; the path of a race | I'm taking an English *course* this summer. | Этим летом я прохожу курс английского. | of course — конечно
- exam | n | ɪɡˈzæm |  | экзамен | a test of what you know | I have a maths *exam* tomorrow. | Завтра у меня экзамен по математике. | take/pass/fail an exam
- form | v | fɔːm | fɔːrm | образовывать, формировать | to make or create something; to take a shape | Ice *forms* when water freezes. | Лёд образуется, когда вода замерзает. | сущ. form — форма; бланк
- history | n | ˈhɪstri |  | история | the study of past events | I love reading about *history*. | Я обожаю читать об истории.
- 'homework | n | ˈhəʊmwɜːk | ˈhoʊmwɜːrk | домашнее задание | school work you do at home | I finished my *homework*. | Я сделал домашнее задание. | неисчисляемое: do homework'
- learn | v | lɜːn | lɜːrn | учить, изучать; узнавать | to get knowledge or a skill | I want to *learn* Spanish. | Я хочу выучить испанский.
- lesson | n | ˈlesən |  | урок | a period of time when you learn something | The *lesson* starts at nine. | Урок начинается в девять.
- read | v | red |  | читать | to look at words and understand them | I *read* before I go to sleep. | Я читаю перед сном. | read – read – read [red]
- ruler | n | ˈruːlə | ˈruːlər | линейка | a flat thing for measuring and drawing straight lines | Draw a line with a *ruler*. | Начерти линию по линейке.
- school | n | skuːl |  | школа | a place where children go to learn | What time does *school* start? | Во сколько начинаются уроки?
- skill | n | skɪl |  | навык, умение | the ability to do something well | Checking sources is an important *skill*. | Проверять источники — важный навык.
- student | n | ˈstjuːdənt | ˈstuːdənt | студент, ученик | a person who studies at school or university | She is a *student* at Oxford. | Она студентка Оксфорда.
- test | n | test |  | тест, контрольная; проверка | a set of questions to check knowledge; an examination | I passed my driving *test*! | Я сдал экзамен по вождению!
- train | n | treɪn |  | поезд | a line of cars that move on rails | The *train* to Paris leaves at eight. | Поезд в Париж отправляется в восемь.
- university | n | ˌjuːnɪˈvɜːsəti | ˌjuːnɪˈvɜːrsəti | университет | a place where people study after school to get a degree | My brother goes to *university* in Moscow. | Мой брат учится в университете в Москве.
- writing | n | ˈraɪtɪŋ |  | письмо (навык); почерк | the activity of writing | Her *writing* is very good. | Она очень хорошо пишет.
