title: Education
title_ru: Учёба
topic: education
words:
- class | n | klɑːs | klæs | класс, социальный слой | a group in society with the same social and economic position | Paintings showed the life of the middle *class*. | Картины изображали жизнь среднего класса.
- classmate | n | ˈklɑːsmeɪt | ˈklæsmeɪt | одноклассник, однокурсник | a person in the same class as you | She is my *classmate*. | Она моя одноклассница.
- college | n | ˈkɒlɪdʒ | ˈkɑːlɪdʒ | колледж | a place where people study after school | My brother goes to *college*. | Мой брат учится в колледже.
- course | n | kɔːs | kɔːrs | курс (обучения); трасса | a series of lessons; the path of a race | I'm taking an English *course* this summer. | Этим летом я прохожу курс английского. | of course — конечно
- exam | n | ɪɡˈzæm |  | экзамен | a test of what you know | I have a maths *exam* tomorrow. | Завтра у меня экзамен по математике. | take/pass/fail an exam
- form | v | fɔːm | fɔːrm | образовывать, формировать | to make or create something; to take a shape | Ice *forms* when water freezes. | Лёд образуется, когда вода замерзает. | сущ. form — форма; бланк
- history | n | ˈhɪstri |  | история | the study of past events | I love reading about *history*. | Я обожаю читать об истории.
- 'homework | n | ˈhəʊmwɜːk | ˈhoʊmwɜːrk | домашнее задание | school work you do at home | I finished my *homework*. | Я сделал домашнее задание. | неисчисляемое: do homework'
- learn | v | lɜːn | lɜːrn | учить, изучать; узнавать | to get knowledge or a skill | I want to *learn* Spanish. | Я хочу выучить испанский.
- lesson | n | ˈlesən |  | урок | a period of time when you learn something | The *lesson* starts at nine. | Урок начинается в девять.
- read | v | riːd |  | читать | to look at words and understand them | I *read* before I go to sleep. | Я читаю перед сном. | read – read – read [red]
- ruler | n | ˈruːlə | ˈruːlər | линейка | a flat thing for measuring and drawing straight lines | Draw a line with a *ruler*. | Начерти линию по линейке.
- school | n | skuːl |  | школа | a place where children go to learn | What time does *school* start? | Во сколько начинаются уроки?
- skill | n | skɪl |  | навык, умение | the ability to do something well | Checking sources is an important *skill*. | Проверять источники — важный навык.
- student | n | ˈstjuːdənt | ˈstuːdənt | студент, ученик | a person who studies at school or university | She is a *student* at Oxford. | Она студентка Оксфорда.
- test | n | test |  | тест, контрольная; проверка | a set of questions to check knowledge; an examination | I passed my driving *test*! | Я сдал экзамен по вождению!
- train | n | treɪn |  | поезд | a line of cars that move on rails | The *train* to Paris leaves at eight. | Поезд в Париж отправляется в восемь.
- university | n | ˌjuːnɪˈvɜːsəti | ˌjuːnɪˈvɜːrsəti | университет | a place where people study after school to get a degree | My brother goes to *university* in Moscow. | Мой брат учится в университете в Москве.
- writing | n | ˈraɪtɪŋ |  | письмо (навык); почерк | the activity of writing | Her *writing* is very good. | Она очень хорошо пишет.
reading:
  title: Emma's Novel
  title_ru: Роман Эммы
  text: |
    Emma was sixteen, and she had two dreams. Her coach wanted her to become a professional runner, but Emma wanted to be a writer. Every night, she wrote stories on sheets of paper and hid them under her bed.

    Her parents thought writing was silly. "You have an exam next month," her mother said. "Focus on your studies." Emma suffered. She couldn't control her feelings, so she wrote even more.

    One evening, she found a strange old book in a local store. Inside, there was no story — only an outline: "A girl finds a magical door in a library." Emma read it and immediately saw the first scene in her mind. She went home and started her first novel.

    For three months, she wrote every day. She used technology to help her: she typed on her computer and printed every chapter. She also read famous poets to learn how to choose beautiful words. Her descriptions of the library and the magical door became better and better.

    When the novel was finished, Emma sent it by mail to a publisher. There was no limit to her hope. Six weeks later, a letter came. It was a direct answer: "We love your book. We want to publish it." Emma's mother cried. "You were right," she said. "This is the best example of following your dream."
  ru: |
    Эмме было шестнадцать, и у неё было две мечты. Тренер хотел, чтобы она стала профессиональной бегуньей, а Эмма хотела быть писательницей. Каждый вечер она писала рассказы на листах бумаги и прятала их под кроватью.

    Родители считали писательство глупостью. «Через месяц у тебя экзамен, — говорила мама. — Сосредоточься на учёбе». Эмма страдала. Она не могла справиться со своими чувствами, поэтому писала ещё больше.

    Однажды вечером она нашла в местном магазине странную старую книгу. Внутри не было истории — только план: «Девочка находит волшебную дверь в библиотеке». Эмма прочитала его и сразу увидела в воображении первую сцену. Она пришла домой и начала свой первый роман.

    Три месяца она писала каждый день. Ей помогала техника: она печатала на компьютере и распечатывала каждую главу. А ещё она читала знаменитых поэтов, чтобы научиться выбирать красивые слова. Её описания библиотеки и волшебной двери становились всё лучше.

    Когда роман был закончен, Эмма отправила его по почте в издательство. Её надежде не было предела. Через шесть недель пришло письмо. Ответ был прямым: «Нам очень понравилась ваша книга. Мы хотим её издать». Мама Эммы плакала. «Ты была права, — сказала она. — Это лучший пример того, как надо следовать мечте».
