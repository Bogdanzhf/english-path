title: Actions and movement
title_ru: Действия и движение
topic: actions
words:
- bring | v | brɪŋ |  | приносить, привозить | to take something or someone with you to a place | *Bring* your friends to the party. | Приводи друзей на вечеринку. | bring – brought – brought
- build | v | bɪld |  | строить | to make a house, road, etc. | They are *building* a new school. | Строят новую школу. | build – built – built
- carry | v | ˈkæri |  | нести, носить | to hold something and take it somewhere | Can you *carry* this bag? | Можешь понести эту сумку?
- come | v | kʌm |  | приходить, приезжать | to move towards the speaker | *Come* here, please. | Подойди сюда, пожалуйста. | come – came – come
- 'cook | v | kʊk |  | готовить (еду) | to make food hot and ready to eat | My dad *cooks* dinner on Fridays. | По пятницам ужин готовит папа. | также сущ.: cook — повар'
- create | v | kriˈeɪt |  | создавать | to make something new | The children *created* a small garden behind the school. | Дети создали маленький сад за школой.
- drive | v | draɪv |  | водить (машину), ехать | to control a car | Can you *drive*? | Ты умеешь водить? | drive – drove – driven
- fall | v | fɔːl | fɑːl | падать | to go down to the ground | Be careful, don't *fall*! | Осторожно, не упади! | fall – fell – fallen; амер. fall — осень
- follow | v | ˈfɒləʊ | ˈfɑːloʊ | следовать, идти за | to go after someone; to do what someone says | *Follow* me, please. | Следуйте за мной.
- go | v | ɡəʊ | ɡoʊ | идти, ехать | to move from one place to another | I *go* to work by bus. | Я езжу на работу на автобусе. | go – went – gone
- imagine | v | ɪˈmædʒɪn |  | представлять, воображать | to form a picture of something in your mind | *Imagine* that you are on a beach in the sun. | Представьте, что вы на пляже под солнцем.
- leave | v | liːv |  | уходить, уезжать; оставлять | to go away from a place; to let something stay | The train *leaves* at five. | Поезд отправляется в пять. | leave — left — left
- meet | v | miːt |  | встречать(ся), знакомиться | to see and talk to someone | Let's *meet* at the café at six. | Давай встретимся в кафе в шесть. | meet — met — met
- move | v | muːv |  | двигать(ся); переезжать | to change position; to go to live in a new place | We *moved* to a new flat. | Мы переехали в новую квартиру.
- 'paint | v | peɪnt |  | красить; рисовать (красками) | to put colour on something; to make a picture | We *painted* the kitchen yellow. | Мы покрасили кухню в жёлтый цвет. | также сущ.: краска'
- park | v | pɑːk | pɑːrk | парковать(ся); парк (сущ.) | to leave a car somewhere | You can't *park* here. | Здесь нельзя парковаться. | park — парк
- post | v | pəʊst | poʊst | отправлять по почте; публиковать | to send by mail; to put on the internet | I *posted* the letter yesterday. | Я отправил письмо вчера.
- practise | v | ˈpræktɪs |  | практиковаться, тренироваться | to do something many times to get better | I *practise* the piano every day. | Я занимаюсь на фортепиано каждый день. | американское — practice
- run | v | rʌn |  | бегать, бежать | to move very fast on your legs | I *run* in the park every morning. | Каждое утро я бегаю в парке. | run – ran – run
- sing | v | sɪŋ |  | петь | to make music with your voice | She *sings* beautifully. | Она прекрасно поёт. | sing – sang – sung
- sit | v | sɪt |  | сидеть, садиться | to rest on a chair | Please *sit* down. | Садитесь, пожалуйста. | sit – sat – sat
- write | v | raɪt |  | писать | to put words on paper or a screen | *Write* your name at the top of the page. | Напишите своё имя вверху страницы. | write — wrote — written
