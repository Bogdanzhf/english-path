title: Function words
title_ru: Служебные слова
topic: grammar
words:
- all | det | ɔːl |  | все, весь | every one; the whole of | *All* my friends were there. | Там были все мои друзья.
- he | pron | hi | hiː | он | a man or boy already mentioned | *He* is my brother. | Он мой брат.
- her | pron | hɜː | hɜːr | её, ей; её (притяж.) | a woman or girl already mentioned | I saw *her* yesterday. | Я видел её вчера. | her bag — её сумка
- I | pron | aɪ |  | я | the person who is speaking | *I* am a student. | Я студент. | всегда с заглавной буквы
- its | det | ɪts |  | его, её (о предмете, животном) | belonging to a thing or animal | The dog wagged *its* tail. | Собака виляла хвостом. | it's = it is
- me | pron | miː |  | меня, мне | the person who is speaking (as an object) | Can you help *me*? | Можешь мне помочь?
- more | det | mɔː | mɔːr | больше, ещё | a larger amount | Can I have some *more* tea? | Можно мне ещё чаю?
- next to | prep | nekst tuː | neks tuː | рядом с | at the side of | The bank is *next to* the post office. | Банк рядом с почтой.
- one | num | wɒn | wʌn | один | the number 1 | I have *one* sister. | У меня одна сестра. | this one — этот
- she | pron | ʃiː |  | она | a woman or girl already mentioned | *She* is a doctor. | Она врач.
- some | det | sʌm |  | несколько, немного, какой-то | an amount or number of | I need *some* help. | Мне нужна помощь. | в вопросах и отрицаниях — any
- them | pron | ðem |  | их, им | people or things already mentioned (as an object) | I love *them* very much. | Я их очень люблю.
- they | pron | ðeɪ |  | они | used for two or more people or things | My parents are teachers. *They* work at the same school. | Мои родители учителя. Они работают в одной школе.
- we | pron | wiː |  | мы | the speaker and other people | *We* are friends. | Мы друзья.
- what | pron | wɒt | hwʌt | что, какой | used to ask about things | *What* is this? | Что это?
- which | pron | wɪtʃ | hwɪtʃ | который, какой (из) | used to ask about a choice | *Which* colour do you like? | Какой цвет тебе нравится?
- who | pron | huː |  | кто; который | used to ask about people | *Who* is that man? | Кто этот мужчина?
- without | prep | wɪˈðaʊt |  | без | not having | I drink coffee *without* sugar. | Я пью кофе без сахара.
- you | pron | juː |  | ты, вы; тебя, вас | the person or people you are speaking to | Thank *you*! | Спасибо!
reading:
  title: The Dry Summer
  title_ru: Засушливое лето
  text: |
    The village of Greenhill is on a hill above a small river. Usually the river flows fast, and there is plenty of water in every season. But one summer, there was no rain for three months. The water level in the river went down every day, and soon only a few puddles were left.

    The people of Greenhill were worried. Some wanted to leave the village. Others did not know whether to stay or go. Water was available only from one lone well in the centre of the village, and people argued about it. "It's not fair," they said. "Some families take more than others."

    A bright young girl named Rosa decided to help. She asked everyone to come to a meeting. "We are wasting water," she said. "We need a solution. Let's make a plan: every family gets the same amount. Nobody gets more, and nobody else gets less."

    The response was positive. People began to collect water from their roofs during the night, when there was a little dew. They stopped washing their cars and watering flowers. Slowly, the village beat the dry summer.

    In September, the rain finally came. The puddles appeared again, and the river started to flow. The whole village celebrated with a big party. "Now we appreciate every drop," the people said. And Rosa's plan did not disappear: they still use it every summer.
  ru: |
    Деревня Гринхилл стоит на холме над небольшой рекой. Обычно река течёт быстро, и воды хватает в любое время года. Но однажды летом три месяца не было дождя. Уровень воды в реке падал с каждым днём, и вскоре остались лишь несколько луж.

    Жители Гринхилла забеспокоились. Некоторые хотели уехать из деревни. Другие не знали, оставаться им или уезжать. Воду можно было взять только из одного-единственного колодца в центре деревни, и люди из-за неё спорили. «Это несправедливо, — говорили они. — Некоторые семьи берут больше других».

    Сообразительная девочка по имени Роза решила помочь. Она попросила всех прийти на собрание. «Мы тратим воду впустую, — сказала она. — Нам нужно решение. Давайте составим план: каждая семья получает одинаковое количество. Никто не получает больше, и никто не получает меньше».

    Отклик был положительным. Люди начали по ночам собирать с крыш немного росы. Они перестали мыть машины и поливать цветы. Понемногу деревня победила засушливое лето.

    В сентябре наконец пошёл дождь. Снова появились лужи, и река потекла. Вся деревня отпраздновала это большим праздником. «Теперь мы ценим каждую каплю», — говорили люди. А план Розы не исчез: им до сих пор пользуются каждое лето.
  questions:
  - q: Where is the village of Greenhill?
    options:
    - Near the sea
    - On a hill above a river
    - In a big city
    - In the mountains
    answer: 1
  - q: Why were people arguing?
    options:
    - About the river fish
    - Some families took more water than others
    - About a party
    - About Rosa's school
    answer: 1
  - q: What was Rosa's plan?
    options:
    - To leave the village
    - To build a new well
    - Every family gets the same amount of water
    - To buy water in the city
    answer: 2
  - tf: The rain came back in September.
    answer: true
  - tf: The village stopped using Rosa's plan after the summer.
    answer: false
