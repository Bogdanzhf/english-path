title: Home and everyday life
title_ru: Дом и быт
topic: home
words:
- bag | n | bæɡ |  | сумка; пакет | a container for carrying things | My *bag* is very heavy. | Моя сумка очень тяжёлая.
- bath | n | bɑːθ | bæθ | ванна | a long container you fill with water to wash your body | I like to have a hot *bath* after work. | Люблю принять горячую ванну после работы.
- bed | n | bed |  | кровать | a piece of furniture for sleeping on | I go to *bed* at eleven. | Я ложусь спать в одиннадцать.
- box | n | bɒks | bɑːks | коробка, ящик | a container with straight sides | Put the toys in the *box*. | Сложи игрушки в коробку.
- bucket | n | ˈbʌkɪt |  | ведро | a round open container with a handle | He carried a *bucket* of water to the garden. | Он принёс ведро воды в сад.
- clock | n | klɒk | klɑːk | часы (настенные, настольные) | a device on a wall or table that shows the time | The *clock* in the kitchen is slow. | Часы на кухне отстают. | наручные часы — watch
- couch | n | kaʊtʃ |  | диван | a long soft seat for two or more people | He fell asleep on the *couch*. | Он уснул на диване. | = sofa
- desk | n | desk |  | письменный стол, парта | a table you sit at to write or work | Her *desk* is covered in papers. | Её стол завален бумагами. | reception desk — стойка администратора
- dictionary | n | ˈdɪkʃənri | ˈdɪkʃəneri | словарь | a book that explains the meaning of words | Look up the word in a *dictionary*. | Посмотри это слово в словаре.
- floor | n | flɔː | flɔːr | пол; этаж | the surface you walk on in a room; a level of a building | The cat is sleeping on the *floor*. | Кошка спит на полу.
- garbage | n | ˈɡɑːbɪdʒ | ˈɡɑːrbɪdʒ | мусор | things that you throw away | Don't forget to take out the *garbage*. | Не забудь вынести мусор. | амер.; брит. rubbish
- glass | n | ɡlɑːs | ɡlæs | стекло; стакан | a hard material you can see through; a cup made of it | Recycle your *glass* bottles here. | Сдавайте стеклянные бутылки на переработку здесь.
- magazine | n | ˌmæɡəˈziːn | ˈmæɡəziːn | журнал | a thin book with pictures and articles that comes out every week or month | She buys a fashion *magazine* every month. | Каждый месяц она покупает модный журнал.
- paper | n | ˈpeɪpə | ˈpeɪpər | бумага; газета | thin material for writing on | I need a piece of *paper*. | Мне нужен лист бумаги.
- pen | n | pen |  | ручка | a thing for writing with ink | Can I borrow your *pen*? | Можно взять твою ручку?
- pencil | n | ˈpensl |  | карандаш | a thin wooden thing for writing or drawing | Write your name in *pencil*. | Напишите имя карандашом.
- photo | n | ˈfəʊtəʊ | ˈfoʊtoʊ | фотография | a picture made with a camera | Let's take a *photo*! | Давай сфотографируемся! | take a photo — сфотографировать
- table | n | ˈteɪbl |  | стол | a piece of furniture with a flat top and legs | The keys are on the *table*. | Ключи на столе.
- umbrella | n | ʌmˈbrelə | ˈʌmbrelə | зонт | a thing you hold over your head when it rains | Don't forget your *umbrella*. | Не забудь зонт.
- vase | n | vɑːz | veɪs | ваза | a container for flowers | She put the roses in a glass *vase*. | Она поставила розы в стеклянную вазу.
