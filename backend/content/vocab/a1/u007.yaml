title: 'Describing: size, shape and looks'
title_ru: 'Описание: размер, форма, внешний вид'
topic: describing
words:
- beautiful | adj | ˈbjuːtɪfl |  | красивый | very nice to look at | What a *beautiful* sunset! | Какой красивый закат!
- big | adj | bɪɡ |  | большой | large in size | They live in a *big* house. | Они живут в большом доме.
- black | adj | blæk |  | чёрный | the darkest colour, like the night sky | She was wearing a *black* dress. | На ней было чёрное платье.
- blue | adj | bluː |  | синий; голубой | having the colour of the sky on a clear day | She has *blue* eyes. | У неё голубые глаза.
- both | det | bəʊθ | boʊθ | оба, обе | the two people or things together | *Both* my sisters are teachers. | Обе мои сестры — учительницы. | both of them — они оба
- brown | adj | braʊn |  | коричневый; карий | having the colour of earth or chocolate | He has *brown* hair. | У него каштановые волосы.
- dark | adj | dɑːk | dɑːrk | тёмный | with little or no light; not light in colour | It gets *dark* early in winter. | Зимой рано темнеет.
- fast | v | fɑːst | fæst | поститься, голодать | to eat no food for a period, often for religious reasons | Many people *fast* during religious holidays. | Многие постятся во время религиозных праздников.
- green | adj | ɡriːn |  | зелёный | the colour of grass and leaves | She has beautiful *green* eyes. | У неё красивые зелёные глаза.
- large | adj | lɑːdʒ | lɑːrdʒ | большой | big | Can I have a *large* coffee, please? | Можно большой кофе, пожалуйста? | НЕ «широкий» (wide)
- light | n | laɪt |  | свет | the brightness from the sun or a lamp | Turn on the *light*, please. | Включи, пожалуйста, свет. | прил. light — светлый; лёгкий
- little | adj | ˈlɪtl |  | маленький | small in size or age | They have a *little* dog. | У них маленькая собака. | a little — немного
- long | adj | lɒŋ | lɔːŋ | длинный; долгий | big in length or time | She has *long* hair. | У неё длинные волосы.
- pretty | adj | ˈprɪti |  | хорошенький, милый | nice to look at | What a *pretty* dress! | Какое милое платье! | pretty good — довольно хороший (разг.)
- red | adj | red |  | красный | the colour of blood or tomatoes | He gave her a bunch of *red* roses. | Он подарил ей букет красных роз.
- short | adj | ʃɔːt | ʃɔːrt | короткий; невысокий | not long; not tall | We took a *short* walk after dinner. | После ужина мы немного прогулялись.
- small | adj | smɔːl |  | маленький | not large in size or amount | My room is quite *small*. | Моя комната довольно маленькая.
- strong | adj | strɒŋ | strɔːŋ | сильный; крепкий | having a lot of power; not easy to break | He is very *strong*. | Он очень сильный. | strong coffee — крепкий кофе
- white | adj | waɪt | hwaɪt | белый | having the colour of snow or milk | She wore a *white* dress. | Она была в белом платье.
- yes | adv | jes |  | да | used to agree or say that something is true | Are you hungry? — *Yes*, I am. | Ты голоден? — Да.
