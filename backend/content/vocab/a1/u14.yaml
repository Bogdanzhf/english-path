title: "Books and Writers"
title_ru: "Книги и писатели"
words:
  - "coach | n | kəʊtʃ | koʊtʃ | тренер | a person who trains a sports team or a player | The *coach* made the team run every morning. | Тренер заставлял команду бегать каждое утро."
  - "control | v | kənˈtrəʊl | kənˈtroʊl | управлять, контролировать | to make someone or something do what you want | She couldn't *control* her horse. | Она не могла справиться со своей лошадью."
