title: "Plans and Ideas"
title_ru: "Планы и идеи"
words:
  - "accept | v | əkˈsept | | принимать (предложение, подарок) | to take something that someone offers you; to say yes | She *accepted* the job offer immediately. | Она сразу приняла предложение о работе."
  - "arrange | v | əˈreɪndʒ | | устраивать, организовывать; расставлять | to plan or organise something; to put things in order | We *arranged* a meeting for Monday morning. | Мы назначили встречу на утро понедельника."
  - "attend | v | əˈtend | | посещать, присутствовать | to go to an event, a school or a meeting | More than a hundred people *attended* the wedding. | На свадьбе было больше ста человек."
  - "chase | v | tʃeɪs | | гнаться, преследовать | to run after someone to catch them | The police *chased* the thief down the street. | Полиция гналась за вором по улице."
  - "contrast | n | ˈkɒntrɑːst | ˈkɑːntræst | контраст, противоположность | a clear difference between two things | There is a big *contrast* between the city and the countryside. | Между городом и деревней большой контраст."
  - "encourage | v | ɪnˈkʌrɪdʒ | ɪnˈkɜːrɪdʒ | поощрять, вдохновлять | to give someone support so that they want to do something | My teacher *encouraged* me to write stories. | Учительница поощряла меня писать рассказы."
  - "familiar | adj | fəˈmɪliə | fəˈmɪliər | знакомый | known to you because you have seen or heard it before | Her face looks *familiar* — have we met before? | Её лицо кажется знакомым — мы раньше встречались?"
  - "grab | v | ɡræb | | хватать | to take hold of something quickly and roughly | He *grabbed* his coat and ran out. | Он схватил пальто и выбежал."
  - "hang | v | hæŋ | | вешать, висеть | to fix something at the top so that the lower part is free | *Hang* your coat on the hook by the door. | Повесь пальто на крючок у двери. | hang — hung — hung"
  - "huge | adj | hjuːdʒ | | огромный | very big | They live in a *huge* house with ten bedrooms. | Они живут в огромном доме с десятью спальнями."
  - "necessary | adj | ˈnesəsəri | ˈnesəseri | необходимый | needed; that must be done | Is it *necessary* to book a table? | Нужно ли бронировать столик?"
  - "pattern | n | ˈpætn | ˈpætərn | узор; закономерность | a design of lines or shapes; a way something usually happens | I like the flower *pattern* on your dress. | Мне нравится цветочный узор на твоём платье."
  - "propose | v | prəˈpəʊz | prəˈpoʊz | предлагать; делать предложение | to suggest a plan; to ask someone to marry you | I *propose* that we leave early. | Предлагаю выехать пораньше."
  - "purpose | n | ˈpɜːpəs | ˈpɜːrpəs | цель, назначение | the reason why something is done | What is the *purpose* of your visit? | Какова цель вашего визита? | on purpose — нарочно"
  - "release | v | rɪˈliːs | | выпускать, освобождать | to let someone or something go free | They *released* the bird from the cage. | Они выпустили птицу из клетки."
  - "require | v | rɪˈkwaɪə | rɪˈkwaɪər | требовать(ся) | to need something | This job *requires* good computer skills. | Для этой работы требуются хорошие навыки работы с компьютером."
  - "satisfied | adj | ˈsætɪsfaɪd | | довольный, удовлетворённый | pleased because you got what you wanted | Are you *satisfied* with your new phone? | Ты доволен новым телефоном?"
  - "single | adj | ˈsɪŋɡl | | единственный, один; одинокий | only one; not married | I didn't hear a *single* word he said. | Я не услышал ни единого слова из того, что он сказал."
  - "tear | v | teə | ter | рвать | to pull something apart so that it breaks | Be careful not to *tear* the paper. | Осторожно, не порви бумагу. | tear — tore — torn; сущ. tear [tɪə] — слеза"
  - "theory | n | ˈθɪəri | ˈθiːəri | теория | an idea that tries to explain something | Scientists have a new *theory* about the stars. | У учёных новая теория о звёздах."
reading:
  title: "Why the Stars Shine"
  title_ru: "Откуда взялись звёзды"
  text: |
    This is an old story that people in a small village tell their children. It is not a scientific theory, but it explains a familiar pattern in the sky.

    Long ago, the Sun and the Moon lived together in a huge house in the sky. The Sun was bright and loud. The Moon was quiet and calm. There was a big contrast between them, but they were good friends.

    One day, the Sun proposed a game. "Let's run around the Earth," he said. "I will chase you." The Moon accepted. But the Sun ran too fast and almost grabbed the Moon's silver dress. The Moon was scared and tried to escape. Her dress tore, and small pieces of silver fell into the sky. These pieces became the stars.

    The other gods arranged a meeting. "It is necessary to stop this game," they said. "The Earth requires both day and night." So they made a rule: the Sun would hang in the sky during the day, and the Moon would come out only at night.

    The gods released the Sun and the Moon from their house, and each of them got a single purpose. The Sun gives light and warmth. The Moon watches over sleeping people. Everyone was satisfied. But sometimes, during an eclipse, the old friends still meet for a moment.
  ru: |
    Эту старую историю жители одной маленькой деревни рассказывают своим детям. Это не научная теория, но она объясняет знакомую всем закономерность на небе.

    Давным-давно Солнце и Луна жили вместе в огромном доме на небе. Солнце было ярким и шумным. Луна — тихой и спокойной. Они были очень разными, но крепко дружили.

    Однажды Солнце предложило игру. «Давай бегать вокруг Земли, — сказало оно. — Я буду тебя догонять». Луна согласилась. Но Солнце бежало слишком быстро и чуть не схватило Луну за серебряное платье. Луна испугалась и бросилась убегать. Платье порвалось, и маленькие кусочки серебра упали в небо. Они стали звёздами.

    Другие боги устроили совет. «Эту игру необходимо прекратить, — сказали они. — Земле нужны и день, и ночь». И они установили правило: днём на небе будет висеть Солнце, а Луна будет выходить только ночью.

    Боги отпустили Солнце и Луну из их дома, и у каждого появилась своя единственная цель. Солнце даёт свет и тепло. Луна охраняет спящих людей. Все остались довольны. Но иногда, во время затмения, старые друзья всё-таки встречаются на мгновение.
  questions:
    - q: "Where did the Sun and the Moon live at first?"
      options: ["On the Earth", "In a huge house in the sky", "In a small village", "In the sea"]
      answer: 1
    - q: "How were the stars made in the story?"
      options: ["From the Sun's fire", "From pieces of the Moon's dress", "From the gods' tears", "From clouds"]
      answer: 1
    - q: "What rule did the gods make?"
      options: ["The Sun and the Moon must play every day", "The Sun shines in the day and the Moon at night", "The Moon must live on the Earth", "Nobody can look at the Sun"]
      answer: 1
    - tf: "The story is a scientific theory."
      answer: false
    - tf: "The Moon was quiet and calm."
      answer: true
