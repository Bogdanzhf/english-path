- local | adj | ˈləʊkl | ˈloʊkl | местный | of the area near you | We buy vegetables from *local* farmers. | Мы покупаем овощи у местных фермеров.
- minute | n | ˈmɪnɪt |  | минута | sixty seconds | I'll be there in five *minutes*. | Буду через пять минут.
- natural | adj | ˈnætʃrəl |  | природный, естественный | made by nature, not by people; normal | This juice is completely *natural* — no sugar is added. | Этот сок полностью натуральный — сахар не добавлен.
- negative | adj | ˈneɡətɪv |  | отрицательный, негативный | bad or harmful; saying no | Punishment can have a *negative* effect on learning. | Наказания могут негативно сказываться на учёбе.
- personal | adj | ˈpɜːsənl | ˈpɜːrsɪnl | личный | belonging to one person | This is my *personal* opinion. | Это моё личное мнение.
