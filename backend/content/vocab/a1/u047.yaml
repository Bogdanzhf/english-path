title: 'Describing: same, different, true'
title_ru: 'Описание: сходство, точность, вероятность'
topic: describing
words:
- close | adj | kləʊs | kloʊs | близкий; рядом | near; very friendly | We are *close* friends. | Мы близкие друзья. | гл. close [kləʊz] — закрывать
- common | adj | ˈkɒmən | ˈkɑːmən | распространённый; общий | happening often; shared | Smith is a very *common* name in England. | Смит — очень распространённая фамилия в Англии. | have something in common — иметь что-то общее
- 'complete | adj | kəmˈpliːt |  | полный, законченный | having all the parts; finished | The work is *complete*. | Работа закончена. | также гл.: complete — завершить'
- different | adj | ˈdɪfrənt |  | другой, разный | not the same | My sister and I are very *different*. | Мы с сестрой очень разные. | different from
- extra | adj | ˈekstrə |  | дополнительный, лишний | more than usual or more than needed | Take an *extra* jumper — it might be cold. | Возьми ещё один свитер — может быть холодно.
- false | adj | fɔːls |  | ложный, неверный | not true or not correct | Is this statement true or *false*? | Это утверждение верно или неверно?
