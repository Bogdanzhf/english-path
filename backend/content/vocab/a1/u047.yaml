- subject | v | səbˈdʒekt |  | подвергать | to make someone experience something unpleasant | Online trolls *subjected* her to terrible abuse. | Интернет-тролли подвергли её ужасной травле. | сущ. subject [ˈsʌbdʒɪkt] — предмет, тема
