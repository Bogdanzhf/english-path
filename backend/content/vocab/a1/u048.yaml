title: Feelings and character
title_ru: Чувства и характер
topic: feelings
words:
- afraid | adj | əˈfreɪd |  | испуганный (be afraid — бояться) | feeling fear | I'm *afraid* of spiders. | Я боюсь пауков. | I'm afraid… — Боюсь, что… (вежливо)
- angry | adj | ˈæŋɡri |  | сердитый, злой | feeling strong anger | Why are you *angry* with me? | Почему ты на меня злишься?
- awake | adj | əˈweɪk |  | бодрствующий, не спящий | not sleeping | I was *awake* all night because of the noise. | Я не спал всю ночь из-за шума.
- bored | adj | bɔːd | bɔːrd | скучающий (be bored — скучать) | tired because nothing is interesting | I'm *bored* — let's go out. | Мне скучно — пойдём куда-нибудь. | boring — скучный
- boring | adj | ˈbɔːrɪŋ |  | скучный | not interesting | The film was so *boring* that I fell asleep. | Фильм был таким скучным, что я уснул. | bored — скучающий (о человеке)
- busy | adj | ˈbɪzi |  | занятой; оживлённый | having a lot to do; full of people | I'm too *busy* to talk right now. | Я сейчас слишком занят, чтобы говорить. | произносится «бизи»
- 'enjoy | v | ɪnˈdʒɔɪ |  | наслаждаться, получать удовольствие | to like doing something or being somewhere | I really *enjoy* walking by the sea. | Мне очень нравится гулять у моря. | после enjoy глагол с -ing: enjoy swimming'
- excited | adj | ɪkˈsaɪtɪd | ɪkˈsaɪtəd | взволнованный, в предвкушении | very happy and full of energy | The kids are *excited* about the trip. | Дети в восторге от поездки. | exciting — захватывающий
- feel | v | fiːl |  | чувствовать (себя) | to experience an emotion or a physical feeling | I *feel* much better today. | Сегодня я чувствую себя гораздо лучше. | feel — felt — felt
- feeling | n | ˈfiːlɪŋ |  | чувство, ощущение | an emotion | I have a good *feeling* about this. | У меня хорошее предчувствие.
- funny | adj | ˈfʌni |  | смешной, забавный | making you laugh | He told a *funny* story. | Он рассказал смешную историю.
- happy | adj | ˈhæpi |  | счастливый, довольный | feeling good | I'm so *happy* to see you! | Я так рад тебя видеть!
- hate | v | heɪt |  | ненавидеть, терпеть не мочь | to dislike very much | I *hate* waiting. | Терпеть не могу ждать.
- interested | adj | ˈɪntrəstɪd | ˈɪntərəstəd | заинтересованный | wanting to know more | Are you *interested* in art? | Тебе интересно искусство? | interested in something
- 'kind | n | kaɪnd |  | вид, сорт, тип | a type | What *kind* of music do you like? | Какую музыку ты любишь? | также прил.: kind — добрый'
- love | v | lʌv |  | любить, очень нравиться | to like someone or something very much | I *love* the smell of fresh coffee in the morning. | Обожаю запах свежего кофе по утрам.
- mean | v | miːn |  | значить, означать; иметь в виду | to have a meaning; to want to say | What does this word *mean*? | Что означает это слово? | mean – meant – meant
- merry | adj | ˈmeri |  | весёлый | happy and cheerful | *Merry* Christmas! | Счастливого Рождества!
- prefer | v | prɪˈfɜː | prəˈfɜːr | предпочитать | to like one thing more than another | I *prefer* tea to coffee. | Я предпочитаю чай кофе.
- ready | adj | ˈredi |  | готовый | prepared | Dinner is *ready*! | Ужин готов!
- sad | adj | sæd |  | грустный, печальный | unhappy | Why are you so *sad*? | Почему ты такой грустный?
- sorry | adj | ˈsɒri | ˈsɑːri | сожалеющий (be sorry — извиняться) | feeling bad about something you did | I'm *sorry* about yesterday. | Прости за вчерашнее. | Sorry? — Простите, что вы сказали?
- tired | adj | ˈtaɪəd | ˈtaɪərd | усталый | needing rest | I'm very *tired* after work. | Я очень устаю после работы.
- want | v | wɒnt | wɑːnt | хотеть | to wish to have or do something | I *want* a new bike. | Я хочу новый велосипед.
- young | adj | jʌŋ |  | молодой | not old | My parents are still *young*. | Мои родители ещё молодые.
