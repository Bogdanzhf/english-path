title: Places and the city
title_ru: Город и места
topic: city
words:
- area | n | ˈeəriə | ˈeriə | область, сфера; район | a subject or activity; a part of a place | Physics was his strongest *area*. | Физика была его самой сильной стороной.
- building | n | ˈbɪldɪŋ |  | здание | a structure with walls and a roof | That tall *building* is a hotel. | То высокое здание — отель.
- cafe | n | kæˈfeɪ |  | кафе | a small restaurant for drinks and light meals | Let's meet at the *cafe*. | Давай встретимся в кафе. | также café
- café | n | ˈkæfeɪ | kæˈfeɪ | кафе | a small restaurant serving drinks and light meals | Let's meet at the *café* on the corner. | Давай встретимся в кафе на углу.
- capital | n | ˈkæpɪtl |  | столица | the city where a country's government is | Paris is the *capital* of France. | Париж — столица Франции.
- city | n | ˈsɪti |  | город (крупный) | a large and important town | Tokyo is a huge *city*. | Токио — огромный город.
- country | n | ˈkʌntri |  | страна; сельская местность | an area of land with its own government; the countryside | Canada is a very big *country*. | Канада — очень большая страна. | in the country — за городом
- hospital | n | ˈhɒspɪtl | ˈhɑːspɪtl | больница | a place where ill or injured people are treated | He stayed in *hospital* for three days. | Он пролежал в больнице три дня. | брит. in hospital, амер. in the hospital
- hotel | n | həʊˈtel | hoʊˈtel | гостиница, отель | a building where you pay to stay the night | We stayed at a small *hotel* near the beach. | Мы остановились в маленьком отеле у пляжа.
- nationality | n | ˌnæʃəˈnæləti |  | национальность, гражданство | the legal right to belong to a country | She has dual *nationality*. | У неё двойное гражданство.
- place | n | pleɪs |  | место | an area, a building or a town | This is the best *place* for a picnic. | Это лучшее место для пикника.
- pool | n | puːl |  | бассейн; лужа | a place filled with water for swimming | The hotel has a big *pool*. | В отеле большой бассейн.
- restaurant | n | ˈrestrɒnt | ˈrestərɑːnt | ресторан | a place where you pay to eat a meal | Let's go to a *restaurant* tonight. | Давай сходим сегодня в ресторан.
- station | n | ˈsteɪʃn |  | станция, вокзал | a place where trains or buses stop | The train *station* is in the city centre. | Вокзал находится в центре города.
- subway | n | ˈsʌbweɪ |  | метро (амер.); подземный переход (брит.) | an underground railway in a city | We took the *subway* downtown. | Мы поехали на метро в центр. | британское — underground
- traffic | n | ˈtræfɪk |  | движение (транспорта) | the cars and other vehicles on a road | There is a lot of *traffic* today. | Сегодня большое движение. | traffic jam — пробка
- village | n | ˈvɪlɪdʒ |  | деревня | a very small town in the countryside | My grandmother lives in a quiet *village*. | Моя бабушка живёт в тихой деревне.
- world | n | wɜːld | wɜːrld | мир | the Earth and all its people and countries | She wants to travel around the *world*. | Она хочет путешествовать по всему миру.
