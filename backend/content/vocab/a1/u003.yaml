title: Everyday phrases
title_ru: Разговорные фразы
topic: phrases
words:
- a few | phr |  |  | несколько, немного (для исчисляемых) | a small number of | I have *a few* friends in London. | У меня есть несколько друзей в Лондоне. | a few + мн. ч.; a little — для неисчисляемых
- a good idea | phr |  |  | хорошая идея | a sensible thing to do | Taking an umbrella is *a good idea*. | Взять зонт — хорошая идея.
- a little | phr |  |  | немного (для неисчисляемых) | a small amount of | Can I have *a little* milk, please? | Можно мне немного молока?
- a lot | phr |  |  | много; очень | very much; a large amount | Thanks *a lot*! | Большое спасибо!
- a lot of something | phr |  |  | много (чего-либо) | a large number or amount of | There are *a lot of* people in the park. | В парке много людей.
- a period of time | phr |  |  | промежуток времени | a length of time | He lived there for *a period of time*. | Он жил там какое-то время.
- agree with somebody | phr |  |  | соглашаться с кем-либо | to have the same opinion as someone | I *agree with* you. | Я с тобой согласен.
- all day | phr |  |  | весь день | for the whole day | It rained *all day*. | Весь день шёл дождь.
- all over the world | phr |  |  | по всему миру | in every part of the world | People *all over the world* love football. | Люди по всему миру любят футбол.
- anything else | phr |  |  | что-нибудь ещё | any other thing | Do you want *anything else*? | Хотите что-нибудь ещё?
- around the world | phr |  |  | по всему миру; вокруг света | in many places on Earth | She travelled *around the world*. | Она путешествовала по всему миру.
- arrive at... | phr |  |  | прибыть в (здание, место) | to reach a building or a small place | We *arrived at* the station at six. | Мы прибыли на вокзал в шесть. | arrive in — город, страна
- good afternoon | interj | ɡʊd ˌæftɜːˈnun | ɡʊd ˌæftərˈnuːn | добрый день | a greeting used in the afternoon | *Good afternoon*, everyone! | Добрый день всем!
- good morning | interj | ɡʊd ˈmɔːnɪŋ | ɡʊd ˈmɔːrnɪŋ | доброе утро | a greeting used in the morning | *Good morning*! Did you sleep well? | Доброе утро! Хорошо спал?
- good night | interj | ɡʊd naɪt |  | спокойной ночи | said before going to bed or when leaving in the evening | *Good night*, see you tomorrow. | Спокойной ночи, до завтра.
- hey | interj | heɪ |  | эй; привет | used to get attention or as an informal greeting | *Hey*, how are you? | Привет, как дела?
- hi | interj | haɪ |  | привет | an informal greeting | *Hi*, I'm Max. | Привет, я Макс.
- oh | interj | əʊ | oʊ | о!, ох!, ах! | used to show surprise or other feelings | *Oh*, that's a nice surprise! | О, вот это приятный сюрприз!
- ok | adj | ˈəʊˈkeɪ | ˈoʊˈkeɪ | хорошо, ладно; нормальный | all right; acceptable | Is it *OK* if I open the window? | Ничего, если я открою окно? | пишут OK или okay
- yeah | interj | jeh | jæ | да, ага (разг.) | an informal way of saying yes | *Yeah*, I like it. | Ага, мне нравится.
