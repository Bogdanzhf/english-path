title: People and relationships
title_ru: Люди и отношения
topic: people
words:
- adult | n | ˈædʌlt | əˈdʌlt | взрослый | a person who is fully grown, not a child | Tickets cost ten dollars for *adults* and five for children. | Билеты стоят десять долларов для взрослых и пять — для детей.
- age | n | eɪdʒ |  | возраст | how old someone or something is | She started school at the *age* of six. | Она пошла в школу в возрасте шести лет.
- boy | n | bɔɪ |  | мальчик; парень | a male child or a young man | The *boy* is playing with a ball. | Мальчик играет с мячом.
- boyfriend | n | ˈbɔɪfrend |  | парень (друг в отношениях) | a man or boy that someone is in a romantic relationship with | Her *boyfriend* is from Spain. | Её парень из Испании.
- child | n | tʃaɪld |  | ребёнок | a young boy or girl | Every *child* in the class has a book. | У каждого ребёнка в классе есть книга. | мн. ч. children
- friend | n | frend |  | друг, подруга | a person you know well and like | Tom is my best *friend*. | Том — мой лучший друг.
- girl | n | ɡɜːl | ɡɜːrl | девочка; девушка | a female child or a young woman | That *girl* is my sister. | Эта девочка — моя сестра.
- girlfriend | n | ˈɡɜːlfrend | ˈɡɜːrlfrend | девушка (подруга в отношениях) | a woman or girl that someone is in a romantic relationship with | He met his *girlfriend* at university. | Он познакомился со своей девушкой в университете.
- group | n | ɡruːp |  | группа | a number of people or things together | We work in a small *group*. | Мы работаем в небольшой группе.
- member | n | ˈmembə | ˈmembər | член, участник | a person who belongs to a group | She is a *member* of the school choir. | Она поёт в школьном хоре.
- 'Mr | n | ˈmɪstɜː | ˈmɪstər | мистер, господин (перед фамилией) | a title used before a man''s family name | *Mr* Brown is our teacher. | Мистер Браун — наш учитель. | в британском пишут без точки: Mr'
- 'Mrs | n | ˈmɪsɪz |  | миссис, госпожа (замужняя женщина) | a title used before a married woman''s family name | *Mrs* Smith lives next door. | Миссис Смит живёт по соседству. | в британском пишут без точки: Mrs'
- mum | n | mʌm |  | мама | an informal word for mother (British) | My *mum* makes great pancakes. | Моя мама печёт отличные блины. | американское — mom
- name | n | neɪm |  | имя; название | the word that someone or something is called | What is your *name*? | Как тебя зовут? | first name — имя, last name / surname — фамилия
- number | n | ˈnəmbɜː | ˈnʌmbər | число; номер | a word or sign such as 1, 2 or 3; a phone number | What is your phone *number*? | Какой у тебя номер телефона?
- person | n | ˈpɜːsən | ˈpɜːrsən | человек | a man, woman or child | She is a very kind *person*. | Она очень добрый человек. | мн. ч. обычно people
- visitor | n | ˈvɪzɪtə | ˈvɪzɪtər | посетитель; гость | someone who goes to see a place or a person | The museum has many *visitors* every day. | В музее каждый день много посетителей.
- woman | n | ˈwʊmən |  | женщина | an adult female person | The *woman* in the red coat is my aunt. | Женщина в красном пальто — моя тётя. | мн. ч. women [ˈwɪmɪn]
