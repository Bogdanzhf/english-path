title: People and relationships
title_ru: Люди и отношения
topic: people
words:
- adult | n | ˈædʌlt | əˈdʌlt | взрослый | a person who is fully grown, not a child | Tickets cost ten dollars for *adults* and five for children. | Билеты стоят десять долларов для взрослых и пять — для детей.
- age | n | eɪdʒ |  | возраст | how old someone or something is | She started school at the *age* of six. | Она пошла в школу в возрасте шести лет.
- boy | n | bɔɪ |  | мальчик; парень | a male child or a young man | The *boy* is playing with a ball. | Мальчик играет с мячом.
- boyfriend | n | ˈbɔɪfrend |  | парень (друг в отношениях) | a man or boy that someone is in a romantic relationship with | Her *boyfriend* is from Spain. | Её парень из Испании.
- child | n | tʃaɪld |  | ребёнок | a young boy or girl | Every *child* in the class has a book. | У каждого ребёнка в классе есть книга. | мн. ч. children
