- girlfriend | n | ˈɡɜːlfrend | ˈɡɜːrlfrend | девушка (подруга в отношениях) | a woman or girl that someone is in a romantic relationship with | He met his *girlfriend* at university. | Он познакомился со своей девушкой в университете.
