title: Function words
title_ru: Служебные слова
topic: grammar
words:
- a | det | eɪ |  | (неопределённый артикль) один, какой-то | used before a singular noun when it is not a particular one | I have *a* cat. | У меня есть кошка. | перед гласным звуком — an
- an | det | ən | æn | (неопределённый артикль перед гласным звуком) | used instead of a before a vowel sound | She eats *an* apple every day. | Она каждый день ест яблоко. | an hour, an umbrella, но a university
- and | conj | ænd |  | и; а | used to join words or parts of sentences | I like tea *and* coffee. | Я люблю чай и кофе.
- 'because | conj | bɪˈkɒz | bɪˈkɔːz | потому что | for the reason that | I stayed at home *because* I was ill. | Я остался дома, потому что заболел. | because of + сущ.: because of the rain'
- but | conj | bʌt |  | но | used to show a contrast | It's small *but* comfortable. | Он маленький, но удобный.
- every | det | ˈevri | ˈevəri | каждый | all the people or things of a group | I go to the gym *every* day. | Я хожу в спортзал каждый день. | every + ед. ч.
- his | det | hɪz |  | его | belonging to him | This is *his* bag. | Это его сумка.
- if | conj | ɪf |  | если; ли | used to say that something depends on something else | *If* it rains, we'll stay at home. | Если пойдёт дождь, мы останемся дома.
- in | prep | ɪn |  | в, внутри; через (о времени) | inside a place; during a period | The keys are *in* my bag. | Ключи у меня в сумке. | in May, in 2020, in the morning
- it | pron | ɪt |  | он, она, оно (о предмете); это | used for a thing, an animal or a situation | Where is my phone? — *It* is on the table. | Где мой телефон? — Он на столе. | It's cold. — Холодно.
- many | det | ˈmeni |  | много | a large number of | There are *many* old churches in this city. | В этом городе много старых церквей. | с исчисляемыми; much — с неисчисляемыми
- my | det | maɪ |  | мой | belonging to me | *My* name is Anna. | Меня зовут Анна.
- on | prep | ɒn | ɑːn | на; в (о днях) | touching the top of something; on a day | The book is *on* the table. | Книга на столе. | on Monday, on 5 May
- or | conj | ɔː | ɔːr | или | used to give a choice | Tea *or* coffee? | Чай или кофе?
- our | det | ˈaʊə | ˈaʊər | наш | belonging to us | *Our* house is near the river. | Наш дом рядом с рекой.
- that | det | ðæt |  | тот, та, то; что | used for something further away; also joins parts of a sentence | *That* car is very old. | Та машина очень старая. | I think that… — Я думаю, что…
- the | det | ðə | ðʌ | (определённый артикль) этот, тот самый | used before a noun when it is clear which one | *The* sun is hot today. | Солнце сегодня жаркое.
- their | det | ðeə | ðer | их | belonging to them | *Their* children are at school. | Их дети в школе.
- your | det | jɔː | jɔːr | твой, ваш | belonging to you | Is this *your* coat? | Это твоё пальто?
