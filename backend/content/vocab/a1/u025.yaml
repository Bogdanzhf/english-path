title: Everyday phrases
title_ru: Разговорные фразы
topic: phrases
words:
- cell phone | phr |  |  | мобильный телефон (амер.) | a phone you can carry with you | Turn off your *cell phone*, please. | Выключите, пожалуйста, мобильный. | британское — mobile phone
- city centre | phr |  |  | центр города | the main part of a city | Our hotel is in the *city centre*. | Наш отель в центре города.
- come from... | phr |  |  | быть родом из | to be born in or live in a place | I *come from* Russia. | Я из России.
- come into something | phr |  |  | входить (куда-либо) | to enter a place | Please *come into* the kitchen. | Проходи на кухню.
- differences between a and b | phr |  |  | различия между A и B | ways in which two things are not the same | What are the *differences between* British and American English? | Какие различия между британским и американским английским?
- difficult for somebody | phr |  |  | трудно для кого-либо | hard for someone to do | This exercise is *difficult for* me. | Это упражнение трудное для меня.
- end in something | phr |  |  | заканчиваться (чем-либо) | to finish in a particular way | The story *ends in* a happy wedding. | История заканчивается счастливой свадьбой.
- every day | phr |  |  | каждый день | on all days | I walk the dog *every day*. | Я гуляю с собакой каждый день. | everyday (слитно) — повседневный
- excuse me | phr |  |  | извините (чтобы привлечь внимание) | a polite way to start talking to someone or to get past | *Excuse me*, where is the station? | Извините, где вокзал?
- family member | phr |  |  | член семьи | a person in your family | Every *family member* has a job at home. | У каждого члена семьи есть обязанности по дому.
- for a long time | phr |  |  | долго, давно | during a long period | I haven't seen her *for a long time*. | Я давно её не видел.
- for a moment | phr |  |  | на минутку | for a short time | Can you wait *for a moment*? | Можешь подождать минутку?
- for example | phr |  |  | например | used to give an example | I like fruit, *for example*, apples and bananas. | Я люблю фрукты, например яблоки и бананы.
- for lunch | phr |  |  | на обед | as a meal in the middle of the day | We had soup *for lunch*. | На обед у нас был суп.
- for many years | phr |  |  | много лет | during a long period of years | He worked here *for many years*. | Он работал здесь много лет.
- for the first time | phr |  |  | впервые | when something happens first | I saw the sea *for the first time*. | Я впервые увидел море.
- get home | phr |  |  | добраться до дома | to arrive at your house | I usually *get home* at six. | Обычно я прихожу домой в шесть.
- get married | phr |  |  | пожениться, выйти замуж | to become husband and wife | They *got married* last year. | Они поженились в прошлом году.
- get off | phr |  |  | выходить (из автобуса, поезда) | to leave a bus, train or plane | *Get off* at the next stop. | Выходите на следующей остановке.
- get on | phr |  |  | садиться (в автобус, поезд) | to enter a bus, train or plane | We *got on* the train at Paddington. | Мы сели в поезд на Паддингтоне.
