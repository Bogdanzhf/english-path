title: 'How and how much: adverbs'
title_ru: 'Как и насколько: наречия'
topic: manner
words:
- 'also | adv | ˈɔːlsəʊ | ˈɔːlsoʊ | тоже, также | in addition; too | She speaks French and *also* a little Chinese. | Она говорит по-французски, а также немного по-китайски. | обычно перед глаголом: I also like…'
- maybe | adv | ˈmeɪbi |  | может быть | perhaps; possibly | *Maybe* we'll go to the beach tomorrow. | Может быть, завтра пойдём на пляж.
- 'no | adv | nəʊ | noʊ | нет | used to give a negative answer | Are you tired? — *No*, I''m fine. | Ты устал? — Нет, всё хорошо. | no + сущ.: no money — нет денег'
- not | adv | nɒt | nɑːt | не | used to make a sentence negative | I am *not* hungry. | Я не голоден.
- please | adv | pliːz |  | пожалуйста (при просьбе) | used to ask politely | Two coffees, *please*. | Два кофе, пожалуйста. | в ответ на «спасибо» — you're welcome
- probably | adv | ˈprɒbəbli | ˈprɑːbəbli | вероятно | almost certainly | It will *probably* rain tomorrow. | Завтра, наверное, будет дождь.
- quickly | adv | ˈkwɪkli |  | быстро | at a fast speed | She *quickly* finished her lunch. | Она быстро доела обед.
- quite | adv | kwaɪt |  | довольно; совсем | fairly; completely | The film was *quite* good, but not great. | Фильм был довольно неплохим, но не отличным.
- really | adv | ˈriəli | ˈriːli | действительно; очень | in fact; very | This film is *really* good. | Этот фильм действительно хороший. | Really? — Правда?
- so | adv | səʊ | soʊ | так, настолько; поэтому | very; for this reason | I'm *so* happy to see you! | Я так рада тебя видеть!
- together | adv | təˈɡeðə | təˈɡeðər | вместе | with each other | Let's have lunch *together*. | Давай пообедаем вместе.
- too | adv | tuː |  | тоже; слишком | also; more than you need | I like it *too*. | Мне тоже нравится. | too hot — слишком жарко
- well | adv | wel |  | хорошо | in a good way | She speaks English very *well*. | Она очень хорошо говорит по-английски. | well — наречие к good; I'm well — я здоров
