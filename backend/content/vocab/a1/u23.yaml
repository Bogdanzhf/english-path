      options: ["She shouted at the team", "She asked the team to sit quietly", "She gave them chocolate", "She played loud music"]
      answer: 1
    - q: "Why did the coach remove two players?"
      options: ["They played badly", "They got hurt", "They were late", "They broke the rules"]
      answer: 1
