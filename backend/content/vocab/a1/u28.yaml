reading:
  title: "The Show Must Go On"
  title_ru: "Шоу должно продолжаться"
  text: |
    Sara and her friends had a small band. They played in Sara's garage, and her neighbors often complained about the noise. But this Saturday was special: the band had their first real concert at the town festival.

    For weeks, the band followed a strict schedule. They practised every evening. Sara made a list of songs, and everyone shared the work. Her professor at the music school helped them with the most difficult parts.

    On Friday, the weather forecast predicted a big storm. On Saturday morning, Sara received a message: "Because of the storm, the festival is cancelled." The band was very sad. "All that work, and now nothing," said the drummer.

    Then Sara noticed something. The sky was dark, but the rain was not as bad as the forecast predicted. "We own our instruments," she said. "We don't need a big stage. Let's play right here in my driveway!" They sent messages to all their friends. Within an hour, more than fifty people came.

    The concert was not boring at all. The band played in the rain, and people danced under umbrellas. Sara could barely hear her own voice because everyone was singing so loudly. "It was magic," she said later. The next day, they had to clean a lot of garbage from the driveway — but nobody minded. They rushed to plan the next concert.
  ru: |
    У Сары и её друзей была небольшая группа. Они играли в гараже у Сары, и соседи часто жаловались на шум. Но эта суббота была особенной: у группы был первый настоящий концерт на городском фестивале.

    Несколько недель группа жила по строгому графику. Они репетировали каждый вечер. Сара составила список песен, и все поделили работу. Её профессор в музыкальной школе помог им с самыми трудными местами.

    В пятницу прогноз погоды предсказал сильную бурю. В субботу утром Сара получила сообщение: «Из-за бури фестиваль отменён». Группа очень расстроилась. «Столько работы — и всё зря», — сказал барабанщик.

    И тут Сара кое-что заметила. Небо было тёмным, но дождь был не таким сильным, как обещал прогноз. «Инструменты у нас свои, — сказала она. — Нам не нужна большая сцена. Давайте сыграем прямо здесь, у меня на подъездной дорожке!» Они разослали сообщения всем друзьям. Меньше чем через час пришло больше пятидесяти человек.

    Концерт оказался совсем не скучным. Группа играла под дождём, а люди танцевали под зонтами. Сара едва слышала собственный голос — так громко все подпевали. «Это было волшебство», — сказала она потом. На следующий день пришлось убирать с дорожки кучу мусора — но никто не возражал. Они уже спешили планировать следующий концерт.
