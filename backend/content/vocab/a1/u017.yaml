title: Body and health
title_ru: Тело и здоровье
topic: body
words:
- arm | n | ɑːm | ɑːrm | рука (от плеча до кисти) | the long part of the body between the shoulder and the hand | He broke his *arm*. | Он сломал руку. | кисть — hand
- 'back | n | bæk |  | спина; задняя часть | the part of the body from the neck to the bottom | My *back* hurts. | У меня болит спина. | also adv: come back — вернуться'
- beer | n | ˈbiə | bɪr | пиво | an alcoholic drink made from grain | He ordered a *beer*. | Он заказал пиво.
- body | n | ˈbɒdi | ˈbɑːdi | тело | all the physical parts of a person or animal | Exercise is good for your *body*. | Упражнения полезны для тела.
- 'dress | n | dres |  | платье | a piece of clothing for a woman that covers the body and legs | She wore a beautiful *dress*. | На ней было красивое платье. | также гл.: dress — одеваться'
- ear | n | ˈiə | iːr | ухо | one of the two parts of the head you hear with | The dog has big *ears*. | У собаки большие уши.
- exercise | v | ˈeksəsaɪz | ˈeksərsaɪz | заниматься спортом, упражняться | to move your body to stay healthy | I *exercise* for thirty minutes every day. | Я занимаюсь спортом по тридцать минут каждый день. | сущ. exercise — упражнение
- eye | n | aɪ |  | глаз | one of the two parts of the face you see with | Close your *eyes*. | Закрой глаза.
- 'hair | n | heə | her | волосы | the thin threads that grow on your head | She has short dark *hair*. | У неё короткие тёмные волосы. | обычно ед. ч.: her hair is'
- hand | n | hænd |  | рука (кисть) | the part at the end of the arm with fingers | Wash your *hands* before dinner. | Помой руки перед ужином.
- head | n | hed |  | голова | the top part of the body with the eyes and mouth | I have a pain in my *head*. | У меня болит голова.
- health | n | helθ |  | здоровье | the condition of your body and mind | Smoking is bad for your *health*. | Курение вредит здоровью. | healthy — здоровый
- healthy | adj | ˈhelθi |  | здоровый; полезный | well, not ill; good for your health | Fruit is *healthy* food. | Фрукты — полезная еда.
- hungry | adj | ˈhʌŋɡri |  | голодный | wanting to eat | I'm very *hungry*. | Я очень голоден.
- 'laugh | n | lɑːf | læf | смех | the sound you make when something is funny | We heard a loud *laugh* from the next room. | Из соседней комнаты донёсся громкий смех. | глагол: to laugh at — смеяться над'
- leg | n | leɡ |  | нога | one of the long body parts that you stand and walk on | A spider has eight *legs*. | У паука восемь ног.
- mouth | n | maʊθ |  | рот | the part of the face you eat and speak with | Don't talk with your *mouth* full. | Не разговаривай с полным ртом.
- nose | n | nəʊz | noʊz | нос | the part of the face you smell with | He has a big *nose*. | У него большой нос.
- relax | v | rɪˈlæks |  | расслабляться, отдыхать | to rest and become calm | I *relax* by reading a good book. | Я расслабляюсь за хорошей книгой.
- sick | adj | sɪk |  | больной; тошнит | ill; feeling that you want to vomit | She is *sick* today. | Она сегодня болеет. | feel sick — тошнить
- sleep | v | sliːp |  | спать | to rest with your eyes closed | I usually *sleep* eight hours a night. | Обычно я сплю восемь часов в сутки. | sleep — slept — slept; сущ. sleep — сон
- thirsty | adj | ˈθɜːsti | ˈθɜːrsti | испытывающий жажду | wanting to drink | I'm *thirsty* — can I have some water? | Я хочу пить — можно воды?
- tooth | n | tuːθ |  | зуб | one of the hard white things in your mouth | I brush my *teeth* twice a day. | Я чищу зубы два раза в день. | мн. ч. teeth
- wine | n | waɪn |  | вино | an alcoholic drink made from grapes | They ordered a glass of red *wine* with dinner. | За ужином они заказали бокал красного вина.
