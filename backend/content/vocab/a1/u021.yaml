- 'hard | adj | hɑːd | hɑːrd | трудный; твёрдый | difficult; not soft | The test was really *hard*. | Тест был действительно трудным. | также нар.: work hard — усердно работать'
- hot | adj | hɒt | hɑːt | горячий; жаркий; острый | having a high temperature; spicy | Be careful, the soup is *hot*. | Осторожно, суп горячий.
- orange | adj | ˈɒrɪndʒ | ˈɔːrəndʒ | оранжевый; апельсин (сущ.) | having the colour between red and yellow; a round fruit | She has an *orange* bag. | У неё оранжевая сумка.
- pink | adj | pɪŋk |  | розовый | pale red in colour | She wore a *pink* scarf. | На ней был розовый шарф.
