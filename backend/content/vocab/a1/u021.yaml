title: 'Describing: size, shape and looks'
title_ru: 'Описание: размер, форма, внешний вид'
topic: describing
words:
- blonde | n | blɒnd | blɑːnd | блондинка | a person with pale yellow hair | Her sister is a tall *blonde*. | Её сестра — высокая блондинка. | прил. blond(e) — светловолосый
- clean | v | kliːn |  | чистить, убирать | to make something free from dirt | We *clean* the house every Saturday. | Мы убираем дом каждую субботу. | прил. clean — чистый
- cold | adj | kəʊld | koʊld | холодный; простуда (сущ.) | having a low temperature; an illness of the nose and throat | It's very *cold* today. | Сегодня очень холодно. | have a cold — быть простуженным
- cool | adj | kuːl |  | прохладный; классный (разг.) | a little cold; very good | It's *cool* in the evening. | Вечером прохладно. | That's cool! — Классно!
- delicious | adj | dɪˈlɪʃəs |  | очень вкусный | having a very good taste | Thank you — the soup was *delicious*! | Спасибо, суп был восхитительный!
