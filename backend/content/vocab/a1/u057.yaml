title: Thinking and opinions
title_ru: Мысли и мнения
topic: mind
words:
- believe | v | bɪˈliːv |  | верить; полагать | to think that something is true | I don't *believe* you! | Я тебе не верю!
- choose | v | tʃuːz |  | выбирать | to decide which thing you want | You can *choose* any cake you like. | Можешь выбрать любой торт, какой нравится. | choose — chose — chosen
- compare | v | kəmˈpeə | kəmˈper | сравнивать | to look at how two things are similar or different | Don't *compare* yourself with other people. | Не сравнивай себя с другими людьми.
- decide | v | dɪˈsaɪd |  | решать, принимать решение | to choose something after thinking | We *decided* to stay at home. | Мы решили остаться дома.
- east | n | iːst |  | восток | the direction where the sun comes up | The sun rises in the *east*. | Солнце встаёт на востоке.
- forget | v | fəˈɡet | fərˈɡet | забывать | to not remember | Don't *forget* your keys! | Не забудь ключи! | forget – forgot – forgotten
- guess | v | ɡes |  | угадывать; предполагать | to give an answer when you are not sure | *Guess* how old I am! | Угадай, сколько мне лет!
- know | v | nəʊ | noʊ | знать | to have information in your mind | I *know* the answer. | Я знаю ответ. | know – knew – known
- math | n | mæθ |  | математика (амер.) | mathematics | *Math* is my favourite subject. | Математика — мой любимый предмет. | британское — maths
- part | n | pɑːt | pɑːrt | часть | a piece of something | The first *part* of the book is boring. | Первая часть книги скучная. | take part in — участвовать в
- reason | n | ˈriːzn |  | причина | a fact that explains why something happens | There are many *reasons* why languages die. | Есть много причин, по которым языки умирают.
- remember | v | rɪˈmembə | riːˈmembər | помнить, вспоминать | to keep in your mind | I *remember* my first day at school. | Я помню свой первый день в школе.
- study | v | ˈstʌdi |  | учиться, изучать | to learn about a subject | She *studies* medicine at university. | Она изучает медицину в университете.
- think | v | θɪŋk |  | думать, считать | to have an opinion; to use your mind | What do you *think* about the new film? | Что ты думаешь о новом фильме? | think — thought — thought
- understand | v | ˌʌndəˈstænd | ˌʌndərˈstænd | понимать | to know what something means | I don't *understand* this word. | Я не понимаю это слово. | understand — understood — understood
