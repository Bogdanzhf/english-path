title: Time and dates
title_ru: Время и даты
topic: time
words:
- afternoon | n | ˌæftɜːˈnun | ˌæftərˈnuːn | день, время после полудня | the time between midday and evening | I'll call you in the *afternoon*. | Я позвоню тебе днём.
- autumn | n | ˈɔːtəm |  | осень | the season between summer and winter | The leaves turn red in *autumn*. | Осенью листья краснеют. | n в конце не читается; амер. fall
- birthday | n | ˈbɜːθdeɪ | ˈbɜːrθdeɪ | день рождения | the day each year when you remember the day you were born | Happy *birthday*! | С днём рождения!
- day | n | deɪ |  | день, сутки | a period of 24 hours | We spent two *days* in Rome. | Мы провели два дня в Риме.
- evening | n | ˈivnɪŋ | ˈiːvnɪŋ | вечер | the time between afternoon and night | We watch TV in the *evening*. | Вечером мы смотрим телевизор.
- festival | n | ˈfestɪvl |  | фестиваль, праздник | a special event with music, food or celebrations | We went to a music *festival* in the summer. | Летом мы ездили на музыкальный фестиваль.
- holiday | n | ˈhɒlədeɪ | ˈhɑːlədeɪ | праздник; отпуск | a day when people don't work; a trip for rest | Christmas is my favourite *holiday*. | Рождество — мой любимый праздник. | брит. on holiday = амер. on vacation
- 'hour | n | ˈaʊə | ˈaʊər | час | sixty minutes | The flight takes three *hours*. | Перелёт длится три часа. | h не читается: an hour'
- Monday | n | ˈməndeɪ | ˈmʌndeɪ | понедельник | the day after Sunday | I start a new job on *Monday*. | В понедельник я выхожу на новую работу.
- picnic | n | ˈpɪknɪk |  | пикник | a meal you eat outside | Let's have a *picnic* in the park. | Давай устроим пикник в парке.
- Saturday | n | ˈsætɪdeɪ |  | суббота | the day after Friday | We go to the market on *Saturday*. | В субботу мы ходим на рынок.
- spring | n | sprɪŋ |  | весна | the season after winter | Flowers bloom in *spring*. | Весной цветут цветы.
- Sunday | n | ˈsəndeɪ | ˈsʌndeɪ | воскресенье | the day after Saturday | On *Sunday* we visit our grandparents. | В воскресенье мы навещаем бабушку с дедушкой.
- Thursday | n | ˈθɜːzdeɪ | ˈθɜːrzdeɪ | четверг | the day after Wednesday | The meeting is on *Thursday*. | Встреча в четверг.
- tomorrow | adv | təˈmɒrəʊ | təˈmɑːroʊ | завтра | on the day after today | See you *tomorrow*! | До завтра!
- Tuesday | n | ˈtjuzdeɪ | ˈtjuːzdeɪ | вторник | the day after Monday | I have English on *Tuesday*. | Во вторник у меня английский.
- vacation | n | veɪˈkeɪʃən |  | отпуск, каникулы (амер.) | a time when you don't work or go to school | We're going on *vacation* next week. | На следующей неделе мы едем в отпуск. | британское — holiday
- Wednesday | n | ˈwenzdeɪ |  | среда | the day after Tuesday | The shop is closed on *Wednesday*. | В среду магазин закрыт. | произносится [ˈwenzdeɪ]
- weekend | n | wiːˈkend | ˈwiːkend | выходные | Saturday and Sunday | Have a nice *weekend*! | Хороших выходных!
- winter | n | ˈwɪntə | ˈwɪntər | зима | the coldest season of the year | It snows a lot in *winter*. | Зимой много снега.
- yesterday | adv | ˈjestədeɪ | ˈjestərdeɪ | вчера | on the day before today | I saw her *yesterday*. | Я видел её вчера.
