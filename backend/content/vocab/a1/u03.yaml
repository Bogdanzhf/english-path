reading:
  title: "The Space Report"
  title_ru: "Доклад о космосе"
  text: |
    Lily had a big problem. Her teacher asked every student to write a report about a planet, and Lily did not understand space at all. "If I fail, I will get a bad grade," she thought.

    After school, she went to the library instead of going home. Among the books, she found several about the planets. One book had a chart with the size and shape of every planet. Another had beautiful photographs of Saturn and its rings.

    Lily read for hours. Suddenly, she looked out of the window. There was a strange cloud in the sky. It was round and very bright. "Is that an alien ship?" she asked herself. "I suppose not. It's probably just the sun behind a cloud."

    That night, Lily started her report about Mars. She described its red colour, its tall mountains and its cold weather. She also wrote about the view of Earth from Mars: a small blue star.

    A week later, the teacher gave her an A. "Have you ever thought about becoming a scientist?" he asked. Lily smiled. She solved her problem, and now she loves space.
  ru: |
    У Лили была большая проблема. Учитель попросил каждого ученика написать доклад о какой-нибудь планете, а Лили совсем не разбиралась в космосе. «Если я не справлюсь, получу плохую оценку», — думала она.

    После школы она пошла не домой, а в библиотеку. Среди книг она нашла несколько о планетах. В одной книге была таблица с размером и формой каждой планеты. В другой — красивые фотографии Сатурна и его колец.

    Лили читала несколько часов. Вдруг она выглянула в окно. В небе было странное облако. Оно было круглым и очень ярким. «Это корабль инопланетян?» — спросила она себя. «Полагаю, что нет. Скорее всего, это просто солнце за облаком».

    В тот вечер Лили начала доклад о Марсе. Она описала его красный цвет, высокие горы и холодную погоду. Ещё она написала о том, как Земля выглядит с Марса: маленькая голубая звезда.

    Через неделю учитель поставил ей «отлично». «Ты когда-нибудь думала стать учёным?» — спросил он. Лили улыбнулась. Она решила свою проблему, и теперь она обожает космос.
