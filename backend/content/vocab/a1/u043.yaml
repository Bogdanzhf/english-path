title: Everyday phrases
title_ru: Разговорные фразы
topic: phrases
words:
- have time | phr |  |  | иметь время | to be free to do something | Do you *have time* for a coffee? | У тебя есть время выпить кофе?
- he or she | phr |  |  | он или она | used when you don't know if a person is male or female | Ask the doctor what *he or she* thinks. | Спросите врача, что он или она думает.
- his or her | phr |  |  | его или её | used when you don't know if a person is male or female | Each student has *his or her* own desk. | У каждого ученика свой стол.
- how about...? | phr |  |  | как насчёт…? | used to make a suggestion | *How about* going to the cinema? | Как насчёт кино? | how about + -ing
- 'how are you? | phr |  |  | как дела?, как поживаешь? | used to ask about someone''s health or life | Hi, Tom! *How are you*? | Привет, Том! Как дела? | ответ: I''m fine, thanks.'
- how long...? | phr |  |  | как долго…?, сколько времени…? | used to ask about time or length | *How long* does the trip take? | Сколько длится поездка?
- how many...? | phr |  |  | сколько…? (исчисляемые) | used to ask about a number | *How many* brothers do you have? | Сколько у тебя братьев?
- how much...? | phr |  |  | сколько…? (неисчисляемые; о цене) | used to ask about an amount or price | *How much* is this T-shirt? | Сколько стоит эта футболка?
- how often...? | phr |  |  | как часто…? | used to ask about frequency | *How often* do you go to the gym? | Как часто ты ходишь в спортзал?
- I'm sorry | phr |  |  | извините, мне жаль | used to apologise or to show sympathy | *I'm sorry* I'm late. | Извините, что опоздал.
- important for somebody/something | phr |  |  | важный для | having a big value for someone | Exercise is *important for* your health. | Физкультура важна для здоровья.
- in April | phr |  |  | в апреле | during the month of April | The weather is warm *in April*. | В апреле тепло. | in + месяц
- in bed | phr |  |  | в постели | lying in your bed | She's still *in bed*. | Она ещё в постели.
- in class | phr |  |  | на уроке, на занятии | during a lesson | Don't use your phone *in class*. | Не пользуйся телефоном на уроке.
- in fact | phr |  |  | на самом деле, фактически | used to add something true or surprising | It looks expensive, but *in fact* it's cheap. | Выглядит дорого, а на самом деле дёшево.
- in front of | phr |  |  | перед, впереди | close to the front side of | There's a tree *in front of* the house. | Перед домом растёт дерево.
- in my opinion | phr |  |  | по-моему, на мой взгляд | used to give your view | *In my opinion*, it's a great film. | По-моему, это отличный фильм.
- in school | phr |  |  | в школе (учиться) | studying at school | Are your children still *in school*? | Твои дети ещё учатся в школе?
- in space | phr |  |  | в космосе | outside the Earth's air | Yuri Gagarin was the first man *in space*. | Юрий Гагарин был первым человеком в космосе.
