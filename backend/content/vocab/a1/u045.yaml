title: Function words
title_ru: Служебные слова
topic: grammar
words:
- another | det | əˈnʌðə | əˈnʌðər | ещё один; другой | one more; a different one | Would you like *another* cup of tea? | Хотите ещё чашку чая?
- any | det | ˈeni |  | какой-нибудь; любой; нисколько | some (in questions and negatives) | Do you have *any* questions? | У вас есть вопросы?
- anyone | pron | ˈenɪwɒn | ˈeniːwʌn | кто-нибудь; любой | any person | Does *anyone* speak French? | Кто-нибудь говорит по-французски?
- anything | pron | ˈenɪθɪŋ | ˈeniːθɪŋ | что-нибудь; что угодно | any thing | Do you need *anything*? | Тебе что-нибудь нужно?
- each other | pron | iːtʃ ˈʌðə | iːtʃ ˈʌðər | друг друга | used to say that each person does something to the other | They love *each other*. | Они любят друг друга.
- 'everybody | pron | ˈevrɪbɒdi | ˈevriːbɑːdi | все, каждый | every person | *Everybody* likes her. | Все её любят. | глагол в ед. ч.: everybody is'
- everyone | pron | ˈevrɪwɒn | ˈevriːwʌn | все, каждый | every person | *Everyone* is here. | Все здесь.
- everything | pron | ˈevrɪθɪŋ | ˈevriːθɪŋ | всё | all things | *Everything* is ready. | Всё готово.
- him | pron | hɪm |  | его, ему | a man or boy already mentioned (as an object) | I called *him* yesterday. | Я звонил ему вчера.
- no one | pron | nəʊ wɒn | noʊ wʌn | никто | no person | *No one* was at home. | Дома никого не было.
- nobody | pron | ˈnəʊbɒdi | ˈnoʊbɑːdiː | никто | no person | *Nobody* knows the answer. | Никто не знает ответа.
- nothing | pron | ˈnʌθɪŋ |  | ничего, ничто | not anything | There's *nothing* in the fridge. | В холодильнике ничего нет.
- somebody | pron | ˈsʌmbɒdi | ˈsʌmbɑːdi | кто-то, кто-нибудь | a person (not known) | *Somebody* is at the door. | Кто-то стоит у двери.
- someone | pron | ˈsʌmwɒn | ˈsʌmwʌn | кто-то, кто-нибудь | a person (not known) | I need *someone* to help me. | Мне нужен кто-нибудь в помощь.
- something | pron | ˈsʌmθɪŋ |  | что-то, что-нибудь | a thing (not known) | I want to tell you *something*. | Я хочу тебе кое-что сказать.
- these | det | ðiːz |  | эти | the people or things near you (plural) | *These* shoes are new. | Эти туфли новые.
- those | det | ðəʊz | ðoʊz | те | the people or things further away (plural) | Who are *those* people? | Кто те люди?
- us | pron | ʌs |  | нас, нам | the speaker and other people (as an object) | Come with *us*! | Пойдём с нами!
- yourself | pron | jɔːˈself | ˈjɔːrself | себя, себе; сам | used when the person you speak to does the action to themselves | Help *yourself* to some cake. | Угощайся тортом. | мн. ч. yourselves
