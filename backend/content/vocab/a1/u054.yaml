title: Everyday phrases
title_ru: Разговорные фразы
topic: phrases
words:
- on TV | phr |  |  | по телевизору | shown on television | There's a good film *on TV* tonight. | Сегодня по телевизору хороший фильм.
- once a... | phr |  |  | раз в… | one time in each period | I go swimming *once a* week. | Я хожу плавать раз в неделю.
- one day | phr |  |  | однажды; когда-нибудь | at some time in the past or future | *One day*, I'll visit Japan. | Когда-нибудь я побываю в Японии.
- out of something | phr |  |  | из (чего-либо) | moving from the inside of something | He took the keys *out of* his pocket. | Он достал ключи из кармана.
- over there | phr |  |  | вон там | in that place | My car is *over there*. | Моя машина вон там.
- pay for something | phr |  |  | платить за | to give money for something | I'll *pay for* the drinks. | Я заплачу за напитки.
- phone call | phr |  |  | телефонный звонок | when you call someone on the phone | I have to make a *phone call*. | Мне нужно позвонить.
- phone number | phr |  |  | номер телефона | the number you use to call someone | Can I have your *phone number*? | Можно твой номер телефона?
- plan for something | phr |  |  | план (на что-либо) | an idea of what you will do | What are your *plans for* the summer? | Какие у тебя планы на лето?
- play with somebody/something | phr |  |  | играть с | to have fun with someone or a toy | The kids *play with* the dog. | Дети играют с собакой.
- pretty good | phr |  |  | довольно хороший, неплохой | quite good | The food was *pretty good*. | Еда была неплохой.
- really enjoy | phr |  |  | очень нравиться | to like very much | I *really enjoy* my job. | Мне очень нравится моя работа.
- really good | phr |  |  | очень хороший | very good | This pizza is *really good*. | Эта пицца очень вкусная.
- really like | phr |  |  | очень нравиться | to like very much | I *really like* your new haircut. | Мне очень нравится твоя новая стрижка.
- right now | phr |  |  | прямо сейчас | at this moment | I'm busy *right now*. | Сейчас я занят.
- see you | phr |  |  | до встречи, пока | goodbye (informal) | *See you* tomorrow! | До завтра!
- sit down | phr |  |  | садиться | to take a seat | Please *sit down*. | Садитесь, пожалуйста.
- someone else | phr |  |  | кто-то другой | another person | Ask *someone else*. | Спроси кого-нибудь другого.
- speak to somebody | phr |  |  | говорить с кем-либо | to talk to someone | Can I *speak to* the manager? | Можно поговорить с менеджером?
