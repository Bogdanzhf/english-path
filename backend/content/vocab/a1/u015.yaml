title: Clothes and appearance
title_ru: Одежда и внешность
topic: clothes
words:
- apron | n | ˈeɪprən |  | фартук | a piece of clothing you wear over your clothes when cooking | Put on an *apron* before you cook. | Надень фартук, прежде чем готовить.
- 'clothes | n | kləʊðz | kloʊðz | одежда | things you wear, like shirts and trousers | I need to buy some new *clothes*. | Мне нужно купить новую одежду. | всегда мн. ч.: clothes are'
- coat | n | kəʊt | koʊt | пальто | a warm piece of clothing you wear outside | It's cold — wear your *coat*. | Холодно — надень пальто.
- glasses | n | ˈɡlɑːsɪz | ˈɡlæsəz | очки | two pieces of glass in a frame that help you see | I need my *glasses* to read. | Мне нужны очки, чтобы читать.
- haircut | n | ˈheəkʌt | ˈherkʌt | стрижка | the act or style of cutting hair | I like your new *haircut*. | Мне нравится твоя новая стрижка.
- hat | n | hæt |  | шляпа; шапка | a thing you wear on your head | He always wears a *hat*. | Он всегда носит шляпу.
- jacket | n | ˈdʒækɪt | ˈdʒækət | куртка; пиджак | a short coat | Take a *jacket* — it might be cold. | Возьми куртку — может быть холодно.
- jeans | n | dʒiːnz |  | джинсы | trousers made of strong blue cotton | I usually wear *jeans*. | Я обычно ношу джинсы.
- jewelry | n | ˈdʒuːəlri |  | украшения, бижутерия | rings, necklaces and other things you wear to look nice | She doesn't wear much *jewelry*. | Она носит мало украшений. | британское — jewellery
- ribbon | n | ˈrɪbən |  | лента | a long narrow piece of cloth | She tied her hair with a red *ribbon*. | Она завязала волосы красной лентой.
- shirt | n | ʃɜːt | ʃɜːrt | рубашка | a piece of clothing with buttons, worn on the top part of the body | He's wearing a white *shirt*. | Он в белой рубашке.
- shoe | n | ʃuː |  | туфля, ботинок | a thing you wear on your foot | These *shoes* are very comfortable. | Эти туфли очень удобные.
- skirt | n | skɜːt | skɜːrt | юбка | a piece of clothing for women that hangs from the waist | She bought a new *skirt*. | Она купила новую юбку.
- style | n | staɪl |  | стиль | a particular way of dressing or doing something | She has her own unique *style*. | У неё свой неповторимый стиль.
- sweater | n | ˈswetə | ˈswetər | свитер | a warm piece of clothing with sleeves, often made of wool | Put on a *sweater*, it's cold. | Надень свитер, холодно.
- T-shirt | n | ˈtisɜːt | ˈtiːsɜːrt | футболка | a simple cotton shirt with short sleeves | He was wearing jeans and a *T-shirt*. | Он был в джинсах и футболке.
- trousers | n | ˈtraʊsəz | ˈtraʊzərz | брюки | a piece of clothing that covers both legs | These *trousers* are too long. | Эти брюки слишком длинные. | американское — pants
- wear | v | weə | wer | носить, быть одетым | to have clothes or jewellery on your body | She always *wears* a red scarf. | Она всегда носит красный шарф. | wear — wore — worn
