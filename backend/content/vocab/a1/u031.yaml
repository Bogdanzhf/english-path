title: Travel and transport
title_ru: Путешествия и транспорт
topic: travel
words:
- airplane | n | ˈepleɪn | ˈerpleɪn | самолёт (амер.) | a vehicle with wings that flies | The *airplane* landed on time. | Самолёт приземлился вовремя. | британское — aeroplane, чаще plane
- airport | n | ˈeəpɔːt | ˈerpɔːrt | аэропорт | a place where planes land and take off | I'll meet you at the *airport*. | Я встречу тебя в аэропорту.
- bicycle | n | ˈbaɪsɪkl |  | велосипед | a vehicle with two wheels that you ride by pushing pedals | She rides her *bicycle* to work. | Она ездит на работу на велосипеде. | разг. bike
- bike | n | baɪk |  | велосипед | a vehicle with two wheels that you ride by pushing pedals | I ride my *bike* to work every day. | Я каждый день езжу на работу на велосипеде. | полное слово — bicycle
- boat | n | bəʊt | boʊt | лодка, судно | a small vehicle that travels on water | We took a *boat* to the little island. | Мы поплыли на лодке на маленький остров.
- book | v | bʊk |  | бронировать, заказывать | to arrange to have a seat, room or ticket in advance | I've *booked* a table for four at eight o'clock. | Я забронировал столик на четверых на восемь часов. | сущ. book — книга
- bus | n | bʌs |  | автобус | a large vehicle that carries many passengers | I take the *bus* to school every morning. | Каждое утро я езжу в школу на автобусе. | мн. ч. buses
- car | n | kɑː | kɑːr | машина, автомобиль | a vehicle with four wheels for a few people | My *car* is red. | Моя машина красная.
- driver | n | ˈdraɪvə | ˈdraɪvər | водитель | a person who drives a car, bus, etc. | The bus *driver* was very friendly. | Водитель автобуса был очень приветлив.
- flight | n | flaɪt |  | рейс, полёт | a journey in a plane | Our *flight* is at ten. | Наш рейс в десять.
- journey | n | ˈdʒɜːni | ˈdʒɜːrni | путешествие, поездка | a long trip from one place to another | The *journey* from Moscow to Vladivostok takes a week by train. | Путешествие из Москвы во Владивосток на поезде занимает неделю.
- map | n | mæp |  | карта | a picture of an area showing roads, towns, etc. | Can you show me on the *map*? | Можете показать на карте?
- plane | n | pleɪn |  | самолёт | a vehicle with wings that flies | Our *plane* landed on time. | Наш самолёт приземлился вовремя. | = aeroplane (брит.), airplane (амер.)
- taxi | n | ˈtæksi |  | такси | a car with a driver that you pay to take you somewhere | Let's take a *taxi* to the airport. | Давай возьмём такси до аэропорта.
- tourist | n | ˈtɔːrɪst | ˈtʊrəst | турист | a person who travels for pleasure | The city is full of *tourists* in summer. | Летом город полон туристов.
- travel | v | ˈtrævl |  | путешествовать, ездить | to go from one place to another, often far away | My parents *travel* to a new country every year. | Мои родители каждый год ездят в новую страну. | брит. travelled, travelling; амер. traveled, traveling
- trip | n | trɪp |  | поездка | a short journey for a holiday or business | How was your *trip* to Paris? | Как прошла твоя поездка в Париж?
- visit | v | ˈvɪzɪt |  | посещать, навещать | to go to see a person or a place | We *visit* our grandmother every Sunday. | Мы навещаем бабушку каждое воскресенье.
- way | n | weɪ |  | путь, дорога; способ | the route to a place; a method | Is this the *way* to the station? | Это дорога к вокзалу? | by the way — кстати
reading:
  title: Dr. Brown's Advice
  title_ru: Совет доктора Брауна
  text: |
    Mr. Hill was forty-five years old. He worked in an office and sat at a computer all day. He did not often move, and his weight increased every year. One day, he felt a pain in his chest and went to see a doctor.

    Dr. Brown listened to his heart. "Your heart is fine," she said. "But your life is not very active. At your age, it is important to move every day. Choose a sport that is fun for you."

    Mr. Hill thought about it. Football was too fast for him, and golf was too slow. During his school years, he loved riding a bike. So he bought a new bike and started riding to work. It was only five kilometers.

    At first, it was hard. His legs hurt, and his balance was bad. But he did not stop. After three months, he felt like a new man. He had plenty of energy and he slept well.

    Now Mr. Hill is fifty, and he rides with his son every weekend. "Exercise is not only for young people," he tells other adults. "It's never too late to start."
  ru: |
    Мистеру Хиллу было сорок пять лет. Он работал в офисе и весь день сидел за компьютером. Двигался он нечасто, и его вес рос с каждым годом. Однажды он почувствовал боль в груди и пошёл к врачу.

    Доктор Браун послушала его сердце. «С сердцем всё в порядке, — сказала она. — Но ваша жизнь не очень активна. В вашем возрасте важно двигаться каждый день. Выберите спорт, который вам по душе».

    Мистер Хилл задумался. Футбол был для него слишком быстрым, а гольф — слишком медленным. В школьные годы он обожал кататься на велосипеде. И вот он купил новый велосипед и начал ездить на нём на работу. Это было всего пять километров.

    Сначала было тяжело. Ноги болели, а равновесие держалось плохо. Но он не сдавался. Через три месяца он почувствовал себя другим человеком. Энергии было полно, и спал он хорошо.

    Сейчас мистеру Хиллу пятьдесят, и каждые выходные он катается вместе с сыном. «Спорт — не только для молодых, — говорит он другим взрослым. — Начать никогда не поздно».
  questions:
  - q: Why did Mr. Hill go to the doctor?
    options:
    - He broke his leg
    - He felt a pain in his chest
    - He wanted a new job
    - His son was ill
    answer: 1
  - q: What did the doctor tell him to do?
    options:
    - Stop working
    - Eat more
    - Choose a sport he enjoys
    - Play golf
    answer: 2
  - q: How far did Mr. Hill ride to work?
    options:
    - Two kilometers
    - Five kilometers
    - Ten kilometers
    - Fifty kilometers
    answer: 1
