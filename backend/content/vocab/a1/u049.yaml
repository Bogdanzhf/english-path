title: Communication and language
title_ru: Общение и язык
topic: communication
words:
- address | n | ˈædres |  | адрес | the details of where you live | What's your email *address*? | Какой у тебя адрес электронной почты?
- 'advice | n | ədˈvaɪs |  | совет | an opinion about what someone should do | Can you give me some *advice*? | Можешь дать мне совет? | неисчисляемое: a piece of advice; гл. advise'
- chart | n | tʃɑːt | tʃɑːrt | таблица, диаграмма | a picture or table that shows information | The *chart* shows the weather for the whole month. | Диаграмма показывает погоду на весь месяц.
- conversation | n | kɒnvəˈseɪʃən | ˌkɑːnvərˈseɪʃən | разговор, беседа | a talk between two or more people | We had a long *conversation*. | У нас был долгий разговор.
- credit card | n | ˈkredɪt kɑːd | ˈkredət kɑːrd | кредитная карта | a plastic card you use to pay | Can I pay by *credit card*? | Можно расплатиться кредитной картой?
- description | n | dɪˈskrɪpʃn |  | описание | words that say what someone or something is like | The police asked for a *description* of the thief. | Полиция попросила описать вора.
- dialogue | n | ˈdaɪəlɒɡ | ˈdaɪəlɔːɡ | диалог | a conversation in a book, play or film | Read the *dialogue* aloud. | Прочитайте диалог вслух.
- goodbye | interj | ɡʊdˈbaɪ | ˌɡʊdˈbaɪ | до свидания, пока | said when you leave | *Goodbye*! See you soon. | До свидания! До скорой встречи.
- hello | interj | həˈləʊ | həˈloʊ | здравствуйте, привет; алло | used as a greeting or on the phone | *Hello*, my name is Anna. | Здравствуйте, меня зовут Анна.
- language | n | ˈlæŋɡwɪdʒ |  | язык | a system of words used by people to communicate | How many *languages* do you speak? | На скольких языках ты говоришь?
- letter | n | ˈletə | ˈletər | письмо; буква | a written message; a sign in the alphabet | I wrote a *letter* to my friend. | Я написал письмо другу.
- list | n | lɪst |  | список | words or numbers written one after another | I made a shopping *list*. | Я составил список покупок.
- meaning | n | ˈmiːnɪŋ |  | значение, смысл | what a word or idea means | What is the *meaning* of this word? | Каково значение этого слова?
- menu | n | ˈmenjuː |  | меню | a list of food in a restaurant | Can I see the *menu*, please? | Можно меню?
- note | n | nəʊt | noʊt | записка; заметка | a short piece of writing | I left a *note* on the table. | Я оставил записку на столе. | take notes — делать заметки
- paragraph | n | ˈpærəɡræf |  | абзац | a part of a text that starts on a new line | Read the second *paragraph*. | Прочитайте второй абзац.
- report | n | rɪˈpɔːt | rɪˈpɔːrt | доклад, отчёт | a piece of writing that gives information about something | I have to write a *report* about animals in Africa. | Мне нужно написать доклад о животных Африки.
- story | n | ˈstɔːri |  | история, рассказ | a description of events, real or imagined | Tell me a *story*! | Расскажи мне историю!
- text | n | tekst |  | текст | written words | Read the *text* and answer the questions. | Прочитайте текст и ответьте на вопросы.
- thanks | interj | θæŋks |  | спасибо (разг.) | thank you | *Thanks* for your help! | Спасибо за помощь!
- ticket | n | ˈtɪkɪt | ˈtɪkət | билет | a piece of paper that lets you travel or enter | I bought two *tickets* for the concert. | Я купил два билета на концерт.
- title | n | ˈtaɪtl |  | название, заглавие | the name of a book, film, etc. | What's the *title* of the song? | Как называется эта песня?
- topic | n | ˈtɒpɪk | ˈtɑːpɪk | тема | a subject that you talk or write about | The *topic* of today's lesson is food. | Тема сегодняшнего урока — еда.
