title: Everyday phrases
title_ru: Разговорные фразы
topic: phrases
words:
- get ready | phr |  |  | готовиться, собираться | to prepare yourself | *Get ready* — we're leaving in five minutes! | Собирайся — выходим через пять минут!
- get there | phr |  |  | добраться туда | to arrive at a place | How do I *get there*? | Как мне туда добраться?
- get to... | phr |  |  | добраться до | to arrive at a place | How long does it take to *get to* the airport? | Сколько времени ехать до аэропорта?
- go back | phr |  |  | возвращаться | to return to a place | I want to *go back* to Italy one day. | Я хочу когда-нибудь вернуться в Италию.
- 'go home | phr |  |  | идти домой | to return to your house | It''s late — let''s *go home*. | Уже поздно — пойдём домой. | без to: go home'
- go into something | phr |  |  | входить (во что-либо) | to enter a place | Don't *go into* that room! | Не заходи в ту комнату!
- go out | phr |  |  | выходить; ходить куда-нибудь развлечься | to leave home for fun | We *go out* every Friday. | По пятницам мы куда-нибудь выбираемся.
- go to bed | phr |  |  | ложиться спать | to get into bed to sleep | I *go to bed* at eleven. | Я ложусь спать в одиннадцать.
- go to school | phr |  |  | ходить в школу, учиться в школе | to attend school | My little sister *goes to school* now. | Моя младшая сестра уже ходит в школу.
- go to work | phr |  |  | ходить на работу | to travel to your job | He *goes to work* by car. | Он ездит на работу на машине.
- good at something | phr |  |  | хорошо умеющий что-либо | able to do something well | She's *good at* maths. | У неё хорошо получается математика.
- good for somebody/something | phr |  |  | полезно для | helpful, healthy for | Vegetables are *good for* you. | Овощи полезны.
- good news | phr |  |  | хорошие новости | information that makes you happy | I have some *good news*! | У меня хорошие новости!
- good thing | phr |  |  | хорошо, что…; хорошая вещь | something positive | It's a *good thing* you came early. | Хорошо, что ты пришёл пораньше.
- guess what... | phr |  |  | угадай, что… | used before telling someone surprising news | *Guess what*! I passed the exam! | Угадай что! Я сдал экзамен!
- half an hour | phr |  |  | полчаса | thirty minutes | The train leaves in *half an hour*. | Поезд отправляется через полчаса.
- hard work | phr |  |  | тяжёлый труд; усердие | a lot of effort | Learning a language takes *hard work*. | Изучение языка требует усердия.
- have fun | phr |  |  | веселиться, хорошо проводить время | to enjoy yourself | We *had fun* at the party. | Мы весело провели время на вечеринке.
- have got | phr |  |  | иметь (брит., разг.) | to have, to own | I've *got* two brothers. | У меня два брата. | I have got = I've got; she has got = she's got
