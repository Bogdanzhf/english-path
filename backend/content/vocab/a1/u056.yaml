title: Everyday phrases
title_ru: Разговорные фразы
topic: phrases
words:
- spend time | phr |  |  | проводить время | to use time doing something | I *spend time* with my friends at the weekend. | В выходные я провожу время с друзьями.
- stand up | phr |  |  | вставать | to get onto your feet | *Stand up*, please. | Встаньте, пожалуйста.
- stay in | phr |  |  | оставаться дома | to not go out | I'm tired, so I'll *stay in* tonight. | Я устал, поэтому вечером останусь дома.
- such as | phr |  |  | такой как, например | used to give examples | I like fruit *such as* apples and pears. | Я люблю фрукты, например яблоки и груши.
- talk about somebody/something | phr |  |  | говорить о | to speak about a subject | Let's *talk about* your plans. | Давай поговорим о твоих планах.
- thank you | phr |  |  | спасибо | used to show you are grateful | *Thank you* for the flowers! | Спасибо за цветы!
- that day | phr |  |  | в тот день | on the day already mentioned | *That day* it was very cold. | В тот день было очень холодно.
- the 20th century | phr |  |  | двадцатый век | the years from 1901 to 2000 | Many cars were invented in *the 20th century*. | Многие машины изобрели в двадцатом веке.
- the next day | phr |  |  | на следующий день | the day after | *The next day* we went home. | На следующий день мы поехали домой.
- there is | phr |  |  | есть, имеется | used to say that something exists | *There is* a bank near my house. | Рядом с моим домом есть банк. | there are + мн. ч.
- think about somebody/something | phr |  |  | думать о | to have someone or something in your mind | I often *think about* my childhood. | Я часто думаю о своём детстве.
- think of somebody/something | phr |  |  | думать о; придумать | to have an idea or opinion about | What do you *think of* this dress? | Как тебе это платье?
- this is... | phr |  |  | это… (при знакомстве, по телефону) | used to introduce someone | *This is* my friend Mark. | Это мой друг Марк.
- this kind of... | phr |  |  | такой, этот вид | of this type | I love *this kind of* music. | Я люблю такую музыку.
- this morning | phr |  |  | сегодня утром | in the morning of today | I saw him *this morning*. | Я видел его сегодня утром.
- this time | phr |  |  | на этот раз | on this occasion | *This time* I'll win! | На этот раз я выиграю!
- this year | phr |  |  | в этом году | during the current year | *This year* I want to learn English. | В этом году я хочу выучить английский.
- thousands of... | phr |  |  | тысячи | a very large number of | *Thousands of* people came to the concert. | На концерт пришли тысячи людей.
- too long | phr |  |  | слишком долго; слишком длинный | longer than you want | The film was *too long*. | Фильм был слишком длинным.
