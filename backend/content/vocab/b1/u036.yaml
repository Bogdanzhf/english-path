    options:
    - Under a willow in the old churchyard
    - In the sea
    - In the library
    - In a cave
    answer: 0
  - q: Who really wrote the note in the box?
    options:
    - Black Tom
    - A local writer
    - Mia's father
    - The librarian
    answer: 1
