title: Free time and sport
title_ru: Досуг и спорт
topic: leisure
words:
- aerobics | n | eəˈrəʊbɪks | əˈroʊbɪks | аэробика | energetic exercises to music | She does *aerobics* three times a week. | Она занимается аэробикой три раза в неделю.
- championship | n | ˈtʃæmpiənʃɪp |  | чемпионат | a competition to find the best | Our team won the national *championship*. | Наша команда выиграла национальный чемпионат.
- chat show | n | tʃæt ʃəʊ | tʃæt ʃoʊ | ток-шоу (брит.) | a TV show where famous people are interviewed | She appeared on a popular *chat show*. | Она выступила в популярном ток-шоу. | амер. talk show
- climber | n | ˈklaɪmə | ˈklaɪmər | альпинист, скалолаз | a person who climbs mountains | The *climbers* reached the top. | Альпинисты добрались до вершины.
- coach | v | kəʊtʃ | koʊtʃ | тренировать | to train a person or team | He *coaches* the school football team. | Он тренирует школьную футбольную команду.
- competitive | adj | kəmˈpetɪtɪv | kəmˈpetətɪv | соревновательный; конкурентоспособный | wanting to win; able to compete | She is very *competitive*. | Она очень любит соревноваться.
- diver | n | ˈdaɪvə | ˈdaɪvər | дайвер, ныряльщик | a person who swims under water | The *divers* found an old ship. | Дайверы нашли старый корабль.
- diving | n | ˈdaɪvɪŋ |  | дайвинг; прыжки в воду | swimming under water; jumping into water | We went *diving* in the Red Sea. | Мы занимались дайвингом в Красном море.
- entertainment | n | ˌentəˈteɪnmənt | ˌenərˈteɪnmənt | развлечение | films, music, shows, etc. | The hotel offers live *entertainment*. | В отеле есть развлекательная программа.
- extreme sports | n | ɪkˈstriːm spɔːts | ekˈstriːm spɔːrts | экстремальные виды спорта | dangerous sports like bungee jumping | He loves *extreme sports*. | Он обожает экстремальный спорт.
- gardening | n | ˈɡɑːdənɪŋ | ˈɡɑːrdənɪŋ | садоводство | working in a garden | My mum's hobby is *gardening*. | Хобби моей мамы — садоводство.
- handball | n | ˈhændbɔːl |  | гандбол | a team game where players throw a ball into a goal | We play *handball* at school. | В школе мы играем в гандбол.
- jogging | n | ˈdʒɒɡɪŋ | ˈdʒɑːɡɪŋ | бег трусцой | running slowly for exercise | I go *jogging* every morning. | Каждое утро я бегаю трусцой.
- leisure | n | ˈleʒə | ˈleʒər | досуг, свободное время | time when you are not working | What do you do in your *leisure* time? | Чем ты занимаешься на досуге?
- photography | n | fəˈtɒɡrəfi | fəˈtɑːɡrəfi | фотография (как занятие) | the art of taking photos | She's interested in *photography*. | Она увлекается фотографией.
- smoker | n | ˈsməʊkə | ˈsmoʊkər | курильщик | a person who smokes | He's a heavy *smoker*. | Он заядлый курильщик.
- snowboard | n | ˈsnəʊbɔːd | ˈsnoʊbɔːrd | сноуборд | a board for moving down snow | I rented a *snowboard*. | Я взял напрокат сноуборд.
- soap opera | n | səʊp ˈɒpərə | soʊp ˈɑːprə | мыльная опера | a TV series about the lives of a group of people | My grandma watches *soap operas*. | Моя бабушка смотрит мыльные оперы.
- sportsmanship | n | ˈspɔːtsmənʃɪp | ˈspɔːrtsmənʃɪp | спортивное поведение, честная игра | fair and generous behaviour in sport | He showed great *sportsmanship*. | Он проявил настоящий спортивный дух.
- stadium | n | ˈsteɪdiəm |  | стадион | a large sports ground with seats | The *stadium* holds 50,000 people. | Стадион вмещает 50 000 человек.
- swimmer | n | ˈswɪmə | ˈswɪmər | пловец | a person who swims | She's a strong *swimmer*. | Она хорошо плавает.
- windsurfing | n | ˈwɪndsɜːfɪŋ | wˈɪndsɜːfɪŋ | виндсёрфинг | sailing on a board with a sail | We tried *windsurfing* on holiday. | В отпуске мы попробовали виндсёрфинг.
