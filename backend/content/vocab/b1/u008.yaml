title: Food and drink
title_ru: Еда и напитки
topic: food
words:
- consume | v | kənˈsjuːm | kənˈsuːm | потреблять | to eat, drink or use something | Big cars *consume* a lot of fuel. | Большие машины потребляют много топлива.
- dough | n | dəʊ | doʊ | тесто | a mixture of flour and water for making bread | Knead the *dough* for ten minutes. | Месите тесто десять минут. | gh не читается
- loaf | n | ləʊf | loʊf | буханка, батон | bread baked as one piece | Pilgrims brought a *loaf* of bread as an offering. | Паломники приносили буханку хлеба в дар. | мн. loaves
- mix | n | mɪks |  | смесь | a combination of different things | The city has an interesting *mix* of old and new buildings. | В городе интересное сочетание старых и новых зданий. | гл. mix — смешивать
- raisin | n | ˈreɪzn |  | изюм, изюминка | a dried grape | She had a small bag of *raisins*. | У неё был маленький пакетик изюма.
