title: Food and drink
title_ru: Еда и напитки
topic: food
words:
- 'alcoholic | adj | ˌælkəˈhɒlɪk | ˌælkəˈhɑːlɪk | алкогольный | containing alcohol | We don''t serve *alcoholic* drinks. | Мы не подаём алкогольные напитки. | сущ.: alcoholic — алкоголик'
- consume | v | kənˈsjuːm | kənˈsuːm | потреблять | to eat, drink or use something | Big cars *consume* a lot of fuel. | Большие машины потребляют много топлива.
- dough | n | dəʊ | doʊ | тесто | a mixture of flour and water for making bread | Knead the *dough* for ten minutes. | Месите тесто десять минут. | gh не читается
- flavour | n | ˈfleɪvə | flˈeɪvɐ | вкус, аромат | the taste of food or drink | Which ice cream *flavour* do you want? | Какое мороженое хочешь — с каким вкусом? | амер. flavor
- gravy | n | ˈɡreɪvi |  | подливка, соус к мясу | a sauce made from the juice of cooked meat | Pour some *gravy* on the potatoes. | Полей картошку подливкой.
- juicy | adj | ˈdʒuːsi |  | сочный | full of juice | These oranges are very *juicy*. | Эти апельсины очень сочные.
- lettuce | n | ˈletɪs | ˈletəs | салат-латук | a green leafy vegetable used in salads | Wash the *lettuce* carefully. | Тщательно промой салат.
- loaf | n | ləʊf | loʊf | буханка, батон | bread baked as one piece | Pilgrims brought a *loaf* of bread as an offering. | Паломники приносили буханку хлеба в дар. | мн. loaves
- mix | n | mɪks |  | смесь | a combination of different things | The city has an interesting *mix* of old and new buildings. | В городе интересное сочетание старых и новых зданий. | гл. mix — смешивать
- mustard | n | ˈmʌstəd | ˈmʌstərd | горчица | a yellow sauce with a hot taste | Do you want *mustard* on your hot dog? | Тебе положить горчицу в хот-дог?
- oily | adj | ˈɔɪli |  | маслянистый, жирный | covered in or full of oil | The fish was too *oily*. | Рыба была слишком жирной.
- popcorn | n | ˈpɒpkɔːn | ˈpɑːpkɔːrn | попкорн | corn that bursts when heated | Let's buy *popcorn* for the film. | Давай купим попкорн к фильму.
- raisin | n | ˈreɪzn |  | изюм, изюминка | a dried grape | She had a small bag of *raisins*. | У неё был маленький пакетик изюма.
- raspberry | n | ˈrɑːsbəri | ˈræzberi | малина | a small soft red fruit | She made *raspberry* jam. | Она сварила малиновое варенье.
- ration | n | ˈræʃən |  | паёк, норма | a fixed amount of food allowed | During the war, sugar was on *ration*. | Во время войны сахар выдавали по нормам.
- shrimp | n | ʃrɪmp |  | креветка | a small sea creature eaten as food | I ordered *shrimp* with rice. | Я заказал креветки с рисом. | брит. чаще prawn
- swallow | v | ˈswɒləʊ | ˈswɑːloʊ | глотать | to make food or drink go down your throat | *Swallow* the pill with water. | Проглотите таблетку, запив водой.
