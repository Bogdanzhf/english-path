title: Work and jobs
title_ru: Работа и профессии
topic: work
words:
- astronomer | n | əˈstrɒnəmə | əˈstrɑːnəmər | астроном | a scientist who studies stars | The *astronomer* discovered a new planet. | Астроном открыл новую планету.
- babysitter | n | ˈbeɪbɪsɪtə | ˈbeɪbiːsɪtər | няня (на время) | a person who looks after children | We need a *babysitter* for Saturday. | Нам нужна няня на субботу.
- chemist | n | ˈkemɪst |  | химик; аптекарь (брит.) | a scientist who studies chemistry; a person who sells medicine | You can get it at the *chemist's*. | Это можно купить в аптеке.
- colleague | n | ˈkɒliːɡ | ˈkɑːliːɡ | коллега | a person you work with | My *colleagues* gave me a present for my birthday. | Коллеги подарили мне подарок на день рождения.
- disc jockey | n | dɪsk ˈdʒɒki | dɪsk ˈdʒɑːki | диджей | a DJ | He worked as a *disc jockey* at a radio station. | Он работал диджеем на радио.
- employee | n | ɪmˈplɔɪiː | emˈplɔɪi | сотрудник, работник | a person who works for a company | The company has 500 *employees*. | В компании 500 сотрудников.
- employer | n | ɪmˈplɔɪə | emˈplɔɪər | работодатель | a person or company that employs people | My *employer* pays for my training. | Мой работодатель оплачивает моё обучение.
- engineering | n | ˌendʒɪˈniərɪŋ | ˈendʒəˈnɪrɪŋ | инженерия, техника | the science of designing machines and structures | He studies *engineering* at university. | Он изучает инженерное дело в университете.
- entertainer | n | ˌentəˈteɪnə | ˌenərˈteɪnər | артист, конферансье | a person who entertains people | He's a popular TV *entertainer*. | Он популярный телеведущий-шоумен.
- environmentalist | n | ɪnˌvaɪrənˈmentəlɪst | ɪnˌvaɪrənˈmenəlɪst | эколог, защитник природы | a person who wants to protect the environment | *Environmentalists* protested against the new road. | Экологи протестовали против новой дороги.
- examiner | n | ɪɡˈzæmɪnə | ɪɡˈzæmənər | экзаменатор | a person who checks exams | The *examiner* asked me three questions. | Экзаменатор задал мне три вопроса.
- full-time | adj | ˈfʊltaɪm |  | полный (рабочий день); очный | working all the normal hours | She has a *full-time* job. | У неё работа на полную ставку.
- guitarist | n | ɡɪˈtɑːrɪst | ˌɡɪˈtɑːrɪst | гитарист | a person who plays the guitar | He's the band's lead *guitarist*. | Он соло-гитарист группы.
- magician | n | məˈdʒɪʃən |  | фокусник; волшебник | a person who does magic tricks | The *magician* pulled a rabbit out of a hat. | Фокусник вытащил кролика из шляпы.
- mine | n | maɪn |  | шахта, рудник | a deep hole where people dig for coal, gold, etc. | His grandfather worked in a coal *mine*. | Его дед работал на угольной шахте.
- overwork | n | ˌəʊvəˈwɜːk | ˌoʊvərˈwɜːrk | переутомление | working too much | He became ill from *overwork*. | Он заболел от переутомления.
- retire | v | rɪˈtaɪə | rɪˈtaɪər | уходить на пенсию | to stop working because of age | My father *retired* at sixty-five. | Мой отец вышел на пенсию в шестьдесят пять. | retirement — пенсия (период)
- salary | n | ˈsæləri |  | зарплата | money you get for your work, usually every month | Her *salary* is higher than mine. | У неё зарплата выше, чем у меня.
- storyteller | n | ˈstɔːrɪtelə | ˈstɔːriːtelər | рассказчик | a person who tells stories | My grandma is a great *storyteller*. | Моя бабушка замечательная рассказчица.
- teamwork | n | ˈtiːmwɜːk | ˈtiːmwɜːrk | командная работа | working well together | Good *teamwork* is the key to success. | Слаженная командная работа — ключ к успеху.
- teller | n | ˈtelə | ˈtelər | рассказчик; кассир (в банке) | a person who tells stories; a bank worker | The bank *teller* counted the money twice. | Кассир банка дважды пересчитал деньги.
- unemployment | n | ʌnemˈplɔɪmənt | ˌʌnɪmˈplɔɪmənt | безработица | not having a job | *Unemployment* has risen this year. | В этом году выросла безработица.
