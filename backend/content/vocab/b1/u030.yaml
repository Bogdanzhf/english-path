title: Work and jobs
title_ru: Работа и профессии
topic: work
words:
- client | n | ˈklaɪənt |  | клиент | a person who pays for a service | The lawyer has a meeting with a new *client*. | У юриста встреча с новым клиентом.
- management | n | ˈmænɪdʒmənt |  | контроль, управление | the process of controlling or dealing with something | Diet plays a big role in the *management* of diabetes. | Питание играет большую роль в контроле диабета.
- priest | n | priːst |  | священник | a person who performs religious ceremonies | The *priest* married them in a small church. | Священник обвенчал их в маленькой церкви.
- profession | n | prəˈfeʃn |  | профессия | a job that needs special training | Teaching is a difficult *profession*. | Преподавание — трудная профессия.
- sheriff | n | ˈʃerɪf |  | шериф | an elected police officer in a US county | The *sheriff* arrested the thief. | Шериф арестовал вора.
