title: Thinking and opinions
title_ru: Мысли и мнения
topic: mind
words:
- attitude | n | ˈætɪtjuːd | ˈætɪtuːd | отношение, позиция | the way you think and feel about something | He has a very positive *attitude* to life. | У него очень позитивное отношение к жизни.
- concern | n | kənˈsɜːn | kənˈsɜːrn | беспокойство, забота | a feeling of worry about something | Our main *concern* is the safety of the children. | Наша главная забота — безопасность детей.
- doubt | n | daʊt |  | сомнение | a feeling of not being sure | There's no *doubt* that she is the best player. | Нет сомнений, что она лучший игрок. | b не произносится
- harmony | n | ˈhɑːməni | ˈhɑːrməni | гармония | a state of peaceful agreement | The islanders lived in *harmony* with nature. | Островитяне жили в гармонии с природой.
- importance | n | ɪmˈpɔːtns | ɪmˈpɔːrtns | важность, значение | the quality of being important | Never underestimate the *importance* of sleep. | Никогда не недооценивайте важность сна.
- limit | n | ˈlɪmɪt |  | предел, ограничение | the largest or smallest amount that is allowed | The speed *limit* here is 50 km per hour. | Ограничение скорости здесь — 50 км/ч.
- sake | n | seɪk |  | ради, для блага | for the benefit of | Do it for your mother's *sake*. | Сделай это ради мамы. | for goodness' sake — ради бога
- sparkle | v | ˈspɑːkl | ˈspɑːrkl | сверкать, искриться | to shine with small flashes of light | Her eyes *sparkled* with excitement. | Её глаза сверкали от восторга.
- value | n | ˈvæljuː |  | ценность, стоимость | how much something is worth; how important it is | This old coin has great *value*. | Эта старая монета очень ценная.
