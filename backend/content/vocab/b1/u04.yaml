      options: ["He won", "His sled hit a rock and he got hurt", "He got lost in the forest", "He lost his sled"]
      answer: 1
    - q: "How did Ellie help him?"
      options: ["She called an ambulance", "She pulled him home on her sled", "She ran to get their mother", "She carried him"]
      answer: 1
