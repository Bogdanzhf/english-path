title: Everyday phrases
title_ru: Разговорные фразы
topic: phrases
words:
- tell the truth | phr |  |  | говорить правду | to say what really happened | Always *tell the truth*. | Всегда говори правду. | to tell (you) the truth — честно говоря
- tend to do something | phr |  |  | быть склонным, обычно (делать) | to usually do | I *tend to* get up late at weekends. | По выходным я обычно встаю поздно.
- thanks to somebody/something | phr |  |  | благодаря | because of | *Thanks to* you, we won. | Благодаря тебе мы победили.
- that's it | phr |  |  | вот и всё; вот именно | used to say something is finished or correct | Put it here. *That's it*! | Положи сюда. Вот так!
- the fact that... | phr |  |  | тот факт, что | used to introduce a fact | I like *the fact that* it's close to work. | Мне нравится, что это близко к работе.
- those who... | phr |  |  | те, кто | the people who | *Those who* want to come should sign up. | Желающим нужно записаться.
- to do with somebody/something | phr |  |  | связанный с, касающийся | connected with | The problem has something *to do with* the battery. | Проблема как-то связана с батареей.
- together with | phr |  |  | вместе с | as well as | The book, *together with* the CD, costs £20. | Книга вместе с диском стоит 20 фунтов.
- too bad | phr |  |  | жаль, очень плохо | used to say you are sorry | You can't come? *Too bad*! | Ты не сможешь? Жаль!
- try and... | phr |  |  | постараться (разг.) | try to | *Try and* be on time. | Постарайся прийти вовремя.
- turn something up | phr |  |  | сделать громче, прибавить | to increase the volume or heat | *Turn up* the music! | Сделай музыку погромче!
- unable to do something | phr |  |  | не в состоянии | not able to | I'm *unable to* attend the meeting. | Я не смогу присутствовать на встрече.
- up to something | phr |  |  | вплоть до; замышлять | as much as; doing something secret | The hall holds *up to* 200 people. | Зал вмещает до 200 человек. | What are you up to? — Чем занимаешься?
- way of life | phr |  |  | образ жизни | how people live | Farming is a *way of life* here. | Земледелие здесь — образ жизни.
- well known | phr |  |  | известный | known by many people | He's a *well known* writer. | Он известный писатель. | перед сущ. обычно well-known
- work on something | phr |  |  | работать над | to spend time improving or making | I'm *working on* a new project. | Я работаю над новым проектом.
- wrong with somebody/something | phr |  |  | не так (с кем-либо, чем-либо) | causing a problem | What's *wrong with* your phone? | Что не так с твоим телефоном?
- you see | phr |  |  | понимаешь, видишь ли | used when explaining | *You see*, I didn't know. | Понимаешь, я не знал.
