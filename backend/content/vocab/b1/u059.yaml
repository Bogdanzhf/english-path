title: Everyday phrases
title_ru: Разговорные фразы
topic: phrases
words:
- in general | phr |  |  | в целом, вообще | usually; in most cases | *In general*, I like my job. | В целом мне нравится моя работа.
- in order of something | phr |  |  | в порядке (чего-либо) | arranged by | List the words *in order of* importance. | Расположите слова в порядке важности.
- in order to do something | phr |  |  | для того чтобы | so that you can | I study *in order to* get a better job. | Я учусь, чтобы найти работу получше.
- in other words | phr |  |  | другими словами | used to explain something more simply | *In other words*, we have no money. | Другими словами, денег у нас нет.
- in particular | phr |  |  | в особенности | especially | I like fruit, apples *in particular*. | Я люблю фрукты, особенно яблоки.
- in public | phr |  |  | на людях, публично | where other people can see | He doesn't like speaking *in public*. | Он не любит выступать на публике.
- in recent years | phr |  |  | в последние годы | during the last few years | Prices have risen *in recent years*. | В последние годы цены выросли.
- in response to something | phr |  |  | в ответ на | as an answer to | I'm writing *in response to* your letter. | Пишу в ответ на ваше письмо.
- in terms of something | phr |  |  | с точки зрения, в плане | when talking about | *In terms of* price, this one is better. | По цене этот вариант лучше.
- in the case of something | phr |  |  | в случае (с) | when talking about a particular situation | *In the case of* fire, use the stairs. | В случае пожара пользуйтесь лестницей.
- in the form of somebody/something | phr |  |  | в виде, в форме | as | Help came *in the form of* money. | Помощь пришла в виде денег.
- in the way (that)... | phr |  |  | так, как | in the manner that | Do it *in the way* I showed you. | Сделай так, как я тебе показал.
- in this case | phr |  |  | в этом случае | in this situation | *In this case*, we should wait. | В этом случае нам стоит подождать.
- in time | phr |  |  | вовремя, успеть | early enough | We arrived just *in time* for the film. | Мы успели как раз к началу фильма. | ср. on time — точно по расписанию
- in touch | phr |  |  | на связи | communicating with someone | Let's keep *in touch*! | Давай будем на связи!
- leave somebody/something out | phr |  |  | пропустить, не включить | to not include | You *left out* my name. | Ты пропустил моё имя.
- likely to do something | phr |  |  | вероятно (что-то сделает) | probably going to | It's *likely to* rain today. | Сегодня, скорее всего, будет дождь.
- look out | phr |  |  | осторожно!, берегись! | used to warn someone | *Look out*! There's a car coming! | Осторожно! Машина едет!
- make a difference | phr |  |  | иметь значение, изменить к лучшему | to have an effect | Small changes can *make a difference*. | Небольшие изменения могут многое изменить.
