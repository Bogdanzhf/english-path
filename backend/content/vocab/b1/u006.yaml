title: Function words
title_ru: Служебные слова
topic: grammar
words:
- auxiliary | adj | ɔːkˈsɪliəri | ɑːɡˈzɪliːeri | вспомогательный | giving help or support | "Do" is an *auxiliary* verb. | «Do» — вспомогательный глагол.
- beyond | prep | bɪˈjɒnd | bɪˈjɑːnd | за, за пределами, сверх | on the far side of; more than | The village is just *beyond* the hills. | Деревня сразу за холмами. | beyond belief — невероятно
- despite | prep | dɪˈspaɪt |  | несмотря на | without being stopped by | *Despite* the rain, we went for a walk. | Несмотря на дождь, мы пошли гулять. | despite + сущ./-ing (без of!)
- instead of | prep | ɪnˈsted ɒv | ˌɪnˈsted ʌv | вместо | in the place of | I'll have tea *instead of* coffee. | Я возьму чай вместо кофе.
- minus | prep | ˈmaɪnəs |  | минус, без | taking away; below zero | Ten *minus* three is seven. | Десять минус три — семь.
- nope | adv | nəʊp | noʊp | неа, не-а (разг.) | no (very informal) | Are you tired? — *Nope*, not at all. | Устал? — Неа, ничуть.
- oneself | pron | wɒnˈself | ˌwʌnˈself | себя, себе | used when "one" does something to itself | It's important to look after *oneself*. | Важно заботиться о себе.
- ought to | v | ɔːt tuː |  | следует, должен (бы) | should | You *ought to* tell her the truth. | Тебе следует сказать ей правду.
- provided | conj | prəˈvaɪdɪd |  | при условии, что | on condition that | You can go *provided* you finish your homework. | Можешь пойти, если сделаешь уроки.
- regarding | prep | rɪˈɡɑːdɪŋ | rɪˈɡɑːrdɪŋ | относительно, касательно | about | I'm writing *regarding* your letter. | Пишу относительно вашего письма.
- theirs | pron | ðeəz | ðerz | их (без существительного) | the one belonging to them | That house is *theirs*. | Тот дом — их.
- unless | conj | ənˈles |  | если не | except if | I won't go *unless* you come with me. | Я не пойду, если ты не пойдёшь со мной.
- upon | prep | əˈpɒn | əˈpɑːn | на; по (официально) | on (formal) | *Upon* arrival, please go to reception. | По прибытии пройдите на ресепшен. | once upon a time — давным-давно
- via | prep | ˈvaɪə | ˈvaɪə, ˈviːə | через | travelling through a place; using something | We flew to Sydney *via* Singapore. | Мы летели в Сидней через Сингапур.
- whether | conj | ˈweðə | ˈweðər | ли | used when there are two possibilities | I don't know *whether* he is coming or not. | Я не знаю, придёт он или нет.
- whichever | det | wɪˈtʃevə | hwɪˈtʃevər | какой бы ни, любой | any one that | Take *whichever* seat you like. | Садись на любое место.
- whom | pron | huːm |  | кого, кому (офиц.) | who (as the object) | To *whom* should I send the letter? | Кому мне отправить письмо?
