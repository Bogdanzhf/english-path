title: Function words
title_ru: Служебные слова
topic: grammar
words:
- beyond | prep | bɪˈjɒnd | bɪˈjɑːnd | за, за пределами, сверх | on the far side of; more than | The village is just *beyond* the hills. | Деревня сразу за холмами. | beyond belief — невероятно
- despite | prep | dɪˈspaɪt |  | несмотря на | without being stopped by | *Despite* the rain, we went for a walk. | Несмотря на дождь, мы пошли гулять. | despite + сущ./-ing (без of!)
- nope | adv | nəʊp | noʊp | неа, не-а (разг.) | no (very informal) | Are you tired? — *Nope*, not at all. | Устал? — Неа, ничуть.
- unless | conj | ənˈles |  | если не | except if | I won't go *unless* you come with me. | Я не пойду, если ты не пойдёшь со мной.
- via | prep | ˈvaɪə | ˈvaɪə, ˈviːə | через | travelling through a place; using something | We flew to Sydney *via* Singapore. | Мы летели в Сидней через Сингапур.
- whether | conj | ˈweðə | ˈweðər | ли | used when there are two possibilities | I don't know *whether* he is coming or not. | Я не знаю, придёт он или нет.
