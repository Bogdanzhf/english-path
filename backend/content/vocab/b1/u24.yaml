reading:
  title: "A Job on the Other Side of the World"
  title_ru: "Работа на другом конце света"
  text: |
    When Kate was offered a job abroad, she spent a sleepless night thinking about it. The job was in a remote town in northern Australia, working for a small airline that flew doctors to farms and villages. The income was good, but it was 15,000 kilometres from home.

    "Go," her best friend said. "You'll regret it if you don't." So Kate wrote a brief letter to her boss, packed her bags and booked a ticket. She found a bargain flight, although it had three stops. When she finally arrived, she was so tired from jet lag that she slept for fourteen hours.

    Her new job was very different. She worked in the office, collecting data about flights and patients and writing official reports. Sometimes she flew with the doctors in the small planes. The maximum number of passengers was six, and the noise was so loud that nobody could hear anything. The doctors visited people who lived hundreds of kilometres from a hospital. If someone was very ill, the doctors referred them to the big hospital in the city and the airline's jet took them there.

    Kate quickly made friends. On weekends, people gathered for barbecues by the river. She took up a new hobby: painting the red desert landscapes. She even had to get used to a new currency and new words. "Arvo" meant "afternoon", and "brekkie" meant "breakfast".

    After a year, Kate's paintings were good enough for a small exhibition in the town hall. She was nervous, but the audience loved them. One visitor, a writer, asked her to make pictures for a book about the area. Kate wrote the first draft of an email to her family: "I would recommend this life to anyone. I'm not coming home yet." Then she turned up the volume on the radio and started to dance.
  ru: |
    Когда Кейт предложили работу за границей, она провела бессонную ночь, размышляя об этом. Работа была в отдалённом городке на севере Австралии, в небольшой авиакомпании, которая доставляла врачей на фермы и в деревни. Доход был хорошим, но это было в 15 000 километров от дома.

    «Езжай, — сказала её лучшая подруга. — Пожалеешь, если не поедешь». И Кейт написала начальнику короткое письмо, собрала чемоданы и купила билет. Она нашла очень выгодный рейс, хотя и с тремя пересадками. Когда она наконец добралась, то так устала от смены часовых поясов, что проспала четырнадцать часов.

    Новая работа сильно отличалась от прежней. Она работала в офисе: собирала данные о рейсах и пациентах и писала официальные отчёты. Иногда она летала с врачами на маленьких самолётах. Максимальное число пассажиров было шесть, а шум был таким громким, что никто ничего не слышал. Врачи навещали людей, живших в сотнях километров от больницы. Если кто-то был серьёзно болен, врачи направляли его в большую городскую больницу, и реактивный самолёт авиакомпании доставлял его туда.

    Кейт быстро завела друзей. По выходным люди собирались на барбекю у реки. У неё появилось новое хобби: она рисовала красные пустынные пейзажи. Ей даже пришлось привыкнуть к новой валюте и новым словечкам. «Arvo» означало «после обеда», а «brekkie» — «завтрак».

    Через год картины Кейт стали достаточно хорошими для небольшой выставки в ратуше. Она волновалась, но зрителям они очень понравились. Один посетитель, писатель, попросил её сделать иллюстрации к книге об этих краях. Кейт набросала черновик письма семье: «Я бы всем советовала такую жизнь. Домой я пока не вернусь». Потом прибавила громкость радио и начала танцевать.
