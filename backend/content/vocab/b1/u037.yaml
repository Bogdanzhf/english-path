title: Everyday phrases
title_ru: Разговорные фразы
topic: phrases
words:
- click on something | phr |  |  | нажать (кликнуть) на | to press a button on a mouse | *Click on* the link to download. | Нажмите на ссылку, чтобы скачать.
- compared with something | phr |  |  | по сравнению с | when compared to | *Compared with* last year, sales are up. | По сравнению с прошлым годом продажи выросли.
- concentrate on something | phr |  |  | сосредоточиться на | to give all your attention to | I can't *concentrate on* my work. | Не могу сосредоточиться на работе.
- consist of somebody/something | phr |  |  | состоять из | to be made of | The team *consists of* ten people. | Команда состоит из десяти человек.
- decide on something | phr |  |  | выбрать, остановиться на | to choose after thinking | Have you *decided on* a name for the baby? | Вы уже выбрали имя для малыша?
- depending on | phr |  |  | в зависимости от | according to | Prices change *depending on* the season. | Цены меняются в зависимости от сезона.
- developing countries | phr |  |  | развивающиеся страны | poorer countries with less industry | Many *developing countries* need clean water. | Многим развивающимся странам не хватает чистой воды.
- due to somebody/something | phr |  |  | из-за, благодаря | because of | The flight was cancelled *due to* bad weather. | Рейс отменили из-за плохой погоды.
- even if | phr |  |  | даже если | whether or not | I'll go *even if* it rains. | Я пойду, даже если будет дождь.
- even though | phr |  |  | хотя, несмотря на то что | despite the fact that | *Even though* he was tired, he finished the work. | Хотя он устал, он закончил работу.
- exactly the same | phr |  |  | точно такой же | completely the same | Our dresses are *exactly the same*. | Наши платья абсолютно одинаковые.
- experience in something | phr |  |  | опыт в (чём-либо) | knowledge from doing something | She has a lot of *experience in* sales. | У неё большой опыт в продажах.
- fail to do something | phr |  |  | не суметь, не сделать | to not succeed in doing | He *failed to* arrive on time. | Он не смог приехать вовремя.
- fall asleep | phr |  |  | заснуть | to start sleeping | I *fell asleep* on the sofa. | Я заснул на диване.
- far more | phr |  |  | гораздо больше | much more | This one is *far more* expensive. | Этот гораздо дороже.
- far too | phr |  |  | слишком уж | much too | It's *far too* cold to swim. | Слишком холодно, чтобы купаться.
- for a while | phr |  |  | некоторое время | for some time | Let's rest *for a while*. | Давай отдохнём немного.
- for free | phr |  |  | бесплатно | without paying | You can get the app *for free*. | Приложение можно получить бесплатно.
- for life | phr |  |  | на всю жизнь | for the rest of your life | They became friends *for life*. | Они стали друзьями на всю жизнь.
