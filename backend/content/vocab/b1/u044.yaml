title: Animals
title_ru: Животные
topic: animals
words:
- bark | v | bɑːk | bɑːrk | лаять | to make the short loud sound that a dog makes | The dog *barks* every time someone comes to the door. | Собака лает каждый раз, когда кто-то подходит к двери.
- beaver | n | ˈbiːvə | ˈbiːvər | бобр | an animal that builds dams in rivers | *Beavers* build dams with wood. | Бобры строят плотины из дерева.
- breeding | n | ˈbriːdɪŋ |  | разведение; размножение | keeping animals to produce young | Dog *breeding* is his business. | Разведение собак — его бизнес.
- cage | n | keɪdʒ |  | клетка | a box with bars for keeping animals or birds | The bird sang in its *cage*. | Птица пела в клетке.
- caterpillar | n | ˈkætəpɪlə | ˈkætərpɪlər | гусеница | a small long insect that becomes a butterfly | A *caterpillar* was eating the leaves. | Гусеница ела листья.
- extinct | adj | ɪkˈstɪŋkt |  | вымерший | no longer existing | The dodo became *extinct* in the 17th century. | Дронт вымер в XVII веке.
- feather | n | ˈfeðə | ˈfeðər | перо | one of the soft things that cover a bird's body | The pillow is filled with *feathers*. | Подушка набита перьями.
- flock | n | flɒk | flɑːk | стая, стадо | a group of birds or sheep | A *flock* of sheep blocked the road. | Дорогу перегородила отара овец.
- giraffe | n | dʒɪˈrɑːf | dʒəˈræf | жираф | an African animal with a very long neck | The *giraffe* ate leaves from the tree. | Жираф ел листья с дерева.
- hatch | v | hætʃ |  | вылупляться | to break out of an egg | The chicks *hatched* this morning. | Цыплята вылупились сегодня утром.
- herd | n | hɜːd | hɜːrd | стадо | a large group of animals | A *herd* of cows was in the field. | В поле паслось стадо коров.
- mule | n | mjuːl |  | мул | an animal that is half donkey, half horse | They carried the bags on *mules*. | Сумки везли на мулах.
- swarm | n | swɔːm | swɔːrm | рой | a large group of flying insects | A *swarm* of bees flew past. | Мимо пролетел рой пчёл.
- tail | n | teɪl |  | хвост | the long part at the back of an animal's body | The dog wagged its *tail* happily. | Собака радостно виляла хвостом.
- turtle | n | ˈtɜːtl | ˈtɜːrtl | черепаха (морская) | a reptile with a hard shell that lives in water | We saw sea *turtles* in Greece. | В Греции мы видели морских черепах.
- whale | n | weɪl |  | кит | a very large sea mammal | A *whale* washed up on the beach. | На берег выбросило кита.
- wing | n | wɪŋ |  | крыло | the part of a bird or plane used for flying | The bird hurt its *wing*. | Птица повредила крыло.
