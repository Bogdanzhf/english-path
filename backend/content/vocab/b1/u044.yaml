title: Nature and weather
title_ru: Природа и погода
topic: nature
words:
- daisy | n | ˈdeɪzi |  | маргаритка, ромашка | a small white flower with a yellow centre | The field was full of *daisies*. | Поле было усыпано ромашками.
- equator | n | ɪˈkweɪtə | ɪˈkweɪtər | экватор | the imaginary line around the middle of the Earth | The Amazon lies close to the *equator*. | Амазония расположена недалеко от экватора.
- frost | n | frɒst | frɔːst | мороз; иней | white ice on surfaces when it is very cold | There was *frost* on the car this morning. | Сегодня утром машина была покрыта инеем. | frostbite — обморожение
- moisture | n | ˈmɔɪstʃə | ˈmɔɪstʃər | влага | small amounts of water in the air or soil | The soil had lost all its *moisture*. | Почва потеряла всю влагу.
- nectar | n | ˈnektə | ˈnektər | нектар | the sweet liquid in flowers that bees collect | Bees turn *nectar* into honey. | Пчёлы превращают нектар в мёд.
- rainforest | n | ˈreɪnfɒrɪst | ˈreɪnfɔːrɪst | тропический лес | a thick forest in a hot region with a lot of rain | The Amazon is the largest *rainforest* on Earth. | Амазония — крупнейший тропический лес на Земле.
- reef | n | riːf |  | риф | a line of rocks or coral near the surface of the sea | We went diving on the *reef*. | Мы ныряли у рифа.
- seed | n | siːd |  | семя, семечко | the small part of a plant from which a new plant grows | Plant the *seeds* in spring. | Сажайте семена весной.
- shine | v | ʃaɪn |  | светить, сиять | to give out bright light | The sun was *shining* all day. | Весь день светило солнце. | shine — shone — shone
- volcano | n | vɒlˈkeɪnəʊ | vɑːlˈkeɪnoʊ | вулкан | a mountain that can send out fire and hot rock | The *volcano* last erupted in 1980. | Последний раз вулкан извергался в 1980 году. | мн. ч. volcanoes
