title: Body and health
title_ru: Тело и здоровье
topic: body
words:
- ache | v | eɪk |  | болеть, ныть | to feel a continuous dull pain | My back *aches* after sitting all day. | После целого дня сидения у меня ноет спина. | headache, toothache, stomach ache
- aspirin | n | ˈæsprɪn |  | аспирин | a medicine for pain | Take an *aspirin* for your headache. | Прими аспирин от головной боли.
- bathe | v | beɪð |  | купать, промывать | to wash someone or part of the body | The nurse *bathed* the soldier's wounds. | Медсестра промыла раны солдата. | th читается как [ð]
- breathless | adj | ˈbreθləs |  | запыхавшийся | breathing with difficulty | She was *breathless* after running. | После бега она запыхалась.
- burn | n | bɜːn | bɜːrn | ожог | an injury caused by fire or heat | He has a *burn* on his hand. | У него ожог на руке.
- capsule | n | ˈkæpsjuːl | ˈkæpsl | капсула | a small container of medicine you swallow | Take one *capsule* twice a day. | Принимайте по одной капсуле два раза в день.
- choke | v | tʃəʊk | tʃoʊk | задыхаться, давиться | to be unable to breathe because something is blocking the throat | Turtles can *choke* on plastic bags. | Черепахи могут задохнуться, проглотив пластиковый пакет.
- 'cough | v | kɒf | kɑːf | кашлять | to push air out of your throat with a noise | He was *coughing* all night. | Он кашлял всю ночь. | сущ.: cough — кашель'
- counseling | n | ˈkaʊnsəlɪŋ |  | консультирование (психологическое) | professional advice about personal problems | She went to *counseling* after the accident. | После аварии она ходила к психологу. | брит. counselling
- deaf | adj | def |  | глухой | not able to hear | My grandmother is a little *deaf*. | Моя бабушка немного глуховата.
- eyesight | n | ˈaɪsaɪt |  | зрение | the ability to see | My *eyesight* is getting worse. | Моё зрение ухудшается.
- harm | n | hɑːm | hɑːrm | вред | damage or injury | A little rain never did anyone any *harm*. | Немного дождя ещё никому не повредило.
- healing | adj | ˈhiːlɪŋ |  | целебный, заживляющий | helping someone to get better | The cream has *healing* properties. | У крема заживляющие свойства.
- inhale | v | ɪnˈheɪl |  | вдыхать | to breathe air or smoke into your lungs | *Inhale* deeply through your nose. | Сделайте глубокий вдох через нос. | exhale — выдыхать
- injure | v | ˈɪndʒə | ˈɪndʒər | ранить, травмировать | to hurt a part of the body | He *injured* his back lifting heavy bags. | Он повредил спину, поднимая тяжёлые мешки. | injury — травма
- lasting | adj | ˈlɑːstɪŋ | ˈlæstɪŋ | длительный, прочный | continuing for a long time | The trip had a *lasting* effect on him. | Поездка оказала на него длительное влияние.
- pharmacy | n | ˈfɑːməsi | ˈfɑːrməsi | аптека | a shop where medicines are sold | You can buy this cream at any *pharmacy*. | Этот крем можно купить в любой аптеке. | брит. также chemist's
- pill | n | pɪl |  | таблетка | a small hard piece of medicine you swallow | Take one *pill* three times a day. | Принимайте по одной таблетке три раза в день.
- shave | v | ʃeɪv |  | бриться, брить | to cut hair off your face or body | He *shaves* every morning. | Он бреется каждое утро.
- sneeze | v | sniːz |  | чихать | to push air out of your nose suddenly | Dust makes me *sneeze*. | От пыли я чихаю.
- sore | adj | sɔː | sɔːr | больной, воспалённый | painful, especially after use or injury | My legs are *sore* after yesterday's run. | После вчерашней пробежки у меня болят ноги. | a sore throat — больное горло
- tear | v | teə | ter | рвать | to pull something apart so that it breaks | Be careful not to *tear* the paper. | Осторожно, не порви бумагу. | tear — tore — torn; сущ. tear [tɪə] — слеза
- thirst | n | θɜːst | θɜːrst | жажда | the feeling of needing a drink | We drank water to satisfy our *thirst*. | Мы пили воду, чтобы утолить жажду.
- tire | v | ˈtaɪə | ˈtaɪər | уставать; утомлять | to become tired | He *tires* easily since the illness. | После болезни он быстро устаёт. | амер. tire — шина (брит. tyre)
