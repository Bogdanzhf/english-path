title: 'Describing: good or bad'
title_ru: 'Описание: оценка — хорошо или плохо'
topic: describing
words:
- advanced | adj | ədˈvænst |  | продвинутый, передовой | at a high level | She's in the *advanced* class. | Она в продвинутой группе.
- beauty | n | ˈbjuːti |  | красота | the quality of being beautiful | We were amazed by the *beauty* of the lake. | Нас поразила красота озера.
- classic | adj | ˈklæsɪk |  | классический | of very high quality and popular for a long time | “Casablanca” is a *classic* film. | «Касабланка» — классика кино.
- complex | adj | ˈkɒmpleks | kəmˈpleks | сложный | having many parts; difficult to understand | The rules of this game are very *complex*. | Правила этой игры очень сложные.
- 'fine | n | faɪn |  | штраф | money you pay as a punishment | I got a *fine* for parking there. | Меня оштрафовали за парковку там. | гл.: fine — штрафовать'
- improper | adj | ɪmˈprɒpə | ˌɪmˈprɑːpər | неподобающий, неправильный | not correct or not suitable | It's *improper* to ask about her salary. | Неприлично спрашивать о её зарплате.
- inconvenient | adj | ɪnkənˈviːnɪənt | ˌɪnkənˈviːnjənt | неудобный | causing problems | Is this an *inconvenient* time to call? | Я не вовремя звоню?
- informative | adj | ɪnˈfɔːmətɪv | ɪnˈfɔːrmətɪv | информативный, познавательный | giving useful information | The lecture was very *informative*. | Лекция была очень познавательной.
- inner | adj | ˈɪnə | ˈɪnər | внутренний | inside; close to the centre | They live in the *inner* city. | Они живут в центральной части города.
- leading | adj | ˈliːdɪŋ |  | ведущий | most important or successful | She is a *leading* expert on climate change. | Она ведущий специалист по изменению климата.
- mental | adj | ˈmentl |  | умственный, психический | connected with the mind | Sport is good for your *mental* health. | Спорт полезен для психического здоровья.
- persuasive | adj | pəˈsweɪsɪv | pərˈsweɪsɪv | убедительный | able to make people agree | She made a very *persuasive* argument. | Она привела очень убедительный довод.
- respectable | adj | rɪˈspektəbl | riːˈspektəbl | респектабельный, приличный | considered good by society | He comes from a *respectable* family. | Он из уважаемой семьи.
- scenic | adj | ˈsiːnɪk |  | живописный | with beautiful views | We took the *scenic* route. | Мы поехали живописной дорогой.
- shameful | adj | ˈʃeɪmfl |  | постыдный | that you should be ashamed of | His behaviour was *shameful*. | Его поведение было постыдным.
- tiring | adj | ˈtaɪərɪŋ | ˈtaɪrɪŋ | утомительный | making you tired | It was a long, *tiring* journey. | Это была долгая утомительная поездка.
- total | n | ˈtəʊtl | ˈtoʊtl | итог, общая сумма | the whole number or amount | The *total* is forty dollars. | Итого сорок долларов. | in total — всего
- violent | adj | ˈvaɪələnt |  | жестокий, насильственный | using force to hurt people | The film was too *violent* for children. | Фильм был слишком жестоким для детей.
- vivid | adj | ˈvɪvɪd |  | яркий, живой | very clear and detailed | I have a *vivid* memory of my first flight. | Я ярко помню свой первый полёт.
- wasteful | adj | ˈweɪstfl |  | расточительный | using too much | It's *wasteful* to leave the lights on. | Оставлять свет включённым — расточительно.
