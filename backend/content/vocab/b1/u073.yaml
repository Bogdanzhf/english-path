title: Society and politics
title_ru: Общество и политика
topic: society
words:
- authority | n | ɔːˈθɒrəti | əˈθɔːrəti | власть; орган власти; авторитет | the power to give orders; an official organization | The *authorities* closed the border. | Власти закрыли границу. | an authority on — авторитет в области
- battle | n | ˈbætl |  | битва, сражение | a fight between two armies | Many soldiers died in the *battle*. | В битве погибло много солдат.
- Bible | n | ˈbaɪbl |  | Библия | the holy book of Christians | She read a passage from the *Bible*. | Она прочитала отрывок из Библии.
- citizen | n | ˈsɪtɪzn |  | гражданин; житель | a person who lives in a town or belongs to a country | She became a British *citizen* last year. | В прошлом году она получила британское гражданство.
- crown | n | kraʊn |  | корона | a gold ring worn on the head of a king or queen | The queen wore a *crown* of gold and diamonds. | Королева носила корону из золота и бриллиантов.
- custom | n | ˈkʌstəm |  | обычай | a traditional way of doing something | It's a local *custom* to give flowers. | Дарить цветы — местный обычай.
- federal | adj | ˈfedərəl |  | федеральный | connected with the central government of a federation | The *federal* government created new protected areas. | Федеральное правительство создало новые охраняемые территории.
- global | adj | ˈɡləʊbl | ˈɡloʊbl | глобальный, мировой | affecting the whole world | The internet is a *global* network. | Интернет — глобальная сеть.
- immigrant | n | ˈɪmɪɡrənt |  | иммигрант | a person who comes to live in a new country | Her parents were *immigrants* from Italy. | Её родители были иммигрантами из Италии.
- nation | n | ˈneɪʃn |  | нация, народ, страна | a country and its people | The president spoke to the *nation* on TV. | Президент обратился к нации по телевидению.
- trend | n | trend |  | тенденция, тренд | a general direction of change | There's a growing *trend* towards working from home. | Наблюдается растущая тенденция к удалённой работе.
