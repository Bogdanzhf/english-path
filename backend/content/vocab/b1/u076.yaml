title: Actions and movement
title_ru: Действия и движение
topic: actions
words:
- bear | v | beə | ber | терпеть, выносить | to accept something unpleasant | I can't *bear* this noise. | Я не выношу этот шум. | bear – bore – born(e)
- combine | v | kəmˈbaɪn |  | сочетать, объединять | to join or mix two or more things together | The dish *combines* sweet and spicy flavours. | Это блюдо сочетает сладкий и острый вкус.
- consist | v | kənˈsɪst |  | состоять | to be made of parts or things | The test *consists* of three parts. | Тест состоит из трёх частей. | consist of
- define | v | dɪˈfaɪn |  | определять, давать определение | to explain the exact meaning of something | How do you *define* success? | Как ты определяешь успех?
- endanger | v | ɪnˈdeɪndʒə | enˈdeɪndʒər | подвергать опасности | to put in danger | Pollution *endangers* wildlife. | Загрязнение угрожает дикой природе.
- fascinate | v | ˈfæsɪneɪt |  | очаровывать, увлекать | to interest someone very much | Old castles have always *fascinated* me. | Старые замки всегда меня завораживали. | fascinating — увлекательный
- feature | v | ˈfiːtʃə | ˈfiːtʃər | показывать, включать; участвовать | to include as an important part | The film *features* a famous actor. | В фильме снимается известный актёр.
- jog | v | dʒɒɡ | dʒɑːɡ | бегать трусцой | to run slowly for exercise | I *jog* in the park every morning. | Каждое утро я бегаю трусцой в парке.
- lie | v | laɪ |  | лгать | to say something that is not true | Don't *lie* to me — I know the truth. | Не ври мне — я знаю правду. | lie — lied — lied (лгать); lie — lay — lain (лежать)
- prove | v | pruːv |  | доказывать | to show that something is true | Can you *prove* that you were at home? | Можешь доказать, что ты был дома?
- qualify | v | ˈkwɒlɪfaɪ | ˈkwɑːlɪfaɪ | пройти отбор; получить квалификацию | to reach the level needed to do something | Our team *qualified* for the final. | Наша команда вышла в финал. | qualify as — получить специальность
- represent | v | ˌreprɪˈzent |  | представлять (кого-то) | to speak or act for another person or group | Anna will *represent* our school at the competition. | Анна будет представлять нашу школу на соревновании.
- require | v | rɪˈkwaɪə | rɪˈkwaɪər | требовать(ся) | to need something | This job *requires* good computer skills. | Для этой работы требуются хорошие навыки работы с компьютером.
- satisfy | v | ˈsætɪsfaɪ |  | удовлетворять | to give someone what they want or need | Nothing *satisfies* him — he always wants more. | Его ничто не удовлетворяет — ему всегда мало.
- suit | v | suːt |  | подходить, идти (кому-либо) | to look good on; to be convenient for | That colour *suits* you. | Тебе идёт этот цвет.
- survive | v | səˈvaɪv | sərˈvaɪv | выживать | to continue to live, especially in a difficult situation | Only the strongest birds *survived* the drought. | Засуху пережили только самые сильные птицы.
- tend | v | tend |  | иметь тенденцию, быть склонным | to usually do or be something | People *tend* to believe what they want to believe. | Люди склонны верить в то, во что хотят верить.
- uncover | v | ʌnˈkʌvə | ənˈkʌvər | раскрывать, обнаруживать | to discover something hidden | The journalist *uncovered* the truth. | Журналист раскрыл правду.
- weigh | v | weɪ |  | весить, взвешивать | to have a certain weight; to measure how heavy something is | The baby *weighs* four kilos. | Малыш весит четыре килограмма. | weight — вес
