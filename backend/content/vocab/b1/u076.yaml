title: Society and politics
title_ru: Общество и политика
topic: society
words:
- assist | v | əˈsɪst |  | помогать, содействовать | to help | Volunteers *assisted* the doctors. | Волонтёры помогали врачам. | assistance — помощь
- ban | v | bæn |  | запрещать | to officially say that something is not allowed | Smoking is *banned* in restaurants. | Курение в ресторанах запрещено. | сущ. ban — запрет
- commit | v | kəˈmɪt |  | совершать; брать обязательство | to do something wrong; to promise to do something | He *committed* a crime. | Он совершил преступление. | be committed to — быть преданным чему-то
- encourage | v | ɪnˈkʌrɪdʒ | ɪnˈkɜːrɪdʒ | поощрять, вдохновлять | to give someone support so that they want to do something | My teacher *encouraged* me to write stories. | Учительница поощряла меня писать рассказы.
- establish | v | ɪˈstæblɪʃ |  | устанавливать, основывать | to find out facts; to start something | Scientists have *established* that Venus once had water. | Учёные установили, что на Венере когда-то была вода.
- guard | v | ɡɑːd | ɡɑːrd | охранять, сторожить | to watch a place or person to keep them safe | Two soldiers *guard* the gate day and night. | Двое солдат охраняют ворота днём и ночью. | сущ. guard — охранник
- hire | v | ˈhaɪə | ˈhaɪər | нанимать; брать напрокат | to give someone a job; to pay to use something | The company *hired* three new engineers. | Компания наняла трёх новых инженеров.
- operate | v | ˈɒpəreɪt | ˈɑːpəreɪt | работать, действовать; управлять; оперировать | to work or be in action; to use a machine | The library *operates* 24 hours a day. | Библиотека работает круглосуточно.
- oppress | v | əˈpres |  | угнетать | to treat people cruelly and unfairly | Poverty *oppresses* millions of families. | Бедность угнетает миллионы семей.
- participate | v | pɑːˈtɪsɪpeɪt | pɑːrˈtɪsɪpeɪt | участвовать | to take part in something | Everyone *participated* in the discussion. | Все участвовали в обсуждении. | participate in
- persuade | v | pəˈsweɪd | pərˈsweɪd | убеждать, уговаривать | to make someone agree to do something | She *persuaded* me to come to the party. | Она уговорила меня прийти на вечеринку. | persuade somebody to do something
- promote | v | prəˈməʊt | prəˈmoʊt | продвигать, способствовать; повышать в должности | to help something develop; to give someone a higher job | The campaign *promotes* healthy eating. | Кампания пропагандирует здоровое питание.
- punish | v | ˈpʌnɪʃ |  | наказывать | to make someone suffer because they did something wrong | The teacher *punished* him for lying. | Учитель наказал его за ложь.
- pursue | v | pəˈsjuː | pərˈsuː | преследовать; добиваться | to follow someone; to try to achieve something | She decided to *pursue* a career in medicine. | Она решила построить карьеру в медицине.
