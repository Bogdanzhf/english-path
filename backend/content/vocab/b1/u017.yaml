title: 'How and how much: adverbs'
title_ru: 'Как и насколько: наречия'
topic: manner
words:
- generally | adv | ˈdʒenrəli |  | обычно, как правило; в целом | usually; by most people | Children *generally* learn languages faster than adults. | Дети, как правило, учат языки быстрее взрослых.
- originally | adv | əˈrɪdʒənəli |  | первоначально, изначально | at first; in the beginning | The attack was *originally* planned for 5 June. | Первоначально наступление планировалось на 5 июня.
- totally | adv | ˈtəʊtəli | ˈtoʊtəli | полностью, совсем | completely | I *totally* agree with you. | Я полностью с тобой согласен.
