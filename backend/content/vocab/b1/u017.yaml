title: 'How and how much: adverbs'
title_ru: 'Как и насколько: наречия'
topic: manner
words:
- absolutely | adv | ˌæbsəˈluːtli |  | абсолютно, совершенно | completely | You're *absolutely* right. | Ты совершенно прав.
- apparently | adv | əˈpærəntli | əˈperəntli | по-видимому, судя по всему | according to what people say | *Apparently*, he's moving to Canada. | Судя по всему, он переезжает в Канаду.
- directly | adv | daɪˈrektli | daɪˈrekli | прямо, непосредственно | in a straight line; without anyone else involved | You should speak to the manager *directly*. | Вам стоит поговорить напрямую с менеджером.
- face to face | adv | feɪs tuː feɪs |  | лицом к лицу, лично | in the same place, meeting someone | We need to talk *face to face*. | Нам нужно поговорить лично.
- fully | adv | ˈfʊli |  | полностью | completely | I *fully* understand. | Я полностью понимаю.
- generally | adv | ˈdʒenrəli |  | обычно, как правило; в целом | usually; by most people | Children *generally* learn languages faster than adults. | Дети, как правило, учат языки быстрее взрослых.
- highly | adv | ˈhaɪli |  | высоко; очень, весьма | very; at a high level | It's a *highly* respected school. | Это очень уважаемая школа.
- honestly | adv | ˈɒnɪstli | ˈɑːnəsli | честно | in an honest way; used to show you are telling the truth | *Honestly*, I didn't know. | Честно, я не знал.
- indeed | adv | ˌɪnˈdiːd |  | действительно, в самом деле | really; certainly | It was *indeed* a great day. | Это был действительно отличный день.
- obviously | adv | ˈɒbvɪəsli | ˈɑːbviəsli | очевидно, явно | clearly | He was *obviously* tired. | Он явно устал.
- originally | adv | əˈrɪdʒənəli |  | первоначально, изначально | at first; in the beginning | The attack was *originally* planned for 5 June. | Первоначально наступление планировалось на 5 июня.
- particularly | adv | pəˈtɪkjʊləli | ˌpɑːrˈtɪkjələrli | особенно | especially | I *particularly* liked the music. | Мне особенно понравилась музыка.
- possibly | adv | ˈpɒsəbli | ˈpɑːsəbli | возможно | perhaps | It will *possibly* rain later. | Возможно, позже пойдёт дождь.
- seriously | adv | ˈsiərɪəsli | ˈsɪriəsli | серьёзно | in a serious way | Are you *seriously* thinking of leaving? | Ты всерьёз думаешь уйти?
- simply | adv | ˈsɪmpli |  | просто | just; in an easy way | I *simply* don't have time. | У меня просто нет времени.
- slightly | adv | ˈslaɪtli |  | немного, слегка | a little | The price has *slightly* increased. | Цена немного выросла.
- specifically | adv | spəˈsɪfɪkli |  | специально; конкретно | for a particular purpose; exactly | The course is *specifically* for beginners. | Курс специально для начинающих.
- totally | adv | ˈtəʊtəli | ˈtoʊtəli | полностью, совсем | completely | I *totally* agree with you. | Я полностью с тобой согласен.
- truly | adv | ˈtruːli |  | действительно, искренне | really; sincerely | I'm *truly* sorry. | Мне искренне жаль.
