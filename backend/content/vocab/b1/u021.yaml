title: Places and the city
title_ru: Город и места
topic: city
words:
- accommodation | n | əˌkɒməˈdeɪʃən | əˌkɑːməˈdeɪʃən | жильё, размещение | a place to stay or live | The price includes *accommodation*. | В стоимость входит проживание. | брит. неисчисляемое
- avenue | n | ˈævənjuː | ˈævənuː | проспект; путь, способ | a wide street; a way of achieving something | We explored every *avenue* before giving up. | Прежде чем сдаться, мы испробовали все пути.
- branch | n | brɑːntʃ | bræntʃ | ветка; отделение, филиал | a part of a tree; a local office of a bank or company | A bird was sitting on a *branch*. | На ветке сидела птица.
- circus | n | ˈsɜːkəs | ˈsɜːrkəs | цирк | a travelling show with clowns, acrobats and sometimes animals | We took the kids to the *circus*. | Мы сводили детей в цирк.
- county | n | ˈkaʊnti |  | графство, округ | one of the areas a country or state is divided into | Kent is a *county* in the south of England. | Кент — графство на юге Англии.
- crossroads | n | ˈkrɒsrəʊdz | ˈkrɔːsroʊdz | перекрёсток | a place where two roads cross | Turn right at the *crossroads*. | На перекрёстке поверните направо.
- downtown | n | ˌdaʊnˈtaʊn |  | центр города | the central part of a city where the shops and offices are | We took a taxi to *downtown* Chicago. | Мы взяли такси до центра Чикаго. | амер.; брит. city centre
- 'dump | n | dʌmp |  | свалка | a place where rubbish is left | They took the old sofa to the *dump*. | Старый диван отвезли на свалку. | гл.: dump — выбрасывать'
- fire station | n | ˈfaɪə ˈsteɪʃən | ˈfaɪər ˈsteɪʃən | пожарная часть | a building where firefighters work | The *fire station* is near the school. | Пожарная часть рядом со школой.
- hostel | n | ˈhɒstl | ˈhɑːstl | хостел, общежитие | a cheap place to stay for travellers or students | We stayed in a youth *hostel*. | Мы остановились в молодёжном хостеле.
- inn | n | ɪn |  | постоялый двор, гостиница | a small hotel or pub, often in the countryside | We stayed at a cosy *inn* in the village. | Мы остановились в уютной гостинице в деревне.
- lodge | n | lɒdʒ | lɑːdʒ | домик, сторожка, охотничий дом | a small house in the countryside, often for holidays | We rented a ski *lodge* for the weekend. | Мы сняли горнолыжный домик на выходные.
- mosque | n | mɒsk | mɑːsk | мечеть | a building where Muslims pray | There's a beautiful *mosque* in the old town. | В старом городе красивая мечеть.
- neighborhood | n | ˈneɪbəhʊd | ˈneɪbərhʊd | район, округа (амер.) | the area around your home | It's a quiet *neighborhood*. | Это тихий район. | брит. neighbourhood
- neighbourhood | n | ˈneɪbəhʊd | ˈneɪbərhʊd | район, округа | the area around your home | We live in a friendly *neighbourhood*. | Мы живём в дружном районе.
- path | n | pɑːθ | pæθ | тропинка, дорожка | a narrow way for walking | Follow the *path* through the forest. | Идите по тропинке через лес.
- port | n | pɔːt | pɔːrt | порт | a town or place where ships load and unload | Hamburg is a busy *port*. | Гамбург — оживлённый порт.
- public transport | n | ˈpʌblɪk ˈtrænspɔːt | ˈpʌblɪk ˈtrænspɔːrt | общественный транспорт | buses, trains, etc. | I use *public transport* to get to work. | Я езжу на работу на общественном транспорте.
- ranch | n | rɑːntʃ | ræntʃ | ранчо | a large farm for cows or horses, especially in America | He grew up on a cattle *ranch* in Texas. | Он вырос на скотоводческом ранчо в Техасе.
- roadside | n | ˈrəʊdsaɪd | ˈroʊdsaɪd | обочина | the area next to a road | We stopped at the *roadside* to eat. | Мы остановились на обочине перекусить.
- ruins | n | ˈruːɪnz |  | руины, развалины | what is left of old buildings | We visited the *ruins* of an old castle. | Мы побывали на развалинах старого замка.
- skyscraper | n | ˈskaɪskreɪpə | ˈskaɪskreɪpər | небоскрёб | a very tall building | New York is famous for its *skyscrapers*. | Нью-Йорк славится своими небоскрёбами.
- traffic jam | n | ˈtræfɪk dʒæm |  | пробка (на дороге) | a long line of cars that cannot move | We were stuck in a *traffic jam*. | Мы застряли в пробке.
- zone | n | zəʊn | zoʊn | зона | an area with a special purpose or quality | This is a no-parking *zone*. | Это зона, где парковка запрещена.
