title: Law and crime
title_ru: Закон и преступность
topic: law
words:
- arrest | v | əˈrest |  | арестовывать | when the police take someone because of a crime | The police *arrested* two men for stealing a car. | Полиция арестовала двух мужчин за угон машины.
- guilty | adj | ˈɡɪlti |  | виновный; чувствующий вину | having done something wrong | I feel *guilty* because I forgot her birthday. | Мне стыдно, что я забыл о её дне рождения.
- innocent | adj | ˈɪnəsnt |  | невиновный | not guilty of a crime | The court decided he was *innocent*. | Суд признал его невиновным.
- license | n | ˈlaɪsns |  | лицензия, права | an official document that allows you to do something | He got his driving *license* last year. | Он получил водительские права в прошлом году. | брит. licence (сущ.)
- outlaw | n | ˈaʊtlɔː |  | преступник, разбойник (вне закона) | a criminal who is hiding from the law | Robin Hood was a famous *outlaw*. | Робин Гуд был знаменитым разбойником.
- punishment | n | ˈpʌnɪʃmənt |  | наказание | something done to someone because they did wrong | The *punishment* was too hard for such a small crime. | Наказание было слишком суровым за такое мелкое преступление.
- rob | v | rɒb | rɑːb | грабить | to steal from a person or place | Two men *robbed* the bank yesterday. | Вчера двое мужчин ограбили банк. | rob a person/bank, steal a thing
- victim | n | ˈvɪktɪm |  | жертва, пострадавший | a person who is hurt in a crime or accident | The *victims* of the accident were taken to hospital. | Пострадавших в аварии доставили в больницу.
