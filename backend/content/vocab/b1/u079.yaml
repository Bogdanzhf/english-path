title: Everyday phrases
title_ru: Разговорные фразы
topic: phrases
words:
- prepared to do something | phr |  |  | готовый (что-то сделать) | willing to do | I'm *prepared to* wait. | Я готов подождать.
- put something up | phr |  |  | повесить, поставить; повысить | to fix on a wall; to build; to raise | Let's *put up* the tent here. | Давай поставим палатку здесь.
- quite a... | phr |  |  | весьма, довольно-таки | used to emphasise | It was *quite a* surprise. | Это был тот ещё сюрприз.
- raise money | phr |  |  | собирать деньги | to collect money for a purpose | We're *raising money* for the hospital. | Мы собираем деньги для больницы.
- rather than | phr |  |  | вместо того чтобы, а не | instead of | I'll have tea *rather than* coffee. | Я буду чай, а не кофе.
- reaction to something | phr |  |  | реакция на | a response to | She had a bad *reaction to* the medicine. | У неё была плохая реакция на лекарство.
- relate to something/somebody | phr |  |  | относиться к; понимать (кого-либо) | to be connected with; to understand | I can *relate to* her problems. | Я понимаю её проблемы.
- related to something/somebody | phr |  |  | связанный с; родственник | connected with | The illness is *related to* stress. | Болезнь связана со стрессом.
- respect for somebody/something | phr |  |  | уважение к | a feeling of admiration for | Show some *respect for* your teachers. | Прояви уважение к учителям.
- result in something | phr |  |  | приводить к | to cause | The storm *resulted in* power cuts. | Шторм привёл к отключению электричества.
- rise in something | phr |  |  | рост (чего-либо) | an increase in | There's been a *rise in* prices. | Цены выросли.
- run out | phr |  |  | кончаться, иссякать | to have none left | We've *run out* of milk. | У нас кончилось молоко. | run out of sth
- search engine | phr |  |  | поисковая система | a website that finds information | Google is the most popular *search engine*. | Google — самая популярная поисковая система.
- slow down | phr |  |  | замедлять(ся) | to go less fast | *Slow down*! You're driving too fast. | Притормози! Ты едешь слишком быстро.
- so far | phr |  |  | пока что, до сих пор | until now | *So far*, everything is fine. | Пока всё хорошо.
- some kind of... | phr |  |  | какой-то, что-то вроде | a type of | There's *some kind of* problem with the printer. | С принтером какая-то проблема.
- succeed in doing something | phr |  |  | преуспеть, суметь | to manage to do | She *succeeded in* passing the exam. | Ей удалось сдать экзамен.
- suffer from something | phr |  |  | страдать от | to have an illness or problem | He *suffers from* headaches. | Он страдает от головных болей.
- sure to do something | phr |  |  | обязательно, наверняка | certain to happen | She's *sure to* win. | Она наверняка победит.
