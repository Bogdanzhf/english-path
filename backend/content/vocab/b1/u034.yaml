title: 'How and how much: adverbs'
title_ru: 'Как и насколько: наречия'
topic: manner
words:
- approximately | adv | əˈprɒksɪmətli | əˈprɑːksəmətli | приблизительно | about | The trip takes *approximately* three hours. | Поездка занимает около трёх часов.
- automatically | adv | ˌɔːtəˈmætɪkli |  | автоматически | without anyone controlling it; without thinking | The lights turn on *automatically* when it gets dark. | Свет включается автоматически, когда темнеет.
- basically | adv | ˈbeɪsɪkli |  | в основном, по сути | in the most important ways | *Basically*, we need more time. | По сути, нам нужно больше времени.
- besides | adv | bɪˈsaɪdz | ˌbiːˈsaɪdz | кроме того | also; in addition | It's too late. *Besides*, I'm tired. | Уже поздно. К тому же я устал.
- effectively | adv | ɪˈfektɪvli | ˈiːfektɪvli | эффективно; фактически | in a way that works well | The medicine works *effectively*. | Лекарство действует эффективно.
- fairly | adv | ˈfeəli | ˈferli | довольно; справедливо | quite; in a fair way | The test was *fairly* easy. | Тест был довольно лёгким.
- 'hardly | adv | ˈhɑːdli | ˈhɑːrdli | едва, почти не | almost not | I could *hardly* hear him. | Я его почти не слышал. | НЕ «сильно»: hard — усердно'
- heavily | adv | ˈhevili | ˈhevəli | сильно; тяжело | a lot; with great force | It rained *heavily* all night. | Всю ночь шёл сильный дождь.
- mainly | adv | ˈmeɪnli |  | главным образом, в основном | mostly | The students are *mainly* from Spain. | Студенты в основном из Испании.
- naturally | adv | ˈnætʃərəli |  | естественно; конечно | in a natural way; of course | *Naturally*, I said yes. | Конечно, я согласился.
- necessarily | adv | ˌnesɪˈserəli | ˌnesəˈserəli | обязательно, непременно | in every case | Expensive doesn't *necessarily* mean good. | Дорого — не обязательно хорошо.
- officially | adv | əˈfɪʃəli |  | официально | in an official way | The bridge was *officially* opened. | Мост был официально открыт.
- perfectly | adv | ˈpɜːfektli | ˈpɜːrfəkli | отлично, совершенно | in a perfect way; completely | I understand you *perfectly*. | Я прекрасно тебя понимаю.
- personally | adv | ˈpɜːsənəli | ˈpɜːrsənəli | лично | used to give your own opinion | *Personally*, I prefer tea. | Лично я предпочитаю чай.
- properly | adv | ˈprɒpəli | ˈprɑːpərli | правильно, как следует | correctly | Make sure the door is *properly* closed. | Проследи, чтобы дверь была как следует закрыта.
- regularly | adv | ˈreɡjuːləli | ˈreɡjələrli | регулярно | often and at fixed times | I exercise *regularly*. | Я регулярно занимаюсь спортом.
- surely | adv | ˈʃɔːli | ˈʃʊrli | конечно, наверняка | used to show you are almost certain | *Surely* you know the answer! | Ну ты-то наверняка знаешь ответ!
- typically | adv | ˈtɪpɪkli | ˈtɪpɪkəli | обычно, как правило | usually | We *typically* have dinner at seven. | Обычно мы ужинаем в семь.
- widely | adv | ˈwaɪdli |  | широко | by a lot of people; in many places | English is *widely* spoken. | На английском говорят повсеместно.
