title: 'How and how much: adverbs'
title_ru: 'Как и насколько: наречия'
topic: manner
words:
- automatically | adv | ˌɔːtəˈmætɪkli |  | автоматически | without anyone controlling it; without thinking | The lights turn on *automatically* when it gets dark. | Свет включается автоматически, когда темнеет.
- 'hardly | adv | ˈhɑːdli | ˈhɑːrdli | едва, почти не | almost not | I could *hardly* hear him. | Я его почти не слышал. | НЕ «сильно»: hard — усердно'
