title: 'Describing: amount and degree'
title_ru: 'Описание: количество и степень'
topic: describing
words:
- abundant | adj | əˈbʌndənt |  | обильный, изобилующий | existing in large amounts | Rain was *abundant* in those years. | В те годы дождей было в изобилии.
- entire | adj | ɪnˈtaɪə | ɪnˈtaɪər | весь, целый | whole; complete | I spent the *entire* day in bed. | Я провёл в постели весь день. | entirely — полностью
- military | adj | ˈmɪlətri | ˈmɪləteri | военный | connected with soldiers and the army | He did his *military* service in the navy. | Он проходил военную службу во флоте.
- official | adj | əˈfɪʃl |  | официальный | approved by a government or someone in power | English is an *official* language in India. | Английский — один из официальных языков Индии.
- principal | n | ˈprɪnsəpl |  | директор (школы) | the person in charge of a school | The *principal* spoke to all the students. | Директор выступил перед всеми учениками. | амер.; брит. head teacher
- private | adj | ˈpraɪvət |  | частный, личный | belonging to one person or group; not public | She studied at a *private* university. | Она училась в частном университете.
- slight | adj | slaɪt |  | небольшой, незначительный | small in degree | There's a *slight* problem. | Есть небольшая проблема. | slightly — слегка
