title: Work and jobs
title_ru: Работа и профессии
topic: work
words:
- colleague | n | ˈkɒliːɡ | ˈkɑːliːɡ | коллега | a person you work with | My *colleagues* gave me a present for my birthday. | Коллеги подарили мне подарок на день рождения.
- employ | v | ɪmˈplɔɪ |  | нанимать, давать работу; применять | to give someone a paid job; to use | The company *employs* 500 people. | В компании работает 500 человек.
- occupation | n | ˌɒkjuˈpeɪʃn | ˌɑːkjuˈpeɪʃn | род занятий, профессия | a job | Please write your name and *occupation*. | Пожалуйста, укажите имя и род занятий.
- retire | v | rɪˈtaɪə | rɪˈtaɪər | уходить на пенсию | to stop working because of age | My father *retired* at sixty-five. | Мой отец вышел на пенсию в шестьдесят пять. | retirement — пенсия (период)
- salary | n | ˈsæləri |  | зарплата | money you get for your work, usually every month | Her *salary* is higher than mine. | У неё зарплата выше, чем у меня.
