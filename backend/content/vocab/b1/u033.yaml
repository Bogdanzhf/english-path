title: Education
title_ru: Учёба
topic: education
words:
- achievement | n | əˈtʃiːvmənt |  | достижение | something you succeed in doing | Passing the exam was a great *achievement*. | Сдать экзамен было большим достижением.
- adviser | n | ədˈvaɪzə | ædˈvaɪzər | советник, консультант | a person who gives advice | She's a financial *adviser*. | Она финансовый консультант. | также advisor
- assignment | n | əˈsaɪnmənt |  | задание | a piece of work given to someone | The teacher gave us a difficult *assignment*. | Учитель дал нам трудное задание.
- basis | n | ˈbeɪsɪs |  | основа, основание | the most important idea or fact from which something develops | Trust is the *basis* of a good friendship. | Доверие — основа хорошей дружбы. | on a daily basis — ежедневно
- development | n | dɪˈveləpmənt |  | развитие; разработка | growth; the process of creating something | The *development* of the new app took a year. | Разработка нового приложения заняла год.
- freshman | n | ˈfreʃmən |  | первокурсник (амер.) | a student in the first year of high school or university | He's a *freshman* at Harvard. | Он первокурсник Гарварда.
- graduation | n | ˌɡrædjuːˈeɪʃən | ˌɡrædʒəˈweɪʃən | окончание учебного заведения, выпускной | finishing a degree; the ceremony | My parents came to my *graduation*. | Мои родители пришли на мой выпускной.
- learning | n | ˈlɜːnɪŋ | ˈlɜːrnɪŋ | обучение, учёба | the process of getting knowledge | Online *learning* is very popular. | Онлайн-обучение очень популярно.
- mathematician | n | ˌmæθɪməˈtɪʃən | ˌmæθəməˈtɪʃən | математик | a person who studies mathematics | She is a brilliant *mathematician*. | Она блестящий математик.
- passage | n | ˈpæsɪdʒ |  | проход, коридор; отрывок | a narrow way between walls; a short part of a text | A secret *passage* led from the kitchen to the garden. | Потайной ход вёл из кухни в сад.
- prefix | n | ˈprifɪks | ˈpriːfɪks | приставка (грам.) | letters added to the beginning of a word | "Un-" is a *prefix* meaning "not". | «Un-» — приставка со значением «не».
- sophomore | n | ˈsɒfəmɔː | ˈsɑːfmɔːr | второкурсник (амер.) | a student in the second year | She's a *sophomore* in college. | Она второкурсница.
- suffix | n | ˈsʌfɪks |  | суффикс | letters added to the end of a word | "-ness" is a common *suffix*. | «-ness» — распространённый суффикс.
- technique | n | tekˈniːk |  | техника, метод | a particular way of doing something | The pilot used a new landing *technique*. | Пилот использовал новую технику посадки.
- textbook | n | ˈtekstbʊk |  | учебник | a book for students | Open your *textbooks* at page 20. | Откройте учебники на странице 20.
- wisdom | n | ˈwɪsdəm | ˈwɪzdəm | мудрость | good judgement that comes from experience | My grandfather was a man of great *wisdom*. | Мой дедушка был очень мудрым человеком.
