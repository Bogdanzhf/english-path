title: Shopping and money
title_ru: Покупки и деньги
topic: shopping
words:
- afford | v | əˈfɔːd | əˈfɔːrd | позволить себе (по деньгам) | to have enough money to buy something | We can't *afford* a new car this year. | В этом году мы не можем позволить себе новую машину. | can/can't afford
- charge | n | tʃɑːdʒ | tʃɑːrdʒ | плата, сбор | the price you have to pay for something | There is no *charge* for delivery. | Доставка бесплатная. | free of charge — бесплатно
- checkout | n | ˈtʃekaʊt |  | касса (в магазине) | the place where you pay in a supermarket | There's a long queue at the *checkout*. | У кассы длинная очередь.
- coin | v | kɔɪn |  | придумывать (слово, выражение) | to invent a new word or phrase | Who *coined* the term 'selfie'? | Кто придумал слово «селфи»? | сущ. coin — монета
- currency | n | ˈkʌrənsi | ˈkɜːrənsi | валюта | the money used in a country | The euro is the *currency* of many European countries. | Евро — валюта многих европейских стран.
- discount | n | ˈdɪskaʊnt |  | скидка | a reduction in price | Students get a 10% *discount*. | Студентам скидка 10%.
- donate | v | dəʊˈneɪt | ˈdoʊneɪt | жертвовать | to give money or things to help others | They *donated* old clothes to the hospital. | Они пожертвовали старую одежду больнице. | donate blood — сдавать кровь
- exchange | v | ɪksˈtʃeɪndʒ |  | обмениваться, менять | to give something and receive something else | We *exchanged* phone numbers. | Мы обменялись номерами телефонов.
- exchange rate | n | ɪksˈtʃeɪndʒ reɪt |  | обменный курс | the value of one currency in another | What's the *exchange rate* today? | Какой сегодня курс?
- fortune | n | ˈfɔːtʃuːn | ˈfɔːrtʃən | состояние (богатство); удача, судьба | a large amount of money; luck | He made a *fortune* selling computers. | Он сколотил состояние на продаже компьютеров.
- goods | n | ɡʊdz |  | товары | things that are made to be sold | The ships carried *goods* to distant lands. | Корабли возили товары в далёкие страны.
- hand | v | hænd |  | передавать, вручать | to give something with your hand | Can you *hand* me that book? | Можешь передать мне ту книгу? | hand in — сдавать (работу)
- invest | v | ɪnˈvest |  | вкладывать, инвестировать | to put money into something to get more money later | He *invested* all his savings in a small hotel. | Он вложил все свои сбережения в маленький отель.
- payment | n | ˈpeɪmənt |  | оплата, платёж | an amount of money that is paid | We accept *payment* by card. | Мы принимаем оплату картой.
- pocket money | n | ˈpɒkɪt ˈmʌni | ˈpɑːkət ˈmʌni | карманные деньги | money parents give children | I get *pocket money* every week. | Я получаю карманные деньги каждую неделю.
- 'queue | n | kjuː |  | очередь (брит.) | a line of people waiting | There was a long *queue* for tickets. | За билетами была длинная очередь. | гл.: queue — стоять в очереди; амер. line'
- receipt | n | rɪˈsiːt |  | чек, квитанция | a piece of paper that shows you have paid | Keep the *receipt* in case you want to return it. | Сохраните чек на случай возврата. | p не читается
- reclaim | v | rɪˈkleɪm | riːˈkleɪm | требовать обратно, получать (багаж) | to get back something you own | You can *reclaim* your bags at the exit. | Багаж можно получить у выхода. | baggage reclaim — выдача багажа
- refund | n | ˈriːfʌnd |  | возврат денег | money given back to you | The buyer demanded a *refund*. | Покупатель потребовал вернуть деньги.
- repay | v | rɪˈpeɪ |  | возвращать (долг), отплатить | to pay back money; to do something good in return | How can I ever *repay* you? | Как я смогу тебе отплатить?
- share | n | ʃeə | ʃer | доля, часть; акция | a part of something; a part of a company | He sold his *shares* in the company. | Он продал свои акции компании.
- shopper | n | ˈʃɒpə | ˈʃɑːpər | покупатель | a person who is shopping | The streets were full of *shoppers*. | Улицы были полны покупателей.
- store | v | stɔː | stɔːr | хранить | to keep something somewhere | *Store* the medicine in a cool place. | Храните лекарство в прохладном месте.
- till | prep | tɪl |  | до (разг.) | until | The shop is open *till* eight. | Магазин работает до восьми. | сущ. till — касса
- warranty | n | ˈwɒrənti | ˈwɔːrənti | гарантия | a written promise to repair a product | The laptop has a two-year *warranty*. | На ноутбук гарантия два года.
