title: Objects and materials
title_ru: Предметы и материалы
topic: objects
words:
- brass | n | brɑːs | bræs | латунь; медные духовые | a yellow metal made of copper and zinc | The door had a *brass* handle. | На двери была латунная ручка.
- clay | n | kleɪ |  | глина | soft earth that becomes hard when it is baked | The children made animals out of *clay*. | Дети лепили из глины зверюшек.
- faucet | n | ˈfɔːsɪt |  | кран (водопроводный) | a device that controls the flow of water (US) | The kitchen *faucet* was dripping. | Кухонный кран подтекал. | брит. tap
- ivory | n | ˈaɪvəri |  | слоновая кость | the hard white material from elephants' tusks | Selling *ivory* is now illegal in most countries. | Продажа слоновой кости сейчас запрещена в большинстве стран. | ivory — также цвет слоновой кости
- leather | n | ˈleðə | ˈleðər | кожа (материал) | animal skin used to make shoes and bags | He wore an old *leather* jacket. | На нём была старая кожаная куртка.
- marble | n | ˈmɑːbl | ˈmɑːrbl | мрамор | a hard, smooth stone used in buildings and statues | The palace floors were made of *marble*. | Полы во дворце были мраморные.
- mixture | n | ˈmɪkstʃə | ˈmɪkstʃər | смесь | a combination of different things | Pour the *mixture* into a tin. | Вылейте смесь в форму.
- mud | n | mʌd |  | грязь | wet, soft earth | The children came home covered in *mud*. | Дети пришли домой все в грязи.
- paste | n | peɪst |  | паста; клейстер | a thick soft mixture | Mix the flour and water into a *paste*. | Смешайте муку с водой до состояния пасты. | toothpaste — зубная паста
- puddle | n | ˈpʌdl |  | лужа | a small pool of water on the ground | The children jumped in the *puddles* after the rain. | После дождя дети прыгали по лужам.
- straw | n | strɔː |  | соломинка; солома | a thin tube for drinking; dry stems of plants | Can I have a *straw* for my juice? | Можно мне трубочку для сока?
- trash | n | træʃ |  | мусор | things that you throw away | Please take out the *trash*. | Пожалуйста, вынеси мусор. | амер.; брит. rubbish
- wax | n | wæks |  | воск | a soft substance used to make candles | The candle *wax* dripped onto the table. | Воск со свечи капал на стол.
