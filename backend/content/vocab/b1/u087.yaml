title: 'Describing: time and age'
title_ru: 'Описание: время, новизна, возраст'
topic: describing
words:
- brand-new | adj | ˈbrændnu | ˈbrændnuː | совершенно новый | completely new | She has a *brand-new* car. | У неё новенькая машина.
- chronological | adj | ˌkrɒnəˈlɒdʒɪkl | ˌkrɑːnəˈlɑːdʒɪkl | хронологический | in the order things happened | List the events in *chronological* order. | Перечислите события в хронологическом порядке.
- clear | v | klɪə | klɪr | убирать, расчищать | to remove things from a place | Can you *clear* the table? | Можешь убрать со стола?
- continual | adj | kənˈtɪnjuːəl |  | постоянный, беспрестанный | happening again and again | I'm tired of his *continual* complaints. | Я устал от его вечных жалоб.
- expected | adj | ɪkˈspektɪd | ɪkˈspektəd | ожидаемый | thought likely to happen | The *expected* time of arrival is 6 pm. | Ожидаемое время прибытия — 18:00.
- immediate | adj | ɪˈmiːdiət |  | немедленный | happening now, without waiting | We need an *immediate* answer. | Нам нужен немедленный ответ. | нареч. immediately — сразу
- initial | adj | ɪˈnɪʃl |  | начальный, первоначальный | first; at the beginning | My *initial* reaction was surprise. | Моей первой реакцией было удивление. | initially — сначала
- known | adj | nəʊn | noʊn | известный | that people know about | There's no *known* cure for the disease. | Известного лекарства от этой болезни нет. | well-known — широко известный
- latest | adj | ˈleɪtəst |  | последний, новейший | newest | Have you heard the *latest* news? | Ты слышал последние новости?
- old-fashioned | adj | ˌəʊldˈfæʃənd | ˌoʊldˈfæʃənd | старомодный | not modern | My parents are quite *old-fashioned*. | Мои родители довольно старомодны.
- overnight | adv | ˌəʊvəˈnaɪt | ˌoʊvərˈnaɪt | за ночь, на ночь | during the night; very suddenly | It snowed heavily *overnight*. | За ночь выпало много снега. | stay overnight — остаться на ночь
- primary | adj | ˈpraɪməri | ˈpraɪmeri | основной, главный; начальный | most important; first | Our *primary* goal is to help people. | Наша главная цель — помогать людям. | primary school — начальная школа
- recycled | adj | rɪˈsaɪkəld | riːˈsaɪkəld | переработанный | made from used materials | The bag is made of *recycled* plastic. | Сумка сделана из переработанного пластика.
- repeated | adj | rɪˈpiːtɪd | riːˈpiːtɪd | повторный, неоднократный | happening many times | Despite *repeated* warnings, he kept smoking. | Несмотря на неоднократные предупреждения, он продолжал курить.
- retired | adj | rɪˈtaɪəd | riːˈtaɪərd | на пенсии | having stopped working because of age | My grandfather is *retired*. | Мой дедушка на пенсии.
- secondary | adj | ˈsekəndəri | ˈsekənderi | второстепенный; средний (о школе) | less important; for students aged 11–18 | Money is of *secondary* importance. | Деньги имеют второстепенное значение.
- secondhand | adj | ˌsekəndˈhænd |  | подержанный; полученный из вторых рук | not new; heard from other people, not directly | I bought a *secondhand* car. | Я купил подержанную машину. | брит. second-hand
- sudden | adj | ˈsʌdn |  | внезапный | happening quickly and unexpectedly | There was a *sudden* change in the weather. | Погода внезапно изменилась.
- various | adj | ˈveəriəs | ˈveriəs | различный, разнообразный | many different | The shop sells *various* kinds of tea. | Магазин продаёт разные сорта чая.
- whatever | pron | wɒˈtevə | ˌhwʌˈtevər | что угодно, всё что | anything | Eat *whatever* you like. | Ешь что хочешь.
