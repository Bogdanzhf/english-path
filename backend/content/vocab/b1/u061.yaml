title: Communication and language
title_ru: Общение и язык
topic: communication
words:
- account | n | əˈkaʊnt |  | рассказ, отчёт; счёт | a description of an event | The newspaper's *account* of the crime was wrong. | Газетное описание преступления было неверным. | take into account — учитывать
- agreement | n | əˈɡriːmənt |  | соглашение, договор | an arrangement or decision between people | The two companies signed an *agreement*. | Две компании подписали соглашение.
- announcement | n | əˈnaʊnsmənt |  | объявление | a public statement | There was an *announcement* about the delay. | Было объявление о задержке.
- debate | v | dɪˈbeɪt |  | обсуждать, дебатировать | to discuss a subject seriously with different opinions | Scientists still *debate* this question. | Учёные до сих пор спорят об этом вопросе.
- definition | n | ˌdefɪˈnɪʃən | ˌdefəˈnɪʃən | определение | an explanation of the meaning of a word | Look up the *definition* in a dictionary. | Посмотри определение в словаре.
- display | v | dɪˈspleɪ |  | проявлять, демонстрировать; выставлять | to show a feeling or quality | He *displayed* great courage. | Он проявил огромное мужество.
- entry | n | ˈentri |  | вход; запись; заявка | the act of going in; an item in a list | *Entry* to the museum is free. | Вход в музей бесплатный.
- first language | n | fɜːst ˈlæŋɡwɪdʒ | fɜːrst ˈlæŋɡwədʒ | родной язык | the language you learn first | Her *first language* is Spanish. | Её родной язык — испанский.
- full stop | n | fʊl stɒp | fʊl stɑːp | точка (брит.) | the mark (.) at the end of a sentence | Put a *full stop* at the end. | Поставь точку в конце. | амер. period
- journal | n | ˈdʒɜːnl | ˈdʒɜːrnl | журнал (научный); дневник | a serious magazine; a diary | Her article was published in a medical *journal*. | Её статья была опубликована в медицинском журнале.
- printing | n | ˈprɪntɪŋ | ˈprɪnɪŋ | печать, книгопечатание | producing printed text | The *printing* of the book took a week. | Печать книги заняла неделю.
- profile | n | ˈprəʊfaɪl | ˈproʊfaɪl | профиль; очерк | the side view of a face; a short description | I saw his *profile* against the window. | Я видел его профиль на фоне окна.
- question mark | n | ˈkwestʃən mɑːk | ˈkwestʃən mɑːrk | вопросительный знак | the mark (?) | Don't forget the *question mark*. | Не забудь вопросительный знак.
- reference | n | ˈrefrəns |  | ссылка, упоминание; справка | the act of mentioning something; a source of information | The book contains many *references* to local legends. | В книге много упоминаний местных легенд. | reference book — справочник
- script | n | skrɪpt |  | сценарий | the written text of a film or play | The actors read the *script* together. | Актёры вместе прочитали сценарий.
- signal | n | ˈsɪɡnəl |  | сигнал | a sound, light or movement that gives information | There's no phone *signal* in the mountains. | В горах нет связи.
- summary | n | ˈsʌməri |  | краткое изложение, резюме | a short statement of the main points | Here is a *summary* of the research. | Вот краткое изложение исследования. | in summary — в итоге
- theme | n | θiːm |  | тема | the main subject of a work | War and greed are common *themes* in his work. | Война и жадность — частые темы его работ.
- tone | n | təʊn | toʊn | тон | the quality of a voice or sound | Don't speak to me in that *tone*! | Не разговаривай со мной таким тоном!
- version | n | ˈvɜːʃn | ˈvɜːrʒn | версия | a form of something that is slightly different from others | The two witnesses gave different *versions* of events. | Два свидетеля по-разному описали события.
