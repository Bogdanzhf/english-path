title: Feelings and character
title_ru: Чувства и характер
topic: feelings
words:
- calm | adj | kɑːm |  | спокойный | not angry, nervous or excited | Stay *calm* and listen to me. | Сохраняй спокойствие и слушай меня. | l не произносится
- grateful | adj | ˈɡreɪtfl |  | благодарный | feeling thankful | I'm very *grateful* for your help. | Я очень благодарен за твою помощь.
- jealous | adj | ˈdʒeləs |  | ревнивый; завистливый | unhappy because someone has what you want | He's *jealous* of his brother's success. | Он завидует успеху брата.
- mad | adj | mæd |  | сумасшедший; злой (амер.) | crazy; angry | My mum will be *mad* if I'm late again. | Мама разозлится, если я снова опоздаю. | be mad about — обожать
- overjoyed | adj | ˌəʊvəˈdʒɔɪd | ˌoʊvərˈdʒɔɪd | вне себя от радости | extremely happy | The archaeologists were *overjoyed* by the discovery. | Археологи были вне себя от радости из-за находки.
- pleasant | adj | ˈpleznt |  | приятный | nice and enjoyable | We had a *pleasant* evening by the fire. | Мы приятно провели вечер у камина.
- stricken | adj | ˈstrɪkən |  | поражённый, охваченный | badly affected by trouble or illness | The *stricken* planet slowly recovered. | Поражённая катастрофой планета медленно восстанавливалась.
- terrified | adj | ˈterɪfaɪd |  | перепуганный | very frightened | I'm *terrified* of spiders. | Я до ужаса боюсь пауков.
- trust | v | trʌst |  | доверять | to believe that someone is honest and good | I *trust* my best friend completely. | Я полностью доверяю лучшему другу.
