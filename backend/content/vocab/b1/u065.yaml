title: Communication and language
title_ru: Общение и язык
topic: communication
words:
- applause | n | əˈplɔːz |  | аплодисменты | the sound of people clapping | The speech was followed by loud *applause*. | За речью последовали громкие аплодисменты.
- bargain | n | ˈbɑːɡɪn | ˈbɑːrɡɪn | выгодная покупка | something bought for less than its usual price | This jacket was a real *bargain* — only ten pounds! | Эта куртка — настоящая находка, всего десять фунтов!
- bulletin | n | ˈbʊlətɪn |  | сводка, бюллетень | a short official news report | We heard the news in the six o'clock *bulletin*. | Мы услышали новость в шестичасовой сводке.
- clue | n | kluː |  | подсказка, улика, ключ (к разгадке) | a piece of information that helps solve a problem or mystery | The police found an important *clue*. | Полиция нашла важную улику.
- complement | v | ˈkɒmplɪment | ˈkɑːmplɪment | дополнять | to go well with something and make it better | The wine *complements* the fish perfectly. | Вино отлично дополняет рыбу. | не путайте с compliment
- compliment | v | ˈkɒmplɪment | ˈkɑːmplɪment | делать комплимент, хвалить | to say something nice about someone | He *complimented* her on her cooking. | Он похвалил её стряпню. | не путайте с complement — дополнять
- farewell | n | ˌfeəˈwel | ˌferˈwel | прощание | the act of saying goodbye | They said a sad *farewell* to the old house. | Они печально простились со старым домом.
- gossip | n | ˈɡɒsɪp | ˈɡɑːsɪp | сплетни | talk about other people's private lives | There's a lot of *gossip* about his identity. | О его личности ходит много слухов.
- nod | v | nɒd | nɑːd | кивать | to move your head up and down | She *nodded* to show she agreed. | Она кивнула в знак согласия.
- scream | v | skriːm |  | кричать, визжать | to shout in a very loud, high voice | The children *screamed* with joy on the rollercoaster. | Дети визжали от восторга на американских горках.
- yell | v | jel |  | кричать, вопить | to shout loudly | Please don't *yell* near the animals. | Пожалуйста, не кричите рядом с животными.
