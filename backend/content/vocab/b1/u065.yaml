title: Actions and movement
title_ru: Действия и движение
topic: actions
words:
- bury | v | ˈberi |  | хоронить, закапывать | to put something in the ground and cover it | The dog *buried* a bone in the garden. | Собака закопала кость в саду. | произносится как berry
- experience | v | ɪkˈspɪəriəns | ɪkˈspɪriəns | испытывать, переживать | to have something happen to you | Many people *experience* stress at work. | Многие испытывают стресс на работе.
- freeze | v | friːz |  | замерзать, замораживать | to become ice; to make food very cold | Water *freezes* at 0°C. | Вода замерзает при 0°C. | freeze – froze – frozen
- limp | v | lɪmp |  | хромать | to walk with difficulty because of an injured leg | He *limped* off the field. | Он, хромая, ушёл с поля.
- pour | v | pɔː | pɔːr | наливать; лить(ся) | to make a liquid flow out of a container | She *poured* coffee into my cup. | Она налила мне кофе в чашку. | It's pouring — льёт как из ведра
- present | v | prɪˈzent |  | представлять, вручать; вести (передачу) | to give; to show; to host a show | She *presented* the prizes. | Она вручила призы.
- reflect | v | rɪˈflekt |  | отражать | to send back light, heat or an image | The lake *reflected* the mountains like a mirror. | Озеро отражало горы, как зеркало.
- reveal | v | rɪˈviːl |  | раскрывать, показывать | to show or tell something that was secret | The magician never *reveals* his tricks. | Фокусник никогда не раскрывает свои секреты.
- 'sail | v | seɪl |  | плыть (под парусом) | to travel on water in a boat | We *sailed* to the island. | Мы приплыли на остров. | сущ.: sail — парус'
- scan | v | skæn |  | сканировать; просматривать | to copy with a scanner; to look quickly | *Scan* the text for key words. | Пробегите текст глазами в поисках ключевых слов.
- scatter | v | ˈskætə | ˈskætər | разбрасывать, рассыпать | to throw things around over a wide area | The wind *scattered* the papers across the floor. | Ветер разбросал бумаги по полу.
- sense | v | sens |  | чувствовать, ощущать | to feel without being told | I *sensed* that something was wrong. | Я почувствовал, что что-то не так.
- shiver | n | ˈʃɪvə | ˈʃɪvər | дрожь | a small shaking movement of the body when you are cold or afraid | A *shiver* ran down my back. | По спине пробежала дрожь. | гл. shiver — дрожать
- suffer | v | ˈsʌfə | ˈsʌfər | страдать | to feel pain or have problems | Many people *suffer* from headaches. | Многие страдают от головных болей. | suffer from
- thump | v | θʌmp |  | стукнуть, бить кулаком | to hit hard with a closed hand | He *thumped* the table angrily. | Он сердито стукнул по столу.
- 'tick | v | tɪk |  | отмечать галочкой | to mark with ✓ | *Tick* the correct answer. | Отметьте галочкой правильный ответ. | сущ.: tick — галочка; амер. check'
- tremble | v | ˈtrembl |  | дрожать | to shake because you are cold, afraid or weak | Her hands *trembled* as she opened the letter. | Её руки дрожали, когда она открывала письмо.
- tumble | v | ˈtʌmbl |  | падать, кувыркаться | to fall suddenly | She *tumbled* down the stairs. | Она скатилась с лестницы.
- wander | v | ˈwɒndə | ˈwɑːndər | бродить, блуждать | to walk around without a clear plan | We *wandered* around the old town. | Мы бродили по старому городу. | не путайте с wonder — интересоваться
