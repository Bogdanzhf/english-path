reading:
  title: "Bonfire Night"
  title_ru: "Ночь костров"
  text: |
    Every year on the fifth of November, people in Britain celebrate Bonfire Night. It's one of my favourite autumn evenings. The tradition is over four hundred years old. In 1605, a group of men tried to blow up Parliament in London. One of them, Guy Fawkes, was caught guarding the explosives. Since then, the British have remembered the night with bonfires and fireworks.

    This year, my family decided to have a party in our garden. My job was to make the food. I baked ginger biscuits with flour, butter and sugar, and I made a hot apple drink. I crushed some cinnamon, blended it with the apples and added a spoonful of honey paste. My little brother tried to help, but he spilled the mixture everywhere. "That's disgusting!" he laughed as it ran down the drain.

    Dad was in charge of the fireworks. He set them up at the end of the garden on a metal frame held together with wire. He altered the plan several times because our cat kept sitting in the way. "Stand aside, everyone!" he shouted. Then he lit the fuse.

    The first rocket flew up and curved across the dark sky, exploding into a shower of gold. Everyone cheered. Our neighbours came to watch from the other side of the fence. Their kids were a bit jealous — they had only had sparklers. "We envy you," their mum said. "Come and join us," Mum replied, and soon both families were standing together.

    By ten o'clock, the bonfire had collapsed into a pile of glowing red wood. I wiped the sticky tables while Mum looked for the receipt for the fireworks. "We'll need to buy more next year," she said, embracing me. "That was the best Bonfire Night ever."
  ru: |
    Каждый год пятого ноября в Британии отмечают Ночь костров. Это один из моих любимых осенних вечеров. Традиции более четырёхсот лет. В 1605 году группа заговорщиков пыталась взорвать парламент в Лондоне. Одного из них, Гая Фокса, поймали, когда он охранял взрывчатку. С тех пор британцы вспоминают ту ночь кострами и фейерверками.

    В этом году наша семья решила устроить праздник в саду. Мне поручили еду. Я испёк имбирное печенье из муки, масла и сахара и приготовил горячий яблочный напиток. Я растолок корицу, смешал её с яблоками и добавил ложку медовой пасты. Младший брат пытался помогать, но разлил смесь повсюду. «Фу, гадость!» — смеялся он, пока она стекала в слив.

    Папа отвечал за фейерверк. Он установил его в конце сада на металлической раме, скреплённой проволокой. Ему несколько раз пришлось менять план, потому что наш кот всё время садился на пути. «Все отойдите в сторону!» — крикнул он. И поджёг фитиль.

    Первая ракета взлетела и описала дугу в тёмном небе, рассыпавшись золотым дождём. Все закричали от восторга. Соседи пришли посмотреть с другой стороны забора. Их дети немного завидовали — у них были только бенгальские огни. «Мы вам завидуем», — сказала их мама. «Присоединяйтесь», — ответила моя мама, и вскоре обе семьи стояли вместе.

    К десяти часам костёр осел грудой тлеющих красных поленьев. Я вытирал липкие столы, пока мама искала чек за фейерверк. «В следующем году надо будет купить ещё», — сказала она, обнимая меня. «Это была лучшая Ночь костров за всю жизнь».
