title: Actions and movement
title_ru: Действия и движение
topic: actions
words:
- babysit | v | ˈbeɪbɪsɪt | ˈbeɪbiːsɪt | присматривать за ребёнком | to look after a child while the parents are out | My sister *babysits* for our neighbours. | Моя сестра сидит с детьми соседей.
- bother | v | ˈbɒðə | ˈbɑːðər | беспокоить, мешать; утруждать себя | to annoy someone; to make the effort to do something | Sorry to *bother* you, but can you help me? | Извините за беспокойство, не могли бы вы мне помочь?
- cheat | v | tʃiːt |  | жульничать, обманывать | to break the rules to win or get something | He was caught *cheating* in the exam. | Его поймали на списывании на экзамене.
- crush | v | krʌʃ |  | давить, раздавливать | to press something so hard that it breaks | *Crush* the garlic with a knife. | Раздавите чеснок ножом. | have a crush on — быть влюблённым в
- cut | n | kʌt |  | порез; сокращение | a wound from something sharp; a reduction | I have a small *cut* on my finger. | У меня маленький порез на пальце.
- divide | v | dɪˈvaɪd |  | делить, разделять | to separate something into parts | *Divide* the cake into eight pieces. | Разделите торт на восемь кусков.
- drop | n | drɒp | drɑːp | капля; падение | a very small amount of liquid; a fall | A *drop* of rain fell on my nose. | Капля дождя упала мне на нос.
- face | v | feɪs |  | быть обращённым к; сталкиваться (с проблемой) | to look towards; to deal with a difficult situation | Our hotel room *faced* the sea. | Наш номер выходил на море. | face a problem — столкнуться с проблемой
- handle | n | ˈhændl |  | ручка | the part of an object that you hold | The *handle* of the door is broken. | Ручка двери сломана. | гл. handle — справляться
- hang | v | hæŋ |  | вешать, висеть | to fix something at the top so that the lower part is free | *Hang* your coat on the hook by the door. | Повесь пальто на крючок у двери. | hang — hung — hung
- mount | v | maʊnt |  | подниматься на; устанавливать | to go up; to fix something in position | The TV is *mounted* on the wall. | Телевизор закреплён на стене.
- moving | adj | ˈmuːvɪŋ |  | трогательный; движущийся | making you feel emotion; changing position | It was a very *moving* film. | Это был очень трогательный фильм.
- ought | v | ɔːt |  | следует, должен | should | You *ought* to see a doctor. | Тебе следует сходить к врачу. | ought to + глагол
- quit | v | kwɪt |  | бросать, уходить | to stop doing something; to leave a job | He *quit* his job to travel. | Он бросил работу, чтобы путешествовать. | quit — quit — quit
- rolling | adj | ˈrəʊlɪŋ | ˈroʊlɪŋ | холмистый; катящийся | having gentle hills; moving by turning over | The farm has *rolling* green hills. | На ферме холмистые зелёные поля.
- safeguard | n | ˈseɪfɡɑːd | ˈseɪfɡɑːrd | гарантия, мера защиты | something that protects | The law is a *safeguard* against unfair treatment. | Этот закон — гарантия от несправедливого обращения.
- seek | v | siːk |  | искать | to try to find or get something | Many young people *seek* work in big cities. | Многие молодые люди ищут работу в больших городах. | seek — sought — sought; формальнее, чем look for
- sort | v | sɔːt | sɔːrt | сортировать | to put things in groups | *Sort* the clothes into light and dark colours. | Рассортируй одежду на светлую и тёмную. | sort out — разобраться
- trap | n | træp |  | ловушка | something used to catch animals or people | They caught the mouse in a *trap*. | Они поймали мышь в мышеловку.
- 'treat | v | triːt |  | обращаться; лечить; угощать | to behave towards; to give medical care; to pay for someone | Doctors *treated* him for a broken leg. | Врачи лечили ему сломанную ногу. | сущ.: treat — угощение'
