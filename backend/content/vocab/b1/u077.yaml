title: Law and crime
title_ru: Закон и преступность
topic: law
words:
- act | n | ækt |  | поступок; акт; закон | something you do; a law | It was an *act* of kindness. | Это был добрый поступок.
- arrest | v | əˈrest |  | арестовывать | when the police take someone because of a crime | The police *arrested* two men for stealing a car. | Полиция арестовала двух мужчин за угон машины.
- burglar | n | ˈbɜːɡlə | ˈbɜːrɡlər | грабитель (взломщик) | a person who breaks into houses to steal | A *burglar* broke into our house. | К нам в дом залез вор.
- court | n | kɔːt | kɔːrt | суд; корт | a place where legal cases are decided; a sports area | He had to appear in *court*. | Ему пришлось предстать перед судом.
- criminal | adj | ˈkrɪmɪnl | ˈkrɪmənl | уголовный, преступный | relating to crime | He has no *criminal* record. | У него нет судимостей.
- guilty | adj | ˈɡɪlti |  | виновный; чувствующий вину | having done something wrong | I feel *guilty* because I forgot her birthday. | Мне стыдно, что я забыл о её дне рождения.
- illegal | adj | ɪˈliːɡl | ˌɪˈliːɡl | незаконный | against the law | It's *illegal* to drive without a licence. | Водить без прав незаконно.
- innocent | adj | ˈɪnəsnt |  | невиновный | not guilty of a crime | The court decided he was *innocent*. | Суд признал его невиновным.
- 'judge | n | dʒʌdʒ |  | судья | a person who decides cases in court | The *judge* sent him to prison. | Судья отправил его в тюрьму. | гл.: judge — судить, оценивать'
- license | n | ˈlaɪsns |  | лицензия, права | an official document that allows you to do something | He got his driving *license* last year. | Он получил водительские права в прошлом году. | брит. licence (сущ.)
- 'murder | n | ˈmɜːdə | ˈmɜːrdər | убийство | killing someone on purpose | He was arrested for *murder*. | Его арестовали за убийство. | гл.: murder — убивать'
- murderer | n | ˈmɜːdərə | ˈmɜːrdərər | убийца | a person who murders someone | The police caught the *murderer*. | Полиция поймала убийцу.
- outlaw | n | ˈaʊtlɔː |  | преступник, разбойник (вне закона) | a criminal who is hiding from the law | Robin Hood was a famous *outlaw*. | Робин Гуд был знаменитым разбойником.
- prohibition | n | prəhɪˈbɪʃən | ˌproʊəˈbɪʃən | запрет | a law that forbids something | There's a *prohibition* on smoking here. | Здесь действует запрет на курение.
- punishment | n | ˈpʌnɪʃmənt |  | наказание | something done to someone because they did wrong | The *punishment* was too hard for such a small crime. | Наказание было слишком суровым за такое мелкое преступление.
- rob | v | rɒb | rɑːb | грабить | to steal from a person or place | Two men *robbed* the bank yesterday. | Вчера двое мужчин ограбили банк. | rob a person/bank, steal a thing
- robbery | n | ˈrɒbəri | ˈrɑːbəri | ограбление | stealing from a person or place | There was a bank *robbery* yesterday. | Вчера ограбили банк.
- spy | n | spaɪ |  | шпион | a person who secretly gets information | He was a *spy* during the war. | Во время войны он был шпионом.
- victim | n | ˈvɪktɪm |  | жертва, пострадавший | a person who is hurt in a crime or accident | The *victims* of the accident were taken to hospital. | Пострадавших в аварии доставили в больницу.
