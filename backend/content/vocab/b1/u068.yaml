title: 'How and how much: adverbs'
title_ru: 'Как и насколько: наречия'
topic: manner
words:
- aloud | adv | əˈlaʊd |  | вслух | in a voice that others can hear | Please read the text *aloud*. | Пожалуйста, прочитайте текст вслух.
- anyhow | adv | ˈenɪhaʊ | ˈeniːhaʊ | так или иначе, всё равно | anyway | It's raining, but I'll go *anyhow*. | Идёт дождь, но я всё равно пойду.
- brightly | adv | ˈbraɪtli |  | ярко | in a bright way | The sun was shining *brightly*. | Ярко светило солнце.
- dangerously | adv | ˈdeɪndʒərəsli |  | опасно | in a dangerous way | He drives *dangerously*. | Он водит опасно.
- distinctly | adv | dɪˈstɪŋktli |  | отчётливо | clearly | I *distinctly* remember locking the door. | Я отчётливо помню, что запер дверь.
- evenly | adv | ˈiːvnli |  | равномерно | in a balanced way | Bikes must be *evenly* distributed across the city. | Велосипеды нужно равномерно распределять по городу.
- feverishly | adv | ˈfiːvərɪʃli | ˈfevərɪʃli | лихорадочно | very quickly and excitedly | They worked *feverishly* to finish on time. | Они лихорадочно работали, чтобы успеть.
- genetically | adv | dʒeˈnetɪkli | dʒəˈnetɪkli | генетически | relating to genes | *Genetically* modified food is controversial. | Генетически модифицированная еда вызывает споры.
- hurriedly | adv | ˈhʌrɪdli | ˈhɜːriːdli | поспешно | quickly | She *hurriedly* packed her bag. | Она поспешно собрала сумку.
- lovingly | adv | ˈlʌvɪŋli |  | с любовью | in a loving way | She looked at him *lovingly*. | Она посмотрела на него с любовью.
- pleasantly | adv | ˈplezəntli |  | приятно | in a pleasant way | I was *pleasantly* surprised. | Я был приятно удивлён.
- politely | adv | pəˈlaɪtli |  | вежливо | in a polite way | He *politely* asked for help. | Он вежливо попросил помощи.
- strangely | adv | ˈstreɪndʒli |  | странно | in a strange way | He's been acting *strangely*. | Он ведёт себя странно.
- unexpectedly | adv | ˌʌnekˈspektɪdli | ˌʌnɪkˈspektɪdli | неожиданно | in a way you did not expect | She arrived *unexpectedly*. | Она приехала неожиданно.
- unfairly | adv | ʌnˈfeəli | ənˈferli | несправедливо | in an unfair way | I was treated *unfairly*. | Со мной поступили несправедливо.
- violently | adv | ˈvaɪələntli |  | яростно, жестоко | with force | The ship shook *violently*. | Корабль сильно трясло.
- visually | adv | ˈvɪʒuːəli | ˈvɪʒwəli | визуально | relating to seeing | The film is *visually* stunning. | Визуально фильм потрясающий.
- wildly | adv | ˈwaɪldli |  | бурно, неистово | in an uncontrolled way | The crowd cheered *wildly*. | Толпа бурно ликовала.
