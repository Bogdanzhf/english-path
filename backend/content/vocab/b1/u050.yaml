title: Arts and media
title_ru: Искусство и медиа
topic: arts
words:
- channel | n | ˈtʃænl |  | канал; пролив | a long narrow passage for water; a TV station | They dug a *channel* to bring water to the fields. | Они вырыли канал, чтобы подвести воду к полям. | the English Channel — Ла-Манш
- episode | n | ˈepɪsəʊd | ˈepɪsoʊd | эпизод, случай; серия | an event; one part of a TV series | The whole *episode* lasted less than a minute. | Всё произошло меньше чем за минуту.
- headline | n | ˈhedlaɪn |  | заголовок | the title of a newspaper story in large letters | The story made the *headlines* all over the world. | Эта история попала в заголовки по всему миру.
- landscape | n | ˈlændskeɪp |  | пейзаж, ландшафт | everything you can see in an area of land | The *landscape* in Scotland is wild and beautiful. | Пейзажи Шотландии дикие и красивые.
- literature | n | ˈlɪtrətʃə | ˈlɪtərətʃər | литература | written works, especially of artistic value | Snakes appear in world *literature* from the Bible to Harry Potter. | Змеи появляются в мировой литературе — от Библии до «Гарри Поттера».
- media | n | ˈmiːdiə |  | СМИ; медиа | television, radio, newspapers and the internet as a whole | The story got a lot of attention in the *media*. | История привлекла большое внимание СМИ. | social media — соцсети
- performance | n | pəˈfɔːməns | pərˈfɔːrməns | результат, работоспособность; выступление | how well someone or something does a task | Sleep has a huge effect on athletic *performance*. | Сон сильно влияет на спортивные результаты.
- plot | v | plɒt | plɑːt | замышлять, строить козни | to plan something secretly, usually something bad | They *plotted* to steal the money. | Они замышляли украсть деньги. | сущ. plot — сюжет; заговор
- poet | n | ˈpəʊɪt | ˈpoʊət | поэт | a person who writes poems | Pushkin is Russia's most famous *poet*. | Пушкин — самый известный поэт России.
- portrait | n | ˈpɔːtrət | ˈpɔːrtrət | портрет | a painting or photo of a person | There's a *portrait* of the queen in the hall. | В зале висит портрет королевы.
- statue | n | ˈstætʃuː |  | статуя | a figure of a person or animal made of stone or metal | There are almost 1,000 *statues* on the island. | На острове почти 1000 статуй.
