title: Character and personality
title_ru: Характер и личность
topic: feelings
words:
- brave | adj | breɪv |  | храбрый | not afraid of danger | The *brave* firefighter saved the child. | Храбрый пожарный спас ребёнка.
- confident | adj | ˈkɒnfɪdənt | ˈkɑːnfɪdənt | уверенный | sure that you can do something well | I feel *confident* about the interview. | Я уверен в себе перед собеседованием.
- determined | adj | dɪˈtɜːmɪnd | dɪˈtɜːrmənd | решительный, полный решимости | having decided firmly | She was *determined* to win. | Она твёрдо решила победить.
- educated | adj | ˈedʒuːkeɪtɪd | ˈedʒəkeɪtɪd | образованный | having had a good education | He's a highly *educated* man. | Он высокообразованный человек.
- experienced | adj | ɪkˈspiərɪənst | ɪkˈspɪriənst | опытный | having a lot of experience | We need an *experienced* driver. | Нам нужен опытный водитель.
- fair | n | feə | fer | ярмарка | an event with rides and games; a trade show | We went to the book *fair*. | Мы сходили на книжную ярмарку.
- generous | adj | ˈdʒenərəs |  | щедрый | happy to give money, time or help | It was very *generous* of you to pay for dinner. | Очень щедро с твоей стороны заплатить за ужин.
- gentle | adj | ˈdʒentl |  | мягкий, нежный | kind, calm and careful | Be *gentle* with the baby. | Будь осторожен с малышом.
- hard-working | adj | ˈhɑːdwɜːkɪŋ | ˌhɑːrdhˈwɜːrkɪŋ | трудолюбивый | working hard | She is a *hard-working* student. | Она трудолюбивая студентка.
- honest | adj | ˈɒnɪst | ˈɑːnəst | честный | telling the truth | Please be *honest* with me. | Пожалуйста, будь со мной честен.
- keen | adj | kiːn |  | увлечённый; горящий желанием | very interested or eager | She's a *keen* photographer. | Она увлечённый фотограф. | be keen on — увлекаться
- kind | adj | kaɪnd |  | добрый | friendly and caring | It was very *kind* of you to help. | Очень мило с вашей стороны, что помогли.
- middle-aged | adj | ˈmɪdəleɪɡd |  | средних лет | aged about 45 to 65 | A *middle-aged* woman opened the door. | Дверь открыла женщина средних лет.
- organized | adj | ˈɔːɡənaɪzd | ˈɔːrɡənaɪzd | организованный | well planned; able to plan well | She's very *organized*. | Она очень организованная. | брит. также organised
- qualified | adj | ˈkwɒlɪfaɪd | ˈkwɑːləfaɪd | квалифицированный, дипломированный | having passed the exams for a job | She's a *qualified* nurse. | Она дипломированная медсестра.
- reliable | adj | rɪˈlaɪəbl | riːˈlaɪəbl | надёжный | able to be trusted | My car is old but *reliable*. | Моя машина старая, но надёжная.
- responsible | adj | rɪˈspɒnsəbl | rɪˈspɑːnsəbl | ответственный | having the job of looking after something; sensible | Who is *responsible* for this mess? | Кто виноват в этом беспорядке? | be responsible for
- silly | adj | ˈsɪli |  | глупый, дурацкий | not serious or sensible | Don't be *silly* — of course I'll help you. | Не говори глупостей — конечно, я помогу.
- talented | adj | ˈtæləntɪd |  | талантливый | having a natural ability | He's a *talented* musician. | Он талантливый музыкант.
- wise | adj | waɪz |  | мудрый | having good judgement | That was a *wise* decision. | Это было мудрое решение.
