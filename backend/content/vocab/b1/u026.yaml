title: Everyday phrases
title_ru: Разговорные фразы
topic: phrases
words:
- as much as | phr |  |  | столько же, сколько; не меньше чем | the same amount as | Eat *as much as* you want. | Ешь сколько хочешь.
- as soon as possible | phr |  |  | как можно скорее | very quickly | Please reply *as soon as possible*. | Пожалуйста, ответьте как можно скорее. | сокр. ASAP
- at last | phr |  |  | наконец | finally, after a long time | *At last*, the rain stopped. | Наконец дождь прекратился.
- at risk | phr |  |  | под угрозой, в опасности | in danger | Many species are *at risk* of extinction. | Многие виды находятся под угрозой исчезновения.
- at times | phr |  |  | временами, иногда | sometimes | The work is hard *at times*. | Работа временами тяжёлая.
- attached to somebody/something | phr |  |  | привязанный к | fond of; connected to | She's very *attached to* her dog. | Она очень привязана к своей собаке.
- be about to do something | phr |  |  | собираться (вот-вот) сделать | to be going to do something very soon | The film *is about to* start. | Фильм вот-вот начнётся.
- be going on | phr |  |  | происходить | to be happening | What *is going on* here? | Что здесь происходит?
- be known as somebody/something | phr |  |  | быть известным как | to be called | New York *is known as* the Big Apple. | Нью-Йорк известен как «Большое яблоко».
- be supposed to do something | phr |  |  | должен был (по плану, правилам) | to be expected to do something | You *are supposed to* be at work. | Ты вообще-то должен быть на работе.
- benefit from something | phr |  |  | извлекать пользу из | to get an advantage from | Everyone will *benefit from* the new park. | Новый парк пойдёт на пользу всем.
- break up | phr |  |  | расстаться; заканчиваться (о занятиях) | to end a relationship | They *broke up* last month. | Они расстались в прошлом месяце.
- by the time (that)... | phr |  |  | к тому времени как | before or when something happens | *By the time* we arrived, the film had started. | К тому времени, как мы пришли, фильм уже начался.
- can't afford something | phr |  |  | не может себе позволить | to not have enough money for | I *can't afford* a new car. | Я не могу позволить себе новую машину.
- care for somebody | phr |  |  | ухаживать за; любить | to look after; to love | She *cares for* her sick mother. | Она ухаживает за больной матерью.
- caused by something | phr |  |  | вызванный (чем-либо) | made to happen by | The fire was *caused by* a cigarette. | Пожар был вызван сигаретой.
- check somebody/something out | phr |  |  | посмотреть, проверить (разг.) | to look at something interesting | *Check out* this new café! | Зацени это новое кафе!
- choose to do something | phr |  |  | решить (что-то сделать), предпочесть | to decide to do something | She *chose to* study medicine. | Она решила изучать медицину.
- clean up | phr |  |  | убирать(ся), наводить порядок | to make a place clean | Let's *clean up* the kitchen. | Давай уберём на кухне.
