title: Objects and materials
title_ru: Предметы и материалы
topic: objects
words:
- bandage | n | ˈbændɪdʒ |  | бинт, повязка | a long piece of cloth put around a wound | The nurse put a *bandage* on my arm. | Медсестра наложила мне повязку на руку.
- broom | n | bruːm |  | метла, веник | a brush with a long handle for sweeping the floor | She swept the kitchen floor with a *broom*. | Она подмела пол на кухне веником.
- dial | n | ˈdaɪəl |  | циферблат, шкала, диск | the round face of a clock or a control you turn | She turned the *dial* on the radio. | Она повернула ручку настройки на радио. | гл. dial — набирать (номер)
- flashlight | n | ˈflæʃlaɪt |  | фонарик | a small electric light you hold in your hand | Take a *flashlight* — it's dark outside. | Возьми фонарик — на улице темно. | брит. torch
- layer | n | ˈleɪə | ˈleɪər | слой | one level of something on top of another | The cake has three *layers*. | В торте три слоя.
- load | v | ləʊd | loʊd | грузить, загружать | to put things into a car, truck or machine | We *loaded* the car with suitcases. | Мы загрузили машину чемоданами.
- parachute | n | ˈpærəʃuːt |  | парашют | a large piece of cloth that lets you fall slowly from a plane | He jumped out of the plane with a *parachute*. | Он прыгнул с самолёта с парашютом. | ch читается как [ʃ]
- pile | n | paɪl |  | куча, стопка | a lot of things on top of each other | There's a *pile* of dirty clothes on the floor. | На полу куча грязной одежды.
- string | n | strɪŋ |  | верёвка, бечёвка; струна | thin rope | The package was tied with *string*. | Посылка была перевязана бечёвкой.
- stripe | n | straɪp |  | полоса, полоска | a long narrow line of colour | Zebras have black and white *stripes*. | У зебр чёрные и белые полоски. | striped — полосатый
- surface | n | ˈsɜːfɪs | ˈsɜːrfɪs | поверхность | the top or outside layer of something | Oil floated on the *surface* of the water. | По поверхности воды растеклась нефть.
- tin | n | tɪn |  | олово; консервная банка | a soft silver metal; a metal container | Open a *tin* of tomatoes. | Открой банку томатов. | амер. can
- treasure | n | ˈtreʒə | ˈtreʒər | сокровище, клад | gold, jewels or other valuable things | The children dreamed of finding pirate *treasure*. | Дети мечтали найти пиратский клад.
