title: Events and situations
title_ru: События и ситуации
topic: events
words:
- affair | n | əˈfeə | əˈfer | дело; событие | an event or situation; something that concerns someone | The wedding was a small family *affair*. | Свадьба была скромным семейным торжеством. | foreign affairs — иностранные дела
- attempt | n | əˈtempt |  | попытка | an act of trying to do something | She passed her driving test at the first *attempt*. | Она сдала на права с первой попытки.
- blow | n | bləʊ | bloʊ | удар | a hard hit; a shock | His death was a terrible *blow* to the family. | Его смерть стала страшным ударом для семьи.
- comparison | n | kəmˈpærɪsən | kəmˈperəsən | сравнение | comparing things | There's no *comparison* between the two. | Их даже нельзя сравнивать.
- damage | v | ˈdæmɪdʒ |  | повреждать | to harm or break something | The storm *damaged* many houses. | Шторм повредил много домов. | сущ. damage — ущерб (неисчисл.)
- deal | n | diːl |  | сделка; договорились | an agreement, especially in business | We made a *deal*. | Мы заключили сделку. | It's a deal! — Договорились!
- defense | n | dɪˈfens |  | оборона, защита | protection against attack | The country spends a lot on *defense*. | Страна тратит много на оборону. | брит. defence
- difficulty | n | ˈdɪfɪkʌlti | ˈdɪfəkəlti | трудность | a problem; being hard | I had *difficulty* finding the house. | Мне было трудно найти дом.
- duty | n | ˈdjuːti | ˈduːti | долг, обязанность | something you must do because it is right or part of your job | It's my *duty* to help my family. | Мой долг — помогать семье. | on duty — на дежурстве
- effort | n | ˈefət | ˈefərt | усилие | hard work that you do to achieve something | Learning a language takes a lot of *effort*. | Изучение языка требует больших усилий. | make an effort — постараться
- fault | n | fɔːlt |  | вина; недостаток | responsibility for a mistake | It's not your *fault* — don't worry. | Ты не виноват — не переживай.
- fighting | n | ˈfaɪtɪŋ |  | бои, сражения | physical conflict between groups, especially soldiers | Heavy *fighting* continued for three days. | Тяжёлые бои продолжались три дня.
- hop | v | hɒp | hɑːp | прыгать (на одной ноге), скакать | to jump on one foot or with both feet together | The rabbit *hopped* across the grass. | Кролик поскакал через лужайку.
- line-up | n | ˈlaɪnʌp |  | состав (участников) | the people taking part in an event | The festival has a great *line-up*. | У фестиваля отличный состав участников.
- means | n | miːnz |  | средство, способ | a way of doing something | The car is our only *means* of transport. | Машина — наше единственное средство передвижения. | мн. ч. = ед. ч.
- pass | n | pɑːs | pæs | пропуск; пас | a document that allows you to enter; a kick to a teammate | Show your *pass* at the gate. | Покажите пропуск на входе.
- planning | n | ˈplænɪŋ |  | планирование | making plans | The trip needs careful *planning*. | Поездка требует тщательного планирования.
- rush | v | rʌʃ |  | спешить, мчаться | to move or do something very quickly | Don't *rush* — we have plenty of time. | Не торопись — у нас полно времени. | rush hour — час пик
- shot | n | ʃɒt | ʃɑːt | выстрел; удар; снимок | firing a gun; a kick or hit at goal; a photo | He took a *shot* at goal. | Он ударил по воротам.
- spending | n | ˈspendɪŋ |  | расходы, траты | money spent | Government *spending* on schools has increased. | Государственные расходы на школы выросли.
- strike | v | straɪk |  | ударять; бастовать | to hit someone or something | The tree was *struck* by lightning. | В дерево ударила молния. | strike — struck — struck
