title: Feelings and character
title_ru: Чувства и характер
topic: feelings
words:
- admiration | n | ˌædməˈreɪʃən |  | восхищение | a feeling of respect and liking | I have great *admiration* for her. | Я ею очень восхищаюсь.
- aware | adj | əˈweə | əˈwer | осведомлённый, знающий | knowing about something | Are you *aware* of the problem? | Ты знаешь об этой проблеме? | be aware of
- boredom | n | ˈbɔːdəm | ˈbɔːrdəm | скука | the state of being bored | I was dying of *boredom*. | Я умирал от скуки.
- content | adj | kənˈtent |  | довольный | happy with what you have | My grandfather is *content* with a simple life. | Мой дедушка доволен простой жизнью. | сущ. content [ˈkɒntent] — содержание
- daze | n | deɪz |  | оцепенение, ошеломление | a state of not thinking clearly | After the accident, he was in a *daze*. | После аварии он был как в тумане.
- devotion | n | dɪˈvəʊʃən | dɪˈvoʊʃən | преданность | great love and loyalty | Her *devotion* to her family is amazing. | Её преданность семье поражает.
- ecstasy | n | ˈekstəsi |  | восторг, экстаз | a feeling of great happiness | The fans were in *ecstasy*. | Фанаты были в экстазе.
- engaged | adj | ɪnˈɡeɪdʒd | enˈɡeɪdʒd | помолвленный; занятый | having agreed to marry; busy | They got *engaged* last year. | Они обручились в прошлом году.
- enjoyment | n | ɪnˈdʒɔɪmənt | ˌenˈdʒɔɪmənt | удовольствие | the feeling of enjoying something | I read for *enjoyment*. | Я читаю для удовольствия.
- fright | n | fraɪt |  | испуг | a sudden feeling of fear | You gave me a *fright*! | Ты меня напугал!
- humour | n | ˈhjuːmə | ˈhjuːmər | юмор | the ability to find things funny | She has a great sense of *humour*. | У неё отличное чувство юмора. | амер. humor
- injured | adj | ˈɪndʒəd | ˈɪndʒərd | раненый, травмированный | hurt | Two people were *injured* in the accident. | В аварии пострадали два человека.
- prepared | adj | prɪˈpeəd | priːˈperd | готовый, подготовленный | ready | I'm not *prepared* for the exam. | Я не готов к экзамену.
- proud | adj | praʊd |  | гордый | pleased about something you or someone else did | My parents are very *proud* of me. | Родители очень гордятся мной. | be proud of
- sorrow | n | ˈsɒrəʊ | ˈsɑːroʊ | печаль, скорбь | a feeling of great sadness | She couldn't hide her *sorrow*. | Она не могла скрыть своей печали.
- stuck | adj | stʌk |  | застрявший | unable to move | The car got *stuck* in the mud. | Машина застряла в грязи.
- temper | n | ˈtempə | ˈtempər | нрав, характер; вспыльчивость | a tendency to become angry; a mood | He has a terrible *temper*. | У него ужасный нрав. | lose your temper — выйти из себя
- unable | adj | ʌˈneɪbl | əˈneɪbl | неспособный | not able | He was *unable* to come. | Он не смог прийти.
