title: 'Describing: size, shape and looks'
title_ru: 'Описание: размер, форма, внешний вид'
topic: describing
words:
- covered | adj | ˈkʌvəd | ˈkʌvərd | покрытый | having something on top | The car was *covered* in snow. | Машина была покрыта снегом.
- deep | adj | diːp |  | глубокий | going a long way down | The lake is very *deep*. | Озеро очень глубокое.
- dressed | adj | drest |  | одетый | wearing clothes | Get *dressed* — we're leaving! | Одевайся — мы уходим!
- edge | n | edʒ |  | край | the outer part of something | Don't stand so close to the *edge* of the cliff. | Не стой так близко к краю обрыва.
- empty | v | ˈempti |  | опустошать, освобождать | to remove everything from something | Can you *empty* the bin? | Можешь вынести мусор?
- 'flash | adj | flæʃ |  | шикарный, кричащий (разг.) | expensive-looking in an obvious way | He drives a *flash* car. | Он ездит на шикарной машине. | сущ.: flash — вспышка'
- golden | adj | ˈɡəʊldn | ˈɡoʊldn | золотой, золотистый | made of gold; having the colour of gold | She has *golden* hair. | У неё золотистые волосы.
- hand-held | adj | ˈhændheld |  | ручной, портативный | small enough to hold in your hand | He filmed it with a *hand-held* camera. | Он снял это ручной камерой.
- hanging | adj | ˈhæŋɪŋ | ˈhæŋɡɪŋ | висящий, подвесной | attached from above | There's a *hanging* lamp over the table. | Над столом висит лампа.
- level | adj | ˈlevl |  | ровный, горизонтальный | flat; at the same height | Make sure the shelf is *level*. | Проследи, чтобы полка была ровной.
- loose | adj | luːs |  | свободный, болтающийся, незакреплённый | not tight; not firmly fixed | One of my teeth is *loose*. | У меня шатается зуб. | не путайте с lose [luːz] — терять
- medium | adj | ˈmiːdiəm |  | средний | in the middle between small and large | I'd like a *medium* coffee. | Мне средний кофе.
- navy blue | adj | ˈneɪvi bluː |  | тёмно-синий | dark blue | He wore a *navy blue* jacket. | На нём был тёмно-синий пиджак.
- rough | adj | rʌf |  | грубый, шершавый; бурный | not smooth; difficult or violent | The sea was very *rough* that day. | В тот день море было очень бурным.
- sharp | adj | ʃɑːp | ʃɑːrp | острый | with a thin edge that can cut | Be careful — this knife is very *sharp*. | Осторожно — этот нож очень острый.
- slow | v | sləʊ | sloʊ | замедлять(ся) | to become or make slower | *Slow* down — you're driving too fast! | Сбавь скорость — ты едешь слишком быстро!
- solid | adj | ˈsɒlɪd | ˈsɑːləd | твёрдый; прочный; сплошной | hard; not liquid or gas; strong | Water becomes *solid* when it freezes. | Вода становится твёрдой при замерзании.
- tiny | adj | ˈtaɪni |  | крошечный | very small | The baby has *tiny* fingers. | У малыша крошечные пальчики.
- well-built | adj | ˌwel ˈbɪlt |  | крепкого телосложения; прочно построенный | strong and with a big body; strongly made | He's a tall, *well-built* man. | Он высокий, крепко сложенный мужчина.
- well-dressed | adj | ˌwel ˈdrest |  | хорошо одетый | wearing nice clothes | He was a *well-dressed* man in his forties. | Это был хорошо одетый мужчина лет сорока.
- whenever | conj | weˈnevə | hweˈnevər | всякий раз, когда; когда угодно | every time that; at any time | Call me *whenever* you want. | Звони мне когда захочешь.
