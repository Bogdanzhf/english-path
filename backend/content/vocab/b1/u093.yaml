title: Events and situations
title_ru: События и ситуации
topic: events
words:
- atmosphere | n | ˈætməsfɪə | ˈætməsfɪr | атмосфера | the air around the Earth; the mood of a place | The *atmosphere* on the plane was tense. | В самолёте царила напряжённая атмосфера.
- balance | n | ˈbæləns |  | равновесие, баланс | the ability to stand without falling; or a good mix of things | Yoga helps you improve your *balance*. | Йога помогает улучшить равновесие.
- convenience | n | kənˈviːniəns |  | удобство | the quality of being easy and useful | Customers love the *convenience* of the service. | Клиенты ценят удобство сервиса.
- despair | n | dɪˈspeə | dɪˈsper | отчаяние | the feeling of having no hope | In *despair*, he sat down and cried. | В отчаянии он сел и заплакал.
- fuss | n | fʌs |  | суета, шумиха | unnecessary excitement or worry | What's all the *fuss* about? | Из-за чего весь этот шум? | make a fuss — поднимать шум
- independence | n | ˌɪndɪˈpendəns |  | независимость | freedom from control by another country or person | The country won its *independence* in 1991. | Страна получила независимость в 1991 году.
- liberty | n | ˈlɪbəti | ˈlɪbərti | свобода | the freedom to live as you choose | They fought for *liberty* and equality. | Они боролись за свободу и равенство. | the Statue of Liberty — статуя Свободы
- shadow | n | ˈʃædəʊ | ˈʃædoʊ | тень (очертание) | a dark shape made when something blocks the light | In the evening, our *shadows* became very long. | Вечером наши тени стали очень длинными.
- silence | n | ˈsaɪləns |  | тишина, молчание | complete quiet | We stood in *silence* for two minutes. | Мы постояли две минуты в молчании. | a minute's silence — минута молчания
- trim | v | trɪm |  | подстригать, подрезать | to cut a little off something to make it neat | Could you just *trim* my hair, please? | Не могли бы вы меня немного подстричь?
