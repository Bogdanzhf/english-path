title: 'Describing: same, different, true'
title_ru: 'Описание: сходство, точность, вероятность'
topic: describing
words:
- abnormal | adj | æbˈnɔːml | æbˈnɔːrml | ненормальный, аномальный | different from what is usual, often in a worrying way | The test showed *abnormal* results. | Анализ показал отклонения от нормы.
- abundant | adj | əˈbʌndənt |  | обильный, изобилующий | existing in large amounts | Rain was *abundant* in those years. | В те годы дождей было в изобилии.
- accidental | adj | ˌæksɪˈdentl | ˌæksəˈdenl | случайный | happening by chance | The fire was *accidental*. | Пожар произошёл случайно.
- central | adj | ˈsentrəl |  | центральный | in the centre | The hotel is in *central* London. | Отель в центре Лондона.
- definite | adj | ˈdefɪnət |  | определённый, точный | certain; clear | Do you have a *definite* answer? | У тебя есть точный ответ? | definitely — определённо
- double | v | ˈdʌbl |  | удваивать(ся) | to become twice as big | Prices have *doubled*. | Цены выросли вдвое.
- entire | adj | ɪnˈtaɪə | ɪnˈtaɪər | весь, целый | whole; complete | I spent the *entire* day in bed. | Я провёл в постели весь день. | entirely — полностью
- imaginary | adj | ɪˈmædʒɪnəri | ˌɪˈmædʒəneri | воображаемый | not real | My son has an *imaginary* friend. | У моего сына есть воображаемый друг.
- indirect | adj | ˌɪndəˈrekt |  | косвенный, непрямой | not straight or obvious | He gave an *indirect* answer. | Он ответил уклончиво.
- irregular | adj | ɪˈreɡjuːlə | ˌɪˈreɡjələr | неправильный; нерегулярный | not following the usual rules; not regular | "Go" is an *irregular* verb. | «Go» — неправильный глагол.
- limited | adj | ˈlɪmɪtɪd | ˈlɪmətəd | ограниченный | small in number or amount | We have *limited* time. | Время ограничено.
- local | n | ˈləʊkl | ˈloʊkl | местный житель | a person who lives in an area | Ask the *locals* for the best restaurant. | Спросите у местных, где лучший ресторан.
- major | n | ˈmeɪdʒə | ˈmeɪdʒər | основная специальность (амер.); майор | the main subject at university; an army officer | Her *major* is history. | Её основная специальность — история.
- plus | prep | plʌs |  | плюс | and also | Two *plus* two is four. | Два плюс два — четыре.
- precise | adj | prɪˈsaɪs |  | точный | exact and accurate | Give me the *precise* time of the accident. | Назовите мне точное время аварии.
- principal | n | ˈprɪnsəpl |  | директор (школы) | the person in charge of a school | The *principal* spoke to all the students. | Директор выступил перед всеми учениками. | амер.; брит. head teacher
- slight | adj | slaɪt |  | небольшой, незначительный | small in degree | There's a *slight* problem. | Есть небольшая проблема. | slightly — слегка
- united | adj | juːˈnaɪtɪd |  | объединённый, единый | joined together | The team was *united*. | Команда была едина.
- unpredictable | adj | ʌnprɪˈdɪktəbl | ˌʌnprɪˈdɪktəbl | непредсказуемый | not possible to predict | The weather here is *unpredictable*. | Погода здесь непредсказуемая.
- unrelated | adj | ˌʌnrɪˈleɪtɪd | ˌʌnriːˈleɪtɪd | не связанный | not connected | The two events are *unrelated*. | Эти два события не связаны.
