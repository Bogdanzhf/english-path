title: Technology
title_ru: Технологии
topic: tech
words:
- audio | adj | ˈɔːdɪəʊ | ˈɑːdiːoʊ | звуковой, аудио | relating to sound | Listen to the *audio* recording. | Послушайте аудиозапись.
- battery | n | ˈbætri |  | батарейка, аккумулятор | an object that gives electric power to things like phones | My phone *battery* is almost dead. | У меня почти сел аккумулятор телефона.
- blogger | n | ˈblɒɡə | ˈblɔːɡər | блогер | a person who writes a blog | She's a popular food *blogger*. | Она популярный фуд-блогер.
- calculator | n | ˈkælkjʊleɪtə | ˈkælkjəleɪtər | калькулятор | a device for doing sums | You can use a *calculator* in the exam. | На экзамене можно пользоваться калькулятором.
- data | n | ˈdeɪtə | ˈdeɪtə, ˈdætə | данные | facts and numbers collected for study | The scientists analysed the *data*. | Учёные проанализировали данные.
- keyboard | n | ˈkiːbɔːd | ˈkiːbɔːrd | клавиатура | the set of keys you press to type | I spilled coffee on my *keyboard*. | Я пролил кофе на клавиатуру.
- laptop | n | ˈlæptɒp | ˈlæptɑːp | ноутбук | a small computer you can carry | I work on my *laptop*. | Я работаю на ноутбуке.
- loudspeaker | n | ˈlaʊdspiːkə | ˈlaʊdspiːkər | громкоговоритель, динамик | a device that makes sound louder | The announcement came over the *loudspeaker*. | Объявление прозвучало по громкоговорителю.
- message board | n | ˈmesɪdʒ bɔːd | ˈmesədʒ bɔːrd | доска объявлений, форум | a website where people post messages | I asked the question on a *message board*. | Я задал вопрос на форуме.
- modem | n | ˈməʊdem | ˈmoʊdəm | модем | a device that connects a computer to the internet | Restart the *modem*. | Перезагрузите модем.
- program | v | ˈprəʊɡræm | ˈproʊɡræm | программировать | to write instructions for a computer | She *programs* computer games. | Она программирует компьютерные игры.
- robot | n | ˈrəʊbɒt | ˈroʊbɑːt | робот | a machine that does tasks automatically | *Robots* repair the bikes in the warehouse. | На складе велосипеды чинят роботы.
- social networking | n | ˈsəʊʃl ˈnetwɜːkɪŋ | ˈsoʊʃl ˈnetwɜːrkɪŋ | социальные сети, общение в соцсетях | using websites to communicate with friends | *Social networking* takes up a lot of time. | Соцсети отнимают много времени.
- software | n | ˈsɒftweə | ˈsɔːfwer | программное обеспечение | computer programs | Install the latest *software*. | Установите последнюю версию программы.
- switch | v | swɪtʃ |  | переключаться, менять | to change from one thing to another | She *switched* from science to art. | Она переключилась с науки на искусство. | switch on/off — включить/выключить
- telecommunications | n | ˌtelɪkəˌmjuːnɪˈkeɪʃənz | ˌteləkəmˌjuːnəˈkeɪʃənz | телекоммуникации, связь | sending information by phone, radio, etc. | He works in *telecommunications*. | Он работает в сфере телекоммуникаций.
- upload | v | ˈʌpləʊd | ˈʌploʊd | загружать (в сеть) | to send files to the internet | I *uploaded* the photos to my blog. | Я загрузил фотографии в блог.
- user | n | ˈjuːzə | ˈjuːzər | пользователь | a person who uses something | The app has a million *users*. | У приложения миллион пользователей.
- webcam | n |  |  | веб-камера | a camera used on the internet | We talked on the *webcam*. | Мы общались по веб-камере.
