title: 'Describing: senses'
title_ru: 'Описание: ощущения — температура, звук, свет, вкус'
topic: describing
words:
- fashionable | adj | ˈfæʃnəbl |  | модный | popular at a particular time | Short jackets are very *fashionable* this year. | Короткие куртки в этом году очень модные.
- liquid | n | ˈlɪkwɪd |  | жидкость | a substance like water that flows | You can't take *liquids* on the plane. | В самолёт нельзя проносить жидкости.
- raw | adj | rɔː |  | сырой, необработанный | not cooked; in a natural state | Sushi is made with *raw* fish. | Суши готовят из сырой рыбы.
- ripe | adj | raɪp |  | спелый | ready to be eaten | These bananas aren't *ripe* yet. | Эти бананы ещё не спелые.
- silent | adj | ˈsaɪlənt |  | безмолвный, тихий | without any sound | The house was completely *silent*. | В доме стояла полная тишина. | silent letter — немая буква
- sour | adj | ˈsaʊə | ˈsaʊər | кислый | having a sharp taste like lemon | The milk has gone *sour*. | Молоко скисло.
- wavy | adj | ˈweɪvi |  | волнистый | having curves like waves | She has long, *wavy* hair. | У неё длинные волнистые волосы.
