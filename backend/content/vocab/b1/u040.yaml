title: 'Describing: senses'
title_ru: 'Описание: ощущения — температура, звук, свет, вкус'
topic: describing
words:
- burning | adj | ˈbɜːnɪŋ | ˈbɜːrnɪŋ | горящий; жгучий | on fire; very hot | We smelled *burning* wood. | Мы почувствовали запах горящего дерева.
- canned | adj | kænd |  | консервированный | preserved in a can | We bought *canned* tomatoes. | Мы купили консервированные помидоры. | брит. tinned
- cool | v | kuːl |  | охлаждать(ся), остывать | to become or make colder | Let the cake *cool* before cutting. | Дайте торту остыть, прежде чем резать.
- damp | adj | dæmp |  | влажный, сырой | slightly wet | The towels are still *damp*. | Полотенца ещё влажные.
- faraway | adj | ˌfɑːrəˈweɪ | ˈfɑːrəˈweɪ | далёкий | far away | She dreams of *faraway* countries. | Она мечтает о далёких странах.
- freezing | adj | ˈfriːzɪŋ |  | ледяной, очень холодный | very cold | It's *freezing* outside! | На улице жуткий холод!
- frozen | adj | ˈfrəʊzən | ˈfroʊzən | замороженный; замёрзший | made into ice; very cold | We bought *frozen* vegetables. | Мы купили замороженные овощи.
- humid | adj | ˈhjuːmɪd |  | влажный | (of air) warm and wet | The climate is hot and *humid*. | Климат жаркий и влажный. | humidity — влажность
- liquid | n | ˈlɪkwɪd |  | жидкость | a substance like water that flows | You can't take *liquids* on the plane. | В самолёт нельзя проносить жидкости.
- mild | adj | maɪld |  | мягкий, умеренный | not severe or strong | The winter was very *mild*. | Зима была очень мягкой.
- outward | adj | ˈaʊtwəd | ˈaʊtwərd | внешний | relating to how things seem | Despite her *outward* calm, she was nervous. | Несмотря на внешнее спокойствие, она нервничала.
- poisonous | adj | ˈpɔɪzənəs |  | ядовитый | containing poison | Some mushrooms are *poisonous*. | Некоторые грибы ядовиты.
- raw | adj | rɔː |  | сырой, необработанный | not cooked; in a natural state | Sushi is made with *raw* fish. | Суши готовят из сырой рыбы.
- ripe | adj | raɪp |  | спелый | ready to be eaten | These bananas aren't *ripe* yet. | Эти бананы ещё не спелые.
- rotten | adj | ˈrɒtn | ˈrɑːtn | гнилой, испорченный | bad because it is old | These apples are *rotten*. | Эти яблоки гнилые.
- silent | adj | ˈsaɪlənt |  | безмолвный, тихий | without any sound | The house was completely *silent*. | В доме стояла полная тишина. | silent letter — немая буква
- sour | adj | ˈsaʊə | ˈsaʊər | кислый | having a sharp taste like lemon | The milk has gone *sour*. | Молоко скисло.
- swollen | adj | ˈswəʊlən | ˈswoʊlən | опухший | bigger than usual because of injury | My ankle is *swollen*. | У меня опухла лодыжка.
- tasty | adj | ˈteɪsti |  | вкусный | having a good taste | The soup was very *tasty*. | Суп был очень вкусным.
- warm | v | wɔːm | wɔːrm | греть, согревать(ся) | to make or become warm | *Warm* your hands by the fire. | Погрей руки у огня. | warm up — разогреваться
- wavy | adj | ˈweɪvi |  | волнистый | having curves like waves | She has long, *wavy* hair. | У неё длинные волнистые волосы.
