reading:
  title: "The Lion Chamber"
  title_ru: "Зал львов"
  text: |
    For more than a century, archaeologists believed they knew everything about the small pyramid near the village of Kerma. It was the tomb of a queen who had founded a powerful kingdom three thousand years ago. But in 2021, a young Sudanese archaeologist named Amira Hassan noticed something that everyone else had overlooked.

    While studying old photographs, she saw a distinct line on the surface of one of the walls. It looked like a gap between two stones. "Ancient builders engineered everything perfectly," she said. "A gap like this is not a mistake. It must be a door."

    Her team spent two months removing sand from the area. Finally, they found a narrow corridor that led deep into the core of the pyramid. At the end, a set of stone stairs went down to a hidden chamber. When they entered, their torches lit up an incredible interior. The walls were covered with paintings of the queen's royal life: her elite soldiers, her boats on the Nile channels, and the hundreds of acres of farmland she controlled.

    But the most amazing discovery was in the centre of the room: two stone lions, almost two metres tall, guarding a golden box. The ancient people believed that the queen needed protection in the afterlife, and lions played the role of guards.

    The discovery made Amira famous, but she does not care about personal glory. "My sole aim is to understand how people lived," she says. "Every object tells a story. We just have to learn how to listen."
  ru: |
    Больше века археологи считали, что знают всё о небольшой пирамиде возле деревни Керма. Это была гробница царицы, которая основала могущественное царство три тысячи лет назад. Но в 2021 году молодой суданский археолог Амира Хасан заметила то, что все остальные упустили.

    Изучая старые фотографии, она увидела отчётливую линию на поверхности одной из стен. Она была похожа на щель между двумя камнями. «Древние строители всё делали безупречно, — сказала она. — Такая щель — не ошибка. Это должна быть дверь».

    Её команда два месяца расчищала песок на этом участке. Наконец они нашли узкий коридор, ведущий в самое сердце пирамиды. В его конце каменная лестница спускалась в потайной зал. Когда они вошли, факелы осветили невероятное убранство. Стены были покрыты росписями о царской жизни царицы: её отборные воины, её лодки на нильских каналах и сотни акров пахотной земли, которыми она владела.

    Но самая удивительная находка была в центре зала: два каменных льва почти двухметровой высоты, охранявшие золотой ларец. Древние люди верили, что царице нужна защита в загробной жизни, и львы играли роль стражей.

    Открытие прославило Амиру, но личная слава её не волнует. «Моя единственная цель — понять, как жили люди, — говорит она. — Каждый предмет рассказывает историю. Нам просто нужно научиться слушать».
  questions:
    - q: "What did Amira notice in the old photographs?"
      options: ["A painting of a lion", "A line that looked like a gap between stones", "A golden box", "A broken stair"]
      answer: 1
    - q: "Why did Amira think the gap was a door?"
      options: ["The villagers told her", "Ancient builders didn't make mistakes like that", "She found a key", "It was on an old map"]
      answer: 1
    - q: "What role did the stone lions play?"
      options: ["Decoration only", "Guards for the queen in the afterlife", "Symbols of the river", "Gifts from another king"]
      answer: 1
