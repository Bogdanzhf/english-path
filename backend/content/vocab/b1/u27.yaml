reading:
  title: "The Queen's Necklace"
  title_ru: "Ожерелье королевы"
  text: |
    In 1785, a strange affair shook the royal court of France. It is still known as "the Affair of the Diamond Necklace", and it shows how dangerous a rumor can be.

    Two jewellers in Paris had made a massive necklace of 647 precious diamonds. They hoped to sell it to the king, but it was too expensive, even for him. Meanwhile, a clever woman named Jeanne de la Motte had a plan. She told a rich noble, Cardinal de Rohan, that Queen Marie Antoinette secretly wanted the necklace but couldn't buy it openly. Jeanne said the queen wanted the cardinal to buy it for her.

    The cardinal was suspicious at first. So Jeanne arranged a secret meeting at night in the palace gardens. There, a young blonde woman dressed like the queen gave him a rose. In the darkness, he believed it was really Marie Antoinette. He bought the necklace, but it never reached the queen. Jeanne's husband took it to London, where the diamonds were sold one by one.

    When the jewellers asked the queen for payment, the whole story came out. The queen had known nothing. Jeanne was punished: she was dragged through the streets and sent to prison. But the damage was done. Many people already had a prejudice against the foreign-born queen. They believed the rumors and exaggerated them. Newspapers and cartoons insulted her. People said her love of luxury was a sin while the poor were starving.

    The queen was never able to fully conquer this bad reputation. Historians now acknowledge that the scandal helped to cause the French Revolution four years later. Today, you can visit Versailles, part of France's heritage, and see the queen's rooms, with their vases and silk walls. The palace is still a spectacle, but it holds many sad stories.
  ru: |
    В 1785 году королевский двор Франции потрясло странное дело. Оно до сих пор известно как «Дело о бриллиантовом ожерелье» и показывает, насколько опасным может быть слух.

    Два парижских ювелира изготовили огромное ожерелье из 647 драгоценных бриллиантов. Они надеялись продать его королю, но оно оказалось слишком дорогим даже для него. Тем временем у одной хитрой женщины по имени Жанна де Ламотт созрел план. Она сказала богатому вельможе, кардиналу де Рогану, что королева Мария-Антуанетта втайне мечтает об ожерелье, но не может купить его открыто. Жанна уверяла, что королева хочет, чтобы кардинал купил его для неё.

    Сначала кардинал отнёсся к этому с подозрением. Тогда Жанна устроила тайную встречу ночью в дворцовом саду. Там молодая блондинка, одетая как королева, подарила ему розу. В темноте он поверил, что это действительно Мария-Антуанетта. Он купил ожерелье, но до королевы оно так и не дошло. Муж Жанны увёз его в Лондон, где бриллианты продали по одному.

    Когда ювелиры потребовали у королевы оплату, вся история раскрылась. Королева ничего не знала. Жанну наказали: её протащили по улицам и отправили в тюрьму. Но вред уже был нанесён. Многие и так были предубеждены против королевы-иностранки. Люди верили слухам и преувеличивали их. Газеты и карикатуры оскорбляли её. Говорили, что её любовь к роскоши — грех, когда бедняки голодают.

    Королеве так и не удалось полностью избавиться от этой дурной славы. Сегодня историки признают, что скандал способствовал Французской революции, начавшейся через четыре года. Сегодня можно посетить Версаль, часть наследия Франции, и увидеть покои королевы с вазами и шёлковыми стенами. Дворец по-прежнему великолепное зрелище, но в нём хранится немало печальных историй.
  questions:
    - q: "Who did Jeanne trick?"
      options: ["The king", "Cardinal de Rohan", "The jewellers", "The queen"]
      answer: 1
    - q: "Who did the cardinal meet in the garden?"
      options: ["The real queen", "A young woman dressed like the queen", "Jeanne's husband", "The king"]
      answer: 1
    - q: "What happened to the diamonds?"
      options: ["They were returned", "They were sold one by one in London", "The queen wore them", "They were lost at sea"]
      answer: 1
    - tf: "The queen knew about the plan."
      answer: false
    - tf: "Historians believe the scandal helped cause the French Revolution."
      answer: true
