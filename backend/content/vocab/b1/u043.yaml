title: Animals
title_ru: Животные
topic: animals
words:
- ant | n | ænt |  | муравей | a small insect that lives in large groups | There are *ants* in the kitchen. | На кухне муравьи.
- ape | n | eɪp |  | человекообразная обезьяна | a large animal like a gorilla | Gorillas are *apes*. | Гориллы — человекообразные обезьяны.
- bug | n | bʌɡ |  | жук, насекомое; ошибка (в программе) | a small insect; a mistake in a computer program | There's a *bug* in the software. | В программе есть ошибка.
- bull | n | bʊl |  | бык | a male cow | The *bull* ran across the field. | Бык побежал через поле.
- calf | n | kɑːf | kæf | телёнок; икра (ноги) | a young cow; the back of the leg | The cow had a *calf*. | У коровы родился телёнок. | мн. ч. calves
- camel | n | ˈkæml |  | верблюд | a desert animal with a hump | We rode *camels* in the desert. | Мы катались на верблюдах в пустыне.
- creature | n | ˈkriːtʃə | ˈkriːtʃər | существо | any living animal or being | The ocean is full of strange *creatures*. | Океан полон странных существ.
- crow | n | krəʊ | kroʊ | ворона | a large black bird | A *crow* sat on the fence. | На заборе сидела ворона.
- dolphin | n | ˈdɒlfɪn | ˈdɑːlfɪn | дельфин | an intelligent sea mammal with a long nose | A *dolphin* was found tangled in a fishing net. | Нашли дельфина, запутавшегося в рыболовной сети.
- gorilla | n | ɡəˈrɪlə |  | горилла | the largest kind of ape | *Gorillas* live in Africa. | Гориллы живут в Африке.
- kitten | n | ˈkɪtn |  | котёнок | a young cat | Our cat had four *kittens*. | Наша кошка родила четырёх котят.
- lamb | n | læm |  | ягнёнок; баранина | a young sheep; its meat | We had roast *lamb* for dinner. | На ужин у нас была жареная баранина.
- mosquito | n | məˈskiːtəʊ | məˈskiːtoʊ | комар | a small flying insect that bites | I was bitten by *mosquitoes*. | Меня искусали комары.
- parrot | n | ˈpærət | ˈperət | попугай | a colourful bird that can copy words | Our *parrot* can say "hello". | Наш попугай умеет говорить «привет».
- pup | n | pʌp |  | щенок, детёныш | a young dog or other young animal | The dog had five *pups*. | У собаки родились пятеро щенков. | = puppy
- puppy | n | ˈpʌpi |  | щенок | a young dog | They got a *puppy* for Christmas. | На Рождество им подарили щенка.
- salmon | n | ˈsæmən |  | лосось | a large fish with pink flesh | We had grilled *salmon*. | У нас был лосось на гриле.
