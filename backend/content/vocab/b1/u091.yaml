title: 'Describing: same, different, true'
title_ru: 'Описание: сходство, точность, вероятность'
topic: describing
words:
- known | adj | nəʊn | noʊn | известный | that people know about | There's no *known* cure for the disease. | Известного лекарства от этой болезни нет. | well-known — широко известный
- overnight | adv | ˌəʊvəˈnaɪt | ˌoʊvərˈnaɪt | за ночь, на ночь | during the night; very suddenly | It snowed heavily *overnight*. | За ночь выпало много снега. | stay overnight — остаться на ночь
- particular | adj | pəˈtɪkjələ | pərˈtɪkjələr | особый, конкретный; разборчивый | special or specific; difficult to please | This *particular* study involved 2,000 people. | В этом конкретном исследовании участвовали 2000 человек.
- potential | adj | pəˈtenʃl |  | потенциальный, возможный | possible in the future | This is a *potential* problem. | Это потенциальная проблема. | сущ. potential — потенциал
- secondhand | adj | ˌsekəndˈhænd |  | подержанный; полученный из вторых рук | not new; heard from other people, not directly | I bought a *secondhand* car. | Я купил подержанную машину. | брит. second-hand
- standard | n | ˈstændəd | ˈstændərd | стандарт, уровень | a level of quality | The food here is of a very high *standard*. | Еда здесь очень высокого уровня.
- various | adj | ˈveəriəs | ˈveriəs | различный, разнообразный | many different | The shop sells *various* kinds of tea. | Магазин продаёт разные сорта чая.
