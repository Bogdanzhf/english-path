title: Language for essays
title_ru: Язык аргументации
topic: essay
words:
- benefit | v | ˈbenɪfɪt | ˈbenəfɪt | приносить пользу; извлекать пользу | to help; to get an advantage | The new law will *benefit* families. | Новый закон пойдёт на пользу семьям.
- disadvantage | n | ˌdɪsədˈvɑːntɪdʒ | ˌdɪsədˈvæntɪdʒ | недостаток, невыгодное положение | something that makes things more difficult | One *disadvantage* of the job is the long hours. | Один из минусов этой работы — долгий рабочий день.
- for instance | phr |  |  | например | for example | Some animals, *for instance* bears, sleep all winter. | Некоторые животные, например медведи, спят всю зиму.
- in addition | phr |  |  | кроме того, вдобавок | also | *In addition*, we offer free parking. | Кроме того, у нас бесплатная парковка.
- on the other hand | phr |  |  | с другой стороны | used to give the opposite point | It's cheap. *On the other hand*, it's not very good. | Это дёшево. С другой стороны, не очень качественно.
- outweigh | v | ˌaʊtˈweɪ |  | перевешивать | to be more important than | The risks *outweighed* the benefits. | Риски перевешивали выгоду.
- point of view | n | pɔɪnt ɒv vjuː | pɔɪnt ʌv vjuː | точка зрения | an opinion | I understand your *point of view*. | Я понимаю твою точку зрения.
- significant | adj | sɪɡˈnɪfɪkənt |  | значительный, важный | important or large enough to notice | There has been a *significant* increase in prices. | Цены значительно выросли.
- therefore | adv | ˈðeəfɔː | ˈðerfɔːr | поэтому, следовательно | for that reason | It was raining, and *therefore* the game was cancelled. | Шёл дождь, поэтому игру отменили.
