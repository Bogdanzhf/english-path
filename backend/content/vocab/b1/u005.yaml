title: Food and drink
title_ru: Еда и напитки
topic: food
words:
- bacon | n | ˈbeɪkən |  | бекон | salted meat from a pig | We had *bacon* and eggs for breakfast. | На завтрак у нас был бекон с яйцами.
- broccoli | n | ˈbrɒkəli | ˈbrɑːkəli | брокколи | a green vegetable with small flower heads | Children often don't like *broccoli*. | Дети часто не любят брокколи.
- cabbage | n | ˈkæbɪdʒ | ˈkæbədʒ | капуста | a large round vegetable with thick leaves | *Cabbage* soup is popular in Russia. | Щи популярны в России.
- cod | n | kɒd | kɑːd | треска | a large sea fish eaten as food | Fish and chips is usually made with *cod*. | Рыбу с картошкой обычно готовят из трески.
- feast | n | fiːst |  | пир, праздничное угощение | a large special meal | They prepared a *feast* for the wedding. | К свадьбе они приготовили пир.
- filling | n | ˈfɪlɪŋ |  | начинка; пломба | food inside a pie or sandwich; material put in a tooth | The pie has an apple *filling*. | У пирога яблочная начинка.
- flour | n | ˈflaʊə | ˈflaʊər | мука | powder made from grain, used for baking | You need *flour*, eggs and milk for pancakes. | Для блинов нужны мука, яйца и молоко. | звучит как flower
- ginger | n | ˈdʒɪndʒə | ˈdʒɪndʒər | имбирь | a root with a hot spicy taste | I like tea with lemon and *ginger*. | Я люблю чай с лимоном и имбирём. | прил. ginger — рыжий
- grain | n | ɡreɪn |  | зерно, крупинка | seeds of plants like wheat and rice; a very small piece | Bread is made from *grain*. | Хлеб делают из зерна. | a grain of sand — песчинка
- nut | n | nʌt |  | орех; гайка | a dry fruit with a hard shell | Squirrels collect *nuts* for the winter. | Белки запасают орехи на зиму.
- peanut | n | ˈpiːnʌt |  | арахис | a nut that grows under the ground | She's allergic to *peanuts*. | У неё аллергия на арахис. | peanut butter — арахисовая паста
- pie | n | paɪ |  | пирог | a dish of fruit or meat baked in pastry | Grandma baked an apple *pie*. | Бабушка испекла яблочный пирог.
- pineapple | n | ˈpaɪnæpl |  | ананас | a large tropical fruit with yellow flesh | I'd like some fresh *pineapple*. | Мне свежего ананаса.
- pork | n | pɔːk | pɔːrk | свинина | meat from a pig | We had roast *pork* for dinner. | На ужин у нас была жареная свинина.
- slice | n | slaɪs |  | ломтик, кусок | a thin flat piece cut from something | Would you like a *slice* of cake? | Хочешь кусочек торта?
- strawberry | n | ˈstrɔːbəri | ˈstrɔːberi | клубника | a small red fruit with seeds on the outside | I love *strawberries* with cream. | Обожаю клубнику со сливками.
- tuna | n | ˈtjuːnə |  | тунец | a large sea fish | I made a *tuna* salad. | Я сделал салат с тунцом.
