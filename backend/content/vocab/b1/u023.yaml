title: Idioms
title_ru: Идиомы
topic: idioms
words:
- break a leg | phr |  |  | ни пуха ни пера! (пожелание удачи) | good luck (before a performance) | *Break a leg* tonight! | Ни пуха ни пера сегодня вечером!
- by heart | phr |  |  | наизусть | from memory | I know the poem *by heart*. | Я знаю это стихотворение наизусть.
- call it a day | phr |  |  | закончить (на сегодня) | to stop working for the day | It's late — let's *call it a day*. | Поздно — давайте на сегодня закончим.
- change your mind | phr |  |  | передумать | to decide something different | I've *changed my mind* — I'll stay. | Я передумал — останусь.
- get on someone's nerves | phr |  |  | действовать на нервы | to annoy someone | That noise is *getting on my nerves*. | Этот шум действует мне на нервы.
- in the long run | phr |  |  | в долгосрочной перспективе | after a long time | Exercise will help you *in the long run*. | В долгосрочной перспективе спорт тебе поможет.
- it's up to you | phr |  |  | решать тебе | it's your decision | We can go out or stay in — *it's up to you*. | Можем пойти куда-нибудь или остаться — решать тебе.
- keep an eye on | phr |  |  | присматривать за | to watch carefully | Can you *keep an eye on* my bag? | Можешь присмотреть за моей сумкой?
- make up your mind | phr |  |  | решиться, принять решение | to decide | You need to *make up your mind* soon. | Тебе нужно скоро решиться.
- on the same page | phr |  |  | на одной волне, одинаково понимать | agreeing about something | Let's make sure we're *on the same page*. | Давайте убедимся, что мы понимаем друг друга.
- once in a while | phr |  |  | время от времени | sometimes, not often | We eat out *once in a while*. | Время от времени мы ужинаем в ресторане.
- out of order | phr |  |  | не работает, неисправен | not working | The lift is *out of order*. | Лифт не работает.
- piece of cake | phr |  |  | проще простого | something very easy | The test was a *piece of cake*. | Тест был проще простого.
- take it easy | phr |  |  | не напрягайся, отдохни | to relax | *Take it easy* — you've worked hard. | Отдохни — ты много работал.
- take part in | phr |  |  | принимать участие в | to be involved in | Twenty people *took part in* the race. | В забеге приняли участие двадцать человек.
- under the weather | phr |  |  | неважно себя чувствовать | slightly ill | I'm feeling a bit *under the weather*. | Мне что-то нездоровится.
