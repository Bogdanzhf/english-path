title: Character and personality
title_ru: Характер и личность
topic: feelings
words:
- ambitious | adj | æmˈbɪʃəs |  | амбициозный, честолюбивый | wanting very much to be successful | She's an *ambitious* young lawyer. | Она амбициозный молодой юрист.
- careless | adj | ˈkeələs | ˈkerləs | небрежный, невнимательный | not paying attention | It was a *careless* mistake. | Это была ошибка по невнимательности.
- cheerful | adj | ˈtʃɪəfl | ˈtʃɪrfl | весёлый, жизнерадостный | happy and positive | She's always *cheerful*, even on Mondays. | Она всегда жизнерадостна, даже по понедельникам.
- courageous | adj | kʌˈreɪdʒəs | kəˈreɪdʒəs | смелый, мужественный | brave | It was a *courageous* decision. | Это было смелое решение.
- cruel | adj | ˈkruːəl |  | жестокий | causing pain on purpose | Don't be *cruel* to animals. | Не будь жесток с животными.
- dishonest | adj | dɪˈsɒnɪst | dɪˈsɑːnəst | нечестный | not honest | It would be *dishonest* to keep the money. | Оставить деньги себе было бы нечестно.
- faithful | adj | ˈfeɪθfl |  | верный | loyal | He's a *faithful* friend. | Он верный друг.
- foolish | adj | ˈfuːlɪʃ |  | глупый | not sensible | It was *foolish* to drive so fast. | Глупо было ехать так быстро.
- gifted | adj | ˈɡɪftɪd | ˈɡɪftəd | одарённый | very talented | She is a *gifted* pianist. | Она одарённая пианистка.
- graceful | adj | ˈɡreɪsfl |  | изящный, грациозный | moving in a smooth, beautiful way | The dancer was very *graceful*. | Танцовщица была очень грациозной.
- impatient | adj | ɪmˈpeɪʃnt |  | нетерпеливый | not willing to wait | Don't be so *impatient*! | Не будь таким нетерпеливым!
- informal | adj | ɪnˈfɔːml | ɪnˈfɔːrml | неофициальный, непринуждённый | relaxed and friendly; not official | The meeting was very *informal*. | Встреча была совсем неформальной.
- 'kindly | adv | ˈkaɪndli |  | любезно, по-доброму | in a kind way | She *kindly* offered to help. | Она любезно предложила помочь. | kindly + повелит.: Kindly wait. — Будьте добры, подождите.'
- lively | adj | ˈlaɪvli |  | оживлённый, живой | full of energy and interest | We had a *lively* discussion. | У нас было оживлённое обсуждение.
- messy | adj | ˈmesi |  | неряшливый, грязный | untidy | His room is always *messy*. | В его комнате всегда беспорядок.
- orderly | adj | ˈɔːdəli | ˈɔːrdərli | аккуратный, упорядоченный | well arranged | The books stood in *orderly* rows. | Книги стояли ровными рядами.
- selfish | adj | ˈselfɪʃ |  | эгоистичный | caring only about yourself | Don't be so *selfish*! | Не будь таким эгоистом!
- stubborn | adj | ˈstʌbən | ˈstʌbərn | упрямый | not willing to change your opinion | He's too *stubborn* to say sorry. | Он слишком упрям, чтобы извиниться.
- trustworthy | adj | ˈtrʌstwɜːði | ˈtrʌstwɜːrði | надёжный, заслуживающий доверия | able to be trusted | He's an honest and *trustworthy* man. | Он честный и надёжный человек.
- vain | adj | veɪn |  | тщетный; тщеславный | without success; too proud of your appearance | All attempts to break the code were in *vain*. | Все попытки взломать шифр были тщетны. | in vain — напрасно
