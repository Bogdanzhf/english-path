title: Communication and language
title_ru: Общение и язык
topic: communication
words:
- admit | v | ədˈmɪt |  | признавать | to agree that something is true | He *admitted* his mistake. | Он признал свою ошибку.
- blame | v | bleɪm |  | обвинять, винить | to say someone is responsible for something bad | Don't *blame* me — it wasn't my fault! | Не вини меня — я не виноват! | blame somebody for something
- claim | v | kleɪm |  | утверждать; заявлять права | to say that something is true, without proof | He *claims* that he saw a ghost. | Он утверждает, что видел привидение.
- comment | v | ˈkɒment | ˈkɑːment | комментировать | to give an opinion | He refused to *comment* on the news. | Он отказался комментировать новость.
- consonant | n | ˈkɒnsənənt | ˈkɑːnsənənt | согласный звук (буква) | a sound like b, c, d | "B" is a *consonant*. | «B» — согласная.
- 'contact | v | ˈkɒntækt | ˈkɑːntækt | связываться | to call, write to or speak to someone | Please *contact* us if you have any questions. | Свяжитесь с нами, если у вас есть вопросы. | без предлога: contact him'
- deliver | v | dɪˈlɪvə | dɪˈlɪvər | доставлять | to take something to a person or place | They *deliver* pizza until midnight. | Они доставляют пиццу до полуночи.
- determine | v | dɪˈtɜːmɪn | dəˈtɜːrmən | определять, устанавливать | to find out; to decide | Doctors are trying to *determine* the cause. | Врачи пытаются установить причину.
- ignore | v | ɪɡˈnɔː | ɪɡˈnɔːr | игнорировать | to pay no attention to someone or something | She *ignored* my message. | Она проигнорировала моё сообщение.
- infinitive | n | ɪnˈfɪnɪtɪv | ˌɪnˈfɪnɪtɪv | инфинитив | the basic form of a verb, like "to go" | "To swim" is an *infinitive*. | «To swim» — инфинитив.
- kid | v | kɪd |  | шутить, разыгрывать (разг.) | to joke | Are you *kidding*? | Ты шутишь?
- modal verb | n | ˈməʊdl vɜːb | ˈmoʊdl vɜːrb | модальный глагол | a verb like "can", "must" or "should" | "Can" is a *modal verb*. | «Can» — модальный глагол.
- preposition | n |  |  | предлог | a word like "in", "on" or "at" | "Under" is a *preposition*. | «Under» — предлог.
- question | v | ˈkwestʃən |  | допрашивать; сомневаться | to ask someone questions; to doubt | The police *questioned* the man. | Полиция допросила мужчину.
- quote | v | kwəʊt | kwoʊt | называть цену; цитировать | to give a price for a job; to repeat someone's words | The builder *quoted* us £2,000 for the work. | Строитель назвал нам цену за работу — 2000 фунтов.
- request | v | rɪˈkwest | riːˈkwest | просить, запрашивать | to ask for formally | Guests are *requested* to leave their keys. | Гостей просят оставить ключи.
- turn to | v | tɜːn tuː | tɜːrn tuː | обращаться к | to go to someone for help | She *turned to* her friends for help. | Она обратилась за помощью к друзьям.
- type | v | taɪp |  | печатать (на клавиатуре) | to write with a keyboard | She *types* very fast. | Она очень быстро печатает.
- 'wave | v | weɪv |  | махать | to move your hand to say hello or goodbye | She *waved* goodbye. | Она помахала на прощание. | сущ.: wave — волна'
