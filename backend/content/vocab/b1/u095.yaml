title: Language for essays
title_ru: Язык аргументации
topic: essay
words:
- disadvantage | n | ˌdɪsədˈvɑːntɪdʒ | ˌdɪsədˈvæntɪdʒ | недостаток, невыгодное положение | something that makes things more difficult | One *disadvantage* of the job is the long hours. | Один из минусов этой работы — долгий рабочий день.
- outweigh | v | ˌaʊtˈweɪ |  | перевешивать | to be more important than | The risks *outweighed* the benefits. | Риски перевешивали выгоду.
- significant | adj | sɪɡˈnɪfɪkənt |  | значительный, важный | important or large enough to notice | There has been a *significant* increase in prices. | Цены значительно выросли.
- therefore | adv | ˈðeəfɔː | ˈðerfɔːr | поэтому, следовательно | for that reason | It was raining, and *therefore* the game was cancelled. | Шёл дождь, поэтому игру отменили.
