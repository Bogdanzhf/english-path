title: Thinking and opinions
title_ru: Мысли и мнения
topic: mind
words:
- connection | n | kəˈnekʃən |  | связь; соединение; пересадка | a link; a train or plane you change to | The internet *connection* is slow. | Интернет-соединение медленное.
- contrast | n | ˈkɒntrɑːst | ˈkɑːntræst | контраст, противоположность | a clear difference between two things | There is a big *contrast* between the city and the countryside. | Между городом и деревней большой контраст.
- function | n | ˈfʌŋkʃn |  | функция, назначение | the job that something does | The main *function* of the heart is to pump blood. | Главная функция сердца — перекачивать кровь.
- imagination | n | ɪˌmædʒɪˈneɪʃən | ˌɪˌmædʒəˈneɪʃən | воображение | the ability to create pictures in your mind | Children have a great *imagination*. | У детей богатое воображение.
- impression | n | ɪmˈpreʃn |  | впечатление | an opinion about someone or something | He made a good *impression* at the interview. | Он произвёл хорошее впечатление на собеседовании.
- inspiration | n | ˌɪnspəˈreɪʃən |  | вдохновение | something that gives you ideas | Nature is my *inspiration*. | Природа — моё вдохновение.
- intention | n | ɪnˈtenʃn |  | намерение | a plan; what you want to do | I have no *intention* of leaving. | У меня нет никакого намерения уходить.
- mystery | n | ˈmɪstri |  | тайна, загадка | something that nobody can explain | How the cat got onto the roof is a *mystery*. | Как кошка забралась на крышу — загадка.
- prediction | n | prɪˈdɪkʃən | priːˈdɪkʃən | прогноз, предсказание | a statement about the future | My *prediction* came true. | Моё предсказание сбылось.
- rating | n | ˈreɪtɪŋ |  | рейтинг, оценка | a score showing how good something is | The hotel has a five-star *rating*. | У отеля рейтинг пять звёзд.
- remembrance | n | rɪˈmembrəns | riːˈmembrəns | память, воспоминание | remembering people who died | They planted a tree in *remembrance* of him. | В память о нём посадили дерево.
- scale | n | skeɪl |  | масштаб; весы | the size of something; a machine for weighing | We didn't understand the *scale* of the problem. | Мы не понимали масштаба проблемы.
- southeast | n | ˈsaʊθiːst | ˌsaʊˈθiːst | юго-восток | the direction between south and east | The wind is blowing from the *southeast*. | Ветер дует с юго-востока.
- southwest | n | saʊˈθwest | ˌsaʊθˈwest | юго-запад | the direction between south and west | The town is in the *southwest* of England. | Город находится на юго-западе Англии.
- superstition | n | ˌsuːpəˈstɪʃn | ˌsuːpərˈstɪʃn | суеверие | a belief in luck or magic that is not based on reason | It's a *superstition* that black cats bring bad luck. | Что чёрные кошки приносят несчастье — это суеверие. | superstitious — суеверный
- urge | v | ɜːdʒ | ɜːrdʒ | убеждать, настоятельно советовать | to try hard to make someone do something | The doctor *urged* him to stop smoking. | Врач настоятельно советовал ему бросить курить.
- view | v | vjuː |  | смотреть, рассматривать | to look at; to think about in a certain way | You can *view* the house tomorrow. | Дом можно посмотреть завтра.
- warmth | n | wɔːmθ | wɔːrmθ | тепло, теплота | being warm | I felt the *warmth* of the sun. | Я почувствовал тепло солнца.
