title: Feelings and character
title_ru: Чувства и характер
topic: feelings
words:
- calm | adj | kɑːm |  | спокойный | not angry, nervous or excited | Stay *calm* and listen to me. | Сохраняй спокойствие и слушай меня. | l не произносится
- disappointed | adj | ˌdɪsəˈpɔɪntɪd | ˌdɪsəˈpɔɪnɪd | разочарованный | sad because something was not as good as you hoped | I was *disappointed* with the film. | Фильм меня разочаровал.
- earnest | adj | ˈɜːnɪst | ˈɜːrnɪst | серьёзный, искренний | serious and sincere | He made an *earnest* effort to learn Spanish. | Он всерьёз взялся за изучение испанского. | in earnest — всерьёз
- frightening | adj | ˈfraɪtənɪŋ |  | пугающий | making you afraid | It was a *frightening* experience. | Это был пугающий опыт.
- grateful | adj | ˈɡreɪtfl |  | благодарный | feeling thankful | I'm very *grateful* for your help. | Я очень благодарен за твою помощь.
- hopeless | adj | ˈhəʊpləs | ˈhoʊpləs | безнадёжный | without hope; very bad at something | I'm *hopeless* at maths. | Я безнадёжен в математике.
- jealous | adj | ˈdʒeləs |  | ревнивый; завистливый | unhappy because someone has what you want | He's *jealous* of his brother's success. | Он завидует успеху брата.
- mad | adj | mæd |  | сумасшедший; злой (амер.) | crazy; angry | My mum will be *mad* if I'm late again. | Мама разозлится, если я снова опоздаю. | be mad about — обожать
- overjoyed | adj | ˌəʊvəˈdʒɔɪd | ˌoʊvərˈdʒɔɪd | вне себя от радости | extremely happy | The archaeologists were *overjoyed* by the discovery. | Археологи были вне себя от радости из-за находки.
- painful | adj | ˈpeɪnfl |  | болезненный | causing pain | My knee is still *painful*. | Колено всё ещё болит.
- penniless | adj | ˈpenɪləs | ˈpeniːləs | без гроша | having no money | He arrived in London *penniless*. | Он приехал в Лондон без гроша.
- pleasant | adj | ˈpleznt |  | приятный | nice and enjoyable | We had a *pleasant* evening by the fire. | Мы приятно провели вечер у камина.
- stricken | adj | ˈstrɪkən |  | поражённый, охваченный | badly affected by trouble or illness | The *stricken* planet slowly recovered. | Поражённая катастрофой планета медленно восстанавливалась.
- terrified | adj | ˈterɪfaɪd |  | перепуганный | very frightened | I'm *terrified* of spiders. | Я до ужаса боюсь пауков.
- thankful | adj | ˈθæŋkfl |  | благодарный | glad and grateful | I'm *thankful* that nobody was hurt. | Я благодарен, что никто не пострадал.
- trust | v | trʌst |  | доверять | to believe that someone is honest and good | I *trust* my best friend completely. | Я полностью доверяю лучшему другу.
- uncomfortable | adj | ʌnˈkʌmftəbl | ənˈkʌmfərtəbl | неудобный; неловкий | not comfortable | This chair is *uncomfortable*. | Этот стул неудобный.
- unfit | adj | ʌnˈfɪt | ənˈfɪt | не в форме; непригодный | not healthy or strong; not suitable | I'm really *unfit* — I need to exercise. | Я совсем не в форме — надо заниматься.
- unpleasant | adj | ʌnˈplezənt | ənˈplezənt | неприятный | not pleasant | The medicine has an *unpleasant* taste. | У лекарства неприятный вкус.
