title: Feelings and character
title_ru: Чувства и характер
topic: feelings
words:
- appreciate | v | əˈpriːʃieɪt |  | ценить; быть признательным | to understand how good something is; to be thankful | I really *appreciate* your help. | Я очень ценю твою помощь.
- cheer | v | tʃɪə | tʃɪr | приветствовать криками, болеть (за команду) | to shout to show that you are happy or to support someone | The crowd *cheered* when the band came on stage. | Толпа радостно закричала, когда группа вышла на сцену. | Cheers! — Будем здоровы! / Спасибо (брит.)
- disturb | v | dɪˈstɜːb | dɪˈstɜːrb | беспокоить, мешать | to interrupt or annoy someone | Please don't *disturb* me — I'm working. | Пожалуйста, не мешай — я работаю.
- earnest | adj | ˈɜːnɪst | ˈɜːrnɪst | серьёзный, искренний | serious and sincere | He made an *earnest* effort to learn Spanish. | Он всерьёз взялся за изучение испанского. | in earnest — всерьёз
- embarrass | v | ɪmˈbærəs |  | смущать, ставить в неловкое положение | to make someone feel shy or ashamed | Please don't *embarrass* me in front of my friends. | Пожалуйста, не позорь меня перед друзьями. | embarrassed — смущённый
- excite | v | ɪkˈsaɪt |  | волновать, возбуждать интерес | to make someone feel happy and full of energy | The news *excited* everyone in the village. | Новость взволновала всю деревню. | excited — взволнованный, exciting — захватывающий
- hearty | adj | ˈhɑːti | ˈhɑːrti | сытный; сердечный | (of food) large and satisfying; warm and friendly | We ate a *hearty* soup. | Мы поели сытного супа.
- impress | v | ɪmˈpres |  | впечатлять | to make someone admire you | His English really *impressed* me. | Его английский меня очень впечатлил. | impressive — впечатляющий
- irritate | v | ˈɪrɪteɪt |  | раздражать | to make someone a little angry | His loud music really *irritates* me. | Его громкая музыка меня очень раздражает.
- mourn | v | mɔːn | mɔːrn | скорбеть, оплакивать | to feel very sad because someone has died | The whole country *mourned* her death. | Вся страна оплакивала её смерть.
- regret | v | rɪˈɡret |  | сожалеть | to feel sorry about something you did or didn't do | I *regret* not studying harder at school. | Жалею, что не учился усерднее в школе. | regret + -ing
- soothe | v | suːð |  | успокаивать, облегчать | to make someone calm; to make pain less | Her calm voice *soothed* the frightened child. | Её спокойный голос успокоил испуганного ребёнка.
