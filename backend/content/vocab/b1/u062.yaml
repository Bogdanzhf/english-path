title: 'Describing: good or bad'
title_ru: 'Описание: оценка — хорошо или плохо'
topic: describing
words:
- acceptable | adj | əkˈseptəbl | ækˈseptəbl | приемлемый | good enough | Your work is *acceptable*, but it could be better. | Работа приемлемая, но могла быть лучше.
- adorable | adj | əˈdɔːrəbl |  | очаровательный, прелестный | very cute | What an *adorable* puppy! | Какой очаровательный щенок!
- convenient | adj | kənˈviːniənt |  | удобный | easy and suitable for your needs | Plastic is cheap and *convenient*. | Пластик дешёвый и удобный.
- delightful | adj | dɪˈlaɪtfl |  | восхитительный, прелестный | very pleasant | We had a *delightful* evening. | Мы чудесно провели вечер.
- devastating | adj | ˈdevəsteɪtɪŋ |  | разрушительный, сокрушительный | causing great damage or shock | The flood had a *devastating* effect on the region. | Наводнение имело разрушительные последствия для региона.
- disappointing | adj | ˌdɪsəˈpɔɪntɪŋ | ˌdɪsəˈpɔɪnɪŋ | разочаровывающий | not as good as you hoped | The results were *disappointing*. | Результаты разочаровали.
- disgusting | adj | dɪsˈɡʌstɪŋ |  | отвратительный | very unpleasant | This milk smells *disgusting*. | Это молоко отвратительно пахнет.
- fascinating | adj | ˈfæsɪneɪtɪŋ | ˈfæsəneɪtɪŋ | увлекательный | very interesting | It's a *fascinating* book. | Это увлекательная книга.
- favorable | adj | ˈfeɪvərəbl |  | благоприятный (амер.) | good; showing approval | The weather was *favorable* for sailing. | Погода благоприятствовала плаванию. | брит. favourable
- harmful | adj | ˈhɑːmfl | ˈhɑːrmfl | вредный | causing harm | Smoking is *harmful* to your health. | Курение вредно для здоровья.
- mysterious | adj | mɪˈstiərɪəs | mɪˈstɪriəs | таинственный | strange and hard to explain | A *mysterious* man was watching us. | За нами наблюдал таинственный мужчина.
- noticeable | adj | ˈnəʊtɪsəbl | ˈnoʊtəsəbl | заметный | easy to see | There's a *noticeable* difference. | Разница заметна.
- relaxing | adj | rɪˈlæksɪŋ | riːˈlæksɪŋ | расслабляющий | helping you to relax | We had a *relaxing* weekend. | Мы спокойно провели выходные.
- sensible | adj | ˈsensəbl |  | разумный, благоразумный | showing good judgement | That's a very *sensible* idea. | Это очень разумная мысль. | не «чувствительный» (это sensitive)
- stressful | adj | ˈstresfl |  | напряжённый, стрессовый | causing stress | My job is very *stressful*. | У меня очень нервная работа.
- threatening | adj | ˈθretənɪŋ |  | угрожающий | likely to cause harm | He sent her *threatening* messages. | Он присылал ей угрожающие сообщения.
- unbelievable | adj | ʌnbɪˈliːvəbl | ˌʌnbəˈliːvəbl | невероятный | very surprising | The view was *unbelievable*. | Вид был невероятный.
- unclear | adj | ʌnˈkliə | ənˈklɪr | неясный | not clear | The instructions are *unclear*. | Инструкции непонятные.
- unfair | adj | ʌnˈfeə | ˈʌnˈfer | несправедливый | not fair | It's *unfair* that he got more money. | Несправедливо, что он получил больше денег.
- unnecessary | adj | ʌnˈnesəsəri | ənˈnesəseri | ненужный, лишний | not needed | Avoid *unnecessary* words. | Избегайте лишних слов.
