title: Thinking and opinions
title_ru: Мысли и мнения
topic: mind
words:
- aim | n | eɪm |  | цель | something you hope to achieve | Our *aim* is to finish the project by May. | Наша цель — закончить проект к маю.
- attitude | n | ˈætɪtjuːd | ˈætɪtuːd | отношение, позиция | the way you think and feel about something | He has a very positive *attitude* to life. | У него очень позитивное отношение к жизни.
- belief | n | bɪˈliːf |  | вера, убеждение | a strong feeling that something is true | It's my *belief* that everyone deserves a second chance. | Я убеждён, что каждый заслуживает второго шанса. | гл. believe
- commitment | n | kəˈmɪtmənt |  | обязательство; преданность | a promise; dedication | Having a dog is a big *commitment*. | Завести собаку — большая ответственность.
- common sense | n | ˈkɒmən sens | ˈkɑːmən sens | здравый смысл | practical good judgement | Use your *common sense*! | Включи здравый смысл!
- concern | n | kənˈsɜːn | kənˈsɜːrn | беспокойство, забота | a feeling of worry about something | Our main *concern* is the safety of the children. | Наша главная забота — безопасность детей.
- diligence | n | ˈdɪlɪdʒəns | ˈdɪlədʒəns | усердие, прилежание | careful and hard work | She was praised for her *diligence*. | Её похвалили за прилежание.
- doubt | n | daʊt |  | сомнение | a feeling of not being sure | There's no *doubt* that she is the best player. | Нет сомнений, что она лучший игрок. | b не произносится
- element | n | ˈelɪmənt |  | элемент, составляющая | one part of something | Trust is an important *element* of any relationship. | Доверие — важная составляющая любых отношений.
- focus | n | ˈfəʊkəs | ˈfoʊkəs | фокус, центр внимания | the main point of attention | The *focus* of the course is speaking. | Курс сосредоточен на разговорной речи.
- harmony | n | ˈhɑːməni | ˈhɑːrməni | гармония | a state of peaceful agreement | The islanders lived in *harmony* with nature. | Островитяне жили в гармонии с природой.
- kindness | n | ˈkaɪndnəs |  | доброта | being kind | Thank you for your *kindness*. | Спасибо за вашу доброту.
- reality | n | rɪˈælɪti | ˌriːˈælətiː | реальность | what is real | In *reality*, things are more difficult. | В реальности всё сложнее.
- sake | n | seɪk |  | ради, для блага | for the benefit of | Do it for your mother's *sake*. | Сделай это ради мамы. | for goodness' sake — ради бога
- similarity | n | ˌsɪmɪˈlærɪti | ˌsɪməˈlerəti | сходство | being similar | There's a strong *similarity* between the sisters. | Сёстры очень похожи.
- sparkle | v | ˈspɑːkl | ˈspɑːrkl | сверкать, искриться | to shine with small flashes of light | Her eyes *sparkled* with excitement. | Её глаза сверкали от восторга.
- truth | n | truːθ |  | правда, истина | what is true | Tell me the *truth*. | Скажи мне правду.
- value | n | ˈvæljuː |  | ценность, стоимость | how much something is worth; how important it is | This old coin has great *value*. | Эта старая монета очень ценная.
