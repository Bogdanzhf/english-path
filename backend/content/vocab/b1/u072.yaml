title: Society and politics
title_ru: Общество и политика
topic: society
words:
- bomb | n | bɒm | bɑːm | бомба | a weapon that explodes | A *bomb* destroyed the bridge during the war. | Во время войны бомба разрушила мост. | b на конце не читается
- emergency | n | ɪˈmɜːdʒənsi | ɪˈmɜːrdʒənsi | чрезвычайная ситуация | a sudden dangerous situation that needs action | In an *emergency*, call 112. | В экстренной ситуации звоните 112.
- knight | n | naɪt |  | рыцарь | a soldier of high rank in the Middle Ages | The *knight* promised to protect the king. | Рыцарь поклялся защищать короля. | k и gh не читаются
- minister | n | ˈmɪnɪstə | ˈmɪnɪstər | министр | a person in charge of a government department | The *minister* of education visited our school. | Министр образования посетил нашу школу.
- policy | n | ˈpɒləsi | ˈpɑːləsi | политика, правила | a set of rules or plans of a company or government | The company has a no-smoking *policy*. | В компании действует запрет на курение.
- prisoner | n | ˈprɪznə | ˈprɪznər | пленный, заключённый | someone who is kept in prison or captured in war | Thousands of soldiers were taken *prisoner*. | Тысячи солдат попали в плен.
- weapon | n | ˈwepən |  | оружие | an object used for fighting | Swords were common *weapons* in the past. | Мечи были распространённым оружием в прошлом.
