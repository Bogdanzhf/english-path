title: Society and politics
title_ru: Общество и политика
topic: society
words:
- aged | adj | eɪdʒd |  | в возрасте (стольких-то лет) | of the age of | The course is for children *aged* 6 to 10. | Курс для детей в возрасте от 6 до 10 лет.
- bureau | n | ˈbjɔːrəʊ | ˈbjʊroʊ | бюро, отдел | an office or organisation | Ask at the tourist information *bureau*. | Спросите в бюро туристической информации.
- category | n | ˈkætɪɡəri | ˈkætəɡɔːri | категория | a group of similar things | The books are sorted by *category*. | Книги рассортированы по категориям.
- committee | n | kəˈmɪti |  | комитет | a group of people chosen to make decisions | The *committee* meets every Monday. | Комитет собирается каждый понедельник.
- community | n | kəˈmjuːnəti |  | сообщество, община | a group of people who live in the same area or share something | Our *community* built a new playground. | Наше местное сообщество построило новую детскую площадку.
- council | n | ˈkaʊnsl |  | совет (орган власти) | a group of people elected to manage a town | The city *council* decided to build a new park. | Городской совет решил построить новый парк.
- dynasty | n | ˈdɪnəsti | ˈdaɪnəsti | династия | a series of rulers from the same family | The Ming *dynasty* ruled China for almost 300 years. | Династия Мин правила Китаем почти 300 лет.
- emperor | n | ˈempərə | ˈempərər | император | the ruler of an empire | The *emperor* lived in a huge palace. | Император жил в огромном дворце.
- haven | n | ˈheɪvən |  | убежище, тихая гавань | a safe, peaceful place | The garden is a *haven* for birds. | Сад — настоящее убежище для птиц.
- invade | v | ɪnˈveɪd |  | вторгаться | to enter a country with an army to take control | The Romans *invaded* Britain in 43 AD. | Римляне вторглись в Британию в 43 году н. э.
- motherland | n | ˈmʌðələnd | ˈmʌðərlænd | родина | the country where you were born | He returned to his *motherland*. | Он вернулся на родину.
- paradise | n | ˈpærədaɪs |  | рай | a perfect place | For coffee lovers, this café is *paradise*. | Для любителей кофе это кафе — рай.
- prayer | n | ˈpreɪɜː | ˈpreɪər | молитва | words said to God | She said a *prayer* before dinner. | Перед ужином она прочитала молитву.
- religion | n | rɪˈlɪdʒən |  | религия | a belief in a god or gods | Snakes play a role in many *religions*. | Змеи играют роль во многих религиях.
- religious | adj | rɪˈlɪdʒəs |  | религиозный | connected with religion | Christmas is a *religious* holiday. | Рождество — религиозный праздник.
- royal | adj | ˈrɔɪəl |  | королевский | connected with a king or queen | The *royal* family lives in this palace. | В этом дворце живёт королевская семья.
- rule | v | ruːl |  | править, управлять | to control a country | The queen *ruled* for sixty years. | Королева правила шестьдесят лет.
- union | n | ˈjuːniən | ˈjuːnjən | союз; профсоюз | a group of countries or workers joined together | He joined the trade *union*. | Он вступил в профсоюз.
