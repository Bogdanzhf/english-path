title: People and relationships
title_ru: Люди и отношения
topic: people
words:
- acquaintance | n | əˈkweɪntəns |  | знакомый; знакомство | a person you know but not very well | He's not a friend, just an *acquaintance*. | Он не друг, а просто знакомый.
- brotherhood | n | ˈbrʌðəhʊd | ˈbrʌðərhʊd | братство | a feeling of friendship between people; a group | They felt a strong sense of *brotherhood*. | Их объединяло сильное чувство братства.
- buyer | n | ˈbaɪə | ˈbaɪər | покупатель | a person who buys something | We've found a *buyer* for our house. | Мы нашли покупателя на наш дом.
- champion | n | ˈtʃæmpiən |  | чемпион | a person who has won a competition | She is the world tennis *champion*. | Она чемпионка мира по теннису.
- childhood | n | ˈtʃaɪldhʊd |  | детство | the time when you are a child | I had a happy *childhood*. | У меня было счастливое детство.
- comedian | n | kəˈmiːdiən |  | комик | a person whose job is to make people laugh | The *comedian* told jokes about his family. | Комик шутил о своей семье.
- elderly | adj | ˈeldəli | ˈeldərli | пожилой | old (a polite word) | She looks after her *elderly* parents. | Она ухаживает за пожилыми родителями.
- enemy | n | ˈenəmi |  | враг | a person or country that fights against you | The two countries were *enemies* for a hundred years. | Эти две страны были врагами сто лет.
- first person | n | fɜːst ˈpɜːsən | fɜːrst ˈpɜːrsən | первое лицо (грам.) | the form of a verb used with I and we | The story is written in the *first person*. | История написана от первого лица.
- foreigner | n | ˈfɒrənə | ˈfɑːrənər | иностранец | a person from another country | Many *foreigners* live in this area. | В этом районе живёт много иностранцев.
- friendship | n | ˈfrendʃɪp |  | дружба | the relationship between friends | Their *friendship* began at school. | Их дружба началась в школе.
- generation | n | ˌdʒenəˈreɪʃn |  | поколение | all the people born at about the same time | Three *generations* live in this house. | В этом доме живут три поколения.
- gentleman | n | ˈdʒentlmən |  | джентльмен | a polite, well-behaved man | He's a real *gentleman* — he always opens the door for others. | Он настоящий джентльмен — всегда открывает дверь другим. | мн. ч. gentlemen
- groom | n | ɡruːm |  | жених | a man on his wedding day | The bride and *groom* cut the cake. | Жених и невеста разрезали торт. | = bridegroom
- liar | n | ˈlaɪə | ˈlaɪər | лжец, врун | a person who tells lies | I don't trust him — he's a *liar*. | Я ему не верю — он лжец.
- marriage | n | ˈmærɪdʒ | ˈmerɪdʒ | брак, супружество | the relationship between a husband and wife | They have a happy *marriage*. | У них счастливый брак.
- nickname | n | ˈnɪkneɪm |  | прозвище | an informal name | His *nickname* at school was "Rocket". | В школе его прозвали «Ракета».
- relation | n | rɪˈleɪʃən | riːˈleɪʃən | отношение, связь; родственник | a connection; a member of your family | There's no *relation* between the two events. | Между этими событиями нет связи.
- relative | n | ˈrelətɪv |  | родственник | a member of your family | All our *relatives* came to the wedding. | На свадьбу приехали все наши родственники.
- second person | n | ˈsekənd ˈpɜːsən | ˈsekənd ˈpɜːrsən | второе лицо (грам.) | the form used with you | "You are" is in the *second person*. | «You are» — форма второго лица.
- staff | n | stɑːf | stæf | персонал, сотрудники | all the people who work for a company | The hotel *staff* were very helpful. | Персонал отеля был очень отзывчивым.
- teen | n | tiːn |  | подросток (разг.) | a teenager | The film is popular with *teens*. | Фильм популярен у подростков.
- third person | n | θɜːd ˈpɜːsən | θɜːrd ˈpɜːrsən | третье лицо (грам.) | the form used with he, she, it, they | Add -s for the *third person* singular. | В третьем лице единственного числа добавьте -s.
