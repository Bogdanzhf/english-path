title: Food and drink
title_ru: Еда и напитки
topic: food
words:
- alcohol | n | ˈælkəhɒl | ˈælkəhɔːl | алкоголь | drinks such as beer and wine that can make people drunk | You must not drink *alcohol* before you drive. | Нельзя пить алкоголь перед тем, как садиться за руль.
- chewing gum | n | ˈtʃjuːɪŋ ɡʌm | ˈtʃuːɪŋ ɡʌm | жевательная резинка | a sweet you chew but don't swallow | Can I have a piece of *chewing gum*? | Можно жвачку?
- chip | n | tʃɪp |  | картофель фри (брит.); чипс (амер.); микросхема | a long thin piece of fried potato | Fish and *chips*, please. | Рыбу с картошкой, пожалуйста. | амер. fries; британские чипсы — crisps
- cucumber | n | ˈkjuːkʌmbə | ˈkjuːkəmbər | огурец | a long green vegetable | Slice the *cucumber* for the salad. | Нарежь огурец для салата.
- fat | n | fæt |  | жир | the oily substance in food and in the body | This cheese is low in *fat*. | В этом сыре мало жира.
- 'grill | v | ɡrɪl |  | жарить на гриле | to cook under or over strong heat | We *grilled* sausages in the garden. | Мы жарили сосиски на гриле в саду. | сущ.: grill — гриль'
- harvest | n | ˈhɑːvɪst | ˈhɑːrvɪst | урожай; жатва | the time when crops are collected; the crops collected | This year's *harvest* was very good. | Урожай в этом году был очень хорошим.
- ingredient | n | ɪnˈɡriːdiənt |  | ингредиент | one of the foods used to make a dish | Flour and eggs are the main *ingredients*. | Мука и яйца — основные ингредиенты.
- nutrient | n | ˈnjuːtriənt | ˈnuːtriənt | питательное вещество | a substance that is needed for growth | Vegetables are full of *nutrients*. | Овощи полны питательных веществ.
- nutritious | adj | njuˈtrɪʃəs | nuˈtrɪʃəs | питательный | containing what the body needs to be healthy | Try to eat *nutritious* food on the road. | В дороге старайтесь есть питательную еду.
- recipe | n | ˈresəpi |  | рецепт | instructions that tell you how to cook something | Can you give me the *recipe* for this cake? | Дашь рецепт этого торта?
- refreshments | n | rɪˈfreʃmənts | rəˈfreʃmənts | лёгкие закуски и напитки | food and drinks at an event | *Refreshments* will be served after the talk. | После доклада будут угощения.
- seaweed | n | ˈsiːwiːd |  | морские водоросли | a plant that grows in the sea | Sushi is wrapped in *seaweed*. | Суши заворачивают в водоросли.
- spicy | adj | ˈspaɪsi |  | острый, пряный | with a strong hot taste | I love *spicy* food. | Я люблю острую еду.
- spinach | n | ˈspɪnɪtʃ | ˈspɪnətʃ | шпинат | a vegetable with dark green leaves | *Spinach* is rich in iron. | Шпинат богат железом.
- takeaway | n | ˈteɪkəweɪ |  | еда навынос (брит.) | a meal you buy and eat at home | Let's get a Chinese *takeaway*. | Давай закажем китайскую еду навынос. | амер. takeout
- vegetarian | n | ˌvedʒəˈteəriən | ˌvedʒəˈteriən | вегетарианец | a person or animal that doesn't eat meat | Many large dinosaurs were *vegetarians*. | Многие крупные динозавры были травоядными.
