title: Food and drink
title_ru: Еда и напитки
topic: food
words:
- alcohol | n | ˈælkəhɒl | ˈælkəhɔːl | алкоголь | drinks such as beer and wine that can make people drunk | You must not drink *alcohol* before you drive. | Нельзя пить алкоголь перед тем, как садиться за руль.
- harvest | n | ˈhɑːvɪst | ˈhɑːrvɪst | урожай; жатва | the time when crops are collected; the crops collected | This year's *harvest* was very good. | Урожай в этом году был очень хорошим.
- ingredient | n | ɪnˈɡriːdiənt |  | ингредиент | one of the foods used to make a dish | Flour and eggs are the main *ingredients*. | Мука и яйца — основные ингредиенты.
- nutritious | adj | njuˈtrɪʃəs | nuˈtrɪʃəs | питательный | containing what the body needs to be healthy | Try to eat *nutritious* food on the road. | В дороге старайтесь есть питательную еду.
- recipe | n | ˈresəpi |  | рецепт | instructions that tell you how to cook something | Can you give me the *recipe* for this cake? | Дашь рецепт этого торта?
- vegetarian | n | ˌvedʒəˈteəriən | ˌvedʒəˈteriən | вегетарианец | a person or animal that doesn't eat meat | Many large dinosaurs were *vegetarians*. | Многие крупные динозавры были травоядными.
