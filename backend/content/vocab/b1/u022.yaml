title: Places and the city
title_ru: Город и места
topic: city
words:
- alley | n | ˈæli |  | переулок, аллея | a narrow street between buildings | The cat disappeared down a dark *alley*. | Кошка скрылась в тёмном переулке.
- bakery | n | ˈbeɪkəri |  | пекарня, булочная | a shop that makes and sells bread | I buy bread at the *bakery*. | Я покупаю хлеб в пекарне.
- border | n | ˈbɔːdə | ˈbɔːrdər | граница | the line between two countries or areas | We crossed the *border* into Spain. | Мы пересекли границу с Испанией.
- campsite | n | ˈkæmpsaɪt |  | кемпинг | a place where people put up tents | We stayed at a *campsite* by the lake. | Мы остановились в кемпинге у озера.
- campus | n | ˈkæmpəs |  | кампус, университетская территория | the buildings and land of a university | She lives on *campus*. | Она живёт в студгородке.
- canteen | n | kɑːnˈtiːn | kænˈtiːn | столовая (в школе, на работе) | a place where people eat at work or school | We have lunch in the *canteen*. | Мы обедаем в столовой.
- dam | n | dæm |  | дамба, плотина | a wall built across a river | The *dam* produces electricity. | Плотина вырабатывает электричество.
- district | n | ˈdɪstrɪkt |  | район, округ | an area of a town or country | They live in a quiet *district* of the city. | Они живут в тихом районе города.
- driveway | n | ˈdraɪvweɪ |  | подъездная дорожка | a short private road from the street to a house | He parked the car in the *driveway*. | Он припарковал машину на подъездной дорожке.
- entrance | n | ˈentrəns |  | вход | a door or gate where you go in | Meet me at the main *entrance*. | Встретимся у главного входа.
- fence | n | fens |  | забор, ограда | a wall made of wood or wire | The dog jumped over the *fence*. | Собака перепрыгнула через забор.
- first floor | n | fɜːst flɔː | fɜːrst flɔːr | второй этаж (брит.); первый этаж (амер.) | the floor above the ground floor (UK) | My office is on the *first floor*. | Мой офис на втором этаже.
- fountain | n | ˈfaʊntən |  | фонтан; источник | a structure that sends water up into the air | Children were playing around the *fountain*. | Дети играли вокруг фонтана.
- ground floor | n | ɡraʊnd flɔː | ɡraʊnd flɔːr | первый этаж (брит.) | the floor at street level | The shop is on the *ground floor*. | Магазин на первом этаже.
- harbour | n | ˈhɑːbə | ˈhɑːrbər | гавань, порт | a sheltered area of water where ships stay | Boats were sailing into the *harbour*. | Лодки заходили в гавань. | амер. harbor
- highway | n | ˈhaɪweɪ |  | шоссе (амер.) | a main road between cities | Take the *highway* to the city. | Езжайте в город по шоссе.
- hut | n | hʌt |  | хижина | a small simple house made of wood or mud | They stayed in a small *hut* in the mountains. | Они жили в маленькой хижине в горах.
- lane | n | leɪn |  | переулок; полоса (движения) | a narrow road; a part of a road for one line of cars | Stay in the left *lane*. | Держитесь левой полосы.
- mall | n | mæl | mɔːl | торговый центр | a large building with many shops | Let's go shopping at the *mall*. | Пойдём за покупками в торговый центр.
- setting | n | ˈsetɪŋ |  | обстановка, место действия; настройка | the place and time where a story happens | The *setting* of the novel is Victorian London. | Действие романа происходит в викторианском Лондоне.
- shortcut | n | ˈʃɔːtkʌt | ˈʃɔːrtkʌt | короткий путь | a quicker way | They took a *shortcut* across the desert. | Они пошли напрямик через пустыню.
- sidewalk | n | ˈsaɪdwɔːk |  | тротуар (амер.) | a path for walking at the side of a road | Walk on the *sidewalk*, not the road. | Иди по тротуару, а не по дороге. | брит. pavement
- staircase | n | ˈsteəkeɪs | ˈsterkeɪs | лестница (внутри здания) | a set of stairs inside a building | A narrow *staircase* led to the basement. | Узкая лестница вела в подвал.
- tent | n | tent |  | палатка | a shelter made of cloth for camping | We put up our *tent* by the river. | Мы поставили палатку у реки.
reading:
  title: The Newcomer and the Shepherd
  title_ru: Приезжий и пастух
  text: |
    When Daniel moved from the city to a small mountain village, the local people were not friendly. He was a newcomer, and they didn't trust him. He bought an old lodge that had been neglected for years. The roof was broken, and the garden was full of weeds. Everyone said it was ridiculous to pay so much money for it.

    Daniel didn't let them discourage him. He worked every day to repair the house. The only person who helped him was an old shepherd named Luka, who lived in a hut on the hill above the village. Luka taught him how to grow wheat and vegetables and how to look after animals. Slowly, Daniel acquired the skills he needed to live in the mountains.

    One autumn, a man in an expensive suit came to the village. He said he was from the government and that the villagers had to pay a new tax on their land. Many people were frightened. Some even started to show hatred towards Daniel, because they thought the man was his friend from the city.

    But Daniel had seen this kind of trick before. He looked closely at the man's documents and realized they were fake. "This is an offense," he said. "You are trying to deceive these people." The man ran to his car and left. Later, the police caught him in another village.

    The villagers felt awkward. They had treated Daniel as inferior, and he had saved their money. The next week, the village caretaker knocked on his door with a basket of food. "We want to repay you," he said. "Our welcome was not satisfactory. Please forgive us." Today, Daniel's lodge, which overlooks the whole valley, is the place where the villagers meet every Friday evening.
  ru: |
    Когда Дэниел переехал из города в маленькую горную деревню, местные жители встретили его недружелюбно. Он был приезжим, и ему не доверяли. Он купил старый домик, который годами стоял заброшенным. Крыша была сломана, а сад зарос сорняками. Все говорили, что платить за него столько денег — нелепо.

    Дэниел не позволил им себя обескуражить. Он каждый день работал, ремонтируя дом. Единственным, кто ему помогал, был старый пастух Лука, живший в хижине на холме над деревней. Лука научил его выращивать пшеницу и овощи и ухаживать за животными. Постепенно Дэниел приобрёл навыки, необходимые для жизни в горах.

    Однажды осенью в деревню приехал человек в дорогом костюме. Он сказал, что он из правительства и жители должны платить новый налог на землю. Многие испугались. Некоторые даже начали проявлять ненависть к Дэниелу, думая, что этот человек — его друг из города.

    Но Дэниел уже видел подобные уловки. Он внимательно посмотрел на документы мужчины и понял, что они поддельные. «Это преступление, — сказал он. — Вы пытаетесь обмануть этих людей». Мужчина бросился к машине и уехал. Позже полиция поймала его в другой деревне.

    Жителям стало неловко. Они считали Дэниела хуже себя, а он сберёг их деньги. На следующей неделе к нему постучал деревенский сторож с корзиной еды. «Мы хотим тебя отблагодарить, — сказал он. — Мы встретили тебя не лучшим образом. Пожалуйста, прости нас». Сегодня домик Дэниела, из которого видна вся долина, — место, где жители деревни собираются каждую пятницу вечером.
  questions:
  - q: Why didn't the villagers trust Daniel?
    options:
    - He was rude
    - He was a newcomer from the city
    - He was a thief
    - He didn't speak their language
    answer: 1
  - q: Who helped Daniel learn to live in the mountains?
    options:
    - The caretaker
    - An old shepherd
    - The man from the government
    - His family
    answer: 1
  - q: What did Daniel notice about the man's documents?
    options:
    - They were old
    - They were fake
    - They were in another language
    - They were lost
    answer: 1
  - tf: The villagers apologized to Daniel.
    answer: true
  - tf: The man from the city was Daniel's friend.
    answer: false
