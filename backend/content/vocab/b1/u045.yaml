title: 'How and how much: adverbs'
title_ru: 'Как и насколько: наречия'
topic: manner
words:
- deeply | adv | ˈdiːpli |  | глубоко; очень | very much | I was *deeply* moved by the film. | Фильм меня глубоко тронул.
- elsewhere | adv | ˈelsweə | ˈelswer | в другом месте | in another place | Let's eat *elsewhere*. | Давай поедим в другом месте.
- equally | adv | ˈiːkwəli |  | одинаково, в равной степени | in the same way | The money was shared *equally*. | Деньги поделили поровну.
- gradually | adv | ˈɡrædʒuːəli |  | постепенно | slowly over time | The weather *gradually* improved. | Погода постепенно улучшилась.
- greatly | adv | ˈɡreɪtli |  | очень, значительно | very much | Your help is *greatly* appreciated. | Мы очень ценим вашу помощь.
- incredibly | adv | ɪnˈkredɪbli | ˌɪnˈkredəbli | невероятно | extremely | The film was *incredibly* boring. | Фильм был невероятно скучным.
- legally | adv | ˈliːɡəli |  | законно | according to the law | You can't *legally* drive until you're eighteen. | До восемнадцати лет водить по закону нельзя.
- mentally | adv | ˈmentəli | ˈmenəli | мысленно, умственно | relating to the mind | I'm *mentally* exhausted. | Я морально вымотан.
- partly | adv | ˈpɑːtli | ˈpɑːrtli | частично | not completely | The accident was *partly* my fault. | Отчасти авария произошла по моей вине.
- publicly | adv | ˈpʌblɪkli |  | публично, открыто | in front of other people | He *publicly* apologised. | Он публично извинился.
- repeatedly | adv | rɪˈpiːtɪdli |  | неоднократно | many times | I *repeatedly* asked him to stop. | Я неоднократно просил его прекратить.
- roughly | adv | ˈrʌfli |  | приблизительно; грубо | approximately; not gently | *Roughly* 200 people came. | Пришло примерно 200 человек.
- safely | adv | ˈseɪfli |  | благополучно, безопасно | without danger | The plane landed *safely*. | Самолёт благополучно приземлился.
- similarly | adv | ˈsɪmɪləli | ˈsɪmələrli | аналогично, подобным образом | in a similar way | The twins dress *similarly*. | Близнецы одеваются одинаково.
- strongly | adv | ˈstrɒŋli | ˈstrɔːŋli | сильно, решительно | very much | I *strongly* recommend this book. | Очень рекомендую эту книгу.
- successfully | adv | səkˈsesfəli |  | успешно | with success | She *successfully* passed the exam. | Она успешно сдала экзамен.
- surprisingly | adv | səˈpraɪzɪŋli |  | удивительно | in a surprising way | The test was *surprisingly* easy. | Тест оказался на удивление лёгким.
- traditionally | adv | trəˈdɪʃənəli |  | традиционно | according to tradition | *Traditionally*, the bride wears white. | По традиции невеста одевается в белое.
