title: 'Describing: society and science'
title_ru: 'Описание: общество, наука, право'
topic: describing
words:
- cultural | adj | ˈkʌltʃərəl |  | культурный | relating to culture | The city has a rich *cultural* life. | В городе богатая культурная жизнь.
- eastern | adj | ˈiːstn | ˈiːstərn | восточный | in the east | They live in *eastern* Europe. | Они живут в Восточной Европе.
- face-to-face | adj | ˈfeɪstuˈfeɪs | ˈfeɪstuːˈfeɪs | личный, лицом к лицу | meeting in person | We had a *face-to-face* meeting. | Мы встретились лично.
- fellow | adj | ˈfeləʊ | ˈfeloʊ | товарищ по…, собрат | having the same situation or interests | He was admired by his *fellow* artists. | Им восхищались коллеги-художники. | fellow citizens — сограждане
- involved | adj | ɪnˈvɒlvd | ˌɪnˈvɑːlvd | вовлечённый, участвующий | taking part | I don't want to get *involved*. | Я не хочу в это ввязываться.
- legal | adj | ˈliːɡl |  | юридический; законный | connected with the law; allowed by law | She works in the *legal* department. | Она работает в юридическом отделе.
- located | adj | ləʊˈkeɪtɪd | ˈloʊkeɪd | расположенный | in a particular place | The hotel is *located* near the sea. | Отель расположен у моря.
- military | adj | ˈmɪlətri | ˈmɪləteri | военный | connected with soldiers and the army | He did his *military* service in the navy. | Он проходил военную службу во флоте.
- next-door | adj | ˈnekstdɔː | nˈekstdɔː | соседний | in the next house | Our *next-door* neighbours are very nice. | Наши соседи очень милые.
- northern | adj | ˈnɔːðən | ˈnɔːrðərn | северный | in the north | It's a town in *northern* Italy. | Это город на севере Италии.
- official | adj | əˈfɪʃl |  | официальный | approved by a government or someone in power | English is an *official* language in India. | Английский — один из официальных языков Индии.
- paid | adj | peɪd |  | оплачиваемый | receiving money for work | She has two weeks of *paid* holiday. | У неё две недели оплачиваемого отпуска.
- political | adj | pəˈlɪtɪkl | pəˈlɪtəkl | политический | relating to politics | They discussed *political* issues. | Они обсуждали политические вопросы.
- private | adj | ˈpraɪvət |  | частный, личный | belonging to one person or group; not public | She studied at a *private* university. | Она училась в частном университете.
- self-service | adj |  |  | самообслуживания | where you serve yourself | It's a *self-service* restaurant. | Это ресторан самообслуживания.
- southern | adj | ˈsʌðən | ˈsʌðərn | южный | in the south | It's a *southern* city. | Это южный город.
- sports | adj | spɔːts | spɔːrts | спортивный | relating to sport | I bought a *sports* bag. | Я купил спортивную сумку.
- well-paid | adj |  |  | хорошо оплачиваемый | earning a lot | She has a *well-paid* job. | У неё хорошо оплачиваемая работа.
- western | adj | ˈwestn | ˈhwestərn | западный | in the west; relating to Europe and America | *Western* culture is very different. | Западная культура сильно отличается.
- written | adj | ˈrɪtn |  | письменный | in writing | You need *written* permission. | Нужно письменное разрешение.
