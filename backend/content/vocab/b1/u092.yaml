title: Thinking and opinions
title_ru: Мысли и мнения
topic: mind
words:
- addition | n | əˈdɪʃən |  | добавление; сложение | adding something | The new room is a great *addition* to the house. | Новая комната — отличное дополнение к дому.
- base | n | beɪs |  | основание, база | the bottom part of something; a main place | There is a small garden at the *base* of the tower. | У подножия башни есть небольшой сад.
- consequence | n | ˈkɒnsɪkwəns | ˈkɑːnsəkwens | последствие | a result of an action | Every decision has *consequences*. | У каждого решения есть последствия.
- force | n | fɔːs | fɔːrs | сила | physical strength or power | The *force* of the wind broke the window. | Сила ветра разбила окно.
- importance | n | ɪmˈpɔːtns | ɪmˈpɔːrtns | важность, значение | the quality of being important | Never underestimate the *importance* of sleep. | Никогда не недооценивайте важность сна.
- individual | n | ˌɪndɪˈvɪdʒuəl |  | индивидуум, человек | a single person | Every *individual* has rights. | У каждого человека есть права.
- influence | n | ˈɪnfluəns |  | влияние | the power to affect someone or something | Stress has a strong *influence* on the body. | Стресс сильно влияет на организм.
- intelligence | n | ɪnˈtelɪdʒəns |  | интеллект, ум | the ability to learn and understand | Dolphins are known for their *intelligence*. | Дельфины известны своим интеллектом.
- issue | n | ˈɪʃuː |  | вопрос, проблема | an important problem or topic | Pollution is a serious *issue* in big cities. | Загрязнение — серьёзная проблема больших городов.
- lead | n | liːd |  | главная роль; лидерство | the main part in a play; the first place | She played the *lead* in the school play. | Она играла главную роль в школьном спектакле.
- length | n | leŋθ |  | длина | how long something is | The *length* of the pool is fifty metres. | Длина бассейна — пятьдесят метров.
- limit | n | ˈlɪmɪt |  | предел, ограничение | the largest or smallest amount that is allowed | The speed *limit* here is 50 km per hour. | Ограничение скорости здесь — 50 км/ч.
- range | n | reɪndʒ |  | диапазон, ассортимент | a number of different things of the same type | The shop sells a wide *range* of shoes. | В магазине большой выбор обуви.
- release | v | rɪˈliːs |  | выпускать, освобождать | to let someone or something go free | They *released* the bird from the cage. | Они выпустили птицу из клетки.
- 'respect | n | rɪˈspekt | riːˈspekt | уважение | a feeling of admiration | Children should show *respect* to older people. | Дети должны уважать старших. | гл.: respect — уважать'
- responsibility | n | rɪˌspɒnsəˈbɪləti | rɪˌspɑːnsəˈbɪləti | ответственность, обязанность | a duty to deal with something | Childcare should be a shared *responsibility*. | Уход за детьми должен быть общей обязанностью.
- strength | n | streŋθ |  | сила | the quality of being strong | It takes a lot of *strength* to lift that. | Чтобы поднять это, нужно много силы.
- stuff | n | stʌf |  | вещи, штуки (разг.) | things in general (informal) | Put your *stuff* in the van. | Сложи свои вещи в фургон.
