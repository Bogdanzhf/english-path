title: Actions and movement
title_ru: Действия и движение
topic: actions
words:
- adjust | v | əˈdʒʌst |  | регулировать, приспосабливаться | to change something a little to make it better | You can *adjust* the height of the chair. | Высоту стула можно регулировать. | adjust to — привыкнуть к
- bake | v | beɪk |  | печь, выпекать | to cook in an oven | My grandmother *bakes* bread every Saturday. | Бабушка печёт хлеб каждую субботу. | bakery — пекарня
- complicate | v | ˈkɒmplɪkeɪt | ˈkɑːmplɪkeɪt | усложнять | to make something more difficult | The bad weather *complicated* the search. | Плохая погода усложнила поиски.
- concentrate | v | ˈkɒnsntreɪt | ˈkɑːnsntreɪt | сосредоточиться | to give all your attention to something | I can't *concentrate* with this noise. | Я не могу сосредоточиться при таком шуме. | concentrate on
- explode | v | ɪkˈspləʊd | ɪkˈsploʊd | взрываться | to burst with a loud noise | The firework *exploded* in the sky. | Фейерверк взорвался в небе. | explosion — взрыв
- glide | v | ɡlaɪd |  | скользить, планировать | to move smoothly and quietly | The shuttle *glided* back to Earth without engines. | Шаттл планировал обратно на Землю без двигателей.
- highlight | v | ˈhaɪlaɪt |  | выделять, подчёркивать | to make something stand out; to mark text with a bright colour | The report *highlights* the need for change. | В докладе подчёркивается необходимость перемен.
- illuminate | v | ɪˈluːmɪneɪt |  | освещать; проливать свет | to light up; to make something clearer | The book *illuminates* the mind of a criminal. | Книга проливает свет на сознание преступника.
- mend | v | mend |  | чинить, штопать | to repair something broken or torn | Can you *mend* this hole in my jacket? | Можешь зашить дырку на моей куртке?
- occur | v | əˈkɜː | əˈkɜːr | происходить, случаться | to happen | The accident *occurred* at about six o'clock. | Авария произошла около шести часов.
- remain | v | rɪˈmeɪn |  | оставаться | to stay in the same place or state | Please *remain* in your seats. | Пожалуйста, оставайтесь на своих местах.
- swell | v | swel |  | опухать, набухать | to become bigger, especially after an injury | My ankle *swelled* after I fell. | После падения у меня распухла лодыжка. | swell — swelled — swollen
- update | v | ˌʌpˈdeɪt |  | обновлять | to make something more modern or add new information | The guidelines are *updated* every year. | Рекомендации обновляются каждый год.
