title: Work and jobs
title_ru: Работа и профессии
topic: work
words:
- barman | n | ˈbɑːmən | ˈbɑːrmən | бармен | a man who serves drinks in a bar | The *barman* poured two beers. | Бармен налил два пива.
- butcher | n | ˈbʊtʃə | ˈbʊtʃər | мясник | a person who sells meat | I bought sausages at the *butcher's*. | Я купил сосиски в мясной лавке.
- captain | n | ˈkæptɪn |  | капитан | the person in charge of a ship, plane or team | The *captain* welcomed us on board. | Капитан приветствовал нас на борту.
- clerk | n | klɑːk | klɜːrk | служащий, клерк; продавец | a person who works in an office or a shop | The *clerk* at the bank was very polite. | Служащий в банке был очень вежлив.
- CV | n | ˌsiˈvi | ˌsiːˈviː | резюме (брит.) | a document describing your education and work | Send your *CV* to the manager. | Отправьте резюме менеджеру. | амер. résumé
- editor | n | ˈedɪtə | ˈedətər | редактор | a person who prepares texts for printing | She's the *editor* of a fashion magazine. | Она редактор модного журнала.
- employ | v | ɪmˈplɔɪ |  | нанимать, давать работу; применять | to give someone a paid job; to use | The company *employs* 500 people. | В компании работает 500 человек.
- grocer | n | ˈɡrəʊsə | ˈɡroʊsər | бакалейщик, продавец продуктов | a person who sells food and things for the home | The *grocer* gave us fresh bread. | Продавец дал нам свежего хлеба. | groceries — продукты
- hairdresser | n | ˈheədresə | ˈherdresər | парикмахер | a person who cuts and styles hair | I have an appointment at the *hairdresser's*. | Я записан к парикмахеру.
- janitor | n | ˈdʒænɪtə | ˈdʒænɪtər | уборщик, вахтёр | a person who cleans and looks after a building (US) | The *janitor* locked the school at night. | Ночью сторож запирал школу. | брит. caretaker
- librarian | n | laɪˈbreəriən | laɪˈbreriən | библиотекарь | a person who works in a library | The *librarian* helped me find the book. | Библиотекарь помог мне найти книгу.
- lifeguard | n | ˈlaɪfɡɑːd | ˈlaɪfɡɑːrd | спасатель (на пляже, в бассейне) | a person who watches swimmers | The *lifeguard* saved a child. | Спасатель спас ребёнка.
- nurse | v | nɜːs | nɜːrs | ухаживать за (больным) | to care for someone who is ill | She *nursed* her mother back to health. | Она выходила свою мать.
- occupation | n | ˌɒkjuˈpeɪʃn | ˌɑːkjuˈpeɪʃn | род занятий, профессия | a job | Please write your name and *occupation*. | Пожалуйста, укажите имя и род занятий.
- postman | n | ˈpəʊstmən | ˈpoʊsmən | почтальон | a person who delivers letters | The *postman* comes at ten. | Почтальон приходит в десять.
- salesman | n | ˈseɪlzmən |  | продавец, торговый агент | a man whose job is selling | The *salesman* showed us the new cars. | Продавец показал нам новые машины.
- schoolteacher | n | ˈskuːltiːtʃə | ˈskuːltiːtʃər | школьный учитель | a teacher in a school | My mother is a *schoolteacher*. | Моя мама — школьная учительница.
- servant | n | ˈsɜːvənt | ˈsɜːrvənt | слуга | a person who works in someone's house | The family had three *servants*. | В семье было трое слуг.
- server | n | ˈsɜːvə | ˈsɜːrvər | сервер; официант (амер.) | a computer that stores information for a network | The website is down — the *server* crashed. | Сайт не работает — упал сервер.
- vacancy | n | ˈveɪkənsi |  | вакансия; свободный номер | a job that is available; a free room in a hotel | There's a *vacancy* in the sales department. | В отделе продаж есть вакансия.
- vet | n | vet |  | ветеринар | a doctor for animals | We took the cat to the *vet*. | Мы отвезли кошку к ветеринару.
- veterinarian | n | ˌvetərɪˈneəriən | ˌvetərɪˈneriən | ветеринар | a doctor for animals | Take the dog to the *veterinarian*. | Отведи собаку к ветеринару. | разг. vet
