reading:
  title: The Blacksmith's Son
  title_ru: Сын кузнеца
  text: |
    In the 1850s, in a poor province in the north of England, there lived a humble blacksmith named John Harper. Every day, he forged horseshoes, tools and gates from iron. His small workshop had a tall chimney, and the sound of his hammer could be heard all over the village. The work was hard, and it barely sustained his family. Sometimes they had only a few pennies to buy bread.

    John's son, William, helped his father from the age of eight. He climbed the ladder to clean the chimney, carried heavy pieces of metal and learned how fire changes iron. But William also had a talent: he loved drawing machines. At night, by candlelight, he designed new tools that could make his father's work easier.

    One day, William encountered a rich factory owner whose carriage had broken near the village. While his father repaired the wheel, William showed the man his drawings. The man was amazed. "This boy's ideas exceed anything my engineers have done," he said. He offered to become William's benefactor and pay for his education in the city.

    At first, a problem arose: John didn't want to lose his only helper. But the factory owner made an agreement with him. He compensated the family for William's work and paid for a new workshop.

    William studied hard and later founded his own company that built steam engines. The business prospered, and he became one of the richest men in the country. But he remained modest. He never preached about success and always said, "I'm just a blacksmith's son." His greatest satisfaction was the school he built in his home village, which still occupies the place where his father's workshop once stood.
  ru: |
    В 1850-х годах в бедной провинции на севере Англии жил скромный кузнец по имени Джон Харпер. Каждый день он ковал из железа подковы, инструменты и ворота. У его маленькой мастерской была высокая труба, а стук его молота был слышен по всей деревне. Работа была тяжёлой и едва кормила семью. Порой у них было всего несколько пенни на хлеб.

    Сын Джона, Уильям, помогал отцу с восьми лет. Он забирался по лестнице чистить трубу, таскал тяжёлые куски металла и узнал, как огонь меняет железо. Но у Уильяма был и талант: он обожал рисовать машины. По ночам, при свече, он придумывал новые инструменты, которые могли бы облегчить работу отца.

    Однажды Уильям повстречал богатого владельца фабрики, у которого рядом с деревней сломалась карета. Пока отец чинил колесо, Уильям показал ему свои чертежи. Мужчина был поражён. «Идеи этого мальчика превосходят всё, что сделали мои инженеры», — сказал он. Он предложил стать покровителем Уильяма и оплатить его учёбу в городе.

    Сначала возникла проблема: Джон не хотел терять единственного помощника. Но владелец фабрики заключил с ним договор. Он возместил семье работу Уильяма и оплатил новую мастерскую.

    Уильям усердно учился, а позже основал собственную компанию, строившую паровые машины. Дело процветало, и он стал одним из богатейших людей страны. Но он остался скромным. Он никогда не поучал других, как добиться успеха, и всегда говорил: «Я просто сын кузнеца». Его самой большой радостью была школа, которую он построил в родной деревне. Она до сих пор стоит на месте, где когда-то была мастерская его отца.
  questions:
  - q: What did William love doing at night?
    options:
    - Reading novels
    - Drawing machines
    - Making horseshoes
    - Playing music
    answer: 1
  - q: How did William meet the factory owner?
    options:
    - At school
    - The owner's carriage broke near the village
    - At a market in the city
    - His father introduced them
    answer: 1
  - q: What did the factory owner do for John?
    options:
    - He gave him a job in the factory
    - He compensated the family and paid for a new workshop
    - He bought his horse
    - Nothing
    answer: 1
  - tf: William became proud and forgot his family.
    answer: false
  - tf: William built a school in his home village.
    answer: true
