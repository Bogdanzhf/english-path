title: People and relationships
title_ru: Люди и отношения
topic: people
words:
- addressee | n | əˈdresiː | ˌædreˈsiː | адресат, получатель | the person a letter is addressed to | The letter was returned — the *addressee* had moved. | Письмо вернулось — адресат переехал.
- ancestor | n | ˈænsestə | ˈænsestər | предок | a family member who lived a long time ago | My *ancestors* came from Ireland. | Мои предки были родом из Ирландии.
- bride | n | braɪd |  | невеста | a woman on her wedding day | The *bride* wore a white dress. | Невеста была в белом платье. | жених — groom
- caller | n | ˈkɔːlə | ˈkɔːlər | звонящий; посетитель | a person who makes a phone call or visits | The *caller* didn't leave a name. | Звонивший не представился.
- competitor | n | kəmˈpetɪtə | kəmˈpetətər | соперник, конкурент; участник | a person or company competing with others | We sell cheaper than our *competitors*. | Мы продаём дешевле конкурентов.
- "father-in-law | n | ˈf\x01ːðɜːɪnl\x01ː | ˈfɑːðərɪnlɔː | свёкор; тесть | the father of your husband or wife | My *father-in-law* is a retired pilot. | Мой тесть — пилот на пенсии."
- innovator | n | ˈɪnəveɪtə | ˈɪnəveɪtər | новатор | a person who introduces new ideas | Steve Jobs was a great *innovator*. | Стив Джобс был великим новатором.
- interviewee | n | ˈɪntəvjuːiː | ˌɪntərvjuːˈiː | интервьюируемый; кандидат на собеседовании | the person who answers questions in an interview | Each *interviewee* had twenty minutes. | У каждого кандидата было двадцать минут.
- junior | adj | ˈdʒuːniə | ˈdʒuːniər | младший | younger or lower in position | He got a job as a *junior* engineer. | Он устроился младшим инженером.
- mother-in-law | n | ˈməðɜːɪnlɔː | ˈmʌðərɪnlɔː | свекровь; тёща | the mother of your husband or wife | My *mother-in-law* makes great soup. | Моя свекровь варит прекрасный суп.
- nationalist | n | ˈnæʃənəlɪst | ˈnæʃənələst | националист | a person who strongly supports their nation's independence | The *nationalists* won the election. | Националисты победили на выборах.
- nephew | n | ˈnefjuː |  | племянник | the son of your brother or sister | My *nephew* is five years old. | Моему племяннику пять лет.
- newcomer | n | ˈnjuːkʌmə | ˈnuːkʌmər | новичок, приезжий | a person who has recently arrived | The village welcomed the *newcomers*. | Деревня приветствовала приезжих.
- niece | n | niːs |  | племянница | the daughter of your brother or sister | I bought a present for my *niece*. | Я купил подарок племяннице.
- organizer | n | ˈɔːɡənaɪzɜː | ˈɔːrɡənaɪzər | организатор | a person who organizes an event | The *organizers* cancelled the concert. | Организаторы отменили концерт. | брит. также organiser
- progressive | adj | prəˈɡresɪv |  | прогрессивный; постепенный | supporting new ideas; happening gradually | The school has a *progressive* approach to education. | В школе прогрессивный подход к обучению.
- son-in-law | n | ˈsənɪnlɔː | ˈsʌnɪnlɔː | зять (муж дочери) | the husband of your daughter | Their *son-in-law* is a doctor. | Их зять — врач.
- stranger | n | ˈstreɪndʒə | ˈstreɪndʒər | незнакомец; чужой человек | a person you don't know | Don't talk to *strangers*. | Не разговаривай с незнакомцами.
- supporter | n | səˈpɔːtə | səˈpɔːrtər | сторонник; болельщик | a person who supports a team, idea or person | He's a big Liverpool *supporter*. | Он большой болельщик «Ливерпуля».
- teammate | n | ˈtiːmeɪt |  | товарищ по команде | a person in the same team | She passed the ball to her *teammate*. | Она передала мяч партнёру по команде.
- tease | v | tiːz |  | дразнить | to laugh at someone in a playful or unkind way | His brothers *teased* him about his big ears. | Братья дразнили его из-за больших ушей.
- unknown | adj | ʌnˈnəʊn | ənˈnoʊn | неизвестный | not known | The cause of the fire is still *unknown*. | Причина пожара пока неизвестна.
reading:
  title: The Orphan and the Old Man
  title_ru: Сирота и старик
  text: |
    Tom was an orphan who lived with his aunt in a small village. Next door lived Mr. Harris, a grumpy old man. For years, there had been a dispute between Mr. Harris and Tom's aunt about the garden fence. Mr. Harris shouted at Tom whenever his ball went over it.

    One day, after another incident with the ball, Mr. Harris kept it and refused to give it back. Tom was filled with rage. He wanted revenge. That night, he plotted his plan. He would sneak into the old man's garden and pull up all his flowers, especially the daisies Mr. Harris loved so much.

    Early the next morning, in the grey mist, Tom crept over the fence. But as he reached the flowers, he heard a strange sound. Through the window, he saw Mr. Harris lying on the kitchen floor. Tom watched in horror. The old man wasn't moving.

    Tom forgot all about his plan. He climbed in through the back door, which was open, and called an ambulance. Then he sat with Mr. Harris and held his hand until help came. The doctors said the old man had fallen and broken his hip. "If the boy hadn't found you," they said, "it could have been much worse."

    A week later, Mr. Harris came home from hospital. He asked Tom to visit. On the kitchen table was the ball — and a bunch of daisies with long stems. "I'm sorry," the old man said with a sigh. "I've been lonely since my wife died. This house has felt so empty." Tom felt a wave of shame about his plan for revenge. He told Mr. Harris the truth. To his surprise, Mr. Harris laughed. "Then we're even," he said. "Can you spare an evening? I make a very tender beef stew." From then on, Tom often came for supper, and the two of them sat on the bench in the garden, talking for hours.
  ru: |
    Том был сиротой и жил с тётей в маленькой деревне. По соседству жил мистер Харрис, ворчливый старик. Много лет мистер Харрис и тётя Тома спорили из-за садового забора. Мистер Харрис кричал на Тома каждый раз, когда его мяч перелетал через забор.

    Однажды, после очередного случая с мячом, мистер Харрис забрал его себе и отказался отдавать. Тома охватила ярость. Он жаждал мести. Той ночью он обдумал свой план. Он проберётся в сад старика и вырвет все его цветы — особенно ромашки, которые мистер Харрис так любил.

    Ранним утром, в сером тумане, Том перелез через забор. Но как только он подобрался к цветам, он услышал странный звук. Через окно он увидел мистера Харриса, лежащего на полу кухни. Том смотрел в ужасе. Старик не двигался.

    Том совсем забыл о своём плане. Он вошёл через заднюю дверь, которая была открыта, и вызвал скорую. Потом сидел рядом с мистером Харрисом и держал его за руку, пока не приехала помощь. Врачи сказали, что старик упал и сломал бедро. «Если бы мальчик вас не нашёл, — сказали они, — всё могло бы быть гораздо хуже».

    Через неделю мистер Харрис вернулся из больницы. Он позвал Тома в гости. На кухонном столе лежал мяч — и букет ромашек на длинных стеблях. «Прости меня, — сказал старик со вздохом. — Мне было одиноко с тех пор, как умерла жена. Этот дом казался таким пустым». Тому стало очень стыдно за свой план мести. Он рассказал мистеру Харрису правду. К его удивлению, тот рассмеялся. «Значит, мы квиты, — сказал он. — Найдётся у тебя свободный вечер? Я готовлю очень нежное рагу из говядины». С тех пор Том часто приходил на ужин, и они вдвоём часами сидели на скамейке в саду и разговаривали.
  questions:
  - q: Why did Tom want revenge?
    options:
    - Mr. Harris hit him
    - Mr. Harris kept his ball
    - Mr. Harris broke the fence
    - Mr. Harris shouted at his aunt
    answer: 1
  - q: What did Tom see through the window?
    options:
    - Mr. Harris eating
    - Mr. Harris lying on the floor
    - A thief
    - A fire
    answer: 1
  - q: Why was Mr. Harris so grumpy?
    options:
    - He hated children
    - He was lonely after his wife died
    - He was ill
    - He had no money
    answer: 1
  - tf: Tom pulled up the daisies.
    answer: false
  - tf: Tom and Mr. Harris became friends.
    answer: true
