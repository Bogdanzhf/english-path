title: Feelings and character
title_ru: Чувства и характер
topic: feelings
words:
- alarm | n | əˈlɑːm | əˈlɑːrm | тревога, сигнализация; будильник | a device that makes a loud noise to warn of danger | The fire *alarm* went off in the middle of the night. | Посреди ночи сработала пожарная сигнализация. | alarm clock — будильник
- ambition | n | æmˈbɪʃn |  | честолюбие, стремление | a strong wish to achieve something | Her *ambition* is to climb the highest mountain in the world. | Её мечта — покорить самую высокую гору в мире.
- diligent | adj | ˈdɪlɪdʒənt |  | старательный, усердный | working hard and carefully | She's a *diligent* student who never misses a class. | Она старательная студентка, которая не пропускает занятий.
- emotion | n | ɪˈməʊʃn | ɪˈmoʊʃn | эмоция, чувство | a strong feeling like love, anger or fear | She tried to hide her *emotions*. | Она пыталась скрыть свои чувства.
- excitement | n | ɪkˈsaɪtmənt |  | волнение, возбуждение | a feeling of being excited | The children were jumping with *excitement*. | Дети прыгали от восторга.
- gratitude | n | ˈɡrætɪtjuːd | ˈɡrætɪtuːd | благодарность | the feeling of being thankful | I want to express my *gratitude* for your help. | Хочу выразить благодарность за вашу помощь.
- happiness | n | ˈhæpɪnəs | ˈhæpiːnəs | счастье | the state of being happy | Money doesn't buy *happiness*. | Счастье за деньги не купишь.
- hasty | adj | ˈheɪsti |  | поспешный | done too quickly | Don't make a *hasty* decision. | Не принимай поспешных решений.
- horror | n | ˈhɒrə | ˈhɔːrər | ужас | a strong feeling of fear and shock | She watched in *horror* as the car crashed. | Она в ужасе смотрела, как разбилась машина. | horror film — фильм ужасов
- joy | n | dʒɔɪ |  | радость | great happiness | She cried with *joy* when she heard the news. | Она плакала от радости, когда услышала новость.
- mood | n | muːd |  | настроение | the way you feel at a particular time | The *mood* in the city was tense. | В городе царило напряжённое настроение.
- panic | v | ˈpænɪk |  | паниковать | to suddenly feel so afraid you can't think | Don't *panic* — stay calm. | Не паникуй — сохраняй спокойствие. | panicked, panicking
- passion | n | ˈpæʃən |  | страсть, увлечение | a very strong feeling or interest | Music is his *passion*. | Музыка — его страсть.
- pity | n | ˈpɪti |  | жалость; жаль | sadness for someone who is suffering | He felt *pity* for the wounded soldiers. | Он испытывал жалость к раненым солдатам. | What a pity! — Как жаль!
- possessive | adj | pəˈzesɪv |  | собственнический; притяжательный (грам.) | wanting to own or control someone | Her boyfriend is very *possessive*. | Её парень — большой собственник.
- pride | n | praɪd |  | гордость | a feeling of satisfaction about something you did | She looked at her work with *pride*. | Она с гордостью смотрела на свою работу.
- sadness | n | ˈsædnəs |  | грусть, печаль | the feeling of being sad | I felt great *sadness* when he left. | Когда он уехал, мне стало очень грустно.
- shock | n | ʃɒk | ʃɑːk | шок, потрясение | a strong feeling of surprise | The news came as a *shock*. | Новость стала шоком.
- talkative | adj | ˈtɔːkətɪv |  | разговорчивый | liking to talk a lot | He's not very *talkative* in the morning. | По утрам он не очень разговорчив.
- uncontrollable | adj | ʌnkənˈtrəʊləbl | ˌʌnkənˈtroʊləbl | неудержимый, неконтролируемый | impossible to control | She had an *uncontrollable* desire to laugh. | Её охватило неудержимое желание рассмеяться.
