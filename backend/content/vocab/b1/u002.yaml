- female | n | ˈfiːmeɪl |  | женщина; самка | a woman; an animal that can have babies | The *female* lays her eggs in the sand. | Самка откладывает яйца в песок.
- first lady | n | fɜːst ˈleɪdi | fɜːrst ˈleɪdi | первая леди | the wife of a president | The *First Lady* visited the hospital. | Первая леди посетила больницу.
- gender | n | ˈdʒendə | ˈdʒendər | пол; род (грамм.) | being male or female | Jobs should be open to everyone, whatever their *gender*. | Работа должна быть доступна всем, независимо от пола.
- giant | adj | ˈdʒaɪənt |  | гигантский | very big | A *giant* wave hit the boat. | Гигантская волна обрушилась на лодку. | сущ. giant — великан
- host | n | həʊst | hoʊst | хозяин (принимающий гостей); ведущий | a person who invites guests; a person who presents a TV show | Our *host* showed us around the house. | Хозяин показал нам дом.
- idol | n | ˈaɪdl |  | кумир | a person who is admired very much | The singer was my teenage *idol*. | Этот певец был моим кумиром в юности.
- living | n | ˈlɪvɪŋ |  | заработок, средства к существованию | the money you earn to live | What does he do for a *living*? | Чем он зарабатывает на жизнь?
- lord | n | lɔːd | lɔːrd | лорд, господин | a man with a high rank in society | The *lord* lived in a large castle. | Лорд жил в большом замке.
- mankind | n | mæŋˈkaɪnd | ˈmænˈkaɪnd | человечество | all people | Climate change is a threat to *mankind*. | Изменение климата — угроза человечеству. | нейтрально — humankind
- native | adj | ˈneɪtɪv |  | родной; коренной | connected with the place where you were born; original to a place | Her *native* language is Welsh. | Её родной язык — валлийский. | native speaker — носитель языка
- romance | n | ˈrəʊmæns | ˈroʊmæns | роман, любовные отношения | a love affair; a love story | Their *romance* started in Paris. | Их роман начался в Париже.
- runaway | n | ˈrʌnəweɪ |  | беглец | a person who has run away from home | The police found the young *runaway*. | Полиция нашла юного беглеца.
- sex | n | seks |  | пол; секс | being male or female; physical love | Please write your name, age and *sex*. | Укажите имя, возраст и пол.
- spirit | n | ˈspɪrɪt | ˈspɪrət | дух; настроение | a person's mind and feelings; the soul | The team showed great *spirit*. | Команда проявила большой боевой дух.
- vice president | n | vaɪs ˈprezɪdənt | vaɪs ˈprezədent | вице-президент | the person below the president | The *vice president* will speak tomorrow. | Завтра выступит вице-президент.
- youth | n | juːθ |  | юность; молодёжь | the time when you are young; young people | In his *youth*, he travelled a lot. | В юности он много путешествовал.
reading:
  title: A Week in Copenhagen
  title_ru: Неделя в Копенгагене
  text: |
    Last July, I flew to Copenhagen to visit my cousin Freya. It was my first time on a plane alone, and I was a bit nervous. But when I arrived, Freya was waiting for me with a big pink sign that said "WELCOME!" I laughed and immediately felt better.

    Freya and her husband were wonderful hosts. Their flat was small but modern, with a soft grey carpet and a huge window in the upper part of the living room. On my first evening, they welcomed me with a traditional Danish dinner. There were other guests too — friends from Freya's work — and we talked until midnight.

    The temperature in Copenhagen was perfect: about twenty-two degrees every day. We spent the mornings walking around the city. I loved the architecture: old colourful houses next to modern glass buildings. In the parks, the flowers were blooming everywhere. We visited a museum about the Vikings, where I saw an ancient boat that looked like a long canoe. In the afternoon, we went to an art gallery. One evening, we even went to the theater, although I didn't understand a word of the Danish play!

    On Saturday, we took a basket of food to the beach and had a picnic. Freya's husband had packed it the night before and kept it in the refrigerator, so the drinks were still cold.

    On my last day, I sat at Freya's desk and wrote a thank-you card. "You must come to visit me next year," I wrote. It was the best holiday of my life.
  ru: |
    Прошлым июлем я полетел в Копенгаген в гости к двоюродной сестре Фрейе. Я впервые летел один и немного нервничал. Но когда я прилетел, Фрейя ждала меня с большой розовой табличкой «ДОБРО ПОЖАЛОВАТЬ!». Я рассмеялся и сразу почувствовал себя лучше.

    Фрейя и её муж оказались чудесными хозяевами. Их квартира была небольшой, но современной, с мягким серым ковролином и огромным окном в верхней части гостиной. В первый вечер они угостили меня традиционным датским ужином. Были и другие гости — друзья Фрейи с работы, — и мы проговорили до полуночи.

    Погода в Копенгагене была идеальной: около двадцати двух градусов каждый день. По утрам мы гуляли по городу. Мне очень понравилась архитектура: старые разноцветные дома рядом с современными стеклянными зданиями. В парках повсюду цвели цветы. Мы побывали в музее викингов, где я увидел древнюю лодку, похожую на длинное каноэ. После обеда мы пошли в художественную галерею. Однажды вечером мы даже сходили в театр, хотя я не понял ни слова из датской пьесы!

    В субботу мы взяли корзину с едой на пляж и устроили пикник. Муж Фрейи собрал её накануне вечером и поставил в холодильник, так что напитки были ещё холодными.

    В последний день я сел за стол Фрейи и написал открытку с благодарностью. «Обязательно приезжайте ко мне в следующем году», — написал я. Это был лучший отпуск в моей жизни.
