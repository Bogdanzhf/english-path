title: People and relationships
title_ru: Люди и отношения
topic: people
words:
- candidate | n | ˈkændɪdət |  | кандидат | a person who applies for a job or stands in an election | There were three *candidates* for the job. | На эту работу было три кандидата.
- chairman | n | ˈtʃeəmən | ˈtʃermən | председатель | the person in charge of a meeting or company | The *chairman* opened the meeting. | Председатель открыл собрание. | нейтрально — chair, chairperson
- date | v | deɪt |  | встречаться (с кем-то); датировать | to have a romantic relationship with someone | They've been *dating* for a year. | Они встречаются уже год.
- dating | n | ˈdeɪtɪŋ |  | свидания, знакомства | going out with people romantically | Online *dating* is very popular. | Знакомства в интернете очень популярны.
- drunk | adj | drʌŋk |  | пьяный | having drunk too much alcohol | He was too *drunk* to drive. | Он был слишком пьян, чтобы садиться за руль.
- dude | n | djuːd | duːd | чувак (амер., разг.) | a man | Hey, *dude*, how's it going? | Привет, чувак, как дела?
- Englishman | n | ˈɪŋɡlɪʃmən |  | англичанин | a man from England | He's a typical *Englishman* who loves tea. | Он типичный англичанин, обожающий чай.
- female | n | ˈfiːmeɪl |  | женщина; самка | a woman; an animal that can have babies | The *female* lays her eggs in the sand. | Самка откладывает яйца в песок.
- first lady | n | fɜːst ˈleɪdi | fɜːrst ˈleɪdi | первая леди | the wife of a president | The *First Lady* visited the hospital. | Первая леди посетила больницу.
- gender | n | ˈdʒendə | ˈdʒendər | пол; род (грамм.) | being male or female | Jobs should be open to everyone, whatever their *gender*. | Работа должна быть доступна всем, независимо от пола.
- giant | adj | ˈdʒaɪənt |  | гигантский | very big | A *giant* wave hit the boat. | Гигантская волна обрушилась на лодку. | сущ. giant — великан
- host | n | həʊst | hoʊst | хозяин (принимающий гостей); ведущий | a person who invites guests; a person who presents a TV show | Our *host* showed us around the house. | Хозяин показал нам дом.
- idol | n | ˈaɪdl |  | кумир | a person who is admired very much | The singer was my teenage *idol*. | Этот певец был моим кумиром в юности.
- living | n | ˈlɪvɪŋ |  | заработок, средства к существованию | the money you earn to live | What does he do for a *living*? | Чем он зарабатывает на жизнь?
- lord | n | lɔːd | lɔːrd | лорд, господин | a man with a high rank in society | The *lord* lived in a large castle. | Лорд жил в большом замке.
- mankind | n | mæŋˈkaɪnd | ˈmænˈkaɪnd | человечество | all people | Climate change is a threat to *mankind*. | Изменение климата — угроза человечеству. | нейтрально — humankind
- native | adj | ˈneɪtɪv |  | родной; коренной | connected with the place where you were born; original to a place | Her *native* language is Welsh. | Её родной язык — валлийский. | native speaker — носитель языка
- romance | n | ˈrəʊmæns | ˈroʊmæns | роман, любовные отношения | a love affair; a love story | Their *romance* started in Paris. | Их роман начался в Париже.
- runaway | n | ˈrʌnəweɪ |  | беглец | a person who has run away from home | The police found the young *runaway*. | Полиция нашла юного беглеца.
- sex | n | seks |  | пол; секс | being male or female; physical love | Please write your name, age and *sex*. | Укажите имя, возраст и пол.
- spirit | n | ˈspɪrɪt | ˈspɪrət | дух; настроение | a person's mind and feelings; the soul | The team showed great *spirit*. | Команда проявила большой боевой дух.
- vice president | n | vaɪs ˈprezɪdənt | vaɪs ˈprezədent | вице-президент | the person below the president | The *vice president* will speak tomorrow. | Завтра выступит вице-президент.
- youth | n | juːθ |  | юность; молодёжь | the time when you are young; young people | In his *youth*, he travelled a lot. | В юности он много путешествовал.
