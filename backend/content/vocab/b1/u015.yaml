title: Body and health
title_ru: Тело и здоровье
topic: body
words:
- beard | n | bɪəd | bɪrd | борода | hair growing on a man's chin and cheeks | He grew a *beard* during the winter. | За зиму он отрастил бороду.
- bite | n | baɪt |  | укус; кусочек | a wound made by teeth; a small piece of food | Can I have a *bite* of your apple? | Можно откусить от твоего яблока? | гл. bite — bit — bitten
- breath | n | breθ |  | дыхание, вдох | the air that goes in and out of your body | Take a deep *breath* and relax. | Сделай глубокий вдох и расслабься. | гл. breathe [briːð]
- cheek | n | tʃiːk |  | щека; наглость | the soft part of the face below the eye | She kissed him on the *cheek*. | Она поцеловала его в щёку.
- chest | n | tʃest |  | грудь, грудная клетка; сундук | the front part of your body between your neck and stomach | He felt a sharp pain in his *chest*. | Он почувствовал резкую боль в груди.
- doc | n | dɒk | dɑːk | доктор (разг.) | a doctor | Thanks, *Doc*! | Спасибо, док!
- fitness | n | ˈfɪtnəs |  | физическая форма; фитнес | being healthy and strong | She does *fitness* classes twice a week. | Она занимается фитнесом два раза в неделю.
- forehead | n | ˈfɔːhed | ˈfɔːrhed | лоб | the part of the face above the eyes | He has a scar on his *forehead*. | У него шрам на лбу.
- gall | n | ɡɔːl |  | наглость; желчь | rude confidence | He had the *gall* to ask for more money. | Ему хватило наглости попросить ещё денег.
- health care | n | helθ keə | helθ ker | здравоохранение | medical services | Everyone should have access to *health care*. | У каждого должен быть доступ к медицине. | также healthcare
- heart attack | n | hɑːt əˈtæk | hɑːrt əˈtæk | сердечный приступ, инфаркт | a sudden serious problem with the heart | He had a *heart attack* last year. | В прошлом году у него был инфаркт.
- HIV | n | ˈeɪˈtʃaɪˈvi | ˈeɪˈtʃaɪˈviː | ВИЧ | the virus that causes AIDS | Tests for *HIV* are free. | Анализы на ВИЧ бесплатные.
- lip | n | lɪp |  | губа | one of the two soft parts around your mouth | She bit her *lip*. | Она прикусила губу.
- muscle | n | ˈmʌsl |  | мышца | the parts of the body that produce movement | My *muscles* ached after rowing. | После гребли у меня болели мышцы. | c не читается
- nail | n | neɪl |  | ноготь; гвоздь | the hard part at the end of a finger; a thin metal pin | Don't bite your *nails*! | Не грызи ногти!
- sickness | n | ˈsɪknəs |  | болезнь; тошнота | being ill; feeling that you will vomit | He was off work because of *sickness*. | Он не был на работе по болезни.
- skeleton | n | ˈskelɪtn |  | скелет | all the bones of a body | They found the *skeleton* of a dinosaur. | Они нашли скелет динозавра.
- stress | v | stres |  | подчёркивать, делать ударение | to emphasise | She *stressed* the importance of sleep. | Она подчеркнула важность сна.
- 'sweat | n | swet |  | пот | liquid that comes out of your skin when you are hot | His shirt was wet with *sweat*. | Его рубашка промокла от пота. | гл.: sweat — потеть'
- symptom | n | ˈsɪmptəm |  | симптом | a sign of an illness | A high temperature is a *symptom* of flu. | Высокая температура — симптом гриппа.
- throat | n | θrəʊt | θroʊt | горло | the inside of the neck | I have a sore *throat*. | У меня болит горло.
- toe | n | təʊ | toʊ | палец ноги | one of the five parts at the end of your foot | I hurt my big *toe*. | Я ушиб большой палец ноги.
- tongue | n | tʌŋ |  | язык (орган) | the soft part inside your mouth that you use for tasting | The dog licked my hand with its *tongue*. | Собака лизнула мою руку языком. | mother tongue — родной язык
- treatment | n | ˈtriːtmənt |  | лечение; обращение | medical care; the way you treat someone | The *treatment* lasted three weeks. | Лечение длилось три недели.
- voice | v | vɔɪs |  | высказывать, выражать | to say what you think | Many people *voiced* their concerns. | Многие выразили обеспокоенность.
