title: Place and direction
title_ru: Место и направление
topic: place
words:
- ahead | adv | əˈhed |  | впереди, вперёд | in front; in the future | Go straight *ahead* and turn left. | Идите прямо, потом поверните налево. | ahead of — впереди кого-то
- apart | adv | əˈpɑːt | əˈpɑːrt | врозь, отдельно; на расстоянии | not together; at a distance from each other | The two houses are ten metres *apart*. | Два дома стоят в десяти метрах друг от друга.
- locate | v | ləʊˈkeɪt | ˈloʊkeɪt | находить (местоположение) | to find the exact place of something | We couldn't *locate* the problem. | Мы не смогли найти, в чём проблема. | be located — находиться, располагаться
- overseas | adv | ˌəʊvəˈsiːz | ˌoʊvərˈsiːz | за границей, за рубежом | in or to another country across the sea | My brother works *overseas*. | Мой брат работает за границей.
- underneath | prep | ˌʌndəˈniːθ | ˌʌndərˈniːθ | под, внизу | directly under something | The cat was hiding *underneath* the bed. | Кошка пряталась под кроватью.
- within | prep | wɪˈðɪn |  | в пределах, в течение | inside a period of time or an area | The parcel will arrive *within* three days. | Посылка придёт в течение трёх дней.
