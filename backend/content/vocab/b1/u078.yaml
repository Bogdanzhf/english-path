title: Science and research
title_ru: Наука и исследования
topic: science
words:
- analysis | n | əˈnæləsɪs | əˈnæləsəs | анализ | a careful study of something | The *analysis* showed some problems. | Анализ выявил некоторые проблемы. | мн. ч. analyses
- atomic | adj | əˈtɒmɪk | əˈtɑːmɪk | атомный | relating to atoms | They built an *atomic* power station. | Они построили атомную электростанцию.
- biochemistry | n | ˌbaɪəʊˈkemɪstri | ˌbaɪoʊˈkeməstri | биохимия | the chemistry of living things | She has a degree in *biochemistry*. | У неё диплом по биохимии.
- chemical | n | ˈkemɪkl |  | химическое вещество | a substance used or made in chemistry | Some *chemicals* are dangerous to touch. | Некоторые химические вещества опасно трогать.
- comet | n | ˈkɒmɪt | ˈkɑːmɪt | комета | an object of ice and dust in space with a bright tail | Halley's *Comet* comes back every 76 years. | Комета Галлея возвращается каждые 76 лет.
- conclusion | n | kənˈkluːʒn |  | вывод, заключение | the end of something; a decision after thinking | What *conclusion* did you come to? | К какому выводу ты пришёл?
- electron | n | ɪˈlektrɒn | ɪˈlektrɑːn | электрон | a tiny particle with a negative electric charge | An *electron* is smaller than an atom. | Электрон меньше атома.
- experiment | v | ɪkˈsperɪmənt | ɪkˈsperəmənt | экспериментировать | to try new ideas | He likes to *experiment* with new recipes. | Он любит экспериментировать с новыми рецептами.
- galaxy | n | ˈɡæləksi |  | галактика | a very large group of stars | Our *galaxy* is called the Milky Way. | Наша галактика называется Млечный Путь.
- genetics | n | dʒeˈnetɪks | dʒəˈnetɪks | генетика | the study of genes | *Genetics* explains why we look like our parents. | Генетика объясняет, почему мы похожи на родителей.
- geographical | adj | ˌdʒɪəˈɡræfɪkl | ˌdʒiəˈɡræfɪkl | географический | relating to geography | The map shows *geographical* features. | Карта показывает географические особенности.
- geology | n | dʒiˈɒlədʒi | dʒiˈɑːlədʒi | геология | the study of rocks and the Earth's structure | She studied *geology* at university. | Она изучала геологию в университете.
- globe | n | ɡləʊb | ɡloʊb | земной шар, глобус | the world; a round model of the Earth | Visitors came from all over the *globe*. | Посетители приезжали со всего земного шара.
- growth | n | ɡrəʊθ | ɡroʊθ | рост | an increase in size or amount | The city has seen rapid *growth*. | Город быстро растёт.
- laboratory | n | ləˈbɒrətri | ˈlæbrətɔːri | лаборатория | a room where scientists do tests and experiments | My mother works in a *laboratory* at the university. | Моя мама работает в лаборатории университета. | разг. lab
- magnet | n | ˈmæɡnət |  | магнит | a piece of metal that attracts iron | She stuck the photo on the fridge with a *magnet*. | Она прикрепила фото к холодильнику магнитом.
- molecule | n | ˈmɒlɪkjuːl | ˈmɑːlɪkjuːl | молекула | the smallest unit of a substance, made of atoms | A water *molecule* has two hydrogen atoms and one oxygen atom. | Молекула воды состоит из двух атомов водорода и одного атома кислорода.
- nucleus | n | ˈnjuːkliəs | ˈnuːkliəs | ядро | the central part of a cell or atom | DNA is stored in the cell's *nucleus*. | ДНК хранится в ядре клетки. | мн. nuclei
- orbit | n | ˈɔːbɪt | ˈɔːrbɪt | орбита | the path of a planet or satellite around another body | The Earth's *orbit* around the Sun takes a year. | Оборот Земли вокруг Солнца занимает год.
- organism | n | ˈɔːɡənɪzəm | ˈɔːrɡənɪzəm | организм | a living thing | The disease was caused by a tiny *organism*. | Болезнь вызывал крошечный организм.
- pressure | n | ˈpreʃə | ˈpreʃər | давление | a feeling of worry because you have to do a lot | Students are under a lot of *pressure* before exams. | Перед экзаменами студенты испытывают сильное давление.
- ray | n | reɪ |  | луч | a narrow line of light or energy | A *ray* of sunlight came through the clouds. | Сквозь облака пробился луч солнца.
- reaction | n | rɪˈækʃən | riːˈækʃən | реакция | what you do or feel because of something | What was his *reaction* to the news? | Как он отреагировал на новость?
- research | v | ˈrisɜːtʃ | ˈriːsərtʃ | исследовать, изучать | to study something carefully | She is *researching* the history of the town. | Она изучает историю города.
- result | v | rɪˈzʌlt | riːˈzʌlt | следовать, происходить (в результате) | to happen because of something | The accident *resulted* from bad weather. | Авария произошла из-за плохой погоды.
- sample | n | ˈsɑːmpl | ˈsæmpl | образец, проба | a small amount that shows what the rest is like | The doctor took a blood *sample*. | Врач взял пробу крови.
- substance | n | ˈsʌbstəns |  | вещество | a particular kind of solid, liquid or gas | This *substance* is dangerous if swallowed. | Это вещество опасно при проглатывании.
- theory | n | ˈθɪəri | ˈθiːəri | теория | an idea that tries to explain something | Scientists have a new *theory* about the stars. | У учёных новая теория о звёздах.
