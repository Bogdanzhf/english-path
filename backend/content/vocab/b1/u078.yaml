title: Economy and business
title_ru: Экономика и бизнес
topic: economy
words:
- billionaire | n | ˌbɪljəˈneə | ˌbɪljəˈner | миллиардер | a person who has more than a billion dollars | A *billionaire* bought the company. | Компанию купил миллиардер.
- budget | n | ˈbʌdʒɪt |  | бюджет | the amount of money available for something | The project went over *budget*. | Проект вышел за рамки бюджета.
- economy | n | ɪˈkɒnəmi | ɪˈkɑːnəmi | экономика; экономия | the system of money, trade and industry in a country | The *economy* grew rapidly. | Экономика быстро росла.
- export | v | ɪkˈspɔːt | ɪkˈspɔːrt | экспортировать | to sell goods to another country | Norway *exports* oil and fish. | Норвегия экспортирует нефть и рыбу. | сущ. export [ˈekspɔːt] — экспорт
- import | v | ɪmˈpɔːt | ɪmˈpɔːrt | импортировать, ввозить | to bring goods into a country | Spain *imported* silver from America. | Испания ввозила серебро из Америки.
- loss | n | lɒs | lɔːs | потеря, убыток | when you lose something or someone | The *loss* of his job was a shock. | Потеря работы стала для него ударом.
- poverty | n | ˈpɒvəti | ˈpɑːvərti | бедность | the state of being very poor | Millions of children live in *poverty*. | Миллионы детей живут в бедности.
- profit | n | ˈprɒfɪt | ˈprɑːfɪt | прибыль | money you earn after you pay all the costs | The shop made a small *profit* this year. | В этом году магазин получил небольшую прибыль.
- wealth | n | welθ |  | богатство | a large amount of money and possessions | He made his *wealth* in the oil business. | Он сколотил своё богатство на нефтяном бизнесе.
