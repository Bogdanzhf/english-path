title: Free time and sport
title_ru: Досуг и спорт
topic: leisure
words:
- entertain | v | ˌentəˈteɪn | ˌentərˈteɪn | развлекать | to do something that people enjoy watching or listening to | The clown *entertained* the children. | Клоун развлекал детей.
- gymnasium | n | dʒɪmˈneɪziəm |  | спортзал | a large room for sports and exercise | The exams were held in the *gymnasium*. | Экзамены проводились в спортзале. | разг. gym
- riddle | n | ˈrɪdl |  | загадка | a question that is difficult and needs clever thinking | Can you solve this *riddle*? | Ты можешь разгадать эту загадку?
- shoot | v | ʃuːt |  | стрелять; бить по воротам | to fire a gun; to kick or throw a ball at a goal | He *shot* the ball into the net. | Он забил мяч в сетку. | shoot — shot — shot
- sled | n | sled |  | санки | a small vehicle for sliding on snow | The children pulled their *sleds* up the hill. | Дети тянули санки на горку. | брит. также sledge
