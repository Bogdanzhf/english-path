title: Everyday phrases
title_ru: Разговорные фразы
topic: phrases
words:
- a bit more | phr |  |  | ещё немного | a little more | Can you speak *a bit more* slowly? | Можете говорить чуть медленнее?
- a bit of something | phr |  |  | немного (чего-либо) | a small amount of | I need *a bit of* help. | Мне нужна небольшая помощь.
- a great deal | phr |  |  | много, значительно | a lot | She knows *a great deal* about art. | Она много знает об искусстве.
- a kind of... | phr |  |  | своего рода, вроде | a type of | It's *a kind of* soup. | Это что-то вроде супа.
- a little bit | phr |  |  | чуть-чуть, немножко | slightly | I'm *a little bit* nervous. | Я немножко нервничаю.
- a little more | phr |  |  | ещё немного | a small extra amount | Add *a little more* salt. | Добавь ещё немного соли.
- a lot more | phr |  |  | гораздо больше | much more | This one is *a lot more* expensive. | Этот гораздо дороже.
- a range of something | phr |  |  | ряд, широкий выбор | a variety of different things | The shop sells *a range of* products. | В магазине широкий ассортимент товаров.
- a variety of something | phr |  |  | разнообразные, различные | many different types of | The course covers *a variety of* topics. | Курс охватывает различные темы.
- access to something | phr |  |  | доступ к | the right or way to use or reach | All students have *access to* the library. | У всех студентов есть доступ к библиотеке.
- after all | phr |  |  | в конце концов, всё-таки | despite what was expected; used to give a reason | Don't be angry with him — he's only a child, *after all*. | Не сердись на него — он ведь всего лишь ребёнок.
- aim to do something | phr |  |  | стремиться (что-то сделать) | to try or plan to achieve | We *aim to* finish by Friday. | Мы планируем закончить к пятнице.
- along with somebody/something | phr |  |  | вместе с, наряду с | together with | He came *along with* his sister. | Он пришёл вместе с сестрой.
- alternative to something | phr |  |  | альтернатива (чему-либо) | another choice instead of | Cycling is a good *alternative to* driving. | Велосипед — хорошая альтернатива машине.
- and so on | phr |  |  | и так далее | and other similar things | We need eggs, milk, bread *and so on*. | Нам нужны яйца, молоко, хлеб и так далее.
- apart from | phr |  |  | кроме, помимо | except for; as well as | *Apart from* the weather, the trip was great. | Если не считать погоды, поездка была отличной.
- as if... | phr |  |  | как будто | in a way that suggests | She looks *as if* she's tired. | Она выглядит так, будто устала.
- gee | interj | dʒiː |  | ну и ну!, вот это да! (амер.) | used to show surprise | *Gee*, that's a lot of money! | Ну и ну, это куча денег!
- 'goodness | interj | ˈɡʊdnəs |  | боже мой! (my goodness) | used to show surprise | My *goodness*, you''ve grown! | Боже мой, как ты вырос! | сущ.: goodness — доброта'
