title: 'Describing: good or bad'
title_ru: 'Описание: оценка — хорошо или плохо'
topic: describing
words:
- appropriate | adj | əˈprəʊpriət | əˈproʊpriət | подходящий, уместный | right or suitable for a situation | Jeans are not *appropriate* for a job interview. | Джинсы не подходят для собеседования.
- awesome | adj | ˈɔːsəm |  | потрясающий; внушающий благоговение | extremely good (informal); impressive and a little frightening | The view from the top was *awesome*. | Вид с вершины был потрясающим.
- basic | adj | ˈbeɪsɪk |  | базовый, основной | simple and the most important | I know some *basic* Spanish phrases. | Я знаю несколько простых фраз на испанском.
- effective | adj | ɪˈfektɪv |  | эффективный, действенный | working well and producing the result you want | This is a very *effective* medicine for colds. | Это очень действенное лекарство от простуды.
- essential | adj | ɪˈsenʃl |  | необходимый, важнейший | very important and necessary | Water is *essential* for all living things. | Вода необходима всему живому.
- horrible | adj | ˈhɒrəbl | ˈhɔːrəbl | ужасный | very bad or unpleasant | What *horrible* weather! | Какая ужасная погода!
- humid | adj | ˈhjuːmɪd |  | влажный | (of air) warm and wet | The climate is hot and *humid*. | Климат жаркий и влажный. | humidity — влажность
- obvious | adj | ˈɒbviəs | ˈɑːbviəs | очевидный | very easy to see or understand | The answer is *obvious*. | Ответ очевиден.
- powerful | adj | ˈpaʊəfl | ˈpaʊərfl | сильный, мощный | having a strong effect | Food can be a *powerful* medicine. | Еда может быть сильным лекарством.
- practical | adj | ˈpræktɪkl |  | практичный, практический | useful and sensible | Sandals are not very *practical* for walking in the mountains. | Сандалии не очень практичны для прогулок в горах.
- proper | adj | ˈprɒpə | ˈprɑːpər | правильный, надлежащий; настоящий | right or correct | You need *proper* shoes for hiking. | Для походов нужна правильная обувь.
- 'worth | adj | wɜːθ | wɜːrθ | стоящий; стоимостью | having a certain value; good enough to do | This old painting is *worth* a lot of money. | Эта старая картина стоит больших денег. | be worth + -ing: worth seeing'
