title: Home and everyday life
title_ru: Дом и быт
topic: home
words:
- attic | n | ˈætɪk |  | чердак | a room just under the roof of a house | Old toys were stored in the *attic*. | Старые игрушки хранились на чердаке.
- chore | n | tʃɔː | tʃɔːr | (рутинная) домашняя обязанность | a boring job you have to do regularly | Washing the dishes is my least favourite *chore*. | Мыть посуду — моя самая нелюбимая обязанность.
- closet | n | ˈklɒzɪt | ˈklɑːzət | шкаф, кладовка | a small room or cupboard for storing clothes | Hang your coat in the *closet*. | Повесь пальто в шкаф. | амер.; брит. wardrobe
- cottage | n | ˈkɒtɪdʒ | ˈkɑːtɪdʒ | коттедж, домик | a small house in the countryside | They rented a *cottage* by the lake. | Они сняли домик у озера.
- furnish | v | ˈfɜːnɪʃ | ˈfɜːrnɪʃ | обставлять (мебелью) | to put furniture in a room or house | The flat is fully *furnished*. | Квартира полностью меблирована.
- garage | n | ˈɡærɑːʒ | ɡəˈrɑːʒ | гараж; автомастерская | a building for keeping a car; a place where cars are repaired | He keeps his bike in the *garage*. | Он хранит велосипед в гараже.
- mess | n | mes |  | беспорядок, бардак | a dirty or untidy state | Your room is a *mess*! | У тебя в комнате бардак!
- mow | v | məʊ | moʊ | косить, стричь (траву) | to cut grass with a machine | I *mow* the lawn every Saturday. | Я стригу газон каждую субботу. | lawnmower — газонокосилка
- rent | n | rent |  | арендная плата | money you pay to live in or use a place | The *rent* for this flat is very high. | Аренда этой квартиры очень высокая. | гл. rent — снимать
