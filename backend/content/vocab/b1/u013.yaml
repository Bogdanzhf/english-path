title: Clothes and appearance
title_ru: Одежда и внешность
topic: clothes
words:
- accessory | n | əkˈsesəri |  | аксессуар; соучастник | an extra item, like a bag or belt; a person who helps a criminal | A good watch is an essential *accessory*. | Хорошие часы — необходимый аксессуар.
- bracelet | n | ˈbreɪslət |  | браслет | a piece of jewellery worn around the wrist | She wore a gold *bracelet*. | На ней был золотой браслет.
- clothing | n | ˈkləʊðɪŋ | ˈkloʊðɪŋ | одежда | clothes in general | Bring warm *clothing* for the trip. | Возьмите тёплую одежду в поездку.
- collar | n | ˈkɒlə | ˈkɑːlər | воротник; ошейник | the part of a shirt around the neck; a band around an animal's neck | His shirt *collar* was dirty. | У него был грязный воротник.
- costume | n | ˈkɒstjuːm | ˈkɑːstuːm | костюм (маскарадный, национальный) | clothes worn to look like someone else | She wore a witch *costume* for Halloween. | На Хеллоуин она надела костюм ведьмы.
- cotton | n | ˈkɒtn | ˈkɑːtn | хлопок | a soft natural material from a plant | This T-shirt is made of *cotton*. | Эта футболка из хлопка.
- diamond | n | ˈdaɪəmənd | ˈdaɪmənd | бриллиант, алмаз | a very hard precious stone | Her ring has a big *diamond*. | В её кольце большой бриллиант.
- diaper | n | ˈdaɪpə | ˈdaɪpər | подгузник (амер.) | a piece of cloth or paper for a baby's bottom | The baby needs a clean *diaper*. | Малышу нужно поменять подгузник. | брит. nappy
- fur | n | fɜː | fɜːr | мех | the thick hair of an animal | The cat has soft white *fur*. | У кошки мягкая белая шерсть.
- garment | n | ˈɡɑːmənt | ˈɡɑːrmənt | предмет одежды | a piece of clothing (formal) | The factory produces 10,000 *garments* a day. | Фабрика выпускает 10 000 изделий в день.
- glove | n | ɡlʌv |  | перчатка | a piece of clothing for your hand | He wore thick *gloves* in winter. | Зимой он носил толстые перчатки.
- gown | n | ɡaʊn |  | платье (вечернее); мантия | a long formal dress | She wore a beautiful evening *gown*. | На ней было красивое вечернее платье.
- jade | n | dʒeɪd |  | нефрит | a green stone used in jewellery | She has a *jade* necklace. | У неё нефритовое ожерелье.
- jewel | n | ˈdʒuːəl |  | драгоценный камень | a valuable stone like a diamond | The crown was covered in *jewels*. | Корона была усыпана драгоценными камнями. | jewellery (брит.) / jewelry (амер.) — украшения
- jumper | n | ˈdʒʌmpə | ˈdʒʌmpər | джемпер, свитер (брит.) | a warm piece of clothing for the top of the body | Put on a *jumper*, it's cold. | Надень свитер, холодно.
- necklace | n | ˈnekləs |  | ожерелье | a piece of jewellery worn around the neck | She wore a pearl *necklace*. | На ней было жемчужное ожерелье.
- pullover | n | ˈpʊləʊvə | pˈʊləʊvɐ | пуловер | a sweater you pull over your head | He was wearing a grey *pullover*. | На нём был серый пуловер.
- sandal | n | ˈsændl |  | сандалия | a light open shoe | She wore *sandals* on the beach. | На пляже она была в сандалиях.
- sleeve | n | sliːv |  | рукав | the part of a shirt that covers your arm | He rolled up his *sleeves* and started working. | Он закатал рукава и принялся за работу.
- sweatshirt | n | ˈswetʃɜːt | ˈswetʃɜːrt | толстовка | a warm cotton top with long sleeves | He put on a *sweatshirt* and went running. | Он надел толстовку и пошёл на пробежку.
- tracksuit | n | ˈtræksuːt | trˈæksuːt | спортивный костюм | loose trousers and a top for sport | He trains in an old *tracksuit*. | Он тренируется в старом спортивном костюме.
- underwear | n | ˌʌndəˈweə | ˈʌndərwer | нижнее бельё | clothes worn under other clothes | Pack enough *underwear* for a week. | Возьми нижнего белья на неделю.
- wool | n | wʊl |  | шерсть | the soft hair of sheep used for clothes | This scarf is made of *wool*. | Этот шарф из шерсти.
- wrap | v | ræp |  | заворачивать, упаковывать | to cover something with paper or cloth | She *wrapped* the present in red paper. | Она завернула подарок в красную бумагу. | w не произносится
- wristwatch | n | ˈrɪstwɒtʃ | ˈrɪstwɑːtʃ | наручные часы | a watch you wear on your wrist | He looked at his *wristwatch*. | Он посмотрел на наручные часы.
