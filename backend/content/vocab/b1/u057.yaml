reading:
  title: Lucky, the Deaf Dog
  title_ru: Лаки, глухая собака
  text: |
    Emma was an ambitious young veterinarian who worked in a busy clinic in the city. One winter morning, a fisherman brought her a dog he had found on the beach near the bay. Someone had abandoned it there. The dog was thin, cold and frightened, and it didn't respond when Emma called it.

    After examining the dog, Emma realized why. "She's deaf," she said. "She can't hear anything." That's probably why her owners left her. Many people think a deaf dog is difficult to train. But Emma was enthusiastic. "Her other senses are fine," she said. "She can see and smell perfectly."

    Emma took the dog home and called her Lucky. She learned to communicate with Lucky using hand signs. When Lucky did something well, Emma rubbed her under the chin. Lucky quickly became the most loyal friend Emma had ever had. She never barked, but she followed Emma everywhere.

    A year later, Emma joined an expedition to the mountains to study wild animals, and Lucky came too. One evening, a storm came, and a member of the team didn't come back. While everyone looked at the horizon, Lucky put her nose to the ground. She followed the smell for two kilometres and found the man in a small cave, where he had taken refuge with a broken leg.

    When they returned, the town's mayor gave Lucky a medal. Some people had made complaints that a deaf dog shouldn't join an expedition, but now nobody did. Emma used the money from the prize to restore an old barn and open a shelter for abandoned animals. "Lucky and I have a mutual agreement," she says with a smile. "I listen for her, and she sees for me. Together, we're brilliant."
  ru: |
    Эмма была амбициозным молодым ветеринаром и работала в оживлённой городской клинике. Однажды зимним утром рыбак принёс ей собаку, которую нашёл на пляже у бухты. Кто-то её там бросил. Собака была худой, замёрзшей и испуганной и не откликалась, когда Эмма её звала.

    Осмотрев собаку, Эмма поняла почему. «Она глухая, — сказала она. — Она ничего не слышит». Наверное, поэтому хозяева её и бросили. Многие думают, что глухую собаку трудно дрессировать. Но Эмма была полна энтузиазма. «Остальные чувства у неё в порядке, — сказала она. — Она прекрасно видит и чувствует запахи».

    Эмма забрала собаку домой и назвала её Лаки. Она научилась общаться с Лаки с помощью жестов. Когда Лаки делала что-то хорошо, Эмма чесала её под подбородком. Вскоре Лаки стала самым преданным другом, который когда-либо был у Эммы. Она никогда не лаяла, но всюду ходила за Эммой.

    Через год Эмма отправилась в экспедицию в горы изучать диких животных, и Лаки поехала с ней. Однажды вечером началась буря, и один из участников экспедиции не вернулся. Пока все смотрели на горизонт, Лаки уткнулась носом в землю. Она два километра шла по следу и нашла мужчину в маленькой пещере, где он укрылся со сломанной ногой.

    Когда они вернулись, мэр города вручил Лаки медаль. Раньше некоторые жаловались, что глухой собаке нечего делать в экспедиции, но теперь все замолчали. На деньги от премии Эмма отреставрировала старый сарай и открыла приют для брошенных животных. «У нас с Лаки взаимный договор, — говорит она с улыбкой. — Я слушаю за неё, а она видит за меня. Вместе мы — сила».
