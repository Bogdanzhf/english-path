title: Free time and sport
title_ru: Досуг и спорт
topic: leisure
words:
- athletic | adj | æθˈletɪk |  | спортивный, атлетический | strong and good at sport | He's tall and *athletic*. | Он высокий и спортивный.
- award | v | əˈwɔːd | əˈwɔːrd | награждать, присуждать | to give a prize | She was *awarded* a medal. | Её наградили медалью.
- balloon | n | bəˈluːn |  | воздушный шар(ик) | a rubber bag filled with air | We decorated the room with *balloons*. | Мы украсили комнату воздушными шарами.
- boxing | n | ˈbɒksɪŋ | ˈbɑːksɪŋ | бокс | a sport where two people fight with gloves | He watches *boxing* on TV. | Он смотрит бокс по телевизору.
- entertain | v | ˌentəˈteɪn | ˌentərˈteɪn | развлекать | to do something that people enjoy watching or listening to | The clown *entertained* the children. | Клоун развлекал детей.
- fire | v | ˈfaɪə | ˈfaɪər | увольнять; стрелять | to make someone leave a job; to shoot | He was *fired* for being late. | Его уволили за опоздания.
- goalkeeper | n | ˈɡəʊlkiːpə | ˈɡoʊlkiːpər | вратарь | the player who protects the goal | The *goalkeeper* saved the penalty. | Вратарь отбил пенальти.
- golfer | n | ˈɡɒlfə | ˈɡɑːlfər | гольфист | a person who plays golf | He's a professional *golfer*. | Он профессиональный гольфист.
- gymnasium | n | dʒɪmˈneɪziəm |  | спортзал | a large room for sports and exercise | The exams were held in the *gymnasium*. | Экзамены проводились в спортзале. | разг. gym
- gymnastics | n | dʒɪmˈnɑːstɪks | dʒɪmˈnæstɪks | гимнастика | exercises to develop strength and balance | She does *gymnastics* after school. | После школы она занимается гимнастикой.
- hunt | v | hʌnt |  | охотиться; искать | to chase and kill animals; to search | Lions *hunt* at night. | Львы охотятся ночью.
- ice hockey | n | aɪs ˈhɒki | aɪs ˈhɑːki | хоккей (с шайбой) | hockey played on ice | *Ice hockey* is popular in Canada. | Хоккей популярен в Канаде.
- ice skating | n | aɪs ˈskeɪtɪŋ |  | катание на коньках | skating on ice | We went *ice skating* in the park. | Мы катались на коньках в парке.
- medal | n | ˈmedl |  | медаль | a metal disc given as a prize | She won a gold *medal*. | Она выиграла золотую медаль.
- racing | n | ˈreɪsɪŋ |  | гонки, скачки | competitions to see who is fastest | He loves car *racing*. | Он обожает автогонки.
- riddle | n | ˈrɪdl |  | загадка | a question that is difficult and needs clever thinking | Can you solve this *riddle*? | Ты можешь разгадать эту загадку?
- rugby | n | ˈrʌɡbi |  | регби | a team game with an oval ball | *Rugby* is very popular in New Zealand. | Регби очень популярно в Новой Зеландии.
- shoot | v | ʃuːt |  | стрелять; бить по воротам | to fire a gun; to kick or throw a ball at a goal | He *shot* the ball into the net. | Он забил мяч в сетку. | shoot — shot — shot
- skate | v | skeɪt |  | кататься на коньках (роликах) | to move on skates | Can you *skate*? | Ты умеешь кататься на коньках?
- sled | n | sled |  | санки | a small vehicle for sliding on snow | The children pulled their *sleds* up the hill. | Дети тянули санки на горку. | брит. также sledge
- track | v | træk |  | отслеживать | to follow the movements of | You can *track* your parcel online. | Посылку можно отследить онлайн.
- yoga | n | ˈjəʊɡə | ˈjoʊɡə | йога | exercises for the body and mind | I do *yoga* every morning. | Каждое утро я занимаюсь йогой.
