title: Arts and media
title_ru: Искусство и медиа
topic: arts
words:
- antique | n | ænˈtiːk |  | антиквариат, старинная вещь | an old valuable object | The house was full of *antiques*. | Дом был полон антиквариата.
- autograph | n | ˈɔːtəɡrɑːf | ˈɔːtəɡræf | автограф | a famous person's signature | Fans waited for hours to get her *autograph*. | Фанаты часами ждали её автографа.
- beat | n | biːt |  | ритм, удар | a regular sound or rhythm | You can dance to the *beat*. | Под этот ритм можно танцевать.
- chapter | n | ˈtʃæptə | ˈtʃæptər | глава | a section of a book | I read the first *chapter* on the plane. | Я прочитал первую главу в самолёте.
- comic | adj | ˈkɒmɪk | ˈkɑːmɪk | комический, смешной | funny | The film has some *comic* moments. | В фильме есть комичные моменты. | сущ. comic — комикс
- flute | n | fluːt |  | флейта | a musical instrument you blow across | She plays the *flute* in an orchestra. | Она играет на флейте в оркестре.
- haunt | v | hɔːnt |  | являться (о призраке); преследовать | to appear as a ghost; to keep coming back to your mind | People say a ghost *haunts* the castle. | Говорят, в замке водится призрак.
- magic | n | ˈmædʒɪk |  | волшебство, магия; фокусы | the power to do impossible things; tricks | The children loved the *magic* show. | Детям очень понравилось шоу фокусов.
- musical | n | ˈmjuːzɪkl |  | мюзикл | a play or film with songs | We saw a *musical* in London. | Мы посмотрели мюзикл в Лондоне.
- photograph | v | ˈfəʊtəɡræf | ˈfoʊtəɡræf | фотографировать | to take a photo of | He loves to *photograph* wild animals. | Он любит фотографировать диких животных.
- picture | v | ˈpɪktʃə | ˈpɪktʃər | представлять себе | to imagine | I can't *picture* him as a teacher. | Не могу представить его учителем.
- science fiction | n | ˈsaɪəns ˈfɪkʃən |  | научная фантастика | stories about the future and science | She writes *science fiction*. | Она пишет научную фантастику. | сокр. sci-fi
- sound | adj | saʊnd |  | здравый, надёжный; крепкий (о сне) | sensible; deep (about sleep) | That's *sound* advice. | Это здравый совет.
- stage | v | steɪdʒ |  | ставить (спектакль), устраивать | to organise a play or event | The school *staged* a play. | Школа поставила спектакль.
- studio | n | ˈstjuːdɪəʊ | ˈstuːdiːoʊ | студия | a room where artists work or programmes are recorded | The band recorded the album in a *studio*. | Группа записала альбом в студии.
- talent | n | ˈtælənt |  | талант | a natural ability to do something well | She has a *talent* for languages. | У неё талант к языкам.
- thriller | n | ˈθrɪlə | ˈθrɪlər | триллер | an exciting film or book about crime | We watched a *thriller* last night. | Вчера вечером мы смотрели триллер.
- trumpet | n | ˈtrʌmpɪt | ˈtrʌmpət | труба (муз.) | a metal musical instrument you blow into | He plays the *trumpet* in a jazz band. | Он играет на трубе в джаз-бэнде.
- tune | n | tjuːn | tuːn | мелодия, мотив | a series of musical notes | She was humming a happy *tune*. | Она напевала весёлую мелодию.
- viewer | n | ˈvjuːə | ˈvjuːər | зритель (ТВ) | a person who watches TV | The show has millions of *viewers*. | У передачи миллионы зрителей.
- witch | n | wɪtʃ |  | ведьма | a woman in stories who has magic powers | The *witch* turned the prince into a frog. | Ведьма превратила принца в лягушку.
- wizard | n | ˈwɪzəd | ˈwɪzərd | волшебник, маг | a man who can do magic | The *wizard* turned the prince into a frog. | Волшебник превратил принца в лягушку.
