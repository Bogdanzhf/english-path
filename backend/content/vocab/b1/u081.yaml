title: Objects and materials
title_ru: Предметы и материалы
topic: objects
words:
- backpack | n | ˈbækpæk |  | рюкзак | a bag you carry on your back | Put the water in your *backpack*. | Положи воду в рюкзак.
- baggage | n | ˈbæɡɪdʒ | ˈbæɡədʒ | багаж | bags for travel | Collect your *baggage* at the carousel. | Получите багаж на ленте. | неисчисляемое
- basin | n | ˈbeɪsn |  | раковина, таз | a bowl for washing; a sink | Wash your hands in the *basin*. | Вымой руки в раковине.
- basket | n | ˈbɑːskɪt | ˈbæskɪt | корзина | a container made of thin pieces of wood or plastic | She carried a *basket* of apples. | Она несла корзину яблок.
- chain | n | tʃeɪn |  | цепь, цепочка; сеть (магазинов) | connected metal rings; a group of shops | She wore a gold *chain*. | Она носила золотую цепочку.
- coffin | n | ˈkɒfɪn | ˈkɔːfɪn | гроб | a box in which a dead person is buried | Six men carried the *coffin*. | Шестеро мужчин несли гроб.
- container | n | kənˈteɪnə | kənˈteɪnər | контейнер, ёмкость | a box or bottle for keeping things | Keep the sugar in an airtight *container*. | Храните сахар в герметичной ёмкости.
- dustbin | n | ˈdʌstbɪn |  | мусорный бак (брит.) | a large container for rubbish | Put the bag in the *dustbin*. | Выбрось пакет в мусорный бак. | амер. garbage can
- envelope | n | ˈenvələʊp | ˈenvəloʊp | конверт | a paper cover for a letter | Put the letter in an *envelope*. | Положи письмо в конверт.
- frame | n | freɪm |  | рамка, оправа | a border around a picture, window or glasses | She put the photo in a silver *frame*. | Она вставила фото в серебряную рамку.
- iron | n | ˈaɪən | ˈaɪərn | железо; утюг | a strong hard metal | The gate is made of *iron*. | Ворота сделаны из железа. | r не произносится в брит. варианте
- jar | n | dʒɑː | dʒɑːr | банка (стеклянная) | a glass container with a lid | She opened a *jar* of honey. | Она открыла банку мёда.
- jug | n | dʒʌɡ |  | кувшин | a container for pouring liquids | Bring a *jug* of water, please. | Принесите кувшин воды, пожалуйста.
- kit | n | kɪt |  | набор, комплект | a set of tools or things for a purpose | Every car should have a first-aid *kit*. | В каждой машине должна быть аптечка.
- mailbox | n | ˈmeɪlbɒks | ˈmeɪlbɑːks | почтовый ящик | a box for letters; an email inbox | I checked my *mailbox*. | Я проверил почтовый ящик.
- package | n | ˈpækɪdʒ | ˈpækədʒ | посылка, пакет | a parcel | A *package* arrived for you. | Тебе пришла посылка.
- parcel | n | ˈpɑːsl | ˈpɑːrsl | посылка | a package sent by post | A *parcel* of food arrives once a week. | Раз в неделю приходит посылка с едой. | амер. package
- pipe | n | paɪp |  | труба; трубка | a tube for water or gas; a tube for smoking | A water *pipe* burst. | Прорвало водопроводную трубу.
- powder | n | ˈpaʊdə | ˈpaʊdər | порошок | a dry substance made of many tiny pieces | Mix the *powder* with warm water. | Смешайте порошок с тёплой водой.
- purse | n | pɜːs | pɜːrs | кошелёк; сумочка (амер.) | a small bag for money | She took a coin out of her *purse*. | Она достала из кошелька монету.
- 'tape | n | teɪp |  | скотч, лента; кассета | a sticky strip; a strip for recording | Fix it with some *tape*. | Закрепи скотчем. | гл.: tape — записывать; приклеивать'
