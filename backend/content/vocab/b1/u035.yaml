title: Education
title_ru: Учёба
topic: education
words:
- academic | adj | ˌækəˈdemɪk |  | академический, научный | connected with schools, universities and study; following strict traditional rules | Her *academic* results were excellent. | У неё были отличные академические успехи.
- adverb | n | ˈædvɜːb | ˈædvərb | наречие | a word that describes a verb, like "quickly" | "Slowly" is an *adverb*. | «Slowly» — наречие.
- 'arithmetic | n | əˈrɪθmətɪk |  | арифметика | basic maths: adding, subtracting, etc. | She''s very quick at mental *arithmetic*. | Она очень быстро считает в уме.'
- diagram | n | ˈdaɪəɡræm |  | диаграмма, схема | a simple drawing that explains something | The *diagram* shows how the machine works. | Схема показывает, как работает машина.
- educate | v | ˈedʒuːkeɪt | ˈedʒəkeɪt | обучать, давать образование | to teach someone | She was *educated* in London. | Она получила образование в Лондоне.
- geometry | n | dʒiˈɒmətri | dʒiˈɑːmətri | геометрия | the mathematics of shapes and lines | The statues show an understanding of *geometry*. | Статуи свидетельствуют о понимании геометрии.
- graduate | v | ˈɡrædʒueɪt |  | оканчивать (вуз) | to finish a university degree | She *graduated* from art school in 2005. | Она окончила художественную школу в 2005 году. | сущ. graduate [-ət] — выпускник
- grammatical | adj | ɡrəˈmætɪkl | ɡrəˈmætəkl | грамматический | relating to grammar | The sentence has a *grammatical* error. | В предложении грамматическая ошибка.
- graph | n | ɡræf |  | график | a picture that shows numbers with lines | The *graph* shows rising prices. | График показывает рост цен.
- higher education | phr |  |  | высшее образование | education at a university | More young people go into *higher education* now. | Сейчас больше молодёжи получает высшее образование.
- participle | n | pɑːˈtɪsɪpl | ˈpɑːrtɪsɪpl | причастие | a form of a verb, like "going" or "gone" | "Written" is the past *participle* of "write". | «Written» — причастие прошедшего времени от «write».
- primary school | n | ˈpraɪməri skuːl | ˈpraɪmeri skuːl | начальная школа | a school for children aged 5–11 | My son goes to *primary school*. | Мой сын ходит в начальную школу. | амер. elementary school
- qualification | n | ˌkwɒlɪfɪˈkeɪʃən | ˌkwɑːləfəˈkeɪʃən | квалификация, диплом | an exam you have passed or a skill | What *qualifications* do you need for this job? | Какая квалификация нужна для этой работы?
- schoolmate | n | ˈskuːlmeɪt |  | школьный товарищ | a person at the same school | I met an old *schoolmate* yesterday. | Вчера я встретил старого школьного приятеля.
- secondary school | n | ˈsekəndəri skuːl | ˈsekənderi skuːl | средняя школа | a school for students aged 11–18 | She teaches at a *secondary school*. | Она преподаёт в средней школе.
- tech | n | tek |  | техника, технологии (разг.) | technology | He works in *tech*. | Он работает в айти.
