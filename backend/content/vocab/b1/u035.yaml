title: Work and jobs
title_ru: Работа и профессии
topic: work
words:
- captain | n | ˈkæptɪn |  | капитан | the person in charge of a ship, plane or team | The *captain* welcomed us on board. | Капитан приветствовал нас на борту.
- clerk | n | klɑːk | klɜːrk | служащий, клерк; продавец | a person who works in an office or a shop | The *clerk* at the bank was very polite. | Служащий в банке был очень вежлив.
- grocer | n | ˈɡrəʊsə | ˈɡroʊsər | бакалейщик, продавец продуктов | a person who sells food and things for the home | The *grocer* gave us fresh bread. | Продавец дал нам свежего хлеба. | groceries — продукты
- janitor | n | ˈdʒænɪtə | ˈdʒænɪtər | уборщик, вахтёр | a person who cleans and looks after a building (US) | The *janitor* locked the school at night. | Ночью сторож запирал школу. | брит. caretaker
- veterinarian | n | ˌvetərɪˈneəriən | ˌvetərɪˈneriən | ветеринар | a doctor for animals | Take the dog to the *veterinarian*. | Отведи собаку к ветеринару. | разг. vet
