reading:
  title: "The Volcano Project"
  title_ru: "Проект «Вулкан»"
  text: |
    Every year, our school has a science fair. Most students choose casual, easy projects, but my friend Omar and I wanted something exciting. "Let's build a volcano that really explodes," Omar said. I wasn't sure. "We have to use caution," I said. "We can't hurt anyone."

    Our teacher gave us a basic science kit and some advice. We used a small plastic barrel as the inside of the volcano and built the mountain around it with paper, glue and paint. To make it strong, we put a thin steel beam in the middle.

    The chemistry was simple. When you mix baking soda with vinegar, they react and produce gas. We added red food colouring to the vinegar and a little soap to make foam. We also added a few drops of orange oil, so the "lava" would have a nice scent instead of smelling like vinegar.

    On the day of the fair, we fastened our goggles and got ready. We anticipated a small eruption — maybe a few bubbles. But Omar, without telling me, had made a deliberate change: he'd doubled the amount of baking soda. When I poured in the vinegar, the result was swift and dramatic. With a loud puff, red foam exploded out of the top and scattered all over the table, the floor and the judges' shoes!

    For a moment, there was silence. Then the judges started to laugh. Contrary to our fears, they loved it. We quickly cleaned up with rags, and one judge tossed us a towel. In the end, we won first prize. It was a total triumph — and the cleanest our classroom floor has ever been, because no germ could survive all that vinegar!
  ru: |
    Каждый год в нашей школе проходит научная ярмарка. Большинство учеников выбирают простые, лёгкие проекты, но нам с другом Омаром хотелось чего-то захватывающего. «Давай построим вулкан, который по-настоящему извергается», — предложил Омар. Я сомневался. «Надо быть осторожными, — сказал я. — Мы не должны никого поранить».

    Учительница дала нам простой научный набор и несколько советов. Мы взяли маленький пластиковый бочонок для внутренней части вулкана и вокруг него построили гору из бумаги, клея и краски. Для прочности мы вставили в середину тонкую стальную балку.

    Химия была простой. Если смешать пищевую соду с уксусом, они вступают в реакцию и выделяют газ. Мы добавили в уксус красный пищевой краситель и немного мыла для пены. А ещё капнули апельсинового масла, чтобы «лава» приятно пахла, а не уксусом.

    В день ярмарки мы застегнули защитные очки и приготовились. Мы ожидали маленького извержения — может, несколько пузырьков. Но Омар, ничего мне не сказав, кое-что нарочно изменил: он удвоил количество соды. Когда я налил уксус, всё произошло быстро и эффектно. С громким хлопком красная пена вырвалась из жерла и разлетелась по столу, полу и ботинкам жюри!

    На мгновение повисла тишина. А потом судьи начали смеяться. Вопреки нашим страхам, им очень понравилось. Мы быстро убрали всё тряпками, а один из судей кинул нам полотенце. В итоге мы получили первый приз. Это был полный триумф — и наш пол в классе никогда ещё не был таким чистым, ведь ни один микроб не выжил бы после такого количества уксуса!
