title: Nature and weather
title_ru: Природа и погода
topic: nature
words:
- bay | n | beɪ |  | залив, бухта | an area of sea partly surrounded by land | We anchored the boat in a quiet *bay*. | Мы встали на якорь в тихой бухте.
- bush | n | bʊʃ |  | куст | a plant like a small tree with many branches | The cat was hiding in the *bushes*. | Кошка пряталась в кустах.
- canyon | n | ˈkænjən |  | каньон | a deep valley with steep sides | The river runs through a deep *canyon*. | Река течёт по глубокому каньону.
- chief | n | tʃiːf |  | вождь, начальник | the leader of a group | The *chief* of police spoke to the reporters. | Начальник полиции поговорил с журналистами.
- earthquake | n | ˈɜːθkweɪk | ˈɜːrθkweɪk | землетрясение | a sudden shaking of the ground | The *earthquake* destroyed thousands of homes. | Землетрясение разрушило тысячи домов.
- hurricane | n | ˈhʌrɪkən | ˈhɜːrəkeɪn | ураган | a very strong storm with violent wind | The *hurricane* destroyed hundreds of homes. | Ураган разрушил сотни домов.
- jungle | n | ˈdʒʌŋɡl |  | джунгли | a thick tropical forest | Tigers live in the *jungle*. | Тигры живут в джунглях.
- lightning | n | ˈlaɪtnɪŋ |  | молния | a flash of light in the sky during a storm | The tree was hit by *lightning*. | В дерево ударила молния.
- shade | n | ʃeɪd |  | тень (от солнца) | an area that is cooler because the sun can't reach it | Let's sit in the *shade* of that tree. | Давай сядем в тени того дерева. | shadow — тень (очертания)
- shell | n | ʃel |  | раковина, ракушка; скорлупа | the hard outer covering of an egg, nut or sea animal | We collected *shells* on the beach. | Мы собирали ракушки на пляже.
- shore | n | ʃɔː | ʃɔːr | берег | the land along the edge of a sea or lake | We walked along the *shore* of the lake. | Мы шли по берегу озера.
- soil | n | sɔɪl |  | почва | the top layer of the earth where plants grow | Tomatoes grow well in this *soil*. | Помидоры хорошо растут в этой почве.
- thunder | n | ˈθʌndə | ˈθʌndər | гром | the loud noise after lightning | We heard *thunder* in the distance. | Вдали прогремел гром.
- tornado | n | tɔːˈneɪdəʊ | tɔːrˈneɪdoʊ | торнадо, смерч | a violent spinning column of wind | A *tornado* destroyed several houses. | Смерч разрушил несколько домов.
