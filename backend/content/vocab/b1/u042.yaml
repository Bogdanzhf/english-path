title: Actions and movement
title_ru: Действия и движение
topic: actions
words:
- accustom | v | əˈkʌstəm |  | приучать | to make yourself or someone get used to something | It took me months to *accustom* myself to the cold. | Мне понадобились месяцы, чтобы привыкнуть к холоду. | be accustomed to — привыкнуть к
- attach | v | əˈtætʃ |  | прикреплять, прилагать | to fix or join one thing to another | I've *attached* the photos to the email. | Я прикрепил фотографии к письму.
- attract | v | əˈtrækt |  | привлекать | to make people or animals come to a place or feel interest | The festival *attracts* thousands of tourists. | Фестиваль привлекает тысячи туристов.
- 'bang | v | bæŋ |  | стукнуть, хлопнуть | to hit something hard with a loud noise | He *banged* the door. | Он хлопнул дверью. | сущ.: bang — грохот'
- 'block | v | blɒk | blɑːk | блокировать, загораживать | to stop something moving through | A fallen tree *blocked* the road. | Упавшее дерево перегородило дорогу. | сущ.: block — квартал'
- bump | v | bʌmp |  | ударяться, натыкаться | to hit something by accident | I *bumped* my head on the shelf. | Я ударился головой о полку. | bump into somebody — случайно встретить
- bust | v | bʌst |  | сломать (разг.); поймать (полиция) | to break; to arrest | He *bust* his phone. | Он разбил телефон.
- fetch | v | fetʃ |  | сходить и принести | to go and bring something | Can you *fetch* my glasses? | Можешь принести мои очки?
- gather | v | ˈɡæðə | ˈɡæðər | собирать(ся) | to come together in a group; to collect | A crowd *gathered* in the square. | На площади собралась толпа.
- impair | v | ɪmˈpeə | ɪmˈper | ухудшать, ослаблять | to damage or weaken | Lack of oxygen *impairs* judgement. | Недостаток кислорода ухудшает способность здраво рассуждать.
- lay | v | leɪ |  | класть, укладывать | to put something down carefully in a flat position | She *laid* the baby on the bed. | Она уложила малыша на кровать. | lay — laid — laid; не путайте с lie — лежать
- paralyse | v | ˈpærəlaɪz | pˈærəlaɪz | парализовать | to make someone unable to move | The accident *paralysed* his legs. | После аварии у него парализовало ноги. | амер. paralyze
- 'pin | n | pɪn |  | булавка; пин-код | a thin piece of metal with a sharp point | Enter your *PIN* number. | Введите пин-код. | гл.: pin — прикалывать'
- ruin | v | ˈruːɪn |  | губить, портить | to damage something so badly it is destroyed | The rain *ruined* our holiday. | Дождь испортил нам отпуск. | сущ. ruins — руины
- spill | v | spɪl |  | проливать, рассыпать | to make a liquid fall out by accident | Be careful not to *spill* your coffee. | Осторожно, не пролей кофе.
- spread | v | spred |  | распространяться; намазывать | to cover a bigger area, or to put a soft food on something | The news *spread* quickly through the village. | Новость быстро разнеслась по деревне. | spread — spread — spread
- 'stick | v | stɪk |  | клеить, прилеплять; застревать | to attach with glue; to become fixed | *Stick* the photo in the album. | Вклей фотографию в альбом. | stick – stuck – stuck; сущ.: палка'
- undo | v | ʌnˈduː | ənˈduː | расстёгивать, развязывать; отменять | to open; to remove the effect of | Can you *undo* this button? | Можешь расстегнуть эту пуговицу?
- wither | v | ˈwɪðə | ˈwɪðər | вянуть, засыхать | to become dry and die | The flowers *withered* in the heat. | Цветы завяли от жары.
