title: Communication and language
title_ru: Общение и язык
topic: communication
words:
- advise | v | ədˈvaɪz |  | советовать | to tell someone what you think they should do | The doctor *advised* me to rest. | Врач посоветовал мне отдохнуть. | сущ. advice [ədˈvaɪs] — совет
- announce | v | əˈnaʊns |  | объявлять | to tell people something officially | The pilot *announced* that we were landing. | Пилот объявил, что мы идём на посадку.
- convince | v | kənˈvɪns |  | убеждать | to make someone believe something is true | She *convinced* me that I was wrong. | Она убедила меня, что я неправ.
- criticize | v | ˈkrɪtɪsaɪz |  | критиковать | to say what is bad about someone or something | He always *criticizes* my cooking. | Он вечно критикует мою стряпню. | брит. criticise
- dedicate | v | ˈdedɪkeɪt |  | посвящать | to give your time and energy to something | He *dedicated* his life to fighting poverty. | Он посвятил жизнь борьбе с бедностью.
- forbid | v | fəˈbɪd | fərˈbɪd | запрещать | to order someone not to do something | Her parents *forbade* her to go. | Родители запретили ей ехать. | forbid — forbade — forbidden
- indicate | v | ˈɪndɪkeɪt |  | указывать, свидетельствовать | to show or suggest something | Studies *indicate* that sleep is vital for memory. | Исследования показывают, что сон жизненно важен для памяти.
- investigate | v | ɪnˈvestɪɡeɪt |  | расследовать, исследовать | to try to find out the truth about something | The police are *investigating* the robbery. | Полиция расследует ограбление.
- narrate | v | nəˈreɪt |  | повествовать, рассказывать | to tell a story; to speak the words in a film | The documentary is *narrated* by a famous actor. | Текст в документальном фильме читает известный актёр. | narrator — рассказчик
- oppose | v | əˈpəʊz | əˈpoʊz | выступать против | to disagree with a plan and try to stop it | Many people *opposed* the new road. | Многие выступали против новой дороги. | be opposed to
- revise | v | rɪˈvaɪz |  | пересматривать | to change your opinion or plan | Scientists had to *revise* their theories. | Учёным пришлось пересмотреть свои теории. | брит. также повторять к экзамену
- scold | v | skəʊld | skoʊld | ругать, отчитывать | to speak angrily to someone who did something wrong | Mum *scolded* me for coming home late. | Мама отругала меня за то, что я поздно пришёл.
- volunteer | v | ˌvɒlənˈtɪə | ˌvɑːlənˈtɪr | вызываться добровольно | to offer to do something without being paid or asked | She *volunteered* to help at the hospital. | Она вызвалась помогать в больнице.
- warn | v | wɔːn | wɔːrn | предупреждать | to tell someone about possible danger | Doctors *warn* that touring can damage your health. | Врачи предупреждают, что гастроли могут навредить здоровью.
