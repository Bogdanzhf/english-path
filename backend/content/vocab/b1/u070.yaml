title: Everyday phrases
title_ru: Разговорные фразы
topic: phrases
words:
- manage to do something | phr |  |  | суметь, справиться | to succeed in doing something difficult | I *managed to* finish on time. | Мне удалось закончить вовремя.
- mean to do something | phr |  |  | собираться, намереваться | to intend | I didn't *mean to* hurt you. | Я не хотел тебя обидеть.
- more and more | phr |  |  | всё больше и больше | increasingly | *More and more* people work from home. | Всё больше людей работают из дома.
- move on | phr |  |  | двигаться дальше, переходить | to go to a new place or topic | Let's *move on* to the next question. | Перейдём к следующему вопросу.
- no longer | phr |  |  | больше не | not any more | He *no longer* lives here. | Он здесь больше не живёт.
- no more than... | phr |  |  | не больше чем, всего лишь | only | It takes *no more than* five minutes. | Это займёт не больше пяти минут.
- not even | phr |  |  | даже не | used for emphasis | He didn't *even* say goodbye. | Он даже не попрощался.
- not necessarily | phr |  |  | не обязательно | possibly not | Is the expensive one better? — *Not necessarily*. | Дорогой лучше? — Не обязательно.
- not only | phr |  |  | не только | used with "but also" | She speaks *not only* English but also French. | Она говорит не только по-английски, но и по-французски.
- on a regular basis | phr |  |  | регулярно | regularly | We meet *on a regular basis*. | Мы регулярно встречаемся.
- on my own | phr |  |  | сам, в одиночку | alone; without help | I live *on my own*. | Я живу один.
- on the street | phr |  |  | на улице | in a public road | I met him *on the street*. | Я встретил его на улице.
- on the way | phr |  |  | по дороге, в пути | while travelling | I'll buy bread *on the way* home. | Куплю хлеб по дороге домой.
- or something | phr |  |  | или что-то вроде того | used when you are not sure | Let's get a pizza *or something*. | Давай возьмём пиццу или что-нибудь такое.
- or two | phr |  |  | или два, пару | approximately one | Wait a minute *or two*. | Подожди минуту-другую.
- out there | phr |  |  | там, в мире | in the world | There are a lot of good people *out there*. | В мире много хороших людей.
- over the years | phr |  |  | за эти годы, с годами | during many years | The town has changed *over the years*. | За эти годы город изменился.
- over time | phr |  |  | со временем | gradually | Your English will improve *over time*. | Со временем твой английский улучшится.
- participate in something | phr |  |  | участвовать в | to take part in | All students must *participate in* the project. | Все студенты должны участвовать в проекте.
