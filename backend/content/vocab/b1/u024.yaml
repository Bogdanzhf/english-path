title: Travel and transport
title_ru: Путешествия и транспорт
topic: travel
words:
- access | n | ˈækses |  | доступ | the right or chance to use or see something | Only staff have *access* to this room. | Доступ в эту комнату есть только у сотрудников.
- agency | n | ˈeɪdʒənsi |  | агентство | a business that provides a service | We booked the trip through a travel *agency*. | Мы забронировали поездку через турагентство.
- arrival | n | əˈraɪvl |  | прибытие | getting to a place | The *arrival* of the plane was delayed. | Прибытие самолёта задержалось.
