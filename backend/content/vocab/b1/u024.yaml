- check-in counter | n |  |  | стойка регистрации | the place where you register at an airport | Go to the *check-in counter* two hours early. | Подойдите к стойке регистрации за два часа.
- check-in desk | n |  |  | стойка регистрации | the place in an airport or hotel where you check in | There was a long queue at the *check-in desk*. | У стойки регистрации была длинная очередь.
- crossing | n | ˈkrɒsɪŋ | ˈkrɔːsɪŋ | переход; переправа | a place where you can cross a road or river | Use the pedestrian *crossing*. | Пользуйтесь пешеходным переходом.
- customs | n | ˈkʌstəmz |  | таможня | the place at a border where bags are checked | We went through *customs* quickly. | Мы быстро прошли таможню.
- delay | v | dɪˈleɪ |  | откладывать, задерживать | to make something happen later | Our flight was *delayed* by two hours. | Наш рейс задержали на два часа. | сущ. delay — задержка
- departure | n | dɪˈpɑːtʃə | dɪˈpɑːrtʃər | отъезд, отправление | the act of leaving | Our *departure* was delayed by two hours. | Наш вылет задержали на два часа. | departures — зал вылета
- destination | n | ˌdestɪˈneɪʃn |  | пункт назначения | the place where someone is going | We reached our *destination* at midnight. | Мы добрались до места назначения в полночь.
- expedition | n | ˌekspəˈdɪʃn |  | экспедиция | a long journey to explore a place | They went on an *expedition* to the Arctic. | Они отправились в экспедицию в Арктику.
- fare | n | feə | fer | плата за проезд | the money you pay for a trip by bus, train or taxi | The bus *fare* is two dollars. | Проезд в автобусе стоит два доллара.
- fee | n | fiː |  | плата, взнос | money paid for a service | The entrance *fee* is ten euros. | Входная плата — десять евро.
- paddle | v | ˈpædl |  | грести (веслом) | to move a small boat with a short oar | We *paddled* the canoe across the lake. | Мы переплыли озеро на каноэ.
- railroad | n | ˈreɪlrəʊd | ˈreɪlroʊd | железная дорога (амер.) | a railway | The town grew after the *railroad* was built. | Город вырос после постройки железной дороги.
- route | n | ruːt | ruːt, raʊt | маршрут | the way from one place to another | Which *route* is the fastest? | Какой маршрут самый быстрый?
- runway | n | ˈrʌnweɪ |  | взлётно-посадочная полоса | a long road where planes land and take off | The plane is waiting on the *runway*. | Самолёт ждёт на взлётной полосе.
- safari | n | səˈfɑːri |  | сафари | a trip to see wild animals in Africa | We went on *safari* in Kenya. | Мы ездили на сафари в Кению.
- takeoff | n | ˈteɪkɒf | ˈteɪkɔːf | взлёт | the moment when a plane leaves the ground | Turn off your phones before *takeoff*. | Выключите телефоны перед взлётом.
- voyage | n | ˈvɔɪɪdʒ |  | путешествие (морское) | a long journey, especially by sea | The *voyage* across the Atlantic took six weeks. | Плавание через Атлантику заняло шесть недель.
reading:
  title: The Ghost Ship
  title_ru: Корабль-призрак
  text: |
    In 1872, a British vessel was crossing the Atlantic when its sailors saw a strange ship drifting in the waves. Nobody was on deck. The captain sent three men to look. When they climbed aboard, they found something that would startle the world: the ship, called the Mary Celeste, was completely empty.

    The ship had left the port of New York a month earlier with ten people aboard, including the captain, his wife and their little daughter. Now everyone had vanished. Their food and water were still there. Their clothes were dry and tidy. There was no sign of a fight — no blood, no bullets. Only the small lifeboat was missing.

    The sailors took the ship to the harbour of Gibraltar, where officials tried to understand what had happened. Some people believed the crew had stolen the cargo — barrels of alcohol — and escaped. But nothing was taken. Others had wilder ideas. Sailors said a sea monster or even the devil had taken the crew. Some people who worshipped the old sea gods said the ocean had punished them.

    Today, scientists have a more sensible theory. Nine of the barrels were empty, and alcohol can leak and produce gas. Perhaps the captain smelled it and feared an explosion. That fear might have been the trigger for leaving the ship. Everyone got into the lifeboat, sweating and frightened, and planned to wait nearby. But the rope broke, and the ship sailed away without them.

    Nobody knows for sure. The voyage of the Mary Celeste remains one of the greatest mysteries of the sea, and the bitter truth is that we may never learn what happened.
  ru: |
    В 1872 году британское судно пересекало Атлантику, когда моряки заметили странный корабль, дрейфовавший по волнам. На палубе никого не было. Капитан отправил троих людей посмотреть. Поднявшись на борт, они обнаружили то, что потрясёт весь мир: корабль под названием «Мэри Селест» был совершенно пуст.

    Месяцем раньше корабль вышел из порта Нью-Йорка с десятью людьми на борту, среди которых были капитан, его жена и их маленькая дочь. Теперь все исчезли. Еда и вода оставались на месте. Одежда была сухой и аккуратно сложенной. Никаких следов борьбы — ни крови, ни пуль. Не хватало только маленькой спасательной шлюпки.

    Моряки привели корабль в гавань Гибралтара, где власти пытались понять, что произошло. Некоторые считали, что экипаж украл груз — бочки со спиртом — и сбежал. Но ничего не пропало. У других были идеи пофантастичнее. Моряки говорили, что команду забрало морское чудовище или даже сам дьявол. Те, кто поклонялся древним морским богам, утверждали, что экипаж наказал океан.

    Сегодня у учёных есть более здравая версия. Девять бочек оказались пустыми, а спирт может протекать и выделять пары. Возможно, капитан почувствовал запах и испугался взрыва. Этот страх и мог стать причиной, по которой все покинули корабль. Люди сели в шлюпку, обливаясь потом от страха, и собирались переждать рядом. Но верёвка оборвалась, и корабль уплыл без них.

    Никто не знает наверняка. Плавание «Мэри Селест» остаётся одной из величайших загадок моря, и горькая правда в том, что мы, возможно, никогда не узнаем, что случилось.
  questions:
  - q: What did the sailors find on the Mary Celeste?
    options:
    - Dead bodies
    - Nobody at all
    - Pirates
    - A sea monster
    answer: 1
  - q: What was missing from the ship?
    options:
    - The food
    - The lifeboat
    - The cargo
    - The captain's clothes
    answer: 1
  - q: What do scientists think may have caused the crew to leave?
    options:
    - A storm
    - Fear of an explosion from alcohol gas
    - A fight
    - Illness
    answer: 1
  - tf: There were signs of a violent fight on the ship.
    answer: false
  - tf: The mystery has never been completely solved.
    answer: true
