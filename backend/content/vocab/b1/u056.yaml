title: 'How and how much: adverbs'
title_ru: 'Как и насколько: наречия'
topic: manner
words:
- afterward | adv | ˈɑːftəwəd | ˈæftərwərd | потом, впоследствии (амер.) | later | We had dinner and *afterward* went for a walk. | Мы поужинали, а потом пошли гулять. | брит. afterwards
- beautifully | adv | ˈbjuːtɪfəli | ˈbjuːtəfli | красиво, прекрасно | in a beautiful way | She sings *beautifully*. | Она прекрасно поёт.
- continuously | adv | kənˈtɪnjuːəsli |  | непрерывно | without stopping | It rained *continuously* for three days. | Три дня без перерыва шёл дождь.
- 'farther | adv | ˈfɑːðə | ˈfɑːrðər | дальше | at a greater distance | I can''t walk any *farther*. | Я не могу идти дальше. | синоним: further'
- firstly | adv | ˈfɜːstli | ˈfɜːrstli | во-первых | used to introduce the first point | *Firstly*, I'd like to thank everyone. | Во-первых, я хочу поблагодарить всех.
- formally | adv | ˈfɔːməli | ˈfɔːrməli | официально; формально | in a formal way | The new school was *formally* opened. | Новая школа была официально открыта.
- illegally | adv | ɪˈliːɡəli | ˌɪˈliːɡəli | незаконно | against the law | The car was parked *illegally*. | Машина была припаркована в неположенном месте.
- indirectly | adv | ɪndaɪˈrektli | ˌɪndəˈrektliː | косвенно | not directly | The new law will *indirectly* affect prices. | Новый закон косвенно повлияет на цены.
- intentionally | adv | ɪnˈtenʃənəli | ˌɪnˈtenʃənəli | намеренно | on purpose | I didn't hurt you *intentionally*. | Я не хотел сделать тебе больно.
- internationally | adv | ˌɪntəˈnæʃənəli | ˌɪnərˈnæʃənəli | на международном уровне | in many countries | She's an *internationally* famous singer. | Она певица с мировой известностью.
- lightly | adv | ˈlaɪtli |  | слегка, легко | gently; not much | She touched his arm *lightly*. | Она слегка коснулась его руки.
- positively | adv | ˈpɒzɪtɪvli | ˈpɑːzətɪvli | положительно; определённо | in a positive way | Try to think *positively*. | Старайся мыслить позитивно.
- secondly | adv | ˈsekəndli |  | во-вторых | used to introduce the second point | *Secondly*, we need more money. | Во-вторых, нам нужно больше денег.
- secretly | adv | ˈsiːkrətli | ˈsiːkrɪtli | тайно, втайне | without others knowing | She was *secretly* happy. | Втайне она была рада.
- socially | adv | ˈsəʊʃəli | ˈsoʊʃəli | социально; в обществе | in a social way | We meet *socially* at weekends. | По выходным мы видимся в неформальной обстановке.
- specially | adv | ˈspeʃəli |  | специально; особенно | for a particular purpose | I made this cake *specially* for you. | Я испекла этот торт специально для тебя.
- tightly | adv | ˈtaɪtli |  | крепко, туго | firmly | Hold my hand *tightly*. | Держи меня крепко за руку.
- unusually | adv | ʌˈnjuːʒuːəli | ənˈjuːʒuːəli | необычно | more than is usual | It was *unusually* warm for March. | Для марта было необычно тепло.
