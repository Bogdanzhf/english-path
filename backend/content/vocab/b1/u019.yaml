title: Numbers and quantity
title_ru: Числа и количество
topic: numbers
words:
- Celsius | n | ˈselsiəs |  | Цельсий | a scale for measuring temperature, where water freezes at 0° | Water boils at 100 degrees *Celsius*. | Вода кипит при 100 градусах Цельсия.
- diameter | n | daɪˈæmɪtə | daɪˈæmɪtər | диаметр | the length of a straight line through the centre of a circle | The pizza is 30 centimetres in *diameter*. | Диаметр пиццы — 30 сантиметров.
- Fahrenheit | n | ˈfærənhaɪt |  | Фаренгейт | a temperature scale where water freezes at 32° | The temperature reached 120 degrees *Fahrenheit*. | Температура достигала 120 градусов по Фаренгейту.
- percent | n | pəˈsent | pərˈsent | процент | one part in every hundred (%) | Forty *percent* of the world's languages are endangered. | Сорок процентов языков мира находятся под угрозой. | брит. часто per cent
- statistic | n | stəˈtɪstɪk |  | статистика, статистические данные | a number that shows a fact | *Statistics* show that more people live alone now. | Статистика показывает, что теперь больше людей живёт в одиночестве.
