title: Environment and energy
title_ru: Экология и энергия
topic: environment
words:
- coal | n | kəʊl | koʊl | уголь | a hard black material that is burned for heat | They heated the house with *coal*. | Они отапливали дом углём.
- ecology | n | iˈkɒlədʒi | iˈkɑːlədʒi | экология | the study of how living things relate to their environment | She is studying the *ecology* of rivers. | Она изучает экологию рек.
- energy | n | ˈenədʒi | ˈenərdʒi | энергия, силы | the strength to do things; power for machines | Fake news spreads with incredible *energy*. | Фейки распространяются с невероятной энергией.
- environment | n | ɪnˈvaɪrənmənt |  | окружающая среда; обстановка | the air, water and land around us; the place where you live or work | We must protect the *environment*. | Мы должны защищать окружающую среду.
- extinction | n | ɪkˈstɪŋkʃn |  | вымирание, исчезновение | the situation when a species or language no longer exists | Many animals face *extinction*. | Многим животным грозит вымирание. | extinct — вымерший
- flood | n | flʌd |  | наводнение | a large amount of water covering land that is usually dry | The *flood* destroyed many farms. | Наводнение уничтожило много ферм. | oo читается как «а»
- fuel | n | ˈfjuːəl |  | топливо | something that is burned to make heat or power | The car ran out of *fuel*. | В машине кончилось топливо.
- pollutant | n | pəˈluːtənt |  | загрязняющее вещество | a substance that makes air, water or soil dirty | Factories release *pollutants* into the river. | Заводы сбрасывают загрязняющие вещества в реку.
- resource | n | rɪˈzɔːs | ˈriːsɔːrs | ресурс | something useful, like money, people or materials | The police lacked the *resources* to investigate. | У полиции не хватало ресурсов для расследования.
- supply | v | səˈplaɪ |  | снабжать, поставлять | to provide something that is needed | The army *supplied* the troops with food. | Армия снабжала войска продовольствием. | сущ. supplies — запасы
- waste | v | weɪst |  | тратить впустую | to use more of something than you need, or use it badly | Don't *waste* water when you brush your teeth. | Не трать воду зря, когда чистишь зубы. | сущ. waste — отходы; a waste of time
