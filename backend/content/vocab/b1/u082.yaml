title: 'Describing: qualities'
title_ru: 'Описание: свойства и признаки'
topic: describing
words:
- animated | adj | ˈænɪmeɪtɪd | ˈænəmeɪtɪd | мультипликационный; оживлённый | made as a cartoon; lively | We watched an *animated* film. | Мы посмотрели мультфильм.
- automatic | adj | ˌɔːtəˈmætɪk |  | автоматический | working by itself | The doors are *automatic*. | Двери автоматические.
- current | n | ˈkʌrənt | ˈkɜːrənt | течение; ток | a continuous movement of water, air or electricity | The *current* carried the boat out to sea. | Течение унесло лодку в море.
- faint | adj | feɪnt |  | слабый, едва различимый | not strong or clear | There was a *faint* smell of smoke. | Чувствовался слабый запах дыма. | гл. faint — падать в обморок
- festive | adj | ˈfestɪv |  | праздничный | happy and connected with a celebration | The city was in a *festive* mood. | В городе царило праздничное настроение.
- forbidden | adj | fəˈbɪdn | ˈfɔːrbɪdn | запрещённый | not allowed | Smoking is *forbidden* here. | Курить здесь запрещено.
- former | adj | ˈfɔːmə | ˈfɔːrmər | бывший, прежний | in the past, but not now | My *former* boss now works in London. | Мой бывший начальник сейчас работает в Лондоне.
- heavenly | adj | ˈhevənli |  | небесный; божественный | very pleasant | The cake tasted *heavenly*. | Торт был божественный.
- long-term | adj | ˈlɔːŋˈtɜːm | ˈlɔːŋˈtɜːrm | долгосрочный | lasting a long time | We need a *long-term* plan. | Нам нужен долгосрочный план.
- motionless | adj | ˈməʊʃənləs | ˈmoʊʃənləs | неподвижный | not moving | The cat sat *motionless*. | Кошка сидела неподвижно.
- out-of-date | adj | ˌaʊt əv ˈdeɪt |  | устаревший, просроченный | old; no longer valid | This map is *out-of-date*. | Эта карта устарела.
- post-war | adj | ˈpəʊstwɔː | ˈpoʊstˈwɔːr | послевоенный | after a war | They grew up in *post-war* Britain. | Они выросли в послевоенной Британии.
- pretend | v | prɪˈtend |  | притворяться | to act as if something is true when it is not | He *pretended* to be asleep. | Он притворился спящим.
- previous | adj | ˈpriːviəs |  | предыдущий | happening before | The *previous* owner left the house in a mess. | Прежний хозяин оставил дом в беспорядке.
- primitive | adj | ˈprɪmətɪv |  | примитивный, первобытный | very simple; belonging to an early stage of development | They used *primitive* tools. | Они пользовались примитивными орудиями.
- remote | adj | rɪˈməʊt | rɪˈmoʊt | отдалённый | far from towns and people | They live in a *remote* village in the mountains. | Они живут в отдалённой горной деревне. | remote control — пульт
- second-hand | adj | ˈsekəndhænd |  | подержанный, б/у | owned before by someone else | I bought a *second-hand* car. | Я купил подержанную машину.
- shadowy | adj | ˈʃædəʊi | ˈʃædoʊi | тёмный, призрачный | dark; hard to see | A *shadowy* figure stood by the door. | У двери стояла смутная фигура.
- subconscious | adj | ˌsʌbˈkɒnʃəs | ˌsʌbˈkɑːnʃəs | подсознательный | existing in the mind without your being aware of it | Dreams may reveal *subconscious* fears. | Сны могут выдавать подсознательные страхи.
- up-to-date | adj | ˌʌp tə ˈdeɪt |  | современный, актуальный | modern; with the latest information | Keep your software *up-to-date*. | Обновляйте программы.
