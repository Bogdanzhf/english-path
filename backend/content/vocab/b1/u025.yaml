title: Travel and transport
title_ru: Путешествия и транспорт
topic: travel
words:
- aboard | prep | əˈbɔːd | əˈbɔːrd | на борту | on or onto a ship, plane or train | There were 300 passengers *aboard* the ship. | На борту корабля было 300 пассажиров. | All aboard! — Все на борт!
- agent | n | ˈeɪdʒənt |  | агент, представитель | a person who acts for another person or company | My *agent* found me a new job. | Мой агент нашёл мне новую работу.
- attraction | n | əˈtrækʃən |  | достопримечательность; привлекательность | an interesting place to visit; the feeling of liking someone | The castle is the town's main *attraction*. | Замок — главная достопримечательность города.
- automobile | n | ˈɔːtəməbiːl |  | автомобиль | a car (formal, especially American) | Henry Ford made the *automobile* affordable. | Генри Форд сделал автомобиль доступным.
- backpacking | n | ˈbækpækɪŋ |  | путешествие с рюкзаком | travelling cheaply with a backpack | They went *backpacking* across Europe. | Они путешествовали с рюкзаками по Европе.
- chariot | n | ˈtʃæriət | ˈtʃeriət | колесница | a two-wheeled vehicle pulled by horses in ancient times | Roman soldiers rode in *chariots*. | Римские воины ездили на колесницах.
- cruise | n | kruːz |  | круиз | a holiday on a large ship | We went on a Mediterranean *cruise*. | Мы отправились в круиз по Средиземному морю.
- ferry | n | ˈferi |  | паром | a boat that carries people and cars across water | We took the *ferry* to the island. | Мы поплыли на остров на пароме.
- helicopter | n | ˈhelɪkɒptə | ˈhelɪkɑːptər | вертолёт | an aircraft with large blades on top | The injured man was taken to hospital by *helicopter*. | Раненого доставили в больницу на вертолёте.
- identity card | n | aɪˈdentɪti kɑːd | aɪˈdentɪtiː kɑːrd | удостоверение личности | an official card that shows who you are | Bring your *identity card* to the exam. | Принесите на экзамен удостоверение личности.
- luggage | n | ˈlʌɡɪdʒ | ˈlʌɡədʒ | багаж | bags and suitcases for travel | How much *luggage* can I take? | Сколько багажа можно взять? | неисчисляемое; амер. baggage
- reservation | n | ˌrezəˈveɪʃən | ˌrezərˈveɪʃən | бронирование | an arrangement to keep a room, seat, etc. | I have a *reservation* for two nights. | У меня бронь на две ночи.
- souvenir | n | ˌsuːvəˈnɪə | ˌsuːvəˈnɪr | сувенир | something you keep to remember a place or event | I bought a mug as a *souvenir* of London. | Я купил кружку на память о Лондоне.
- submarine | n | ˌsʌbməˈriːn | ˈsʌbməriːn | подводная лодка | a ship that can travel under water | The *submarine* stayed under the sea for months. | Подводная лодка месяцами находилась под водой.
- transport | v | trænˈspɔːt | trænˈspɔːrt | перевозить, транспортировать | to move people or goods | The goods are *transported* by ship. | Товары перевозят морем.
- travel agent | n | ˈtrævl ˈeɪdʒənt |  | турагент | a person who arranges holidays | Our *travel agent* booked the hotel. | Наш турагент забронировал отель.
- turbulence | n | ˈtɜːbjʊləns | ˈtɜːrbjələns | турбулентность | sudden movements of air that shake a plane | We had some *turbulence* during the flight. | Во время полёта нас немного трясло.
- tyre | n | ˈtaɪə | taɪr | шина (брит.) | a rubber ring around a wheel | We had a flat *tyre*. | У нас спустило колесо. | амер. tire
- wagon | n | ˈwæɡən |  | повозка, тележка | a vehicle with four wheels for carrying things | The farmer loaded the hay onto the *wagon*. | Фермер погрузил сено на телегу.
- windscreen | n | ˈwɪndskriːn | wˈɪndskriːn | лобовое стекло (брит.) | the front window of a car | A stone cracked the *windscreen*. | Камень разбил лобовое стекло. | амер. windshield
