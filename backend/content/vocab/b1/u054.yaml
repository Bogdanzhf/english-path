title: Actions and movement
title_ru: Действия и движение
topic: actions
words:
- decorate | v | ˈdekəreɪt |  | украшать; делать ремонт (отделку) | to make something look attractive; to paint or wallpaper a room | We spent the summer *decorating* the house. | Мы всё лето делали ремонт в доме.
- enclose | v | ɪnˈkləʊz | ɪnˈkloʊz | вкладывать (в конверт); огораживать | to put something inside a letter; to surround | Please *enclose* a copy of your passport. | Пожалуйста, приложите копию паспорта.
- escape | v | ɪˈskeɪp |  | спасаться, сбегать | to get away from a dangerous place | Only a few sailors *escaped* from the sinking ship. | Лишь немногим морякам удалось спастись с тонущего корабля.
- expand | v | ɪkˈspænd |  | расширять(ся) | to become larger | The city *expanded* rapidly after the plague. | После чумы город быстро разросся.
- fasten | v | ˈfɑːsn | ˈfæsn | застёгивать, пристёгивать | to close or join something firmly | Please *fasten* your seat belts. | Пожалуйста, пристегните ремни. | t не читается
- flow | v | fləʊ | floʊ | течь | to move along slowly and steadily, like water | The river *flows* into the sea. | Река впадает в море.
- imitate | v | ˈɪmɪteɪt |  | подражать, имитировать | to copy the way someone speaks or behaves | Children *imitate* their parents. | Дети подражают родителям.
- lower | v | ˈləʊə | ˈloʊər | опускать, снижать | to move something down; to make something less | Please *lower* your voice — the baby is sleeping. | Пожалуйста, говори тише — малыш спит.
- March | v | mɑːtʃ | mɑːrtʃ | маршировать | to walk with regular steps like a soldier | The soldiers *marched* through the town. | Солдаты прошли маршем по городу.
