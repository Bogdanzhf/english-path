title: Communication and language
title_ru: Общение и язык
topic: communication
words:
- advert | n | ˈædvɜːt | ˈædvərt | реклама, объявление (брит.) | an advertisement | I saw an *advert* for the job in the paper. | Я увидел объявление о вакансии в газете.
- bilingual | adj | baɪˈlɪŋɡwəl |  | двуязычный | able to speak two languages very well | Their children are *bilingual* — they speak English and Spanish. | Их дети двуязычные — говорят по-английски и по-испански.
- comma | n | ˈkɒmə | ˈkɑːmə | запятая | the mark (,) | Put a *comma* after "however". | Поставь запятую после «however».
- communication | n | kəˌmjuːnɪˈkeɪʃən | kəmˌjuːnəˈkeɪʃən | общение, связь | sharing information | Good *communication* is important in a team. | Хорошая коммуникация важна в команде.
- complaint | n | kəmˈpleɪnt |  | жалоба | a statement that you are unhappy about something | We made a *complaint* about the noise. | Мы пожаловались на шум. | complain — жаловаться
- definite article | n | ˈdefɪnət ˈɑːtɪkl | ˈdefənət ˈɑːrtəkl | определённый артикль | the word "the" | "The" is the *definite article*. | «The» — определённый артикль.
- fluent | adj | ˈfluːənt |  | беглый, свободный (о речи) | able to speak a language easily and well | She's *fluent* in four languages. | Она свободно говорит на четырёх языках.
- giggle | n | ˈɡɪɡl |  | хихиканье | a silly laugh | The girls got the *giggles*. | Девочки захихикали.
- handshake | n | ˈhændʃeɪk |  | рукопожатие | shaking hands | He greeted me with a firm *handshake*. | Он поприветствовал меня крепким рукопожатием.
- idiom | n | ˈɪdiəm |  | идиома | a group of words with a meaning that is different from the meanings of each word | “It's raining cats and dogs” is a funny English *idiom*. | «It's raining cats and dogs» — забавная английская идиома (льёт как из ведра).
- indefinite article | n | ɪnˈdefɪnət ˈɑːtɪkl | ˌɪnˈdefənət ˈɑːrtəkl | неопределённый артикль | the word "a" or "an" | "A" is the *indefinite article*. | «A» — неопределённый артикль.
- postcard | n | ˈpəʊstkɑːd | ˈpoʊskɑːrd | открытка | a card you send without an envelope | I sent my mum a *postcard* from Rome. | Я отправил маме открытку из Рима.
- pronoun | n | ˈprəʊnaʊn | ˈproʊnaʊn | местоимение | a word like "he", "it" or "they" | "She" is a *pronoun*. | «She» — местоимение.
- proverb | n | ˈprɒvɜːb | ˈprɑːvərb | пословица | a short well-known saying | "Practice makes perfect" is a *proverb*. | «Повторение — мать учения» — это пословица.
- quotation | n | kwəʊˈteɪʃən | kwoʊˈteɪʃən | цитата; расценка | words taken from a book or speech | The essay starts with a *quotation*. | Сочинение начинается с цитаты.
- signpost | n | ˈsaɪnpəʊst | ˈsaɪnpoʊst | указатель | a sign showing directions | Follow the *signposts* to the beach. | Идите по указателям к пляжу.
- translate | v | trænˈsleɪt |  | переводить | to change words into another language | Can you *translate* this into English? | Можешь перевести это на английский?
- translation | n | trænˈsleɪʃən |  | перевод | translated text | I read the book in *translation*. | Я читал эту книгу в переводе.
- vowel | n | ˈvaʊəl |  | гласный звук (буква) | a sound like a, e, i, o, u | "A" and "o" are *vowels*. | «A» и «o» — гласные.
- warning | n | ˈwɔːnɪŋ | ˈwɔːrnɪŋ | предупреждение | something that tells you about danger | There's a storm *warning* for tonight. | На эту ночь объявлено штормовое предупреждение.
