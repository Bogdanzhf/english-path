title: Society and politics
title_ru: Общество и политика
topic: society
words:
- assist | v | əˈsɪst |  | помогать, содействовать | to help | Volunteers *assisted* the doctors. | Волонтёры помогали врачам. | assistance — помощь
- ban | v | bæn |  | запрещать | to officially say that something is not allowed | Smoking is *banned* in restaurants. | Курение в ресторанах запрещено. | сущ. ban — запрет
- commit | v | kəˈmɪt |  | совершать; брать обязательство | to do something wrong; to promise to do something | He *committed* a crime. | Он совершил преступление. | be committed to — быть преданным чему-то
- encourage | v | ɪnˈkʌrɪdʒ | ɪnˈkɜːrɪdʒ | поощрять, вдохновлять | to give someone support so that they want to do something | My teacher *encouraged* me to write stories. | Учительница поощряла меня писать рассказы.
- establish | v | ɪˈstæblɪʃ |  | устанавливать, основывать | to find out facts; to start something | Scientists have *established* that Venus once had water. | Учёные установили, что на Венере когда-то была вода.
- 'fool | n | fuːl |  | дурак | a stupid person | Don''t be a *fool*! | Не будь дураком! | гл.: fool — обманывать, дурачить'
- guard | v | ɡɑːd | ɡɑːrd | охранять, сторожить | to watch a place or person to keep them safe | Two soldiers *guard* the gate day and night. | Двое солдат охраняют ворота днём и ночью. | сущ. guard — охранник
- hire | v | ˈhaɪə | ˈhaɪər | нанимать; брать напрокат | to give someone a job; to pay to use something | The company *hired* three new engineers. | Компания наняла трёх новых инженеров.
- liberate | v | ˈlɪbəreɪt | ˈlɪbʌreɪt | освобождать | to make free | The city was *liberated* in 1944. | Город был освобождён в 1944 году.
- operate | v | ˈɒpəreɪt | ˈɑːpəreɪt | работать, действовать; управлять; оперировать | to work or be in action; to use a machine | The library *operates* 24 hours a day. | Библиотека работает круглосуточно.
- oppress | v | əˈpres |  | угнетать | to treat people cruelly and unfairly | Poverty *oppresses* millions of families. | Бедность угнетает миллионы семей.
- participate | v | pɑːˈtɪsɪpeɪt | pɑːrˈtɪsɪpeɪt | участвовать | to take part in something | Everyone *participated* in the discussion. | Все участвовали в обсуждении. | participate in
- persuade | v | pəˈsweɪd | pərˈsweɪd | убеждать, уговаривать | to make someone agree to do something | She *persuaded* me to come to the party. | Она уговорила меня прийти на вечеринку. | persuade somebody to do something
- 'poison | n | ˈpɔɪzən |  | яд | a substance that kills or harms | Rat *poison* is dangerous for children. | Крысиный яд опасен для детей. | гл.: poison — отравлять'
- promote | v | prəˈməʊt | prəˈmoʊt | продвигать, способствовать; повышать в должности | to help something develop; to give someone a higher job | The campaign *promotes* healthy eating. | Кампания пропагандирует здоровое питание.
- punish | v | ˈpʌnɪʃ |  | наказывать | to make someone suffer because they did something wrong | The teacher *punished* him for lying. | Учитель наказал его за ложь.
- pursue | v | pəˈsjuː | pərˈsuː | преследовать; добиваться | to follow someone; to try to achieve something | She decided to *pursue* a career in medicine. | Она решила построить карьеру в медицине.
- 'trick | n | trɪk |  | трюк, фокус; уловка | a clever action to deceive or entertain | He showed us a card *trick*. | Он показал нам карточный фокус. | гл.: trick — обманывать'
reading:
  title: The Lion Chamber
  title_ru: Зал львов
  text: |
    For more than a century, archaeologists believed they knew everything about the small pyramid near the village of Kerma. It was the tomb of a queen who had founded a powerful kingdom three thousand years ago. But in 2021, a young Sudanese archaeologist named Amira Hassan noticed something that everyone else had overlooked.

    While studying old photographs, she saw a distinct line on the surface of one of the walls. It looked like a gap between two stones. "Ancient builders engineered everything perfectly," she said. "A gap like this is not a mistake. It must be a door."

    Her team spent two months removing sand from the area. Finally, they found a narrow corridor that led deep into the core of the pyramid. At the end, a set of stone stairs went down to a hidden chamber. When they entered, their torches lit up an incredible interior. The walls were covered with paintings of the queen's royal life: her elite soldiers, her boats on the Nile channels, and the hundreds of acres of farmland she controlled.

    But the most amazing discovery was in the centre of the room: two stone lions, almost two metres tall, guarding a golden box. The ancient people believed that the queen needed protection in the afterlife, and lions played the role of guards.

    The discovery made Amira famous, but she does not care about personal glory. "My sole aim is to understand how people lived," she says. "Every object tells a story. We just have to learn how to listen."
  ru: |
    Больше века археологи считали, что знают всё о небольшой пирамиде возле деревни Керма. Это была гробница царицы, которая основала могущественное царство три тысячи лет назад. Но в 2021 году молодой суданский археолог Амира Хасан заметила то, что все остальные упустили.

    Изучая старые фотографии, она увидела отчётливую линию на поверхности одной из стен. Она была похожа на щель между двумя камнями. «Древние строители всё делали безупречно, — сказала она. — Такая щель — не ошибка. Это должна быть дверь».

    Её команда два месяца расчищала песок на этом участке. Наконец они нашли узкий коридор, ведущий в самое сердце пирамиды. В его конце каменная лестница спускалась в потайной зал. Когда они вошли, факелы осветили невероятное убранство. Стены были покрыты росписями о царской жизни царицы: её отборные воины, её лодки на нильских каналах и сотни акров пахотной земли, которыми она владела.

    Но самая удивительная находка была в центре зала: два каменных льва почти двухметровой высоты, охранявшие золотой ларец. Древние люди верили, что царице нужна защита в загробной жизни, и львы играли роль стражей.

    Открытие прославило Амиру, но личная слава её не волнует. «Моя единственная цель — понять, как жили люди, — говорит она. — Каждый предмет рассказывает историю. Нам просто нужно научиться слушать».
  questions:
  - q: What did Amira notice in the old photographs?
    options:
    - A painting of a lion
    - A line that looked like a gap between stones
    - A golden box
    - A broken stair
    answer: 1
  - q: Why did Amira think the gap was a door?
    options:
    - The villagers told her
    - Ancient builders didn't make mistakes like that
    - She found a key
    - It was on an old map
    answer: 1
  - q: What role did the stone lions play?
    options:
    - Decoration only
    - Guards for the queen in the afterlife
    - Symbols of the river
    - Gifts from another king
    answer: 1
  - tf: The team found the chamber in a few days.
    answer: false
  - tf: Amira says personal glory is not important to her.
    answer: true
