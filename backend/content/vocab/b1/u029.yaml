title: Work and jobs
title_ru: Работа и профессии
topic: work
words:
- application | n | ˌæplɪˈkeɪʃən | ˌæpləˈkeɪʃən | заявление; заявка; приложение | a formal request; a computer program | I sent my *application* last week. | Я отправил заявление на прошлой неделе.
- appointment | n | əˈpɔɪntmənt |  | приём, встреча (по записи) | an arranged meeting | I have a doctor's *appointment* at three. | В три у меня приём у врача.
- baker | n | ˈbeɪkə | ˈbeɪkər | пекарь | a person who bakes bread | The *baker* starts work at four in the morning. | Пекарь начинает работу в четыре утра.
- bonus | n | ˈbəʊnəs | ˈboʊnəs | премия, бонус | extra money for good work | All workers got a Christmas *bonus*. | Все работники получили рождественскую премию.
- builder | n | ˈbɪldə | ˈbɪldər | строитель | a person who builds houses | The *builders* finished the roof. | Строители закончили крышу.
- client | n | ˈklaɪənt |  | клиент | a person who pays for a service | The lawyer has a meeting with a new *client*. | У юриста встреча с новым клиентом.
- composer | n | kəmˈpəʊzə | kəmˈpoʊzər | композитор | a person who writes music | Mozart was a famous *composer*. | Моцарт был известным композитором.
- conference | n | ˈkɒnfrəns | ˈkɑːnfərəns | конференция | a large formal meeting | She spoke at an international *conference*. | Она выступила на международной конференции.
- cop | n | kɒp | kɑːp | коп, полицейский (разг.) | a police officer | The *cops* arrived quickly. | Копы приехали быстро.
- DJ | n | ˈdiˈdʒeɪ | ˈdiːˈdʒeɪ | диджей | a person who plays music at a club or on the radio | The *DJ* played great music. | Диджей ставил отличную музыку.
- employment | n | ɪmˈplɔɪmənt | emˈplɔɪmənt | занятость, трудоустройство; работа | having a paid job | He found *employment* in a bank. | Он устроился на работу в банк.
- management | n | ˈmænɪdʒmənt |  | контроль, управление | the process of controlling or dealing with something | Diet plays a big role in the *management* of diabetes. | Питание играет большую роль в контроле диабета.
- performer | n | pəˈfɔːmə | pərˈfɔːrmər | исполнитель, артист | a person who entertains an audience | The street *performers* were very talented. | Уличные артисты были очень талантливы.
- photographer | n | fəˈtɒɡrəfə | fəˈtɑːɡrəfər | фотограф | a person who takes photos | We hired a *photographer* for the wedding. | На свадьбу мы пригласили фотографа.
- priest | n | priːst |  | священник | a person who performs religious ceremonies | The *priest* married them in a small church. | Священник обвенчал их в маленькой церкви.
- producer | n | prəˈdjuːsə | prəˈduːsər | продюсер; производитель | a person who makes films or music; a company that makes goods | She's a TV *producer*. | Она телепродюсер.
- production | n | prəˈdʌkʃən | pərˈdʌkʃən | производство; постановка | making goods; a play or film | *Production* at the factory has increased. | Производство на заводе выросло.
- profession | n | prəˈfeʃn |  | профессия | a job that needs special training | Teaching is a difficult *profession*. | Преподавание — трудная профессия.
- psychologist | n | saɪˈkɒlədʒɪst | saɪˈkɑːlədʒəst | психолог | a person who studies the mind | She went to see a *psychologist*. | Она обратилась к психологу.
- publisher | n | ˈpʌblɪʃə | ˈpʌblɪʃər | издатель, издательство | a company that prints books | The *publisher* liked her novel. | Издательству понравился её роман.
- sheriff | n | ˈʃerɪf |  | шериф | an elected police officer in a US county | The *sheriff* arrested the thief. | Шериф арестовал вора.
- trainer | n | ˈtreɪnə | ˈtreɪnər | тренер; кроссовок (брит.) | a person who trains others; a sports shoe | My personal *trainer* is very strict. | Мой личный тренер очень строгий.
