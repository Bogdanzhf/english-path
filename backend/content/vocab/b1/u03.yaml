reading:
  title: "The Newcomer and the Shepherd"
  title_ru: "Приезжий и пастух"
  text: |
    When Daniel moved from the city to a small mountain village, the local people were not friendly. He was a newcomer, and they didn't trust him. He bought an old lodge that had been neglected for years. The roof was broken, and the garden was full of weeds. Everyone said it was ridiculous to pay so much money for it.

    Daniel didn't let them discourage him. He worked every day to repair the house. The only person who helped him was an old shepherd named Luka, who lived in a hut on the hill above the village. Luka taught him how to grow wheat and vegetables and how to look after animals. Slowly, Daniel acquired the skills he needed to live in the mountains.

    One autumn, a man in an expensive suit came to the village. He said he was from the government and that the villagers had to pay a new tax on their land. Many people were frightened. Some even started to show hatred towards Daniel, because they thought the man was his friend from the city.

    But Daniel had seen this kind of trick before. He looked closely at the man's documents and realized they were fake. "This is an offense," he said. "You are trying to deceive these people." The man ran to his car and left. Later, the police caught him in another village.

    The villagers felt awkward. They had treated Daniel as inferior, and he had saved their money. The next week, the village caretaker knocked on his door with a basket of food. "We want to repay you," he said. "Our welcome was not satisfactory. Please forgive us." Today, Daniel's lodge, which overlooks the whole valley, is the place where the villagers meet every Friday evening.
  ru: |
    Когда Дэниел переехал из города в маленькую горную деревню, местные жители встретили его недружелюбно. Он был приезжим, и ему не доверяли. Он купил старый домик, который годами стоял заброшенным. Крыша была сломана, а сад зарос сорняками. Все говорили, что платить за него столько денег — нелепо.

    Дэниел не позволил им себя обескуражить. Он каждый день работал, ремонтируя дом. Единственным, кто ему помогал, был старый пастух Лука, живший в хижине на холме над деревней. Лука научил его выращивать пшеницу и овощи и ухаживать за животными. Постепенно Дэниел приобрёл навыки, необходимые для жизни в горах.

    Однажды осенью в деревню приехал человек в дорогом костюме. Он сказал, что он из правительства и жители должны платить новый налог на землю. Многие испугались. Некоторые даже начали проявлять ненависть к Дэниелу, думая, что этот человек — его друг из города.

    Но Дэниел уже видел подобные уловки. Он внимательно посмотрел на документы мужчины и понял, что они поддельные. «Это преступление, — сказал он. — Вы пытаетесь обмануть этих людей». Мужчина бросился к машине и уехал. Позже полиция поймала его в другой деревне.

    Жителям стало неловко. Они считали Дэниела хуже себя, а он сберёг их деньги. На следующей неделе к нему постучал деревенский сторож с корзиной еды. «Мы хотим тебя отблагодарить, — сказал он. — Мы встретили тебя не лучшим образом. Пожалуйста, прости нас». Сегодня домик Дэниела, из которого видна вся долина, — место, где жители деревни собираются каждую пятницу вечером.
  questions:
    - q: "Why didn't the villagers trust Daniel?"
      options: ["He was rude", "He was a newcomer from the city", "He was a thief", "He didn't speak their language"]
      answer: 1
    - q: "Who helped Daniel learn to live in the mountains?"
      options: ["The caretaker", "An old shepherd", "The man from the government", "His family"]
      answer: 1
    - q: "What did Daniel notice about the man's documents?"
      options: ["They were old", "They were fake", "They were in another language", "They were lost"]
      answer: 1
    - tf: "The villagers apologized to Daniel."
      answer: true
    - tf: "The man from the city was Daniel's friend."
      answer: false
