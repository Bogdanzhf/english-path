title: 'Describing: same, different, true'
title_ru: 'Описание: сходство, точность, вероятность'
topic: describing
words:
- additional | adj | əˈdɪʃənl |  | дополнительный | extra | There is an *additional* charge for breakfast. | За завтрак взимается дополнительная плата.
- direct | v | daɪˈrekt |  | направлять; руководить; снимать (фильм) | to show the way; to manage; to make a film | Who *directed* this film? | Кто снял этот фильм?
- equal | adj | ˈiːkwəl |  | равный | the same in size, number, value or rights | Men and women should get *equal* pay for equal work. | Мужчины и женщины должны получать равную оплату за равный труд.
- familiar | adj | fəˈmɪliə | fəˈmɪliər | знакомый | known to you because you have seen or heard it before | Her face looks *familiar* — have we met before? | Её лицо кажется знакомым — мы раньше встречались?
- fixed | adj | fɪkst |  | фиксированный, неизменный | not changing | The price is *fixed*. | Цена фиксированная.
- logical | adj | ˈlɒdʒɪkl | ˈlɑːdʒɪkl | логичный | reasonable; following logic | That's a *logical* answer. | Это логичный ответ.
- "marked | adj | ˈm\x01ːkt | mɑːrkt | заметный, явный | clear and noticeable | There's been a *marked* improvement. | Наблюдается заметное улучшение."
- neither | conj | ˈnaɪðə | ˈniːðər | ни... ни; тоже не | not one and not the other | *Neither* my brother nor I can swim. | Ни я, ни мой брат не умеем плавать. | neither… nor…; Me neither — Я тоже нет
- nor | conj | nɔː | nɔːr | и не, ни | and not; used after neither or a negative | He didn't call, *nor* did he write. | Он не позвонил и не написал. | neither … nor — ни … ни
- odd | adj | ɒd | ɑːd | странный; нечётный | strange or unusual | It's *odd* that she didn't call. | Странно, что она не позвонила. | odd numbers — нечётные числа
- particular | adj | pəˈtɪkjələ | pərˈtɪkjələr | особый, конкретный; разборчивый | special or specific; difficult to please | This *particular* study involved 2,000 people. | В этом конкретном исследовании участвовали 2000 человек.
- potential | adj | pəˈtenʃl |  | потенциальный, возможный | possible in the future | This is a *potential* problem. | Это потенциальная проблема. | сущ. potential — потенциал
- rare | adj | reə | rer | редкий; с кровью (о мясе) | not common | This bird is very *rare*. | Эта птица очень редкая.
- related | adj | rɪˈleɪtɪd | ˌriːˈleɪtɪd | связанный; родственный | connected | Are you two *related*? | Вы родственники?
- select | v | sɪˈlekt |  | выбирать, отбирать | to choose carefully | *Select* the best tomatoes for the salad. | Выберите лучшие помидоры для салата.
- 'separate | v | ˈsepɜːeɪt | ˈsepəreɪt | разделять(ся); расставаться | to divide; to stop living together | Her parents *separated* last year. | Её родители разошлись в прошлом году. | прил.: separate — отдельный'
- standard | n | ˈstændəd | ˈstændərd | стандарт, уровень | a level of quality | The food here is of a very high *standard*. | Еда здесь очень высокого уровня.
- understanding | n | ˌʌndəˈstændɪŋ | ˌʌndərˈstændɪŋ | понимание | knowledge of how something works; sympathy | She has a good *understanding* of grammar. | Она хорошо разбирается в грамматике.
- unlike | prep | ʌnˈlaɪk |  | в отличие от | different from | *Unlike* her sister, she's very quiet. | В отличие от сестры, она очень тихая.
- unlikely | adj | ʌnˈlaɪkli | ənˈlaɪkli | маловероятный | not likely | It's *unlikely* to rain today. | Сегодня вряд ли будет дождь.
