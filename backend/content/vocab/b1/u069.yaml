title: Communication and language
title_ru: Общение и язык
topic: communication
words:
- blame | v | bleɪm |  | обвинять, винить | to say someone is responsible for something bad | Don't *blame* me — it wasn't my fault! | Не вини меня — я не виноват! | blame somebody for something
- claim | v | kleɪm |  | утверждать; заявлять права | to say that something is true, without proof | He *claims* that he saw a ghost. | Он утверждает, что видел привидение.
- 'contact | v | ˈkɒntækt | ˈkɑːntækt | связываться | to call, write to or speak to someone | Please *contact* us if you have any questions. | Свяжитесь с нами, если у вас есть вопросы. | без предлога: contact him'
- deliver | v | dɪˈlɪvə | dɪˈlɪvər | доставлять | to take something to a person or place | They *deliver* pizza until midnight. | Они доставляют пиццу до полуночи.
- ignore | v | ɪɡˈnɔː | ɪɡˈnɔːr | игнорировать | to pay no attention to someone or something | She *ignored* my message. | Она проигнорировала моё сообщение.
- quote | v | kwəʊt | kwoʊt | называть цену; цитировать | to give a price for a job; to repeat someone's words | The builder *quoted* us £2,000 for the work. | Строитель назвал нам цену за работу — 2000 фунтов.
