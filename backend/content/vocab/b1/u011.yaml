title: Home and everyday life
title_ru: Дом и быт
topic: home
words:
- attic | n | ˈætɪk |  | чердак | a room just under the roof of a house | Old toys were stored in the *attic*. | Старые игрушки хранились на чердаке.
- bench | n | bentʃ |  | скамейка | a long seat for several people | We sat on a *bench* in the park. | Мы сидели на скамейке в парке.
- chest of drawers | n | tʃest ɒv drɔːz | tʃest ʌv drɔːrz | комод | a piece of furniture with drawers | Put the socks in the *chest of drawers*. | Убери носки в комод.
- chore | n | tʃɔː | tʃɔːr | (рутинная) домашняя обязанность | a boring job you have to do regularly | Washing the dishes is my least favourite *chore*. | Мыть посуду — моя самая нелюбимая обязанность.
- closet | n | ˈklɒzɪt | ˈklɑːzət | шкаф, кладовка | a small room or cupboard for storing clothes | Hang your coat in the *closet*. | Повесь пальто в шкаф. | амер.; брит. wardrobe
- cottage | n | ˈkɒtɪdʒ | ˈkɑːtɪdʒ | коттедж, домик | a small house in the countryside | They rented a *cottage* by the lake. | Они сняли домик у озера.
- dishwasher | n | ˈdɪʃwɒʃə | ˈdɪʃwɑːʃər | посудомоечная машина | a machine that washes dishes | Put the plates in the *dishwasher*. | Положи тарелки в посудомойку.
- freezer | n | ˈfriːzə | ˈfriːzər | морозилка, морозильник | a machine that freezes food | There's ice cream in the *freezer*. | В морозилке есть мороженое.
- frying pan | n | ˈfraɪɪŋ pæn |  | сковорода | a flat pan for frying food | Heat some oil in a *frying pan*. | Разогрейте масло на сковороде.
- furnish | v | ˈfɜːnɪʃ | ˈfɜːrnɪʃ | обставлять (мебелью) | to put furniture in a room or house | The flat is fully *furnished*. | Квартира полностью меблирована.
- garage | n | ˈɡærɑːʒ | ɡəˈrɑːʒ | гараж; автомастерская | a building for keeping a car; a place where cars are repaired | He keeps his bike in the *garage*. | Он хранит велосипед в гараже.
- hairdryer | n | ˈheədraɪə | hˈeədraɪɐ | фен | a device for drying hair | Can I borrow your *hairdryer*? | Можно взять твой фен?
- housework | n | ˈhaʊswɜːk | ˈhaʊswɜːrk | работа по дому | cleaning, washing, cooking, etc. | We share the *housework*. | Мы делим домашние дела.
- ironing | n | ˈaɪənɪŋ | ˈaɪərnɪŋ | глажка | pressing clothes with an iron | I hate doing the *ironing*. | Терпеть не могу гладить.
- kettle | n | ˈketl |  | чайник | a container for boiling water | Put the *kettle* on. | Поставь чайник.
- mess | n | mes |  | беспорядок, бардак | a dirty or untidy state | Your room is a *mess*! | У тебя в комнате бардак!
- mixing bowl | n | ˈmɪksɪŋ bəʊl | ˈmɪksɪŋ boʊl | миска для смешивания | a large bowl used in cooking | Put the flour into a *mixing bowl*. | Высыпьте муку в миску.
- mow | v | məʊ | moʊ | косить, стричь (траву) | to cut grass with a machine | I *mow* the lawn every Saturday. | Я стригу газон каждую субботу. | lawnmower — газонокосилка
- pan | n | pæn |  | кастрюля; сковорода | a metal container for cooking | Boil the eggs in a small *pan*. | Сварите яйца в маленькой кастрюле.
- pot | n | pɒt | pɑːt | горшок, кастрюля | a deep round container for cooking or plants | She put the flowers in a big clay *pot*. | Она посадила цветы в большой глиняный горшок.
- property | n | ˈprɒpəti | ˈprɑːpərti | собственность, имущество; недвижимость | things that belong to someone; a building or land | This is private *property*. | Это частная собственность.
- rent | n | rent |  | арендная плата | money you pay to live in or use a place | The *rent* for this flat is very high. | Аренда этой квартиры очень высокая. | гл. rent — снимать
- saucepan | n | ˈsɔːspən | ˈsɔːspæn | кастрюля (с ручкой) | a deep pan with a handle | Heat the milk in a *saucepan*. | Подогрейте молоко в кастрюле.
- wardrobe | n | ˈwɔːdrəʊb | ˈwɔːrdroʊb | шкаф для одежды; гардероб | a tall cupboard for clothes; all the clothes a person has | The family hid behind a heavy *wardrobe*. | Семья спряталась за тяжёлым шкафом.
