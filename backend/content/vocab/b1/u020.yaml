title: Phrasal verbs
title_ru: Фразовые глаголы
topic: phrasal
words:
- break down | phv |  |  | ломаться; не выдержать, расплакаться | to stop working; to start crying | Our car *broke down* on the motorway. | Наша машина сломалась на трассе.
- call back | phv |  |  | перезвонить | to phone someone again | I'm busy — I'll *call back* later. | Я занят — перезвоню позже.
- come up with something | phv |  |  | придумать, предложить | to think of an idea | She *came up with* a great plan. | Она придумала отличный план.
- end up | phv |  |  | оказаться, в итоге (сделать) | to finally be in a place or situation | We *ended up* staying at home. | В итоге мы остались дома.
- figure out | phv | ˈfɪɡər aʊt | ˈfɪɡjər aʊt | понять, разобраться | to understand or solve something after thinking | I can't *figure out* how this machine works. | Не могу разобраться, как работает эта машина.
- get on with somebody | phv |  |  | ладить с | to have a good relationship with | I *get on with* my colleagues. | Я лажу с коллегами.
- give back | phv |  |  | возвращать, отдавать | to return something | Please *give back* my pen. | Пожалуйста, верни мою ручку.
- go on | phv |  |  | продолжать; происходить | to continue; to happen | What's *going on*? | Что происходит?
- hold on | phv |  |  | подождать (минуту); держаться | to wait; to hold something tightly | *Hold on*, I'll get a pen. | Подожди, я возьму ручку.
- look forward to something | phv |  |  | ждать с нетерпением | to feel happy about something that will happen | I'm *looking forward to* the holidays. | Жду не дождусь каникул. | после to — существительное или -ing
- make something up | phv |  |  | выдумывать, сочинять | to invent a story or excuse | He *made up* an excuse. | Он придумал отговорку.
- point out | phv |  |  | указывать, обращать внимание | to tell someone a fact | She *pointed out* a mistake in my work. | Она указала на ошибку в моей работе.
- put off | phv |  |  | откладывать | to delay doing something | Don't *put off* your homework. | Не откладывай домашнюю работу.
- run out of something | phv |  |  | закончиться (о запасах), исчерпать | to use all of something | We've *run out of* bread. | У нас закончился хлеб.
- set something up | phv |  |  | организовать, основать; установить | to start a business; to prepare equipment | They *set up* a small company. | Они открыли небольшую компанию.
- take something up | phv |  |  | начать заниматься (хобби) | to start a new activity | I've *taken up* yoga. | Я начал заниматься йогой.
- take something/somebody on | phv |  |  | брать на себя; нанимать | to accept work or responsibility; to employ | She *took on* too much work. | Она взяла на себя слишком много работы.
- take up something | phv |  |  | занимать (место, время) | to fill space or time | The sofa *takes up* too much space. | Диван занимает слишком много места.
- turn down | phv |  |  | отклонять; убавлять (звук) | to refuse; to make quieter | He *turned down* the job offer. | Он отказался от предложения о работе.
- turn out | phv |  |  | оказаться | to happen in a particular way | It *turned out* to be a great day. | День оказался отличным.
- work something out | phv |  |  | разобраться, вычислить; решить | to find the answer; to solve | I can't *work out* this problem. | Не могу решить эту задачу.
