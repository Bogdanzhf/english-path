- heater | n | ˈhiːtə | ˈhiːtər | обогреватель | a device that makes a room warm | Turn on the *heater*. | Включи обогреватель.
- heating | n | ˈhiːtɪŋ |  | отопление | a system for keeping a building warm | The *heating* doesn't work. | Отопление не работает.
- label | n | ˈleɪbl |  | этикетка, ярлык | a piece of paper on an object with information about it | Read the *label* before you take the medicine. | Прочитайте этикетку, прежде чем принимать лекарство.
- lighter | n | ˈlaɪtə | ˈlaɪtər | зажигалка | a small device for lighting cigarettes | Have you got a *lighter*? | У тебя есть зажигалка?
- needle | n | ˈniːdl |  | игла, иголка | a thin sharp piece of metal used for sewing | She put the thread through the *needle*. | Она вдела нитку в иголку.
- net | n | net |  | сеть | material made of string with holes, used for catching fish | The fishermen pulled in their *nets*. | Рыбаки вытащили сети. | the Net — интернет
- pack | n | pæk |  | пачка, упаковка; рюкзак | a box or packet; a bag you carry on your back | He bought a *pack* of batteries. | Он купил упаковку батареек.
- pillow | n | ˈpɪləʊ | ˈpɪloʊ | подушка (для сна) | a soft thing you put your head on in bed | I like a soft *pillow*. | Я люблю мягкую подушку.
- pottery | n | ˈpɒtəri | ˈpɑːtəri | керамика, гончарные изделия | pots and plates made from clay | She sells handmade *pottery*. | Она продаёт керамику ручной работы.
- rope | n | rəʊp | roʊp | верёвка, канат | a thick strong cord | They pulled the boat with a *rope*. | Они тянули лодку на верёвке.
- saucer | n | ˈsɔːsə | ˈsɔːsər | блюдце | a small plate for a cup | Put the cup on the *saucer*. | Поставь чашку на блюдце.
- tap | v | tæp |  | постукивать, слегка ударять | to hit something gently | Someone *tapped* me on the shoulder. | Кто-то похлопал меня по плечу. | сущ. tap — кран
- toothpaste | n | ˈtuːθpeɪst |  | зубная паста | a paste for cleaning your teeth | We've run out of *toothpaste*. | У нас закончилась зубная паста.
