title: Home and everyday life
title_ru: Дом и быт
topic: home
words:
- air conditioning | n | eə kənˈdɪʃənɪŋ | er kənˈdɪʃənɪŋ | кондиционер, кондиционирование | a system that keeps the air cool | The hotel room has *air conditioning*. | В номере есть кондиционер.
- bedside | n | ˈbedsaɪd |  | прикроватное место | the area next to a bed | There's a lamp on the *bedside* table. | На прикроватной тумбочке стоит лампа.
- blanket | n | ˈblæŋkɪt |  | одеяло, плед | a thick warm cover for a bed | She put a *blanket* over the sleeping child. | Она укрыла спящего ребёнка одеялом.
- ceiling | n | ˈsiːlɪŋ |  | потолок | the top surface of a room | There's a spider on the *ceiling*. | На потолке паук.
- central heating | n | ˈsentrəl ˈhiːtɪŋ |  | центральное отопление | a system that heats a whole building | The flat has *central heating*. | В квартире центральное отопление.
- curtain | n | ˈkɜːtn | ˈkɜːrtn | занавеска, штора | a piece of cloth that covers a window | Please close the *curtains*. | Задёрни, пожалуйста, шторы.
- cushion | n | ˈkʊʃən |  | диванная подушка | a soft object you sit on or lean on | She put a *cushion* behind her back. | Она подложила подушку под спину.
- dust | n | dʌst |  | пыль | very small dry pieces of dirt | The old books were covered in *dust*. | Старые книги были покрыты пылью.
- duvet | n | ˈduːveɪ | dˈuːveɪ | одеяло (стёганое) | a thick soft cover for a bed | It's cold — I need a warmer *duvet*. | Холодно — мне нужно одеяло потеплее.
- hammer | n | ˈhæmə | ˈhæmər | молоток | a tool for hitting nails | Pass me the *hammer*, please. | Подай мне, пожалуйста, молоток.
