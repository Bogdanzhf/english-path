title: Place and direction
title_ru: Место и направление
topic: place
words:
- ahead | adv | əˈhed |  | впереди, вперёд | in front; in the future | Go straight *ahead* and turn left. | Идите прямо, потом поверните налево. | ahead of — впереди кого-то
- apart | adv | əˈpɑːt | əˈpɑːrt | врозь, отдельно; на расстоянии | not together; at a distance from each other | The two houses are ten metres *apart*. | Два дома стоят в десяти метрах друг от друга.
- backwards | adv | ˈbækwədz | ˈbækwərdz | назад, задом наперёд | towards the back | He took a step *backwards*. | Он сделал шаг назад. | амер. backward
- downward | adj | ˈdaʊnwəd | ˈdaʊnwərd | направленный вниз, нисходящий | moving or pointing down | There's a *downward* trend in prices. | Цены имеют тенденцию к снижению.
- indoors | adv | ɪnˈdɔːz | ˈɪndɔːrz | в помещении, дома | inside a building | Let's stay *indoors* — it's raining. | Давай останемся дома — идёт дождь.
- locate | v | ləʊˈkeɪt | ˈloʊkeɪt | находить (местоположение) | to find the exact place of something | We couldn't *locate* the problem. | Мы не смогли найти, в чём проблема. | be located — находиться, располагаться
- location | n | ləʊˈkeɪʃən | loʊˈkeɪʃən | местоположение, место | a place or position | The hotel is in a great *location*. | Отель отлично расположен.
- next door | adv | nekst dɔː | neks dɔːr | по соседству, рядом | in the next house or room | They live *next door*. | Они живут по соседству.
- outdoors | adv | aʊtˈdɔːz | ˈaʊtˈdɔːrz | на улице, на открытом воздухе | outside, not in a building | Children should play *outdoors* more. | Детям стоит больше играть на улице.
- overseas | adv | ˌəʊvəˈsiːz | ˌoʊvərˈsiːz | за границей, за рубежом | in or to another country across the sea | My brother works *overseas*. | Мой брат работает за границей.
- throughout | prep | θruːˈaʊt |  | на протяжении; повсюду в | during the whole of; in every part of | It rained *throughout* the night. | Дождь шёл всю ночь.
- underneath | prep | ˌʌndəˈniːθ | ˌʌndərˈniːθ | под, внизу | directly under something | The cat was hiding *underneath* the bed. | Кошка пряталась под кроватью.
- upward | adj | ˈʌpwəd | ˈʌpwərd | направленный вверх | moving or pointing up | There's an *upward* trend in sales. | Продажи растут.
- westward | adv | ˈwestwəd | ˈwestwərd | на запад | towards the west | They travelled *westward* across America. | Они двигались на запад через Америку.
- within | prep | wɪˈðɪn |  | в пределах, в течение | inside a period of time or an area | The parcel will arrive *within* three days. | Посылка придёт в течение трёх дней.
