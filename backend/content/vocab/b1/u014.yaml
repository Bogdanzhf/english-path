title: Clothes and appearance
title_ru: Одежда и внешность
topic: clothes
words:
- accessory | n | əkˈsesəri |  | аксессуар; соучастник | an extra item, like a bag or belt; a person who helps a criminal | A good watch is an essential *accessory*. | Хорошие часы — необходимый аксессуар.
- cotton | n | ˈkɒtn | ˈkɑːtn | хлопок | a soft natural material from a plant | This T-shirt is made of *cotton*. | Эта футболка из хлопка.
- garment | n | ˈɡɑːmənt | ˈɡɑːrmənt | предмет одежды | a piece of clothing (formal) | The factory produces 10,000 *garments* a day. | Фабрика выпускает 10 000 изделий в день.
- glove | n | ɡlʌv |  | перчатка | a piece of clothing for your hand | He wore thick *gloves* in winter. | Зимой он носил толстые перчатки.
- jewel | n | ˈdʒuːəl |  | драгоценный камень | a valuable stone like a diamond | The crown was covered in *jewels*. | Корона была усыпана драгоценными камнями. | jewellery (брит.) / jewelry (амер.) — украшения
- necklace | n | ˈnekləs |  | ожерелье | a piece of jewellery worn around the neck | She wore a pearl *necklace*. | На ней было жемчужное ожерелье.
- sleeve | n | sliːv |  | рукав | the part of a shirt that covers your arm | He rolled up his *sleeves* and started working. | Он закатал рукава и принялся за работу.
- wrap | v | ræp |  | заворачивать, упаковывать | to cover something with paper or cloth | She *wrapped* the present in red paper. | Она завернула подарок в красную бумагу. | w не произносится
