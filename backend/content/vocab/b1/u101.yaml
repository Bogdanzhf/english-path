title: Thinking and opinions
title_ru: Мысли и мнения
topic: mind
words:
- conclude | v | kənˈkluːd |  | заключать, делать вывод; завершать | to decide after thinking; to end | The police *concluded* that it was an accident. | Полиция пришла к выводу, что это был несчастный случай.
- confirm | v | kənˈfɜːm | kənˈfɜːrm | подтверждать | to say that something is true or certain | Please *confirm* your booking by email. | Пожалуйста, подтвердите бронирование по электронной почте.
- confuse | v | kənˈfjuːz |  | путать, сбивать с толку | to make someone unable to understand; to mix up | People often *confuse* Venus with a star. | Люди часто путают Венеру со звездой.
- examine | v | ɪɡˈzæmɪn |  | осматривать, исследовать | to look at something very carefully | The doctor *examined* my eyes. | Врач осмотрел мои глаза.
- explore | v | ɪkˈsplɔː | ɪkˈsplɔːr | исследовать | to travel around a place to learn about it | We spent the day *exploring* the old town. | Мы весь день исследовали старый город.
- identify | v | aɪˈdentɪfaɪ |  | опознавать, определять | to recognize and say who or what something is | Can you *identify* this bird? | Можешь определить, что это за птица?
- intend | v | ɪnˈtend |  | намереваться | to plan to do something | I *intend* to finish this book tonight. | Я собираюсь дочитать эту книгу сегодня.
- measure | v | ˈmeʒə | ˈmeʒər | измерять | to find the size, amount or degree of something | The probe *measured* the temperature on the surface. | Зонд измерил температуру на поверхности.
- meditate | v | ˈmedɪteɪt |  | медитировать, размышлять | to think deeply in silence | Some gladiators *meditated* before a fight. | Некоторые гладиаторы погружались в размышления перед боем.
- reject | v | rɪˈdʒekt |  | отвергать, отклонять | to refuse to accept something | The council *rejected* the proposal. | Совет отклонил предложение.
- relate | v | rɪˈleɪt |  | быть связанным; рассказывать | to be connected with; to tell a story | The word is *related* to the Greek word for snake. | Это слово связано с греческим словом «змея». | relate to — понимать, сопереживать
- remind | v | rɪˈmaɪnd |  | напоминать | to help someone remember something | *Remind* me to call my mother. | Напомни мне позвонить маме. | remind somebody of — напоминать кого-то
- wonder | v | ˈwʌndə | ˈwʌndər | задаваться вопросом, интересоваться | to think about something and want to know more | I *wonder* why she left so early. | Интересно, почему она ушла так рано.
