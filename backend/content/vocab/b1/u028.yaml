- stylish | adj | ˈstaɪlɪʃ |  | стильный | fashionable and attractive | She always wears *stylish* clothes. | Она всегда стильно одета.
- worn | adj | wɔːn | wɔːrn | изношенный, поношенный | old and damaged from use | His jeans were *worn* at the knees. | Его джинсы протёрлись на коленях. | worn out — измученный
