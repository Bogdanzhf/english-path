title: 'Describing: size, shape and looks'
title_ru: 'Описание: размер, форма, внешний вид'
topic: describing
words:
- bald | adj | bɔːld |  | лысый | having little or no hair on the head | My father went *bald* at forty. | Мой отец облысел в сорок лет.
- bend | v | bend |  | сгибать, наклоняться | to make something curved; to move your body forward and down | *Bend* your knees when you lift heavy things. | Сгибайте колени, когда поднимаете тяжести. | bend — bent — bent
- circular | adj | ˈsɜːkjʊlə | ˈsɜːrkjələr | круглый, кольцевой | shaped like a circle | They walked along a *circular* path. | Они шли по кольцевой тропинке.
- coloured | adj | ˈkʌləd | ˈkʌlərd | цветной, окрашенный | having a colour | She bought some *coloured* pencils. | Она купила цветные карандаши. | амер. colored
- damaged | adj | ˈdæmɪdʒd | ˈdæmədʒd | повреждённый | harmed or broken | The car was badly *damaged*. | Машина была сильно повреждена.
- dusty | adj | ˈdʌsti |  | пыльный | covered in dust | The old books were *dusty*. | Старые книги были пыльными.
- fallen | adj | ˈfɔːlən | ˈfɑːlən | упавший, павший | having fallen down | The road was blocked by a *fallen* tree. | Дорогу перегородило упавшее дерево.
- fancy | adj | ˈfænsi |  | причудливый, нарядный, модный | expensive and decorated; not simple | We had dinner at a *fancy* restaurant. | Мы ужинали в шикарном ресторане. | fancy dress — маскарадный костюм (брит.)
- fashionable | adj | ˈfæʃnəbl |  | модный | popular at a particular time | Short jackets are very *fashionable* this year. | Короткие куртки в этом году очень модные.
- fold | v | fəʊld | foʊld | складывать, сгибать | to bend something so that one part is on another | *Fold* the paper in half. | Сложите лист пополам.
- 'folk | adj | fəʊk | foʊk | народный | traditional, from ordinary people | We listened to *folk* music. | Мы слушали народную музыку. | сущ.: folks — люди, родные'
- lean | adj | liːn |  | худой, поджарый; постный | thin and healthy; with little fat | After months of hunger, the men were *lean* and weak. | После месяцев голода люди были худыми и слабыми. | гл. lean — наклоняться, опираться
- luxury | n | ˈlʌkʃəri |  | роскошь | something expensive that you enjoy but don't need | A hot bath is my favourite *luxury*. | Горячая ванна — моя любимая роскошь. | luxurious — роскошный
- newborn | adj | ˈnjuːbɔːn | ˈnuːbɔːrn | новорождённый | recently born | The *newborn* baby slept all day. | Новорождённый малыш спал весь день.
- pale | adj | peɪl |  | бледный | with less colour than usual | You look *pale*. Are you OK? | Ты бледный. Всё в порядке?
- shiny | adj | ˈʃaɪni |  | блестящий | bright and reflecting light | She has *shiny* black hair. | У неё блестящие чёрные волосы.
