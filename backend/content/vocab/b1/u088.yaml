title: Events and situations
title_ru: События и ситуации
topic: events
words:
- brainstorming | n | ˈbreɪnstɔːmɪŋ | ˈbreɪnstɔːrmɪŋ | мозговой штурм | sharing ideas quickly in a group | We had a *brainstorming* session. | Мы провели мозговой штурм.
- breathing | n | ˈbriːðɪŋ |  | дыхание | taking air in and out | His *breathing* was slow and deep. | Он дышал медленно и глубоко.
- cause | n | kɔːz | kɑːz | дело, цель (благотворительная) | an aim that people support | They raised money for a good *cause*. | Они собрали деньги на благое дело.
- ceremony | n | ˈserəməni | ˈserəmoʊni | церемония | a formal public event | The award *ceremony* took place in Washington. | Церемония награждения прошла в Вашингтоне.
- disturbance | n | dɪˈstɜːbəns | dɪˈstɜːrbəns | беспокойство; нарушение порядка | something that interrupts; noise or fighting | Sorry for the *disturbance*. | Извините за беспокойство.
- doze | n | dəʊz | doʊz | дрёма | a short light sleep | I had a *doze* after lunch. | После обеда я вздремнул.
- factor | n | ˈfæktə | ˈfæktər | фактор | one of the things that cause a situation | Climate was an important *factor*. | Климат был важным фактором.
- glint | n | ɡlɪnt |  | блеск, отблеск | a small flash of light | There was a *glint* in his eye. | У него в глазах мелькнул огонёк.
- impact | n | ˈɪmpækt |  | влияние, воздействие; удар | a strong effect | Their work had a huge *impact* on the war. | Их работа оказала огромное влияние на ход войны.
- improvement | n | ɪmˈpruːvmənt | ˌɪmˈpruːvmənt | улучшение | becoming better | There's been a big *improvement* in your English. | Твой английский сильно улучшился.
- intermission | n | ˌɪntəˈmɪʃən | ˌɪntərˈmɪʃən | антракт | a break in a play or film | We bought ice cream during the *intermission*. | В антракте мы купили мороженое.
- mischief | n | ˈmɪstʃɪf |  | озорство, шалость | bad behaviour, especially by children, that is not serious | The boys were always getting into *mischief*. | Мальчишки вечно проказничали.
- oppression | n | əˈpreʃən |  | угнетение | cruel and unfair treatment | They fought against *oppression*. | Они боролись с угнетением.
- presentation | n | ˌprezənˈteɪʃən |  | презентация | a talk to show new ideas or products | I have to give a *presentation* tomorrow. | Завтра мне выступать с презентацией.
- procrastination | n | ˌprɒkrɑːstɪˈneɪʃən | prəˌkræstəˈneɪʃən | прокрастинация, откладывание дел | delaying things you should do | *Procrastination* is my biggest problem. | Прокрастинация — моя главная проблема.
- rise | n | raɪz |  | рост, повышение | an increase | There was a sharp *rise* in prices. | Цены резко выросли.
- security | n | sɪˈkjɔːrɪti | sɪkˈjʊrəti | безопасность; охрана | protection from danger | *Security* at the airport is very strict. | В аэропорту очень строгий контроль безопасности.
- shift | n | ʃɪft |  | смена (рабочая); сдвиг | a period of work; a change | He works the night *shift* at the factory. | Он работает в ночную смену на заводе. | гл. shift — сдвигать
- slip | v | slɪp |  | поскользнуться | to slide by accident and lose your balance | Be careful — you might *slip* on the ice. | Осторожно — можно поскользнуться на льду.
- 'whistle | n | ˈwɪsl | ˈhwɪsl | свисток; свист | a small instrument that makes a high sound | The referee blew his *whistle*. | Судья дал свисток. | гл.: whistle — свистеть'
- win | n | wɪn |  | победа | a victory | It was a great *win* for the team. | Это была большая победа команды.
