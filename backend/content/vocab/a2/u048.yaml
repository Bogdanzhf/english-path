title: Feelings and states
title_ru: Чувства и состояния
topic: feelings
words:
- able | adj | ˈeɪbl |  | способный (be able to — мочь) | having the skill or ability | Will you be *able* to come? | Ты сможешь прийти?
- 'alive | adj | əˈlaɪv |  | живой | living, not dead | Is the fish still *alive*? | Рыба ещё жива? | только после глагола: The bird is alive (но a living bird)'
- amusement | n | əˈmjuːsmənt | əmˈjuːzmənt | развлечение, веселье | the feeling that something is funny | She watched with *amusement*. | Она смотрела с весельем. | amusement park — парк аттракционов
- available | adj | əˈveɪləbl |  | доступный, свободный | that you can get, use or buy | Are there any rooms *available* for tonight? | Есть ли свободные номера на сегодня?
- dead | adj | ded |  | мёртвый; разряженный | not alive; not working | My phone is *dead*. | У меня сел телефон.
- energetic | adj | ˌenəˈdʒetɪk | ˌenərˈdʒetɪk | энергичный | having a lot of energy | The kids are very *energetic* today. | Дети сегодня очень энергичные.
- envy | v | ˈenvi |  | завидовать | to want what another person has | I *envy* people who can sleep anywhere. | Я завидую людям, которые могут спать где угодно.
- favour | n | ˈfeɪvə | ˈfeɪvər | услуга, одолжение | something you do to help someone | Can you do me a *favour*? | Можешь оказать мне услугу? | амер. favor
- fear | n | fɪə | fɪr | страх | the feeling you have when you are afraid | She has a *fear* of spiders. | Она боится пауков.
- 'fit | adj | fɪt |  | в хорошей форме | healthy and strong | I want to get *fit*. | Я хочу прийти в форму. | гл.: fit — подходить по размеру'
- greedy | adj | ˈɡriːdi |  | жадный | wanting more than you need | Don't be *greedy* — share the sweets. | Не жадничай — поделись конфетами.
- hurt | v | hɜːt | hɜːrt | причинять боль; болеть | to cause pain | My leg *hurts*. | У меня болит нога. | hurt – hurt – hurt
- 'kindly | adj | ˈkaɪndli |  | добрый, доброжелательный | kind and friendly | She was a *kindly* old woman. | Это была добрая пожилая женщина. | нар.: kindly — любезно'
- lost | adj | lɒst | lɔːst | потерянный; заблудившийся | not able to find the way; missing | I'm *lost* — can you help me? | Я заблудился — можете помочь?
- missing | adj | ˈmɪsɪŋ |  | пропавший, отсутствующий | not in the usual place | My keys are *missing*. | Мои ключи пропали.
- pleasure | n | ˈpleʒə | ˈpleʒər | удовольствие | a feeling of being happy | It's a *pleasure* to meet you. | Приятно познакомиться. | with pleasure — с удовольствием
- polite | adj | pəˈlaɪt |  | вежливый | behaving in a kind and respectful way | It's *polite* to say thank you. | Говорить «спасибо» — вежливо.
- surprised | adj | səˈpraɪzd | sərˈpraɪzd | удивлённый | feeling that something is unexpected | I was *surprised* to see him at the party. | Я удивился, увидев его на вечеринке.
- tidy | adj | ˈtaɪdi |  | опрятный, аккуратный | neat and in order | Keep your room *tidy*! | Держи свою комнату в порядке! | гл. tidy up — убирать
- worried | adj | ˈwʌrɪd | ˈwɜːriːd | обеспокоенный | unhappy because you think something bad may happen | I'm *worried* about the exam. | Я переживаю из-за экзамена.
