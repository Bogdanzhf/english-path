words:
- comparative | adj | kəmˈpærətɪv |  | сравнительный | involving comparison | The forest offers *comparative* safety for many species. | Лес обеспечивает многим видам относительную безопасность.
- diary | n | ˈdaɪəri |  | дневник; ежедневник | a book where you write about your day or plans | She writes in her *diary* every night. | Она пишет в дневник каждый вечер. | не путайте с dairy — молочный
- document | v | ˈdɒkjument | ˈdɑːkjument | документировать, фиксировать | to record details of something | He *documented* every trick in his notebook. | Он записывал каждый трюк в блокнот. | сущ. document — документ
- essay | n | ˈeseɪ |  | эссе, сочинение | a short piece of writing on a subject | We have to write an *essay* on climate change. | Нам нужно написать эссе об изменении климата.
- grade | n | ɡreɪd |  | оценка | a mark or letter that shows how good your work is | She got the best *grade* in the class. | Она получила лучшую оценку в классе. | брит. часто mark
