title: Education
title_ru: Учёба
topic: education
words:
- comparative | adj | kəmˈpærətɪv |  | сравнительный | involving comparison | The forest offers *comparative* safety for many species. | Лес обеспечивает многим видам относительную безопасность.
- 'copy | n | ˈkɒpi | ˈkɑːpi | копия; экземпляр | a thing made to look like another | Can I have a *copy* of the report? | Можно копию отчёта? | гл.: copy — копировать, списывать'
- diary | n | ˈdaɪəri |  | дневник; ежедневник | a book where you write about your day or plans | She writes in her *diary* every night. | Она пишет в дневник каждый вечер. | не путайте с dairy — молочный
- document | v | ˈdɒkjument | ˈdɑːkjument | документировать, фиксировать | to record details of something | He *documented* every trick in his notebook. | Он записывал каждый трюк в блокнот. | сущ. document — документ
- essay | n | ˈeseɪ |  | эссе, сочинение | a short piece of writing on a subject | We have to write an *essay* on climate change. | Нам нужно написать эссе об изменении климата.
- file | n | faɪl |  | файл; папка, дело | a document on a computer; a folder for papers | Save the *file* on your desktop. | Сохраните файл на рабочем столе.
- folder | n | ˈfəʊldə | ˈfoʊldər | папка | a cover for papers; a place for files on a computer | Put the papers in the blue *folder*. | Положите бумаги в синюю папку.
- form | v | fɔːm | fɔːrm | образовывать, формировать | to make or create something | They *formed* a band at school. | Они создали группу ещё в школе.
- grade | n | ɡreɪd |  | оценка | a mark or letter that shows how good your work is | She got the best *grade* in the class. | Она получила лучшую оценку в классе. | брит. часто mark
- lecture | n | ˈlektʃə | ˈlektʃər | лекция | a talk to students on a subject | The *lecture* starts at nine. | Лекция начинается в девять. | lecturer — преподаватель вуза
- phrase | n | freɪz |  | фраза, словосочетание | a group of words | Learn these useful *phrases*. | Выучите эти полезные фразы.
- plural | n | ˈplɔːrəl | ˈplʊrəl | множественное число | the form of a word for more than one | The *plural* of "child" is "children". | Множественное число от «child» — «children».
- spelling | n | ˈspelɪŋ |  | правописание, орфография | the way a word is written | Check your *spelling*. | Проверьте орфографию.
- superlative | n | suːˈpɜːlətɪv | sʊˈpɜːrlətɪv | превосходная степень | the form of an adjective like "biggest" | "Best" is the *superlative* of "good". | «Best» — превосходная степень от «good».
- test | v | test |  | проверять, тестировать | to check how good something is | The teacher *tested* our vocabulary. | Учитель проверил наш словарный запас.
- train | v | treɪn |  | тренировать(ся); обучать | to prepare for a sport or a job | She *trains* every day for the marathon. | Она каждый день тренируется к марафону.
