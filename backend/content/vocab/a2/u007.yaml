title: Home and everyday life
title_ru: Дом и быт
topic: home
words:
- board | n | bɔːd | bɔːrd | доска | a flat piece of wood or other material | The teacher wrote the answer on the *board*. | Учитель написал ответ на доске. | on board — на борту
- calendar | n | ˈkælɪndə | ˈkælɪndər | календарь | a list of the days and months of the year | Mark the date on your *calendar*. | Отметьте дату в календаре.
- carpet | n | ˈkɑːpɪt | ˈkɑːrpɪt | ковёр, ковровое покрытие | a thick cloth covering for a floor | Don't spill coffee on the new *carpet*! | Не пролей кофе на новый ковёр!
- case | n | keɪs |  | случай; дело | a particular example or situation | In some *cases*, the language has only one speaker left. | В некоторых случаях у языка остаётся всего один носитель. | in case — на случай если
- cloth | n | klɒθ | klɔːθ | ткань; тряпка | material made from cotton, wool, etc. | She cleaned the table with a wet *cloth*. | Она протёрла стол влажной тряпкой.
- item | n | ˈaɪtəm |  | предмет, пункт, позиция | a single thing on a list or in a group | There are twenty *items* on the menu. | В меню двадцать позиций.
- sheet | n | ʃiːt |  | лист; простыня | a flat piece of paper; a cloth on a bed | Take a *sheet* of paper and write your name. | Возьмите лист бумаги и напишите своё имя.
- shelf | n | ʃelf |  | полка | a flat board on a wall for putting things on | Put the books back on the *shelf*. | Поставь книги обратно на полку. | мн. ч. shelves
- sink | v | sɪŋk |  | тонуть, погружаться | to go down under water | The old ship *sank* in only two hours. | Старый корабль затонул всего за два часа. | sink — sank — sunk; сущ. sink — раковина
- 'stair | n | steə | ster | ступенька | one of the steps that go from one floor to another | She ran up the *stairs* to the third floor. | Она взбежала по лестнице на третий этаж. | обычно мн. ч.: stairs — лестница'
- wood | n | wʊd |  | дерево (материал); лес | the hard material that trees are made of | The table is made of *wood*. | Стол сделан из дерева. | woods — лес
- yard | n | jɑːd | jɑːrd | двор | an area of land next to a house | The kids are playing in the *yard*. | Дети играют во дворе. | также ярд (≈ 91 см)
