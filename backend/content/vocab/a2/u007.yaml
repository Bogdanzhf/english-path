reading:
  title: The Potter of the Nile
  title_ru: Гончар с Нила
  text: |
    Four thousand years ago in Egypt, life depended on the river Nile. Every year, there was an annual flood. The water covered the fields and left behind a thick layer of black mud. This made the land along the shore very fertile, ideal for growing wheat.

    The mud was also full of clay. In a small village, there lived a young potter called Ani. Every morning, she obtained fresh clay from the riverbank and carried it home in a wooden bucket. She made pots, cups and plates on a simple potter's wheel that turned with her foot.

    Ani's work was not ordinary. She decorated her pots with beautiful designs: birds with long feathers, fish, sea shells and abstract lines that looked like water. People said she had the intelligence of a scribe and the hands of an artist. Rich families bought her pots for their homes and filled them with oil, grain and wine.

    One day, the priests of the temple asked Ani to make a special pot for a religious ceremony. It took her a month. When she finished, the priests said it was the most beautiful pot they had ever seen. "You deserve a reward," they said. They gave her a piece of fine cloth and new furniture for her home.

    Thousands of years later, archaeologists found one of Ani's pots in a grave near the Nile. Today it stands in a museum, behind a glass case and a red velvet curtain. Visitors stop and look at it for a long time. Some say it's romantic: a simple potter whose work became immortal.
  ru: |
    Четыре тысячи лет назад жизнь в Египте зависела от реки Нил. Каждый год случался разлив. Вода покрывала поля и оставляла после себя толстый слой чёрного ила. Благодаря этому земля вдоль берега была очень плодородной — идеальной для выращивания пшеницы.

    Ил был полон глины. В одной маленькой деревне жила молодая гончарша по имени Ани. Каждое утро она набирала свежую глину на берегу реки и несла её домой в деревянном ведре. Она делала горшки, чашки и тарелки на простом гончарном круге, который крутила ногой.

    Работы Ани были необычными. Она украшала горшки красивыми узорами: птицами с длинными перьями, рыбами, ракушками и абстрактными линиями, похожими на воду. Говорили, что у неё ум писца и руки художника. Богатые семьи покупали её горшки для своих домов и наполняли их маслом, зерном и вином.

    Однажды жрецы храма попросили Ани сделать особый сосуд для религиозной церемонии. Работа заняла у неё месяц. Когда она закончила, жрецы сказали, что это самый красивый сосуд, который они видели. «Ты заслуживаешь награды», — сказали они. Они подарили ей отрез тонкой ткани и новую мебель для дома.

    Тысячи лет спустя археологи нашли один из горшков Ани в гробнице у Нила. Сегодня он стоит в музее, за стеклом и красным бархатным занавесом. Посетители останавливаются и подолгу смотрят на него. Некоторые говорят, что в этом есть что-то романтичное: простая гончарша, чья работа стала бессмертной.
