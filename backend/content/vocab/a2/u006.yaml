title: Function words
title_ru: Служебные слова
topic: grammar
words:
- latter | adj | ˈlætə | ˈlætər | последний (из двух) | the second of two things mentioned | Of tea and coffee, I prefer the *latter*. | Из чая и кофе я предпочитаю последний. | the former — первый (из двух)
- several | det | ˈsevrəl |  | несколько | more than two, but not many | I called her *several* times, but she didn't answer. | Я звонил ей несколько раз, но она не ответила.
- 'such | det | sʌtʃ |  | такой | like this; so much | It was *such* a beautiful day! | Был такой прекрасный день! | such + (a) + прил. + сущ.: such a nice man'
- though | conj | ðəʊ | ðoʊ | хотя | although; despite the fact that | *Though* it was raining, we went for a walk. | Хотя шёл дождь, мы пошли гулять.
