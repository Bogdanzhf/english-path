title: Function words
title_ru: Служебные слова
topic: grammar
words:
- all right | adj | ɔːl raɪt |  | в порядке; ладно | OK; acceptable | Are you *all right*? | Ты в порядке?
- alright | adj | ɔːlˈraɪt | ˌɔːlˈraɪt | в порядке; ладно (разг.) | all right | Is it *alright* if I leave early? | Ничего, если я уйду пораньше? | разговорный вариант all right
- any more | adv | ˈeni mɔː | ˈeni mɔːr | больше не (в отрицании) | no longer | I don't live there *any more*. | Я там больше не живу. | амер. anymore
- but | prep | bʌt |  | кроме | except | Everyone *but* me went to the party. | Все, кроме меня, пошли на вечеринку.
- can | n | kæn |  | банка (жестяная) | a metal container for food or drink | Open a *can* of beans. | Открой банку фасоли.
- home | adj | həʊm | hoʊm | домашний; родной | relating to your home or country | What's your *home* address? | Какой у тебя домашний адрес?
- last | v | lɑːst | læs | длиться, продолжаться | to continue for a period of time | The film *lasts* two hours. | Фильм длится два часа.
- latter | adj | ˈlætə | ˈlætər | последний (из двух) | the second of two things mentioned | Of tea and coffee, I prefer the *latter*. | Из чая и кофе я предпочитаю последний. | the former — первый (из двух)
- like | conj | laɪk |  | как, словно (разг.) | as; as if | It looks *like* it's going to rain. | Похоже, пойдёт дождь. | likes and dislikes — что нравится и не нравится
- might | n | maɪt |  | мощь, сила | great strength or power | He pushed with all his *might*. | Он толкал изо всех сил. | не путайте с модальным might
- 'need | v | niːd |  | нуждаться, нужно | to want something because it is necessary | I *need* some help. | Мне нужна помощь. | также сущ.: need — потребность'
- own | v | əʊn | oʊn | владеть, иметь | to have something that belongs to you | They *own* a small hotel. | Им принадлежит небольшая гостиница.
- per cent | n | pɜː sent | pɜːr sent | процент | one part in every hundred | Fifty *per cent* of the students are girls. | Пятьдесят процентов студентов — девушки. | амер. percent
- several | det | ˈsevrəl |  | несколько | more than two, but not many | I called her *several* times, but she didn't answer. | Я звонил ей несколько раз, но она не ответила.
- shall | v | ʃæl |  | (в вопросах) не… ли?; давай(те) | used to make offers and suggestions | *Shall* I open the window? | Мне открыть окно? | Shall we go? — Пойдём?
- so-called | adj | ˈsəʊˈkɔːld | ˈsoʊˈkɔːld | так называемый | used when something is called something | This is the *so-called* "city of love". | Это так называемый «город любви».
- still | adj | stɪl |  | неподвижный; без газа (о воде) | not moving; without bubbles | Stand *still*! | Стой спокойно! | still water — вода без газа
- 'such | det | sʌtʃ |  | такой | like this; so much | It was *such* a beautiful day! | Был такой прекрасный день! | such + (a) + прил. + сущ.: such a nice man'
- though | conj | ðəʊ | ðoʊ | хотя | although; despite the fact that | *Though* it was raining, we went for a walk. | Хотя шёл дождь, мы пошли гулять.
- used to | v | juzd tuː | juːzd tuː | раньше (делал), бывало | used to talk about past habits | I *used to* play the piano. | Раньше я играл на пианино. | Did you use to…?
- will | n | wɪl |  | воля; завещание | strong determination; a legal document about your property after death | She has a strong *will*. | У неё сильная воля.
