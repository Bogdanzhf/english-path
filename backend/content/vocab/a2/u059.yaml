title: Law and crime
title_ru: Закон и преступность
topic: law
words:
- crime | n | kraɪm |  | преступление | an illegal action | Violent *crime* has fallen in recent years. | В последние годы число насильственных преступлений снизилось.
- evidence | n | ˈevɪdəns |  | доказательство, улика | facts that show that something is true | The police found no *evidence* of a crime. | Полиция не нашла доказательств преступления. | неисчисляемое
- judge | v | dʒʌdʒ |  | судить, оценивать | to form an opinion about someone or something | You can't *judge* a book by its cover. | Нельзя судить о книге по обложке. | сущ. judge — судья
- law | n | lɔː |  | закон; право | a rule made by the government; the system of rules | In many countries, the *law* does not accept lie detector results. | Во многих странах закон не принимает результаты детектора лжи.
- lawyer | n | ˈlɔːjə | ˈlɔːjər | юрист, адвокат | a person whose job is to give advice about the law | You should talk to a *lawyer* before you sign. | Перед подписанием стоит поговорить с юристом.
- steal | v | stiːl |  | красть | to take something that is not yours | Someone *stole* my bike last night. | Вчера ночью кто-то украл мой велосипед. | steal — stole — stolen
- thief | n | θiːf |  | вор | a person who steals | The police caught the *thief* at the station. | Полиция поймала вора на вокзале. | мн. ч. thieves
