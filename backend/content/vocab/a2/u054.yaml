title: Communication and language
title_ru: Общение и язык
topic: communication
words:
- advertise | v | ˈædvətaɪz | ˈædvərtaɪz | рекламировать | to tell people about a product so that they buy it | They *advertise* their new phone on TV. | Они рекламируют свой новый телефон по телевизору. | сущ. advertisement (ad) — реклама
- chat | v | tʃæt |  | болтать, общаться | to talk in a friendly, informal way | We *chatted* for hours over coffee. | Мы часами болтали за кофе.
- communicate | v | kəˈmjuːnɪkeɪt |  | общаться, сообщать | to share information or feelings | Generals *communicated* using messengers on horseback. | Полководцы общались через гонцов на лошадях.
- complain | v | kəmˈpleɪn |  | жаловаться | to say you are unhappy about something | People always *complain* about the weather. | Люди вечно жалуются на погоду.
- cry | v | kraɪ |  | плакать; кричать | to have tears in your eyes; to shout | The baby is *crying*. | Малыш плачет.
- disagree | v | ˌdɪsəˈɡriː |  | не соглашаться | to have a different opinion | I *disagree* with you completely. | Я с тобой совершенно не согласен.
- express | v | ɪkˈspres |  | выражать | to show a feeling or opinion in words or actions | He found it hard to *express* his feelings. | Ему было трудно выражать свои чувства.
- greet | v | ɡriːt |  | приветствовать | to say hello to someone when you meet them | She *greeted* us at the door with a big smile. | Она встретила нас у двери с широкой улыбкой.
- 'joke | n | dʒəʊk | dʒoʊk | шутка | something funny you say | He told a funny *joke*. | Он рассказал смешную шутку. | гл.: joke — шутить'
- mention | v | ˈmenʃn |  | упоминать | to talk about something briefly | She didn't *mention* her new job. | Она не упомянула о новой работе.
- pray | v | preɪ |  | молиться | to speak to God | Families *prayed* for their sons to come home. | Семьи молились о том, чтобы их сыновья вернулись домой.
- predict | v | prɪˈdɪkt |  | предсказывать | to say what will happen in the future | Nobody can *predict* the future. | Никто не может предсказать будущее.
- 'promise | v | ˈprɒmɪs | ˈprɑːməs | обещать | to say you will certainly do something | I *promise* I''ll call you. | Обещаю, что позвоню. | сущ.: promise — обещание'
- pronounce | v | prəˈnaʊns |  | произносить | to say a word in the correct way | How do you *pronounce* this word? | Как произносится это слово? | pronunciation — произношение
- recommend | v | ˌrekəˈmend |  | рекомендовать, советовать | to say that something is good or should be done | Can you *recommend* a good hotel? | Можете посоветовать хороший отель? | одна c, две m
- refer | v | rɪˈfɜː | rɪˈfɜːr | ссылаться, упоминать; направлять | to mention; to send someone to another person for help | My doctor *referred* me to a specialist. | Врач направил меня к специалисту. | refer to — относиться к, упоминать
- 'reply | v | rɪˈplaɪ | riːˈplaɪ | отвечать | to answer | She didn''t *reply* to my email. | Она не ответила на моё письмо. | сущ.: reply — ответ'
- shout | v | ʃaʊt |  | кричать | to say something very loudly | Please don't *shout* — I can hear you. | Пожалуйста, не кричи — я тебя слышу.
- suggest | v | səˈdʒest | səɡˈdʒest | предлагать, советовать | to give an idea for someone to think about | I *suggest* we take a taxi. | Предлагаю взять такси. | suggest + -ing или that…
- suppose | v | səˈpəʊz | səˈpoʊz | полагать, предполагать | to think that something is probably true | I *suppose* you are hungry after your trip. | Полагаю, ты голоден после поездки. | be supposed to — быть должным
