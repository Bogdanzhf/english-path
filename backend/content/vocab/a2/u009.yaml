title: 'Describing: size, shape and looks'
title_ru: 'Описание: размер, форма, внешний вид'
topic: describing
words:
- bottom | n | ˈbɒtəm | ˈbɑːtəm | дно, низ | the lowest part of something | The keys are at the *bottom* of my bag. | Ключи на дне моей сумки.
- broken | adj | ˈbrəʊkən | ˈbroʊkən | сломанный, разбитый | damaged and not working | My phone is *broken*. | Мой телефон сломан.
- closed | adj | kləʊzd | kloʊzd | закрытый | not open | The museum is *closed* on Mondays. | По понедельникам музей закрыт.
- 'dry | adj | draɪ |  | сухой | without water | Keep the box in a *dry* place. | Храните коробку в сухом месте. | гл.: dry — сушить'
- flat | adj | flæt |  | плоский, ровный | smooth and level | The land here is very *flat*. | Земля здесь очень ровная. | сущ. flat — квартира (A1)
- good-looking | adj | ˈɡʊdlʊkɪŋ |  | привлекательный, симпатичный | attractive | He's a very *good-looking* young man. | Он очень симпатичный молодой человек.
- heavy | adj | ˈhevi |  | тяжёлый; сильный (о дожде, движении) | weighing a lot | This box is too *heavy* to carry. | Эта коробка слишком тяжёлая. | heavy rain — сильный дождь
- huge | adj | hjuːdʒ |  | огромный | very big | They live in a *huge* house with ten bedrooms. | Они живут в огромном доме с десятью спальнями.
- left-hand | adj | ˌleftˈhænd |  | левый, левосторонний | on the left side | The shop is on the *left-hand* side. | Магазин по левую сторону.
- level | n | ˈlevl |  | уровень | a height or amount | The water *level* in the lake is very low this year. | Уровень воды в озере в этом году очень низкий.
- light | v | laɪt |  | зажигать; освещать | to make something start to burn; to give light | Can you *light* the candles? | Можешь зажечь свечи? | light – lit – lit
- low | adj | ləʊ | loʊ | низкий (по уровню) | small in amount or level | This yoghurt is *low* in fat. | В этом йогурте мало жира.
- right-hand | adj | raɪtˈhænd |  | правый, правосторонний | on the right side | Take the *right-hand* road. | Поезжайте по правой дороге.
- shut | v | ʃʌt |  | закрывать | to close | Please *shut* the window — it's cold. | Закрой, пожалуйста, окно — холодно. | shut — shut — shut
- 'silver | adj | ˈsɪlvə | ˈsɪlvər | серебряный, серебристый | made of silver; having the colour of silver | She wore a *silver* ring. | На ней было серебряное кольцо. | сущ.: silver — серебро'
- 'square | adj | skweə | skwer | квадратный | having four equal sides | We have a *square* table. | У нас квадратный стол. | сущ.: square — площадь; квадрат'
- straight | adj | streɪt |  | прямой | not curved | She has long *straight* hair. | У неё длинные прямые волосы. | go straight on — идти прямо
- top | n | tɒp | tɑːp | верх, вершина | the highest part of something | We climbed to the *top* of the hill. | Мы забрались на вершину холма.
- wide | adj | waɪd |  | широкий | measuring a lot from side to side | The river is very *wide* here. | Здесь река очень широкая.
