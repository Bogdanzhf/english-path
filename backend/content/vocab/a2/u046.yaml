title: Character and personality
title_ru: Характер и личность
topic: feelings
words:
- alone | adj | əˈləʊn | əˈloʊn | один, в одиночестве | without other people | She lives *alone* in a small flat. | Она живёт одна в маленькой квартире.
- careful | adj | ˈkeəfl | ˈkerfl | осторожный, внимательный | giving attention to avoid danger or mistakes | Be *careful* — the road is icy. | Будь осторожен — дорога скользкая.
- clever | adj | ˈklevə | ˈklevər | умный, сообразительный | intelligent | She is a very *clever* student. | Она очень умная студентка.
