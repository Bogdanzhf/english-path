title: Character and personality
title_ru: Характер и личность
topic: feelings
words:
- alone | adj | əˈləʊn | əˈloʊn | один, в одиночестве | without other people | She lives *alone* in a small flat. | Она живёт одна в маленькой квартире.
- fair | adj | feə | fer | честный, справедливый | treating everyone in the same right way | It's not *fair* — he got more cake than me! | Это нечестно — ему досталось больше торта, чем мне!
- formal | adj | ˈfɔːml | ˈfɔːrml | официальный, формальный | serious and official | You need *formal* clothes for the wedding. | На свадьбу нужна официальная одежда.
- independent | adj | ˌɪndɪˈpendənt |  | независимый, самостоятельный | not controlled by or needing other people | She is very *independent* and lives on her own. | Она очень самостоятельная и живёт одна.
- individual | n | ˌɪndɪˈvɪdʒuəl |  | особь; личность, отдельный человек | a single person or animal | Each *individual* in the group was slightly different. | Каждая особь в группе немного отличалась.
- intelligent | adj | ɪnˈtelɪdʒənt |  | умный | able to learn and understand things quickly | Dolphins are highly *intelligent* animals. | Дельфины — очень умные животные.
- nervous | adj | ˈnɜːvəs | ˈnɜːrvəs | нервный, взволнованный | a little afraid or worried about something | I always feel *nervous* before an exam. | Я всегда нервничаю перед экзаменом.
- senior | adj | ˈsiːniə | ˈsiːniər | старший (по возрасту, должности) | older or higher in rank | She is a *senior* manager at the bank. | Она старший менеджер в банке. | senior citizens — пожилые люди
- smart | adj | smɑːt | smɑːrt | умный; нарядный | intelligent; (брит.) clean and well-dressed | She is a very *smart* girl — she reads a lot. | Она очень умная девочка — много читает.
- strict | adj | strɪkt |  | строгий | making people follow rules exactly | My parents were very *strict*. | Мои родители были очень строгими.
- weak | adj | wiːk |  | слабый | not strong; not good at something | French was always my *weak* subject. | Французский всегда был моим слабым предметом.
- wild | adv | waɪld |  | неистово, без удержу | in an uncontrolled, excited way | When the news came, the crowds went *wild*. | Когда пришла новость, толпа пришла в неистовство. | go wild, run wild
