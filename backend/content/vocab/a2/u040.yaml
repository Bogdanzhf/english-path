title: Animals
title_ru: Животные
topic: animals
words:
- bat | n | bæt |  | летучая мышь; бита | a small flying animal; a stick for hitting a ball | *Bats* fly at night. | Летучие мыши летают ночью.
- bear | n | beə | ber | медведь | a large heavy wild animal with thick fur | We saw a brown *bear* in the forest. | В лесу мы видели бурого медведя. | гл. bear — выносить, терпеть (B2)
- bee | n | biː |  | пчела | a flying insect that makes honey | A *bee* stung me. | Меня ужалила пчела.
- chimpanzee | n | ˌtʃɪmpənˈziː | tʃɪmˈpænzi | шимпанзе | an African ape | *Chimpanzees* are very intelligent. | Шимпанзе очень умны.
- dinosaur | n | ˈdaɪnəsɔː | ˈdaɪnəsɔːr | динозавр | a very large animal that lived millions of years ago | My son knows the names of all the *dinosaurs*. | Мой сын знает названия всех динозавров.
- duck | n | dʌk |  | утка | a water bird with a wide flat beak | The children gave bread to the *ducks* in the park. | Дети кормили уток в парке хлебом.
- endangered | adj | ɪnˈdeɪndʒəd | ɪnˈdeɪndʒərd | находящийся под угрозой исчезновения | at risk of no longer existing | The panda is an *endangered* species. | Панда — вид, находящийся под угрозой исчезновения.
- flea | n | fliː |  | блоха | a very small jumping insect | The dog has *fleas*. | У собаки блохи.
- fly | n | flaɪ |  | муха | a small flying insect | There's a *fly* in my soup! | У меня в супе муха!
- frog | n | frɒɡ | frɑːɡ | лягушка | a small green animal that lives near water and jumps | A *frog* jumped into the pond. | Лягушка прыгнула в пруд.
- insect | n | ˈɪnsekt |  | насекомое | a small animal with six legs | Ants are *insects*. | Муравьи — насекомые.
- monkey | n | ˈmʌnki | ˈmʌŋki | обезьяна | an animal with a long tail that climbs trees | The *monkeys* are eating bananas. | Обезьяны едят бананы.
- pet | n | pet |  | домашнее животное | an animal that you keep at home | Do you have any *pets*? | У тебя есть домашние животные?
- rat | n | ræt |  | крыса | an animal like a big mouse | There's a *rat* in the basement! | В подвале крыса!
- robin | n | ˈrɒbɪn | ˈrɑːbən | малиновка | a small bird with a red front | A *robin* is singing in the garden. | В саду поёт малиновка.
- spider | n | ˈspaɪdə | ˈspaɪdər | паук | a small creature with eight legs that makes webs | There's a big *spider* in the bath! | В ванне огромный паук!
