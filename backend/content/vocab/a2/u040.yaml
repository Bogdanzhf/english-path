title: Animals
title_ru: Животные
topic: animals
words:
- dinosaur | n | ˈdaɪnəsɔː | ˈdaɪnəsɔːr | динозавр | a very large animal that lived millions of years ago | My son knows the names of all the *dinosaurs*. | Мой сын знает названия всех динозавров.
- duck | n | dʌk |  | утка | a water bird with a wide flat beak | The children gave bread to the *ducks* in the park. | Дети кормили уток в парке хлебом.
- endangered | adj | ɪnˈdeɪndʒəd | ɪnˈdeɪndʒərd | находящийся под угрозой исчезновения | at risk of no longer existing | The panda is an *endangered* species. | Панда — вид, находящийся под угрозой исчезновения.
- pet | n | pet |  | домашнее животное | an animal that you keep at home | Do you have any *pets*? | У тебя есть домашние животные?
- spider | n | ˈspaɪdə | ˈspaɪdər | паук | a small creature with eight legs that makes webs | There's a big *spider* in the bath! | В ванне огромный паук!
