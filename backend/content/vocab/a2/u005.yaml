title: Food and drink
title_ru: Еда и напитки
topic: food
words:
- crisp | adj | krɪsp |  | хрустящий; свежий | firm and making a pleasant sound when you bite it | I love *crisp* green apples. | Я люблю хрустящие зелёные яблоки. | crisps (брит.) — чипсы
- pea | n | piː |  | горошина, горох | a small round green vegetable | The meal came with rice and *peas*. | К блюду подавали рис и горошек.
- roast | v | rəʊst | roʊst | жарить, запекать | to cook in an oven or over a fire | We *roasted* a chicken for Sunday lunch. | На воскресный обед мы запекли курицу.
