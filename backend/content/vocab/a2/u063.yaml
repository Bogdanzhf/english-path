title: Events and situations
title_ru: События и ситуации
topic: events
words:
- accident | n | ˈæksɪdənt |  | авария, несчастный случай | something bad that happens by chance, often hurting people | He broke his leg in a car *accident*. | Он сломал ногу в автомобильной аварии. | by accident — случайно
- behaviour | n | bɪˈheɪvjə | bɪˈheɪvjər | поведение | the way someone acts | His *behaviour* at school is very good. | У него очень хорошее поведение в школе. | амер. behavior
- celebration | n | ˌseləˈbreɪʃən |  | празднование, торжество | a party for a special event | We had a big *celebration* for her birthday. | Мы устроили большой праздник на её день рождения.
- chance | n | tʃɑːns | tʃæns | шанс, возможность | an opportunity to do something | This is your last *chance* to win. | Это твой последний шанс победить.
- condition | n | kənˈdɪʃn |  | состояние; условие | the state that something or someone is in | The old car is still in good *condition*. | Старая машина всё ещё в хорошем состоянии.
- contest | n | ˈkɒntest | ˈkɑːntest | конкурс, соревнование | a competition | She won a singing *contest* at school. | Она победила в школьном конкурсе пения.
- death | n | deθ |  | смерть | the end of life | The news of his *death* shocked everyone. | Известие о его смерти потрясло всех.
- decision | n | dɪˈsɪʒən |  | решение | a choice you make | It was a difficult *decision*. | Это было трудное решение. | make a decision — принять решение
- error | n | ˈerə | ˈerər | ошибка | a mistake | There's an *error* in the text. | В тексте ошибка.
- honour | n | ˈɒnə | ˈɑːnər | честь | great respect | It's an *honour* to meet you. | Это честь — познакомиться с вами. | амер. honor
- hurry | v | ˈhʌri | ˈhɜːri | торопиться | to do something or go somewhere quickly | *Hurry* up, or we'll miss the train! | Поторопись, а то опоздаем на поезд! | be in a hurry — спешить
- luck | n | lʌk |  | удача, везение | good things that happen by chance | Good *luck*! | Удачи!
- movement | n | ˈmuːvmənt |  | движение, течение | a group of people with the same ideas, especially in art or politics | Impressionism was an art *movement* of the 19th century. | Импрессионизм — художественное течение XIX века.
- noise | n | nɔɪz |  | шум | a sound, often loud or unpleasant | What is that strange *noise* in the kitchen? | Что это за странный шум на кухне?
- opportunity | n | ˌɒpəˈtjuːnəti | ˌɑːpərˈtuːnəti | возможность | a chance to do something | This job is a great *opportunity* for you. | Эта работа — отличная возможность для тебя.
- peace | n | piːs |  | мир, покой | a time without war; a calm, quiet state | After the war, the two countries lived in *peace*. | После войны две страны жили в мире.
- possession | n | pəˈzeʃən |  | владение; имущество | something you own | Her bike is her most valued *possession*. | Велосипед — её самое ценное имущество.
- process | n | ˈprəʊses | ˈprɑːses | процесс | a series of actions to get a result | Learning a language is a long *process*. | Изучение языка — долгий процесс.
- progress | n | ˈprəʊɡres | ˈprɑːɡres | прогресс, продвижение | development towards something better | We've made great *progress*. | Мы добились большого прогресса.
- role | n | rəʊl | roʊl | роль | the job or part someone has | Parents play an important *role* in a child's education. | Родители играют важную роль в образовании ребёнка.
- search | n | sɜːtʃ | sɜːrtʃ | поиск, обыск | the act of looking for something | The police began a *search* of the woods. | Полиция начала прочёсывать лес.
- set-up | n | ˈsetʌp |  | устройство, организация | the way something is organised | I like the *set-up* of this office. | Мне нравится, как устроен этот офис.
- washing | n | ˈwɒʃɪŋ | ˈwɑːʃɪŋ | стирка; бельё | clothes that need washing | I'll do the *washing* tomorrow. | Я постираю завтра.
- washing-up | n | ˌwɒʃɪŋ ˈʌp | ˌwɑːʃɪŋ ˈʌp | мытьё посуды (брит.) | washing plates after a meal | It's your turn to do the *washing-up*. | Твоя очередь мыть посуду.
- wave | n | weɪv |  | волна | a line of water that moves across the sea | The *waves* were three metres high. | Волны были трёхметровые. | гл. wave — махать рукой
- well-being | n | ˌwelˈbiɪŋ | ˌwelˈbiːɪŋ | благополучие, хорошее самочувствие | feeling healthy and happy | Exercise improves your *well-being*. | Физкультура улучшает самочувствие.
