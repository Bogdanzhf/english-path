title: 'Describing: same, different, true'
title_ru: 'Описание: сходство, точность, вероятность'
topic: describing
words:
- certain | adj | ˈsɜːtn | ˈsɜːrtn | уверенный; определённый | sure; having no doubt | I'm *certain* that I locked the door. | Я уверен, что запер дверь.
- clear | v | klɪə | klɪr | убирать, расчищать | to remove things from a place | Can you *clear* the table, please? | Можешь убрать со стола? | прил. clear — ясный, понятный
- direct | adj | dəˈrekt |  | прямой | going straight from one place to another without stopping | Is there a *direct* flight to New York? | Есть ли прямой рейс до Нью-Йорка?
- due | adj | djuː | duː | ожидаемый, должный | expected to happen; caused by | The spacecraft is *due* to arrive in 2031. | Космический аппарат должен прибыть в 2031 году. | due to — из-за
- exact | adj | ɪɡˈzækt |  | точный | correct in every detail | Nobody knows the *exact* number of ships lost. | Никто не знает точного числа погибших кораблей.
- necessary | adj | ˈnesəsəri | ˈnesəseri | необходимый | needed; that must be done | Is it *necessary* to book a table? | Нужно ли бронировать столик?
- separate | adj | ˈseprət |  | отдельный | not joined or together | The children sleep in *separate* rooms. | Дети спят в разных комнатах. | гл. separate [ˈsepəreɪt] — разделять
- specific | adj | spəˈsɪfɪk |  | конкретный, определённый | exact; particular | Can you give me a more *specific* answer? | Можешь ответить конкретнее?
- unlike | prep | ʌnˈlaɪk |  | в отличие от | different from | *Unlike* his brother, he loves art. | В отличие от брата, он любит искусство.
