title: Actions and movement
title_ru: Действия и движение
topic: actions
words:
- arrange | v | əˈreɪndʒ |  | устраивать, организовывать; расставлять | to plan or organise something; to put things in order | We *arranged* a meeting for Monday morning. | Мы назначили встречу на утро понедельника.
- cause | v | kɔːz |  | вызывать, быть причиной | to make something happen | The false story *caused* panic. | Ложная история вызвала панику. | сущ. cause — причина; дело
- 'cross | v | krɒs | krɔːs | пересекать, переходить | to go from one side to the other | Look both ways before you *cross* the road. | Посмотри в обе стороны, прежде чем переходить дорогу. | сущ.: cross — крест'
- design | v | dɪˈzaɪn |  | проектировать, разрабатывать | to plan how something will look and work | She *designs* clothes. | Она создаёт одежду.
- destroy | v | dɪˈstrɔɪ |  | разрушать, уничтожать | to damage something so badly that it cannot be used | The fire *destroyed* the old school. | Пожар уничтожил старую школу.
- develop | v | dɪˈveləp |  | развивать(ся), разрабатывать | to grow or change into something bigger or better | The company *developed* a new type of car. | Компания разработала новый тип автомобиля.
- 'dream | n | driːm |  | сон; мечта | pictures in your mind when you sleep; a wish | I had a strange *dream*. | Мне приснился странный сон. | гл.: dream — мечтать, видеть сны'
- 'enter | v | ˈentə | ˈentər | входить | to go into a place | Please knock before you *enter*. | Пожалуйста, стучите, прежде чем войти. | без предлога: enter the room'
- head | v | hed |  | направляться | to go in a direction | We *headed* home after the film. | После фильма мы направились домой.
- invent | v | ɪnˈvent |  | изобретать | to create something new that did not exist before | Who *invented* the telephone? | Кто изобрёл телефон?
- knock | v | nɒk | nɑːk | стучать | to hit a door to be let in | Please *knock* before you come in. | Пожалуйста, стучите, прежде чем войти.
- lead | v | liːd |  | вести, руководить | to go in front and show the way; to be in charge | She *leads* a team of ten people. | Она руководит командой из десяти человек. | lead — led — led
- pass | v | pɑːs | pæs | проходить мимо; передавать; сдавать (экзамен) | to go past; to give; to succeed in an exam | Can you *pass* the salt? | Передай соль, пожалуйста. | pass an exam — сдать экзамен
- perform | v | pəˈfɔːm | pərˈfɔːrm | выступать, исполнять | to sing, dance or play in front of people | The band will *perform* in our town next week. | Группа выступит в нашем городе на следующей неделе.
- print | v | prɪnt |  | печатать | to put words or pictures onto paper with a machine | Can you *print* this page for me? | Можешь распечатать мне эту страницу?
- produce | v | prəˈdjuːs | prəˈduːs | производить | to make or grow something | This region *produces* excellent wine. | Этот регион производит отличное вино.
- publish | v | ˈpʌblɪʃ |  | издавать, публиковать | to print a book or newspaper and sell it | Her first novel was *published* in 2015. | Её первый роман был издан в 2015 году.
- push | v | pʊʃ |  | толкать, нажимать | to move something away from you with force | *Push* the door to open it. | Толкните дверь, чтобы открыть.
- sew | v | səʊ | soʊ | шить | to join cloth with a needle and thread | My grandmother taught me to *sew*. | Бабушка научила меня шить. | sew — sewed — sewn; произносится как so
- splash | v | splæʃ |  | брызгать, плескаться | to make water hit something noisily | The kids *splashed* in the pool. | Дети плескались в бассейне.
- step | v | step |  | шагать, ступать | to put your foot down while walking | Be careful not to *step* on the glass. | Осторожно, не наступи на стекло.
