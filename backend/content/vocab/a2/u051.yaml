title: Communication and language
title_ru: Общение и язык
topic: communication
words:
- code | n | kəʊd | koʊd | код, шифр; кодекс | a system of signs or rules | The message was written in *code*. | Сообщение было написано шифром. | dress code — дресс-код
- curse | v | kɜːs | kɜːrs | проклинать; ругаться | to wish that something bad happens to someone | The witch *cursed* the king and his family. | Ведьма прокляла короля и его семью. | сущ. curse — проклятие
- laughter | n | ˈlɑːftə | ˈlæftər | смех | the sound of people laughing | The room was full of *laughter*. | Комната была полна смеха.
- mail | n | meɪl |  | почта | letters and packages that are sent | Did we get any *mail* today? | Нам сегодня приходила почта? | брит. часто post; email — электронная почта
- permission | n | pəˈmɪʃn | pərˈmɪʃn | разрешение | when someone allows you to do something | You need *permission* to take photos here. | Чтобы фотографировать здесь, нужно разрешение.
- sign | n | saɪn |  | знак, вывеска; признак | a board with words or a picture that gives information | The *sign* says “No parking”. | На знаке написано «Парковка запрещена». | g не произносится
- symbol | n | ˈsɪmbl |  | символ | a sign or picture that means something | The dove is a *symbol* of peace. | Голубь — символ мира.
- target | v | ˈtɑːɡɪt | ˈtɑːrɡɪt | нацеливаться на | to aim something at a particular group or person | The adverts *target* young people. | Реклама нацелена на молодёжь. | сущ. target — цель, мишень
