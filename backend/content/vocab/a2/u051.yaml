title: Communication and language
title_ru: Общение и язык
topic: communication
words:
- capital letter | n | ˈkæpɪtl ˈletə | ˈkæpətl ˈletər | заглавная буква | a big letter like A, B, C | Names start with a *capital letter*. | Имена пишутся с заглавной буквы.
- code | n | kəʊd | koʊd | код, шифр; кодекс | a system of signs or rules | The message was written in *code*. | Сообщение было написано шифром. | dress code — дресс-код
- comment | n | ˈkɒment | ˈkɑːment | комментарий, замечание | something you say or write about someone or something | Thanks for your *comment*. | Спасибо за комментарий.
- curse | v | kɜːs | kɜːrs | проклинать; ругаться | to wish that something bad happens to someone | The witch *cursed* the king and his family. | Ведьма прокляла короля и его семью. | сущ. curse — проклятие
- 'excuse | n | ɪkˈskjuːs |  | оправдание, отговорка | a reason you give for doing something wrong | That''s not a good *excuse*. | Это не оправдание. | гл.: Excuse me — Извините'
- explanation | n | ɪkspləˈneɪʃən | ˌekspləˈneɪʃən | объяснение | a reason or details that make something clear | Thank you for your *explanation*. | Спасибо за объяснение.
- figure | n | ˈfɪɡə | ˈfɪɡjər | цифра; фигура | a number; a shape | Write the number in *figures*. | Напишите число цифрами.
- instruction | n | ɪnˈstrʌkʃən | ˌɪnˈstrʌkʃən | инструкция, указание | information about how to do something | Read the *instructions* carefully. | Внимательно прочитайте инструкцию.
- invitation | n | ɪnvɪˈteɪʃən | ˌɪnvɪˈteɪʃən | приглашение | a request to come to an event | Thanks for the *invitation*! | Спасибо за приглашение!
- laugh | n | lɑːf | læf | смех | the sound of laughing | She has a lovely *laugh*. | У неё приятный смех.
- laughter | n | ˈlɑːftə | ˈlæftər | смех | the sound of people laughing | The room was full of *laughter*. | Комната была полна смеха.
- mail | n | meɪl |  | почта | letters and packages that are sent | Did we get any *mail* today? | Нам сегодня приходила почта? | брит. часто post; email — электронная почта
- permission | n | pəˈmɪʃn | pərˈmɪʃn | разрешение | when someone allows you to do something | You need *permission* to take photos here. | Чтобы фотографировать здесь, нужно разрешение.
- reception | n | rɪˈsepʃən | riːˈsepʃən | ресепшен, стойка регистрации; приём | the place in a hotel where you check in; a formal party | Leave the key at *reception*. | Оставьте ключ на ресепшене.
- request | n | rɪˈkwest | riːˈkwest | просьба, запрос | asking for something politely | They agreed to my *request*. | Они согласились на мою просьбу.
- sign | n | saɪn |  | знак, вывеска; признак | a board with words or a picture that gives information | The *sign* says “No parking”. | На знаке написано «Парковка запрещена». | g не произносится
- symbol | n | ˈsɪmbl |  | символ | a sign or picture that means something | The dove is a *symbol* of peace. | Голубь — символ мира.
- talk | n | tɔːk |  | разговор; доклад | a conversation; a speech | She gave a *talk* about her travels. | Она выступила с докладом о своих путешествиях.
- target | v | ˈtɑːɡɪt | ˈtɑːrɡɪt | нацеливаться на | to aim something at a particular group or person | The adverts *target* young people. | Реклама нацелена на молодёжь. | сущ. target — цель, мишень
- web page | n | web peɪdʒ |  | веб-страница | one page of a website | Click the link to open the *web page*. | Нажмите на ссылку, чтобы открыть страницу.
