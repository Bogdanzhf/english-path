title: Places and the city
title_ru: Город и места
topic: city
words:
- aisle | n | aɪl |  | проход (между рядами) | a passage between rows of seats | Would you like a window or an *aisle* seat? | Вам место у окна или у прохода? | s не читается
- bridge | n | brɪdʒ |  | мост | a structure built over a river or road | We walked across the old stone *bridge*. | Мы перешли старый каменный мост.
- car park | phr |  |  | автостоянка, парковка | a place where you leave cars | The *car park* is behind the shop. | Парковка за магазином. | американское — parking lot
- direction | n | dəˈrekʃn |  | направление | the way towards a place | We walked in the wrong *direction*. | Мы пошли не в ту сторону. | directions — указания, как пройти
- factory | n | ˈfæktri |  | фабрика, завод | a building where things are made by machines | My uncle works in a car *factory*. | Мой дядя работает на автомобильном заводе.
- gate | n | ɡeɪt |  | ворота, калитка | a door in a fence or a wall | Please close the *gate* behind you. | Пожалуйста, закройте за собой калитку.
- position | n | pəˈzɪʃn |  | должность; положение | a job in an organization; a situation | She applied for the *position* of manager. | Она подала заявку на должность менеджера.
- site | n | saɪt |  | место, участок; сайт | a place where something is or happens | This is the *site* of a new hospital. | Здесь будет построена новая больница. | website — веб-сайт
- source | n | sɔːs | sɔːrs | источник | where something comes from | Old school records are a great *source* of information. | Старые школьные журналы — прекрасный источник информации.
- stairs | n | steəz | sterz | лестница | a set of steps inside a building | She ran up the *stairs*. | Она взбежала по лестнице.
- 'tip | n | tɪp |  | кончик; совет; чаевые | the pointed end of something; a piece of advice; extra money for a waiter | Here''s a useful *tip*: learn ten words every day. | Вот полезный совет: учи по десять слов каждый день.'
- tower | n | ˈtaʊə | ˈtaʊər | башня | a tall narrow building | We climbed to the top of the *tower*. | Мы поднялись на вершину башни.
- tube | n | tjuːb | tuːb | трубка, тюбик; метро (Лондон) | a long thin pipe; a container for toothpaste | The doctor put a *tube* into his arm. | Врач ввёл трубку ему в руку. | the Tube — лондонское метро
