title: Everyday phrases
title_ru: Разговорные фразы
topic: phrases
words:
- sound like somebody/something | phr |  |  | звучать как, похоже на | to seem to be, from what you hear | That *sounds like* a great idea! | Звучит как отличная идея!
- start with somebody/something | phr |  |  | начинать с | to begin by doing or having something | Let's *start with* the easy questions. | Давайте начнём с лёгких вопросов.
- such a/an... | phr |  |  | такой… | used to make an adjective stronger | It was *such a* nice day! | Был такой хороший день!
- take care of somebody/something/yourself | phr |  |  | заботиться о | to look after | *Take care of* yourself! | Береги себя!
- take part | phr |  |  | участвовать | to be involved in an activity | Ten schools *took part* in the competition. | В соревновании участвовали десять школ.
- the best thing | phr |  |  | лучшее (что можно) | the most positive thing | *The best thing* about my job is the people. | Лучшее в моей работе — люди.
- the first thing | phr |  |  | первым делом | the thing done before anything else | *The first thing* I do in the morning is drink coffee. | Первым делом утром я пью кофе.
- the following... | phr |  |  | следующий, нижеперечисленный | what comes next | Answer *the following* questions. | Ответьте на следующие вопросы.
- the important thing | phr |  |  | главное | the most important point | *The important thing* is to try. | Главное — попытаться.
- the other side of something | phr |  |  | другая сторона (чего-либо) | the opposite side | They live on *the other side of* the river. | Они живут на другом берегу реки.
- the rest of something | phr |  |  | остальная часть, остальные | what is left | Where are *the rest of* the students? | Где остальные студенты?
- these days | phr |  |  | в наши дни, сейчас | at the present time | *These days*, everyone has a phone. | В наши дни у всех есть телефон.
- they say... | phr |  |  | говорят, что… | people say | *They say* it's going to be a cold winter. | Говорят, зима будет холодной.
- throw something away | phr |  |  | выбрасывать | to put something in the rubbish | Don't *throw away* these boxes. | Не выбрасывай эти коробки.
- up and down | phr |  |  | вверх и вниз; туда-сюда | moving higher and lower; back and forth | The kids were jumping *up and down*. | Дети прыгали вверх-вниз.
- why not...? | phr |  |  | почему бы не…? | used to make a suggestion | *Why not* ask your teacher? | Почему бы не спросить учителя?
- worried about somebody/something | phr |  |  | обеспокоенный (чем-либо) | anxious about | I'm *worried about* my brother. | Я беспокоюсь о брате.
- would love to do something | phr |  |  | очень хотелось бы | would very much like to | I *would love to* visit Japan. | Мне бы очень хотелось побывать в Японии.
- write something down | phr |  |  | записывать | to write something on paper | *Write down* your phone number. | Запиши свой номер телефона.
