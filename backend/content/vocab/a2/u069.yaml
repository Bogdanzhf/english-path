title: 'Describing: amount and degree'
title_ru: 'Описание: количество и степень'
topic: describing
words:
- double | adj | ˈdʌbl |  | двойной | twice as much or twice as many | I'd like a *double* room, please. | Мне, пожалуйста, двухместный номер.
- major | adj | ˈmeɪdʒə | ˈmeɪdʒər | главный, крупный | very large or important | Climate change is a *major* problem. | Изменение климата — серьёзная проблема. | minor — незначительный
- male | adj | meɪl |  | мужской, мужского пола | belonging to the sex that cannot have babies | The *male* lion has a big mane. | У льва-самца большая грива.
- material | n | məˈtɪəriəl | məˈtɪriəl | материал | what something is made from | Wood is a natural building *material*. | Дерево — натуральный строительный материал.
- middle | n | ˈmɪdl |  | середина | the central part | They were stranded in the *middle* of the ocean. | Они оказались посреди океана.
- physical | adj | ˈfɪzɪkl |  | физический | connected with the body | Swimming is a good *physical* activity. | Плавание — хорошая физическая нагрузка.
- public | adj | ˈpʌblɪk |  | общественный, публичный | for everyone; not private | You can't smoke in *public* places. | В общественных местах курить нельзя.
- secret | n | ˈsiːkrət |  | секрет, тайна | something that other people must not know | Can you keep a *secret*? | Ты умеешь хранить секреты?
- single | adj | ˈsɪŋɡl |  | единственный, один; одинокий | only one; not married | I didn't hear a *single* word he said. | Я не услышал ни единого слова из того, что он сказал.
- state | n | steɪt |  | состояние; государство; штат | the condition of someone or something | He was in a terrible *state* before the flight. | Перед полётом он был в ужасном состоянии.
