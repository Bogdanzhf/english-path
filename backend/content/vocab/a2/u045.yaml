title: Everyday phrases
title_ru: Разговорные фразы
topic: phrases
words:
- first of all | phr |  |  | прежде всего, во-первых | used to introduce the first point | *First of all*, let me thank you all. | Прежде всего позвольте поблагодарить всех вас.
- focus on somebody/something | phr |  |  | сосредоточиться на | to give all your attention to | Let's *focus on* the main problem. | Давайте сосредоточимся на главной проблеме.
- followed by somebody/something | phr |  |  | после которого, за которым следует | coming after | Dinner will be at seven, *followed by* a film. | Ужин в семь, а после — фильм.
- for the rest of something | phr |  |  | до конца (чего-либо) | for all the remaining time | I stayed at home *for the rest of* the day. | Остаток дня я провёл дома.
- for this reason | phr |  |  | по этой причине | because of this | It was raining. *For this reason*, we stayed in. | Шёл дождь. По этой причине мы остались дома.
- get better | phr |  |  | поправляться; улучшаться | to become healthier; to improve | I hope you *get better* soon. | Надеюсь, ты скоро поправишься.
- get lost | phr |  |  | заблудиться | to not know where you are | We *got lost* in the old town. | Мы заблудились в старом городе.
- get out | phr |  |  | выходить, выбираться | to leave a place or a car | *Get out* of the car carefully. | Выходи из машины осторожно.
- go and... | phr |  |  | пойти и (сделать) | to go somewhere to do something | *Go and* ask your teacher. | Пойди спроси учителя.
- go away | phr |  |  | уходить, уезжать | to leave a place | *Go away*! I'm busy. | Уходи! Я занят.
- go down | phr |  |  | спускаться; снижаться | to move to a lower place; to decrease | Prices *go down* in winter. | Зимой цены снижаются.
- go down something | phr |  |  | идти вниз по; идти вдоль | to walk along a street or down stairs | *Go down* this street and turn left. | Идите по этой улице и поверните налево.
- go for something | phr |  |  | выбрать; пойти (на прогулку и т. п.) | to choose; to go and do an activity | Let's *go for* a walk. | Пойдём прогуляемся.
- go up | phr |  |  | подниматься; расти | to move higher; to increase | Prices *go up* every year. | Цены растут каждый год.
- good luck | phr |  |  | удачи! | used to wish someone success | *Good luck* with your exam! | Удачи на экзамене!
- happen to somebody/something | phr |  |  | случаться с | to be the result for someone | What *happened to* your car? | Что случилось с твоей машиной?
- happy with somebody/something | phr |  |  | довольный (кем-либо, чем-либо) | satisfied with | Are you *happy with* your new job? | Ты доволен новой работой?
- have a look | phr |  |  | взглянуть, посмотреть | to look at something | Can I *have a look* at your photos? | Можно посмотреть твои фотографии?
- have got to | phr |  |  | быть должным, нужно (разг.) | must; have to | I've *got to* go now. | Мне пора идти.
