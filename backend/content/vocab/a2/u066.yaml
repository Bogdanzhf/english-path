title: Thinking and opinions
title_ru: Мысли и мнения
topic: mind
words:
- ability | n | əˈbɪləti |  | способность | the power or skill to do something | She has the *ability* to learn languages quickly. | У неё способность быстро учить языки.
- appearance | n | əˈpiərəns | əˈpɪrəns | внешность, вид; появление | the way someone looks | She cares about her *appearance*. | Она следит за своей внешностью.
- attention | n | əˈtenʃn |  | внимание | the act of watching, listening or thinking carefully | Pay *attention* to the teacher. | Будь внимателен к тому, что говорит учитель. | pay attention to
- choice | n | tʃɔɪs |  | выбор | the act of choosing; things you can choose from | You made the right *choice*. | Ты сделал правильный выбор.
- experience | v | ɪkˈspɪəriəns | ɪkˈspɪriəns | испытывать, переживать | to have something happen to you | Many people *experience* stress at work. | Многие испытывают стресс на работе. | сущ. experience — опыт
- expression | n | ɪkˈspreʃən | ɪksˈpreʃən | выражение | a phrase; the look on a face | "Break a leg" is a funny *expression*. | «Break a leg» — забавное выражение.
- feature | n | ˈfiːtʃə | ˈfiːtʃər | особенность, черта | an important or typical part of something | The best *feature* of this phone is its camera. | Главная особенность этого телефона — камера.
- gap | n | ɡæp |  | промежуток, щель, пробел | a space between two things | The cat got out through a *gap* in the fence. | Кошка выбралась через щель в заборе.
- image | n | ˈɪmɪdʒ |  | изображение, образ | a picture of something; an idea in your mind | The *image* on the screen was not clear. | Изображение на экране было нечётким.
- manner | n | ˈmænə | ˈmænər | манера, образ (действий) | the way something is done | She spoke in a friendly *manner*. | Она говорила дружелюбно. | manners — манеры
- memory | n | ˈmeməri |  | память; воспоминание | the ability to remember; something you remember | I have a good *memory* for faces. | У меня хорошая память на лица.
- plenty | pron | ˈplenti |  | множество, вполне достаточно | a lot; more than enough | Don't hurry — we have *plenty* of time. | Не спеши — у нас полно времени. | plenty of + сущ.
- purpose | n | ˈpɜːpəs | ˈpɜːrpəs | цель, назначение | the reason why something is done | What is the *purpose* of your visit? | Какова цель вашего визита? | on purpose — нарочно
- sense | v | sens |  | чувствовать, ощущать | to feel or know something without being told | The dog *sensed* that something was wrong. | Собака почувствовала, что что-то не так.
- shape | n | ʃeɪp |  | форма, очертание | the form of something, for example round or square | The cake was in the *shape* of a heart. | Торт был в форме сердца.
- thinking | n | ˈθɪŋkɪŋ |  | мышление; мнение | the process of thinking; ideas | What's your *thinking* on this? | Что ты думаешь по этому поводу?
- thought | n | θɔːt |  | мысль | an idea | That's an interesting *thought*. | Интересная мысль.
- trouble | n | ˈtrʌbl |  | беда, неприятности, трудность | problems or difficulties | I had *trouble* finding your house. | Я с трудом нашёл твой дом. | be in trouble — быть в беде
- view | n | vjuː |  | вид (из окна, на что-либо) | what you can see from a place | Our room has a beautiful *view* of the sea. | Из нашего номера открывается красивый вид на море.
