title: Everyday phrases
title_ru: Разговорные фразы
topic: phrases
words:
- on the ground | phr |  |  | на земле | on the surface of the earth | The children sat *on the ground*. | Дети сели на землю.
- on the other side | phr |  |  | на другой стороне | across from here | The shop is *on the other side* of the road. | Магазин на другой стороне дороги.
- on the wall | phr |  |  | на стене | hanging on a wall | There's a clock *on the wall*. | На стене висят часы.
- on time | phr |  |  | вовремя | at the correct time | The train arrived *on time*. | Поезд прибыл вовремя. | in time — вовремя, заранее
- on top of something/somebody | phr |  |  | на (верху), поверх | on the highest part of | There's a cat *on top of* the car. | На крыше машины сидит кошка.
- one or two | phr |  |  | один-два, пара | a few | I have *one or two* questions. | У меня есть пара вопросов.
- ordinary people | phr |  |  | обычные люди | normal people, not famous or rich | The law helps *ordinary people*. | Этот закон помогает обычным людям.
- pay attention | phr |  |  | обращать внимание | to listen or watch carefully | Please *pay attention* to the teacher. | Пожалуйста, слушайте учителя.
- per hour | phr |  |  | в час | for each hour | The speed limit is 60 km *per hour*. | Ограничение скорости — 60 км в час.
- quite a lot | phr |  |  | довольно много | a fairly large amount | I read *quite a lot*. | Я довольно много читаю.
- reasons why | phr |  |  | причины, по которым | the explanations for something | There are many *reasons why* people move. | Есть много причин, по которым люди переезжают.
- refer to somebody/something | phr |  |  | ссылаться на; иметь в виду | to mention or talk about | Who are you *referring to*? | Кого ты имеешь в виду?
- report on something | phr |  |  | сообщать о, делать репортаж о | to give information about | She *reported on* the elections. | Она делала репортажи о выборах.
- respond to something/somebody | phr |  |  | отвечать на; реагировать на | to answer; to react | He didn't *respond to* my letter. | Он не ответил на моё письмо.
- save money | phr |  |  | копить, экономить деньги | to keep money for later | I'm *saving money* for a new car. | Я коплю на новую машину.
- search for something/somebody | phr |  |  | искать | to look carefully for | The police are *searching for* the missing girl. | Полиция ищет пропавшую девочку.
- so that... | phr |  |  | чтобы, для того чтобы | in order that | I left early *so that* I could catch the train. | Я вышел пораньше, чтобы успеть на поезд.
- solution to something | phr |  |  | решение (проблемы) | an answer to a problem | We need a *solution to* this problem. | Нам нужно решение этой проблемы.
- sort of something | phr |  |  | вид, тип (чего-либо) | a kind of | What *sort of* music do you like? | Какую музыку ты любишь? | sort of (разг.) — вроде, как бы
