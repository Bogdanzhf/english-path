title: Events and situations
title_ru: События и ситуации
topic: events
words:
- accident | n | ˈæksɪdənt |  | авария, несчастный случай | something bad that happens by chance, often hurting people | He broke his leg in a car *accident*. | Он сломал ногу в автомобильной аварии. | by accident — случайно
- condition | n | kənˈdɪʃn |  | состояние; условие | the state that something or someone is in | The old car is still in good *condition*. | Старая машина всё ещё в хорошем состоянии.
- movement | n | ˈmuːvmənt |  | движение, течение | a group of people with the same ideas, especially in art or politics | Impressionism was an art *movement* of the 19th century. | Импрессионизм — художественное течение XIX века.
- process | n | ˈprəʊses | ˈprɑːses | процесс | a series of actions to get a result | Learning a language is a long *process*. | Изучение языка — долгий процесс.
- progress | n | ˈprəʊɡres | ˈprɑːɡres | прогресс, продвижение | development towards something better | We've made great *progress*. | Мы добились большого прогресса.
- role | n | rəʊl | roʊl | роль | the job or part someone has | Parents play an important *role* in a child's education. | Родители играют важную роль в образовании ребёнка.
- search | n | sɜːtʃ | sɜːrtʃ | поиск, обыск | the act of looking for something | The police began a *search* of the woods. | Полиция начала прочёсывать лес.
