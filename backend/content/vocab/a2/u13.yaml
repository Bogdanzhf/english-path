reading:
  title: "The Climb"
  title_ru: "Восхождение"
  text: |
    Anna had always dreamed of climbing a big mountain. But she had a problem: intense anxiety. Even a small hill made her heart beat fast. Her initial idea was to quit before she started. Instead, she decided to consult a climbing tutor named Pete.

    Pete was a former army officer who had climbed peaks all over the world. "I can't guarantee success," he told her. "But you have potential. Fear is normal. We'll start small." For six months, they trained together. At first, Anna climbed tiny rocks in the park. Then they went to real mountains.

    Finally, Pete thought she was ready for a big challenge: a mountain in Scotland, more than a thousand metres high. A friend lent Anna good boots, and she bought adequate equipment. On the morning of the climb, her head was spinning with nerves.

    Halfway up, the weather changed. Thick clouds came, and a man from another group fell and hurt his leg. It was an emergency. Anna forgot her fear. She called the rescue team and stayed with the man, keeping him warm, until a helicopter arrived. Pete was very proud.

    After the helicopter left, they continued and reached the peak. Anna carved her initials on a small stone and put it in her pocket as proof. She didn't make a fortune or become famous, but she felt more pride than a billion dollars could buy. "Fear is not a wall," she says now. "It's a door."
  ru: |
    Анна всегда мечтала подняться на большую гору. Но у неё была проблема — сильная тревожность. Даже небольшой холм заставлял её сердце колотиться. Сначала она хотела бросить, не начав. Вместо этого она решила посоветоваться с инструктором по скалолазанию по имени Пит.

    Пит был бывшим армейским офицером, покорявшим вершины по всему миру. «Не могу гарантировать успех, — сказал он ей. — Но у тебя есть потенциал. Страх — это нормально. Начнём с малого». Полгода они тренировались вместе. Сначала Анна лазила по крошечным скалам в парке. Потом они поехали в настоящие горы.

    Наконец Пит решил, что она готова к серьёзному испытанию — горе в Шотландии высотой более тысячи метров. Подруга одолжила Анне хорошие ботинки, а подходящее снаряжение она купила сама. Утром в день восхождения у неё от волнения кружилась голова.

    На полпути погода изменилась. Пришли густые облака, а мужчина из другой группы упал и повредил ногу. Это была чрезвычайная ситуация. Анна забыла о страхе. Она вызвала спасателей и оставалась с мужчиной, согревая его, пока не прилетел вертолёт. Пит очень ею гордился.

    Когда вертолёт улетел, они продолжили путь и поднялись на вершину. Анна вырезала свои инициалы на маленьком камне и положила его в карман как доказательство. Она не разбогатела и не прославилась, но испытала гордость, которую не купишь и за миллиард долларов. «Страх — это не стена, — говорит она теперь. — Это дверь».
  questions:
    - q: "What was Anna's problem?"
      options: ["She had no money", "Intense anxiety", "A bad leg", "She had no time"]
