title: Free time and sport
title_ru: Досуг и спорт
topic: leisure
words:
- board game | n | bɔːd ɡeɪm | bɔːrd ɡeɪm | настольная игра | a game played on a board, like chess | We play *board games* on Friday nights. | По пятницам мы играем в настольные игры.
- camping | n | ˈkæmpɪŋ |  | кемпинг, жизнь в палатках | sleeping in a tent on holiday | We go *camping* every summer. | Каждое лето мы ходим в поход с палатками.
- chess | n | tʃes |  | шахматы | a game for two players with 32 pieces on a board | Do you play *chess*? | Ты играешь в шахматы?
- climbing | n | ˈklaɪmɪŋ |  | скалолазание, альпинизм | the sport of climbing rocks or mountains | *Climbing* is my favourite sport. | Скалолазание — мой любимый спорт.
- collection | n | kəˈlekʃən |  | коллекция; сбор | a group of things collected | He has a huge stamp *collection*. | У него огромная коллекция марок.
- drive | n | draɪv |  | поездка (на машине) | a journey in a car | Let's go for a *drive*. | Давай прокатимся.
- goal | n | ɡəʊl | ɡoʊl | цель; гол | something you want to achieve; a point in football | My *goal* is to speak English fluently. | Моя цель — свободно говорить по-английски.
- hip hop | n | hɪp hɒp | hɪp hɑːp | хип-хоп | a type of music with rap | My son listens to *hip hop*. | Мой сын слушает хип-хоп.
- race | n | reɪs |  | гонка, забег | a competition to see who is the fastest | He came second in the *race*. | Он пришёл вторым в забеге.
- racket | n | ˈrækɪt |  | ракетка | a bat with strings for tennis or badminton | I need a new tennis *racket*. | Мне нужна новая теннисная ракетка.
- run | n | rʌn |  | пробежка; забег | a time when you run | I go for a *run* every morning. | Каждое утро я выхожу на пробежку.
- running | n | ˈrʌnɪŋ |  | бег | the sport of running | *Running* helps me relax. | Бег помогает мне расслабиться.
- sailing | n | ˈseɪlɪŋ |  | парусный спорт, хождение под парусом | the sport of travelling in a boat with sails | We went *sailing* on the lake. | Мы ходили под парусом по озеру.
- singing | n | ˈsɪŋɪŋ |  | пение | making music with your voice | She takes *singing* lessons. | Она берёт уроки вокала.
- snowboarding | n | ˈsnəʊbɔːdɪŋ | snˈəʊbɔːdɪŋ | сноубординг | the sport of moving down snow on a board | *Snowboarding* is popular in the Alps. | Сноубординг популярен в Альпах.
- video game | n | ˈvɪdɪəʊ ɡeɪm | ˈvɪdiːoʊ ɡeɪm | видеоигра | a game played on a computer or console | He plays *video games* every evening. | Он играет в видеоигры каждый вечер.
- walking | n | ˈwɔːkɪŋ |  | ходьба, пешие прогулки | the activity of going on walks | *Walking* is good exercise. | Ходьба — хорошее упражнение.
