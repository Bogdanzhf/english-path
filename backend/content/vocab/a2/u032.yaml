title: Free time and sport
title_ru: Досуг и спорт
topic: leisure
words:
- goal | n | ɡəʊl | ɡoʊl | цель; гол | something you want to achieve; a point in football | My *goal* is to speak English fluently. | Моя цель — свободно говорить по-английски.
- race | n | reɪs |  | гонка, забег | a competition to see who is the fastest | He came second in the *race*. | Он пришёл вторым в забеге.
