title: Technology
title_ru: Технологии
topic: tech
words:
- app | n | æp |  | приложение | a program on a phone or computer | I use this *app* to learn English. | Я учу английский с помощью этого приложения.
- blog | n | blɒɡ | blɔːɡ | блог | a website where someone writes regularly | She writes a travel *blog*. | Она ведёт блог о путешествиях.
- device | n | dɪˈvaɪs |  | устройство, прибор | a machine or tool made for a particular purpose | The *device* measures your heart rate. | Устройство измеряет пульс.
- digital | adj | ˈdɪdʒɪtl |  | цифровой | using computer technology | We live in a *digital* age. | Мы живём в цифровую эпоху.
- digital camera | n | ˈdɪdʒɪtl ˈkæmrə | ˈdɪdʒətl ˈkæmərə | цифровой фотоаппарат | a camera that stores photos electronically | I bought a new *digital camera*. | Я купил новый цифровой фотоаппарат.
- download | v | ˈdaʊnləʊd | ˈdaʊnloʊd | скачивать | to copy files from the internet | You can *download* the app for free. | Приложение можно скачать бесплатно.
- electronic | adj | ɪˌlekˈtrɒnɪk | ɪˌlekˈtrɑːnɪk | электронный | using electricity and computer parts | You can buy *electronic* tickets online. | Можно купить электронные билеты онлайн.
- headphone | n | ˈhedfəʊn | ˈhedfoʊn | наушники (headphones) | a device you wear over your ears to listen | Put on your *headphones*. | Надень наушники.
- mobile | adj | ˈməʊbaɪl | ˈmoʊbl | мобильный, подвижный | able to move easily | Cars made people much more *mobile*. | Автомобили сделали людей гораздо мобильнее.
- MP3 player | n |  |  | MP3-плеер | a device for playing music files | I listen to music on my *MP3 player*. | Я слушаю музыку на MP3-плеере.
- network | n | ˈnetwɜːk | ˈnetwɜːrk | сеть | a group of connected people or things | She built a *network* of contacts across Europe. | Она создала сеть контактов по всей Европе.
- PC | n | ˈpiˈsi | ˈpiːˈsiː | персональный компьютер | a personal computer | I play games on my *PC*. | Я играю в игры на компьютере.
- printer | n | ˈprɪntə | ˈprɪnər | принтер | a machine that prints | The *printer* isn't working. | Принтер не работает.
- program | n | ˈprəʊɡræm | ˈproʊɡræm | программа (компьютерная); передача (амер.) | a set of instructions for a computer | Install this *program* on your laptop. | Установите эту программу на ноутбук.
- screen | n | skriːn |  | экран | the flat surface of a TV or computer | My phone *screen* is broken. | У меня разбит экран телефона.
- "smartphone | n | sm\x01ːtfəʊn | ˈsmɑːrtfoʊn | смартфон | a mobile phone that works like a computer | Almost everyone has a *smartphone*. | Почти у всех есть смартфон."
- tablet | n | ˈtæblət |  | планшет; таблетка | a small flat computer; a pill | I read books on my *tablet*. | Я читаю книги на планшете.
- technology | n | tekˈnɒlədʒi | tekˈnɑːlədʒi | технология, техника | the use of science to make machines and tools | Modern *technology* makes life easier. | Современные технологии облегчают жизнь.
- text message | n | tekst ˈmesɪdʒ | tekst ˈmesədʒ | текстовое сообщение, смс | a short message sent by phone | I got a *text message* from Tom. | Мне пришло сообщение от Тома.
- virus | n | ˈvaɪrəs |  | вирус | a tiny thing that causes illness; a computer program that damages files | My computer has a *virus*. | В моём компьютере вирус.
- web | n | web |  | паутина; сеть (интернет) | the net that a spider makes; the internet | A spider was sitting in the middle of its *web*. | Паук сидел в центре паутины. | the Web — интернет
reading:
  title: The Inn by the Bridge
  title_ru: Гостиница у моста
  text: |
    For two hundred years, the Old Bridge Inn has stood next to a stone bridge over a quiet river. Today, it is run by Sam, a man of seventy with a simple philosophy: "Slow is good." There is no TV, no electronic music and no Wi-Fi. Guests come to rest, read and fish.

    Last summer, Sam's grandson Leo came to stay. Leo was fifteen and lived his whole life in a virtual world of games and social media. At first, he hated the inn. "There's nothing to do here," he whispered angrily to his mother. But his mother had no plans to leave, so he had to accompany Sam every morning.

    Sam showed him how to cast a fishing line into the river and how to repair the old nets. He taught him to grow vegetables from seeds and to cook them in a big black pot over a fire. Leo learned to clean fish with a sharp knife and to weigh them on an old metal scale.

    One morning, they climbed a tree to fix a branch that was hanging over the river. Leo looked down and caught his breath. The river shone in the sun, and a deer was drinking from the water. He didn't dare to move. "This," Sam said quietly, "is better than any screen."

    At the end of the summer, Leo didn't want to leave. In his bag, he took a tight jar of honey, some seeds and a new sort of happiness. "If you subtract the phone," he told his friends at home, "you add a whole world."
  ru: |
    Уже двести лет гостиница «Старый мост» стоит рядом с каменным мостом через тихую реку. Сегодня ею управляет Сэм — семидесятилетний мужчина с простой философией: «Медленно — значит хорошо». Здесь нет телевизора, электронной музыки и Wi-Fi. Гости приезжают отдыхать, читать и рыбачить.

    Прошлым летом к Сэму приехал внук Лео. Лео было пятнадцать, и всю жизнь он прожил в виртуальном мире игр и соцсетей. Сначала он возненавидел гостиницу. «Тут нечего делать», — сердито шептал он маме. Но мама уезжать не собиралась, так что ему приходилось каждое утро сопровождать Сэма.

    Сэм показал ему, как забрасывать удочку в реку и как чинить старые сети. Он научил его выращивать овощи из семян и готовить их в большом чёрном котелке на костре. Лео научился чистить рыбу острым ножом и взвешивать её на старых металлических весах.

    Однажды утром они залезли на дерево, чтобы подвязать ветку, нависшую над рекой. Лео посмотрел вниз и затаил дыхание. Река сверкала на солнце, а из воды пил олень. Он не смел пошевелиться. «Вот это, — тихо сказал Сэм, — лучше любого экрана».

    В конце лета Лео не хотел уезжать. В сумку он положил плотно закрытую банку мёда, немного семян и новый вид счастья. «Если вычесть телефон, — сказал он друзьям дома, — прибавится целый мир».
  questions:
  - q: What is Sam's philosophy?
    options:
    - Fast is good
    - Slow is good
    - Money is everything
    - Technology helps
    answer: 1
  - q: How did Leo feel when he first arrived?
    options:
    - Happy
    - He hated the inn
    - Excited
    - Calm
    answer: 1
  - q: What did Leo see from the tree?
    options:
    - A fisherman
    - A deer drinking from the river
    - His mother
    - A boat
    answer: 1
  - tf: The inn has fast Wi-Fi.
    answer: false
  - tf: At the end of the summer, Leo didn't want to leave.
    answer: true
