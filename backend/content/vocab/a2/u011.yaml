title: Body and health
title_ru: Тело и здоровье
topic: body
words:
- ankle | n | ˈæŋkl |  | лодыжка | the joint between the foot and the leg | She twisted her *ankle* on the ice. | Она подвернула лодыжку на льду.
- belly | n | ˈbeli |  | живот, брюхо | the stomach (informal) | The dog lay on its *belly* in the sun. | Собака лежала на животе на солнце.
- bone | n | bəʊn | boʊn | кость | one of the hard white parts inside the body | He broke a *bone* in his arm. | Он сломал кость в руке.
- brain | n | breɪn |  | мозг | the organ in your head that you think with | The human *brain* never stops working. | Человеческий мозг никогда не перестаёт работать.
- chin | n | tʃɪn |  | подбородок | the bottom part of your face below your mouth | He has a small beard on his *chin*. | У него на подбородке маленькая бородка.
- cigarette | n | ˌsɪɡəˈret | ˈsɪɡəret | сигарета | a thin paper tube of tobacco for smoking | He hasn't smoked a *cigarette* in ten years. | Он не выкурил ни одной сигареты за десять лет.
- disease | n | dɪˈziːz |  | болезнь | an illness | Heart *disease* is a major cause of death. | Болезни сердца — одна из главных причин смерти.
- drug | n | drʌɡ |  | лекарство; наркотик | a medicine; an illegal substance | This *drug* helps with the pain. | Это лекарство помогает от боли.
- finger | n | ˈfɪŋɡə | ˈfɪŋɡər | палец (руки) | one of the five parts at the end of your hand | I cut my *finger*. | Я порезал палец. | палец ноги — toe
- flu | n | fluː |  | грипп | an illness like a bad cold with fever | She's in bed with *flu*. | Она лежит с гриппом.
- foot | n | fʊt |  | ступня, нога; фут | the part of the leg you stand on; 30 cm | My *foot* hurts. | У меня болит нога. | мн. ч. feet; on foot — пешком
- heart | n | hɑːt | hɑːrt | сердце | the organ in your chest that pumps blood | Running is good for your *heart*. | Бег полезен для сердца.
- illness | n | ˈɪlnəs |  | болезнь | the state of being ill | He missed school because of *illness*. | Он пропустил школу из-за болезни.
- injury | n | ˈɪndʒəri |  | травма, ранение | damage to the body | He had a knee *injury*. | У него была травма колена.
- knee | n | niː |  | колено | the joint in the middle of your leg | I hurt my *knee* playing football. | Я ушиб колено, играя в футбол.
- neck | n | nek |  | шея | the part between your head and your body | She has a long *neck*. | У неё длинная шея.
- shoulder | n | ˈʃəʊldə | ˈʃoʊldər | плечо | the part of the body between the neck and the arm | He carried the bag on his *shoulder*. | Он нёс сумку на плече.
- skin | n | skɪn |  | кожа | the outer layer of a person's or animal's body | Use cream to protect your *skin*. | Пользуйтесь кремом, чтобы защитить кожу.
- stomach | n | ˈstʌmək |  | желудок, живот | the organ where food goes; the front of the body below the chest | I have a *stomach* ache. | У меня болит живот.
- stress | n | stres |  | стресс, напряжение | a feeling of worry because of problems | Too much *stress* is bad for your health. | Сильный стресс вредит здоровью.
