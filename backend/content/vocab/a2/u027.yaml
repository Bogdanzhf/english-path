title: Work and jobs
title_ru: Работа и профессии
topic: work
words:
- apply | v | əˈplaɪ |  | применять(ся); подавать заявление | to be relevant; to use something; to ask officially for a job | The same laws of physics *apply* on every planet. | Одни и те же законы физики действуют на всех планетах.
- chef | n | ʃef |  | шеф-повар | a professional cook in a restaurant | The *chef* came out to greet the guests. | Шеф-повар вышел поприветствовать гостей. | ch читается как [ʃ]
- engineer | v | ˌendʒɪˈnɪə | ˌendʒɪˈnɪr | конструировать; искусно организовать | to plan and build something with skill | The bridge was *engineered* to survive earthquakes. | Мост был спроектирован так, чтобы выдерживать землетрясения. | сущ. engineer — инженер
- expert | n | ˈekspɜːt | ˈekspɜːrt | эксперт, специалист | a person who knows a lot about something | She is an *expert* in Chinese history. | Она специалист по истории Китая.
- guide | n | ɡaɪd |  | гид, проводник | a person who shows the way or tells tourists about a place | Our *guide* showed us the old part of the city. | Гид показал нам старую часть города.
- officer | n | ˈɒfɪsə | ˈɔːfɪsər | офицер; должностное лицо | a person in a high position in the army or police | A police *officer* stopped our car. | Полицейский остановил нашу машину.
- professor | n | prəˈfesə | prəˈfesər | профессор | a teacher at a university | *Professor* Smith teaches history. | Профессор Смит преподаёт историю.
