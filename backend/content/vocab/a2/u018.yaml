title: Places and the city
title_ru: Город и места
topic: city
words:
- barber | n | ˈbɑːbə | ˈbɑːrbər | парикмахер (мужской) | a person who cuts men's hair | I go to the *barber* every month. | Я хожу к парикмахеру каждый месяц.
- block | n | blɒk | blɑːk | квартал; блок, глыба | the distance between two streets; a solid piece of something | The bank is two *blocks* from here. | Банк в двух кварталах отсюда.
- crowd | n | kraʊd |  | толпа | a large group of people | A *crowd* gathered outside the stadium. | У стадиона собралась толпа.
- flag | n | flæɡ |  | флаг | a piece of cloth with a design that represents a country | The Japanese *flag* is white with a red circle. | Флаг Японии белый с красным кругом.
- hole | n | həʊl | hoʊl | дыра, отверстие, яма | an empty space in something | There's a *hole* in my sock. | У меня дырка в носке.
- platform | n | ˈplætfɔːm | ˈplætfɔːrm | платформа | a website or service; a raised area at a station | YouTube is the most popular video *platform*. | YouTube — самая популярная видеоплатформа.
- population | n | ˌpɒpjuˈleɪʃn | ˌpɑːpjuˈleɪʃn | население | all the people living in a place | The *population* of the city is two million. | Население города — два миллиона человек.
- post office | phr |  |  | почта, почтовое отделение | a place where you send letters and parcels | Where is the nearest *post office*? | Где ближайшая почта?
- region | n | ˈriːdʒən |  | регион, область | a large area of a country or the world | The North Sea *region* is rich in oil. | Регион Северного моря богат нефтью.
- society | n | səˈsaɪəti |  | общество | people living together in a country or group | Old people are important members of *society*. | Пожилые люди — важные члены общества.
