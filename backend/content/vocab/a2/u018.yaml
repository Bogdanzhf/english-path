reading:
  title: The Mountain Race
  title_ru: Горная гонка
  text: |
    Every summer, a ski resort in the Alps organizes a race for teenagers. The rules are simple. Each team gets a map and a list of instructions. They must find ten flags on the mountain and reach the final destination, an old hut at the edge of a valley, before sunset.

    This year, Kim and her brother Paul were in the race. Kim was capable of reading any map, and Paul had broad shoulders and could carry the heavy bags. They felt confident.

    The first part was easy. They followed a path through the forest and found five flags. But then the path disappeared. They had to concentrate on the map. Suddenly, Paul noticed something strange: another team was hiding behind a bush and looking at them. "I suspect they want to follow us," he whispered. "That's cheating!"

    Kim had an idea. She walked in the wrong direction for a few minutes. The other team followed. Then Kim and Paul turned quickly, ran down a hill and lost them. By the time their shadows were long, they had found all ten flags.

    They reached the hut just before sunset. The judges concluded that Kim and Paul were the winners. They did not win a considerable amount of money — only a small cup and two free ski passes. But their delight was definite. "We succeeded because we worked as a team," Kim said. "No prize can convey how happy we feel."
  ru: |
    Каждое лето горнолыжный курорт в Альпах устраивает гонку для подростков. Правила простые. Каждая команда получает карту и список инструкций. Нужно найти на горе десять флажков и добраться до финиша — старой хижины на краю долины — до заката.

    В этом году в гонке участвовали Ким и её брат Пол. Ким могла прочитать любую карту, а Пол был широкоплечим и мог нести тяжёлые сумки. Они были уверены в себе.

    Первая часть была лёгкой. Они шли по тропинке через лес и нашли пять флажков. Но потом тропинка пропала. Пришлось сосредоточиться на карте. Вдруг Пол заметил что-то странное: другая команда пряталась за кустом и наблюдала за ними. «Подозреваю, что они хотят идти за нами, — прошептал он. — Это жульничество!»

    У Ким появилась идея. Несколько минут она шла в неправильном направлении. Другая команда пошла следом. Тогда Ким и Пол быстро развернулись, сбежали с холма и оторвались от них. К тому времени, как их тени стали длинными, они нашли все десять флажков.

    Они добрались до хижины прямо перед закатом. Судьи решили, что Ким и Пол — победители. Крупной суммы денег они не выиграли — только маленький кубок и два бесплатных абонемента на подъёмник. Но их радость была несомненной. «Мы победили, потому что работали как команда, — сказала Ким. — Никакой приз не передаст, как мы счастливы».
  questions:
  - q: Where was the finish of the race?
    options:
    - At the top of the mountain
    - At an old hut at the edge of a valley
    - At the ski resort hotel
    - In the forest
    answer: 1
  - q: What did the other team try to do?
    options:
    - Steal the map
    - Follow Kim and Paul
    - Help Kim and Paul
    - Hide the flags
    answer: 1
  - q: What did Kim and Paul win?
    options:
    - A lot of money
    - A small cup and two ski passes
    - A new map
    - Nothing
    answer: 1
