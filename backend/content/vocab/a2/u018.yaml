- pub | n | pʌb |  | паб | a bar in Britain | Let's go to the *pub* after work. | Пойдём в паб после работы.
- region | n | ˈriːdʒən |  | регион, область | a large area of a country or the world | The North Sea *region* is rich in oil. | Регион Северного моря богат нефтью.
