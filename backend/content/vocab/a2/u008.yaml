title: Home and everyday life
title_ru: Дом и быт
topic: home
words:
- armchair | n | ˈɑːmtʃeə | ˈɑːrmtʃer | кресло | a comfortable chair with sides for your arms | Grandpa is sleeping in the *armchair*. | Дедушка спит в кресле.
- balcony | n | ˈbælkəni |  | балкон | a small area outside an upstairs room | We have breakfast on the *balcony*. | Мы завтракаем на балконе.
- bookcase | n | ˈbʊkkeɪs |  | книжный шкаф | a piece of furniture with shelves for books | The *bookcase* is in the corner. | Книжный шкаф стоит в углу.
- bowl | n | bəʊl | boʊl | миска, чаша | a round deep dish | She filled a *bowl* with soup. | Она налила миску супа.
- 'brush | n | brʌʃ |  | щётка; кисть | a tool with hairs for cleaning, painting or tidying hair | Where''s my hair *brush*? | Где моя щётка для волос? | также гл.: brush your teeth — чистить зубы'
- comb | n | kəʊm | koʊm | расчёска | a flat tool with thin teeth for tidying hair | I always carry a *comb*. | Я всегда ношу с собой расчёску.
- cooler | n | ˈkuːlə | ˈkuːlər | сумка-холодильник; кулер | a box that keeps food and drinks cold | Put the drinks in the *cooler*. | Положи напитки в сумку-холодильник.
- cupboard | n | ˈkʌbəd | ˈkʌbərd | шкаф, буфет | a piece of furniture with doors for keeping things | The cups are in the *cupboard*. | Чашки в шкафу. | p не произносится
- drawer | n | drɔː | drɔːr | ящик (выдвижной) | a box that slides in and out of a piece of furniture | The knives are in the top *drawer*. | Ножи в верхнем ящике.
- fork | n | fɔːk | fɔːrk | вилка | a tool with points for eating | Use your knife and *fork*. | Пользуйся ножом и вилкой.
- fridge | n | frɪdʒ |  | холодильник | a machine that keeps food cold | Put the milk in the *fridge*. | Поставь молоко в холодильник. | полное слово — refrigerator
- 'furniture | n | ˈfɜːnɪtʃə | ˈfɜːrnɪtʃər | мебель | tables, chairs, beds, etc. | We bought new *furniture* for the living room. | Мы купили новую мебель для гостиной. | неисчисляемое: a piece of furniture'
- knife | n | naɪf |  | нож | a tool with a sharp edge for cutting | Be careful with that *knife*. | Осторожно с этим ножом. | мн. ч. knives
- mirror | n | ˈmɪrə | ˈmɪrər | зеркало | a piece of glass in which you can see yourself | She looked at herself in the *mirror*. | Она посмотрела на себя в зеркало.
- mug | n | mʌɡ |  | кружка | a large cup with straight sides | She drank a *mug* of hot chocolate. | Она выпила кружку горячего шоколада.
- oven | n | ˈʌvən |  | духовка, печь | a box in a cooker for baking | Bake the cake in the *oven* for 30 minutes. | Выпекайте торт в духовке 30 минут.
- plate | n | pleɪt |  | тарелка | a flat dish that you put food on | He put three cakes on his *plate*. | Он положил себе на тарелку три пирожных.
- refrigerator | n | rɪˈfrɪdʒəreɪtə | rɪˈfrɪdʒəreɪtər | холодильник | a machine that keeps food cold | Put the milk in the *refrigerator*. | Поставь молоко в холодильник. | разг. fridge
- sitting room | n | ˈsɪtɪŋ ruːm |  | гостиная (брит.) | the living room | Let's have tea in the *sitting room*. | Давай попьём чай в гостиной.
- soap | n | səʊp | soʊp | мыло | a substance you use with water to wash | Wash your hands with *soap*. | Мой руки с мылом.
- spoon | n | spuːn |  | ложка | a tool with a small bowl for eating soup or stirring | I need a *spoon* for my soup. | Мне нужна ложка для супа.
- stove | n | stəʊv | stoʊv | плита, печь | a device for cooking or heating | There's a pot of soup on the *stove*. | На плите стоит кастрюля супа.
- toothbrush | n | ˈtuːθbrʌʃ | ˈtuːθbrəʃ | зубная щётка | a small brush for cleaning your teeth | I forgot my *toothbrush*. | Я забыл зубную щётку.
- washing machine | n | ˈwɒʃɪŋ məˈʃiːn | ˈwɑːʃɪŋ məˈʃiːn | стиральная машина | a machine for washing clothes | Put the towels in the *washing machine*. | Положи полотенца в стиральную машину.
