title: Everyday phrases
title_ru: Разговорные фразы
topic: phrases
words:
- have you ever...? | phr |  |  | ты когда-нибудь…? | used to ask about experience | *Have you ever* been to London? | Ты когда-нибудь был в Лондоне?
- health problems | phr |  |  | проблемы со здоровьем | illnesses or conditions | He retired because of *health problems*. | Он ушёл на пенсию из-за проблем со здоровьем.
- hear about somebody/something | phr |  |  | слышать о | to learn about something | Did you *hear about* the accident? | Ты слышал об аварии?
- I don't care | phr |  |  | мне всё равно | used to say something is not important to you | *I don't care* what he says. | Мне всё равно, что он говорит.
- I guess | phr |  |  | наверное, полагаю (разг.) | I think | *I guess* you're right. | Наверное, ты прав.
- I mean | phr |  |  | то есть, я имею в виду | used to explain or correct what you said | It's big — *I mean*, really big. | Он большой — то есть очень большой.
- I think so | phr |  |  | думаю, да | used to say yes when you are not sure | Is it going to rain? — *I think so*. | Будет дождь? — Думаю, да.
- I'm afraid... | phr |  |  | боюсь, что… (вежливое сожаление) | used to say something unwelcome politely | *I'm afraid* we're closed. | Боюсь, мы закрыты.
- if necessary | phr |  |  | если нужно, при необходимости | if it is needed | I can work late *if necessary*. | При необходимости могу задержаться на работе.
- if you want to | phr |  |  | если хочешь | if you would like | You can stay here *if you want to*. | Можешь остаться здесь, если хочешь.
- in business | phr |  |  | в бизнесе | working in business | My brother is *in business*. | Мой брат занимается бизнесом.
- in danger | phr |  |  | в опасности | at risk | Many animals are *in danger*. | Многие животные в опасности.
- in history | phr |  |  | в истории | in the past events of the world | It was the biggest storm *in history*. | Это был самый сильный шторм в истории.
- in hospital | phr |  |  | в больнице (как пациент) | staying in hospital | My grandpa is *in hospital*. | Мой дедушка в больнице. | амер. in the hospital
- in love | phr |  |  | влюблённый | loving someone romantically | They are *in love*. | Они влюблены.
- in prison | phr |  |  | в тюрьме | being kept in prison | He spent five years *in prison*. | Он провёл пять лет в тюрьме.
- in some cases | phr |  |  | в некоторых случаях | sometimes | *In some cases*, the medicine doesn't work. | В некоторых случаях лекарство не действует.
- in the air | phr |  |  | в воздухе | above the ground | There was smoke *in the air*. | В воздухе был дым.
- in the end | phr |  |  | в конце концов | finally | *In the end*, we decided to stay. | В конце концов мы решили остаться.
