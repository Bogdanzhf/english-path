title: Society and politics
title_ru: Общество и политика
topic: society
words:
- achieve | v | əˈtʃiːv |  | достигать | to succeed in doing something after trying hard | She *achieved* her dream of becoming a doctor. | Она осуществила мечту стать врачом.
- act | v | ækt |  | действовать; играть (роль) | to do something; to perform in a play | We must *act* quickly. | Нам нужно действовать быстро.
- allow | v | əˈlaʊ |  | позволять, разрешать | to let someone do something | My parents don't *allow* me to stay out late. | Родители не разрешают мне гулять допоздна. | allow somebody to do something
- back | v | bæk |  | поддерживать; двигаться назад | to support; to move backwards | My friends *backed* me. | Друзья меня поддержали.
- batch | n | bætʃ |  | партия, порция | a group of things made at one time | She baked a *batch* of cookies. | Она испекла порцию печенья.
- celebrate | v | ˈselɪbreɪt |  | праздновать | to do something enjoyable on a special day | How do you *celebrate* your birthday? | Как ты празднуешь свой день рождения?
- charity | n | ˈtʃærəti |  | благотворительность; благотворительная организация | an organization that helps people in need; giving help | She gives money to *charity* every month. | Она каждый месяц жертвует деньги на благотворительность.
- column | n | ˈkɒlʌm | ˈkɑːləm | колонна; столбец; колонка (в газете) | a tall post; a line of numbers going down | Write the answers in the second *column*. | Запишите ответы во втором столбце.
- fail | v | feɪl |  | провалить(ся), не суметь | to not pass a test or not do what you tried to do | He didn't study, so he *failed* the exam. | Он не готовился, поэтому провалил экзамен.
- found | v | faʊnd |  | основывать | to start a company, school or organisation | The company was *founded* in 1998. | Компания была основана в 1998 году. | found — founded — founded; не путайте с found — прошедшее от find
- labour | n | ˈleɪbə | ˈleɪbər | труд; рабочая сила | work, especially physical work | The house was built with cheap *labour*. | Дом построили за счёт дешёвой рабочей силы. | амер. labor
- manage | v | ˈmænɪdʒ |  | управлять; справляться, суметь | to be in charge of something; to succeed in doing something difficult | She *manages* a small hotel. | Она управляет небольшим отелем. | manage to do — суметь сделать
- marry | v | ˈmæri | ˈmeri | жениться, выходить замуж | to become someone's husband or wife | Will you *marry* me? | Ты выйдешь за меня?
- organization | n | ˌɔːɡənəˈzeɪʃən | ˌɔːrɡənəˈzeɪʃən | организация | a group of people working for a purpose | She works for a charity *organization*. | Она работает в благотворительной организации. | брит. также organisation
- organize | v | ˈɔːɡənaɪz | ˈɔːrɡənaɪz | организовывать | to plan and prepare an event | We *organized* a party for her birthday. | Мы устроили вечеринку на её день рождения. | брит. organise
- prevent | v | prɪˈvent |  | предотвращать | to stop something from happening | Washing your hands *prevents* many illnesses. | Мытьё рук предотвращает многие болезни. | prevent somebody from + -ing
- reunion | n | ˌriːˈjuːniən | riːˈuːnjən | встреча (после разлуки) | a meeting of people who have not seen each other for a long time | We had a family *reunion*. | У нас была встреча всей семьи.
- save | v | seɪv |  | спасать; экономить, копить | to keep someone safe; to keep money for later | The doctor *saved* his life. | Врач спас ему жизнь.
- succeed | v | səkˈsiːd |  | преуспеть, добиться | to do what you tried to do | She *succeeded* in passing her driving test. | Ей удалось сдать экзамен по вождению. | succeed in + -ing; success — успех
- support | v | səˈpɔːt | səˈpɔːrt | поддерживать | to help someone; to like and follow a team | My family always *supports* me. | Моя семья всегда меня поддерживает.
- variety | n | vəˈraɪəti |  | разнообразие | a range of different things | Earth has an amazing *variety* of life. | На Земле удивительное разнообразие жизни.
