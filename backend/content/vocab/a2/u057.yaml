  - q: Why did the first shop fail?
    options:
    - The food was bad
    - It was in the wrong area
    - Ahmed was ill
    - The rent was too high
    answer: 1
  - q: Who is the manager of the company now?
    options:
    - Ahmed
    - Ahmed's wife
    - Ahmed's son
    - A journalist
    answer: 2
