title: Food and drink
title_ru: Еда и напитки
topic: food
words:
- bean | n | biːn |  | боб, фасоль | a seed of a plant that you can eat | I'd like rice and *beans*, please. | Мне рис с фасолью, пожалуйста. | coffee beans — кофейные зёрна
- cereal | n | ˈsɪəriəl | ˈsɪriəl | хлопья; злак | a breakfast food made from grain; a grain plant like wheat | I have *cereal* with milk every morning. | Каждое утро я ем хлопья с молоком.
- chili | n | ˈtʃɪli |  | перец чили | a small red or green pepper with a very hot taste | This dish has a lot of *chili* in it. | В этом блюде много чили. | также chilli
- cola | n | ˈkəʊlə | ˈkoʊlə | кола | a sweet brown fizzy drink | Can I have a *cola*? | Можно мне колу?
- curry | n | ˈkʌri |  | карри | a spicy dish from South Asia | Let's get an Indian *curry*. | Давай закажем индийское карри.
- garlic | n | ˈɡɑːlɪk | ˈɡɑːrlɪk | чеснок | a plant with a strong taste used in cooking | Add two cloves of *garlic*. | Добавь два зубчика чеснока.
- ham | n | hæm |  | ветчина | meat from a pig, often eaten cold | I'd like a *ham* sandwich. | Мне бутерброд с ветчиной.
- honey | n | ˈhʌni |  | мёд; милый, дорогой (обращение) | a sweet food made by bees | I put *honey* in my tea. | Я кладу мёд в чай.
- jam | n | dʒæm |  | варенье, джем | a sweet food made from fruit and sugar | She made strawberry *jam*. | Она сварила клубничное варенье. | traffic jam — пробка
- lemon | n | ˈlemən |  | лимон | a sour yellow fruit | Tea with *lemon*, please. | Чай с лимоном, пожалуйста.
- mineral water | n | ˈmɪnərəl ˈwɔːtə | ˈmɪnərəl ˈwɔːtər | минеральная вода | water from under the ground, often with gas | A bottle of *mineral water*, please. | Бутылку минеральной воды, пожалуйста.
- pasta | n | ˈpɑːstə |  | паста, макароны | Italian food made from flour and water | We had *pasta* with tomato sauce. | У нас была паста с томатным соусом.
- sauce | n | sɔːs |  | соус | a thick liquid eaten with food | Do you want some *sauce* with your chips? | Хочешь соус к картошке?
- sausage | n | ˈsɒsɪdʒ | ˈsɔːsədʒ | колбаса; сосиска | meat in a long thin skin | We had *sausages* for breakfast. | На завтрак у нас были сосиски.
- seafood | n | ˈsiːfuːd |  | морепродукты | fish and shellfish eaten as food | This restaurant is famous for its *seafood*. | Этот ресторан славится морепродуктами.
- soda | n | ˈsəʊdə | ˈsoʊdə | газировка (амер.) | a sweet fizzy drink | Would you like a *soda*? | Хотите газировки?
- soft drink | n | sɒft drɪŋk | sɑːft drɪŋk | безалкогольный напиток | a cold drink without alcohol | We sell coffee, tea and *soft drinks*. | У нас есть кофе, чай и безалкогольные напитки.
- spaghetti | n | spəˈɡeti |  | спагетти | long thin pasta | The kids love *spaghetti*. | Дети обожают спагетти.
- steak | n | steɪk |  | стейк | a thick slice of meat | I'd like my *steak* well done. | Мне стейк хорошо прожаренный.
- supper | n | ˈsʌpə | ˈsʌpər | ужин | a light evening meal | We had soup and bread for *supper*. | На ужин у нас были суп и хлеб.
- taste | n | teɪst |  | вкус | the flavour of something in your mouth | This soup has a strange *taste*. | У этого супа странный вкус.
- toast | n | təʊst | toʊst | тост, поджаренный хлеб | bread made brown by heat | I have *toast* and coffee for breakfast. | На завтрак у меня тосты и кофе.
