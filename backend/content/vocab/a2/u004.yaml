title: Food and drink
title_ru: Еда и напитки
topic: food
words:
- bean | n | biːn |  | боб, фасоль | a seed of a plant that you can eat | I'd like rice and *beans*, please. | Мне рис с фасолью, пожалуйста. | coffee beans — кофейные зёрна
- cereal | n | ˈsɪəriəl | ˈsɪriəl | хлопья; злак | a breakfast food made from grain; a grain plant like wheat | I have *cereal* with milk every morning. | Каждое утро я ем хлопья с молоком.
- supper | n | ˈsʌpə | ˈsʌpər | ужин | a light evening meal | We had soup and bread for *supper*. | На ужин у нас были суп и хлеб.
- taste | n | teɪst |  | вкус | the flavour of something in your mouth | This soup has a strange *taste*. | У этого супа странный вкус.
