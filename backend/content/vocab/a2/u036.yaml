title: Everyday phrases
title_ru: Разговорные фразы
topic: phrases
words:
- check out | phr |  |  | выписываться (из отеля); проверить (разг.) | to leave a hotel; to look at something interesting | We *check out* at noon. | Мы выписываемся в полдень.
- close to somebody/something | phr |  |  | близко к, рядом с | near | Our house is *close to* the school. | Наш дом рядом со школой.
- come on! | phr |  |  | давай!, ну же! | used to encourage someone | *Come on*! We're late! | Давай быстрее! Мы опаздываем!
- connected to something | phr |  |  | связанный, подключённый к | joined to | Is the printer *connected to* the computer? | Принтер подключён к компьютеру?
- connected with somebody/something | phr |  |  | связанный с | related to | The problem is *connected with* money. | Проблема связана с деньгами.
- depend on somebody/something | phr |  |  | зависеть от; полагаться на | to be affected by; to rely on | It *depends on* the weather. | Это зависит от погоды.
- depend on something | phr |  |  | зависеть от чего-либо | to be decided by something | The price *depends on* the size. | Цена зависит от размера.
- do well | phr |  |  | преуспевать, хорошо справляться | to be successful | She *did well* in her exams. | Она хорошо сдала экзамены.
- each one | phr |  |  | каждый (из них) | every single one | I tried *each one* of the cakes. | Я попробовал каждый из тортов.
- end with something | phr |  |  | заканчиваться чем-либо | to finish with something | The concert *ended with* fireworks. | Концерт закончился фейерверком.
- even more... | phr |  |  | ещё больше…, ещё более… | used to make a comparison stronger | The second film is *even more* exciting. | Второй фильм ещё увлекательнее.
- everyone else | phr |  |  | все остальные | all other people | *Everyone else* went home. | Все остальные ушли домой.
- except for | phr |  |  | кроме, за исключением | not including | The room was empty *except for* a chair. | Комната была пустой, кроме одного стула.
- fall in love | phr |  |  | влюбиться | to start to love someone | They *fell in love* in Paris. | Они влюбились друг в друга в Париже.
- fall off | phr |  |  | упасть (с чего-либо) | to drop from something | He *fell off* his bike. | Он упал с велосипеда.
- far away | phr |  |  | далеко | at a great distance | They live *far away* from the city. | Они живут далеко от города.
- feel good | phr |  |  | чувствовать себя хорошо | to feel happy and healthy | I *feel good* after a run. | После пробежки я чувствую себя хорошо.
- feel like something | phr |  |  | хотеться; ощущаться как | to want something; to seem like | I *feel like* a pizza. | Мне хочется пиццы.
- find it difficult to do something | phr |  |  | испытывать трудности (с чем-либо) | to have problems doing something | I *find it difficult to* get up early. | Мне трудно рано вставать.
