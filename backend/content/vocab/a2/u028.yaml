title: 'Describing: size, shape and looks'
title_ru: 'Описание: размер, форма, внешний вид'
topic: describing
words:
- attractive | adj | əˈtræktɪv |  | привлекательный | pleasant to look at | It's a very *attractive* town. | Это очень привлекательный город.
- blank | adj | blæŋk |  | пустой, чистый; безучастный | with nothing written or recorded; showing no emotion | He gave me a *blank* look. | Он безучастно посмотрел на меня. | my mind went blank — у меня всё вылетело из головы
- bright | adj | braɪt |  | яркий; умный | full of light; clever | The room was *bright* and sunny. | Комната была светлой и солнечной.
- circle | n | ˈsɜːkl | ˈsɜːrkl | круг | a round shape | Draw a *circle*. | Нарисуйте круг.
- cute | adj | kjuːt |  | милый, симпатичный | pretty and nice | What a *cute* puppy! | Какой милый щенок!
- empty | adj | ˈempti |  | пустой | with nothing or nobody inside | The fridge is *empty* — let's go shopping. | Холодильник пуст — пойдём в магазин.
- enormous | adj | ɪˈnɔːməs | ɪˈnɔːrməs | огромный | very, very big | They live in an *enormous* house. | Они живут в огромном доме.
- narrow | adj | ˈnærəʊ | ˈnæroʊ | узкий | not wide | The streets in the old town are very *narrow*. | Улицы в старом городе очень узкие.
- sandy | adj | ˈsændi |  | песчаный | covered with or containing sand | The soil in the region is dry and *sandy*. | Почва в регионе сухая и песчаная.
- slim | adj | slɪm |  | стройный, тонкий | thin in an attractive way | She's tall and *slim*. | Она высокая и стройная. | slim chance — небольшой шанс
- soft | adj | sɒft | sɑːft | мягкий; тихий | not hard; quiet | This pillow is very *soft*. | Эта подушка очень мягкая.
- 'split | adj | splɪt |  | расколотый, раздвоенный | divided into parts | The team is *split* over the decision. | Команда разделилась во мнениях. | гл.: split — делить'
- thick | adj | θɪk |  | толстый; густой | wide between two sides; dense | It's a *thick* book — about 800 pages. | Это толстая книга — около 800 страниц.
- thin | adj | θɪn |  | тонкий; худой | not thick; not fat | The walls in this house are very *thin*. | Стены в этом доме очень тонкие.
- tight | adj | taɪt |  | тесный, тугой | fitting closely; firmly fixed | These jeans are too *tight*. | Эти джинсы слишком тесные.
- twin | n | twɪn |  | близнец | one of two children born at the same time to the same mother | My sister and I are *twins*. | Мы с сестрой близнецы.
- underwater | adj | ˌʌndəˈwɔːtə | ˈʌndərwɔːtər | подводный | under the surface of water | We watched an *underwater* film. | Мы смотрели фильм о подводном мире.
- wet | adj | wet |  | мокрый | covered with water | My shoes are *wet* — it's raining outside. | Мои ботинки мокрые — на улице дождь.
- wooden | adj | ˈwʊdn |  | деревянный | made of wood | They sat on a *wooden* bench. | Они сидели на деревянной скамейке.
