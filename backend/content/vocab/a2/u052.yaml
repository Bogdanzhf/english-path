title: Communication and language
title_ru: Общение и язык
topic: communication
words:
- 'avoid | v | əˈvɔɪd |  | избегать | to stay away from someone or something | I try to *avoid* sugar in the evening. | Я стараюсь избегать сахара по вечерам. | avoid + -ing: avoid eating'
- 'deal | n | diːl |  | сделка, договорённость | an agreement, especially in business | OK, it''s a *deal* — I''ll wash the car and you''ll cook dinner. | Договорились: я мою машину, а ты готовишь ужин. | a great deal of — много'
- discussion | n | dɪˈskʌʃən |  | обсуждение, дискуссия | a conversation about a topic | We had a long *discussion* about it. | Мы долго это обсуждали.
- ending | n | ˈendɪŋ |  | конец, окончание | the last part of a story | The film has a happy *ending*. | У фильма счастливый конец.
- guidebook | n | ˈɡaɪdbʊk |  | путеводитель | a book for tourists | Our *guidebook* recommends this restaurant. | Наш путеводитель советует этот ресторан.
- instructions | n | ɪnˈstrʌkʃnz |  | инструкции | information that tells you how to do something | Read the *instructions* before you start. | Прочитайте инструкцию, прежде чем начать.
- 'mind | v | maɪnd |  | возражать, быть против | to be unhappy about something | Do you *mind* if I open the window? | Вы не против, если я открою окно? | сущ.: mind — ум, разум'
- name | v | neɪm |  | называть, давать имя | to give someone a name | They *named* their son Leo. | Они назвали сына Лео.
- note | v | nəʊt | noʊt | замечать, отмечать | to notice; to write down | Please *note* that the shop closes early today. | Обратите внимание, что сегодня магазин закрывается рано.
- 'opposite | n | ˈɒpəzɪt | ˈɑːpəzət | противоположность | something completely different | The *opposite* of "hot" is "cold". | Противоположность слова «hot» — «cold». | предл.: opposite — напротив'
- point | v | pɔɪnt |  | указывать, показывать (пальцем) | to show something with your finger | She *pointed* at the map. | Она указала на карту.
- pronunciation | n | prəˌnʌnsɪˈeɪʃən | prəˌnʌnsiːˈeɪʃən | произношение | the way a word is said | Your *pronunciation* is very good. | У тебя очень хорошее произношение.
- record | v | rɪˈkɔːd | rɪˈkɔːrd | записывать | to store sound or pictures | We *recorded* the concert. | Мы записали концерт. | сущ. record [ˈrekɔːd] — рекорд; запись
- report | v | rɪˈpɔːt | riːˈpɔːrt | сообщать, докладывать | to give information about something | The news *reported* a big fire. | В новостях сообщили о крупном пожаре.
- response | n | rɪˈspɒns | rɪˈspɑːns | ответ, отклик | an answer or reaction | I sent an email, but there was no *response*. | Я отправил письмо, но ответа не было.
- rumour | n | ˈruːmə | ˈruːmər | слух | a story that may not be true | There's a *rumour* that she's leaving. | Ходят слухи, что она уходит. | амер. rumor
- stamp | n | stæmp |  | марка; печать | a small paper you put on a letter; a mark made with ink | I need a *stamp* for this letter. | Мне нужна марка для этого письма.
- term | n | tɜːm | tɜːrm | семестр, четверть; термин | a part of the school year; a word with a special meaning | The summer *term* ends in July. | Летний семестр заканчивается в июле.
- timetable | n | ˈtaɪmteɪbl |  | расписание | a list of times of trains, classes, etc. | Check the train *timetable*. | Посмотри расписание поездов.
- vocabulary | n | vəʊˈkæbjʊləri | voʊˈkæbjəleri | словарный запас, лексика | all the words someone knows | Reading helps you build *vocabulary*. | Чтение помогает пополнить словарный запас.
reading:
  title: The Honey of the Mountain
  title_ru: Горный мёд
  text: |
    High in the mountains of Georgia, there is an old monastery where twelve monks live. For centuries, they have worked in agriculture. They grow grain and vegetables and keep bees. Their honey is famous because it has an odd, wonderful taste that nobody can copy.

    Last year, a young scientist named Nina visited the monastery. She was curious about the honey. In her profession, she studied food chemistry, and she wanted to investigate what made it so special. The monks greeted her warmly, but at first they didn't want to share their secrets.

    Nina stayed for a month. She helped in the fields and listened to the old monks' stories. Every evening, she wrote in her diary. Slowly, she convinced them that she wanted to learn, not to steal. Finally, the oldest monk, Brother Ilya, showed her a small room with a low ceiling. Inside were hundreds of jars with handwritten labels.

    "The secret has three elements," he said, and paused. "The wild flowers on the mountain, the clean air — and patience. We never take all the honey. We leave enough for the bees." Nina realized that this simple ability — to wait and to share — was more important than any chemistry.

    When Nina returned home, she delayed writing her scientific report. Instead, she drew a small cartoon of Brother Ilya and his bees and sent it to the monastery with a letter. The local priest read it to the monks, and they laughed with joy. "She understood," Brother Ilya said. "Faith is not only about God. It's also about trusting nature."
  ru: |
    Высоко в горах Грузии есть старый монастырь, где живут двенадцать монахов. Веками они занимаются сельским хозяйством. Они выращивают зерно и овощи и держат пчёл. Их мёд знаменит своим необычным чудесным вкусом, который никому не удаётся повторить.

    В прошлом году в монастырь приехала молодая учёная по имени Нина. Её заинтересовал мёд. По профессии она изучала химию продуктов и хотела выяснить, что делает его таким особенным. Монахи тепло её встретили, но сначала не хотели делиться секретами.

    Нина прожила там месяц. Она помогала в полях и слушала истории старых монахов. Каждый вечер она писала в дневник. Постепенно она убедила их, что хочет учиться, а не красть. Наконец самый старый монах, брат Илья, показал ей маленькую комнату с низким потолком. Внутри стояли сотни банок с подписанными от руки этикетками.

    «У секрета три составляющие», — сказал он и сделал паузу. — «Дикие цветы на горе, чистый воздух — и терпение. Мы никогда не забираем весь мёд. Мы оставляем достаточно для пчёл». Нина поняла, что эта простая способность — ждать и делиться — важнее любой химии.

    Вернувшись домой, Нина отложила научный отчёт. Вместо этого она нарисовала маленькую карикатуру на брата Илью с его пчёлами и отправила её в монастырь вместе с письмом. Местный священник прочитал его монахам, и они радостно рассмеялись. «Она поняла, — сказал брат Илья. — Вера — это не только о Боге. Это ещё и доверие к природе».
  questions:
  - q: What is special about the monks' honey?
    options:
    - It is very cheap
    - It has an odd, wonderful taste
    - It is blue
    - It is made in a factory
    answer: 1
  - q: What was Nina's profession?
    options:
    - A priest
    - A food chemist
    - A farmer
    - An artist
    answer: 1
  - q: What are the three elements of the secret?
    options:
    - Sugar, water and heat
    - Wild flowers, clean air and patience
    - Old jars, labels and chemistry
    - Bees, grain and vegetables
    answer: 1
  - tf: The monks shared their secret on the first day.
    answer: false
  - tf: Nina sent the monks a cartoon.
    answer: true
