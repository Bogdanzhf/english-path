title: Function words
title_ru: Служебные слова
topic: grammar
words:
- according to | prep | əˈkɔːdɪŋ tuː | əˈkɔːrdɪŋ tuː | согласно, по словам | as said by | *According to* the news, it will snow. | Судя по новостям, пойдёт снег.
- against | prep | əˈɡenst |  | против; к, о (касаясь) | opposing; touching something for support | He leaned his bike *against* the wall. | Он прислонил велосипед к стене. | be against — быть против
- anybody | pron | ˈenɪbɒdi | ˈeniːbədi | кто-нибудь; кто угодно | anyone | Is *anybody* home? | Есть кто дома?
- because of | phr |  |  | из-за | as a result of | The match was cancelled *because of* the rain. | Матч отменили из-за дождя.
- except | prep | ɪkˈsept |  | кроме, за исключением | not including | The shop is open every day *except* Sunday. | Магазин работает каждый день, кроме воскресенья.
- hers | pron | hɜːz | hɜːrz | её (без существительного) | the one belonging to her | This bag isn't mine, it's *hers*. | Эта сумка не моя, а её.
- herself | pron | hɜːˈself | hərˈself | себя, себе; сама | used when she does something to herself | She taught *herself* to play the guitar. | Она сама научилась играть на гитаре.
- himself | pron | hɪmˈself |  | себя, себе; сам | used when he does something to himself | He cut *himself* while cooking. | Он порезался, когда готовил.
- including | prep | ɪnˈkluːdɪŋ | ˌɪnˈkluːdɪŋ | включая | with something as part of a group | Ten people, *including* two children, came. | Пришли десять человек, включая двух детей.
- itself | pron | ɪtˈself | ˌɪtˈself | себя, себе; само | used for a thing that does something to itself | The door opened by *itself*. | Дверь открылась сама.
- myself | pron | maɪˈself | ˌmaɪˈself | себя, себе; сам | used when I do something to myself | I made the cake *myself*. | Я сам испёк торт.
- none | pron | nʌn |  | ни один, никто, ничего | not one; not any | I bought three apples, but *none* of them was sweet. | Я купил три яблока, но ни одно не оказалось сладким.
- ours | pron | ˈaʊəz | ˈaʊərz | наш (без существительного) | the one belonging to us | That car is *ours*. | Та машина — наша.
- ourselves | pron | aʊəˈselvz | aʊərˈselvz | себя, себе; сами | used when we do something to ourselves | We enjoyed *ourselves* at the party. | Мы хорошо повеселились на вечеринке.
- out of | prep | aʊt ɒv | aʊt ʌv | из; вне; без | from inside; not having any more | We're *out of* milk. | У нас закончилось молоко.
- per | prep | pɜː | pɜːr | на, за (каждый) | for each | The fine was ten pounds *per* day. | Штраф составлял десять фунтов в день.
- themselves | pron | ðemˈselvz | ðəmˈselvz | себя, себе; сами | used when they do something to themselves | The kids made lunch *themselves*. | Дети сами приготовили обед.
- times | prep | taɪmz |  | умноженный на, раз | multiplied by | Two *times* three is six. | Дважды три — шесть.
- whose | pron | huːz |  | чей | used to ask who something belongs to | *Whose* phone is this? | Чей это телефон?
- yours | pron | jɔːz | jɔːrz | твой, ваш (без существительного) | the one belonging to you | Is this coat *yours*? | Это пальто твоё?
