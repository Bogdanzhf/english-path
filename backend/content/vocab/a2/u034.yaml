title: 'How and how much: adverbs'
title_ru: 'Как и насколько: наречия'
topic: manner
words:
- angrily | adv | ˈæŋɡrɪli | ˈæŋɡrəli | сердито | in an angry way | He shouted *angrily*. | Он сердито закричал.
- badly | adv | ˈbædli |  | плохо; сильно | not well; very much | I slept *badly* last night. | Я плохо спал прошлой ночью.
- carefully | adv | ˈkeəfəli | ˈkerfəli | осторожно, внимательно | with a lot of attention, so that nothing goes wrong | Please read the questions *carefully*. | Пожалуйста, внимательно прочитайте вопросы.
- correctly | adv | kəˈrektli |  | правильно | in the right way | Answer all the questions *correctly*. | Ответьте на все вопросы правильно.
- differently | adv | ˈdɪfrəntli | ˈdɪfəˈrentli | по-другому, иначе | in a different way | We see things *differently*. | Мы смотрим на вещи по-разному.
- fortunately | adv | ˈfɔːtʃənətli | ˈfɔːrtʃənətli | к счастью | luckily | *Fortunately*, nobody was hurt. | К счастью, никто не пострадал.
- happily | adv | ˈhæpɪli | ˈhæpəli | счастливо; радостно | in a happy way | They lived *happily* ever after. | И жили они долго и счастливо.
- importantly | adv | ɪmˈpɔːtəntli | ˌɪmˈpɔːrtəntli | что важно | used to say that something is important | More *importantly*, we must act now. | Что ещё важнее, нам нужно действовать сейчас.
- loudly | adv | ˈlaʊdli |  | громко | in a loud way | Please don't talk so *loudly*. | Пожалуйста, не говорите так громко.
- luckily | adv | ˈlʌkili | ˈlʌkəli | к счастью | fortunately | *Luckily*, the train was late too. | К счастью, поезд тоже опаздывал.
- normally | adv | ˈnɔːməli | ˈnɔːrməli | обычно; нормально | usually | I *normally* get up at seven. | Обычно я встаю в семь.
- physically | adv | ˈfɪzɪkli | ˈfɪzɪkəli | физически | relating to the body | He is *physically* very strong. | Он физически очень силён.
- quietly | adv | ˈkwaɪətli |  | тихо | in a quiet way | She closed the door *quietly*. | Она тихо закрыла дверь.
- sadly | adv | ˈsædli |  | грустно; к сожалению | in a sad way; unfortunately | *Sadly*, the shop closed last year. | К сожалению, магазин закрылся в прошлом году.
- silently | adv | ˈsaɪləntli |  | молча, бесшумно | without any sound | They walked *silently* through the forest. | Они бесшумно шли через лес.
- slowly | adv | ˈsləʊli | ˈsloʊli | медленно | at a slow speed | Please speak more *slowly*. | Пожалуйста, говорите медленнее.
- smoothly | adv | ˈsmuːðli |  | гладко, плавно | without problems | Everything went *smoothly*. | Всё прошло гладко.
- softly | adv | ˈsɒftli | ˈsɔːfli | мягко, тихо | gently; quietly | She spoke *softly* to the baby. | Она тихо говорила с малышом.
- someday | adv | ˈsʌmdeɪ |  | когда-нибудь | at some time in the future | *Someday* I'll travel around the world. | Когда-нибудь я объеду весь мир.
- unfortunately | adv | ʌnˈfɔːtʃənətli | ənˈfɔːrtʃənətli | к сожалению | used to say that something is bad | *Unfortunately*, I can't come. | К сожалению, я не смогу прийти.
- well | n | wel |  | колодец | a deep hole in the ground for water | They get water from a *well*. | Они берут воду из колодца.
