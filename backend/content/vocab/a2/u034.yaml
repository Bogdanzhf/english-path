title: Free time and sport
title_ru: Досуг и спорт
topic: leisure
words:
- athlete | n | ˈæθliːt |  | спортсмен, атлет | a person who is good at sports | Olympic *athletes* train every day. | Олимпийские спортсмены тренируются каждый день.
- award | n | əˈwɔːd | əˈwɔːrd | награда, премия | a prize for doing something well | She won an *award* for best actress. | Она получила награду как лучшая актриса.
- coach | n | kəʊtʃ | koʊtʃ | тренер | a person who trains a sports team or a player | The *coach* made the team run every morning. | Тренер заставлял команду бегать каждое утро.
- ski | v | skiː |  | кататься на лыжах | to move over snow on long thin boards | We *ski* in the mountains every winter. | Каждую зиму мы катаемся на лыжах в горах.
