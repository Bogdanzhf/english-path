title: People and relationships
title_ru: Люди и отношения
topic: people
words:
- beginner | n | bɪˈɡɪnə | bɪˈɡɪnər | новичок, начинающий | a person who is starting to learn something | This course is for *beginners*. | Этот курс для начинающих.
- businesswoman | n | ˈbɪznəswʊmən | ˈbɪznɪswʊmən | деловая женщина, бизнесвумен | a woman who works in business | She's a successful *businesswoman*. | Она успешная бизнесвумен.
- clown | n | klaʊn |  | клоун | a person who makes people laugh in a circus | The children laughed at the *clown*. | Дети смеялись над клоуном.
- female | adj | ˈfiːmeɪl |  | женский, женского пола | belonging to the sex that can have babies | Only *female* mosquitoes bite. | Кусаются только самки комаров.
- friendly | adj | ˈfrendli |  | дружелюбный | kind and nice to other people | Our neighbours are very *friendly*. | Наши соседи очень дружелюбные.
- grandchild | n | ˈɡrændtʃaɪld | ˈɡræntʃaɪld | внук, внучка | a child of your son or daughter | They have five *grandchildren*. | У них пятеро внуков.
- granddad | n | ˈɡrændæd |  | дедушка (разг.) | grandfather | My *granddad* was a sailor. | Мой дедушка был моряком.
- granddaughter | n | ˈɡrændɔːtə | ˈɡrændɔːtər | внучка | a daughter of your son or daughter | Her *granddaughter* is three. | Её внучке три года.
- grandson | n | ˈɡrændsʌn |  | внук | a son of your son or daughter | My *grandson* loves football. | Мой внук обожает футбол.
- granny | n | ˈɡræni |  | бабуля (разг.) | grandmother | *Granny* makes the best pies. | Бабуля печёт лучшие пироги.
- headteacher | n | ˈhedtiːtʃə | hˈedtiːtʃɐ | директор школы | the person in charge of a school | The *headteacher* spoke at the meeting. | На собрании выступил директор школы.
- hero | n | ˈhɪərəʊ | ˈhɪroʊ | герой | a brave person whom people admire | The firefighter was a real *hero*. | Пожарный был настоящим героем. | мн. ч. heroes
- human | n | ˈhjuːmən |  | человек | a person | Dogs can hear things *humans* can't. | Собаки слышат то, чего не слышат люди. | human being; прил. human — человеческий
- invite | v | ɪnˈvaɪt |  | приглашать | to ask someone to come to a party, a meal or an event | Anna *invited* all her friends to her birthday party. | Анна пригласила всех друзей на свой день рождения.
- living | adj | ˈlɪvɪŋ |  | живой; живущий | alive now | She is our oldest *living* relative. | Она наша самая старшая из живущих родственниц. | make a living — зарабатывать на жизнь
- orphan | n | ˈɔːfn | ˈɔːrfn | сирота | a child whose parents are dead | He was an *orphan* raised by his aunt. | Он был сиротой, которого вырастила тётя.
- pilgrim | n | ˈpɪlɡrɪm | ˈpɪlɡrəm | паломник | a person who travels to a holy place | Thousands of *pilgrims* visit the temple. | Храм посещают тысячи паломников.
- policewoman | n | pəˈliːswʊmən |  | полицейская | a woman who is a police officer | A *policewoman* asked for my name. | Сотрудница полиции спросила моё имя.
- pro | n | prəʊ | proʊ | профессионал (разг.) | a professional | She plays tennis like a *pro*. | Она играет в теннис как профи. | pros and cons — за и против
- sir | n | sɜː | sɜːr | сэр, господин (вежливое обращение) | a polite way to speak to a man | Can I help you, *sir*? | Чем могу помочь, сэр?
- stupid | adj | ˈstjuːpɪd | ˈstuːpəd | глупый | not intelligent | It was a *stupid* mistake. | Это была глупая ошибка.
- surname | n | ˈsɜːneɪm | ˈsɜːrneɪm | фамилия | your family name | My *surname* is Ivanov. | Моя фамилия Иванов.
- teenage | adj | ˈtiːneɪdʒ |  | подростковый | between 13 and 19 years old | They have two *teenage* sons. | У них два сына-подростка.
