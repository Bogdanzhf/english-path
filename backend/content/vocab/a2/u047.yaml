title: 'Describing: good or bad'
title_ru: 'Описание: оценка — хорошо или плохо'
topic: describing
words:
- awful | adj | ˈɔːfl |  | ужасный | very bad | The weather was *awful* — it rained all week. | Погода была ужасной — всю неделю шёл дождь.
- brilliant | adj | ˈbrɪliənt |  | блестящий, гениальный; яркий | very clever or very good; very bright | What a *brilliant* idea! | Какая блестящая идея!
- comfortable | adj | ˈkʌmftəbl | ˈkʌmfərtəbl | удобный; уверенный, спокойный | relaxed and free from worry or pain | I don't feel *comfortable* speaking in public. | Мне некомфортно выступать на публике.
- everyday | adj | ˈevrɪdeɪ | ˈevriːˈdeɪ | повседневный, обычный | normal; happening every day | Phones are part of *everyday* life. | Телефоны — часть повседневной жизни. | every day (раздельно) — каждый день
- helpful | adj | ˈhelpfl |  | полезный; готовый помочь | useful; ready to help | The staff were very *helpful*. | Персонал был очень отзывчивым.
- ideal | adj | aɪˈdɪəl | aɪˈdiːəl | идеальный | the best possible | This beach is *ideal* for families with children. | Этот пляж идеален для семей с детьми.
- incredible | adj | ɪnˈkredəbl |  | невероятный | very surprising or very good | The view from the top was *incredible*. | Вид с вершины был невероятным.
- "marvelous | adj | ˈm\x01ːvələs | ˈmɑːrvələs | чудесный, изумительный (амер.) | wonderful | We had a *marvelous* time. | Мы чудесно провели время. | брит. marvellous"
- ordinary | adj | ˈɔːdnri | ˈɔːrdneri | обычный | normal; not special | It was just an *ordinary* day. | Это был самый обычный день.
- pleasing | adj | ˈpliːzɪŋ |  | приятный | giving pleasure | The colours are very *pleasing* to the eye. | Цвета очень приятны глазу.
- strange | adj | streɪndʒ |  | странный | unusual or surprising | I heard a *strange* noise in the night. | Ночью я услышал странный звук. | stranger — незнакомец
- typical | adj | ˈtɪpɪkl |  | типичный, обычный | normal, the way something usually is | A *typical* English breakfast has eggs, beans and sausages. | Типичный английский завтрак — это яйца, фасоль и сосиски.
- ugly | adj | ˈʌɡli |  | уродливый, некрасивый | not nice to look at | I think that building is really *ugly*. | По-моему, то здание очень уродливое.
- unforgettable | adj | ʌnfəˈɡetəbl | ˌʌnfərˈɡetəbl | незабываемый | so good that you remember it for ever | It was an *unforgettable* trip. | Это была незабываемая поездка.
- unhealthy | adj | ʌnˈhelθi | ənˈhelθi | нездоровый, вредный | not good for your health | Eating too much sugar is *unhealthy*. | Есть много сахара вредно.
- unusual | adj | ʌˈnjuːʒuːəl | ənˈjuːʒuːəl | необычный | not common | It's *unusual* to see snow in April. | Снег в апреле — редкость.
- usual | adj | ˈjuːʒuəl |  | обычный | normal; happening most often | Let's meet at the *usual* place. | Встретимся на обычном месте. | as usual — как обычно
- welcome | adj | ˈwelkʌm | ˈwelkəm | желанный, приятный | wanted and accepted | You're always *welcome* here. | Тебе здесь всегда рады.
- well-known | adj | ˈwelˈnəʊn | ˈwelˈnoʊn | известный | known by many people | He is a *well-known* writer. | Он известный писатель.
