title: Actions and movement
title_ru: Действия и движение
topic: actions
words:
- appear | v | əˈpɪə | əˈpɪr | казаться; появляться | to seem; to start to be seen | She *appears* to be very tired today. | Похоже, она сегодня очень устала.
- attend | v | əˈtend |  | посещать, присутствовать | to go to an event, a school or a meeting | More than a hundred people *attended* the wedding. | На свадьбе было больше ста человек.
- contain | v | kənˈteɪn |  | содержать | to have something inside | This drink *contains* a lot of sugar. | В этом напитке много сахара.
- continue | v | kənˈtɪnjuː |  | продолжать(ся) | to keep doing something | Please *continue* reading. | Пожалуйста, продолжайте читать.
- depend | v | dɪˈpend |  | зависеть; полагаться | to need someone or something; to be decided by something | Small children *depend* on their parents. | Маленькие дети зависят от родителей. | depend on — зависеть от; it depends — смотря как
- discover | v | dɪˈskʌvə | dɪˈskʌvər | открывать, обнаруживать | to find something for the first time | Who *discovered* penicillin? | Кто открыл пенициллин?
- exist | v | ɪɡˈzɪst |  | существовать | to be real; to be present | Do you think ghosts *exist*? | Ты думаешь, привидения существуют?
- hide | v | haɪd |  | прятать(ся) | to put something where people can't find it | The cat *hid* under the bed. | Кошка спряталась под кровать. | hide – hid – hidden
- hold | v | həʊld | hoʊld | занимать (должность); придерживаться (мнения) | to have a job or position; to have an opinion | She *holds* the position of chief engineer. | Она занимает должность главного инженера. | hold — held — held
- involve | v | ɪnˈvɒlv | ɪnˈvɑːlv | вовлекать; включать в себя | to include someone or something as a part | The job *involves* a lot of travel. | Эта работа связана с большим количеством поездок.
- jump | v | dʒʌmp |  | прыгать | to push yourself off the ground | The dog *jumped* over the fence. | Собака перепрыгнула через забор.
- lift | v | lɪft |  | поднимать | to move something up | Can you help me *lift* this box? | Поможешь поднять эту коробку? | брит. сущ. lift — лифт
- match | v | mætʃ |  | подходить, сочетаться | to look good together | Your shoes *match* your bag. | Твои туфли подходят к сумке.
- matter | v | ˈmætə | ˈmætər | иметь значение | to be important | It doesn't *matter*. | Это неважно. | What's the matter? — Что случилось?
- notice | v | ˈnəʊtɪs | ˈnoʊtɪs | замечать | to see or become aware of something | Did you *notice* her new haircut? | Ты заметил её новую стрижку?
- 'ring | v | rɪŋ |  | звонить; звенеть | to make a bell sound; to phone | Your phone is *ringing*. | У тебя звонит телефон. | ring – rang – rung; сущ.: ring — кольцо'
- rise | v | raɪz |  | подниматься, вставать (о солнце); расти | to go up | The sun *rises* in the east. | Солнце встаёт на востоке. | rise – rose – risen
- seem | v | siːm |  | казаться | to appear to be | She *seems* very nice. | Она кажется очень милой.
- serve | v | sɜːv | sɜːrv | подавать (еду); обслуживать; служить | to give food or drink to someone; to work for | Breakfast is *served* from seven to ten. | Завтрак подают с семи до десяти.
- smell | v | smel |  | чувствовать запах; пахнуть | to notice something with your nose | I can *smell* fresh bread from the bakery. | Я чувствую запах свежего хлеба из пекарни.
- surf | v | sɜːf | sɜːrf | сидеть в интернете; заниматься сёрфингом | to look at websites; to ride waves | I *surf* the internet in the evening. | Вечером я сижу в интернете.
