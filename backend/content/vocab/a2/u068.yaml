title: Thinking and opinions
title_ru: Мысли и мнения
topic: mind
words:
- accept | v | əkˈsept |  | принимать (предложение, подарок) | to take something that someone offers you; to say yes | She *accepted* the job offer immediately. | Она сразу приняла предложение о работе.
- arrangement | n | əˈreɪndʒmənt |  | договорённость; расположение | a plan made with someone | We have an *arrangement* to meet on Fridays. | Мы договорились встречаться по пятницам.
- brainstorm | v | ˈbreɪnstɔːm | ˈbreɪnstɔːrm | проводить мозговой штурм | to suggest lots of ideas quickly in a group | Let's *brainstorm* some names for the project. | Давайте устроим мозговой штурм и придумаем названия для проекта.
- consider | v | kənˈsɪdə | kənˈsɪdər | рассматривать, обдумывать | to think carefully about something | We are *considering* moving to the coast. | Мы подумываем о переезде на побережье. | consider + -ing
- expect | v | ɪkˈspekt |  | ожидать | to think that something will probably happen | We *expect* rain tomorrow afternoon. | Завтра днём ожидается дождь.
- focus | v | ˈfəʊkəs | ˈfoʊkəs | сосредоточиться | to give all your attention to one thing | Turn off the TV and *focus* on your homework. | Выключи телевизор и сосредоточься на домашнем задании. | focus on something
- link | n | lɪŋk |  | связь; ссылка | a connection between two things | There's a clear *link* between diet and health. | Существует явная связь между питанием и здоровьем.
- pattern | n | ˈpætn | ˈpætərn | узор; закономерность | a design of lines or shapes; a way something usually happens | I like the flower *pattern* on your dress. | Мне нравится цветочный узор на твоём платье.
- pick | v | pɪk |  | выбирать; собирать (ягоды, цветы) | to choose; to take from a plant | *Pick* a card. | Выбери карту. | pick up — поднимать, забирать
- possibility | n | ˌpɒsəˈbɪlɪti | ˌpɑːsəˈbɪlətiː | возможность | something that might happen | There's a *possibility* of rain. | Возможен дождь.
- react | v | riˈækt |  | реагировать | to act or behave in a certain way because of something | How did she *react* to the news? | Как она отреагировала на новость?
- realize | v | ˈrɪəlaɪz | ˈriːəlaɪz | осознавать, понимать | to suddenly understand or notice something | I *realized* that I had left my phone at home. | Я понял, что оставил телефон дома. | брит. realise
- recognize | v | ˈrekəɡnaɪz |  | узнавать | to know someone or something because you have seen it before | I didn't *recognize* you with short hair! | Я тебя не узнал с короткой стрижкой! | брит. recognise
- respond | v | rɪˈspɒnd | rɪˈspɑːnd | отвечать, реагировать | to answer or react | She didn't *respond* to my message. | Она не ответила на моё сообщение.
- sight | n | saɪt |  | зрение; вид; достопримечательность | the ability to see; something you see | We saw the *sights* of Paris. | Мы посмотрели достопримечательности Парижа.
- solve | v | sɒlv | sɑːlv | решать (задачу, проблему) | to find the answer to a problem | Can you help me *solve* this maths problem? | Поможешь мне решить эту задачу по математике?
- suggestion | n | səˈdʒestʃən |  | предложение | an idea you give someone | Do you have any *suggestions*? | Есть какие-нибудь предложения?
- surprise | v | səˈpraɪz | sərˈpraɪz | удивлять | to make someone feel that something is unexpected | The news *surprised* everyone. | Новость всех удивила. | сущ. surprise — сюрприз
