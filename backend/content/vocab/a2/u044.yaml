title: Arts and media
title_ru: Искусство и медиа
topic: arts
words:
- cartoon | n | kɑːˈtuːn | kɑːrˈtuːn | мультфильм; карикатура | a funny drawing or an animated film | My kids watch *cartoons* every Saturday morning. | Мои дети смотрят мультики каждое субботнее утро.
- comedy | n | ˈkɒmədi | ˈkɑːmədi | комедия | a funny film or play | We watched a romantic *comedy*. | Мы смотрели романтическую комедию.
- disco | n | ˈdɪskəʊ | ˈdɪskoʊ | дискотека | a party or club where people dance to pop music | There's a *disco* at the school tonight. | Сегодня в школе дискотека.
- drama | n | ˈdrɑːmə |  | драма; театральное искусство | a serious play or film; acting as a subject | She studies *drama* at college. | Она изучает актёрское мастерство в колледже.
- draw | n | drɔː |  | ничья; жеребьёвка | a game that ends with equal scores | The match ended in a *draw*. | Матч закончился вничью.
- drawing | n | ˈdrɔːrɪŋ | drɔɪŋ | рисунок; рисование | a picture made with a pencil or pen | This is my son's *drawing*. | Это рисунок моего сына.
- drum | n | drʌm |  | барабан | a musical instrument you hit with sticks | He plays the *drums* in a band. | Он играет на барабанах в группе.
- ghost | n | ɡəʊst | ɡoʊst | призрак, привидение | the spirit of a dead person | Do you believe in *ghosts*? | Ты веришь в привидения?
- instrument | n | ˈɪnstrəmənt |  | инструмент (музыкальный); прибор | an object used to make music; a tool | Do you play a musical *instrument*? | Ты играешь на каком-нибудь музыкальном инструменте?
- jazz | n | dʒæz |  | джаз | a type of music with strong rhythms | My dad loves *jazz*. | Мой папа любит джаз.
- lyric | n | ˈlɪrɪk |  | слова песни; лирика | the words of a song (usually lyrics) | I can't remember the *lyrics* of that song. | Не могу вспомнить слова этой песни.
- 'musical | adj | ˈmjuːzɪkl |  | музыкальный | relating to music | She comes from a *musical* family. | Она из музыкальной семьи. | сущ.: musical — мюзикл'
- opera | n | ˈɒpərə | ˈɑːprə | опера | a play where the words are sung | We went to the *opera* last night. | Вчера вечером мы ходили в оперу.
- poster | n | ˈpəʊstə | ˈpoʊstər | плакат, постер | a large printed picture | He has a film *poster* on his wall. | У него на стене постер фильма.
- rap | n | ræp |  | рэп | music where the words are spoken fast to a beat | My brother writes *rap* songs. | Мой брат пишет рэп.
- recording | n | rɪˈkɔːdɪŋ | rəˈkɔːrdɪŋ | запись | sound or pictures that have been recorded | Listen to the *recording* again. | Послушайте запись ещё раз.
- symphony | n | ˈsɪmfəni |  | симфония | a long piece of music for an orchestra | Beethoven wrote nine *symphonies*. | Бетховен написал девять симфоний.
- violin | n | vaɪəˈlɪn |  | скрипка | a musical instrument with four strings that you play with a bow | She plays the *violin* in an orchestra. | Она играет на скрипке в оркестре.
