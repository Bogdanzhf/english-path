title: Time and dates
title_ru: Время и даты
topic: time
words:
- after | conj | ˈɑːftə | ˈæftər | после того как | at a time later than | I'll call you *after* I finish work. | Я позвоню, после того как закончу работу.
- already | adv | ɔːlˈredi |  | уже | before now or sooner than expected | I've *already* eaten, thanks. | Спасибо, я уже поел.
- before | conj | bɪˈfɔː | ˌbiːˈfɔːr | до того как, прежде чем | at a time earlier than | Wash your hands *before* you eat. | Помой руки, прежде чем есть.
- daily | adj | ˈdeɪli |  | ежедневный | happening every day | I read the *daily* news. | Я читаю ежедневные новости.
- daylight | n | ˈdeɪlaɪt |  | дневной свет | the light of the day | We left in *daylight*. | Мы выехали засветло.
- fall | n | fɔːl | fɑːl | осень (амер.); падение | autumn (US); the act of falling | The leaves turn red in the *fall*. | Осенью листья краснеют. | брит. autumn
- finally | adv | ˈfaɪnəli |  | наконец, в конце концов | after a long time; lastly | After five years at sea, they *finally* came home. | После пяти лет в море они наконец вернулись домой.
- go | n | ɡəʊ | ɡoʊ | попытка (have a go) | an attempt | Can I have a *go*? | Можно мне попробовать?
- immediately | adv | ɪˈmiːdɪətli | ˌɪˈmiːdiətli | немедленно, сразу | at once | Call me *immediately*! | Немедленно позвони мне!
- May | v | meɪ |  | может быть; можно (разрешение) | used to say something is possible or to ask permission | It *may* rain tonight. | Вечером, может быть, пойдёт дождь. | May I come in? — Можно войти?
- midday | n | ˌmɪdˈdeɪ | ˈmɪddeɪ | полдень | twelve o'clock in the day | We'll meet at *midday*. | Встретимся в полдень.
- once | conj | wɒns | wʌns | как только | as soon as | *Once* you finish, you can go home. | Как только закончишь, можешь идти домой.
- present | adj | ˈprezənt |  | присутствующий; нынешний | being in a place; existing now | How many people were *present*? | Сколько человек присутствовало?
- recently | adv | ˈriːsəntli | ˈriːsənli | недавно | not long ago | I *recently* moved to Kazan. | Я недавно переехал в Казань.
- schedule | n | ˈʃedjuːl | ˈskedʒuːl | расписание, график | a plan of what will happen and when | My *schedule* is very busy this week. | На этой неделе у меня очень плотный график.
- season | n | ˈsiːzn |  | время года, сезон | one of the four parts of the year | Autumn is my favourite *season*. | Осень — моё любимое время года.
- semester | n | sɪˈmestə | sɪˈmestər | семестр | one of two periods in a university year | The spring *semester* begins in February. | Весенний семестр начинается в феврале. | брит. чаще term
- since | prep | sɪns |  | с (какого-то времени); так как | from a time in the past until now | I've lived here *since* 2018. | Я живу здесь с 2018 года.
- sometimes | adv | ˈsʌmtaɪmz |  | иногда | at some times | I *sometimes* go to work by bike. | Иногда я езжу на работу на велосипеде.
- speed | v | spiːd |  | мчаться; превышать скорость | to go very fast; to drive faster than allowed | The police stopped him for *speeding*. | Полиция остановила его за превышение скорости. | сущ. speed — скорость
- suddenly | adv | ˈsʌdənli |  | вдруг, внезапно | quickly and when you do not expect it | *Suddenly*, all the lights went out. | Вдруг погас весь свет.
- until | conj | ʌnˈtɪl | ənˈtɪl | до тех пор пока (не) | up to the time when | Wait here *until* I come back. | Подожди здесь, пока я не вернусь.
- weekday | n | ˈwiːkdeɪ |  | будний день | any day except Saturday and Sunday | The shop is open on *weekdays*. | Магазин работает по будням.
- weekly | adv | ˈwiːkli |  | еженедельно | every week | The magazine comes out *weekly*. | Журнал выходит еженедельно.
- 'while | conj | waɪl | hwaɪl | пока, в то время как | during the time that | I read *while* I wait for the bus. | Я читаю, пока жду автобус. | сущ.: a while — какое-то время'
- yet | adv | jet |  | ещё (не); уже (в вопросах) | until now (in questions and negatives) | Have you finished your homework *yet*? | Ты уже сделал домашнее задание? | not yet — ещё нет
