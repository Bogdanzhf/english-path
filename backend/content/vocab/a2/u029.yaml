title: Education
title_ru: Учёба
topic: education
words:
- adjective | n | ˈædʒɪktɪv |  | имя прилагательное | a word that describes a noun | "Big" is an *adjective*. | «Big» — прилагательное.
- author | n | ˈɔːθə | ˈɔːθər | автор, писатель | a writer of a book | She's the *author* of three novels. | Она автор трёх романов.
- blackboard | n | ˈblækbɔːd | ˈblækbɔːrd | (школьная) доска | a dark board in a classroom you write on with chalk | The teacher wrote on the *blackboard*. | Учитель написал на доске.
- context | n | ˈkɒntekst | ˈkɑːntekst | контекст | the situation in which something is said or happens | His words were taken out of *context*. | Его слова вырвали из контекста.
- degree | n | dɪˈɡriː |  | градус; степень | a unit for measuring temperature or angles; a university qualification | The temperature fell to five *degrees*. | Температура упала до пяти градусов.
- education | n | ˌedʒuˈkeɪʃn |  | образование | the process of teaching and learning | Everyone has the right to free *education*. | Каждый имеет право на бесплатное образование.
- high school | n | haɪ skuːl |  | средняя (старшая) школа | a school for students aged 14 to 18 | My son is in *high school*. | Мой сын учится в старшей школе.
- knowledge | n | ˈnɒlɪdʒ | ˈnɑːlɪdʒ | знание, знания | information and understanding | *Knowledge* is power. | Знание — сила. | k не читается
- learner | n | ˈlɜːnə | ˈlɜːrnər | учащийся | a person who is learning | The book is for English *learners*. | Книга для изучающих английский.
- noun | n | naʊn |  | имя существительное | a word that names a person, place or thing | "Table" is a *noun*. | «Table» — существительное.
- punctuation | n | ˌpʌŋktʃuːˈeɪʃən |  | пунктуация | marks such as full stops and commas | Check your *punctuation*. | Проверьте пунктуацию.
- quiz | n | kwɪz |  | викторина; тест | a game or short test with questions | We have a *quiz* on Friday. | В пятницу у нас викторина.
- review | n | rɪˈvjuː |  | рецензия, отзыв; обзор | an article giving an opinion about a film or book | The film got excellent *reviews*. | Фильм получил отличные отзывы.
- schoolwork | n | ˈskuːlwɜːk | ˈskuːlwɜːrk | учёба, школьные задания | work done for school | He works hard at his *schoolwork*. | Он усердно учится.
- strategy | n | ˈstrætədʒi |  | стратегия | a plan for achieving a goal | We need a long-term *strategy*. | Нам нужна долгосрочная стратегия.
- teaching | n | ˈtiːtʃɪŋ |  | преподавание, обучение | the job of a teacher | She loves *teaching*. | Она любит преподавать.
- verb | n | vɜːb | vɜːrb | глагол | a word that describes an action or state | "Run" is a *verb*. | «Run» — глагол.
