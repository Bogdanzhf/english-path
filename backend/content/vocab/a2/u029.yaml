title: Education
title_ru: Учёба
topic: education
words:
- author | n | ˈɔːθə | ˈɔːθər | автор, писатель | a writer of a book | She's the *author* of three novels. | Она автор трёх романов.
- context | n | ˈkɒntekst | ˈkɑːntekst | контекст | the situation in which something is said or happens | His words were taken out of *context*. | Его слова вырвали из контекста.
- degree | n | dɪˈɡriː |  | градус; степень | a unit for measuring temperature or angles; a university qualification | The temperature fell to five *degrees*. | Температура упала до пяти градусов.
- education | n | ˌedʒuˈkeɪʃn |  | образование | the process of teaching and learning | Everyone has the right to free *education*. | Каждый имеет право на бесплатное образование.
- knowledge | n | ˈnɒlɪdʒ | ˈnɑːlɪdʒ | знание, знания | information and understanding | *Knowledge* is power. | Знание — сила. | k не читается
- review | n | rɪˈvjuː |  | рецензия, отзыв; обзор | an article giving an opinion about a film or book | The film got excellent *reviews*. | Фильм получил отличные отзывы.
- strategy | n | ˈstrætədʒi |  | стратегия | a plan for achieving a goal | We need a long-term *strategy*. | Нам нужна долгосрочная стратегия.
