title: Everyday phrases
title_ru: Разговорные фразы
topic: phrases
words:
- in the middle | phr |  |  | посередине | in the centre | There's a table *in the middle* of the room. | Посреди комнаты стоит стол.
- in the same way | phr |  |  | так же, таким же образом | similarly | Do it *in the same way*. | Сделай это так же.
- in this way | phr |  |  | таким образом | by doing this | *In this way*, we can save time. | Таким образом мы можем сэкономить время.
- it depends | phr |  |  | смотря как, всё зависит | used to say that the answer depends on something | Are you coming? — *It depends*. | Ты придёшь? — Смотря как.
- lead to something | phr |  |  | приводить к | to cause something | Stress can *lead to* illness. | Стресс может привести к болезни.
- less than... | phr |  |  | меньше, чем… | a smaller amount than | It costs *less than* ten dollars. | Это стоит меньше десяти долларов.
- let me know | phr |  |  | дай(те) мне знать | tell me | *Let me know* if you need help. | Дай знать, если нужна помощь.
- let me... | phr |  |  | позволь(те) мне… | used to offer to do something | *Let me* help you with that bag. | Давай я помогу тебе с сумкой.
- look back at something | phr |  |  | оглядываться на (прошлое) | to think about the past | When I *look back at* my school days, I smile. | Когда я вспоминаю школьные годы, я улыбаюсь.
- make a mistake | phr |  |  | ошибиться | to do something wrong | Everyone *makes mistakes*. | Все ошибаются.
- make money | phr |  |  | зарабатывать деньги | to earn money | He *makes money* by selling old cars. | Он зарабатывает на продаже старых машин.
- make sure | phr |  |  | убедиться, проследить | to check that something is true or done | *Make sure* you lock the door. | Обязательно запри дверь.
- much better | phr |  |  | намного лучше | a lot better | I feel *much better* today. | Сегодня мне намного лучше.
- no way | phr |  |  | ни за что!, не может быть! | used to say no strongly or to show surprise | *No way*! I'm not doing that. | Ни за что! Я не буду этого делать.
- not at all | phr |  |  | совсем не; не за что | used to say "no" strongly or to reply to thanks | Thank you! — *Not at all*. | Спасибо! — Не за что.
- oh dear | phr |  |  | ой, боже мой | used to show worry or surprise | *Oh dear*, I've spilled my coffee. | Ой, я пролил кофе.
- oh well | phr |  |  | ну что ж | used to accept a bad situation | *Oh well*, we can try again tomorrow. | Ну что ж, попробуем завтра снова.
- old friend | phr |  |  | старый друг | a friend you have known for a long time | He's an *old friend* from school. | Он мой старый друг со школы.
- on earth | phr |  |  | на земле; (в вопросах) же, вообще | used to make questions stronger | What *on earth* are you doing? | Что ты вообще делаешь?
