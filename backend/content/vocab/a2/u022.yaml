title: Travel and transport
title_ru: Путешествия и транспорт
topic: travel
words:
- airline | n | ˈeəlaɪn | ˈerlaɪn | авиакомпания | a company that flies planes for passengers | Which *airline* are you flying with? | Какой авиакомпанией ты летишь?
- book | v | bʊk |  | бронировать, заказывать | to arrange to have a seat, room, etc. | I *booked* a table for two. | Я забронировал столик на двоих.
- cab | n | kæb |  | такси | a taxi | Let's take a *cab* to the airport. | Давай возьмём такси до аэропорта.
- driver's license | n | ˈdraɪvɜːz ˈlaɪsəns | ˈdraɪvərz ˈlaɪsəns | водительские права (амер.) | a document that allows you to drive | Can I see your *driver's license*? | Можно ваши права? | брит. driving licence
- driving | n | ˈdraɪvɪŋ |  | вождение | the activity of driving a car | *Driving* in the city is stressful. | Водить по городу — стресс.
- ID card | n | ˌaɪˈdiː kɑːd | ˈaɪˈdiː kɑːrd | удостоверение личности | an official card with your name and photo | Please show your *ID card*. | Пожалуйста, покажите удостоверение.
- jet | n | dʒet |  | реактивный самолёт | a fast plane with a jet engine | A private *jet* landed at the airport. | В аэропорту приземлился частный самолёт. | jet lag — смена часовых поясов
- lorry | n | ˈlɒri | ˈlɔːri | грузовик (брит.) | a large vehicle for carrying goods | A *lorry* blocked the road. | Грузовик перекрыл дорогу. | амер. truck
- motorcycle | n | ˈməʊtəsaɪkl | ˈmoʊtərsaɪkl | мотоцикл | a vehicle with two wheels and an engine | He rides a *motorcycle* to work. | Он ездит на работу на мотоцикле.
- petrol | n | ˈpetrəl | ˈpetroʊl | бензин (брит.) | fuel for cars | We need to stop for *petrol*. | Нам нужно заправиться. | амер. gas
- petrol station | n | ˈpetrəl ˈsteɪʃən | ˈpetroʊl ˈsteɪʃən | автозаправка (брит.) | a place where you buy fuel for your car | Is there a *petrol station* near here? | Здесь поблизости есть заправка? | амер. gas station
- ship | n | ʃɪp |  | корабль, судно | a large boat | The *ship* sailed across the ocean. | Корабль пересёк океан.
- tour | n | tʊə | tʊr | экскурсия, тур | a visit to a place to see its interesting parts | We went on a *tour* of the old castle. | Мы сходили на экскурсию по старому замку.
- tourism | n | ˈtɔːrɪzəm | ˈtʊrɪzəm | туризм | the business of providing services for tourists | The island lives on *tourism*. | Остров живёт за счёт туризма.
- traffic light | n | ˈtræfɪk laɪt |  | светофор | lights that tell cars when to stop or go | Turn right at the *traffic lights*. | На светофоре поверните направо.
- transport | n | ˈtrænspɔːt | ˈtrænspɔːrt | транспорт | systems for carrying people or goods | The city has excellent public *transport*. | В городе отличный общественный транспорт. | амер. чаще transportation
- traveller | n | ˈtrævələ | ˈtrævələr | путешественник (брит.) | a person who travels | The hotel is popular with young *travellers*. | Отель популярен у молодых путешественников. | амер. traveler
- truck | n | trʌk |  | грузовик (амер.) | a large vehicle for carrying goods | A big *truck* was parked outside. | Снаружи стоял большой грузовик. | брит. lorry
- vehicle | n | ˈviəkl | ˈviːhɪkl | транспортное средство | a car, bus, truck, etc. | No *vehicles* are allowed in the park. | Въезд транспорта в парк запрещён.
