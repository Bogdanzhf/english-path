title: Place and direction
title_ru: Место и направление
topic: place
words:
- along | prep | əˈlɒŋ | əˈlɔːŋ | вдоль, по | from one end towards the other end of something | We walked *along* the beach. | Мы шли вдоль пляжа.
- among | prep | əˈmʌŋ |  | среди | in the middle of a group of people or things | I found my keys *among* the books on the table. | Я нашёл ключи среди книг на столе.
- beside | prep | bɪˈsaɪd |  | рядом с | next to; at the side of | Come and sit *beside* me. | Иди сядь рядом со мной. | не путайте с besides — кроме того
- forward | adv | ˈfɔːwəd | ˈfɔːrwərd | вперёд | towards the front | Please move *forward* — there's space here. | Пожалуйста, проходите вперёд — здесь есть место. | look forward to — с нетерпением ждать
- inside | adv | ɪnˈsaɪd |  | внутри, внутрь | in or into a building or a container | It's cold — let's go *inside*. | Холодно — пойдём внутрь.
- nowhere | adv | ˈnəʊweə | ˈnoʊwer | нигде, никуда | not in or to any place | The keys were *nowhere* to be found. | Ключей нигде не было.
- toward | prep | təˈwɔːd | tɔːrd | к, по направлению к | in the direction of | The dog ran *toward* me. | Собака побежала ко мне. | брит. часто towards
