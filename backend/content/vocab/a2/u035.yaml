title: Free time and sport
title_ru: Досуг и спорт
topic: leisure
words:
- attack | v | əˈtæk |  | нападать, атаковать | to try to hurt or damage someone or something | The virus *attacks* the body's cells. | Вирус атакует клетки организма. | сущ. heart attack — инфаркт
- badminton | n | ˈbædmɪntn |  | бадминтон | a game played with rackets and a shuttlecock | We play *badminton* in the garden. | Мы играем в бадминтон в саду.
- baseball | n | ˈbeɪsbɔːl | ˈbeɪsˈbɔːl | бейсбол | an American game with a bat and ball | *Baseball* is popular in the USA. | Бейсбол популярен в США.
- basketball | n | ˈbɑːskɪtbɔːl | ˈbæskətbɔːl | баскетбол | a game where players throw a ball through a high net | He plays *basketball* for the school team. | Он играет в баскетбол за школьную команду.
- compete | v | kəmˈpiːt |  | соревноваться, конкурировать | to try to win | Ten teams will *compete* in the final. | В финале будут соревноваться десять команд.
- cycling | n | ˈsaɪklɪŋ | ˈsaɪkəlɪŋ | велоспорт, езда на велосипеде | riding a bicycle | *Cycling* is a cheap way to travel. | Езда на велосипеде — дешёвый способ передвижения.
- 'fight | v | faɪt |  | драться, бороться | to use force against someone | The boys were *fighting* in the street. | Мальчишки дрались на улице. | fight – fought – fought; сущ.: драка'
- fishing | n | ˈfɪʃɪŋ |  | рыбалка | catching fish | My dad loves *fishing*. | Мой папа обожает рыбалку.
- footballer | n | ˈfʊtbɔːlə | fˈʊtbɔːlɐ | футболист (брит.) | a person who plays football | He's a professional *footballer*. | Он профессиональный футболист.
- golf | n | ɡɒlf | ɡɑːlf | гольф | a game where you hit a small ball into holes with a club | My father plays *golf* at the weekend. | Мой папа по выходным играет в гольф.
- hockey | n | ˈhɒki | ˈhɑːki | хоккей | a game played with sticks and a ball or puck | We watched an ice *hockey* match. | Мы смотрели хоккейный матч.
- 'score | v | skɔː | skɔːr | забивать (гол), набирать очки | to get a point in a game | He *scored* two goals. | Он забил два гола. | сущ.: score — счёт'
- skateboarding | n | ˈskeɪtbɔːdɪŋ | ˈskeɪtbɔːrdɪŋ | скейтбординг | the sport of riding a skateboard | *Skateboarding* is popular with teenagers. | Скейтбординг популярен у подростков.
- skating | n | ˈskeɪtɪŋ |  | катание на коньках | moving on ice in skates | We went *skating* on the lake. | Мы катались на коньках на озере.
- skiing | n | ˈskiːɪŋ |  | лыжный спорт, катание на лыжах | moving over snow on skis | We go *skiing* every winter. | Каждую зиму мы катаемся на лыжах.
- soccer | n | ˈsɒkə | ˈsɑːkər | футбол (амер.) | football | He plays *soccer* every weekend. | Он играет в футбол каждые выходные. | брит. football
- surfing | n | ˈsɜːfɪŋ | ˈsɜːrfɪŋ | сёрфинг | riding waves on a board | *Surfing* is fun but difficult. | Сёрфинг — это весело, но трудно.
