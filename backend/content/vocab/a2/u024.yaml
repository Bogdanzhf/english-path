title: Shopping and money
title_ru: Покупки и деньги
topic: shopping
words:
- advertising | n | ˈædvətaɪzɪŋ | ˈædvərtaɪzɪŋ | реклама (как деятельность) | the business of telling people about products | She works in *advertising*. | Она работает в рекламе.
- banking | n | ˈbæŋkɪŋ |  | банковское дело | the business of a bank | He has a job in *banking*. | Он работает в банковской сфере.
- belong | v | bɪˈlɒŋ | bɪˈlɔːŋ | принадлежать; быть на своём месте | to be owned by; to be in the right place | Where does this book *belong*? | Где место этой книги?
- belt | n | belt |  | ремень, пояс | a strip of leather worn around the waist | Fasten your seat *belt*. | Пристегните ремень безопасности.
- bookshop | n | ˈbʊkʃɒp | ˈbʊkʃɑːp | книжный магазин (брит.) | a shop that sells books | There's a *bookshop* on the corner. | На углу книжный магазин. | амер. bookstore
- borrow | v | ˈbɒrəʊ | ˈbɑːroʊ | брать взаймы | to take something that you will give back later | Can I *borrow* your pen for a minute? | Можно одолжить твою ручку на минуту? | borrow from — брать; lend to — давать
- cash | n | kæʃ |  | наличные | money in coins or notes | Do you want to pay in *cash*? | Будете платить наличными?
- cheque | n | tʃek |  | чек (банковский, брит.) | a printed form you use to pay money from your bank | She paid by *cheque*. | Она расплатилась чеком. | амер. check
- collect | v | kəˈlekt |  | собирать, коллекционировать; забирать | to bring things together; to go and get | He *collects* stamps. | Он собирает марки.
- credit | n | ˈkredɪt |  | признание, заслуга; кредит | praise for something you did | He never got *credit* for his ideas. | Ему так и не отдали должное за его идеи. | take credit for — приписывать себе
- department store | n | dɪˈpɑːtmənt stɔː | dɪˈpɑːrtmənt stɔːr | универмаг | a large shop with many sections | I bought it in a *department store*. | Я купил это в универмаге.
- drugstore | n | ˈdrʌɡstɔː | ˈdrʌɡstɔːr | аптека (амер.) | a shop that sells medicines and other things | I need to stop at the *drugstore*. | Мне нужно зайти в аптеку. | брит. chemist's
- earn | v | ɜːn | ɜːrn | зарабатывать | to get money for work | How much does a teacher *earn*? | Сколько зарабатывает учитель?
- fashion | n | ˈfæʃən |  | мода | popular styles of clothes | She is interested in *fashion*. | Она интересуется модой.
- gift | n | ɡɪft |  | подарок; дар, талант | a present; a natural ability | Thank you for the lovely *gift*! | Спасибо за чудесный подарок!
- gold | n | ɡəʊld | ɡoʊld | золото | a valuable yellow metal | Her ring is made of *gold*. | Её кольцо из золота. | прил. gold — золотой
- grocery store | n | ˈɡrəʊsəri stɔː | ˈɡroʊsəri stɔːr | продуктовый магазин (амер.) | a shop that sells food | I'll stop at the *grocery store* on my way home. | Зайду в продуктовый по дороге домой.
- have | v | hæv |  | иметь; есть, пить; проводить | to own; to eat or drink; to experience | We *have* two cats. | У нас две кошки. | have breakfast — завтракать; have – had – had
- lend | v | lend |  | давать взаймы, одалживать | to give something to someone for a short time | Can you *lend* me ten pounds? | Можешь одолжить мне десять фунтов? | lend — lent — lent; lend TO, borrow FROM
- 'offer | v | ˈɒfə | ˈɔːfər | предлагать | to ask if someone wants something | They *offered* me a job. | Мне предложили работу. | сущ.: offer — предложение'
- pay | n | peɪ |  | зарплата, оплата | money you get for work | The *pay* is good, but the hours are long. | Платят хорошо, но рабочий день длинный.
- pence | n | pens |  | пенсы (брит.) | the plural of penny | It costs fifty *pence*. | Это стоит пятьдесят пенсов.
- provide | v | prəˈvaɪd |  | предоставлять, обеспечивать | to give something that is needed | The oracle *provided* answers to difficult questions. | Оракул давал ответы на трудные вопросы.
- receive | v | rɪˈsiːv |  | получать | to get something that someone gives or sends you | Did you *receive* my email? | Ты получил моё письмо?
- sale | n | seɪl |  | продажа; распродажа | the act of selling; a time when things are cheaper | This house is for *sale*. | Этот дом продаётся. | on sale — со скидкой
- shop | v | ʃɒp | ʃɑːp | делать покупки | to buy things in shops | I usually *shop* at the weekend. | Обычно я хожу за покупками в выходные.
- store | n | stɔː | stɔːr | магазин | a place where you buy things | I need to go to the *store* for some milk. | Мне нужно сходить в магазин за молоком. | амер.; брит. shop
