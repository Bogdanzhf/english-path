title: Nature and weather
title_ru: Природа и погода
topic: nature
words:
- bloom | v | bluːm |  | цвести | to produce flowers | The roses *bloom* in early summer. | Розы цветут в начале лета. | in bloom — в цвету
- cloud | n | klaʊd |  | облако, туча | a white or grey mass of water drops in the sky | There isn't a single *cloud* in the sky today. | Сегодня на небе ни облачка.
- desert | n | ˈdezət | ˈdezərt | пустыня | a large dry area with very little water or plants | The Sahara is the largest hot *desert* in the world. | Сахара — самая большая жаркая пустыня в мире. | dessert [dɪˈzɜːt] — десерт
- fog | n | fɒɡ | fɑːɡ | туман | a thick cloud near the ground that is hard to see through | The plane couldn't land because of the *fog*. | Самолёт не мог приземлиться из-за тумана.
- grass | n | ɡrɑːs | ɡræs | трава | green plants that cover the ground in fields and gardens | The children were sitting on the *grass*. | Дети сидели на траве.
- hill | n | hɪl |  | холм | an area of land higher than the land around it | Their house stands on a *hill*. | Их дом стоит на холме.
- sunlight | n | ˈsʌnlaɪt |  | солнечный свет | the light from the sun | The room was full of *sunlight*. | Комната была залита солнечным светом.
- temperature | n | ˈtemprətʃə | ˈtemprətʃər | температура | how hot or cold something is | The *temperature* dropped below zero last night. | Ночью температура опустилась ниже нуля. | have a temperature — иметь жар
