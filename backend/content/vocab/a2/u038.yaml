title: Nature and weather
title_ru: Природа и погода
topic: nature
words:
- bloom | v | bluːm |  | цвести | to produce flowers | The roses *bloom* in early summer. | Розы цветут в начале лета. | in bloom — в цвету
- bulb | n | bʌlb |  | лампочка; луковица (растения) | the glass part of a lamp that gives light | The *bulb* in the kitchen doesn't work. | Лампочка на кухне не горит.
- cloud | n | klaʊd |  | облако, туча | a white or grey mass of water drops in the sky | There isn't a single *cloud* in the sky today. | Сегодня на небе ни облачка.
