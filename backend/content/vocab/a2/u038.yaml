- sky | n | skaɪ |  | небо | the space above the earth | The *sky* is blue today. | Сегодня голубое небо.
- stone | n | stəʊn | stoʊn | камень | a small piece of rock | He threw a *stone* into the river. | Он бросил камень в реку.
