- pacific | adj | pəˈsɪfɪk |  | тихоокеанский; мирный | relating to the Pacific Ocean | They sailed across the *Pacific* Ocean. | Они пересекли Тихий океан.
- rose | n | rəʊz | roʊz | роза | a flower with a nice smell and thorns | He gave her red *roses*. | Он подарил ей красные розы.
