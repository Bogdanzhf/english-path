title: Actions and movement
title_ru: Действия и движение
topic: actions
words:
- affect | v | əˈfekt |  | влиять, сказываться | to have an influence on someone or something | Lack of sleep *affects* your mood. | Недосып сказывается на настроении. | не путайте с effect (сущ.)
- boil | v | bɔɪl |  | кипятить, варить | to heat a liquid until it bubbles | *Boil* the water for the pasta. | Вскипятите воду для пасты.
- burn | v | bɜːn | bɜːrn | сжигать, расходовать (энергию) | to use something as fuel; to use up energy | Running *burns* a lot of calories. | Бег сжигает много калорий. | burn — burnt/burned
- connect | v | kəˈnekt |  | соединять, связывать | to join two things together | Breathing exercises help you *connect* with your body. | Дыхательные упражнения помогают почувствовать своё тело.
- cover | v | ˈkʌvə | ˈkʌvər | покрывать, накрывать | to put something over something else | Snow *covered* the whole city. | Снег покрыл весь город.
- disappear | v | ˌdɪsəˈpɪə | ˌdɪsəˈpɪr | исчезать | to go away so that nobody can see it | The sun *disappeared* behind the clouds. | Солнце скрылось за облаками.
- fish | v | fɪʃ |  | ловить рыбу | to try to catch fish | We *fished* in the river all day. | Мы весь день ловили рыбу в реке.
- hit | v | hɪt |  | ударить по, сильно затронуть | to affect someone or something badly | The region was badly *hit* by the crisis. | Кризис сильно ударил по региону. | hit — hit — hit
- kick | v | kɪk |  | пинать, ударять ногой | to hit with your foot | He *kicked* the ball into the goal. | Он ударом ноги отправил мяч в ворота.
- kill | v | kɪl |  | убивать | to make a person, animal or plant die | Too much sun can *kill* these flowers. | Слишком много солнца может погубить эти цветы.
- 'lock | v | lɒk | lɑːk | запирать | to close with a key | Don''t forget to *lock* the door. | Не забудь запереть дверь. | сущ.: lock — замок'
- mark | v | mɑːk | mɑːrk | отмечать, ознаменовывать | to celebrate or remember an important event | The ceremony *marked* the 80th anniversary of the war's end. | Церемония была приурочена к 80-летию окончания войны.
- pack | v | pæk |  | упаковывать, собирать (вещи) | to put things in a bag for a trip | I need to *pack* my suitcase. | Мне нужно собрать чемодан.
- place | v | pleɪs |  | помещать, ставить | to put something in a position | *Place* the cake in the oven. | Поставьте торт в духовку.
- pollute | v | pəˈluːt |  | загрязнять | to make air, water or land dirty | Petrol cars *pollute* the air in cities. | Бензиновые машины загрязняют воздух в городах.
- pull | v | pʊl |  | тянуть | to move something towards you | *Pull* the door — don't push it. | Тяните дверь на себя, а не толкайте.
- remove | v | rɪˈmuːv |  | убирать, снимать | to take something away | Please *remove* your shoes before entering. | Пожалуйста, снимите обувь перед входом.
- replace | v | rɪˈpleɪs |  | заменять | to take the place of something | Computers have *replaced* typewriters. | Компьютеры заменили пишущие машинки.
- rest | v | rest |  | отдыхать | to relax or sleep after activity | You should *rest* for a few days. | Тебе стоит несколько дней отдохнуть. | сущ. the rest — остаток, остальное
- set | v | set |  | ставить, класть; устанавливать | to put something somewhere carefully | She *set* the plates on the table. | Она расставила тарелки на столе. | set — set — set; set the table — накрыть на стол
- tie | v | taɪ |  | связывать, завязывать | to fasten with string or rope; to connect | He *tied* the boat to a tree. | Он привязал лодку к дереву. | be tied to — быть связанным с
- touch | v | tʌtʃ |  | трогать, касаться | to put your hand on something | Don't *touch* the paintings. | Не трогайте картины. | keep in touch — поддерживать связь
