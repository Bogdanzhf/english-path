title: Everyday phrases
title_ru: Разговорные фразы
topic: phrases
words:
- art gallery | phr |  |  | художественная галерея | a building where you can see paintings | Let's visit the *art gallery*. | Давай сходим в художественную галерею.
- as part of something | phr |  |  | в рамках, как часть | included in something | We visited the museum *as part of* the tour. | Мы посетили музей в рамках экскурсии.
- as soon as | phr |  |  | как только | immediately when | Call me *as soon as* you arrive. | Позвони, как только приедешь.
- as well | phr |  |  | тоже, также | also | She speaks French *as well*. | Она также говорит по-французски.
- at first | phr |  |  | сначала, поначалу | at the beginning | *At first* I didn't like it. | Поначалу мне это не нравилось.
- at least | phr |  |  | по крайней мере; как минимум | not less than; anyway | It takes *at least* two hours. | Это занимает как минимум два часа.
- at the age of... | phr |  |  | в возрасте… | when someone is a particular age | She started school *at the age of* six. | Она пошла в школу в шесть лет.
- at the start of something | phr |  |  | в начале (чего-либо) | when something begins | *At the start of* the year, I made a plan. | В начале года я составил план.
- at the time | phr |  |  | в то время, тогда | at that moment in the past | I was a student *at the time*. | Тогда я был студентом.
- at the time of something | phr |  |  | во время, на момент | when something happened | He was at home *at the time of* the accident. | На момент аварии он был дома.
- at the top | phr |  |  | наверху, на вершине | at the highest point | Write your name *at the top* of the page. | Напишите имя вверху страницы.
- based on something | phr |  |  | основанный на | using something as a starting point | The film is *based on* a true story. | Фильм основан на реальной истории.
- be allowed to do something | phr |  |  | иметь разрешение | to have permission | You *are not allowed to* smoke here. | Здесь курить нельзя.
- be made of something | phr |  |  | быть сделанным из | to be produced from a material | The table *is made of* wood. | Стол сделан из дерева.
- believe in somebody/something | phr |  |  | верить в | to think that someone or something exists or is good | Do you *believe in* ghosts? | Ты веришь в привидения?
- belong to somebody | phr |  |  | принадлежать кому-либо | to be the property of someone | This bag *belongs to* my sister. | Эта сумка принадлежит моей сестре.
- belong to something | phr |  |  | быть членом, относиться к | to be a member of a group | She *belongs to* a tennis club. | Она состоит в теннисном клубе.
- by the end of something | phr |  |  | к концу (чего-либо) | not later than the end of | I'll finish the book *by the end of* the week. | Я дочитаю книгу к концу недели.
- care about something | phr |  |  | беспокоиться о, быть небезразличным | to think something is important | I *care about* the environment. | Мне небезразлична экология.
