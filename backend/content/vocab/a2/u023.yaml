title: Travel and transport
title_ru: Путешествия и транспорт
topic: travel
words:
- airline | n | ˈeəlaɪn | ˈerlaɪn | авиакомпания | a company that flies planes for passengers | Which *airline* are you flying with? | Какой авиакомпанией ты летишь?
- jet | n | dʒet |  | реактивный самолёт | a fast plane with a jet engine | A private *jet* landed at the airport. | В аэропорту приземлился частный самолёт. | jet lag — смена часовых поясов
- tour | n | tʊə | tʊr | экскурсия, тур | a visit to a place to see its interesting parts | We went on a *tour* of the old castle. | Мы сходили на экскурсию по старому замку.
- transport | n | ˈtrænspɔːt | ˈtrænspɔːrt | транспорт | systems for carrying people or goods | The city has excellent public *transport*. | В городе отличный общественный транспорт. | амер. чаще transportation
