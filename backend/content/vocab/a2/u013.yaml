title: Body and health
title_ru: Тело и здоровье
topic: body
words:
- behave | v | bɪˈheɪv |  | вести себя | to act in a certain way, often in a good way | The children *behaved* very well at the museum. | Дети очень хорошо вели себя в музее.
- blood | n | blʌd |  | кровь | the red liquid in your body | He gave *blood* at the hospital. | Он сдал кровь в больнице.
- blow | n | bləʊ | bloʊ | удар | a hard hit; a sudden shock or disappointment | Losing the ship was a terrible *blow*. | Потеря корабля стала страшным ударом.
- breathe | v | briːð |  | дышать | to take air into your body and let it out | *Breathe* in slowly through your nose. | Медленно вдохните через нос. | сущ. breath [breθ] — дыхание
- curly | adj | ˈkɜːli | ˈkɜːrli | кудрявый, вьющийся | with lots of curls | She has *curly* red hair. | У неё кудрявые рыжие волосы.
- dizzy | adj | ˈdɪzi |  | испытывающий головокружение | feeling that everything is spinning | I feel *dizzy*. | У меня кружится голова.
- fever | n | ˈfiːvə | ˈfiːvər | жар, лихорадка | a high body temperature caused by illness | The child had a high *fever*. | У ребёнка был сильный жар.
- headache | n | ˈhedeɪk |  | головная боль | a pain in your head | I have a terrible *headache*. | У меня ужасно болит голова.
- ill | adj | ɪl |  | больной | not healthy | He's been *ill* for a week. | Он болеет уже неделю.
- medical | adj | ˈmedɪkl |  | медицинский | connected with medicine and treating illness | You need a *medical* certificate for this job. | Для этой работы нужна медицинская справка.
- medicine | n | ˈmedsn | ˈmedɪsn | лекарство; медицина | something you take when you are ill | Take this *medicine* three times a day. | Принимайте это лекарство три раза в день.
- pain | n | peɪn |  | боль | the feeling you have when part of your body hurts | I have a *pain* in my back. | У меня болит спина.
- patient | adj | ˈpeɪʃnt |  | терпеливый | able to wait calmly without getting angry | A good teacher is always *patient*. | Хороший учитель всегда терпелив. | сущ. patient — пациент
- sleep | n | sliːp |  | сон | the natural state of rest | I need more *sleep*. | Мне нужно больше спать.
- smile | v | smaɪl |  | улыбаться | to make a happy expression with your mouth | She always *smiles* when she sees her dog. | Она всегда улыбается, когда видит свою собаку.
- smoking | n | ˈsməʊkɪŋ | ˈsmoʊkɪŋ | курение | the habit of smoking cigarettes | *Smoking* is not allowed here. | Здесь курить запрещено.
- sweat | v | swet |  | потеть | to lose liquid through your skin when hot | I *sweat* a lot when I run. | Я сильно потею, когда бегаю. | сущ. sweat — пот
- toothache | n | ˈtuːθeɪk | tˈuːθeɪk | зубная боль | a pain in a tooth | I've got a terrible *toothache*. | У меня ужасно болит зуб.
- voice | n | vɔɪs |  | голос | the sound you make when you speak or sing | She has a beautiful *voice*. | У неё красивый голос.
- wheelchair | n | ˈwiːltʃeə | ˈhwiːltʃer | инвалидная коляска | a chair with wheels for people who cannot walk | He uses a *wheelchair*. | Он передвигается на инвалидной коляске.
