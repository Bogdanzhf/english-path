title: 'Describing: time and age'
title_ru: 'Описание: время, новизна, возраст'
topic: describing
words:
- ancient | adj | ˈeɪnʃənt |  | древний | very old; from long ago | We visited the *ancient* ruins of Rome. | Мы побывали в древних руинах Рима.
- based | adj | beɪst |  | находящийся, базирующийся | having its main place somewhere | The company is *based* in London. | Компания находится в Лондоне.
- classical | adj | ˈklæsɪkl |  | классический | (of music) serious and traditional, like Bach or Mozart | She plays *classical* piano. | Она играет на фортепиано классическую музыку.
- developed | adj | dɪˈveləpt |  | развитый | having modern industry | Japan is a *developed* country. | Япония — развитая страна.
- elementary | adj | ˌelɪˈmentri | ˌelɪˈmentəri | начальный, элементарный | basic and simple | I only speak *elementary* French. | Я говорю по-французски только на начальном уровне. | elementary school — начальная школа (амер.)
- even | adj | ˈiːvən | ˈiːvɪn | ровный; чётный | flat and smooth; (of a number) divisible by two | 4 is an *even* number. | 4 — чётное число.
- final | n | ˈfaɪnl |  | финал | the last game in a competition | Our team is in the *final*. | Наша команда в финале.
- following | adj | ˈfɒləʊɪŋ | ˈfɑːloʊɪŋ | следующий | coming next | Answer the *following* questions. | Ответьте на следующие вопросы.
- further | adv | ˈfɜːðə | ˈfɜːrðər | дальше; далее | at or to a greater distance; more | I can't walk any *further*. | Я не могу идти дальше.
- long-time | adj | ˈlɒŋtaɪm | ˈlɔːŋtaɪm | давний, многолетний | having existed for a long time | She's my *long-time* friend. | Она моя давняя подруга.
- past | adj | pɑːst | pæst | прошлый | gone by in time | I've been busy for the *past* few days. | Последние несколько дней я был занят. | half past six — половина седьмого
- recent | adj | ˈriːsnt |  | недавний | happening a short time ago | In *recent* years, online courses have grown fast. | В последние годы онлайн-курсы быстро растут.
- regular | adj | ˈreɡjələ | ˈreɡjələr | регулярный, обычный | happening often or at the same time | *Regular* exercise is good for you. | Регулярные занятия спортом полезны.
- routine | n | ruːˈtiːn |  | распорядок, рутина | the usual way you do things every day | Exercise is part of my morning *routine*. | Зарядка — часть моего утреннего распорядка.
- traditional | adj | trəˈdɪʃənl |  | традиционный | following old customs and ways | They rejected *traditional* subjects like kings and battles. | Они отказались от традиционных сюжетов вроде королей и сражений.
- used | adj | juzd | juːzd | подержанный | not new; owned before | We bought a *used* car. | Мы купили подержанную машину. | be used to — привыкнуть
- working | adj | ˈwɜːkɪŋ | ˈwɜːrkɪŋ | рабочий; работающий | relating to work; having a job | What are your *working* hours? | Какой у тебя рабочий день?
- worse | adj | wɜːs | wɜːrs | хуже | more bad than something else | The weather today is *worse* than yesterday. | Погода сегодня хуже, чем вчера. | bad — worse — the worst
- worst | adj | wɜːst | wɜːrst | худший | most bad | It was the *worst* day of my life. | Это был худший день в моей жизни. | bad – worse – worst
