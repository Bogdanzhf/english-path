title: Society and politics
title_ru: Общество и политика
topic: society
words:
- army | n | ˈɑːmi | ˈɑːrmi | армия | the soldiers of a country who fight on land | My grandfather was in the *army* for twenty years. | Мой дедушка двадцать лет прослужил в армии.
- danger | n | ˈdeɪndʒə | ˈdeɪndʒər | опасность | the possibility of harm or loss | Hundreds of languages are in *danger* of disappearing. | Сотням языков грозит исчезновение.
- disaster | n | dɪˈzɑːstə | dɪˈzæstər | бедствие, катастрофа | something terrible that causes great damage | The flood was a *disaster* for the farmers. | Наводнение стало бедствием для фермеров.
- foreign | adj | ˈfɒrən | ˈfɔːrən | иностранный | from another country | Learning a *foreign* language takes time. | Изучение иностранного языка требует времени. | g не произносится
- international | adj | ˌɪntəˈnæʃnəl | ˌɪntərˈnæʃnəl | международный | between two or more countries | London has five *international* airports. | В Лондоне пять международных аэропортов.
- power | n | ˈpaʊə | ˈpaʊər | власть, сила | the ability to control people and events | Few women held real *power* in the company. | Немногие женщины обладали реальной властью в компании.
- prince | n | prɪns |  | принц | the son of a king or queen | The *prince* will be king one day. | Однажды принц станет королём.
- prize | n | praɪz |  | приз, награда | something you get for winning | She won first *prize* in the competition. | Она заняла первое место на конкурсе.
- social | adj | ˈsəʊʃl | ˈsoʊʃl | социальный, общественный | connected with society and meeting people | She has a very busy *social* life. | У неё очень насыщенная светская жизнь.
- speech | n | spiːtʃ |  | речь, выступление | a formal talk to a group of people | The president gave a short *speech*. | Президент выступил с короткой речью.
- tradition | n | trəˈdɪʃn |  | традиция | a custom that people have had for a long time | It's a family *tradition* to eat pancakes on Sunday. | В нашей семье есть традиция есть блины по воскресеньям.
- war | n | wɔː | wɔːr | война | fighting between countries or large groups | My grandfather fought in the *war*. | Мой дедушка воевал на войне.
