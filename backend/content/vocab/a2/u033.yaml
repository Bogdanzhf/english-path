title: Free time and sport
title_ru: Досуг и спорт
topic: leisure
words:
- athlete | n | ˈæθliːt |  | спортсмен, атлет | a person who is good at sports | Olympic *athletes* train every day. | Олимпийские спортсмены тренируются каждый день.
- award | n | əˈwɔːd | əˈwɔːrd | награда, премия | a prize for doing something well | She won an *award* for best actress. | Она получила награду как лучшая актриса.
- 'camp | n | kæmp |  | лагерь | a place where people stay in tents | The children went to summer *camp*. | Дети поехали в летний лагерь. | гл.: camp — жить в палатке'
- coach | n | kəʊtʃ | koʊtʃ | тренер | a person who trains a sports team or a player | The *coach* made the team run every morning. | Тренер заставлял команду бегать каждое утро.
- competition | n | ˌkɒmpəˈtɪʃən | ˌkɑːmpəˈtɪʃən | соревнование, конкурс; конкуренция | an event where people try to win | She won a singing *competition*. | Она выиграла вокальный конкурс.
- cricket | n | ˈkrɪkɪt | ˈkrɪkət | крикет; сверчок | a sport played with a bat and ball | They play *cricket* in England and India. | В крикет играют в Англии и Индии.
- gym | n | dʒɪm |  | спортзал | a room or building for doing exercise | I go to the *gym* after work. | После работы я хожу в спортзал.
- hiking | n | ˈhaɪkɪŋ |  | пеший туризм, походы | going on long walks in nature | We love *hiking* in the mountains. | Мы любим ходить в горы.
- interest | v | ˈɪntrəst | ˈɪntərəst | интересовать | to make someone want to know more | History doesn't *interest* me. | Меня не интересует история.
- Olympic | adj | əʊˈlɪmpɪk | oʊˈlɪmpɪk | олимпийский | relating to the Olympic Games | She is an *Olympic* champion. | Она олимпийская чемпионка.
- runner | n | ˈrʌnə | ˈrʌnər | бегун | a person who runs | He's a fast *runner*. | Он быстро бегает.
- 'skate | n | skeɪt |  | конёк; ролик | a boot with a blade or wheels | I need new ice *skates*. | Мне нужны новые коньки. | гл.: skate — кататься на коньках'
- ski | v | skiː |  | кататься на лыжах | to move over snow on long thin boards | We *ski* in the mountains every winter. | Каждую зиму мы катаемся на лыжах в горах.
- sports center | n | spɔːts ˈsentə | spɔːrts ˈsenər | спортивный центр | a building with a pool, gym, etc. | The *sports center* has a big pool. | В спортивном центре большой бассейн. | брит. sports centre
- table tennis | n | ˈteɪbl ˈtenɪs | ˈteɪbl ˈtenəs | настольный теннис | a game like tennis on a table | We play *table tennis* at lunch. | В обед мы играем в настольный теннис.
- toy | n | tɔɪ |  | игрушка | a thing for children to play with | The kids' room is full of *toys*. | Детская полна игрушек.
- track | n | træk |  | трек, дорожка; след | a path or a road for racing; marks on the ground | They ran around the *track*. | Они бежали по беговой дорожке.
