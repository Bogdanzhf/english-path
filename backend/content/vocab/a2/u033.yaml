title: 'How and how much: adverbs'
title_ru: 'Как и насколько: наречия'
topic: manner
words:
- carefully | adv | ˈkeəfəli | ˈkerfəli | осторожно, внимательно | with a lot of attention, so that nothing goes wrong | Please read the questions *carefully*. | Пожалуйста, внимательно прочитайте вопросы.
- extremely | adv | ɪkˈstriːmli |  | чрезвычайно, крайне | very, very | It was *extremely* cold that night. | В ту ночь было ужасно холодно.
