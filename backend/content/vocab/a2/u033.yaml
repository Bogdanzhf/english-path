reading:
  title: The Swimmer Who Never Gave Up
  title_ru: Пловчиха, которая не сдавалась
  text: |
    When Lena was eighteen, she was one of the best young swimmers in her country. She trained every day and dreamed of the Olympic Games. Then, one winter evening, a car hit her bike. She woke up in hospital with tubes in her arms. After three surgeries, the doctors said she would never walk again.

    At first, Lena couldn't accept it. She was angry and sad. She couldn't even recall the accident. "I regret everything," she wrote in her journal. "My life is over." She stopped eating properly; even chewing food felt like hard work.

    Her old coach visited her every week. One day, he said, "Your legs don't work, but your soul is still strong. Why not swim again?" Lena laughed. But a few weeks later, she agreed to try. At the pool, her coach helped her into the water. To her surprise, she could float and move her arms. In the water, she felt free.

    The training was tough. She had to learn new ways to swim and to bend her body. There was no sufficient money for special equipment, so her town collected it. Slowly, Lena overcame her fear and pain. Four years later, she competed in the Paralympic Games for disabled athletes.

    Lena won a silver medal. When she saw her country's flag, people around the world marvelled at her story. "It sounds like fiction," she says, "but it's real. Now I understand the true value of life. Every day is fantastic — even a hot bath after training!"
  ru: |
    Когда Лене было восемнадцать, она была одной из лучших юных пловчих страны. Она тренировалась каждый день и мечтала об Олимпийских играх. Но однажды зимним вечером её велосипед сбила машина. Она очнулась в больнице с трубками в руках. После трёх операций врачи сказали, что она больше никогда не сможет ходить.

    Сначала Лена не могла с этим смириться. Она злилась и грустила. Она даже не могла вспомнить аварию. «Я обо всём жалею, — писала она в дневнике. — Моя жизнь кончена». Она перестала нормально есть; даже жевать было тяжело.

    Её бывший тренер навещал её каждую неделю. Однажды он сказал: «Твои ноги не работают, но душа у тебя по-прежнему сильная. Почему бы снова не поплавать?» Лена рассмеялась. Но через несколько недель согласилась попробовать. В бассейне тренер помог ей войти в воду. К её удивлению, она могла держаться на воде и двигать руками. В воде она чувствовала себя свободной.

    Тренировки были тяжёлыми. Ей пришлось заново учиться плавать и по-новому сгибать тело. Денег на специальное оборудование не хватало, и их собрал её город. Постепенно Лена преодолела страх и боль. Через четыре года она выступила на Паралимпийских играх для спортсменов с ограниченными возможностями.

    Лена завоевала серебряную медаль. Когда она увидела флаг своей страны, люди во всём мире восхищались её историей. «Звучит как вымысел, — говорит она, — но это правда. Теперь я понимаю истинную ценность жизни. Каждый день прекрасен — даже горячая ванна после тренировки!»
