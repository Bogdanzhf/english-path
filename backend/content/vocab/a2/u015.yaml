title: Numbers and quantity
title_ru: Числа и количество
topic: numbers
words:
- 'amount | n | əˈmaʊnt |  | количество, сумма | how much there is of something | He spent a large *amount* of money on his car. | Он потратил на машину крупную сумму денег. | для неисчисляемых: amount of water/time'
- average | adj | ˈævərɪdʒ |  | средний | normal or usual; in the middle | The *average* age of the students is twenty. | Средний возраст студентов — двадцать лет.
- billion | num | ˈbɪljən |  | миллиард | 1,000,000,000 | There are about eight *billion* people in the world. | В мире около восьми миллиардов человек.
- 'bit | n | bɪt |  | кусочек, немного | a small piece or amount | Can I have a *bit* of your sandwich? | Можно кусочек твоего бутерброда? | a bit — немного: a bit tired'
- height | n | haɪt |  | рост, высота | how tall or high someone or something is | What is the *height* of the Eiffel Tower? | Какова высота Эйфелевой башни?
- penny | n | ˈpeni |  | пенни, монетка | a small coin; one cent | He saved every *penny* he earned. | Он копил каждую заработанную монетку. | мн. ч. pence (сумма), pennies (монеты)
- pound | v | paʊnd |  | колотить, стучать | to hit something many times | Someone was *pounding* on the door. | Кто-то колотил в дверь. | сущ. pound — фунт (деньги, вес)
- rate | n | reɪt |  | темп, скорость; ставка | the speed at which something happens; an amount or level | Coffee shops are opening at a *rate* of three a week. | Кофейни открываются в темпе по три в неделю.
- sum | n | sʌm |  | сумма | an amount of money; the total | The research cost a huge *sum* of money. | Исследование обошлось в огромную сумму.
- weight | n | weɪt |  | вес | how heavy someone or something is | He wants to lose *weight* before summer. | Он хочет похудеть к лету. | lose weight — худеть, put on weight — набирать вес
