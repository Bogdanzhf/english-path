title: Events and situations
title_ru: События и ситуации
topic: events
words:
- chance | n | tʃɑːns | tʃæns | шанс, возможность | an opportunity to do something | This is your last *chance* to win. | Это твой последний шанс победить.
- contest | n | ˈkɒntest | ˈkɑːntest | конкурс, соревнование | a competition | She won a singing *contest* at school. | Она победила в школьном конкурсе пения.
- hurry | v | ˈhʌri | ˈhɜːri | торопиться | to do something or go somewhere quickly | *Hurry* up, or we'll miss the train! | Поторопись, а то опоздаем на поезд! | be in a hurry — спешить
- noise | n | nɔɪz |  | шум | a sound, often loud or unpleasant | What is that strange *noise* in the kitchen? | Что это за странный шум на кухне?
- opportunity | n | ˌɒpəˈtjuːnəti | ˌɑːpərˈtuːnəti | возможность | a chance to do something | This job is a great *opportunity* for you. | Эта работа — отличная возможность для тебя.
- peace | n | piːs |  | мир, покой | a time without war; a calm, quiet state | After the war, the two countries lived in *peace*. | После войны две страны жили в мире.
- wave | n | weɪv |  | волна | a line of water that moves across the sea | The *waves* were three metres high. | Волны были трёхметровые. | гл. wave — махать рукой
