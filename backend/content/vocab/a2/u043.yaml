title: Arts and media
title_ru: Искусство и медиа
topic: arts
words:
- adventure | n | ədˈventʃə | ədˈventʃər | приключение | an exciting and unusual experience | Our trip to the mountains was a real *adventure*. | Наша поездка в горы была настоящим приключением.
- advertisement | n | ədˈvɜːtɪsmənt | ˌædvərˈtaɪzmənt | реклама, объявление | a notice or video that tells people about a product | I saw an *advertisement* for a new phone. | Я видел рекламу нового телефона. | сокр. ad, advert
- architecture | n | ˈɑːkɪtektʃə | ˈɑːrkɪtektʃər | архитектура | the design and style of buildings | The city is famous for its old *architecture*. | Город славится старинной архитектурой. | architect — архитектор
- artist | n | ˈɑːtɪst | ˈɑːrtɪst | художник | a person who paints, draws or makes art | Picasso was a famous Spanish *artist*. | Пикассо был знаменитым испанским художником.
- audience | n | ˈɔːdiəns |  | зрители, публика, аудитория | the people who watch or listen to a performance | The *audience* clapped for five minutes. | Зрители аплодировали пять минут.
- beat | v | biːt |  | побеждать; бить | to win against someone | Our team *beat* them 3–1. | Наша команда обыграла их со счётом 3:1. | beat — beat — beaten
- celebrity | n | səˈlebrəti |  | знаменитость | a famous person | The bird became an internet *celebrity*. | Птица стала интернет-знаменитостью.
- classical music | n | ˈklæsɪkl ˈmjuːzɪk |  | классическая музыка | serious music like Mozart's | She listens to *classical music* when she studies. | Она слушает классическую музыку, когда занимается.
- creative | adj | kriːˈeɪtɪv |  | творческий, креативный | having new and original ideas | She's very *creative*. | Она очень творческий человек.
- fiction | n | ˈfɪkʃn |  | художественная литература, вымысел | stories that are not true | I prefer reading *fiction* to history books. | Я больше люблю художественную литературу, чем книги по истории. | science fiction — научная фантастика
- film | v | fɪlm |  | снимать (на камеру) | to record moving pictures | They *filmed* the wedding. | Они сняли свадьбу на видео.
- gallery | n | ˈɡæləri |  | галерея | a building or room where art is shown | We spent the morning in an art *gallery*. | Мы провели утро в художественной галерее.
- journalist | n | ˈdʒɜːnəlɪst | ˈdʒɜːrnəlɪst | журналист | a person who writes for newspapers or news websites | The *journalist* asked the minister a difficult question. | Журналист задал министру трудный вопрос.
- novel | n | ˈnɒvl | ˈnɑːvl | роман | a long written story | She is writing her first *novel*. | Она пишет свой первый роман.
- poem | n | ˈpəʊɪm | ˈpoʊəm | стихотворение | a piece of writing with short lines that often rhyme | He wrote a *poem* for her birthday. | Он написал стихотворение ей на день рождения.
- scene | n | siːn |  | сцена (в фильме, книге) | a part of a film, play or book | The last *scene* of the film made me cry. | Последняя сцена фильма заставила меня плакать.
- stage | n | steɪdʒ |  | сцена; этап | the raised area in a theatre where people perform | The singer walked onto the *stage*. | Певица вышла на сцену.
- superstar | n | ˈsuːpəstɑː | ˌsuːpərˈstɑːr | суперзвезда | a very famous singer, actor or athlete | He became a *superstar* overnight. | Он стал суперзвездой за одну ночь.
