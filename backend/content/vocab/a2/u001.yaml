title: People and relationships
title_ru: Люди и отношения
topic: people
words:
- background | n | ˈbækɡraʊnd |  | происхождение, опыт; фон | a person's family, education and experience; the area behind the main thing | She comes from a medical *background*. | Она из семьи медиков.
- birth | n | bɜːθ | bɜːrθ | рождение | the time when a baby is born | She gave *birth* to a girl. | Она родила девочку. | date of birth — дата рождения
- character | n | ˈkærəktə | ˈkærəktər | характер; персонаж | the qualities that make a person who they are; a person in a story | She showed great strength of *character*. | Она проявила большую силу характера.
- couple | n | ˈkʌpl |  | пара; несколько | two or a few things; two people in a relationship | I'll be back in a *couple* of minutes. | Вернусь через пару минут.
- first name | n | fɜːst neɪm | fɜːrst neɪm | имя | the name given to you when you are born | What's your *first name*? | Как тебя зовут (имя)?
- guest | n | ɡest |  | гость | a person you invite to your home or event | We're expecting twenty *guests* for dinner. | Мы ждём на ужин двадцать гостей.
- guy | n | ɡaɪ |  | парень, мужик (разг.) | a man | He's a nice *guy*. | Он хороший парень. | you guys — ребята (ко всем)
- habit | n | ˈhæbɪt |  | привычка | something that you do often and regularly | Reading before bed is a good *habit*. | Читать перед сном — хорошая привычка.
- introduction | n | ˌɪntrəˈdʌkʃən |  | знакомство; введение | presenting people to each other; the first part of a book | Read the *introduction* first. | Сначала прочитай введение.
- kid | v | kɪd |  | шутить, подшучивать | to joke; to say something that isn't true for fun | I'm only *kidding* — don't be angry! | Я просто шучу — не сердись! | сущ. kid — ребёнок; No kidding! — Серьёзно?!
- lady | n | ˈleɪdi |  | дама, леди | a polite word for a woman | Ask that *lady* over there. | Спроси вон ту даму.
- lifestyle | n | ˈlaɪfstaɪl |  | образ жизни | the way a person lives | She has a healthy *lifestyle*. | Она ведёт здоровый образ жизни.
- lover | n | ˈlʌvə | ˈlʌvər | любитель; возлюбленный | someone who likes something very much; a partner | He's a music *lover*. | Он любитель музыки.
- 'Ms | n | ˌeˈmes | mɪz | госпожа (без указания семейного положения) | a title for a woman, married or not | *Ms* Jones will see you now. | Госпожа Джонс сейчас вас примет. | брит. пишут без точки: Ms'
- pal | n | pæl |  | приятель (разг.) | a friend | He's my old *pal*. | Он мой старый приятель.
- personality | n | ˌpɜːsəˈnæləti | ˌpɜːrsəˈnæləti | характер, личность | the kind of person you are | She has a warm, friendly *personality*. | У неё тёплый, дружелюбный характер.
- relationship | n | rɪˈleɪʃnʃɪp |  | отношения, связь | the way two people or groups behave towards each other | The two leaders had a difficult *relationship*. | У двух лидеров были непростые отношения.
- secretary | n | ˈsekrətri | ˈsekrəteri | секретарь | a person who types letters and organizes things in an office | The *secretary* will book your appointment. | Секретарь запишет вас на приём.
- speaker | n | ˈspiːkə | ˈspiːkər | говорящий, докладчик; колонка | a person who speaks; a device for sound | The *speaker* talked about climate. | Докладчик говорил о климате. | native speaker — носитель языка
- sweetheart | n | ˈswiːthɑːt | ˈswiːthɑːrt | милый, дорогая; возлюбленный | a word for someone you love | Good night, *sweetheart*. | Спокойной ночи, милая.
- tour guide | n | tɔː ɡaɪd | tʊr ɡaɪd | экскурсовод, гид | a person who shows tourists around | Our *tour guide* spoke three languages. | Наш гид говорил на трёх языках.
- wedding | n | ˈwedɪŋ |  | свадьба | a ceremony when two people get married | Their *wedding* is in June. | Их свадьба в июне.
- winner | n | ˈwɪnə | ˈwɪnər | победитель | a person who wins | The *winner* gets a prize. | Победитель получает приз.
