title: Actions and movement
title_ru: Действия и движение
topic: actions
words:
- 'catch | v | kætʃ |  | ловить, поймать; успеть (на транспорт) | to take and hold something that is moving | The dog jumped and *caught* the ball. | Собака подпрыгнула и поймала мяч. | неправильный глагол: catch — caught — caught'
- check | n | tʃek |  | проверка; чек (амер.) | an examination to see if something is correct; a bill in a restaurant | Can we have the *check*, please? | Можно счёт, пожалуйста? | брит. — the bill
- control | v | kənˈtrəʊl | kənˈtroʊl | управлять, контролировать | to make someone or something do what you want | She couldn't *control* her horse. | Она не могла справиться со своей лошадью.
- count | v | kaʊnt |  | считать | to say numbers in order; to find the total | Can you *count* to ten in English? | Ты умеешь считать до десяти по-английски?
- drop | v | drɒp | drɑːp | ронять; падать | to let something fall | Be careful — don't *drop* the glasses! | Осторожно, не урони стаканы!
- fix | v | fɪks |  | чинить; назначать | to repair something | Can you *fix* my bike? | Можешь починить мой велосипед?
- float | v | fləʊt | floʊt | плавать (на поверхности), парить | to stay on top of water or move slowly in the air | Leaves were *floating* on the lake. | По озеру плавали листья.
- 'heat | n | hiːt |  | жара; тепло | the quality of being hot | I can''t stand this *heat*. | Не выношу эту жару. | гл.: heat — нагревать'
- increase | v | ɪnˈkriːs |  | увеличивать(ся), расти | to become or make something bigger | The price of bread *increased* again. | Цена на хлеб снова выросла. | сущ. increase [ˈɪnkriːs] — рост
- protect | v | prəˈtekt |  | защищать | to keep someone or something safe | Sunglasses *protect* your eyes from the sun. | Солнечные очки защищают глаза от солнца.
- raise | v | reɪz |  | поднимать; повышать | to lift; to increase | *Raise* your hand if you know the answer. | Поднимите руку, если знаете ответ.
- reach | v | riːtʃ |  | достигать, добираться; дотягиваться | to arrive at a place; to stretch your arm to touch | We *reached* the hotel at midnight. | Мы добрались до гостиницы в полночь.
- reduce | v | rɪˈdjuːs | rɪˈduːs | сокращать, уменьшать | to make something smaller or less | The new law *reduced* taxes. | Новый закон снизил налоги.
- repair | v | rɪˈpeə | rɪˈper | ремонтировать, чинить | to fix something that is broken | How much will it cost to *repair* the roof? | Сколько будет стоить починить крышу?
- shake | v | ʃeɪk |  | трясти, встряхивать | to move something quickly up and down or from side to side | *Shake* the bottle before you open it. | Встряхните бутылку перед тем, как открыть. | shake — shook — shaken; shake hands — пожать руки
- sort | n | sɔːt | sɔːrt | вид, сорт | a type or kind | What *sort* of music do you like? | Какую музыку ты любишь? | гл. sort — сортировать
- stand | n | stænd |  | стенд, ларёк; трибуна | a small shop or table where things are sold | He bought fruit at a *stand* in the market. | Он купил фрукты в палатке на рынке.
- text | v | tekst |  | писать сообщение (смс) | to send a text message | I'll *text* you when I arrive. | Я напишу тебе, когда приеду.
- throw | v | θrəʊ | θroʊ | бросать, кидать | to send something through the air with your hand | *Throw* me the ball! | Кинь мне мяч! | throw – threw – thrown
- try | n | traɪ |  | попытка | an attempt | Have a *try*! | Попробуй!
- use | n | juːs |  | использование; польза | the act of using something | The *use* of phones is not allowed. | Пользоваться телефонами запрещено. | It's no use — бесполезно
- water | v | ˈwɔːtə | ˈwɔːtər | поливать | to give water to plants | Don't forget to *water* the flowers. | Не забудь полить цветы.
