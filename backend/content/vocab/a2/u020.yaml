title: Phrasal verbs
title_ru: Фразовые глаголы
topic: phrasal
words:
- carry on | phr |  |  | продолжать | to continue | *Carry on* — you're doing well! | Продолжай — у тебя хорошо получается!
- carry something out | phr |  |  | выполнять, проводить | to do a task or an experiment | Scientists *carried out* tests. | Учёные провели испытания.
- check in | phr |  |  | регистрироваться (в отеле, аэропорту) | to tell the desk that you have arrived | We *checked in* at the hotel at two. | Мы заселились в отель в два.
- come back | phr |  |  | возвращаться | to return | When are you *coming back*? | Когда ты вернёшься?
- deal with somebody | phr |  |  | иметь дело с кем-либо | to talk to or work with someone | She *deals with* difficult customers. | Ей приходится иметь дело с трудными клиентами.
- deal with something | phr |  |  | справляться с; заниматься (вопросом) | to solve a problem | I'll *deal with* it tomorrow. | Я займусь этим завтра.
- fill something in | phr |  |  | заполнять (бланк) | to write information in the spaces of a form | Please *fill in* this form. | Пожалуйста, заполните этот бланк.
- get back | phr |  |  | возвращаться | to return | We *got back* home at midnight. | Мы вернулись домой в полночь.
- give something up | phr |  |  | бросать (привычку), отказываться | to stop doing something | He *gave up* smoking. | Он бросил курить.
- give up | phr |  |  | сдаваться | to stop trying | Don't *give up*! | Не сдавайся!
- look after somebody/something/yourself | phr |  |  | присматривать, заботиться | to take care of | Can you *look after* my dog? | Можешь присмотреть за моей собакой?
- look something up | phr |  |  | искать (в словаре, интернете) | to find information in a book or online | *Look up* the word in the dictionary. | Найди это слово в словаре.
- pick somebody/something up | phr |  |  | поднимать; забирать (кого-то) | to lift; to collect someone | I'll *pick you up* at six. | Я заеду за тобой в шесть.
- put something on | phr |  |  | надевать | to dress yourself in something | *Put on* your coat. | Надень пальто.
- take off | phr |  |  | взлетать | to leave the ground (of a plane) | The plane *took off* on time. | Самолёт взлетел вовремя.
- take something off | phr |  |  | снимать (одежду) | to remove clothes | *Take off* your shoes, please. | Снимите обувь, пожалуйста.
- turn something off | phr |  |  | выключать | to stop a machine or light | *Turn off* the TV. | Выключи телевизор.
- turn something on | phr |  |  | включать | to start a machine or light | Can you *turn on* the light? | Можешь включить свет?
- work out | phr |  |  | тренироваться; получаться | to exercise; to be successful | I *work out* at the gym three times a week. | Я тренируюсь в спортзале три раза в неделю. | work something out — понять, решить
