title: Nature and weather
title_ru: Природа и погода
topic: nature
words:
- breeze | n | briːz |  | ветерок, бриз | a light, gentle wind | A cool *breeze* came from the sea. | С моря дул прохладный ветерок.
- climate | n | ˈklaɪmət |  | климат | the usual weather of a place | The *climate* on Venus is deadly. | Климат на Венере смертелен.
- coast | n | kəʊst | koʊst | побережье | the land next to the sea | We drove along the *coast* for hours. | Мы несколько часов ехали вдоль побережья.
- continent | n | ˈkɒntɪnənt | ˈkɑːntɪnənt | континент, материк | one of the seven large land masses on Earth | Antarctica is the coldest *continent*. | Антарктида — самый холодный континент.
- field | n | fiːld |  | область, сфера | a subject or area of work | She's an expert in the *field* of robotics. | Она эксперт в области робототехники.
- nature | n | ˈneɪtʃə | ˈneɪtʃər | природа | all living things, plants, animals, the sea and land | We should protect *nature*. | Мы должны беречь природу.
- ocean | n | ˈəʊʃn | ˈoʊʃn | океан | a very large area of sea | The Pacific is the largest *ocean*. | Тихий — самый большой океан.
- rock | n | rɒk | rɑːk | скала, камень | a large piece of stone | We sat on a *rock* and watched the sea. | Мы сидели на камне и смотрели на море.
- storm | n | stɔːm | stɔːrm | буря, шторм, гроза | very bad weather with strong wind and rain | The *storm* broke many trees. | Буря повалила много деревьев.
- valley | n | ˈvæli |  | долина | low land between hills or mountains | A river runs through the *valley*. | По долине течёт река.
