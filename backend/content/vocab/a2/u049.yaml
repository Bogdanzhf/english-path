title: Feelings and states
title_ru: Чувства и состояния
topic: feelings
words:
- amused | adj | əˈmjuːsd | əmˈjuːzd | изумлённый, развеселившийся | finding something funny | She looked *amused*. | У неё был весёлый вид.
- asleep | adj | əˈsliːp |  | спящий | sleeping | The baby is *asleep*. | Малыш спит. | fall asleep — заснуть
- 'care | v | keə | ker | заботиться; беспокоиться | to think something is important | I don''t *care* what they think. | Мне всё равно, что они думают. | сущ.: care — забота'
- divorced | adj | dɪˈvɔːst | dɪˈvɔːrst | разведённый | no longer married | My parents are *divorced*. | Мои родители в разводе.
- glad | adj | ɡlæd |  | довольный, рад | happy and pleased | I'm *glad* you came. | Я рад, что ты пришёл.
- 'hope | v | həʊp | hoʊp | надеяться | to want something to happen | I *hope* you feel better soon. | Надеюсь, тебе скоро станет лучше. | сущ.: hope — надежда'
- 'hug | v | hʌɡ |  | обнимать | to put your arms around someone | She *hugged* her mother. | Она обняла маму. | сущ.: hug — объятие'
- 'kiss | n | kɪs |  | поцелуй | touching someone with your lips | He gave her a *kiss*. | Он поцеловал её. | гл.: kiss — целовать'
- lucky | adj | ˈlʌki |  | удачливый, везучий | having good luck | You're *lucky* to have such good friends. | Тебе повезло иметь таких хороших друзей.
- playful | adj | ˈpleɪfl |  | игривый | full of fun | The puppy is very *playful*. | Щенок очень игривый.
- pleased | adj | pliːzd |  | довольный | happy | I'm *pleased* with the results. | Я доволен результатами.
- scared | adj | skeəd | skerd | испуганный (be scared — бояться) | afraid | I'm *scared* of the dark. | Я боюсь темноты.
- scary | adj | ˈskeəri | ˈskeri | страшный, пугающий | making you afraid | It was a *scary* film. | Это был страшный фильм.
- shy | adj | ʃaɪ |  | застенчивый, робкий | nervous with other people | He's too *shy* to dance. | Он слишком стеснительный, чтобы танцевать.
- sleepless | adj | ˈsliːpləs |  | бессонный | without sleep | I had a *sleepless* night before the exam. | Перед экзаменом у меня была бессонная ночь.
- sleepy | adj | ˈsliːpi |  | сонный | tired and ready to sleep | I feel *sleepy* after lunch. | После обеда меня клонит в сон.
- uneasy | adj | ʌˈniːzi | əˈniːzi | беспокойный, неловкий | worried; not comfortable | I felt *uneasy* in the dark street. | На тёмной улице мне было не по себе.
- unhappy | adj | ʌnˈhæpi | ənˈhæpi | несчастный, недовольный | sad; not satisfied | She's *unhappy* with her job. | Она недовольна своей работой.
- 'wish | v | wɪʃ |  | желать | to want something that is not possible now | I *wish* I could fly. | Вот бы я умел летать. | сущ.: wish — желание; best wishes'
- worry | v | ˈwʌri | ˈwɜːri | беспокоиться | to think about problems | Don't *worry*, everything will be fine. | Не волнуйся, всё будет хорошо.
