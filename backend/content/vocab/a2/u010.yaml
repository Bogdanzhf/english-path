reading:
  title: Music Without Sight
  title_ru: Музыка без зрения
  text: |
    When Daniel arrived at university, it was apparent to everyone that he was different. He was blind. He had lost his vision as a child after a severe illness. But Daniel had an obvious talent: music. He studied physics, but in his free time he composed beautiful songs on the piano.

    At first, life in the dormitory was hard. Some students ignored him because they didn't know how to talk to him. Daniel spent many evenings alone in his room, chatting with his family online.

    Everything changed when he met Lisa, the secretary of the university music club. She heard him playing the piano one evening and couldn't believe her ears. "You must join the club," she said. Daniel was nervous, but he agreed.

    The club was preparing a concert. Daniel committed himself completely. He wrote a new piece of music and practised every night until he was exhausted. Lisa reminded him to eat and sleep. She even helped him calculate the times for each part of the concert.

    The concert took place in the old greenhouse in the university garden. Everyone wore the club uniform: white shirts and black trousers. When Daniel played the final portion of his piece, the room was completely silent. Then everybody stood up and applauded. Today, Daniel is writing his thesis in physics — and he has already recorded his first album.
  ru: |
    Когда Дэниел поступил в университет, всем сразу стало ясно, что он не такой, как все. Он был слепым. Он потерял зрение в детстве после тяжёлой болезни. Но у Дэниела был явный талант — музыка. Он изучал физику, а в свободное время сочинял красивые песни на пианино.

    Сначала жить в общежитии было тяжело. Некоторые студенты не обращали на него внимания, потому что не знали, как с ним говорить. Много вечеров Дэниел проводил один в комнате, болтая с семьёй по интернету.

    Всё изменилось, когда он познакомился с Лизой, секретарём университетского музыкального клуба. Однажды вечером она услышала, как он играет на пианино, и не поверила своим ушам. «Ты обязан вступить в клуб», — сказала она. Дэниел волновался, но согласился.

    Клуб готовил концерт. Дэниел отдался этому полностью. Он написал новое произведение и репетировал каждый вечер до изнеможения. Лиза напоминала ему есть и спать. Она даже помогла рассчитать время для каждой части концерта.

    Концерт проходил в старой оранжерее в университетском саду. Все были в форме клуба: белые рубашки и чёрные брюки. Когда Дэниел сыграл заключительную часть своего произведения, в зале стояла полная тишина. А потом все встали и зааплодировали. Сегодня Дэниел пишет диплом по физике — и уже записал свой первый альбом.
  questions:
  - q: Why was Daniel blind?
    options:
    - He was born blind
    - After a severe illness as a child
    - After an accident at university
    - We don't know
    answer: 1
  - q: What did Daniel study?
    options:
    - Music
    - Physics
    - Biology
    - Art
    answer: 1
  - q: Where did the concert take place?
    options:
    - In the dormitory
    - In an old greenhouse
    - In a big theatre
    - Online
    answer: 1
  - tf: Lisa helped Daniel prepare for the concert.
    answer: true
  - tf: The audience didn't like Daniel's music.
    answer: false
