title: Clothes and appearance
title_ru: Одежда и внешность
topic: clothes
words:
- boot | n | buːt |  | ботинок, сапог; багажник (брит.) | a strong shoe that covers the foot and ankle | You need warm *boots* for winter. | Зимой нужны тёплые ботинки.
- bra | n | brɑː |  | бюстгальтер | a piece of women's underwear | She bought a new *bra*. | Она купила новый бюстгальтер.
- button | n | ˈbʌtn |  | пуговица; кнопка | a small round thing on clothes; a part you press on a machine | Press the green *button*. | Нажмите зелёную кнопку.
- cap | n | kæp |  | кепка, шапка; крышка | a soft hat with a hard part at the front | He always wears a baseball *cap*. | Он всегда носит бейсболку.
- earring | n | ˈiərɪŋ | ˈiːrɪŋ | серьга | a piece of jewellery for the ear | She lost one of her *earrings*. | Она потеряла одну серёжку.
- handbag | n | ˈhændbæɡ |  | дамская сумочка | a small bag for a woman | Her keys are in her *handbag*. | Её ключи в сумочке.
- jewellery | n | ˈdʒuːələri | dʒˈuːələri | драгоценности, украшения | rings, necklaces, etc. | She keeps her *jewellery* in a box. | Она хранит украшения в шкатулке. | американское — jewelry
- make-up | n | ˈmeɪkʌp |  | косметика, макияж | colours you put on your face | She doesn't wear much *make-up*. | Она почти не пользуется косметикой.
- pants | n | pɑːnts | pænts | брюки (амер.); трусы (брит.) | trousers (US); underwear (UK) | He wore black *pants* and a shirt. | Он был в чёрных брюках и рубашке.
- perfume | n | pɜːfˈjum | pərfˈjuːm | духи | a liquid with a nice smell that you put on your skin | What *perfume* are you wearing? | Какие у тебя духи?
- raincoat | n | ˈreɪnkəʊt | ˈreɪnkoʊt | плащ, дождевик | a coat that keeps you dry in the rain | Take your *raincoat*. | Возьми плащ.
- scarf | n | skɑːf | skɑːrf | шарф | a long piece of cloth worn around the neck | It's cold — wear a *scarf*. | Холодно — надень шарф. | мн. ч. scarves
- size | n | saɪz |  | размер | how big something is | What *size* are your shoes? | Какой у тебя размер обуви?
- sock | n | sɒk | sɑːk | носок | a piece of clothing for your foot | I can't find my other *sock*. | Не могу найти второй носок.
- 'suit | n | suːt |  | костюм | a jacket and trousers or a skirt made of the same cloth | He wore a dark *suit* to the interview. | На собеседование он надел тёмный костюм. | гл.: suit — подходить, идти'
- sunglasses | n | ˈsʌŋɡlɑːsɪz | ˈsʌnɡlæsɪz | солнцезащитные очки | dark glasses that protect your eyes from the sun | Don't forget your *sunglasses*. | Не забудь солнечные очки.
- swimming costume | n | ˈswɪmɪŋ ˈkɒstjuːm | ˈswɪmɪŋ ˈkɑːstuːm | купальник (брит.) | clothes for swimming | I packed my *swimming costume*. | Я положил купальник.
- swimsuit | n | ˈswɪmsuːt |  | купальник | a piece of clothing for swimming | She bought a new *swimsuit* for the holiday. | Она купила новый купальник для отпуска.
- tights | n | taɪts |  | колготки | thin clothing that covers the legs and lower body | She wore black *tights*. | Она была в чёрных колготках.
- uniform | n | ˈjuːnɪfɔːm | ˈjuːnɪfɔːrm | форма (одежда) | special clothes worn by people at work or school | Nurses wear a blue *uniform*. | Медсёстры носят синюю форму.
- wallet | n | ˈwɒlɪt | ˈwɔːlət | бумажник, кошелёк | a small flat case for money and cards | I left my *wallet* at home. | Я оставил бумажник дома.
