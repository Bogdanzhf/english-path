title: Travel and transport
title_ru: Путешествия и транспорт
topic: travel
words:
- abroad | adv | əˈbrɔːd |  | за границей, за границу | in or to a foreign country | She wants to study *abroad*. | Она хочет учиться за границей.
- cycle | n | ˈsaɪkl |  | цикл | a series of events that happen again and again in the same order | The Moon goes through a *cycle* of phases every 29.5 days. | Луна проходит цикл фаз каждые 29,5 дня.
- distance | n | ˈdɪstəns |  | расстояние | how far it is between two places | What's the *distance* from here to the station? | Какое расстояние отсюда до вокзала? | in the distance — вдали
- passenger | n | ˈpæsɪndʒə | ˈpæsɪndʒər | пассажир | a person who travels in a car, bus, train or plane | The bus can carry fifty *passengers*. | Автобус может перевозить пятьдесят пассажиров.
- row | n | rəʊ | roʊ | ряд | a line of people or things | We sat in the front *row*. | Мы сидели в первом ряду. | in a row — подряд
- service | n | ˈsɜːvɪs | ˈsɜːrvɪs | обслуживание; служба | work that helps people; the way staff treat customers | The *service* in this restaurant is excellent. | Обслуживание в этом ресторане отличное.
- tram | n | træm |  | трамвай | an electric vehicle that runs on rails in the street | She takes the *tram* to work. | Она ездит на работу на трамвае.
- van | n | væn |  | фургон | a vehicle for carrying goods, smaller than a lorry | The band toured Europe in an old *van*. | Группа гастролировала по Европе в старом фургоне.
- wheel | n | wiːl |  | колесо | a round object that turns to move a vehicle | My bike has a flat *wheel*. | У моего велосипеда спущено колесо. | steering wheel — руль
