title: Travel and transport
title_ru: Путешествия и транспорт
topic: travel
words:
- abroad | adv | əˈbrɔːd |  | за границей, за границу | in or to a foreign country | She wants to study *abroad*. | Она хочет учиться за границей.
- bus station | n | bʌs ˈsteɪʃən |  | автовокзал | a place where buses start and end their journeys | The *bus station* is near the market. | Автовокзал рядом с рынком.
- bus stop | n | bʌs stɒp | bʌs stɑːp | автобусная остановка | a place where a bus stops | Wait for me at the *bus stop*. | Подожди меня на остановке.
- cycle | n | ˈsaɪkl |  | цикл | a series of events that happen again and again in the same order | The Moon goes through a *cycle* of phases every 29.5 days. | Луна проходит цикл фаз каждые 29,5 дня.
- distance | n | ˈdɪstəns |  | расстояние | how far it is between two places | What's the *distance* from here to the station? | Какое расстояние отсюда до вокзала? | in the distance — вдали
- hike | n | haɪk |  | поход, долгая прогулка | a long walk in the countryside | We went on a *hike* in the mountains. | Мы ходили в поход в горы.
- parking | n | ˈpɑːkɪŋ | ˈpɑːrkɪŋ | парковка, стоянка | leaving a car somewhere | *Parking* is free on Sundays. | По воскресеньям парковка бесплатная.
- passenger | n | ˈpæsɪndʒə | ˈpæsɪndʒər | пассажир | a person who travels in a car, bus, train or plane | The bus can carry fifty *passengers*. | Автобус может перевозить пятьдесят пассажиров.
- passport | n | ˈpɑːspɔːt | ˈpæspɔːrt | паспорт (заграничный) | an official document for travelling abroad | Don't forget your *passport*. | Не забудь паспорт.
- railway | n | ˈreɪlweɪ |  | железная дорога | the system of trains and tracks | The *railway* station is in the centre. | Железнодорожный вокзал в центре. | амер. railroad
- ride | n | raɪd |  | поездка, езда | a journey in a car, on a bike or a horse | Can I give you a *ride* home? | Тебя подвезти домой?
- roundabout | n | ˈraʊndəbaʊt |  | круговая развязка (кольцо) | a circle where several roads meet | Turn left at the *roundabout*. | На кольце поверните налево.
- row | n | rəʊ | roʊ | ряд | a line of people or things | We sat in the front *row*. | Мы сидели в первом ряду. | in a row — подряд
- service | n | ˈsɜːvɪs | ˈsɜːrvɪs | обслуживание; служба | work that helps people; the way staff treat customers | The *service* in this restaurant is excellent. | Обслуживание в этом ресторане отличное.
- sightseeing | n | ˈsaɪtsiːɪŋ | ˈsaɪtˈsiːɪŋ | осмотр достопримечательностей | visiting interesting places as a tourist | We went *sightseeing* in Rome. | Мы осматривали достопримечательности Рима.
- stay | n | steɪ |  | пребывание | a period of time spent somewhere | Enjoy your *stay*! | Приятного пребывания!
- tram | n | træm |  | трамвай | an electric vehicle that runs on rails in the street | She takes the *tram* to work. | Она ездит на работу на трамвае.
- traveler | n | ˈtrævəlɜː | ˈtrævələr | путешественник (амер.) | a person who travels | She's an experienced *traveler*. | Она опытная путешественница. | брит. traveller
- van | n | væn |  | фургон | a vehicle for carrying goods, smaller than a lorry | The band toured Europe in an old *van*. | Группа гастролировала по Европе в старом фургоне.
- wheel | n | wiːl |  | колесо | a round object that turns to move a vehicle | My bike has a flat *wheel*. | У моего велосипеда спущено колесо. | steering wheel — руль
