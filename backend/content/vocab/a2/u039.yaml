title: 'Describing: good or bad'
title_ru: 'Описание: оценка — хорошо или плохо'
topic: describing
words:
- amazing | adj | əˈmeɪzɪŋ |  | удивительный, потрясающий | very surprising; very good | The view from the top is *amazing*. | Вид сверху потрясающий.
- boiled | adj | bɔɪld |  | варёный | cooked in boiling water | I'd like a *boiled* egg. | Мне варёное яйцо.
- colorful | adj | ˈkəlɜːfl | ˈkʌlərfl | красочный, яркий (амер.) | with many bright colours | She wore a *colorful* dress. | На ней было яркое платье. | брит. colourful
- correct | v | kəˈrekt |  | исправлять | to make something right | Please *correct* my mistakes. | Пожалуйста, исправьте мои ошибки.
- excellent | adj | ˈeksələnt |  | отличный, превосходный | very, very good | Your English is *excellent*! | У тебя отличный английский!
- fresh | adj | freʃ |  | свежий | new; not old; recently made | I love *fresh* bread. | Я люблю свежий хлеб.
- fried | adj | fraɪd |  | жареный | cooked in hot oil | We had *fried* fish and chips. | У нас была жареная рыба с картошкой.
- grilled | adj | ɡrɪld |  | приготовленный на гриле | cooked on a grill | I'll have the *grilled* chicken. | Мне курицу на гриле.
- loud | adj | laʊd |  | громкий | making a lot of sound | The music at the party was too *loud*. | Музыка на вечеринке была слишком громкой.
- lovely | adj | ˈlʌvli |  | прекрасный, чудесный | beautiful; very nice | What a *lovely* day! | Какой чудесный день!
- noisy | adj | ˈnɔɪzi |  | шумный | making a lot of noise | The street is very *noisy* at night. | Ночью улица очень шумная.
- normal | adj | ˈnɔːml | ˈnɔːrml | нормальный, обычный | usual; ordinary | It's *normal* to feel nervous before an exam. | Нервничать перед экзаменом — нормально.
- overweight | adj | ˌəʊvəˈweɪt | ˌoʊvərˈweɪt | с лишним весом | heavier than is healthy | The vet said our cat is *overweight*. | Ветеринар сказал, что у нашей кошки лишний вес.
- positive | adj | ˈpɒzətɪv | ˈpɑːzətɪv | положительный, позитивный | good, or thinking about the good side of things | She always has a *positive* attitude. | У неё всегда позитивный настрой.
- 'safe | adj | seɪf |  | безопасный; в безопасности | not dangerous | Is it *safe* to swim here? | Здесь безопасно купаться? | сущ.: safe — сейф'
- simple | adj | ˈsɪmpl |  | простой | easy; not complicated | The recipe is very *simple*. | Рецепт очень простой.
- successful | adj | səkˈsesfl |  | успешный | achieving what you wanted | The talks were *successful*. | Переговоры прошли успешно.
- super | adj | ˈsuːpə | ˈsuːpər | отличный, супер | very good | We had a *super* time at the party. | Мы отлично провели время на вечеринке.
- 'sweet | adj | swiːt |  | сладкий; милый | tasting of sugar; nice | This cake is too *sweet*. | Этот торт слишком сладкий. | сущ. брит.: sweets — конфеты'
