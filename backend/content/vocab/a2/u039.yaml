title: 'Describing: good or bad'
title_ru: 'Описание: оценка — хорошо или плохо'
topic: describing
words:
- loud | adj | laʊd |  | громкий | making a lot of sound | The music at the party was too *loud*. | Музыка на вечеринке была слишком громкой.
- normal | adj | ˈnɔːml | ˈnɔːrml | нормальный, обычный | usual; ordinary | It's *normal* to feel nervous before an exam. | Нервничать перед экзаменом — нормально.
- overweight | adj | ˌəʊvəˈweɪt | ˌoʊvərˈweɪt | с лишним весом | heavier than is healthy | The vet said our cat is *overweight*. | Ветеринар сказал, что у нашей кошки лишний вес.
- positive | adj | ˈpɒzətɪv | ˈpɑːzətɪv | положительный, позитивный | good, or thinking about the good side of things | She always has a *positive* attitude. | У неё всегда позитивный настрой.
- super | adj | ˈsuːpə | ˈsuːpər | отличный, супер | very good | We had a *super* time at the party. | Мы отлично провели время на вечеринке.
