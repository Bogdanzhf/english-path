title: Everyday phrases
title_ru: Разговорные фразы
topic: phrases
words:
- a bit | phr |  |  | немного, чуть-чуть | a little | I'm *a bit* tired. | Я немного устал.
- a couple of something | phr |  |  | пара, несколько | two or a few | I'll be back in *a couple of* minutes. | Вернусь через пару минут.
- a long time ago | phr |  |  | давным-давно | many years before now | It happened *a long time ago*. | Это случилось давным-давно.
- a long way | phr |  |  | далеко | far away | The station is *a long way* from here. | Вокзал далеко отсюда.
- a number of something | phr |  |  | ряд, несколько | several | *A number of* students were late. | Несколько студентов опоздали. | the number of — число, количество
- able to do something | phr |  |  | способный (что-либо сделать) | having the skill or power to do something | Will you be *able to* come? | Ты сможешь прийти?
- add to something | phr |  |  | добавлять к; усиливать | to increase or improve something | The music *added to* the fun. | Музыка добавила веселья.
- again and again | phr |  |  | снова и снова | many times | I watched the video *again and again*. | Я смотрел это видео снова и снова.
- ah | interj | ɑː |  | а!, ах! | used to show surprise or understanding | *Ah*, now I understand! | А, теперь понятно!
- all about... | phr |  |  | всё о… | everything about | Tell me *all about* your trip! | Расскажи мне всё о поездке!
- all kinds of... | phr |  |  | всевозможные, всякие | many different types of | The shop sells *all kinds of* cheese. | В магазине продаются всевозможные сыры.
- all over... | phr |  |  | по всему… | in every part of | There were toys *all over* the floor. | По всему полу валялись игрушки.
- all sorts of... | phr |  |  | всякие, разные | many different kinds of | We talked about *all sorts of* things. | Мы говорили обо всём на свете.
- all the time | phr |  |  | всё время, постоянно | very often; continuously | He's on his phone *all the time*. | Он всё время в телефоне.
- apply for something | phr |  |  | подавать заявление (на что-либо) | to ask formally for a job, a place, etc. | I *applied for* a job at the bank. | Я подал заявление на работу в банке.
- dear | interj | ˈdiə | dɪr | боже мой (oh dear) | used to show surprise or worry | Oh *dear*, I've lost my ticket. | Боже мой, я потерял билет.
- make sense | phr |  |  | иметь смысл; быть понятным | to be easy to understand; to be sensible | Does this sentence *make sense*? | Это предложение понятное?
- take place | phr |  |  | происходить, проходить | to happen | The concert will *take place* in the park. | Концерт пройдёт в парке.
- wow | interj | waʊ |  | вау!, ух ты! | used to show surprise or admiration | *Wow*! What a view! | Ух ты! Какой вид!
