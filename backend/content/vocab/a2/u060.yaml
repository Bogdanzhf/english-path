- invention | n | ɪnˈvenʃən | ˌɪnˈvenʃən | изобретение | something new that someone has made | The phone was a great *invention*. | Телефон был великим изобретением.
- lab | n | læb |  | лаборатория | a laboratory | She works in a *lab*. | Она работает в лаборатории.
- mathematics | n | ˌmæθɪˈmætɪks | ˌmæθəˈmætɪks | математика | the study of numbers and shapes | He teaches *mathematics*. | Он преподаёт математику.
- maths | n | mæθs |  | математика (брит.) | mathematics | I'm good at *maths*. | У меня хорошо с математикой. | амер. math
- metal | n | ˈmetl |  | металл | a hard material such as iron, gold or steel | The chair is made of *metal*. | Стул сделан из металла.
- method | n | ˈmeθəd |  | метод, способ | a way of doing something | What is the best *method* for learning words? | Какой способ лучше всего подходит для изучения слов?
