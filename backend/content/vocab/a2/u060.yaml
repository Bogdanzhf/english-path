- electricity | n | ɪlekˈtrɪsɪti | ɪˌlekˈtrɪsəti | электричество | energy used for light and machines | The *electricity* went off during the storm. | Во время грозы отключилось электричество.
- experiment | n | ɪkˈsperɪmənt |  | опыт, эксперимент | a scientific test to find out what happens | We did an *experiment* with water and salt in class. | На уроке мы провели опыт с водой и солью.
- gas | n | ɡæs |  | газ; бензин (амер.) | a substance like air; fuel for cars (US) | We cook with *gas*. | Мы готовим на газу.
