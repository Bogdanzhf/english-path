title: Science and research
title_ru: Наука и исследования
topic: science
words:
- active | adj | ˈæktɪv |  | активный | moving a lot and doing many things | My dog is very *active* — it runs all day. | Моя собака очень активная — бегает весь день.
- astronaut | n | ˈæstrənɔːt |  | астронавт, космонавт | a person who travels into space | Yuri Gagarin was the first *astronaut* in space. | Юрий Гагарин был первым человеком в космосе.
- atom | n | ˈætəm |  | атом | the smallest part of a chemical element | Everything is made of *atoms*. | Всё состоит из атомов.
