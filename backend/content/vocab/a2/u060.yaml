- oil | n | ɔɪl |  | масло (растительное); нефть | a thick liquid from plants, animals or under the ground | Fry the onions in a little *oil*. | Обжарьте лук на небольшом количестве масла.
- 'physics | n | ˈfɪzɪks |  | физика | the science of energy, force, light and sound | Einstein changed the world of *physics*. | Эйнштейн изменил мир физики. | ед. ч.: physics is'
- planet | n | ˈplænɪt |  | планета | a large round object in space that moves around a star | Mars is the fourth *planet* from the Sun. | Марс — четвёртая планета от Солнца.
- pollution | n | pəˈluːʃən |  | загрязнение | dirty air, water or land | Air *pollution* is a big problem in cities. | Загрязнение воздуха — серьёзная проблема городов.
- recycle | v | ˌriːˈsaɪkl |  | перерабатывать | to process used materials so they can be used again | Only 9% of plastic has ever been *recycled*. | Переработано лишь 9% всего пластика.
- research | n | rɪˈsɜːtʃ | ˈriːsɜːrtʃ | исследование | detailed study to discover new facts | *Research* into Venus may help us understand Earth. | Изучение Венеры может помочь нам понять Землю. | неисчисляемое
- researcher | n | rɪˈsɜːtʃə | ˈriːsərtʃər | исследователь | a person who studies something in detail | The *researchers* found new evidence. | Исследователи нашли новые доказательства.
- spaceship | n | ˈspeɪsʃɪp |  | космический корабль | a vehicle for travelling in space | No *spaceship* could survive long on Venus. | Ни один космический корабль не продержится долго на Венере.
- survey | n | ˈsɜːveɪ | ˈsɜːrveɪ | опрос; обзор | a set of questions asked to many people | A *survey* of 2,000 teenagers was carried out. | Был проведён опрос 2000 подростков.
