- earth | n | ɜːθ | ɜːrθ | Земля; земля, почва | the planet we live on; soil | The *Earth* goes around the sun. | Земля вращается вокруг Солнца.
- electric | adj | ɪˈlektrɪk |  | электрический | working by electricity | My uncle drives an *electric* car. | Мой дядя ездит на электромобиле.
