title: Objects and materials
title_ru: Предметы и материалы
topic: objects
words:
- bin | n | bɪn |  | мусорное ведро (брит.) | a container for rubbish | Put it in the *bin*. | Выбрось это в мусорное ведро. | амер. trash can
- brake | n | breɪk |  | тормоз | the part of a vehicle that makes it stop | Press the *brake*! | Жми на тормоз!
- drill | n | drɪl |  | дрель, сверло; тренировка | a tool for making holes; a repeated exercise | He used an electric *drill* to make a hole. | Он сделал отверстие электродрелью. | fire drill — учебная пожарная тревога
- engine | n | ˈendʒɪn | ˈendʒən | двигатель | the part of a car that makes it move | The car's *engine* is very loud. | Двигатель машины очень шумный.
- equipment | n | ɪˈkwɪpmənt |  | оборудование, снаряжение | the tools or machines needed for an activity | The band's *equipment* filled two trucks. | Аппаратура группы занимала два грузовика. | неисчисляемое
- fireworks | n | ˈfaɪəwɜːks | ˈfaɪərwɜːrks | фейерверк | objects that explode with colours in the sky | We watched the *fireworks* from the bridge. | Мы смотрели фейерверк с моста.
- gun | n | ɡʌn |  | пистолет, ружьё | a weapon that shoots bullets | The police officer had a *gun*. | У полицейского был пистолет.
- napkin | n | ˈnæpkɪn |  | салфетка | a piece of cloth or paper for cleaning your mouth | Can I have a *napkin*, please? | Можно салфетку?
- plastic | n | ˈplæstɪk |  | пластик | a light material made by people, used for bottles and bags | This toy is made of *plastic*. | Эта игрушка сделана из пластика.
- pocket | n | ˈpɒkɪt | ˈpɑːkɪt | карман | a small bag sewn into clothes | He put his hands in his *pockets*. | Он сунул руки в карманы.
- rubbish | n | ˈrʌbɪʃ |  | мусор; чепуха | things you throw away; nonsense | Take the *rubbish* out, please. | Вынеси мусор, пожалуйста. | амер. garbage, trash
- 'scissors | n | ˈsɪsəz | ˈsɪzərz | ножницы | a tool with two blades for cutting | Where are the *scissors*? | Где ножницы? | всегда мн. ч.: a pair of scissors'
- seat | n | siːt |  | сиденье, место | something you sit on | Is this *seat* free? | Это место свободно?
- suitcase | n | ˈsuːtkeɪs |  | чемодан | a large bag for clothes when you travel | My *suitcase* is very heavy. | Мой чемодан очень тяжёлый.
- system | n | ˈsɪstəm |  | система | a group of things that work together | The city has a great transport *system*. | В городе отличная транспортная система.
- tool | n | tuːl |  | инструмент, средство | a piece of equipment or something that helps you do a job | Education is the most powerful *tool* for change. | Образование — самый мощный инструмент перемен.
