title: Work and jobs
title_ru: Работа и профессии
topic: work
words:
- actress | n | ˈæktrəs |  | актриса | a woman who acts in films or plays | She is a famous *actress*. | Она знаменитая актриса.
- architect | n | ˈɑːkɪtekt | ˈɑːrkɪtekt | архитектор; создатель | a person who designs buildings; a person who plans something | She was the *architect* of the peace agreement. | Она была автором мирного соглашения.
- boss | n | bɒs | bɔːs | начальник | the person in charge of you at work | My *boss* let me leave early today. | Начальник отпустил меня сегодня пораньше.
- businessman | n | ˈbɪznəsmən | ˈbɪznəsmæn | бизнесмен | a man who works in business | He's a successful *businessman*. | Он успешный бизнесмен.
- career | n | kəˈrɪə | kəˈrɪr | карьера | the job or series of jobs you do in your life | She had a long *career* as a teacher. | У неё была долгая карьера учителя.
- department | n | dɪˈpɑːtmənt | dɪˈpɑːrtmənt | отдел, отделение; кафедра | a part of a company, shop or university | She works in the sales *department*. | Она работает в отделе продаж.
- detective | n | dɪˈtektɪv |  | детектив, сыщик | a person who finds out who did a crime | The *detective* found the thief. | Детектив нашёл вора.
- director | n | daɪˈrektə | daɪˈrektər | директор; режиссёр | a manager of a company; the person in charge of a film | Who is the *director* of this film? | Кто режиссёр этого фильма?
- industry | n | ˈɪndəstri |  | промышленность, отрасль | the production of goods in factories | The textile *industry* employed thousands. | В текстильной промышленности работали тысячи людей.
- leader | n | ˈliːdə | ˈliːdər | лидер, руководитель | a person who leads a group | She's the *leader* of the team. | Она руководитель команды.
- maker | n | ˈmeɪkə | ˈmeɪkər | производитель, создатель | a person or company that makes something | He's a famous film *maker*. | Он известный кинорежиссёр.
- manager | n | ˈmænɪdʒə | ˈmænədʒər | менеджер, руководитель | a person who controls a business or a team | I'd like to speak to the *manager*. | Я бы хотел поговорить с менеджером.
- musician | n | mjuːˈzɪʃən |  | музыкант | a person who plays music | My brother is a talented *musician*. | Мой брат талантливый музыкант.
- owner | n | ˈəʊnə | ˈoʊnər | владелец, хозяин | a person who owns something | The *owner* of the shop is very kind. | Хозяин магазина очень добрый.
- painter | n | ˈpeɪntə | ˈpeɪntər | художник; маляр | a person who paints pictures or walls | Picasso was a famous *painter*. | Пикассо был знаменитым художником.
- "part-time | adj | ˈp\x01ːtˈtaɪm | ˈpɑːrtˈtaɪm | неполный (о рабочем дне) | working only part of the day or week | She has a *part-time* job. | У неё работа на полставки."
- president | n | ˈprezɪdənt | ˈprezədent | президент | the leader of a country or a company | The *president* gave a speech. | Президент выступил с речью.
- professional | adj | prəˈfeʃənl |  | профессиональный | doing something as a paid job; very skilled | He wants to be a *professional* football player. | Он хочет стать профессиональным футболистом.
- project | n | ˈprɒdʒekt | ˈprɑːdʒekt | проект | a piece of planned work for school or a job | Our class is doing a *project* about the ocean. | Наш класс делает проект об океане.
- reporter | n | rɪˈpɔːtə | rɪˈpɔːrtər | репортёр, корреспондент | a person who reports news | The *reporter* asked many questions. | Репортёр задал много вопросов.
- task | n | tɑːsk | tæsk | задача, задание | a piece of work you have to do | My first *task* is to answer all the emails. | Моя первая задача — ответить на все письма.
- training | n | ˈtreɪnɪŋ |  | обучение; тренировка | teaching skills; physical exercise | The company offers free *training*. | Компания предлагает бесплатное обучение.
