title: 'How and how much: adverbs'
title_ru: 'Как и насколько: наречия'
topic: manner
words:
- actually | adv | ˈæktʃuəli |  | на самом деле | in fact; really | I thought he was Spanish, but *actually* he's from Mexico. | Я думал, он испанец, а на самом деле он из Мексики. | НЕ «актуально»
- completely | adv | kəmˈpliːtli |  | полностью, совершенно | totally; in every way | I *completely* forgot about the meeting. | Я совершенно забыл о встрече.
- etc. | adv | ɪtˈsetərə |  | и так далее | and so on (et cetera) | Bring snacks, water, a book, *etc.* | Возьми перекус, воду, книгу и т. д.
- 'instead | adv | ɪnˈsted |  | вместо (этого) | in place of someone or something else | There was no coffee, so I drank tea *instead*. | Кофе не было, поэтому я выпил чай. | instead of + сущ.: instead of coffee'
- perhaps | adv | pəˈhæps | pərˈhæps | возможно, может быть | maybe | *Perhaps* she missed the bus. | Возможно, она опоздала на автобус.
- rather | adv | ˈrɑːðə | ˈræðər | скорее, довольно | fairly; more willingly | It's *rather* cold today. | Сегодня довольно холодно. | would rather — предпочёл бы
