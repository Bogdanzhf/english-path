title: 'How and how much: adverbs'
title_ru: 'Как и насколько: наречия'
topic: manner
words:
- actually | adv | ˈæktʃuəli |  | на самом деле | in fact; really | I thought he was Spanish, but *actually* he's from Mexico. | Я думал, он испанец, а на самом деле он из Мексики. | НЕ «актуально»
- almost | adv | ˈɔːlməʊst | ˈɔːlmoʊst | почти | nearly | It's *almost* midnight. | Уже почти полночь.
- anymore | adv | ˌenɪˈmɔː | ˌeniːˈmɔːr | больше не (амер.) | any longer | She doesn't work here *anymore*. | Она здесь больше не работает. | брит. any more
- anyway | adv | ˈenɪweɪ | ˈeniːweɪ | всё равно; так или иначе; в любом случае | in spite of that; used to change the subject | It was raining, but we went out *anyway*. | Шёл дождь, но мы всё равно пошли гулять.
- as | conj | æz |  | так как; когда; как | because; while; in the way that | *As* it was late, we took a taxi. | Так как было поздно, мы взяли такси.
- certainly | adv | ˈsɜːtənli | ˈsɜːrtənli | конечно, несомненно | without doubt | It will *certainly* rain tomorrow. | Завтра наверняка будет дождь.
- clearly | adv | ˈkliəli | ˈklɪrli | ясно, чётко | in a way that is easy to see or understand | Please speak *clearly*. | Пожалуйста, говорите чётко.
- completely | adv | kəmˈpliːtli |  | полностью, совершенно | totally; in every way | I *completely* forgot about the meeting. | Я совершенно забыл о встрече.
- definitely | adv | ˈdefɪnətli | ˈdefənətli | определённо, точно | without any doubt | I'll *definitely* come to your party. | Я обязательно приду на твою вечеринку.
- easily | adv | ˈiːzɪli | ˈiːzəli | легко | without difficulty | She *easily* passed the test. | Она легко сдала тест.
- either | adv | ˈaɪðə | ˈaɪðər | тоже (в отрицании); либо | also (in negatives) | I don't like it *either*. | Мне это тоже не нравится. | either… or — или… или
- especially | adv | ɪˈspeʃəli | əˈspeʃəli | особенно | more than usual | I love fruit, *especially* apples. | Я люблю фрукты, особенно яблоки.
- etc. | adv | ɪtˈsetərə |  | и так далее | and so on (et cetera) | Bring snacks, water, a book, *etc.* | Возьми перекус, воду, книгу и т. д.
- exactly | adv | ɪɡˈzæktli |  | точно, именно | completely correct | That's *exactly* what I mean. | Именно это я и имею в виду.
- extremely | adv | ɪkˈstriːmli |  | чрезвычайно, крайне | very, very | It was *extremely* cold that night. | В ту ночь было ужасно холодно.
- 'instead | adv | ɪnˈsted |  | вместо (этого) | in place of someone or something else | There was no coffee, so I drank tea *instead*. | Кофе не было, поэтому я выпил чай. | instead of + сущ.: instead of coffee'
- least | adv | liːst |  | меньше всего; наименее | less than all others | It's the *least* expensive hotel. | Это самая недорогая гостиница. | at least — по крайней мере
- less | adv | les |  | меньше | not so much | I eat *less* meat now. | Теперь я ем меньше мяса.
- mostly | adv | ˈməʊstli | ˈmoʊsli | в основном | mainly | The students are *mostly* from Asia. | Студенты в основном из Азии.
- nearly | adv | ˈniəli | ˈnɪrli | почти | almost | I *nearly* missed the train. | Я чуть не опоздал на поезд.
- perhaps | adv | pəˈhæps | pərˈhæps | возможно, может быть | maybe | *Perhaps* she missed the bus. | Возможно, она опоздала на автобус.
- rather | adv | ˈrɑːðə | ˈræðər | скорее, довольно | fairly; more willingly | It's *rather* cold today. | Сегодня довольно холодно. | would rather — предпочёл бы
