title: 'Describing: same, different, true'
title_ru: 'Описание: сходство, точность, вероятность'
topic: describing
words:
- applicable | adj | əˈplɪkəbl | ˈæplɪkəbl | применимый | relevant to a particular situation | The rule is not *applicable* to children. | Это правило не распространяется на детей.
- archaic | adj | ɑːˈkeɪɪk | ɑːrˈkeɪɪk | архаичный, устаревший | very old and no longer used | The law uses *archaic* language. | В законе используется архаичный язык.
- authentic | adj | ɔːˈθentɪk |  | подлинный, аутентичный | real, not false or copied | Experts declared the painting *authentic*. | Эксперты признали картину подлинной.
- habitual | adj | həˈbɪtʃuəl |  | привычный, обычный | done as a habit; usual | He's a *habitual* liar. | Он закоренелый лжец.
- interior | n | ɪnˈtɪəriə | ɪnˈtɪriər | интерьер, внутренняя часть | the inside of something | The *interior* of the church is beautiful. | Внутри церковь прекрасна.
- legitimate | adj | lɪˈdʒɪtɪmət |  | законный, обоснованный | allowed by law; reasonable | Is this a *legitimate* business? | Это законный бизнес? | legitimate concern — обоснованное беспокойство
- respective | adj | rɪˈspektɪv |  | соответствующий (каждому свой) | belonging to each of the people mentioned | The two surgeons returned to their *respective* hospitals. | Двое хирургов вернулись каждый в свою больницу.
- reverse | v | rɪˈvɜːs | rɪˈvɜːrs | обращать вспять, отменять; давать задний ход | to change something to the opposite; to go backwards | The council *reversed* its decision. | Совет отменил своё решение.
- subtle | adj | ˈsʌtl |  | тонкий, едва уловимый | not obvious; delicate | The tea has a *subtle* flavour of lemon. | У чая тонкий привкус лимона. | b не читается
- underlying | adj | ˌʌndəˈlaɪɪŋ | ˌʌndərˈlaɪɪŋ | лежащий в основе, скрытый | real but not easy to see | We need to find the *underlying* cause of the problem. | Нам нужно найти глубинную причину проблемы.
