title: Language for essays
title_ru: Язык аргументации
topic: essay
words:
- a growing number of | phr |  |  | всё больше | more and more | *A growing number of* people work online. | Всё больше людей работают онлайн.
- address an issue | phr |  |  | решать проблему | to deal with a problem | The report helps to *address an issue* many people ignore. | Доклад помогает решить проблему, которую многие игнорируют.
- alleviate | v | əˈliːvɪeɪt | əˈliːviːeɪt | облегчать, смягчать | to make less severe | The drug *alleviates* pain. | Лекарство облегчает боль.
- detrimental | adj | ˌdetrɪˈmentl | ˌdetrəˈmenl | пагубный | harmful | Stress is *detrimental* to health. | Стресс пагубно влияет на здоровье.
- drawback | n | ˈdrɔːbæk |  | недостаток | a disadvantage | The main *drawback* of the job is the low pay. | Главный недостаток работы — низкая зарплата.
- have a detrimental effect on | phr |  |  | пагубно влиять на | to cause harm to | Smoking *has a detrimental effect on* your lungs. | Курение пагубно влияет на лёгкие.
- it is widely believed that | phr |  |  | широко распространено мнение, что | many people think that | *It is widely believed that* exercise improves mood. | Многие считают, что спорт улучшает настроение.
- notwithstanding | prep | ˌnɒtwɪθˈstændɪŋ | ˌnɑːtwɪθˈstændɪŋ | несмотря на | despite (formal) | *Notwithstanding* the risks, they decided to invest. | Несмотря на риски, они решили инвестировать.
- play a crucial role | phr |  |  | играть ключевую роль | to be very important | Teachers *play a crucial role* in society. | Учителя играют ключевую роль в обществе.
- raise awareness | phr |  |  | повышать осведомлённость | to make people know more | The campaign aims to *raise awareness* of cancer. | Кампания призвана повысить осведомлённость о раке.
- tackle a problem | phr |  |  | взяться за решение проблемы | to deal with a problem | It is time to *tackle a problem* we have ignored for years. | Пора взяться за проблему, которую мы годами игнорировали.
- take measures | phr |  |  | принимать меры | to act to deal with something | The city *took measures* to reduce traffic. | Город принял меры по сокращению пробок.
- there is no doubt that | phr |  |  | несомненно | it is certain that | *There is no doubt that* the climate is changing. | Нет сомнений, что климат меняется.
- to a certain extent | phr |  |  | до некоторой степени | partly | I agree *to a certain extent*. | До некоторой степени я согласен.
- undermine | v | ˌʌndəˈmaɪn | ˌʌndərˈmaɪn | подрывать | to gradually make something weaker | Some people feared that a second language would *undermine* the first. | Некоторые опасались, что второй язык подорвёт первый.
- unprecedented | adj | ʌnˈpresɪdəntɪd | ənˈpresɪdentɪd | беспрецедентный | never happened before | The crisis is *unprecedented*. | Кризис беспрецедентен.
