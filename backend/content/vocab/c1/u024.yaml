title: Shopping and money
title_ru: Покупки и деньги
topic: shopping
words:
- allocation | n | ˌæləˈkeɪʃən |  | распределение; выделенная доля | sharing out; an amount given | The *allocation* of funds was unfair. | Распределение средств было несправедливым.
- buck | n | bʌk |  | доллар (разг.) | a dollar | It costs ten *bucks*. | Это стоит десять баксов.
- compensation | n | ˌkɒmpənˈseɪʃən | ˌkɑːmpənˈseɪʃən | компенсация | money paid for loss or injury | She received *compensation* for the accident. | Она получила компенсацию за аварию.
- deposit | v | dɪˈpɒsɪt | dəˈpɑːzɪt | вносить (деньги); откладывать | to put money in a bank; to put down | I *deposited* the money in my account. | Я положил деньги на счёт.
- earnings | n | ˈɜːnɪŋz | ˈɜːrnɪŋz | заработок | money earned | His annual *earnings* are £50,000. | Его годовой доход — 50 000 фунтов.
- expenditure | n | ɪkˈspendɪtʃə | ɪkˈspendətʃər | расходы | money spent | Public *expenditure* on health has risen. | Государственные расходы на здравоохранение выросли.
- inventory | n | ˈɪnvəntri | ˈɪnvəntɔːri | опись, инвентарь | a complete list of items | The temple kept an *inventory* of gifts. | Храм вёл опись подношений.
- legacy | n | ˈleɡəsi |  | наследие | something that continues to exist after someone has died | His music is his greatest *legacy*. | Его музыка — его величайшее наследие.
- levy | n | ˈlevi |  | сбор, налог | an official tax | There's a *levy* on plastic bags. | На пластиковые пакеты введён сбор.
- premium | adj | ˈpriːmiəm |  | премиальный, высококачественный | of high quality and more expensive | *Premium* brands use better materials. | Премиальные бренды используют лучшие материалы.
- proceeds | n | prəˈsidz | prəˈsiːdz | выручка | money from selling something | The *proceeds* will go to charity. | Выручка пойдёт на благотворительность.
- sacrifice | v | ˈsækrɪfaɪs |  | жертвовать | to give up something valuable for something more important | They *sacrificed* their lives for our freedom. | Они пожертвовали жизнями ради нашей свободы.
- stake | n | steɪk |  | кол; ставка | a strong pointed stick; something you risk | They tied the tent to wooden *stakes*. | Палатку привязали к деревянным кольям. | at stake — на кону
- subscription | n | sʌbˈskrɪpʃən | səbsˈkrɪpʃən | подписка | regular payment for a service | I cancelled my *subscription*. | Я отменил подписку.
- substitute | v | ˈsʌbstɪtjuːt | ˈsʌbstətuːt | заменять | to use instead of | You can *substitute* honey for sugar. | Сахар можно заменить мёдом.
