title: Technology
title_ru: Технологии
topic: tech
words:
- cyberbullying | n | ˈsaɪbəbʊliɪŋ | ˈsaɪbərbʊliɪŋ | кибербуллинг, травля в интернете | bullying online | *Cyberbullying* is a serious problem. | Травля в интернете — серьёзная проблема.
- data breach | n | ˈdeɪtə briːtʃ | ˈdætə briːtʃ | утечка данных | when private data is stolen | The company suffered a *data breach*. | В компании произошла утечка данных.
