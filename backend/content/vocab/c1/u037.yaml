title: Animals
title_ru: Животные
topic: animals
words:
- parasite | n | ˈpærəsaɪt |  | паразит | an animal or plant that lives on another and takes its food | Fleas are *parasites*. | Блохи — паразиты.
- primate | n | ˈpraɪmeɪt |  | примат | a member of the group of mammals that includes humans, apes and monkeys | Chimpanzees are our closest *primate* relatives. | Шимпанзе — наши ближайшие родственники среди приматов.
- venom | n | ˈvenəm |  | яд (змеи, насекомого) | poison from a snake, spider or insect | Some snake *venom* can kill a person in minutes. | Яд некоторых змей может убить человека за минуты. | venomous — ядовитый
