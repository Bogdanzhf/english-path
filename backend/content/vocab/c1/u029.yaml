title: Work and jobs
title_ru: Работа и профессии
topic: work
words:
- apprentice | n | əˈprentɪs |  | ученик, подмастерье | a person learning a skill by working for an expert | He worked as an *apprentice* to a carpenter. | Он работал подмастерьем у плотника.
- commentator | n | ˈkɒmənteɪtə | ˈkɑːmənteɪtər | комментатор, обозреватель | a person who gives opinions on news or describes events on TV | Political *commentators* discussed the election. | Политические обозреватели обсуждали выборы.
- contractor | n | kənˈtræktə | ˈkɑːntræktər | подрядчик | a company hired to do work | We hired a building *contractor*. | Мы наняли строительного подрядчика.
- coordinator | n | kəʊˈɔːdɪneɪtə | koʊˈɔːrdəneɪtər | координатор | a person who organises | She's the project *coordinator*. | Она координатор проекта.
- correspondent | n | ˌkɒrɪˈspɒndənt | ˌkɔːrəˈspɑːndənt | корреспондент | a journalist reporting from a place | He's the BBC's Moscow *correspondent*. | Он корреспондент Би-би-си в Москве.
- deputy | n | ˈdepjuːti | ˈdepjəti | заместитель | a second-in-command | She's the *deputy* head. | Она заместитель директора.
- engineer | v | ˌendʒɪˈnɪə | ˌendʒɪˈnɪr | спроектировать; подстроить | to design; to arrange cleverly | He *engineered* her promotion. | Он устроил ей повышение.
- investigator | n | ɪnˈvestɪɡeɪtə | ˌɪnˈvestəɡeɪtər | следователь, исследователь | a person who investigates | Private *investigators* followed him. | За ним следили частные детективы.
- manual labour | n | ˈmænjuːəl ˈleɪbə | ˈmænjuːəl ˈleɪbər | физический труд | work done with the hands | The job involves *manual labour*. | Эта работа связана с физическим трудом.
- mentor | n | ˈmentɔː | ˈmentɔːr | наставник | an experienced adviser | She was my *mentor* at work. | Она была моим наставником на работе.
- minimum wage | n | ˈmɪnɪməm weɪdʒ | ˈmɪnəməm weɪdʒ | минимальная зарплата | the lowest pay allowed by law | The *minimum wage* was increased. | Минимальную оплату труда повысили.
- mining | n | ˈmaɪnɪŋ |  | горнодобывающая промышленность | digging for minerals | The town grew up around *mining*. | Город вырос вокруг шахт.
- portfolio | n | pɔːtˈfəʊlɪəʊ | pɔːrtˈfoʊliːoʊ | портфолио; портфель (ценных бумаг) | a collection of work or investments | The artist showed us her *portfolio*. | Художница показала нам своё портфолио.
- shareholder | n | ˈʃeəhəʊldə | ˈʃerhoʊldər | акционер | a person who owns shares | *Shareholders* voted against the deal. | Акционеры проголосовали против сделки.
- skilled labour | n | skɪld ˈleɪbə | skɪld ˈleɪbər | квалифицированный труд | work needing training | There's a shortage of *skilled labour*. | Не хватает квалифицированных рабочих.
- solicitor | n | səˈlɪsɪtə | səˈlɪsətər | адвокат, юрист (брит.) | a lawyer who gives advice | You should see a *solicitor*. | Вам стоит обратиться к юристу.
- 'tailor | n | ˈteɪlə | ˈteɪlər | портной | a person who makes clothes | The suit was made by a *tailor*. | Костюм сшит у портного. | гл.: tailor — подстраивать, адаптировать'
- trade union | n | treɪd ˈjuːniən | treɪd ˈjuːnjən | профсоюз | an organisation of workers | He's a member of a *trade union*. | Он член профсоюза.
- trustee | n | ˈtrʌstiː | ˌtrʌsˈtiː | попечитель, доверенное лицо | a person who manages money for others | She's a *trustee* of the charity. | Она попечитель благотворительной организации.
- warehouse | n | ˈweəhaʊs | ˈwerhaʊs | склад | a large building for storing goods | The goods are stored in a *warehouse*. | Товары хранятся на складе.
