title: Shopping and money
title_ru: Покупки и деньги
topic: shopping
words:
- inventory | n | ˈɪnvəntri | ˈɪnvəntɔːri | опись, инвентарь | a complete list of items | The temple kept an *inventory* of gifts. | Храм вёл опись подношений.
- legacy | n | ˈleɡəsi |  | наследие | something that continues to exist after someone has died | His music is his greatest *legacy*. | Его музыка — его величайшее наследие.
- premium | adj | ˈpriːmiəm |  | премиальный, высококачественный | of high quality and more expensive | *Premium* brands use better materials. | Премиальные бренды используют лучшие материалы.
- sacrifice | v | ˈsækrɪfaɪs |  | жертвовать | to give up something valuable for something more important | They *sacrificed* their lives for our freedom. | Они пожертвовали жизнями ради нашей свободы.
- stake | n | steɪk |  | кол; ставка | a strong pointed stick; something you risk | They tied the tent to wooden *stakes*. | Палатку привязали к деревянным кольям. | at stake — на кону
