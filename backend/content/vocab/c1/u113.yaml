title: Thinking and opinions
title_ru: Мысли и мнения
topic: mind
words:
- analogy | n | əˈnælədʒi |  | аналогия | a comparison | He used an *analogy* to explain it. | Он объяснил это через аналогию.
- assurance | n | əʃˈjɔːrəns | əˈʃʊrəns | заверение, гарантия; уверенность | a promise; confidence | He gave me his *assurance*. | Он дал мне своё слово.
- attribute | n | ˈætrɪbjuːt |  | качество, черта | a quality that someone or something has | Patience is an important *attribute* for a teacher. | Терпение — важное качество учителя.
- conception | n | kənˈsepʃən |  | понимание, представление; зачатие | an idea; the start of a pregnancy | He has no *conception* of time. | Он не имеет понятия о времени.
- configuration | n | kənˌfɪɡjʊˈreɪʃən | kənˌfɪɡjəˈreɪʃən | конфигурация | the arrangement of parts | Check the network *configuration*. | Проверьте настройки сети.
- coordination | n | kəʊˈɔːdɪˈneɪʃən | koʊˌɔːrdəˈneɪʃən | координация | organising together | The job needs good *coordination*. | Работа требует хорошей координации.
- dilemma | n | dɪˈlemə |  | дилемма | a situation where you must choose between two difficult options | The admiral faced a terrible *dilemma*. | Адмирал оказался перед ужасной дилеммой.
- doctrine | n | ˈdɒktrɪn | ˈdɑːktrən | доктрина | a set of beliefs | It's a military *doctrine*. | Это военная доктрина.
- imagery | n | ˈɪmɪdʒri | ˈɪmədʒri | образность, образы | pictures; descriptive language | The poem is full of vivid *imagery*. | Стихотворение полно ярких образов.
- inability | n | ɪnəˈbɪləti | ˌɪnəˈbɪlɪti | неспособность | not being able | His *inability* to listen annoys me. | Меня раздражает его неумение слушать.
- instinct | n | ˈɪnstɪŋkt |  | инстинкт, чутьё | a natural feeling | Trust your *instincts*. | Доверяй своему чутью.
- justification | n | ˌdʒʌstɪfɪˈkeɪʃən | ˌdʒʌstəfəˈkeɪʃən | оправдание, обоснование | a good reason | There's no *justification* for violence. | Насилию нет оправдания.
- precedent | n | ˈpresɪdənt |  | прецедент | an earlier example | The decision sets a *precedent*. | Решение создаёт прецедент.
- projection | n | prəˈdʒekʃən |  | прогноз; проекция | a forecast; showing an image | Sales *projections* look good. | Прогнозы продаж хорошие.
- prophecy | n | ˈprɒfəsi | ˈprɑːfəsi | пророчество | a statement that something will happen in the future | The *prophecy* came true. | Пророчество сбылось.
- realization | n | ˈriləˈzeɪʃən | ˈriːləˈzeɪʃən | осознание; осуществление | understanding; achieving | The *realization* hit me suddenly. | Осознание пришло внезапно. | брит. также realisation
- reasoning | n | ˈriːzənɪŋ |  | рассуждение, логика | the process of thinking | I don't follow your *reasoning*. | Я не понимаю твоей логики.
- sensitivity | n | ˌsensɪˈtɪvɪti |  | чувствительность; чуткость | being sensitive | The issue needs *sensitivity*. | Вопрос требует деликатности.
- stimulus | n | ˈstɪmjələs |  | стимул, побуждение | something that causes activity | The artwork was a *stimulus* for public debate. | Работа стала толчком к общественной дискуссии. | мн. stimuli
