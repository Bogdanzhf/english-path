title: Nature and weather
title_ru: Природа и погода
topic: nature
words:
- cavity | n | ˈkævəti |  | полость; кариес, дупло (в зубе) | a hole or empty space inside something | Sugar causes *cavities* in your teeth. | Сахар вызывает кариес.
- dung | n | dʌŋ |  | навоз, помёт | solid waste from animals | Farmers use cow *dung* on their fields. | Фермеры удобряют поля коровьим навозом.
- grove | n | ɡrəʊv | ɡroʊv | роща | a small group of trees | They camped in a *grove* of trees by the creek. | Они разбили лагерь в роще у ручья.
- incline | v | ɪnˈklaɪn |  | склонять(ся) | to tend to think or behave in a particular way | I'm *inclined* to agree with you. | Я склонен с вами согласиться. | be inclined to
- jagged | adj | ˈdʒæɡɪd |  | зазубренный, неровный | with rough, sharp points | The broken pieces had *jagged* edges. | У обломков были острые неровные края.
- pasture | n | ˈpɑːstʃə | ˈpæstʃər | пастбище | land covered with grass for animals | Sheep grazed on the *pasture* around the stones. | Вокруг камней на пастбище паслись овцы.
- peninsula | n | pəˈnɪnsjələ | pəˈnɪnsələ | полуостров | land almost surrounded by water | Italy is a *peninsula*. | Италия — полуостров.
- terrain | n | təˈreɪn |  | местность | land of a particular type | The *terrain* was rocky and dangerous. | Местность была каменистой и опасной.
- tract | n | trækt |  | участок, пространство | a large area of land | Vast *tracts* of forest covered the island. | Огромные лесные массивы покрывали остров.
- turf | n | tɜːf | tɜːrf | дёрн, газон | grass and the soil under it | The stones stand on short green *turf*. | Камни стоят на короткой зелёной траве.
