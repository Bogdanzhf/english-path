title: Animals
title_ru: Животные
topic: animals
words:
- animal rights | n | ˈænɪml raɪts | ˈænəml raɪts | права животных | the idea that animals should be protected | She campaigns for *animal rights*. | Она борется за права животных.
- animal welfare | n | ˈænɪml ˈwelfeə | ˈænəml ˈwelfer | благополучие животных | the care of animals | The law improves *animal welfare*. | Закон улучшает условия содержания животных.
- 'breed | n | briːd |  | порода | a type of animal | What *breed* is your dog? | Какой породы твоя собака? | гл.: breed — разводить'
- captivity | n | kæpˈtɪvɪti | kæpˈtɪvəti | неволя | being kept in a cage | Animals in *captivity* often get stressed. | Животные в неволе часто испытывают стресс.
- food chain | n | fuːd tʃeɪn |  | пищевая цепь | the series of animals that eat each other | Humans are at the top of the *food chain*. | Человек на вершине пищевой цепи.
- goose | n | ɡuːs |  | гусь | a large water bird | A *goose* chased me. | За мной погнался гусь. | мн. ч. geese
- hedgehog | n | ˈhedʒhɒɡ | ˈhedʒhɑːɡ | ёжик | a small animal covered with spines | A *hedgehog* lives in our garden. | В нашем саду живёт ёжик.
- migration | n | maɪˈɡreɪʃən |  | миграция | moving from one place to another | Birds begin their *migration* in autumn. | Осенью птицы начинают перелёт.
- natural habitat | n | ˈnætʃərəl ˈhæbɪtæt | ˈnætʃərəl ˈhæbətæt | естественная среда обитания | the place where an animal naturally lives | It's best to see animals in their *natural habitat*. | Животных лучше всего наблюдать в естественной среде.
- otter | n | ˈɒtə | ˈɑːtər | выдра | a water animal with brown fur | *Otters* live near rivers. | Выдры живут у рек.
- parasite | n | ˈpærəsaɪt |  | паразит | an animal or plant that lives on another and takes its food | Fleas are *parasites*. | Блохи — паразиты.
- peacock | n | ˈpiːkɒk | ˈpiːkɑːk | павлин | a large bird with a colourful tail | The *peacock* spread its tail. | Павлин распустил хвост.
- pigeon | n | ˈpɪdʒən |  | голубь | a common grey bird in cities | *Pigeons* gathered in the square. | На площади собрались голуби.
- poaching | n | ˈpəʊtʃɪŋ | ˈpoʊtʃɪŋ | браконьерство | illegal hunting | *Poaching* threatens elephants. | Браконьерство угрожает слонам.
- predator | n | ˈpredətə | ˈpredətər | хищник | an animal that kills others | Lions are *predators*. | Львы — хищники.
- prey | n | preɪ |  | добыча, жертва | an animal hunted by another | The eagle caught its *prey*. | Орёл поймал добычу.
- primate | n | ˈpraɪmeɪt |  | примат | a member of the group of mammals that includes humans, apes and monkeys | Chimpanzees are our closest *primate* relatives. | Шимпанзе — наши ближайшие родственники среди приматов.
- snail | n | sneɪl |  | улитка | a small slow animal with a shell | The *snail* moved slowly across the leaf. | Улитка медленно ползла по листу.
- venom | n | ˈvenəm |  | яд (змеи, насекомого) | poison from a snake, spider or insect | Some snake *venom* can kill a person in minutes. | Яд некоторых змей может убить человека за минуты. | venomous — ядовитый
