title: Communication and language
title_ru: Общение и язык
topic: communication
words:
- chronicle | n | ˈkrɒnɪkl | ˈkrɑːnɪkl | хроника, летопись | a written record of events in the order they happened | The *chronicle* describes a plague of snakes in 1520. | Летопись описывает нашествие змей в 1520 году.
- critique | n | krɪˈtiːk |  | критический разбор, критика | a careful written analysis | She wrote a sharp *critique* of army hospitals. | Она написала резкий критический разбор армейских госпиталей.
- deception | n | dɪˈsepʃn |  | обман | the act of making someone believe something false | The whole show was based on *deception*. | Всё представление было построено на обмане.
- 'premise | n | ˈpremɪs |  | предпосылка, исходное положение | an idea on which a theory or argument is based | The film''s *premise* is simple: a man wakes up with no memory. | Завязка фильма проста: человек просыпается без памяти.'
