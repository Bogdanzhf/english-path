title: 'Describing: good or bad'
title_ru: 'Описание: оценка — хорошо или плохо'
topic: describing
words:
- degrading | adj | dɪˈɡreɪdɪŋ |  | унизительный | making people lose respect | It's a *degrading* job. | Это унизительная работа.
- dismal | adj | ˈdɪzml |  | мрачный; жалкий | sad; very bad | The team's performance was *dismal*. | Команда выступила из рук вон плохо.
- dreary | adj | ˈdrɪəri | ˈdrɪri | унылый, тоскливый | dull and depressing | It was a cold, *dreary* morning. | Было холодное унылое утро.
- effortless | adj | ˈefətləs | ˈefərtləs | лёгкий, без усилий | needing no effort | She makes it look *effortless*. | У неё это выходит без всяких усилий.
- engrossing | adj | ɪnˈɡrəʊsɪŋ | ɪnˈɡroʊsɪŋ | захватывающий | so interesting you forget everything else | It's an *engrossing* novel. | Это захватывающий роман.
- enviable | adj | ˈenvɪəbl | ˈenviəbl | завидный | causing envy | She has an *enviable* position. | У неё завидное положение.
- exhilarating | adj | ɪɡˈzɪləreɪtɪŋ |  | волнующий, бодрящий | very exciting | Skiing is *exhilarating*. | Лыжи — это захватывающе.
- gruesome | adj | ˈɡruːsʌm | ˈɡruːsəm | ужасный, жуткий | horrible and shocking | It was a *gruesome* murder. | Это было жуткое убийство.
- inexcusable | adj | ˌɪneksˈkjuːsəbl | ˌɪnɪkˈskjuːzəbl | непростительный | too bad to forgive | His behaviour was *inexcusable*. | Его поведение было непростительным.
- ingenious | adj | ɪnˈdʒiːniəs |  | изобретательный, остроумный | very clever and original | It was an *ingenious* solution. | Это было остроумное решение. | не путайте с ingenuous — простодушный
- ludicrous | adj | ˈluːdɪkrəs | ˈluːdəkrəs | нелепый | ridiculous | That's a *ludicrous* idea. | Это нелепая идея.
- macabre | adj | məˈkɑːbrə | məˈkɑːbər | жуткий, мрачный | strange and frightening, connected with death | He has a *macabre* sense of humour. | У него мрачное чувство юмора.
- monotonous | adj | məˈnɒtənəs | məˈnɑːtənəs | монотонный | boring because always the same | The work is *monotonous*. | Работа однообразная.
- pleasurable | adj | ˈpleʒərəbl |  | приятный | enjoyable | It was a *pleasurable* experience. | Это было приятно.
- poignant | adj | ˈpɔɪnjənt |  | трогательный, щемящий | causing deep sadness or emotion | It was a *poignant* moment when the families were reunited. | Воссоединение семей было трогательным моментом.
- prohibitive | adj | prəˈhɪbɪtɪv | proʊˈhɪbətɪv | запредельный (о цене); запретительный | too expensive | The cost is *prohibitive*. | Стоимость неподъёмная.
- riveting | adj | ˈrɪvɪtɪŋ | ˈrɪvətɪŋ | захватывающий | extremely interesting | The film was *riveting*. | Фильм был захватывающим.
- scathing | adj | ˈskeɪðɪŋ |  | резкий, уничтожающий | severely critical | She wrote a *scathing* review. | Она написала разгромную рецензию.
- startling | adj | ˈstɑːtlɪŋ | ˈstɑːrtlɪŋ | поразительный, ошеломляющий | very surprising | The results were *startling*. | Результаты ошеломили.
- uneventful | adj | ʌnɪˈventfl | ˌʌniːˈventfl | без происшествий, спокойный | with nothing exciting happening | The flight was *uneventful*. | Полёт прошёл без происшествий.
- unsettling | adj | ʌnˈsetlɪŋ | ənˈsetəlɪŋ | тревожащий, выбивающий из колеи | making you nervous | It was an *unsettling* experience. | Это был тревожный опыт.
