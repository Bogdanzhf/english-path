title: Thinking and opinions
title_ru: Мысли и мнения
topic: mind
words:
- competence | n | ˈkɒmpɪtəns | ˈkɑːmpɪtəns | компетентность, умение | the ability to do something well | Nobody doubted her professional *competence*. | Никто не сомневался в её профессиональной компетентности.
- dominance | n | ˈdɒmɪnəns | ˈdɑːmɪnəns | господство, превосходство | the state of being more powerful than others | Vienna's *dominance* in music lasted a century. | Господство Вены в музыке длилось столетие.
- longevity | n | lɒnˈdʒevəti | lɔːnˈdʒevəti | долголетие | long life | The island is famous for the *longevity* of its people. | Остров славится долголетием своих жителей.
- secrecy | n | ˈsiːkrəsi |  | секретность | the state of keeping something secret | The meetings were held in *secrecy*. | Встречи проводились в обстановке секретности.
- simplicity | n | sɪmˈplɪsəti |  | простота | the quality of being simple | The *simplicity* of the idea was its strength. | Простота идеи была её силой.
- solidarity | n | ˌsɒlɪˈdærəti | ˌsɑːlɪˈdærəti | солидарность | support between people with shared interests | Workers showed *solidarity* with the strikers. | Рабочие выразили солидарность с бастующими.
- surplus | n | ˈsɜːpləs | ˈsɜːrpləs | излишек, избыток | an amount that is more than needed | The country has a food *surplus*. | В стране избыток продовольствия.
- symmetry | n | ˈsɪmətri |  | симметрия | the state of having two matching halves | The design has perfect *symmetry*. | У узора идеальная симметрия.
