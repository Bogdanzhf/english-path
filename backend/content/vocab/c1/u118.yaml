title: 'Describing: society and science'
title_ru: 'Описание: общество, наука, право'
topic: describing
words:
- affluent | adj | ˈæfluənt |  | состоятельный, богатый | having plenty of money | They live in an *affluent* suburb. | Они живут в богатом пригороде.
- albeit | conj | ɔːlˈbiːɪt |  | хотя и | although (formal) | He agreed, *albeit* unwillingly. | Он согласился, хотя и неохотно.
- amid | prep | əˈmɪd |  | среди, посреди | in the middle of; during | The airship landed *amid* heavy rain. | Дирижабль приземлялся под проливным дождём.
- aquatic | adj | əˈkwætɪk |  | водный, водяной | living or growing in water | Tardigrades are tiny *aquatic* animals. | Тихоходки — крошечные водные животные.
- communal | adj | kəˈmjuːnl | ˈkɑːmjənl | общий, коллективный | shared by a group of people | The students share a *communal* kitchen. | У студентов общая кухня.
- cosmopolitan | adj | ˌkɒzməˈpɒlɪtən | ˌkɑːzməˈpɑːlɪtən | космополитичный | including people and ideas from many countries | London is a *cosmopolitan* city. | Лондон — космополитичный город.
- latter | n | ˈlætə | ˈlætər | последний (из двух) | the second of two | Of tea and coffee, I prefer the *latter*. | Из чая и кофе я предпочитаю второе. | ср. the former — первый
- militant | adj | ˈmɪlɪtənt |  | воинствующий, агрессивный | using strong or violent methods to achieve change | She was a *militant* campaigner for reform. | Она была воинствующей сторонницей реформ.
- monolingual | adj | ˌmɒnəˈlɪŋɡwəl | ˌmɑːnəˈlɪŋɡwəl | одноязычный | speaking only one language | *Monolingual* speakers are actually a minority in the world. | Говорящие на одном языке на самом деле в мире в меньшинстве.
- nocturnal | adj | nɒkˈtɜːnl | nɑːkˈtɜːrnl | ночной | active at night | Owls are *nocturnal*. | Совы ведут ночной образ жизни.
- occupational | adj | ˌɒkjʊˈpeɪʃənl | ɑːkjəˈpeɪʃənl | профессиональный | relating to a job | Back pain is an *occupational* hazard. | Боли в спине — профессиональный риск.
- paternal | adj | pəˈtɜːnl | pəˈtɜːrnl | отцовский; по отцовской линии | relating to a father | My *paternal* grandmother lives in Kiev. | Моя бабушка по отцу живёт в Киеве.
- quantitative | adj | ˈkwɒntɪteɪtɪv | ˈkwɑːntɪteɪtɪv | количественный | relating to numbers | We did a *quantitative* study. | Мы провели количественное исследование.
- remedial | adj | rɪˈmiːdɪəl | rɪˈmiːdiəl | коррекционный, исправительный | intended to fix a problem | He needs *remedial* classes in maths. | Ему нужны дополнительные занятия по математике.
- 'sensory | adj | ˈsensəri |  | сенсорный, чувственный | connected with the physical senses | The show is a *sensory* experience of light and sound. | Шоу — это настоящее пиршество для чувств: свет и звук.'
- stylistic | adj | staɪˈlɪstɪk |  | стилистический | relating to style | There are *stylistic* differences. | Есть стилистические различия.
- theatrical | adj | θiːˈætrɪkl |  | театральный | relating to theatre; exaggerated | She made a *theatrical* gesture. | Она театрально взмахнула рукой.
- transatlantic | adj | trænsətˈlɑːntɪk | ˌtrænzətˈlænɪk | трансатлантический | crossing the Atlantic | It was a *transatlantic* flight. | Это был трансатлантический рейс.
- whereby | adv | weəˈbaɪ | werˈbaɪ | посредством которого, по которому | by which; according to which | They introduced a system *whereby* tenants could pay online. | Ввели систему, по которой жильцы могут платить онлайн.
- whilst | conj | waɪlst |  | в то время как (брит., книжн.) | while | *Whilst* I agree, I have doubts. | Хотя я согласен, у меня есть сомнения.
