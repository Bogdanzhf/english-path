title: Work and jobs
title_ru: Работа и профессии
topic: work
words:
- admiral | n | ˈædmərəl |  | адмирал | an officer of the highest rank in the navy | The *admiral* commanded the whole fleet. | Адмирал командовал всем флотом.
- aide | n | eɪd |  | помощник, советник | an assistant to an important person | A presidential *aide* spoke to the press. | Помощник президента выступил перед прессой.
- ambassador | n | æmˈbæsədə | æmˈbæsədər | посол | an official who represents his or her country in another country | The French *ambassador* met the president. | Посол Франции встретился с президентом.
- anthropologist | n | ˌænθrəˈpɒlədʒɪst | ˌænθrəˈpɑːlədʒəst | антрополог | a person who studies human societies | The *anthropologist* lived with the tribe. | Антрополог жил среди племени.
- bureaucratic | adj | ˌbjɔːrəʊˈkrætɪk | ˌbjʊrəˈkrætɪk | бюрократический | with too many rules | The system is very *bureaucratic*. | Система очень бюрократична.
- carpenter | n | ˈkɑːpəntə | ˈkɑːrpəntər | плотник | a person who makes things from wood | The *carpenter* made us a new kitchen table. | Плотник сделал нам новый кухонный стол.
- carpentry | n | ˈkɑːpəntri | ˈkɑːrpəntri | плотницкое дело, столярка | making things from wood | He's learning *carpentry*. | Он учится столярному делу.
- counsellor | n | ˈkaʊnselə | ˈkaʊnsələr | консультант, психолог | a person trained to give advice | She talked to a school *counsellor*. | Она поговорила со школьным психологом. | амер. counselor
- demonstrator | n | ˈdemənstreɪtə | ˈdemənstreɪtər | демонстрант; демонстратор | a person in a protest | *Demonstrators* gathered outside parliament. | У парламента собрались демонстранты.
- diplomat | n | ˈdɪpləmæt |  | дипломат | an official who represents his or her country abroad | He worked as a *diplomat* in Paris. | Он работал дипломатом в Париже.
- educator | n | ˈedʒuːkeɪtə | ˈedʒəkeɪtər | педагог | a teacher | She's an experienced *educator*. | Она опытный педагог.
- managerial | adj | ˌmænəˈdʒɪəriəl | ˌmænəˈdʒɪriəl | управленческий | connected with managers and their work | She has strong *managerial* skills. | У неё сильные управленческие навыки.
- midwife | n | ˈmɪdwaɪf |  | акушерка | a nurse who helps women give birth | The *midwife* delivered the baby. | Акушерка приняла роды.
- physician | n | fɪˈzɪʃn |  | врач, терапевт | a medical doctor (formal) | She consulted a *physician*. | Она проконсультировалась у врача. | не «физик» (это physicist)
- practitioner | n | prækˈtɪʃənə | prækˈtɪʃənər | практикующий врач, специалист | a person who works in a profession, especially medicine | See your local medical *practitioner*. | Обратитесь к своему участковому врачу. | GP = general practitioner — терапевт
- psychiatrist | n | saɪˈkaɪətrɪst | səˈkaɪətrəst | психиатр | a doctor who treats mental illness | He's seeing a *psychiatrist*. | Он ходит к психиатру.
- screenwriter | n | ˈskriːnraɪtə | ˈskriːnraɪtər | сценарист | a person who writes films | She's an award-winning *screenwriter*. | Она сценаристка, удостоенная наград.
- subordinate | n | səˈbɔːdəneɪt | səˈbɔːrdəneɪt | подчинённый | a person with a lower position | He's rude to his *subordinates*. | Он груб с подчинёнными.
- tycoon | n | taɪˈkuːn |  | магнат | a rich, powerful businessperson | He's a media *tycoon*. | Он медиамагнат.
