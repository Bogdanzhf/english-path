title: Character and personality
title_ru: Характер и личность
topic: feelings
words:
- agreeable | adj | əˈɡriːəbl | əˈɡriəbl | приятный; согласный | pleasant; willing | We spent an *agreeable* evening. | Мы приятно провели вечер.
- benign | adj | bɪˈnaɪn |  | доброкачественный; благожелательный | not dangerous; kind | The tumour was *benign*. | Опухоль оказалась доброкачественной.
- candid | adj | ˈkændɪd | ˈkændəd | откровенный | honest and direct | She was very *candid* about her past. | Она была очень откровенна о своём прошлом.
- conscientious | adj | ˌkɒnsɪˈenʃəs | ˌkɑːnʃiːˈenʃəs | добросовестный | careful and hard-working | He's a *conscientious* worker. | Он добросовестный работник.
- eclectic | adj | ɪˈklektɪk |  | эклектичный, разнородный | including many different styles | She has *eclectic* taste in music. | У неё разнообразный музыкальный вкус.
- feeble | adj | ˈfiːbl |  | слабый, немощный | very weak | His voice was *feeble* after his illness. | После болезни у него был слабый голос.
- ferocious | adj | fəˈrəʊʃəs | fəˈroʊʃəs | свирепый | very fierce | The dog looked *ferocious*. | Собака выглядела свирепой.
- hypocritical | adj | ˌhɪpəˈkrɪtɪkl |  | лицемерный | saying one thing and doing another | It's *hypocritical* to preach and not practise. | Лицемерно проповедовать и не следовать своим словам.
- insensitive | adj | ɪnˈsensɪtɪv | ˌɪnˈsensətɪv | бестактный, нечуткий | not caring about others' feelings | That was an *insensitive* remark. | Это было бестактное замечание.
- insightful | adj | ɪnˈsaɪtfl | ˈɪnsaɪtfl | проницательный | showing deep understanding | It was an *insightful* comment. | Это было проницательное замечание.
- instinctive | adj | ɪnˈstɪŋktɪv | ˌɪnˈstɪŋktɪv | инстинктивный | done without thinking | Her reaction was *instinctive*. | Её реакция была инстинктивной.
- inward | adj | ˈɪnwəd | ˈɪnwərd | внутренний | towards the inside; private and personal | 'Know yourself' encourages an *inward* journey. | «Познай себя» призывает к путешествию вглубь себя.
- knowledgeable | adj | ˈnɒlɪdʒəbl | ˈnɑːlədʒəbl | знающий, эрудированный | knowing a lot | He's very *knowledgeable* about art. | Он хорошо разбирается в искусстве.
- methodical | adj | meˈθɒdɪkl | məˈθɑːdəkl | методичный | careful and organised | He's slow but *methodical*. | Он медленный, но методичный.
- negligent | adj | ˈneɡlɪdʒənt | ˈneɡlədʒənt | халатный, небрежный | not taking enough care | The doctor was found *negligent*. | Врача признали виновным в халатности.
- outspoken | adj | aʊtˈspəʊkən | aʊtˈspoʊkən | откровенный, прямолинейный | expressing opinions openly, even if they offend | She is an *outspoken* critic of long working hours. | Она открыто критикует длинный рабочий день.
- pragmatic | adj | præɡˈmætɪk |  | прагматичный | dealing with things practically | We need a *pragmatic* solution. | Нужно практичное решение.
- proficient | adj | prəˈfɪʃnt |  | умелый, опытный | very skilled at something | She is *proficient* in three languages. | Она свободно владеет тремя языками.
- prophetic | adj | prɒˈfetɪk | prəˈfetɪk | пророческий | correctly predicting the future | His words proved *prophetic*. | Его слова оказались пророческими.
- quirky | adj | ˈkwɜːki | ˈkwɜːrki | причудливый, необычный | unusual in an interesting way | She has a *quirky* style. | У неё необычный стиль.
- resilient | adj | rɪˈsɪliənt | rɪˈzɪljənt | стойкий, жизнестойкий | able to recover quickly | Children are very *resilient*. | Дети очень жизнестойки.
- resourceful | adj | rɪˈsɔːsfl | rɪˈsɔːrsfl | находчивый | good at finding ways to solve problems | She's very *resourceful* and always finds a solution. | Она очень находчивая и всегда находит решение.
