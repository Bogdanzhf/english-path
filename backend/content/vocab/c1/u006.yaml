title: People and relationships
title_ru: Люди и отношения
topic: people
words:
- deviate | v | ˈdiːvieɪt |  | отклоняться | to move away from what is planned or normal | The ship *deviated* from its course. | Корабль отклонился от курса.
- guerilla | n | ɡəˈrɪlə |  | партизан | a member of a small fighting group that attacks a larger army by surprise | He carried out *guerilla* warfare in the jungle. | Он вёл партизанскую войну в джунглях. | также guerrilla
- infant | n | ˈɪnfənt |  | младенец | a baby or very young child | *Infants* need a lot of sleep. | Младенцам нужно много спать.
- kin | n | kɪn |  | родня | family members | Next of *kin* must be informed. | Необходимо уведомить ближайших родственников. | next of kin — ближайший родственник
- offspring | n | ˈɒfsprɪŋ | ˈɔːfsprɪŋ | потомство | the young of an animal or person | Most mammals care for their *offspring*. | Большинство млекопитающих заботятся о потомстве. | мн. ч. = ед. ч.
- skeptic | n | ˈskeptɪk |  | скептик | a person who doubts that something is true | Even the *skeptics* were impressed by the results. | Даже скептики были впечатлены результатами. | брит. sceptic
- spouse | n | spaʊs |  | супруг(а) | a husband or wife | Employees and their *spouses* are invited. | Приглашаются сотрудники и их супруги.
