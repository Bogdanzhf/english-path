title: Food and drink
title_ru: Еда и напитки
topic: food
words:
- calorie | n | ˈkæləri |  | калория | a unit for measuring the energy in food | Climbers burn up to 10,000 *calories* a day. | Альпинисты сжигают до 10 000 калорий в день.
- cater | v | ˈkeɪtə | ˈkeɪtər | обслуживать, удовлетворять потребности | to provide what a group needs or wants | The park *caters* for visitors of all ages. | Парк рассчитан на посетителей всех возрастов. | cater for/to
- cocktail | n | ˈkɒkteɪl | ˈkɑːkteɪl | коктейль | a mixed alcoholic drink | We had *cocktails* by the pool. | Мы пили коктейли у бассейна.
- crave | v | kreɪv |  | жаждать, страстно хотеть | to want very much | I *crave* chocolate when I'm tired. | Когда я устаю, мне ужасно хочется шоколада.
- factory farming | n | ˈfæktəri ˈfɑːmɪŋ | ˈfæktəri ˈfɑːrmɪŋ | промышленное животноводство | keeping animals in crowded conditions | Many people oppose *factory farming*. | Многие выступают против промышленного животноводства.
- fair trade | n | feə treɪd | fer treɪd | справедливая торговля | trade that pays farmers fairly | We buy *fair trade* coffee. | Мы покупаем кофе «фэр трейд».
- fertiliser | n | ˈfɜːtəlaɪzə | fˈɜːtəlaɪzɐ | удобрение | a substance added to soil | Farmers use *fertiliser* on their crops. | Фермеры удобряют посевы. | амер. fertilizer
- food miles | n | fuːd maɪlz | fuːd ˈmaɪəlz | «пищевые мили» (расстояние доставки еды) | the distance food travels to your plate | Buying local reduces *food miles*. | Покупка местных продуктов сокращает расстояние их доставки.
- food security | n | fuːd sɪˈkjɔːrɪti | fuːd sɪkˈjʊrəti | продовольственная безопасность | having enough food | Climate change threatens *food security*. | Изменение климата угрожает продовольственной безопасности.
- genetically modified | adj | dʒeˈnetɪkli ˈmɒdɪfaɪd | dʒəˈnetɪkli ˈmɑːdəfaɪd | генетически модифицированный | with changed genes | Some people avoid *genetically modified* food. | Некоторые избегают ГМ-продуктов. | сокр. GM
- gourmet | adj | ˈɡʊəmeɪ | ɡʊrˈmeɪ | гурманский, изысканный | (of food) of very high quality | The hotel serves *gourmet* food. | В отеле подают изысканные блюда. | t не читается
- grapefruit | n | ˈɡreɪpfruːt |  | грейпфрут | a large, round, yellow citrus fruit | I have half a *grapefruit* for breakfast. | На завтрак я съедаю половину грейпфрута.
- harvest | v | ˈhɑːvɪst | ˈhɑːrvəst | собирать урожай | to gather crops | They *harvest* the grapes in September. | Виноград собирают в сентябре.
- intensive farming | n | ɪnˈtensɪv ˈfɑːmɪŋ | ˌɪnˈtensɪv ˈfɑːrmɪŋ | интенсивное земледелие | farming that produces a lot from small areas | *Intensive farming* can damage the soil. | Интенсивное земледелие может истощать почву.
- malnourished | adj | ˌmælˈnʌrɪʃt | mælˈnɜːrɪʃt | недоедающий | not getting enough food | Many children are *malnourished*. | Многие дети недоедают.
- munch | v | məntʃ | mʌntʃ | жевать, хрустеть | to eat noisily | He was *munching* an apple. | Он хрустел яблоком.
- preservative | n | prɪˈsɜːvətɪv | priːˈzɜːrvətɪv | консервант | a chemical that keeps food fresh | This bread contains no *preservatives*. | В этом хлебе нет консервантов.
- provisions | n | prəˈvɪʒənz |  | провизия | supplies of food | We took *provisions* for a week. | Мы взяли провизии на неделю.
- staple food | n | ˈsteɪpl fuːd |  | основной продукт питания | the main food people eat | Rice is a *staple food* in Asia. | Рис — основной продукт питания в Азии.
- sustainable agriculture | n | səˈsteɪnəbl ˈæɡrɪkʌltʃə | səˈsteɪnəbl ˈæɡrɪkʌltʃər | устойчивое сельское хозяйство | farming that protects the environment | *Sustainable agriculture* protects the soil. | Устойчивое сельское хозяйство бережёт почву.
