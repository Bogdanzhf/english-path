title: Actions and movement
title_ru: Действия и движение
topic: actions
words:
- buffer | n | ˈbʌfə | ˈbʌfər | буфер, защита | something that reduces a shock | Savings act as a *buffer* against hard times. | Сбережения служат подушкой безопасности.
- bulk up | phv |  |  | набирать массу | to become bigger and more muscular | He's trying to *bulk up* at the gym. | Он пытается набрать массу в спортзале.
- complement | v | ˈkɒmplɪment | ˈkɑːmplɪment | дополнять | to go well with | The wine *complements* the fish. | Вино хорошо дополняет рыбу. | не путать с compliment — комплимент
- confront | v | kənˈfrʌnt |  | противостоять, столкнуться лицом к лицу | to face a difficult situation or person | He was finally *confronted* with the truth. | В конце концов ему пришлось взглянуть правде в глаза.
- coordinate | v | kəʊˈɔːdɪneɪt | koʊˈɔːrdɪneɪt | координировать | to organize people or things so they work together | She *coordinates* the work of three teams. | Она координирует работу трёх команд.
- crush | v | krʌʃ |  | давить, раздавливать | to press very hard | *Crush* the garlic. | Раздавите чеснок.
- exert | v | ɪɡˈzɜːt | ɪɡˈzɜːrt | прилагать (усилия); оказывать (давление) | to use physical or mental effort; to use influence | Climbing at high altitude means *exerting* yourself to the limit. | Восхождение на большой высоте требует предельных усилий.
- extract | v | ɪkˈstrækt |  | извлекать, удалять | to take out | The dentist *extracted* the tooth. | Стоматолог удалил зуб.
- facilitate | v | fəˈsɪlɪteɪt |  | облегчать, способствовать | to make something easier | The wind *facilitated* the English attack. | Ветер облегчил атаку англичан.
- 'leak | n | liːk |  | утечка, течь | a hole that lets liquid or gas escape | There''s a gas *leak*. | Утечка газа. | гл.: leak — протекать'
- lure | v | lʊə | lʊr | заманивать | to persuade someone to go somewhere by offering something attractive | They tried to *lure* the enemy into a trap. | Они пытались заманить врага в ловушку.
- pertain to | phv |  |  | относиться к | to be connected with | The rules *pertain to* all staff. | Правила касаются всех сотрудников.
- pinpoint | v | ˈpɪnpɔɪnt |  | точно определить | to find or describe something exactly | Doctors couldn't *pinpoint* the cause of the pain. | Врачи не могли точно определить причину боли.
- 'reform | n | rəˈfɔːm | rəˈfɔːrm | реформа | a change to improve something | The government promised tax *reform*. | Правительство пообещало налоговую реформу. | гл.: reform — реформировать'
- render | v | ˈrendə | ˈrendər | делать, приводить в состояние | to cause someone or something to be in a particular state | The illness *rendered* him blind. | Болезнь сделала его слепым.
- resume | v | rɪˈzjuːm | rɪˈzuːm | возобновлять, продолжать | to start again after a pause | The meeting will *resume* after lunch. | Совещание продолжится после обеда. | сущ. résumé (амер.) — резюме
- 'strip | v | strɪp |  | раздевать(ся); снимать | to remove clothes or a covering | They *stripped* the paint off the door. | Они сняли краску с двери. | сущ.: strip — полоска'
- suck | v | sʌk |  | сосать | to pull liquid into your mouth; to hold something in your mouth and pull on it | The baby *sucked* her thumb. | Малышка сосала большой палец.
- tune | v | tjuːn | tuːn | настраивать | to adjust an instrument or radio | He *tuned* his guitar. | Он настроил гитару.
- utilise | v | ˈjuːtəlaɪz | jˈuːtəlaɪz | использовать | to use | We must *utilise* all our resources. | Мы должны использовать все ресурсы. | амер. utilize
- utilize | v | ˈjuːtəlaɪz |  | использовать | to use something effectively | Some companies *utilize* old plastic to make clothes. | Некоторые компании используют старый пластик для производства одежды. | брит. также utilise
