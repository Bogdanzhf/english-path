title: Communication and language
title_ru: Общение и язык
topic: communication
words:
- acquaint | v | əˈkweɪnt |  | знакомить | to make someone familiar with something | New staff need time to *acquaint* themselves with the rules. | Новым сотрудникам нужно время, чтобы ознакомиться с правилами. | be acquainted with — быть знакомым с
- allege | v | əˈledʒ |  | утверждать (без доказательств) | to claim something without proof | It is *alleged* that the stones have healing powers. | Утверждают, что камни обладают целебной силой. | allegedly — якобы
- brainwash | v | ˈbreɪnwɒʃ | ˈbreɪnwɑːʃ | промывать мозги | to make someone believe ideas by pressure | They were *brainwashed* by the cult. | Секта промыла им мозги.
- circulate | v | ˈsɜːkjəleɪt | ˈsɜːrkjəleɪt | циркулировать, распространяться | to move around a system; to pass from person to person | Blood *circulates* around the body. | Кровь циркулирует по телу. | circulation — кровообращение; тираж
- commend | v | kəˈmend |  | хвалить, рекомендовать | to praise officially | The firefighters were *commended* for bravery. | Пожарных отметили за храбрость.
- concur | v | kənˈkɜː | kənˈkɜːr | соглашаться | to agree | I *concur* with your opinion. | Я согласен с вашим мнением.
- confer | v | kənˈfɜː | kənˈfɜːr | совещаться; присуждать | to discuss together; to give an honour | The experts *conferred* before announcing the results. | Эксперты посовещались, прежде чем объявить результаты.
- confide | v | kənˈfaɪd |  | доверять (секрет) | to tell someone a secret | She *confided* in her sister. | Она доверилась сестре.
- denounce | v | dɪˈnaʊns |  | осуждать, обличать | to criticise strongly in public | Leaders *denounced* the attack. | Лидеры осудили нападение.
- distort | v | dɪˈstɔːt | dɪˈstɔːrt | искажать | to change something so it is no longer true or accurate | The article *distorted* the facts. | Статья исказила факты.
- encode | v | ɪnˈkəʊd | enˈkoʊd | кодировать | to put into code | The message was *encoded*. | Сообщение было закодировано.
- enlighten | v | ɪnˈlaɪtn |  | просвещать | to give someone information so they understand | New research has *enlightened* us about the island's past. | Новые исследования пролили свет на прошлое острова.
- enquire | v | ɪnˈkwaɪə | ɪnˈkwaɪər | справляться, спрашивать (брит.) | to ask for information | I'm calling to *enquire* about the job. | Звоню узнать насчёт вакансии. | амер. inquire
- formulate | v | ˈfɔːmjʊleɪt | ˈfɔːrmjəleɪt | формулировать, разрабатывать | to develop a plan; to express carefully | We need to *formulate* a strategy. | Нам нужно разработать стратегию.
- minimise | v | ˈmɪnɪmaɪz | mˈɪnɪmaɪz | сводить к минимуму | to make as small as possible | We must *minimise* the risks. | Нужно свести риски к минимуму. | амер. minimize
- quip | n | kwɪp |  | острота | a short clever joke | He made a *quip* about the weather. | Он отпустил шутку о погоде.
- recount | v | ˌrɪˈkaʊnt | ˌriːˈkaʊnt | рассказывать | to tell a story | He *recounted* his adventures. | Он рассказал о своих приключениях.
- scoff | v | skɒf | skɔːf | насмехаться | to laugh at something as stupid | They *scoffed* at his idea. | Они высмеяли его идею.
- transcribe | v | trænˈskraɪb | trænsˈkraɪb | расшифровывать, переписывать | to write down spoken words | She *transcribed* the interview. | Она расшифровала интервью.
- wail | v | weɪl |  | выть, вопить, причитать | to cry loudly and sadly | The wind *wailed* through the broken windows. | Ветер выл в разбитых окнах.
