title: Communication and language
title_ru: Общение и язык
topic: communication
words:
- articulate | v | ɑːˈtɪkjuleɪt | ɑːrˈtɪkjuleɪt | чётко формулировать | to express ideas clearly in words | She *articulated* her ideas very clearly. | Она очень чётко изложила свои мысли. | прил. articulate [-lət] — красноречивый
- criteria | n | kraɪˈtɪəriə | kraɪˈtɪriə | критерии | standards used to judge something | The park meets all the *criteria* for World Heritage status. | Парк соответствует всем критериям статуса Всемирного наследия. | ед. ч. criterion
- dispute | n | dɪˈspjuːt |  | спор, разногласие | a serious disagreement | There's a *dispute* between the neighbours about the fence. | У соседей спор из-за забора.
- linguistic | adj | lɪŋˈɡwɪstɪk |  | лингвистический, языковой | connected with language | Children have amazing *linguistic* abilities. | У детей поразительные языковые способности.
