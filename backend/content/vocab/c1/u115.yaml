title: Thinking and opinions
title_ru: Мысли и мнения
topic: mind
words:
- bulk | n | bʌlk |  | основная масса, большая часть; объём | the main part; large size | The *bulk* of the supplies was left behind. | Основную часть припасов оставили позади. | in bulk — оптом
- chill | n | tʃɪl |  | холод, озноб | a feeling of cold | There's a *chill* in the air this morning. | Сегодня утром в воздухе прохлада. | catch a chill — простудиться
- ease | n | iːz |  | лёгкость, непринуждённость | the state of being easy or relaxed | She passed the exam with *ease*. | Она с лёгкостью сдала экзамен. | at ease — непринуждённо
- jurisdiction | n | ˌdʒʊərɪsˈdɪkʃn | ˌdʒʊrɪsˈdɪkʃn | юрисдикция | the official power to make legal decisions | The island is under Chilean *jurisdiction*. | Остров находится под юрисдикцией Чили.
- merit | n | ˈmerɪt |  | достоинство, заслуга | a good quality that deserves praise | The plan has some *merit*. | В этом плане есть свои плюсы.
- privilege | n | ˈprɪvəlɪdʒ |  | привилегия | a special right or advantage | Cheap clothing is a *privilege* paid for by others. | Дешёвая одежда — привилегия, за которую платят другие.
- sin | n | sɪn |  | грех | something wrong according to religious rules | Lying is a *sin* in many religions. | Во многих религиях ложь считается грехом.
- validate | v | ˈvælɪdeɪt |  | подтверждать; одобрять | to prove something is true; to make someone feel their feelings are accepted | 'Likes' make many users feel *validated*. | Лайки дают многим пользователям ощущение одобрения.
