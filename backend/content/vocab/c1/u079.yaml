title: 'Describing: qualities'
title_ru: 'Описание: свойства и признаки'
topic: describing
words:
- absurd | adj | əbˈsɜːd | əbˈsɜːrd | абсурдный, нелепый | completely stupid or unreasonable | The idea seems *absurd* today. | Сегодня эта идея кажется абсурдной.
- accountable | adj | əˈkaʊntəbl |  | ответственный, подотчётный | responsible for your actions and expected to explain them | Politicians must be held *accountable* for their decisions. | Политики должны отвечать за свои решения. | hold somebody accountable — призвать к ответу
- adverse | adj | ˈædvɜːs | ædˈvɜːrs | неблагоприятный, вредный | negative and harmful | The chemical has *adverse* effects on marine life. | Это вещество неблагоприятно воздействует на морскую жизнь.
- crude | adj | kruːd |  | грубый, примитивный; сырой | simple and not skilfully made; in a natural state | They used *crude* stone tools. | Они пользовались примитивными каменными орудиями. | crude oil — сырая нефть
- dense | adj | dens |  | плотный, густой | thick and close together | A *dense* forest surrounded the village. | Деревню окружал густой лес.
- elaborate | adj | ɪˈlæbərət |  | тщательно продуманный, сложный | detailed and complicated | They made an *elaborate* plan to invade England. | Они разработали сложный план вторжения в Англию.
- fragile | adj | ˈfrædʒaɪl | ˈfrædʒl | хрупкий | easily broken or damaged | Be careful with that box — it's *fragile*. | Осторожно с этой коробкой — она хрупкая.
- immense | adj | ɪˈmens |  | огромный, необъятный | extremely large | The project required an *immense* amount of work. | Проект потребовал огромного объёма работы.
- intact | adj | ɪnˈtækt |  | целый, неповреждённый | not damaged | Amazingly, the hut remained *intact*. | Удивительно, но хижина осталась цела.
- intimate | adj | ˈɪntɪmət |  | близкий, интимный; глубокий | very close and personal; detailed | She has an *intimate* knowledge of the subject. | Она глубоко знает этот предмет.
- stark | adj | stɑːk | stɑːrk | резкий, суровый; явный | very plain; obvious and unpleasant | The plague was a *stark* reminder of human weakness. | Чума была суровым напоминанием о человеческой слабости.
