title: Law and crime
title_ru: Закон и преступность
topic: law
words:
- appeal against a verdict | phr |  |  | обжаловать приговор | to ask a higher court to change a decision | He plans to *appeal against the verdict*. | Он собирается обжаловать приговор.
- capital punishment | n | ˈkæpɪtl ˈpʌnɪʃmənt | ˈkæpətl ˈpʌnɪʃmənt | смертная казнь | punishment by death | Many countries have abolished *capital punishment*. | Многие страны отменили смертную казнь.
- community service | n | kəˈmjuːnɪti ˈsɜːvɪs | kəmˈjuːnəti ˈsɜːrvəs | общественные работы | unpaid work as a punishment | He was sentenced to 100 hours of *community service*. | Его приговорили к 100 часам общественных работ.
- corporal punishment | n | ˈkɔːprəl ˈpʌnɪʃmənt | ˈkɔːrpərəl ˈpʌnɪʃmənt | телесные наказания | physical punishment | *Corporal punishment* is banned in schools. | Телесные наказания в школах запрещены.
- crime rate | n | kraɪm reɪt |  | уровень преступности | the amount of crime | The *crime rate* has fallen. | Уровень преступности снизился.
- crime wave | n | kraɪm weɪv |  | волна преступности | a sudden increase in crime | The city faced a *crime wave*. | Город захлестнула волна преступности.
- death penalty | n | deθ ˈpenəlti |  | смертная казнь | punishment by death | Should the *death penalty* be abolished? | Нужно ли отменить смертную казнь?
- drug trafficking | n | drʌɡ ˈtræfɪkɪŋ |  | наркоторговля | the illegal trade in drugs | He was jailed for *drug trafficking*. | Его посадили за наркоторговлю.
- juvenile delinquency | n | ˈdʒuːvənaɪl dɪˈlɪnkwənsi | ˈdʒuːvənaɪl dɪˈlɪŋkwənsi | преступность несовершеннолетних | crime by young people | *Juvenile delinquency* is rising. | Подростковая преступность растёт.
- law enforcement | n | lɔː ɪnˈfɔːsmənt | lɑː enˈfɔːrsmənt | правоохранительные органы | the police and other agencies | *Law enforcement* agencies worked together. | Правоохранительные органы действовали сообща.
- life imprisonment | n | laɪf ɪmˈprɪzənmənt | laɪf ˌɪmˈprɪzənmənt | пожизненное заключение | prison for the rest of your life | He was sentenced to *life imprisonment*. | Его приговорили к пожизненному заключению.
- magistrate | n | ˈmædʒɪstreɪt | ˈmædʒəstreɪt | мировой судья | a judge in a local court | He appeared before a *magistrate*. | Он предстал перед мировым судьёй.
- organised crime | n | ˈɔːɡənaɪzd kraɪm | ˈɔːɡɐnaɪzd kraɪm | организованная преступность | crime by criminal groups | Police are fighting *organised crime*. | Полиция борется с организованной преступностью. | амер. organized crime
- petty crime | n | ˈpeti kraɪm | ˈpetiː kraɪm | мелкое правонарушение | minor crime | *Petty crime* is common in tourist areas. | В туристических местах распространены мелкие кражи.
- prosecutor | n | ˈprɒsɪkjuːtə | ˈprɑːsɪkjuːtər | прокурор, обвинитель | a lawyer who accuses someone in court | The *prosecutor* asked for a long sentence. | Прокурор потребовал большой срок.
- reoffend | v | riɔːˈfend | riːɔːˈfend | совершить повторное преступление | to commit another crime | Many prisoners *reoffend*. | Многие заключённые снова совершают преступления.
- serve on a jury | phr |  |  | быть присяжным | to be a member of a jury | I was asked to *serve on a jury*. | Меня вызвали в присяжные.
- suspended sentence | n | səˈspendɪd ˈsentəns |  | условный срок | a sentence that doesn't start unless you reoffend | He got a *suspended sentence*. | Ему дали условный срок.
- victimless crime | n | ˈvɪktɪmləs kraɪm | ˈvɪktəmləs kraɪm | преступление без жертв | a crime that harms nobody directly | Some say tax evasion is a *victimless crime*. | Некоторые считают уклонение от налогов преступлением без жертв.
- violent crime | n | ˈvaɪələnt kraɪm |  | насильственное преступление | crime involving violence | *Violent crime* has decreased. | Насильственных преступлений стало меньше.
- white-collar crime | n |  |  | беловоротничковая преступность | crime by office workers, like fraud | Fraud is a *white-collar crime*. | Мошенничество — беловоротничковое преступление.
