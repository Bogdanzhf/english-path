title: Events and situations
title_ru: События и ситуации
topic: events
words:
- conversion | n | kənˈvɜːʃn | kənˈvɜːrʒn | превращение, переоборудование; конвертация | the process of changing from one form or use to another | The *conversion* of the old factory into flats took two years. | Переоборудование старой фабрики в квартиры заняло два года.
- fate | n | feɪt |  | судьба, рок | a power that decides what will happen | It was *fate* that brought them together. | Их свела судьба.
- omission | n | əˈmɪʃn | oʊˈmɪʃn | пропуск, упущение | something left out | The *omission* of salt made the soup tasteless. | Из-за того, что забыли посолить, суп был безвкусным. | omit — пропускать
