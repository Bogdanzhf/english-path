title: Actions and movement
title_ru: Действия и движение
topic: actions
words:
- abound | v | əˈbaʊnd |  | изобиловать | to exist in large numbers | Rumours *abound*. | Ходит масса слухов.
- coexist | v | ˌkəʊɪɡˈzɪst | ˌkoʊɪɡˈzɪst | сосуществовать | to exist together at the same time or place | Ancient and modern buildings *coexist* in the city. | В городе соседствуют старинные и современные здания.
- converge | v | kənˈvɜːdʒ | kənˈvɜːrdʒ | сходиться | to come together | The roads *converge* in the centre. | Дороги сходятся в центре.
- correlate | v | ˈkɒrəleɪt | ˈkɔːrəleɪt | соотноситься, коррелировать | to have a close connection where one thing changes with another | Income often *correlates* with level of education. | Доход часто связан с уровнем образования. | correlation — корреляция
- defer | v | dɪˈfɜː | dɪˈfɜːr | откладывать, отсрочивать | to delay something until later | They *deferred* the decision until next year. | Они отложили решение до следующего года.
- embody | v | ɪmˈbɒdi | ɪmˈbɑːdi | воплощать | to represent an idea or quality | He *embodies* the spirit of the team. | Он воплощает дух команды.
- encompass | v | ɪnˈkʌmpəs | enˈkʌmpəs | охватывать | to include | The course *encompasses* many topics. | Курс охватывает множество тем.
- ensue | v | ɪnˈsjuː | ɪnˈsuː | следовать, возникать (в результате) | to happen after | A long argument *ensued*. | Последовал долгий спор.
- harmonize | v | ˈhɑːmənaɪz | ˈhɑːrmənaɪz | гармонировать, согласовывать | to fit together well; to sing in harmony | The music *harmonizes* perfectly with the lighting. | Музыка идеально гармонирует с освещением. | брит. также harmonise
- implicate | v | ˈɪmplɪkeɪt |  | вовлекать, указывать на причастность | to show that someone is involved in a crime | The evidence *implicated* a local artist. | Улики указывали на причастность местного художника.
- incur | v | ɪnˈkɜː | ˌɪnˈkɜːr | понести (расходы, потери) | to have something bad happen | You'll *incur* extra charges. | Вы понесёте дополнительные расходы.
- intrigue | v | ɪnˈtriːɡ |  | интриговать, вызывать интерес | to make someone very interested | Scientists are *intrigued* by these communities. | Учёных очень интересуют эти общины.
- linger | v | ˈlɪŋɡə | ˈlɪŋɡər | задерживаться, сохраняться | to stay longer than usual | The smell of smoke *lingered* in the air. | Запах дыма ещё долго держался в воздухе.
- loom | v | luːm |  | маячить, надвигаться | to appear as a large threatening shape | Exams are *looming*. | Надвигаются экзамены.
- originate | v | əˈrɪdʒɪneɪt |  | происходить, возникать | to start or come from a place | The game *originated* in China. | Эта игра возникла в Китае.
- outnumber | v | ˌaʊtˈnʌmbə | ˌaʊtˈnʌmbər | превосходить численностью | to be more in number than | Tourists *outnumber* local residents in summer. | Летом туристов больше, чем местных жителей.
- perpetuate | v | pəˈpetʃuːeɪt | pərˈpetʃəweɪt | увековечивать, сохранять | to make continue | The film *perpetuates* stereotypes. | Фильм закрепляет стереотипы.
- 'populate | v | ˈpɒpjuleɪt | ˈpɑːpjuleɪt | населять | to live in a place | The island is *populated* by fishermen. | Остров населён рыбаками. | чаще в пассиве: be populated'
- tangle | v | ˈtæŋɡl |  | спутывать(ся) | to twist together into a messy mass | The wind *tangled* her long hair. | Ветер спутал её длинные волосы.
- underlie | v | ˌʌndəˈlaɪ | ˌʌndərˈlaɪ | лежать в основе | to be the basic cause of | Poverty *underlies* many social problems. | Бедность лежит в основе многих социальных проблем.
