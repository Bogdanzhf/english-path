title: Actions and movement
title_ru: Действия и движение
topic: actions
words:
- adjoin | v | əˈdʒɔɪn |  | примыкать, граничить | to be next to and joined to | The farm *adjoins* the river. | Ферма примыкает к реке.
- assemble | v | əˈsembl |  | собирать(ся); монтировать | to come together in a group; to put parts together | Crowds *assemble* at the stones every summer. | Каждое лето у камней собираются толпы.
- conceive | v | kənˈsiːv |  | задумать, представить | to think of a plan or idea | The emperor *conceived* the idea of an army for the afterlife. | Император задумал создать армию для загробной жизни.
- deform | v | dɪˈfɔːm | dɪˈfɔːrm | деформировать | to change the normal shape of something | Cheap shoes can *deform* your feet. | Дешёвая обувь может деформировать стопы.
- depict | v | dɪˈpɪkt |  | изображать | to show in a picture or describe in words | The painting *depicts* the explorers' last days. | Картина изображает последние дни исследователей.
- engrave | v | ɪnˈɡreɪv |  | гравировать, вырезать | to cut words or pictures into a hard surface | Each weapon was *engraved* with the maker's name. | На каждом оружии было выгравировано имя мастера.
- forge | v | fɔːdʒ | fɔːrdʒ | ковать; подделывать | to make metal objects by heating; to make an illegal copy | He *forged* a sword from a piece of iron. | Он выковал меч из куска железа.
- induce | v | ɪnˈdjuːs | ɪnˈduːs | вызывать; побуждать | to cause something to happen; to persuade | The drug may *induce* sleepiness. | Препарат может вызывать сонливость.
- invoke | v | ɪnˈvəʊk | ɪnˈvoʊk | ссылаться на; взывать | to mention something to support an argument; to call on a god | He *invoked* the full moon to explain his bad mood. | Своё плохое настроение он объяснял полнолунием.
- misplace | v | ˌmɪsˈpleɪs |  | положить не на место, потерять | to lose something because you can't remember where you put it | I've *misplaced* my glasses again. | Я опять куда-то задевал очки.
- simulate | v | ˈsɪmjuleɪt |  | моделировать, имитировать | to create conditions that are like real ones | Astronauts trained in machines that *simulate* weightlessness. | Астронавты тренировались на аппаратах, имитирующих невесомость.
