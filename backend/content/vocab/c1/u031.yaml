title: Work and jobs
title_ru: Работа и профессии
topic: work
words:
- admiral | n | ˈædmərəl |  | адмирал | an officer of the highest rank in the navy | The *admiral* commanded the whole fleet. | Адмирал командовал всем флотом.
- ambassador | n | æmˈbæsədə | æmˈbæsədər | посол | an official who represents his or her country in another country | The French *ambassador* met the president. | Посол Франции встретился с президентом.
- carpenter | n | ˈkɑːpəntə | ˈkɑːrpəntər | плотник | a person who makes things from wood | The *carpenter* made us a new kitchen table. | Плотник сделал нам новый кухонный стол.
- diplomat | n | ˈdɪpləmæt |  | дипломат | an official who represents his or her country abroad | He worked as a *diplomat* in Paris. | Он работал дипломатом в Париже.
- managerial | adj | ˌmænəˈdʒɪəriəl | ˌmænəˈdʒɪriəl | управленческий | connected with managers and their work | She has strong *managerial* skills. | У неё сильные управленческие навыки.
- physician | n | fɪˈzɪʃn |  | врач, терапевт | a medical doctor (formal) | She consulted a *physician*. | Она проконсультировалась у врача. | не «физик» (это physicist)
- practitioner | n | prækˈtɪʃənə | prækˈtɪʃənər | практикующий врач, специалист | a person who works in a profession, especially medicine | See your local medical *practitioner*. | Обратитесь к своему участковому врачу. | GP = general practitioner — терапевт
