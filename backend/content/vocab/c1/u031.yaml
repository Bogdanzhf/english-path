title: Education
title_ru: Учёба
topic: education
words:
- academic integrity | n | ˌækəˈdemɪk ɪnˈteɡrɪti | ˌækəˈdemɪk ˌɪnˈteɡrəti | академическая честность | honesty in study | Plagiarism breaks *academic integrity*. | Плагиат нарушает академическую честность.
- accreditation | n | əˌkredɪˈteɪʃən | əˌkredəˈteɪʃən | аккредитация | official approval | The course has full *accreditation*. | Курс полностью аккредитован.
- acquisition | n | ˌækwɪˈzɪʃn |  | приобретение | something you have obtained; the act of getting it | The museum's latest *acquisition* is a Spanish cannon. | Последнее приобретение музея — испанская пушка.
- admissions | n | ədˈmɪʃənz | ædˈmɪʃənz | приём (в вуз) | the process of accepting students | The university *admissions* office is closed. | Приёмная комиссия университета закрыта.
- alumni | n | əˈlʌmni | əˈlʌmnaɪ | выпускники | former students | The school has famous *alumni*. | У школы есть знаменитые выпускники. | ед. ч. alumnus
- attendance | n | əˈtendəns |  | посещаемость | being present | *Attendance* at lectures is compulsory. | Посещение лекций обязательно.
- blended learning | n | ˈblendɪd ˈlɜːnɪŋ | ˈblendɪd ˈlɜːrnɪŋ | смешанное обучение | combining online and classroom learning | The college offers *blended learning*. | Колледж предлагает смешанное обучение.
- broaden your horizons | phr |  |  | расширить кругозор | to experience new things | Travel can *broaden your horizons*. | Путешествия расширяют кругозор.
- bursary | n | ˈbɜːsəri | bˈɜːsəri | стипендия (брит.) | money given to a student | She won a *bursary* to study music. | Она получила стипендию на учёбу музыке.
- computer literate | adj | kəmˈpjuːtə ˈlɪtərət | kəmˈpjuːtər ˈlɪtərət | владеющий компьютером | able to use computers | Applicants must be *computer literate*. | Кандидаты должны владеть компьютером.
- conservatory | n | kənˈsɜːvətəri | kənˈsɜːrvətɔːri | консерватория; зимний сад | a music school; a glass room | She studied at the Moscow *Conservatory*. | Она училась в Московской консерватории.
- enrol | v | ɪnˈrəʊl | enrˈəʊl | записываться, поступать | to join a course | I've *enrolled* on a Spanish course. | Я записался на курс испанского. | амер. enroll
- fellowship | n | ˈfeləʊʃɪp | ˈfeloʊʃɪp | стипендия (исследовательская); товарищество | a research grant; friendship | She won a research *fellowship*. | Она получила исследовательскую стипендию.
- literacy | n | ˈlɪtərəsi |  | грамотность | the ability to read and write | Adult *literacy* has improved. | Грамотность взрослых повысилась.
- numeracy | n | ˈnjuːmərəsi | njˈuːmərəsi | умение считать, базовые математические навыки | basic maths skills | The test checks *numeracy*. | Тест проверяет навыки счёта.
- pedagogy | n | ˈpedəɡɒɡi | ˈpedəɡoʊdʒi | педагогика | the method of teaching | Modern *pedagogy* focuses on the student. | Современная педагогика сосредоточена на ученике.
- procrastinate | v | prəˈkrɑːstɪneɪt | prəˈkræstəneɪt | откладывать на потом | to delay doing something | Stop *procrastinating* and start working! | Хватит откладывать, начинай работать!
- tech-savvy | adj | ˈtek sævi |  | технически подкованный | good with technology | Young people are very *tech-savvy*. | Молодёжь хорошо разбирается в технике.
- tuition | n | tjuˈɪʃn | tuˈɪʃn | обучение; плата за обучение | teaching; the money paid for it | *Tuition* fees at art schools are very high. | Плата за обучение в художественных школах очень высокая.
- undergraduate | n | ˌʌndəˈɡrædʒuət | ˌʌndərˈɡrædʒuət | студент (бакалавриата) | a university student studying for a first degree | She's an *undergraduate* at Cambridge. | Она студентка бакалавриата в Кембридже.
