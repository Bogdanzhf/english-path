title: Place and direction
title_ru: Место и направление
topic: place
words:
- adjacent | adj | əˈdʒeɪsnt |  | соседний, смежный | next to or near something | The bike station is *adjacent* to the metro. | Велостанция находится рядом с метро.
- adjoining | adj | əˈdʒɔɪnɪŋ |  | соседний, смежный | next to and joined to | They stayed in *adjoining* rooms. | Они жили в соседних номерах.
- boundary | n | ˈbaʊndri |  | граница, предел | a line that marks the edge of an area | The river forms the *boundary* between the two states. | Река образует границу между двумя штатами.
- bounds | n | baʊndz |  | пределы, границы | limits | Her energy seemed to know no *bounds*. | Её энергия, казалось, не знала границ. | out of bounds — вход запрещён
- midst | n | mɪdst |  | середина, гуща | the middle of something | We are in the *midst* of a climate crisis. | Мы находимся в разгаре климатического кризиса.
- periphery | n | pəˈrɪfəri |  | периферия, окраина | the outer edge of an area | The pits are on the *periphery* of the tomb. | Ямы расположены по периметру гробницы.
- secluded | adj | sɪˈkluːdɪd |  | уединённый | quiet and hidden from other people | They nest on *secluded* beaches. | Они гнездятся на уединённых пляжах.
- situated | adj | ˈsɪtʃueɪtɪd |  | расположенный | in a particular place | The hotel is *situated* near the beach. | Отель расположен рядом с пляжем.
- whereabouts | n | ˈweərəbaʊts | ˈwerəbaʊts | местонахождение | the place where someone or something is | Their *whereabouts* remained unknown for months. | Их местонахождение месяцами оставалось неизвестным.
