title: Idioms
title_ru: Идиомы
topic: idioms
words:
- keep a low profile | phr |  |  | не привлекать внимания | to avoid attention | He's *keeping a low profile* after the scandal. | После скандала он старается не высовываться.
- leave no stone unturned | phr |  |  | сделать всё возможное | to search everywhere | The police *left no stone unturned*. | Полиция сделала всё возможное.
- make ends meet | phr |  |  | сводить концы с концами | to have just enough money | They struggle to *make ends meet*. | Они с трудом сводят концы с концами.
- move the goalposts | phr |  |  | менять правила по ходу игры | to change the rules unfairly | Stop *moving the goalposts*! | Хватит менять правила на ходу!
- off the top of your head | phr |  |  | навскидку, сходу | without checking | *Off the top of my head*, I'd say 50. | Навскидку — около 50.
- on the ball | phr |  |  | сообразительный, начеку | quick to understand | She's really *on the ball*. | Она очень сообразительная.
- play it by ear | phr |  |  | действовать по обстоятельствам | to decide as things happen | Let's *play it by ear*. | Будем действовать по обстоятельствам.
- put all your eggs in one basket | phr |  |  | ставить всё на одну карту | to risk everything on one thing | Don't *put all your eggs in one basket*. | Не ставь всё на одну карту.
- rule of thumb | phr |  |  | эмпирическое правило | a practical general rule | As a *rule of thumb*, drink two litres a day. | Как правило, пейте два литра в день.
- take the bull by the horns | phr |  |  | взять быка за рога | to deal with a problem directly | It's time to *take the bull by the horns*. | Пора брать быка за рога.
- the elephant in the room | phr |  |  | слон в комнате (очевидная проблема, которую игнорируют) | an obvious problem nobody talks about | Money is *the elephant in the room*. | Деньги — проблема, о которой все молчат.
- think outside the box | phr |  |  | мыслить нестандартно | to think creatively | We need to *think outside the box*. | Нам нужно мыслить нестандартно.
- throw in the towel | phr |  |  | сдаться | to give up | Don't *throw in the towel* yet! | Не сдавайся пока!
- turn a blind eye | phr |  |  | закрывать глаза (на что-либо) | to ignore something wrong | The teacher *turned a blind eye* to it. | Учитель закрыл на это глаза.
- up in the air | phr |  |  | под вопросом, не решено | not decided | Our plans are still *up in the air*. | Наши планы пока под вопросом.
- wear many hats | phr |  |  | совмещать много ролей | to have many jobs or roles | In a small company you *wear many hats*. | В маленькой компании приходится совмещать много ролей.
