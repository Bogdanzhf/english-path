title: Home and everyday life
title_ru: Дом и быт
topic: home
words:
- attire | n | əˈtaɪə | əˈtaɪər | одеяние, наряд (офиц.) | clothes, especially formal ones | Formal *attire* is required for the dinner. | На ужин требуется официальная форма одежды.
- cabinet | n | ˈkæbɪnət | ˈkæbənət | шкаф(чик); кабинет министров | a cupboard; the main ministers | The glasses are in the kitchen *cabinet*. | Бокалы в кухонном шкафчике.
- lavatory | n | ˈlævətəri | ˈlævətɔːri | уборная | a toilet | Where's the *lavatory*? | Где уборная?
- mask | n | mɑːsk | mæsk | маска | a cover for the face | Wear a *mask* on the bus. | Надевайте маску в автобусе.
- nursery | n | ˈnɜːsəri | ˈnɜːrsəri | детская (комната); детский сад; питомник | a room for babies; a place for young children; a place where plants are grown | The monks run a plant *nursery*. | Монахи содержат питомник растений.
- overalls | n | ˌəʊvəˈrɔːlz | ˈoʊvərɔːlz | комбинезон; рабочий халат | a piece of work clothing | The painter wore white *overalls*. | Маляр был в белом комбинезоне.
- partition | n | pɑːˈtɪʃən | pɑːrˈtɪʃən | перегородка; раздел | a thin wall; a division | A glass *partition* separates the offices. | Кабинеты разделяет стеклянная перегородка.
- radiator | n | ˈreɪdɪeɪtə | ˈreɪdiːeɪtər | батарея (отопления); радиатор | a metal device that heats a room | Put your gloves on the *radiator*. | Положи перчатки на батарею.
- residence | n | ˈrezɪdəns |  | резиденция, место жительства | a home | This is the president's official *residence*. | Это официальная резиденция президента.
- sauna | n | ˈsɔːnə |  | сауна | a hot room for relaxing | We went to the *sauna* after swimming. | После бассейна мы пошли в сауну.
- settee | n | seˈtiː | setˈiː | диван, софа (брит.) | a sofa | We sat on the *settee*. | Мы сели на диван.
- utility | n | juːˈtɪləti |  | коммунальная услуга | a service such as gas, water or electricity | The rent doesn't include *utilities*. | Коммунальные услуги в арендную плату не входят. | utility bills — счета за коммуналку
- weave | v | wiːv |  | ткать; плести | to make cloth by crossing threads | She *weaves* carpets by hand. | Она ткёт ковры вручную. | weave – wove – woven
