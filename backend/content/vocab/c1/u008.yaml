title: Food and drink
title_ru: Еда и напитки
topic: food
words:
- calorie | n | ˈkæləri |  | калория | a unit for measuring the energy in food | Climbers burn up to 10,000 *calories* a day. | Альпинисты сжигают до 10 000 калорий в день.
- cater | v | ˈkeɪtə | ˈkeɪtər | обслуживать, удовлетворять потребности | to provide what a group needs or wants | The park *caters* for visitors of all ages. | Парк рассчитан на посетителей всех возрастов. | cater for/to
- gourmet | adj | ˈɡʊəmeɪ | ɡʊrˈmeɪ | гурманский, изысканный | (of food) of very high quality | The hotel serves *gourmet* food. | В отеле подают изысканные блюда. | t не читается
- grapefruit | n | ˈɡreɪpfruːt |  | грейпфрут | a large, round, yellow citrus fruit | I have half a *grapefruit* for breakfast. | На завтрак я съедаю половину грейпфрута.
