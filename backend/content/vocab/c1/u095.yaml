title: Environment and energy
title_ru: Экология и энергия
topic: environment
words:
- biosphere | n | ˈbaɪəʊsfɪə | ˈbaɪoʊsfɪr | биосфера | the parts of the Earth where life exists | Life exists in almost every corner of the *biosphere*. | Жизнь существует почти в каждом уголке биосферы.
- deplete | v | dɪˈpliːt |  | истощать | to reduce the amount of something | The war *depleted* the country's resources. | Война истощила ресурсы страны.
