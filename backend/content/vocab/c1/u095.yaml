title: Events and situations
title_ru: События и ситуации
topic: events
words:
- advocacy | n | ˈædvəkəsi |  | защита, пропаганда, поддержка | public support for an idea or cause | The group is known for its *advocacy* of animal rights. | Группа известна своей защитой прав животных.
- deployment | n | dɪˈplɔɪmənt |  | размещение, развёртывание | sending troops or resources | The *deployment* of troops began. | Началось развёртывание войск.
- elimination | n | ɪˌlɪmɪˈneɪʃən | ɪˌlɪməˈneɪʃən | устранение; выбывание | removing | The *elimination* of poverty is our goal. | Наша цель — искоренение бедности.
- exploitation | n | ɪksplɔɪˈteɪʃən | ˌeksˌplɔɪˈteɪʃən | эксплуатация | treating unfairly for profit | Child *exploitation* is a crime. | Эксплуатация детей — преступление.
- feat | n | fiːt |  | подвиг, достижение | an achievement that needs great skill or strength | Surviving in space is an incredible *feat*. | Выжить в космосе — невероятное достижение.
- inheritance | n | ɪnˈherɪtəns | ˌɪnˈherətəns | наследство | money from someone who died | She received a large *inheritance*. | Она получила большое наследство.
- injustice | n | ɪnˈdʒʌstɪs |  | несправедливость | a situation that is not fair | He spent his life fighting *injustice*. | Он всю жизнь боролся с несправедливостью.
- intake | n | ˈɪnteɪk |  | потребление; набор | the amount of food or drink you take in | Reduce your *intake* of salt. | Сократите потребление соли.
- manipulation | n | məˌnɪpjʊˈleɪʃən | məˌnɪpjəˈleɪʃən | манипуляция | controlling unfairly | Media *manipulation* is common. | Манипуляции в СМИ — обычное дело.
- modification | n | ˌmɒdɪfɪˈkeɪʃən | ˌmɑːdəfəˈkeɪʃən | изменение, модификация | a small change | We made a few *modifications*. | Мы внесли несколько изменений.
- rebellion | n | rɪˈbeliən | rɪˈbeljən | восстание, бунт | fighting against authority | The *rebellion* was crushed. | Восстание подавили.
- referendum | n | ˌrefəˈrendəm |  | референдум | a public vote on one question | They held a *referendum* on independence. | Провели референдум о независимости.
- rejection | n | rɪˈdʒekʃən | riːˈdʒekʃən | отказ, неприятие | refusing to accept | I got another *rejection* letter. | Я снова получил письмо с отказом.
- retention | n | rɪˈtenʃən | riːˈtenʃən | удержание, сохранение | keeping | Staff *retention* is a problem. | Удержание сотрудников — проблема.
- revival | n | rɪˈvaɪvl | riːˈvaɪvl | возрождение | becoming popular again | There's been a *revival* of interest in vinyl. | Интерес к винилу возродился.
- salvation | n | sælˈveɪʃən |  | спасение | being saved | The new job was his *salvation*. | Новая работа стала для него спасением.
- simulation | n | ˌsɪmjʊˈleɪʃən | ˌsɪmjəˈleɪʃən | симуляция, моделирование | a model of a real situation | Pilots train on a flight *simulation*. | Пилоты тренируются на авиатренажёре.
- stretching | n | ˈstretʃɪŋ |  | растяжка | exercises to stretch muscles | Do some *stretching* before running. | Сделайте растяжку перед бегом.
- supervision | n | suːpəˈvɪʒən | ˌsuːpərˈvɪʒən | надзор, руководство | watching over | Children need adult *supervision*. | Детям нужен присмотр взрослых.
