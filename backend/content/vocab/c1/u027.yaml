title: Work and jobs
title_ru: Работа и профессии
topic: work
words:
- apprenticeship | n | əˈprentɪsʃɪp | əˈprentəsʃɪp | ученичество, обучение ремеслу | training in a skilled job | He did an *apprenticeship* as a plumber. | Он учился на сантехника.
- automation | n | ˌɔːtəˈmeɪʃən | ɔːtəˈmeɪʃən | автоматизация | using machines instead of people | *Automation* has replaced many jobs. | Автоматизация заменила многие рабочие места.
- blue-collar | adj | ˌbluː ˈkɒlə | ˌbluː ˈkɑːlər | рабочий (о профессиях физического труда) | relating to manual work | He comes from a *blue-collar* family. | Он из рабочей семьи.
- burnout | n | ˈbɜːnaʊt | ˈbɜːrnaʊt | эмоциональное выгорание | exhaustion from too much work | Many nurses suffer from *burnout*. | Многие медсёстры страдают от выгорания.
- "career prospects | n | kəˈriə pr\x01ːspeks | kəˈrɪr ˈprɑːspeks | карьерные перспективы | chances of progress in a job | The job has good *career prospects*. | У этой работы хорошие перспективы."
- commerce | n | ˈkɒmɜːs | ˈkɑːmɜːrs | торговля, коммерция | the buying and selling of goods | The city was a centre of *commerce*. | Город был центром торговли.
- enterprise | n | ˈentəpraɪz | ˈentərpraɪz | предприятие; предприимчивость | a business; the ability to start new projects | She started a small *enterprise* selling baskets. | Она открыла небольшое дело по продаже корзин.
- entrepreneurship | n | ˌɒntrɪprɪˈnɜːʃɪp | ˌɑːntrəprəˈnɜːrʃɪp | предпринимательство | starting businesses | The government supports *entrepreneurship*. | Правительство поддерживает предпринимательство.
- gig economy | n | ɡɪɡ ɪˈkɒnəmi | ɡɪɡ iːˈkɑːnəmi | гиг-экономика (временная занятость) | work made of short-term jobs | Many young people work in the *gig economy*. | Многие молодые люди работают на подработках.
- glass ceiling | n | ɡlɑːs ˈsiːlɪŋ | ɡlæs ˈsiːlɪŋ | стеклянный потолок | an unofficial barrier to promotion | She broke through the *glass ceiling*. | Она пробила стеклянный потолок.
- headhunt | v | ˈhedhʌnt |  | переманивать (сотрудника) | to recruit someone from another company | She was *headhunted* by a rival firm. | Её переманила конкурирующая фирма.
- "job security | n | ˈdʒ\x01ːb sɪˈkjɔːrɪti | dʒɑːb sɪkˈjʊrəti | стабильность работы | being safe from losing your job | Teachers have good *job security*. | У учителей стабильная работа."
- labour market | n | ˈleɪbə ˈmɑːkɪt | ˈleɪbər ˈmɑːrkət | рынок труда | the supply of workers and jobs | The *labour market* is very competitive. | На рынке труда высокая конкуренция. | амер. labor market
- outsourcing | n | aʊtˈsɔːsɪŋ | ˌaʊtˈsɔːrsɪŋ | аутсорсинг | paying another company to do work | *Outsourcing* saves money. | Аутсорсинг экономит деньги.
- pastor | n | ˈpɑːstə | ˈpæstər | пастор | a minister in charge of a Protestant church | The *pastor* spoke to the people after the service. | После службы пастор обратился к прихожанам.
- perks | n | pɜːks | pɜːrks | льготы, бонусы | extra benefits of a job | The job has many *perks*. | У этой работы много бонусов.
- productivity | n | ˌprɒdəkˈtɪvɪti | ˌproʊdəkˈtɪvəti | производительность | the rate of producing | Breaks can improve *productivity*. | Перерывы могут повысить производительность.
- shipping | n | ˈʃɪpɪŋ |  | доставка, перевозка | sending goods | *Shipping* is free on orders over £50. | Доставка бесплатна при заказе от 50 фунтов.
- supervisor | n | ˈsuːpəvaɪzə | ˈsuːpərvaɪzər | руководитель, начальник | a person in charge of workers | Ask your *supervisor*. | Спросите у начальника.
- white-collar | adj | ˌwaɪt ˈkɒlə | ˌwaɪt ˈkɑːlər | офисный (о работниках) | relating to office work | He has a *white-collar* job. | Он офисный работник.
