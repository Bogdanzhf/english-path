title: Shopping and money
title_ru: Покупки и деньги
topic: shopping
words:
- accumulate | v | əˈkjuːmjəleɪt |  | накапливать(ся) | to gradually increase in amount | Snow *accumulated* on the slopes for days. | Снег несколько дней скапливался на склонах.
- allocate | v | ˈæləkeɪt |  | выделять, распределять | to give something to someone for a particular purpose | The school *allocated* money for a new kitchen. | Школа выделила деньги на новую кухню.
- compile | v | kəmˈpaɪl |  | составлять, собирать | to collect information and put it together | She *compiled* a list of all the cases. | Она составила список всех случаев.
- discard | v | dɪˈskɑːd | dɪˈskɑːrd | выбрасывать | to throw away something you no longer want | Millions of bottles are *discarded* every day. | Ежедневно выбрасывают миллионы бутылок.
- dispose | v | dɪˈspəʊz | dɪˈspoʊz | избавляться, утилизировать | to get rid of something | Please *dispose* of your rubbish properly. | Пожалуйста, утилизируйте мусор правильно. | dispose of; disposal — утилизация
- retrieve | v | rɪˈtriːv |  | доставать, возвращать | to get something back | I need to *retrieve* my bag from the car. | Мне нужно забрать сумку из машины.
- supplement | v | ˈsʌplɪment |  | дополнять | to add something to make it better or complete | He *supplements* his salary by teaching in the evenings. | Он подрабатывает к зарплате, преподавая по вечерам. | сущ. supplement — добавка
- yield | v | jiːld |  | уступать, сдаваться; давать (урожай) | to give up control; to produce | The rebels refused to *yield*. | Мятежники отказались сдаться. | YIELD — дорожный знак «Уступи дорогу» (амер.)
