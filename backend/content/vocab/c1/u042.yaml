title: Arts and media
title_ru: Искусство и медиа
topic: arts
words:
- anticlimactic | adj | ˌæntiklaɪˈmæktɪk | ˌæntiːklaɪˈmæktɪk | разочаровывающий (после ожидания) | disappointing after excitement | The ending was *anticlimactic*. | Финал разочаровал.
- blockbuster | n | ˈblɒkbʌstə | ˈblɑːkbʌstər | блокбастер | a very successful film or book | It's the summer's biggest *blockbuster*. | Это главный блокбастер лета.
- concerto | n | kənˈtʃɜːtəʊ | kənˈtʃertoʊ | концерт (музыкальное произведение) | a piece of music for a solo instrument and orchestra | We listened to a violin *concerto*. | Мы слушали скрипичный концерт.
- excerpt | n | ˈeksɜːpt | ˈeksɜːrpt | отрывок | a short part of a longer text, film or piece of music | Read this *excerpt* from his letter. | Прочитайте этот отрывок из его письма.
- farce | n | fɑːs | fɑːrs | фарс | a comedy; a ridiculous situation | The meeting was a complete *farce*. | Собрание превратилось в настоящий фарс.
- flashback | n | ˈflæʃbæk |  | флешбэк, воспоминание | a scene from the past in a film | The story is told in *flashbacks*. | История рассказана через воспоминания.
- folktale | n | ˈfəʊkteɪl | ˈfoʊkteɪl | народная сказка | a traditional story | It's an old Russian *folktale*. | Это старая русская народная сказка.
- footage | n | ˈfʊtɪdʒ |  | (видео)материал, кадры | recorded film | Police checked the CCTV *footage*. | Полиция проверила записи камер наблюдения.
- gambling | n | ˈɡæmblɪŋ | ˈɡæmbəlɪŋ | азартные игры | betting money on games | *Gambling* can become an addiction. | Азартные игры могут стать зависимостью.
- instrumental | adj | ˌɪnstrəˈmentl | ˌɪnstrəˈmenl | инструментальный; сыгравший важную роль | for instruments; very important in causing | She was *instrumental* in the project's success. | Она сыграла ключевую роль в успехе проекта.
- manuscript | n | ˈmænjuːskrɪpt | ˈmænjəskrɪpt | рукопись | a handwritten or original text | She sent the *manuscript* to a publisher. | Она отправила рукопись издателю.
- melody | n | ˈmelədi |  | мелодия | a tune | The song has a beautiful *melody*. | У песни красивая мелодия.
- memoir | n | ˈmemwɑː | ˈmemwɑːr | мемуары | a book about your life | She wrote a *memoir* about her childhood. | Она написала мемуары о детстве.
- motif | n | məʊˈtiːf | moʊˈtiːf | мотив, узор | a repeated idea or pattern | Water is a key *motif* in the novel. | Вода — ключевой мотив романа.
- mythological | adj | ˌmɪθəˈlɒdʒɪkl | ˌmɪθəˈlɑːdʒɪkl | мифологический | relating to myths | Zeus is a *mythological* figure. | Зевс — мифологический персонаж.
- mythology | n | mɪˈθɒlədʒi | məˈθɑːlədʒiː | мифология | a collection of myths | I love Greek *mythology*. | Я обожаю греческую мифологию.
- puzzle | v | ˈpʌzl |  | озадачивать | to confuse | His answer *puzzled* me. | Его ответ меня озадачил.
- satire | n | ˈsætaɪə | ˈsætaɪər | сатира | humour that criticizes people or ideas | The film is a *satire* on modern politics. | Фильм — сатира на современную политику.
- screenplay | n | ˈskriːnpleɪ |  | сценарий | the script of a film | She wrote the *screenplay*. | Она написала сценарий.
- sketch | n | sketʃ |  | набросок; скетч | a quick drawing; a short comedy scene | She made a *sketch* of the church. | Она сделала набросок церкви.
- sketchbook | n | ˈsketʃbʊk |  | альбом для рисования | a book for drawing | He always carries a *sketchbook*. | Он всегда носит с собой альбом для набросков.
- suite | n | swit | swiːt | люкс (номер); сюита; набор | a set of rooms; a piece of music | We stayed in a luxury *suite*. | Мы жили в номере-люкс.
- target audience | n | ˈtɑːɡɪt ˈɔːdiəns | ˈtɑːrɡət ˈɑːdiəns | целевая аудитория | the people a product is aimed at | Teenagers are the *target audience*. | Целевая аудитория — подростки.
- the arts | n | ðə ɑːts | ðə ɑːrts | искусство (все виды) | music, painting, theatre, etc. | The government should fund *the arts*. | Государство должно финансировать искусство.
- the Olympic Games | n | ðə əʊˈlɪmpɪk ɡeɪmz | ðə oʊˈlɪmpɪk ɡeɪmz | Олимпийские игры | the international sports competition every four years | She competed in *the Olympic Games*. | Она выступала на Олимпийских играх.
