title: 'Describing: qualities'
title_ru: 'Описание: свойства и признаки'
topic: describing
words:
- alpha | adj | ˈælfə |  | альфа-, главный, доминантный | (of an animal or person) the most powerful in a group | The *alpha* male leads the group of gorillas. | Альфа-самец возглавляет группу горилл.
- anonymous | adj | əˈnɒnɪməs | əˈnɑːnɪməs | анонимный | having an unknown name | The statues were carved by *anonymous* artists. | Статуи вырезали безымянные мастера.
- cognitive | adj | ˈkɒɡnətɪv | ˈkɑːɡnətɪv | когнитивный, познавательный | connected with thinking, learning and memory | Sleep improves *cognitive* performance. | Сон улучшает когнитивные способности.
- gross | adj | ɡrəʊs | ɡroʊs | валовой, общий; грубый; противный | total, before anything is taken away; very obvious; disgusting | Their *gross* income was $50,000. | Их валовой доход составил 50 000 долларов. | gross error — грубая ошибка
- mainstream | adj | ˈmeɪnstriːm |  | общепринятый, основной | accepted by most people | His ideas were not part of *mainstream* medicine. | Его идеи не были частью общепринятой медицины.
- mandatory | adj | ˈmændətəri | ˈmændətɔːri | обязательный | required by law or rules | Wearing a seatbelt is *mandatory*. | Пристёгиваться ремнём обязательно.
- sole | adj | səʊl | soʊl | единственный | only | She was the *sole* survivor of the accident. | Она была единственной выжившей в аварии.
- suspicious | adj | səˈspɪʃəs |  | подозрительный | making you think something is wrong; not trusting | Police found a *suspicious* bag at the station. | Полиция обнаружила на вокзале подозрительную сумку.
