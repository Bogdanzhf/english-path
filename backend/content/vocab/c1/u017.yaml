title: Body and health
title_ru: Тело и здоровье
topic: body
words:
- cancerous | adj | ˈkænsərəs |  | раковый, злокачественный | affected by cancer | The doctors removed the *cancerous* cells. | Врачи удалили раковые клетки.
- grin | v | ɡrɪn |  | широко улыбаться, ухмыляться | to smile widely | He *grinned* when he saw the finished kitchen. | Он расплылся в улыбке, увидев готовую кухню.
- infect | v | ɪnˈfekt |  | заражать | to give someone a disease | The wound became *infected*. | Рана воспалилась. | infection — инфекция
- nausea | n | ˈnɔːziə |  | тошнота | the feeling that you are going to vomit | Many soldiers suffered from seasickness and *nausea*. | Многие солдаты страдали от морской болезни и тошноты.
- numb | adj | nʌm |  | онемевший; оцепеневший | unable to feel anything | My fingers were *numb* with cold. | Пальцы онемели от холода. | b не читается
- saliva | n | səˈlaɪvə |  | слюна | the liquid in your mouth | *Saliva* helps you swallow food. | Слюна помогает глотать пищу.
- skeletal | adj | ˈskelətl |  | скелетный | connected with the skeleton | They found *skeletal* remains of workers. | Они нашли скелетные останки рабочих.
