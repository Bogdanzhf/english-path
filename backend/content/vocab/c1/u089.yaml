title: Objects and materials
title_ru: Предметы и материалы
topic: objects
words:
- aerosol | n | ˈeərəsɒl | ˈerəsɑːl | аэрозоль, баллончик | a can that sprays liquid | Don't put *aerosols* near heat. | Не держите аэрозоли рядом с огнём.
- aggregate | adj | ˈæɡrɪɡət |  | совокупный, общий | formed by adding together several amounts | The *aggregate* score over two games was 3–2. | Общий счёт по итогам двух матчей — 3:2. | in aggregate — в совокупности
- anchor | n | ˈæŋkə | ˈæŋkər | ведущий (новостей); якорь | a presenter of a news programme; a heavy object that keeps a ship in place | The news *anchor* apologized for the mistake. | Ведущий новостей извинился за ошибку.
- apparatus | n | ˌæpəˈreɪtəs | ˌæpəˈrætəs | аппарат, прибор; снаряжение | equipment used for a particular purpose | Climbers carry breathing *apparatus*. | Альпинисты носят дыхательные аппараты.
- archive | n | ˈɑːkaɪv | ˈɑːrkaɪv | архив | a collection of historical records | The letters are kept in the *archive*. | Письма хранятся в архиве.
- banner | n | ˈbænə | ˈbænər | транспарант, баннер | a long sign | Protesters carried *banners*. | Протестующие несли транспаранты.
- bow | v | baʊ |  | кланяться | to bend your head or body | The actors *bowed* to the audience. | Актёры поклонились зрителям. | произн. baʊ
- canvas | n | ˈkænvəs |  | холст; брезент | strong cloth used for painting on or for tents | The artist stretched a new *canvas*. | Художник натянул новый холст.
- flask | n | flɑːsk | flæsk | фляга, термос; колба | a small bottle; a lab container | He brought a *flask* of coffee. | Он взял термос с кофе.
- 'gauge | n | ɡeɪdʒ |  | датчик, индикатор | an instrument that measures | The fuel *gauge* shows empty. | Указатель топлива на нуле. | гл.: gauge — оценивать'
- gear | n | ˈɡiə | ɡɪr | передача (скорость); снаряжение | the parts that control speed; equipment | Change *gear* before the hill. | Переключи передачу перед подъёмом.
- gem | n | dʒem |  | драгоценный камень; жемчужина | a jewel; something excellent | The town is a hidden *gem*. | Этот город — настоящая жемчужина.
- grid | n | ɡrɪd |  | сетка; энергосеть | a pattern of squares; a network of electricity cables | The map was divided into a *grid*. | Карта была разделена на квадраты.
- junction | n | ˈdʒʌŋkʃən |  | перекрёсток, развязка | a place where roads meet | Turn left at the next *junction*. | На следующем перекрёстке поверните налево.
- loop | n | luːp |  | петля | a shape like a circle made by a line that curves round | He tied the rope in a *loop*. | Он завязал верёвку петлёй.
- machinery | n | məˈʃiːnəri |  | техника, механизмы | machines | Farm *machinery* is expensive. | Сельхозтехника дорогая.
- membrane | n | ˈmembreɪn |  | мембрана, оболочка | a thin layer | The cell is surrounded by a *membrane*. | Клетка окружена мембраной.
- pipeline | n | ˈpaɪplaɪn |  | трубопровод | a long pipe for oil or gas | They built a gas *pipeline*. | Они построили газопровод. | in the pipeline — в разработке
- rifle | n | ˈraɪfl |  | винтовка | a long gun | The soldier carried a *rifle*. | Солдат нёс винтовку.
- rod | n | rɒd | rɑːd | стержень, прут; удочка | a long thin stick of wood or metal | Dad bought me a fishing *rod*. | Папа купил мне удочку.
- segment | n | ˈseɡmənt |  | сегмент, часть | a part | The market has several *segments*. | Рынок состоит из нескольких сегментов.
- slate | n | sleɪt |  | шифер, сланец | a dark grey stone that splits into thin flat pieces, used for roofs | The roof was made of *slate*. | Крыша была покрыта сланцевой плиткой.
- strap | n | stræp |  | ремешок, лямка | a narrow piece of leather or cloth used to fasten something | The *strap* on my bag broke. | У моей сумки оторвался ремешок.
- thread | n | θred |  | нитка, нить | a thin string used for sewing | I need some blue *thread* to fix my shirt. | Мне нужна синяя нитка, чтобы зашить рубашку.
