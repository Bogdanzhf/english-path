title: Places and the city
title_ru: Город и места
topic: city
words:
- abbey | n | ˈæbi |  | аббатство | a building where monks or nuns live | The ruins of an old *abbey* stand on the hill. | На холме стоят руины старого аббатства.
- affordable housing | n | əˈfɔːdəbl ˈhaʊzɪŋ | əˈfɔːrdəbl ˈhaʊzɪŋ | доступное жильё | homes that people can afford | The city needs more *affordable housing*. | Городу нужно больше доступного жилья.
- arena | n | əˈriːnə |  | арена | a large area surrounded by seats for public events | Gladiators fought in the *arena*. | Гладиаторы сражались на арене.
- car-free zone | n |  |  | пешеходная зона, зона без машин | an area where cars are not allowed | The old town is a *car-free zone*. | Старый город закрыт для машин.
- casino | n | kəˈsiːnəʊ | kəˈsiːnoʊ | казино | a place for gambling | He lost all his money at the *casino*. | Он проиграл все деньги в казино.
- congestion | n | kənˈdʒestʃən |  | пробки, перегруженность | too much traffic | Traffic *congestion* is a big problem. | Пробки — большая проблема.
- densely populated | adj | ˈdensli ˈpɒpjʊleɪtɪd | ˈdensli ˈpɑːpjəleɪtɪd | густонаселённый | with many people in a small area | Hong Kong is very *densely populated*. | Гонконг очень густонаселён.
- embassy | n | ˈembəsi |  | посольство | the office of a foreign government | Go to the British *Embassy*. | Обратитесь в посольство Великобритании.
- gentrification | n | ˌdʒentrɪfɪˈkeɪʃən |  | джентрификация | richer people moving into a poor area | *Gentrification* has raised rents. | Джентрификация подняла арендную плату.
- green spaces | n | ɡriːn ˈspeɪsɪz | ɡriːn ˈspeɪsəz | зелёные зоны | parks and gardens in a city | Cities need more *green spaces*. | Городам нужно больше зелёных зон.
- high-rise | adj | ˈhaɪraɪz |  | многоэтажный, высотный | very tall | They live in a *high-rise* building. | Они живут в высотке.
- homeland | n | ˈhəʊmlənd | ˈhoʊmlænd | родина | your native country | They returned to their *homeland*. | Они вернулись на родину.
- homelessness | n | ˈhəʊmləsnəs | ˈhoʊmləsnəs | бездомность | being without a home | *Homelessness* is rising. | Число бездомных растёт.
- inner city | n | ˈɪnə ˈsɪti | ˈɪnər ˈsɪti | неблагополучный центральный район | the poor central area of a city | Crime is high in the *inner city*. | В неблагополучных районах центра высокая преступность.
- road safety | n | rəʊd ˈseɪfti | roʊd ˈseɪfti | безопасность дорожного движения | being safe on roads | Children learn about *road safety* at school. | Дети изучают ПДД в школе.
- saloon | n | səˈluːn |  | седан (брит.); салун | a car with a separate boot; a bar | He drives a four-door *saloon*. | Он ездит на четырёхдверном седане.
- shrine | n | ʃraɪn |  | святыня, гробница | a holy place | Pilgrims visited the *shrine* to pray. | Паломники посещали святыню, чтобы помолиться.
- urbanisation | n | ˌɜːbənaɪˈzeɪʃən | ˌɜːbɐnaɪzˈeɪʃən | урбанизация | the growth of cities | Rapid *urbanisation* causes problems. | Быстрая урбанизация создаёт проблемы. | амер. urbanization
