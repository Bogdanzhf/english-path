title: Time and dates
title_ru: Время и даты
topic: time
words:
- dawn | n | dɔːn |  | рассвет | the time when the sun rises | We left at *dawn*. | Мы отправились на рассвете.
- meantime | n | ˈmiːntaɪm |  | тем временем | the time between two events | The ship will arrive tomorrow. In the *meantime*, we wait. | Корабль придёт завтра. А пока мы ждём.
- medieval | adj | ˌmediˈiːvl | ˌmiːdiˈiːvl | средневековый | from the Middle Ages (about 500–1500) | Weaving was organized by *medieval* guilds. | Ткачество было организовано средневековыми гильдиями.
- presently | adv | ˈprezntli |  | вскоре; в настоящее время | soon; now (US) | He will be here *presently*. | Он вскоре будет здесь.
- reign | n | reɪn |  | правление, царствование | the period when a king or queen rules | The Colosseum was finished during the *reign* of Titus. | Колизей был достроен в правление Тита. | g не читается
- renaissance | n | rɪˈneɪsns | ˈrenəsɑːns | Возрождение, Ренессанс | the period in Europe (14th–16th centuries) of new interest in art and science; a revival | Florence was the centre of the Italian *Renaissance*. | Флоренция была центром итальянского Возрождения.
- seldom | adv | ˈseldəm |  | редко | not often | We *seldom* go out on weekdays. | Мы редко выходим куда-нибудь по будним дням.
