title: Feelings and character
title_ru: Чувства и характер
topic: feelings
words:
- altruistic | adj | ˌɔːltruːˈɪstɪk |  | альтруистический | caring about others | It was an *altruistic* act. | Это был бескорыстный поступок.
- brutal | adj | ˈbruːtl |  | жестокий | very cruel | It was a *brutal* attack. | Это было жестокое нападение.
- cynical | adj | ˈsɪnɪkl |  | циничный | believing that people only act from selfish reasons | He's very *cynical* about politicians. | Он очень цинично относится к политикам.
- exuberant | adj | ɪɡˈzjuːbərənt | ɪɡˈzuːbərənt | жизнерадостный, бурный | full of energy | The *exuberant* fans sang all night. | Ликующие фанаты пели всю ночь.
- fiery | adj | ˈfaɪəri |  | огненный, пылкий | like fire; full of strong emotion | The sky turned a *fiery* red at sunset. | На закате небо стало огненно-красным. | a fiery temper — вспыльчивый характер
- hostile | adj | ˈhɒstaɪl | ˈhɑːstl | враждебный; неблагоприятный | unfriendly; difficult to live in | The desert is a *hostile* environment. | Пустыня — суровая среда для жизни.
- perceptive | adj | pəˈseptɪv | pərˈseptɪv | проницательный | quick to notice | She's very *perceptive*. | Она очень проницательна.
- placid | adj | ˈplæsɪd | ˈplæsəd | спокойный, безмятежный | calm | It's a *placid* lake. | Это тихое озеро.
- quirk | n | kwɜːk | kwɜːrk | причуда | a strange habit | It's one of his little *quirks*. | Это одна из его маленьких причуд.
- reluctance | n | rɪˈlʌktəns | riːˈlʌktəns | нежелание, неохота | not wanting to do something | He showed *reluctance* to help. | Он неохотно помогал.
- ruthless | adj | ˈruːθləs |  | безжалостный | cruel and determined | He's a *ruthless* businessman. | Он безжалостный бизнесмен.
- sceptical | adj | ˈskeptɪkl | skˈeptɪkl | скептический | doubting | I'm *sceptical* about the plan. | Я скептически отношусь к плану. | амер. skeptical
- sentimental | adj | ˌsentɪˈmentl | ˌsenəˈmenl | сентиментальный | full of tender emotion | I'm very *sentimental* about old photos. | Я очень сентиментален в отношении старых фото.
- smug | adj | smʌɡ |  | самодовольный | too pleased with yourself | He had a *smug* smile. | У него была самодовольная ухмылка.
- solemn | adj | ˈsɒləm | ˈsɑːləm | торжественный, серьёзный | very serious and formal | They made a *solemn* promise. | Они дали торжественное обещание. | n не читается
- tedious | adj | ˈtiːdɪəs | ˈtiːdiəs | скучный, утомительный | long and boring | It's a *tedious* job. | Это нудная работа.
- tender | adj | ˈtendə | ˈtendər | нежный, мягкий | soft and easy to cut (food); gentle and loving | The meat was very *tender*. | Мясо было очень нежным.
- timid | adj | ˈtɪmɪd |  | робкий | shy and nervous | He was too *timid* to speak to her. | Он был слишком робок, чтобы заговорить с ней.
- tranquil | adj | ˈtrænkwɪl | ˈtræŋkwəl | спокойный, безмятежный | calm and quiet | It's a *tranquil* garden. | Это тихий сад.
- vicious | adj | ˈvɪʃəs |  | жестокий, свирепый | violent and cruel | The emperor was known as a *vicious* ruler. | Император был известен как жестокий правитель. | vicious circle — порочный круг
- withdrawn | adj | wɪðˈdrɔːn |  | замкнутый | quiet and shy | He became *withdrawn* after the accident. | После аварии он замкнулся в себе.
