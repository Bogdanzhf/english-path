title: "The Price of Ambition"
title_ru: "Цена амбиций"
words:
  - "ambition | n | æmˈbɪʃn | | честолюбие, стремление | a strong wish to achieve something | Her *ambition* is to climb the highest mountain in the world. | Её мечта — покорить самую высокую гору в мире."
  - "ambulance | n | ˈæmbjələns | | скорая помощь | a vehicle that takes sick people to hospital | Call an *ambulance*! | Вызовите скорую!"
  - "ankle | n | ˈæŋkl | | лодыжка | the joint between the foot and the leg | She twisted her *ankle* on the ice. | Она подвернула лодыжку на льду."
  - "cabin | n | ˈkæbɪn | | хижина; кабина, каюта | a small wooden house; a room on a ship or plane | They spent the night in a mountain *cabin*. | Они переночевали в горной хижине."
  - "calendar | n | ˈkælɪndə | ˈkælɪndər | календарь | a list of the days and months of the year | Mark the date on your *calendar*. | Отметьте дату в календаре."
  - "calorie | n | ˈkæləri | | калория | a unit for measuring the energy in food | Climbers burn up to 10,000 *calories* a day. | Альпинисты сжигают до 10 000 калорий в день."
  - "cave | n | keɪv | | пещера | a large hole in a cliff or under the ground | They sheltered from the storm in a *cave*. | Они укрылись от бури в пещере."
  - "constantly | adv | ˈkɒnstəntli | ˈkɑːnstəntli | постоянно | all the time | The weather on the mountain changes *constantly*. | Погода в горах постоянно меняется."
  - "contingent | n | kənˈtɪndʒənt | | группа, контингент | a group of people from the same place or organization | A large *contingent* of climbers reached the camp. | В лагерь прибыла большая группа альпинистов. | прил. contingent on — зависящий от"
  - "deadline | n | ˈdedlaɪn | | крайний срок | the time by which something must be done | The *deadline* for applications is Friday. | Крайний срок подачи заявок — пятница."
  - "exert | v | ɪɡˈzɜːt | ɪɡˈzɜːrt | прилагать (усилия); оказывать (давление) | to use physical or mental effort; to use influence | Climbing at high altitude means *exerting* yourself to the limit. | Восхождение на большой высоте требует предельных усилий."
  - "flank | n | flæŋk | | склон, сторона; фланг | the side of something, such as a mountain or an animal | They climbed up the northern *flank* of the mountain. | Они поднимались по северному склону горы."
  - "fond | adj | fɒnd | fɑːnd | любящий | having feelings of affection | He has *fond* memories of his first climb. | У него остались тёплые воспоминания о первом восхождении. | be fond of — любить"
  - "forbid | v | fəˈbɪd | fərˈbɪd | запрещать | to order someone not to do something | Her parents *forbade* her to go. | Родители запретили ей ехать. | forbid — forbade — forbidden"
  - "haul | v | hɔːl | | тащить, волочь | to pull something heavy with effort | They *hauled* their equipment up the slope. | Они тащили снаряжение вверх по склону."
  - "impair | v | ɪmˈpeə | ɪmˈper | ухудшать, ослаблять | to damage or weaken | Lack of oxygen *impairs* judgement. | Недостаток кислорода ухудшает способность здраво рассуждать."
  - "impatient | adj | ɪmˈpeɪʃnt | | нетерпеливый | not willing to wait | Don't be so *impatient*! | Не будь таким нетерпеливым!"
  - "mid | adj | mɪd | | средний, в середине | in the middle of | The expedition started in *mid*-May. | Экспедиция началась в середине мая."
  - "nutrition | n | njuˈtrɪʃn | nuˈtrɪʃn | питание | the food you eat and how it affects your health | Good *nutrition* is essential for climbers. | Правильное питание крайне важно для альпинистов."
  - "optimist | n | ˈɒptɪmɪst | ˈɑːptɪmɪst | оптимист | a person who expects good things to happen | I'm an *optimist* — I believe we'll make it. | Я оптимист — верю, что у нас получится."
reading:
  title: "Traffic Jam on Everest"
  title_ru: "Пробка на Эвересте"
  text: |
    In May 2019, a photograph shocked the world. It showed a long line of climbers standing in the snow on a narrow ridge just below the summit of Mount Everest. They were not admiring the view; they were waiting. Hundreds of people had arrived at the top of the world at the same time, and the queue lasted for hours.

    For most climbers, reaching the summit of Everest, at 8,849 metres, is the ambition of a lifetime. In the past, only highly experienced mountaineers attempted it. Today, commercial companies offer guided expeditions to anyone who can pay — often more than $50,000. As a result, large contingents of climbers, some with limited experience, crowd the mountain every spring.

    There is only a short period each year, usually in mid-May, when the winds are calm enough to reach the top. Teams check their calendars and weather forecasts constantly, waiting for the right moment. When the window opens, everyone goes at once.

    Above 8,000 metres lies what climbers call the "death zone". Here, the air contains only a third of the oxygen at sea level. Every step requires enormous effort, and climbers must exert themselves while their bodies are slowly dying. Lack of oxygen impairs judgement, making people impatient or confused. Even with excellent nutrition, it is impossible to eat enough to replace the thousands of calories burned each day.

    That is why climbers set a strict deadline: if they have not reached the summit by a certain time, usually around two in the afternoon, they must turn back. But after months of training and huge expense, many find it hard to give up so close to the top. In 2019, the long queues meant many climbers spent too long in the death zone. Eleven people died that season.

    There is no ambulance on Everest. If someone collapses or breaks an ankle high on the mountain, rescue is extremely difficult. Some experts now want to limit the number of permits or forbid inexperienced climbers. Others remain optimists, believing that better organization can make the mountain safer. Either way, Everest teaches a hard lesson: on the world's highest mountain, knowing when to turn back may be the greatest skill of all.
  ru: |
    В мае 2019 года мир потрясла одна фотография. На ней была длинная очередь альпинистов, стоявших в снегу на узком гребне чуть ниже вершины Эвереста. Они не любовались видом — они ждали. Сотни людей одновременно оказались на вершине мира, и очередь растянулась на часы.

    Для большинства альпинистов покорить вершину Эвереста высотой 8849 метров — мечта всей жизни. Раньше на это решались только очень опытные альпинисты. Сегодня коммерческие компании предлагают экспедиции с гидами всем, кто может заплатить, — нередко более 50 000 долларов. В результате каждую весну на гору приходят большие группы альпинистов, причём некоторые с небольшим опытом.

    Каждый год есть лишь короткий период, обычно в середине мая, когда ветер достаточно слаб, чтобы подняться на вершину. Команды постоянно сверяются с календарём и прогнозами погоды, ожидая подходящего момента. Когда окно открывается, идут все сразу.

    Выше 8000 метров начинается то, что альпинисты называют «зоной смерти». Здесь в воздухе лишь треть того кислорода, что на уровне моря. Каждый шаг требует огромных усилий, и альпинистам приходится выкладываться, пока их организм медленно умирает. Недостаток кислорода ухудшает способность рассуждать, люди становятся нетерпеливыми или растерянными. Даже при отличном питании невозможно съесть достаточно, чтобы восполнить тысячи сжигаемых за день калорий.

    Поэтому альпинисты устанавливают строгий крайний срок: если к определённому времени, обычно около двух часов дня, они не достигли вершины, они должны повернуть назад. Но после месяцев тренировок и огромных затрат многим трудно сдаться так близко к цели. В 2019 году из-за длинных очередей многие альпинисты провели в зоне смерти слишком много времени. В тот сезон погибли одиннадцать человек.

    На Эвересте нет скорой помощи. Если кто-то падает без сил или ломает лодыжку высоко на горе, спасти его крайне трудно. Некоторые эксперты хотят ограничить количество разрешений или запретить восхождения неопытным альпинистам. Другие остаются оптимистами и считают, что лучшая организация может сделать гору безопаснее. Так или иначе, Эверест преподаёт жёсткий урок: на самой высокой горе мира умение вовремя повернуть назад — возможно, важнейший навык.
  questions:
    - q: "What did the 2019 photograph show?"
      options: ["An avalanche", "A long queue of climbers near the summit", "A helicopter rescue", "An empty mountain"]
