    - q: "What is the 'death zone'?"
      options: ["The base camp", "The area above 8,000 metres with very little oxygen", "A dangerous glacier", "The way down"]
      answer: 1
    - q: "Why do climbers set a deadline?"
      options: ["To catch their flight", "To turn back if they haven't reached the summit in time", "To save money", "To take photos"]
      answer: 1
