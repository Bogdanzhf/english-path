title: Environment and energy
title_ru: Экология и энергия
topic: environment
words:
- biosphere | n | ˈbaɪəʊsfɪə | ˈbaɪoʊsfɪr | биосфера | the parts of the Earth where life exists | Life exists in almost every corner of the *biosphere*. | Жизнь существует почти в каждом уголке биосферы.
- deplete | v | dɪˈpliːt |  | истощать | to reduce the amount of something | The war *depleted* the country's resources. | Война истощила ресурсы страны.
- 'exhaust | v | ɪɡˈzɔːst |  | истощать, изнурять | to make very tired; to use up | The walk *exhausted* me. | Прогулка меня вымотала. | сущ.: exhaust — выхлопная труба'
- green belt | n | ɡriːn belt |  | зелёный пояс | protected countryside around a city | Building in the *green belt* is banned. | Строить в зелёном поясе запрещено.
- greenhouse gases | n | ˈɡriːnhaʊs ˈɡæsɪz | ˈɡriːnhaʊs ˈɡæsəz | парниковые газы | gases that trap heat | Cars produce *greenhouse gases*. | Машины выделяют парниковые газы.
- hazardous waste | n | ˈhæzədəs weɪst | ˈhæzərdəs weɪst | опасные отходы | dangerous rubbish | *Hazardous waste* must be handled carefully. | С опасными отходами нужно обращаться осторожно.
- herbicide | n | ˈhɜːbɪsaɪd | ˈɜːrbɪsaɪd | гербицид | a chemical that kills weeds | Farmers spray *herbicides*. | Фермеры распыляют гербициды.
- hybrid car | n | ˈhaɪbrɪd kɑː | ˈhaɪbrəd kɑːr | гибридный автомобиль | a car using fuel and electricity | She drives a *hybrid car*. | Она ездит на гибриде.
- industrial waste | n | ɪnˈdʌstrɪəl weɪst | ˌɪnˈdʌstriəl weɪst | промышленные отходы | waste from factories | *Industrial waste* polluted the river. | Промышленные отходы загрязнили реку.
- melting glaciers | n | ˈmeltɪŋ ˈɡleɪʃəz | ˈmeltɪŋ ˈɡleɪʃərz | тающие ледники | glaciers getting smaller | *Melting glaciers* raise sea levels. | Тающие ледники повышают уровень моря.
- melting ice caps | n | ˈmeltɪŋ aɪs kæps |  | тающие полярные шапки | polar ice disappearing | *Melting ice caps* threaten polar bears. | Таяние полярных льдов угрожает белым медведям.
- ozone layer depletion | n | ˈəʊzəʊn ˈleɪɜː dɪˈpliːʃən | ˈoʊzoʊn ˈleɪər dɪˈpliːʃən | разрушение озонового слоя | the thinning of the ozone layer | CFCs caused *ozone layer depletion*. | Хлорфторуглероды разрушали озоновый слой.
- reduce emissions | phr |  |  | сокращать выбросы | to produce less pollution | Countries agreed to *reduce emissions*. | Страны договорились сократить выбросы.
- renewable energy sources | n | rɪˈnjuːəbl ˈenədʒi ˈsɔːsɪz | riːˈnuːəbl ˈenərdʒi ˈsɔːrsəz | возобновляемые источники энергии | sun, wind, water, etc. | We must invest in *renewable energy sources*. | Нужно вкладывать в возобновляемую энергетику.
- sea levels | n | siː ˈlevəlz |  | уровень моря | the height of the sea | *Sea levels* are rising. | Уровень моря повышается.
- solar panel | n | ˈsəʊlə ˈpænl | ˈsoʊlər ˈpænl | солнечная панель | a device that turns sunlight into electricity | We put a *solar panel* on the roof. | Мы установили на крыше солнечную панель.
- tidal energy | n | ˈtaɪdl ˈenədʒi | ˈtaɪdl ˈenərdʒi | приливная энергия | energy from tides | *Tidal energy* is reliable. | Приливная энергия надёжна.
- toxic waste | n | ˈtɒksɪk weɪst | ˈtɑːksɪk weɪst | токсичные отходы | poisonous waste | *Toxic waste* was dumped in the sea. | Токсичные отходы сбросили в море.
- urban sprawl | n | ˈɜːbən sprɔːl | ˈɜːrbən sprɔːl | разрастание городов | cities spreading into countryside | *Urban sprawl* destroys farmland. | Разрастание городов уничтожает сельхозугодья.
- wind turbine | n | waɪnd ˈtɜːbaɪn | waɪnd ˈtɜːrbaɪn | ветряная турбина | a tall machine that makes electricity from wind | *Wind turbines* line the coast. | Вдоль побережья стоят ветряки.
