title: 'Describing: society and science'
title_ru: 'Описание: общество, наука, право'
topic: describing
words:
- affluent | adj | ˈæfluənt |  | состоятельный, богатый | having plenty of money | They live in an *affluent* suburb. | Они живут в богатом пригороде.
- albeit | conj | ɔːlˈbiːɪt |  | хотя и | although (formal) | He agreed, *albeit* unwillingly. | Он согласился, хотя и неохотно.
- amid | prep | əˈmɪd |  | среди, посреди | in the middle of; during | The airship landed *amid* heavy rain. | Дирижабль приземлялся под проливным дождём.
- aquatic | adj | əˈkwætɪk |  | водный, водяной | living or growing in water | Tardigrades are tiny *aquatic* animals. | Тихоходки — крошечные водные животные.
- cosmopolitan | adj | ˌkɒzməˈpɒlɪtən | ˌkɑːzməˈpɑːlɪtən | космополитичный | including people and ideas from many countries | London is a *cosmopolitan* city. | Лондон — космополитичный город.
- militant | adj | ˈmɪlɪtənt |  | воинствующий, агрессивный | using strong or violent methods to achieve change | She was a *militant* campaigner for reform. | Она была воинствующей сторонницей реформ.
- monolingual | adj | ˌmɒnəˈlɪŋɡwəl | ˌmɑːnəˈlɪŋɡwəl | одноязычный | speaking only one language | *Monolingual* speakers are actually a minority in the world. | Говорящие на одном языке на самом деле в мире в меньшинстве.
- 'sensory | adj | ˈsensəri |  | сенсорный, чувственный | connected with the physical senses | The show is a *sensory* experience of light and sound. | Шоу — это настоящее пиршество для чувств: свет и звук.'
- whereby | adv | weəˈbaɪ | werˈbaɪ | посредством которого, по которому | by which; according to which | They introduced a system *whereby* tenants could pay online. | Ввели систему, по которой жильцы могут платить онлайн.
