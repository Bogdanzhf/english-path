title: 'Describing: size, shape and looks'
title_ru: 'Описание: размер, форма, внешний вид'
topic: describing
words:
- arc | n | ɑːk | ɑːrk | дуга | a curved line, like part of a circle | The ball flew through the air in a high *arc*. | Мяч пролетел по высокой дуге.
- battered | adj | ˈbætəd | ˈbætərd | потрёпанный; избитый | old and damaged; hurt by violence | He drove a *battered* old car. | Он ездил на побитой старой машине.
- bulky | adj | ˈbʌlki |  | громоздкий | large and hard to carry | The box is too *bulky*. | Коробка слишком громоздкая.
- classy | adj | ˈklɑːsi | ˈklæsi | стильный, шикарный (разг.) | stylish and expensive | It's a *classy* restaurant. | Это шикарный ресторан.
- creamy | adj | ˈkriːmi |  | сливочный, кремовый | smooth like cream | This soup is very *creamy*. | Суп очень нежный.
