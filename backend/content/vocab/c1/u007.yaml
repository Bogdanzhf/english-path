- incision | n | ɪnˈsɪʒən | ˌɪnˈsɪʒən | надрез | a cut made in surgery | The surgeon made a small *incision*. | Хирург сделал небольшой надрез.
- invisible | adj | ɪnˈvɪzəbl | ˌɪnˈvɪzəbl | невидимый | impossible to see | Air is *invisible*. | Воздух невидим.
- ornamental | adj | ˌɔːnəˈmentl | ˌɔːrnəˈmentl | декоративный | for decoration | There's an *ornamental* pond in the garden. | В саду декоративный пруд.
- outstretched | adj | ˌaʊtˈstretʃt |  | протянутый, распростёртый | reaching out as far as possible | He greeted us with *outstretched* arms. | Он встретил нас с распростёртыми объятиями.
- panoramic | adj | ˌpænɔːˈræmɪk | ˌpænəˈræmɪk | панорамный | showing a wide view | The restaurant has *panoramic* views. | Из ресторана открывается панорамный вид.
- rear | n | rɪə | rɪr | задняя часть, тыл | the back part of something | The kitchen is at the *rear* of the house. | Кухня находится в задней части дома.
- rugged | adj | ˈrʌɡɪd |  | суровый, неровный; крепкий | rough and uneven; strong and determined | They were *rugged* people used to hard work. | Это были суровые люди, привыкшие к тяжёлому труду.
- sombre | adj | ˈsɒmbə | sˈɒmbɐ | мрачный, унылый | dark; serious and sad | The mood was *sombre*. | Настроение было мрачным. | амер. somber
- spacious | adj | ˈspeɪʃəs |  | просторный | with a lot of space | The flat is bright and *spacious*. | Квартира светлая и просторная.
- spartan | adj | ˈspɑːtn | ˈspɑːrtn | спартанский, простой | very simple and without comfort | The room was *spartan*. | Комната была аскетичной.
- supple | adj | ˈsʌpl |  | гибкий, эластичный | bending easily | Yoga keeps your body *supple*. | Йога сохраняет гибкость тела.
- tangled | adj | ˈtæŋɡəld |  | спутанный | twisted together | Her hair was *tangled*. | Её волосы спутались.
- taut | adj | tɔːt |  | натянутый | stretched tight | Pull the rope *taut*. | Натяни верёвку.
- 'violet | adj | ˈvaɪələt | ˈvaɪəlɪt | фиолетовый | bluish-purple | She wore a *violet* scarf. | На ней был фиолетовый шарф. | сущ.: violet — фиалка'
- wooded | adj | ˈwʊdɪd |  | лесистый | covered with trees | The hills are densely *wooded*. | Холмы густо покрыты лесом.
