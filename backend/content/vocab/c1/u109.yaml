title: 'Describing: amount and degree'
title_ru: 'Описание: количество и степень'
topic: describing
words:
- acute | adj | əˈkjuːt |  | острый; сильный | very serious or severe; (of senses) very sensitive | He suffered from *acute* pain in his ears. | Он страдал от острой боли в ушах.
- consequent | adj | ˈkɒnsɪkwənt | ˈkɑːnsəkwent | последовавший, вытекающий | happening as a result | The storm and the *consequent* floods destroyed many homes. | Буря и последовавшие за ней наводнения разрушили много домов. | consequently — следовательно
- convoluted | adj | ˌkɒnvəˈluːtɪd | ˈkɑːnvəluːtəd | запутанный | very complicated | The plot is very *convoluted*. | Сюжет очень запутанный.
- cumulative | adj | ˈkjuːmjələtɪv |  | накопительный, совокупный | increasing over time by adding more | The *cumulative* effect of small fires is enormous. | Совокупный эффект небольших пожаров огромен.
- finite | adj | ˈfaɪnaɪt |  | конечный, ограниченный | limited | The earth's resources are *finite*. | Ресурсы Земли ограничены.
- inexhaustible | adj | ˌɪneɡˈzɔːstəbl | ˌɪnɪɡˈzɔːstəbl | неисчерпаемый | that cannot be used up | Solar energy is *inexhaustible*. | Солнечная энергия неисчерпаема.
- inexplicably | adv | ˌɪnekˈsplɪkəbli | ˌɪnɪksˈplɪkəbli | необъяснимо | in a way that can't be explained | He *inexplicably* left. | Он необъяснимым образом ушёл.
- lesser | adj | ˈlesə | ˈlesər | меньший | smaller; less important | It's the *lesser* of two evils. | Это меньшее из двух зол.
- limitless | adj | ˈlɪmɪtləs | ˈlɪmətləs | безграничный | without limits | Her energy seems *limitless*. | Её энергия кажется безграничной.
- marginal | adj | ˈmɑːdʒɪnl | ˈmɑːrdʒənl | незначительный; маргинальный | small and unimportant | There was a *marginal* improvement. | Улучшение было незначительным.
- minimal | adj | ˈmɪnɪml |  | минимальный | very small in amount | The operation leaves *minimal* scarring. | После операции остаются минимальные шрамы.
- negligible | adj | ˈneɡlɪdʒəbl |  | незначительный, ничтожный | so small that it is not important | The risk is *negligible*. | Риск ничтожно мал.
- predominant | adj | prɪˈdɒmɪnənt | prɪˈdɑːmɪnənt | преобладающий | most common or strongest | Red was the *predominant* colour at court. | При дворе преобладал красный цвет.
- presidential | adj | ˌprezɪˈdenʃl | ˌprezəˈdenʃl | президентский | relating to a president | The *presidential* election is in May. | Президентские выборы в мае.
- prevalent | adj | ˈprevələnt |  | распространённый | common in a particular place or time | The disease is more *prevalent* in hot countries. | Это заболевание чаще встречается в жарких странах.
- principal | n | ˈprɪnsəpl |  | директор (школы) | the head of a school | The *principal* called my parents. | Директор позвонил моим родителям.
- profound | adj | prəˈfaʊnd |  | глубокий | very great or serious | The book had a *profound* effect on me. | Книга произвела на меня глубокое впечатление.
- scarce | adj | skeəs | skers | дефицитный, редкий | not enough; difficult to find | Water was *scarce*. | Воды было мало.
- staggering | adj | ˈstæɡərɪŋ |  | ошеломляющий | very surprising | The cost is *staggering*. | Стоимость ошеломляющая.
- whatsoever | adv | ˌwɒtsəʊˈevə | ˌwʌtsoʊˈevər | вообще, совершенно (с отрицанием) | at all (used after a negative) | There is no evidence *whatsoever*. | Нет вообще никаких доказательств.
