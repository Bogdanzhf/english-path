title: Events and situations
title_ru: События и ситуации
topic: events
words:
- consensus | n | kənˈsensəs |  | консенсус, общее согласие | an opinion that all or most people agree with | There is a scientific *consensus* on climate change. | В науке существует консенсус по поводу изменения климата.
- inclusion | n | ɪnˈkluːʒn |  | включение, инклюзивность | the act of including everyone, especially people who are often left out | The company is committed to diversity and *inclusion*. | Компания привержена разнообразию и инклюзивности.
- integrity | n | ɪnˈteɡrəti |  | честность, порядочность; целостность | the quality of being honest and having strong principles | A judge must be a person of *integrity*. | Судья должен быть человеком безупречной честности.
- omen | n | ˈəʊmən | ˈoʊmən | знамение, предзнаменование | a sign of what will happen | Locals saw the dark clouds as a bad *omen*. | Местные жители сочли тёмные тучи дурным знаком.
- realm | n | relm |  | царство, сфера | a kingdom; an area of activity or interest | The games were a symbol of power across the *realm*. | Игры были символом власти по всему царству. | in the realm of — в области
