title: Society and politics
title_ru: Общество и политика
topic: society
words:
- capitalism | n | ˈkæpɪtəlɪzəm |  | капитализм | an economic system based on private ownership and profit | Industrial *capitalism* changed society forever. | Промышленный капитализм навсегда изменил общество.
- capitalist | n | ˈkæpɪtəlɪst |  | капиталист | a person who believes in or profits from capitalism | He called himself a *capitalist* with a social conscience. | Он называл себя капиталистом с социальной совестью.
- flank | n | flæŋk |  | склон, сторона; фланг | the side of something, such as a mountain or an animal | They climbed up the northern *flank* of the mountain. | Они поднимались по северному склону горы.
- foster | v | ˈfɒstə | ˈfɑːstər | развивать, поощрять; воспитывать (приёмного ребёнка) | to help something develop; to look after a child that isn't yours | The program aims to *foster* creativity in children. | Программа направлена на развитие творческих способностей у детей.
- hierarchy | n | ˈhaɪərɑːki | ˈhaɪərɑːrki | иерархия | a system in which people are organized by rank | Clothes showed your place in the social *hierarchy*. | Одежда показывала место человека в социальной иерархии.
- noble | n | ˈnəʊbl | ˈnoʊbl | дворянин, знатный человек | a person from a family of high social rank | The king invited all the *nobles* to the feast. | Король пригласил на пир всю знать. | прил. noble — благородный
