title: Economy and business
title_ru: Экономика и бизнес
topic: economy
words:
- audit | v | ˈɔːdɪt |  | проводить аудит, проверять | to officially check financial records | The accounts are *audited* every year. | Счета ежегодно проходят аудит.
- commodity | n | kəˈmɒdəti | kəˈmɑːdəti | товар, сырьё | a product that is bought and sold | Grain was the most important *commodity* in Rome. | Зерно было важнейшим товаром в Риме.
- concession | n | kənˈseʃn |  | уступка | something you give up in a negotiation | The government made several *concessions*. | Правительство пошло на ряд уступок.
- franchise | n | ˈfræntʃaɪz |  | франшиза | permission to sell a company's products under its name | They opened a *franchise* in Madrid. | Они открыли франшизу в Мадриде.
- free trade | n | friː treɪd |  | свободная торговля | trade without taxes or limits | The countries signed a *free trade* agreement. | Страны подписали соглашение о свободной торговле.
- fundraising | n | fʌnˈdreɪzɪŋ | ˈfʌndreɪsɪŋ | сбор средств | collecting money for a cause | They organised a *fundraising* event. | Они организовали благотворительную акцию.
- global economy | n | ˈɡləʊbl ɪˈkɒnəmi | ˈɡloʊbl iːˈkɑːnəmi | мировая экономика | the economy of the whole world | The crisis hit the *global economy*. | Кризис ударил по мировой экономике.
- gross domestic product | n | ɡrəʊs dəˈmestɪk ˈprɒdʌkt | ɡroʊs dəˈmestɪk ˈprɑːdəkt | валовой внутренний продукт | the total value of goods produced by a country | *Gross domestic product* rose by 2%. | ВВП вырос на 2%. | сокр. GDP
- impoverished | adj | ɪmˈpɒvərɪʃt | ˌɪmˈpɑːvrɪʃt | обедневший, нищий | very poor | They live in an *impoverished* area. | Они живут в бедном районе.
- industrialization | n | ˌɪnˌdəstriəlɪˈzeɪʃən | ˌɪnˌdʌstriəlɪˈzeɪʃən | индустриализация | developing industries | *Industrialization* changed the country. | Индустриализация изменила страну. | брит. также industrialisation
- marketplace | n | ˈmɑːkɪtpleɪs | ˈmɑːrkətpleɪs | рынок | a market; the world of trade | It's a competitive *marketplace*. | Это конкурентный рынок.
- merger | n | ˈmɜːdʒə | ˈmɜːrdʒər | слияние | joining two companies | The *merger* created a huge company. | Слияние создало огромную компанию.
- purchasing power | n | ˈpɜːtʃɪsɪŋ ˈpaʊə | ˈpɜːrtʃəsɪŋ ˈpaʊər | покупательная способность | how much money can buy | Inflation reduces *purchasing power*. | Инфляция снижает покупательную способность.
- standard of living | n | ˈstændəd əv ˈlɪvɪŋ | ˈstændərd əv ˈlɪvɪŋ | уровень жизни | how comfortably people live | The *standard of living* has improved. | Уровень жизни повысился.
- the gap between rich and poor | phr |  |  | разрыв между богатыми и бедными | inequality of wealth | *The gap between rich and poor* is widening. | Разрыв между богатыми и бедными растёт.
- trade barrier | n | treɪd ˈbærɪə | treɪd ˈbæriːər | торговый барьер | a rule that limits trade | They removed *trade barriers*. | Они устранили торговые барьеры.
