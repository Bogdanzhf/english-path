title: Thinking and opinions
title_ru: Мысли и мнения
topic: mind
words:
- altruism | n | ˈɔːltruːɪzəm | ˈæltruːɪzəm | альтруизм | caring about others | Her *altruism* is admirable. | Её бескорыстие достойно восхищения.
- aspiration | n | ˌæspəˈreɪʃən |  | стремление, устремление | a strong hope | She has *aspirations* to be a doctor. | Она мечтает стать врачом.
- atrocity | n | əˈtrɒsɪti | əˈtrɑːsəti | зверство | a very cruel act | They committed terrible *atrocities*. | Они совершили страшные зверства.
- conformity | n | kənˈfɔːmɪti | kənˈfɔːrməti | соответствие; конформизм | following rules or customs | Schools encourage *conformity*. | Школы поощряют следование правилам.
- deceit | n | dɪˈsiːt | dəˈsiːt | обман | dishonesty | The relationship was built on *deceit*. | Отношения строились на обмане.
- individuality | n | ˌɪndɪˌvɪdjuːˈælɪti | ˌɪnˌdɪvɪdʒuːˈælɪti | индивидуальность | qualities that make you different | Express your *individuality*. | Выражайте свою индивидуальность.
- optimum | adj | ˈɒptɪməm | ˈɑːptəməm | оптимальный | the best | Find the *optimum* temperature. | Найдите оптимальную температуру.
- physique | n | fɪˈziːk | fəˈziːk | телосложение | the shape and size of a body | He has a strong *physique*. | У него крепкое телосложение.
- rarity | n | ˈreərəti | ˈrerəti | редкость | something rare | Snow is a *rarity* here. | Снег здесь редкость.
- speck | n | spek |  | пятнышко, крапинка | a very small spot | From the helicopter, the climbers looked like *specks* on the snow. | С вертолёта альпинисты казались точками на снегу.
- stamina | n | ˈstæmɪnə | ˈstæmənə | выносливость | physical strength to continue | Running needs *stamina*. | Для бега нужна выносливость.
- symmetry | n | ˈsɪmətri |  | симметрия | the state of having two matching halves | The design has perfect *symmetry*. | У узора идеальная симметрия.
- tact | n | tækt |  | такт | the ability to say difficult things without upsetting people | She handled the situation with great *tact*. | Она проявила в этой ситуации большой такт.
- temperament | n | ˈtemprəmənt | ˈtempərmənt | темперамент, нрав | a person's nature | She has a calm *temperament*. | У неё спокойный нрав.
- toughness | n | ˈtʌfnəs |  | твёрдость, стойкость | being strong | He showed great mental *toughness*. | Он проявил большую психологическую стойкость.
- tranquility | n | trænˈkwɪlɪti | træŋˈkwɪlɪti | спокойствие, безмятежность | peace and calm | I love the *tranquility* of the countryside. | Люблю безмятежность сельской местности. | брит. также tranquillity
- uniformity | n | ˌjuːnɪˈfɔːmɪti | ˌjuːnəˈfɔːrməti | единообразие | being the same | There's a dull *uniformity* to the houses. | Дома скучно однообразны.
- vitality | n | vaɪˈtælɪti | vaɪˈtæləti | жизненная сила, энергия | energy | She's full of *vitality*. | Она полна энергии.
- wavelength | n | ˈweɪvleŋθ |  | длина волны | the distance between waves | We're on the same *wavelength*. | Мы на одной волне.
