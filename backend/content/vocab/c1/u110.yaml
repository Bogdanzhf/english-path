title: 'Describing: same, different, true'
title_ru: 'Описание: сходство, точность, вероятность'
topic: describing
words:
- arbitrary | adj | ˈɑːbɪtrəri | ˈɑːrbɪtreri | произвольный | based on chance rather than reason | Retirement at 65 is a rather *arbitrary* age. | Выход на пенсию в 65 — довольно произвольный возраст.
- credible | adj | ˈkredəbl |  | заслуживающий доверия, правдоподобный | able to be believed | There's no *credible* evidence for ghosts. | Нет никаких убедительных доказательств существования призраков.
- definitive | adj | dɪˈfɪnətɪv |  | окончательный, исчерпывающий | final and impossible to change or improve | There is no *definitive* answer to this question. | На этот вопрос нет окончательного ответа.
- distinctive | adj | dɪˈstɪŋktɪv |  | отличительный, характерный | easy to recognize because it is different | Van Gogh's style is very *distinctive*. | Стиль Ван Гога очень узнаваем.
- explicit | adj | ɪkˈsplɪsɪt |  | явный, недвусмысленный | clear and exact | She gave me *explicit* instructions. | Она дала мне чёткие указания.
- inherent | adj | ɪnˈherənt | ɪnˈhɪrənt | присущий, неотъемлемый | existing as a natural part of something | There are risks *inherent* in any experiment. | Любому эксперименту присущи риски.
- integral | adj | ˈɪntɪɡrəl |  | неотъемлемый | necessary and important as a part of a whole | Music was an *integral* part of his life. | Музыка была неотъемлемой частью его жизни.
