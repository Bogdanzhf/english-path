title: Communication and language
title_ru: Общение и язык
topic: communication
words:
- acquaint | v | əˈkweɪnt |  | знакомить | to make someone familiar with something | New staff need time to *acquaint* themselves with the rules. | Новым сотрудникам нужно время, чтобы ознакомиться с правилами. | be acquainted with — быть знакомым с
- allege | v | əˈledʒ |  | утверждать (без доказательств) | to claim something without proof | It is *alleged* that the stones have healing powers. | Утверждают, что камни обладают целебной силой. | allegedly — якобы
- circulate | v | ˈsɜːkjəleɪt | ˈsɜːrkjəleɪt | циркулировать, распространяться | to move around a system; to pass from person to person | Blood *circulates* around the body. | Кровь циркулирует по телу. | circulation — кровообращение; тираж
- confer | v | kənˈfɜː | kənˈfɜːr | совещаться; присуждать | to discuss together; to give an honour | The experts *conferred* before announcing the results. | Эксперты посовещались, прежде чем объявить результаты.
- distort | v | dɪˈstɔːt | dɪˈstɔːrt | искажать | to change something so it is no longer true or accurate | The article *distorted* the facts. | Статья исказила факты.
- enlighten | v | ɪnˈlaɪtn |  | просвещать | to give someone information so they understand | New research has *enlightened* us about the island's past. | Новые исследования пролили свет на прошлое острова.
- wail | v | weɪl |  | выть, вопить, причитать | to cry loudly and sadly | The wind *wailed* through the broken windows. | Ветер выл в разбитых окнах.
