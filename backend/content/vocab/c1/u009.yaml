title: Body and health
title_ru: Тело и здоровье
topic: body
words:
- abdominal | adj | æbˈdɒmɪnl | æbˈdɑːmənl | брюшной | relating to the stomach area | He had *abdominal* pain. | У него болел живот.
- chronic | adj | ˈkrɒnɪk | ˈkrɑːnɪk | хронический | lasting a long time; continual | The city has a *chronic* shortage of housing. | В городе хроническая нехватка жилья.
- claustrophobia | n | ˌklɒstrəˈfəʊbiə | ˌklɔːstrəˈfoʊbiə | клаустрофобия | fear of small spaces | I can't use lifts — I have *claustrophobia*. | Не могу ездить в лифтах — у меня клаустрофобия.
- coronary | adj | ˈkɒrənəri | ˈkɔːrəneri | коронарный, сердечный | relating to the heart | He had a *coronary* heart attack. | У него был инфаркт.
- diagnosis | n | ˌdaɪəɡˈnəʊsɪs | ˌdaɪəɡˈnoʊsɪs | диагноз | identifying an illness | The doctor made a quick *diagnosis*. | Врач быстро поставил диагноз. | мн. diagnoses
- epilepsy | n | ˈepɪlepsi |  | эпилепсия | a brain condition that causes sudden fits | The diet was first used to treat *epilepsy*. | Эту диету впервые использовали для лечения эпилепсии.
- 'facial | adj | ˈfeɪʃl |  | лицевой | relating to the face | She has beautiful *facial* features. | У неё красивые черты лица. | сущ.: facial — уход за лицом'
- flesh | n | fleʃ |  | плоть, мякоть | the soft part of the body; the soft part of a fruit | The shark's teeth tore through the *flesh*. | Зубы акулы разорвали плоть.
- gut | n | ɡʌt |  | кишечник; нутро, чутьё | the stomach and intestines; (pl.) courage | Many soldiers suffered from *gut* infections. | Многие солдаты страдали от кишечных инфекций. | gut feeling — чутьё; have the guts — хватить смелости
- incisor | n | ɪnˈsaɪzə | ˌɪnˈsaɪzər | резец (зуб) | a front cutting tooth | Rabbits have long *incisors*. | У кроликов длинные резцы.
- injection | n | ɪnˈdʒekʃən | ˌɪnˈdʒekʃən | укол, инъекция | putting medicine in with a needle | The nurse gave me an *injection*. | Медсестра сделала мне укол.
- intestines | n | ɪnˈtestɪnz |  | кишечник | the long tube that carries food from the stomach | Cholera attacks the *intestines*. | Холера поражает кишечник.
- kidney | n | ˈkɪdni |  | почка | an organ that cleans the blood | He needs a *kidney* transplant. | Ему нужна пересадка почки.
- lap | n | læp |  | колени (сидя); круг (в гонке) | the top of your legs when sitting; one circuit | The cat sat on my *lap*. | Кошка сидела у меня на коленях.
- limb | n | lɪm |  | конечность; крупная ветвь | an arm or leg; a large branch of a tree | He broke two *limbs* in the accident. | В аварии он сломал руку и ногу. | b не читается
- marrow | n | ˈmærəʊ | ˈmeroʊ | костный мозг; кабачок | the soft inside of bones; a large vegetable | He donated bone *marrow*. | Он стал донором костного мозга.
- pathway | n | ˈpɑːθweɪ | ˈpæθweɪ | тропинка; путь | a path; a route | The *pathway* leads to the lake. | Тропинка ведёт к озеру.
- receptor | n | rɪˈseptə | riːˈseptər | рецептор | a nerve ending that senses | Taste *receptors* are on the tongue. | Вкусовые рецепторы находятся на языке.
- spine | n | spaɪn |  | позвоночник; корешок книги | the bones down the middle of your back | Sit up straight — it's good for your *spine*. | Сиди прямо — это полезно для позвоночника.
- valve | n | vælv |  | клапан, вентиль | a device that controls the flow of liquid or gas | Turn off the main water *valve*. | Перекройте главный водяной вентиль.
