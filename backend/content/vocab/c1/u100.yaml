title: Actions and movement
title_ru: Действия и движение
topic: actions
words:
- adhere | v | ədˈhɪə | ədˈhɪr | придерживаться, соблюдать; прилипать | to follow a rule or belief; to stick to something | All staff must *adhere* to the safety rules. | Все сотрудники должны соблюдать правила безопасности. | adhere to
- cease | v | siːs |  | прекращать(ся) | to stop happening or existing | The company *ceased* trading last year. | Компания прекратила деятельность в прошлом году. | ceasefire — прекращение огня
- coincide | v | ˌkəʊɪnˈsaɪd | ˌkoʊɪnˈsaɪd | совпадать | to happen at the same time | My holiday *coincided* with the festival. | Мой отпуск совпал с фестивалем. | coincidence — совпадение
- compensate | v | ˈkɒmpenseɪt | ˈkɑːmpenseɪt | компенсировать | to pay someone for loss or damage; to balance something bad | The airline *compensated* us for the delay. | Авиакомпания выплатила нам компенсацию за задержку. | compensate for
- conform | v | kənˈfɔːm | kənˈfɔːrm | соответствовать, подчиняться (правилам) | to follow rules or standards | All buildings must *conform* to safety standards. | Все здания должны соответствовать нормам безопасности.
- conserve | v | kənˈsɜːv | kənˈsɜːrv | сохранять, беречь | to protect from harm or waste | We must *conserve* the rainforest. | Мы должны сохранить тропический лес. | conservation — охрана природы
- correspond | v | ˌkɒrɪˈspɒnd | ˌkɔːrəˈspɑːnd | соответствовать; переписываться | to match; to write letters to someone | The dates don't *correspond* with the records. | Даты не соответствуют записям. | correspondence — переписка
- defy | v | dɪˈfaɪ |  | бросать вызов, не подчиняться | to refuse to obey | They *defied* the government's orders. | Они не подчинились приказам правительства. | defiant — непокорный
- expire | v | ɪkˈspaɪə | ɪkˈspaɪr | истекать | to end; to no longer be valid | My passport *expires* next month. | Мой паспорт истекает в следующем месяце.
- harbour | v | ˈhɑːbə | ˈhɑːrbər | таить; укрывать | to keep a feeling secretly; to hide someone | She *harbours* a grudge. | Она затаила обиду. | амер. harbor
- lodge | v | lɒdʒ | lɑːdʒ | подавать (жалобу); застревать; жить на квартире | to make a complaint; to get stuck | He *lodged* a complaint. | Он подал жалобу.
- persist | v | pəˈsɪst | pərˈsɪst | упорствовать, продолжаться | to continue doing something although it is difficult | If the pain *persists*, see a doctor. | Если боль не проходит, обратитесь к врачу.
- postpone | v | pəˈspəʊn | poʊˈspoʊn | откладывать, переносить | to move an event to a later time | The match was *postponed* because of rain. | Матч перенесли из-за дождя.
- prevail | v | prɪˈveɪl |  | одерживать верх, преобладать | to win after a struggle; to be common | In the end, common sense *prevailed*. | В конце концов здравый смысл победил.
- reside | v | rɪˈzaɪd | riːˈzaɪd | проживать | to live | He *resides* in London. | Он проживает в Лондоне.
- span | v | spæn |  | охватывать, простираться | to cover a period of time or a distance | Her career *spanned* fifty years. | Её карьера длилась пятьдесят лет.
- suffice | v | səˈfaɪs |  | быть достаточным | to be enough | A short email will *suffice*. | Достаточно короткого письма.
- sustain | v | səˈsteɪn |  | поддерживать, обеспечивать | to keep something going over time | The village is *sustained* by farming. | Деревня живёт за счёт сельского хозяйства.
- uphold | v | ʌpˈhəʊld | əpˈhoʊld | поддерживать, подтверждать | to support; to confirm | The court *upheld* the decision. | Суд оставил решение в силе.
- violate | v | ˈvaɪəleɪt |  | нарушать | to break a law, rule or agreement | The company *violated* environmental laws. | Компания нарушила природоохранное законодательство.
