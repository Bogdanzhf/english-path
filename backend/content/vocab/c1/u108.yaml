title: Thinking and opinions
title_ru: Мысли и мнения
topic: mind
words:
- clarity | n | ˈklærɪti | ˈklerəti | ясность, чёткость | being clear | Write with *clarity*. | Пишите ясно.
- competence | n | ˈkɒmpɪtəns | ˈkɑːmpɪtəns | компетентность, умение | the ability to do something well | Nobody doubted her professional *competence*. | Никто не сомневался в её профессиональной компетентности.
- credibility | n | ˌkredɪˈbɪlɪti | ˌkredəˈbɪlɪti | доверие, авторитет | being believed | The scandal damaged his *credibility*. | Скандал подорвал доверие к нему.
- dominance | n | ˈdɒmɪnəns | ˈdɑːmɪnəns | господство, превосходство | the state of being more powerful than others | Vienna's *dominance* in music lasted a century. | Господство Вены в музыке длилось столетие.
- fairness | n | ˈfeənəs | ˈfernəs | справедливость | being fair | Everyone wants *fairness*. | Все хотят справедливости.
- hostility | n | həˈstɪlɪti | hɑːˈstɪləti | враждебность | unfriendly behaviour | There's *hostility* between the two groups. | Между двумя группами вражда.
- longevity | n | lɒnˈdʒevəti | lɔːnˈdʒevəti | долголетие | long life | The island is famous for the *longevity* of its people. | Остров славится долголетием своих жителей.
- morality | n | mɒˈrælɪti | məˈræləti | мораль, нравственность | principles of right and wrong | The film raises questions of *morality*. | Фильм поднимает вопросы морали.
- mortality | n | mɔːˈtælɪti | mɔːrˈtæləti | смертность | the number of deaths | Infant *mortality* has fallen. | Детская смертность снизилась.
- nationalism | n | ˈnæʃənəlɪzəm |  | национализм | strong loyalty to your nation | *Nationalism* is rising in Europe. | В Европе растёт национализм.
- prevalence | n | ˈprevələns |  | распространённость | how common something is | The *prevalence* of obesity is rising. | Распространённость ожирения растёт.
- realism | n | ˈriəlɪzəm | ˈriəlɪzm | реализм | seeing things as they are | The film has great *realism*. | Фильм очень реалистичен.
- resilience | n | rɪˈsɪliəns | rɪˈzɪliəns | стойкость, устойчивость | the ability to recover | Children show amazing *resilience*. | Дети проявляют удивительную стойкость.
- secrecy | n | ˈsiːkrəsi |  | секретность | the state of keeping something secret | The meetings were held in *secrecy*. | Встречи проводились в обстановке секретности.
- simplicity | n | sɪmˈplɪsəti |  | простота | the quality of being simple | The *simplicity* of the idea was its strength. | Простота идеи была её силой.
- solidarity | n | ˌsɒlɪˈdærəti | ˌsɑːlɪˈdærəti | солидарность | support between people with shared interests | Workers showed *solidarity* with the strikers. | Рабочие выразили солидарность с бастующими.
- surplus | n | ˈsɜːpləs | ˈsɜːrpləs | излишек, избыток | an amount that is more than needed | The country has a food *surplus*. | В стране избыток продовольствия.
- trademark | n | ˈtreɪdmɑːk | ˈtreɪdmɑːrk | товарный знак; фирменная черта | a registered brand name; a typical feature | His smile is his *trademark*. | Улыбка — его фирменная черта.
- validity | n | væˈlɪdɪti | vəˈlɪdəti | обоснованность; срок действия | being valid | I question the *validity* of the study. | Я сомневаюсь в обоснованности исследования.
