title: Events and situations
title_ru: События и ситуации
topic: events
words:
- clash | v | klæʃ |  | сталкиваться, конфликтовать | to fight or argue; to not match | Protesters *clashed* with police. | Протестующие столкнулись с полицией.
- collision | n | kəˈlɪʒn |  | столкновение | an accident in which two things hit each other | The two cars were involved in a *collision*. | Две машины столкнулись.
- descent | n | dɪˈsent |  | спуск, снижение; происхождение | a movement downwards; family origin | The plane began its *descent*. | Самолёт начал снижение. | of Russian descent — русского происхождения
- onset | n | ˈɒnset | ˈɑːnset | начало (чего-то плохого) | the beginning of something unpleasant | The *onset* of the illness was sudden. | Болезнь началась внезапно.
- ordeal | n | ɔːˈdiːl | ɔːrˈdiːl | тяжёлое испытание | a very unpleasant and difficult experience | Staying awake for 11 days was a terrible *ordeal*. | Не спать 11 дней было тяжелейшим испытанием.
- surge | n | sɜːdʒ | sɜːrdʒ | резкий рост, всплеск | a sudden large increase | There has been a *surge* in online shopping. | Произошёл резкий рост онлайн-покупок.
