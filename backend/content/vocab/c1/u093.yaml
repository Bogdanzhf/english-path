title: Events and situations
title_ru: События и ситуации
topic: events
words:
- adoption | n | əˈdɒpʃən | əˈdɑːpʃən | усыновление; принятие | taking a child; starting to use | The *adoption* of new technology is slow. | Новые технологии внедряются медленно.
- backing | n | ˈbækɪŋ |  | поддержка | support | The plan has government *backing*. | План поддерживает правительство.
- breakdown | n | ˈbreɪkdaʊn |  | срыв; поломка | a mental or physical collapse; a failure of a machine | He had a nervous *breakdown*. | У него случился нервный срыв.
- classification | n | ˌklæsɪfɪˈkeɪʃn |  | классификация | the act of putting things into groups | The *classification* of animals into species began in the 18th century. | Классификация животных по видам началась в XVIII веке.
- closure | n | ˈkləʊʒə | ˈkloʊʒər | закрытие | closing | The factory faces *closure*. | Заводу грозит закрытие.
- compliance | n | kəmˈplaɪəns |  | соблюдение, подчинение | the act of obeying a rule or order | Companies must ensure *compliance* with the law. | Компании должны обеспечивать соблюдение закона.
- courtesy | n | ˈkɜːtəsi | ˈkɜːrtəsi | вежливость, любезность | polite behaviour | It's common *courtesy* to say thank you. | Сказать «спасибо» — элементарная вежливость. | courtesy of — благодаря, предоставлено
- grip | n | ɡrɪp |  | хватка, сжатие | a firm hold | He kept a tight *grip* on the rope. | Он крепко держался за верёвку.
- identification | n | aɪˈdentɪfɪˈkeɪʃən | aɪˌdentəfəˈkeɪʃən | идентификация; удостоверение личности | proving who someone is | Bring some *identification*. | Возьмите с собой документ.
- intervention | n | ˌɪntəˈvenʃən | ˌɪntərˈvenʃən | вмешательство | getting involved to change something | Military *intervention* was discussed. | Обсуждали военное вмешательство.
- mercy | n | ˈmɜːsi | ˈmɜːrsi | милосердие, пощада | kindness to someone you could punish | The king showed *mercy* and let the prisoner go. | Король проявил милосердие и отпустил пленника.
- nomination | n | ˌnɒmɪˈneɪʃən | ˌnɑːməˈneɪʃən | выдвижение, номинация | being suggested for a prize | The film got five *nominations*. | Фильм получил пять номинаций.
- orientation | n | ˌɔːriənˈteɪʃən | ˌɔːriːenˈteɪʃən | ориентация; вводный курс | direction; an introduction for new people | New students attend *orientation* week. | Новые студенты проходят ознакомительную неделю.
- prosecution | n | ˌprɒsɪˈkjuːʃən | ˌprɑːsəkˈjuːʃən | судебное преследование; сторона обвинения | taking legal action; the lawyers accusing | The *prosecution* called a witness. | Сторона обвинения вызвала свидетеля.
- revenge | n | rɪˈvendʒ |  | месть | hurting someone because they hurt you | He wanted *revenge* for his brother's death. | Он жаждал мести за смерть брата. | take revenge on — отомстить
- riot | n | ˈraɪət |  | бунт, беспорядки | violent behaviour by a crowd | The tax led to *riots* in the streets. | Налог привёл к беспорядкам на улицах.
- rotation | n | rəʊˈteɪʃən | roʊˈteɪʃən | вращение; чередование | turning; taking turns | The earth's *rotation* causes day and night. | Вращение Земли вызывает смену дня и ночи.
- transaction | n | trænˈzækʃn |  | сделка, операция | an act of buying, selling or transferring money | All *transactions* are recorded by the bank. | Все операции регистрируются банком.
- warfare | n | ˈwɔːfeə | ˈwɔːrfer | военные действия | fighting a war | Chemical *warfare* is banned. | Химическое оружие запрещено.
