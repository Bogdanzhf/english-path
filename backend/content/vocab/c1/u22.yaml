    - q: "What happened after the war in Kalinga?"
      options: ["Ashoka celebrated", "Ashoka was filled with horror and regret", "Ashoka lost the war", "Ashoka invaded another kingdom"]
      answer: 1
    - q: "How did Ashoka spread his ideas?"
      options: ["Through books", "By carving them on stone pillars and rocks", "Through his army", "Through songs"]
      answer: 1
    - q: "What was Ashoka's attitude to religion?"
      options: ["He banned all religions except Buddhism", "He tried to stay neutral and opposed persecution", "He didn't care about religion", "He forced people to convert"]
      answer: 1
