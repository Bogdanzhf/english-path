title: Law and crime
title_ru: Закон и преступность
topic: law
words:
- acquit | v | əˈkwɪt |  | оправдывать (в суде) | to decide someone is not guilty | He was *acquitted* of murder. | Его оправдали по делу об убийстве.
- arson | n | ˈɑːsən | ˈɑːrsən | поджог | setting fire to property on purpose | The fire was caused by *arson*. | Пожар стал результатом поджога.
- blackmail | n | ˈblækmeɪl |  | шантаж | demanding money by threatening to reveal secrets | He was arrested for *blackmail*. | Его арестовали за шантаж.
- bribery | n | ˈbraɪbəri |  | взяточничество | giving bribes | He was accused of *bribery*. | Его обвинили во взяточничестве.
- collaborator | n | kəˈlæbɔːreɪtə | kəˈlæbəreɪtər | соавтор; коллаборационист | a person who works with another | She's my *collaborator* on the book. | Она мой соавтор книги.
- convict | v | kənˈvɪkt |  | осуждать, признавать виновным | to decide officially in court that someone is guilty | He was *convicted* of robbery. | Его признали виновным в ограблении.
- corruption | n | kəˈrʌpʃən |  | коррупция | dishonest behaviour by people in power | *Corruption* is a big problem. | Коррупция — большая проблема.
- crackdown | n | ˈkrækdaʊn |  | жёсткие меры | strong action against something | There's been a *crackdown* on drugs. | Были приняты жёсткие меры против наркотиков.
- defendant | n | dɪˈfendənt |  | обвиняемый, ответчик | a person accused in court | The *defendant* pleaded not guilty. | Обвиняемый не признал вину.
- felony | n | ˈfeləni |  | тяжкое преступление (амер.) | a serious crime | Robbery is a *felony*. | Грабёж — тяжкое преступление.
- hearsay | n | ˈhiəseɪ | ˈhiːrseɪ | слухи | information heard from others | That's just *hearsay*. | Это просто слухи.
- law-abiding | adj | ˈlɔː əbaɪdɪŋ |  | законопослушный | obeying the law | Most citizens are *law-abiding*. | Большинство граждан законопослушны.
- legislation | n | ˌledʒɪˈsleɪʃən | ˌledʒəˈsleɪʃən | законодательство | laws | New *legislation* was passed. | Был принят новый закон.
- manslaughter | n | ˈmænslɔːtə | ˈmænslɔːtər | непредумышленное убийство | killing without intention | He was found guilty of *manslaughter*. | Его признали виновным в непредумышленном убийстве.
- parole | n | pəˈrəʊl | pəˈroʊl | условно-досрочное освобождение | early release from prison | He was released on *parole*. | Его освободили условно-досрочно.
- pickpocket | n | ˈpɪkpɒkɪt | ˈpɪkpɑːkət | карманник | a thief who steals from pockets | Watch out for *pickpockets*. | Остерегайтесь карманников.
- pirate | n | ˈpaɪrət |  | пират | a person who attacks and robs ships at sea | The *pirates* buried their treasure on the island. | Пираты зарыли сокровища на острове.
- probation | n | prəʊˈbeɪʃən | proʊˈbeɪʃən | испытательный срок; условный срок | a period of testing; supervision instead of prison | He was put on *probation*. | Ему дали условный срок.
- prosecute | v | ˈprɒsɪkjuːt | ˈprɑːsɪkjuːt | преследовать в судебном порядке | to officially accuse someone of a crime in court | Shoplifters will be *prosecuted*. | Магазинные воры будут привлечены к ответственности.
- verdict | n | ˈvɜːdɪkt | ˈvɜːrdɪkt | вердикт, приговор | the decision of a jury | The jury reached a *verdict*. | Присяжные вынесли вердикт.
- violation | n | vaɪəˈleɪʃən |  | нарушение | breaking a law or rule | It's a *violation* of human rights. | Это нарушение прав человека.
