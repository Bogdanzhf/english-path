title: Places and the city
title_ru: Город и места
topic: city
words:
- aquarium | n | əˈkweəriəm | əˈkweriəm | аквариум; океанариум | a glass tank or building where fish are kept | We spent the afternoon at the city *aquarium*. | Мы провели день в городском океанариуме.
- battlefield | n | ˈbætəlfiːld |  | поле битвы | a place where a battle is fought | The *battlefield* is now a museum. | Поле битвы теперь музей.
- cemetery | n | ˈsemətri | ˈseməteri | кладбище | a place where dead people are buried | His grandparents are buried in the village *cemetery*. | Его бабушка и дедушка похоронены на деревенском кладбище.
- chamber | n | ˈtʃeɪmbə | ˈtʃeɪmbər | камера, палата, зал | a closed room used for a special purpose | The king's body was found in a secret *chamber*. | Тело короля нашли в потайном зале.
- exterior | n | ɪkˈstɪəriə | ɪkˈstɪriər | внешний вид, наружная сторона | the outside of something | The *exterior* of the building was plain. | Снаружи здание выглядело скромно.
- lawn | n | lɔːn |  | газон, лужайка | an area of short grass in a garden | The children played on the *lawn*. | Дети играли на лужайке.
- locale | n | ləʊˈkɑːl | loʊˈkæl | место действия, местность | the place where something happens | The film's *locale* is ancient China. | Действие фильма происходит в древнем Китае.
- mill | n | mɪl |  | мельница; фабрика | a building where grain is made into flour | There's an old water *mill* by the river. | У реки стоит старая водяная мельница.
- outlet | n | ˈaʊtlet |  | выход; торговая точка; розетка (амер.) | a way to release feelings; a shop | Sport is a good *outlet* for stress. | Спорт — хороший способ снять стресс.
- pinnacle | n | ˈpɪnəkl |  | вершина, пик | the highest point | Winning was the *pinnacle* of her career. | Победа стала вершиной её карьеры.
- premises | n | ˈpremɪsɪz | ˈpreməsəz | помещение, территория | the building and land of a business | No smoking on the *premises*. | На территории не курить.
- province | n | ˈprɒvɪns | ˈprɑːvɪns | провинция, область | a large area of a country with its own government | Quebec is a *province* of Canada. | Квебек — провинция Канады.
- refuge | n | ˈrefjuːdʒ |  | убежище, приют | a place that gives protection | The old barn became a *refuge* for homeless animals. | Старый сарай стал приютом для бездомных животных.
- sanctuary | n | ˈsæŋktʃuəri | ˈsæŋktʃueri | заповедник, убежище | a protected place for animals or people | The elephant *sanctuary* cares for orphans. | Слоновий заповедник заботится о сиротах.
- silhouette | n | ˌsɪlʊˈwet | ˌsɪləˈwet | силуэт | a dark shape against a light background | We saw the *silhouette* of a man. | Мы увидели силуэт мужчины.
- suburbia | n | sʌˈbɜːbiə | səˈbɜːrbiə | пригороды, жизнь в пригороде | suburbs and their way of life | They moved to *suburbia*. | Они переехали в пригород.
- waterfront | n | ˈwɔːtəfrʌnt | ˈwɔːtərfrʌnt | набережная | the area by a river or sea | We had dinner on the *waterfront*. | Мы поужинали на набережной.
