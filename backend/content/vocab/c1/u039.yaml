title: Technology
title_ru: Технологии
topic: tech
words:
- backup | n | ˈbækʌp |  | резервная копия; поддержка | a copy of data; extra help | Make a *backup* of your files. | Сделайте резервную копию файлов.
- broadband | n | ˈbrɔːdbænd |  | широкополосный интернет | fast internet | We have *broadband* at home. | Дома у нас высокоскоростной интернет.
- browser | n | ˈbraʊzə | ˈbraʊzər | браузер | a program for using the internet | Open your *browser*. | Откройте браузер.
- desktop | n | ˈdesktɒp | ˈdesktɑːp | рабочий стол; настольный компьютер | the main screen of a computer | Save the file to the *desktop*. | Сохраните файл на рабочий стол.
- digitalization | n | ˌdɪdʒɪtəlaɪˈzeɪʃn | ˌdɪdʒɪtələˈzeɪʃn | цифровизация | changing to digital systems | The *digitalization* of services is speeding up. | Цифровизация услуг ускоряется. | брит. также digitalisation
- firewall | n | ˈfaɪəwɔːl | ˈfaɪrwɑːl | брандмауэр, файрвол | a system that protects a network | The *firewall* blocked the attack. | Брандмауэр отразил атаку.
- interactive | adj | ˌɪntəˈræktɪv | ˌɪnəˈræktɪv | интерактивный | allowing two-way communication | It's an *interactive* museum. | Это интерактивный музей.
- interface | n | ˈɪntəfeɪs | ˈɪnərfeɪs | интерфейс | the way a user and computer interact | The app has a simple *interface*. | У приложения простой интерфейс.
- laser | n | ˈleɪzə | ˈleɪzər | лазер | a strong narrow beam of light | Doctors use *lasers* in eye surgery. | Врачи используют лазеры в глазной хирургии.
- log | v | lɒɡ | lɔːɡ | регистрировать; входить (log in) | to record; to enter a system | *Log in* with your password. | Войдите с паролем. | log out — выйти
- paywall | n | ˈpeɪwɔːl |  | платный доступ | a system requiring payment to read content | The article is behind a *paywall*. | Статья доступна только по подписке.
- "processing | n | ˈpr\x01ːsesɪŋ | ˈprɑːsesɪŋ | обработка | dealing with data or materials | Data *processing* takes time. | Обработка данных требует времени."
- processor | n | ˈprəʊsesə | ˈprɑːsesər | процессор | the part of a computer that does calculations | It has a fast *processor*. | У него быстрый процессор.
- radar | n | ˈreɪdɑː | ˈreɪdɑːr | радар | a system that finds objects with radio waves | The plane disappeared from the *radar*. | Самолёт исчез с радаров.
- spam | n | spæm |  | спам | unwanted emails | My inbox is full of *spam*. | Мой почтовый ящик полон спама.
- technological revolution | n | ˌteknəˈlɒdʒɪkl ˌrevəˈluːʃən | ˌteknəˈlɑːdʒɪkl ˌrevəˈluːʃən | технологическая революция | huge change caused by technology | We are living through a *technological revolution*. | Мы переживаем технологическую революцию.
- upgrade | v | ʌpˈɡreɪd |  | модернизировать, улучшать | to improve something to a higher standard | The city *upgraded* its water system. | Город модернизировал систему водоснабжения.
