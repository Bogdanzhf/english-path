title: Feelings and states
title_ru: Чувства и состояния
topic: feelings
words:
- accustomed | adj | əˈkʌstəmd |  | привыкший | used to | I'm not *accustomed* to the heat. | Я не привык к жаре.
- apprehensive | adj | ˌæprɪˈhensɪv | ˌæpriːˈhensɪv | опасающийся, встревоженный | worried about the future | I'm *apprehensive* about the interview. | Я волнуюсь перед собеседованием.
- avid | adj | ˈævɪd | ˈævəd | заядлый, страстный | very enthusiastic | He's an *avid* reader. | Он заядлый читатель.
- bubbly | adj | ˈbʌbli | ˈbʌbəli | жизнерадостный; игристый | lively and cheerful | She has a *bubbly* personality. | У неё весёлый характер.
- claustrophobic | adj | ˌklɒstrəˈfəʊbɪk | ˌklɔːstrəˈfoʊbɪk | страдающий клаустрофобией; тесный | afraid of small spaces | The room felt *claustrophobic*. | В комнате было тесно и душно.
- compliant | adj | kəmˈplaɪənt |  | соответствующий (требованиям); уступчивый | following rules | The product is *compliant* with EU law. | Продукт соответствует законодательству ЕС.
- compromised | adj | ˈkɒmprəmaɪzd | ˈkɑːmprəmaɪzd | скомпрометированный, ослабленный | weakened; made unsafe | Your account may be *compromised*. | Ваш аккаунт мог быть взломан.
- congested | adj | kənˈdʒestɪd |  | перегруженный, переполненный | too full of traffic or people | The roads are *congested* with delivery vans. | Дороги забиты фургонами доставки.
- deceased | adj | dɪˈsiːst |  | умерший, покойный | dead (formal) | Her parents are both *deceased*. | Оба её родителя умерли. | the deceased — покойный
- disquieting | adj | dɪˈskwaɪətɪŋ | dɪsˈkwaɪətɪŋ | тревожный | worrying | There are *disquieting* signs. | Есть тревожные признаки.
- esteemed | adj | ɪˈstiːmd |  | уважаемый | respected and admired | She is an *esteemed* expert in bird biology. | Она уважаемый специалист по биологии птиц.
- insecure | adj | ˌɪnsɪˈkjɔː | ˈɪnsəkjər | неуверенный в себе; ненадёжный | not confident; not safe | She feels *insecure* about her looks. | Она не уверена в своей внешности.
- irate | adj | aɪˈreɪt |  | разгневанный | very angry | An *irate* customer called. | Позвонил разгневанный клиент.
- lethargic | adj | leˈθɑːdʒɪk | ləˈθɑːrdʒɪk | вялый, апатичный | tired and without energy | I feel *lethargic* today. | Я сегодня вялый.
- liable | adj | ˈlaɪəbl |  | ответственный (юридически); склонный | legally responsible; likely to do something | Companies should be *liable* for conditions in their factories. | Компании должны нести ответственность за условия на своих фабриках.
- reluctant | adj | rɪˈlʌktənt |  | неохотный | not wanting to do something | He was *reluctant* to help. | Он неохотно соглашался помочь. | reluctantly — неохотно
- troubled | adj | ˈtrʌbəld |  | обеспокоенный; неблагополучный | worried; having problems | He had a *troubled* childhood. | У него было трудное детство.
- undaunted | adj | ʌnˈdɔːntɪd | ənˈdɔːntɪd | неустрашимый | not discouraged | *Undaunted*, she tried again. | Не отчаявшись, она попробовала снова.
- unwavering | adj | ʌnˈweɪvərɪŋ | ənˈweɪvərɪŋ | непоколебимый | not changing | She has *unwavering* faith. | У неё непоколебимая вера.
- victorious | adj | vɪkˈtɔːrɪəs | vɪkˈtɔːriəs | победоносный | having won | The *victorious* team celebrated. | Команда-победитель праздновала.
- wary | adj | ˈweəri | ˈweri | настороженный | careful because of possible danger | Be *wary* of strangers. | Остерегайся незнакомцев.
