title: Character and personality
title_ru: Характер и личность
topic: feelings
words:
- impersonal | adj | ɪmˈpɜːsənl | ɪmˈpɜːrsənl | безличный, обезличенный | not friendly or human; without personal feelings | Zoos can feel cold and *impersonal*. | Зоопарки бывают холодными и бездушными.
- industrious | adj | ɪnˈdʌstriəs |  | трудолюбивый | working hard | They were an *industrious* team. | Это была трудолюбивая команда. | не «промышленный» (это industrial)
- resourceful | adj | rɪˈsɔːsfl | rɪˈsɔːrsfl | находчивый | good at finding ways to solve problems | She's very *resourceful* and always finds a solution. | Она очень находчивая и всегда находит решение.
