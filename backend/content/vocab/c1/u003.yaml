title: People and relationships
title_ru: Люди и отношения
topic: people
words:
- adolescent | n | ˌædəˈlesnt |  | подросток | a young person between childhood and adulthood | *Adolescents* need about nine hours of sleep. | Подросткам нужно около девяти часов сна. | adolescence — подростковый возраст
- beneficiary | n | ˌbenɪˈfɪʃəri | ˌbenəˈfɪʃiːeri | наследник; получатель выгоды | a person who receives money or benefits | She's the main *beneficiary* of the will. | Она главная наследница по завещанию.
- brute | n | bruːt |  | грубиян, скотина; грубая сила | a cruel, violent person; force without intelligence | He used *brute* force to open the door. | Он открыл дверь грубой силой.
- censor | v | ˈsensə | ˈsensər | подвергать цензуре | to remove parts of books, films or news that are considered unacceptable | The government *censored* the newspapers. | Правительство цензурировало газеты. | censorship — цензура
- contender | n | kənˈtendə | kənˈtendər | претендент | a person competing to win | She's a strong *contender* for the title. | Она серьёзная претендентка на титул.
- councillor | n | ˈkaʊnsɪlə | kˈaʊnsɪlɐ | член совета (городского) | a member of a local council | She was elected as a local *councillor*. | Её избрали в местный совет. | амер. councilor
- culprit | n | ˈkʌlprɪt |  | виновник | the person or thing responsible for a problem | Investigators searched for the *culprit*. | Следователи искали виновника.
- 'delegate | n | ˈdeləɡeɪt |  | делегат | a person sent to represent others | *Delegates* from 50 countries attended. | Присутствовали делегаты из 50 стран. | гл.: delegate [ˈdelɪɡeɪt] — поручать'
- extremist | n | ɪkˈstriːmɪst | ekˈstriːmɪst | экстремист | a person with extreme political views | The attack was carried out by *extremists*. | Нападение совершили экстремисты.
- foe | n | fəʊ | foʊ | враг, противник | an enemy (formal) | He faced his *foe* in the arena. | Он встретился со своим противником на арене.
- heroine | n | ˈherəʊɪn | ˈheroʊən | героиня | a female hero | The *heroine* of the novel is a young doctor. | Героиня романа — молодой врач.
- hostess | n | ˈhəʊstes | ˈhoʊstəs | хозяйка (вечера); стюардесса | a woman who has guests | She's a wonderful *hostess*. | Она замечательная хозяйка.
- hypocrite | n | ˈhɪpəkrɪt |  | лицемер | a person who says one thing and does another | Don't be such a *hypocrite*! | Не будь лицемером!
- inmate | n | ˈɪnmeɪt |  | заключённый | a prisoner | Two *inmates* escaped. | Двое заключённых сбежали.
- novice | n | ˈnɒvɪs | ˈnɑːvəs | новичок | a beginner | I'm a *novice* at skiing. | Я новичок в лыжах.
- oracle | n | ˈɒrəkl | ˈɔːrəkl | оракул | a priest or place through which gods were believed to speak | People travelled far to consult the *oracle*. | Люди приезжали издалека, чтобы спросить совета у оракула.
- outsider | n | aʊtˈsaɪdə | aʊtˈsaɪdər | посторонний, чужак | a person not part of a group | I felt like an *outsider*. | Я чувствовал себя чужим.
- peasant | n | ˈpezənt |  | крестьянин | a poor farm worker in the past | The *peasants* worked the land. | Крестьяне обрабатывали землю.
- preacher | n | ˈpriːtʃə | ˈpriːtʃər | проповедник | a person who gives religious talks | He was a famous *preacher*. | Он был известным проповедником.
- protagonist | n | prəʊˈtæɡənɪst | proʊˈtæɡənəst | главный герой | the main character | The *protagonist* is a teenage girl. | Главная героиня — девочка-подросток.
- psychotic | adj | saɪˈkɒtɪk | saɪˈkɑːtɪk | психотический | having a serious mental illness that affects the sense of reality | He suffered a *psychotic* episode. | У него случился психотический эпизод.
- subscriber | n | səbˈskraɪbə | səbsˈkraɪbər | подписчик, абонент | a person who pays for a service regularly | The magazine has 100,000 *subscribers*. | У журнала 100 000 подписчиков.
