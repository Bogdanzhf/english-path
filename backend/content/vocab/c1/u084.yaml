title: 'Describing: qualities'
title_ru: 'Описание: свойства и признаки'
topic: describing
words:
- abrupt | adj | əˈbrʌpt |  | внезапный, резкий | sudden and unexpected; rude and unfriendly | The meeting came to an *abrupt* end. | Встреча резко оборвалась.
- anchored | adj | ˈænkəd | ˈæŋkərd | закреплённый, на якоре | fixed firmly | The boat was *anchored* in the bay. | Лодка стояла на якоре в бухте.
- complimentary | adj | ˌkɒmplɪˈmentəri | ˌkɑːmpləˈmentəri | бесплатный; хвалебный | free; praising | Breakfast is *complimentary*. | Завтрак бесплатный.
- fanciful | adj | ˈfænsɪfl |  | причудливый; надуманный | imaginative but not realistic | That's a *fanciful* idea. | Это фантастическая идея.
- favourable | adj | ˈfeɪvərəbl | fˈeɪvərəbl | благоприятный | good; positive | The weather was *favourable*. | Погода была благоприятной. | амер. favorable
- frosty | adj | ˈfrɒsti | ˈfrɔːsti | морозный; холодный (об отношении) | very cold; unfriendly | We got a *frosty* reception. | Нас встретили холодно.
- indefinite | adj | ɪnˈdefɪnət | ˌɪnˈdefənət | неопределённый | without a fixed limit | He's on *indefinite* leave. | Он в бессрочном отпуске.
- misguided | adj | ˌmɪsˈɡaɪdɪd |  | ошибочный, неразумный | based on wrong ideas | It was a *misguided* attempt to help. | Это была неудачная попытка помочь.
- nondescript | adj | ˌnɒndɪˈskrɪpt | ˈnɑːndɪsˈkrɪpt | невзрачный, неприметный | ordinary and dull | He lives in a *nondescript* building. | Он живёт в неприметном здании.
- readable | adj | ˈriːdəbl |  | читабельный, лёгкий для чтения | easy to read | The book is very *readable*. | Книга легко читается.
- recognizable | adj | ˌrekəɡˈnaɪzəbl |  | узнаваемый | easy to recognise | Her voice is instantly *recognizable*. | Её голос узнаётся сразу. | брит. также recognisable
- reputable | adj | ˈrepjətəbl |  | авторитетный, с хорошей репутацией | having a good reputation | Buy from a *reputable* dealer. | Покупайте у продавца с хорошей репутацией.
- rudimentary | adj | ˌruːdɪˈmentəri | ˌruːdəˈmentəri | элементарный, зачаточный | basic | I have a *rudimentary* knowledge of Spanish. | У меня базовые знания испанского.
- sterile | adj | ˈsteraɪl | ˈsterəl | стерильный; бесплодный | completely clean and free from germs | Surgeons use *sterile* instruments. | Хирурги используют стерильные инструменты.
- sustainably | adv | səˈsteɪnəbli | səstˈeɪnəbli | устойчиво, рационально | in a sustainable way | The fish are caught *sustainably*. | Рыбу ловят с соблюдением экологических норм.
- unassisted | adj | ʌnəˈsɪstɪd | ˌʌnəˈsɪstɪd | без посторонней помощи | without help | He can now walk *unassisted*. | Теперь он может ходить без помощи.
- unconventional | adj | ʌnkənˈvenʃənl | ˌʌnkənˈvenʃənl | нетрадиционный | not usual | She has *unconventional* methods. | У неё нестандартные методы.
- unintelligible | adj | ˌʌnɪnˈtelɪdʒəbl | ˌʌnɪnˈtelədʒəbl | неразборчивый, непонятный | impossible to understand | His speech was *unintelligible*. | Его речь была невнятной.
- unmanageable | adj | ʌnˈmænɪdʒəbl | ənˈmænɪdʒəbl | неуправляемый | difficult to control | The workload is *unmanageable*. | Нагрузка непосильная.
- unmanned | adj | ʌnˈmænd | ənˈmænd | беспилотный | without people | It's an *unmanned* aircraft. | Это беспилотный самолёт.
- unoccupied | adj | ʌˈnɒkjʊpaɪd | əˈnɑːkjəpaɪd | незанятый, пустующий | empty | The house has been *unoccupied* for years. | Дом годами пустует.
