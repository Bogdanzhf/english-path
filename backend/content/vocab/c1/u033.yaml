title: Education
title_ru: Учёба
topic: education
words:
- calculus | n | ˈkælkjʊləs | ˈkælkjələs | математический анализ | a branch of advanced maths | He's studying *calculus*. | Он изучает матанализ.
- critical thinking | n | ˈkrɪtɪkl ˈθɪŋkɪŋ |  | критическое мышление | analysing ideas carefully | Schools should teach *critical thinking*. | Школы должны учить критическому мышлению.
- deliver a lecture | phr |  |  | читать лекцию | to give a talk at university | The professor *delivered a lecture* on history. | Профессор прочитал лекцию по истории.
