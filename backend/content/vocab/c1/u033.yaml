- extracurricular activities | n | ˌekstrəkəˈrɪkjʊlə ækˈtɪvɪtiz | ˌekstrəkəˈrɪkjələr ækˈtɪvətiːz | внеклассные занятия | activities outside lessons | The school offers many *extracurricular activities*. | В школе много кружков.
- fall behind | phv |  |  | отставать | to make less progress than others | He *fell behind* in maths. | Он отстал по математике.
