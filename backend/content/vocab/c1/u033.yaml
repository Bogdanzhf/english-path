title: Education
title_ru: Учёба
topic: education
words:
- acquisition | n | ˌækwɪˈzɪʃn |  | приобретение | something you have obtained; the act of getting it | The museum's latest *acquisition* is a Spanish cannon. | Последнее приобретение музея — испанская пушка.
- tuition | n | tjuˈɪʃn | tuˈɪʃn | обучение; плата за обучение | teaching; the money paid for it | *Tuition* fees at art schools are very high. | Плата за обучение в художественных школах очень высокая.
- undergraduate | n | ˌʌndəˈɡrædʒuət | ˌʌndərˈɡrædʒuət | студент (бакалавриата) | a university student studying for a first degree | She's an *undergraduate* at Cambridge. | Она студентка бакалавриата в Кембридже.
