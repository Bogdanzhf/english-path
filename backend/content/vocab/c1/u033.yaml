- vocational training | n | vəʊˈkeɪʃənl ˈtreɪnɪŋ | voʊˈkeɪʃənl ˈtreɪnɪŋ | профессиональное обучение | training for a particular job | He did *vocational training* as an electrician. | Он прошёл профобучение на электрика.
