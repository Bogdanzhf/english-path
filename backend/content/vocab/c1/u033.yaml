- keep up with | phv |  |  | не отставать от | to go at the same speed as | I can't *keep up with* the class. | Я не успеваю за классом.
- lifelong learning | n | ˈlaɪflɒŋ ˈlɜːnɪŋ | ˈlaɪˈflɔːŋ ˈlɜːrnɪŋ | обучение в течение всей жизни | learning throughout life | *Lifelong learning* keeps the mind active. | Учёба всю жизнь сохраняет ум активным.
- major in | phv |  |  | специализироваться (в вузе) (амер.) | to study as your main subject | She *majored in* history. | Её основной специальностью была история.
- mature student | n | məˈtʃɔː ˈstjuːdənt | məˈtʃʊr ˈstuːdənt | взрослый студент | a student older than usual | He's a *mature student* of 40. | Он взрослый студент сорока лет.
- peer pressure | n | pɪ ˈpreʃə | pɪr ˈpreʃər | давление сверстников | influence from people your age | Teenagers often give in to *peer pressure*. | Подростки часто поддаются давлению сверстников.
- rote learning | n | rəʊt ˈlɜːnɪŋ | roʊt ˈlɜːrnɪŋ | зубрёжка | learning by repetition | *Rote learning* isn't very effective. | Зубрёжка не очень эффективна.
- standardised test | n | ˈstændədaɪzd test | stˈændədaɪzd test | стандартизированный тест | a test given to all students in the same way | Students take a *standardised test* at 16. | В 16 лет ученики сдают стандартизированный тест. | амер. standardized
- student loan | n | ˈstjuːdənt ləʊn | ˈstuːdənt loʊn | студенческий кредит | money borrowed to pay for university | He's still paying off his *student loan*. | Он всё ещё выплачивает студенческий кредит.
- tertiary education | n | ˈtɜːʃjəri ˌedʒuːˈkeɪʃən | ˈtɜːrʃəri ˌedʒəˈkeɪʃən | высшее образование | education after school | *Tertiary education* is free in some countries. | В некоторых странах высшее образование бесплатно.
- top-tier institution | n |  |  | ведущий вуз | one of the best universities | She studies at a *top-tier institution*. | Она учится в одном из ведущих вузов.
