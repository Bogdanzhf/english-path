title: 'Describing: good or bad'
title_ru: 'Описание: оценка — хорошо или плохо'
topic: describing
words:
- exceptional | adj | ɪkˈsepʃənl |  | исключительный | unusually good; very unusual | She showed *exceptional* courage. | Она проявила исключительное мужество.
- fatal | adj | ˈfeɪtl |  | смертельный, роковой | causing death | Eating plastic can be *fatal* for seabirds. | Поедание пластика может быть смертельным для морских птиц.
- viable | adj | ˈvaɪəbl |  | жизнеспособный, осуществимый | able to work successfully | Is this a *viable* plan? | Это осуществимый план?
- wicked | adj | ˈwɪkɪd |  | злой, порочный | very bad; evil | The *wicked* stepmother was cruel to Cinderella. | Злая мачеха была жестока к Золушке.
