title: 'Describing: good or bad'
title_ru: 'Описание: оценка — хорошо или плохо'
topic: describing
words:
- appalling | adj | əˈpɔːlɪŋ |  | ужасающий | shocking and very bad | The conditions were *appalling*. | Условия были ужасающими.
- appealing | adj | əˈpiːlɪŋ |  | привлекательный | attractive | The idea is very *appealing*. | Идея очень привлекательна.
- damaging | adj | ˈdæmɪdʒɪŋ |  | вредный, разрушительный | causing harm | Smoking is *damaging* to health. | Курение вредит здоровью.
- desirable | adj | dɪˈzaɪərəbl |  | желательный, желанный | worth having | It's a very *desirable* area. | Это очень престижный район.
- gracious | adj | ˈɡreɪʃəs |  | любезный, благосклонный | kind, polite and generous | She was a *gracious* host. | Она была радушной хозяйкой.
- inadequate | adj | ɪˈnædɪkwət | ˌɪˈnædəkweɪt | недостаточный, неадекватный | not good enough | The heating is *inadequate*. | Отопление недостаточное.
- insufficient | adj | ɪnsəˈfɪʃənt | ˌɪnsəˈfɪʃənt | недостаточный | not enough | There was *insufficient* evidence. | Улик было недостаточно.
- intriguing | adj | ɪnˈtriːɡɪŋ | ˌɪnˈtriːɡɪŋ | интригующий | very interesting | It's an *intriguing* idea. | Это интригующая идея.
- meaningless | adj | ˈmiːnɪŋləs |  | бессмысленный | without meaning | The words were *meaningless* to me. | Эти слова для меня ничего не значили.
- optimal | adj | ˈɒptɪml | ˈɑːptəml | оптимальный | the best possible | What's the *optimal* temperature? | Какая температура оптимальна?
- phenomenal | adj | fəˈnɒmɪnl | fəˈnɑːmɪnl | феноменальный | extremely good or great | The document had a *phenomenal* influence. | Документ оказал феноменальное влияние.
- plausible | adj | ˈplɔːzəbl |  | правдоподобный | seeming true | His excuse sounded *plausible*. | Его оправдание звучало правдоподобно.
- prestigious | adj | preˈstɪdʒəs | pərˈstiːdʒəs | престижный | respected and admired | She studied at a *prestigious* university. | Она училась в престижном университете.
- problematic | adj | ˌprɒbəlˈmætɪk | ˌprɑːbləˈmætɪk | проблематичный | causing problems | The plan is *problematic*. | План проблематичен.
- provocative | adj | prəˈvɒkətɪv | proʊˈvɑːkətɪv | провокационный | causing strong reactions | It's a *provocative* article. | Это провокационная статья.
- refreshing | adj | rɪˈfreʃɪŋ |  | освежающий; приятно новый | making you feel fresh; pleasantly different | It's *refreshing* to meet honest people. | Приятно встретить честных людей.
- robust | adj | rəʊˈbʌst | roʊˈbʌst | крепкий, надёжный | strong and healthy | The economy is *robust*. | Экономика устойчива.
- sinister | adj | ˈsɪnɪstə | ˈsɪnɪstər | зловещий | making you feel that something bad will happen | There was something *sinister* about the dark house. | В тёмном доме было что-то зловещее.
- superb | adj | suːˈpɜːb | sʊˈpɜːrb | превосходный | excellent | The food was *superb*. | Еда была превосходной.
- thought-provoking | adj | ˈθɔːt prəvəʊkɪŋ | ˈθɔːt prəvoʊkɪŋ | заставляющий задуматься | making you think | It's a *thought-provoking* film. | Это фильм, заставляющий задуматься.
- viable | adj | ˈvaɪəbl |  | жизнеспособный, осуществимый | able to work successfully | Is this a *viable* plan? | Это осуществимый план?
