title: Economy and business
title_ru: Экономика и бизнес
topic: economy
words:
- audit | v | ˈɔːdɪt |  | проводить аудит, проверять | to officially check financial records | The accounts are *audited* every year. | Счета ежегодно проходят аудит.
- commodity | n | kəˈmɒdəti | kəˈmɑːdəti | товар, сырьё | a product that is bought and sold | Grain was the most important *commodity* in Rome. | Зерно было важнейшим товаром в Риме.
- concession | n | kənˈseʃn |  | уступка | something you give up in a negotiation | The government made several *concessions*. | Правительство пошло на ряд уступок.
- franchise | n | ˈfræntʃaɪz |  | франшиза | permission to sell a company's products under its name | They opened a *franchise* in Madrid. | Они открыли франшизу в Мадриде.
