title: Actions and movement
title_ru: Действия и движение
topic: actions
words:
- assemble | v | əˈsembl |  | собирать(ся); монтировать | to come together in a group; to put parts together | Crowds *assemble* at the stones every summer. | Каждое лето у камней собираются толпы.
- conceive | v | kənˈsiːv |  | задумать, представить | to think of a plan or idea | The emperor *conceived* the idea of an army for the afterlife. | Император задумал создать армию для загробной жизни.
- configure | v | kənˈfɪɡə | kənˈfɪɡjər | настраивать, конфигурировать | to arrange or set up equipment or software | The app is easy to *configure*. | Приложение легко настроить.
- conjure | v | ˈkʌndʒə | ˈkɑːndʒər | вызывать (в воображении); показывать фокусы | to create as if by magic | The smell *conjured* up memories. | Запах вызвал воспоминания.
- daydream | v | ˈdeɪdriːm |  | мечтать, витать в облаках | to think about pleasant things while awake | Stop *daydreaming*! | Хватит витать в облаках!
- depict | v | dɪˈpɪkt |  | изображать | to show in a picture or describe in words | The painting *depicts* the explorers' last days. | Картина изображает последние дни исследователей.
- devise | v | dɪˈvaɪz |  | придумывать, разрабатывать | to invent a plan or method | They *devised* a new way to save water. | Они придумали новый способ экономить воду.
- drain | v | dreɪn |  | сливать; истощать | to let liquid flow away; to make tired | *Drain* the pasta. | Слейте воду с макарон.
- halt | v | hɔːlt |  | останавливать(ся) | to stop | The investigation was *halted* due to lack of evidence. | Расследование приостановили из-за нехватки улик.
- impersonate | v | ɪmˈpɜːsəneɪt | ˌɪmˈpɜːrsəneɪt | выдавать себя за; пародировать | to pretend to be someone | He *impersonated* a police officer. | Он выдавал себя за полицейского.
- induce | v | ɪnˈdjuːs | ɪnˈduːs | вызывать; побуждать | to cause something to happen; to persuade | The drug may *induce* sleepiness. | Препарат может вызывать сонливость.
- initiate | v | ˌɪˈnɪʃieɪt | ˌɪˈnɪʃiːeɪt | начинать, инициировать | to start | The government *initiated* reforms. | Правительство начало реформы.
- innovate | v | ˈɪnəveɪt |  | вводить новшества | to introduce new ideas | Companies must *innovate* to survive. | Чтобы выжить, компании должны внедрять новое.
- invoke | v | ɪnˈvəʊk | ɪnˈvoʊk | ссылаться на; взывать | to mention something to support an argument; to call on a god | He *invoked* the full moon to explain his bad mood. | Своё плохое настроение он объяснял полнолунием.
- marshal | v | ˈmɑːʃl | ˈmɑːrʃl | собирать, выстраивать | to gather and organize people or things | The general *marshalled* his troops for battle. | Полководец выстроил войска к бою. | сущ. marshal — маршал
- retreat | v | rɪˈtriːt |  | отступать | to move back to escape an enemy | The army was forced to *retreat*. | Армия была вынуждена отступить.
- simulate | v | ˈsɪmjuleɪt |  | моделировать, имитировать | to create conditions that are like real ones | Astronauts trained in machines that *simulate* weightlessness. | Астронавты тренировались на аппаратах, имитирующих невесомость.
- spin | v | spɪn |  | крутиться, вращаться | to turn round and round quickly | The wheels *spun* in the mud. | Колёса крутились в грязи. | spin — spun — spun
- swing | v | swɪŋ |  | качаться, раскачивать | to move backwards and forwards from a fixed point | The children were *swinging* in the park. | Дети качались на качелях в парке. | сущ. swing — качели
- thrust | v | θrʌst |  | толкать, вонзать | to push suddenly and strongly | She *thrust* the letter into my hand. | Она сунула письмо мне в руку. | thrust — thrust — thrust
