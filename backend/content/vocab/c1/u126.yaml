title: Thinking and opinions
title_ru: Мысли и мнения
topic: mind
words:
- await | v | əˈweɪt |  | ожидать | to wait for (formal) | Scientists eagerly *await* the results. | Учёные с нетерпением ждут результатов.
- comprehend | v | ˌkɒmprɪˈhend | ˌkɑːmprɪˈhend | постигать, понимать | to understand fully | I can't *comprehend* why he did it. | Не могу понять, зачем он это сделал.
- conscience | n | ˈkɒnʃəns | ˈkɑːnʃəns | совесть | the inner sense of what is right and wrong | He had a guilty *conscience* about lying. | Его мучила совесть из-за лжи.
- incidence | n | ˈɪnsɪdəns |  | частота, распространённость | how often something happens | The *incidence* of plastic in fish has risen. | Пластик стал чаще обнаруживаться в рыбе.
- neglect | v | nɪˈɡlekt |  | пренебрегать, запускать | to not give enough care or attention | The garden was *neglected* for years. | Сад годами был заброшен.
- skip | v | skɪp |  | пропускать; прыгать | to not do something you usually do | Don't *skip* breakfast — it's important. | Не пропускай завтрак — это важно.
- tolerate | v | ˈtɒləreɪt | ˈtɑːləreɪt | терпеть, выносить | to accept something you don't like | I can't *tolerate* rude people. | Я не выношу грубых людей.
- verify | v | ˈverɪfaɪ |  | проверять, подтверждать | to check that something is true | We need to *verify* your identity. | Нам нужно подтвердить вашу личность.
