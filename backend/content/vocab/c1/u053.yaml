title: 'How and how much: adverbs'
title_ru: 'Как и насколько: наречия'
topic: manner
words:
- aesthetically | adv | iːsˈθetɪkli | esˈθetɪkli | эстетически | relating to beauty | The building is *aesthetically* pleasing. | Здание эстетически привлекательно.
- amply | adv | ˈæmpli |  | вполне, щедро | more than enough | She was *amply* rewarded. | Она была щедро вознаграждена.
- artistically | adv | ɑːˈtɪstɪkli | ɑːrˈtɪstɪkli | художественно | in an artistic way | The food was *artistically* arranged. | Еда была красиво оформлена.
- astray | adv | əˈstreɪ |  | с пути, в сторону | away from the right way | The letter went *astray*. | Письмо затерялось. | lead astray — сбить с пути
- domestically | adv | dəˈmestɪkli |  | внутри страны; по дому | within a country; at home | The product is sold *domestically*. | Продукт продаётся внутри страны.
- dynamically | adv | daɪˈnæmɪkli | daɪˈnæmɪkliː | динамично | in an energetic way | The company is growing *dynamically*. | Компания динамично растёт.
- enormously | adv | ɪˈnɔːməsli | iːˈnɔːrməsli | чрезвычайно | very much | Prices have risen *enormously*. | Цены выросли невероятно.
- favorably | adv | ˈfeɪvɜːəbli | ˈfeɪvərəbli | благоприятно (амер.) | in a positive way | The plan was received *favorably*. | План был встречен благосклонно. | брит. favourably
- fiercely | adv | ˈfiəsli | ˈfɪrsli | яростно, неистово | in a fierce way | They fought *fiercely*. | Они яростно сражались.
- firsthand | adv | ˌfɜːstˈhænd | ˌfɜːrstˈhænd | из первых рук, лично | directly, from your own experience | I learned *firsthand* how hard it is to move abroad. | Я на собственном опыте узнал, как трудно переехать за границу. | брит. first-hand
- justly | adv | ˈdʒʌstli |  | справедливо, по праву | fairly; correctly | She is *justly* proud of her work. | Она по праву гордится своей работой.
- plausibly | adv | ˈplɔːzəbli |  | правдоподобно | in a believable way | He argued *plausibly*. | Он рассуждал убедительно.
- principally | adv | ˈprɪnsɪpəli | ˈprɪnsɪpli | главным образом | mainly | The course is *principally* for adults. | Курс предназначен главным образом для взрослых.
- sarcastically | adv | sɑːˈkɑːstɪkli | sɑːrˈkæstɪkli | саркастически | in a sarcastic way | "Great idea," he said *sarcastically*. | «Отличная идея», — съязвил он.
- soundly | adv | ˈsaʊndli |  | крепко (спать); основательно | deeply (of sleep); thoroughly | The baby slept *soundly* all night. | Малыш крепко спал всю ночь.
- spontaneously | adv | spɒnˈteɪniəsli | spɑːnˈteɪniəsli | спонтанно | without planning | The crowd *spontaneously* began to sing. | Толпа спонтанно запела.
- stylistically | adv | staɪˈlɪstɪkli |  | стилистически | relating to style | The two paintings are *stylistically* similar. | Эти две картины близки по стилю.
- subtly | adv | ˈsʌtəli |  | тонко, едва заметно | in a delicate way | The colours change *subtly*. | Цвета едва заметно меняются.
