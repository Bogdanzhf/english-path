title: Actions and movement
title_ru: Действия и движение
topic: actions
words:
- convene | v | kənˈviːn |  | созывать; собираться | to call or come together for a meeting | The committee will *convene* next week. | Комитет соберётся на следующей неделе.
- crawl | v | krɔːl |  | ползать, ползти | to move on your hands and knees | The baby is learning to *crawl*. | Малыш учится ползать. | crawl — также стиль плавания кроль
- creep | v | kriːp |  | красться, ползти | to move slowly and quietly | I *crept* downstairs so I wouldn't wake anyone. | Я прокрался вниз, чтобы никого не разбудить. | creep — crept — crept
- crumble | v | ˈkrʌmbl |  | крошиться, рассыпаться | to break into small pieces | The old walls were starting to *crumble*. | Старые стены начинали осыпаться. | crumb — крошка
- descend | v | dɪˈsend |  | спускаться | to go down | The plane began to *descend*. | Самолёт начал снижаться.
- displace | v | dɪˈspleɪs | dɪsˈpleɪs | вытеснять; перемещать | to force out of a place | The war *displaced* millions. | Война вынудила миллионы покинуть дома.
- divert | v | daɪˈvɜːt | daɪˈvɜːrt | отвлекать; перенаправлять | to change direction | Traffic was *diverted*. | Движение пустили в объезд.
- drift | v | drɪft |  | дрейфовать, плыть по течению | to move slowly on water or air without control | The empty boat *drifted* out to sea. | Пустая лодка уплыла в море.
- embark | v | ɪmˈbɑːk | emˈbɑːrk | садиться на судно; приступать | to board a ship; to start | We *embarked* on a new project. | Мы взялись за новый проект.
- evacuate | v | ɪˈvækjueɪt |  | эвакуировать | to move people away from danger | The building was *evacuated* immediately. | Здание немедленно эвакуировали.
- flee | v | fliː |  | бежать, спасаться бегством | to escape from danger quickly | Thousands *fled* the city when the war began. | Тысячи людей бежали из города, когда началась война. | flee — fled — fled
- 'lapse | n | læps |  | промах, упущение; промежуток | a small mistake; a period of time | It was a *lapse* of concentration. | Это был момент невнимательности. | гл.: lapse — истекать'
- overturn | v | ˌəʊvəˈtɜːn | ˈoʊvərtɜːrn | переворачивать(ся); отменять | to turn over; to change a decision | The court *overturned* the decision. | Суд отменил решение.
- pounce | v | paʊns |  | наброситься | to jump on suddenly | The cat *pounced* on the mouse. | Кошка набросилась на мышь.
- replicate | v | ˈreplɪkeɪt | ˈrepləkeɪt | воспроизводить, повторять | to copy exactly | Scientists *replicated* the experiment. | Учёные повторили эксперимент.
- rotate | v | rəʊˈteɪt | ˈroʊteɪt | вращаться | to turn around a central point | The Earth *rotates* once every 24 hours. | Земля совершает оборот вокруг своей оси за 24 часа.
- sift | v | sɪft |  | просеивать | to pass flour through a sieve to remove lumps | *Sift* the flour into a bowl. | Просейте муку в миску.
- soar | v | sɔː | sɔːr | взлетать, резко расти | to rise quickly to a high level | The number of female students has *soared*. | Число студенток резко выросло.
- steer | v | stɪə | stɪr | управлять, вести (машину, судно) | to control the direction of a vehicle | He *steered* the boat towards the shore. | Он направил лодку к берегу. | steering wheel — руль
- tilt | v | tɪlt |  | наклонять(ся) | to move into a sloping position | He *tilted* his hat against the sun. | Он сдвинул шляпу, прикрываясь от солнца.
