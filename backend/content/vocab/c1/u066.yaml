title: 'Describing: qualities'
title_ru: 'Описание: свойства и признаки'
topic: describing
words:
- advisory | adj | ədˈvaɪzəri | ædˈvaɪzəri | консультативный | giving advice | She's on the *advisory* board. | Она в консультативном совете.
- alien | adj | ˈeɪliən |  | чуждый, чужой | strange and unfamiliar | The idea is *alien* to our culture. | Эта идея чужда нашей культуре.
- alpha | adj | ˈælfə |  | альфа-, главный, доминантный | (of an animal or person) the most powerful in a group | The *alpha* male leads the group of gorillas. | Альфа-самец возглавляет группу горилл.
- anonymous | adj | əˈnɒnɪməs | əˈnɑːnɪməs | анонимный | having an unknown name | The statues were carved by *anonymous* artists. | Статуи вырезали безымянные мастера.
- appetizing | adj | ˈæpɪtaɪzɪŋ |  | аппетитный | looking or smelling good to eat | The food didn't look very *appetizing*. | Еда выглядела не очень аппетитно. | брит. также appetising
- beguiling | adj | bɪˈɡaɪlɪŋ |  | обманчиво привлекательный, пленительный | charming, sometimes in a deceptive way | She has a *beguiling* smile. | У неё пленительная улыбка.
- cognitive | adj | ˈkɒɡnətɪv | ˈkɑːɡnətɪv | когнитивный, познавательный | connected with thinking, learning and memory | Sleep improves *cognitive* performance. | Сон улучшает когнитивные способности.
- 'grave | adj | ɡreɪv |  | серьёзный, тяжёлый | very serious | We are in *grave* danger. | Нам грозит серьёзная опасность. | сущ.: grave — могила'
- gross | adj | ɡrəʊs | ɡroʊs | валовой, общий; грубый; противный | total, before anything is taken away; very obvious; disgusting | Their *gross* income was $50,000. | Их валовой доход составил 50 000 долларов. | gross error — грубая ошибка
- gruelling | adj | ˈɡruːəlɪŋ | ɡrˈuːəlɪŋ | изнурительный | very tiring | It was a *gruelling* climb. | Это был изнурительный подъём. | амер. grueling
- influential | adj | ˌɪnfluːˈenʃl |  | влиятельный | having influence | She's a very *influential* politician. | Она очень влиятельный политик.
- integrated | adj | ˈɪntɪɡreɪtɪd | ˈɪnəɡreɪtəd | интегрированный, комплексный | combined into one | It's an *integrated* transport system. | Это единая транспортная система.
- lacklustre | adj | ˈlæklʌstə | lˈæklʌstɐ | тусклый, вялый | dull and without energy | The team gave a *lacklustre* performance. | Команда сыграла вяло. | амер. lackluster
- linear | adj | ˈlɪniə | ˈlɪniːər | линейный | in a straight line | The story isn't told in a *linear* way. | История рассказана не в хронологическом порядке.
- mainstream | adj | ˈmeɪnstriːm |  | общепринятый, основной | accepted by most people | His ideas were not part of *mainstream* medicine. | Его идеи не были частью общепринятой медицины.
- mandatory | adj | ˈmændətəri | ˈmændətɔːri | обязательный | required by law or rules | Wearing a seatbelt is *mandatory*. | Пристёгиваться ремнём обязательно.
- radical | adj | ˈrædɪkl |  | радикальный, коренной | very great; extreme | We need *radical* changes. | Нам нужны коренные перемены.
- sole | adj | səʊl | soʊl | единственный | only | She was the *sole* survivor of the accident. | Она была единственной выжившей в аварии.
- spare | v | speə | sper | уделить, выделить; пощадить | to give time or money; to not hurt | Can you *spare* a minute? | Можешь уделить минутку?
- suspicious | adj | səˈspɪʃəs |  | подозрительный | making you think something is wrong; not trusting | Police found a *suspicious* bag at the station. | Полиция обнаружила на вокзале подозрительную сумку.
- uninspiring | adj | ˌʌnɪnˈspaɪərɪŋ | ənɪnˈspaɪrɪŋ | невдохновляющий, скучный | not exciting | The speech was *uninspiring*. | Речь не вдохновила.
