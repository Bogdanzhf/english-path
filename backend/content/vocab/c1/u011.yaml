title: Body and health
title_ru: Тело и здоровье
topic: body
words:
- alternative medicine | n | ɔːlˈtɜːnətɪv ˈmedsən | ɔːlˈtɜːrnətɪv ˈmedəsən | альтернативная медицина | treatments not used by most doctors | Acupuncture is a form of *alternative medicine*. | Иглоукалывание — вид альтернативной медицины.
- anorexia | n | ˌænɔːˈreksiə | ˌænəˈreksiə | анорексия | an illness where people refuse to eat | She was treated for *anorexia*. | Её лечили от анорексии.
- asthma | n | ˈæsmə | ˈæzmə | астма | an illness that makes breathing hard | My son has *asthma*. | У моего сына астма.
- bronchitis | n | brənˈkaɪtɪs | brɑːŋˈkaɪtəs | бронхит | an illness of the lungs | He's in bed with *bronchitis*. | Он лежит с бронхитом.
- bulimia | n | bjʊˈlɪmiə | bjuːˈlɪmiə | булимия | an eating disorder | *Bulimia* is a serious illness. | Булимия — серьёзное заболевание.
- contagious | adj | kənˈteɪdʒəs |  | заразный | spreading by touch | The disease is highly *contagious*. | Болезнь очень заразна.
- eating disorder | n | ˈiːtɪŋ dɪˈsɔːdə | ˈiːtɪŋ dɪˈsɔːrdər | расстройство пищевого поведения | an illness related to eating | *Eating disorders* are common among teenagers. | Расстройства пищевого поведения часты у подростков.
- epidemic | n | ˌepɪˈdemɪk |  | эпидемия | a large number of cases of a disease at the same time | A flu *epidemic* swept the country. | Страну охватила эпидемия гриппа.
- euthanasia | n | ˌjuːθəˈneɪziə | ˌjuːθəˈneɪʒə | эвтаназия | ending a life to stop suffering | *Euthanasia* is illegal in many countries. | Эвтаназия запрещена во многих странах.
- eye drops | n | aɪ drɒps | aɪ drɑːps | глазные капли | liquid medicine for the eyes | Use these *eye drops* twice a day. | Закапывайте эти капли дважды в день.
- food poisoning | n | fuːd ˈpɔɪzənɪŋ |  | пищевое отравление | an illness from bad food | I got *food poisoning* from the fish. | Я отравился рыбой.
- have a filling | phr |  |  | поставить пломбу | to get a hole in a tooth fixed | I need to *have a filling*. | Мне нужно поставить пломбу.
- malnutrition | n | ˌmælnjuːˈtrɪʃən | ˌmælnuːˈtrɪʃən | недоедание | lack of healthy food | Many children die of *malnutrition*. | Многие дети умирают от недоедания.
- outbreak | n | ˈaʊtbreɪk |  | начало, вспышка | the sudden start of something bad, like war or disease | He was a student at the *outbreak* of war. | Когда началась война, он был студентом.
- painkiller | n | ˈpeɪŋkɪlə | ˈpeɪnkɪlər | обезболивающее | a medicine that stops pain | Take a *painkiller*. | Прими обезболивающее.
- placebo | n | pləˈsiːbəʊ | pləˈsiːboʊ | плацебо | a fake medicine used in tests | Half the patients were given a *placebo*. | Половине пациентов дали плацебо.
- rehabilitation | n | rɪhəˌbɪlɪˈteɪʃən | ˌriəˌbɪləˈteɪʃən | реабилитация | helping someone return to normal life | He's in *rehabilitation* after the accident. | Он проходит реабилитацию после аварии.
- sedentary | adj | ˈsedəntəri | ˈsedənteri | сидячий, малоподвижный | involving a lot of sitting | I have a *sedentary* job. | У меня сидячая работа.
- syringe | n | sɪˈrɪndʒ | ˈsɪrɪndʒ | шприц | a tube with a needle | The nurse filled the *syringe*. | Медсестра наполнила шприц.
- wellbeing | n | ˌwelˈbiɪŋ | ˌwelˈbiːɪŋ | благополучие | being healthy and happy | Exercise improves *wellbeing*. | Физические упражнения улучшают самочувствие.
