title: Body and health
title_ru: Тело и здоровье
topic: body
words:
- abortion | n | əˈbɔːʃən | əˈbɔːrʃən | аборт | ending a pregnancy | *Abortion* is a controversial issue. | Аборты — спорная тема.
- arthritis | n | ɑːˈθraɪtɪs | ɑːrˈθraɪtɪs | артрит | a disease that makes joints painful and stiff | My grandmother has *arthritis* in her hands. | У бабушки артрит рук.
- clinical | adj | ˈklɪnɪkl | ˈklɪnəkl | клинический | relating to treating patients | The drug is in *clinical* trials. | Лекарство проходит клинические испытания.
- health service | n | helθ ˈsɜːvɪs | helθ ˈsɜːrvəs | система здравоохранения | the public system of medical care | The *health service* needs more money. | Здравоохранению нужно больше денег.
- heavy cold | n | ˈhevi kəʊld | ˈhevi koʊld | сильная простуда | a bad cold | I've got a *heavy cold*. | У меня сильная простуда.
- hepatitis | n | ˌhepəˈtaɪtɪs | ˌhepəˈtaɪtəs | гепатит | a disease of the liver | He was vaccinated against *hepatitis*. | Ему сделали прививку от гепатита.
- immune system | n | ɪˈmjuːn ˈsɪstəm | ˌɪmˈjuːn ˈsɪstəm | иммунная система | the body's defence against disease | Vitamin C supports the *immune system*. | Витамин C поддерживает иммунитет.
- lactose intolerance | n | ˈlæktəʊz ɪnˈtɒlərəns | ˈlæktoʊs ˌɪnˈtɑːlərəns | непереносимость лактозы | being unable to digest milk | She has *lactose intolerance*. | У неё непереносимость лактозы.
- make a speedy recovery | phr |  |  | быстро поправиться | to get better quickly | I hope you *make a speedy recovery*. | Желаю скорейшего выздоровления.
- onset of symptoms | phr |  |  | появление симптомов | the start of signs of illness | See a doctor at the *onset of symptoms*. | При первых симптомах обратитесь к врачу.
- pregnancy | n | ˈpreɡnənsi |  | беременность | being pregnant | Don't smoke during *pregnancy*. | Не курите во время беременности.
- preventive medicine | n | prɪˈventɪv ˈmedsən | priːˈvenɪv ˈmedəsən | профилактическая медицина | medicine that stops disease | *Preventive medicine* saves money. | Профилактика экономит деньги.
- public health | n | ˈpʌblɪk helθ |  | общественное здоровье, здравоохранение | the health of the population | Smoking is a *public health* problem. | Курение — проблема общественного здоровья.
- pulse | n | pʌls |  | пульс | the beat of your heart | The nurse took my *pulse*. | Медсестра измерила мне пульс.
- reach epidemic proportions | phr |  |  | принять масштабы эпидемии | to become extremely common | Obesity has *reached epidemic proportions*. | Ожирение приняло масштабы эпидемии.
- smallpox | n | ˈsmɔːlpɒks | ˈsmɔːlpɑːks | оспа | a serious infectious disease that causes fever and spots | *Smallpox* killed millions of people. | Оспа унесла миллионы жизней.
- sore throat | n | sɔː θrəʊt | sɔːr θroʊt | больное горло | pain in the throat | I have a *sore throat*. | У меня болит горло.
- terminal illness | n | ˈtɜːmɪnl ˈɪlnəs | ˈtɜːrmənl ˈɪlnəs | неизлечимая (смертельная) болезнь | an illness that will cause death | She was diagnosed with a *terminal illness*. | У неё обнаружили неизлечимую болезнь.
- trauma | n | ˈtrɔːmə |  | травма (психологическая) | a shocking experience; a serious injury | The children suffered *trauma* from the war. | Дети пережили травму войны.
