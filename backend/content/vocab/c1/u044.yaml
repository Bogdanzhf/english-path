title: Everyday phrases
title_ru: Разговорные фразы
topic: phrases
words:
- in connection with somebody/something | phr |  |  | в связи с | about | He was arrested *in connection with* the robbery. | Его арестовали в связи с ограблением.
- in effect | phr |  |  | фактически; в силе | really; in operation | *In effect*, we have no choice. | По сути, у нас нет выбора.
- in full | phr |  |  | полностью | completely | Please write your name *in full*. | Напишите полное имя.
- in line with something | phr |  |  | в соответствии с | according to | Prices rose *in line with* inflation. | Цены росли вместе с инфляцией.
- in practice | phr |  |  | на практике | in reality | *In practice*, it's more difficult. | На практике всё сложнее.
- in respect of something | phr |  |  | в отношении | concerning | Payment *in respect of* services. | Оплата за оказанные услуги.
- in such a way (that)... | phr |  |  | таким образом, что | so that | Write *in such a way* that everyone understands. | Пишите так, чтобы всем было понятно.
- in the absence of somebody/something | phr |  |  | в отсутствие | without | *In the absence of* evidence, he was released. | За отсутствием улик его отпустили.
- in the course of... | phr |  |  | в ходе | during | *In the course of* the meeting, we decided. | В ходе встречи мы решили.
- in the event of something | phr |  |  | в случае | if something happens | *In the event of* fire, leave the building. | В случае пожара покиньте здание.
- in the face of something | phr |  |  | перед лицом, вопреки | despite a problem | She stayed calm *in the face of* danger. | Она сохраняла спокойствие перед лицом опасности.
- in the hands of somebody | phr |  |  | в руках (кого-либо) | controlled by | The decision is *in the hands of* the jury. | Решение в руках присяжных.
- in the light of something | phr |  |  | в свете, с учётом | considering | *In the light of* the news, we cancelled. | С учётом новостей мы всё отменили.
- in the meantime | phr |  |  | тем временем, пока | meanwhile | Dinner's at seven. *In the meantime*, relax. | Ужин в семь. А пока отдохни.
- in the midst of something | phr |  |  | посреди, в разгар | in the middle of | We're *in the midst of* a crisis. | Мы в разгаре кризиса.
- in the presence of somebody | phr |  |  | в присутствии | with someone there | Sign *in the presence of* a witness. | Подпишите в присутствии свидетеля.
- in the wake of somebody/something | phr |  |  | вслед за, после | after; as a result of | Prices rose *in the wake of* the war. | После войны цены выросли.
- involvement in something | phr |  |  | участие в, причастность к | taking part in | He denied any *involvement in* the crime. | Он отрицал причастность к преступлению.
