title: 'Describing: same, different, true'
title_ru: 'Описание: сходство, точность, вероятность'
topic: describing
words:
- applicable | adj | əˈplɪkəbl | ˈæplɪkəbl | применимый | relevant to a particular situation | The rule is not *applicable* to children. | Это правило не распространяется на детей.
- authentic | adj | ɔːˈθentɪk |  | подлинный, аутентичный | real, not false or copied | Experts declared the painting *authentic*. | Эксперты признали картину подлинной.
- comparable | adj | ˈkɒmpərəbl | ˈkɑːmpərəbl | сопоставимый | similar | Prices are *comparable* to last year. | Цены сопоставимы с прошлогодними.
- corresponding | adj | ˌkɒrɪˈspɒndɪŋ | ˌkɔːrəˈspɑːndɪŋ | соответствующий | related; matching | Sales rose, with a *corresponding* rise in profit. | Продажи выросли, а вместе с ними и прибыль.
- coupled | adj | ˈkʌpəld |  | в сочетании | combined | Low wages, *coupled* with high prices, cause hardship. | Низкие зарплаты в сочетании с высокими ценами ведут к нужде.
- distinctive | adj | dɪˈstɪŋktɪv |  | отличительный, характерный | easy to recognize because it is different | Van Gogh's style is very *distinctive*. | Стиль Ван Гога очень узнаваем.
- explicit | adj | ɪkˈsplɪsɪt |  | явный, недвусмысленный | clear and exact | She gave me *explicit* instructions. | Она дала мне чёткие указания.
- generic | adj | dʒəˈnerɪk |  | общий; непатентованный | general; without a brand name | Buy the *generic* version of the drug. | Купите дженерик этого лекарства.
- integral | adj | ˈɪntɪɡrəl |  | неотъемлемый | necessary and important as a part of a whole | Music was an *integral* part of his life. | Музыка была неотъемлемой частью его жизни.
- irrelevant | adj | ɪˈrelɪvənt | ˌɪˈreləvənt | неуместный, не относящийся к делу | not connected | Your age is *irrelevant*. | Твой возраст не имеет значения.
- legitimate | adj | lɪˈdʒɪtɪmət |  | законный, обоснованный | allowed by law; reasonable | Is this a *legitimate* business? | Это законный бизнес? | legitimate concern — обоснованное беспокойство
- misleading | adj | mɪˈsliːdɪŋ |  | вводящий в заблуждение | giving a wrong idea | The advert is *misleading*. | Реклама вводит в заблуждение.
- pronounced | adj | prəˈnaʊnst |  | ярко выраженный | very noticeable | She has a *pronounced* accent. | У неё заметный акцент.
- respective | adj | rɪˈspektɪv |  | соответствующий (каждому свой) | belonging to each of the people mentioned | The two surgeons returned to their *respective* hospitals. | Двое хирургов вернулись каждый в свою больницу.
- selective | adj | sɪˈlektɪv | səˈlektɪv | избирательный, разборчивый | choosing carefully | He has a *selective* memory. | У него избирательная память.
- subtle | adj | ˈsʌtl |  | тонкий, едва уловимый | not obvious; delicate | The tea has a *subtle* flavour of lemon. | У чая тонкий привкус лимона. | b не читается
- symbolic | adj | sɪmˈbɒlɪk | sɪmˈbɑːlɪk | символический | representing something | The gesture was *symbolic*. | Это был символический жест.
- underlying | adj | ˌʌndəˈlaɪɪŋ | ˌʌndərˈlaɪɪŋ | лежащий в основе, скрытый | real but not easy to see | We need to find the *underlying* cause of the problem. | Нам нужно найти глубинную причину проблемы.
- varied | adj | ˈveərid | ˈveriːd | разнообразный | of many different kinds | She has a *varied* diet. | У неё разнообразное питание.
- versus | prep | ˈvɜːsɪz | ˈvɜːrsəs | против (в спорте, суде) | against | It's Brazil *versus* Spain tonight. | Сегодня Бразилия против Испании. | сокр. vs
