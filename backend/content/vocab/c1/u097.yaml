title: 'Describing: time and age'
title_ru: 'Описание: время, новизна, возраст'
topic: describing
words:
- commonplace | adj | ˈkɒmənpleɪs | ˈkɑːmənpleɪs | обыденный, обычный | happening often; ordinary | Violence was *commonplace* in ancient Rome. | Насилие было обыденным делом в Древнем Риме.
- consecutive | adj | kənˈsekjətɪv |  | последовательный, подряд | following one after another | It rained for five *consecutive* days. | Дождь шёл пять дней подряд.
- eventual | adj | ɪˈventʃuəl |  | конечный, окончательный | happening at the end of a process | The *eventual* winner was a 15-year-old girl. | В итоге победила пятнадцатилетняя девочка. | eventually — в конце концов
- forthcoming | adj | ˌfɔːθˈkʌmɪŋ | ˌfɔːrθˈkʌmɪŋ | предстоящий; отзывчивый | happening soon; willing to give information | Details of the *forthcoming* changes will be sent to tenants. | Подробности предстоящих изменений будут разосланы жильцам.
- impending | adj | ɪmˈpendɪŋ |  | надвигающийся, грозящий | about to happen (usually something bad) | They were unaware of the *impending* danger. | Они не знали о надвигающейся опасности.
- preliminary | adj | prɪˈlɪmɪnəri | prɪˈlɪmɪneri | предварительный | coming before the main part | The *preliminary* results were encouraging. | Предварительные результаты были обнадёживающими.
- premature | adj | ˈpremətʃə | ˌpriːməˈtʃʊr | преждевременный | happening too early | It's *premature* to blame anyone. | Обвинять кого-либо преждевременно.
- upcoming | adj | ˈʌpkʌmɪŋ |  | предстоящий | happening soon | Prepare for the *upcoming* harvest. | Готовьтесь к предстоящему урожаю.
