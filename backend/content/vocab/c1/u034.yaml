- vegetation | n | ˌvedʒɪˈteɪʃən | ˌvedʒəˈteɪʃən | растительность | plants in an area | The island has thick *vegetation*. | Остров покрыт густой растительностью.
- watershed | n | ˈwɔːtəʃed | ˈwɑːtərʃed | переломный момент; водораздел | a turning point | The election was a *watershed* in history. | Выборы стали поворотным моментом в истории.
- weed | n | wiːd |  | сорняк | a wild unwanted plant | The garden is full of *weeds*. | Сад зарос сорняками.
