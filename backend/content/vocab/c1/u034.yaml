title: Nature and weather
title_ru: Природа и погода
topic: nature
words:
- aftermath | n | ˈɑːftəmæθ | ˈæftərmæθ | последствия | the period after a bad event | In the *aftermath* of the war, many were homeless. | После войны многие остались без крова.
- atmospheric | adj | ˌætməsˈferɪk |  | атмосферный | relating to the air; creating a mood | It's a very *atmospheric* old pub. | Это очень атмосферный старый паб.
- blade | n | bleɪd |  | лезвие; травинка | the cutting part of a knife; a leaf of grass | The knife has a sharp *blade*. | У ножа острое лезвие.
- bouquet | n | buːˈkeɪ |  | букет | a bunch of flowers | He gave her a *bouquet* of roses. | Он подарил ей букет роз.
- cavity | n | ˈkævəti |  | полость; кариес, дупло (в зубе) | a hole or empty space inside something | Sugar causes *cavities* in your teeth. | Сахар вызывает кариес.
- delta | n | ˈdeltə |  | дельта (реки) | the land where a river splits before the sea | The Nile *delta* is very fertile. | Дельта Нила очень плодородна.
- dung | n | dʌŋ |  | навоз, помёт | solid waste from animals | Farmers use cow *dung* on their fields. | Фермеры удобряют поля коровьим навозом.
- grove | n | ɡrəʊv | ɡroʊv | роща | a small group of trees | They camped in a *grove* of trees by the creek. | Они разбили лагерь в роще у ручья.
- incline | v | ɪnˈklaɪn |  | склонять(ся) | to tend to think or behave in a particular way | I'm *inclined* to agree with you. | Я склонен с вами согласиться. | be inclined to
- irrigation | n | ˌɪrɪˈɡeɪʃən | ˌɪrəˈɡeɪʃən | орошение, ирригация | supplying water to land | Farmers depend on *irrigation*. | Фермеры зависят от орошения.
- jagged | adj | ˈdʒæɡɪd |  | зазубренный, неровный | with rough, sharp points | The broken pieces had *jagged* edges. | У обломков были острые неровные края.
- mainland | n | ˈmeɪnlənd | ˈmeɪnlænd | материк | the main land, not islands | We took the ferry to the *mainland*. | Мы переправились паромом на материк.
- nest | n | nest |  | гнездо | a home that birds build | The bird built a *nest* in the tree. | Птица свила гнездо на дереве.
- orchard | n | ˈɔːtʃəd | ˈɔːrtʃərd | фруктовый сад | an area of fruit trees | We picked apples in the *orchard*. | Мы собирали яблоки в саду.
- pasture | n | ˈpɑːstʃə | ˈpæstʃər | пастбище | land covered with grass for animals | Sheep grazed on the *pasture* around the stones. | Вокруг камней на пастбище паслись овцы.
- peninsula | n | pəˈnɪnsjələ | pəˈnɪnsələ | полуостров | land almost surrounded by water | Italy is a *peninsula*. | Италия — полуостров.
- quarry | n | ˈkwɒri | ˈkwɔːri | карьер, каменоломня | a place where stone is dug | The stone came from a local *quarry*. | Камень привезли из местного карьера.
- sediment | n | ˈsedɪmənt | ˈsedəmənt | осадок, отложения | material at the bottom of a liquid | There's *sediment* at the bottom of the bottle. | На дне бутылки осадок.
- seedling | n | ˈsiːdlɪŋ |  | саженец, росток | a young plant | Plant the *seedlings* in spring. | Высаживайте рассаду весной.
- 'succulent | adj | ˈsʌkjʊlənt | ˈsʌkjəlɪnt | сочный | juicy | We had *succulent* roast chicken. | У нас была сочная запечённая курица. | сущ.: succulent — суккулент'
