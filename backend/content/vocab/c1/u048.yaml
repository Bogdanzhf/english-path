title: Feelings and character
title_ru: Чувства и характер
topic: feelings
words:
- alert | v | əˈlɜːt | əˈlɜːrt | предупреждать, поднимать тревогу | to warn someone about danger | A neighbour *alerted* the police. | Сосед сообщил в полицию. | прил. alert — бдительный
- compassion | n | kəmˈpæʃən |  | сострадание | sympathy for suffering | She showed great *compassion*. | Она проявила большое сострадание.
- contempt | n | kənˈtempt |  | презрение | a feeling that someone is worthless | Some bankers treated the poor with *contempt*. | Некоторые банкиры относились к бедным с презрением.
- craving | n | ˈkreɪvɪŋ |  | сильное желание, тяга | a strong desire | I have a *craving* for chocolate. | Мне до смерти хочется шоколада.
- cynicism | n | ˈsɪnɪsɪzəm |  | цинизм | believing people are selfish | His *cynicism* annoys me. | Меня раздражает его цинизм.
- disdain | n | dɪsˈdeɪn |  | презрение | a lack of respect | She looked at him with *disdain*. | Она смотрела на него с презрением.
- distress | n | dɪˈstres |  | страдание, беда | great pain, worry or sadness | The patients were in terrible *distress*. | Больные ужасно страдали. | in distress — в беде
- eligible | adj | ˈelɪdʒəbl |  | имеющий право, подходящий | allowed to do or receive something | Farmers were *eligible* for government help. | Фермеры имели право на государственную помощь.
- exhilaration | n | ɪɡˌzɪləˈreɪʃən |  | восторг, приподнятость | great excitement | I felt a rush of *exhilaration*. | Меня охватил восторг.
- exuberance | n | ɪɡˈzjuːbərəns | ɪɡˈzuːbərəns | бурная радость, жизнерадостность | energy and enthusiasm | The children's *exuberance* was infectious. | Детская жизнерадостность была заразительной.
- gusto | n | ˈɡʌstəʊ | ˈɡʌstoʊ | смак, увлечение | enthusiasm | He ate with great *gusto*. | Он ел с большим аппетитом.
- humble | adj | ˈhʌmbl |  | скромный, простой | not proud; from a low social position | He came from a *humble* family of farmers. | Он происходил из простой крестьянской семьи.
- indifference | n | ɪnˈdɪfrəns | ˌɪnˈdɪfərəns | безразличие | lack of interest | He showed *indifference* to her problems. | Он остался равнодушен к её проблемам.
- longing | n | ˈlɒŋɪŋ | ˈlɔːŋɪŋ | тоска, страстное желание | a strong feeling of wanting something | She felt a deep *longing* for home. | Она испытывала глубокую тоску по дому.
- mature | adj | məˈtʃʊə | məˈtʃʊr | зрелый | fully grown; behaving like an adult | She's very *mature* for her age. | Она очень зрелая для своего возраста.
- optimism | n | ˈɒptɪmɪzəm | ˈɑːptɪmɪzəm | оптимизм | the feeling that good things will happen | Her *optimism* helped the team. | Её оптимизм помогал команде. | optimist — оптимист
- remorse | n | rɪˈmɔːs | rɪˈmɔːrs | раскаяние, угрызения совести | a feeling of deep regret | He showed no *remorse* for his actions. | Он не выказывал никакого раскаяния.
- scorn | n | skɔːn | skɔːrn | презрение | a strong feeling that someone is stupid or not good enough | Critics treated the idea with *scorn*. | Критики отнеслись к этой идее с презрением.
- "self-conscious | adj | ˌselfˈk\x01ːnʃəs | ˌselfˈkɑːnʃəs | застенчивый, смущённый | worried about how others see you | He's *self-conscious* about his height. | Он стесняется своего роста."
- tantrum | n | ˈtɑːntrəm | ˈtæntrəm | истерика, вспышка гнева | a sudden angry outburst, especially by a child | The child threw a *tantrum*. | Ребёнок закатил истерику.
- vulnerable | adj | ˈvʌlnərəbl |  | уязвимый | easily hurt or damaged | Young animals are especially *vulnerable*. | Детёныши особенно уязвимы.
reading:
  title: The Making of Toy Story
  title_ru: Как создавали «Историю игрушек»
  text: |
    In 1995, a film was released that changed animation forever. "Toy Story" was the first feature-length film made entirely with computers. Today, computer-animated films are everywhere, but at the time, the concept seemed almost impossible.

    For most of the twentieth century, animation was done by hand. Artists drew each frame on paper, and a single film could require hundreds of thousands of drawings. In the 1980s, a small team of computer scientists and artists in California began experimenting with a new idea: constructing characters and worlds inside a computer. The company, Pixar, was isolated from the big studios and had little money. For nearly a decade, it survived by selling computer hardware and making short films and adverts.

    The technical problems were enormous. Every character had to be built from mathematical shapes, rather like a sophisticated diagram. Computers then were slow; some frames took hours or even days to process. Animating human skin and hair was too difficult, which is one reason why the team chose toys as the main characters. Plastic toys, with their simple shapes and smooth surfaces, were handy subjects for the technology of the time.

    The story itself almost failed. At one point, the studio's partners at Disney watched an early version and hated it. The main character, Woody, was rude and unpleasant. Production was halted, and the writers had to concede that something was wrong. They rewrote the script, turning Woody into a jealous but loving character with a longing to remain his owner's favourite toy.

    The final film was a huge success. Critics wrote glowing reviews, and it won numerous awards. More importantly, it showed that computer animation could tell emotional stories. Today, technology allows animators to create every particle of dust and every hair on a character's head. But Pixar's directors refuse to surrender to technology alone. As they often say, the story always comes first — and that is what makes all the hard work worthwhile.
  ru: |
    В 1995 году вышел фильм, который навсегда изменил анимацию. «История игрушек» стала первым полнометражным фильмом, полностью созданным на компьютере. Сегодня компьютерные мультфильмы повсюду, но тогда эта идея казалась почти невозможной.

    Большую часть XX века мультипликацию делали вручную. Художники рисовали каждый кадр на бумаге, и одному фильму могли понадобиться сотни тысяч рисунков. В 1980-х небольшая команда программистов и художников в Калифорнии начала экспериментировать с новой идеей — создавать персонажей и миры внутри компьютера. Компания Pixar была оторвана от крупных студий, и денег у неё было мало. Почти десять лет она выживала, продавая компьютерное оборудование и снимая короткометражки и рекламу.

    Технические трудности были огромными. Каждого персонажа приходилось собирать из математических форм, почти как сложную схему. Компьютеры тогда были медленными: обработка некоторых кадров занимала часы и даже дни. Анимировать человеческую кожу и волосы было слишком сложно — это одна из причин, по которой команда выбрала главными героями игрушки. Пластиковые игрушки с их простыми формами и гладкой поверхностью были удобными объектами для технологий того времени.

    Сам сюжет едва не провалился. В какой-то момент партнёры студии из Disney посмотрели раннюю версию и возненавидели её. Главный герой, Вуди, был грубым и неприятным. Производство остановили, и сценаристам пришлось признать, что что-то не так. Они переписали сценарий, превратив Вуди в ревнивого, но любящего персонажа, который мечтает остаться любимой игрушкой своего хозяина.

    Готовый фильм имел огромный успех. Критики писали восторженные рецензии, и он получил многочисленные награды. Что ещё важнее, он показал, что компьютерная анимация может рассказывать трогательные истории. Сегодня технологии позволяют аниматорам создать каждую пылинку и каждый волосок на голове персонажа. Но режиссёры Pixar отказываются сдаваться на милость одних лишь технологий. Как они часто говорят, история всегда на первом месте — и именно поэтому весь тяжёлый труд того стоит.
  questions:
  - q: What was special about 'Toy Story'?
    options:
    - It was the first film in colour
    - It was the first feature film made entirely with computers
    - It was hand-drawn
    - It was made in one year
    answer: 1
  - q: Why did the team choose toys as main characters?
    options:
    - Children love toys
    - Their simple shapes were easier to animate
    - Disney asked them to
    - Toys were cheap
    answer: 1
  - q: What was wrong with the early version of Woody?
    options:
    - He was too small
    - He was rude and unpleasant
    - He couldn't move
    - He had no voice
    answer: 1
  - tf: Pixar survived by selling computer hardware for years.
    answer: true
  - tf: Pixar directors say technology is more important than the story.
    answer: false
