title: People and relationships
title_ru: Люди и отношения
topic: people
words:
- adversary | n | ˈædvəsəri | ˈædvərseri | противник | an enemy or opponent | He defeated his *adversary*. | Он победил своего противника.
- benefactor | n | ˈbenɪfæktə | ˈbenɪfæktər | благодетель, меценат | a person who gives money or help | A rich *benefactor* paid for the new library. | Новую библиотеку оплатил богатый меценат.
- cynic | n | ˈsɪnɪk |  | циник | a person who believes people act only for themselves | Don't be such a *cynic*. | Не будь таким циником.
- deviate | v | ˈdiːvieɪt |  | отклоняться | to move away from what is planned or normal | The ship *deviated* from its course. | Корабль отклонился от курса.
- devotee | n | ˌdevəʊˈtiː | ˌdevəˈtiː | приверженец, поклонник | a person who loves something | He's a *devotee* of jazz. | Он поклонник джаза.
- dramatist | n | ˈdræmətɪst | ˈdrɑːmətɪst | драматург | a person who writes plays | Chekhov was a great *dramatist*. | Чехов был великим драматургом.
- elitist | n | ɪˈliːtɪst | eɪˈliːtɪst | элитарист, сноб | a person who thinks a small group is better | He's accused of being an *elitist*. | Его обвиняют в элитарности.
- fanatic | n | fəˈnætɪk |  | фанатик | a person with extreme enthusiasm | He's a football *fanatic*. | Он футбольный фанатик.
- guerilla | n | ɡəˈrɪlə |  | партизан | a member of a small fighting group that attacks a larger army by surprise | He carried out *guerilla* warfare in the jungle. | Он вёл партизанскую войну в джунглях. | также guerrilla
- infant | n | ˈɪnfənt |  | младенец | a baby or very young child | *Infants* need a lot of sleep. | Младенцам нужно много спать.
- kin | n | kɪn |  | родня | family members | Next of *kin* must be informed. | Необходимо уведомить ближайших родственников. | next of kin — ближайший родственник
- mountaineer | n | ˌmaʊntɪˈniə | ˈmaʊntɪnɪr | альпинист | a person who climbs mountains | The *mountaineers* reached the summit. | Альпинисты достигли вершины.
- occupant | n | ˈɒkjʊpənt | ˈɑːkjəpənt | жилец; пассажир | a person who lives in or uses a place | The previous *occupants* left the flat dirty. | Прежние жильцы оставили квартиру грязной.
- offspring | n | ˈɒfsprɪŋ | ˈɔːfsprɪŋ | потомство | the young of an animal or person | Most mammals care for their *offspring*. | Большинство млекопитающих заботятся о потомстве. | мн. ч. = ед. ч.
- realist | n | ˈriəlɪst |  | реалист | a person who sees things as they are | I'm a *realist*. | Я реалист.
- scribe | n | skraɪb |  | писец | a person who copied documents by hand in the past | *Scribes* carved his words into stone. | Писцы высекли его слова на камне.
- skeptic | n | ˈskeptɪk |  | скептик | a person who doubts that something is true | Even the *skeptics* were impressed by the results. | Даже скептики были впечатлены результатами. | брит. sceptic
- slob | n | slɒb | slɑːb | неряха, лентяй (разг.) | a lazy, untidy person | He's such a *slob*! | Он такой неряха!
- spouse | n | spaʊs |  | супруг(а) | a husband or wife | Employees and their *spouses* are invited. | Приглашаются сотрудники и их супруги.
- suitor | n | ˈsuːtə | ˈsuːtər | поклонник, ухажёр | a man who wants to marry a woman | She had many *suitors*. | У неё было много поклонников.
- youngster | n | ˈjʌŋstə | ˈjʌŋstər | молодой человек, ребёнок | a young person | The *youngsters* played football. | Ребята играли в футбол.
