title: Events and situations
title_ru: События и ситуации
topic: events
words:
- breakdown | n | ˈbreɪkdaʊn |  | срыв; поломка | a mental or physical collapse; a failure of a machine | He had a nervous *breakdown*. | У него случился нервный срыв.
- classification | n | ˌklæsɪfɪˈkeɪʃn |  | классификация | the act of putting things into groups | The *classification* of animals into species began in the 18th century. | Классификация животных по видам началась в XVIII веке.
- compliance | n | kəmˈplaɪəns |  | соблюдение, подчинение | the act of obeying a rule or order | Companies must ensure *compliance* with the law. | Компании должны обеспечивать соблюдение закона.
- courtesy | n | ˈkɜːtəsi | ˈkɜːrtəsi | вежливость, любезность | polite behaviour | It's common *courtesy* to say thank you. | Сказать «спасибо» — элементарная вежливость. | courtesy of — благодаря, предоставлено
- grip | n | ɡrɪp |  | хватка, сжатие | a firm hold | He kept a tight *grip* on the rope. | Он крепко держался за верёвку.
- mercy | n | ˈmɜːsi | ˈmɜːrsi | милосердие, пощада | kindness to someone you could punish | The king showed *mercy* and let the prisoner go. | Король проявил милосердие и отпустил пленника.
- revenge | n | rɪˈvendʒ |  | месть | hurting someone because they hurt you | He wanted *revenge* for his brother's death. | Он жаждал мести за смерть брата. | take revenge on — отомстить
- riot | n | ˈraɪət |  | бунт, беспорядки | violent behaviour by a crowd | The tax led to *riots* in the streets. | Налог привёл к беспорядкам на улицах.
- transaction | n | trænˈzækʃn |  | сделка, операция | an act of buying, selling or transferring money | All *transactions* are recorded by the bank. | Все операции регистрируются банком.
