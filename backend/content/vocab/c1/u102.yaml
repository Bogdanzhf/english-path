title: Events and situations
title_ru: События и ситуации
topic: events
words:
- confinement | n | kənˈfaɪnmənt |  | заключение, изоляция | being kept in a small space | He spent years in solitary *confinement*. | Он провёл годы в одиночной камере.
- constraint | n | kənˈstreɪnt |  | ограничение | a limit | We work under time *constraints*. | Мы работаем в условиях нехватки времени.
- deterioration | n | dɪˌtɪəriəˈreɪʃn | dɪˌtɪriəˈreɪʃn | ухудшение | the process of becoming worse | There was a rapid *deterioration* in his health. | Его здоровье быстро ухудшилось. | deteriorate — ухудшаться
- discord | n | ˈdɪskɔːd | ˈdɪskɔːrd | разлад, разногласия | disagreement between people | The decision caused *discord* among the staff. | Решение вызвало разлад среди сотрудников.
- gloom | n | ɡluːm |  | мрак; уныние | darkness; a feeling of sadness | The house was in *gloom* after the lights went out. | Когда погас свет, дом погрузился во мрак. | gloomy — мрачный
- hibernation | n | ˌhaɪbəˈneɪʃən | ˌhaɪbərˈneɪʃən | спячка | sleeping through winter | Bears go into *hibernation*. | Медведи впадают в спячку.
- lethargy | n | ˈleθədʒi | ˈleθərdʒi | вялость, апатия | lack of energy | Symptoms include *lethargy*. | Среди симптомов — вялость.
- liaison | n | liːˈeɪzɒn | ˈleɪzɑːn | взаимодействие, связь; связной | communication between groups | She acts as a *liaison* between departments. | Она отвечает за связь между отделами.
- recess | n | ˈrises | ˈriːses | перерыв, каникулы (парламента, суда); ниша | a break | Parliament is in *recess*. | У парламента каникулы.
- refurbishment | n | rɪˈfɜːbɪʃmənt | riːˈfɜːrbɪʃmənt | ремонт, реконструкция | repairing and improving | The hotel is closed for *refurbishment*. | Отель закрыт на ремонт.
- renown | n | rɪˈnaʊn |  | слава, известность | fame and respect | Vermeer is an artist of great *renown*. | Вермеер — художник с громкой славой. | renowned — прославленный
- shambles | n | ˈʃæmbəlz |  | бардак, неразбериха | a mess | The meeting was a *shambles*. | Собрание прошло бестолково.
- strife | n | straɪf |  | раздор, борьба | angry or violent disagreement | Years of *strife* had divided the family. | Годы раздоров разделили семью.
- trance | n | trɑːns | træns | транс | a state between sleep and waking | She seemed to be in a *trance*. | Она словно была в трансе.
- turmoil | n | ˈtɜːmɔɪl | ˈtɜːrmɔɪl | смятение, беспорядки | confusion and disorder | The country is in political *turmoil*. | В стране политическая неразбериха.
- unison | n | ˈjuːnɪsən | ˈjuːnəsən | унисон | together at the same time | They spoke in *unison*. | Они сказали хором.
- upheaval | n | ʌpˈhiːvl | əpˈhiːvl | переворот, потрясение | a big change causing trouble | Moving house is a big *upheaval*. | Переезд — большая встряска.
- uproar | n | ˈʌprɔː | ˈʌprɔːr | шумиха, возмущение | a lot of public anger and noise | The decision caused an *uproar*. | Решение вызвало бурю возмущения.
