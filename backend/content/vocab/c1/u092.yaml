title: Events and situations
title_ru: События и ситуации
topic: events
words:
- amendment | n | əˈmendmənt |  | поправка | a change to a law or document | They made an *amendment* to the law. | Они внесли поправку в закон.
- 'blast | n | blɑːst | blæst | взрыв; порыв | an explosion; a strong wind | The *blast* broke windows. | Взрывом выбило окна. | разг.: have a blast — отлично повеселиться'
- casualty | n | ˈkæʒuəlti |  | пострадавший, жертва | a person injured or killed in an accident or war | There were no *casualties*. | Пострадавших не было.
- collaboration | n | kəˌlæbəˈreɪʃən |  | сотрудничество | working together | The film is a *collaboration* between two studios. | Фильм — совместный проект двух студий.
- combat | n | ˈkɒmbæt | ˈkɑːmbæt | бой, сражение | fighting, especially in war | They were trained for *combat*. | Их обучали бою.
- default | n | dɪˈfɒlt | dɪˈfɔːlt | значение по умолчанию; дефолт | the standard setting; failure to pay | The *default* language is English. | Язык по умолчанию — английский.
- enforcement | n | ɪnˈfɔːsmənt | enˈfɔːrsmənt | обеспечение соблюдения (закона) | making people obey a law | Stricter *enforcement* is needed. | Нужен более строгий контроль за соблюдением.
- engagement | n | ɪnˈɡeɪdʒmənt | enˈɡeɪdʒmənt | помолвка; вовлечённость | an agreement to marry; involvement | They announced their *engagement*. | Они объявили о помолвке.
- execution | n | ˌeksɪˈkjuːʃən | ˌeksəkˈjuːʃən | казнь; исполнение | killing as punishment; doing something | The *execution* of the plan was perfect. | План был исполнен безупречно.
- handling | n | ˈhændlɪŋ | ˈhændəlɪŋ | обращение (с чем-либо) | the way something is dealt with | His *handling* of the crisis was criticised. | Его действия во время кризиса раскритиковали.
- implementation | n | ˌɪmplɪmənˈteɪʃən | ˌɪmpləmenˈteɪʃən | внедрение, реализация | putting a plan into action | The *implementation* of the new system took months. | Внедрение новой системы заняло месяцы.
- involvement | n | ɪnˈvɒlvmənt | ˌɪnˈvɑːlvmənt | участие, вовлечённость | taking part | Parents' *involvement* helps children learn. | Участие родителей помогает детям учиться.
- prevention | n | prɪˈvenʃən | priːˈvenʃən | предотвращение, профилактика | stopping something happening | *Prevention* is better than cure. | Профилактика лучше лечения.
- re-entry | n | ˌriːˈentri |  | вход (в атмосферу) | the return of a spacecraft into the Earth's atmosphere | During *re-entry*, the shuttle became extremely hot. | При входе в атмосферу шаттл сильно раскалялся.
- removal | n | rɪˈmuːvl |  | удаление; вывоз | taking away | Rubbish *removal* is on Mondays. | Мусор вывозят по понедельникам.
- replacement | n | rɪˈpleɪsmənt |  | замена | something that replaces | We need a *replacement* for the broken part. | Нужна замена сломанной детали.
- resistance | n | rɪˈsɪstəns | riːˈzɪstəns | сопротивление | fighting against | There was strong *resistance* to the plan. | План встретил сильное сопротивление.
- ruling | n | ˈruːlɪŋ |  | постановление, решение (суда) | an official decision | The court's *ruling* was final. | Решение суда было окончательным.
- transmission | n | trænˈsmɪʃən | trænsˈmɪʃən | передача; коробка передач | sending; the gears of a car | The virus spreads by airborne *transmission*. | Вирус передаётся воздушно-капельным путём.
