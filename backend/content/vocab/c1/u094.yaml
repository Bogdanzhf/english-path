title: Actions and movement
title_ru: Действия и движение
topic: actions
words:
- conceal | v | kənˈsiːl |  | скрывать, утаивать | to hide something | He tried to *conceal* the truth. | Он пытался скрыть правду.
- congregate | v | ˈkɒŋɡrɪɡeɪt | ˈkɑːŋɡrɪɡeɪt | собираться (в группу) | to come together in a group | Birds *congregate* near the lake in winter. | Зимой птицы собираются у озера.
- contemplate | v | ˈkɒntəmpleɪt | ˈkɑːntəmpleɪt | обдумывать, созерцать | to think about something carefully for a long time | He never *contemplated* surrender. | Он никогда не помышлял о капитуляции.
- diverge | v | daɪˈvɜːdʒ | daɪˈvɜːrdʒ | расходиться | to separate and go in different directions | The two species *diverged* millions of years ago. | Эти два вида разошлись миллионы лет назад.
- elude | v | ɪˈluːd |  | ускользать, избегать | to escape | The thief *eluded* the police. | Вор ускользнул от полиции.
- excavate | v | ˈekskəveɪt |  | раскапывать, вести раскопки | to dig in the ground to find ancient objects | Archaeologists have *excavated* only part of the site. | Археологи раскопали лишь часть памятника.
- flick | v | flɪk |  | щёлкнуть, смахнуть | to move with a quick light movement | She *flicked* the switch. | Она щёлкнула выключателем.
- gaze | v | ɡeɪz |  | пристально смотреть | to look at something for a long time | She *gazed* out of the window. | Она долго смотрела в окно.
- gush | v | ɡʌʃ |  | хлынуть | to flow out quickly | Water *gushed* from the pipe. | Из трубы хлынула вода.
- honk | v | hɒŋk | hɑːŋk | сигналить (о машине) | to sound a car horn | The driver *honked* at me. | Водитель мне посигналил.
- inspect | v | ɪnˈspekt |  | осматривать, проверять | to look at something carefully | The mechanic *inspected* the car. | Механик осмотрел машину.
- overlook | v | ˌəʊvəˈlʊk | ˌoʊvərˈlʊk | упускать из виду; выходить (окнами) на | to not notice something; to have a view over | The hotel *overlooks* the sea. | Отель выходит окнами на море.
- plummet | v | ˈplʌmɪt | ˈplʌmət | резко падать | to fall very quickly | Prices *plummeted*. | Цены рухнули.
- prowl | v | praʊl |  | рыскать | to move quietly looking for prey | A fox was *prowling* around the garden. | По саду рыскала лиса.
- resonate | v | ˈrezəneɪt |  | находить отклик; резонировать | to have meaning for someone | His words *resonated* with voters. | Его слова нашли отклик у избирателей.
- rumble | v | ˈrʌmbl |  | грохотать, урчать | to make a low continuous sound | My stomach is *rumbling*. | У меня урчит в животе.
- rustle | v | ˈrʌsl |  | шуршать | to make a soft dry sound | The leaves *rustled* in the wind. | Листья шуршали на ветру.
- scrutinise | v | ˈskruːtɪnaɪz | skrˈuːtɪnaɪz | тщательно изучать | to examine closely | The lawyer *scrutinised* the contract. | Юрист тщательно изучил договор. | амер. scrutinize
- somersault | n | ˈsʌməsɒlt | ˈsʌmərsɔːlt | сальто, кувырок | rolling forward or backward | He did a *somersault*. | Он сделал сальто.
- stagger | v | ˈstæɡə | ˈstæɡər | шататься; поражать | to walk unsteadily; to shock | He *staggered* home. | Он, шатаясь, добрёл до дома.
