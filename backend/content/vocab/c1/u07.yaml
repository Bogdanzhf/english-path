    - q: "What is the 'bystander effect'?"
      options: ["People help more in groups", "People are less likely to help when many others are present", "People always call the police", "Witnesses forget what they saw"]
      answer: 1
    - q: "What did later research show?"
      options: ["The newspaper account was accurate", "The newspaper account was seriously inaccurate", "There were more witnesses", "Nobody heard anything"]
      answer: 1
