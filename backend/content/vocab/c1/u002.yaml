title: People and relationships
title_ru: Люди и отношения
topic: people
words:
- activist | n | ˈæktɪvɪst | ˈæktəvəst | активист | a person who campaigns for change | Climate *activists* blocked the road. | Климатические активисты перекрыли дорогу.
- administrator | n | ədˈmɪnɪstreɪtə | ədˈmɪnɪstreɪtər | администратор, управляющий | a person who manages an organization or system | The hospital *administrator* approved the budget. | Администратор больницы утвердил бюджет.
- broker | n | ˈbrəʊkə | ˈbroʊkər | брокер, посредник | a person who buys and sells for others | An insurance *broker* found them a good deal. | Страховой брокер нашёл им выгодный вариант.
- contributor | n | kənˈtrɪbjuːtə | kənˈtrɪbjətər | автор (статей); участник, вкладчик | a person who writes for a magazine; a person who gives | He's a regular *contributor* to the magazine. | Он регулярно пишет для журнала.
- demon | n | ˈdiːmən |  | демон | an evil spirit | He fought his inner *demons*. | Он боролся со своими демонами.
- donor | n | ˈdəʊnə | ˈdoʊnər | донор, жертвователь | a person who gives money, blood or organs | An anonymous *donor* paid for the hospital wing. | Анонимный жертвователь оплатил новое крыло больницы.
- exile | n | ˈeɡzaɪl |  | изгнание; изгнанник | being forced to live abroad | He lived in *exile* for twenty years. | Двадцать лет он прожил в изгнании.
- feminist | n | ˈfemɪnɪst | ˈfemənɪst | феминист(ка) | a person who supports women's rights | She's a committed *feminist*. | Она убеждённая феминистка.
- heir | n | eə | er | наследник | a person who will receive money or property when someone dies | He was the *heir* to a large fortune. | Он был наследником крупного состояния. | h не читается
- hostage | n | ˈhɒstɪdʒ | ˈhɑːstɪdʒ | заложник | a person held prisoner to get demands | The gunmen took ten *hostages*. | Боевики взяли десять заложников.
- insider | n | ɪnˈsaɪdə | ˌɪnˈsaɪdər | свой человек, инсайдер | a person inside an organisation | An *insider* leaked the information. | Информацию слил инсайдер.
- lad | n | læd |  | парень (брит., разг.) | a boy or young man | He's a nice *lad*. | Он славный парень.
- nominee | n | ˈnɒmɪniː | ˌnɑːməˈniː | номинант, кандидат | a person nominated for a prize or position | She's an Oscar *nominee*. | Она номинантка на «Оскар».
- patron | n | ˈpeɪtrən |  | покровитель; постоянный клиент | a supporter; a customer | The restaurant is only for *patrons*. | Ресторан только для посетителей.
- pioneer | n | ˌpaɪəˈnɪə | ˌpaɪəˈnɪr | первопроходец, пионер | one of the first people to do something | He was a *pioneer* of heart surgery. | Он был первопроходцем кардиохирургии.
- predecessor | n | ˈpriːdɪsesə | ˈpredəsesər | предшественник | a person who had a job before | She's better than her *predecessor*. | Она лучше своего предшественника.
- prophet | n | ˈprɒfɪt | ˈprɑːfət | пророк | a person who predicts the future or speaks for God | He was seen as a *prophet*. | Его считали пророком.
- recipient | n | rɪˈsɪpiənt |  | получатель | a person who receives something | She was the *recipient* of a special award. | Она получила особую награду.
- savage | adj | ˈsævɪdʒ |  | свирепый, жестокий | violent and cruel | The boy was bitten by a *savage* dog. | Мальчика укусила свирепая собака.
- successor | n | səkˈsesə | səkˈsesər | преемник | a person who comes after another | Who will be his *successor*? | Кто станет его преемником?
- tenant | n | ˈtenənt |  | арендатор, жилец | a person who pays rent to live in a place | The *tenants* complained about the noise. | Жильцы жаловались на шум.
- victor | n | ˈvɪktə | ˈvɪktər | победитель | the winner of a battle or competition | The *victor* is not always the hero. | Победитель — не всегда герой.
