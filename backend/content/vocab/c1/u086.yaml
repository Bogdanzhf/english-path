title: Law and crime
title_ru: Закон и преступность
topic: law
words:
- bribe | v | braɪb |  | давать взятку, подкупать | to give someone money illegally to make them help you | He tried to *bribe* the police officer. | Он пытался подкупить полицейского. | сущ. bribe — взятка; bribery — взяточничество
- con | n | kɒn | kɑːn | обман, мошенничество | a trick to get someone's money (informal) | The whole thing was a *con*. | Всё это было мошенничеством. | con artist — мошенник; pros and cons — за и против
- custody | n | ˈkʌstədi |  | опека; заключение под стражу | the legal right to look after someone; being kept by the police | The animals were kept in *custody* in a zoo. | Животных содержали в неволе в зоопарке. | in custody — под стражей
- detain | v | dɪˈteɪn |  | задерживать (официально) | to officially keep someone somewhere and not let them leave | Two men were *detained* for questioning. | Двоих мужчин задержали для допроса. | detention — задержание
- patent | n | ˈpætnt |  | патент | an official right to be the only one to make or sell an invention | He took out a *patent* on his invention. | Он запатентовал своё изобретение.
- sue | v | sjuː | suː | подавать в суд | to take someone to court to get money for harm they caused | He *sued* the company for a million dollars. | Он подал на компанию в суд на миллион долларов.
