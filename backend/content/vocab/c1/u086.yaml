title: Environment and energy
title_ru: Экология и энергия
topic: environment
words:
- carbon emissions | n | ˈkɑːbən ɪˈmɪʃənz | ˈkɑːrbən ɪˈmɪʃənz | выбросы углекислого газа | CO2 released into the air | We must reduce *carbon emissions*. | Нужно сократить выбросы CO2.
- carbon neutral | adj | ˈkɑːbən ˈnjuːtrəl | ˈkɑːrbən ˈnuːtrəl | углеродно-нейтральный | producing no net carbon | The company aims to be *carbon neutral*. | Компания стремится к углеродной нейтральности.
- conserve energy | phr |  |  | экономить энергию | to use less energy | Turn off lights to *conserve energy*. | Выключайте свет, чтобы экономить энергию.
- contamination | n | kənˌtæmɪˈneɪʃən | kənˌtæməˈneɪʃən | загрязнение, заражение | making dirty or poisonous | Water *contamination* caused illness. | Заражённая вода вызвала болезни.
- degradation | n | dɪɡrəˈdeɪʃən | ˌdeɡrəˈdeɪʃən | деградация, ухудшение | becoming worse | Environmental *degradation* is serious. | Ухудшение экологии — серьёзная проблема.
- depletion | n | dɪˈpliːʃən |  | истощение | using up | The *depletion* of resources worries scientists. | Истощение ресурсов тревожит учёных.
- desertification | n | dɪˌzɜːtɪfɪˈkeɪʃən | dɪzˌɜːtɪfɪkˈeɪʃən | опустынивание | land becoming desert | Overgrazing causes *desertification*. | Чрезмерный выпас скота ведёт к опустыниванию.
- dispose of waste | phr |  |  | утилизировать отходы | to get rid of rubbish | Factories must *dispose of waste* safely. | Заводы должны безопасно утилизировать отходы.
- energy crisis | n | ˈenədʒi ˈkraɪsɪs | ˈenərdʒi ˈkraɪsəs | энергетический кризис | a shortage of energy | Europe faced an *energy crisis*. | Европа столкнулась с энергетическим кризисом.
- exhaust fumes | n | ɪɡˈzɔːst fjuːmz |  | выхлопные газы | gases from car engines | *Exhaust fumes* pollute the air. | Выхлопные газы загрязняют воздух.
- finite resources | n | ˈfaɪnaɪt rɪˈzɔːsɪz | ˈfaɪnaɪt ˈriːsɔːrsɪz | ограниченные ресурсы | resources that will run out | Oil is one of our *finite resources*. | Нефть — один из невозобновляемых ресурсов.
- geothermal | adj | ˌdʒiːəʊˈθɜːml | ˌdʒiːoʊˈθɜːrml | геотермальный | using heat from the earth | Iceland uses *geothermal* energy. | Исландия использует геотермальную энергию.
- hydroelectric | adj | ˌhaɪdrəʊˈlektrɪk | ˌhaɪdroʊɪˈlektrɪk | гидроэлектрический | producing electricity from water | It's a *hydroelectric* dam. | Это плотина ГЭС.
- irreversible | adj | ɪrɪˈvɜːsəbl | ˌɪrɪˈvɜːrsəbl | необратимый | impossible to change back | The damage is *irreversible*. | Ущерб необратим.
- mitigate | v | ˈmɪtɪɡeɪt | ˈmɪtəɡeɪt | смягчать, уменьшать | to make less harmful | Trees help *mitigate* climate change. | Деревья помогают смягчать изменение климата.
- "non-renewable | adj | n\x01ːnrɪˈnuəbl | nɑːnriːˈnuːəbl | невозобновляемый | that cannot be replaced | Coal is a *non-renewable* resource. | Уголь — невозобновляемый ресурс."
- offset | v | ˌɒfˈset | ˌɔːfˈset | компенсировать, уравновешивать | to balance one effect with another | The cost was *offset* by lower taxes. | Расходы компенсировались снижением налогов. | offset — offset — offset
- overfishing | n | ˌəʊvəˈfɪʃɪŋ | ˈoʊvərfɪʃɪŋ | перелов рыбы | catching too many fish | *Overfishing* threatens marine life. | Перелов угрожает морской фауне.
- renewable | adj | rɪˈnjuːəbl | riːˈnuːəbl | возобновляемый | able to be replaced naturally | Wind is a *renewable* energy source. | Ветер — возобновляемый источник энергии.
- replant | v | rɪˈplænt | riːˈplænt | пересаживать; засаживать заново | to plant again | They *replanted* the forest. | Лес засадили заново.
- scarcity | n | ˈskeəsɪti | ˈskersɪti | нехватка, дефицит | a lack | There's a *scarcity* of water. | Ощущается нехватка воды.
