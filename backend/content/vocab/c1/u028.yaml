title: 'Describing: good or bad'
title_ru: 'Описание: оценка — хорошо или плохо'
topic: describing
words:
- acidic | adj | əˈsɪdɪk |  | кислотный, кислый | containing acid | Lemons are very *acidic*. | Лимоны очень кислые.
- arid | adj | ˈærɪd |  | засушливый | very dry, with little rain | The region became *arid* and dusty. | Регион стал засушливым и пыльным.
- audible | adj | ˈɔːdəbl |  | слышимый | loud enough to be heard | Her voice was barely *audible*. | Её голос был едва слышен. | inaudible — неслышимый
- chilly | adj | ˈtʃɪli |  | прохладный, зябкий | rather cold | It's a bit *chilly* today. | Сегодня прохладно.
- clammy | adj | ˈklæmi |  | липкий, влажный | unpleasantly damp | His hands were cold and *clammy*. | Его руки были холодными и липкими.
- compelling | adj | kəmˈpelɪŋ |  | убедительный; захватывающий | very convincing; very interesting | There's *compelling* evidence. | Есть убедительные доказательства.
- disturbing | adj | dɪˈstɜːbɪŋ | dɪˈstɜːrbɪŋ | тревожный, вызывающий беспокойство | making you worried or upset | The report contains *disturbing* facts. | В докладе тревожные факты.
- engaging | adj | ɪnˈɡeɪdʒɪŋ | enˈɡeɪdʒɪŋ | обаятельный, увлекательный | attractive and interesting | She has an *engaging* smile. | У неё обаятельная улыбка.
- exceptional | adj | ɪkˈsepʃənl |  | исключительный | unusually good; very unusual | She showed *exceptional* courage. | Она проявила исключительное мужество.
- fatal | adj | ˈfeɪtl |  | смертельный, роковой | causing death | Eating plastic can be *fatal* for seabirds. | Поедание пластика может быть смертельным для морских птиц.
- frustrating | adj | frʌˈstreɪtɪŋ | ˈfrʌstreɪtɪŋ | раздражающий, досадный | annoying because you can't succeed | It's *frustrating* when the internet is slow. | Ужасно бесит, когда интернет тормозит.
- inappropriate | adj | ˌɪnəˈprəʊpriət | ˌɪnəˈproʊpriːɪt | неуместный | not suitable | His jokes were *inappropriate*. | Его шутки были неуместны.
- legendary | adj | ˈledʒəndəri | ˈledʒənderi | легендарный | very famous | He's a *legendary* guitarist. | Он легендарный гитарист.
- notable | adj | ˈnəʊtəbl | ˈnoʊtəbl | заметный, выдающийся | important and deserving attention | It's a *notable* achievement. | Это заметное достижение.
- profitable | adj | ˈprɒfɪtəbl | ˈprɑːfətəbl | прибыльный | making a profit | The business is very *profitable*. | Бизнес очень прибыльный.
- showy | adj | ˈʃəʊi | ˈʃoʊi | броский, показной | too bright and attracting attention | She wore *showy* jewellery. | На ней были броские украшения.
- soluble | adj | ˈsɒljuːbl | ˈsɑːljəbl | растворимый | able to dissolve | Sugar is *soluble* in water. | Сахар растворяется в воде.
- striking | adj | ˈstraɪkɪŋ |  | поразительный, яркий | very noticeable | She's a *striking* woman. | Она женщина яркой внешности.
- stuffy | adj | ˈstʌfi |  | душный; чопорный | without fresh air; formal and boring | The room was hot and *stuffy*. | В комнате было жарко и душно.
- toxic | adj | ˈtɒksɪk | ˈtɑːksɪk | ядовитый, токсичный | poisonous | Some plants are *toxic* to cats. | Некоторые растения ядовиты для кошек.
- wicked | adj | ˈwɪkɪd |  | злой, порочный | very bad; evil | The *wicked* stepmother was cruel to Cinderella. | Злая мачеха была жестока к Золушке.
