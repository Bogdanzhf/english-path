title: Objects and materials
title_ru: Предметы и материалы
topic: objects
words:
- appliance | n | əˈplaɪəns |  | бытовой прибор | a machine used in the home, like a fridge or washing machine | We bought new kitchen *appliances*. | Мы купили новую кухонную технику.
- ash | n | æʃ |  | пепел, зола | the grey powder left after something burns | The car was covered in volcanic *ash*. | Машину покрыл вулканический пепел.
- backdrop | n | ˈbækdrɒp | ˈbækdrɑːp | фон, задник | the background | The mountains made a beautiful *backdrop*. | Горы стали красивым фоном.
- buzzer | n | ˈbʌzə | ˈbʌzər | зуммер, звонок | a device that makes a buzzing sound | Press the *buzzer* to enter. | Нажмите на звонок, чтобы войти.
- cloak | n | kləʊk | kloʊk | плащ, накидка | a loose coat without sleeves | The wizard wore a long *cloak*. | На волшебнике был длинный плащ.
- crystal | n | ˈkrɪstl |  | кристалл; хрусталь | a clear mineral; fine glass | The glasses are made of *crystal*. | Бокалы из хрусталя.
- filth | n | fɪlθ |  | грязь, мерзость | very unpleasant dirt | The floors were covered in years of *filth*. | Полы покрывал многолетний слой грязи. | filthy — грязный
- fixture | n | ˈfɪkstʃə | ˈfɪkstʃər | встроенная мебель; спортивное событие | something fixed in a building; a sports match | The *fixtures* are included in the price. | Встроенное оборудование включено в цену.
- formulation | n | ˌfɔːmjʊˈleɪʃən | ˌfɔːrmjəˈleɪʃən | формулировка; состав | the way something is expressed or made | The new *formulation* is gentler on skin. | Новый состав мягче для кожи.
- interchange | n | ˈɪntətʃeɪndʒ | ˈɪntərtʃeɪndʒ | обмен | an exchange of ideas or information | The conference allowed an *interchange* of ideas. | Конференция позволила обменяться идеями. | interchangeable — взаимозаменяемый
- mound | n | maʊnd |  | холмик, куча | a small hill or pile | There was a *mound* of rubbish in the garden. | В саду была куча мусора.
- pad | n | pæd |  | подкладка, накладка; блокнот | a thick soft piece of material used for protection or shape | The jacket has shoulder *pads*. | В пиджаке есть подплечники.
- pendulum | n | ˈpendjʊləm | ˈpendʒələm | маятник | a weight that swings | The clock's *pendulum* swung slowly. | Маятник часов медленно качался.
- plaster | n | ˈplɑːstə | ˈplæstər | штукатурка; гипс; пластырь | a substance used to cover walls; a material for setting broken bones | The *plaster* on the walls was cracked. | Штукатурка на стенах потрескалась.
- plumbing | n | ˈplʌmɪŋ |  | водопровод, сантехника | the pipes that carry water in a building | The *plumbing* in this old house is terrible. | Сантехника в этом старом доме ужасная. | plumber — сантехник; b не читается
- regulator | n | ˈreɡjuːleɪtə | ˈreɡjəleɪtər | регулятор; регулирующий орган | a device or organisation that controls | The energy *regulator* capped prices. | Регулятор энергетики ограничил цены.
- residue | n | ˈresɪdjuː | ˈrezəduː | остаток, осадок | what remains | There's a sticky *residue* on the table. | На столе липкий осадок.
- staple | n | ˈsteɪpl |  | скоба (степлера); основной продукт | a small wire to join papers; a basic food | Rice is a *staple* in Asia. | Рис — основной продукт в Азии.
- suspension | n | səˈspenʃən |  | подвеска; отстранение | a system that reduces shocks; being suspended | He got a three-match *suspension*. | Его дисквалифицировали на три матча.
- textile | n | ˈtekstaɪl |  | ткань, текстиль | cloth or fabric | The town's *textile* factories were destroyed. | Текстильные фабрики города были разрушены.
- timber | n | ˈtɪmbə | ˈtɪmbər | древесина, брус | wood used for building | The old *timber* beams were rotten. | Старые деревянные балки сгнили.
- trampoline | n | ˈtræmpəliːn | ˌtræmpəˈliːn | батут | a frame with a stretchy surface for jumping | The kids jumped on the *trampoline*. | Дети прыгали на батуте.
- utensil | n | juːˈtensl |  | кухонный предмет, утварь | a tool used in the kitchen | Put all the *utensils* in the dishwasher. | Сложите всю посуду в посудомойку.
