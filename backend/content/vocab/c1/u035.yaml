title: 'How and how much: adverbs'
title_ru: 'Как и насколько: наречия'
topic: manner
words:
- arguably | adv | ˈɑːɡjuːəbli | ˈɑːrɡjuːəbli | пожалуй, возможно | as many people could argue | He's *arguably* the best player. | Пожалуй, он лучший игрок.
- beforehand | adv | bɪˈfɔːhænd | bɪˈfɔːrhænd | заранее | before a particular event | You need to book a place *beforehand*. | Место нужно бронировать заранее.
- commercially | adv | kəˈmɜːʃəli | kəˈmɜːrʃəli | коммерчески | relating to business | The film was *commercially* successful. | Фильм имел коммерческий успех.
- immensely | adv | ɪˈmensli | ˌɪˈmensli | чрезвычайно | extremely | I enjoyed it *immensely*. | Мне это безмерно понравилось.
- indefinitely | adv | ɪnˈdefɪnətli | ˌɪnˈdefənətli | бессрочно, на неопределённое время | for an unlimited time | The meeting was postponed *indefinitely*. | Встречу отложили на неопределённый срок.
- inherently | adv | ɪnˈhiərəntli | ɪnˈherəntli | по своей сути | as a basic part | Driving is *inherently* risky. | Вождение рискованно по своей природе.
- ironically | adv | aɪˈrɒnɪkli | aɪˈrɑːnɪkli | по иронии судьбы | in a way that is the opposite of expected | *Ironically*, the fire station burned down. | По иронии судьбы сгорела пожарная часть.
- mutually | adv | ˈmjuːtʃuːəli |  | взаимно | for both sides | It's a *mutually* beneficial deal. | Это взаимовыгодная сделка.
- outright | adv | ˈaʊtraɪt |  | полностью, сразу; прямо | completely; immediately; openly | The farmers didn't believe it *outright*. | Фермеры сразу не поверили.
- overly | adv | ˈəʊvəli | ˈoʊvərli | слишком, чрезмерно | too | Don't be *overly* worried. | Не волнуйся слишком сильно.
- predominantly | adv | prɪˈdɒmɪnəntli | ˌprɪˈdɑːmənəntliː | преимущественно | mainly | The audience was *predominantly* young. | Публика была в основном молодой.
- profoundly | adv | prəˈfaʊndli | proʊˈfaʊndli | глубоко | deeply | I was *profoundly* moved. | Я был глубоко тронут.
- readily | adv | ˈredɪli | ˈredəli | охотно; легко | willingly; easily | The information is *readily* available. | Информация легкодоступна.
- reluctantly | adv | rɪˈlʌktəntli |  | неохотно | unwillingly | He *reluctantly* agreed. | Он неохотно согласился.
- remotely | adv | rɪˈməʊtli | riːˈmoʊtli | удалённо; хоть сколько-нибудь | from a distance; at all | I'm not *remotely* interested. | Мне это ни капли не интересно.
- thankfully | adv | ˈθæŋkfəli |  | к счастью | fortunately | *Thankfully*, nobody was hurt. | К счастью, никто не пострадал.
- undoubtedly | adv | ʌnˈdaʊtɪdli | ənˈdaʊtɪdli | несомненно | certainly | She's *undoubtedly* talented. | Она, несомненно, талантлива.
- voluntarily | adv | ˌvɒlənˈterəli | ˌvɑːlənˈterəli | добровольно | without being forced | He left *voluntarily*. | Он ушёл по собственному желанию.
- wholly | adv | ˈhəʊli | ˈhoʊli | полностью, всецело | completely | I'm not *wholly* convinced. | Я не до конца убеждён.
