title: Phrasal verbs
title_ru: Фразовые глаголы
topic: phrasal
words:
- boil down to | phv |  |  | сводиться к | to be basically about | It all *boils down to* money. | Всё сводится к деньгам.
- bounce back | phv |  |  | оправиться, прийти в норму | to recover quickly | The economy *bounced back*. | Экономика быстро восстановилась.
- branch out | phv |  |  | расширить деятельность | to start doing new things | The company *branched out* into clothing. | Компания занялась ещё и одеждой.
- bring something about | phr |  |  | вызывать, приводить к | to cause | What *brought about* the change? | Что вызвало изменения?
- bring something up | phr |  |  | поднимать (вопрос), упоминать | to mention | Don't *bring up* politics at dinner. | Не заводи разговор о политике за ужином.
- brush up on | phv |  |  | освежить (знания) | to improve a skill you have forgotten | I need to *brush up on* my French. | Мне нужно подтянуть французский.
- cash in on | phv |  |  | нажиться на | to make money from a situation | They *cashed in on* the trend. | Они нажились на этой моде.
- come down with | phv |  |  | заболеть (чем-либо) | to catch an illness | I think I'm *coming down with* flu. | Кажется, я заболеваю гриппом.
- crack down on | phv |  |  | принимать жёсткие меры против | to deal strictly with | Police are *cracking down on* drink driving. | Полиция ужесточает борьбу с пьяными водителями.
- do away with | phv |  |  | покончить с, упразднить | to get rid of | They *did away with* school uniforms. | Они отменили школьную форму.
- draw up | phv |  |  | составлять (документ) | to prepare a plan or contract | The lawyer *drew up* a contract. | Юрист составил договор.
- factor in | phv |  |  | учитывать | to include in calculations | *Factor in* the cost of travel. | Учтите стоимость дороги.
- fall through | phv |  |  | сорваться, провалиться | to fail to happen | The deal *fell through*. | Сделка сорвалась.
- follow through | phv |  |  | довести до конца | to complete what you started | He never *follows through* on his promises. | Он никогда не выполняет обещания.
- get across | phv |  |  | донести (мысль) | to make people understand | She *got across* her message clearly. | Она ясно донесла свою мысль.
- get away with something | phr |  |  | избежать наказания, сойти с рук | to not be punished for | He *got away with* cheating. | Ему сошёл с рук обман.
- iron out | phv |  |  | уладить, устранить | to solve small problems | We need to *iron out* a few problems. | Нужно уладить несколько проблем.
