title: Communication and language
title_ru: Общение и язык
topic: communication
words:
- marvel | v | ˈmɑːvl | ˈmɑːrvl | восхищаться, изумляться | to feel great surprise and admiration | We *marvelled* at the beauty of the mountains. | Мы восхищались красотой гор. | marvel at; marvellous — чудесный
- plea | n | pliː |  | мольба, призыв; заявление (в суде) | an urgent request | The family made a *plea* for help. | Семья обратилась с мольбой о помощи.
- snap | v | snæp |  | ломаться с треском; огрызаться | to break suddenly with a sharp sound; to speak angrily | The branch *snapped* under his weight. | Ветка с треском сломалась под его весом.
