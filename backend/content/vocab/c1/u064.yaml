title: Society and politics
title_ru: Общество и политика
topic: society
words:
- accountability | n | əˌkaʊntəˈbɪlɪti | əˈkaʊnəbɪlɪti | подотчётность, ответственность | being responsible for your actions | The public wants *accountability*. | Общество требует ответственности.
- alliance | n | əˈlaɪəns |  | союз, альянс | an agreement between countries or groups to work together | The two countries formed an *alliance*. | Две страны заключили союз.
- ally | n | ˈælaɪ |  | союзник | a person or country that agrees to help another | In the end, my old enemy became my best *ally*. | В итоге мой старый враг стал моим лучшим союзником.
- aristocrat | n | ˈærɪstəkræt | əˈrɪstəkræt | аристократ | a member of the aristocracy | He was born into a family of *aristocrats*. | Он родился в семье аристократов.
- authoritarian | adj | ˌɔːθɔːrɪˈteəriən | əˌθɔːrəˈteriən | авторитарный | demanding total obedience | It's an *authoritarian* regime. | Это авторитарный режим.
- bureaucracy | n | bjʊəˈrɒkrəsi | bjʊˈrɑːkrəsi | бюрократия | a complicated official system with many rules | Getting a licence involved a lot of *bureaucracy*. | Получение лицензии потребовало массы бюрократических формальностей.
- censorship | n | ˈsensəʃɪp | ˈsensərʃɪp | цензура | controlling what people can read or see | The government introduced *censorship*. | Правительство ввело цензуру.
- fleet | n | fliːt |  | флот, флотилия | a group of ships | The Spanish *fleet* had 130 ships. | Испанский флот насчитывал 130 кораблей.
- grassroots | adj | ˈɡrɑːsruːts | ˈɡræsˈruːts | низовой, народный | of ordinary people | It's a *grassroots* movement. | Это народное движение.
- guerrilla | n | ɡeˈrɪlə | ɡəˈrɪlə | партизан | a member of a small fighting group | *Guerrillas* attacked the base. | Партизаны атаковали базу.
- heritage | n | ˈherɪtɪdʒ |  | наследие | the history and traditions of a country or group | The castle is part of our national *heritage*. | Замок — часть нашего национального наследия.
- inequality | n | ɪniːˈkwɒlɪti | ˈɪniːˈkwɑːləti | неравенство | unfair differences | Income *inequality* is growing. | Неравенство доходов растёт.
- integration | n | ˌɪntɪˈɡreɪʃən | ˌɪnəˈɡreɪʃən | интеграция | joining into a group | The *integration* of immigrants takes time. | Интеграция иммигрантов требует времени.
- 'lobby | n | ˈlɒbi | ˈlɑːbi | вестибюль; лобби | a hall at the entrance; a group that tries to influence politicians | Wait for me in the hotel *lobby*. | Подожди меня в вестибюле отеля. | гл.: lobby — лоббировать'
- ritual | n | ˈrɪtʃuəl |  | ритуал, обряд | a set of actions that people always do in the same way | Drinking tea at five is a daily *ritual* in our family. | Чай в пять часов — ежедневный ритуал в нашей семье.
- saint | n | seɪnt |  | святой | a holy person | He's no *saint*! | Он далеко не святой!
- sovereignty | n | ˈsɒvərɪnti | ˈsɑːvrənti | суверенитет | a country's independence | The country fought for its *sovereignty*. | Страна боролась за суверенитет.
- subsidy | n | ˈsʌbsədi |  | субсидия | money given by the government to help pay costs | Farmers receive *subsidies* from the government. | Фермеры получают субсидии от государства.
- taxpayer | n | ˈtækspeɪə | ˈtækspeɪər | налогоплательщик | a person who pays tax | *Taxpayers'* money was wasted. | Деньги налогоплательщиков были потрачены впустую.
- transparency | n | trænˈspærənsi | trænˈsperənsi | прозрачность | openness | We demand *transparency* from the government. | Мы требуем от правительства прозрачности.
