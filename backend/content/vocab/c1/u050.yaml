title: Actions and movement
title_ru: Действия и движение
topic: actions
words:
- condense | v | kənˈdens |  | конденсироваться; сокращать | to change from gas to liquid; to make shorter | Steam *condensed* on the cold windows. | Пар оседал каплями на холодных окнах.
- confine | v | kənˈfaɪn |  | ограничивать, держать взаперти | to keep someone or something inside a limited space | The dog was *confined* to the garden. | Собаку держали в саду. | be confined to bed — быть прикованным к постели
- deteriorate | v | dɪˈtɪəriəreɪt | dɪˈtɪriəreɪt | ухудшаться | to become worse | The weather *deteriorated* quickly. | Погода быстро испортилась.
- heighten | v | ˈhaɪtn |  | усиливать | to make a feeling or effect stronger | The mystery *heightens* its appeal. | Тайна усиливает его притягательность.
- insulate | v | ˈɪnsjuleɪt | ˈɪnsəleɪt | изолировать, утеплять | to protect from heat, cold or noise | Strong friendships *insulate* us from stress. | Крепкая дружба защищает нас от стресса.
- mobilize | v | ˈməʊbəlaɪz | ˈmoʊbəlaɪz | мобилизовать | to prepare an army or people for action | The country *mobilized* its army within days. | Страна мобилизовала армию за несколько дней. | брит. также mobilise
- refine | v | rɪˈfaɪn |  | уточнять, совершенствовать; очищать | to improve something by making small changes; to make a substance pure | Scientists keep *refining* their methods. | Учёные постоянно совершенствуют свои методы. | refined sugar — рафинированный сахар
- replenish | v | rɪˈplenɪʃ |  | пополнять | to fill something up again | Drink water to *replenish* the fluids you lose. | Пейте воду, чтобы восполнить потерю жидкости.
- shatter | v | ˈʃætə | ˈʃætər | разбиваться вдребезги; разрушать | to break suddenly into many pieces; to destroy | The glass *shattered* on the floor. | Стакан разбился вдребезги об пол.
