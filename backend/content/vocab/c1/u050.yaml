title: Actions and movement
title_ru: Действия и движение
topic: actions
words:
- 'clutter | n | ˈklʌtə | ˈklʌtər | беспорядок, хлам | many things in an untidy mess | Clear the *clutter* off your desk. | Убери хлам со стола. | гл.: clutter — загромождать'
- condense | v | kənˈdens |  | конденсироваться; сокращать | to change from gas to liquid; to make shorter | Steam *condensed* on the cold windows. | Пар оседал каплями на холодных окнах.
- confine | v | kənˈfaɪn |  | ограничивать, держать взаперти | to keep someone or something inside a limited space | The dog was *confined* to the garden. | Собаку держали в саду. | be confined to bed — быть прикованным к постели
- deteriorate | v | dɪˈtɪəriəreɪt | dɪˈtɪriəreɪt | ухудшаться | to become worse | The weather *deteriorated* quickly. | Погода быстро испортилась.
- dilute | v | daɪˈluːt |  | разбавлять | to make weaker by adding water | *Dilute* the juice with water. | Разбавьте сок водой.
- erode | v | ɪˈrəʊd | ˈiːroʊd | разрушать(ся), подтачивать | to wear away gradually | The sea has *eroded* the cliffs. | Море подточило скалы.
- heighten | v | ˈhaɪtn |  | усиливать | to make a feeling or effect stronger | The mystery *heightens* its appeal. | Тайна усиливает его притягательность.
- insulate | v | ˈɪnsjuleɪt | ˈɪnsəleɪt | изолировать, утеплять | to protect from heat, cold or noise | Strong friendships *insulate* us from stress. | Крепкая дружба защищает нас от стресса.
- intensify | v | ɪnˈtensɪfaɪ | ɪnˈtensəfaɪ | усиливать(ся) | to become stronger | The storm *intensified*. | Буря усилилась.
- irrigate | v | ˈɪrɪɡeɪt |  | орошать | to supply land with water | They used the loan to *irrigate* their fields. | Они потратили заём на орошение полей.
- maximise | v | ˈmæksɪmaɪz | mˈæksɪmaɪz | максимизировать | to make as big as possible | We want to *maximise* profits. | Мы хотим максимально увеличить прибыль. | амер. maximize
- mobilize | v | ˈməʊbəlaɪz | ˈmoʊbəlaɪz | мобилизовать | to prepare an army or people for action | The country *mobilized* its army within days. | Страна мобилизовала армию за несколько дней. | брит. также mobilise
- recur | v | rɪˈkɜː | rɪˈkɜːr | повторяться | to happen again | The same dream *recurred* every night. | Один и тот же сон снился каждую ночь.
- refurbish | v | rɪˈfɜːbɪʃ | riːˈfɜːrbɪʃ | ремонтировать, обновлять | to repair and improve | The hotel was *refurbished*. | Отель отремонтировали.
- replenish | v | rɪˈplenɪʃ |  | пополнять | to fill something up again | Drink water to *replenish* the fluids you lose. | Пейте воду, чтобы восполнить потерю жидкости.
- saturate | v | ˈsætʃəreɪt |  | насыщать, пропитывать | to fill completely | The market is *saturated* with cheap goods. | Рынок перенасыщен дешёвыми товарами.
- 'sprout | v | spraʊt |  | прорастать | to start to grow | The seeds have *sprouted*. | Семена проросли. | сущ.: sprouts — брюссельская капуста'
- standardize | v | ˈstændɜːdaɪz | ˈstændərdaɪz | стандартизировать | to make the same | We need to *standardize* the tests. | Нужно стандартизировать тесты. | брит. также standardise
- stiffen | v | ˈstɪfən |  | напрягаться, коченеть | to become stiff | Her body *stiffened* with fear. | Её тело оцепенело от страха.
- ventilate | v | ˈventɪleɪt | ˈvenəleɪt | проветривать | to let fresh air into | *Ventilate* the room after painting. | Проветрите комнату после покраски.
