- proceeding | n | prəˈsiːdɪŋ |  | разбирательство (proceedings) | a legal process | Legal *proceedings* began. | Началось судебное разбирательство.
- restraint | n | rɪˈstreɪnt | riːˈstreɪnt | сдержанность; ограничение | self-control; a limit | Both sides showed *restraint*. | Обе стороны проявили сдержанность.
- roundup | n | ˈraʊndʌp |  | обзор, сводка | a summary of news | Here's the news *roundup*. | Вот сводка новостей.
