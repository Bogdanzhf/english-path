title: Events and situations
title_ru: События и ситуации
topic: events
words:
- accomplishment | n | əˈkɒmplɪʃmənt | əˈkɑːmplɪʃmənt | достижение | something achieved | It's quite an *accomplishment*. | Это настоящее достижение.
- antics | n | ˈæntɪks |  | выходки, проделки | silly behaviour | The children's *antics* made us laugh. | Детские проделки нас рассмешили.
