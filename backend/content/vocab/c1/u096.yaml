title: Events and situations
title_ru: События и ситуации
topic: events
words:
- accomplishment | n | əˈkɒmplɪʃmənt | əˈkɑːmplɪʃmənt | достижение | something achieved | It's quite an *accomplishment*. | Это настоящее достижение.
- antics | n | ˈæntɪks |  | выходки, проделки | silly behaviour | The children's *antics* made us laugh. | Детские проделки нас рассмешили.
- complication | n | ˌkɒmplɪˈkeɪʃən | ˌkɑːmpləˈkeɪʃən | осложнение | an extra problem | There were *complications* after surgery. | После операции были осложнения.
- consultancy | n | kənˈsʌltənsi |  | консалтинг, консалтинговая фирма | a company that gives advice | She works for a management *consultancy*. | Она работает в консалтинговой компании.
- dismissal | n | dɪˈsmɪsl | dɪsˈmɪsl | увольнение; отклонение | being sacked; rejecting | He claimed unfair *dismissal*. | Он заявил о незаконном увольнении.
- displacement | n | dɪˈspleɪsmənt | dɪsˈpleɪsmənt | перемещение, вытеснение | forcing people from their homes | The war caused mass *displacement*. | Война вызвала массовое переселение.
- disruption | n | dɪsˈrʌpʃən |  | срыв, нарушение | a disturbance | The strike caused *disruption*. | Забастовка вызвала перебои.
- domination | n | ˌdɒmɪˈneɪʃən | ˌdɑːməˈneɪʃən | господство | control over others | They fought against foreign *domination*. | Они боролись с иностранным господством.
- exodus | n | ˈeksədəs |  | массовый исход | many people leaving | There was an *exodus* from the city. | Из города начался массовый исход.
- inhibition | n | ɪnhɪˈbɪʃən | ˌɪnəˈbɪʃən | скованность, сдержанность; торможение | a feeling that stops you acting naturally | He lost his *inhibitions* after a drink. | Выпив, он раскрепостился.
- lag | n | læɡ |  | задержка, отставание | a period of time between two events | There's a time *lag* between the lightning and the thunder. | Между молнией и громом есть задержка. | jet lag — синдром смены часовых поясов
- omission | n | əˈmɪʃn | oʊˈmɪʃn | пропуск, упущение | something left out | The *omission* of salt made the soup tasteless. | Из-за того, что забыли посолить, суп был безвкусным. | omit — пропускать
- persecution | n | ˌpɜːsɪˈkjuːʃən | ˌpɜːrsəkˈjuːʃən | преследование (гонения) | cruel treatment for beliefs | They fled religious *persecution*. | Они бежали от религиозных гонений.
- privatization | n | ˈpraɪvətəˈzeɪʃən |  | приватизация | selling state companies | The *privatization* of railways was controversial. | Приватизация железных дорог вызвала споры. | брит. также privatisation
- proceeding | n | prəˈsiːdɪŋ |  | разбирательство (proceedings) | a legal process | Legal *proceedings* began. | Началось судебное разбирательство.
- restraint | n | rɪˈstreɪnt | riːˈstreɪnt | сдержанность; ограничение | self-control; a limit | Both sides showed *restraint*. | Обе стороны проявили сдержанность.
- roundup | n | ˈraʊndʌp |  | обзор, сводка | a summary of news | Here's the news *roundup*. | Вот сводка новостей.
- scrutiny | n | ˈskruːtəni |  | тщательное изучение, пристальное внимание | careful examination | The disaster came under intense *scrutiny*. | Катастрофу тщательно изучали.
- ventilation | n | ˌventɪˈleɪʃən | ˌvenəˈleɪʃən | вентиляция | the movement of fresh air | The room has poor *ventilation*. | В комнате плохая вентиляция.
