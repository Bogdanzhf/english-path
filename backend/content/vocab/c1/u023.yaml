- outing | n | ˈaʊtɪŋ |  | вылазка, прогулка | a short trip for fun | We went on a family *outing* to the zoo. | Мы всей семьёй выбрались в зоопарк.
- rental | n | ˈrentl |  | прокат, аренда | renting something | Car *rental* is cheap here. | Прокат машин здесь недорогой.
