title: Events and situations
title_ru: События и ситуации
topic: events
words:
- climax | n | ˈklaɪmæks |  | кульминация | the most exciting point | The *climax* of the film is a car chase. | Кульминация фильма — автомобильная погоня.
- consensus | n | kənˈsensəs |  | консенсус, общее согласие | an opinion that all or most people agree with | There is a scientific *consensus* on climate change. | В науке существует консенсус по поводу изменения климата.
- convergence | n | kənˈvɜːdʒəns | kənˈvɜːrdʒəns | сближение, схождение | coming together | There's a *convergence* of interests. | Интересы совпадают.
- demolition | n | ˌdeməˈlɪʃən |  | снос | destroying a building | The *demolition* of the old school began. | Начался снос старой школы.
- detriment | n | ˈdetrɪmənt | ˈdetrəmənt | ущерб, вред | harm | He worked long hours, to the *detriment* of his health. | Он работал допоздна в ущерб здоровью.
- deviation | n | ˌdiːvɪˈeɪʃən | ˌdiːviːˈeɪʃən | отклонение | moving away from the normal | Any *deviation* from the plan is risky. | Любое отклонение от плана рискованно.
- domain | n | dəˈmeɪn | doʊˈmeɪn | область, сфера; домен | an area of knowledge; an internet address | The information is in the public *domain*. | Информация общедоступна.
- fatality | n | feɪˈtælɪti | fəˈtælɪti | смертельный случай | a death in an accident | There were no *fatalities*. | Погибших не было.
- flicker | n | ˈflɪkə | ˈflɪkər | мерцание, проблеск | a quick unsteady light | There was a *flicker* of hope. | Мелькнул проблеск надежды.
- formality | n | fɔːˈmælɪti | fɔːrˈmæləti | формальность | something done only because it's required | The interview is just a *formality*. | Собеседование — простая формальность.
- integrity | n | ɪnˈteɡrəti |  | честность, порядочность; целостность | the quality of being honest and having strong principles | A judge must be a person of *integrity*. | Судья должен быть человеком безупречной честности.
- omen | n | ˈəʊmən | ˈoʊmən | знамение, предзнаменование | a sign of what will happen | Locals saw the dark clouds as a bad *omen*. | Местные жители сочли тёмные тучи дурным знаком.
- onset | n | ˈɒnset | ˈɑːnset | начало (чего-то плохого) | the beginning of something unpleasant | The *onset* of the illness was sudden. | Болезнь началась внезапно.
- ordeal | n | ɔːˈdiːl | ɔːrˈdiːl | тяжёлое испытание | a very unpleasant and difficult experience | Staying awake for 11 days was a terrible *ordeal*. | Не спать 11 дней было тяжелейшим испытанием.
- ranking | n | ˈræŋkɪŋ |  | рейтинг, место | a position in a list | The team's *ranking* improved. | Рейтинг команды повысился.
- realm | n | relm |  | царство, сфера | a kingdom; an area of activity or interest | The games were a symbol of power across the *realm*. | Игры были символом власти по всему царству. | in the realm of — в области
- substitution | n | ˌsʌbstɪˈtjuːʃən | ˌsʌbstɪˈtuːʃən | замена | replacing | The coach made a *substitution*. | Тренер провёл замену.
- 'vacuum | n | ˈvækjuːm |  | вакуум; пылесос | a space with no air; a vacuum cleaner | Sound can''t travel in a *vacuum*. | Звук не распространяется в вакууме. | гл.: vacuum — пылесосить'
- variance | n | ˈveəriəns | ˈveriəns | расхождение, отклонение | a difference | There's a *variance* between the figures. | Цифры расходятся.
