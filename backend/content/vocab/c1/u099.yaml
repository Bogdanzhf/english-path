title: Objects and materials
title_ru: Предметы и материалы
topic: objects
words:
- appliance | n | əˈplaɪəns |  | бытовой прибор | a machine used in the home, like a fridge or washing machine | We bought new kitchen *appliances*. | Мы купили новую кухонную технику.
- ash | n | æʃ |  | пепел, зола | the grey powder left after something burns | The car was covered in volcanic *ash*. | Машину покрыл вулканический пепел.
- filth | n | fɪlθ |  | грязь, мерзость | very unpleasant dirt | The floors were covered in years of *filth*. | Полы покрывал многолетний слой грязи. | filthy — грязный
- pad | n | pæd |  | подкладка, накладка; блокнот | a thick soft piece of material used for protection or shape | The jacket has shoulder *pads*. | В пиджаке есть подплечники.
- plaster | n | ˈplɑːstə | ˈplæstər | штукатурка; гипс; пластырь | a substance used to cover walls; a material for setting broken bones | The *plaster* on the walls was cracked. | Штукатурка на стенах потрескалась.
- timber | n | ˈtɪmbə | ˈtɪmbər | древесина, брус | wood used for building | The old *timber* beams were rotten. | Старые деревянные балки сгнили.
- utensil | n | juːˈtensl |  | кухонный предмет, утварь | a tool used in the kitchen | Put all the *utensils* in the dishwasher. | Сложите всю посуду в посудомойку.
