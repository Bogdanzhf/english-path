title: Actions and movement
title_ru: Действия и движение
topic: actions
words:
- dip | v | dɪp |  | обмакивать, окунать; снижаться | to put something into a liquid briefly; to go down | She *dipped* the cloth in cold water. | Она окунула тряпку в холодную воду.
- domesticate | v | dəˈmestəkeɪt |  | одомашнивать | to tame animals | Dogs were *domesticated* thousands of years ago. | Собак одомашнили тысячи лет назад.
- drill | v | drɪl |  | сверлить; муштровать | to make a hole; to train by repetition | He *drilled* a hole in the wall. | Он просверлил дыру в стене.
- filter | v | ˈfɪltə | ˈfɪltər | фильтровать | to pass through a filter | *Filter* the water before drinking. | Фильтруйте воду перед питьём.
- grasp | v | ɡrɑːsp | ɡræsp | схватить, крепко держать; понять | to hold something firmly; to understand | She *grasped* my hand. | Она схватила меня за руку.
- grind | v | ɡraɪnd |  | молоть, перемалывать | to crush something into very small pieces or powder | She *grinds* fresh coffee every morning. | Каждое утро она мелет свежий кофе. | grind — ground — ground
- hack | v | hæk |  | рубить; взламывать (компьютер) | to cut roughly; to break into a computer system | He *hacked* at the branches with a knife. | Он рубил ветки ножом. | hacker — хакер
- nick | v | nɪk |  | слегка порезать; стащить (разг.) | to make a small cut; to steal (informal) | He *nicked* his finger with the knife. | Он слегка порезал палец ножом.
- personalise | v | ˈpɜːsənəlaɪz | pˈɜːsənəlaɪz | персонализировать | to make suitable for one person | You can *personalise* the app. | Приложение можно настроить под себя. | амер. personalize
- pump | v | pʌmp |  | качать, накачивать | to move liquid or air with a pump | *Pump* up the tyres. | Накачай шины.
- 'punch | v | pʌntʃ |  | ударить кулаком; пробить | to hit with a fist | He *punched* him in the face. | Он ударил его кулаком в лицо. | сущ.: punch — удар; пунш'
- rally | v | ˈræli |  | сплачиваться, собираться (для поддержки) | to come together to support someone | Neighbours *rallied* to help the family. | Соседи сплотились, чтобы помочь семье. | сущ. rally — митинг
- rip | v | rɪp |  | рвать, разрывать | to tear something quickly | He *ripped* his trousers on the fence. | Он порвал брюки о забор.
- 'seal | v | siːl |  | запечатывать, герметизировать | to close tightly | *Seal* the envelope. | Заклейте конверт. | сущ.: seal — тюлень; печать'
- shed | v | ʃed |  | сбрасывать, проливать | to lose; to let fall | Snakes *shed* their skin. | Змеи сбрасывают кожу. | shed light on — проливать свет на
- slam | v | slæm |  | захлопывать, хлопать | to close something with force and noise | She *slammed* the door and left. | Она хлопнула дверью и ушла.
- smash | v | smæʃ |  | разбивать вдребезги | to break into many pieces violently | The protesters *smashed* the windows. | Протестующие разбили окна.
- squeeze | v | skwiːz |  | сжимать, выжимать | to press something firmly | *Squeeze* the lemon over the fish. | Выжмите лимон на рыбу.
- whip | v | wɪp | hwɪp | взбивать; хлестать | to beat cream or eggs; to hit with a whip | *Whip* the cream until thick. | Взбейте сливки до густоты.
- wipe | v | waɪp |  | вытирать | to clean something by rubbing it with a cloth | *Wipe* the table, please. | Вытри стол, пожалуйста.
