title: Events and situations
title_ru: События и ситуации
topic: events
words:
- adjustment | n | əˈdʒʌstmənt |  | регулировка; адаптация | a small change | I made a few *adjustments*. | Я внёс несколько поправок.
- amplification | n | ˌæmplɪfɪˈkeɪʃən | ˌæmpləfəˈkeɪʃən | усиление | making louder or bigger | The band uses *amplification*. | Группа играет с усилением.
- brainwashing | n | ˈbreɪnwɒʃɪŋ | ˈbreɪnwɑːʃɪŋ | промывание мозгов | forcing people to believe ideas | It's a form of *brainwashing*. | Это форма промывки мозгов.
- clash | v | klæʃ |  | сталкиваться, конфликтовать | to fight or argue; to not match | Protesters *clashed* with police. | Протестующие столкнулись с полицией.
- collision | n | kəˈlɪʒn |  | столкновение | an accident in which two things hit each other | The two cars were involved in a *collision*. | Две машины столкнулись.
- conversion | n | kənˈvɜːʃn | kənˈvɜːrʒn | превращение, переоборудование; конвертация | the process of changing from one form or use to another | The *conversion* of the old factory into flats took two years. | Переоборудование старой фабрики в квартиры заняло два года.
- descent | n | dɪˈsent |  | спуск, снижение; происхождение | a movement downwards; family origin | The plane began its *descent*. | Самолёт начал снижение. | of Russian descent — русского происхождения
- divergence | n | daɪˈvɜːdʒəns | daɪˈvɜːrdʒəns | расхождение | a difference | There's a *divergence* of opinion. | Мнения расходятся.
- elevation | n | ˌelɪˈveɪʃən | ˌeləˈveɪʃən | высота; повышение | height above sea level | The town is at an *elevation* of 2,000 m. | Город находится на высоте 2000 метров.
- emergence | n | ɪˈmɜːdʒəns | ˈiːmərdʒəns | появление, возникновение | appearing | The *emergence* of new technology changed work. | Появление новых технологий изменило работу.
- fate | n | feɪt |  | судьба, рок | a power that decides what will happen | It was *fate* that brought them together. | Их свела судьба.
- fragmentation | n | ˌfræɡmənˈteɪʃən |  | раздробленность, фрагментация | breaking into pieces | The *fragmentation* of the party weakened it. | Раскол ослабил партию.
- fusion | n | ˈfjuːʒən |  | слияние, синтез; фьюжн | joining together | It's a *fusion* of jazz and rock. | Это смесь джаза и рока.
- occurrence | n | əˈkɜːrəns |  | случай, явление | something that happens | Floods are a common *occurrence* here. | Наводнения здесь обычное дело.
- sequel | n | ˈsiːkwəl |  | продолжение (фильма, книги) | a book or film that continues a story | The *sequel* is better than the original. | Продолжение лучше оригинала.
- socialization | n | ˌsəʊʃəlɪˈzeɪʃən | ˌsoʊʃəlɪˈzeɪʃən | социализация | learning to behave in society | School helps *socialization*. | Школа помогает социализации. | брит. также socialisation
- 'static | adj | ˈstætɪk |  | статичный, неподвижный | not moving or changing | Prices have remained *static*. | Цены не меняются. | сущ.: static — статическое электричество; помехи'
- surge | n | sɜːdʒ | sɜːrdʒ | резкий рост, всплеск | a sudden large increase | There has been a *surge* in online shopping. | Произошёл резкий рост онлайн-покупок.
- variant | n | ˈveəriənt | ˈveriənt | вариант, разновидность | a different form | A new *variant* of the virus appeared. | Появился новый вариант вируса.
