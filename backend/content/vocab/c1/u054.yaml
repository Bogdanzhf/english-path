title: 'How and how much: adverbs'
title_ru: 'Как и насколько: наречия'
topic: manner
words:
- firsthand | adv | ˌfɜːstˈhænd | ˌfɜːrstˈhænd | из первых рук, лично | directly, from your own experience | I learned *firsthand* how hard it is to move abroad. | Я на собственном опыте узнал, как трудно переехать за границу. | брит. first-hand
- justly | adv | ˈdʒʌstli |  | справедливо, по праву | fairly; correctly | She is *justly* proud of her work. | Она по праву гордится своей работой.
- soundly | adv | ˈsaʊndli |  | крепко (спать); основательно | deeply (of sleep); thoroughly | The baby slept *soundly* all night. | Малыш крепко спал всю ночь.
