title: Communication and language
title_ru: Общение и язык
topic: communication
words:
- adaptation | n | ədəpˈteɪʃən | ˌædəpˈteɪʃən | адаптация, экранизация | adjusting; a film made from a book | It's a film *adaptation* of the novel. | Это экранизация романа.
- charter | n | ˈtʃɑːtə | ˈtʃɑːrtər | хартия, устав | a formal document that gives rights | The *charter* guaranteed certain freedoms. | Хартия гарантировала определённые свободы.
- commentary | n | ˈkɒməntri | ˈkɑːmənteri | комментарий, репортаж | a spoken description of an event | We listened to the match *commentary*. | Мы слушали репортаж о матче.
- confession | n | kənˈfeʃən |  | признание; исповедь | admitting guilt | He made a full *confession*. | Он полностью признался.
- consultation | n | kɒnsəlˈteɪʃən | ˌkɑːnsəlˈteɪʃən | консультация | a meeting to get advice | I had a *consultation* with a lawyer. | Я консультировался с юристом.
- demo | n | ˈdeməʊ | ˈdemoʊ | демо(версия); демонстрация | a demonstration | Watch the product *demo*. | Посмотрите демонстрацию продукта.
- documentation | n | ˌdɒkjuːmənˈteɪʃən | ˌdɑːkjəmenˈteɪʃən | документация | official papers | Bring all the necessary *documentation*. | Принесите все необходимые документы.
- hint | n | hɪnt |  | намёк, подсказка | a small piece of information that helps you guess | Give me a *hint*! | Дай подсказку!
- indicator | n | ˈɪndɪkeɪtə | ˈɪndəkeɪtər | показатель, индикатор | a sign that shows something | Unemployment is an economic *indicator*. | Безработица — экономический показатель.
- listing | n | ˈlɪstɪŋ |  | список, перечень; объявление | a list; an entry in a list | Check the TV *listings*. | Посмотри телепрограмму.
- memorial | n | məˈmɔːrɪəl | məˈmɔːriəl | мемориал, памятник | a monument to remember people | They built a war *memorial*. | Они воздвигли мемориал павшим.
- protocol | n | ˈprəʊtəkɒl | ˈproʊtəkɔːl | протокол, этикет | a system of rules for official occasions | According to *protocol*, the king enters first. | Согласно протоколу, король входит первым.
- provision | n | prəˈvɪʒn |  | обеспечение, предоставление | the act of supplying something | The *provision* of clean water saves lives. | Обеспечение чистой водой спасает жизни. | provisions — провизия
- reminder | n | rɪˈmaɪndə | riːˈmaɪndər | напоминание | something that helps you remember | I set a *reminder* on my phone. | Я поставил напоминание в телефоне.
- rhetoric | n | ˈretərɪk |  | риторика | persuasive language, often insincere | The speech was just empty *rhetoric*. | Речь была пустой риторикой.
- shaft | n | ʃɑːft | ʃæft | шахта; древко, вал | a long narrow vertical passage | The miners went down the *shaft*. | Шахтёры спустились в шахту. | a shaft of light — луч света
- submission | n | səbˈmɪʃən |  | подача; подчинение | giving in a document; obeying | The deadline for *submission* is Friday. | Крайний срок подачи — пятница.
- testimony | n | ˈtestɪməni | ˈtestəmoʊni | показания, свидетельство | a statement in court | The witness gave *testimony*. | Свидетель дал показания.
- tribute | n | ˈtrɪbjuːt |  | дань (уважения) | something you say or do to show respect | The concert was a *tribute* to the soldiers who died. | Концерт был данью памяти погибшим солдатам. | pay tribute to — отдать дань
- trophy | n | ˈtrəʊfi | ˈtroʊfi | трофей, кубок | a prize for winning | The team won the *trophy*. | Команда выиграла кубок.
- wit | n | wɪt |  | остроумие | clever humour | She's known for her *wit*. | Она славится остроумием.
