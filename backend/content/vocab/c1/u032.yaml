title: Actions and movement
title_ru: Действия и движение
topic: actions
words:
- accelerate | v | əkˈseləreɪt |  | ускорять(ся) | to go faster; to make something happen sooner | The rocket *accelerated* to 28,000 km/h. | Ракета разогналась до 28 000 км/ч.
- align | v | əˈlaɪn |  | присоединяться, вставать на сторону; выравнивать | to publicly support a group or opinion; to put in a straight line | The party *aligned* itself with the workers' movement. | Партия встала на сторону рабочего движения.
- commence | v | kəˈmens |  | начинать(ся) (офиц.) | to begin | The ceremony will *commence* at noon. | Церемония начнётся в полдень.
- consolidate | v | kənˈsɒlɪdeɪt | kənˈsɑːlɪdeɪt | укреплять; объединять | to make stronger; to combine into one | The company *consolidated* its position in the market. | Компания укрепила свои позиции на рынке.
- diminish | v | dɪˈmɪnɪʃ |  | уменьшать(ся) | to become or make smaller or less important | The value of their skills *diminished*. | Ценность их навыков снизилась.
- flourish | v | ˈflʌrɪʃ | ˈflɜːrɪʃ | процветать | to grow or develop successfully | The society *flourished* for centuries. | Общество процветало веками.
- fuse | n | fjuːz |  | фитиль; предохранитель | a string you light to make a firework explode; a safety part in electrics | Light the *fuse* and stand back. | Подожги фитиль и отойди.
- inhibit | v | ɪnˈhɪbɪt |  | подавлять, сдерживать | to slow down or prevent something | The drug *inhibits* the growth of cancer cells. | Препарат подавляет рост раковых клеток.
- maximize | v | ˈmæksɪmaɪz |  | максимально увеличивать | to make as large as possible | Banks aim to *maximize* profits. | Банки стремятся максимально увеличить прибыль.
- merge | v | mɜːdʒ | mɜːrdʒ | сливаться, объединяться | to join together into one | The two small companies *merged* last year. | В прошлом году две маленькие компании объединились.
- render | v | ˈrendə | ˈrendər | делать, приводить в состояние | to cause someone or something to be in a particular state | The illness *rendered* him blind. | Болезнь сделала его слепым.
- suppress | v | səˈpres |  | подавлять | to stop something by force; to hide feelings | The company *suppressed* the report about its factories. | Компания скрыла отчёт о своих фабриках.
- terminate | v | ˈtɜːmɪneɪt | ˈtɜːrmɪneɪt | прекращать, расторгать | to end something | The contract was *terminated* early. | Контракт был досрочно расторгнут.
- thrive | v | θraɪv |  | процветать, хорошо себя чувствовать | to grow and develop well | Older people *thrive* when they feel needed. | Пожилые люди расцветают, когда чувствуют себя нужными.
- vanish | v | ˈvænɪʃ |  | исчезать | to disappear suddenly | The magician made the coin *vanish*. | Фокусник заставил монету исчезнуть.
