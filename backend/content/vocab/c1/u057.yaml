title: Communication and language
title_ru: Общение и язык
topic: communication
words:
- accusation | n | ˌækjuːˈzeɪʃən | ˌækjəˈzeɪʃən | обвинение | a claim that someone did wrong | He denied the *accusation*. | Он отверг обвинение.
- allegation | n | ˌælɪˈɡeɪʃən | ˌæləˈɡeɪʃən | (бездоказательное) обвинение, заявление | a claim without proof | The *allegations* were false. | Обвинения оказались ложными.
- articulate | v | ɑːˈtɪkjuleɪt | ɑːrˈtɪkjuleɪt | чётко формулировать | to express ideas clearly in words | She *articulated* her ideas very clearly. | Она очень чётко изложила свои мысли. | прил. articulate [-lət] — красноречивый
- characterization | n | ˌkerəktɜːɪˈzeɪʃən | ˌkerəktərɪˈzeɪʃən | создание образа, характеристика | describing characters | The novel has strong *characterization*. | В романе ярко выписаны персонажи. | брит. также characterisation
- counselling | n | ˈkaʊnsəlɪŋ | kˈaʊnsəlɪŋ | психологическая помощь, консультирование | professional advice for problems | She's having *counselling*. | Она ходит к психологу. | амер. counseling
- credential | n | krɪˈdenʃl | krəˈdenʃl | квалификация, полномочия (credentials) | proof of qualifications | Check his *credentials*. | Проверьте его квалификацию.
- depiction | n | dɪˈpɪkʃən |  | изображение | showing in art or words | It's a realistic *depiction* of war. | Это реалистичное изображение войны.
- estimation | n | ˌestɪˈmeɪʃən | ˌestəˈmeɪʃən | оценка, мнение | a judgement | In my *estimation*, it'll take a year. | По моей оценке, это займёт год.
- etiquette | n | ˈetɪket |  | этикет | rules of polite behaviour | Online shopping has its own *etiquette*. | У онлайн-шопинга свой этикет.
- flattery | n | ˈflætəri |  | лесть | too much praise | *Flattery* will get you nowhere. | Лестью ничего не добьёшься.
- impersonation | n | ɪmˌpɜːsəˈneɪʃən | ˌɪmpərsəˈneɪʃən | пародия; выдача себя за другого | copying someone's voice; pretending to be someone | He does a great *impersonation* of the president. | Он отлично пародирует президента.
- interjection | n | ˌɪntəˈdʒekʃən | ˌɪntərˈdʒekʃən | междометие | a word like "oh!" or "wow!" | "Ouch" is an *interjection*. | «Ouch» — междометие.
- outburst | n | ˈaʊtbɜːst | ˈaʊtbɜːrst | вспышка (гнева) | a sudden expression of strong emotion | The king was known for his violent *outbursts*. | Король был известен своими вспышками ярости.
- parenthesis | n | pəˈrenθəsɪs |  | скобка; вставка | the marks ( ) ; a comment inside them | Add the date in *parentheses*. | Укажите дату в скобках. | мн. ч. parentheses
- ploy | n | plɔɪ |  | уловка | a clever trick | It was just a *ploy* to get attention. | Это была просто уловка, чтобы привлечь внимание.
- "popularization | n | ˌp\x01ːpjəlɜːəˈzeɪʃən | ˌpɑːpjələrəˈzeɪʃən | популяризация | making something popular | The *popularization* of science is important. | Популяризация науки важна. | брит. также popularisation"
- portrayal | n | pɔːˈtreɪəl | pɔːrˈtreɪəl | изображение, портрет | the way someone is shown | Her *portrayal* of the queen won an award. | Её роль королевы получила награду.
- rudiments | n | ˈruːdɪmənts |  | основы, азы | the basic principles | I know the *rudiments* of chess. | Я знаю азы шахмат.
- synopsis | n | sɪˈnɒpsɪs | sɪˈnɑːpsɪs | краткое содержание | a summary | Read the *synopsis* of the film. | Прочитайте краткое содержание фильма.
- utterance | n | ˈʌtərəns |  | высказывание | something said | Each *utterance* was recorded. | Каждое высказывание записывалось.
