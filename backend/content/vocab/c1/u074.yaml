title: Economy and business
title_ru: Экономика и бизнес
topic: economy
words:
- affluence | n | ˈæfluːəns |  | достаток, изобилие | wealth | The town shows signs of *affluence*. | В городе видны признаки достатка.
- affordability | n | əˌfɔːdəˈbɪlɪti | əˌfɔːrdəˈbɪləti | доступность (по цене) | being cheap enough | Housing *affordability* is a big issue. | Доступность жилья — большая проблема.
- consumerism | n | kənˈsuːmərɪzəm |  | потребительство, консьюмеризм | the focus on buying goods | *Consumerism* harms the planet. | Потребительство вредит планете.
- cost of living | n | kɒst əv ˈlɪvɪŋ | kɑːst əv ˈlɪvɪŋ | стоимость жизни | how much money you need to live | The *cost of living* in London is high. | Жизнь в Лондоне дорогая.
- developed country | n | dɪˈveləpt ˈkʌntri |  | развитая страна | a rich industrial country | Japan is a *developed country*. | Япония — развитая страна.
- developing country | n | dɪˈveləpɪŋ ˈkʌntri |  | развивающаяся страна | a poorer country building its economy | Many *developing countries* need investment. | Многим развивающимся странам нужны инвестиции.
- disposable income | n | dɪˈspəʊzəbl ˈɪnkʌm | dɪˈspoʊzəbl ˈɪnkʌm | располагаемый доход | money left after paying bills | Young people have less *disposable income*. | У молодёжи меньше свободных денег.
- "e-commerce | n | ˈiˈk\x01ːmɜːs | ˈiːˈkɑːmərs | электронная коммерция | buying and selling online | *E-commerce* has grown rapidly. | Электронная торговля быстро растёт."
- emerging economy | n | ɪˈmɜːdʒɪŋ ɪˈkɒnəmi | ˈiːmərdʒɪŋ iːˈkɑːnəmi | развивающаяся экономика | a country with fast economic growth | India is an *emerging economy*. | Индия — развивающаяся экономика.
- interdependence | n | ˌɪntədɪˈpendəns | ˌɪntərdəˈpendəns | взаимозависимость | depending on each other | There's a growing *interdependence* between countries. | Взаимозависимость стран растёт.
- monopoly | n | məˈnɒpəli | məˈnɑːpəli | монополия | complete control of a market | The company has a *monopoly* on gas. | Компания — монополист на рынке газа.
- stakeholder | n | ˈsteɪkhəʊldə | ˈsteɪkhoʊldər | заинтересованная сторона | a person with an interest in a business | All *stakeholders* were consulted. | Со всеми заинтересованными сторонами провели консультации.
- startup | n | ˈstɑːtʌp | ˈstɑːrtʌp | стартап | a new small company | He works at a tech *startup*. | Он работает в технологическом стартапе.
- superpower | n | ˈsuːpəpaʊə | ˌsuːpərˈpaʊər | сверхдержава | a very powerful country | The USA is a *superpower*. | США — сверхдержава.
- sweatshop | n | ˈswetʃɒp | ˈswetʃɑːp | потогонное производство | a factory with bad conditions and low pay | The clothes were made in *sweatshops*. | Одежду шили на потогонных фабриках.
- tariff | n | ˈtærɪf |  | тариф, пошлина | a tax on goods coming into a country | The government put a *tariff* on imported steel. | Правительство ввело пошлину на импортную сталь.
