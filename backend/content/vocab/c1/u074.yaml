title: Society and politics
title_ru: Общество и политика
topic: society
words:
- coalition | n | ˌkəʊəˈlɪʃn | ˌkoʊəˈlɪʃn | коалиция | a group of parties or organizations working together | A *coalition* of patients' groups campaigned for lower prices. | Коалиция пациентских организаций добивалась снижения цен.
- corps | n | kɔː | kɔːr | корпус (воинский), группа | a group of people working together; a military unit | The army medical *corps* treated the wounded. | Армейская медицинская служба лечила раненых. | ps не читается
- federation | n | ˌfedəˈreɪʃn |  | федерация | a group of states or organizations united under one government | Russia is a *federation* of many regions. | Россия — федерация многих регионов.
- imperial | adj | ɪmˈpɪəriəl | ɪmˈpɪriəl | имперский | connected with an empire | English spread across the world in the *imperial* era. | Английский распространился по миру в имперскую эпоху.
- legislature | n | ˈledʒɪsleɪtʃə | ˈledʒɪsleɪtʃər | законодательный орган | the group of people who make laws | The *legislature* passed a new language law. | Парламент принял новый закон о языке.
- metropolitan | adj | ˌmetrəˈpɒlɪtən | ˌmetrəˈpɑːlɪtən | столичный, относящийся к крупному городу | connected with a large city | The *metropolitan* area has five million people. | В агломерации проживает пять миллионов человек.
- mob | n | mɒb | mɑːb | толпа | a large, often uncontrolled crowd | A *mob* of reporters waited outside. | Снаружи ждала толпа репортёров.
- municipal | adj | mjuːˈnɪsɪpl |  | муниципальный, городской | connected with a city or town government | *Municipal* recycling programmes vary widely. | Городские программы переработки сильно различаются.
- naval | adj | ˈneɪvl |  | военно-морской | connected with the navy | It was one of the most famous *naval* battles in history. | Это было одно из самых знаменитых морских сражений в истории.
- parish | n | ˈpærɪʃ |  | приход (церковный) | an area that has its own church and priest | He served as priest in the same *parish* for thirty years. | Он тридцать лет служил священником в одном приходе.
- regime | n | reɪˈʒiːm |  | режим | a system of government; a plan of treatment, diet or exercise | His doctor put him on a strict exercise *regime*. | Врач назначил ему строгий режим тренировок.
