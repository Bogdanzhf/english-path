title: Thinking and opinions
title_ru: Мысли и мнения
topic: mind
words:
- abstraction | n | əbˈstrækʃən | æbˈstrækʃən | абстракция | a general idea | Freedom is an *abstraction*. | Свобода — абстракция.
- approximation | n | əˌprɒksɪˈmeɪʃən | əˌprɑːksəˈmeɪʃən | приближение, приблизительная оценка | a close but not exact value | It's only an *approximation*. | Это лишь приблизительная оценка.
- breadth | n | bredθ |  | ширина; широта (знаний) | the distance from one side to the other | The *breadth* of the river is about fifty metres. | Ширина реки — около пятидесяти метров.
- counterpart | n | ˈkaʊntəpɑːt | ˈkaʊntərpɑːrt | аналог, коллега (в другой стране или группе) | a person or thing that has the same position in a different place | The minister met his French *counterpart*. | Министр встретился со своим французским коллегой.
- craze | n | kreɪz |  | повальное увлечение, мода | something that is very popular for a short time | The yo-yo was the latest *craze* at school. | Йо-йо было последним повальным увлечением в школе.
- differentiation | n | ˌdɪfəˌrenʃɪˈeɪʃən | ˌdɪfəˌrentʃiːˈeɪʃən | дифференциация, различение | seeing or making differences | Product *differentiation* is key in marketing. | Дифференциация продукта — ключ в маркетинге.
- ingenuity | n | ˌɪndʒɪˈnjuːɪti | ˌɪndʒəˈnuːətiː | изобретательность | cleverness | The plan shows great *ingenuity*. | План свидетельствует о большой изобретательности.
- intellect | n | ˈɪntəlekt |  | интеллект, ум | the ability to think and understand | He was a man of great *intellect*. | Он был человеком большого ума.
- intuition | n | ɪntjuːˈɪʃən | ˌɪntuːˈɪʃən | интуиция | knowing without thinking | My *intuition* told me to leave. | Интуиция подсказала мне уйти.
- panorama | n | ˌpænəˈræmə |  | панорама | a wide view | The *panorama* from the top is stunning. | Панорама с вершины потрясающая.
- parameter | n | pəˈræmɪtə | pəˈræmətər | параметр | a limit or factor | We must work within these *parameters*. | Мы должны работать в этих рамках.
- professionalism | n | prəˈfeʃənəlɪzəm |  | профессионализм | skill and good behaviour at work | We admired his *professionalism*. | Мы восхищались его профессионализмом.
- psyche | n | ˈsaɪkiː | ˈsaɪki | психика | the mind | The war damaged his *psyche*. | Война травмировала его психику.
- stereotype | n | ˈsteriətaɪp |  | стереотип | a fixed but often wrong idea about a type of person or thing | She challenged the *stereotype* of the male scientist. | Она бросила вызов стереотипу о том, что учёный — это мужчина.
- stimuli | n | ˈstɪmjʊlaɪ | ˈstɪmjəlaɪ | стимулы, раздражители | things that cause a reaction | Babies respond to *stimuli*. | Младенцы реагируют на раздражители. | ед. ч. stimulus
- strand | n | strænd |  | прядь, нить; аспект | a thin piece; a part of something | A *strand* of hair fell on her face. | Прядь волос упала ей на лицо.
- tactic | n | ˈtæktɪk |  | тактика, приём | a method used to achieve something | Using fake quotes is a common political *tactic*. | Использование поддельных цитат — распространённый политический приём.
- versatility | n | ˌvɜːsəˈtɪlɪti | ˌvɜːrsəˈtɪləti | разносторонность, универсальность | being able to do many things | The car's *versatility* makes it popular. | Универсальность машины делает её популярной.
- vigil | n | ˈvɪdʒɪl |  | бдение, дежурство | a period of staying awake to watch or pray | He kept a constant *vigil* against his enemies. | Он постоянно был начеку, ожидая врагов.
