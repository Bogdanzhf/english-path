reading:
  title: "Why the Amazon Matters"
  title_ru: "Почему важна Амазония"
  text: |
    The Amazon rainforest covers about 5.5 million square kilometres, mostly in Brazil, close to the equator. It is home to around ten percent of all known species on Earth, including countless exotic birds, insects and plants, many of which have never been studied. Scientists consider it the birthplace of a huge variety of life.

    The Amazon is often called "the lungs of the planet", because it produces large amounts of oxygen. In fact, this is slightly misleading: the forest uses most of the oxygen it produces, so its overall contribution to the air we breathe is small. Its true importance lies elsewhere. The rainforest stores enormous amounts of carbon in its trees and soil. Its capacity to absorb carbon dioxide makes it crucial in the fight against climate change.

    The forest also creates its own weather. Trees draw water from the soil and release it into the air, where it contributes to the formation of clouds. These "flying rivers" distribute rain across South America, watering farms thousands of kilometres away. Without the forest, much of the continent could become far drier.

    Unfortunately, the Amazon is under threat. Large areas have been cleared for cattle farms and soya plantations. Illegal miners search for gold deposits, poisoning rivers with mercury. Every year, fires destroy wooded areas, and the cumulative damage is huge. Scientists warn that the frequency of droughts is increasing, and that if too much forest is lost, parts of the Amazon could turn into dry grassland — a change that might not be reversible.

    There is hope, however. Studies show that forests managed by indigenous communities suffer far less destruction than other areas. Comprehensive monitoring by satellites helps authorities find illegal logging quickly. When the federal government has made protection a clear objective, deforestation has fallen dramatically. A successful strategy must also offer local people beneficial ways to earn a living without cutting down trees. Conserving the Amazon is not only Brazil's responsibility; it matters to everyone on Earth.
  ru: |
    Тропический лес Амазонии занимает около 5,5 миллиона квадратных километров, в основном в Бразилии, недалеко от экватора. Здесь обитает около десяти процентов всех известных видов на Земле, в том числе бесчисленные экзотические птицы, насекомые и растения, многие из которых никогда не изучались. Учёные считают Амазонию родиной огромного разнообразия жизни.

    Амазонию часто называют «лёгкими планеты», потому что она вырабатывает много кислорода. На самом деле это не совсем верно: лес сам расходует большую часть производимого кислорода, так что его вклад в воздух, которым мы дышим, невелик. Его настоящая ценность в другом. Тропический лес хранит в деревьях и почве огромное количество углерода. Способность поглощать углекислый газ делает его крайне важным в борьбе с изменением климата.

    Лес также создаёт собственную погоду. Деревья вытягивают воду из почвы и выпускают её в воздух, где она участвует в образовании облаков. Эти «летающие реки» разносят дожди по Южной Америке, орошая фермы в тысячах километров. Без леса большая часть континента могла бы стать гораздо засушливее.

    К сожалению, Амазония под угрозой. Большие территории вырублены под пастбища для скота и плантации сои. Незаконные старатели ищут месторождения золота, отравляя реки ртутью. Ежегодно пожары уничтожают лесные участки, и совокупный ущерб огромен. Учёные предупреждают, что засухи случаются всё чаще и что при потере слишком большой части леса отдельные районы Амазонии могут превратиться в сухую саванну — и это изменение может оказаться необратимым.

    И всё же надежда есть. Исследования показывают, что леса, которыми управляют коренные общины, страдают гораздо меньше других. Всесторонний спутниковый мониторинг помогает властям быстро находить незаконную вырубку. Когда федеральное правительство делало охрану леса чёткой целью, темпы вырубки резко падали. Успешная стратегия должна также давать местным жителям полезные способы зарабатывать, не вырубая деревья. Сохранение Амазонии — ответственность не только Бразилии; это важно для каждого жителя Земли.
  questions:
    - q: "Why is 'the lungs of the planet' slightly misleading?"
      options: ["The forest produces no oxygen", "The forest uses most of the oxygen it produces", "The forest is too small", "Oxygen comes only from the ocean"]
      answer: 1
    - q: "What are 'flying rivers'?"
      options: ["Rivers in the mountains", "Water released by trees that brings rain to other areas", "Waterfalls", "Floods"]
      answer: 1
    - q: "Which forests suffer less destruction?"
      options: ["Forests near cities", "Forests managed by indigenous communities", "Forests with gold", "Young forests"]
      answer: 1
    - tf: "Illegal miners pollute rivers with mercury."
      answer: true
    - tf: "Scientists are sure that any damage to the Amazon can be easily reversed."
      answer: false
