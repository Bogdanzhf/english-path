title: Law and crime
title_ru: Закон и преступность
topic: law
words:
- convict | v | kənˈvɪkt |  | осуждать, признавать виновным | to decide officially in court that someone is guilty | He was *convicted* of robbery. | Его признали виновным в ограблении.
- pirate | n | ˈpaɪrət |  | пират | a person who attacks and robs ships at sea | The *pirates* buried their treasure on the island. | Пираты зарыли сокровища на острове.
- prosecute | v | ˈprɒsɪkjuːt | ˈprɑːsɪkjuːt | преследовать в судебном порядке | to officially accuse someone of a crime in court | Shoplifters will be *prosecuted*. | Магазинные воры будут привлечены к ответственности.
