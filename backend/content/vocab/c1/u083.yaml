title: Science and research
title_ru: Наука и исследования
topic: science
words:
- bacterial | adj | bækˈtiərɪəl | bækˈtɪriəl | бактериальный | caused by bacteria | It's a *bacterial* infection. | Это бактериальная инфекция.
- beam | n | biːm |  | балка; луч | a long heavy piece of wood or metal; a line of light | A *beam* of light came through the window. | Через окно пробивался луч света.
- cellular | adj | ˈseljələ | ˈseljələr | клеточный; сотовый | connected with the cells of living things; (of phones) mobile | The disease causes *cellular* damage. | Болезнь вызывает повреждение клеток. | cellular phone (амер.) — мобильный
- electromagnetic | adj | ɪˌlektrəʊmæɡˈnetɪk | ɪˌlektroʊmæɡˈnetɪk | электромагнитный | connected with electricity and magnetism | Light is a form of *electromagnetic* radiation. | Свет — форма электромагнитного излучения.
- emit | v | iˈmɪt |  | выделять, испускать | to send out gas, heat, light or sound | Old cars *emit* more harmful gases. | Старые машины выделяют больше вредных газов. | emission — выброс
- equation | n | ɪˈkweɪʒn |  | уравнение | a mathematical statement that two things are equal | Solve this *equation* for x. | Решите это уравнение относительно x.
- genome | n | ˈdʒiːnəʊm | ˈdʒiːnoʊm | геном | the complete set of genes of a living thing | Scientists have mapped the human *genome*. | Учёные расшифровали геном человека.
- hemisphere | n | ˈhemɪsfɪə | ˈhemɪsfɪr | полушарие | half of the Earth | Kenya lies in both *hemispheres*. | Кения расположена в обоих полушариях. | northern/southern hemisphere
- magnetic | adj | mæɡˈnetɪk |  | магнитный | having magnetism | The earth has a *magnetic* field. | У Земли есть магнитное поле.
- magnetism | n | ˈmæɡnɪtɪzəm | ˈmæɡnətɪzəm | магнетизм | the force of magnets; attraction | He has great personal *magnetism*. | Он обладает огромным личным обаянием.
- mutation | n | mjuːˈteɪʃən |  | мутация | a change in genes | The virus has a new *mutation*. | У вируса новая мутация.
- propulsion | n | prəˈpʌlʃn |  | движущая сила, тяга | the force that pushes something forward | Rockets use chemical *propulsion*. | Ракеты используют химическую тягу.
- quantum | n | ˈkwɒntəm | ˈkwɑːntəm | квант; квантовый | the smallest amount of energy in physics; connected with this physics | *Quantum* computers could solve problems in seconds. | Квантовые компьютеры смогут решать задачи за секунды. | quantum leap — огромный скачок
- reactor | n | rɪˈæktə | riːˈæktər | реактор | a machine that produces nuclear energy | The nuclear *reactor* was shut down. | Ядерный реактор остановили.
- space station | n | speɪs ˈsteɪʃən |  | космическая станция | a large satellite where people live | Astronauts live on the *space station*. | Космонавты живут на космической станции.
- specimen | n | ˈspesɪmən | ˈspesəmən | образец, экземпляр | an example; a sample | The museum has rare *specimens*. | В музее есть редкие экземпляры.
- spectrum | n | ˈspektrəm |  | спектр | the full range of colours or things | A rainbow shows the colours of the *spectrum*. | Радуга показывает цвета спектра.
- statistical | adj | stəˈtɪstɪkl |  | статистический | relating to statistics | There's no *statistical* evidence. | Нет статистических данных.
- stem cells | n | stem selz |  | стволовые клетки | cells that can become any type | *Stem cells* may cure diseases. | Стволовые клетки могут излечивать болезни.
- the Big Bang | n | ðə bɪɡ bæŋ |  | Большой взрыв | the explosion that started the universe | The universe began with *the Big Bang*. | Вселенная возникла в результате Большого взрыва.
- thermal | adj | ˈθɜːml | ˈθɜːrml | тепловой, термальный | relating to heat | We bathed in *thermal* springs. | Мы купались в термальных источниках.
- trajectory | n | trəˈdʒektəri |  | траектория | the path of a moving object | The rocket's *trajectory* was perfect. | Траектория ракеты была идеальной.
