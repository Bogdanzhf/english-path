reading:
  title: The Day the Dinosaurs Died
  title_ru: День, когда погибли динозавры
  text: |
    For more than 160 million years, dinosaurs ruled the Earth. Some were giant vegetarians that ate the leaves of tall trees; others were fierce hunters. Then, around 66 million years ago, they suddenly disappeared, together with about three quarters of all species on the planet. What happened?

    In 1980, a father-and-son team, the physicist Luis Alvarez and the geologist Walter Alvarez, proposed a dramatic answer. They had analyzed a thin layer of clay found in rocks of that age around the world. It contained unusually high levels of iridium, a metal that is rare on Earth but common in asteroids. Their conclusion: a huge asteroid had hit the planet.

    At first, the theory caused great controversy. Many scientists believed that slower factors, such as massive volcanic eruptions or gradual climate change, were responsible. But in the early 1990s, researchers identified an enormous crater, around 180 kilometres wide, buried beneath the Yucatán Peninsula in Mexico. Its age was identical to that of the clay layer. The discovery reinforced the asteroid theory, and today the majority of scientists accept it, although volcanoes may also have played a role.

    Accurate computer models show what probably happened. The asteroid, about ten kilometres across, struck with the force of billions of atomic bombs. Fires spread across continents, and a vast cloud of dust and soot blocked the sunlight for months or even years. Plants died, and the animals that ate them starved.

    Yet this disaster created an opportunity. Small mammals, which could regulate their body temperature and survive on little food, lived through the catastrophe. With the dinosaurs gone, they multiplied and evolved into a huge variety of forms — from whales to bats to primates. Genetic studies of the genomes of modern mammals show that many groups appeared soon after the impact. Without the asteroid, humans and our intellectual achievements might never have existed. And not all dinosaurs vanished: their feathered offspring are still with us today. We call them birds.
  ru: |
    Более 160 миллионов лет на Земле господствовали динозавры. Одни были гигантскими травоядными, поедавшими листья высоких деревьев, другие — свирепыми хищниками. А затем, около 66 миллионов лет назад, они внезапно исчезли вместе с примерно тремя четвертями всех видов на планете. Что произошло?

    В 1980 году отец и сын — физик Луис Альварес и геолог Уолтер Альварес — предложили драматический ответ. Они проанализировали тонкий слой глины, обнаруженный в породах этого возраста по всему миру. Он содержал необычно много иридия — металла, редкого на Земле, но распространённого в астероидах. Их вывод: в планету врезался огромный астероид.

    Сначала теория вызвала бурную полемику. Многие учёные считали, что виноваты более медленные факторы — например, мощные извержения вулканов или постепенное изменение климата. Но в начале 1990-х исследователи обнаружили огромный кратер шириной около 180 километров, погребённый под полуостровом Юкатан в Мексике. Его возраст совпал с возрастом глиняного слоя. Открытие подкрепило теорию астероида, и сегодня большинство учёных её принимает, хотя вулканы, возможно, тоже сыграли свою роль.

    Точные компьютерные модели показывают, что, вероятно, произошло. Астероид диаметром около десяти километров ударил с силой миллиардов атомных бомб. По континентам распространились пожары, а огромное облако пыли и сажи на месяцы или даже годы закрыло солнечный свет. Растения погибли, а животные, питавшиеся ими, умерли от голода.

    И всё же эта катастрофа открыла новые возможности. Мелкие млекопитающие, способные регулировать температуру тела и выживать на скудной пище, пережили бедствие. Когда динозавров не стало, они размножились и эволюционировали в огромное разнообразие форм — от китов до летучих мышей и приматов. Генетические исследования геномов современных млекопитающих показывают, что многие группы появились вскоре после удара. Без астероида люди и наши интеллектуальные достижения, возможно, никогда бы не появились. А динозавры исчезли не все: их пернатые потомки по-прежнему с нами. Мы называем их птицами.
  questions:
  - q: What did the Alvarez team find in the clay layer?
    options:
    - Dinosaur bones
    - High levels of iridium
    - Volcanic ash only
    - Water
    answer: 1
  - q: Where was the crater found?
    options:
    - In Africa
    - Under the Yucatán Peninsula in Mexico
    - In the Pacific Ocean
    - In Siberia
    answer: 1
  - q: Why did small mammals survive?
    options:
    - They hid in water
    - They could regulate body temperature and survive on little food
    - They were very large
    - They ate dinosaurs
    answer: 1
  - tf: The asteroid theory was accepted immediately by all scientists.
    answer: false
  - tf: Birds are descendants of dinosaurs.
    answer: true
