title: Body and health
title_ru: Тело и здоровье
topic: body
words:
- adrenaline | n | əˈdrenəlɪn | əˈdrenələn | адреналин | a hormone produced when you are excited or afraid | Skydiving gives you a rush of *adrenaline*. | Прыжок с парашютом даёт выброс адреналина.
- cancerous | adj | ˈkænsərəs |  | раковый, злокачественный | affected by cancer | The doctors removed the *cancerous* cells. | Врачи удалили раковые клетки.
- chromosome | n | ˈkrəʊməsəʊm | ˈkroʊməsoʊm | хромосома | a part of a cell containing genes | Humans have 46 *chromosomes*. | У человека 46 хромосом.
- grin | v | ɡrɪn |  | широко улыбаться, ухмыляться | to smile widely | He *grinned* when he saw the finished kitchen. | Он расплылся в улыбке, увидев готовую кухню.
- hibernate | v | ˈhaɪbəneɪt | ˈhaɪbərneɪt | впадать в спячку | to sleep through winter | Bears *hibernate* in winter. | Медведи впадают в зимнюю спячку.
- infect | v | ɪnˈfekt |  | заражать | to give someone a disease | The wound became *infected*. | Рана воспалилась. | infection — инфекция
- muscular | adj | ˈmʌskjələ | ˈmʌskjələr | мускулистый; мышечный | having strong muscles; connected with muscles | He had *muscular* legs from walking in the mountains. | От ходьбы по горам у него были мускулистые ноги.
- nausea | n | ˈnɔːziə |  | тошнота | the feeling that you are going to vomit | Many soldiers suffered from seasickness and *nausea*. | Многие солдаты страдали от морской болезни и тошноты.
- neuron | n | ˈnjuːrɒn | ˈnʊrɑːn | нейрон | a nerve cell | The brain has billions of *neurons*. | В мозге миллиарды нейронов.
- numb | adj | nʌm |  | онемевший; оцепеневший | unable to feel anything | My fingers were *numb* with cold. | Пальцы онемели от холода. | b не читается
- optic | adj | ˈɒptɪk | ˈɑːptɪk | оптический, зрительный | connected with the eyes or light | The *optic* nerve connects the eye to the brain. | Зрительный нерв соединяет глаз с мозгом. | optical — оптический
- revive | v | rɪˈvaɪv | riːˈvaɪv | оживлять, приводить в чувство | to bring back to life or use | Doctors *revived* the patient. | Врачи привели пациента в чувство.
- saliva | n | səˈlaɪvə |  | слюна | the liquid in your mouth | *Saliva* helps you swallow food. | Слюна помогает глотать пищу.
- shrug | v | ʃrʌɡ |  | пожимать плечами | to raise your shoulders to show you don't know | He just *shrugged*. | Он только пожал плечами.
- skeletal | adj | ˈskelətl |  | скелетный | connected with the skeleton | They found *skeletal* remains of workers. | Они нашли скелетные останки рабочих.
- snooze | v | snuːz |  | дремать (разг.) | to sleep lightly | Grandpa is *snoozing* in his chair. | Дедушка дремлет в кресле. | snooze button — кнопка «отложить» на будильнике
- symptomatic | adj | ˌsɪmptəˈmætɪk |  | симптоматичный | being a sign of something | The problem is *symptomatic* of bad management. | Эта проблема — признак плохого управления.
- traumatic | adj | trɔːˈmætɪk |  | травмирующий | very shocking and upsetting | It was a *traumatic* experience. | Это было травмирующее событие.
- twitch | v | twɪtʃ |  | дёргаться | to move suddenly | His eye *twitched*. | У него дёрнулся глаз.
