title: Numbers and quantity
title_ru: Числа и количество
topic: numbers
words:
- acre | n | ˈeɪkə | ˈeɪkər | акр (≈ 0,4 га) | a unit for measuring land, about 4,000 square metres | The farm covers two hundred *acres*. | Ферма занимает двести акров.
- array | n | əˈreɪ |  | множество, массив, набор | a large group of different things | The shop sells a wide *array* of cheeses. | Магазин продаёт огромный выбор сыров.
- chunk | n | tʃʌŋk |  | кусок, ломоть; значительная часть | a thick piece; a large part | We spend a large *chunk* of our lives asleep. | Значительную часть жизни мы проводим во сне.
- cluster | n | ˈklʌstə | ˈklʌstər | гроздь, скопление | a group of similar things close together | Coffee cherries grow in *clusters* along the branches. | Кофейные ягоды растут гроздьями вдоль веток.
- 'dual | adj | ˈdjuːəl | ˈduːəl | двойной | having two parts or purposes | The trip had a *dual* purpose: science and fame. | Поездка преследовала двойную цель: науку и славу.'
- multitude | n | ˈmʌltɪtjuːd | ˈmʌltɪtuːd | множество | a very large number | There are a *multitude* of reasons for the decision. | У этого решения множество причин.
- peak | n | piːk |  | вершина, пик | the pointed top of a mountain; the highest point | We reached the *peak* at noon. | Мы добрались до вершины в полдень.
- ratio | n | ˈreɪʃiəʊ | ˈreɪʃioʊ | соотношение | the relationship between two amounts | The *ratio* of students to teachers is 20 to 1. | Соотношение учеников и учителей — 20 к 1.
