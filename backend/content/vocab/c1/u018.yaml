title: Time and dates
title_ru: Время и даты
topic: time
words:
- antiquity | n | ænˈtɪkwɪti | ænˈtɪkwəti | древность, античность | ancient times | The statue dates from *antiquity*. | Статуя относится к античности.
- dawn | n | dɔːn |  | рассвет | the time when the sun rises | We left at *dawn*. | Мы отправились на рассвете.
- demise | n | dɪˈmaɪz |  | кончина; крах | death; the end of something | This led to the *demise* of the company. | Это привело к краху компании.
- fertility | n | fɜːˈtɪlɪti | fərˈtɪləti | плодородие; рождаемость | the ability to produce crops or children | The soil's *fertility* is high. | Почва очень плодородна.
- meantime | n | ˈmiːntaɪm |  | тем временем | the time between two events | The ship will arrive tomorrow. In the *meantime*, we wait. | Корабль придёт завтра. А пока мы ждём.
- medieval | adj | ˌmediˈiːvl | ˌmiːdiˈiːvl | средневековый | from the Middle Ages (about 500–1500) | Weaving was organized by *medieval* guilds. | Ткачество было организовано средневековыми гильдиями.
- outset | n | ˈaʊtset |  | начало | the start | I told you at the *outset*. | Я говорил тебе с самого начала.
- "periodic | adj | ˌpɪrɪˈ\x01ːdɪk | ˌpɪriːˈɑːdɪk | периодический | happening regularly | Do *periodic* checks of your car. | Регулярно проверяйте машину."
- presently | adv | ˈprezntli |  | вскоре; в настоящее время | soon; now (US) | He will be here *presently*. | Он вскоре будет здесь.
- presidency | n | ˈprezɪdənsi | ˈprezədənsi | президентство | the time someone is president | During his *presidency*, taxes rose. | За время его президентства налоги выросли.
- reconstruction | n | ˌriːkənˈstrʌkʃən |  | восстановление, реконструкция | rebuilding | The *reconstruction* of the bridge took two years. | Реконструкция моста заняла два года.
- reign | n | reɪn |  | правление, царствование | the period when a king or queen rules | The Colosseum was finished during the *reign* of Titus. | Колизей был достроен в правление Тита. | g не читается
- renaissance | n | rɪˈneɪsns | ˈrenəsɑːns | Возрождение, Ренессанс | the period in Europe (14th–16th centuries) of new interest in art and science; a revival | Florence was the centre of the Italian *Renaissance*. | Флоренция была центром итальянского Возрождения.
- restoration | n | ˌrestəˈreɪʃən |  | реставрация, восстановление | repairing to the original state | The castle is under *restoration*. | Замок на реставрации.
- seldom | adv | ˈseldəm |  | редко | not often | We *seldom* go out on weekdays. | Мы редко выходим куда-нибудь по будним дням.
- tenure | n | ˈtenjə | ˈtenjər | срок пребывания (в должности) | the time you hold a job | During her *tenure* as head, the school improved. | Пока она была директором, школа стала лучше.
- threshold | n | ˈθreʃəʊld | ˈθreʃoʊld | порог | the entrance; a level at which something changes | He has a low pain *threshold*. | У него низкий болевой порог.
- velocity | n | vəˈlɒsɪti | vəˈlɑːsəti | скорость | speed in a direction | The bullet travels at high *velocity*. | Пуля летит с огромной скоростью.
