title: Character and personality
title_ru: Характер и личность
topic: feelings
words:
- aimless | adj | ˈeɪmləs |  | бесцельный | without purpose | He spent the day in *aimless* wandering. | Он провёл день, бесцельно бродя.
- dignity | n | ˈdɪɡnəti |  | достоинство | a feeling of being respected and valued | Everyone deserves to be treated with *dignity*. | Каждый заслуживает достойного обращения.
- docile | adj | ˈdəʊsaɪl | ˈdɑːsl | покорный, послушный | quiet and easy to control | The horse is very *docile*. | Лошадь очень смирная.
- dutiful | adj | ˈdjuːtɪfl | ˈduːtiːfl | послушный, исполненный долга | doing what is expected | She was a *dutiful* daughter. | Она была примерной дочерью.
- ego | n | ˈiːɡəʊ | ˈiːɡoʊ | эго, самолюбие | a person's sense of their own importance | The project reflected the emperor's huge *ego*. | Проект отражал огромное самомнение императора.
- enterprising | adj | ˈentəpraɪzɪŋ | ˈenərpraɪzɪŋ | предприимчивый | full of new ideas | An *enterprising* student started a business. | Предприимчивый студент открыл своё дело.
- grief | n | ɡriːf |  | горе, скорбь | great sadness, especially after a death | She was overcome with *grief*. | Её охватило горе. | grieve — горевать
- gutsy | adj | ˈɡʌtsi | ˈɡʌtˈsiː | смелый, решительный (разг.) | brave | It was a *gutsy* performance. | Это было смелое выступление.
- harassment | n | həˈræsmənt |  | преследование, домогательство | repeated unpleasant behaviour | Workplace *harassment* is illegal. | Притеснения на работе незаконны.
- headstrong | adj | ˈhedstrɒŋ | ˈhedstrɔːŋ | своевольный, упрямый | determined to do what you want | She was a *headstrong* child. | Она была своенравным ребёнком.
- impersonal | adj | ɪmˈpɜːsənl | ɪmˈpɜːrsənl | безличный, обезличенный | not friendly or human; without personal feelings | Zoos can feel cold and *impersonal*. | Зоопарки бывают холодными и бездушными.
- impervious | adj | ɪmˈpɜːvɪəs | ˌɪmˈpɜːrviəs | невосприимчивый, непроницаемый | not affected by | He seems *impervious* to criticism. | Похоже, критика его не трогает.
- industrious | adj | ɪnˈdʌstriəs |  | трудолюбивый | working hard | They were an *industrious* team. | Это была трудолюбивая команда. | не «промышленный» (это industrial)
- neglectful | adj | nɪˈɡlektfl |  | небрежный, невнимательный | not giving enough care | They were *neglectful* parents. | Они были невнимательными родителями.
- resignation | n | rɪzɪɡˈneɪʃən | ˌrezəɡˈneɪʃən | отставка; смирение | leaving a job; accepting something bad | She handed in her *resignation*. | Она подала заявление об уходе.
- sentiment | n | ˈsentɪmənt | ˈsenəmənt | чувство, настроение | a feeling or opinion | I share your *sentiment*. | Я разделяю ваши чувства.
- tactful | adj | ˈtæktfl |  | тактичный | careful not to upset people | She gave a *tactful* answer. | Она тактично ответила.
- temperamental | adj | ˌtemprəˈmentl | ˌtempərˈmentl | вспыльчивый; капризный | having changing moods | The old car is *temperamental*. | Старая машина капризничает.
- torture | n | ˈtɔːtʃə | ˈtɔːrtʃər | пытка, мучение | causing great pain to someone on purpose | Waiting for the results was pure *torture*. | Ждать результатов было настоящей пыткой.
- voracious | adj | vɔːˈreɪʃəs |  | ненасытный, жадный | wanting a lot | She's a *voracious* reader. | Она запойная читательница.
- wry | adj | raɪ |  | кривой (об усмешке), ироничный | showing dry humour | He gave a *wry* smile. | Он криво усмехнулся.
