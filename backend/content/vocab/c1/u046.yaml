title: Character and personality
title_ru: Характер и личность
topic: feelings
words:
- bizarre | adj | bɪˈzɑː | bɪˈzɑːr | странный, причудливый | very strange and unusual | It looks like a *bizarre* little bear. | Оно похоже на причудливого маленького медведя.
- competent | adj | ˈkɒmpɪtənt | ˈkɑːmpɪtənt | компетентный, умелый | having enough skill to do something well | He's a *competent* driver, but not a great one. | Он вполне умелый водитель, но не выдающийся.
- decisive | adj | dɪˈsaɪsɪv |  | решающий; решительный | very important for the result; able to decide quickly | Weather is a *decisive* factor in migration. | Погода — решающий фактор миграции.
- dumb | adj | dʌm |  | немой; глупый (разг.) | unable to speak; stupid (informal) | The audience was struck *dumb* by the spectacle. | Зрители онемели от зрелища. | b не читается
- fierce | adj | fɪəs | fɪrs | свирепый, яростный | angry and ready to attack; very strong | The house was guarded by a *fierce* dog. | Дом охраняла свирепая собака.
- hardy | adj | ˈhɑːdi | ˈhɑːrdi | выносливый | strong and able to survive difficult conditions | Only *hardy* plants grow in the Arctic. | В Арктике растут только выносливые растения.
- harsh | adj | hɑːʃ | hɑːrʃ | суровый, жёсткий | very difficult or unkind; very cold | They survived a *harsh* winter. | Они пережили суровую зиму.
- inclusive | adj | ɪnˈkluːsɪv |  | инклюзивный, включающий всех | including everyone | The school tries to be *inclusive*. | Школа старается быть открытой для всех.
- persistent | adj | pəˈsɪstənt | pərˈsɪstənt | настойчивый; устойчивый | continuing for a long time; refusing to give up | There were *persistent* problems with the tiles. | С теплозащитной плиткой постоянно были проблемы.
- sober | adj | ˈsəʊbə | ˈsoʊbər | трезвый; серьёзный | not drunk; serious and sensible | The rescue team gave a *sober* assessment of the situation. | Спасатели дали трезвую оценку ситуации.
- vocal | adj | ˈvəʊkl | ˈvoʊkl | открыто высказывающийся; голосовой | expressing opinions strongly and publicly | She has been a *vocal* supporter of equal rights. | Она открыто выступает за равные права.
