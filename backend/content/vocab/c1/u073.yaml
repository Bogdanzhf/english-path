title: Society and politics
title_ru: Общество и политика
topic: society
words:
- abolish | v | əˈbɒlɪʃ | əˈbɑːlɪʃ | отменять, упразднять | to officially end a law or system | Slavery was *abolished* in Britain in 1833. | Рабство в Британии отменили в 1833 году.
- collaborate | v | kəˈlæbəreɪt |  | сотрудничать | to work together with someone | Scientists from many countries *collaborated* on the project. | Над проектом сотрудничали учёные из многих стран.
- compel | v | kəmˈpel |  | вынуждать, заставлять | to force someone to do something | Illness *compelled* him to stop performing. | Болезнь вынудила его прекратить выступления.
- elevate | v | ˈelɪveɪt | ˈeləveɪt | поднимать, возвышать | to raise | *Elevate* your leg to reduce swelling. | Приподнимите ногу, чтобы уменьшить отёк.
- empower | v | ɪmˈpaʊə | ɪmˈpaʊər | наделять полномочиями, расширять возможности | to give power or confidence | Education *empowers* women. | Образование расширяет возможности женщин.
- enact | v | ɪˈnækt |  | вводить в действие (закон) | to make something into a law | The new law was *enacted* in 1853. | Новый закон был принят в 1853 году.
- entitle | v | ɪnˈtaɪtl |  | давать право; озаглавливать | to give someone the right to do or have something | The ticket *entitles* you to free entry for a week. | Билет даёт право на бесплатный вход в течение недели.
- expedite | v | ˈekspədaɪt | ˈekspɪdaɪt | ускорять | to make happen faster | We'll *expedite* your order. | Мы ускорим ваш заказ.
- expel | v | ɪkˈspel |  | исключать, выгонять | to force someone to leave a school, organization or country | He was *expelled* from school for fighting. | Его исключили из школы за драку.
- 'fiddle | v | ˈfɪdl |  | вертеть в руках; мухлевать | to touch nervously; to cheat | Stop *fiddling* with your phone! | Перестань крутить телефон! | сущ.: fiddle — скрипка (разг.)'
- impede | v | ɪmˈpiːd | ˌɪmˈpiːd | препятствовать | to slow down | Bad weather *impeded* the rescue. | Плохая погода мешала спасательной операции.
- oblige | v | əˈblaɪdʒ |  | обязывать | to force someone to do something by law or duty | The law *obliges* drivers to stop after an accident. | Закон обязывает водителей останавливаться после аварии. | be obliged to — быть обязанным
- obstruct | v | əbˈstrʌkt |  | загораживать, препятствовать | to block a road or path; to stop something from happening | A fallen tree *obstructed* the road. | Упавшее дерево перегородило дорогу.
- oversee | v | ˌəʊvəˈsiː | ˌoʊvərˈsiː | контролировать, руководить | to watch and manage work | A head chef *oversees* the kitchen. | Шеф-повар руководит кухней. | oversee — oversaw — overseen
- persecute | v | ˈpɜːsɪkjuːt | ˈpɜːrsɪkjuːt | преследовать (за убеждения) | to treat cruelly because of religion, race or beliefs | People were *persecuted* for their religion. | Людей преследовали за веру.
- preside | v | prɪˈsaɪd | priːˈzaɪd | председательствовать | to be in charge of a meeting | The judge *presided* over the trial. | Судья вёл процесс.
- restrain | v | rɪˈstreɪn |  | сдерживать | to stop someone doing something, sometimes by force | He tried to *restrain* a yawn. | Он пытался сдержать зевок.
- segregate | v | ˈseɡrɪɡeɪt |  | разделять, изолировать | to keep groups separate | Passengers were *segregated* by class. | Пассажиров разделяли по классам.
- supervise | v | ˈsuːpəvaɪz | ˈsuːpərvaɪz | руководить, наблюдать | to watch over people or work | A professor *supervised* the research. | Исследованием руководил профессор.
reading:
  title: Ashoka the Great
  title_ru: Ашока Великий
  text: |
    Around 268 BC, a young prince named Ashoka came to the throne of the Mauryan Empire, which covered much of what is now India. According to some later accounts, he had fought his brothers for power and was known for his violent temper. He wanted to expand the empire even further.

    In about 261 BC, Ashoka invaded the kingdom of Kalinga, on India's east coast. The war was terrible. Ancient sources describe how a hundred thousand people were killed and many more were taken away from their homes. Ashoka was the victor, but when he walked through the battlefield, he was filled with horror and pity. Instead of celebrating, he began to condemn what he had done.

    What happened next is extraordinary in world history. Ashoka turned to Buddhism and its teachings of non-violence. He gave up wars of conquest and devoted himself to ruling with compassion. He ordered his scribes to carve his new ideas onto huge stone pillars and rocks across the empire, so that everyone could heed them. In these "edicts", he expressed deep regret for the war in Kalinga and asked his people to respect all living creatures.

    Ashoka also put his ideas into practice. He built hospitals for people and animals, planted trees along roads, dug wells and created rest houses for travellers. Rather than favouring one religion, he tried to stay neutral and taught that no one should be persecuted for their beliefs. He believed that tolerance would bring unity to his vast empire of many peoples. Under his rule, commerce flourished, and goods travelled along safe roads to distant lands.

    Some historians warn against seeing Ashoka as a perfect saint; he still ruled with a strong army, and he kept the death penalty. But his reforms showed a new idea of what a ruler could be. Today, the lion symbol from one of his pillars appears on India's national emblem and banknotes — a reminder of an emperor who learned that the greatest victory is over oneself.
  ru: |
    Около 268 года до н. э. на престол империи Маурьев, охватывавшей большую часть нынешней Индии, взошёл молодой царевич Ашока. По некоторым более поздним свидетельствам, он боролся за власть со своими братьями и славился жестоким нравом. Он хотел ещё больше расширить империю.

    Примерно в 261 году до н. э. Ашока вторгся в царство Калинга на восточном побережье Индии. Война была ужасной. Древние источники описывают, как сто тысяч человек были убиты, а ещё больше — угнаны из родных мест. Ашока победил, но, проходя по полю битвы, он был охвачен ужасом и жалостью. Вместо того чтобы праздновать, он начал осуждать содеянное.

    То, что произошло дальше, — исключительный случай в мировой истории. Ашока обратился к буддизму и его учению о ненасилии. Он отказался от захватнических войн и посвятил себя милосердному правлению. Он приказал писцам высекать свои новые идеи на огромных каменных колоннах и скалах по всей империи, чтобы каждый мог им внять. В этих «эдиктах» он выражал глубокое сожаление о войне в Калинге и призывал народ уважать всех живых существ.

    Ашока воплощал свои идеи на практике. Он строил больницы для людей и животных, сажал деревья вдоль дорог, копал колодцы и создавал постоялые дворы для путников. Вместо того чтобы отдавать предпочтение одной религии, он старался сохранять нейтралитет и учил, что никого нельзя преследовать за убеждения. Он верил, что терпимость принесёт единство его огромной империи, населённой многими народами. При нём процветала торговля, а товары шли по безопасным дорогам в далёкие земли.

    Некоторые историки предостерегают от того, чтобы видеть в Ашоке безупречного святого: он по-прежнему правил с сильной армией и сохранил смертную казнь. Но его реформы показали новое представление о том, каким может быть правитель. Сегодня лев с одной из его колонн изображён на государственном гербе и банкнотах Индии — напоминание об императоре, который понял, что величайшая победа — победа над собой.
  questions:
  - q: What happened after the war in Kalinga?
    options:
    - Ashoka celebrated
    - Ashoka was filled with horror and regret
    - Ashoka lost the war
    - Ashoka invaded another kingdom
    answer: 1
  - q: How did Ashoka spread his ideas?
    options:
    - Through books
    - By carving them on stone pillars and rocks
    - Through his army
    - Through songs
    answer: 1
  - q: What was Ashoka's attitude to religion?
    options:
    - He banned all religions except Buddhism
    - He tried to stay neutral and opposed persecution
    - He didn't care about religion
    - He forced people to convert
    answer: 1
  - tf: Some historians say Ashoka was a perfect saint.
    answer: false
  - tf: A symbol from Ashoka's pillar appears on India's national emblem.
    answer: true
