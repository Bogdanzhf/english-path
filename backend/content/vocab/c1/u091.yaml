title: 'Describing: time and age'
title_ru: 'Описание: время, новизна, возраст'
topic: describing
words:
- antiquated | adj | ˈæntɪkweɪtɪd | ˈæntəkweɪtɪd | устаревший | very old-fashioned | The system is *antiquated*. | Система устарела.
- archaic | adj | ɑːˈkeɪɪk | ɑːrˈkeɪɪk | архаичный, устаревший | very old and no longer used | The law uses *archaic* language. | В законе используется архаичный язык.
- ceaseless | adj | ˈsiːsləs | ˈsiːslɪs | непрестанный | never stopping | I'm tired of the *ceaseless* noise. | Я устал от непрекращающегося шума.
- commonplace | adj | ˈkɒmənpleɪs | ˈkɑːmənpleɪs | обыденный, обычный | happening often; ordinary | Violence was *commonplace* in ancient Rome. | Насилие было обыденным делом в Древнем Риме.
- consecutive | adj | kənˈsekjətɪv |  | последовательный, подряд | following one after another | It rained for five *consecutive* days. | Дождь шёл пять дней подряд.
- customary | adj | ˈkʌstəməri | ˈkʌstəmeri | обычный, принятый | usual; traditional | It's *customary* to tip in restaurants. | В ресторанах принято оставлять чаевые.
- eventual | adj | ɪˈventʃuəl |  | конечный, окончательный | happening at the end of a process | The *eventual* winner was a 15-year-old girl. | В итоге победила пятнадцатилетняя девочка. | eventually — в конце концов
- forthcoming | adj | ˌfɔːθˈkʌmɪŋ | ˌfɔːrθˈkʌmɪŋ | предстоящий; отзывчивый | happening soon; willing to give information | Details of the *forthcoming* changes will be sent to tenants. | Подробности предстоящих изменений будут разосланы жильцам.
- habitual | adj | həˈbɪtʃuəl |  | привычный, обычный | done as a habit; usual | He's a *habitual* liar. | Он закоренелый лжец.
- imminent | adj | ˈɪmɪnənt | ˈɪmənənt | неминуемый, надвигающийся | about to happen | A storm is *imminent*. | Надвигается буря.
- impending | adj | ɪmˈpendɪŋ |  | надвигающийся, грозящий | about to happen (usually something bad) | They were unaware of the *impending* danger. | Они не знали о надвигающейся опасности.
- interim | adj | ˈɪntərɪm | ˈɪnərəm | временный, промежуточный | temporary | He's the *interim* director. | Он временно исполняющий обязанности директора.
- interior | n | ɪnˈtɪəriə | ɪnˈtɪriər | интерьер, внутренняя часть | the inside of something | The *interior* of the church is beautiful. | Внутри церковь прекрасна.
- latent | adj | ˈleɪtənt |  | скрытый | existing but not yet developed | She has *latent* talent. | У неё скрытый талант.
- lengthy | adj | ˈleŋθi |  | длительный, пространный | long | There was a *lengthy* delay. | Была длительная задержка.
- preliminary | adj | prɪˈlɪmɪnəri | prɪˈlɪmɪneri | предварительный | coming before the main part | The *preliminary* results were encouraging. | Предварительные результаты были обнадёживающими.
- premature | adj | ˈpremətʃə | ˌpriːməˈtʃʊr | преждевременный | happening too early | It's *premature* to blame anyone. | Обвинять кого-либо преждевременно.
- prospective | adj | prəˈspektɪv |  | будущий, потенциальный | likely to become | We met *prospective* buyers. | Мы встретились с потенциальными покупателями.
- reverse | v | rɪˈvɜːs | rɪˈvɜːrs | обращать вспять, отменять; давать задний ход | to change something to the opposite; to go backwards | The council *reversed* its decision. | Совет отменил своё решение.
- upcoming | adj | ˈʌpkʌmɪŋ |  | предстоящий | happening soon | Prepare for the *upcoming* harvest. | Готовьтесь к предстоящему урожаю.
