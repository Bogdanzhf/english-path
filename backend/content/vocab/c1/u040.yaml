title: Arts and media
title_ru: Искусство и медиа
topic: arts
words:
- abstract art | n | ˈæbstrækt ɑːt | ˈæbstrækt ɑːrt | абстрактное искусство | art without realistic images | I don't understand *abstract art*. | Я не понимаю абстрактное искусство.
- aesthetics | n | iːsˈθetɪks | esˈθetɪks | эстетика | the study of beauty | The *aesthetics* of the building are impressive. | Эстетика здания впечатляет.
- amateur | n | ˈæmətə | ˈæmətər | любитель | a person who does something for pleasure, not as a job | The island was first studied by *amateurs*. | Сначала остров изучали любители. | прил. amateur — любительский
- art form | n | ɑːt fɔːm | ɑːrt fɔːrm | вид искусства | a type of art | Film is a modern *art form*. | Кино — современный вид искусства.
- artistic expression | n | ɑːˈtɪstɪk ɪkˈspreʃən | ɑːrˈtɪstɪk ɪksˈpreʃən | художественное самовыражение | showing ideas through art | Dance is a form of *artistic expression*. | Танец — форма художественного самовыражения.
- billiards | n | ˈbɪlɪədz | ˈbɪljərdz | бильярд | a game with balls and a cue | We played *billiards*. | Мы играли в бильярд.
- brand loyalty | n | brænd ˈlɔɪəlti |  | приверженность бренду | always buying the same brand | Apple has strong *brand loyalty*. | У Apple очень преданные покупатели.
- connoisseur | n | ˌkɒnəˈsɜː | ˌkɑːnəˈsɜːr | знаток, ценитель | an expert in art, food or wine | He's a wine *connoisseur*. | Он знаток вин.
- consumer culture | n | kənˈsuːmə ˈkʌltʃə | kənˈsuːmər ˈkʌltʃər | культура потребления | a society focused on buying | *Consumer culture* encourages waste. | Культура потребления поощряет расточительство.
- contemporary art | n | kənˈtempərəri ɑːt | kənˈtempəreri ɑːrt | современное искусство | art of the present time | The gallery shows *contemporary art*. | В галерее представлено современное искусство.
- cultural value | n | ˈkʌltʃərəl ˈvæljuː |  | культурная ценность | importance to a culture | The building has great *cultural value*. | Здание имеет большую культурную ценность.
- doping | n | ˈdəʊpɪŋ | dˈəʊpɪŋ | допинг | using drugs to improve sports performance | The athlete was banned for *doping*. | Спортсмена дисквалифицировали за допинг.
- fake news | n | feɪk njuːz |  | фейковые новости | false stories presented as news | *Fake news* spreads fast online. | Фейки быстро распространяются в сети.
- figurative art | n | ˈfɪɡjʊreɪtɪv ɑːt | ˈfɪɡjərətɪv ɑːrt | фигуративное искусство | art showing real objects | He prefers *figurative art*. | Он предпочитает фигуративное искусство.
- focal point | n | ˈfəʊkl pɔɪnt | ˈfoʊkl pɔɪnt | центр внимания | the centre of interest | The fireplace is the *focal point* of the room. | Камин — центр композиции комнаты.
- freedom of the press | n | ˈfriːdəm əv ðə pres |  | свобода печати | the right to publish news freely | *Freedom of the press* is vital in a democracy. | Свобода печати необходима демократии.
- funding for the arts | n | ˈfʌndɪŋ fə ðə ɑːts | ˈfʌndɪŋ fər ðə ɑːrts | финансирование искусства | money given to support art | *Funding for the arts* has been cut. | Финансирование искусства урезали.
- heritage site | n | ˈherɪtɪdʒ saɪt | ˈherətədʒ saɪt | объект наследия | a place of historical importance | The old town is a World *Heritage Site*. | Старый город — объект Всемирного наследия.
- impressionism | n | ɪmˈpreʃənɪzəm | ˌɪmˈpreʃənɪzəm | импрессионизм | a style of painting from the 19th century | Monet is famous for *impressionism*. | Моне знаменит как импрессионист.
- mass media | n | mæs ˈmiːdiːə | mæs ˈmiːdiə | средства массовой информации | TV, radio, newspapers, etc. | The *mass media* shape public opinion. | СМИ формируют общественное мнение.
- physical activity | n | ˈfɪzɪkl ækˈtɪvɪti | ˈfɪzɪkl ækˈtɪvəti | физическая активность | exercise | Children need daily *physical activity*. | Детям нужна ежедневная физическая активность.
- product placement | n | ˈprɒdʌkt ˈpleɪsmənt | ˈprɑːdəkt ˈpleɪsmənt | скрытая реклама, продакт-плейсмент | showing brands in films | The film is full of *product placement*. | В фильме полно скрытой рекламы.
- propaganda | n | ˌprɒpəˈɡændə | ˌprɑːpəˈɡændə | пропаганда | biased information to influence people | The film is pure *propaganda*. | Фильм — чистая пропаганда.
- sensationalism | n | senˈseɪʃənəlɪzəm |  | сенсационность | exaggerating news to shock | The paper is known for *sensationalism*. | Газета известна погоней за сенсациями.
- trio | n | ˈtriːəʊ | ˈtriːoʊ | трио | a group of three | A jazz *trio* played at the bar. | В баре играло джазовое трио.
