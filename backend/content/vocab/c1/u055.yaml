title: Communication and language
title_ru: Общение и язык
topic: communication
words:
- assertion | n | əˈsɜːʃən | əˈsɜːrʃən | утверждение | a confident statement | I disagree with his *assertion*. | Я не согласен с его утверждением.
- chronicle | n | ˈkrɒnɪkl | ˈkrɑːnɪkl | хроника, летопись | a written record of events in the order they happened | The *chronicle* describes a plague of snakes in 1520. | Летопись описывает нашествие змей в 1520 году.
- citation | n | saɪˈteɪʃən |  | цитата, ссылка | a reference to a source | Add a *citation* for each quote. | Укажите источник для каждой цитаты.
- contention | n | kənˈtenʃən |  | утверждение; разногласие | an opinion; disagreement | It's my *contention* that he's wrong. | Я утверждаю, что он неправ. | bone of contention — яблоко раздора
- correspondence | n | ˌkɒrɪˈspɒndəns | ˌkɔːrəˈspɑːndəns | переписка; соответствие | letters; matching | She keeps all her *correspondence*. | Она хранит всю переписку.
- critique | n | krɪˈtiːk |  | критический разбор, критика | a careful written analysis | She wrote a sharp *critique* of army hospitals. | Она написала резкий критический разбор армейских госпиталей.
- deception | n | dɪˈsepʃn |  | обман | the act of making someone believe something false | The whole show was based on *deception*. | Всё представление было построено на обмане.
- directive | n | daɪˈrektɪv |  | директива | an official order | The EU issued a new *directive*. | ЕС выпустил новую директиву.
- endorsement | n | ɪnˈdɔːsmənt | enˈdɔːrsmənt | одобрение, поддержка; реклама | public support | The product has a celebrity *endorsement*. | Товар рекламирует знаменитость.
- hypocrisy | n | hɪˈpɒkrəsi | hɪˈpɑːkrəsi | лицемерие | pretending to have beliefs you don't | I hate *hypocrisy*. | Ненавижу лицемерие.
- irony | n | ˈaɪrəni |  | ирония | when the opposite of what you expect happens | The *irony* is that he hates water but became a sailor. | Ирония в том, что он ненавидит воду, но стал моряком.
- memo | n | ˈmeməʊ | ˈmemoʊ | служебная записка | a short office message | I sent a *memo* to all staff. | Я разослал служебную записку всем сотрудникам.
- newsletter | n | ˈnjuːzletə | ˈnuːzletər | информационный бюллетень, рассылка | a regular report sent to members | Sign up for our *newsletter*. | Подпишитесь на нашу рассылку.
- 'premise | n | ˈpremɪs |  | предпосылка, исходное положение | an idea on which a theory or argument is based | The film''s *premise* is simple: a man wakes up with no memory. | Завязка фильма проста: человек просыпается без памяти.'
- proposition | n | ˌprɒpəˈzɪʃən | ˌprɑːpəˈzɪʃən | предложение; утверждение | a suggestion; a statement | That's an interesting *proposition*. | Это интересное предложение.
- sarcasm | n | ˈsɑːkæzəm | ˈsɑːrkæzəm | сарказм | saying the opposite to mock | I could hear the *sarcasm* in his voice. | Я услышал сарказм в его голосе.
- specification | n | ˌspesɪfɪˈkeɪʃən |  | спецификация, техническое описание | a detailed description | Check the technical *specifications*. | Проверьте технические характеристики.
- spectacle | n | ˈspektəkl |  | зрелище | an amazing or impressive sight | The fireworks were a wonderful *spectacle*. | Фейерверк был чудесным зрелищем. | spectacles — очки (устар.)
- theorem | n | ˈθiərəm | ˈθɪrəm | теорема | a statement proved in maths | Pythagoras' *theorem* is famous. | Теорема Пифагора знаменита.
- transcript | n | ˈtrænskrɪpt |  | расшифровка, стенограмма; выписка оценок | a written record of speech | Read the *transcript* of the interview. | Прочитайте расшифровку интервью.
