title: Feelings and character
title_ru: Чувства и характер
topic: feelings
words:
- fiery | adj | ˈfaɪəri |  | огненный, пылкий | like fire; full of strong emotion | The sky turned a *fiery* red at sunset. | На закате небо стало огненно-красным. | a fiery temper — вспыльчивый характер
- hostile | adj | ˈhɒstaɪl | ˈhɑːstl | враждебный; неблагоприятный | unfriendly; difficult to live in | The desert is a *hostile* environment. | Пустыня — суровая среда для жизни.
- solemn | adj | ˈsɒləm | ˈsɑːləm | торжественный, серьёзный | very serious and formal | They made a *solemn* promise. | Они дали торжественное обещание. | n не читается
- tender | adj | ˈtendə | ˈtendər | нежный, мягкий | soft and easy to cut (food); gentle and loving | The meat was very *tender*. | Мясо было очень нежным.
- timid | adj | ˈtɪmɪd |  | робкий | shy and nervous | He was too *timid* to speak to her. | Он был слишком робок, чтобы заговорить с ней.
- worship | v | ˈwɜːʃɪp | ˈwɜːrʃɪp | поклоняться; обожать | to show respect and love for a god; to love someone very much | The ancient Greeks *worshipped* many gods. | Древние греки поклонялись многим богам.
