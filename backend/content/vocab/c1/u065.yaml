title: Communication and language
title_ru: Общение и язык
topic: communication
words:
- condemn | v | kənˈdem |  | осуждать; приговаривать | to say strongly that something is wrong | The world *condemned* the attack. | Мир осудил нападение. | n на конце не читается
- disclose | v | dɪsˈkləʊz | dɪsˈkloʊz | раскрывать, разглашать | to make secret information known | The company refused to *disclose* its profits. | Компания отказалась раскрыть свою прибыль.
- disrupt | v | dɪsˈrʌpt |  | нарушать, срывать | to stop something from continuing normally | The strike *disrupted* train services. | Забастовка нарушила движение поездов.
- hail | n | heɪl |  | град | small balls of ice that fall like rain | The *hail* damaged the cars. | Град повредил машины.
- insult | v | ɪnˈsʌlt |  | оскорблять | to say or do something rude to someone | He *insulted* the waiter and was asked to leave. | Он оскорбил официанта, и его попросили уйти. | сущ. insult [ˈɪnsʌlt] — оскорбление
- manifest | v | ˈmænɪfest |  | проявляться | to show itself clearly | The disease *manifests* itself as a high fever. | Болезнь проявляется высокой температурой.
- notify | v | ˈnəʊtɪfaɪ | ˈnoʊtɪfaɪ | уведомлять | to tell someone officially | Passengers were *notified* of the delay. | Пассажиров уведомили о задержке.
- plead | v | pliːd |  | умолять; заявлять (в суде) | to ask for something in an emotional way | She *pleaded* with the teacher to forgive her. | Она умоляла учителя простить её. | plead guilty — признать вину
- pledge | v | pledʒ |  | обещать, давать обязательство | to make a serious promise | Rich countries *pledged* millions of dollars. | Богатые страны пообещали миллионы долларов. | сущ. pledge — обязательство
- portray | v | pɔːˈtreɪ | pɔːrˈtreɪ | изображать | to show someone in a painting, film or book | The film *portrays* him as a hero. | В фильме он изображён героем.
- preach | v | priːtʃ |  | проповедовать; поучать | to talk about religion; to give moral advice | Practise what you *preach*! | Делай то, к чему призываешь других!
- probe | v | prəʊb | proʊb | исследовать, зондировать | to examine closely | Researchers *probed* the reasons for their long lives. | Исследователи изучали причины их долголетия.
- testify | v | ˈtestɪfaɪ |  | давать показания | to give evidence in court | Several witnesses *testified* at the inquiry. | На расследовании дали показания несколько свидетелей.
