title: Society and politics
title_ru: Общество и политика
topic: society
words:
- anti-globalisation movement | n |  |  | антиглобалистское движение | a movement against globalisation | The *anti-globalisation movement* protested at the summit. | Антиглобалисты протестовали на саммите.
- brain drain | n | breɪn dreɪn |  | утечка мозгов | educated people leaving a country | The country suffers from a *brain drain*. | Страна страдает от утечки мозгов.
- cultural convergence | n | ˈkʌltʃərəl kənˈvɜːdʒəns | ˈkʌltʃərəl kənˈvɜːrdʒəns | культурное сближение | cultures becoming more similar | Globalisation leads to *cultural convergence*. | Глобализация ведёт к сближению культур.
- cultural exchange | n | ˈkʌltʃərəl ɪksˈtʃeɪndʒ |  | культурный обмен | sharing culture between countries | The programme promotes *cultural exchange*. | Программа способствует культурному обмену.
- cultural heritage | n | ˈkʌltʃərəl ˈherɪtɪdʒ | ˈkʌltʃərəl ˈherətədʒ | культурное наследие | traditions and buildings from the past | We must protect our *cultural heritage*. | Мы должны беречь культурное наследие.
- cultural identity | n | ˈkʌltʃərəl aɪˈdentɪti | ˈkʌltʃərəl aɪˈdentɪtiː | культурная идентичность | the feeling of belonging to a culture | Language is part of *cultural identity*. | Язык — часть культурной идентичности.
- diaspora | n | daɪˈæspərə |  | диаспора | people living outside their homeland | The Armenian *diaspora* is large. | Армянская диаспора многочисленна.
- freedom of speech | n | ˈfriːdəm əv spiːtʃ |  | свобода слова | the right to say what you think | *Freedom of speech* is a basic right. | Свобода слова — основное право.
- global village | n | ˈɡləʊbl ˈvɪlɪdʒ | ˈɡloʊbl ˈvɪlədʒ | глобальная деревня | the world connected by technology | The internet has made the world a *global village*. | Интернет превратил мир в глобальную деревню.
- intolerance | n | ɪnˈtɒlərəns | ˌɪnˈtɑːlərəns | нетерпимость; непереносимость | not accepting differences; inability to eat something | Religious *intolerance* causes conflict. | Религиозная нетерпимость порождает конфликты.
- loss of identity | n | lɒs əv aɪˈdentɪti | lɔːs əv aɪˈdentɪtiː | потеря идентичности | no longer feeling part of a culture | Migrants may suffer a *loss of identity*. | Мигранты могут терять свою идентичность.
- migrant workers | n | ˈmaɪɡrənt ˈwɜːkəz | ˈmaɪɡrənt ˈwɜːrkərz | трудовые мигранты | people who move abroad for work | *Migrant workers* send money home. | Трудовые мигранты отправляют деньги домой.
- multiculturalism | n | ˌmʌltɪˈkʌltʃərəlɪzəm | ˌmʌltiːˈkʌltʃərəlɪzəm | мультикультурализм | many cultures living together | Canada promotes *multiculturalism*. | Канада поддерживает мультикультурализм.
- petition | n | pəˈtɪʃn |  | петиция | a written request signed by many people | Thousands signed a *petition* against the new road. | Тысячи подписали петицию против новой дороги.
- poll | n | pəʊl | poʊl | опрос; голосование | a survey of people's opinions; an election | A recent *poll* showed little public knowledge of the charter. | Недавний опрос показал, что люди мало знают о хартии.
- public spending | n | ˈpʌblɪk ˈspendɪŋ |  | государственные расходы | money the government spends | *Public spending* on education rose. | Госрасходы на образование выросли.
- social security | n | ˈsəʊʃl sɪˈkjɔːrɪti | ˈsoʊʃl sɪkˈjʊrəti | социальное обеспечение | government money for people in need | He lives on *social security*. | Он живёт на социальное пособие.
- treaty | n | ˈtriːti |  | договор (международный) | an official agreement between countries | The two countries signed a peace *treaty*. | Две страны подписали мирный договор.
- welfare state | n | ˈwelfeə steɪt | ˈwelfer steɪt | государство всеобщего благосостояния | a system where the state helps citizens | Sweden is a *welfare state*. | Швеция — социальное государство.
- westernisation | n | ˌwestənaɪˈzeɪʃn | ˌwestərnəˈzeɪʃn | вестернизация | adopting Western culture | *Westernisation* changed local traditions. | Вестернизация изменила местные традиции. | амер. westernization
