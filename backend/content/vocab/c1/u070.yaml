title: Society and politics
title_ru: Общество и политика
topic: society
words:
- alignment | n | əˈlaɪnmənt |  | выравнивание; союз | arrangement in a line; agreement | Check the *alignment* of the wheels. | Проверьте развал-схождение колёс.
- capitalism | n | ˈkæpɪtəlɪzəm |  | капитализм | an economic system based on private ownership and profit | Industrial *capitalism* changed society forever. | Промышленный капитализм навсегда изменил общество.
- capitalist | n | ˈkæpɪtəlɪst |  | капиталист | a person who believes in or profits from capitalism | He called himself a *capitalist* with a social conscience. | Он называл себя капиталистом с социальной совестью.
- clan | n | klæn |  | клан | a large family group | The Scottish *clans* had their own tartans. | У шотландских кланов были свои тартаны.
- congregation | n | ˌkɒŋɡrɪˈɡeɪʃən | ˌkɑːŋɡrəˈɡeɪʃən | прихожане, паства | people at a church service | The *congregation* sang a hymn. | Прихожане пели гимн.
- constituency | n | kənˈstɪtjuːənsi | kənˈstɪtʃuːənsi | избирательный округ | an area that elects a representative | He represents a rural *constituency*. | Он представляет сельский округ.
- delegation | n | ˌdelɪˈɡeɪʃən | ˌdeləˈɡeɪʃən | делегация; делегирование | a group of representatives | A Chinese *delegation* visited the factory. | Завод посетила китайская делегация.
- faction | n | ˈfækʃən |  | фракция | a small group within a larger one | The party split into *factions*. | Партия раскололась на фракции.
- flank | n | flæŋk |  | склон, сторона; фланг | the side of something, such as a mountain or an animal | They climbed up the northern *flank* of the mountain. | Они поднимались по северному склону горы.
- hierarchy | n | ˈhaɪərɑːki | ˈhaɪərɑːrki | иерархия | a system in which people are organized by rank | Clothes showed your place in the social *hierarchy*. | Одежда показывала место человека в социальной иерархии.
- institutional | adj | ˌɪnstɪˈtjuːʃənl | ˌɪnstɪˈtuːʃənl | институциональный | relating to organisations | There's *institutional* racism. | Существует институциональный расизм.
- militia | n | məˈlɪʃə |  | ополчение, милиция | a group of armed citizens | Local *militias* defended the town. | Город защищало местное ополчение.
- noble | n | ˈnəʊbl | ˈnoʊbl | дворянин, знатный человек | a person from a family of high social rank | The king invited all the *nobles* to the feast. | Король пригласил на пир всю знать. | прил. noble — благородный
- progression | n | prəˈɡreʃən |  | развитие, прогрессия | moving forward | There's a natural *progression* from student to teacher. | От ученика к учителю — естественный путь.
- resort | v | rɪˈsɔːt | riːˈsɔːrt | прибегать (к) | to use as a last option | They *resorted* to violence. | Они прибегли к насилию. | resort to sth
- successive | adj | səkˈsesɪv |  | последовательный, идущий подряд | following one after another | They won three *successive* games. | Они выиграли три игры подряд.
- tribal | adj | ˈtraɪbl |  | племенной | relating to a tribe | There are *tribal* conflicts. | Есть межплеменные конфликты.
- tribunal | n | traɪˈbjuːnl | trəbˈjuːnl | трибунал | a special court | The case went to a *tribunal*. | Дело передали в трибунал.
- turnout | n | ˈtɜːnaʊt | ˈtɜːrnaʊt | явка | the number of people who come | Voter *turnout* was low. | Явка избирателей была низкой.
