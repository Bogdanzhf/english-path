title: 'How and how much: adverbs'
title_ru: 'Как и насколько: наречия'
topic: manner
words:
- accordingly | adv | əˈkɔːdɪŋli | əˈkɔːrdɪŋli | соответственно | in a way that is suitable for the situation | Check the facts and act *accordingly*. | Проверьте факты и действуйте соответственно.
- allegedly | adv | əˈledʒɪdli | əˈledʒədli | предположительно, якобы | according to what people say | He *allegedly* stole the money. | Он якобы украл деньги.
- exclusively | adv | ɪksˈkluːsɪvli | ɪkˈskluːsɪvli | исключительно | only | The offer is *exclusively* for members. | Предложение только для участников клуба.
- explicitly | adv | ɪkˈsplɪsɪtli | ɪksˈplɪsətli | прямо, явно | clearly and directly | She *explicitly* said no. | Она прямо сказала «нет».
- frankly | adv | ˈfræŋkli |  | откровенно говоря | honestly | *Frankly*, I don't care. | Честно говоря, мне всё равно.
- halfway | adv | ˈhɑːfweɪ | ˈhæfˈweɪ | на полпути | in the middle | We stopped *halfway* to rest. | Мы остановились на полпути отдохнуть.
- namely | adv | ˈneɪmli |  | а именно | that is | Two students, *namely* Ann and Tom, were late. | Двое студентов, а именно Энн и Том, опоздали.
- notably | adv | ˈnəʊtəbli | ˈnoʊtəbli | особенно, в частности | especially | Many people, *notably* children, love it. | Это нравится многим, особенно детям.
- partially | adv | ˈpɑːʃəli | ˈpɑːrʃəli | частично | not completely | The road is *partially* closed. | Дорога частично закрыта.
- presumably | adv | prɪˈzjuːməbli | prəˈzuːməbli | предположительно, вероятно | probably | *Presumably*, he's forgotten. | Он, вероятно, забыл.
- regardless | adv | rɪˈɡɑːdləs | rəˈɡɑːrdləs | несмотря ни на что | despite everything | It was raining, but we went *regardless*. | Шёл дождь, но мы всё равно пошли. | regardless of — независимо от
- reportedly | adv | rɪˈpɔːtɪdli | riːˈpɔːrtədli | по сообщениям | according to reports | She is *reportedly* very ill. | По сообщениям, она тяжело больна.
- respectively | adv | rɪˈspektɪvli |  | соответственно | in the order mentioned | Tom and Ann are 10 and 12 *respectively*. | Тому и Энн 10 и 12 лет соответственно.
- seemingly | adv | ˈsiːmɪŋli |  | по-видимому, казалось бы | apparently | The task was *seemingly* simple. | Задание казалось простым.
- solely | adv | ˈsəʊlli | ˈsoʊəli | исключительно, единственно | only | You are *solely* responsible. | Ответственность целиком на вас.
- substantially | adv | səbˈstænʃəli |  | значительно, существенно | very much; by a large amount | Prices have risen *substantially*. | Цены значительно выросли.
- thereafter | adv | ðeəˈrɑːftə | ðeˈræftər | после этого, впоследствии | after that | He left in 2010 and *thereafter* lived abroad. | Он уехал в 2010 году и с тех пор жил за границей.
- thereby | adv | ˌðeəˈbaɪ | ˌðerˈbaɪ | тем самым | as a result of this (formal) | She gave the chimps names, *thereby* treating them as individuals. | Она давала шимпанзе имена, тем самым относясь к ним как к личностям.
- utterly | adv | ˈʌtəli | ˈʌtərli | совершенно, абсолютно | completely | I was *utterly* exhausted. | Я был совершенно вымотан.
