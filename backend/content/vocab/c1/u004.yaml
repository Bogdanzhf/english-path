title: Everyday phrases
title_ru: Разговорные фразы
topic: phrases
words:
- above all | phr |  |  | прежде всего, главное | most importantly | *Above all*, be honest. | Главное — будь честен.
- all but | phr |  |  | почти; все, кроме | almost | The game was *all but* over. | Игра практически закончилась.
- all the more | phr |  |  | тем более, ещё больше | even more | That makes it *all the more* important. | Тем важнее это становится.
- as far as somebody/something is concerned | phr |  |  | что касается | regarding | As far as money is *concerned*, we're fine. | Что касается денег, у нас всё в порядке.
- as of... | phr |  |  | с (такого-то момента) | starting from | *As of* Monday, the shop will close at six. | С понедельника магазин будет закрываться в шесть.
- as opposed to | phr |  |  | в отличие от, а не | rather than | I prefer tea *as opposed to* coffee. | Я предпочитаю чай, а не кофе.
- as such | phr |  |  | как таковой | in the exact sense | There's no menu *as such*. | Меню как такового нет.
- as to | phr |  |  | относительно, насчёт | about | There's no decision *as to* the date. | Насчёт даты ещё не решили.
- at the expense of somebody/something | phr |  |  | за счёт, в ущерб | causing harm to | He got rich *at the expense of* others. | Он разбогател за счёт других.
- at the hands of somebody | phr |  |  | от рук (кого-либо) | caused by | They suffered *at the hands of* the soldiers. | Они пострадали от рук солдат.
- back and forth | phr |  |  | туда-сюда | in one direction and then back | He walked *back and forth*. | Он ходил туда-сюда.
- be attributed to somebody | phr |  |  | приписываться (кому-либо) | to be said to be written or caused by | The painting *is attributed to* Rembrandt. | Картина приписывается Рембрандту.
- be entitled to something | phr |  |  | иметь право на | to have the right to | You *are entitled to* a refund. | Вы имеете право на возврат денег.
- be found to do something | phr |  |  | оказаться (по результатам проверки) | to be discovered to | The drug *was found to* be safe. | Лекарство было признано безопасным.
- be meant to do something | phr |  |  | должен (по замыслу) | to be supposed to | This book *is meant to* be funny. | Предполагается, что книга смешная.
- be reported to be something | phr |  |  | по сообщениям, является | to be said in the news to be | He *is reported to be* in hospital. | По сообщениям, он в больнице.
- be said to be something | phr |  |  | говорят, что (является) | people say that it is | The castle *is said to be* haunted. | Говорят, в замке водятся привидения.
- bear somebody/something in mind | phr |  |  | иметь в виду, учитывать | to remember and consider | *Bear in mind* that the shop closes early. | Имей в виду, что магазин рано закрывается.
