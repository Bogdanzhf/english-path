title: Everyday phrases
title_ru: Разговорные фразы
topic: phrases
words:
- let alone | phr |  |  | не говоря уже о | and certainly not | I can't afford a bike, *let alone* a car. | Я не могу позволить себе велосипед, не то что машину.
- little more than... | phr |  |  | немногим больше, чем | only | It's *little more than* a village. | Это немногим больше деревни.
- live on something | phr |  |  | жить на, питаться | to have as income or food | They *live on* £200 a week. | Они живут на 200 фунтов в неделю.
- may well | phr |  |  | вполне может | is quite likely to | It *may well* rain later. | Позже вполне может пойти дождь.
- not to mention | phr |  |  | не говоря уже о | and also | It's expensive, *not to mention* ugly. | Это дорого, не говоря уже о том, что уродливо.
- nothing like | phr |  |  | совсем не похоже; далеко не | not at all similar | He's *nothing like* his brother. | Он совсем не похож на брата.
- on behalf of somebody | phr |  |  | от имени | representing | I'm calling *on behalf of* my company. | Я звоню от имени своей компании.
- on the part of somebody | phr |  |  | со стороны | by | It was a mistake *on the part of* the bank. | Это была ошибка со стороны банка.
- over the course of... | phr |  |  | в течение, на протяжении | during | *Over the course of* the year, sales grew. | В течение года продажи росли.
- put it | phr |  |  | выразиться | to say something in a certain way | To *put it* simply, we're broke. | Проще говоря, мы на мели.
- seek to do something | phr |  |  | стремиться (сделать) | to try to | The law *seeks to* protect children. | Закон призван защищать детей.
- set to do something | phr |  |  | собирающийся, должный (вот-вот) | likely to happen soon | Prices are *set to* rise. | Цены скоро вырастут.
- the extent to which... | phr |  |  | степень, в которой | how much | *The extent to which* it helps is unclear. | Насколько это помогает, неясно.
- to date | phr |  |  | на сегодняшний день, до сих пор | until now | *To date*, no one has complained. | До сих пор никто не жаловался.
- up against something | phr |  |  | столкнувшийся с (трудностями) | facing a problem | We're *up against* strong competition. | Нам противостоят сильные конкуренты.
- with regard to somebody/something | phr |  |  | что касается | concerning | *With regard to* your letter, … | Что касается вашего письма, …
- with respect to something | phr |  |  | относительно | concerning | *With respect to* pay, we offer more. | Что касается оплаты, мы предлагаем больше.
- with the exception of somebody/something | phr |  |  | за исключением | except | Everyone came *with the exception of* Tom. | Пришли все, кроме Тома.
