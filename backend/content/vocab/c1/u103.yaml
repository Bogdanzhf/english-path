title: 'Describing: same, different, true'
title_ru: 'Описание: сходство, точность, вероятность'
topic: describing
words:
- apt | adj | æpt |  | подходящий, уместный | suitable | That's an *apt* description. | Это точное описание.
- arbitrary | adj | ˈɑːbɪtrəri | ˈɑːrbɪtreri | произвольный | based on chance rather than reason | Retirement at 65 is a rather *arbitrary* age. | Выход на пенсию в 65 — довольно произвольный возраст.
- complementary | adj | ˌkɒmplɪˈmentəri | ˌkɑːmpləˈmentri | дополняющий; комплементарный | going well together | Their skills are *complementary*. | Их навыки дополняют друг друга.
- conditional | adj | kənˈdɪʃənl |  | условный | depending on something | The offer is *conditional* on your exam results. | Предложение зависит от результатов экзаменов.
- contested | adj | kənˈtestɪd | kənˈtestəd | спорный, оспариваемый | argued about | It's a hotly *contested* election. | Это напряжённые выборы.
- credible | adj | ˈkredəbl |  | заслуживающий доверия, правдоподобный | able to be believed | There's no *credible* evidence for ghosts. | Нет никаких убедительных доказательств существования призраков.
- definitive | adj | dɪˈfɪnətɪv |  | окончательный, исчерпывающий | final and impossible to change or improve | There is no *definitive* answer to this question. | На этот вопрос нет окончательного ответа.
- divergent | adj | daɪˈvɜːdʒənt | daɪˈvɜːrdʒənt | расходящийся, различный | different | They hold *divergent* views. | У них расходящиеся взгляды.
- dubious | adj | ˈdjuːbiəs | ˈduːbiəs | сомнительный | probably not honest or true; uncertain | The story seemed *dubious* at first. | Сначала история казалась сомнительной.
- elusive | adj | iˈluːsɪv |  | неуловимый, ускользающий | difficult to find, catch or achieve | A cure for the disease remained *elusive*. | Лекарство от болезни никак не удавалось найти.
- erroneous | adj | ɪˈrəʊniəs | ɪˈroʊniəs | ошибочный | wrong; based on incorrect information | The report contained *erroneous* data. | В отчёте были ошибочные данные.
- explanatory | adj | ɪkˈsplænətəri | ɪksˈplænətɔːri | пояснительный | explaining | Read the *explanatory* notes. | Прочитайте пояснения.
- homogeneous | adj | ˌhɒməˈdʒiːniəs | ˌhoʊməˈdʒiːniəs | однородный | made of parts that are all the same | The population was not *homogeneous*. | Население не было однородным.
- implicit | adj | ɪmˈplɪsɪt | ˌɪmˈplɪsət | подразумеваемый, скрытый | suggested but not said | There was an *implicit* threat in his words. | В его словах была скрытая угроза.
- inexplicable | adj | ˌɪnekˈsplɪkəbl | ˌɪnəksˈplɪsəbl | необъяснимый | impossible to explain | His behaviour was *inexplicable*. | Его поведение было необъяснимым.
- inherent | adj | ɪnˈherənt | ɪnˈhɪrənt | присущий, неотъемлемый | existing as a natural part of something | There are risks *inherent* in any experiment. | Любому эксперименту присущи риски.
- pertinent | adj | ˈpɜːtɪnənt | ˈpɜːrtɪnɪnt | уместный, относящийся к делу | relevant | She asked a *pertinent* question. | Она задала уместный вопрос.
- reminiscent | adj | ˌremɪˈnɪsənt | ˌreməˈnɪsənt | напоминающий | reminding you of | The smell is *reminiscent* of my childhood. | Запах напоминает мне детство.
- speculative | adj | ˈspekjʊlətɪv | ˈspekjələtɪv | спекулятивный, умозрительный | based on guesses | The report is purely *speculative*. | Доклад основан на одних догадках.
- subjective | adj | sʌbˈdʒektɪv | səbˈdʒektɪv | субъективный | based on personal opinion | Taste is *subjective*. | Вкус — дело субъективное.
