title: Science and research
title_ru: Наука и исследования
topic: science
words:
- absorption | n | əbˈsɔːpʃən | əbˈsɔːrpʃən | поглощение, всасывание | taking in | Vitamin C helps the *absorption* of iron. | Витамин C помогает усвоению железа.
- accumulation | n | əˌkjuːmjʊˈleɪʃən | əkˌjuːmjəˈleɪʃən | накопление | gradual increase | There's an *accumulation* of dust. | Накопилась пыль.
- acoustic | adj | əˈkuːstɪk |  | акустический | relating to sound; not electric | He plays *acoustic* guitar. | Он играет на акустической гитаре.
- acoustics | n | əˈkuːstɪks |  | акустика | the way sound travels in a room | The hall has excellent *acoustics*. | В зале отличная акустика.
- activation | n | ˌæktɪˈveɪʃən | ˌæktəˈveɪʃən | активация | making something start | Card *activation* takes a minute. | Активация карты занимает минуту.
- analytic | adj | ˌænəˈlɪtɪk |  | аналитический | using careful logical thinking | She has a very *analytic* mind. | У неё очень аналитический склад ума. | = analytical
- anthropology | n | ˌænθrəˈpɒlədʒi | ˌænθrəˈpɑːlədʒi | антропология | the study of human societies and cultures | She studied *anthropology* at Oxford. | Она изучала антропологию в Оксфорде.
- developmental | adj | dɪˈveləpˈmentl | dɪˌveləpˈmenl | связанный с развитием | relating to development | Children go through *developmental* stages. | Дети проходят этапы развития.
- diffusion | n | dɪˈfjuːʒən | dɪfˈjuːʒən | распространение, диффузия | spreading | The *diffusion* of ideas is fast online. | Идеи быстро распространяются в сети.
- domestication | n | dəˌmestɪˈkeɪʃən | dəˌmestəˈkeɪʃən | одомашнивание | taming animals | The *domestication* of horses changed history. | Одомашнивание лошадей изменило историю.
- dynamics | n | daɪˈnæmɪks |  | динамика, движущие силы | the way people or forces behave and affect each other | The *dynamics* of power in Rome were changing. | Расстановка сил в Риме менялась.
- erosion | n | ɪˈrəʊʒn | ɪˈroʊʒn | эрозия, размывание; ослабление | the slow destruction of soil or rock by wind and water; a gradual weakening | Trees protect the hills from *erosion*. | Деревья защищают холмы от эрозии.
- evolutionary | adj | ɪvəˈluːʃənəri | ˌevəˈluːʃəneri | эволюционный | relating to evolution | It's an *evolutionary* advantage. | Это эволюционное преимущество.
- geological | adj | ˌdʒɪəˈlɒdʒɪkl | ˌdʒiəˈlɑːdʒɪkl | геологический | relating to rocks | It's a *geological* survey. | Это геологическая съёмка.
- heredity | n | həˈredəti |  | наследственность | the passing of qualities from parents to children through genes | *Heredity* plays a role in heart disease. | Наследственность играет роль в сердечно-сосудистых заболеваниях.
- linguistics | n | lɪŋˈɡwɪstɪks |  | лингвистика | the study of language | She studies *linguistics*. | Она изучает лингвистику.
- mathematical | adj | ˌmæθɪˈmætɪkl | ˌmæθəˈmætɪkl | математический | relating to maths | She has a *mathematical* mind. | У неё математический склад ума.
- metabolic | adj | ˌmetəˈbɒlɪk | ˌmetəˈbɑːlɪk | метаболический, обменный | connected with the chemical processes in the body | Exercise increases your *metabolic* rate. | Физические нагрузки ускоряют обмен веществ. | metabolism — обмен веществ
- metabolism | n | məˈtæbəlɪzəm |  | обмен веществ | the chemical processes in the body that use food | Exercise speeds up your *metabolism*. | Спорт ускоряет обмен веществ.
- optical | adj | ˈɒptɪkl | ˈɑːptɪkl | оптический | relating to sight or light | It's an *optical* illusion. | Это оптическая иллюзия.
- reproduction | n | rɪprəˈdʌkʃən | ˌriːprəˈdʌkʃən | размножение; репродукция | producing young; a copy | It's a *reproduction* of a famous painting. | Это репродукция известной картины.
- synthesis | n | ˈsɪnθəsɪs |  | синтез, соединение | the combination of separate things into a whole | The report is a *synthesis* of many studies. | Доклад обобщает множество исследований.
