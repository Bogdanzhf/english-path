title: 'Describing: qualities'
title_ru: 'Описание: свойства и признаки'
topic: describing
words:
- elastic | adj | ɪˈlæstɪk |  | эластичный, упругий; гибкий | able to stretch and return to its shape | The clay was soft and *elastic*. | Глина была мягкой и пластичной.
- infamous | adj | ˈɪnfəməs |  | печально известный, позорный | famous for something bad | King John is *infamous* for his cruelty. | Король Иоанн печально известен своей жестокостью. | ударение на первый слог!
- inferior | adj | ɪnˈfɪəriə | ɪnˈfɪriər | худший, низший | not as good as someone or something else | Cheap products are often *inferior* in quality. | Дешёвые товары часто хуже по качеству. | inferior to
- invalid | adj | ɪnˈvælɪd |  | недействительный | not legally or officially acceptable | Your ticket is *invalid*. | Ваш билет недействителен. | сущ. invalid [ˈɪnvəlɪd] — инвалид (устар.)
- obscure | adj | əbˈskjʊə | əbˈskjʊr | малоизвестный; неясный | not well known; hard to understand | He was an *obscure* teacher until his invention. | До своего изобретения он был никому не известным учителем.
- rigid | adj | ˈrɪdʒɪd |  | жёсткий, негибкий | stiff and not easy to bend; strict | The rules were too *rigid*. | Правила были слишком жёсткими.
- saturated | adj | ˈsætʃəreɪtɪd |  | насыщенный, промокший | completely wet; containing as much as possible | The sailors' clothes were *saturated* with seawater. | Одежда моряков насквозь промокла морской водой.
- spontaneous | adj | spɒnˈteɪniəs | spɑːnˈteɪniəs | спонтанный | happening naturally, without planning | The crowd burst into *spontaneous* applause. | Публика разразилась стихийными аплодисментами.
- straightforward | adj | ˌstreɪtˈfɔːwəd | ˌstreɪtˈfɔːrwərd | простой, понятный; прямой | easy to understand or do; honest | The instructions are quite *straightforward*. | Инструкции довольно простые.
- stray | adj | streɪ |  | бездомный, бродячий; шальной | (of an animal) lost or without a home | A *stray* dog followed him through the jungle. | Бродячая собака следовала за ним по джунглям.
- susceptible | adj | səˈseptəbl |  | восприимчивый, подверженный | easily influenced or harmed by something | Children are more *susceptible* to infection. | Дети более подвержены инфекциям.
