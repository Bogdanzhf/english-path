title: Events and situations
title_ru: События и ситуации
topic: events
words:
- amnesty | n | ˈæmnəsti |  | амнистия | an official pardon for people who have committed crimes | The emperor declared an *amnesty* for prisoners. | Император объявил амнистию для заключённых.
- autonomy | n | ɔːˈtɒnəmi | ɔːˈtɑːnəmi | автономия, самостоятельность | the right to govern yourself | The islanders want more *autonomy* from Chile. | Островитяне хотят большей автономии от Чили.
- bliss | n | blɪs |  | блаженство | perfect happiness | Lying in the sun was pure *bliss*. | Лежать на солнце было настоящим блаженством.
- continuity | n | kɒntɪˈnjuːɪti | ˌkɑːntəˈnuːəti | непрерывность, преемственность | continuing without change | We need *continuity* in the team. | Команде нужна стабильность состава.
- defect | n | ˈdiːfekt |  | дефект, недостаток | a fault or problem in something | A small *defect* caused the disaster. | Причиной катастрофы стал небольшой дефект. | гл. defect [dɪˈfekt] — перебежать
- dependence | n | dɪˈpendəns |  | зависимость | the state of needing someone or something | The town's *dependence* on one industry was dangerous. | Зависимость города от одной отрасли была опасной.
- discretion | n | dɪˈskreʃən | dɪsˈkreʃən | благоразумие; усмотрение | careful judgement; freedom to decide | Tips are at your *discretion*. | Чаевые — на ваше усмотрение.
- exclusion | n | ɪkˈskluːʒn |  | исключение, отстранение | the act of keeping someone out | The *exclusion* of women from the club caused anger. | Недопущение женщин в клуб вызвало возмущение.
- fatigue | n | fəˈtiːɡ |  | усталость, утомление | extreme tiredness | She was overcome by *fatigue*. | Её одолела усталость.
- 'flaw | n | flɔː |  | изъян, недостаток | a mistake or weakness | The house had one major *flaw*: the roof leaked. | У дома был один серьёзный изъян: протекала крыша.'
- friction | n | ˈfrɪkʃən |  | трение; разногласия | rubbing; disagreement | There's *friction* between them. | Между ними трения.
- inclusion | n | ɪnˈkluːʒn |  | включение, инклюзивность | the act of including everyone, especially people who are often left out | The company is committed to diversity and *inclusion*. | Компания привержена разнообразию и инклюзивности.
- instability | n | ɪnstəˈbɪlɪti | ˌɪnstəˈbɪlɪti | нестабильность | not being stable | Political *instability* scares investors. | Политическая нестабильность отпугивает инвесторов.
- morale | n | məˈrɑːl | məˈræl | боевой дух | the level of confidence and enthusiasm in a group | The victory boosted the soldiers' *morale*. | Победа подняла боевой дух солдат. | не путайте с moral — мораль
- niche | n | niːʃ | nɪtʃ | ниша | a small specialised area | They found a *niche* in the market. | Они нашли нишу на рынке.
- purity | n | ˈpjʊrɪti | ˈpjʊrəti | чистота | being pure | The *purity* of the water is tested daily. | Чистоту воды проверяют ежедневно.
- seizure | n | ˈsiːʒə | ˈsiːʒər | приступ, припадок; захват | a sudden attack of illness, especially epilepsy | He had a *seizure* and fell to the floor. | У него случился приступ, и он упал на пол.
- spotlight | n | ˈspɒtlaɪt | ˈspɑːtlaɪt | прожектор; центр внимания | a strong light; public attention | She loves the *spotlight*. | Она обожает быть в центре внимания.
- vulnerability | n | ˌvʌlnərəˈbɪlɪti |  | уязвимость | being easily hurt | The attack exposed the system's *vulnerability*. | Атака выявила уязвимость системы.
