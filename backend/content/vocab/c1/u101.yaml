title: Events and situations
title_ru: События и ситуации
topic: events
words:
- casualty | n | ˈkæʒuəlti |  | пострадавший, жертва | a person injured or killed in an accident or war | There were no *casualties*. | Пострадавших не было.
- combat | n | ˈkɒmbæt | ˈkɑːmbæt | бой, сражение | fighting, especially in war | They were trained for *combat*. | Их обучали бою.
- re-entry | n | ˌriːˈentri |  | вход (в атмосферу) | the return of a spacecraft into the Earth's atmosphere | During *re-entry*, the shuttle became extremely hot. | При входе в атмосферу шаттл сильно раскалялся.
