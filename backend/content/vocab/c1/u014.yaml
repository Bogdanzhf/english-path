title: Body and health
title_ru: Тело и здоровье
topic: body
words:
- airway | n | ˈeəweɪ | ˈerweɪ | дыхательные пути | the passage from the nose and mouth to the lungs | Check that the patient's *airway* is clear. | Убедитесь, что дыхательные пути пациента свободны.
- antibody | n | ˈæntɪbɒdi | ˈæntiːbɑːdi | антитело | a substance the body makes to fight disease | The test checks for *antibodies*. | Анализ проверяет наличие антител.
- bearded | adj | ˈbiədɪd | ˈbɪrdəd | бородатый | having a beard | A *bearded* man opened the door. | Дверь открыл бородатый мужчина.
- blister | n | ˈblɪstə | ˈblɪstər | волдырь, мозоль | a bubble on the skin | New shoes gave me *blisters*. | Новые туфли натёрли мне мозоли.
- bodily | adj | ˈbɒdɪli | ˈbɑːdəli | телесный, физический | relating to the body | He suffered *bodily* harm. | Ему нанесли телесные повреждения.
- dose | n | dəʊs | doʊs | доза | the amount of medicine you take at one time | Don't take more than the stated *dose*. | Не принимайте больше указанной дозы.
- embryo | n | ˈembriəʊ | ˈembrioʊ | эмбрион, зародыш | an animal or human in the very early stages of development | At this stage, the *embryo* is smaller than a grain of rice. | На этом этапе эмбрион меньше рисового зёрнышка.
- enzyme | n | ˈenzaɪm |  | фермент | a substance that speeds up reactions in the body | *Enzymes* help digest food. | Ферменты помогают переваривать пищу.
- glucose | n | ˈɡluːkəʊs | ˈɡluːkoʊs | глюкоза | a natural sugar that gives the body energy | The brain uses *glucose* as its main fuel. | Мозг использует глюкозу как основное топливо.
- hormone | n | ˈhɔːməʊn | ˈhɔːrmoʊn | гормон | a chemical that controls body functions | Stress *hormones* affect sleep. | Гормоны стресса влияют на сон.
- manicure | n | ˈmænɪkjɔː | ˈmænɪkjər | маникюр | care of the hands and nails | She has a *manicure* every week. | Она делает маникюр каждую неделю.
- neural | adj | ˈnjuːrəl | ˈnjʊrəl | нейронный, нервный | relating to nerves | It's a *neural* network. | Это нейронная сеть.
- pedicure | n | ˈpedɪkjɔː | ˈpedɪkjər | педикюр | care of the feet and toenails | I booked a *pedicure*. | Я записалась на педикюр.
- plaque | n | plæk |  | налёт (зубной); табличка | a substance on teeth; a sign on a wall | Brushing removes *plaque*. | Чистка зубов удаляет налёт.
- posture | n | ˈpɒstʃə | ˈpɑːstʃər | осанка, поза | the way you hold your body | Bad *posture* can cause back pain. | Плохая осанка может вызывать боль в спине.
- psychiatric | adj | ˌsaɪkiˈætrɪk |  | психиатрический | connected with mental illness | She works in a *psychiatric* hospital. | Она работает в психиатрической больнице.
- psychiatry | n | saɪˈkaɪətri |  | психиатрия | the study and treatment of mental illness | He decided to specialize in *psychiatry*. | Он решил специализироваться в психиатрии.
- restorative | adj | rɪˈstɔːrətɪv | rəˈstɔːrətɪv | восстанавливающий | making you healthy again | Sleep has a *restorative* effect. | Сон восстанавливает силы.
- surgical | adj | ˈsɜːdʒɪkl | ˈsɜːrdʒɪkl | хирургический | relating to surgery | He needs *surgical* treatment. | Ему нужно хирургическое лечение.
