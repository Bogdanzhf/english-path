title: Body and health
title_ru: Тело и здоровье
topic: body
words:
- arthritis | n | ɑːˈθraɪtɪs | ɑːrˈθraɪtɪs | артрит | a disease that makes joints painful and stiff | My grandmother has *arthritis* in her hands. | У бабушки артрит рук.
- psychiatric | adj | ˌsaɪkiˈætrɪk |  | психиатрический | connected with mental illness | She works in a *psychiatric* hospital. | Она работает в психиатрической больнице.
- smallpox | n | ˈsmɔːlpɒks | ˈsmɔːlpɑːks | оспа | a serious infectious disease that causes fever and spots | *Smallpox* killed millions of people. | Оспа унесла миллионы жизней.
