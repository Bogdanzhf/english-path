title: Thinking and opinions
title_ru: Мысли и мнения
topic: mind
words:
- compulsion | n | kəmˈpʌlʃən |  | принуждение; навязчивое желание | being forced; a strong urge | He felt a *compulsion* to check the door. | Его тянуло снова проверить дверь.
- conscience | n | ˈkɒnʃəns | ˈkɑːnʃəns | совесть | the inner sense of what is right and wrong | He had a guilty *conscience* about lying. | Его мучила совесть из-за лжи.
- contradiction | n | ˌkɒntrəˈdɪkʃən | ˌkɑːntrəˈdɪkʃən | противоречие | a statement that is the opposite | There's a *contradiction* in his story. | В его рассказе противоречие.
- disillusionment | n | dɪsɪˈluːʒənmənt | ˌdɪsɪˈluːʒənmənt | разочарование | losing your belief in something | There's widespread *disillusionment* with politics. | Многие разочаровались в политике.
- exponential | adj | ˌekspəˈnenʃl | ˌekspoʊˈnenʃl | экспоненциальный | increasing faster and faster | There's been *exponential* growth. | Рост был экспоненциальным.
- facet | n | ˈfæset | ˈfæsət | грань, аспект | one part or aspect | It shows another *facet* of his personality. | Это показывает другую грань его личности.
- gradient | n | ˈɡreɪdiənt |  | уклон; градиент | how steep a slope is | The hill has a steep *gradient*. | У холма крутой уклон.
- impediment | n | ɪmˈpedɪmənt | ˌɪmˈpedəmənt | препятствие; дефект (речи) | something that blocks | Lack of money is an *impediment* to growth. | Нехватка денег мешает росту.
- incidence | n | ˈɪnsɪdəns |  | частота, распространённость | how often something happens | The *incidence* of plastic in fish has risen. | Пластик стал чаще обнаруживаться в рыбе.
- norms | n | nɔːmz | nɔːrmz | нормы | usual standards of behaviour | Social *norms* differ between cultures. | Социальные нормы различаются в разных культурах.
- obsession | n | ɒbˈseʃən | əbˈseʃən | одержимость, навязчивая идея | thinking about something all the time | He has an *obsession* with cleanliness. | Он помешан на чистоте.
- opt | v | ɒpt | ɑːpt | выбирать | to choose | Many students *opt* for science. | Многие студенты выбирают естественные науки. | opt out — отказаться
- paradigm | n | ˈpærədaɪm | ˈperədaɪm | парадигма | a model or pattern | It's a *paradigm* shift. | Это смена парадигмы.
- rapport | n | ræˈpɔː | ræˈpɔːr | взаимопонимание | a friendly relationship | She has a good *rapport* with her students. | У неё хорошие отношения с учениками.
- relevance | n | ˈrelɪvəns | ˈreləvəns | актуальность, значимость | being connected and important | The book has *relevance* today. | Книга актуальна и сегодня.
- skip | v | skɪp |  | пропускать; прыгать | to not do something you usually do | Don't *skip* breakfast — it's important. | Не пропускай завтрак — это важно.
- tolerate | v | ˈtɒləreɪt | ˈtɑːləreɪt | терпеть, выносить | to accept something you don't like | I can't *tolerate* rude people. | Я не выношу грубых людей.
- turnover | n | ˈtɜːnəʊvə | ˈtɜːrnoʊvər | оборот; текучесть (кадров) | money a business makes; staff leaving | Staff *turnover* is high. | Текучесть кадров высокая.
- verify | v | ˈverɪfaɪ |  | проверять, подтверждать | to check that something is true | We need to *verify* your identity. | Нам нужно подтвердить вашу личность.
