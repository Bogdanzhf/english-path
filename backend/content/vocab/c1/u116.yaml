title: 'Describing: same, different, true'
title_ru: 'Описание: сходство, точность, вероятность'
topic: describing
words:
- acute | adj | əˈkjuːt |  | острый; сильный | very serious or severe; (of senses) very sensitive | He suffered from *acute* pain in his ears. | Он страдал от острой боли в ушах.
- consequent | adj | ˈkɒnsɪkwənt | ˈkɑːnsəkwent | последовавший, вытекающий | happening as a result | The storm and the *consequent* floods destroyed many homes. | Буря и последовавшие за ней наводнения разрушили много домов. | consequently — следовательно
- dubious | adj | ˈdjuːbiəs | ˈduːbiəs | сомнительный | probably not honest or true; uncertain | The story seemed *dubious* at first. | Сначала история казалась сомнительной.
- elusive | adj | iˈluːsɪv |  | неуловимый, ускользающий | difficult to find, catch or achieve | A cure for the disease remained *elusive*. | Лекарство от болезни никак не удавалось найти.
- erroneous | adj | ɪˈrəʊniəs | ɪˈroʊniəs | ошибочный | wrong; based on incorrect information | The report contained *erroneous* data. | В отчёте были ошибочные данные.
- homogeneous | adj | ˌhɒməˈdʒiːniəs | ˌhoʊməˈdʒiːniəs | однородный | made of parts that are all the same | The population was not *homogeneous*. | Население не было однородным.
- minimal | adj | ˈmɪnɪml |  | минимальный | very small in amount | The operation leaves *minimal* scarring. | После операции остаются минимальные шрамы.
- whatsoever | adv | ˌwɒtsəʊˈevə | ˌwʌtsoʊˈevər | вообще, совершенно (с отрицанием) | at all (used after a negative) | There is no evidence *whatsoever*. | Нет вообще никаких доказательств.
