title: 'Describing: society and science'
title_ru: 'Описание: общество, наука, право'
topic: describing
words:
- aesthetic | adj | iːsˈθetɪk | esˈθetɪk | эстетический | connected with beauty and art | The building has great *aesthetic* value. | У здания большая эстетическая ценность.
- collective | adj | kəˈlektɪv |  | коллективный | shared by a group | It was a *collective* decision. | Это было коллективное решение.
- constitutional | adj | ˌkɒnstɪˈtjuːʃənl | ˌkɑːnstəˈtuːʃənl | конституционный | relating to a constitution | It's a *constitutional* right. | Это конституционное право.
- corrupt | adj | kəˈrʌpt |  | коррумпированный, продажный | using power dishonestly for money or advantage | The *corrupt* official was sent to prison. | Коррумпированного чиновника отправили в тюрьму.
- cult | n | kʌlt |  | культ; секта | a religious group; great popularity | The film has a *cult* following. | У фильма культовая аудитория.
- diplomatic | adj | ˌdɪpləˈmætɪk |  | дипломатический; дипломатичный | relating to diplomacy; tactful | She gave a *diplomatic* answer. | Она дала дипломатичный ответ.
- electoral | adj | ɪˈlektərəl |  | избирательный | relating to elections | They want *electoral* reform. | Они хотят избирательной реформы.
- experimental | adj | ɪkˌsperɪˈmentl |  | экспериментальный | new and not tested | It's an *experimental* treatment. | Это экспериментальное лечение.
- functional | adj | ˈfʌŋkʃənl |  | функциональный; рабочий | practical; working | The kitchen is small but *functional*. | Кухня маленькая, но удобная.
- indigenous | adj | ɪnˈdɪdʒənəs |  | коренной | originally living in a place | The *indigenous* people call the island Rapa Nui. | Коренные жители называют остров Рапа-Нуи.
- intellectual | n | ˌɪntəˈlektʃuːəl | ˌɪnəˈlektʃuːəl | интеллектуал | a person who thinks deeply | He's a leading *intellectual*. | Он видный интеллектуал.
- molecular | adj | məˈlekjʊlə | məˈlekjələr | молекулярный | relating to molecules | She studies *molecular* biology. | Она изучает молекулярную биологию.
- monetary | adj | ˈmʌnɪtri | ˈmɑːnɪteri | денежный, монетарный | connected with money | The prize had great *monetary* value. | Премия имела большую денежную ценность.
- operational | adj | ˌɒpəˈreɪʃənl | ˌɑːpəˈreɪʃənl | действующий, рабочий | working and ready | The new airport is fully *operational*. | Новый аэропорт полностью введён в эксплуатацию.
- provincial | adj | prəˈvɪnʃl |  | провинциальный | relating to a province; narrow-minded | It's a *provincial* town. | Это провинциальный город.
- regulatory | adj | ˌreɡjuːˈleɪtəri | ˈreɡjələtɔːri | регулирующий, нормативный | relating to rules | The *regulatory* body approved the drug. | Регулирующий орган одобрил лекарство.
- revolutionary | adj | ˌrevəˈluːʃənəri | ˌrevəˈluːʃəneri | революционный | completely new; relating to revolution | It's a *revolutionary* idea. | Это революционная идея.
- 'serial | adj | ˈsiərɪəl | ˈsɪriəl | серийный | happening one after another | He''s a *serial* killer. | Он серийный убийца. | сущ.: serial — сериал'
- structural | adj | ˈstrʌktʃərəl |  | структурный, конструктивный | relating to structure | The building has *structural* damage. | У здания повреждены несущие конструкции.
- theoretical | adj | ˌθɪəˈretɪkl | ˌθiːəˈretɪkl | теоретический | based on ideas rather than practical experience | He was a *theoretical* physicist. | Он был физиком-теоретиком.
