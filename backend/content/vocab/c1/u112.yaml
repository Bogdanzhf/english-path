title: Events and situations
title_ru: События и ситуации
topic: events
words:
- deterioration | n | dɪˌtɪəriəˈreɪʃn | dɪˌtɪriəˈreɪʃn | ухудшение | the process of becoming worse | There was a rapid *deterioration* in his health. | Его здоровье быстро ухудшилось. | deteriorate — ухудшаться
- discord | n | ˈdɪskɔːd | ˈdɪskɔːrd | разлад, разногласия | disagreement between people | The decision caused *discord* among the staff. | Решение вызвало разлад среди сотрудников.
- gloom | n | ɡluːm |  | мрак; уныние | darkness; a feeling of sadness | The house was in *gloom* after the lights went out. | Когда погас свет, дом погрузился во мрак. | gloomy — мрачный
- renown | n | rɪˈnaʊn |  | слава, известность | fame and respect | Vermeer is an artist of great *renown*. | Вермеер — художник с громкой славой. | renowned — прославленный
- strife | n | straɪf |  | раздор, борьба | angry or violent disagreement | Years of *strife* had divided the family. | Годы раздоров разделили семью.
- trance | n | trɑːns | træns | транс | a state between sleep and waking | She seemed to be in a *trance*. | Она словно была в трансе.
- uproar | n | ˈʌprɔː | ˈʌprɔːr | шумиха, возмущение | a lot of public anger and noise | The decision caused an *uproar*. | Решение вызвало бурю возмущения.
