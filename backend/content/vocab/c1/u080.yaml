- con | n | kɒn | kɑːn | обман, мошенничество | a trick to get someone's money (informal) | The whole thing was a *con*. | Всё это было мошенничеством. | con artist — мошенник; pros and cons — за и против
- custody | n | ˈkʌstədi |  | опека; заключение под стражу | the legal right to look after someone; being kept by the police | The animals were kept in *custody* in a zoo. | Животных содержали в неволе в зоопарке. | in custody — под стражей
- detain | v | dɪˈteɪn |  | задерживать (официально) | to officially keep someone somewhere and not let them leave | Two men were *detained* for questioning. | Двоих мужчин задержали для допроса. | detention — задержание
- detention | n | dɪˈtenʃən |  | задержание; оставление после уроков | being kept somewhere | He was held in *detention*. | Его держали под стражей.
- extortion | n | ɪkˈstɔːʃən | ekˈstɔːrʃən | вымогательство | getting money by threats | He was jailed for *extortion*. | Его посадили за вымогательство.
- firearm | n | ˈfaɪərɑːm | ˈfaɪrɑːrm | огнестрельное оружие | a gun | He was carrying a *firearm*. | При нём было огнестрельное оружие.
- imprison | v | ɪmˈprɪzən | ˌɪmˈprɪzən | заключать в тюрьму | to put in prison | He was *imprisoned* for ten years. | Его посадили на десять лет.
- imprisonment | n | ɪmˈprɪzənmənt | ˌɪmˈprɪzənmənt | заключение (в тюрьму) | being in prison | He faces five years' *imprisonment*. | Ему грозит пять лет тюрьмы.
- indictment | n | ɪnˈdaɪtmənt | ˌɪnˈdaɪtmənt | обвинительный акт; осуждение | a formal accusation | The report is an *indictment* of the system. | Доклад — приговор системе.
- judicial | adj | dʒuːˈdɪʃl |  | судебный | relating to courts | We need *judicial* reform. | Нам нужна судебная реформа.
- lawsuit | n | ˈlɔːsuːt |  | судебный иск | a legal case | She filed a *lawsuit* against the company. | Она подала иск против компании.
- mandate | n | ˈmændeɪt |  | мандат, полномочия | official authority | The government has a *mandate* to act. | У правительства есть полномочия действовать.
- patent | n | ˈpætnt |  | патент | an official right to be the only one to make or sell an invention | He took out a *patent* on his invention. | Он запатентовал своё изобретение.
- sanction | n | ˈsɑːnkʃən | ˈsæŋkʃən | санкция | a punishment or official permission | The UN imposed *sanctions*. | ООН ввела санкции.
- statute | n | ˈstætʃuːt |  | закон, статут | a law written down by a government | The *statute* was passed in 1990. | Закон был принят в 1990 году.
- sue | v | sjuː | suː | подавать в суд | to take someone to court to get money for harm they caused | He *sued* the company for a million dollars. | Он подал на компанию в суд на миллион долларов.
reading:
  title: Mandela's Choice
  title_ru: Выбор Манделы
  text: |
    For most of the twentieth century, South Africa was ruled by a white minority. Under a system called apartheid, black South Africans were denied the right to vote, forced to live in separate areas and treated as second-class citizens. Many people were outraged, and some began to defy the government's laws.

    One of them was a young lawyer named Nelson Mandela. Together with others, he waged a long campaign against apartheid. In 1964, he was sentenced to life in prison. For the next twenty-seven years, he lived in a tiny cell, most of it on Robben Island, where prisoners broke rocks in the sun. Guards insulted and sometimes slapped the prisoners. Mandela's eyesight was damaged by the bright light, and by the end, he was feeble from illness.

    By the late 1980s, South Africa was in crisis. There was violence in the streets, protesters smashed shop windows, and the world had placed heavy sanctions on the country. Many observers were pessimistic; they believed a terrible civil war was inevitable. Under huge pressure, the government released Mandela in 1990.

    What Mandela did next amazed the world. Instead of seeking revenge, he chose to forgive. He invited one of his former prison guards to his presidential inauguration in 1994. He worked alongside the men who had imprisoned him to write a new constitution. When the national rugby team, a symbol of white South Africa, played in the 1995 World Cup, Mandela wore their shirt and cheered for them, displaying a desire for unity that surprised both black and white citizens.

    Mandela believed that hatred would destroy the country, whereas forgiveness could heal it. "Resentment is like drinking poison and hoping it will kill your enemies," he is often quoted as saying. His country was far from perfect, nor did the problems of poverty disappear. But the transition to democracy was more peaceful and successful than almost anyone had expected. Today, Mandela is remembered as one of the most majestic moral figures of modern times.
  ru: |
    Большую часть XX века Южной Африкой управляло белое меньшинство. При системе под названием апартеид чернокожих южноафриканцев лишали права голоса, заставляли жить в отдельных районах и считали гражданами второго сорта. Многие были возмущены, и некоторые начали открыто нарушать законы правительства.

    Одним из них был молодой юрист Нельсон Мандела. Вместе с другими он вёл долгую борьбу против апартеида. В 1964 году его приговорили к пожизненному заключению. Следующие двадцать семь лет он провёл в крошечной камере, большую часть — на острове Роббен, где заключённые дробили камни под палящим солнцем. Охранники оскорбляли заключённых, а иногда и били их. Яркий свет повредил Манделе зрение, а к концу срока болезнь сделала его слабым.

    К концу 1980-х Южная Африка была в кризисе. На улицах царило насилие, протестующие били витрины, а мир ввёл против страны жёсткие санкции. Многие наблюдатели были настроены пессимистично и считали, что страшная гражданская война неизбежна. Под огромным давлением правительство освободило Манделу в 1990 году.

    То, что Мандела сделал дальше, поразило мир. Вместо того чтобы мстить, он решил простить. Он пригласил одного из своих бывших тюремщиков на свою президентскую инаугурацию в 1994 году. Он работал бок о бок с людьми, посадившими его в тюрьму, над новой конституцией. Когда национальная сборная по регби — символ белой Южной Африки — играла на чемпионате мира 1995 года, Мандела надел её футболку и болел за неё, проявив стремление к единству, которое удивило и чернокожих, и белых граждан.

    Мандела считал, что ненависть разрушит страну, тогда как прощение может её исцелить. «Обида — это как пить яд и надеяться, что он убьёт твоих врагов», — часто приводят его слова. Его страна была далека от совершенства, и проблемы бедности не исчезли. Но переход к демократии оказался мирнее и успешнее, чем почти кто-либо ожидал. Сегодня Манделу вспоминают как одну из самых величественных нравственных фигур современности.
  questions:
  - q: How long was Mandela in prison?
    options:
    - Seven years
    - Twenty-seven years
    - Forty years
    - Life
    answer: 1
  - q: What did many observers expect in the late 1980s?
    options:
    - A peaceful election
    - A terrible civil war
    - Mandela's death
    - An economic boom
    answer: 1
  - q: What did Mandela do at the 1995 Rugby World Cup?
    options:
    - He refused to attend
    - He wore the team's shirt and supported them
    - He played in the team
    - He criticized the team
    answer: 1
  - tf: Mandela sought revenge on his former guards.
    answer: false
  - tf: The transition to democracy was more peaceful than expected.
    answer: true
