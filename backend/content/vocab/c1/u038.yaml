title: Phrasal verbs
title_ru: Фразовые глаголы
topic: phrasal
words:
- lay off | phv |  |  | увольнять (по сокращению) | to stop employing because there's no work | The factory *laid off* 200 workers. | Завод сократил 200 рабочих.
- map out | phv |  |  | спланировать, наметить | to plan in detail | We *mapped out* our route. | Мы наметили маршрут.
- opt out | phv |  |  | отказаться (от участия) | to choose not to take part | You can *opt out* of the scheme. | Вы можете отказаться от участия в программе.
- phase out | phv |  |  | постепенно отказаться | to gradually stop using | Petrol cars will be *phased out*. | От бензиновых машин постепенно откажутся.
- play down | phv |  |  | преуменьшать | to make seem less important | The government *played down* the crisis. | Правительство преуменьшало кризис.
- pull through | phv |  |  | выкарабкаться, поправиться | to survive a serious illness | The doctors think he'll *pull through*. | Врачи думают, он выкарабкается.
- rope in | phv |  |  | привлечь, втянуть | to persuade someone to help | They *roped in* all their friends to help. | Они привлекли к помощи всех друзей.
- scale back | phv |  |  | сокращать | to make smaller | The company *scaled back* its plans. | Компания сократила свои планы.
- shy away from | phv |  |  | избегать, уклоняться | to avoid because you are nervous | Don't *shy away from* difficult questions. | Не уходи от трудных вопросов.
- single out | phv |  |  | выделять, выбирать | to choose one from a group | The teacher *singled out* my essay for praise. | Учитель особо похвалил моё сочинение.
- stem from | phv |  |  | происходить от, быть следствием | to be caused by | His problems *stem from* stress. | Его проблемы вызваны стрессом.
- step down | phv |  |  | уйти в отставку | to leave a job | The CEO *stepped down*. | Генеральный директор ушёл в отставку.
- touch on | phv |  |  | затронуть (тему) | to mention briefly | The lecture *touched on* climate change. | В лекции затронули изменение климата.
- weigh up | phv |  |  | взвесить (за и против) | to consider carefully | *Weigh up* the pros and cons. | Взвесь все за и против.
- write off | phv |  |  | списывать (со счетов) | to decide something is useless | Experts *wrote off* the team too early. | Эксперты слишком рано списали команду со счетов.
- zero in on | phv |  |  | сосредоточиться на, нацелиться на | to focus on | Let's *zero in on* the main problem. | Давай сосредоточимся на главной проблеме.
