title: Idioms
title_ru: Идиомы
topic: idioms
words:
- a far cry from | phr |  |  | совсем не то, что; далеко до | very different from | This hotel is *a far cry from* the one we stayed in last year. | Этот отель совсем не похож на прошлогодний.
- a long shot | phr |  |  | маловероятный шанс | something unlikely to succeed | It's *a long shot*, but let's try. | Шансов мало, но давай попробуем.
- a narrow escape | phr |  |  | чудом спастись | when you only just avoid danger | We had *a narrow escape*. | Мы чудом спаслись.
- a steep learning curve | phr |  |  | быстрое и трудное обучение | a lot to learn quickly | The new job is *a steep learning curve*. | На новой работе приходится многому учиться в сжатые сроки.
- a vicious circle | phr |  |  | порочный круг | a bad situation that keeps causing itself | Debt can become *a vicious circle*. | Долги могут стать порочным кругом.
- add insult to injury | phr |  |  | усугубить ситуацию | to make a bad situation worse | To *add insult to injury*, it started to rain. | В довершение всего пошёл дождь.
- at the drop of a hat | phr |  |  | в любой момент, без раздумий | immediately, without hesitation | He'd help you *at the drop of a hat*. | Он поможет тебе по первой просьбе.
- behind the scenes | phr |  |  | за кулисами | in private, not seen by the public | A lot of work goes on *behind the scenes*. | Много работы делается за кадром.
- bite off more than you can chew | phr |  |  | взять на себя слишком много | to try to do too much | Don't *bite off more than you can chew*. | Не берись за непосильное.
- by the same token | phr |  |  | точно так же, по той же причине | for the same reason | *By the same token*, we must also save money. | По той же логике нам надо и экономить.
- come rain or shine | phr |  |  | в любую погоду, что бы ни случилось | whatever happens | I'll be there, *come rain or shine*. | Я приду при любой погоде.
- cut to the chase | phr |  |  | перейти к сути | to get to the point | Let's *cut to the chase*. | Перейдём к сути.
- devil's advocate | phr |  |  | адвокат дьявола | a person who argues the opposite to test ideas | I'll play *devil's advocate*. | Я побуду адвокатом дьявола.
- food for thought | phr |  |  | пища для размышлений | something to think about | The lecture gave me *food for thought*. | Лекция дала мне пищу для размышлений.
- get out of hand | phr |  |  | выйти из-под контроля | to become uncontrolled | The party *got out of hand*. | Вечеринка вышла из-под контроля.
- hit the ground running | phr |  |  | сразу взяться за дело | to start something quickly and successfully | The new manager *hit the ground running*. | Новый менеджер сразу взялся за работу.
- jump on the bandwagon | phr |  |  | примкнуть к модному движению | to join something popular | Many companies *jumped on the bandwagon*. | Многие компании подхватили эту моду.
