title: Thinking and opinions
title_ru: Мысли и мнения
topic: mind
words:
- aggression | n | əˈɡreʃn |  | агрессия | angry, violent behaviour | His *aggression* frightened his students. | Его агрессия пугала учеников.
- consistency | n | kənˈsɪstənsi |  | консистенция; последовательность | how thick or firm something is; the quality of always being the same | Snow after an avalanche has the *consistency* of concrete. | Снег после лавины по плотности напоминает бетон.
- echo | n | ˈekəʊ | ˈekoʊ | эхо | a sound that comes back after hitting a surface | We heard the *echo* of our voices in the cave. | Мы слышали эхо своих голосов в пещере.
- magnitude | n | ˈmæɡnɪtjuːd | ˈmæɡnɪtuːd | масштаб, величина | the great size or importance of something | Nobody understood the *magnitude* of the discovery. | Никто не осознавал масштаба открытия.
- succession | n | səkˈseʃn |  | последовательность, череда | a number of things that follow each other | A *succession* of storms hit the coast. | На побережье обрушилась череда штормов. | in succession — подряд
- texture | n | ˈtekstʃə | ˈtekstʃər | текстура, консистенция | the way something feels when you touch or eat it | The soup has a smooth, creamy *texture*. | У супа гладкая, сливочная консистенция.
- tolerance | n | ˈtɒlərəns | ˈtɑːlərəns | выносливость, устойчивость; терпимость | the ability to survive difficult conditions; acceptance of others | These animals have a remarkable *tolerance* to cold. | У этих животных удивительная устойчивость к холоду.
- virtue | n | ˈvɜːtʃuː | ˈvɜːrtʃuː | добродетель, достоинство | a good moral quality | Patience is a *virtue*. | Терпение — добродетель.
- width | n | wɪdθ |  | ширина | the distance from one side to the other | The painting is two metres in *width*. | Ширина картины — два метра. | wide — широкий
