title: Communication and language
title_ru: Общение и язык
topic: communication
words:
- etiquette | n | ˈetɪket |  | этикет | rules of polite behaviour | Online shopping has its own *etiquette*. | У онлайн-шопинга свой этикет.
- outburst | n | ˈaʊtbɜːst | ˈaʊtbɜːrst | вспышка (гнева) | a sudden expression of strong emotion | The king was known for his violent *outbursts*. | Король был известен своими вспышками ярости.
- spectacle | n | ˈspektəkl |  | зрелище | an amazing or impressive sight | The fireworks were a wonderful *spectacle*. | Фейерверк был чудесным зрелищем. | spectacles — очки (устар.)
