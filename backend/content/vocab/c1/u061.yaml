title: Communication and language
title_ru: Общение и язык
topic: communication
words:
- amend | v | əˈmend |  | вносить поправки | to change a law or document | The constitution has been *amended* many times. | В конституцию много раз вносили поправки. | amendment — поправка
- assert | v | əˈsɜːt | əˈsɜːrt | утверждать, отстаивать | to state firmly | He *asserted* that he was innocent. | Он утверждал, что невиновен.
- authorize | v | ˈɔːθəraɪz |  | разрешать, санкционировать | to give official permission | Only managers can *authorize* payments. | Только менеджеры могут разрешать платежи. | брит. также authorise
- betray | v | bɪˈtreɪ |  | предавать | to be disloyal to someone who trusts you | He *betrayed* his friends to the police. | Он выдал своих друзей полиции. | betrayal — предательство
- concede | v | kənˈsiːd |  | признавать (неохотно); уступать | to admit something is true, often unwillingly | He *conceded* that the plan had problems. | Он признал, что у плана есть недостатки.
- contend | v | kənˈtend |  | бороться; утверждать | to deal with a difficult situation; to argue | They had to *contend* with heat, rain and insects. | Им приходилось бороться с жарой, дождями и насекомыми.
- designate | v | ˈdezɪɡneɪt |  | назначать, обозначать | to officially choose or name | The area was *designated* a national park. | Территорию объявили национальным парком.
- deter | v | dɪˈtɜː | dɪˈtɜːr | удерживать, отпугивать | to make someone decide not to do something | Bad weather didn't *deter* the climbers. | Плохая погода не остановила альпинистов.
- dictate | v | ˈdɪkteɪt |  | диктовать; предписывать | to say words for someone to write; to give orders | She *dictated* a letter. | Она продиктовала письмо.
- disrupt | v | dɪsˈrʌpt |  | нарушать, срывать | to stop something from continuing normally | The strike *disrupted* train services. | Забастовка нарушила движение поездов.
- flatter | v | ˈflætə | ˈflætər | льстить | to praise someone too much, often insincerely | The courtiers *flattered* the king. | Придворные льстили королю.
- inflict | v | ɪnˈflɪkt | ˌɪnˈflɪkt | наносить, причинять | to cause something bad | The storm *inflicted* serious damage. | Буря нанесла серьёзный ущерб.
- instruct | v | ɪnˈstrʌkt |  | обучать; давать указания | to teach someone or tell them what to do | The coach *instructed* us to run three kilometres. | Тренер велел нам пробежать три километра.
- nominate | v | ˈnɒmɪneɪt | ˈnɑːməneɪt | выдвигать, номинировать | to suggest for a prize or job | She was *nominated* for an Oscar. | Её номинировали на «Оскар».
- nurture | v | ˈnɜːtʃə | ˈnɜːrtʃər | выращивать, заботиться | to look after and help to grow | The parents *nurture* their chicks for weeks. | Родители неделями выкармливают птенцов.
- plead | v | pliːd |  | умолять; заявлять (в суде) | to ask for something in an emotional way | She *pleaded* with the teacher to forgive her. | Она умоляла учителя простить её. | plead guilty — признать вину
- portray | v | pɔːˈtreɪ | pɔːrˈtreɪ | изображать | to show someone in a painting, film or book | The film *portrays* him as a hero. | В фильме он изображён героем.
- prescribe | v | prɪˈskraɪb |  | прописывать, назначать | to tell someone officially to take a medicine | The doctor *prescribed* painkillers. | Врач прописал обезболивающее. | prescription — рецепт
- 'query | n | ˈkwiəri | ˈkwiːri | запрос, вопрос | a question | If you have any *queries*, call us. | Если есть вопросы, звоните. | гл.: query — ставить под сомнение'
- ridicule | v | ˈrɪdɪkjuːl |  | высмеивать | to laugh at someone or something unkindly | Critics *ridiculed* the idea. | Критики высмеяли эту идею.
