title: Actions and movement
title_ru: Действия и движение
topic: actions
words:
- bind | v | baɪnd |  | связывать; обязывать | to tie tightly; to make someone keep a promise | The agreement *binds* both sides. | Соглашение обязывает обе стороны. | bind — bound — bound
- cling | v | klɪŋ |  | цепляться | to hold on tightly | The baby monkey *clung* to its mother. | Детёныш обезьяны цеплялся за мать. | cling — clung — clung
- grasp | v | ɡrɑːsp | ɡræsp | схватить, крепко держать; понять | to hold something firmly; to understand | She *grasped* my hand. | Она схватила меня за руку.
- grind | v | ɡraɪnd |  | молоть, перемалывать | to crush something into very small pieces or powder | She *grinds* fresh coffee every morning. | Каждое утро она мелет свежий кофе. | grind — ground — ground
- hack | v | hæk |  | рубить; взламывать (компьютер) | to cut roughly; to break into a computer system | He *hacked* at the branches with a knife. | Он рубил ветки ножом. | hacker — хакер
- haul | v | hɔːl |  | тащить, волочь | to pull something heavy with effort | They *hauled* their equipment up the slope. | Они тащили снаряжение вверх по склону.
- kidnap | v | ˈkɪdnæp |  | похищать (человека) | to take someone away by force and keep them | The businessman was *kidnapped* outside his office. | Бизнесмена похитили у его офиса.
- plunge | v | plʌndʒ |  | нырять, погружаться; резко падать | to move or fall suddenly downwards | The bird *plunged* into the sea to catch a fish. | Птица нырнула в море за рыбой.
- slam | v | slæm |  | захлопывать, хлопать | to close something with force and noise | She *slammed* the door and left. | Она хлопнула дверью и ушла.
- squeeze | v | skwiːz |  | сжимать, выжимать | to press something firmly | *Squeeze* the lemon over the fish. | Выжмите лимон на рыбу.
- stab | v | stæb |  | ударить ножом, вонзить | to push a knife into someone | The victim was *stabbed* in the arm. | Пострадавшего ударили ножом в руку.
- wipe | v | waɪp |  | вытирать | to clean something by rubbing it with a cloth | *Wipe* the table, please. | Вытри стол, пожалуйста.
