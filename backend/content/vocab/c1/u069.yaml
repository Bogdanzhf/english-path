title: Actions and movement
title_ru: Действия и движение
topic: actions
words:
- 'batter | n | ˈbætə | ˈbætər | жидкое тесто, кляр | a mix of flour, eggs and milk | Dip the fish in *batter*. | Обмакните рыбу в кляр. | гл.: batter — избивать'
- bind | v | baɪnd |  | связывать; обязывать | to tie tightly; to make someone keep a promise | The agreement *binds* both sides. | Соглашение обязывает обе стороны. | bind — bound — bound
- carve | v | kɑːv | kɑːrv | вырезать (по дереву, камню) | to cut wood or stone to make a shape | He *carved* a small bird from a piece of wood. | Он вырезал из куска дерева маленькую птичку.
- cling | v | klɪŋ |  | цепляться | to hold on tightly | The baby monkey *clung* to its mother. | Детёныш обезьяны цеплялся за мать. | cling — clung — clung
- 'clutch | v | klʌtʃ |  | сжимать, хвататься | to hold tightly | She *clutched* her bag. | Она вцепилась в сумку. | сущ.: clutch — сцепление'
- degrade | v | dɪˈɡreɪd |  | унижать; разрушать(ся) | to treat with no respect; to become worse | Plastic takes years to *degrade*. | Пластик разлагается годами.
- haul | v | hɔːl |  | тащить, волочь | to pull something heavy with effort | They *hauled* their equipment up the slope. | Они тащили снаряжение вверх по склону.
- kidnap | v | ˈkɪdnæp |  | похищать (человека) | to take someone away by force and keep them | The businessman was *kidnapped* outside his office. | Бизнесмена похитили у его офиса.
- malfunction | v | ˌmælˈfʌŋkʃən | mælˈfʌŋkʃən | давать сбой | to stop working properly | The machine *malfunctioned*. | Аппарат дал сбой.
- plunge | v | plʌndʒ |  | нырять, погружаться; резко падать | to move or fall suddenly downwards | The bird *plunged* into the sea to catch a fish. | Птица нырнула в море за рыбой.
- prod | v | prɒd | prɑːd | тыкать, подталкивать | to push with a finger or pointed object | She *prodded* him to wake him up. | Она ткнула его, чтобы разбудить.
- 'prop | n | prɒp | prɑːp | реквизит; опора | an object used in a play; a support | The actors used simple *props*. | Актёры использовали простой реквизит. | гл.: prop — подпирать'
- reap | v | riːp |  | пожинать | to get a result from work | You *reap* what you sow. | Что посеешь, то и пожнёшь.
- recharge | v | rɪˈtʃɑːdʒ | riːˈtʃɑːrdʒ | перезаряжать; восстанавливать силы | to fill a battery again; to rest | I need to *recharge* my phone. | Мне надо зарядить телефон.
- rupture | v | ˈrʌptʃə | ˈrʌptʃər | разрываться, лопаться | to break or burst suddenly | The pipe *ruptured* under the pressure. | Труба лопнула под давлением.
- slash | v | slæʃ |  | резать; резко сокращать | to cut; to reduce greatly | Prices have been *slashed*. | Цены резко снижены.
- sow | v | səʊ | soʊ | сеять | to plant seeds | Farmers *sow* rice in the spring. | Фермеры сеют рис весной. | sow — sowed — sown
- stab | v | stæb |  | ударить ножом, вонзить | to push a knife into someone | The victim was *stabbed* in the arm. | Пострадавшего ударили ножом в руку.
- tinker | v | ˈtɪŋkə | ˈtɪŋkər | возиться (с механизмом) | to make small changes to fix something | He likes *tinkering* with old cars. | Он любит возиться со старыми машинами.
- 'wrench | v | rentʃ |  | дёргать, вырывать | to pull hard | She *wrenched* the door open. | Она рывком открыла дверь. | сущ.: wrench — гаечный ключ'
