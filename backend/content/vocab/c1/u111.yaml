title: Thinking and opinions
title_ru: Мысли и мнения
topic: mind
words:
- consciousness | n | ˈkɒnʃəsnəs | ˈkɑːnʃəsnəs | сознание | being awake and aware | He lost *consciousness*. | Он потерял сознание.
- conviction | n | kənˈvɪkʃən |  | убеждённость; судимость | a strong belief; a guilty verdict | She spoke with *conviction*. | Она говорила убеждённо.
- detection | n | dɪˈtekʃən |  | обнаружение | finding | Early *detection* of cancer saves lives. | Раннее выявление рака спасает жизни.
- extravagance | n | ɪkˈstrævəɡəns | ekˈstrævəɡəns | расточительность, сумасбродство | spending too much | Buying a yacht was pure *extravagance*. | Покупка яхты была чистым транжирством.
- faculty | n | ˈfæklti |  | способность; факультет | a natural ability; a department of a university | Elephants have an amazing *faculty* for memory. | У слонов удивительная способность к запоминанию.
- grounds | n | ɡraʊndz |  | основания; территория | reasons; land around a building | He was dismissed on the *grounds* of misconduct. | Его уволили за ненадлежащее поведение.
- ideology | n | ˌaɪdiˈɒlədʒi | ˌaɪdiˈɑːlədʒi | идеология | a set of ideas that a political or economic system is based on | The party has a clear *ideology*. | У партии чёткая идеология.
- ignorance | n | ˈɪɡnərəns |  | невежество, незнание | lack of knowledge | Fear often comes from *ignorance*. | Страх часто рождается из незнания.
- intent | n | ɪnˈtent |  | намерение | intention | He was charged with *intent* to steal. | Ему предъявили обвинение в умысле на кражу.
- layout | n | ˈleɪaʊt |  | планировка, макет | the arrangement of things | I like the *layout* of the flat. | Мне нравится планировка квартиры.
- monotony | n | məˈnɒtəni | məˈnɑːtəni | однообразие | boring sameness | I hate the *monotony* of my job. | Ненавижу однообразие своей работы.
- naivety | n | naɪˈiːvɪti |  | наивность | being naive | His *naivety* is charming. | Его наивность очаровательна.
- oddity | n | ˈɒdɪti | ˈɑːdəti | странность, чудак | something strange | The building is an architectural *oddity*. | Здание — архитектурная диковинка.
- outlook | n | ˈaʊtlʊk |  | взгляд, мировоззрение; перспектива | a person's general attitude; what is likely to happen | She has a positive *outlook* on life. | У неё позитивный взгляд на жизнь.
- pathos | n | ˈpeɪθɒs | ˈpeɪθɑːs | пафос, трогательность | a quality that makes people feel sad | The film is full of *pathos*. | Фильм очень трогательный.
- plausibility | n | ˌplɔːzəˈbɪlɪti | ˌplɔːzɪˈbɪlɪti | правдоподобие | being believable | I doubt the *plausibility* of his story. | Я сомневаюсь в правдоподобности его рассказа.
- quest | n | kwest |  | поиск, стремление | a long search | His *quest* for fame never ended. | Его погоня за славой не заканчивалась.
- representation | n | ˌreprɪˈzenˈteɪʃən | ˌreprəzenˈteɪʃən | представительство; изображение | speaking for others; a depiction | Women need more *representation* in politics. | Женщинам нужно больше представительства в политике.
- testament | n | ˈtestəmənt |  | свидетельство; завещание | proof of something; a will | The house is a *testament* to their hard work. | Дом — свидетельство их упорного труда.
