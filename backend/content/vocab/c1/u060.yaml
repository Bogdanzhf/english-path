topic: describing
words:
- gracious | adj | ˈɡreɪʃəs |  | любезный, благосклонный | kind, polite and generous | She was a *gracious* host. | Она была радушной хозяйкой.
- ingenious | adj | ɪnˈdʒiːniəs |  | изобретательный, остроумный | very clever and original | It was an *ingenious* solution. | Это было остроумное решение. | не путайте с ingenuous — простодушный
