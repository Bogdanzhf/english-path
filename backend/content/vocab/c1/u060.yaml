- 'brief | v | briːf |  | инструктировать | to give instructions or information | The officer *briefed* the soldiers. | Офицер проинструктировал солдат. | сущ.: briefing — брифинг'
- 'bypass | v | ˈbaɪpɑːs | ˈbaɪpæs | обходить, объезжать | to go around | We *bypassed* the city centre. | Мы объехали центр города. | сущ.: bypass — объездная дорога; шунтирование'
