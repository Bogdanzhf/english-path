title: Everyday phrases
title_ru: Разговорные фразы
topic: phrases
words:
- by means of something | phr |  |  | посредством, с помощью | using | They crossed the river *by means of* a rope. | Они переправились через реку с помощью верёвки.
- by no means | phr |  |  | ни в коем случае, вовсе не | not at all | It's *by no means* easy. | Это вовсе не легко.
- call on somebody | phr |  |  | призывать; навещать | to ask formally; to visit | I *call on* everyone to help. | Призываю всех помочь.
- consistent with something | phr |  |  | согласующийся с | in agreement with | His story is *consistent with* the evidence. | Его рассказ согласуется с уликами.
- dedicated to something | phr |  |  | посвящённый, преданный (чему-либо) | committed to | She's *dedicated to* her work. | Она предана своей работе.
- deprive somebody/something of something | phr |  |  | лишать (чего-либо) | to take away something needed | The noise *deprived* me of sleep. | Шум лишил меня сна.
- dispose of somebody/something | phr |  |  | избавляться от, утилизировать | to get rid of | How do I *dispose of* old batteries? | Куда девать старые батарейки?
- follow something up | phr |  |  | проследить, развить | to take further action | I'll *follow up* your complaint. | Я займусь вашей жалобой.
- for that matter | phr |  |  | если на то пошло | and also | I don't like him, or his brother *for that matter*. | Мне не нравится он, да и его брат, если на то пошло.
- for the benefit of somebody | phr |  |  | ради, для пользы | to help | I'll repeat it *for the benefit of* latecomers. | Повторю для опоздавших.
- for the sake of somebody/something | phr |  |  | ради | in order to help or get | Stop *for the sake of* your health. | Остановись ради своего здоровья.
- given that... | phr |  |  | учитывая, что | considering that | *Given that* he's new, he did well. | Учитывая, что он новенький, он справился хорошо.
- have nothing to do with somebody/something | phr |  |  | не иметь отношения к | to not be connected with | It *has nothing to do with* you. | Это тебя не касается.
- have somebody/something in mind | phr |  |  | иметь в виду, задумать | to be thinking of | Who do you have *in mind* for the job? | Кого ты имеешь в виду на эту должность?
- in a position to do something | phr |  |  | в состоянии (что-то сделать) | able to | I'm not *in a position to* help. | Я не в состоянии помочь.
- in accordance with something | phr |  |  | в соответствии с | following a rule | *In accordance with* the law, we must close. | Согласно закону, мы должны закрыться.
- in any case | phr |  |  | в любом случае | whatever happens | *In any case*, I'll call you. | В любом случае я тебе позвоню.
- in conjunction with somebody/something | phr |  |  | совместно с | together with | The event is run *in conjunction with* the museum. | Мероприятие проводится совместно с музеем.
