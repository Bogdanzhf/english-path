title: Feelings and character
title_ru: Чувства и характер
topic: feelings
words:
- alienate | v | ˈeɪliəneɪt | ˈeɪljəneɪt | отталкивать, отчуждать | to make someone feel unfriendly or separate | His rudeness *alienated* his friends. | Его грубость оттолкнула друзей.
- appall | v | əˈpɔːl |  | ужасать, шокировать | to shock someone very much | She was *appalled* by the conditions in the hospital. | Условия в госпитале привели её в ужас. | брит. appal
- detest | v | dɪˈtest | diːˈtest | ненавидеть, питать отвращение | to hate | I *detest* cold weather. | Терпеть не могу холод.
- dismay | n | dɪˈsmeɪ | dɪsˈmeɪ | смятение, испуг | worry and disappointment | To my *dismay*, the shop was closed. | К моему огорчению, магазин был закрыт.
- dither | v | ˈdɪðə | ˈdɪðər | колебаться, мешкать | to be unable to decide | Stop *dithering* and choose! | Хватит колебаться, выбирай!
- enchant | v | ɪnˈtʃɑːnt | ɪnˈtʃænt | очаровывать | to charm or delight someone | The children were *enchanted* by the story. | Дети были очарованы историей.
- evoke | v | ɪˈvəʊk | ɪˈvoʊk | вызывать (воспоминания, чувства) | to bring a feeling or memory into the mind | The smell *evoked* memories of childhood. | Запах пробудил воспоминания детства.
- glum | adj | ɡlʌm |  | мрачный, унылый | sad | Why are you looking so *glum*? | Почему у тебя такой унылый вид?
- harass | v | ˈhærəs | həˈræs | преследовать, донимать | to annoy or upset someone repeatedly | The journalist was *harassed* by online trolls. | Журналиста донимали интернет-тролли. | harassment — домогательства, преследование
- intimidate | v | ɪnˈtɪmɪdeɪt |  | запугивать | to frighten someone so they do what you want | Don't let the exam *intimidate* you. | Не позволяй экзамену себя запугать.
- obsess | v | əbˈses |  | быть одержимым | to think about something all the time | Many teenagers *obsess* over the latest trends. | Многие подростки одержимы последними трендами.
- outrage | v | aʊtˈreɪdʒ |  | возмущать | to make someone very angry and shocked | The decision *outraged* the public. | Решение возмутило общественность. | сущ. outrage [ˈaʊtreɪdʒ] — возмущение
- provoke | v | prəˈvəʊk | prəˈvoʊk | провоцировать, вызывать | to cause a reaction, especially anger | His comments *provoked* outrage. | Его слова вызвали возмущение.
- reassure | v | ˌriːəʃˈjɔː | ˌriəˈʃʊr | успокаивать, заверять | to make less worried | The doctor *reassured* me. | Врач меня успокоил.
- remorseless | adj | rɪˈmɔːsləs | rɪˈmɔːrsləs | безжалостный | without pity | He was a *remorseless* killer. | Он был безжалостным убийцей.
- resent | v | rɪˈzent |  | возмущаться, обижаться | to feel angry about something unfair | The crew *resented* being blamed. | Экипаж был возмущён тем, что его обвинили.
- revere | v | rɪˈviə | rɪˈvɪr | почитать, благоговеть | to respect deeply | He is *revered* as a hero. | Его почитают как героя.
- scornful | adj | ˈskɔːnfl | ˈskɔːrnfl | презрительный | showing contempt | She gave a *scornful* laugh. | Она презрительно рассмеялась.
- torment | v | tɔːˈment | tɔːrˈment | мучить | to make someone suffer | He was *tormented* by guilt. | Его мучило чувство вины.
- unsettle | v | ʌnˈsetl |  | тревожить, выбивать из колеи | to make someone feel worried or uncomfortable | The documentary *unsettled* many viewers. | Документальный фильм встревожил многих зрителей.
- worship | v | ˈwɜːʃɪp | ˈwɜːrʃɪp | поклоняться; обожать | to show respect and love for a god; to love someone very much | The ancient Greeks *worshipped* many gods. | Древние греки поклонялись многим богам.
