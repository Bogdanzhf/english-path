title: Actions and movement
title_ru: Действия и движение
topic: actions
words:
- adjoin | v | əˈdʒɔɪn |  | примыкать, граничить | to be next to and joined to | The farm *adjoins* the river. | Ферма примыкает к реке.
- clench | v | klentʃ |  | сжимать (кулаки, зубы) | to close tightly | He *clenched* his fists. | Он сжал кулаки.
- constrain | v | kənˈstreɪn |  | ограничивать, сдерживать | to limit what someone can do | Our research was *constrained* by a lack of funding. | Наши исследования ограничивала нехватка финансирования.
- debut | n | ˈdeɪbjuː |  | дебют | a first public appearance | She made her *debut* at 16. | Она дебютировала в 16 лет.
- deform | v | dɪˈfɔːm | dɪˈfɔːrm | деформировать | to change the normal shape of something | Cheap shoes can *deform* your feet. | Дешёвая обувь может деформировать стопы.
- dissect | v | ˈdaɪsekt | daɪˈsekt | препарировать; тщательно анализировать | to cut up to study; to examine in detail | We *dissected* a frog in biology. | На биологии мы препарировали лягушку.
- embed | v | ɪmˈbed |  | внедрять, встраивать | to fix firmly inside | The video is *embedded* in the page. | Видео встроено в страницу.
- engrave | v | ɪnˈɡreɪv |  | гравировать, вырезать | to cut words or pictures into a hard surface | Each weapon was *engraved* with the maker's name. | На каждом оружии было выгравировано имя мастера.
- forge | v | fɔːdʒ | fɔːrdʒ | ковать; подделывать | to make metal objects by heating; to make an illegal copy | He *forged* a sword from a piece of iron. | Он выковал меч из куска железа.
- glean | v | ɡliːn |  | собирать (по крупицам) | to collect information slowly | I *gleaned* some facts from the report. | Я почерпнул некоторые факты из отчёта.
- graze | v | ɡreɪz |  | пастись | (of animals) to eat grass | Cows were *grazing* in the field. | Коровы паслись на поле.
- mingle | v | ˈmɪŋɡl |  | смешиваться; общаться | to mix with people | She *mingled* with the guests. | Она общалась с гостями.
- misplace | v | ˌmɪsˈpleɪs |  | положить не на место, потерять | to lose something because you can't remember where you put it | I've *misplaced* my glasses again. | Я опять куда-то задевал очки.
- neutralise | v | ˈnjuːtrəlaɪz | njˈuːtrəlaɪz | нейтрализовать | to stop having an effect | The drug *neutralises* the poison. | Лекарство нейтрализует яд. | амер. neutralize
- propel | v | prəˈpel |  | продвигать, толкать вперёд | to push something forward | Social media has *propelled* the growth of fast fashion. | Соцсети подстегнули рост быстрой моды.
- repel | v | rɪˈpel |  | отталкивать; отражать (атаку) | to keep away | This spray *repels* mosquitoes. | Этот спрей отпугивает комаров.
- sever | v | ˈsevə | ˈsevər | отрезать, разрывать | to cut through completely; to end a relationship | He *severed* all ties with the art world. | Он разорвал все связи с миром искусства.
- spark | v | spɑːk | spɑːrk | вызывать, порождать | to cause | The decision *sparked* protests. | Решение вызвало протесты.
- 'sprawl | v | sprɔːl |  | раскинуться, растянуться | to lie or spread out | The city *sprawls* for miles. | Город раскинулся на много миль. | сущ.: urban sprawl — разрастание городов'
- unveil | v | ʌnˈveɪl | ənˈveɪl | открывать, представлять (впервые) | to show publicly for the first time | The company *unveiled* its new phone. | Компания представила новый телефон.
