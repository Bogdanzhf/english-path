title: People and relationships
title_ru: Люди и отношения
topic: people
words:
- advocate | n | ˈædvəkət |  | сторонник, защитник; адвокат | a person who publicly supports an idea | She's a strong *advocate* of free education. | Она горячая сторонница бесплатного образования. | гл. advocate [ˈædvəkeɪt] — выступать за
- ageing population | n | ˈeɪdʒɪŋ ˌpɒpjʊˈleɪʃən | ˈeɪdʒɪŋ ˌpɑːpjəˈleɪʃən | стареющее население | a population with more old people | Japan has an *ageing population*. | В Японии стареющее население. | амер. aging
- birth rate | n | bɜːθ reɪt | bɜːrθ reɪt | рождаемость | the number of births per year | The *birth rate* has fallen. | Рождаемость снизилась.
- carrier | n | ˈkærɪə | ˈkæriːər | перевозчик; носитель | a company that transports; a person who carries a disease | The airline is a low-cost *carrier*. | Эта авиакомпания — лоукостер.
- childcare | n | ˈtʃaɪldkeə | ˈtʃaɪldker | уход за детьми | looking after children | *Childcare* is very expensive. | Присмотр за детьми стоит очень дорого.
- civilian | n | səˈvɪliən |  | мирный житель, гражданское лицо | a person who is not in the army or police | Many *civilians* were killed in the war. | На войне погибло много мирных жителей.
- commissioner | n | kəˈmɪʃənə | kəˈmɪʃənər | уполномоченный, комиссар | an official in charge of a government department | The police *commissioner* resigned. | Комиссар полиции подал в отставку.
- dependants | n | dɪˈpendənts | dɪpˈendənts | иждивенцы | people who depend on you for money | Do you have any *dependants*? | У вас есть иждивенцы? | амер. dependents
- dependent | n | dɪˈpendənt |  | иждивенец (амер.) | a person who depends on you for money | He has three *dependents*. | У него трое иждивенцев. | брит. dependant
- devil | n | ˈdevl |  | дьявол, чёрт | an evil spirit | People said the old house was full of *devils*. | Люди говорили, что в старом доме водятся черти.
- entrant | n | ˈentrənt |  | участник; поступающий | a person who enters a competition or a job | There were 200 *entrants* in the race. | В забеге было 200 участников.
- generation gap | n | ˌdʒenəˈreɪʃən ɡæp |  | разрыв между поколениями | differences between young and old | There's a big *generation gap* in our family. | В нашей семье большая разница поколений.
- idiot | n | ˈɪdiət |  | идиот, дурак | a stupid person | I felt like an *idiot* when I fell over. | Я почувствовал себя полным дураком, когда упал.
- juvenile | adj | ˈdʒuːvənaɪl |  | несовершеннолетний; ребяческий | young; childish | He was sent to a *juvenile* court. | Его дело рассматривал суд по делам несовершеннолетних.
- motorist | n | ˈməʊtərɪst | ˈmoʊtərɪst | автомобилист | a car driver | *Motorists* are warned about ice. | Водителей предупреждают о гололёде.
- nursing home | n | ˈnɜːsɪŋ həʊm | ˈnɜːrsɪŋ hoʊm | дом престарелых | a home for old people who need care | Her grandmother lives in a *nursing home*. | Её бабушка живёт в доме престарелых.
- parental guidance | n | pəˈrentl ˈɡaɪdəns |  | под присмотром родителей (возрастная метка) | a rating meaning children need adults' advice | The film is rated PG — *parental guidance*. | Фильм с пометкой PG — детям в сопровождении родителей.
- 'premier | n | ˈpremɪə | preˈmɪr | премьер-министр | a prime minister | The *Premier* visited China. | Премьер посетил Китай. | прил.: premier — ведущий, первый'
- senator | n | ˈsenətə | ˈsenətər | сенатор | a member of a senate, a part of government | The *senator* visited the flooded town. | Сенатор посетил затопленный город.
- sibling rivalry | n | ˈsɪblɪŋ ˈraɪvəlri |  | соперничество между братьями и сёстрами | competition between brothers and sisters | *Sibling rivalry* is normal. | Соперничество между детьми в семье — это нормально.
- villager | n | ˈvɪlɪdʒə | ˈvɪlɪdʒər | сельский житель | a person who lives in a village | The *villagers* welcomed us. | Жители деревни радушно нас встретили.
- widow | n | ˈwɪdəʊ | ˈwɪdoʊ | вдова | a woman whose husband has died | She's been a *widow* for ten years. | Она вдова уже десять лет.
