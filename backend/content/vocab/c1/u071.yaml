title: Society and politics
title_ru: Общество и политика
topic: society
words:
- administer | v | ədˈmɪnɪstə | ədˈmɪnɪstər | вводить (лекарство); управлять | to give someone medicine; to manage | The nurse *administered* the injection. | Медсестра сделала укол.
- 'breach | n | briːtʃ |  | нарушение; брешь | breaking a rule; a hole | It''s a *breach* of contract. | Это нарушение договора. | гл.: breach — нарушать'
- comply | v | kəmˈplaɪ |  | подчиняться, соблюдать | to obey a rule | You must *comply* with the rules. | Вы обязаны соблюдать правила.
- cooperate | v | kəʊˈɒpəreɪt | koʊˈɑːpəreɪt | сотрудничать | to work together with someone towards a shared aim | The two countries agreed to *cooperate* on security. | Две страны договорились сотрудничать в области безопасности.
- curb | v | kɜːb | kɜːrb | обуздывать, сдерживать | to control or limit something bad | The government took steps to *curb* inflation. | Правительство приняло меры, чтобы сдержать инфляцию.
- discharge | v | dɪsˈtʃɑːdʒ | dɪsˈtʃɑːrdʒ | выписывать (из больницы); увольнять; выпускать | to allow to leave; to release | He was *discharged* from hospital. | Его выписали из больницы.
- endorse | v | ɪnˈdɔːs | ɪnˈdɔːrs | одобрять, поддерживать (публично) | to say publicly that you support someone or something | The plan was *endorsed* by the government. | План одобрило правительство.
- enforce | v | ɪnˈfɔːs | ɪnˈfɔːrs | обеспечивать соблюдение (закона) | to make people obey a law or rule | The police *enforce* the speed limit. | Полиция следит за соблюдением скоростного режима.
- execute | v | ˈeksɪkjuːt |  | казнить; выполнять | to kill someone as a legal punishment; to carry out a plan | The plan was *executed* perfectly. | План был выполнен безупречно.
- foster | v | ˈfɒstə | ˈfɑːstər | развивать, поощрять; воспитывать (приёмного ребёнка) | to help something develop; to look after a child that isn't yours | The program aims to *foster* creativity in children. | Программа направлена на развитие творческих способностей у детей.
- indulge | v | ɪnˈdʌldʒ | ˌɪnˈdʌldʒ | баловать; позволять себе | to allow yourself something pleasant | I *indulged* in a piece of cake. | Я побаловал себя кусочком торта.
- interfere | v | ˌɪntəˈfɪə | ˌɪntərˈfɪr | вмешиваться, мешать | to get involved in a situation where you are not wanted | Please don't *interfere* in my life. | Пожалуйста, не вмешивайся в мою жизнь. | interfere with/in
- intervene | v | ˌɪntəˈviːn | ˌɪntərˈviːn | вмешиваться | to become involved in a situation to stop or change it | A passer-by *intervened* to stop the fight. | Прохожий вмешался, чтобы прекратить драку.
- manipulate | v | məˈnɪpjuleɪt |  | манипулировать | to control someone or something dishonestly | They *manipulated* the figures to hide the losses. | Они подтасовали цифры, чтобы скрыть убытки.
- raid | v | reɪd |  | совершать облаву, налёт | to make a sudden attack or search of a place | Police *raided* the building at dawn. | Полиция на рассвете устроила облаву в здании.
- salvage | v | ˈsælvɪdʒ | ˈsælvədʒ | спасать (имущество) | to save from damage | They *salvaged* what they could from the fire. | Они спасли от огня то, что смогли.
- strive | v | straɪv |  | стремиться | to try very hard | We *strive* for excellence. | Мы стремимся к совершенству.
- venture | v | ˈventʃə | ˈventʃər | рисковать, отважиться пойти | to go somewhere dangerous or new | They *ventured* into the dark forest. | Они отважились пойти в тёмный лес. | сущ. venture — рискованное предприятие
- woo | v | wuː |  | добиваться (расположения) | to try to attract | The company is *wooing* new customers. | Компания переманивает новых клиентов.
