title: Society and politics
title_ru: Общество и политика
topic: society
words:
- administer | v | ədˈmɪnɪstə | ədˈmɪnɪstər | вводить (лекарство); управлять | to give someone medicine; to manage | The nurse *administered* the injection. | Медсестра сделала укол.
- 'breach | n | briːtʃ |  | нарушение; брешь | breaking a rule; a hole | It''s a *breach* of contract. | Это нарушение договора. | гл.: breach — нарушать'
- comply | v | kəmˈplaɪ |  | подчиняться, соблюдать | to obey a rule | You must *comply* with the rules. | Вы обязаны соблюдать правила.
- cooperate | v | kəʊˈɒpəreɪt | koʊˈɑːpəreɪt | сотрудничать | to work together with someone towards a shared aim | The two countries agreed to *cooperate* on security. | Две страны договорились сотрудничать в области безопасности.
- curb | v | kɜːb | kɜːrb | обуздывать, сдерживать | to control or limit something bad | The government took steps to *curb* inflation. | Правительство приняло меры, чтобы сдержать инфляцию.
- discharge | v | dɪsˈtʃɑːdʒ | dɪsˈtʃɑːrdʒ | выписывать (из больницы); увольнять; выпускать | to allow to leave; to release | He was *discharged* from hospital. | Его выписали из больницы.
- endorse | v | ɪnˈdɔːs | ɪnˈdɔːrs | одобрять, поддерживать (публично) | to say publicly that you support someone or something | The plan was *endorsed* by the government. | План одобрило правительство.
- enforce | v | ɪnˈfɔːs | ɪnˈfɔːrs | обеспечивать соблюдение (закона) | to make people obey a law or rule | The police *enforce* the speed limit. | Полиция следит за соблюдением скоростного режима.
- execute | v | ˈeksɪkjuːt |  | казнить; выполнять | to kill someone as a legal punishment; to carry out a plan | The plan was *executed* perfectly. | План был выполнен безупречно.
- foster | v | ˈfɒstə | ˈfɑːstər | развивать, поощрять; воспитывать (приёмного ребёнка) | to help something develop; to look after a child that isn't yours | The program aims to *foster* creativity in children. | Программа направлена на развитие творческих способностей у детей.
- indulge | v | ɪnˈdʌldʒ | ˌɪnˈdʌldʒ | баловать; позволять себе | to allow yourself something pleasant | I *indulged* in a piece of cake. | Я побаловал себя кусочком торта.
- interfere | v | ˌɪntəˈfɪə | ˌɪntərˈfɪr | вмешиваться, мешать | to get involved in a situation where you are not wanted | Please don't *interfere* in my life. | Пожалуйста, не вмешивайся в мою жизнь. | interfere with/in
- intervene | v | ˌɪntəˈviːn | ˌɪntərˈviːn | вмешиваться | to become involved in a situation to stop or change it | A passer-by *intervened* to stop the fight. | Прохожий вмешался, чтобы прекратить драку.
- manipulate | v | məˈnɪpjuleɪt |  | манипулировать | to control someone or something dishonestly | They *manipulated* the figures to hide the losses. | Они подтасовали цифры, чтобы скрыть убытки.
- raid | v | reɪd |  | совершать облаву, налёт | to make a sudden attack or search of a place | Police *raided* the building at dawn. | Полиция на рассвете устроила облаву в здании.
- salvage | v | ˈsælvɪdʒ | ˈsælvədʒ | спасать (имущество) | to save from damage | They *salvaged* what they could from the fire. | Они спасли от огня то, что смогли.
- strive | v | straɪv |  | стремиться | to try very hard | We *strive* for excellence. | Мы стремимся к совершенству.
- venture | v | ˈventʃə | ˈventʃər | рисковать, отважиться пойти | to go somewhere dangerous or new | They *ventured* into the dark forest. | Они отважились пойти в тёмный лес. | сущ. venture — рискованное предприятие
- woo | v | wuː |  | добиваться (расположения) | to try to attract | The company is *wooing* new customers. | Компания переманивает новых клиентов.
reading:
  title: The Bystander Effect
  title_ru: Эффект свидетеля
  text: |
    In March 1964, a young woman named Kitty Genovese was attacked and killed outside her apartment in New York. Two weeks later, the New York Times published a shocking account of the crime. It claimed that thirty-eight witnesses had watched or heard the attack, and that not one of them had called the police. The newspaper proclaimed it a sign that city life had made people cold and selfish.

    The story horrified the nation and inspired two psychologists, John Darley and Bibb Latané, to investigate why people fail to intervene. In a series of landmark experiments, they discovered what is now called the "bystander effect". When people are alone and see someone in trouble, they usually help. But when there are many people present, each person is less likely to act. Everyone assumes that someone else will do something. The responsibility is spread across the crowd until no one feels obliged to help.

    However, later research revealed that the original newspaper account was seriously inaccurate. Many of the thirty-eight "witnesses" had only heard noises and didn't realize a crime was happening. At least two neighbours did call the police, and one woman rushed outside and held Kitty in her arms as she died. The story of complete indifference was simply false. Some historians believe that the reporters concealed or ignored facts to create a more memorable story.

    The attacker was caught and sentenced to life in prison. But the case had a positive legacy. It encouraged cities to create a single emergency number, 911, in the United States. It also inspired training programmes that teach people how to overcome the bystander effect — for example, by pointing at one specific person and saying, "You, call an ambulance!"

    Today, studies of real situations, recorded by security cameras, suggest that people help more often than we think. In about ninety percent of public conflicts, at least one person intervenes. When a crisis happens, communities often rally together, and many people volunteer their time and resources. Perhaps we are kinder than the old story suggested.
  ru: |
    В марте 1964 года молодая женщина по имени Китти Дженовезе подверглась нападению и была убита у своего дома в Нью-Йорке. Через две недели газета New York Times опубликовала шокирующий рассказ о преступлении. В нём утверждалось, что тридцать восемь свидетелей видели или слышали нападение и ни один из них не позвонил в полицию. Газета объявила это признаком того, что городская жизнь сделала людей холодными и эгоистичными.

    История потрясла страну и вдохновила двух психологов, Джона Дарли и Бибба Латане, выяснить, почему люди не вмешиваются. В серии ставших классикой экспериментов они обнаружили то, что сейчас называют «эффектом свидетеля». Когда человек один и видит, что кто-то в беде, он обычно помогает. Но когда вокруг много людей, каждый с меньшей вероятностью начнёт действовать. Все считают, что кто-то другой что-нибудь сделает. Ответственность распределяется по толпе, пока никто уже не чувствует себя обязанным помочь.

    Однако позднейшие исследования показали, что исходный газетный рассказ был сильно неточен. Многие из тридцати восьми «свидетелей» лишь слышали шум и не поняли, что происходит преступление. По меньшей мере двое соседей всё же позвонили в полицию, а одна женщина выбежала на улицу и держала Китти на руках, пока та умирала. История о полном равнодушии оказалась попросту ложной. Некоторые историки считают, что репортёры скрыли или проигнорировали факты, чтобы история лучше запоминалась.

    Нападавшего поймали и приговорили к пожизненному заключению. Но у этого дела было и положительное наследие. Оно подтолкнуло к созданию в США единого номера экстренных служб — 911. Оно также вдохновило программы обучения, которые учат людей преодолевать эффект свидетеля — например, указать на конкретного человека и сказать: «Вы, вызовите скорую!»

    Сегодня исследования реальных ситуаций, записанных камерами наблюдения, показывают, что люди помогают чаще, чем мы думаем. Примерно в девяноста процентах публичных конфликтов хотя бы один человек вмешивается. Когда случается беда, люди часто сплачиваются, и многие добровольно отдают своё время и ресурсы. Возможно, мы добрее, чем предполагала старая история.
  questions:
  - q: What did the New York Times claim about the witnesses?
    options:
    - They all helped
    - Thirty-eight people watched and nobody called the police
    - There were no witnesses
    - They caught the attacker
    answer: 1
  - q: What is the 'bystander effect'?
    options:
    - People help more in groups
    - People are less likely to help when many others are present
    - People always call the police
    - Witnesses forget what they saw
    answer: 1
  - q: What did later research show?
    options:
    - The newspaper account was accurate
    - The newspaper account was seriously inaccurate
    - There were more witnesses
    - Nobody heard anything
    answer: 1
  - tf: The case helped lead to the creation of the 911 emergency number.
    answer: true
  - tf: Modern studies show people almost never intervene in public conflicts.
    answer: false
