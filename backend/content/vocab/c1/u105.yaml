title: Thinking and opinions
title_ru: Мысли и мнения
topic: mind
words:
- availability | n | əˌveɪləˈbɪlɪti | əˌveɪləˈbɪləti | наличие, доступность | being available | Check the *availability* of rooms. | Проверьте наличие свободных номеров.
- bass | n | beɪs |  | бас; бас-гитара | the lowest musical part | He plays *bass* in a band. | Он играет на бас-гитаре в группе.
- benchmark | n | ˈbentʃmɑːk | ˈbentʃmɑːrk | эталон, ориентир | a standard for comparison | The test is a *benchmark* for quality. | Тест служит эталоном качества.
- bulk | n | bʌlk |  | основная масса, большая часть; объём | the main part; large size | The *bulk* of the supplies was left behind. | Основную часть припасов оставили позади. | in bulk — оптом
- capability | n | ˌkeɪpəˈbɪlɪti | ˌkeɪpəˈbɪləti | способность, возможность | the ability to do something | The phone has video *capability*. | Телефон умеет снимать видео.
- chill | n | tʃɪl |  | холод, озноб | a feeling of cold | There's a *chill* in the air this morning. | Сегодня утром в воздухе прохлада. | catch a chill — простудиться
- deficit | n | ˈdefɪsɪt | ˈdefəsət | дефицит | the amount by which something is too small | The country has a budget *deficit*. | У страны дефицит бюджета.
- density | n | ˈdensɪti | ˈdensəti | плотность | how crowded or heavy something is | The city has a high population *density*. | В городе высокая плотность населения.
- ease | n | iːz |  | лёгкость, непринуждённость | the state of being easy or relaxed | She passed the exam with *ease*. | Она с лёгкостью сдала экзамен. | at ease — непринуждённо
- entity | n | ˈentɪti | ˈentəti | сущность; организация | something that exists separately | The two companies are separate *entities*. | Эти две компании — отдельные юрлица.
- intensity | n | ɪnˈtensɪti | ɪnˈtensəti | интенсивность, сила | strength | The storm grew in *intensity*. | Буря усиливалась.
- jurisdiction | n | ˌdʒʊərɪsˈdɪkʃn | ˌdʒʊrɪsˈdɪkʃn | юрисдикция | the official power to make legal decisions | The island is under Chilean *jurisdiction*. | Остров находится под юрисдикцией Чили.
- merit | n | ˈmerɪt |  | достоинство, заслуга | a good quality that deserves praise | The plan has some *merit*. | В этом плане есть свои плюсы.
- momentum | n | məʊˈmentəm | moʊˈmentəm | импульс, движущая сила | the force of movement | The campaign is gaining *momentum*. | Кампания набирает обороты.
- odds | n | ɒdz | ɑːdz | шансы | the chances of something | The *odds* are against us. | Шансы не в нашу пользу. | against all odds — вопреки всему
- patch | n | pætʃ |  | заплатка; участок; пятно | a piece of cloth; a small area | There's a *patch* of ice on the road. | На дороге участок гололёда.
- privilege | n | ˈprɪvəlɪdʒ |  | привилегия | a special right or advantage | Cheap clothing is a *privilege* paid for by others. | Дешёвая одежда — привилегия, за которую платят другие.
- sin | n | sɪn |  | грех | something wrong according to religious rules | Lying is a *sin* in many religions. | Во многих религиях ложь считается грехом.
- stability | n | stəˈbɪlɪti |  | стабильность | being steady | The country needs political *stability*. | Стране нужна политическая стабильность.
- validate | v | ˈvælɪdeɪt |  | подтверждать; одобрять | to prove something is true; to make someone feel their feelings are accepted | 'Likes' make many users feel *validated*. | Лайки дают многим пользователям ощущение одобрения.
