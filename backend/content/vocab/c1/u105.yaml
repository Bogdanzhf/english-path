reading:
  title: An Old Idea Comes Back
  title_ru: Старая идея возвращается
  text: |
    Electric cars may seem like a modern phenomenon, but they are older than you might think. In 1900, electric vehicles made up about a third of all cars on the roads of American cities. They were quiet, clean and easy to drive. Unlike petrol cars, which had to be started with a heavy handle and often broke down, electric cars simply started at the touch of a button. They were especially popular with wealthy city dwellers.

    So why did they disappear? Several factors changed the course of history. Henry Ford's mass-produced Model T made petrol automobiles far cheaper. The invention of the electric starter removed the need for a hand crank. Huge oil discoveries made petrol cheap, and new roads allowed people to travel long distances — far beyond the range of the heavy batteries of the time. By the 1930s, electric cars had almost vanished. The petrol era had begun.

    For decades, the idea of an electric car was treated as a joke. In the 1990s, a major carmaker produced an electric model in California but later recalled and destroyed most of them. Its corporate reasons remain a subject of debate. When a small company called Tesla announced in the early 2000s that it would build exciting electric sports cars, many experts ridiculed the plan.

    Today, the situation has changed dramatically. As concern grows about how petrol and diesel cars pollute the air and contribute to climate change, governments have introduced strict guidelines on emissions. Many countries plan to stop selling new petrol cars in the coming decades. Battery technology has been enhanced so much that some electric cars can travel over 600 kilometres on a single charge. Companies are incorporating new features: some cars have solar panels on the roof, while drivers interact with their vehicles through apps on their mobile phones.

    Challenges remain. Charging stations need to be available at regular intervals, and mining for battery materials raises its own environmental questions. Still, there is a striking parallel with the past: once again, the electric car is a serious candidate to become the future of transportation.
  ru: |
    Электромобили могут показаться современным явлением, но они старше, чем вы думаете. В 1900 году электромобили составляли около трети всех машин на улицах американских городов. Они были тихими, чистыми и простыми в управлении. В отличие от бензиновых машин, которые приходилось заводить тяжёлой рукояткой и которые часто ломались, электромобили просто заводились нажатием кнопки. Особенно они нравились состоятельным горожанам.

    Почему же они исчезли? Ход истории изменили несколько факторов. Массовая «Модель Т» Генри Форда сделала бензиновые автомобили гораздо дешевле. Изобретение электростартера избавило от необходимости заводить мотор рукояткой. Крупные месторождения нефти сделали бензин дешёвым, а новые дороги позволили ездить на большие расстояния — далеко за пределы запаса хода тяжёлых аккумуляторов того времени. К 1930-м годам электромобили почти исчезли. Началась эпоха бензина.

    Десятилетиями идея электромобиля воспринималась как шутка. В 1990-х один крупный автопроизводитель выпустил электрическую модель в Калифорнии, но позже отозвал и уничтожил большую часть машин. Корпоративные причины этого до сих пор обсуждаются. Когда в начале 2000-х небольшая компания Tesla объявила, что будет выпускать захватывающие электрические спорткары, многие эксперты высмеяли этот план.

    Сегодня ситуация кардинально изменилась. По мере роста беспокойства из-за того, что бензиновые и дизельные машины загрязняют воздух и способствуют изменению климата, правительства ввели строгие нормы по выбросам. Многие страны планируют в ближайшие десятилетия прекратить продажу новых бензиновых машин. Технологии аккумуляторов улучшились настолько, что некоторые электромобили проезжают более 600 километров на одной зарядке. Компании внедряют новые функции: у некоторых машин на крыше солнечные панели, а водители управляют своими автомобилями через приложения на телефоне.

    Трудности остаются. Зарядные станции должны располагаться через равные промежутки, а добыча материалов для аккумуляторов порождает свои экологические вопросы. И всё же есть поразительная параллель с прошлым: электромобиль снова всерьёз претендует на роль будущего транспорта.
  questions:
  - q: What share of cars in American cities were electric in 1900?
    options:
    - Almost none
    - About a third
    - Half
    - All of them
    answer: 1
  - q: Which factor helped petrol cars win?
    options:
    - Electric cars were too noisy
    - Cheap oil and the mass-produced Model T
    - Electric cars were illegal
    - Batteries were too cheap
    answer: 1
  - q: How did experts react to Tesla's early plans?
    options:
    - They invested immediately
    - Many ridiculed the plan
    - They ignored it
    - They copied it
    answer: 1
  - tf: Some modern electric cars can travel over 600 km on one charge.
    answer: true
  - tf: Electric cars face no challenges today.
    answer: false
