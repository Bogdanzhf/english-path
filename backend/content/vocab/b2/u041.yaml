title: Work and jobs
title_ru: Работа и профессии
topic: work
words:
- administration | n | ədˌmɪnɪˈstreɪʃn |  | администрация; введение (лекарства) | the people who manage an organization or government; the act of giving a drug | The Food and Drug *Administration* approved the medicine. | Управление по санитарному надзору одобрило лекарство.
- career path | n | kəˈriə pæθ | kəˈrɪr pæθ | карьерный путь | the jobs you do in your working life | Teaching is a rewarding *career path*. | Преподавание — достойный карьерный путь.
- founder | n | ˈfaʊndə | ˈfaʊndər | основатель | a person who starts an organisation | He's the *founder* of the company. | Он основатель компании.
- freelance | adj | ˈfriːlɑːns | ˈfriːlæns | внештатный, фриланс | working for different companies | She's a *freelance* journalist. | Она журналист-фрилансер.
- income | n | ˈɪnkʌm |  | доход | money you earn | Their *income* is too low to buy a house. | Их доход слишком мал, чтобы купить дом.
- internship | n | ɪnˈtɜːnʃɪp | ˈɪntərnʃɪp | стажировка | a period of work experience | He did an *internship* at a bank. | Он стажировался в банке.
- "job satisfaction | n | ˈdʒ\x01ːb ˌsætɪsˈfækʃən | dʒɑːb ˌsætəsˈfækʃən | удовлетворённость работой | the pleasure you get from your job | Teachers have high *job satisfaction*. | Учителя очень довольны своей работой."
- lawmaker | n | ˈlɔːmeɪkə | ˈlɔːmeɪkər | законодатель | a person who makes laws | *Lawmakers* passed a new bill. | Законодатели приняли новый законопроект.
- maternity leave | n | məˈtɜːnɪti liːv | məˈtɜːrnɪti liːv | декретный отпуск | time off work for a new mother | She's on *maternity leave*. | Она в декрете.
- orator | n | ˈɒrətə | ˈɔːrətər | оратор | a good public speaker | He was a brilliant *orator*. | Он был блестящим оратором.
- overtime | n | ˈəʊvətaɪm | ˈoʊvərtaɪm | сверхурочная работа | extra hours at work | I worked *overtime* last week. | На прошлой неделе я работал сверхурочно.
- pension | n | ˈpenʃən |  | пенсия | money paid after you retire | My grandmother lives on her *pension*. | Бабушка живёт на пенсию.
- promotion | n | prəˈməʊʃən | pərˈmoʊʃən | повышение (по службе); продвижение | a better job in the same company; advertising | She got a *promotion*. | Её повысили.
- recruitment | n | rɪˈkruːtmənt | rəˈkruːtmənt | набор (персонала), подбор кадров | finding new workers | The company is planning a *recruitment* drive. | Компания планирует набор сотрудников.
- remote work | n | rɪˈməʊt wɜːk | riːˈmoʊt wɜːrk | удалённая работа | working from home or another place | *Remote work* became popular in 2020. | Удалённая работа стала популярной в 2020 году.
- resign | v | rɪˈzaɪn |  | уходить в отставку, увольняться | to officially leave your job | The minister *resigned* after the scandal. | Министр ушёл в отставку после скандала. | g не читается
- retirement | n | rɪˈtaɪəmənt | riːˈtaɪərmənt | выход на пенсию; пенсия | stopping work because of age | He's looking forward to his *retirement*. | Он с нетерпением ждёт пенсии.
- wage | v | weɪdʒ |  | вести (войну, кампанию) | to begin and continue a war or fight | They *waged* a long campaign for equal rights. | Они вели долгую кампанию за равные права. | сущ. wage — зарплата
- work-life balance | n |  |  | баланс работы и личной жизни | balance between job and free time | It's hard to find a good *work-life balance*. | Трудно найти баланс между работой и жизнью.
- workforce | n | ˈwɜːkfɔːs | ˈwɜːrkfɔːrs | рабочая сила, персонал | all the workers | Women make up half the *workforce*. | Женщины составляют половину рабочей силы.
- workload | n | ˈwɜːkləʊd | ˈwɜːrkloʊd | рабочая нагрузка | the amount of work | I have a heavy *workload* this week. | На этой неделе у меня большая нагрузка.
