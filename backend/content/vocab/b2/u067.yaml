title: Arts and media
title_ru: Искусство и медиа
topic: arts
words:
- anthem | n | ˈænθəm |  | гимн | an official song of a country or group | The crowd stood for the national *anthem*. | Толпа встала во время исполнения национального гимна.
- audition | n | ɔːˈdɪʃən | ɑːˈdɪʃən | прослушивание, кастинг | a test performance for a role | She has an *audition* for the musical. | У неё прослушивание в мюзикл.
- autobiography | n | ˌɔːtəbaɪˈɒɡrəfi | ˌɔːtəbaɪˈɑːɡrəfi | автобиография | a book someone writes about their own life | At 100, she published her *autobiography*. | В 100 лет она опубликовала автобиографию.
- ballad | n | ˈbæləd |  | баллада | a slow love song; a story poem | She sang a romantic *ballad*. | Она спела романтическую балладу.
- bestseller | n | bestˈselə | ˈbeˈselər | бестселлер | a very popular book | Her novel became a *bestseller*. | Её роман стал бестселлером.
- cello | n | ˈtʃeləʊ | ˈtʃeloʊ | виолончель | a large string instrument | He plays the *cello*. | Он играет на виолончели.
- choir | n | ˈkwaɪə | ˈkwaɪər | хор | a group of people who sing together | She sings in the church *choir*. | Она поёт в церковном хоре. | ch читается как [kw]
- fictional | adj | ˈfɪkʃənl |  | вымышленный | not real | Sherlock Holmes is a *fictional* character. | Шерлок Холмс — вымышленный персонаж.
- folklore | n | ˈfəʊklɔː | ˈfoʊklɔːr | фольклор | the traditional stories and beliefs of a culture | In Slavic *folklore*, snakes guard hidden treasure. | В славянском фольклоре змеи охраняют спрятанные сокровища.
- graffiti | n | ɡrəˈfiːti |  | граффити | words or pictures painted on walls in public places | The wall was covered in *graffiti*. | Стена была покрыта граффити.
- hyperbole | n | haɪˈpɜːbəli | haɪˈpɜːrbəliː | гипербола, преувеличение | saying something is bigger than it is | "I've told you a million times" is *hyperbole*. | «Я говорил тебе миллион раз» — это гипербола.
- metaphor | n | ˈmetəfɔː | ˈmetəfɔːr | метафора | describing something as something else | "Time is money" is a *metaphor*. | «Время — деньги» — метафора.
- novelist | n | ˈnɒvɪlɪst | ˈnɑːvələst | романист, писатель | a person who writes novels | Tolstoy was a great *novelist*. | Толстой был великим романистом.
- orchestral | adj | ɔːˈkestrəl | ɔːrˈkestrəl | оркестровый | for an orchestra | I love *orchestral* music. | Я люблю оркестровую музыку.
- prose | n | prəʊz | proʊz | проза | ordinary written language, not poetry | He writes both poetry and *prose*. | Он пишет и стихи, и прозу.
- refrain | v | rɪˈfreɪn |  | воздерживаться | to stop yourself from doing something | Please *refrain* from smoking. | Пожалуйста, воздержитесь от курения. | refrain from + -ing
- reggae | n | rɪˈɡiː | ˈreɡeɪ | регги | music from Jamaica | Bob Marley played *reggae*. | Боб Марли играл регги.
- repertoire | n | ˈrepətwɑː | ˈrepərtwɑːr | репертуар | all the pieces a performer knows | Her *repertoire* includes jazz and pop. | В её репертуаре джаз и поп.
- stanza | n | ˈstænzə |  | строфа | a group of lines in a poem | The poem has four *stanzas*. | В стихотворении четыре строфы.
- villain | n | ˈvɪlən |  | злодей | the bad character in a story | The *villain* was played by a famous actor. | Злодея играл известный актёр.
