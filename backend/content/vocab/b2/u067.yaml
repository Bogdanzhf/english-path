title: Arts and media
title_ru: Искусство и медиа
topic: arts
words:
- broadcast | n | ˈbrɔːdkɑːst | ˈbrɔːdkæst | передача, трансляция | a programme on radio or TV | The match will be shown in a live *broadcast*. | Матч покажут в прямой трансляции.
- fantasy | n | ˈfæntəsi |  | фантазия, вымысел | something you imagine that is not real | For years, a heart transplant was pure *fantasy*. | Многие годы пересадка сердца была чистой фантастикой.
- genre | n | ˈʒɒnrə | ˈʒɑːnrə | жанр | a type of art, music or writing | War films are a popular *genre*. | Военные фильмы — популярный жанр.
- journalism | n | ˈdʒɜːnəlɪzəm | ˈdʒɜːrnəlɪzəm | журналистика | the work of collecting and writing news | She studied *journalism* at university. | Она изучала журналистику в университете.
- masterpiece | n | ˈmɑːstəpiːs | ˈmæstərpiːs | шедевр | an extremely good work of art | The Ninth Symphony is a *masterpiece*. | Девятая симфония — шедевр.
- publicity | n | pʌbˈlɪsəti |  | публичность, реклама | public attention given to someone or something | The new film got a lot of *publicity*. | Новому фильму уделили много внимания в прессе.
- tragedy | n | ˈtrædʒədi |  | трагедия | a very sad event | The accident was a terrible *tragedy*. | Авария стала ужасной трагедией.
