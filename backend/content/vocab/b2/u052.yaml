title: Everyday phrases
title_ru: Разговорные фразы
topic: phrases
words:
- in spite of something | phr |  |  | несмотря на | despite | We went out *in spite of* the rain. | Мы вышли, несмотря на дождь.
- in the first place | phr |  |  | во-первых; вообще, изначально | at the beginning; firstly | Why did you agree *in the first place*? | Зачем ты вообще согласился?
- in the near future | phr |  |  | в ближайшем будущем | soon | We'll move *in the near future*. | Мы переедем в ближайшем будущем.
- in turn | phr |  |  | по очереди; в свою очередь | one after another; as a result | Each student spoke *in turn*. | Студенты выступали по очереди.
- investment in something | phr |  |  | инвестиции в | money put into | We need more *investment in* education. | Нужны большие инвестиции в образование.
- loads of somebody/something | phr |  |  | куча, масса (разг.) | a lot of | We have *loads of* time. | У нас куча времени.
- more or less | phr |  |  | более или менее, примерно | approximately | The work is *more or less* finished. | Работа более или менее закончена.
- no doubt | phr |  |  | несомненно | certainly | *No doubt* he'll be late again. | Он, несомненно, снова опоздает.
- no matter... | phr |  |  | неважно, независимо от | it is not important | *No matter* what happens, I'll help you. | Что бы ни случилось, я тебе помогу.
- nothing but | phr |  |  | только, ничего кроме | only | He eats *nothing but* pizza. | Он ест одну пиццу.
- on board | phr |  |  | на борту | on a ship, plane or train | There were 200 passengers *on board*. | На борту было 200 пассажиров.
- on the basis of something | phr |  |  | на основании | because of; using | Students are chosen *on the basis of* their grades. | Студентов отбирают по оценкам.
- on the one hand | phr |  |  | с одной стороны | used to give one side | *On the one hand*, it's cheap. | С одной стороны, это дёшево.
- once again | phr |  |  | ещё раз, снова | again | *Once again*, thank you. | Ещё раз спасибо.
- one another | phr |  |  | друг друга | each other | They help *one another*. | Они помогают друг другу.
- opposed to something | phr |  |  | против, противник | disagreeing with | I'm *opposed to* the plan. | Я против этого плана. | as opposed to — в отличие от
- or so | phr |  |  | примерно, около | approximately | It'll take an hour *or so*. | Это займёт около часа.
- other than | phr |  |  | кроме, помимо | except | I don't know anyone here *other than* you. | Я никого здесь не знаю, кроме тебя.
- potential for something | phr |  |  | потенциал для | the possibility of | There's great *potential for* growth. | Есть большой потенциал для роста.
- pretty much | phr |  |  | почти, практически (разг.) | almost | I've *pretty much* finished. | Я почти закончил.
- prior to | phr |  |  | до, перед | before | Please arrive 30 minutes *prior to* departure. | Пожалуйста, приезжайте за 30 минут до отправления.
