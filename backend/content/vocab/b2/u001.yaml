title: People and relationships
title_ru: Люди и отношения
topic: people
words:
- birthplace | n | ˈbɜːθpleɪs | ˈbɜːrθpleɪs | место рождения, родина | the place where someone was born or something began | The Amazon is the *birthplace* of many plant species. | Амазония — родина многих видов растений.
- divorce | n | dɪˈvɔːs | dɪˈvɔːrs | развод | the legal end of a marriage | Her parents got a *divorce* when she was six. | Её родители развелись, когда ей было шесть.
- household | n | ˈhaʊshəʊld | ˈhaʊshoʊld | домашнее хозяйство; все живущие в доме | all the people who live in a house | Every *household* in the village has a garden. | У каждой семьи в деревне есть сад. | household chores — домашние дела
- master | n | ˈmɑːstə | ˈmæstər | мастер; хозяин | a person who is very good at something; an owner | He is a *master* of chess. | Он мастер шахмат.
- patriot | n | ˈpeɪtriət |  | патриот | a person who loves their country | He saw himself as a true *patriot*. | Он считал себя настоящим патриотом.
- upbringing | n | ˈʌpbrɪŋɪŋ |  | воспитание | the way a child is raised | Her mountain *upbringing* taught her how to survive. | Детство в горах научило её выживать.
