title: People and relationships
title_ru: Люди и отношения
topic: people
words:
- adolescence | n | ˌædəˈlesəns |  | подростковый возраст | the time between being a child and an adult | She had a difficult *adolescence*. | У неё был трудный подростковый период.
- birthplace | n | ˈbɜːθpleɪs | ˈbɜːrθpleɪs | место рождения, родина | the place where someone was born or something began | The Amazon is the *birthplace* of many plant species. | Амазония — родина многих видов растений.
- collector | n | kəˈlektə | kəˈlektər | коллекционер; сборщик | a person who collects things | He's a keen stamp *collector*. | Он страстный коллекционер марок.
- divorce | n | dɪˈvɔːs | dɪˈvɔːrs | развод | the legal end of a marriage | Her parents got a *divorce* when she was six. | Её родители развелись, когда ей было шесть.
- extended family | n | ɪkˈstendɪd ˈfæmɪli | ɪkˈstendəd ˈfæməli | большая семья (с родственниками) | a family including grandparents, aunts, cousins, etc. | My *extended family* meets every Christmas. | Вся наша большая родня собирается на Рождество.
- gang | n | ɡæŋ |  | банда; компания | a group of criminals; a group of friends | The police arrested a *gang* of thieves. | Полиция арестовала банду воров.
- household | n | ˈhaʊshəʊld | ˈhaʊshoʊld | домашнее хозяйство; все живущие в доме | all the people who live in a house | Every *household* in the village has a garden. | У каждой семьи в деревне есть сад. | household chores — домашние дела
- landlady | n | ˈlændleɪdi |  | хозяйка (квартиры) | a woman who rents out a room or house | My *landlady* lives downstairs. | Моя квартирная хозяйка живёт этажом ниже.
- madam | n | ˈmædəm |  | мадам, госпожа | a polite way to address a woman | Can I help you, *madam*? | Чем могу помочь, мадам?
- master | n | ˈmɑːstə | ˈmæstər | мастер; хозяин | a person who is very good at something; an owner | He is a *master* of chess. | Он мастер шахмат.
- membership | n | ˈmembəʃɪp | ˈmembərʃɪp | членство | being a member | *Membership* of the gym costs £30 a month. | Абонемент в спортзал стоит 30 фунтов в месяц.
- nuclear family | n | ˈnjuːkliə ˈfæmɪli | ˈnuːkliːər ˈfæməli | нуклеарная семья (родители и дети) | parents and their children only | The *nuclear family* is becoming less common. | Семья из родителей и детей встречается всё реже.
- patriot | n | ˈpeɪtriət |  | патриот | a person who loves their country | He saw himself as a true *patriot*. | Он считал себя настоящим патриотом.
- prime minister | n | praɪm ˈmɪnɪstə | praɪm ˈmɪnəstər | премьер-министр | the leader of the government | The *prime minister* made a speech. | Премьер-министр выступил с речью.
- role model | phr |  |  | пример для подражания | a person others want to be like | Parents should be good *role models*. | Родители должны быть хорошим примером.
- roommate | n | ˈruːmeɪt |  | сосед по комнате | a person you share a room with | My *roommate* snores. | Мой сосед по комнате храпит.
- sibling | n | ˈsɪblɪŋ |  | брат или сестра | a brother or sister | Do you have any *siblings*? | У тебя есть братья или сёстры?
- single parent | n | ˈsɪŋɡl ˈpeərənt | ˈsɪŋɡl ˈperənt | родитель-одиночка | a mother or father raising a child alone | She's a *single parent* with two kids. | Она одна воспитывает двоих детей.
- upbringing | n | ˈʌpbrɪŋɪŋ |  | воспитание | the way a child is raised | Her mountain *upbringing* taught her how to survive. | Детство в горах научило её выживать.
