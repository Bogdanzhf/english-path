title: Communication and language
title_ru: Общение и язык
topic: communication
words:
- accuse | v | əˈkjuːz |  | обвинять | to say that someone did something wrong | He *accused* me of lying. | Он обвинил меня во лжи. | accuse somebody of + -ing
- assure | v | əˈʃʊə | əˈʃʊr | уверять, заверять | to tell someone something is true so they don't worry | I *assure* you everything will be fine. | Уверяю вас, всё будет хорошо.
- cite | v | saɪt |  | цитировать, ссылаться | to mention something as an example or proof | The article *cites* several scientific studies. | В статье приводятся ссылки на несколько научных исследований.
- confess | v | kənˈfes |  | признаваться | to admit you did something wrong | He *confessed* to stealing the money. | Он признался в краже денег. | confession — признание
- consult | v | kənˈsʌlt |  | консультироваться | to ask someone for advice or information | You should *consult* a doctor. | Тебе стоит проконсультироваться с врачом.
- convey | v | kənˈveɪ |  | передавать, выражать | to communicate an idea or feeling | Music can *convey* strong emotions. | Музыка может передавать сильные чувства.
- declare | v | dɪˈkleə | dɪˈkler | объявлять, заявлять | to say something officially or clearly | The judge *declared* him innocent. | Судья объявил его невиновным.
- dismiss | v | dɪsˈmɪs |  | отвергать; увольнять; отпускать | to decide something is not important; to send away | He *dismissed* the idea as silly. | Он отверг эту идею как глупую.
- imply | v | ɪmˈplaɪ |  | подразумевать, намекать | to suggest something without saying it directly | Are you *implying* that I'm lying? | Ты намекаешь, что я вру?
- insist | v | ɪnˈsɪst |  | настаивать | to say firmly that something must happen | She *insisted* on paying for the tickets. | Она настояла на том, чтобы заплатить за билеты. | insist on + -ing
- propose | v | prəˈpəʊz | prəˈpoʊz | предлагать; делать предложение | to suggest a plan; to ask someone to marry you | I *propose* that we leave early. | Предлагаю выехать пораньше.
- remark | v | rɪˈmɑːk | rɪˈmɑːrk | замечать, высказываться | to say something as a comment | She *remarked* that the room was cold. | Она заметила, что в комнате холодно.
- specify | v | ˈspesɪfaɪ |  | указывать, уточнять | to say exactly what you want | Please *specify* the size you need. | Пожалуйста, укажите нужный размер. | specific — конкретный
- whisper | v | ˈwɪspə | ˈwɪspər | шептать | to speak very quietly | She *whispered* something in his ear. | Она что-то прошептала ему на ухо.
