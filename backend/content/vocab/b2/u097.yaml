title: 'How and how much: adverbs'
title_ru: 'Как и насколько: наречия'
topic: manner
words:
- blindly | adv | ˈblaɪndli |  | слепо | without thinking | Don't *blindly* follow others. | Не следуй слепо за другими.
- clockwise | adv | ˈklɒkwaɪz | ˈklɑːkwaɪz | по часовой стрелке | in the same direction as the hands of a clock | Turn the lid *clockwise* to close it. | Поверните крышку по часовой стрелке, чтобы закрыть. | anticlockwise — против часовой
- doubly | adv | ˈdʌbli |  | вдвойне | twice as much | Be *doubly* careful. | Будь вдвойне осторожен.
- downwards | adv | ˈdaʊnwədz | ˈdaʊnwərdz | вниз | towards a lower place | The road slopes *downwards*. | Дорога идёт под уклон. | амер. downward
- ecologically | adv | ˌiːkəˈlɒdʒɪkli | ˌiːkəˈlɑːdʒɪkli | экологически | in a way connected with the environment | The coral reef is *ecologically* important. | Коралловый риф важен с экологической точки зрения.
- electronically | adv | ˌelɪkˈtrɒnɪkli | ˌɪˌlekˈtrɑːnɪkəliː | в электронном виде | using electronic devices | Submit the form *electronically*. | Подайте форму в электронном виде.
- emphatically | adv | ɪmˈfætɪkli | emˈfætɪkəli | решительно, категорически | in a strong way | He *emphatically* denied it. | Он категорически это отрицал.
- enthusiastically | adv | enˌθjuːzɪˈæstɪkli | ɪnˌθuːziːˈæstɪkli | с энтузиазмом | with great interest | The audience clapped *enthusiastically*. | Зрители восторженно аплодировали.
- fantastically | adv | fɑːnˈtæstɪkli | fænˈtæstɪkli | фантастически | extremely | The hotel is *fantastically* expensive. | Отель безумно дорогой.
- forcefully | adv | ˈfɔːsfəli | ˈfɔːrsfəli | решительно, настойчиво | strongly | She argued *forcefully*. | Она настойчиво спорила.
- frantically | adv | ˈfrɑːntɪkli | ˈfrænəkəli | лихорадочно, отчаянно | in a hurried, worried way | She searched *frantically* for her keys. | Она лихорадочно искала ключи.
- graphically | adv | ˈɡræfɪkli |  | наглядно, ярко | in a clear, detailed way | He described the accident *graphically*. | Он ярко описал аварию.
- hastily | adv | ˈheɪstɪli | ˈheɪstəli | поспешно | quickly | He *hastily* left the room. | Он поспешно вышел из комнаты.
- improperly | adv | ɪmˈprɒpəli | ˌɪmˈprɑːpərli | неправильно, ненадлежащим образом | in a wrong way | The machine was *improperly* installed. | Машина была установлена неправильно.
- passionately | adv | ˈpæʃənətli |  | страстно | with strong feeling | She spoke *passionately* about the environment. | Она страстно говорила об экологии.
- psychologically | adv | saɪkəˈlɒdʒɪkli | ˌsaɪkəˈlɑːdʒɪkli | психологически | relating to the mind | It was *psychologically* difficult. | Это было психологически тяжело.
- scarcely | adv | ˈskeəsli | ˈskersli | едва, вряд ли | hardly | I could *scarcely* believe it. | Я едва мог в это поверить.
- suitably | adv | ˈsuːtəbli |  | подобающе | in a suitable way | Be *suitably* dressed for the interview. | Оденьтесь подобающе для собеседования.
