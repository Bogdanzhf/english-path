title: 'Describing: size, shape and looks'
title_ru: 'Описание: размер, форма, внешний вид'
topic: describing
words:
- angle | n | ˈæŋɡl |  | угол; ракурс | the space between two lines that meet; a point of view | Take the photo from a different *angle*. | Сфотографируй с другого ракурса.
- bare | adj | beə | ber | голый, обнажённый; пустой | not covered | Don't walk on the ice in *bare* feet. | Не ходи по льду босиком.
- blind | adj | blaɪnd |  | слепой | not able to see | My grandfather went *blind* when he was eighty. | Мой дедушка ослеп в восемьдесят лет.
- broad | adj | brɔːd |  | широкий | wide | He has *broad* shoulders. | У него широкие плечи.
- gorgeous | adj | ˈɡɔːdʒəs | ˈɡɔːrdʒəs | великолепный, роскошный | very beautiful | What a *gorgeous* melody! | Какая великолепная мелодия!
- massive | adj | ˈmæsɪv |  | огромный, массивный | very big and heavy | A *massive* tree fell across the road. | Огромное дерево упало поперёк дороги.
- plain | adj | pleɪn |  | простой, однотонный | simple; without decoration | She wore a *plain* white dress. | На ней было простое белое платье.
