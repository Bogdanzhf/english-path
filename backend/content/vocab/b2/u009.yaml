title: 'Describing: size, shape and looks'
title_ru: 'Описание: размер, форма, внешний вид'
topic: describing
words:
- angle | n | ˈæŋɡl |  | угол; ракурс | the space between two lines that meet; a point of view | Take the photo from a different *angle*. | Сфотографируй с другого ракурса.
- bare | adj | beə | ber | голый, обнажённый; пустой | not covered | Don't walk on the ice in *bare* feet. | Не ходи по льду босиком.
- blind | adj | blaɪnd |  | слепой | not able to see | My grandfather went *blind* when he was eighty. | Мой дедушка ослеп в восемьдесят лет.
- broad | adj | brɔːd |  | широкий | wide | He has *broad* shoulders. | У него широкие плечи.
- curve | v | kɜːv | kɜːrv | изгибаться | to bend in a round shape | The road *curves* to the left. | Дорога изгибается влево. | сущ. curve — изгиб, кривая
- dated | adj | ˈdeɪtɪd |  | устаревший | old-fashioned | The furniture looks a bit *dated*. | Мебель выглядит немного устаревшей.
- depth | n | depθ |  | глубина | how deep something is | The lake has a *depth* of 50 metres. | Глубина озера — 50 метров.
- 'flash | n | flæʃ |  | вспышка | a sudden bright light | There was a *flash* of lightning. | Сверкнула молния. | гл.: flash — сверкать, мигать'
- gorgeous | adj | ˈɡɔːdʒəs | ˈɡɔːrdʒəs | великолепный, роскошный | very beautiful | What a *gorgeous* melody! | Какая великолепная мелодия!
- lean | v | liːn |  | наклоняться, прислоняться | to bend; to rest against | Don't *lean* on the door. | Не опирайся на дверь.
- massive | adj | ˈmæsɪv |  | огромный, массивный | very big and heavy | A *massive* tree fell across the road. | Огромное дерево упало поперёк дороги.
- matching | adj | ˈmætʃɪŋ |  | подходящий (в тон), парный | of the same colour or style | She wore a dress and *matching* shoes. | На ней было платье и туфли в тон.
- narrow | v | ˈnærəʊ | ˈnæroʊ | сужать(ся) | to become narrower | The road *narrows* here. | Здесь дорога сужается.
- packed | adj | pækt |  | переполненный | very full of people | The train was *packed*. | Поезд был битком набит.
- plain | adj | pleɪn |  | простой, однотонный | simple; without decoration | She wore a *plain* white dress. | На ней было простое белое платье.
- pointed | adj | ˈpɔɪntɪd | ˈpɔɪnəd | заострённый | with a sharp end | The witch wore a *pointed* hat. | На ведьме была остроконечная шляпа.
- rubber | n | ˈrʌbə | ˈrʌbər | резина; ластик (брит.) | a material from trees; an eraser | The tyres are made of *rubber*. | Шины делают из резины.
- shaped | adj | ʃeɪpt |  | имеющий форму | having a certain shape | The pool is *shaped* like a heart. | Бассейн в форме сердца.
- sharp | adv | ʃɑːp | ʃɑːrp | ровно (о времени) | exactly at a time | The meeting starts at nine o'clock *sharp*. | Собрание начинается ровно в девять.
- split | v | splɪt |  | раскалывать(ся); делить | to break into parts; to share | Let's *split* the bill. | Давай разделим счёт. | split – split – split
- vertical | adj | ˈvɜːtɪkl | ˈvɜːrtɪkl | вертикальный | going straight up | Draw a *vertical* line. | Нарисуйте вертикальную линию.
