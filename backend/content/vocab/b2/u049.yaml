title: 'How and how much: adverbs'
title_ru: 'Как и насколько: наречия'
topic: manner
words:
- altogether | adv | ˌɔːltəˈɡeðə | ˌɔːltəˈɡeðər | совсем, полностью; в целом | completely; in total | The practice was banned *altogether*. | Эту практику полностью запретили.
- considerably | adv | kənˈsɪdərəbli |  | значительно | a lot | Prices have increased *considerably*. | Цены значительно выросли.
- deliberately | adv | dɪˈlɪbərətli |  | намеренно | on purpose | He *deliberately* broke the window. | Он нарочно разбил окно.
- emotionally | adv | ɪˈməʊʃənəli | ˈiːmoʊʃnəli | эмоционально | in an emotional way | She was *emotionally* exhausted. | Она была эмоционально истощена.
- firmly | adv | ˈfɜːmli | ˈfɜːrmli | твёрдо, крепко | strongly; in a strict way | He shook my hand *firmly*. | Он крепко пожал мне руку.
- freely | adv | ˈfriːli |  | свободно | without limits | You can speak *freely* here. | Здесь можно говорить свободно.
- gently | adv | ˈdʒentli |  | мягко, осторожно | in a soft, careful way | She *gently* touched his arm. | Она мягко коснулась его руки.
- genuinely | adv | ˈdʒenjuːɪnli | ˈdʒenˈjuːwaɪnli | искренне, по-настоящему | truly | I'm *genuinely* sorry. | Мне искренне жаль.
- independently | adv | ˌɪndɪˈpendəntli |  | независимо, самостоятельно | without help | Children should learn to work *independently*. | Детям нужно учиться работать самостоятельно.
- likewise | adv | ˈlaɪkwaɪz |  | так же, подобным образом | in the same way | He sat down, and I did *likewise*. | Он сел, и я сделал то же самое.
- nicely | adv | ˈnaɪsli |  | хорошо, мило | in a pleasant way | You did that very *nicely*. | У тебя очень хорошо получилось.
- politically | adv | pəˈlɪtɪkli | ˈplɪtɪkli | политически | relating to politics | It's a *politically* sensitive issue. | Это политически щекотливый вопрос.
- privately | adv | ˈpraɪvətli |  | наедине, в частном порядке | not in public | Can we talk *privately*? | Можно поговорить наедине?
- purely | adv | ˈpjɔːli | ˈpjʊrli | исключительно, чисто | only | It was *purely* an accident. | Это была чистая случайность.
- reasonably | adv | ˈriːzənəbli |  | достаточно, довольно; разумно | fairly; sensibly | The hotel was *reasonably* priced. | Цены в отеле были вполне приемлемые.
- separately | adv | ˈseprətli | ˈsepərətli | отдельно | apart | Wash the white clothes *separately*. | Белые вещи стирайте отдельно.
- severely | adv | sɪˈviəli | səˈvɪrli | сильно, жёстко | very badly; strictly | The building was *severely* damaged. | Здание было сильно повреждено.
- technically | adv | ˈteknɪkli | ˈteknɪkəli | технически; формально | relating to technology; strictly speaking | *Technically*, you're right. | Формально ты прав.
- thoroughly | adv | ˈθʌrəli | ˈθɜːroʊli | тщательно; совершенно | carefully and completely | Wash your hands *thoroughly*. | Тщательно вымойте руки.
