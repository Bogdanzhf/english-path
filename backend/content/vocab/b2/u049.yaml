title: 'How and how much: adverbs'
title_ru: 'Как и насколько: наречия'
topic: manner
words:
- altogether | adv | ˌɔːltəˈɡeðə | ˌɔːltəˈɡeðər | совсем, полностью; в целом | completely; in total | The practice was banned *altogether*. | Эту практику полностью запретили.
- likewise | adv | ˈlaɪkwaɪz |  | так же, подобным образом | in the same way | He sat down, and I did *likewise*. | Он сел, и я сделал то же самое.
