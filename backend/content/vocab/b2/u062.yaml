title: Animals
title_ru: Животные
topic: animals
words:
- breed | n | briːd |  | порода | a type of animal within a species | What *breed* is your dog? | Какой породы твоя собака? | гл. breed — разводить
- howl | v | haʊl |  | выть | to make a long loud crying sound like a wolf | The wolves *howled* at the moon. | Волки выли на луну.
- mammal | n | ˈmæml |  | млекопитающее | an animal that feeds its young on milk | Whales and humans are both *mammals*. | И киты, и люди — млекопитающие.
- orangutan | n | ɔːˌræŋuːˈtæn | əˈræŋətæn | орангутан | a large ape with reddish hair | *Orangutans* can live for over fifty years. | Орангутаны могут жить более пятидесяти лет.
- paw | n | pɔː |  | лапа | the foot of an animal with claws | The dog had hurt its *paw*. | Собака поранила лапу.
- reptile | n | ˈreptaɪl | ˈreptl | рептилия | a cold-blooded animal such as a snake or tortoise | Some *reptiles*, like giant tortoises, live for over 150 years. | Некоторые рептилии, например гигантские черепахи, живут более 150 лет.
- species | n | ˈspiːʃiːz |  | вид (биологический) | a group of animals or plants of the same type | There are over 10,000 *species* of birds. | Существует более 10 000 видов птиц. | мн. ч. = ед. ч.
- termite | n | ˈtɜːmaɪt | ˈtɜːrmaɪt | термит | an insect that lives in large groups and eats wood | The chimp pulled *termites* out of the nest. | Шимпанзе вытаскивал термитов из гнезда.
