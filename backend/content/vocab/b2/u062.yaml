title: Technology
title_ru: Технологии
topic: tech
words:
- antivirus | n | ˌæntɪˈvaɪrəs | ˌæntiːˈvaɪrəs | антивирус | software that protects from viruses | Install an *antivirus* on your laptop. | Установи антивирус на ноутбук.
- 'bookmark | n | ˈbʊkmɑːk | ˈbʊkmɑːrk | закладка | a strip to mark a page; a saved web link | I added the site to my *bookmarks*. | Я добавил сайт в закладки. | гл.: bookmark — добавлять в закладки'
- cable | n | ˈkeɪbl |  | кабель, провод | a thick wire | Plug the *cable* into the TV. | Подключи кабель к телевизору.
- cursor | n | ˈkɜːsə | ˈkɜːrsər | курсор | the moving mark on a computer screen | Move the *cursor* to the top. | Переместите курсор наверх.
- cyberspace | n | ˈsaɪbəspeɪs | ˈsaɪbərspeɪs | киберпространство | the online world of computer networks | My email seems to have disappeared into *cyberspace*. | Моё письмо, кажется, затерялось в киберпространстве.
- disc | n | dɪsk |  | диск | a flat round object; a CD or DVD | I bought the album on *disc*. | Я купил альбом на диске.
- disk | n | dɪsk |  | диск (компьютерный) | a device that stores computer data | The *disk* is full. | Диск переполнен.
- graphics | n | ˈɡræfɪks |  | графика | pictures on a computer | The game has amazing *graphics*. | У игры потрясающая графика.
- hard drive | n | hɑːd draɪv | hɑːrd draɪv | жёсткий диск | the main storage in a computer | My *hard drive* crashed. | У меня сломался жёсткий диск.
- icon | n | ˈaɪkɒn | ˈaɪkɑːn | иконка; кумир | a small picture on a screen; a famous person | Click on the *icon*. | Нажмите на значок.
- input | n | ˈɪnpʊt |  | ввод; вклад | information put into a computer; ideas and help given | We need more *input* from our users. | Нам нужно больше отзывов от пользователей. | output — вывод, результат
- log | n | lɒɡ | lɔːɡ | бревно, полено | a thick piece of a tree trunk | He put another *log* on the fire. | Он подбросил ещё одно полено в огонь.
- logo | n | ˈləʊɡəʊ | ˈloʊɡoʊ | логотип | a company symbol | The company has a new *logo*. | У компании новый логотип.
- microchip | n | ˈmaɪkrəʊtʃɪp | ˈmaɪkroʊtʃɪp | микрочип | a very small piece of material with electronic circuits | Every phone contains dozens of *microchips*. | В каждом телефоне десятки микрочипов.
- microphone | n | ˈmaɪkrəfəʊn | ˈmaɪkrəfoʊn | микрофон | a device that records sound | Speak into the *microphone*. | Говорите в микрофон.
- monitor | v | ˈmɒnɪtə | ˈmɑːnɪtər | следить, контролировать | to watch something carefully over time | Doctors *monitored* his heart all night. | Врачи всю ночь следили за его сердцем. | сущ. monitor — монитор
- screen | v | skriːn |  | показывать (фильм); проверять | to show a film; to test for disease | The film will be *screened* tonight. | Фильм покажут сегодня вечером.
- social media | n | ˈsəʊʃl ˈmiːdiːə | ˈsoʊʃl ˈmiːdiə | социальные сети | websites like Facebook and Instagram | She spends hours on *social media*. | Она часами сидит в соцсетях.
- spreadsheet | n | ˈspredʃiːt |  | электронная таблица | a computer document with rows and columns | I keep my budget in a *spreadsheet*. | Я веду бюджет в таблице.
- telegraph | n | ˈtelɪɡrɑːf | ˈtelɪɡræf | телеграф | an old system for sending messages along wires | News came by *telegraph*. | Новости пришли по телеграфу.
- viral | adj | ˈvaɪrəl |  | вирусный | caused by a virus; spread quickly online | The video went *viral*. | Видео стало вирусным.
