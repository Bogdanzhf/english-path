reading:
  title: When Men Wore High Heels
  title_ru: Когда мужчины носили каблуки
  text: |
    Today, high heels are generally seen as feminine. But this was not always the case. In the seventeenth century, high heels were a symbol of male power.

    The style probably came from Persia, where soldiers on horseback wore heels to keep their feet in the stirrups. In the early 1600s, Persian diplomats visited Europe, and their shoes started a craze among European aristocrats. Because heels were impractical for walking on muddy streets, they signified that the wearer didn't need to work. They became a way to show your place at the top of the social hierarchy.

    The most famous fan of heels was King Louis XIV of France, who was quite short. His shoes had red heels and soles, and he made a rule that only members of the aristocracy were allowed to wear them. At his palace in Versailles, a strict protocol controlled every aspect of life, including clothes. The predominant fashion was one of excess: enormous wigs, silk stockings, lace and ribbons. Wigs were so large that hair often became tangled, and courtiers spent hours dressing.

    Some fashions now seem absurd. Men wore padded jackets to enlarge their chests and tied their stockings with straps below the knee. Vanity was not considered a weakness; it was a duty. A gentleman's attire denoted his wealth, and a reputable family would spend a fortune on a single outfit.

    Everything changed in the eighteenth century. Ideas about reason and equality spread across Europe, and men began to prefer simpler, darker clothes. High heels became a fashion for women. By the time of the French Revolution in 1789, the old style had become a symbol of everything people hated about the aristocracy.

    Fashion, it seems, is never just about clothes. It is about power — who has it, and who wants it. Next time you see someone and their partner dressed for a party, remember: every outfit tells a story.
  ru: |
    Сегодня высокие каблуки обычно считаются женской обувью. Но так было не всегда. В XVII веке высокие каблуки были символом мужской власти.

    Этот стиль, вероятно, пришёл из Персии, где всадники носили каблуки, чтобы нога держалась в стремени. В начале 1600-х годов Европу посетили персидские послы, и их обувь вызвала повальную моду среди европейских аристократов. Поскольку на каблуках было неудобно ходить по грязным улицам, они показывали, что их владельцу не нужно работать. Каблуки стали способом продемонстрировать своё место на вершине социальной иерархии.

    Самым известным любителем каблуков был французский король Людовик XIV, который был довольно невысок. У его туфель были красные каблуки и подошвы, и он постановил, что носить их могут только аристократы. В его дворце в Версале строгий этикет регулировал все стороны жизни, в том числе одежду. Преобладающей модой были излишества: огромные парики, шёлковые чулки, кружева и ленты. Парики были такими большими, что волосы часто спутывались, а придворные часами одевались.

    Некоторые фасоны сегодня кажутся нелепыми. Мужчины носили камзолы с подкладкой, чтобы грудь казалась шире, и подвязывали чулки ремешками под коленом. Тщеславие не считалось слабостью — это была обязанность. Наряд джентльмена говорил о его богатстве, и уважаемая семья могла потратить целое состояние на один костюм.

    Всё изменилось в XVIII веке. По Европе распространились идеи разума и равенства, и мужчины стали предпочитать более простую и тёмную одежду. Высокие каблуки стали женской модой. К Французской революции 1789 года старый стиль превратился в символ всего, что люди ненавидели в аристократии.

    Похоже, мода никогда не бывает только про одежду. Она про власть — у кого она есть и кто её хочет. В следующий раз, когда увидите кого-то с партнёром в праздничных нарядах, вспомните: у каждого наряда есть своя история.
  questions:
  - q: Where did the fashion for heels probably come from?
    options:
    - France
    - Persia
    - England
    - Italy
    answer: 1
  - q: What did high heels show in the 1600s?
    options:
    - That you were a soldier
    - That you didn't need to work
    - That you were a woman
    - That you were poor
    answer: 1
  - q: What rule did Louis XIV make?
    options:
    - Only women could wear heels
    - Only aristocrats could wear red heels
    - Nobody could wear wigs
    - Everyone had to wear black
    answer: 1
  - tf: In the 17th century, vanity was considered a weakness.
    answer: false
  - tf: In the 18th century, men began to prefer simpler clothes.
    answer: true
