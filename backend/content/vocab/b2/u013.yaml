title: Clothes and appearance
title_ru: Одежда и внешность
topic: clothes
words:
- bead | n | biːd |  | бусина; капля | a small ball with a hole for a string; a small drop | *Beads* of sweat ran down his face. | По его лицу катились капли пота.
- fabric | n | ˈfæbrɪk |  | ткань | cloth used for making clothes and curtains | This *fabric* is soft and warm. | Эта ткань мягкая и тёплая.
- helmet | n | ˈhelmɪt |  | шлем, каска | a hard hat that protects the head | Always wear a *helmet* when you cycle. | Всегда надевай шлем, когда катаешься на велосипеде.
- hood | n | hʊd |  | капюшон | the part of a coat that covers your head | Put your *hood* up — it's raining. | Надень капюшон — идёт дождь.
- laundry | n | ˈlɔːndri |  | стирка; бельё (для стирки) | clothes that need washing or have been washed | I do the *laundry* on Sundays. | Я стираю по воскресеньям.
- outfit | n | ˈaʊtfɪt |  | костюм, наряд, экипировка | a set of clothes worn together | He was still wearing his old military *outfit*. | На нём по-прежнему была старая военная форма.
- rag | n | ræɡ |  | тряпка | an old piece of cloth used for cleaning | He wiped his hands on a *rag*. | Он вытер руки тряпкой.
- robe | n | rəʊb | roʊb | мантия; халат | a long loose piece of clothing | The judge wore a black *robe*. | Судья был в чёрной мантии. | bathrobe — банный халат
- tattoo | n | təˈtuː | tæˈtuː | татуировка | a permanent picture on the skin made with ink | He has a *tattoo* on his arm. | У него татуировка на руке.
- weave | v | wiːv |  | ткать, плести | to make cloth by crossing threads | Families *wove* cloth at home. | Семьи ткали ткань дома. | weave — wove — woven
