title: Science and research
title_ru: Наука и исследования
topic: science
words:
- acid | n | ˈæsɪd |  | кислота | a chemical substance, often sour, that can burn | Lemon juice contains citric *acid*. | Лимонный сок содержит лимонную кислоту.
- axis | n | ˈæksɪs | ˈæksəs | ось | a line around which something turns | The earth spins on its *axis*. | Земля вращается вокруг своей оси.
- bacteria | n | bækˈtiərɪə | bækˈtɪriə | бактерии | very small living things | Some *bacteria* cause disease. | Некоторые бактерии вызывают болезни. | ед. ч. bacterium
- biological | adj | ˌbaɪəˈlɒdʒɪkl | ˌbaɪəˈlɑːdʒɪkl | биологический; родной (о родителях) | connected with living things; related by birth | She found her *biological* parents when she was 30. | Она нашла своих биологических родителей в 30 лет.
- catalyst | n | ˈkætəlɪst | ˈkætələst | катализатор | something that causes change | The crisis was a *catalyst* for reform. | Кризис стал катализатором реформ.
- circuit | n | ˈsɜːkɪt | ˈsɜːrkɪt | схема, цепь; круг | a closed path that electricity flows around | The *circuit* was broken, so the light went out. | Цепь разомкнулась, и свет погас. | ui читается как [ɪ]
- compound | n | ˈkɒmpaʊnd | ˈkɑːmpaʊnd | огороженная территория; соединение | an area surrounded by a fence or wall; a mixture of chemicals | The gladiators lived in a guarded *compound*. | Гладиаторы жили на охраняемой территории.
- coral | n | ˈkɒrəl | ˈkɔːrəl | коралл | a hard substance made by small sea animals | The *coral* was red, pink and orange. | Кораллы были красными, розовыми и оранжевыми.
- DNA | n | ˌdiː en ˈeɪ |  | ДНК | the chemical in cells that carries genetic information | The police found his *DNA* on the glass. | Полиция обнаружила его ДНК на стакане.
- formula | n | ˈfɔːmjʊlə | ˈfɔːrmjələ | формула | a rule written in symbols | Learn the *formula* for the area of a circle. | Выучите формулу площади круга.
- fossil | n | ˈfɒsl | ˈfɑːsl | окаменелость | the remains of an ancient animal or plant in rock | They found a dinosaur *fossil*. | Они нашли окаменелость динозавра.
- gene | n | dʒiːn |  | ген | a part of DNA that controls a quality like eye colour | She got her red hair from her father's *genes*. | Рыжие волосы ей достались от отца. | genetic — генетический
- hybrid | adj | ˈhaɪbrɪd | ˈhaɪbrəd | гибридный | made from two different things | He drives a *hybrid* car. | Он ездит на гибридной машине.
- latitude | n | ˈlætɪtjuːd | ˈlætɪtuːd | широта | the distance north or south of the equator | The city lies at a *latitude* of 55 degrees north. | Город расположен на 55 градусе северной широты. | longitude — долгота
- lava | n | ˈlɑːvə |  | лава | hot liquid rock that comes out of a volcano | Red-hot *lava* flowed down the mountain. | Раскалённая лава текла вниз по склону.
- microscope | n | ˈmaɪkrəskəʊp | ˈmaɪkrəskoʊp | микроскоп | an instrument that makes very small things look bigger | Look at the cells under the *microscope*. | Посмотрите на клетки под микроскопом.
- mineral | n | ˈmɪnərəl |  | минерал; полезное ископаемое | a natural substance from the ground, like gold or salt | This water is rich in *minerals*. | Эта вода богата минералами.
- ozone | n | ˈəʊzəʊn | ˈoʊzoʊn | озон | a form of oxygen | *Ozone* protects us from the sun's rays. | Озон защищает нас от солнечных лучей.
- particle | n | ˈpɑːtɪkl | ˈpɑːrtɪkl | частица | a very small piece of something | *Particles* of dust floated in the sunlight. | В солнечном свете плавали пылинки.
- radiation | n | ˌreɪdɪˈeɪʃən | ˌreɪdiːˈeɪʃən | радиация, излучение | dangerous energy from nuclear material | The accident released *radiation*. | Авария привела к выбросу радиации.
- solvent | n | ˈsɒlvənt | ˈsɑːlvənt | растворитель | a liquid that dissolves things | Water is a common *solvent*. | Вода — распространённый растворитель.
