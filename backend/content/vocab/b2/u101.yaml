title: Society and politics
title_ru: Общество и политика
topic: society
words:
- chaos | n | ˈkeɪɒs | ˈkeɪɑːs | хаос | complete disorder and confusion | After the storm, the city was in *chaos*. | После шторма в городе царил хаос. | ch читается как [k]
- conflict | n | ˈkɒnflɪkt | ˈkɑːnflɪkt | конфликт | a serious disagreement or fight | There was little *conflict* among the men. | Среди людей почти не было конфликтов.
- convention | n | kənˈvenʃn |  | условность, традиция; съезд | a traditional way of behaving; a large formal meeting | By *convention*, the oldest person eats first. | По обычаю первым ест старший.
- crisis | n | ˈkraɪsɪs |  | кризис | a time of great difficulty or danger | The country faced an economic *crisis*. | Страна столкнулась с экономическим кризисом. | мн. crises
- duke | n | djuːk | duːk | герцог | a man of very high rank in a country with a king or queen | The *Duke* lives in a castle in Scotland. | Герцог живёт в замке в Шотландии.
- hunger | n | ˈhʌŋɡə | ˈhʌŋɡər | голод | the feeling that you need to eat | Millions of people in the world suffer from *hunger*. | Миллионы людей в мире страдают от голода. | hungry — голодный
- invasion | n | ɪnˈveɪʒn |  | вторжение | an attack by an army that enters another country | The *invasion* began at dawn. | Вторжение началось на рассвете.
- navy | n | ˈneɪvi |  | военно-морской флот | the part of the armed forces that fights at sea | He joined the *navy* at eighteen. | Он поступил на флот в восемнадцать. | navy blue — тёмно-синий
- suicide | n | ˈsuːɪsaɪd |  | самоубийство | the act of killing yourself | Some people saw his death as *suicide*; others saw it as a sacrifice. | Одни считали его смерть самоубийством, другие — жертвой.
- suspicion | n | səˈspɪʃn |  | подозрение | a feeling that someone has done something wrong | He was arrested on *suspicion* of vandalism. | Его арестовали по подозрению в вандализме.
- threat | n | θret |  | угроза | a danger; something that might cause harm | Pollution is a serious *threat* to wildlife. | Загрязнение — серьёзная угроза для дикой природы.
