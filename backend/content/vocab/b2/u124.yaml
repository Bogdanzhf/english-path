title: Events and situations
title_ru: События и ситуации
topic: events
words:
- approval | n | əˈpruːvl |  | одобрение | agreeing that something is good | The plan needs the boss's *approval*. | План должен одобрить начальник.
- behalf | n | bɪˈhɑːf | bɪˈhæf | от имени, ради | (on behalf of) as the representative of someone | I'm writing on *behalf* of my company. | Я пишу от имени своей компании.
- contribution | n | ˌkɒntrɪˈbjuːʃən | ˌkɑːntrəbˈjuːʃən | вклад | something you give | Thank you for your *contribution*. | Спасибо за ваш вклад.
- creation | n | kriˈeɪʃn |  | творение, создание | something that someone has made; the act of making it | The symphony is his greatest *creation*. | Эта симфония — его величайшее творение.
- cutting | n | ˈkʌtɪŋ |  | вырезка; черенок | a piece cut out of a newspaper | She kept newspaper *cuttings*. | Она хранила газетные вырезки.
- destruction | n | dɪˈstrʌkʃn |  | разрушение, уничтожение | serious damage that destroys something | The storm caused great *destruction*. | Буря нанесла огромные разрушения.
- establishment | n | ɪˈstæblɪʃmənt |  | учреждение; создание | an organisation; setting up | It's a well-known educational *establishment*. | Это известное учебное заведение.
- expansion | n | ɪkˈspænʃən |  | расширение | growing bigger | The company plans further *expansion*. | Компания планирует дальнейшее расширение.
- maintenance | n | ˈmeɪntənəns |  | обслуживание, ремонт | keeping something in good condition | The lift is closed for *maintenance*. | Лифт закрыт на техобслуживание.
- manufacturing | n | ˌmænjuːˈfæktʃərɪŋ | ˌmænjəˈfæktʃərɪŋ | производство | making goods in factories | The town depends on *manufacturing*. | Город зависит от промышленности.
- opposition | n | ˌɒpəˈzɪʃən | ˌɑːpəˈzɪʃən | оппозиция; сопротивление | disagreement; the party not in power | There was strong *opposition* to the plan. | План встретил сильное сопротивление.
- penalty | n | ˈpenəlti |  | наказание, штраф; пенальти | a punishment; a free kick in football | He scored from the *penalty*. | Он забил с пенальти.
- procedure | n | prəˈsiːdʒə | prəˈsiːdʒər | процедура | the official way of doing something | Follow the safety *procedure*. | Соблюдайте порядок техники безопасности.
- publishing | n | ˈpʌblɪʃɪŋ |  | издательское дело | producing books | She works in *publishing*. | Она работает в издательстве.
- reduction | n | rɪˈdʌkʃən | rəˈdʌkʃən | сокращение, снижение | making smaller | There's a 20% *reduction* on all items. | На все товары скидка 20%.
- saving | n | ˈseɪvɪŋ |  | экономия; сбережения (savings) | money saved | I put my *savings* in the bank. | Я положил сбережения в банк.
- selection | n | sɪˈlekʃən | səˈlekʃən | выбор, отбор; ассортимент | choosing; a range of things | The shop has a good *selection* of wines. | В магазине хороший выбор вин.
- storage | n | ˈstɔːrɪdʒ | ˈstɔːrədʒ | хранение; место для хранения | keeping things | The flat has plenty of *storage*. | В квартире много места для хранения.
- transition | n | trænˈzɪʃn |  | переход | the process of changing from one state to another | The *transition* from school to university can be hard. | Переход от школы к университету бывает непростым.
- voting | n | ˈvəʊtɪŋ | ˈvoʊtɪŋ | голосование | choosing by vote | *Voting* starts at 7 am. | Голосование начинается в 7 утра.
- welfare | n | ˈwelfeə | ˈwelfer | благополучие; социальное обеспечение | health and happiness; government help for people in need | She campaigns for animal *welfare*. | Она борется за благополучие животных.
