title: Technology
title_ru: Технологии
topic: tech
words:
- algorithm | n | ˈælɡərɪθəm | ˈælɡərɪðəm | алгоритм | a set of rules a computer follows | The *algorithm* chooses which videos you see. | Алгоритм решает, какие видео вы видите.
- amplifier | n | ˈæmplɪfaɪə | ˈæmpləfaɪər | усилитель | a device that makes sound louder | Plug the guitar into the *amplifier*. | Подключи гитару к усилителю.
- artificial intelligence | n | ˌɑːtɪˈfɪʃl ɪnˈtelɪdʒəns | ˌɑːrtəˈfɪʃl ˌɪnˈtelədʒəns | искусственный интеллект | computers that can think like people | *Artificial intelligence* is changing many jobs. | Искусственный интеллект меняет многие профессии. | сокр. AI
- breakthrough | n | ˈbreɪkθruː |  | прорыв | an important discovery | Scientists made a *breakthrough* in cancer research. | Учёные совершили прорыв в исследованиях рака.
- browse | v | braʊz |  | просматривать; бродить по сайтам | to look through; to look at websites | I was just *browsing*. | Я просто смотрю.
- cloud computing | n | klaʊd kəmˈpjuːtɪŋ |  | облачные вычисления | storing data on the internet | *Cloud computing* lets you work anywhere. | Облачные технологии позволяют работать где угодно.
- cutting-edge | adj | ˈkətɪŋedʒ | ˈkʌtɪŋedʒ | передовой, новейший | very modern | They use *cutting-edge* technology. | Они используют передовые технологии.
- cybercrime | n | ˈsaɪbəkraɪm | ˈsaɪbərkraɪm | киберпреступность | crime on the internet | *Cybercrime* is a growing problem. | Киберпреступность — растущая проблема.
- database | n | ˈdeɪtəbeɪs |  | база данных | a large collection of information stored on a computer | Our *database* contains a million customer records. | В нашей базе данных миллион записей о клиентах.
- digital era | n | ˈdɪdʒɪtl ˈiərə | ˈdɪdʒətl ˈerə | цифровая эпоха | the time of computers and the internet | We live in the *digital era*. | Мы живём в цифровую эпоху.
- hacker | n | ˈhækə | ˈhækər | хакер | a person who breaks into computer systems | *Hackers* stole customer data. | Хакеры украли данные клиентов.
- hacking | n | ˈhækɪŋ |  | взлом (компьютерный) | breaking into computer systems | He was arrested for *hacking*. | Его арестовали за взлом.
- innovation | n | ˌɪnəˈveɪʃn |  | инновация, нововведение | a new idea or method | The shuttle was a major *innovation*. | Шаттл стал крупным нововведением.
- offline | adj | ˈɒflaɪn | ˈɔːflaɪn | офлайн, без интернета | not connected to the internet | You can use the app *offline*. | Приложением можно пользоваться без интернета.
- password | n | ˈpɑːswɜːd | ˈpæswɜːrd | пароль | a secret word to log in | Never share your *password*. | Никому не сообщайте свой пароль.
- privacy | n | ˈprɪvəsi | ˈpraɪvəsi | частная жизнь, уединение | the freedom to be alone and keep things secret | Teenagers need some *privacy*. | Подросткам нужно личное пространство.
- receiver | n | rɪˈsiːvə | rəˈsiːvər | трубка; приёмник | the part of a phone you hold; a device that receives signals | He picked up the *receiver*. | Он снял трубку.
- screen time | n | skriːn taɪm |  | время у экрана | time spent using phones, TV, etc. | Parents should limit children's *screen time*. | Родителям стоит ограничивать время детей у экранов.
- streaming | n | ˈstriːmɪŋ |  | стриминг, потоковое вещание | watching or listening online | Music *streaming* is very popular. | Музыкальный стриминг очень популярен.
- user-friendly | adj | ˌjuːzə ˈfrendli | ˌjuːzər ˈfrendli | удобный, простой в использовании | easy to use | The app is very *user-friendly*. | Приложение очень удобное.
- virtual reality | n | ˈvɜːtʃuːəl rɪˈælɪti | ˈvɜːrtʃuːəl ˌriːˈælətiː | виртуальная реальность | a computer world you can enter | He tried a *virtual reality* game. | Он попробовал игру в виртуальной реальности. | сокр. VR
- wireless | adj | ˈwaɪələs | ˈwaɪrlɪs | беспроводной | without wires | Is there *wireless* internet here? | Здесь есть беспроводной интернет?
