title: Events and situations
title_ru: События и ситуации
topic: events
words:
- breakup | n | ˈbreɪkʌp |  | разрыв, расставание | the end of a relationship | She's sad after the *breakup*. | Она грустит после расставания.
- correction | n | kəˈrekʃən |  | исправление | changing to make correct | Make the *corrections* in red. | Внесите исправления красным.
- cruelty | n | ˈkruːəlti |  | жестокость | causing pain on purpose | *Cruelty* to animals is a crime. | Жестокое обращение с животными — преступление.
- disappearance | n | ˌdɪsəˈpiərəns | ˌdɪsəˈpiːrəns | исчезновение | going missing | Police are investigating her *disappearance*. | Полиция расследует её исчезновение.
- diversion | n | daɪˈvɜːʃən | daɪˈvɜːrʒən | объезд; отвлечение | another route; a distraction | There's a traffic *diversion*. | Действует объезд.
- duel | n | ˈdjuːəl | ˈduːəl | дуэль | a fight between two people | Pushkin died after a *duel*. | Пушкин погиб после дуэли.
- emission | n | ɪˈmɪʃən |  | выброс, выделение | sending out gas or heat | Cars must meet *emission* standards. | Машины должны соответствовать нормам выбросов.
- evacuation | n | ɪˌvækjuːˈeɪʃən | iːˈvækjəˈweɪʃən | эвакуация | moving people away from danger | The *evacuation* of the city began. | Началась эвакуация города.
- gesture | n | ˈdʒestʃə | ˈdʒestʃər | жест | a movement to show meaning | It was a kind *gesture*. | Это был добрый жест.
- glimpse | n | ɡlɪmps |  | мельком увиденное, проблеск | a quick look | The museum offers a *glimpse* into school life in 1900. | Музей позволяет заглянуть в школьную жизнь 1900 года.
- infringement | n | ɪnˈfrɪndʒmənt | ˌɪnˈfrɪndʒmənt | нарушение | breaking a law or rule | It's an *infringement* of copyright. | Это нарушение авторских прав.
- obedience | n | əʊˈbiːdiəns | oʊˈbiːdiəns | послушание | doing what you are told | The dog was trained in *obedience*. | Собаку научили слушаться.
- paperwork | n | ˈpeɪpəwɜːk | ˈpeɪpərwɜːrk | бумажная работа, документы | forms and documents | I have a lot of *paperwork* to do. | У меня много бумажной работы.
- preservation | n | prɪsəˈveɪʃən | ˌprezərˈveɪʃən | сохранение | keeping something safe | The *preservation* of old buildings is important. | Важно сохранять старинные здания.
- relay | n | ˈrileɪ | ˈriːleɪ | эстафета | a race in which team members take turns | Our team won the *relay*. | Наша команда выиграла эстафету.
- revision | n | rɪˈvɪʒən | riːˈvɪʒən | повторение (к экзамену); пересмотр | studying again; a change | I'm doing *revision* for my exams. | Я готовлюсь к экзаменам.
- stimulation | n | ˌstɪmjʊˈleɪʃən | ˌstɪmjəˈleɪʃən | стимуляция | activity that makes something work | Babies need lots of *stimulation*. | Младенцам нужно много впечатлений.
- stunt | n | stʌnt |  | трюк | a dangerous action in a film; something done to get attention | The actor did all his own *stunts*. | Актёр сам выполнял все трюки.
- tug | n | tʌɡ |  | рывок | a sudden pull | I felt a *tug* on my sleeve. | Кто-то дёрнул меня за рукав.
- vibration | n | vaɪˈbreɪʃən |  | вибрация | shaking | I felt the *vibration* of the engine. | Я почувствовал вибрацию двигателя.
- workout | n | ˈwɜːkaʊt | ˈwɜːrkaʊt | тренировка | a period of physical exercise | She does a 30-minute *workout* every morning. | Каждое утро она делает тридцатиминутную тренировку.
