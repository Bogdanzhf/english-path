title: Objects and materials
title_ru: Предметы и материалы
topic: objects
words:
- armor | n | ˈɑːmə | ˈɑːrmər | доспехи, броня | metal clothing worn by soldiers in the past | The knight wore a suit of shining *armor*. | Рыцарь был облачён в сияющие доспехи. | брит. armour
- ditch | n | dɪtʃ |  | канава, ров | a long narrow channel dug in the ground | Farmers dug *ditches* to carry water to the fields. | Фермеры рыли канавы, чтобы подводить воду к полям. | гл. ditch — бросить (разг.)
- gears | n | ɡɪəz | ɡɪrz | передача, шестерни | the parts of a vehicle that change its speed | My bike has 21 *gears*. | У моего велосипеда 21 передача. | change gears — переключать передачу
- horn | n | hɔːn | hɔːrn | рог; гудок, клаксон; валторна | a hard pointed part on an animal's head; a device that makes a warning sound; a brass instrument | The driver sounded his *horn*. | Водитель посигналил.
- leash | n | liːʃ |  | поводок | a strap for holding a dog | Keep your dog on a *leash* in the park. | В парке держите собаку на поводке.
- mast | n | mɑːst | mæst | мачта | a tall pole that holds a ship's sails | The storm broke the ship's *mast*. | Шторм сломал мачту корабля.
- shutter | n | ˈʃʌtə | ˈʃʌtər | ставень; затвор (фотоаппарата) | a wooden or metal cover for a window | He opened the *shutters* at five every morning. | Каждое утро он открывал ставни в пять.
- spear | n | spɪə | spɪr | копьё | a long stick with a sharp point used as a weapon | He caught a fish with a *spear*. | Он поймал рыбу копьём.
- stitch | n | stɪtʃ |  | шов, стежок | a piece of thread sewn in cloth or skin | He needed five *stitches* in his head. | Ему наложили пять швов на голову.
- torch | n | tɔːtʃ | tɔːrtʃ | фонарик; факел | (UK) a small electric light; a burning stick | They searched the cave with a *torch*. | Они осмотрели пещеру с фонариком. | амер. flashlight
