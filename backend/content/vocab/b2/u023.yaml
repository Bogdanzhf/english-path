title: Everyday phrases
title_ru: Разговорные фразы
topic: phrases
words:
- awareness of something | phr |  |  | осведомлённость о, осознание | knowledge of | We need to raise *awareness of* the problem. | Нужно привлечь внимание к проблеме.
- be charged with something | phr |  |  | быть обвинённым в | to be officially accused of | He *was charged with* murder. | Ему предъявили обвинение в убийстве.
- be derived from something | phr |  |  | происходить от | to come from | The word *is derived from* Latin. | Слово происходит от латыни.
- be expected to do something | phr |  |  | ожидается, что; должен | to be thought likely or required | Prices *are expected to* rise. | Ожидается рост цен.
- be known to do something | phr |  |  | известно, что (делает) | to be known for doing | This snake *is known to* attack people. | Известно, что эта змея нападает на людей.
- be made up of something | phr |  |  | состоять из | to consist of | The team *is made up of* five people. | Команда состоит из пяти человек.
- be surrounded by somebody/something | phr |  |  | быть окружённым | to have all around | The house *is surrounded by* trees. | Дом окружён деревьями.
- be to blame | phr |  |  | быть виноватым | to be responsible for something bad | Who *is to blame* for the accident? | Кто виноват в аварии?
- both sides | phr |  |  | обе стороны | the two groups in an argument | Listen to *both sides* of the story. | Выслушай обе стороны.
- bound to do something | phr |  |  | обязательно, непременно | certain to | It's *bound to* rain this weekend. | В выходные непременно пойдёт дождь.
- by now | phr |  |  | уже, к этому времени | before now | He should be home *by now*. | Он уже должен быть дома.
- case study | phr |  |  | тематическое исследование, разбор случая | a detailed study of one example | We discussed a *case study* in class. | На занятии мы разобрали конкретный пример.
- come true | phr |  |  | сбываться | to become real | My dream *came true*. | Моя мечта сбылась.
- concerned about something | phr |  |  | обеспокоенный | worried about | I'm *concerned about* his health. | Я беспокоюсь о его здоровье.
- concerned with something | phr |  |  | посвящённый, касающийся | about; dealing with | The book is *concerned with* history. | Книга посвящена истории.
- confidence in somebody/something | phr |  |  | уверенность в, доверие к | trust in | I have *confidence in* you. | Я в тебя верю.
- contribute to something | phr |  |  | способствовать; вносить вклад в | to help cause | Stress *contributes to* illness. | Стресс способствует болезням.
- control over somebody/something | phr |  |  | контроль над | power over | He lost *control over* the car. | Он потерял управление машиной.
- cope with something | phr |  |  | справляться с | to deal with something difficult | She *copes with* stress very well. | Она отлично справляется со стрессом.
- decline in something | phr |  |  | снижение (чего-либо) | a fall in | There's been a *decline in* sales. | Продажи снизились.
- dependent on somebody/something | phr |  |  | зависящий от | needing | Success is *dependent on* hard work. | Успех зависит от упорного труда.
- despite the fact that... | phr |  |  | несмотря на то что | although | He went out *despite the fact that* it was raining. | Он вышел на улицу, несмотря на то что шёл дождь.
