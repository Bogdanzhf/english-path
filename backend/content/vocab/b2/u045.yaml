title: Education
title_ru: Учёба
topic: education
words:
- academy | n | əˈkædəmi |  | академия, училище | a special school or college | She studied at the *academy* of music. | Она училась в музыкальной академии.
- admission | n | ədˈmɪʃn |  | вход, плата за вход; приём | permission to enter; the price you pay to enter | *Admission* to the museum is free on Sundays. | По воскресеньям вход в музей бесплатный.
- applicant | n | ˈæplɪkənt |  | соискатель, заявитель | a person who applies for something | There were 300 *applicants* for the job. | На эту должность было 300 претендентов.
- assembly | n | əˈsembli |  | собрание; сборка | a group of people meeting for a purpose | The whole school met in the hall for *assembly*. | Вся школа собралась в зале на линейку.
- assessment | n | əˈsesmənt |  | оценка | judging how good something is | The teacher made an *assessment* of my work. | Учитель оценил мою работу.
- calculation | n | ˌkælkjʊˈleɪʃən | ˌkælkjəˈleɪʃən | вычисление, расчёт | working out numbers | My *calculations* were wrong. | Мои расчёты оказались неверными.
- certification | n | ˌsɜːtɪfɪˈkeɪʃən | ˌsɜːrtəfəˈkeɪʃən | сертификация | getting an official certificate | You need *certification* to work as a pilot. | Чтобы работать пилотом, нужна сертификация.
- comprehension | n | ˌkɒmprɪˈhenʃən | ˌkɑːmpriːˈhenʃən | понимание | understanding | We did a reading *comprehension* test. | Мы выполняли тест на понимание прочитанного.
- cube | n | kjuːb |  | куб, кубик | a solid shape with six equal square sides | Cut the cheese into *cubes*. | Нарежьте сыр кубиками.
- curriculum | n | kʌˈrɪkjʊləm | kəˈrɪkjələm | учебная программа | the subjects taught at school | Music is part of the *curriculum*. | Музыка входит в учебную программу.
- dandelion | n | ˈdændɪlaɪən | ˈdændəlaɪən | одуванчик | a yellow wild flower | The field was full of *dandelions*. | Поле было усыпано одуванчиками.
- deduction | n | dɪˈdʌkʃən |  | вычет; дедукция, вывод | an amount taken away; a conclusion | After *deductions*, my salary is £2,000. | После вычетов моя зарплата — 2000 фунтов.
- examination | n | ɪɡˌzæmɪˈneɪʃən | ɪɡˌzæməˈneɪʃən | экзамен; обследование | an exam; a medical check | The doctor did a full *examination*. | Врач провёл полное обследование.
- historian | n | hɪˈstɔːriən |  | историк | an expert in history | She's a famous *historian*. | Она известный историк.
- institute | n | ˈɪnstɪtjuːt | ˈɪnstɪtuːt | институт, учреждение | an organization for research or education | She works at a research *institute*. | Она работает в исследовательском институте.
- logic | n | ˈlɒdʒɪk | ˈlɑːdʒɪk | логика | clear reasoning | I don't understand your *logic*. | Не понимаю твоей логики.
- 'philosophy | n | fəˈlɒsəfi | fəˈlɑːsəfi | философия | the study of ideas about life and the world; a set of beliefs | My *philosophy* is: enjoy every day. | Моя философия: радуйся каждому дню.'
- pupil | n | ˈpjuːpl |  | ученик; зрачок | a school student; the black part of the eye | The school has 500 *pupils*. | В школе 500 учеников.
- scholar | n | ˈskɒlə | ˈskɑːlər | учёный (гуманитарий) | a person who studies a subject in great detail | He is a famous *scholar* of ancient Greek. | Он известный исследователь древнегреческого языка.
- scholarship | n | ˈskɒləʃɪp | ˈskɑːlərʃɪp | стипендия (на обучение) | money given to a student to pay for their studies | She won a *scholarship* to study in Canada. | Она выиграла стипендию на учёбу в Канаде.
- synonym | n | ˈsɪnənɪm |  | синоним | a word with the same meaning | "Big" is a *synonym* for "large". | «Big» — синоним «large».
