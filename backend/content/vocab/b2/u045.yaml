title: Work and jobs
title_ru: Работа и профессии
topic: work
words:
- blacksmith | n | ˈblæksmɪθ |  | кузнец | a person who makes things out of iron | The *blacksmith* made shoes for the horses. | Кузнец ковал подковы для лошадей.
- butler | n | ˈbʌtlə | ˈbʌtlər | дворецкий | the chief male servant in a large house | The *butler* opened the door. | Дверь открыл дворецкий.
- critic | n | ˈkrɪtɪk |  | критик | a person whose job is to give opinions about books, films or music | The *critics* loved the new film. | Критикам новый фильм очень понравился.
- lieutenant | n | lefˈtenənt | luːˈtenənt | лейтенант | an officer of low rank in the army or navy | The *lieutenant* gave orders to his men. | Лейтенант отдал приказ своим людям. | брит. [lefˈtenənt], амер. [luːˈtenənt]
- mechanic | n | məˈkænɪk |  | механик, автомеханик | a person who repairs cars or machines | The *mechanic* fixed my car in an hour. | Механик починил мою машину за час.
- miner | n | ˈmaɪnə | ˈmaɪnər | шахтёр | a person who works underground to get coal or metal | His father was a coal *miner*. | Его отец был шахтёром. | mine — шахта
- sergeant | n | ˈsɑːdʒənt | ˈsɑːrdʒənt | сержант | an officer of middle rank in the army or police | The *sergeant* organized the rescue. | Сержант организовал спасательную операцию.
- surgeon | n | ˈsɜːdʒən | ˈsɜːrdʒən | хирург | a doctor who performs operations | The *surgeon* operated for six hours. | Хирург оперировал шесть часов. | surgery — хирургия, операция
- tutor | n | ˈtjuːtə | ˈtuːtər | репетитор, наставник | a private teacher | My English *tutor* comes on Tuesdays. | Мой репетитор по английскому приходит по вторникам.
