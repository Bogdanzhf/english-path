title: Communication and language
title_ru: Общение и язык
topic: communication
words:
- apology | n | əˈpɒlədʒi | əˈpɑːlədʒi | извинение | words that say you are sorry | Please accept my *apology*. | Пожалуйста, примите мои извинения. | apologize — извиняться
- disrespect | n | ˌdɪsrɪˈspekt |  | неуважение | a lack of respect | He meant no *disrespect*. | Он не хотел проявить неуважение.
- encouragement | n | ɪnˈkʌrɪdʒmənt | ɪnˈkɜːrɪdʒmənt | поддержка, ободрение | words or actions that give someone confidence | With her teacher's *encouragement*, she applied to university. | При поддержке учителя она подала документы в университет.
- hospitality | n | ˌhɒspɪˈtæləti | ˌhɑːspɪˈtæləti | гостеприимство | friendly treatment of guests | Thank you for your *hospitality*. | Спасибо за гостеприимство.
- paradox | n | ˈpærədɒks | ˈpærədɑːks | парадокс | a situation that seems impossible because it has two opposite features | It's a *paradox* that they starved in a land full of food. | Парадокс в том, что они умерли от голода на земле, полной еды.
- preview | n | ˈpriːvjuː |  | предварительный просмотр | an opportunity to see something before it is shown to the public | Critics saw a *preview* of the film. | Критики посмотрели фильм на закрытом показе.
- sigh | v | saɪ |  | вздыхать | to breathe out loudly to show you're tired, sad or relieved | She *sighed* and closed the book. | Она вздохнула и закрыла книгу. | gh не читается
- vow | n | vaʊ |  | клятва, обет | a serious promise | They made a *vow* to defeat the disease. | Они поклялись победить болезнь. | гл. vow — клясться
