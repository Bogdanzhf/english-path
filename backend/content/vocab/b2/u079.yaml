title: Feelings and states
title_ru: Чувства и состояния
topic: feelings
words:
- addictive | adj | əˈdɪktɪv |  | вызывающий привыкание | making you want more and more, so it's hard to stop | Many mobile games are designed to be *addictive*. | Многие мобильные игры специально созданы так, чтобы вызывать привыкание.
- arrogant | adj | ˈærəɡənt |  | высокомерный | behaving as if you are more important than others | The scientists were *arrogant* about her lack of training. | Учёные высокомерно относились к отсутствию у неё образования.
- astonished | adj | əˈstɒnɪʃt | əˈstɑːnɪʃt | изумлённый | very surprised | I was *astonished* by the price. | Цена меня поразила.
- creepy | adj | ˈkriːpi |  | жуткий | strange and frightening | The old house is *creepy*. | Старый дом жуткий.
- curiosity | n | ˌkjʊrɪˈɒsɪti | ˌkjʊriːˈɑːsəti | любопытство | wanting to know | I opened it out of *curiosity*. | Я открыл это из любопытства.
- dissatisfied | adj | dɪsˈsætɪsfaɪd |  | недовольный | not happy with something | Many customers were *dissatisfied* with the service. | Многие клиенты были недовольны обслуживанием.
- fascinated | adj | ˈfæsɪneɪtɪd | ˈfæsəneɪtəd | очарованный, увлечённый | very interested | He was *fascinated* by space. | Его увлекал космос.
- horrified | adj | ˈhɒrɪfaɪd | ˈhɔːrɪfaɪd | в ужасе, потрясённый | very shocked and upset | We were *horrified* by the news. | Новость повергла нас в ужас.
- indebted | adj | ˌɪnˈdetɪd |  | обязанный, в долгу | grateful | I'm *indebted* to you for your help. | Я у тебя в долгу за помощь.
- irritated | adj | ˈɪrɪteɪtɪd | ˈɪrəteɪtəd | раздражённый | annoyed | She looked *irritated*. | Она выглядела раздражённой.
- lifeless | adj | ˈlaɪfləs |  | безжизненный | dead; without energy | The town looked *lifeless*. | Город выглядел безжизненным.
- patience | n | ˈpeɪʃəns |  | терпение | the ability to wait calmly | Thank you for your *patience*. | Спасибо за терпение.
- petrified | adj | ˈpetrɪfaɪd | ˈpetrəfaɪd | оцепеневший от страха | extremely frightened | I'm *petrified* of snakes. | Я до смерти боюсь змей.
- powerless | adj | ˈpaʊələs | ˈpaʊərləs | бессильный | without power to change something | We felt *powerless* to help. | Мы чувствовали себя бессильными помочь.
- puzzled | adj | ˈpʌzəld |  | озадаченный | confused | He looked *puzzled*. | Он выглядел озадаченным.
- shaken | adj | ˈʃeɪkən |  | потрясённый | shocked and upset | She was badly *shaken* by the accident. | Авария её сильно потрясла.
- shaky | adj | ˈʃeɪki |  | дрожащий; шаткий | shaking; not firm | His hands were *shaky*. | У него дрожали руки.
- sympathetic | adj | ˌsɪmpəˈθetɪk |  | сочувствующий | showing understanding | She was very *sympathetic* when I was ill. | Она очень сочувствовала, когда я болел. | не «симпатичный»!
- weary | adj | ˈwɪəri | ˈwɪri | усталый, утомлённый | very tired | After years of fighting, he was *weary*. | После многих лет борьбы он был измотан.
- witty | adj | ˈwɪti |  | остроумный | clever and funny | He's a *witty* speaker. | Он остроумный оратор.
