title: Body and health
title_ru: Тело и здоровье
topic: body
words:
- allergy | n | ˈælədʒi | ˈælərdʒi | аллергия | a bad reaction to something | I have an *allergy* to nuts. | У меня аллергия на орехи.
- cancer | n | ˈkænsə | ˈkænsər | рак (болезнь) | a serious disease in which cells grow in an uncontrolled way | Smoking is the main cause of lung *cancer*. | Курение — основная причина рака лёгких. | Cancer — также знак зодиака Рак
- diabetes | n | ˌdaɪəˈbiːtiːz |  | диабет | a disease in which the body cannot control the level of sugar in the blood | My grandfather has type 2 *diabetes*. | У моего дедушки диабет второго типа.
- fracture | n | ˈfræktʃə | ˈfræktʃər | перелом, трещина | a crack or break, especially in a bone | The X-ray showed a *fracture* in his arm. | Рентген показал перелом руки.
- harm | n | hɑːm | hɑːrm | вред | damage or injury | Too much sun can do you *harm*. | Избыток солнца может навредить.
- health insurance | n | helθ ɪnˈʃɔːrəns | helθ ˌɪnˈʃʊrəns | медицинская страховка | insurance that pays for medical care | Do you have *health insurance*? | У тебя есть медицинская страховка?
- influenza | n | ˌɪnfluːˈenzə |  | грипп | the flu | *Influenza* spreads quickly in winter. | Зимой грипп быстро распространяется.
- life expectancy | n | laɪf ɪkˈspektənsi |  | ожидаемая продолжительность жизни | how long people usually live | *Life expectancy* in Japan is very high. | В Японии очень высокая продолжительность жизни.
- mental health | phr |  |  | психическое здоровье | the health of your mind | Exercise is good for your *mental health*. | Физические упражнения полезны для психического здоровья.
- obesity | n | əʊˈbiːsəti | əˈbiːsəti | ожирение | being very fat in an unhealthy way | *Obesity* is a growing problem. | Ожирение — растущая проблема.
- pandemic | n | pænˈdemɪk |  | пандемия | a disease that spreads around the world | Many people worked from home during the *pandemic*. | Во время пандемии многие работали из дома.
- pneumonia | n | njuːˈməʊniə | nuːˈmoʊniə | пневмония, воспаление лёгких | a serious illness of the lungs | He was in hospital with *pneumonia*. | Он лежал в больнице с пневмонией. | p не читается
- prescription | n | prɪˈskrɪpʃn |  | рецепт (врача) | a doctor's written order for medicine | You need a *prescription* for this drug. | На этот препарат нужен рецепт.
- sedentary lifestyle | n | ˈsedəntəri ˈlaɪfstaɪl | ˈsedənteri ˈlaɪfstaɪl | малоподвижный образ жизни | a life with little physical activity | A *sedentary lifestyle* is bad for your heart. | Малоподвижный образ жизни вреден для сердца.
- side effect | n | saɪd ɪˈfekt | saɪd ˈiːfekt | побочный эффект | an extra, often bad, result of a medicine | This drug has no *side effects*. | У этого лекарства нет побочных эффектов.
- tuberculosis | n | ˌtjuːbəkjʊˈləʊsɪs | təˌbɜːrkjəˈloʊsɪs | туберкулёз | a serious disease of the lungs | *Tuberculosis* can be cured. | Туберкулёз излечим. | сокр. TB
- tumor | n | ˈtumɜː | ˈtuːmər | опухоль (амер.) | a mass of cells growing in the body | The doctors removed the *tumor*. | Врачи удалили опухоль. | брит. tumour
- vaccination | n | ˌvæksɪˈneɪʃən | væksəˈneɪʃən | вакцинация, прививка | giving a vaccine | *Vaccination* protects children from disease. | Прививки защищают детей от болезней.
- vaccine | n | vækˈsiːn | ˌvækˈsiːn | вакцина | a substance that protects against disease | Scientists developed a new *vaccine*. | Учёные разработали новую вакцину.
