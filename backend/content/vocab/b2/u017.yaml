title: Body and health
title_ru: Тело и здоровье
topic: body
words:
- bruise | n | bruːz |  | синяк, ушиб | a dark mark on the skin after being hit | He had a *bruise* on his arm. | У него на руке был синяк.
- cancer | n | ˈkænsə | ˈkænsər | рак (болезнь) | a serious disease in which cells grow in an uncontrolled way | Smoking is the main cause of lung *cancer*. | Курение — основная причина рака лёгких. | Cancer — также знак зодиака Рак
- diabetes | n | ˌdaɪəˈbiːtiːz |  | диабет | a disease in which the body cannot control the level of sugar in the blood | My grandfather has type 2 *diabetes*. | У моего дедушки диабет второго типа.
- fracture | n | ˈfræktʃə | ˈfræktʃər | перелом, трещина | a crack or break, especially in a bone | The X-ray showed a *fracture* in his arm. | Рентген показал перелом руки.
