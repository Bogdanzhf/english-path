title: Thinking and opinions
title_ru: Мысли и мнения
topic: mind
words:
- aroma | n | əˈrəʊmə | əˈroʊmə | аромат | a strong pleasant smell, especially of food or drink | The *aroma* of fresh coffee filled the kitchen. | Кухню наполнил аромат свежего кофе.
- camouflage | n | ˈkæməflɑːʒ |  | камуфляж, маскировка | a way of hiding things by making them look like their surroundings | The soldiers wore *camouflage* to hide in the jungle. | Солдаты носили камуфляж, чтобы прятаться в джунглях.
- complexion | n | kəmˈplekʃən |  | цвет лица | the colour of your face's skin | She has a pale *complexion*. | У неё бледный цвет лица.
- 'concept | n | ˈkɒnsept | ˈkɑːnsept | концепция, понятие | an idea | The *concept* of the film was simple: toys come alive. | Идея фильма была проста: игрушки оживают.'
- correctness | n | kəˈrektnəs |  | правильность | being correct | Check the *correctness* of your answers. | Проверьте правильность ответов.
- delicacy | n | ˈdelɪkəsi | ˈdeləkəsi | деликатес; деликатность | special food; gentleness | Snails are a French *delicacy*. | Улитки — французский деликатес.
- disposition | n | ˌdɪspəˈzɪʃən |  | нрав, характер | a person's character | She has a cheerful *disposition*. | У неё весёлый нрав.
- elegance | n | ˈelɪɡəns | ˈeləɡəns | элегантность | being elegant | She dresses with great *elegance*. | Она одевается очень элегантно.
- folly | n | ˈfɒli | ˈfɑːli | глупость, безрассудство | a foolish act | It would be *folly* to ignore the warning. | Было бы безрассудно игнорировать предупреждение.
- glare | n | ɡleə | ɡler | яркий свет; свирепый взгляд | strong light; an angry look | The *glare* of the sun hurt my eyes. | Солнце слепило глаза.
- gleam | v | ɡliːm |  | блестеть, мерцать | to shine softly | The statues' eyes once *gleamed* with white coral. | Когда-то глаза статуй блестели белым кораллом.
- haste | n | heɪst |  | спешка, поспешность | doing something too quickly | In his *haste*, he forgot his keys. | В спешке он забыл ключи. | Haste makes waste. — Поспешишь — людей насмешишь.
- immortality | n | ɪmɔːˈtælɪti | ˌɪmɔːrˈtælɪti | бессмертие | living for ever | Many myths are about the search for *immortality*. | Многие мифы — о поиске бессмертия.
- investigation | n | ɪnˌvestɪˈɡeɪʃən | ˌɪnˌvestəˈɡeɪʃən | расследование | an official examination | The police started an *investigation*. | Полиция начала расследование.
- odor | n | ˈəʊdə | ˈoʊdər | запах (часто неприятный) | a smell, often an unpleasant one | There was a strange *odor* in the room. | В комнате стоял странный запах. | брит. odour
- permanence | n | ˈpɜːmənəns | ˈpɜːrmənəns | постоянство | the state of lasting for a long time | Nothing has *permanence* in politics. | В политике нет ничего постоянного. | permanent — постоянный
- perseverance | n | ˌpɜːsɪˈviərəns | ˌpɜːrsəˈvɪrəns | настойчивость | continuing to try despite difficulty | Learning a language takes *perseverance*. | Изучение языка требует упорства.
- practicality | n | ˈpræktɪˈkælɪti | ˌpræktɪˈkæləti | практичность | being practical | I chose the car for its *practicality*. | Я выбрал машину за практичность.
- proof | n | pruːf |  | доказательство | facts that show something is true | Do you have any *proof*? | У тебя есть доказательства?
- vigor | n | ˈvɪɡɜː | ˈvɪɡər | энергия, сила (амер.) | energy and strength | He works with great *vigor*. | Он работает с большой энергией. | брит. vigour
