title: Feelings and states
title_ru: Чувства и состояния
topic: feelings
words:
- amazement | n | əˈmeɪzmənt |  | изумление | great surprise | She stared at me in *amazement*. | Она смотрела на меня в изумлении.
- anguish | n | ˈæŋɡwɪʃ |  | мука, страдание | great pain or worry | She cried out in *anguish*. | Она вскрикнула от муки.
- attached | adj | əˈtætʃt |  | прикреплённый; привязанный | fixed to; fond of | The form is *attached* to the email. | Форма прикреплена к письму.
- bound | adj | baʊnd |  | связанный; обязательно | tied; certain to | The prisoner was *bound* with rope. | Пленник был связан верёвкой.
- concerned | adj | kənˈsɜːnd | kənˈsɜːrnd | обеспокоенный | worried | I'm *concerned* about your health. | Я беспокоюсь о твоём здоровье.
- convinced | adj | kənˈvɪnst |  | убеждённый | completely sure | I'm *convinced* he's lying. | Я уверен, что он врёт.
- depressed | adj | dɪˈprest |  | подавленный, в депрессии | very sad for a long time | He's been *depressed* since he lost his job. | Он в депрессии с тех пор, как потерял работу.
- desperate | adj | ˈdespərət |  | отчаянный | very worried and ready to do anything | He was *desperate* to find a job. | Он отчаянно искал работу.
- dissatisfaction | n | dɪˌsætɪsˈfækʃən | ˌdɪsætɪsˈfækʃən | недовольство | not being satisfied | There's growing *dissatisfaction* with the government. | Недовольство правительством растёт.
- fed up | adj | fed ʌp |  | сытый по горло | annoyed and bored | I'm *fed up* with this weather. | Мне надоела эта погода.
- grown-up | n | ˈɡrəʊnʌp | ˈɡroʊnʌp | взрослый | an adult | Ask a *grown-up* to help you. | Попроси взрослого помочь тебе.
- homeless | adj | ˈhəʊmləs | ˈhoʊmləs | бездомный | without a home | They help *homeless* people. | Они помогают бездомным.
- impressed | adj | ɪmˈprest | ˌɪmˈprest | впечатлённый | admiring | I was very *impressed* by her work. | Её работа меня очень впечатлила.
- isolated | adj | ˈaɪsəleɪtɪd | ˈaɪsəleɪtəd | изолированный, уединённый | far from others; alone | They live in an *isolated* village. | Они живут в глухой деревне.
- pregnant | adj | ˈpreɡnənt |  | беременная | having a baby growing inside the body | My sister is *pregnant* with twins. | Моя сестра беременна двойней.
- reverence | n | ˈrevrəns | ˈrevərəns | благоговение, почтение | deep respect | They spoke of him with *reverence*. | Они говорили о нём с благоговением.
- satisfied | adj | ˈsætɪsfaɪd |  | довольный, удовлетворённый | pleased because you got what you wanted | Are you *satisfied* with your new phone? | Ты доволен новым телефоном?
- shocked | adj | ʃɒkt | ʃɑːkt | потрясённый | very surprised and upset | I was *shocked* by the news. | Я был потрясён новостью.
- sincerity | n | sɪnˈserɪti | sɪnˈserəti | искренность | being honest | I don't doubt his *sincerity*. | Я не сомневаюсь в его искренности.
- willing | adj | ˈwɪlɪŋ |  | готовый, согласный | happy to do something | Are you *willing* to help? | Ты готов помочь?
