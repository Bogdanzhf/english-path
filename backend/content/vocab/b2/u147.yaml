title: Thinking and opinions
title_ru: Мысли и мнения
topic: mind
words:
- cornerstone | n | ˈkɔːnəstəʊn | ˈkɔːrnərstoʊn | краеугольный камень | the most important part | Trust is the *cornerstone* of friendship. | Доверие — основа дружбы.
- disregard | n | ˌdɪsrɪˈɡɑːd | ˌdɪsrɪˈɡɑːrd | пренебрежение | ignoring | He showed complete *disregard* for safety. | Он полностью пренебрёг безопасностью.
- ethic | n | ˈeθɪk |  | этика, принципы | a set of moral principles | She has a strong work *ethic*. | Она очень добросовестна в работе.
- ethics | n | ˈeθɪks |  | этика | moral principles that control behaviour | Medical *ethics* do not allow doctors to harm patients. | Медицинская этика не позволяет врачам вредить пациентам.
- foundation | n | faʊnˈdeɪʃn |  | фонд; фундамент, основа | an organisation that gives money; the base of a building | The *foundation* helps poor families. | Фонд помогает бедным семьям.
- generalization | n | ˌdʒenɜːəlɪˈzeɪʃən | ˌdʒenərəlɪˈzeɪʃən | обобщение | a general statement | That's a sweeping *generalization*. | Это слишком широкое обобщение. | брит. также generalisation
- hesitation | n | ˌhesɪˈteɪʃən | ˌhezəˈteɪʃən | колебание, нерешительность | waiting because you're not sure | She agreed without *hesitation*. | Она согласилась без колебаний.
- imitation | n | ˌɪmɪˈteɪʃən | ˌɪməˈteɪʃən | имитация, подражание | a copy | It's not real leather — it's an *imitation*. | Это не настоящая кожа, а имитация.
- implication | n | ˌɪmplɪˈkeɪʃən | ˌɪmpləˈkeɪʃən | последствие; намёк | a possible result; something suggested | Think about the *implications* of your decision. | Подумай о последствиях своего решения.
- impulse | n | ˈɪmpʌls |  | импульс, порыв | a sudden wish to do something; a short signal | I bought the dress on *impulse*. | Я купила платье импульсивно. | nerve impulse — нервный импульс
- incentive | n | ɪnˈsentɪv |  | стимул | something that encourages you to do something | Tax cuts are an *incentive* for businesses to invest. | Снижение налогов — стимул для бизнеса инвестировать.
- inference | n | ˈɪnfərəns |  | вывод, умозаключение | a conclusion from evidence | What *inference* can we draw from the data? | Какой вывод можно сделать из данных?
- limitation | n | ˌlɪmɪˈteɪʃən |  | ограничение | a limit | Know your *limitations*. | Знай свои возможности.
- mastery | n | ˈmɑːstəri | ˈmæstəri | мастерство, владение | great skill | She has a *mastery* of three languages. | Она в совершенстве владеет тремя языками.
- nuisance | n | ˈnjuːsns | ˈnuːsns | неприятность, помеха | something annoying | The noise from the street is a real *nuisance*. | Шум с улицы — настоящая неприятность.
- originality | n | əˌrɪdʒɪˈnælɪti | əˌrɪdʒəˈnælɪti | оригинальность | being new and different | His work lacks *originality*. | Его работе не хватает оригинальности.
- overlap | v | ˌəʊvəˈlæp | ˌoʊvərˈlæp | частично совпадать, пересекаться | to cover part of the same area or time | Their research interests *overlap*. | Их научные интересы частично пересекаются.
- temptation | n | tempˈteɪʃən | temˈteɪʃən | соблазн, искушение | wanting something you shouldn't | I resisted the *temptation* to eat cake. | Я устоял перед соблазном съесть торт.
- viewpoint | n | ˈvjuːpɔɪnt |  | точка зрения | an opinion | From my *viewpoint*, it's a good idea. | С моей точки зрения, это хорошая идея.
