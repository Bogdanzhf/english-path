title: Thinking and opinions
title_ru: Мысли и мнения
topic: mind
words:
- aspect | n | ˈæspekt |  | аспект, сторона | one part or feature of a situation | Money is only one *aspect* of the problem. | Деньги — лишь одна сторона проблемы.
- awareness | n | əˈweənəs | əˈwernəs | осведомлённость, понимание | knowledge or understanding of something | We need to raise *awareness* of the problem. | Нужно повысить осведомлённость о проблеме.
- burden | n | ˈbɜːdn | ˈbɜːrdn | бремя, тяжесть | a heavy load or a difficult responsibility | I don't want to be a *burden* to my children. | Я не хочу быть обузой для своих детей.
- component | n | kəmˈpəʊnənt | kəmˈpoʊnənt | компонент, составная часть | one of the parts of a machine or system | The machine had hundreds of *components*. | В машине были сотни деталей.
- confidence | n | ˈkɒnfɪdəns | ˈkɑːnfɪdəns | уверенность | the feeling that you can do something well | Speaking in public gave her more *confidence*. | Выступления на публике придали ей уверенности.
- consideration | n | kənˌsɪdəˈreɪʃən |  | рассмотрение; внимание, учёт | careful thought; kindness | After careful *consideration*, we accepted. | После тщательного рассмотрения мы согласились.
- discipline | n | ˈdɪsəplɪn |  | дисциплина; отрасль знания | training to obey rules; a subject of study | Street art requires speed and *discipline*. | Уличное искусство требует скорости и дисциплины.
- distribution | n | ˌdɪstrɪˈbjuːʃən | ˌdɪstrəbˈjuːʃən | распределение; распространение | sharing out; delivering | The *distribution* of wealth is unequal. | Богатство распределено неравномерно.
- exception | n | ɪkˈsepʃn |  | исключение | a person or thing that is not included in a rule | Everyone laughed, with the *exception* of John. | Смеялись все, за исключением Джона.
- framework | n | ˈfreɪmwɜːk | ˈfreɪmwɜːrk | рамки, структура, каркас | a system of rules or ideas; a supporting structure | The law provides a *framework* for medical research. | Закон задаёт рамки для медицинских исследований.
- insight | n | ˈɪnsaɪt |  | понимание, озарение | a clear, deep understanding | The book gives an *insight* into life in ancient Rome. | Книга даёт представление о жизни в Древнем Риме.
- interpretation | n | ɪnˌtɜːprɪˈteɪʃən | ˌɪnˌtɜːrprɪˈteɪʃən | толкование, интерпретация | an explanation of meaning | There are different *interpretations* of the poem. | Стихотворение толкуют по-разному.
- perception | n | pəˈsepʃn | pərˈsepʃn | восприятие, представление | the way you see or understand something | Travel changed my *perception* of the world. | Путешествия изменили моё восприятие мира.
- perspective | n | pəˈspektɪv | pərˈspektɪv | перспектива; точка зрения | a way of thinking | Try to see it from my *perspective*. | Попробуй взглянуть на это с моей точки зрения.
- principle | n | ˈprɪnsəpl |  | принцип | a basic rule or truth | The *principle* of flight is the same for birds and planes. | Принцип полёта одинаков у птиц и самолётов. | не путайте с principal
- racism | n | ˈreɪsɪzəm |  | расизм | unfair treatment because of race | We must fight *racism*. | Мы должны бороться с расизмом.
- requirement | n | rɪˈkwaɪəmənt | rɪˈkwaɪrmənt | требование | something needed | What are the entry *requirements*? | Каковы требования для поступления?
- scheme | n | skiːm |  | схема, план | a plan for doing something | The government started a new *scheme* to help farmers. | Правительство запустило новую программу помощи фермерам. | sch читается как [sk]
- "self-confidence | n | ˌselfˈk\x01ːnfədəns | ˌselfˈkɑːnfədəns | уверенность в себе | belief in yourself | She lacks *self-confidence*. | Ей не хватает уверенности в себе."
- vision | n | ˈvɪʒn |  | зрение; видение | the ability to see; an idea of the future | He has poor *vision* in his left eye. | У него плохое зрение на левый глаз.
