title: Thinking and opinions
title_ru: Мысли и мнения
topic: mind
words:
- aspect | n | ˈæspekt |  | аспект, сторона | one part or feature of a situation | Money is only one *aspect* of the problem. | Деньги — лишь одна сторона проблемы.
- awareness | n | əˈweənəs | əˈwernəs | осведомлённость, понимание | knowledge or understanding of something | We need to raise *awareness* of the problem. | Нужно повысить осведомлённость о проблеме.
- burden | n | ˈbɜːdn | ˈbɜːrdn | бремя, тяжесть | a heavy load or a difficult responsibility | I don't want to be a *burden* to my children. | Я не хочу быть обузой для своих детей.
- component | n | kəmˈpəʊnənt | kəmˈpoʊnənt | компонент, составная часть | one of the parts of a machine or system | The machine had hundreds of *components*. | В машине были сотни деталей.
- confidence | n | ˈkɒnfɪdəns | ˈkɑːnfɪdəns | уверенность | the feeling that you can do something well | Speaking in public gave her more *confidence*. | Выступления на публике придали ей уверенности.
- consideration | n | kənˌsɪdəˈreɪʃən |  | рассмотрение; внимание, учёт | careful thought; kindness | After careful *consideration*, we accepted. | После тщательного рассмотрения мы согласились.
- discipline | n | ˈdɪsəplɪn |  | дисциплина; отрасль знания | training to obey rules; a subject of study | Street art requires speed and *discipline*. | Уличное искусство требует скорости и дисциплины.
- distribution | n | ˌdɪstrɪˈbjuːʃən | ˌdɪstrəbˈjuːʃən | распределение; распространение | sharing out; delivering | The *distribution* of wealth is unequal. | Богатство распределено неравномерно.
- exception | n | ɪkˈsepʃn |  | исключение | a person or thing that is not included in a rule | Everyone laughed, with the *exception* of John. | Смеялись все, за исключением Джона.
- framework | n | ˈfreɪmwɜːk | ˈfreɪmwɜːrk | рамки, структура, каркас | a system of rules or ideas; a supporting structure | The law provides a *framework* for medical research. | Закон задаёт рамки для медицинских исследований.
- insight | n | ˈɪnsaɪt |  | понимание, озарение | a clear, deep understanding | The book gives an *insight* into life in ancient Rome. | Книга даёт представление о жизни в Древнем Риме.
- interpretation | n | ɪnˌtɜːprɪˈteɪʃən | ˌɪnˌtɜːrprɪˈteɪʃən | толкование, интерпретация | an explanation of meaning | There are different *interpretations* of the poem. | Стихотворение толкуют по-разному.
- perception | n | pəˈsepʃn | pərˈsepʃn | восприятие, представление | the way you see or understand something | Travel changed my *perception* of the world. | Путешествия изменили моё восприятие мира.
- perspective | n | pəˈspektɪv | pərˈspektɪv | перспектива; точка зрения | a way of thinking | Try to see it from my *perspective*. | Попробуй взглянуть на это с моей точки зрения.
- principle | n | ˈprɪnsəpl |  | принцип | a basic rule or truth | The *principle* of flight is the same for birds and planes. | Принцип полёта одинаков у птиц и самолётов. | не путайте с principal
- racism | n | ˈreɪsɪzəm |  | расизм | unfair treatment because of race | We must fight *racism*. | Мы должны бороться с расизмом.
- requirement | n | rɪˈkwaɪəmənt | rɪˈkwaɪrmənt | требование | something needed | What are the entry *requirements*? | Каковы требования для поступления?
- scheme | n | skiːm |  | схема, план | a plan for doing something | The government started a new *scheme* to help farmers. | Правительство запустило новую программу помощи фермерам. | sch читается как [sk]
- "self-confidence | n | ˌselfˈk\x01ːnfədəns | ˌselfˈkɑːnfədəns | уверенность в себе | belief in yourself | She lacks *self-confidence*. | Ей не хватает уверенности в себе."
- vision | n | ˈvɪʒn |  | зрение; видение | the ability to see; an idea of the future | He has poor *vision* in his left eye. | У него плохое зрение на левый глаз.
reading:
  title: Does the Full Moon Make Us Crazy?
  title_ru: Сводит ли нас с ума полнолуние?
  text: |
    Ask any nurse or police officer, and many will tell you the same thing: on the night of a full moon, everything goes wrong. Emergency rooms are busier, people behave strangely, and there are more fights. The belief is ancient. In fact, the English word "lunatic", once used for people with mental illness, comes from "luna", the Latin word for moon.

    For centuries, people invoked the lunar cycle to explain all kinds of behaviour. Some early psychiatric hospitals, founded in the Middle Ages, even increased the number of staff on full-moon nights. Doctors believed that the moon could cause seizures in people with epilepsy and that its light affected the brain.

    With the advent of modern psychiatry and statistics, scientists began to test these beliefs. The results have been surprisingly clear. Large studies of hospital records, crime figures and emergency calls have found no definitive link between the full moon and human behaviour. In one study, researchers examined thousands of psychiatric emergency sessions and found no increase on full-moon nights.

    So why does the belief survive? Psychologists say it's because of how our memory works. When something strange happens during a full moon, we notice it and remember it. When a strange night happens without a full moon, we forget it. We tend to equate the two things because we are looking for a pattern. This kind of thinking is almost a mental reflex.

    There may be one small exception. A few studies suggest that people sleep slightly less around the full moon, perhaps because of the extra light. Our ancestors had no electric lights, so the moon made a real difference. Today, scientists say the idea that the moon controls our minds is outmoded. But the next time you have an almighty argument with a friend under a full moon, it might be easier to blame the moon than yourself.
  ru: |
    Спросите любую медсестру или полицейского — многие скажут одно и то же: в полнолуние всё идёт наперекосяк. В приёмных отделениях больше людей, люди ведут себя странно, и драк больше. Это поверье очень древнее. Даже английское слово lunatic, которым когда-то называли душевнобольных, происходит от luna — латинского слова «луна».

    Веками люди ссылались на лунный цикл, чтобы объяснить самое разное поведение. В некоторых ранних психиатрических больницах, основанных ещё в Средние века, в полнолуние даже увеличивали число персонала. Врачи считали, что луна может вызывать приступы у людей с эпилепсией и что её свет влияет на мозг.

    С появлением современной психиатрии и статистики учёные начали проверять эти убеждения. Результаты оказались на удивление однозначными. Масштабные исследования больничных записей, данных о преступности и вызовов экстренных служб не обнаружили никакой определённой связи между полнолунием и поведением людей. В одном исследовании учёные изучили тысячи экстренных психиатрических обращений и не нашли никакого роста в ночи полнолуния.

    Почему же поверье живёт? Психологи говорят, что всё дело в том, как работает наша память. Когда в полнолуние случается что-то странное, мы это замечаем и запоминаем. Когда странная ночь выпадает не на полнолуние, мы о ней забываем. Мы склонны связывать эти две вещи, потому что ищем закономерность. Такое мышление — почти рефлекс.

    Возможно, есть одно небольшое исключение. Некоторые исследования предполагают, что в полнолуние люди спят немного меньше — возможно, из-за дополнительного света. У наших предков не было электрического освещения, так что луна имела для них реальное значение. Сегодня учёные считают устаревшей идею о том, что луна управляет нашим разумом. Но в следующий раз, когда вы страшно поссоритесь с другом под полной луной, будет проще обвинить луну, чем себя.
  questions:
  - q: Where does the word 'lunatic' come from?
    options:
    - A Greek god
    - The Latin word for moon
    - A hospital name
    - A doctor's name
    answer: 1
  - q: What did large studies find?
    options:
    - The full moon causes more crime
    - No definitive link between the full moon and behaviour
    - More seizures at full moon
    - People are happier at full moon
    answer: 1
  - q: Why does the belief survive, according to psychologists?
    options:
    - Because it is true
    - We remember strange events during full moons and forget others
    - Doctors teach it
    - Films show it
    answer: 1
  - tf: Some studies suggest people sleep slightly less around the full moon.
    answer: true
  - tf: Modern scientists agree the moon controls our minds.
    answer: false
