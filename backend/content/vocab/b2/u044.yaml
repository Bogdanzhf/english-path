title: Work and jobs
title_ru: Работа и профессии
topic: work
words:
- caretaker | n | ˈkeəteɪkə | ˈkerteɪkər | смотритель, сторож | a person who looks after a building or property | The school *caretaker* locks the doors every night. | Школьный сторож каждый вечер запирает двери.
- courier | n | ˈkʊriə | ˈkʊriər | курьер | a person or company that delivers parcels | The *courier* left the parcel at the door. | Курьер оставил посылку у двери.
- shepherd | n | ˈʃepəd | ˈʃepərd | пастух | a person who looks after sheep | The *shepherd* led his sheep down the hill. | Пастух вёл овец с холма.
- steward | n | ˈstjuːəd | ˈstuːərd | стюард, распорядитель | a person who looks after passengers on a ship or plane | The *steward* brought us some water. | Стюард принёс нам воды.
