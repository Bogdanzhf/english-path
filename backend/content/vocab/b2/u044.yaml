title: Work and jobs
title_ru: Работа и профессии
topic: work
words:
- bartender | n | ˈbɑːtendə | ˈbɑːrtendər | бармен | a person who serves drinks in a bar | The *bartender* made us cocktails. | Бармен приготовил нам коктейли.
- blacksmith | n | ˈblæksmɪθ |  | кузнец | a person who makes things out of iron | The *blacksmith* made shoes for the horses. | Кузнец ковал подковы для лошадей.
- butler | n | ˈbʌtlə | ˈbʌtlər | дворецкий | the chief male servant in a large house | The *butler* opened the door. | Дверь открыл дворецкий.
- commander | n | kəˈmɑːndə | kəˈmændər | командир | a person in charge of soldiers | The *commander* gave orders. | Командир отдал приказы.
- craftsman | n | ˈkrɑːftsmən | ˈkræfsmən | ремесленник, мастер | a skilled worker who makes things | The table was made by a local *craftsman*. | Стол сделал местный мастер.
- critic | n | ˈkrɪtɪk |  | критик | a person whose job is to give opinions about books, films or music | The *critics* loved the new film. | Критикам новый фильм очень понравился.
- electrician | n | ɪlɪkˈtrɪʃən | ɪlekˈtrɪʃən | электрик | a person who fixes electrical things | Call an *electrician*. | Вызови электрика.
- helper | n | ˈhelpə | ˈhelpər | помощник | a person who helps | She's a volunteer *helper* at the school. | Она волонтёр-помощник в школе.
- housekeeper | n | ˈhaʊskiːpə | ˈhaʊskiːpər | экономка, домработница | a person who cleans and cooks in a house | They have a *housekeeper*. | У них есть домработница.
- lecturer | n | ˈlektʃərə | ˈlektʃərər | преподаватель (вуза), лектор | a teacher at a university | She's a *lecturer* in history. | Она преподаёт историю в университете.
- lieutenant | n | lefˈtenənt | luːˈtenənt | лейтенант | an officer of low rank in the army or navy | The *lieutenant* gave orders to his men. | Лейтенант отдал приказ своим людям. | брит. [lefˈtenənt], амер. [luːˈtenənt]
- mechanic | n | məˈkænɪk |  | механик, автомеханик | a person who repairs cars or machines | The *mechanic* fixed my car in an hour. | Механик починил мою машину за час.
- miner | n | ˈmaɪnə | ˈmaɪnər | шахтёр | a person who works underground to get coal or metal | His father was a coal *miner*. | Его отец был шахтёром. | mine — шахта
- mover | n | ˈmuːvə | ˈmuːvər | грузчик (при переезде) | a person who moves furniture | The *movers* carried the piano. | Грузчики несли пианино.
- pharmacist | n | ˈfɑːməsɪst | ˈfɑːrməsɪst | фармацевт | a person who prepares medicines | Ask the *pharmacist* for advice. | Спросите совета у фармацевта.
- plumber | n | ˈplʌmə | ˈplʌmər | сантехник | a person who fixes water pipes | We need a *plumber*. | Нам нужен сантехник.
- sergeant | n | ˈsɑːdʒənt | ˈsɑːrdʒənt | сержант | an officer of middle rank in the army or police | The *sergeant* organized the rescue. | Сержант организовал спасательную операцию.
- surgeon | n | ˈsɜːdʒən | ˈsɜːrdʒən | хирург | a doctor who performs operations | The *surgeon* operated for six hours. | Хирург оперировал шесть часов. | surgery — хирургия, операция
- tutor | n | ˈtjuːtə | ˈtuːtər | репетитор, наставник | a private teacher | My English *tutor* comes on Tuesdays. | Мой репетитор по английскому приходит по вторникам.
- workman | n | ˈwɜːkmən | ˈwɜːrkmən | рабочий | a man who does physical work | *Workmen* are repairing the road. | Рабочие ремонтируют дорогу.
