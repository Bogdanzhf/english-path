title: Society and politics
title_ru: Общество и политика
topic: society
words:
- abuse | v | əˈbjuːz |  | злоупотреблять; оскорблять | to use something wrongly; to treat someone badly | He *abused* his power as a manager. | Он злоупотребил своей властью руководителя. | сущ. abuse [əˈbjuːs]
- 'aid | n | eɪd |  | помощь | help, often money or food | They sent *aid* to the flood victims. | Пострадавшим от наводнения отправили помощь. | гл.: aid — помогать'
- appeal | v | əˈpiːl |  | нравиться, привлекать | to be attractive or interesting to someone | The idea of living by the sea really *appeals* to me. | Идея жить у моря мне очень нравится. | appeal to someone
- aristocracy | n | ˌærɪˈstɒkrəsi | ˌærɪˈstɑːkrəsi | аристократия | the highest social class, usually with titles and land | The French *aristocracy* lost its power after 1789. | Французская аристократия лишилась власти после 1789 года.
- commission | v | kəˈmɪʃn |  | заказывать (работу) | to officially ask someone to make something for you | The city *commissioned* a statue of the poet. | Город заказал статую поэта. | сущ. commission — комиссия; заказ
- conduct | v | kənˈdʌkt |  | проводить; дирижировать | to organize and do something | The police *conducted* an investigation. | Полиция провела расследование. | сущ. conduct [ˈkɒndʌkt] — поведение
- doomed | adj | duːmd |  | обречённый | certain to fail, die or be destroyed | The city seemed *doomed*. | Казалось, город обречён.
- engage | v | ɪnˈɡeɪdʒ |  | заниматься; вовлекать | to take part in something; to attract attention | The teacher tries to *engage* all the students. | Учитель старается вовлечь всех учеников. | be engaged — быть помолвленным
- faith | n | feɪθ |  | вера | strong belief or trust | I have *faith* in you — you can do it. | Я в тебя верю — у тебя получится.
- frustrated | adj | frʌˈstreɪtɪd | ˈfrʌstreɪtəd | раздосадованный | annoyed because you can't do something | I get *frustrated* when the computer is slow. | Меня раздражает, когда компьютер тормозит.
- implement | v | ˈɪmplɪment |  | внедрять, осуществлять | to put a plan into action | The school will *implement* the new rules in September. | Школа введёт новые правила в сентябре.
- monarch | n | ˈmɒnək | ˈmɑːnərk | монарх | a king or queen | The *monarch* opened the new museum. | Монарх открыл новый музей.
- nobility | n | nəʊˈbɪlɪti | noʊˈbɪləti | знать, дворянство; благородство | people of high social rank | The palace was built for the *nobility*. | Дворец построили для знати.
- register | v | ˈredʒɪstə | ˈredʒɪstər | регистрировать(ся) | to put a name on an official list | All sales must be *registered*. | Все продажи должны регистрироваться.
- rescue | v | ˈreskjuː |  | спасать | to save someone from danger | The fishermen *rescued* the crew. | Рыбаки спасли экипаж.
- 'struggle | v | ˈstrʌɡl |  | бороться; с трудом справляться | to try very hard | She *struggled* to open the door. | Она с трудом открыла дверь. | сущ.: struggle — борьба'
- subculture | n | ˈsʌbkʌltʃə | ˈsʌbkʌltʃər | субкультура | a group with its own style within society | Punk was a youth *subculture*. | Панк был молодёжной субкультурой.
- transfer | v | trænsˈfɜː | trænsˈfɜːr | переводить, переносить | to move someone or something from one place to another | The patient was *transferred* to another hospital. | Пациента перевели в другую больницу.
- troop | n | truːp |  | отряд; войска (troops) | a group of soldiers | *Troops* were sent to the area. | В регион направили войска.
