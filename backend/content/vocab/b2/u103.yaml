title: Actions and movement
title_ru: Действия и движение
topic: actions
words:
- activate | v | ˈæktɪveɪt | ˈæktəveɪt | активировать, включать | to start | *Activate* your card online. | Активируйте карту онлайн.
- approach | v | əˈprəʊtʃ | əˈproʊtʃ | приближаться, подходить | to come nearer to someone or something | The cat slowly *approached* the bird. | Кошка медленно приблизилась к птице.
- boost | v | buːst |  | повышать, поднимать | to increase or improve something | The good news *boosted* everyone's mood. | Хорошая новость подняла всем настроение.
- brew | v | bruː |  | заваривать, варить (пиво) | to make tea, coffee or beer | She *brewed* a pot of strong tea. | Она заварила чайник крепкого чая. | brewery — пивоварня
- chase | v | tʃeɪs |  | гнаться, преследовать | to run after someone to catch them | The police *chased* the thief down the street. | Полиция гналась за вором по улице.
- cultivate | v | ˈkʌltɪveɪt |  | выращивать, возделывать; развивать | to grow plants; to develop a skill or relationship | Coffee is *cultivated* in over seventy countries. | Кофе выращивают в более чем семидесяти странах.
- demolish | v | dɪˈmɒlɪʃ | dɪˈmɑːlɪʃ | сносить | to destroy a building | The old factory was *demolished*. | Старую фабрику снесли.
- fulfil | v | fʊlˈfɪl |  | выполнять; осуществлять | to do what is promised; to make real | She *fulfilled* her dream of travelling. | Она осуществила мечту о путешествиях. | амер. fulfill
- improvise | v | ˈɪmprəvaɪz |  | импровизировать | to make or do something without preparation, using what you have | We had no table, so we *improvised* with boxes. | Стола не было, поэтому мы соорудили его из коробок.
- motivate | v | ˈməʊtɪveɪt | ˈmoʊtəveɪt | мотивировать | to make someone want to do something | A good teacher *motivates* students. | Хороший учитель мотивирует учеников.
- redo | v | rɪˈdu | riːˈduː | переделывать | to do again | I have to *redo* my homework. | Мне надо переделать домашку.
- rehearse | v | rɪˈhɜːs | rɪˈhɜːrs | репетировать | to practise a performance before the real one | The actors *rehearsed* for six weeks. | Актёры репетировали шесть недель. | rehearsal — репетиция
- renew | v | rɪˈnjuː | rɪˈnuː | продлевать, обновлять | to make valid again | I need to *renew* my passport. | Мне надо продлить паспорт.
- reproduce | v | ˌriːprəˈdjuːs | ˌriːprəˈduːs | воспроизводить; размножаться | to make a copy of something; to produce young | Rabbits *reproduce* very quickly. | Кролики размножаются очень быстро.
- row | v | rəʊ | roʊ | грести | to move a boat with oars | We *rowed* across the lake. | Мы переплыли озеро на вёслах.
- settle | v | ˈsetl |  | улаживать; поселиться | to end an argument; to start living in a place | They *settled* the argument quickly. | Они быстро уладили спор. | settle down — остепениться
- ship | v | ʃɪp |  | отправлять, доставлять | to send goods | We *ship* worldwide. | Мы доставляем по всему миру.
- slide | v | slaɪd |  | скользить | to move smoothly | The children *slid* on the ice. | Дети скользили по льду. | slide – slid – slid
- undertake | v | ˌʌndəˈteɪk | ˌʌndərˈteɪk | предпринимать, браться за | to start doing a piece of work you are responsible for | She *undertook* a study of medieval art. | Она взялась за изучение средневекового искусства. | undertake — undertook — undertaken
- wind | v | waɪnd |  | извиваться; заводить (часы) | to turn; to follow a curving path | The road *winds* through the hills. | Дорога вьётся по холмам. | wind [waɪnd] – wound – wound
