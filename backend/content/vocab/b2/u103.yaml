title: Actions and movement
title_ru: Действия и движение
topic: actions
words:
- accomplish | v | əˈkʌmplɪʃ | əˈkɑːmplɪʃ | выполнять, достигать | to succeed in doing something | We *accomplished* a lot in one day. | За один день мы многого добились.
- brew | v | bruː |  | заваривать, варить (пиво) | to make tea, coffee or beer | She *brewed* a pot of strong tea. | Она заварила чайник крепкого чая. | brewery — пивоварня
- capture | v | ˈkæptʃə | ˈkæptʃər | захватывать, ловить; запечатлеть | to catch someone; to show something in a photo | The photo *captures* the beauty of the lake. | Фотография передаёт красоту озера.
- construct | v | kənˈstrʌkt |  | строить, конструировать | to build or make something | They *constructed* a model of the city. | Они построили макет города.
- cultivate | v | ˈkʌltɪveɪt |  | выращивать, возделывать; развивать | to grow plants; to develop a skill or relationship | Coffee is *cultivated* in over seventy countries. | Кофе выращивают в более чем семидесяти странах.
- evolve | v | iˈvɒlv | iˈvɑːlv | эволюционировать, развиваться | to develop gradually | Birds *evolved* from dinosaurs. | Птицы произошли от динозавров. | evolution — эволюция
- fulfill | v | fʊlˈfɪl |  | выполнять, осуществлять | to do what is promised or hoped | They *fulfilled* their goal of reaching the coast. | Они достигли своей цели — дошли до побережья. | брит. fulfil
- manufacture | v | ˌmænjuˈfæktʃə | ˌmænjuˈfæktʃər | производить | to make goods in large numbers in a factory | The company *manufactures* medical equipment. | Компания производит медицинское оборудование.
- prompt | v | prɒmpt | prɑːmpt | побуждать, вызывать | to cause someone to do something | The accident *prompted* a change in the law. | Авария побудила изменить закон. | прил. prompt — быстрый, незамедлительный
- reproduce | v | ˌriːprəˈdjuːs | ˌriːprəˈduːs | воспроизводить; размножаться | to make a copy of something; to produce young | Rabbits *reproduce* very quickly. | Кролики размножаются очень быстро.
- undertake | v | ˌʌndəˈteɪk | ˌʌndərˈteɪk | предпринимать, браться за | to start doing a piece of work you are responsible for | She *undertook* a study of medieval art. | Она взялась за изучение средневекового искусства. | undertake — undertook — undertaken
