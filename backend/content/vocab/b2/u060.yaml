title: 'How and how much: adverbs'
title_ru: 'Как и насколько: наречия'
topic: manner
words:
- accurately | adv | ˈækjʊrətli | ˈækjərətli | точно | correctly | Measure the room *accurately*. | Точно измерьте комнату.
- alternatively | adv | ɔːlˈtɜːnətɪvli | ɔːlˈtɜːrnətɪvli | или же, в качестве альтернативы | as another option | We could take the train. *Alternatively*, we could drive. | Можно поехать поездом. Или же на машине.
- awhile | adv | əˈwaɪl |  | некоторое время, ненадолго | for a short time | Stay *awhile* and have some tea. | Посиди немного, выпей чаю.
- broadly | adv | ˈbrɔːdli |  | в целом, в общих чертах | generally | I *broadly* agree with you. | В целом я с тобой согласен.
- continually | adv | kənˈtɪnjuːəli |  | постоянно | again and again | He's *continually* complaining. | Он постоянно жалуется.
- critically | adv | ˈkrɪtɪkli | ˈkrɪtɪkəli | критически; серьёзно | in a critical way; seriously | She's *critically* ill. | Она в критическом состоянии.
- desperately | adv | ˈdespərətli |  | отчаянно | very much; with despair | He *desperately* needs help. | Ему отчаянно нужна помощь.
- dramatically | adv | drəˈmætɪkli | drəˈmætɪkəli | резко, значительно | suddenly and greatly | Prices rose *dramatically*. | Цены резко выросли.
- extensively | adv | ɪkˈstensɪvli |  | широко, обширно | a lot; in many places | She has travelled *extensively*. | Она много путешествовала.
- financially | adv | faɪˈnænʃəli | ˌfaɪˈnænʃəli | в финансовом отношении | relating to money | He's *financially* independent. | Он финансово независим.
- globally | adv | ˈɡləʊbəli | ˈɡloʊbəli | глобально, во всём мире | around the world | The product is sold *globally*. | Продукт продаётся по всему миру.
- inevitably | adv | ɪˈnevɪtəbli | ˌɪˈnevətəbli | неизбежно | certainly | *Inevitably*, there were problems. | Неизбежно возникли проблемы.
- inland | adv | ˌɪnˈlænd |  | вглубь страны, внутри страны | in or towards the middle of a country, away from the coast | The storms moved *inland*. | Бури двинулись вглубь континента.
- promptly | adv | ˈprɒmptli | ˈprɑːmpli | быстро, без промедления; ровно | quickly; exactly on time | She replied *promptly*. | Она быстро ответила.
- sharply | adv | ˈʃɑːpli | ˈʃɑːrpli | резко | suddenly and strongly | Prices fell *sharply*. | Цены резко упали.
- steadily | adv | ˈstedɪli | ˈstedəli | стабильно, неуклонно | gradually and evenly | Sales have grown *steadily*. | Продажи неуклонно росли.
- sufficiently | adv | səˈfɪʃəntli |  | достаточно | enough | He's *sufficiently* qualified for the job. | Он достаточно квалифицирован для этой работы.
- supposedly | adv | sʌˈpəʊzɪdli | səˈpoʊzədli | якобы | as people say | The house is *supposedly* haunted. | Говорят, в доме водятся привидения.
- terribly | adv | ˈterəbli |  | ужасно, очень | very; very badly | I'm *terribly* sorry. | Мне ужасно жаль.
