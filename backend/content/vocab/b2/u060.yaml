title: 'How and how much: adverbs'
title_ru: 'Как и насколько: наречия'
topic: manner
words:
- awhile | adv | əˈwaɪl |  | некоторое время, ненадолго | for a short time | Stay *awhile* and have some tea. | Посиди немного, выпей чаю.
- inland | adv | ˌɪnˈlænd |  | вглубь страны, внутри страны | in or towards the middle of a country, away from the coast | The storms moved *inland*. | Бури двинулись вглубь континента.
