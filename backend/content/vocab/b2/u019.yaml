title: Body and health
title_ru: Тело и здоровье
topic: body
words:
- ambulance | n | ˈæmbjələns |  | скорая помощь | a vehicle that takes sick people to hospital | Call an *ambulance*! | Вызовите скорую!
- arm | v | ɑːm | ɑːrm | вооружать | to give weapons to | The soldiers were *armed* with rifles. | Солдаты были вооружены винтовками.
- bruise | n | bruːz |  | синяк, ушиб | a dark mark on the skin after being hit | He had a *bruise* on his arm. | У него на руке был синяк.
- cholesterol | n | kəˈlestərɒl | kəˈlestərɔːl | холестерин | a fatty substance in the blood | High *cholesterol* increases the risk of heart disease. | Высокий холестерин повышает риск болезней сердца.
- clinic | n | ˈklɪnɪk |  | клиника, поликлиника | a place where people get medical help | She works at a dental *clinic*. | Она работает в стоматологической клинике.
- coma | n | ˈkəʊmə | ˈkoʊmə | кома | a deep unconscious state | He was in a *coma* for a week. | Он неделю пролежал в коме.
- disabled | adj | dɪsˈeɪbld |  | с ограниченными возможностями | having a condition that makes some activities difficult | The building has an entrance for *disabled* people. | В здании есть вход для людей с ограниченными возможностями.
- guts | n | ɡʌts |  | смелость; внутренности | courage (informal); the stomach and intestines | It takes *guts* to speak in public. | Чтобы выступать на публике, нужна смелость.
- hygiene | n | ˈhaɪdʒiːn |  | гигиена | keeping yourself and your surroundings clean | Good *hygiene* prevents the spread of disease. | Хорошая гигиена предотвращает распространение болезней.
- malaria | n | mæˈleəriə | məˈleriə | малярия | a disease spread by mosquitoes | *Malaria* is common in tropical countries. | Малярия распространена в тропических странах.
- massage | n | ˈmæsɑːʒ | məˈsɑːʒ | массаж | rubbing the body to relax | I had a back *massage*. | Мне сделали массаж спины.
- nursing | n | ˈnɜːsɪŋ | ˈnɜːrsɪŋ | сестринское дело, уход | the job of caring for sick people | She studied *nursing*. | Она училась на медсестру.
- patient | adj | ˈpeɪʃnt |  | терпеливый | able to wait calmly | Be *patient* — the bus will come. | Наберись терпения — автобус придёт.
- plague | n | pleɪɡ |  | чума; бедствие | a deadly disease that spreads quickly | The *plague* killed millions of people. | Чума унесла миллионы жизней.
- remedy | n | ˈremədi |  | средство, лекарство | a cure for an illness or a solution to a problem | Honey is a traditional *remedy* for sore throats. | Мёд — традиционное средство от боли в горле.
- slash | n | slæʃ |  | косая черта; порез | the mark (/); a long cut | Type a forward *slash*. | Наберите косую черту.
- syndrome | n | ˈsɪndrəʊm | ˈsɪndroʊm | синдром | a group of symptoms | Down's *syndrome* is a genetic condition. | Синдром Дауна — генетическое состояние.
- ward | n | wɔːd | wɔːrd | палата | a room in a hospital | She's in the children's *ward*. | Она в детской палате.
- X-ray | n | ˈeksreɪ |  | рентген | a photo of the inside of the body | The *X-ray* showed a broken bone. | Рентген показал перелом.
