title: Body and health
title_ru: Тело и здоровье
topic: body
words:
- ambulance | n | ˈæmbjələns |  | скорая помощь | a vehicle that takes sick people to hospital | Call an *ambulance*! | Вызовите скорую!
- cholesterol | n | kəˈlestərɒl | kəˈlestərɔːl | холестерин | a fatty substance in the blood | High *cholesterol* increases the risk of heart disease. | Высокий холестерин повышает риск болезней сердца.
- disabled | adj | dɪsˈeɪbld |  | с ограниченными возможностями | having a condition that makes some activities difficult | The building has an entrance for *disabled* people. | В здании есть вход для людей с ограниченными возможностями.
- guts | n | ɡʌts |  | смелость; внутренности | courage (informal); the stomach and intestines | It takes *guts* to speak in public. | Чтобы выступать на публике, нужна смелость.
- hygiene | n | ˈhaɪdʒiːn |  | гигиена | keeping yourself and your surroundings clean | Good *hygiene* prevents the spread of disease. | Хорошая гигиена предотвращает распространение болезней.
- plague | n | pleɪɡ |  | чума; бедствие | a deadly disease that spreads quickly | The *plague* killed millions of people. | Чума унесла миллионы жизней.
- remedy | n | ˈremədi |  | средство, лекарство | a cure for an illness or a solution to a problem | Honey is a traditional *remedy* for sore throats. | Мёд — традиционное средство от боли в горле.
