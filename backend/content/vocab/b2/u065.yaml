title: Arts and media
title_ru: Искусство и медиа
topic: arts
words:
- artistic | adj | ɑːˈtɪstɪk | ɑːrˈtɪstɪk | художественный; творческий | relating to art; good at art | She's very *artistic*. | У неё большие творческие способности.
- artwork | n | ˈɑːtwɜːk | ˈɑːrtwɜːrk | произведение искусства; иллюстрации | a painting or sculpture; pictures in a book | The museum has 5,000 *artworks*. | В музее 5000 произведений искусства.
- biography | n | baɪˈɒɡrəfi | baɪˈɑːɡrəfi | биография | a book about someone's life written by another person | I'm reading a *biography* of Mozart. | Я читаю биографию Моцарта. | autobiography — автобиография
- cast | v | kɑːst | kæst | бросать, забрасывать | to throw something, like a fishing line | He *cast* his line into the river. | Он забросил удочку в реку. | cast — cast — cast
- gig | n | ɡɪɡ |  | концерт, выступление (разг.) | a live music performance | The band has a *gig* tonight. | У группы сегодня концерт.
- legend | n | ˈledʒənd |  | легенда | an old story that may not be true | There is a *legend* about a dragon in this lake. | Есть легенда о драконе в этом озере.
- lyrics | n | ˈlɪrɪks |  | слова песни | the words of a song | I don't know the *lyrics*. | Я не знаю слов песни.
- monster | n | ˈmɒnstə | ˈmɑːnstər | чудовище, монстр | a frightening creature | The film is about a sea *monster*. | Фильм о морском чудовище.
- myth | n | mɪθ |  | миф | an ancient story; a false belief | It's a *myth* that all snakes are dangerous. | То, что все змеи опасны, — миф.
- oil painting | n | ɔɪl ˈpeɪntɪŋ |  | картина маслом | a picture painted with oil paints | There's an *oil painting* above the fireplace. | Над камином висит картина маслом.
- performing arts | n | pəˈfɔːmɪŋ ɑːts | pərˈfɔːrmɪŋ ɑːrts | исполнительские искусства | music, dance and theatre | She studies the *performing arts*. | Она изучает сценические искусства.
- punk | n | pʌŋk |  | панк | a style of loud rock music; a fan of it | He listens to *punk*. | Он слушает панк.
- screening | n | ˈskriːnɪŋ |  | показ (фильма); обследование | showing a film; a medical test | There's a free *screening* of the film tonight. | Сегодня бесплатный показ фильма.
- showcase | n | ˈʃəʊkeɪs | ˈʃoʊkeɪs | витрина, демонстрация | an event to show something | The festival is a *showcase* for young artists. | Фестиваль — площадка для молодых художников.
- 'sketch | v | sketʃ |  | делать набросок | to draw quickly | She *sketched* the view. | Она сделала набросок пейзажа. | сущ.: sketch — эскиз; сценка'
- sonnet | n | ˈsɒnɪt | ˈsɑːnɪt | сонет | a poem with 14 lines | Shakespeare wrote 154 *sonnets*. | Шекспир написал 154 сонета.
- still life | n | stɪl laɪf |  | натюрморт | a painting of objects like fruit | She painted a *still life* of flowers. | Она написала натюрморт с цветами.
- tale | n | teɪl |  | сказка, история | a story, often about imaginary events | My grandmother told me *tales* about dragons. | Бабушка рассказывала мне сказки о драконах. | fairy tale — волшебная сказка
- vampire | n | ˈvæmpaɪə | ˈvæmpaɪər | вампир | in stories, a dead person who drinks blood | *Vampire* bats feed on blood. | Летучие мыши-вампиры питаются кровью.
- verse | n | vɜːs | vɜːrs | стих, куплет | poetry; a part of a song | The song has three *verses*. | В песне три куплета.
- visual arts | n | ˈvɪʒuːəl ɑːts | ˈvɪʒəwəl ɑːrts | изобразительные искусства | arts that you look at | She teaches *visual arts*. | Она преподаёт изобразительное искусство.
