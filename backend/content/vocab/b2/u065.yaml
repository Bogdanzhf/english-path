title: Technology
title_ru: Технологии
topic: tech
words:
- cyberspace | n | ˈsaɪbəspeɪs | ˈsaɪbərspeɪs | киберпространство | the online world of computer networks | My email seems to have disappeared into *cyberspace*. | Моё письмо, кажется, затерялось в киберпространстве.
- input | n | ˈɪnpʊt |  | ввод; вклад | information put into a computer; ideas and help given | We need more *input* from our users. | Нам нужно больше отзывов от пользователей. | output — вывод, результат
- log | n | lɒɡ | lɔːɡ | бревно, полено | a thick piece of a tree trunk | He put another *log* on the fire. | Он подбросил ещё одно полено в огонь.
- microchip | n | ˈmaɪkrəʊtʃɪp | ˈmaɪkroʊtʃɪp | микрочип | a very small piece of material with electronic circuits | Every phone contains dozens of *microchips*. | В каждом телефоне десятки микрочипов.
- monitor | v | ˈmɒnɪtə | ˈmɑːnɪtər | следить, контролировать | to watch something carefully over time | Doctors *monitored* his heart all night. | Врачи всю ночь следили за его сердцем. | сущ. monitor — монитор
- telegraph | n | ˈtelɪɡrɑːf | ˈtelɪɡræf | телеграф | an old system for sending messages along wires | News came by *telegraph*. | Новости пришли по телеграфу.
- viral | adj | ˈvaɪrəl |  | вирусный | caused by a virus; spread quickly online | The video went *viral*. | Видео стало вирусным.
