title: Communication and language
title_ru: Общение и язык
topic: communication
words:
- bid | n | bɪd |  | попытка; заявка; ставка | an attempt to achieve something; an offer of money | They made a desperate *bid* to escape. | Они предприняли отчаянную попытку спастись.
- body language | n | ˈbɒdi ˈlæŋɡwɪdʒ | ˈbɑːdi ˈlæŋɡwədʒ | язык тела | communication through movements | His *body language* showed he was nervous. | По языку тела было видно, что он нервничает.
- booklet | n | ˈbʊklət | ˈbʊklɪt | брошюра | a small thin book | Read the information *booklet*. | Прочитайте информационную брошюру.
- caption | n | ˈkæpʃən |  | подпись (к картинке) | words under a picture | Write a *caption* for the photo. | Напишите подпись к фото.
- command | n | kəˈmɑːnd | kəˈmænd | команда, приказ | an order that tells someone to do something | The dog understands simple *commands* like “sit”. | Собака понимает простые команды, вроде «сидеть».
- confirmation | n | kɒnfəˈmeɪʃən | ˌkɑːnfərˈmeɪʃən | подтверждение | something that makes it certain | You'll receive a booking *confirmation*. | Вы получите подтверждение бронирования.
- controversy | n | ˈkɒntrəvɜːsi | ˈkɑːntrəvɜːrsi | спор, полемика | a public disagreement | The theory caused great *controversy*. | Теория вызвала бурную полемику.
- digest | v | daɪˈdʒest |  | переваривать; усваивать | to break down food in the stomach | Some foods are hard to *digest*. | Некоторые продукты тяжело перевариваются.
- draft | n | drɑːft | dræft | черновик, набросок | an early version of a piece of writing | I've written the first *draft* of my essay. | Я написал первый черновик эссе. | брит. в значении «сквозняк» — draught
- feedback | n | ˈfiːdbæk |  | обратная связь, отзывы | comments about how well someone did something | The teacher gave us useful *feedback*. | Учитель дал нам полезную обратную связь.
- fluency | n | ˈfluːənsi |  | беглость (речи) | speaking easily and well | Reading improves *fluency*. | Чтение улучшает беглость речи.
- handbook | n | ˈhændbʊk |  | справочник, руководство | a short book of instructions | The army *handbook* told soldiers never to surrender. | Армейское руководство велело солдатам никогда не сдаваться.
- inquiry | n | ɪnˈkwaɪəri | ˌɪnˈkwaɪriː | запрос; расследование | a question; an official investigation | There will be an *inquiry* into the accident. | Будет проведено расследование аварии.
- leaflet | n | ˈliːflət |  | листовка, буклет | a printed sheet with information | They gave out *leaflets* in the street. | На улице раздавали листовки.
- mother tongue | n | ˈməðɜː tʌŋ | ˈmʌðər tʌŋ | родной язык | your first language | Her *mother tongue* is Russian. | Её родной язык — русский.
- objection | n | ɒbˈdʒekʃən | əbˈdʒekʃən | возражение | a reason against | Do you have any *objections*? | У вас есть возражения?
- publication | n | ˌpʌblɪˈkeɪʃn |  | публикация, издание | a book or magazine that is printed; the act of printing it | The magazine celebrated fifty years of *publication*. | Журнал отметил пятидесятилетие выпуска.
- refusal | n | rɪˈfjuːsl | rəfˈjuːzl | отказ | saying no | His *refusal* surprised us. | Его отказ нас удивил.
- rhyme | n | raɪm |  | рифма; стишок | a short poem; words that end with the same sound | 'Cat' and 'hat' are a *rhyme*. | «Cat» и «hat» рифмуются. | nursery rhyme — детский стишок
- sentence | v | ˈsentəns |  | приговаривать | to give a punishment in court | He was *sentenced* to five years. | Его приговорили к пяти годам.
- signature | n | ˈsɪɡnətʃə | ˈsɪɡnətʃər | подпись | your name written in your own way | Please put your *signature* at the bottom. | Пожалуйста, поставьте подпись внизу. | signature song — визитная песня
