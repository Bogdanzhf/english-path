title: Nature and weather
title_ru: Природа и погода
topic: nature
words:
- crust | n | krʌst |  | корка, кора | the hard outer layer of something | The Earth's *crust* is thin under the ocean. | Под океаном земная кора тонкая.
- fragment | n | ˈfræɡmənt |  | фрагмент, осколок | a small piece that has broken off | We found *fragments* of an old plate. | Мы нашли осколки старой тарелки.
- highlands | n | ˈhaɪləndz |  | нагорье, горная местность | an area with mountains | They spent their holiday in the Scottish *Highlands*. | Они провели отпуск в Шотландском высокогорье.
- marine | adj | məˈriːn |  | морской | connected with the sea | She studies *marine* life. | Она изучает морскую жизнь. | сущ. marine — морской пехотинец
- outback | n | ˈaʊtbæk |  | глубинка, малонаселённые районы Австралии | the dry remote inland area of Australia | Few people live in the *outback*. | В австралийской глубинке живёт мало людей.
- ridge | n | rɪdʒ |  | хребет, гребень | a long narrow top of a mountain or hill | We walked along the *ridge* for three hours. | Мы три часа шли по гребню горы.
- shallow | adj | ˈʃæləʊ | ˈʃæloʊ | мелкий, неглубокий | not deep | The children played in the *shallow* water. | Дети играли на мелководье.
- swamp | n | swɒmp | swɑːmp | болото, топь | an area of wet, soft ground | Mosquitoes breed in *swamps*. | Комары размножаются на болотах.
- trail | n | treɪl |  | тропа; след | a path through the countryside | They followed a narrow *trail* into the forest. | Они пошли по узкой тропе в лес.
