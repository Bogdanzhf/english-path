title: Science and research
title_ru: Наука и исследования
topic: science
words:
- aluminum | n | əˈluːmɪnəm |  | алюминий | a light silver-coloured metal | The bikes have *aluminum* frames. | У велосипедов алюминиевые рамы. | брит. aluminium [ˌæljəˈmɪniəm]
- asteroid | n | ˈæstərɔɪd |  | астероид | a large rock that travels around the Sun | An *asteroid* hit the Earth 66 million years ago. | 66 миллионов лет назад в Землю врезался астероид.
- carbon | n | ˈkɑːbən | ˈkɑːrbən | углерод | a chemical element found in all living things, coal and diamonds | Diamonds are made of pure *carbon*. | Алмазы состоят из чистого углерода. | carbon footprint — углеродный след
- hypothesis | n | haɪˈpɒθəsɪs | haɪˈpɑːθəsɪs | гипотеза | an idea that has not yet been proved | The experiment supported his *hypothesis*. | Эксперимент подтвердил его гипотезу. | мн. hypotheses
- launch | v | lɔːntʃ |  | запускать | to send a rocket into space; to start something | The first shuttle was *launched* in 1981. | Первый шаттл был запущен в 1981 году.
- oxygen | n | ˈɒksɪdʒən | ˈɑːksɪdʒən | кислород | the gas in the air that we need to breathe | Plants produce *oxygen*. | Растения вырабатывают кислород.
- phenomenon | n | fəˈnɒmɪnən | fəˈnɑːmɪnɑːn | явление, феномен | something that happens or exists, often unusual | Electric cars have become a global *phenomenon*. | Электромобили стали мировым явлением. | мн. phenomena
- satellite | n | ˈsætəlaɪt |  | спутник | a machine sent into space to go around the Earth | The TV signal comes from a *satellite*. | Телесигнал идёт со спутника.
- telescope | n | ˈtelɪskəʊp | ˈtelɪskoʊp | телескоп | an instrument for looking at faraway things | Through the *telescope*, we saw the rings of Saturn. | В телескоп мы увидели кольца Сатурна.
