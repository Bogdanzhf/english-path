title: Actions and movement
title_ru: Действия и движение
topic: actions
words:
- bustle | v | ˈbʌsl |  | суетиться | to move busily | She *bustled* around the kitchen. | Она суетилась на кухне.
- buzz | v | bʌz |  | жужжать, гудеть | to make a continuous low sound like a bee | Bees *buzzed* around the flowers. | Пчёлы жужжали вокруг цветов.
- demonstrate | v | ˈdemənstreɪt |  | демонстрировать, показывать | to show how something works or that something is true | The teacher *demonstrated* the experiment to the class. | Учитель показал опыт классу.
- detect | v | dɪˈtekt |  | обнаруживать | to notice or find something that is hard to see | The test can *detect* the illness early. | Анализ может выявить болезнь на ранней стадии.
- display | v | dɪˈspleɪ |  | выставлять, показывать | to show | The shop *displays* its goods in the window. | Магазин выставляет товары в витрине.
- expose | v | ɪkˈspəʊz | ɪkˈspoʊz | раскрывать, разоблачать | to show something that was hidden | The journalist *exposed* the minister's lies. | Журналист разоблачил ложь министра.
- flap | v | flæp |  | хлопать, махать (крыльями) | to move up and down quickly | The birds *flapped* their wings. | Птицы хлопали крыльями.
- glance | v | ɡlɑːns | ɡlæns | взглянуть мельком | to look quickly | He *glanced* at his watch. | Он бросил взгляд на часы.
- migrate | v | maɪˈɡreɪt | ˈmaɪɡreɪt | мигрировать, перелетать | (of birds or animals) to travel to another region at certain times of year | Many birds *migrate* south for the winter. | Многие птицы улетают на зиму на юг.
- observe | v | əbˈzɜːv | əbˈzɜːrv | наблюдать | to watch something carefully | Scientists *observe* the birds every spring. | Каждую весну учёные наблюдают за птицами.
- revolve | v | rɪˈvɒlv | rɪˈvɑːlv | вращаться | to move in a circle around a central point | The Moon *revolves* around the Earth. | Луна вращается вокруг Земли.
- scramble | v | ˈskræmbl |  | карабкаться; бороться (за что-то) | to climb or move quickly using hands; to compete for something | People *scrambled* onto the roofs. | Люди карабкались на крыши. | scrambled eggs — яичница-болтунья
- skim | v | skɪm |  | бегло просматривать; снимать (с поверхности) | to read quickly | *Skim* the text for the main idea. | Пробегите текст, чтобы понять основную мысль.
- spot | v | spɒt | spɑːt | заметить | to see | I *spotted* him in the crowd. | Я заметил его в толпе.
- stare | v | steə | ster | пристально смотреть, глазеть | to look at for a long time | Don't *stare* at people! | Не пялься на людей!
- straighten | v | ˈstreɪtn |  | выпрямлять, поправлять | to make straight | *Straighten* your tie. | Поправь галстук.
- stride | v | straɪd |  | шагать (широко) | to walk with long steps | He *strode* into the room. | Он решительно вошёл в комнату.
- stumble | v | ˈstʌmbl |  | спотыкаться; наткнуться | to almost fall; to find by chance | They *stumbled* on the army while digging a well. | Они наткнулись на армию, копая колодец. | stumble across/on — случайно наткнуться
- usher | v | ˈʌʃə | ˈʌʃər | провожать (на место) | to show someone where to go | We were *ushered* into the hall. | Нас провели в зал.
- vibrate | v | vaɪˈbreɪt | ˈvaɪbreɪt | вибрировать, дрожать | to shake quickly with small movements | My phone *vibrated* in my pocket. | Телефон завибрировал у меня в кармане.
