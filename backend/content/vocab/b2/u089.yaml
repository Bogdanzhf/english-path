title: 'How and how much: adverbs'
title_ru: 'Как и насколько: наречия'
topic: manner
words:
- artificially | adv | ˌɑːtɪˈfɪʃəli | ˌɑːrtəˈfɪʃəli | искусственно | not naturally | The prices are kept *artificially* low. | Цены искусственно занижены.
- brilliantly | adv | ˈbrɪlɪəntli | ˈbrɪljəntli | блестяще | very well | She played *brilliantly*. | Она сыграла блестяще.
- confidently | adv | ˈkɒnfɪdəntli | ˈkɑːnfədəntli | уверенно | in a confident way | He spoke *confidently*. | Он говорил уверенно.
- dearly | adv | ˈdiəli | ˈdɪrli | очень сильно; дорого | very much; at a great cost | I love you *dearly*. | Я очень тебя люблю.
- densely | adv | ˈdensli |  | плотно, густо | closely together | It's a *densely* populated area. | Это густонаселённый район.
- endlessly | adv | ˈendləsli |  | бесконечно | without stopping | He talks *endlessly* about football. | Он бесконечно говорит о футболе.
- environmentally | adv | ɪnˌvaɪrənˈmentəli | ɪnˌvaɪrənˈmenəli | экологически | relating to the environment | Use *environmentally* friendly products. | Пользуйтесь экологичными товарами.
- extraordinarily | adv | ekˌstrɔːdɪˈnerəli | ekˌstrɔːrdəˈnerəli | необычайно | extremely | She's *extraordinarily* talented. | Она необычайно талантлива.
- invariably | adv | ɪnˈveərɪəbli | ˌɪnˈveriəbli | неизменно, всегда | always | He's *invariably* late. | Он неизменно опаздывает.
- overboard | adv | ˈəʊvəbɔːd | ˈoʊvərbɔːrd | за борт; слишком | over the side of a ship; too far | Don't go *overboard* with shopping. | Не увлекайся покупками. | go overboard — перегибать палку
- patiently | adv | ˈpeɪʃəntli |  | терпеливо | in a patient way | She waited *patiently*. | Она терпеливо ждала.
- scientifically | adv | saɪənˈtɪfɪkli | ˌsaɪənˈtɪfɪkəli | научно | in a scientific way | It's been *scientifically* proven. | Это научно доказано.
- tremendously | adv | trəˈmendəsli |  | чрезвычайно, невероятно | very much | I enjoyed it *tremendously*. | Мне это невероятно понравилось.
- urgently | adv | ˈɜːdʒəntli | ˈɜːrdʒəntli | срочно | needing quick action | We *urgently* need help. | Нам срочно нужна помощь.
- verbally | adv | ˈvɜːbəli | vərˈbæli | устно, на словах | in spoken words | He agreed *verbally*. | Он согласился на словах.
- vigorously | adv | ˈvɪɡərəsli |  | энергично | with energy | Stir the mixture *vigorously*. | Энергично перемешайте смесь.
- visibly | adv | ˈvɪzəbli |  | заметно | in a way that can be seen | She was *visibly* upset. | Она была заметно расстроена.
- wrongly | adv | ˈrɒŋli | ˈrɔːŋli | неправильно, ошибочно | incorrectly | He was *wrongly* accused. | Его ошибочно обвинили.
