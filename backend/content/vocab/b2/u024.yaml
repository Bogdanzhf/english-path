title: Numbers and quantity
title_ru: Числа и количество
topic: numbers
words:
- centigrade | n | ˈsentɪɡreɪd |  | по Цельсию | = Celsius, a temperature scale | It was minus ten degrees *centigrade*. | Было минус десять градусов по Цельсию.
- dozen | n | ˈdʌzən |  | дюжина | twelve | I bought a *dozen* eggs. | Я купил дюжину яиц.
- fraction | n | ˈfrækʃn |  | доля, часть; дробь | a small part of something | He paid only a *fraction* of the real price. | Он заплатил лишь малую часть реальной цены.
- gallon | n | ˈɡælən |  | галлон | a unit of liquid (about 4.5 litres) | The tank holds ten *gallons*. | Бак вмещает десять галлонов.
- hectare | n | ˈhektɑː | ˈhekter | гектар | a unit of area equal to 10,000 square metres | The site covers several *hectares*. | Памятник занимает несколько гектаров.
- millimeter | n | ˈmɪləmitɜː | ˈmɪləmiːtər | миллиметр (амер.) | one thousandth of a metre | The screw is five *millimeters* long. | Длина шурупа — пять миллиметров. | брит. millimetre
- multiply | v | ˈmʌltɪplaɪ |  | размножаться; умножать | to increase greatly in number | After the disaster, mammals *multiplied* rapidly. | После катастрофы млекопитающие быстро размножились.
- ounce | n | aʊns |  | унция | a unit of weight (about 28 grams) | Add four *ounces* of butter. | Добавьте четыре унции масла.
- pentagon | n | ˈpentəɡən | ˈpenɪɡɑːn | пятиугольник | a shape with five sides | A *pentagon* has five angles. | У пятиугольника пять углов. | the Pentagon — Пентагон
- pi | n | paɪ |  | число пи | the number 3.14159… | The area of a circle is *pi* times the radius squared. | Площадь круга равна пи, умноженному на квадрат радиуса.
- pint | n | paɪnt |  | пинта | a unit of liquid (about 0.57 litres) | He ordered a *pint* of beer. | Он заказал пинту пива.
- reservoir | n | ˈrezəvwɑː | ˈrezəvwɑːr | водохранилище, резервуар | a lake used to store water | The *reservoir* supplies water to the city. | Водохранилище снабжает город водой.
- subtract | v | səbˈtrækt |  | вычитать | to take one number away from another | If you *subtract* 5 from 12, you get 7. | Если из 12 вычесть 5, получится 7.
- ton | n | tʌn |  | тонна | a unit of weight (1,000 kg in the metric system) | The machine weighs over ten *tons*. | Машина весит более десяти тонн. | tons of — куча, масса (разг.)
- tonne | n | tʌn |  | (метрическая) тонна | 1,000 kilograms | The truck carries ten *tonnes*. | Грузовик перевозит десять тонн.
- trillion | num | ˈtrɪliən | ˈtrɪljən | триллион | a million million | The national debt is over a *trillion* dollars. | Госдолг превышает триллион долларов.
- volume | n | ˈvɒljuːm | ˈvɑːljuːm | громкость; объём; том | how loud a sound is; amount; one book in a series | Can you turn the *volume* down? | Можешь сделать потише?
- zip | v | zɪp |  | застёгивать на молнию | to close with a zip | *Zip* up your coat — it's freezing! | Застегни куртку — холодно! | сущ. zip — молния (брит.), амер. zipper
