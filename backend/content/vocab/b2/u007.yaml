title: Food and drink
title_ru: Еда и напитки
topic: food
words:
- coconut | n | ˈkəʊkənʌt | ˈkoʊkənʌt | кокос | a large brown nut with white flesh and liquid inside | She uses *coconut* milk in her curries. | Она добавляет в карри кокосовое молоко.
- portion | n | ˈpɔːʃn | ˈpɔːrʃn | порция; часть | a part of something; an amount of food for one person | The *portions* in this restaurant are huge. | Порции в этом ресторане огромные.
- wheat | n | wiːt |  | пшеница | a plant whose grain is used to make flour | The fields were full of golden *wheat*. | Поля были полны золотой пшеницы.
