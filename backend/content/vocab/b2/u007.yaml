title: Food and drink
title_ru: Еда и напитки
topic: food
words:
- barley | n | ˈbɑːli | ˈbɑːrli | ячмень | a grain used for food and beer | Beer is made from *barley*. | Пиво делают из ячменя.
- berry | n | ˈberi |  | ягода | a small soft fruit | We picked *berries* in the forest. | Мы собирали ягоды в лесу.
- bun | n | bʌn |  | булочка | a small round bread or cake | I had a sweet *bun* with my coffee. | Я съел сладкую булочку с кофе.
- cherry | n | ˈtʃeri |  | вишня, черешня | a small round red fruit | She put a *cherry* on top of the cake. | Она положила вишенку на торт.
- cocoa | n | ˈkəʊkəʊ | ˈkoʊkoʊ | какао | a hot chocolate drink; chocolate powder | I drink *cocoa* before bed. | Перед сном я пью какао.
- coconut | n | ˈkəʊkənʌt | ˈkoʊkənʌt | кокос | a large brown nut with white flesh and liquid inside | She uses *coconut* milk in her curries. | Она добавляет в карри кокосовое молоко.
- gum | n | ɡʌm |  | жвачка; десна | chewing gum; the flesh around teeth | Don't chew *gum* in class. | Не жуй жвачку на уроке.
- mango | n | ˈmæŋɡəʊ | ˈmæŋɡoʊ | манго | a sweet tropical fruit | I love *mango* juice. | Обожаю манговый сок.
- mint | n | mɪnt |  | мята | a plant used for flavour | Add some fresh *mint* to the tea. | Добавь в чай свежей мяты.
- mutton | n | ˈmʌtn |  | баранина (от взрослой овцы) | meat from an adult sheep | We had *mutton* stew. | У нас было рагу из баранины.
- nourishment | n | ˈnʌrɪʃmənt | ˈnɜːrɪʃmənt | питание | food needed for health | Plants get *nourishment* from the soil. | Растения получают питание из почвы.
- pancake | n | ˈpænkeɪk |  | блин, оладья | a thin flat cake cooked in a pan | We had *pancakes* for breakfast. | На завтрак у нас были блины.
- peach | n | piːtʃ |  | персик | a soft round fruit with a large stone | This *peach* is very juicy. | Этот персик очень сочный.
- pickle | n | ˈpɪkl |  | соленье, маринованный огурец | a vegetable kept in vinegar | I like *pickles* with my sandwich. | Я люблю маринованные огурцы к сэндвичу.
- portion | n | ˈpɔːʃn | ˈpɔːrʃn | порция; часть | a part of something; an amount of food for one person | The *portions* in this restaurant are huge. | Порции в этом ресторане огромные.
- pumpkin | n | ˈpʌmpkɪn | ˈpʌmkɪn | тыква | a large round orange vegetable | We made *pumpkin* soup. | Мы сварили тыквенный суп.
- salsa | n | ˈsælsə | ˈsɔːlsə | сальса (соус; танец) | a spicy tomato sauce; a Latin dance | We had nachos with *salsa*. | Мы ели начос с сальсой.
- soybean | n | ˈsɔɪbiːn |  | соевый боб | a bean used for oil and tofu | Tofu is made from *soybeans*. | Тофу делают из соевых бобов. | брит. soya bean
- spice | n | spaɪs |  | специя, пряность | a powder or seed used to flavour food | Cinnamon is my favourite *spice*. | Корица — моя любимая пряность.
- stew | n | stjuː | stuː | рагу, тушёное блюдо | meat and vegetables cooked slowly in liquid | Grandma makes a great beef *stew*. | Бабушка готовит отличное рагу из говядины.
- vinegar | n | ˈvɪnɪɡə | ˈvɪnəɡər | уксус | a sour liquid used in cooking | Add oil and *vinegar* to the salad. | Заправьте салат маслом и уксусом.
- wheat | n | wiːt |  | пшеница | a plant whose grain is used to make flour | The fields were full of golden *wheat*. | Поля были полны золотой пшеницы.
