title: Communication and language
title_ru: Общение и язык
topic: communication
words:
- acknowledge | v | əkˈnɒlɪdʒ | əkˈnɑːlɪdʒ | признавать | to accept that something is true | He *acknowledged* that he had made a mistake. | Он признал, что совершил ошибку.
- approve | v | əˈpruːv |  | одобрять | to think something is good; to officially agree to something | My parents don't *approve* of my new boyfriend. | Родители не одобряют моего нового парня. | approve of
- bless | v | bles |  | благословлять | to ask God to protect someone | The priest *blessed* the young couple. | Священник благословил молодую пару. | Bless you! — Будь здоров! (при чихании)
- forgive | v | fəˈɡɪv | fərˈɡɪv | прощать | to stop being angry with someone who has done wrong | I'll never *forgive* him for what he did. | Я никогда не прощу его за то, что он сделал. | forgive — forgave — forgiven
- guarantee | v | ˌɡærənˈtiː |  | гарантировать | to promise that something will happen | I can't *guarantee* that he will come. | Не могу гарантировать, что он придёт.
- inform | v | ɪnˈfɔːm | ɪnˈfɔːrm | сообщать, информировать | to tell someone about something officially | Please *inform* us if you change your address. | Пожалуйста, сообщите нам, если смените адрес.
- praise | v | preɪz |  | хвалить | to say that someone or something is very good | The teacher *praised* her for her hard work. | Учитель похвалил её за усердие.
- proceed | v | prəˈsiːd | proʊˈsiːd | продолжать; проходить (дальше) | to continue; to go to a place | Passengers should *proceed* to gate 12. | Пассажиров просят пройти к выходу 12.
- swear | v | sweə | swer | клясться; ругаться | to promise seriously; to use bad words | I *swear* I didn't take your money. | Клянусь, я не брал твоих денег. | swear — swore — sworn
