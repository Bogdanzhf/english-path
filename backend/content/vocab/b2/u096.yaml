title: Society and politics
title_ru: Общество и политика
topic: society
words:
- addict | n | ˈædɪkt |  | наркоман; зависимый, фанат | a person who cannot stop taking a drug or doing something | He's a coffee *addict*. | Он кофеман. | addicted — зависимый
- alcoholism | n | ˈælkəhəʊlɪzəm | ˈælkəhɔːlɪzəm | алкоголизм | addiction to alcohol | *Alcoholism* destroyed his family. | Алкоголизм разрушил его семью.
- captive | n | ˈkæptɪv |  | пленник | a person or animal that is kept as a prisoner | *Captives* from wars were forced to fight. | Пленных с войн заставляли сражаться.
- democracy | n | dɪˈmɒkrəsi | dɪˈmɑːkrəsi | демократия | government by the people | We live in a *democracy*. | Мы живём в демократической стране.
- human rights | n | ˈhjuːmən raɪts |  | права человека | basic rights of all people | They fight for *human rights*. | Они борются за права человека.
- immigration | n | ˌɪmɪˈɡreɪʃən | ˌɪməˈɡreɪʃən | иммиграция | moving to another country to live | *Immigration* is a big political issue. | Иммиграция — важный политический вопрос.
- liberation | n | ˌlɪbəˈreɪʃən | ˌlɪˌbʌˈreɪʃən | освобождение | being set free | They celebrated the city's *liberation*. | Они праздновали освобождение города.
- parliament | n | ˈpɑːləmənt | ˈpɑːrləmənt | парламент | the group of people who make laws | *Parliament* passed the law. | Парламент принял закон.
- ranger | n | ˈreɪndʒə | ˈreɪndʒər | рейнджер, егерь | a person whose job is to look after a park or forest | Mountain *rangers* led the rescue. | Спасательную операцию возглавили горные спасатели-рейнджеры.
- rights | n | raɪts |  | права | things you are allowed by law | Know your *rights*. | Знайте свои права.
- rite | n | raɪt |  | обряд, ритуал | a traditional ceremony | The priestess performed a sacred *rite*. | Жрица совершила священный обряд.
- sexism | n | ˈseksɪzəm |  | сексизм | unfair treatment because of gender | *Sexism* in the workplace is illegal. | Дискриминация по полу на работе незаконна.
- slaughter | n | ˈslɔːtə | ˈslɔːtər | резня; убой (скота) | killing many people or animals | The *slaughter* of elephants must stop. | Истребление слонов должно прекратиться.
- spokesman | n | ˈspəʊksmən | ˈspoʊksmən | представитель, пресс-секретарь | a man who speaks for a group | A police *spokesman* gave details. | Представитель полиции сообщил подробности.
- spokeswoman | n | ˈspəʊkswʊmən | ˈspoʊkswʊmən | представительница, пресс-секретарь | a woman who speaks for a group | A company *spokeswoman* made a statement. | Представительница компании сделала заявление.
- starvation | n | stɑːˈveɪʃən | stɑːrˈveɪʃən | голод, голодная смерть | suffering or death from hunger | Thousands died of *starvation*. | Тысячи людей умерли от голода.
- statesman | n | ˈsteɪtsmən |  | государственный деятель | an experienced political leader | Churchill was a great *statesman*. | Черчилль был великим государственным деятелем.
- stockpile | n | ˈstɒkpaɪl | ˈstɑːkpaɪl | запас (на случай нужды) | a large store of goods | They have a *stockpile* of food. | У них большой запас еды.
- tyranny | n | ˈtɪrəni |  | тирания | cruel and unfair government | The people rose up against *tyranny*. | Народ восстал против тирании.
- tyrant | n | ˈtaɪrənt |  | тиран | a cruel ruler | The king was a *tyrant*. | Король был тираном.
