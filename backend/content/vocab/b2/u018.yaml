title: Phrasal verbs
title_ru: Фразовые глаголы
topic: phrasal
words:
- account for something | phr |  |  | объяснять; составлять (долю) | to explain; to form a part of | Women *account for* 60% of students. | Женщины составляют 60% студентов.
- back somebody/something up | phr |  |  | поддерживать; делать резервную копию | to support; to copy files | *Back up* your files regularly. | Регулярно делайте резервную копию файлов.
- break out | phv |  |  | вспыхнуть, начаться (о войне, пожаре) | to start suddenly | A fire *broke out* in the kitchen. | На кухне вспыхнул пожар.
- bring somebody up | phr |  |  | воспитывать, растить | to raise a child | She was *brought up* by her grandparents. | Её воспитали бабушка с дедушкой.
- call for something | phr |  |  | требовать, призывать к | to demand | They *called for* lower taxes. | Они призвали снизить налоги.
- catch up with | phv |  |  | догнать | to reach someone ahead | Go on, I'll *catch up with* you. | Иди, я тебя догоню.
- come across somebody/something | phr |  |  | случайно встретить, наткнуться | to find by chance | I *came across* an old photo. | Я наткнулся на старую фотографию.
- come up | phv |  |  | возникать, всплывать | to appear; to be mentioned | Something *came up* at work. | На работе кое-что случилось.
- cut down on | phv |  |  | сократить (потребление) | to reduce | I'm trying to *cut down on* sugar. | Я стараюсь есть меньше сахара.
- fall apart | phv |  |  | развалиться | to break into pieces | My old shoes are *falling apart*. | Мои старые туфли разваливаются.
- fall out | phv |  |  | поссориться; выпадать | to argue and stop being friends | They *fell out* over money. | Они поссорились из-за денег.
- figure somebody/something out | phr |  |  | понять, разобраться | to understand | I can't *figure out* how it works. | Не могу понять, как это работает.
- get over somebody/something | phr |  |  | оправиться, пережить | to recover from | It took her months to *get over* the illness. | Ей понадобились месяцы, чтобы оправиться от болезни.
- get rid of somebody/something | phr |  |  | избавиться от | to remove or throw away | I need to *get rid of* these old clothes. | Мне нужно избавиться от этой старой одежды.
- give in | phv |  |  | сдаться, уступить | to stop fighting or arguing | He finally *gave in* and said yes. | В конце концов он сдался и согласился.
- go through something | phr |  |  | пережить; просмотреть | to experience something difficult; to check | She's *going through* a hard time. | У неё сейчас трудный период.
- hand in | phv |  |  | сдавать (работу) | to give work to a teacher | *Hand in* your essays on Friday. | Сдайте сочинения в пятницу.
