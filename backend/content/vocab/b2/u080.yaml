title: 'How and how much: adverbs'
title_ru: 'Как и насколько: наречия'
topic: manner
words:
- ashore | adv | əˈʃɔː | əˈʃɔːr | на берег, на берегу | onto or on land from the sea | The sailors went *ashore* to find water. | Моряки сошли на берег за водой.
- backstage | adv | ˌbækˈsteɪdʒ |  | за кулисами | behind the stage in a theatre; in private | The reporters were allowed *backstage*. | Репортёров пустили за кулисы.
