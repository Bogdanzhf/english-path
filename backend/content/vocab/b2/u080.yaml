title: 'How and how much: adverbs'
title_ru: 'Как и насколько: наречия'
topic: manner
words:
- abruptly | adv | əˈbrʌptli |  | резко, внезапно | suddenly | The music stopped *abruptly*. | Музыка резко оборвалась.
- admittedly | adv | ədˈmɪtɪdli | ædˈmɪtɪdli | правда, надо признать | used to admit something | *Admittedly*, I was wrong. | Надо признать, я был неправ.
- aggressively | adv | əˈɡresɪvli |  | агрессивно | in an aggressive way | He drives *aggressively*. | Он водит агрессивно.
- amazingly | adv | əˈmeɪzɪŋli |  | удивительно | surprisingly | The food was *amazingly* cheap. | Еда была удивительно дешёвой.
- ashore | adv | əˈʃɔː | əˈʃɔːr | на берег, на берегу | onto or on land from the sea | The sailors went *ashore* to find water. | Моряки сошли на берег за водой.
- backstage | adv | ˌbækˈsteɪdʒ |  | за кулисами | behind the stage in a theatre; in private | The reporters were allowed *backstage*. | Репортёров пустили за кулисы.
- calmly | adv | ˈkɑːmli | ˈkɑːlmli | спокойно | in a calm way | She spoke *calmly*. | Она говорила спокойно.
- conveniently | adv | kənˈviːnɪəntli | kənˈviːnjəntli | удобно | in a convenient way | The hotel is *conveniently* located. | Отель удобно расположен.
- conversely | adv | kənˈvɜːsli | ˈkɑːnvərsli | наоборот, напротив | in the opposite way | *Conversely*, prices in the north fell. | И наоборот, на севере цены упали.
- culturally | adv | ˈkʌltʃərəli | ˈkʌltʃərəliː | культурно, в культурном отношении | relating to culture | The city is *culturally* diverse. | Город культурно разнообразен.
- eagerly | adv | ˈiːɡəli | ˈiːɡərli | с нетерпением, жадно | with great interest | We're *eagerly* waiting for the results. | Мы с нетерпением ждём результатов.
- evidently | adv | ˈevɪdəntli | ˈevədəntli | очевидно | clearly | He was *evidently* tired. | Он явно устал.
- finely | adv | ˈfaɪnli |  | мелко; тонко | into small pieces; delicately | Chop the onion *finely*. | Мелко нарежьте лук.
- knowingly | adv | ˈnəʊɪŋli | ˈnoʊɪŋli | сознательно; многозначительно | on purpose; showing you know | She smiled *knowingly*. | Она понимающе улыбнулась.
- loosely | adv | ˈluːsli |  | свободно; приблизительно | not tightly; not exactly | The film is *loosely* based on a true story. | Фильм отчасти основан на реальной истории.
- morally | adv | ˈmɒrəli | ˈmɔːrəli | морально | relating to right and wrong | It's *morally* wrong. | Это аморально.
- peacefully | adv | ˈpiːsfəli |  | мирно, спокойно | calmly; without violence | The baby is sleeping *peacefully*. | Малыш мирно спит.
- radically | adv | ˈrædɪkli |  | радикально | completely | Things have changed *radically*. | Всё радикально изменилось.
- willingly | adv | ˈwɪlɪŋli |  | охотно | without being forced | She *willingly* agreed to help. | Она охотно согласилась помочь.
