title: People and relationships
title_ru: Люди и отношения
topic: people
words:
- aboriginal | adj | ˌæbəˈrɪdʒɪnl | ˌæbəˈrɪdʒənl | коренной, аборигенный | relating to the original people of a place | They study *aboriginal* culture. | Они изучают культуру коренных народов.
- bachelor | n | ˈbætʃələ | ˈbætʃələr | бакалавр; холостяк | a first university degree; an unmarried man | She has a *bachelor's* degree in chemistry. | У неё степень бакалавра химии.
- companion | n | kəmˈpæniən |  | спутник, компаньон | a person or animal you spend time with | His dog was his constant *companion*. | Собака была его постоянным спутником.
- coward | n | ˈkaʊəd | ˈkaʊərd | трус | a person who is not brave | Don't be a *coward* — try speaking to them! | Не трусь — попробуй с ними заговорить!
- cub | n | kʌb |  | детёныш (зверя) | a young bear, lion, wolf or fox | The lioness played with her *cubs*. | Львица играла со своими детёнышами.
- darling | n | ˈdɑːlɪŋ | ˈdɑːrlɪŋ | дорогой, милый | used to address someone you love | Good night, *darling*. | Спокойной ночи, дорогой.
- defender | n | dɪˈfendə | dɪˈfendər | защитник | a person who protects; a player who defends | He plays as a *defender*. | Он играет в защите.
- enthusiast | n | ɪnˈθjuːzɪæst | enˈθuːziːæst | энтузиаст, любитель | a person very interested in something | He's a jazz *enthusiast*. | Он большой любитель джаза.
- follower | n | ˈfɒləʊə | ˈfɑːloʊər | последователь; подписчик | a person who supports someone; a person who follows an account | She has a million *followers*. | У неё миллион подписчиков.
- intruder | n | ɪnˈtruːdə | ˌɪnˈtruːdər | незваный гость, нарушитель | a person who enters a place illegally | The alarm scared the *intruder* away. | Сигнализация спугнула незваного гостя.
- mimic | v | ˈmɪmɪk |  | имитировать, передразнивать | to copy someone's voice or movements, often to make people laugh | The clown *mimicked* the way people walk. | Клоун передразнивал походку людей. | mimic — mimicked
- observer | n | ɒbˈzɜːvə | əbˈzɜːrvər | наблюдатель | a person who watches | Political *observers* expect a close election. | Политические наблюдатели ожидают равных выборов.
- parental | adj | pəˈrentl |  | родительский | relating to parents | The film needs *parental* guidance. | Этот фильм — только с разрешения родителей.
- participant | n | pɑːˈtɪsɪpənt | pɑːrˈtɪsɪpənt | участник | a person who takes part in something | Every *participant* in the race got a medal. | Каждый участник забега получил медаль.
- psychic | n | ˈsaɪkɪk |  | экстрасенс | a person who claims to have special mental powers | The *psychic* claimed she could talk to the dead. | Экстрасенс утверждала, что может говорить с мёртвыми.
- sage | n | seɪdʒ |  | мудрец; шалфей | a very wise person; a herb | He was seen as a *sage*. | Его считали мудрецом.
- seeker | n | ˈsiːkə | ˈsiːkər | искатель | a person looking for something | Job *seekers* can get free advice. | Ищущие работу могут получить бесплатную консультацию.
- spokesperson | n | ˈspəʊkspəsən | ˈspoʊkspərsən | представитель, пресс-секретарь | a person who speaks for a group | A company *spokesperson* denied the story. | Представитель компании опроверг эту историю.
- valentine | n | ˈvæləntaɪn |  | валентинка; возлюбленный | a card or person you send love to on 14 February | She got three *valentines* this year! | В этом году она получила три валентинки!
