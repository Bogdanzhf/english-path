title: People and relationships
title_ru: Люди и отношения
topic: people
words:
- bachelor | n | ˈbætʃələ | ˈbætʃələr | бакалавр; холостяк | a first university degree; an unmarried man | She has a *bachelor's* degree in chemistry. | У неё степень бакалавра химии.
- coward | n | ˈkaʊəd | ˈkaʊərd | трус | a person who is not brave | Don't be a *coward* — try speaking to them! | Не трусь — попробуй с ними заговорить!
- cub | n | kʌb |  | детёныш (зверя) | a young bear, lion, wolf or fox | The lioness played with her *cubs*. | Львица играла со своими детёнышами.
- mimic | v | ˈmɪmɪk |  | имитировать, передразнивать | to copy someone's voice or movements, often to make people laugh | The clown *mimicked* the way people walk. | Клоун передразнивал походку людей. | mimic — mimicked
- participant | n | pɑːˈtɪsɪpənt | pɑːrˈtɪsɪpənt | участник | a person who takes part in something | Every *participant* in the race got a medal. | Каждый участник забега получил медаль.
- psychic | n | ˈsaɪkɪk |  | экстрасенс | a person who claims to have special mental powers | The *psychic* claimed she could talk to the dead. | Экстрасенс утверждала, что может говорить с мёртвыми.
- valentine | n | ˈvæləntaɪn |  | валентинка; возлюбленный | a card or person you send love to on 14 February | She got three *valentines* this year! | В этом году она получила три валентинки!
