title: Objects and materials
title_ru: Предметы и материалы
topic: objects
words:
- dome | n | dəʊm | doʊm | купол | a round roof | The cathedral has a huge golden *dome*. | У собора огромный золотой купол.
- heap | n | hiːp |  | куча, груда | an untidy pile | A *heap* of branches lay by the road. | У дороги лежала груда веток.
- hook | n | hʊk |  | крючок | a curved piece of metal for hanging things | Hang your coat on the *hook*. | Повесь пальто на крючок.
- landing | n | ˈlændɪŋ |  | высадка; приземление; лестничная площадка | the act of arriving on land from the sea or air | The plane made an emergency *landing*. | Самолёт совершил аварийную посадку.
- lump | n | lʌmp |  | комок, глыба; шишка | a small solid piece; a swelling | Stir the sauce so there are no *lumps*. | Помешивайте соус, чтобы не было комков. | a lump in your throat — ком в горле
- output | n | ˈaʊtpʊt |  | объём производства, выпуск | the amount produced | Oil *output* has fallen this year. | Добыча нефти в этом году снизилась.
- pole | n | pəʊl | poʊl | шест, столб; полюс | a long thin stick; the North or South end of the Earth | The flag was hanging from a tall *pole*. | Флаг висел на высоком шесте.
- rack | n | ræk |  | стойка, полка, подставка | a frame with bars or shelves for holding things | Put your bike in the bike *rack*. | Поставь велосипед на велопарковку.
- sword | n | sɔːd | sɔːrd | меч | a long sharp metal weapon | The knight raised his *sword*. | Рыцарь поднял меч. | w не произносится
- trigger | n | ˈtrɪɡə | ˈtrɪɡər | спусковой крючок; причина | the part of a gun you press to fire; the cause of something | Stress can be a *trigger* for headaches. | Стресс может вызывать головную боль.
