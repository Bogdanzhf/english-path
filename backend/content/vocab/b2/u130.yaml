title: Events and situations
title_ru: События и ситуации
topic: events
words:
- advent | n | ˈædvent |  | появление, приход | the arrival or start of something important | The *advent* of the internet changed everything. | Появление интернета изменило всё.
- exaggerate | v | ɪɡˈzædʒəreɪt |  | преувеличивать | to say something is bigger or worse than it is | Don't *exaggerate* — it wasn't that bad! | Не преувеличивай — всё было не так уж плохо!
- hazard | n | ˈhæzəd | ˈhæzərd | опасность, риск | something that could be dangerous | Wet floors are a safety *hazard*. | Мокрый пол — угроза безопасности.
- roam | v | rəʊm | roʊm | бродить, странствовать | to move around without a plan | Wild horses *roam* the hills. | По холмам бродят дикие лошади.
