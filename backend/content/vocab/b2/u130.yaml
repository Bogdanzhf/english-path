title: Events and situations
title_ru: События и ситуации
topic: events
words:
- boom | v | buːm |  | грохотать; бурно расти | to make a loud deep sound; to grow quickly | The guns *boomed* all night. | Всю ночь грохотали орудия.
- catastrophe | n | kəˈtæstrəfi |  | катастрофа | a sudden terrible event | The flood was a *catastrophe*. | Наводнение стало катастрофой.
- coincidence | n | kəʊˈɪnsɪdəns | koʊˈɪnsɪdəns | совпадение | a surprising chance event | What a *coincidence*! | Какое совпадение!
- compression | n | kəmˈpreʃən |  | сжатие | pressing into a smaller space | File *compression* saves space. | Сжатие файлов экономит место.
- destiny | n | ˈdestəni |  | судьба | what will happen to someone in the future | He believed music was his *destiny*. | Он верил, что музыка — его судьба.
- discharge | v | dɪsˈtʃɑːdʒ | dɪsˈtʃɑːrdʒ | выписывать (из больницы); выпускать | to allow someone to leave hospital; to release | She was *discharged* from hospital a week later. | Через неделю её выписали из больницы.
- distortion | n | dɪˈstɔːʃən | dɪˈstɔːrʃən | искажение | changing the true shape or meaning | The article is a *distortion* of the facts. | Статья искажает факты.
- doom | n | duːm |  | рок, гибель | death or a terrible fate | The film is full of *doom* and gloom. | Фильм полон мрака и безысходности.
- downfall | n | ˈdaʊnfɔːl |  | падение, крах | a loss of power or success | Greed led to his *downfall*. | Жадность привела его к краху.
- intrusion | n | ɪnˈtruːʒən | ˌɪnˈtruːʒən | вторжение | entering where you are not wanted | Sorry for the *intrusion*. | Извините за вторжение.
- miracle | n | ˈmɪrəkl |  | чудо | an amazing event that seems impossible | It's a *miracle* that nobody was hurt. | Чудо, что никто не пострадал.
- misfortune | n | ˌmɪsˈfɔːtʃuːn | ˌmɪsˈfɔːrtʃən | несчастье, неудача | bad luck | He had the *misfortune* to be the youngest in the class. | Ему не повезло оказаться самым младшим в классе.
- 'peep | n | piːp |  | взгляд украдкой | a quick look | Take a *peep* inside. | Загляни внутрь. | гл.: peep — подглядывать'
- repetition | n | ˌrepəˈtɪʃən |  | повторение | doing again | Learning needs *repetition*. | Обучение требует повторения.
- slap | v | slæp |  | шлёпать, давать пощёчину | to hit with the flat part of the hand | She *slapped* him across the face. | Она дала ему пощёчину.
- spark | n | spɑːk | spɑːrk | искра | a tiny bit of fire | A *spark* from the fire set the curtain alight. | Искра из камина подожгла занавеску.
- transformation | n | trænsfɔːˈmeɪʃən | ˌtrænsfərˈmeɪʃən | превращение, преобразование | a complete change | The city has undergone a *transformation*. | Город преобразился.
- triumph | n | ˈtraɪʌmf |  | триумф, победа | a great success or victory | The concert was a *triumph*. | Концерт прошёл с триумфом.
- tsunami | n | tsuːˈnɑːmi | suːˈnɑːmi | цунами | a huge wave caused by an earthquake | The *tsunami* destroyed the coast. | Цунами разрушило побережье.
- variation | n | ˌveərɪˈeɪʃən | ˌveriːˈeɪʃən | изменение, вариант | a change or difference | There's little *variation* in temperature. | Температура почти не меняется.
- zoom | v | zuːm |  | мчаться; увеличивать изображение | to move very fast; to make a camera image larger | The tour bus *zoomed* down the motorway. | Гастрольный автобус мчался по шоссе. | zoom in — приблизить
