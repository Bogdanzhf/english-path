title: 'Describing: society and science'
title_ru: 'Описание: общество, наука, право'
topic: describing
words:
- ample | adj | ˈæmpl |  | достаточный, обильный | more than enough | There was *ample* land for everyone. | Земли хватало на всех.
- civil | adj | ˈsɪvl |  | гражданский; вежливый | relating to citizens; polite | They got married in a *civil* ceremony. | Они расписались в ЗАГСе. | civil war — гражданская война
- core | n | kɔː | kɔːr | ядро, сердцевина, суть | the central and most important part | Honesty is at the *core* of our values. | Честность — основа наших ценностей.
- democratic | adj | ˌdeməˈkrætɪk |  | демократический | relating to democracy | It's a *democratic* country. | Это демократическая страна.
- domestic | adj | dəˈmestɪk |  | внутренний; домашний | inside one country; connected with the home | We took a *domestic* flight from London to Edinburgh. | Мы летели внутренним рейсом из Лондона в Эдинбург. | domestic animals — домашние животные
- executive | n | ɪɡˈzekjətɪv |  | руководитель | a senior manager in a company | She's a top *executive* at a tech company. | Она топ-менеджер в технологической компании.
- external | adj | ɪkˈstɜːnl | ɪkˈstɜːrnl | внешний | outside | The animals are protected from *external* threats. | Животные защищены от внешних угроз.
- high-tech | adj | ˌhaɪˈtek |  | высокотехнологичный | using advanced technology | It's a *high-tech* company. | Это высокотехнологичная компания.
- holy | adj | ˈhəʊli | ˈhoʊli | святой, священный | relating to God or religion | Jerusalem is a *holy* city. | Иерусалим — священный город.
- industrial | adj | ɪnˈdʌstrɪəl | ˌɪnˈdʌstriəl | промышленный | relating to industry | It's an *industrial* city. | Это промышленный город.
- internal | adj | ɪnˈtɜːnl | ɪnˈtɜːrnl | внутренний | inside the body or an organization | He suffered *internal* injuries in the accident. | В аварии он получил внутренние травмы.
- joint | adj | dʒɔɪnt |  | совместный | shared or done by two or more people or groups | It was a *joint* operation between Britain and the USA. | Это была совместная операция Великобритании и США. | сущ. joint — сустав
- liberal | adj | ˈlɪbərəl | ˈlɪbɜːrəl | либеральный; щедрый | open to new ideas | She has *liberal* views. | У неё либеральные взгляды.
- mixed | adj | mɪkst |  | смешанный | combining different things | I have *mixed* feelings about it. | У меня смешанные чувства по этому поводу.
- motor | n | ˈməʊtə | ˈmoʊtər | мотор, двигатель | an engine | The boat has an electric *motor*. | У лодки электромотор.
- "non-profit | adj | ˌn\x01ːnpr\x01ːfɪt | ˌnɑːnˈprɔːfɪt | некоммерческий | not making a profit | She works for a *non-profit* organisation. | Она работает в некоммерческой организации."
- pop | v | pɒp | pɑːp | лопнуть; заскочить (разг.) | to burst; to go somewhere quickly | I'll *pop* into the shop. | Заскочу в магазин.
- regional | adj | ˈriːdʒənl |  | региональный | relating to a region | He has a *regional* accent. | У него региональный акцент.
