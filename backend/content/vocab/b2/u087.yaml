title: Communication and language
title_ru: Общение и язык
topic: communication
words:
- accent | n | ˈæksent |  | акцент; ударение | a way of pronouncing a language typical of a place | She speaks English with a slight French *accent*. | Она говорит по-английски с лёгким французским акцентом.
- advancement | n | ədˈvænsmənt |  | продвижение, развитие | progress | There are good chances for *advancement*. | Хорошие шансы на продвижение.
- ambiguity | n | ˌæmbɪˈɡjuːɪti | ˌæmbɪɡˈjuːəti | двусмысленность | having more than one meaning | Avoid *ambiguity* in your writing. | Избегайте двусмысленности в тексте.
- cue | n | kjuː |  | сигнал, реплика | a signal to do something | That's my *cue* to leave. | Это знак, что мне пора.
- dialect | n | ˈdaɪəlekt |  | диалект | a local form of a language | They speak a northern *dialect*. | Они говорят на северном диалекте.
- disrespect | n | ˌdɪsrɪˈspekt |  | неуважение | a lack of respect | He meant no *disrespect*. | Он не хотел проявить неуважение.
- eloquent | adj | ˈeləkwənt |  | красноречивый | speaking well | She gave an *eloquent* speech. | Она произнесла красноречивую речь.
- encouragement | n | ɪnˈkʌrɪdʒmənt | ɪnˈkɜːrɪdʒmənt | поддержка, ободрение | words or actions that give someone confidence | With her teacher's *encouragement*, she applied to university. | При поддержке учителя она подала документы в университет.
- exaggeration | n | ɪɡˌzædʒəˈreɪʃən |  | преувеличение | making something seem bigger | It's no *exaggeration* to say he saved my life. | Без преувеличения, он спас мне жизнь.
- exclamation mark | n | ɪkskləˈmeɪʃən mɑːk | ˌekskləˈmeɪʃən mɑːrk | восклицательный знак | the mark (!) | Don't use too many *exclamation marks*. | Не ставьте слишком много восклицательных знаков.
- guideline | n | ˈɡaɪdlaɪn |  | рекомендация, руководство | advice about how to do something | The government issued new *guidelines* on emissions. | Правительство выпустило новые рекомендации по выбросам.
- native speaker | n | ˈneɪtɪv ˈspiːkə | ˈneɪtɪv ˈspiːkər | носитель языка | a person who speaks a language from birth | She speaks like a *native speaker*. | Она говорит как носитель языка.
- negotiation | n | nɪˈɡəʊʃɪˈeɪʃən | nɪˌɡoʊʃiːˈeɪʃən | переговоры | discussion to reach agreement | The *negotiations* lasted for weeks. | Переговоры длились неделями.
- obituary | n | ɒˈbɪtʃɔːri | oʊˈbɪtʃuːeri | некролог | an article about someone who has died | I read his *obituary* in the paper. | Я прочитал его некролог в газете.
- paradox | n | ˈpærədɒks | ˈpærədɑːks | парадокс | a situation that seems impossible because it has two opposite features | It's a *paradox* that they starved in a land full of food. | Парадокс в том, что они умерли от голода на земле, полной еды.
- scribble | v | ˈskrɪbl |  | царапать, писать небрежно | to write quickly and carelessly | He *scribbled* a note and left. | Он черкнул записку и ушёл.
- simplification | n | ˌsɪmplɪfɪˈkeɪʃən | ˌsɪmpləfɪˈkeɪʃən | упрощение | making something simpler | That's an over-*simplification*. | Это чрезмерное упрощение.
- slang | n | slæŋ |  | сленг | informal words | "Cool" is *slang* for "good". | «Cool» — сленговое слово для «хороший».
- slogan | n | ˈsləʊɡən | ˈsloʊɡən | слоган, лозунг | a short phrase used in advertising | The *slogan* is easy to remember. | Слоган легко запомнить.
- subtitle | n | ˈsʌbtaɪtl |  | субтитр | text at the bottom of a film screen | I watched the film with *subtitles*. | Я смотрел фильм с субтитрами.
- vow | n | vaʊ |  | клятва, обет | a serious promise | They made a *vow* to defeat the disease. | Они поклялись победить болезнь. | гл. vow — клясться
