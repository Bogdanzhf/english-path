title: Environment and energy
title_ru: Экология и энергия
topic: environment
words:
- acid rain | n | ˈæsɪd reɪn | ˈæsəd reɪn | кислотный дождь | rain polluted by chemicals | *Acid rain* damages forests. | Кислотные дожди вредят лесам.
- endangered species | n | ɪnˈdeɪndʒəd ˈspiːsiːz | enˈdeɪndʒərd ˈspiːʃiːz | вымирающий вид | a type of animal that may disappear | The tiger is an *endangered species*. | Тигр — вымирающий вид.
- energy consumption | n | ˈenədʒi kənˈsʌmpʃən | ˈenərdʒi kənˈsʌmpʃən | энергопотребление | the amount of energy used | We must reduce *energy consumption*. | Нужно снизить энергопотребление.
- energy efficiency | n | ˈenədʒi ɪˈfɪʃənsi | ˈenərdʒi ɪˈfɪʃənsi | энергоэффективность | using less energy for the same result | LED lights improve *energy efficiency*. | Светодиоды повышают энергоэффективность.
- exhaust | v | ɪɡˈzɔːst |  | изнурять, истощать | to make someone very tired | The long journey *exhausted* us. | Долгая поездка нас вымотала. | exhausted — измученный
- forestry | n | ˈfɒrɪstri | ˈfɔːrəstri | лесное хозяйство | managing forests | He studied *forestry*. | Он изучал лесное дело.
- fossil fuels | n | ˈfɒsl ˈfjuːəlz | ˈfɑːsl ˈfjuːəlz | ископаемое топливо | coal, oil and gas | *Fossil fuels* cause pollution. | Ископаемое топливо загрязняет среду.
- greenhouse effect | n | ˈɡriːnhaʊs ɪˈfekt | ˈɡriːnhaʊs ˈiːfekt | парниковый эффект | the warming of the earth by gases | The *greenhouse effect* is getting stronger. | Парниковый эффект усиливается.
- litter | n | ˈlɪtə | ˈlɪtər | мусор (на улице) | rubbish left in public places | Don't drop *litter*. | Не мусорите.
- natural disaster | n | ˈnætʃərəl ˌdɪˈsɑːstə | ˈnætʃərəl dɪˈzæstər | стихийное бедствие | a flood, earthquake, etc. | The earthquake was a terrible *natural disaster*. | Землетрясение стало страшным стихийным бедствием.
- natural resources | n | ˈnætʃərəl rɪˈzɔːsɪz | ˈnætʃərəl ˈriːsɔːrsɪz | природные ресурсы | water, oil, forests, etc. | The country is rich in *natural resources*. | Страна богата природными ресурсами.
- nuclear power | n | ˈnjuːkliə ˈpaʊə | ˈnuːkliːər ˈpaʊər | атомная энергетика | energy from atoms | France uses a lot of *nuclear power*. | Франция активно использует атомную энергию.
- ozone layer | n | ˈəʊzəʊn ˈleɪɜː | ˈoʊzoʊn ˈleɪər | озоновый слой | a layer of gas that protects the earth | There is a hole in the *ozone layer*. | В озоновом слое есть дыра.
- pesticide | n | ˈpestɪsaɪd |  | пестицид | a chemical used to kill insects | *Pesticides* harm bees as well as pests. | Пестициды вредят не только вредителям, но и пчёлам.
- petroleum | n | pəˈtrəʊliəm | pəˈtroʊliəm | нефть | crude oil found under the ground | *Petroleum* is used to make petrol and plastics. | Из нефти делают бензин и пластик.
- plastic waste | n | ˈplɑːstɪk weɪst | ˈplæstɪk weɪst | пластиковые отходы | used plastic thrown away | *Plastic waste* pollutes the oceans. | Пластиковые отходы загрязняют океаны.
- power station | n | ˈpaʊə ˈsteɪʃən | ˈpaʊər ˈsteɪʃən | электростанция | a place where electricity is made | There's a *power station* by the river. | У реки есть электростанция.
- renewable energy | n | rɪˈnjuːəbl ˈenədʒi | riːˈnuːəbl ˈenərdʒi | возобновляемая энергия | energy from sun, wind, water | *Renewable energy* is the future. | За возобновляемой энергией будущее.
- solar power | n | ˈsəʊlə ˈpaʊə | ˈsoʊlər ˈpaʊər | солнечная энергия | energy from the sun | Our house runs on *solar power*. | Наш дом работает на солнечной энергии.
- warming | n | ˈwɔːmɪŋ | ˈwɔːrmɪŋ | потепление | an increase in temperature | There's been a *warming* of the oceans. | Океаны нагреваются.
- wind farm | n | waɪnd fɑːm | waɪnd fɑːrm | ветряная электростанция | a group of wind turbines | A new *wind farm* was built offshore. | В море построили новую ветряную электростанцию.
