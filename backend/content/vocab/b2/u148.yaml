title: Thinking and opinions
title_ru: Мысли и мнения
topic: mind
words:
- asset | n | ˈæset |  | ценное качество; актив | a useful quality or skill; something valuable that you own | Her language skills are a great *asset*. | Знание языков — её большое преимущество.
- caution | n | ˈkɔːʃn |  | осторожность | great care to avoid danger | Drive with *caution* — the road is icy. | Ведите осторожно — дорога скользкая.
- charm | n | tʃɑːm | tʃɑːrm | обаяние, шарм; талисман | a quality that makes people like you; a lucky object | The singer won the audience over with her *charm*. | Певица покорила публику своим обаянием.
- honesty | n | ˈɒnəsti | ˈɑːnəsti | честность | the quality of telling the truth | *Honesty* is the most important thing in a friendship. | Честность — самое важное в дружбе. | h не произносится
- majesty | n | ˈmædʒəsti |  | величие; величество | impressive beauty; a title for a king or queen | The *majesty* of the painting impressed everyone. | Величие картины впечатлило всех. | Your Majesty — Ваше Величество
- scope | n | skəʊp | skoʊp | рамки, масштаб; возможности | the range of a subject or activity | That question is beyond the *scope* of this book. | Этот вопрос выходит за рамки данной книги.
- significance | n | sɪɡˈnɪfɪkəns |  | значение, важность | the importance of something | Nobody understood the *significance* of the discovery. | Никто не понимал значения открытия.
- stance | n | stæns |  | позиция, точка зрения | an opinion that you state publicly | The weather service took a firm *stance*. | Метеослужба заняла твёрдую позицию.
