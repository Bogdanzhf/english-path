title: Body and health
title_ru: Тело и здоровье
topic: body
words:
- addiction | n | əˈdɪkʃən |  | зависимость | being unable to stop doing something harmful | He's fighting a drug *addiction*. | Он борется с наркозависимостью.
- artery | n | ˈɑːtəri | ˈɑːrtəri | артерия | a tube that carries blood from the heart | A blocked *artery* can cause a heart attack. | Закупорка артерии может вызвать инфаркт. | vein — вена
- check-up | n | ˈtʃekʌp |  | медосмотр | a general medical examination | I go for a *check-up* every year. | Я каждый год прохожу медосмотр.
- colon | n | ˈkəʊlən | ˈkoʊlən | двоеточие; толстая кишка | the mark (:) | Use a *colon* before a list. | Перед перечислением ставьте двоеточие.
- depression | n | dɪˈpreʃn |  | депрессия; экономический спад | a medical condition of feeling very sad for a long time; a period of economic difficulty | She was treated for *depression* after losing her job. | После потери работы её лечили от депрессии.
- disorder | n | dɪˈsɔːdə | dɪˈsɔːrdər | расстройство, нарушение; беспорядок | an illness; untidiness | She suffers from an eating *disorder*. | У неё расстройство пищевого поведения.
- eyebrow | n | ˈaɪbraʊ |  | бровь | the line of hair above the eye | He raised his *eyebrows* in surprise. | Он удивлённо поднял брови.
- eyelid | n | ˈaɪlɪd |  | веко | the skin that covers the eye | Her *eyelids* were heavy with sleep. | У неё слипались глаза.
- forefinger | n | ˈfɔːfɪŋɡə | ˈfɔːrfɪŋɡər | указательный палец | the finger next to the thumb | She pointed with her *forefinger*. | Она указала указательным пальцем.
- healthcare | n | ˈhelθkeə | ˈhelθker | здравоохранение | medical services | Everyone should have access to *healthcare*. | Медицинская помощь должна быть доступна всем.
- infection | n | ɪnˈfekʃən | ˌɪnˈfekʃən | инфекция | an illness caused by bacteria or a virus | He has an ear *infection*. | У него ушная инфекция.
- insomnia | n | ɪnˈsɒmniə | ɪnˈsɑːmniə | бессонница | the inability to sleep | Stress can cause *insomnia*. | Стресс может вызывать бессонницу.
- junk food | n | dʒʌŋk fuːd |  | вредная еда, фастфуд | unhealthy food | Try to eat less *junk food*. | Старайся есть меньше вредной еды.
- medication | n | ˌmedɪˈkeɪʃn |  | лекарство, медикаменты | medicine | Some *medications* must be kept cool. | Некоторые лекарства нужно хранить в прохладе.
- nutrition | n | njuˈtrɪʃn | nuˈtrɪʃn | питание | the food you eat and how it affects your health | Good *nutrition* is essential for climbers. | Правильное питание крайне важно для альпинистов.
- recovery | n | rɪˈkʌvəri |  | выздоровление; восстановление | getting better | We wish you a speedy *recovery*. | Желаем скорейшего выздоровления.
- surgery | n | ˈsɜːdʒəri | ˈsɜːrdʒəri | хирургия, операция | medical treatment that involves cutting the body | He needs *surgery* on his knee. | Ему нужна операция на колене.
- therapy | n | ˈθerəpi |  | терапия, лечение | treatment of a physical or mental illness | She's having *therapy* for her back pain. | Она проходит лечение от боли в спине.
- tobacco | n | təˈbækəʊ | təˈbækoʊ | табак | a plant whose leaves are smoked in cigarettes | *Tobacco* is very bad for your health. | Табак очень вреден для здоровья.
