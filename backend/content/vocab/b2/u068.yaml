- biography | n | baɪˈɒɡrəfi | baɪˈɑːɡrəfi | биография | a book about someone's life written by another person | I'm reading a *biography* of Mozart. | Я читаю биографию Моцарта. | autobiography — автобиография
- cast | v | kɑːst | kæst | бросать, забрасывать | to throw something, like a fishing line | He *cast* his line into the river. | Он забросил удочку в реку. | cast — cast — cast
