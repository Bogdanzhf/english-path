title: Feelings and character
title_ru: Чувства и характер
topic: feelings
words:
- affectionate | adj | əˈfekʃənət |  | любящий, ласковый | showing love | Our cat is very *affectionate*. | Наша кошка очень ласковая.
- appreciative | adj | əˈpriːʃiətɪv | əˈpriːʃiːeɪtɪv | признательный, благодарный | showing thanks | The audience was very *appreciative*. | Публика была очень благодарной.
- comfort | v | ˈkʌmfət | ˈkʌmfərt | утешать | to make someone feel less sad or worried | She *comforted* the crying child. | Она утешала плачущего ребёнка.
- compassionate | adj | kəmˈpæʃənət |  | сострадательный | showing sympathy for people who are suffering | She's a kind and *compassionate* doctor. | Она добрый и сострадательный врач.
- depressing | adj | dɪˈpresɪŋ |  | угнетающий | making you sad | The news is so *depressing*. | Новости такие удручающие.
- dreadful | adj | ˈdredfl |  | ужасный | very bad | The weather was *dreadful*. | Погода была ужасной.
- dreamy | adj | ˈdriːmi |  | мечтательный | thinking about pleasant things | She had a *dreamy* look on her face. | У неё было мечтательное выражение лица.
- ecstatic | adj | ɪkˈstætɪk | ekˈstætɪk | в экстазе, вне себя от радости | extremely happy | She was *ecstatic* about the news. | Она была вне себя от радости.
- envious | adj | ˈenviəs |  | завистливый | wanting what someone else has | His success made his rivals *envious*. | Его успех вызывал зависть у соперников.
- fearsome | adj | ˈfiəsʌm | ˈfɪrsəm | грозный, страшный | frightening | The tiger is a *fearsome* hunter. | Тигр — грозный хищник.
- hesitant | adj | ˈhezɪtənt |  | нерешительный | slow to act because you are unsure | The local people were *hesitant* to approach him. | Местные жители не решались к нему подходить.
- indifferent | adj | ɪnˈdɪfrənt |  | безразличный | not interested or caring | Big banks were *indifferent* to the needs of the poor. | Крупные банки были безразличны к нуждам бедных.
- moody | adj | ˈmuːdi |  | капризный, угрюмый | often changing mood | Teenagers can be *moody*. | Подростки бывают капризными.
- outraged | adj | ˈaʊtreɪdʒd |  | возмущённый | extremely angry and shocked | People were *outraged* by the decision. | Люди были возмущены решением.
- pessimistic | adj | ˌpesɪˈmɪstɪk |  | пессимистичный | expecting bad things to happen | Many experts were *pessimistic* about the country's future. | Многие эксперты пессимистично оценивали будущее страны.
- reflective | adj | rɪˈflektɪv |  | задумчивый; отражающий | thoughtful; reflecting light | He was in a *reflective* mood. | Он был в задумчивом настроении.
- serene | adj | səˈriːn |  | безмятежный | calm and peaceful | She looked *serene*. | Она выглядела безмятежной.
- shock | v | ʃɒk | ʃɑːk | шокировать | to surprise and upset | The news *shocked* everyone. | Новость всех шокировала.
- tiresome | adj | ˈtaɪəsʌm | ˈtaɪərsəm | утомительный, надоедливый | annoying and boring | It's a *tiresome* job. | Это утомительная работа.
- unsure | adj | ʌnˈʃɔː | ənˈʃʊr | неуверенный | not certain | I'm *unsure* what to do. | Я не уверен, что делать.
