title: Feelings and states
title_ru: Чувства и состояния
topic: feelings
words:
- addictive | adj | əˈdɪktɪv |  | вызывающий привыкание | making you want more and more, so it's hard to stop | Many mobile games are designed to be *addictive*. | Многие мобильные игры специально созданы так, чтобы вызывать привыкание.
- dissatisfied | adj | dɪsˈsætɪsfaɪd |  | недовольный | not happy with something | Many customers were *dissatisfied* with the service. | Многие клиенты были недовольны обслуживанием.
- horrified | adj | ˈhɒrɪfaɪd | ˈhɔːrɪfaɪd | в ужасе, потрясённый | very shocked and upset | We were *horrified* by the news. | Новость повергла нас в ужас.
- mortal | adj | ˈmɔːtl | ˈmɔːrtl | смертный; смертельный | unable to live forever; causing death | They were in *mortal* danger. | Они были в смертельной опасности.
- powerless | adj | ˈpaʊələs | ˈpaʊərləs | бессильный | without power to change something | We felt *powerless* to help. | Мы чувствовали себя бессильными помочь.
- stranded | adj | ˈstrændɪd |  | застрявший, оказавшийся в беде | unable to leave a place | Thousands of passengers were *stranded* at the airport. | Тысячи пассажиров застряли в аэропорту.
- weary | adj | ˈwɪəri | ˈwɪri | усталый, утомлённый | very tired | After years of fighting, he was *weary*. | После многих лет борьбы он был измотан.
