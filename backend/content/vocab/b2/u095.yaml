title: Actions and movement
title_ru: Действия и движение
topic: actions
words:
- absorb | v | əbˈzɔːb | əbˈzɔːrb | впитывать, поглощать | to take in a liquid, heat or information | Plants *absorb* water through their roots. | Растения впитывают воду корнями.
- chop | v | tʃɒp | tʃɑːp | рубить, нарезать | to cut into pieces | *Chop* the onions into small pieces. | Нарежьте лук мелкими кусочками.
- clap | v | klæp |  | хлопать, аплодировать | to hit your hands together to show approval | The audience *clapped* for ten minutes. | Публика аплодировала десять минут.
- cram | v | kræm |  | впихивать, набивать; зубрить | to push many things into a small space; to study hard just before an exam | She *crammed* all her clothes into one suitcase. | Она запихнула всю одежду в один чемодан.
- drown | v | draʊn |  | тонуть, утонуть | to die under water because you can't breathe | He nearly *drowned* in the lake. | Он чуть не утонул в озере.
- kneel | v | niːl |  | вставать на колени | to go down on one or both knees | He *knelt* down to tie his shoe. | Он опустился на колено, чтобы завязать шнурок. | kneel — knelt — knelt; k не читается
- lick | v | lɪk |  | лизать | to move your tongue across something | The baby elephant *licked* the keeper's hand. | Слонёнок лизнул руку смотрителя.
- peel | v | piːl |  | чистить (от кожуры) | to remove the skin from fruit or vegetables | *Peel* the potatoes and cut them into pieces. | Почистите картошку и нарежьте кусочками.
- penetrate | v | ˈpenətreɪt |  | проникать, пробивать | to go into or through something | A piece of foam *penetrated* the wing. | Кусок пеноматериала пробил крыло.
- pinch | v | pɪntʃ |  | щипать, ущипнуть | to press skin tightly between your finger and thumb | My little brother *pinched* my arm. | Младший брат ущипнул меня за руку. | сущ. a pinch of salt — щепотка соли
- poke | v | pəʊk | poʊk | тыкать, толкать | to push something with a finger or stick | He *poked* the fire with a stick. | Он поворошил костёр палкой.
- scrape | v | skreɪp |  | царапать, скрести | to rub against a rough surface and damage it | She *scraped* her knee when she fell. | Она ободрала коленку, когда упала.
- seize | v | siːz |  | хватать, захватывать | to take something quickly and firmly | He *seized* my arm. | Он схватил меня за руку. | seize the chance — воспользоваться шансом
- sprinkle | v | ˈsprɪŋkl |  | посыпать, брызгать | to scatter small drops or pieces over something | *Sprinkle* some sugar on top. | Посыпьте сверху сахаром.
- surround | v | səˈraʊnd |  | окружать | to be all around something | The house is *surrounded* by trees. | Дом окружён деревьями.
- suspend | v | səˈspend |  | приостанавливать; подвешивать | to stop something for a short time; to hang | Flights were *suspended* because of the storm. | Рейсы приостановили из-за шторма.
