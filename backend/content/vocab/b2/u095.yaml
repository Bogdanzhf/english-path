title: Actions and movement
title_ru: Действия и движение
topic: actions
words:
- accomplish | v | əˈkʌmplɪʃ | əˈkɑːmplɪʃ | выполнять, достигать | to succeed in doing something | We *accomplished* a lot in one day. | За один день мы многого добились.
- capture | v | ˈkæptʃə | ˈkæptʃər | захватывать, ловить; запечатлеть | to catch someone; to show something in a photo | The photo *captures* the beauty of the lake. | Фотография передаёт красоту озера.
- clap | v | klæp |  | хлопать, аплодировать | to hit your hands together to show approval | The audience *clapped* for ten minutes. | Публика аплодировала десять минут.
- clog | v | klɒɡ | klɑːɡ | засорять(ся) | to block | Leaves *clogged* the drain. | Листья засорили водосток.
- construct | v | kənˈstrʌkt |  | строить, конструировать | to build or make something | They *constructed* a model of the city. | Они построили макет города.
- cram | v | kræm |  | впихивать, набивать; зубрить | to push many things into a small space; to study hard just before an exam | She *crammed* all her clothes into one suitcase. | Она запихнула всю одежду в один чемодан.
- detach | v | dɪˈtætʃ | ˈdɪtætʃ | отсоединять, отделять | to separate | *Detach* the form and send it back. | Отрежьте бланк и отправьте его обратно.
- disconnect | v | ˌdɪskəˈnekt | dɪskəˈnekt | отключать, отсоединять | to break a connection | Our phone was *disconnected*. | Наш телефон отключили.
- evolve | v | iˈvɒlv | iˈvɑːlv | эволюционировать, развиваться | to develop gradually | Birds *evolved* from dinosaurs. | Птицы произошли от динозавров. | evolution — эволюция
- fulfill | v | fʊlˈfɪl |  | выполнять, осуществлять | to do what is promised or hoped | They *fulfilled* their goal of reaching the coast. | Они достигли своей цели — дошли до побережья. | брит. fulfil
- immerse | v | ɪˈmɜːs | ˌɪˈmɜːrs | погружать(ся) | to put into liquid; to become completely involved | She *immersed* herself in her work. | Она погрузилась в работу.
- kneel | v | niːl |  | вставать на колени | to go down on one or both knees | He *knelt* down to tie his shoe. | Он опустился на колено, чтобы завязать шнурок. | kneel — knelt — knelt; k не читается
- manufacture | v | ˌmænjuˈfæktʃə | ˌmænjuˈfæktʃər | производить | to make goods in large numbers in a factory | The company *manufactures* medical equipment. | Компания производит медицинское оборудование.
- pave | v | peɪv |  | мостить | to cover with stones | The road was *paved* last year. | Дорогу заасфальтировали в прошлом году. | pave the way — проложить путь
- pluck | v | plʌk |  | срывать, выщипывать | to pull out | She *plucked* a flower. | Она сорвала цветок.
- prompt | v | prɒmpt | prɑːmpt | побуждать, вызывать | to cause someone to do something | The accident *prompted* a change in the law. | Авария побудила изменить закон. | прил. prompt — быстрый, незамедлительный
- rebuild | v | rɪˈbɪld | riːˈbɪld | восстанавливать, перестраивать | to build again | They *rebuilt* the church after the fire. | После пожара церковь восстановили.
- scrape | v | skreɪp |  | царапать, скрести | to rub against a rough surface and damage it | She *scraped* her knee when she fell. | Она ободрала коленку, когда упала.
- sprinkle | v | ˈsprɪŋkl |  | посыпать, брызгать | to scatter small drops or pieces over something | *Sprinkle* some sugar on top. | Посыпьте сверху сахаром.
- strangle | v | ˈstræŋɡl |  | душить | to kill by pressing the throat | The victim was *strangled*. | Жертву задушили.
