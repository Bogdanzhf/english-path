title: 'Describing: qualities'
title_ru: 'Описание: свойства и признаки'
topic: describing
words:
- alien | n | ˈeɪliən |  | инопланетянин | a creature from another planet | In the film, an *alien* lands in a small village. | В фильме инопланетянин приземляется в маленькой деревне.
- diverse | adj | daɪˈvɜːs | daɪˈvɜːrs | разнообразный | including many different types | The USA has a *diverse* population. | Население США очень разнообразно.
- divine | adj | dɪˈvaɪn |  | божественный | connected with God; extremely good | This chocolate cake is *divine*! | Этот шоколадный торт божественен!
- dynamic | adj | daɪˈnæmɪk |  | динамичный, энергичный | full of energy and new ideas | She's a *dynamic* young surgeon. | Она энергичный молодой хирург.
- fluid | adj | ˈfluːɪd |  | плавный, текучий; изменчивый | smooth and graceful; able to change | Her movements were *fluid* and elegant. | Её движения были плавными и изящными. | сущ. fluid — жидкость
- fundamental | adj | ˌfʌndəˈmentl |  | фундаментальный, основной | basic and very important | The plague caused *fundamental* changes in society. | Чума вызвала коренные изменения в обществе.
- grave | n | ɡreɪv |  | могила | the place where a dead person is buried | They put flowers on their grandfather's *grave*. | Они положили цветы на могилу дедушки.
- magical | adj | ˈmædʒɪkl |  | волшебный | very special and exciting, as if magic were used | The town looks *magical* in the snow. | Город в снегу выглядит волшебно.
- precious | adj | ˈpreʃəs |  | драгоценный, ценный | very valuable or loved | Gold and silver are *precious* metals. | Золото и серебро — драгоценные металлы.
- prominent | adj | ˈprɒmɪnənt | ˈprɑːmɪnənt | выдающийся, видный; заметный | important and well known; easily seen | She is a *prominent* biologist. | Она видный биолог.
- radical | adj | ˈrædɪkl |  | радикальный, коренной | very new and different; extreme | The machines brought *radical* change. | Машины принесли коренные перемены.
- spare | v | speə | sper | уделить; пощадить | to give time or money you don't need; to not hurt someone | Can you *spare* a few minutes? | Можешь уделить пару минут? | прил. spare — запасной, свободный
- steady | adj | ˈstedi |  | устойчивый, ровный | firm; not moving or changing | Hold the ladder *steady* while I climb. | Держи лестницу ровно, пока я лезу.
