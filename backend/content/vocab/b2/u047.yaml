title: Education
title_ru: Учёба
topic: education
words:
- academic performance | n | ˌækəˈdemɪk pəˈfɔːməns | ˌækəˈdemɪk pərˈfɔːrməns | успеваемость | how well a student does at school | Sleep affects *academic performance*. | Сон влияет на успеваемость.
- boarding school | n | ˈbɔːdɪŋ skuːl | ˈbɔːrdɪŋ skuːl | школа-интернат | a school where students live | He went to a *boarding school*. | Он учился в школе-интернате.
- compulsory | adj | kəmˈpʌlsəri |  | обязательный | required by law or rules | Education is *compulsory* until 16. | Образование обязательно до 16 лет.
- coursework | n | ˈkɔːswɜːk | kˈɔːswɜːk | курсовая работа | work done during a course | *Coursework* counts for 40% of the grade. | Курсовая работа составляет 40% оценки.
- deadline | n | ˈdedlaɪn |  | крайний срок | the time by which something must be done | The *deadline* for applications is Friday. | Крайний срок подачи заявок — пятница.
- diploma | n | dɪˈpləʊmə | dɪˈploʊmə | диплом | a document showing you have finished a course | She received her *diploma* in 1900. | Она получила диплом в 1900 году.
- distance learning | n | ˈdɪstəns ˈlɜːnɪŋ | ˈdɪstəns ˈlɜːrnɪŋ | дистанционное обучение | studying from home | She got her degree through *distance learning*. | Она получила диплом дистанционно.
- drop out | phv |  |  | бросить (учёбу) | to leave school or a course early | He *dropped out* of university. | Он бросил университет.
- enroll | v | ɪnˈrəʊl | ɪnˈroʊl | записываться, зачислять | to officially join a course or organization | She *enrolled* in an evening class. | Она записалась на вечерние курсы. | брит. enrol
- exam results | n | ɪɡˈzæm rɪˈzʌlts | ɪɡˈzæm riːˈzʌlts | результаты экзаменов | the marks you get in exams | I'm waiting for my *exam results*. | Я жду результаты экзаменов.
- gap year | n | ɡæp ˈjiə | ɡæp jɪr | год перерыва (между школой и вузом) | a year off before university | She took a *gap year* to travel. | Она взяла год перерыва, чтобы попутешествовать.
- homeschooling | n | ˈhəʊmskuːlɪŋ | ˈhoʊmskuːlɪŋ | домашнее обучение | teaching children at home | *Homeschooling* is becoming more popular. | Домашнее обучение становится всё популярнее.
- online course | n | ˈɒnlaɪn kɔːs | ˈɔːnlaɪn kɔːrs | онлайн-курс | a course you take on the internet | I'm doing an *online course* in design. | Я прохожу онлайн-курс по дизайну.
- optional | adj | ˈɒpʃənl | ˈɑːpʃənl | необязательный, по выбору | not required | Attendance is *optional*. | Посещение необязательно.
- plagiarism | n | ˈpleɪdʒərɪzəm |  | плагиат | copying someone else's work | *Plagiarism* is taken very seriously. | К плагиату относятся очень серьёзно.
- postgraduate | adj | ˈpəʊstɡrədjuːeɪt | pˈəʊstɡrɐdjuːeɪt | аспирантский, магистерский | relating to study after a first degree | She's doing a *postgraduate* course. | Она учится в магистратуре.
- primary education | n | ˈpraɪməri ˌedʒuːˈkeɪʃən | ˈpraɪmeri ˌedʒəˈkeɪʃən | начальное образование | education for young children | *Primary education* is free. | Начальное образование бесплатное.
- private school | n | ˈpraɪvət skuːl |  | частная школа | a school that parents pay for | He went to a *private school*. | Он учился в частной школе.
- seminar | n | ˈsemɪnɑː | ˈsemənɑːr | семинар | a class for discussion | We have a history *seminar* on Tuesdays. | По вторникам у нас семинар по истории.
- syllabus | n | ˈsɪlæbəs | ˈsɪləbəs | учебная программа (курса) | the topics in a course | Grammar is on the *syllabus*. | Грамматика входит в программу.
- tutorial | n | tjuːˈtɔːrɪəl | tuːˈtɔːriəl | консультация, занятие в малой группе; руководство | a small class; a lesson that teaches step by step | I watched a video *tutorial*. | Я посмотрел видеоурок.
