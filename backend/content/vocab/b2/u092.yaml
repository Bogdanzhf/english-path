title: 'Describing: good or bad'
title_ru: 'Описание: оценка — хорошо или плохо'
topic: describing
words:
- admirable | adj | ˈædmərəbl |  | достойный восхищения | deserving respect | Her courage is *admirable*. | Её смелость достойна восхищения.
- breathtaking | adj | ˈbreθteɪkɪŋ |  | захватывающий дух | very beautiful or exciting | The view was *breathtaking*. | Вид был захватывающий.
- catastrophic | adj | ˌkætəˈstrɒfɪk | ˌkætəˈstrɑːfɪk | катастрофический | very bad | The flood was *catastrophic*. | Наводнение было катастрофическим.
- catchy | adj | ˈkætʃi | ˈkætʃiː | запоминающийся, прилипчивый | easy to remember | The song has a *catchy* tune. | У песни прилипчивый мотив.
- economical | adj | ˌiːkəˈnɒmɪkl | ˌekəˈnɑːmɪkl | экономичный, экономный | not wasting money | This car is very *economical*. | Эта машина очень экономичная.
- exquisite | adj | ɪkˈskwɪsɪt | ˈekskwəzət | изысканный | very beautiful and delicate | She has *exquisite* taste. | У неё изысканный вкус.
- flawless | adj | ˈflɔːləs |  | безупречный | perfect | Her English is *flawless*. | Её английский безупречен.
- formidable | adj | fɔːˈmɪdəbl | ˈfɔːrmədəbl | грозный, внушительный | very impressive and difficult | They are a *formidable* team. | Это грозная команда.
- haunting | adj | ˈhɔːntɪŋ |  | навязчивый, западающий в душу | beautiful and hard to forget | It's a *haunting* melody. | Это западающая в душу мелодия.
- heartbreaking | adj | ˈhɑːtbreɪkɪŋ | ˈhɑːrtbreɪkɪŋ | душераздирающий | very sad | It's a *heartbreaking* story. | Это душераздирающая история.
- humorous | adj | ˈhjuːmərəs |  | юмористический, смешной | funny | He wrote a *humorous* book. | Он написал юмористическую книгу.
- ineffective | adj | ɪnɪˈfektɪv | ˌɪnɪˈfektɪv | неэффективный | not working well | The medicine was *ineffective*. | Лекарство оказалось неэффективным.
- irritating | adj | ˈɪrɪteɪtɪŋ | ˈɪrəteɪtɪŋ | раздражающий | annoying | That noise is *irritating*. | Этот шум раздражает.
- lucrative | adj | ˈluːkrətɪv |  | прибыльный | making a lot of money | It's a very *lucrative* business. | Это очень прибыльный бизнес.
- mediocre | adj | ˌmiːdɪˈəʊkə | ˌmiːdiːˈoʊkər | посредственный | not very good | The film was *mediocre*. | Фильм был посредственным.
- priceless | adj | ˈpraɪsləs |  | бесценный | extremely valuable | The painting is *priceless*. | Эта картина бесценна.
- redundant | adj | rɪˈdʌndənt |  | лишний; уволенный по сокращению | not needed; having lost your job | He was made *redundant*. | Его сократили.
- satisfactory | adj | ˌsætɪsˈfæktəri |  | удовлетворительный | good enough | His work is *satisfactory*, but not excellent. | Его работа удовлетворительная, но не отличная.
- thrilling | adj | ˈθrɪlɪŋ |  | захватывающий | very exciting | It was a *thrilling* match. | Это был захватывающий матч.
- unbearable | adj | ʌnˈbeərəbl | ənˈberəbl | невыносимый | too bad to accept | The pain was *unbearable*. | Боль была невыносимой.
