title: 'Describing: amount and degree'
title_ru: 'Описание: количество и степень'
topic: describing
words:
- countless | adj | ˈkaʊntləs |  | бесчисленный | too many to count | I've told you *countless* times! | Я говорил тебе бессчётное количество раз!
- excess | n | ɪkˈses |  | избыток, излишество | an amount that is more than needed | The court was famous for its *excess*. | Двор славился своими излишествами. | in excess of — свыше
- excessive | adj | ɪkˈsesɪv |  | чрезмерный | too much | *Excessive* drinking is bad for you. | Чрезмерное употребление алкоголя вредно.
- extensive | adj | ɪkˈstensɪv |  | обширный | large in amount or area | The house has *extensive* gardens. | При доме обширные сады.
- intense | adj | ɪnˈtens |  | сильный, интенсивный | very strong | The heat was *intense*. | Жара была невыносимой.
- intensive | adj | ɪnˈtensɪv | ˌɪnˈtensɪv | интенсивный | involving a lot of effort | I took an *intensive* English course. | Я прошёл интенсивный курс английского.
- margin | n | ˈmɑːdʒɪn | ˈmɑːrdʒən | поле (страницы); разница, перевес | the space at the edge of a page; a difference | Write notes in the *margin*. | Пишите заметки на полях.
- maximum | adj | ˈmæksɪməm |  | максимальный | the largest possible | The *maximum* speed here is 50 km/h. | Максимальная скорость здесь — 50 км/ч.
- mere | adj | mɪə | mɪr | всего лишь, простой | used to say how small or unimportant something is | Women make up a *mere* 15% of engineers. | Женщины составляют всего лишь 15% инженеров. | merely — лишь
- minor | adj | ˈmaɪnə | ˈmaɪnər | незначительный, небольшой | small and not very important | It was only a *minor* injury. | Это была лишь лёгкая травма. | сущ. minor — несовершеннолетний
- moderate | adj | ˈmɒdərət | ˈmɑːdərət | умеренный | not too much and not too little | Drive at a *moderate* speed in the rain. | В дождь езжайте с умеренной скоростью.
- partial | adj | ˈpɑːʃl | ˈpɑːrʃl | частичный | not complete | It was only a *partial* success. | Это был лишь частичный успех.
- remaining | adj | rɪˈmeɪnɪŋ | riːˈmeɪnɪŋ | оставшийся | still left | The *remaining* guests left at midnight. | Оставшиеся гости ушли в полночь.
- severe | adj | sɪˈvɪə | sɪˈvɪr | суровый, тяжёлый | very bad or serious | There was a *severe* storm last night. | Прошлой ночью был сильный шторм.
- sheer | adj | ʃɪə | ʃɪr | чистый, абсолютный; отвесный | complete, used to emphasize; very steep | The *sheer* power of the wind was terrifying. | Сама мощь ветра внушала ужас.
- sufficient | adj | səˈfɪʃnt |  | достаточный | enough | Two hours should be *sufficient* for the test. | Двух часов на тест должно хватить.
- tremendous | adj | trəˈmendəs |  | огромный, потрясающий | very great in amount or level | There was a *tremendous* noise. | Раздался страшный грохот.
- ultimate | adj | ˈʌltɪmət |  | конечный, главный, высший | most important; final | The *ultimate* goal is a long and happy life. | Конечная цель — долгая и счастливая жизнь.
- vast | adj | vɑːst | væst | огромный, обширный | extremely large | A *vast* cloud of dust covered the Earth. | Огромное облако пыли окутало Землю.
- widespread | adj | ˈwaɪdspred |  | широко распространённый | existing in many places or among many people | The disease was *widespread* in Asia and Africa. | Болезнь была широко распространена в Азии и Африке.
