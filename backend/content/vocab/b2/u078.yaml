title: Feelings and states
title_ru: Чувства и состояния
topic: feelings
words:
- absent | adj | ˈæbsənt |  | отсутствующий | not present | Cycle lanes are *absent* from many cities. | Во многих городах нет велодорожек.
- addicted | adj | əˈdɪktɪd |  | зависимый, пристрастившийся | unable to stop | He's *addicted* to video games. | Он подсел на видеоигры.
- ashamed | adj | əˈʃeɪmd |  | пристыженный | feeling bad about something you did | I'm *ashamed* of what I said. | Мне стыдно за то, что я сказал. | be ashamed of
- bothered | adj | ˈbɒðəd | ˈbɑːðərd | обеспокоенный; (не) против (разг.) | worried; caring | I can't be *bothered* to cook. | Мне лень готовить.
- delighted | adj | dɪˈlaɪtɪd | dɪˈlaɪtəd | очень довольный, восхищённый | very pleased | I'm *delighted* to meet you. | Очень рад познакомиться.
- furious | adj | ˈfjɔːrɪəs | ˈfjʊriəs | разъярённый | very angry | She was *furious* with him. | Она была в ярости на него.
- hopeful | adj | ˈhəʊpfl | ˈhoʊpfl | полный надежды | feeling hopeful | I'm *hopeful* that we'll win. | Я надеюсь, что мы победим.
- immortal | adj | ɪˈmɔːtl | ˌɪˈmɔːrtl | бессмертный | living for ever | The gods were *immortal*. | Боги были бессмертны.
- immune | adj | ɪˈmjuːn |  | невосприимчивый; иммунный | protected against a disease | After the vaccine, you're *immune* to the virus. | После прививки у вас иммунитет к вирусу. | immune system — иммунная система
- infected | adj | ɪnˈfektɪd | ˌɪnˈfektɪd | инфицированный, заражённый | having an infection | The cut became *infected*. | В порез попала инфекция.
- lame | adj | leɪm |  | хромой; неубедительный | unable to walk well; weak and unconvincing | That's a *lame* excuse. | Это неубедительное оправдание.
- mortal | adj | ˈmɔːtl | ˈmɔːrtl | смертный; смертельный | unable to live forever; causing death | They were in *mortal* danger. | Они были в смертельной опасности.
- motivated | adj | ˈməʊtɪveɪtɪd | ˈmoʊtəveɪtəd | мотивированный | wanting to do something | She's a very *motivated* student. | Она очень мотивированная студентка.
- possessed | adj | pəˈzest |  | одержимый | controlled by an evil spirit | He fought like a man *possessed*. | Он сражался как одержимый.
- relieved | adj | rɪˈliːvd | riːˈliːvd | испытывающий облегчение | happy that something bad didn't happen | I was *relieved* to hear the news. | Я с облегчением услышал новость.
- starving | adj | ˈstɑːvɪŋ | ˈstɑːrvɪŋ | умирающий от голода; голодный как волк | very hungry | I'm *starving*! What's for dinner? | Умираю с голоду! Что на ужин?
- stranded | adj | ˈstrændɪd |  | застрявший, оказавшийся в беде | unable to leave a place | Thousands of passengers were *stranded* at the airport. | Тысячи пассажиров застряли в аэропорту.
- unaware | adj | ˌʌnəˈweə | ˌʌnəˈwer | не знающий, не подозревающий | not knowing | I was *unaware* of the problem. | Я не знал о проблеме.
- unconscious | adj | ʌnˈkɒnʃəs | ˌʌnˈkɑːnʃəs | без сознания | not awake because of injury | He was knocked *unconscious*. | Его ударили, и он потерял сознание.
- unwilling | adj | ʌnˈwɪlɪŋ | ənˈwɪlɪŋ | не желающий | not wanting to | He was *unwilling* to help. | Он не хотел помогать.
