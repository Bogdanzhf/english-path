title: Actions and movement
title_ru: Действия и движение
topic: actions
words:
- conquer | v | ˈkɒŋkə | ˈkɑːŋkər | завоёвывать, покорять | to take control of a country by force; to beat | The Normans *conquered* England in 1066. | Норманны завоевали Англию в 1066 году. | conquer a fear — побороть страх
- decay | n | dɪˈkeɪ |  | разрушение, упадок, гниение | the process of being destroyed slowly | The society fell into *decay*. | Общество пришло в упадок.
- dissolve | v | dɪˈzɒlv | dɪˈzɑːlv | растворять(ся) | to mix with a liquid and disappear into it | Sugar *dissolves* quickly in hot tea. | Сахар быстро растворяется в горячем чае.
- emerge | v | ɪˈmɜːdʒ | ɪˈmɜːrdʒ | появляться, выходить | to come out from somewhere | The sun *emerged* from behind the clouds. | Из-за облаков выглянуло солнце.
- fade | v | feɪd |  | выцветать; угасать | to slowly become less bright or strong | The colours of the old photo have *faded*. | Краски на старой фотографии поблёкли.
- incorporate | v | ɪnˈkɔːpəreɪt | ɪnˈkɔːrpəreɪt | включать, внедрять | to include something as part of a whole | The design *incorporates* solar panels. | Конструкция включает солнечные панели.
- integrate | v | ˈɪntɪɡreɪt |  | интегрировать, объединять | to combine things so that they work together | The new system *integrates* solar and wind power. | Новая система объединяет солнечную и ветровую энергию.
- isolate | v | ˈaɪsəleɪt |  | изолировать, отделять | to separate from others | The patients were *isolated* to stop the infection spreading. | Пациентов изолировали, чтобы инфекция не распространялась.
- minimize | v | ˈmɪnɪmaɪz |  | сводить к минимуму | to reduce something to the smallest amount possible | Wash your hands to *minimize* the risk of infection. | Мойте руки, чтобы свести к минимуму риск заражения.
- modify | v | ˈmɒdɪfaɪ | ˈmɑːdɪfaɪ | изменять, модифицировать | to change something slightly | Engineers *modified* the design. | Инженеры изменили конструкцию.
- regulate | v | ˈreɡjuleɪt |  | регулировать | to control something | Mammals can *regulate* their body temperature. | Млекопитающие способны регулировать температуру тела.
- reinforce | v | ˌriːɪnˈfɔːs | ˌriːɪnˈfɔːrs | укреплять, подкреплять | to make stronger | New evidence *reinforced* the theory. | Новые данные подкрепили теорию.
- restrict | v | rɪˈstrɪkt |  | ограничивать | to limit something | Access to the site is *restricted*. | Доступ на объект ограничен.
- rot | v | rɒt | rɑːt | гнить | to become soft and bad because of age | The old wooden boat had started to *rot*. | Старая деревянная лодка начала гнить.
- stimulate | v | ˈstɪmjuleɪt |  | стимулировать | to encourage something to grow or develop | The space programme *stimulated* new technologies. | Космическая программа стимулировала развитие новых технологий.
- stun | v | stʌn |  | ошеломлять, поражать; оглушать | to shock or surprise someone very much | The news *stunned* the world. | Новость потрясла мир. | stunning — потрясающий
