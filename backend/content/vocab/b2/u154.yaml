title: Thinking and opinions
title_ru: Мысли и мнения
topic: mind
words:
- acceptance | n | əkˈseptəns |  | признание, принятие | the fact of being approved of or agreed to | The idea slowly gained *acceptance*. | Идея постепенно получила признание.
- 'essence | n | ˈesns |  | сущность, суть; эссенция | the most important quality of something | The *essence* of good medicine is simple: do no harm. | Суть хорошей медицины проста: не навреди.'
- expertise | n | ˌekspɜːˈtiːz | ˌekspɜːrˈtiːz | опыт, компетентность | special skill or knowledge | We need someone with *expertise* in computers. | Нам нужен специалист по компьютерам.
- illusion | n | ɪˈluːʒn |  | иллюзия | something that seems real but is not | Mirrors create the *illusion* of space. | Зеркала создают иллюзию простора.
- insight | n | ˈɪnsaɪt |  | понимание, озарение | a clear, deep understanding | The book gives an *insight* into life in ancient Rome. | Книга даёт представление о жизни в Древнем Риме.
- notion | n | ˈnəʊʃn | ˈnoʊʃn | понятие, представление, идея | an idea or belief | The *notion* that sugar causes diabetes is too simple. | Представление о том, что диабет вызывает сахар, слишком упрощённое.
- perception | n | pəˈsepʃn | pərˈsepʃn | восприятие, представление | the way you see or understand something | Travel changed my *perception* of the world. | Путешествия изменили моё восприятие мира.
- prejudice | n | ˈpredʒudɪs |  | предрассудок, предубеждение | an unfair opinion about a group of people | We must fight racial *prejudice*. | Мы должны бороться с расовыми предрассудками.
- reflection | n | rɪˈflekʃn |  | отражение; размышление | an image seen in a mirror or water | She saw her *reflection* in the lake. | Она увидела своё отражение в озере.
- sensation | n | senˈseɪʃn |  | ощущение; сенсация | a physical feeling; great excitement | I had a burning *sensation* in my throat. | У меня было жжение в горле.
- substitute | n | ˈsʌbstɪtjuːt | ˈsʌbstɪtuːt | замена, заменитель | a person or thing used instead of another | There is no *substitute* for experience. | Опыт ничем не заменишь.
- sympathy | n | ˈsɪmpəθi |  | сочувствие | a feeling of sadness for someone else's problems | You have my deepest *sympathy*. | Примите мои глубочайшие соболезнования. | не «симпатия» (это liking)
