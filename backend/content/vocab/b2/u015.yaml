title: 'How and how much: adverbs'
title_ru: 'Как и насколько: наречия'
topic: manner
words:
- barely | adv | ˈbeəli | ˈberli | едва, еле | almost not | I was so tired that I could *barely* walk. | Я так устал, что едва мог идти.
- otherwise | adv | ˈʌðəwaɪz | ˈʌðərwaɪz | иначе, в противном случае | if not | Hurry up, *otherwise* we'll be late. | Поторопись, иначе мы опоздаем.
- shortly | adv | ˈʃɔːtli | ˈʃɔːrtli | вскоре | soon | The train will arrive *shortly*. | Поезд скоро прибудет.
- somewhat | adv | ˈsʌmwɒt | ˈsʌmwʌt | отчасти, несколько | rather; to some degree | The film was *somewhat* boring. | Фильм был несколько скучным.
- thus | adv | ðʌs |  | таким образом, поэтому | as a result; in this way | The bridge was destroyed, *thus* cutting off the enemy. | Мост был разрушен, и таким образом враг оказался отрезан.
