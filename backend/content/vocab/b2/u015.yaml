title: 'How and how much: adverbs'
title_ru: 'Как и насколько: наречия'
topic: manner
words:
- barely | adv | ˈbeəli | ˈberli | едва, еле | almost not | I was so tired that I could *barely* walk. | Я так устал, что едва мог идти.
- closely | adv | ˈkləʊsli | ˈkloʊsli | внимательно; тесно | carefully; in a close way | Listen *closely*. | Слушайте внимательно.
- entirely | adv | ɪnˈtaɪəli | ɪnˈtaɪərli | полностью, целиком | completely | I *entirely* agree with you. | Полностью с тобой согласен.
- essentially | adv | ɪˈsenʃəli | eˈsenʃəli | по существу | basically | The two plans are *essentially* the same. | По сути, эти два плана одинаковы.
- forth | adv | fɔːθ | fɔːrθ | вперёд, далее | forward; away | He walked back and *forth*. | Он ходил туда-сюда. | and so forth — и так далее
- hopefully | adv | ˈhəʊpfəli | ˈhoʊpfəli | надеюсь | I hope that | *Hopefully*, we'll finish today. | Надеюсь, мы сегодня закончим.
- initially | adv | ɪˈnɪʃəli | ˌɪˈnɪʃəli | вначале, сначала | at first | *Initially*, I didn't like him. | Сначала он мне не понравился.
- largely | adv | ˈlɑːdʒli | ˈlɑːrdʒli | в основном, во многом | mostly | The success was *largely* due to luck. | Успех во многом объяснялся удачей.
- literally | adv | ˈlɪtərəli |  | буквально | in the real meaning of the words | The house was *literally* falling apart. | Дом буквально разваливался.
- newly | adv | ˈnjuːli | ˈnuːli | недавно, вновь | recently | They're a *newly* married couple. | Они молодожёны.
- otherwise | adv | ˈʌðəwaɪz | ˈʌðərwaɪz | иначе, в противном случае | if not | Hurry up, *otherwise* we'll be late. | Поторопись, иначе мы опоздаем.
- primarily | adv | praɪˈmerəli |  | прежде всего, главным образом | mainly | The course is *primarily* for beginners. | Курс прежде всего рассчитан на начинающих.
- relatively | adv | ˈrelətɪvli |  | относительно | quite, compared with others | The test was *relatively* easy. | Тест был относительно лёгким.
- shortly | adv | ˈʃɔːtli | ˈʃɔːrtli | вскоре | soon | The train will arrive *shortly*. | Поезд скоро прибудет.
- significantly | adv | sɪɡˈnɪfɪkəntli |  | значительно | a lot | Prices have risen *significantly*. | Цены значительно выросли.
- somehow | adv | ˈsʌmhaʊ |  | каким-то образом | in some way | We'll finish *somehow*. | Мы как-нибудь справимся.
- somewhat | adv | ˈsʌmwɒt | ˈsʌmwʌt | отчасти, несколько | rather; to some degree | The film was *somewhat* boring. | Фильм был несколько скучным.
- thus | adv | ðʌs |  | таким образом, поэтому | as a result; in this way | The bridge was destroyed, *thus* cutting off the enemy. | Мост был разрушен, и таким образом враг оказался отрезан.
- ultimately | adv | ˈʌltɪmətli | ˈʌltəmətli | в конечном счёте | finally; in the end | *Ultimately*, it's your decision. | В конечном счёте это твоё решение.
