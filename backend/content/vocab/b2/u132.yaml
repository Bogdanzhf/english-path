title: 'Describing: time and age'
title_ru: 'Описание: время, новизна, возраст'
topic: describing
words:
- advance | v | ədˈvɑːns | ədˈvæns | продвигаться вперёд | to move forward; to make progress | Our team *advanced* to the final. | Наша команда вышла в финал. | in advance — заранее
- contemporary | adj | kənˈtemprəri | kənˈtempəreri | современный | belonging to the present time | The café has a *contemporary* design. | У кафе современный дизайн. | сущ. contemporary — современник
- developing | adj | dɪˈveləpɪŋ |  | развивающийся | growing | It's a *developing* country. | Это развивающаяся страна.
- enduring | adj | ɪnˈdjɔːrɪŋ | enˈdjʊrɪŋ | прочный, долговечный | lasting a long time | They have an *enduring* friendship. | Их связывает прочная дружба.
- existing | adj | ɪɡˈzɪstɪŋ |  | существующий | already present | We need to improve *existing* roads. | Нужно улучшить существующие дороги.
- gradual | adj | ˈɡrædʒuəl |  | постепенный | happening slowly over a long time | There has been a *gradual* improvement in his health. | Его здоровье постепенно улучшалось. | gradually — постепенно
- last-minute | adj | ˌlæsˈmɪnət |  | в последнюю минуту | done at the latest time | We got a *last-minute* deal. | Мы купили горящий тур.
- lifelong | adj | ˈlaɪflɒŋ | ˈlaɪˈflɔːŋ | пожизненный, на всю жизнь | lasting all your life | They're *lifelong* friends. | Они друзья на всю жизнь.
- long-standing | adj | ˈlɒŋstændɪŋ | ˈlɔːŋstændɪŋ | давний | having existed for a long time | They have a *long-standing* friendship. | Их связывает давняя дружба.
- ongoing | adj | ˈɒnɡəʊɪŋ | ˈɑːnɡoʊɪŋ | продолжающийся, текущий | continuing to happen | Research into the drug is *ongoing*. | Исследования препарата продолжаются.
- overnight | adv | ˌəʊvəˈnaɪt | ˌoʊvərˈnaɪt | за ночь; внезапно | during the night; very quickly | She became famous *overnight*. | Она прославилась в одночасье.
- permanent | adj | ˈpɜːmənənt | ˈpɜːrmənənt | постоянный | lasting for a long time or for ever | She finally got a *permanent* job. | Наконец она нашла постоянную работу.
- prior | adj | ˈpraɪə | ˈpraɪər | предшествующий, прежний | happening before | No *prior* experience is needed. | Предварительный опыт не требуется. | prior to — до
- proposed | adj | prəˈpəʊzd | prəˈpoʊzd | предлагаемый | suggested | The *proposed* changes are unpopular. | Предлагаемые изменения непопулярны.
- scheduled | adj | ˈʃedjuːld | ˈskedʒuːld | запланированный, плановый | planned for a certain time | The *scheduled* flight leaves at ten. | Рейс по расписанию вылетает в десять.
- seasonal | adj | ˈsiːzənl |  | сезонный | for a season | Strawberries are a *seasonal* fruit. | Клубника — сезонная ягода.
- short-term | adj | ˌʃɔːtˈtɜːm | ˌʃɔːrtˈtɜːrm | краткосрочный | for a short time | It's only a *short-term* solution. | Это лишь временное решение.
- subsequent | adj | ˈsʌbsɪkwənt |  | последующий | happening after something else | The *subsequent* tests confirmed the results. | Последующие испытания подтвердили результаты. | subsequently — впоследствии
- temporary | adj | ˈtemprəri | ˈtempəreri | временный | lasting only for a short time | I have a *temporary* job for the summer. | У меня временная работа на лето.
- timely | adj | ˈtaɪmli |  | своевременный | happening at the right time | Thank you for your *timely* reply. | Спасибо за своевременный ответ.
