title: Actions and movement
title_ru: Действия и движение
topic: actions
words:
- accompany | v | əˈkʌmpəni |  | сопровождать | to go somewhere with someone | Children must be *accompanied* by an adult. | Дети должны быть в сопровождении взрослого.
- arise | v | əˈraɪz |  | возникать | to happen; to appear | Problems may *arise* if we don't plan carefully. | Если не планировать тщательно, могут возникнуть проблемы. | arise — arose — arisen
- compose | v | kəmˈpəʊz | kəmˈpoʊz | сочинять (музыку) | to write music or a poem | Mozart *composed* his first music at the age of five. | Моцарт сочинил первую музыку в пять лет. | be composed of — состоять из
- comprise | v | kəmˈpraɪz |  | состоять из, включать | to consist of | The expedition *comprised* nineteen men, horses and camels. | В экспедицию входили девятнадцать человек, лошади и верблюды.
- contradict | v | ˌkɒntrəˈdɪkt | ˌkɑːntrəˈdɪkt | противоречить | to say the opposite of what someone else has said; to disagree with | The new evidence *contradicts* his theory. | Новые данные противоречат его теории.
- dominate | v | ˈdɒmɪneɪt | ˈdɑːmɪneɪt | доминировать, господствовать | to have control over; to be the most important | Farming *dominates* the local economy. | В местной экономике главную роль играет сельское хозяйство.
- exceed | v | ɪkˈsiːd |  | превышать | to be more than something | The cost must not *exceed* one thousand dollars. | Стоимость не должна превышать тысячи долларов.
- excel | v | ɪkˈsel |  | преуспевать, отличаться | to be extremely good at something | He *excelled* at mathematics. | Он блестяще успевал по математике. | excellent — отличный
- hesitate | v | ˈhezɪteɪt |  | колебаться, не решаться | to pause before doing or saying something | Don't *hesitate* to call me. | Не стесняйтесь мне звонить.
- inhabit | v | ɪnˈhæbɪt |  | населять, обитать | to live in a place | Polar bears *inhabit* the Arctic. | Белые медведи обитают в Арктике.
- pause | v | pɔːz |  | делать паузу | to stop for a short time | He *paused* and looked out of the window. | Он сделал паузу и выглянул в окно.
- possess | v | pəˈzes |  | обладать, владеть | to have or own something | He *possesses* a great talent for music. | Он обладает огромным музыкальным талантом.
- precede | v | prɪˈsiːd |  | предшествовать | to come before | A short speech *preceded* the auction. | Аукциону предшествовала короткая речь.
- 'resemble | v | rɪˈzembl |  | походить, быть похожим | to look like someone or something | She *resembles* her mother. | Она похожа на маму. | без предлога: resemble somebody'
