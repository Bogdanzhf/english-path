title: Nature and weather
title_ru: Природа и погода
topic: nature
words:
- bond | v | bɒnd | bɑːnd | сближаться, сдружиться | to develop a close relationship | The team *bonded* during the long trip. | Команда сплотилась во время долгой поездки. | сущ. bond — связь, узы
- botany | n | ˈbɒtəni | ˈbɑːtəni | ботаника | the scientific study of plants | She has a degree in *botany*. | У неё диплом по ботанике.
- bud | n | bʌd |  | почка, бутон | a young flower or leaf before it opens | The trees are covered in *buds* in spring. | Весной деревья покрыты почками.
- fume | n | fjuːm |  | дым, пары, выхлопные газы | strong, unpleasant and often dangerous gas or smoke | Car *fumes* pollute the air. | Выхлопные газы загрязняют воздух. | чаще мн. ч. fumes
- mist | n | mɪst |  | туман, дымка | a thin cloud of tiny water drops near the ground | The hills were covered in *mist*. | Холмы были окутаны туманом. | легче, чем fog
- overcast | adj | ˌəʊvəˈkɑːst | ˌoʊvərˈkæst | пасмурный | (of the sky) covered with clouds | The sky was grey and *overcast*. | Небо было серым и пасмурным.
- pine | n | paɪn |  | сосна | a tall tree with thin sharp leaves that stays green all year | The house was surrounded by tall *pines*. | Дом окружали высокие сосны.
