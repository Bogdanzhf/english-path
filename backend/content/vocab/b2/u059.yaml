title: Animals
title_ru: Животные
topic: animals
words:
- 'bark | v | bɑːk | bɑːrk | лаять | to make the sound of a dog | The dog *barked* all night. | Собака лаяла всю ночь. | сущ.: bark — кора'
- beak | n | biːk |  | клюв | the hard mouth of a bird | The bird had a worm in its *beak*. | У птицы в клюве был червяк.
- breed | n | briːd |  | порода | a type of animal within a species | What *breed* is your dog? | Какой породы твоя собака? | гл. breed — разводить
- clam | n | klæm |  | моллюск (двустворчатый) | a shellfish | We had *clam* chowder. | Мы ели суп из моллюсков.
- donkey | n | ˈdɒŋki | ˈdɑːŋki | осёл | an animal like a small horse with long ears | The children rode a *donkey*. | Дети катались на ослике.
- howl | v | haʊl |  | выть | to make a long loud crying sound like a wolf | The wolves *howled* at the moon. | Волки выли на луну.
- 'leopard | n | ˈlepəd | ˈlepərd | леопард | a big wild cat with spots | A *leopard* can''t change its spots. | Горбатого могила исправит. | досл.: леопард не может сменить пятна'
- livestock | n | ˈlaɪvstɒk | ˈlaɪvstɑːk | скот | farm animals | The farmers lost their *livestock* in the flood. | Фермеры потеряли скот во время наводнения.
- mammal | n | ˈmæml |  | млекопитающее | an animal that feeds its young on milk | Whales and humans are both *mammals*. | И киты, и люди — млекопитающие.
- national park | n | ˈnæʃənl pɑːk | ˈnæʃənl pɑːrk | национальный парк | a large protected area of nature | Yellowstone is a famous *national park*. | Йеллоустоун — знаменитый национальный парк.
- nature reserve | n | ˈneɪtʃə rɪˈzɜːv | ˈneɪtʃər riːˈzɜːrv | заповедник | an area where wildlife is protected | Hunting is banned in the *nature reserve*. | В заповеднике охота запрещена.
- orangutan | n | ɔːˌræŋuːˈtæn | əˈræŋətæn | орангутан | a large ape with reddish hair | *Orangutans* can live for over fifty years. | Орангутаны могут жить более пятидесяти лет.
- paw | n | pɔː |  | лапа | the foot of an animal with claws | The dog had hurt its *paw*. | Собака поранила лапу.
- reptile | n | ˈreptaɪl | ˈreptl | рептилия | a cold-blooded animal such as a snake or tortoise | Some *reptiles*, like giant tortoises, live for over 150 years. | Некоторые рептилии, например гигантские черепахи, живут более 150 лет.
- roar | v | rɔː | rɔːr | рычать, реветь | to make a loud deep sound | The lion *roared*. | Лев зарычал.
- species | n | ˈspiːʃiːz |  | вид (биологический) | a group of animals or plants of the same type | There are over 10,000 *species* of birds. | Существует более 10 000 видов птиц. | мн. ч. = ед. ч.
- termite | n | ˈtɜːmaɪt | ˈtɜːrmaɪt | термит | an insect that lives in large groups and eats wood | The chimp pulled *termites* out of the nest. | Шимпанзе вытаскивал термитов из гнезда.
- wasp | n | wɒsp | wɑːsp | оса | a yellow and black insect that stings | I was stung by a *wasp*. | Меня ужалила оса.
- zebra | n | ˈzebrə | ˈziːbrə | зебра | an African horse with stripes | *Zebras* have black and white stripes. | У зебр чёрно-белые полоски.
