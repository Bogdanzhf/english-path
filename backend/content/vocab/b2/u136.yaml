title: Events and situations
title_ru: События и ситуации
topic: events
words:
- pastime | n | ˈpɑːstaɪm | ˈpæstaɪm | времяпрепровождение, хобби | an activity you do for fun | Fishing is his favourite *pastime*. | Рыбалка — его любимое занятие.
- precaution | n | prɪˈkɔːʃn |  | мера предосторожности | something done to prevent harm | As a *precaution*, borrowers worked in small groups. | В качестве меры предосторожности заёмщики работали небольшими группами.
- reflex | n | ˈriːfleks |  | рефлекс | an action your body does automatically | Blinking is a *reflex*. | Моргание — это рефлекс.
