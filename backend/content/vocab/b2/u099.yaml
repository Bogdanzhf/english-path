title: Society and politics
title_ru: Общество и политика
topic: society
words:
- almighty | adj | ɔːlˈmaɪti |  | всемогущий; страшный (разг.) | having complete power; very great | There was an *almighty* crash. | Раздался страшный грохот. | the Almighty — Всевышний
- altar | n | ˈɔːltə | ˈɔːltər | алтарь | a holy table in a church or temple | Candles burned on the *altar*. | На алтаре горели свечи.
- astrology | n | əˈstrɒlədʒi | əˈstrɑːlədʒi | астрология | the belief that stars and planets affect people's lives | *Astrology* is not a science. | Астрология — не наука. | astronomy — астрономия
- bomber | n | ˈbɒmə | ˈbɑːmər | бомбардировщик; подрывник | a plane that drops bombs; a person who uses bombs | The *bomber* was arrested. | Подрывника арестовали.
- bombing | n | ˈbɒmɪŋ | ˈbɑːmɪŋ | бомбардировка; взрыв | an attack with bombs | Many died in the *bombing*. | Многие погибли при бомбёжке.
- bullet | n | ˈbʊlɪt |  | пуля | a small metal object shot from a gun | The police found a *bullet* in the wall. | Полиция нашла пулю в стене.
- citizenship | n | ˈsɪtɪzənʃɪp |  | гражданство | being a citizen of a country | She has British *citizenship*. | У неё британское гражданство.
- civilization | n | ˌsɪvəlɪˈzeɪʃən |  | цивилизация | an advanced society | Ancient Egyptian *civilization* lasted 3,000 years. | Древнеегипетская цивилизация просуществовала 3000 лет. | брит. также civilisation
- commemorate | v | kəˈmeməreɪt |  | отмечать (память), увековечивать | to remember an event officially | A statue *commemorates* the battle. | Статуя увековечивает память о битве.
- conquest | n | ˈkɒŋkwest | ˈkɑːŋkwest | завоевание | taking control of a country by force | Caesar's *conquest* of Gaul made him rich. | Завоевание Галлии сделало Цезаря богатым.
- gunshot | n | ˈɡʌnʃɒt | ˈɡʌnʃɑːt | выстрел | the sound or act of firing a gun | We heard a *gunshot*. | Мы услышали выстрел.
- monastery | n | ˈmɒnəstri | ˈmɑːnəsteri | монастырь (мужской) | a building where monks live | The *monastery* was built on a cliff. | Монастырь был построен на скале.
- monk | n | mʌŋk |  | монах | a man who lives in a religious community | The *monks* get up at four in the morning to pray. | Монахи встают в четыре утра на молитву.
- pharaoh | n | ˈfeərəʊ | ˈferoʊ | фараон | a king of ancient Egypt | The *pharaoh* was buried in a pyramid. | Фараона похоронили в пирамиде.
- rebel | n | ˈrebl |  | мятежник, бунтарь | a person who fights against the people in power | The *rebels* took control of the city. | Мятежники захватили город. | гл. rebel [rɪˈbel] — восставать
- relic | n | ˈrelɪk |  | реликвия; пережиток | an object from the past | The museum has *relics* from the war. | В музее хранятся реликвии войны.
- royalty | n | ˈrɔɪəlti |  | члены королевской семьи; гонорар (авторский) | kings and queens; money for each copy sold | She was treated like *royalty*. | С ней обращались как с королевой.
- throne | n | θrəʊn | θroʊn | трон, престол | the special chair of a king or queen; royal power | He came to the *throne* in 268 BC. | Он взошёл на престол в 268 году до н. э.
- tomb | n | tuːm |  | гробница | a grave with a stone structure | They found the *tomb* of a pharaoh. | Нашли гробницу фараона.
- warship | n | ˈwɔːʃɪp | ˈwɔːrʃɪp | военный корабль | a ship used in war | A *warship* entered the port. | В порт вошёл военный корабль.
