title: Shopping and money
title_ru: Покупки и деньги
topic: shopping
words:
- deposit | n | dɪˈpɒzɪt | dɪˈpɑːzɪt | залежь; депозит, залог | a layer of a substance in the ground; money paid as a first payment | Gold *deposits* attract illegal miners. | Месторождения золота привлекают незаконных старателей.
- expense | n | ɪkˈspens |  | расход, трата | money that you spend on something | Travel *expenses* will be paid by the company. | Командировочные расходы оплатит компания.
- fund | n | fʌnd |  | фонд, средства | an amount of money collected for a purpose | The school started a *fund* to buy new computers. | Школа открыла фонд для покупки новых компьютеров.
- merchandise | n | ˈmɜːtʃəndaɪs | ˈmɜːrtʃəndaɪs | товары | goods that are bought and sold | All *merchandise* must be paid for at the till. | Все товары нужно оплатить на кассе. | разг. merch — фирменная продукция
- mortgage | n | ˈmɔːɡɪdʒ | ˈmɔːrɡɪdʒ | ипотека | a loan from a bank to buy a house | They took out a *mortgage* to buy their first home. | Они взяли ипотеку, чтобы купить первое жильё. | t не читается
- overhead | adv | ˌəʊvəˈhed | ˌoʊvərˈhed | над головой, наверху | above your head | A flock of geese flew *overhead*. | Над головой пролетела стая гусей.
- ransom | n | ˈrænsəm |  | выкуп | money demanded for the release of a kidnapped person | The kidnappers demanded a *ransom*. | Похитители потребовали выкуп.
- retail | n | ˈriːteɪl |  | розничная торговля | the business of selling goods to the public in shops | She works in *retail*. | Она работает в розничной торговле. | wholesale — оптовая
- stall | n | stɔːl |  | прилавок, ларёк; стойло | a table or small shop in a market | Traders sold souvenirs from *stalls*. | Торговцы продавали сувениры с прилавков.
