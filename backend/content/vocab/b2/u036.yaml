title: Shopping and money
title_ru: Покупки и деньги
topic: shopping
words:
- acquire | v | əˈkwaɪə | əˈkwaɪər | приобретать | to get or gain something | She *acquired* a good knowledge of Spanish. | Она приобрела хорошее знание испанского.
- bankrupt | adj | ˈbæŋkrʌpt |  | обанкротившийся | unable to pay your debts | The company went *bankrupt* last year. | Компания обанкротилась в прошлом году. | bankruptcy — банкротство
- bargain | v | ˈbɑːɡɪn | ˈbɑːrɡən | торговаться | to discuss the price | You can *bargain* at the market. | На рынке можно торговаться.
- belongings | n | bɪˈlɒŋɪŋz | bɪˈlɔːŋɪŋz | вещи, имущество | things you own | Take all your *belongings* with you. | Заберите все свои вещи.
- contribute | v | kənˈtrɪbjuːt |  | вносить вклад, жертвовать | to give money, help or ideas together with other people | Everyone *contributed* five dollars for the present. | Каждый внёс по пять долларов на подарок.
- dime | n | daɪm |  | десятицентовик (амер.) | a US coin worth 10 cents | It costs a *dime*. | Это стоит десять центов.
- distribute | v | dɪˈstrɪbjuːt |  | распределять, распространять | to share or spread out | The trees *distribute* water through the air. | Деревья разносят влагу по воздуху.
- dump | v | dʌmp |  | сбрасывать, выбрасывать; бросить (парня, девушку) | to throw away; to end a relationship | Someone *dumped* rubbish in the river. | Кто-то вывалил мусор в реку.
- gain | v | ɡeɪn |  | набирать, получать | to gradually get more of something | He *gained* five kilos over the winter. | За зиму он набрал пять килограммов. | gain weight — набрать вес
- giveaway | n | ˈɡɪvəweɪ |  | бесплатная раздача; выдающий признак | a free gift; something that reveals a secret | The shop has a *giveaway* this weekend. | В эти выходные в магазине бесплатная раздача.
- grant | v | ɡrɑːnt | ɡrænt | предоставлять, давать (официально) | to officially give or allow something | The bank *granted* him a loan. | Банк предоставил ему кредит. | сущ. grant — грант
- inherit | v | ɪnˈherɪt |  | наследовать | to get money, things or qualities from a parent | He *inherited* his grandfather's house. | Он унаследовал дом деда.
- obtain | v | əbˈteɪn |  | получать, добывать | to get something, often with effort | You need to *obtain* a visa before you travel. | Перед поездкой нужно получить визу.
- owe | v | əʊ | oʊ | быть должным | to need to pay back | I *owe* you ten pounds. | Я должен тебе десять фунтов.
- prosper | v | ˈprɒspə | ˈprɑːspər | процветать | to be successful, especially with money | The town *prospered* when the railway came. | Город расцвёл, когда провели железную дорогу.
- 'purchase | n | ˈpɜːtʃɪs | ˈpɜːrtʃəs | покупка | something you buy | Keep the receipt for your *purchase*. | Сохраните чек за покупку. | гл.: purchase — покупать'
- reserve | v | rɪˈzɜːv | rɪˈzɜːrv | резервировать, бронировать; оставлять | to keep for a special use; to book | These seats are *reserved* for elderly people. | Эти места предназначены для пожилых людей.
- scrap | v | skræp |  | отказываться, отменять; сдавать на лом | to get rid of something; to cancel a plan | The government *scrapped* the plan. | Правительство отказалось от плана. | сущ. scrap — клочок; металлолом
- 'sponsor | n | ˈspɒnsə | ˈspɑːnsər | спонсор | a person or company that pays for an event | The team has a new *sponsor*. | У команды новый спонсор. | гл.: sponsor — спонсировать'
- stock | n | stɒk | stɑːk | запас; акции | goods in a shop; shares | The shoes are out of *stock*. | Этих туфель нет в наличии.
- subscribe | v | səbˈskraɪb |  | подписываться | to pay regularly to receive something; to agree with an idea | I *subscribe* to several magazines. | Я подписан на несколько журналов. | subscribe to a view — разделять мнение
reading:
  title: How Norway Saved Its Oil Money
  title_ru: Как Норвегия сберегла нефтяные деньги
  text: |
    Fifty years ago, Norway was one of the poorer countries in Western Europe. Many people in its coastal regions subsisted on fishing and farming. Then, in 1969, a company exploring the North Sea made a discovery that would transform the nation: one of the largest offshore oil fields ever found.

    Many countries that find petroleum suffer from what economists call the "resource curse". Money flows in so quickly that governments spend it all, other sectors of the economy collapse, and corruption grows. When the oil runs out or prices fall, the country is left with nothing.

    Norway chose a different path. Its leaders decided that the oil belonged to all Norwegians — including those not yet born. In 1990, the government created a special fund. Instead of spending the money from oil exports, it would invest it abroad, in shares, property and bonds. The government is allowed to spend only about three percent of the fund each year — roughly the amount the investments earn.

    Not everyone liked the plan. Some politicians wanted to scrap it and spend the money on roads and hospitals immediately. How could the government justify saving billions while people wanted better services? But the leaders deferred spending, and the habitual caution of Norwegian politics won.

    Today, the fund is worth more than a trillion dollars — over $200,000 for every person in the country. It owns about 1.5% of all shares in the world's companies. Notwithstanding its success, the fund faces difficult questions. It has suspended investments in companies that produce weapons or tobacco, and it penalizes firms that cause serious environmental damage.

    There is also an irony. Norway earns its wealth from oil, but it is one of the world leaders in electric cars, and the conversion of its transport system is moving fast. Oil output will eventually fall. Thanks to the fund, however, Norway's future no longer depends on the fumes of its past.
  ru: |
    Пятьдесят лет назад Норвегия была одной из самых бедных стран Западной Европы. Многие жители прибрежных регионов кормились рыбной ловлей и сельским хозяйством. Но в 1969 году компания, проводившая разведку в Северном море, сделала открытие, которое изменило страну: одно из крупнейших когда-либо найденных морских нефтяных месторождений.

    Многие страны, нашедшие нефть, страдают от того, что экономисты называют «ресурсным проклятием». Деньги поступают так быстро, что правительства тратят их все, другие отрасли экономики приходят в упадок, а коррупция растёт. Когда нефть заканчивается или цены падают, страна остаётся ни с чем.

    Норвегия выбрала другой путь. Её руководители решили, что нефть принадлежит всем норвежцам — в том числе ещё не родившимся. В 1990 году правительство создало специальный фонд. Вместо того чтобы тратить доходы от экспорта нефти, их стали вкладывать за рубежом — в акции, недвижимость и облигации. Правительству разрешено тратить лишь около трёх процентов фонда в год — примерно столько, сколько приносят инвестиции.

    План нравился не всем. Некоторые политики хотели от него отказаться и немедленно потратить деньги на дороги и больницы. Как правительство может оправдать сбережение миллиардов, когда люди хотят лучших услуг? Но руководство откладывало траты, и привычная осторожность норвежской политики победила.

    Сегодня фонд стоит более триллиона долларов — свыше 200 000 долларов на каждого жителя страны. Ему принадлежит около 1,5% всех акций компаний мира. Несмотря на успех, перед фондом стоят непростые вопросы. Он приостановил вложения в компании, производящие оружие и табак, и наказывает фирмы, наносящие серьёзный ущерб природе.

    Есть и ирония. Норвегия богатеет на нефти, но при этом она один из мировых лидеров по электромобилям, и переоснащение её транспортной системы идёт быстро. Добыча нефти рано или поздно снизится. Но благодаря фонду будущее Норвегии больше не зависит от выхлопов её прошлого.
  questions:
  - q: What is the 'resource curse'?
    options:
    - Running out of oil
    - When resource wealth leads to waste and economic problems
    - A tax on oil
    - Pollution from oil
    answer: 1
  - q: What does Norway do with most of its oil money?
    options:
    - Spends it on roads
    - Invests it abroad
    - Gives it to citizens
    - Keeps it in a bank in Oslo
    answer: 1
  - q: What kind of companies has the fund stopped investing in?
    options:
    - Electric car makers
    - Weapons and tobacco companies
    - Fishing companies
    - Banks
    answer: 1
  - tf: The government can spend as much of the fund as it wants.
    answer: false
  - tf: Norway is a world leader in electric cars.
    answer: true
