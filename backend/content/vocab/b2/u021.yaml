title: Body and health
title_ru: Тело и здоровье
topic: body
words:
- antibiotic | n | ˌæntibaɪˈɒtɪk | ˌæntibaɪˈɑːtɪk | антибиотик | a medicine that kills bacteria | The doctor prescribed a course of *antibiotics*. | Врач назначил курс антибиотиков.
- cure | n | kjʊə | kjʊr | лекарство, средство; излечение | a medicine or treatment that makes someone healthy | There is still no *cure* for the common cold. | От обычной простуды до сих пор нет лекарства. | гл. cure — вылечить
- dental | adj | ˈdentl | ˈdenl | зубной, стоматологический | relating to teeth | I have a *dental* appointment. | У меня запись к стоматологу.
- germ | n | dʒɜːm | dʒɜːrm | микроб | a very small living thing that causes illness | Wash your hands to kill the *germs*. | Мойте руки, чтобы убить микробы.
- hairy | adj | ˈheəri | ˈheri | волосатый | covered in hair | He has *hairy* arms. | У него волосатые руки.
- hospice | n | ˈhɒspɪs | ˈhɑːspəs | хоспис | a hospital for dying people | She works as a volunteer in a *hospice*. | Она работает волонтёром в хосписе.
- mustache | n | ˈməstæʃ | ˈmʌstæʃ | усы (амер.) | hair above the upper lip | He has a thick *mustache*. | У него густые усы. | брит. moustache
- ointment | n | ˈɔɪntmənt |  | мазь | a cream for the skin | Put some *ointment* on the cut. | Намажь порез мазью.
- outpatient | n | aʊtˈpeɪʃənt | ˈaʊtpeɪʃənt | амбулаторный пациент | a patient who does not stay in hospital | He was treated as an *outpatient*. | Его лечили амбулаторно.
- paralysis | n | pəˈræləsɪs |  | паралич | the loss of the ability to move | The disease can cause *paralysis*. | Болезнь может вызвать паралич.
- penicillin | n | ˈpenɪsɪlɪn | ˌpenəˈsɪlən | пенициллин | a medicine that kills bacteria | Fleming discovered *penicillin*. | Флеминг открыл пенициллин.
- preventive | adj | prɪˈventɪv | priːˈvenɪv | профилактический | intended to stop something bad | *Preventive* medicine saves lives. | Профилактическая медицина спасает жизни.
- quarantine | n | ˈkwɒrɑːntiːn | ˈkwɔːrəntiːn | карантин | keeping people or animals apart to stop disease | The dog was kept in *quarantine*. | Собаку держали на карантине.
- respiration | n | ˌrespɪˈreɪʃən | ˌrespəˈreɪʃən | дыхание | breathing | Fish use their gills for *respiration*. | Рыбы дышат жабрами.
- rib | n | rɪb |  | ребро | one of the bones around your chest | He broke two *ribs*. | Он сломал два ребра.
- sanitation | n | ˌsænɪˈteɪʃən | ˌsænəˈteɪʃən | санитария | systems for clean water and waste | Poor *sanitation* spreads disease. | Плохая санитария распространяет болезни.
- stimulant | n | ˈstɪmjʊlənt | ˈstɪmjələnt | стимулятор | a drug that makes you more active | Coffee is a *stimulant*. | Кофе — стимулятор.
- thirst | n | θɜːst | θɜːrst | жажда | needing to drink | The runners were dying of *thirst*. | Бегуны умирали от жажды.
- vomit | v | ˈvɒmɪt | ˈvɑːmɪt | тошнить (рвать) | to bring food up from the stomach through the mouth | He felt so sick that he thought he would *vomit*. | Его так тошнило, что он думал, его вырвет.
