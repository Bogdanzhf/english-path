title: Environment and energy
title_ru: Экология и энергия
topic: environment
words:
- biodegradable | adj | ˌbaɪəʊdɪˈɡreɪdəbl | ˌbaɪoʊdɪˈɡreɪdəbl | биоразлагаемый | able to be broken down naturally by bacteria | These bags are fully *biodegradable*. | Эти пакеты полностью биоразлагаемы.
- carbon dioxide | n | ˌkɑːbən daɪˈɒksaɪd | ˌkɑːrbən daɪˈɑːksaɪd | углекислый газ | the gas produced when people breathe out or when fuel is burned (CO₂) | Trees absorb *carbon dioxide* from the air. | Деревья поглощают углекислый газ из воздуха.
- drought | n | draʊt |  | засуха | a long period without rain | The *drought* lasted for years. | Засуха длилась годами. | gh не читается
- generate | v | ˈdʒenəreɪt |  | порождать, производить | to produce or create something | The new menu *generated* a lot of interest. | Новое меню вызвало большой интерес.
- habitat | n | ˈhæbɪtæt |  | среда обитания | the natural home of an animal or plant | Pollution is destroying the bird's *habitat*. | Загрязнение уничтожает среду обитания птицы.
- organic | adj | ɔːˈɡænɪk | ɔːrˈɡænɪk | органический | produced without chemicals; coming from living things | We buy *organic* vegetables. | Мы покупаем органические овощи.
- shortage | n | ˈʃɔːtɪdʒ | ˈʃɔːrtɪdʒ | нехватка, дефицит | a lack of something you need | There is a *shortage* of clean water. | Не хватает чистой воды.
