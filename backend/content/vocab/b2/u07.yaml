reading:
  title: "When the Last Speaker Dies"
  title_ru: "Когда умирает последний носитель"
  text: |
    There are about 7,000 languages in the world today, but this amazing diversity is in danger. Linguists believe that around forty percent of them are endangered, and that one language ceases to exist roughly every few months. In many cases, the last speakers are elderly people. When they die, the language — and with it, centuries of songs, stories and knowledge — is lost forever.

    Why do languages die? There are several reasons. Sometimes the cause is devastating and sudden: war, genocide or natural disasters such as earthquakes can wipe out small communities. More often, the process is slow. When people move from villages to urban areas to find work, they need to speak the dominant language. Children assimilate quickly. They generally prefer the language of school, television and the internet, and they stop using their parents' native language. Within two or three generations, the language may disappear.

    Indigenous communities have been especially hard hit. In the past, children in some countries were punished for speaking their own language at school. As a result, many grew up feeling ashamed of it.

    However, there have been successful attempts to save endangered languages. One famous case is Hebrew, which was used mainly in religious texts for nearly two thousand years before becoming the everyday language of millions. In Wales, Welsh is now taught in schools, and the number of speakers is growing. In New Zealand, "language nests" allow small children to spend their days with Māori-speaking elders.

    Technology can help too. Linguists record the last speakers and create dictionaries and reference materials. Apps allow young people to learn their ancestors' language on their phones. Saving a language is not easy, but as one Māori elder said: "Our language is the key to who we are."
  ru: |
    Сегодня в мире около 7000 языков, но это удивительное разнообразие под угрозой. Лингвисты считают, что примерно сорок процентов из них находятся под угрозой исчезновения и что примерно каждые несколько месяцев перестаёт существовать один язык. Во многих случаях последние носители — пожилые люди. Когда они умирают, язык — а вместе с ним века песен, историй и знаний — исчезает навсегда.

    Почему языки умирают? Причин несколько. Иногда причина внезапна и разрушительна: войны, геноцид или стихийные бедствия вроде землетрясений могут уничтожить небольшие общины. Но чаще процесс идёт медленно. Когда люди переезжают из деревень в города в поисках работы, им нужно говорить на доминирующем языке. Дети ассимилируются быстро. Как правило, они предпочитают язык школы, телевидения и интернета и перестают пользоваться родным языком родителей. За два-три поколения язык может исчезнуть.

    Особенно сильно пострадали коренные народы. В прошлом в некоторых странах детей наказывали за то, что они говорили в школе на своём языке. В результате многие выросли со стыдом за него.

    Однако были и успешные попытки спасти исчезающие языки. Известный пример — иврит: почти две тысячи лет его использовали в основном в религиозных текстах, а потом он стал повседневным языком миллионов людей. В Уэльсе валлийский теперь преподают в школах, и число говорящих на нём растёт. В Новой Зеландии «языковые гнёзда» позволяют маленьким детям проводить дни со старейшинами, говорящими на языке маори.

    Помогают и технологии. Лингвисты записывают последних носителей, составляют словари и справочные материалы. Приложения позволяют молодёжи учить язык предков на телефоне. Спасти язык непросто, но, как сказал один старейшина маори: «Наш язык — ключ к тому, кто мы есть».
  questions:
    - q: "About how many languages are endangered?"
      options: ["Four percent", "Forty percent", "All of them", "Seven thousand"]
      answer: 1
    - q: "What usually happens when families move to cities?"
      options: ["Children learn the native language better", "Children start using the dominant language instead", "They create new languages", "Nothing changes"]
      answer: 1
    - q: "Which language is given as a famous successful case?"
      options: ["Latin", "Hebrew", "English", "Spanish"]
      answer: 1
    - tf: "Languages always die suddenly."
      answer: false
    - tf: "Technology can help save endangered languages."
      answer: true
