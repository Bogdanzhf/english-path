title: Communication and language
title_ru: Общение и язык
topic: communication
words:
- apology | n | əˈpɒlədʒi | əˈpɑːlədʒi | извинение | words that say you are sorry | Please accept my *apology*. | Пожалуйста, примите мои извинения. | apologize — извиняться
- assumption | n | əˈsʌmpʃən |  | предположение | something you think is true without proof | That's a big *assumption*. | Это смелое предположение.
- catalogue | n | ˈkætəlɒɡ | ˈkætəlɔːɡ | каталог | a list of items for sale | Look at the *catalogue*. | Посмотри каталог. | амер. catalog
- conspiracy | n | kənˈspɪrəsi |  | заговор | a secret plan by a group to do something harmful | He believes the moon landing was a *conspiracy*. | Он считает, что высадка на Луну была заговором. | conspiracy theory — теория заговора
- criticism | n | ˈkrɪtɪsɪzəm |  | критика | saying what is bad about someone or something | He doesn't take *criticism* well. | Он плохо воспринимает критику.
- declaration | n | ˌdekləˈreɪʃən |  | декларация, заявление | an official statement | The *Declaration* of Independence was signed in 1776. | Декларация независимости была подписана в 1776 году.
- forecast | n | ˈfɔːkɑːst | ˈfɔːrkæst | прогноз | a statement about what will happen, especially the weather | The weather *forecast* says it will snow. | По прогнозу погоды будет снег.
- guidance | n | ˈɡaɪdns |  | руководство, советы | help and advice | Students receive *guidance* on choosing a career. | Студенты получают консультации по выбору профессии.
- hospitality | n | ˌhɒspɪˈtæləti | ˌhɑːspɪˈtæləti | гостеприимство | friendly treatment of guests | Thank you for your *hospitality*. | Спасибо за гостеприимство.
- illustration | n | ˌɪləˈstreɪʃən |  | иллюстрация | a picture in a book; an example | The book has beautiful *illustrations*. | В книге прекрасные иллюстрации.
- indication | n | ˌɪndɪˈkeɪʃən | ˌɪndəˈkeɪʃən | признак, указание | a sign | There's no *indication* of rain. | Ничто не предвещает дождя.
- info | n | ˈɪnfəʊ | ˈɪnfoʊ | инфо, информация (разг.) | information | Call for more *info*. | Звоните за подробностями.
- nonsense | n | ˈnɒnsns | ˈnɑːnsens | ерунда, вздор | ideas or words that are stupid or untrue | That's complete *nonsense*! | Это полная чушь!
- offering | n | ˈɒfərɪŋ | ˈɔːfərɪŋ | предложение; подношение | something offered | The restaurant's new *offering* is a vegan menu. | Новинка ресторана — веганское меню.
- overview | n | ˈəʊvəvjuː | ˈoʊvərvjuː | обзор | a short general description | The guide gave us an *overview* of the site. | Гид кратко рассказал нам о месте.
- preview | n | ˈpriːvjuː |  | предварительный просмотр | an opportunity to see something before it is shown to the public | Critics saw a *preview* of the film. | Критики посмотрели фильм на закрытом показе.
- proposal | n | prəˈpəʊzl | prəˈpoʊzl | предложение | a plan or suggestion | They accepted our *proposal*. | Они приняли наше предложение. | marriage proposal — предложение руки и сердца
- reporting | n | rɪˈpɔːtɪŋ | riːˈpɔːrtɪŋ | репортаж, освещение | writing news | The newspaper is known for honest *reporting*. | Газета известна честной журналистикой.
- resolution | n | ˌrezəˈluːʃn |  | решение; решимость; разрешение (экрана) | a decision to do something; a formal decision | My New Year's *resolution* is to read more. | Моё новогоднее обещание себе — больше читать.
- scenario | n | səˈnɑːriəʊ | sɪˈneriːoʊ | сценарий | a possible situation | In the worst *scenario*, we lose everything. | В худшем случае мы потеряем всё.
- sigh | v | saɪ |  | вздыхать | to breathe out loudly to show you're tired, sad or relieved | She *sighed* and closed the book. | Она вздохнула и закрыла книгу. | gh не читается
- speculation | n | ˌspekjʊˈleɪʃən | ˌspekjəˈleɪʃən | домыслы, предположения | guessing without facts | There's a lot of *speculation* about his future. | Много домыслов о его будущем.
