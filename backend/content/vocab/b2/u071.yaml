title: Character and personality
title_ru: Характер и личность
topic: feelings
words:
- aggressive | adj | əˈɡresɪv |  | агрессивный; напористый | angry and likely to attack; very determined | The crowd became *aggressive*. | Толпа становилась агрессивной.
- bold | adj | bəʊld | boʊld | смелый, дерзкий | brave and confident; not afraid of risks | It was a *bold* decision to start his own company. | Открыть свою компанию было смелым решением.
- capable | adj | ˈkeɪpəbl |  | способный | able to do something | She is *capable* of running a marathon. | Она способна пробежать марафон. | capable of + -ing
- casual | adj | ˈkæʒuəl |  | непринуждённый, повседневный | relaxed and informal | You can wear *casual* clothes on Fridays. | По пятницам можно ходить в повседневной одежде.
- conscious | adj | ˈkɒnʃəs | ˈkɑːnʃəs | сознательный; в сознании | aware of something; awake | I wasn't *conscious* of the time. | Я не замечал, как идёт время. | self-conscious — застенчивый
- curious | adj | ˈkjʊəriəs | ˈkjʊriəs | любопытный | wanting to know or learn about something | Children are naturally *curious*. | Дети от природы любопытны.
- dominant | adj | ˈdɒmɪnənt | ˈdɑːmɪnənt | доминирующий, господствующий | stronger or more important than others | Their team was *dominant* in the second half. | Во втором тайме их команда доминировала.
- efficient | adj | ɪˈfɪʃnt |  | эффективный, рациональный | working well without wasting time or energy | The new system is much more *efficient*. | Новая система гораздо эффективнее.
- firm | adj | fɜːm | fɜːrm | твёрдый, крепкий | solid; strong | The bed was too *firm* for me. | Кровать была для меня слишком жёсткой. | сущ. firm — фирма
- intent | n | ɪnˈtent |  | намерение | a plan or purpose | His *intent* was to help, not to hurt. | Он хотел помочь, а не навредить.
- loyal | adj | ˈlɔɪəl |  | верный, преданный | always supporting a person or group | Dogs are very *loyal* animals. | Собаки — очень преданные животные.
- neutral | adj | ˈnjuːtrəl | ˈnuːtrəl | нейтральный | not supporting either side | Switzerland stayed *neutral* during the war. | Швейцария сохраняла нейтралитет во время войны.
- realistic | adj | ˌrɪəˈlɪstɪk | ˌriːəˈlɪstɪk | реалистичный | showing things as they really are | The portrait was so *realistic* that it looked like a photo. | Портрет был настолько реалистичным, что походил на фотографию.
- rival | n | ˈraɪvl |  | соперник, конкурент | a person or group competing with another | The two companies are old *rivals*. | Эти две компании — давние конкуренты.
- sensitive | adj | ˈsensətɪv |  | чувствительный, ранимый | easily hurt or upset | My skin is very *sensitive* to the sun. | Моя кожа очень чувствительна к солнцу. | НЕ «сенситивный» в значении «разумный» (sensible)
