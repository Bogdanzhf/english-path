title: Character and personality
title_ru: Характер и личность
topic: feelings
words:
- adventurous | adj | ədˈventʃərəs | ædˈventʃərəs | смелый, любящий приключения | eager to try new things | She's very *adventurous*. | Она любит приключения.
- attentive | adj | əˈtentɪv |  | внимательный | paying close attention | The waiter was very *attentive*. | Официант был очень внимателен.
- authoritative | adj | ɔːˈθɒrətətɪv | əˈθɔːrəteɪtɪv | авторитетный, властный | reliable and respected; showing that you expect to be obeyed | This is the most *authoritative* book on the subject. | Это самая авторитетная книга по теме.
- benevolent | adj | bəˈnevələnt |  | доброжелательный, благосклонный | kind and helpful | He was a *benevolent* king. | Он был добрым королём.
- carefree | adj | ˈkeəfriː | ˈkerfriː | беззаботный | without worries | We had a *carefree* childhood. | У нас было беззаботное детство.
- cheeky | adj | ˈtʃiːki |  | дерзкий, нахальный (брит.) | rude in a funny way | Don't be *cheeky*! | Не дерзи!
- considerate | adj | kənˈsɪdərət |  | внимательный, заботливый | thinking about other people's feelings | Please be *considerate* and keep noise to a minimum. | Пожалуйста, будьте внимательны к другим и не шумите.
- dependable | adj | dɪˈpendəbl |  | надёжный | reliable | He's a *dependable* friend. | Он надёжный друг.
- impartial | adj | ɪmˈpɑːʃl | ˌɪmˈpɑːrʃl | беспристрастный | not supporting one side | A judge must be *impartial*. | Судья должен быть беспристрастным.
- impulsive | adj | ɪmˈpʌlsɪv | ˌɪmˈpʌlsɪv | импульсивный | acting without thinking | He's very *impulsive*. | Он очень импульсивный.
- inexperienced | adj | ˌɪnekˈspiərɪənst | ɪnɪkˈspɪriənst | неопытный | without experience | She's a young, *inexperienced* teacher. | Она молодая неопытная учительница.
- innate | adj | ɪˈneɪt |  | врождённый | present from birth | She had an *innate* talent for leadership. | У неё был врождённый талант лидера.
- inventive | adj | ɪnˈventɪv |  | изобретательный | good at thinking of new ideas | The show was full of *inventive* ideas. | Шоу было полно изобретательных идей.
- irrational | adj | ɪˈræʃənl | ˌɪˈræʃənl | иррациональный, неразумный | not based on reason | She has an *irrational* fear of spiders. | У неё необъяснимый страх перед пауками.
- obedient | adj | əʊˈbiːdiənt | oʊˈbiːdiənt | послушный | doing what you are told | The dog is very *obedient*. | Собака очень послушная.
- picky | adj | ˈpɪki |  | разборчивый, привередливый | hard to please, especially with food | My son is a *picky* eater. | Мой сын очень привередлив в еде.
- rebellious | adj | rɪˈbelɪəs | rəˈbeljəs | бунтарский, непокорный | refusing to obey | He was a *rebellious* teenager. | Он был бунтарём-подростком.
- skillful | adj | ˈskɪlfl |  | умелый, искусный | very good at something | She's a *skillful* potter. | Она искусная гончарша. | брит. skilful
- tame | adj | teɪm |  | ручной, приручённый | not wild; not afraid of people | The birds were so *tame* that they ate from my hand. | Птицы были такими ручными, что ели у меня с руки.
- truthful | adj | ˈtruːθfl |  | правдивый | telling the truth | Please be *truthful* with me. | Пожалуйста, будь со мной честен.
