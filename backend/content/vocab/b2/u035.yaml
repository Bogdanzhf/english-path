title: Phrasal verbs
title_ru: Фразовые глаголы
topic: phrasal
words:
- hold back | phv |  |  | сдерживать(ся) | to stop yourself; to stop something moving forward | She *held back* her tears. | Она сдержала слёзы.
- let down | phv |  |  | подвести, разочаровать | to disappoint | Don't *let down* your team! | Не подводи команду!
- live up to | phv |  |  | оправдывать (ожидания) | to be as good as expected | The film didn't *live up to* my expectations. | Фильм не оправдал моих ожиданий.
- look down on | phv |  |  | смотреть свысока | to think you are better than someone | Don't *look down on* people. | Не смотри на людей свысока.
- look into | phv |  |  | изучать, расследовать | to investigate | The police are *looking into* the case. | Полиция расследует это дело.
- pass on | phv |  |  | передавать | to give to another person | Please *pass on* the message. | Пожалуйста, передайте сообщение.
- put something forward | phr |  |  | выдвигать, предлагать | to suggest | She *put forward* a new idea. | Она выдвинула новую идею.
- put up with | phv |  |  | терпеть, мириться | to accept something unpleasant | I can't *put up with* this noise. | Я не могу терпеть этот шум.
- rule out | phv |  |  | исключать | to say something is not possible | The police *ruled out* murder. | Полиция исключила убийство.
- run into | phv |  |  | случайно встретить; столкнуться | to meet by chance; to hit | I *ran into* an old friend. | Я случайно встретил старого друга.
- set off | phv |  |  | отправляться в путь | to start a journey | We *set off* at six. | Мы выехали в шесть.
- set out | phr |  |  | отправляться; намереваться | to start a journey; to begin with an aim | They *set out* to change the world. | Они задались целью изменить мир.
- show off | phv |  |  | хвастаться, красоваться | to try to impress people | Stop *showing off*! | Хватит выпендриваться!
- sort somebody/something/yourself out | phr |  |  | разобраться, уладить | to solve a problem; to organise | I'll *sort out* the problem tomorrow. | Я улажу проблему завтра.
- stand out | phv |  |  | выделяться | to be easy to see; to be better | Her red coat *stood out* in the crowd. | Её красное пальто выделялось в толпе.
- sum up | phr |  |  | подводить итог | to give a summary | To *sum up*, it was a great year. | Подводя итог, это был отличный год.
- take over | phr |  |  | брать на себя; захватывать | to take control of | A big company *took over* the firm. | Крупная компания поглотила фирму.
