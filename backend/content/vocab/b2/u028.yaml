title: Places and the city
title_ru: Город и места
topic: city
words:
- amenities | n | əˈmenɪtiz | əˈmenətiːz | удобства, инфраструктура | useful facilities like shops and parks | The area has good *amenities*. | В районе хорошая инфраструктура.
- arch | n | ɑːtʃ | ɑːrtʃ | арка | a curved structure over an opening | They walked through a stone *arch*. | Они прошли через каменную арку.
- barn | n | bɑːn | bɑːrn | амбар, сарай | a large farm building for animals or crops | The family hid in a *barn* full of hay. | Семья пряталась в амбаре, полном сена.
- cathedral | n | kəˈθiːdrəl |  | собор | a large, important church | The *cathedral* took a century to build. | Собор строили целый век.
- chapel | n | ˈtʃæpl |  | часовня | a small church or a room for prayer | They got married in a small *chapel*. | Они поженились в маленькой часовне.
- checkpoint | n | ˈtʃekpɔɪnt |  | контрольно-пропускной пункт | a place where people are checked | We stopped at a border *checkpoint*. | Мы остановились на пограничном КПП.
- facilities | n | fəˈsɪlɪtiz | fəˈsɪlətiːz | условия, оборудование, объекты | buildings or equipment for a purpose | The school has excellent sports *facilities*. | В школе отличные спортивные сооружения.
- facility | n | fəˈsɪləti |  | объект, помещение; удобства | a building or equipment for a particular purpose | The sanctuary has a new veterinary *facility*. | В заповеднике новая ветеринарная клиника.
- housing | n | ˈhaʊzɪŋ |  | жильё | houses and flats | There's a shortage of cheap *housing*. | Не хватает дешёвого жилья.
- infrastructure | n | ˈɪnfrəstrʌktʃə | ˈɪnfrəstrʌktʃər | инфраструктура | the basic systems a country needs, like roads and power | The government is investing in *infrastructure*. | Правительство вкладывает средства в инфраструктуру.
- inhabitant | n | ɪnˈhæbɪtənt |  | житель, обитатель | a person or animal that lives in a place | The island has only two hundred *inhabitants*. | На острове всего двести жителей.
- islander | n | ˈaɪləndə | ˈaɪləndər | островитянин | a person who lives on an island | The *islanders* are very friendly. | Жители острова очень дружелюбны.
- mansion | n | ˈmænʃn |  | особняк | a very large, impressive house | They live in a huge *mansion*. | Они живут в огромном особняке.
- noise pollution | n | nɔɪz pəˈluːʃən |  | шумовое загрязнение | harmful levels of noise | Traffic causes a lot of *noise pollution*. | Транспорт создаёт сильное шумовое загрязнение.
- overpopulation | n | ˌəʊvəˌpɒpjuˈleɪʃn | ˌoʊvərˌpɑːpjuˈleɪʃn | перенаселение | too many people living in an area | *Overpopulation* puts pressure on water supplies. | Перенаселение создаёт нагрузку на водоснабжение.
- pavement | n | ˈpeɪvmənt |  | тротуар (брит.) | the path at the side of a road | Walk on the *pavement*. | Иди по тротуару. | амер. sidewalk
- pier | n | pɪə | pɪr | пирс, причал | a structure built out into the sea | Fishermen sat at the end of the *pier*. | Рыбаки сидели в конце пирса.
- resort | n | rɪˈzɔːt | rɪˈzɔːrt | курорт | a place where many people go on holiday | We stayed at a ski *resort* in the Alps. | Мы жили на горнолыжном курорте в Альпах.
- rural | adj | ˈrʊərəl | ˈrʊrəl | сельский | connected with the countryside | The birds feed in *rural* wetlands. | Птицы кормятся на сельских болотах.
- settlement | n | ˈsetəlmənt |  | поселение; урегулирование | a place where people live; an agreement | It's an ancient Roman *settlement*. | Это древнеримское поселение.
- shed | n | ʃed |  | сарай | a small wooden building for storing things | The tools are in the garden *shed*. | Инструменты в садовом сарае.
- suburb | n | ˈsʌbɜːb | ˈsʌbɜːrb | пригород | an area where people live outside the centre of a city | They moved to a quiet *suburb*. | Они переехали в тихий пригород.
- urban | adj | ˈɜːbən | ˈɜːrbən | городской | connected with a town or city | More than half the world's population lives in *urban* areas. | Более половины населения мира живёт в городах.
- venue | n | ˈvenjuː |  | место проведения | a place where an event happens | The *venue* for the concert has changed. | Место проведения концерта изменилось.
