title: Character and personality
title_ru: Характер и личность
topic: feelings
words:
- adaptable | adj | əˈdæptəbl |  | легко приспосабливающийся | able to change easily | Children are very *adaptable*. | Дети легко приспосабливаются.
- anger | n | ˈæŋɡə | ˈæŋɡər | гнев, злость | a strong feeling of being angry | He couldn't hide his *anger*. | Он не мог скрыть злость.
- communicative | adj | kəˈmjuːnɪkətɪv | kəmˈjuːnəkətɪv | общительный; коммуникативный | willing to talk | She's friendly and *communicative*. | Она дружелюбная и общительная.
- desire | n | dɪˈzaɪə | dɪˈzaɪər | желание | a strong wish | He had a strong *desire* to travel. | У него было сильное желание путешествовать.
- frugal | adj | ˈfruːɡl |  | бережливый, экономный | careful with money | My grandparents lived a *frugal* life. | Мои бабушка с дедушкой жили скромно.
- hospitable | adj | hɒˈspɪtəbl | hɑːˈspɪtəbl | гостеприимный | friendly and welcoming to guests | The monks were very *hospitable*. | Монахи были очень гостеприимны.
- impolite | adj | ˌɪmpəˈlaɪt |  | невежливый | not polite; rude | It's *impolite* to talk with your mouth full. | Невежливо говорить с набитым ртом.
- indulgent | adj | ɪnˈdʌldʒənt | ˌɪnˈdʌldʒənt | снисходительный, балующий | allowing too much | They're very *indulgent* parents. | Они очень снисходительные родители.
- preference | n | ˈprefrəns | ˈprefərəns | предпочтение | liking one thing more than another | Do you have a *preference*? | Тебе что больше нравится?
- punctual | adj | ˈpʌŋktʃuəl |  | пунктуальный | arriving at the right time | He was always *punctual*. | Он всегда был пунктуален.
- rage | n | reɪdʒ |  | ярость, гнев | very strong anger | He was shaking with *rage*. | Он дрожал от ярости. | road rage — агрессия на дороге
- relief | n | rɪˈliːf |  | облегчение | a happy feeling when something bad stops | It was a *relief* to hear that she was safe. | Было облегчением узнать, что она в безопасности.
- satisfaction | n | ˌsætɪsˈfækʃn |  | удовлетворение | a pleasant feeling when you get what you wanted | He looked at his work with *satisfaction*. | Он с удовлетворением посмотрел на свою работу.
- self-worth | n | ˌself ˈwɜːθ | ˌself ˈwɜːrθ | самоуважение, чувство собственной ценности | the feeling that you are valuable | Praise helps a child's *self-worth*. | Похвала укрепляет самооценку ребёнка.
- shame | n | ʃeɪm |  | стыд; жаль | a bad feeling after doing something wrong | He felt deep *shame* about his lie. | Ему было очень стыдно за свою ложь. | What a shame! — Как жаль!
- sociable | adj | ˈsəʊʃəbl | ˈsoʊʃəbl | общительный | friendly and enjoying the company of others | My sister is very *sociable* — she has hundreds of friends. | Моя сестра очень общительная — у неё сотни друзей.
- stingy | adj | ˈstɪndʒi |  | скупой, жадный | not generous | Don't be so *stingy*! | Не будь таким скупердяем!
- terror | n | ˈterə | ˈterər | ужас | very great fear | She looked at the snake in *terror*. | Она смотрела на змею в ужасе.
- thoughtless | adj | ˈθɔːtləs |  | бездумный, невнимательный к другим | not thinking about others | It was *thoughtless* of me. | Это было необдуманно с моей стороны.
- trusty | adj | ˈtrʌsti |  | верный, надёжный | reliable for a long time | I took my *trusty* old bike. | Я взял свой верный старый велосипед.
