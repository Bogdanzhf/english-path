title: Nature and weather
title_ru: Природа и погода
topic: nature
words:
- bond | v | bɒnd | bɑːnd | сближаться, сдружиться | to develop a close relationship | The team *bonded* during the long trip. | Команда сплотилась во время долгой поездки. | сущ. bond — связь, узы
- botany | n | ˈbɒtəni | ˈbɑːtəni | ботаника | the scientific study of plants | She has a degree in *botany*. | У неё диплом по ботанике.
