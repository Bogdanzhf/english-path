- mist | n | mɪst |  | туман, дымка | a thin cloud of tiny water drops near the ground | The hills were covered in *mist*. | Холмы были окутаны туманом. | легче, чем fog
- moonlight | n | ˈmuːnlaɪt |  | лунный свет | light from the moon | We walked in the *moonlight*. | Мы гуляли при лунном свете.
- muddy | adj | ˈmʌdi |  | грязный, в грязи | covered in mud | Take off your *muddy* boots. | Сними грязные ботинки.
- orchid | n | ˈɔːkɪd | ˈɔːrkɪd | орхидея | an exotic flower | She grows *orchids*. | Она выращивает орхидеи.
- overcast | adj | ˌəʊvəˈkɑːst | ˌoʊvərˈkæst | пасмурный | (of the sky) covered with clouds | The sky was grey and *overcast*. | Небо было серым и пасмурным.
- pebble | n | ˈpebl |  | галька | a small smooth stone | The beach is covered in *pebbles*. | Пляж покрыт галькой.
