title: Time and dates
title_ru: Время и даты
topic: time
words:
- afterlife | n | ˈɑːftəlaɪf | ˈæftərlaɪf | загробная жизнь | a life that some people believe begins after death | The Egyptians believed in an *afterlife*. | Египтяне верили в загробную жизнь.
- culmination | n | ˌkʌlmɪˈneɪʃən | ˌkʌlməˈneɪʃən | кульминация, вершина | the highest point | The prize was the *culmination* of years of work. | Премия стала вершиной многолетней работы.
- daytime | n | ˈdeɪtaɪm |  | дневное время | the time between morning and evening | The museum is only open in the *daytime*. | Музей открыт только днём.
- duration | n | djuˈreɪʃn | duˈreɪʃn | продолжительность | the length of time something lasts | The animals were frozen for the *duration* of the experiment. | Животные были заморожены на всё время эксперимента.
- dusk | n | dʌsk |  | сумерки | the time just before night when it becomes dark | The meetings always started at *dusk*. | Сеансы всегда начинались в сумерках. | dawn — рассвет
- era | n | ˈɪərə | ˈɪrə | эпоха, эра | a period of history | We are entering a new *era* of transport. | Мы вступаем в новую эру транспорта.
- everlasting | adj | ˌevəˈlɑːstɪŋ | ˌevərˈlæstɪŋ | вечный | lasting for ever | It's a story of *everlasting* love. | Это история вечной любви.
- hourly | adj | ˈaʊəli | ˈaʊrli | ежечасный, почасовой | every hour; per hour | What's your *hourly* rate? | Какая у тебя почасовая ставка?
- infinity | n | ɪnˈfɪnɪti | ˌɪnˈfɪnɪti | бесконечность | space or time without end | The universe stretches to *infinity*. | Вселенная простирается в бесконечность.
- interval | n | ˈɪntəvl | ˈɪntərvl | интервал, промежуток; антракт | a period of time between two events | Charging stations are placed at regular *intervals*. | Зарядные станции расположены через равные промежутки.
- lifetime | n | ˈlaɪftaɪm |  | (вся) жизнь | the time someone is alive | It's the chance of a *lifetime*. | Такой шанс выпадает раз в жизни.
- millennium | n | mɪˈleniəm |  | тысячелетие | a period of a thousand years | The symbol has been used for over a *millennium*. | Этот символ используется более тысячи лет. | мн. millennia
- momentary | adj | ˈməʊməntəri | ˈmoʊmənteri | мгновенный, кратковременный | lasting a very short time | There was a *momentary* silence. | Наступила секундная тишина.
- phase | n | feɪz |  | фаза, этап | a stage in a process of change | The project is now in its final *phase*. | Проект сейчас на завершающем этапе.
- prehistoric | adj | ˌpriːhɪˈstɒrɪk | ˌpriːhɪˈstɔːrɪk | доисторический | from the time before history was written down | They found *prehistoric* tools in the cave. | В пещере нашли доисторические орудия.
- rhythmic | adj | ˈrɪðmɪk |  | ритмичный | having a regular rhythm | I heard the *rhythmic* sound of the waves. | Я слышал ритмичный шум волн.
- teens | n | tiːnz |  | подростковый возраст (13–19) | the ages from 13 to 19 | She's in her *teens*. | Она подросток.
- wartime | n | ˈwɔːtaɪm | ˈwɔːrtaɪm | военное время | the time when there is a war | Food was scarce in *wartime*. | В войну еды не хватало.
- 'wink | n | wɪŋk |  | подмигивание | closing one eye quickly as a signal | He gave me a *wink*. | Он мне подмигнул. | гл.: wink — подмигивать'
