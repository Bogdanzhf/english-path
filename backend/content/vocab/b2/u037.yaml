title: Work and jobs
title_ru: Работа и профессии
topic: work
words:
- agenda | n | əˈdʒendə |  | повестка дня; цели, планы | a list of things to discuss; a set of hidden aims | The first item on the *agenda* is the budget. | Первый пункт повестки дня — бюджет. | hidden agenda — скрытые мотивы
- assistance | n | əˈsɪstəns |  | помощь, содействие | help | Can I be of *assistance*? | Чем могу помочь?
- creator | n | kriːˈeɪtə | kriːˈeɪtər | создатель | a person who makes something | Who is the *creator* of this game? | Кто создатель этой игры?
- crew | n | kruː |  | экипаж, команда | a group of people who work together, e.g. on a ship | The *crew* of the plane were very friendly. | Экипаж самолёта был очень дружелюбным.
- dealer | n | ˈdiːlə | ˈdiːlər | торговец, дилер | a person who buys and sells | He's an art *dealer*. | Он арт-дилер.
- explorer | n | ɪkˈsplɔːrə | ɪksˈplɔːrər | исследователь, путешественник | a person who travels to unknown places | Columbus was a famous *explorer*. | Колумб был знаменитым мореплавателем.
- film-maker | n | ˈfɪlmeɪkə | ˈfɪlmeɪkər | кинорежиссёр | a person who makes films | She's a young *film-maker*. | Она молодой кинорежиссёр.
- inspector | n | ɪnˈspektə | ˌɪnˈspektər | инспектор; контролёр | a person who checks things | The ticket *inspector* checked our tickets. | Контролёр проверил наши билеты.
- keeper | n | ˈkiːpə | ˈkiːpər | смотритель; вратарь | a person who looks after something; a goalkeeper | The zoo *keeper* fed the lions. | Смотритель зоопарка покормил львов.
- landlord | n | ˈlændlɔːd | ˈlændlɔːrd | арендодатель, хозяин | a person who rents out a house or flat | Our *landlord* raised the rent again. | Наш хозяин квартиры снова поднял арендную плату. | landlady — хозяйка
- manufacturer | n | ˌmænjuːˈfæktʃərə | ˌmænjəˈfæktʃərər | производитель | a company that makes goods | Toyota is a car *manufacturer*. | Toyota — автопроизводитель.
- mayor | n | meə | ˈmeɪər | мэр | the head of a town or city | The *mayor* opened the new park. | Мэр открыл новый парк.
- merchant | n | ˈmɜːtʃənt | ˈmɜːrtʃənt | купец, торговец | a person who buys and sells goods | The *merchant* sold silk and spices. | Купец торговал шёлком и пряностями.
- messenger | n | ˈmesɪndʒə | ˈmesɪndʒər | посыльный, курьер | a person who carries messages | The king sent a *messenger* with the news. | Король отправил гонца с известием.
- narrator | n | nəˈreɪtə | ˈnereɪtər | рассказчик | a person who tells a story | The *narrator* of the novel is a child. | Рассказчик в романе — ребёнок.
- programming | n | ˈprəʊɡræmɪŋ | ˈproʊɡræmɪŋ | программирование | writing computer programs | He's learning *programming*. | Он изучает программирование.
- reward | n | rɪˈwɔːd | rɪˈwɔːrd | награда, вознаграждение | something you get for doing something good | They offered a *reward* for finding the lost dog. | За найденную собаку обещали вознаграждение.
- seller | n | ˈselə | ˈselər | продавец | a person who sells | The book is a best-*seller*. | Книга — бестселлер.
- superintendent | n | ˌsuːpərɪnˈtendənt |  | управляющий, начальник | a person who manages a place or department | The school *superintendent* agreed to change start times. | Руководитель школьного округа согласился перенести начало уроков.
- therapist | n | ˈθerəpɪst | ˈθerəpəst | психотерапевт; терапевт | a person who treats problems | She sees a *therapist* every week. | Она каждую неделю ходит к психотерапевту.
- workplace | n | ˈwɜːkpleɪs | ˈwɜːrkpleɪs | рабочее место | the building or room where people work | Bullying in the *workplace* is a serious problem. | Травля на рабочем месте — серьёзная проблема.
