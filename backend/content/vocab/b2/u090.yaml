title: Communication and language
title_ru: Общение и язык
topic: communication
words:
- acknowledge | v | əkˈnɒlɪdʒ | əkˈnɑːlɪdʒ | признавать | to accept that something is true | He *acknowledged* that he had made a mistake. | Он признал, что совершил ошибку.
- address | v | ˈædres |  | обращаться (к); решать (проблему) | to speak to; to deal with | We must *address* this problem. | Мы должны заняться этой проблемой.
- bless | v | bles |  | благословлять | to ask God to protect someone | The priest *blessed* the young couple. | Священник благословил молодую пару. | Bless you! — Будь здоров! (при чихании)
- brag | v | bræɡ |  | хвастаться | to talk too proudly about what you have or have done | He's always *bragging* about his car. | Он вечно хвастается своей машиной. | = boast
- brochure | n | ˈbrəʊʃə | broʊˈʃʊr | брошюра, проспект | a small magazine with information | I picked up a travel *brochure*. | Я взял туристический буклет.
- challenge | v | ˈtʃælɪndʒ | ˈtʃæləndʒ | бросать вызов; оспаривать | to question; to test someone's ability | She *challenged* me to a game. | Она вызвала меня сыграть.
- 'counter | n | ˈkaʊntə | ˈkaʊntər | прилавок, стойка | a long table in a shop | Pay at the *counter*. | Оплатите у стойки. | гл.: counter — противодействовать'
- criterion | n | kraɪˈtiərɪən | kraɪˈtɪriən | критерий | a standard for judging | What *criteria* do you use? | Какими критериями вы пользуетесь? | мн. ч. criteria
- defend | v | dɪˈfend |  | защищать | to protect | He *defended* his friend. | Он заступился за друга.
- deny | v | dɪˈnaɪ |  | отрицать | to say something is not true | He *denied* stealing the money. | Он отрицал, что украл деньги.
- enquiry | n | ɪnˈkwaɪəri | ɪnˈkwaɪriː | запрос, вопрос (брит.) | a question asking for information | Thank you for your *enquiry*. | Благодарим за ваш запрос.
- ensure | v | ɪnˈʃʊə | ɪnˈʃʊr | обеспечивать, гарантировать | to make certain that something happens | Please *ensure* that all doors are locked. | Пожалуйста, убедитесь, что все двери заперты.
- forgive | v | fəˈɡɪv | fərˈɡɪv | прощать | to stop being angry with someone who has done wrong | I'll never *forgive* him for what he did. | Я никогда не прощу его за то, что он сделал. | forgive — forgave — forgiven
- guarantee | v | ˌɡærənˈtiː |  | гарантировать | to promise that something will happen | I can't *guarantee* that he will come. | Не могу гарантировать, что он придёт.
- 'object | v | əbˈdʒekt |  | возражать | to disagree | I *object* to this plan. | Я возражаю против этого плана. | ударение: obˈject (гл.), ˈobject (сущ.)'
- 'permit | v | pəˈmɪt | pərˈmɪt | разрешать | to allow | Smoking is not *permitted*. | Курить не разрешается. | сущ.: permit [ˈpɜːmɪt] — разрешение'
- persuasion | n | pəˈsweɪʒən | pərˈsweɪʒən | убеждение, уговоры | persuading someone | After some *persuasion*, he agreed. | После уговоров он согласился.
- praise | v | preɪz |  | хвалить | to say that someone or something is very good | The teacher *praised* her for her hard work. | Учитель похвалил её за усердие.
- proceed | v | prəˈsiːd | proʊˈsiːd | продолжать; проходить (дальше) | to continue; to go to a place | Passengers should *proceed* to gate 12. | Пассажиров просят пройти к выходу 12.
- submit | v | səbˈmɪt |  | подавать, представлять | to give a document officially | *Submit* your application by Friday. | Подайте заявку до пятницы.
- swear | v | sweə | swer | клясться; ругаться | to promise seriously; to use bad words | I *swear* I didn't take your money. | Клянусь, я не брал твоих денег. | swear — swore — sworn
