- unforeseen | adj | ʌnfɔːˈsiːn | ˌʌnfɔːrˈsiːn | непредвиденный | not expected | Due to *unforeseen* circumstances, the show is cancelled. | По непредвиденным обстоятельствам шоу отменено.
- unmistakable | adj | ʌnmɪˈsteɪkəbl | ˌʌnmɪˈsteɪkəbl | безошибочно узнаваемый | impossible to confuse | Her voice is *unmistakable*. | Её голос ни с чем не спутаешь.
