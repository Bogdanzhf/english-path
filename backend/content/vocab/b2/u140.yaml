- figurative | adj | ˈfɪɡjʊreɪtɪv | ˈfɪɡjərətɪv | переносный (о значении) | not literal | The word is used in a *figurative* sense. | Слово употреблено в переносном смысле.
- inaccurate | adj | ɪˈnækjʊrət | ˌɪˈnækjərət | неточный | not correct | The information was *inaccurate*. | Информация оказалась неточной.
- "large-scale | adj | l\x01ːdʒskeɪl | ˈlɑːrdʒskeɪl | масштабный, крупный | big | It's a *large-scale* project. | Это масштабный проект."
- minimum | adj | ˈmɪnɪməm |  | минимальный | the smallest possible or allowed | What is the *minimum* age to drive? | Какой минимальный возраст для вождения?
- minute | adj | maɪˈnjuːt | maɪˈnuːt | крошечный; подробнейший | extremely small | The writing was *minute*. | Почерк был крошечным. | произн. maɪˈnjuːt, не путать с ˈmɪnɪt (минута)
- multiple | adj | ˈmʌltɪpl |  | многочисленный, множественный | many; more than one | He wrote *multiple* versions of the opera. | Он написал несколько версий оперы.
- numerous | adj | ˈnjuːmərəs | ˈnuːmərəs | многочисленный | many | The film won *numerous* awards. | Фильм получил многочисленные награды.
- peculiar | adj | pɪˈkjuːliə | pəkˈjuːljər | странный; особый | strange; belonging to one | What a *peculiar* smell! | Какой странный запах!
- predictable | adj | prɪˈdɪktəbl | priːˈdɪktəbl | предсказуемый | able to be predicted | The ending was *predictable*. | Концовка была предсказуемой.
- predictive | adj | prɪˈdɪktɪv | priːˈdɪktɪv | прогнозирующий, предиктивный | able to predict | My phone has *predictive* text. | В телефоне есть подсказки при наборе.
- supreme | adj | suːˈpriːm |  | высший, верховный | highest in rank or level | The *Supreme* Court made the final decision. | Окончательное решение принял Верховный суд.
