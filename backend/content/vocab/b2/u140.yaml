title: 'Describing: same, different, true'
title_ru: 'Описание: сходство, точность, вероятность'
topic: describing
words:
- approximate | adj | əˈprɒksɪmət | əˈprɑːksɪmət | приблизительный | almost exact, but not completely | The *approximate* cost is five hundred dollars. | Приблизительная стоимость — пятьсот долларов. | approximately — примерно
- coherent | adj | kəʊˈhɪərənt | koʊˈhɪrənt | последовательный, связный | clear, logical and well organized | We need a *coherent* plan. | Нам нужен последовательный план.
- conceivable | adj | kənˈsiːvəbl |  | мыслимый, возможный | possible to imagine | It's *conceivable* that he's right. | Вполне возможно, что он прав.
