title: 'Describing: same, different, true'
title_ru: 'Описание: сходство, точность, вероятность'
topic: describing
words:
- accurate | adj | ˈækjərət |  | точный | correct and exact | The measurements were extremely *accurate*. | Измерения были чрезвычайно точными.
- actual | adj | ˈæktʃuəl |  | действительный, фактический | real; true | The *actual* price was higher than on the website. | Реальная цена оказалась выше, чем на сайте. | actually — на самом деле (а не «актуально»!)
- gradual | adj | ˈɡrædʒuəl |  | постепенный | happening slowly over a long time | There has been a *gradual* improvement in his health. | Его здоровье постепенно улучшалось. | gradually — постепенно
- random | adj | ˈrændəm |  | случайный | happening without a pattern | Death seemed completely *random*. | Смерть казалась совершенно случайной.
- relevant | adj | ˈreləvənt |  | актуальный, относящийся к делу | connected with what is being discussed | Her advice is still *relevant* today. | Её совет актуален и сегодня.
- unique | adj | juˈniːk |  | уникальный | the only one of its kind | Every person's fingerprints are *unique*. | Отпечатки пальцев каждого человека уникальны.
