title: Thinking and opinions
title_ru: Мысли и мнения
topic: mind
words:
- ethics | n | ˈeθɪks |  | этика | moral principles that control behaviour | Medical *ethics* do not allow doctors to harm patients. | Медицинская этика не позволяет врачам вредить пациентам.
- foundation | n | faʊnˈdeɪʃn |  | фонд; фундамент, основа | an organisation that gives money; the base of a building | The *foundation* helps poor families. | Фонд помогает бедным семьям.
- impulse | n | ˈɪmpʌls |  | импульс, порыв | a sudden wish to do something; a short signal | I bought the dress on *impulse*. | Я купила платье импульсивно. | nerve impulse — нервный импульс
- incentive | n | ɪnˈsentɪv |  | стимул | something that encourages you to do something | Tax cuts are an *incentive* for businesses to invest. | Снижение налогов — стимул для бизнеса инвестировать.
- index | n | ˈɪndeks |  | указатель; индекс | an alphabetical list at the back of a book | Look up the word in the *index*. | Найдите это слово в указателе.
- nuisance | n | ˈnjuːsns | ˈnuːsns | неприятность, помеха | something annoying | The noise from the street is a real *nuisance*. | Шум с улицы — настоящая неприятность.
- obstacle | n | ˈɒbstəkl | ˈɑːbstəkl | препятствие | something that blocks your way or makes progress difficult | Lack of money is the main *obstacle*. | Нехватка денег — главное препятствие.
- overlap | v | ˌəʊvəˈlæp | ˌoʊvərˈlæp | частично совпадать, пересекаться | to cover part of the same area or time | Their research interests *overlap*. | Их научные интересы частично пересекаются.
