title: 'Describing: same, different, true'
title_ru: 'Описание: сходство, точность, вероятность'
topic: describing
words:
- abstract | adj | ˈæbstrækt |  | абстрактный | based on ideas, not real objects | Love and freedom are *abstract* ideas. | Любовь и свобода — абстрактные понятия. | abstract art — абстрактное искусство
- alike | adv | əˈlaɪk |  | одинаково; как … так и | in the same way; both | The decision was welcomed by doctors and patients *alike*. | Решение приветствовали как врачи, так и пациенты.
- apparent | adj | əˈpærənt |  | очевидный; кажущийся | easy to see or understand | It soon became *apparent* that he was lost. | Вскоре стало очевидно, что он заблудился. | apparently — по-видимому
- characteristic | n | ˌkærəktəˈrɪstɪk |  | характерная черта, особенность | a typical quality of someone or something | Long ears are a *characteristic* of this dog. | Длинные уши — характерная черта этой собаки.
- compatible | adj | kəmˈpætəbl |  | совместимый | able to exist or work together | The new evidence is *compatible* with the theory. | Новые данные согласуются с теорией.
- contrary | adj | ˈkɒntrəri | ˈkɑːntreri | противоположный | completely different or opposite | *Contrary* to what I expected, the test was easy. | Вопреки моим ожиданиям, тест оказался лёгким. | on the contrary — напротив
- conventional | adj | kənˈvenʃənl |  | традиционный, обычный | usual; traditional | They had a *conventional* wedding. | У них была традиционная свадьба.
- distinct | adj | dɪˈstɪŋkt |  | отчётливый; отличный (от) | clearly different or easy to notice | There is a *distinct* smell of gas in here. | Здесь отчётливо пахнет газом.
- evident | adj | ˈevɪdənt |  | очевидный | easy to see or understand | It was *evident* that he was lying. | Было очевидно, что он лжёт.
- genuine | adj | ˈdʒenjuɪn |  | подлинный, искренний | real; not false | Is this quote *genuine*? | Эта цитата подлинная?
- identical | adj | aɪˈdentɪkl |  | идентичный, одинаковый | exactly the same | The two fossils are almost *identical*. | Эти две окаменелости почти идентичны. | identical twins — однояйцевые близнецы
- incorrect | adj | ˌɪnkəˈrekt |  | неправильный | wrong | The information was *incorrect*. | Информация была неверной.
- literal | adj | ˈlɪtərəl |  | буквальный | following the exact meaning of words | The *literal* translation makes no sense. | Дословный перевод не имеет смысла.
- objective | n | əbˈdʒektɪv |  | цель | something you plan to achieve | The main *objective* is to stop illegal logging. | Главная цель — остановить незаконную вырубку. | прил. objective — объективный
- parallel | n | ˈpærəlel |  | параллель, сходство | a similarity between two things | There are interesting *parallels* between then and now. | Между прошлым и настоящим есть интересные параллели.
- probable | adj | ˈprɒbəbl | ˈprɑːbəbl | вероятный | likely | The *probable* cause was a fault in the engine. | Вероятной причиной была неисправность двигателя.
- proven | adj | ˈpruːvən |  | проверенный, доказанный | shown to be true | It's a *proven* method. | Это проверенный метод.
- randomly | adv | ˈrændəmli |  | случайным образом | without a pattern | Names were chosen *randomly*. | Имена выбирались наугад.
- unexpected | adj | ˌʌnekˈspektɪd | ˌʌnɪkˈspektɪd | неожиданный | not expected | We had an *unexpected* visitor. | К нам пришёл неожиданный гость.
- vague | adj | veɪɡ |  | смутный, неясный | not clear or exact | He gave me only a *vague* answer. | Он дал мне лишь расплывчатый ответ.
