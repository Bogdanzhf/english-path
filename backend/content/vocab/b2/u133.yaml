title: Events and situations
title_ru: События и ситуации
topic: events
words:
- confusion | n | kənˈfjuːʒən |  | путаница, замешательство | not understanding | There was some *confusion* about the time. | Возникла путаница со временем.
- disability | n | ˌdɪsəˈbɪləti | ˌdɪsəˈbɪlɪti | инвалидность, ограниченные возможности | a condition that limits movement or learning | The building is accessible to people with *disabilities*. | Здание доступно для людей с инвалидностью.
- emphasis | n | ˈemfəsɪs |  | акцент, особое внимание | special importance given to something | The school puts great *emphasis* on sport. | Школа уделяет особое внимание спорту. | emphasize — подчёркивать
- 'glow | n | ɡləʊ | ɡloʊ | свечение, сияние | a soft light | We saw the *glow* of the fire. | Мы видели отблеск огня. | гл.: glow — светиться'
- isolation | n | ˌaɪsəˈleɪʃən |  | изоляция, одиночество | being alone | Old people often suffer from *isolation*. | Пожилые люди часто страдают от одиночества.
- madness | n | ˈmædnəs |  | безумие | crazy behaviour | It would be *madness* to go out in this storm. | Выходить в такую бурю — безумие.
- misery | n | ˈmɪzəri |  | страдание, несчастье | great suffering or unhappiness | The war caused terrible *misery*. | Война принесла страшные страдания.
- necessity | n | nəˈsesəti |  | необходимость | something you must have | A car is a *necessity* in the countryside. | В сельской местности машина — необходимость.
- nerves | n | nɜːvz | nɜːrvz | нервы, волнение | feeling nervous | I had a bad case of *nerves* before the exam. | Перед экзаменом я сильно нервничал.
- nightmare | n | ˈnaɪtmeə | ˈnaɪtmer | кошмар | a very bad dream; a very unpleasant experience | The journey was a *nightmare*. | Поездка была кошмаром.
- prestige | n | preˈstiːʒ |  | престиж | respect and admiration | Skilled weavers had great *prestige*. | Искусные ткачи пользовались большим уважением.
- prospect | n | ˈprɒspekt | ˈprɑːspekt | перспектива | the possibility that something will happen | The *prospect* of a holiday made her smile. | Перспектива отпуска заставила её улыбнуться. | prospects — перспективы (карьерные)
- prosperity | n | prəˈsperɪti | prɑːˈsperəti | процветание, благосостояние | being rich and successful | The country enjoyed years of *prosperity*. | Страна переживала годы процветания.
- separation | n | ˌsepəˈreɪʃən |  | разделение; разлука | being apart | The *separation* from her family was hard. | Разлука с семьёй далась ей тяжело.
- sphere | n | sfɪə | sfɪr | сфера, шар | a round 3D shape like a ball | The Earth is almost a perfect *sphere*. | Земля — почти идеальный шар.
- surroundings | n | səˈraʊndɪŋz |  | окружение, обстановка | the place around you | The hotel is in beautiful *surroundings*. | Отель расположен в живописном месте.
- tan | n | tæn |  | загар | brown skin from the sun | She came back with a great *tan*. | Она вернулась с отличным загаром.
- weakness | n | ˈwiːknəs |  | слабость | lack of strength; a weak point | Chocolate is my *weakness*. | Шоколад — моя слабость.
- wilderness | n | ˈwɪldənəs | ˈwɪldərnəs | дикая местность | a wild area with no people | They got lost in the *wilderness*. | Они заблудились в глуши.
- wreck | n | rek |  | обломки, крушение | a ship, car or plane that has been badly damaged | Divers explored the *wreck* of the ship. | Водолазы исследовали затонувший корабль. | shipwreck — кораблекрушение
