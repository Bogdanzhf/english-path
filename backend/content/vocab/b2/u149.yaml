title: 'Describing: amount and degree'
title_ru: 'Описание: количество и степень'
topic: describing
words:
- extensive | adj | ɪkˈstensɪv |  | обширный | large in amount or area | The house has *extensive* gardens. | При доме обширные сады.
- intense | adj | ɪnˈtens |  | сильный, интенсивный | very strong | The heat was *intense*. | Жара была невыносимой.
- maximum | adj | ˈmæksɪməm |  | максимальный | the largest possible | The *maximum* speed here is 50 km/h. | Максимальная скорость здесь — 50 км/ч.
- minimum | adj | ˈmɪnɪməm |  | минимальный | the smallest possible or allowed | What is the *minimum* age to drive? | Какой минимальный возраст для вождения?
- minor | adj | ˈmaɪnə | ˈmaɪnər | незначительный, небольшой | small and not very important | It was only a *minor* injury. | Это была лишь лёгкая травма. | сущ. minor — несовершеннолетний
- multiple | adj | ˈmʌltɪpl |  | многочисленный, множественный | many; more than one | He wrote *multiple* versions of the opera. | Он написал несколько версий оперы.
- numerous | adj | ˈnjuːmərəs | ˈnuːmərəs | многочисленный | many | The film won *numerous* awards. | Фильм получил многочисленные награды.
- severe | adj | sɪˈvɪə | sɪˈvɪr | суровый, тяжёлый | very bad or serious | There was a *severe* storm last night. | Прошлой ночью был сильный шторм.
- sufficient | adj | səˈfɪʃnt |  | достаточный | enough | Two hours should be *sufficient* for the test. | Двух часов на тест должно хватить.
- supreme | adj | suːˈpriːm |  | высший, верховный | highest in rank or level | The *Supreme* Court made the final decision. | Окончательное решение принял Верховный суд.
- ultimate | adj | ˈʌltɪmət |  | конечный, главный, высший | most important; final | The *ultimate* goal is a long and happy life. | Конечная цель — долгая и счастливая жизнь.
- vast | adj | vɑːst | væst | огромный, обширный | extremely large | A *vast* cloud of dust covered the Earth. | Огромное облако пыли окутало Землю.
