    - One dollar each
    - Nothing
    - Ten thousand dollars
    answer: 1
  - q: What happened in 1978?
    options:
    - Insulin was discovered
    - Bacteria were used to produce human insulin
    - Insulin prices fell
    - The first dog was treated
