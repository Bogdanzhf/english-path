title: Body and health
title_ru: Тело и здоровье
topic: body
words:
- artery | n | ˈɑːtəri | ˈɑːrtəri | артерия | a tube that carries blood from the heart | A blocked *artery* can cause a heart attack. | Закупорка артерии может вызвать инфаркт. | vein — вена
- breast | n | brest |  | грудь | either of the two soft parts on a woman's chest; the chest | The doctor checked her *breast* for lumps. | Врач проверил её грудь на уплотнения. | chicken breast — куриная грудка
- elbow | n | ˈelbəʊ | ˈelboʊ | локоть | the joint in the middle of your arm | Don't put your *elbows* on the table. | Не ставь локти на стол.
- fist | n | fɪst |  | кулак | a hand with the fingers closed tightly | He banged his *fist* on the table. | Он ударил кулаком по столу.
- liver | n | ˈlɪvə | ˈlɪvər | печень | a large organ that cleans the blood | Too much alcohol damages the *liver*. | Избыток алкоголя вредит печени.
- lung | n | lʌŋ |  | лёгкое | one of two organs in your chest for breathing | Smoking damages your *lungs*. | Курение вредит лёгким.
- skull | n | skʌl |  | череп | the bones of the head | The helmet protected his *skull*. | Шлем защитил его голову.
- thigh | n | θaɪ |  | бедро | the top part of the leg | The soldier had a sword at his *thigh*. | У воина на бедре висел меч.
- tissue | n | ˈtɪʃuː |  | бумажная салфетка; ткань (организма) | a soft paper handkerchief | Do you have a *tissue*? I need to blow my nose. | У тебя есть салфетка? Мне нужно высморкаться.
- transplant | n | ˈtrænsplɑːnt | ˈtrænsplænt | пересадка, трансплантация | an operation to put an organ from one person into another | She needs a kidney *transplant*. | Ей нужна пересадка почки.
- vein | n | veɪn |  | вена | a tube that carries blood to the heart | The nurse put a needle into a *vein* in his arm. | Медсестра ввела иглу в вену у него на руке.
- vessel | n | ˈvesl |  | судно; сосуд | a large ship or boat; a container for liquid | A cargo *vessel* entered the harbour. | В гавань вошло грузовое судно. | blood vessel — кровеносный сосуд
