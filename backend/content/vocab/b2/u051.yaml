title: Free time and sport
title_ru: Досуг и спорт
topic: leisure
words:
- parade | n | pəˈreɪd |  | парад, шествие | a public procession | A colourful *parade* marks the annual festival. | Красочное шествие открывает ежегодный фестиваль.
- referee | n | ˌrefəˈriː |  | судья (в спорте); рекомендатель | an official who controls a sports game; a person who gives a reference | The *referee* showed him a red card. | Судья показал ему красную карточку.
- sprint | v | sprɪnt |  | бежать на короткую дистанцию, мчаться | to run very fast for a short distance | He *sprinted* to catch the bus. | Он помчался, чтобы успеть на автобус.
- tournament | n | ˈtʊənəmənt | ˈtʊrnəmənt | турнир | a competition with many games | Electric cars now race in their own *tournament*. | Электромобили теперь участвуют в собственных соревнованиях.
