title: Free time and sport
title_ru: Досуг и спорт
topic: leisure
words:
- athletics | n | æθˈletɪks |  | лёгкая атлетика | running, jumping and throwing sports | She competes in *athletics*. | Она занимается лёгкой атлетикой.
- bait | n | beɪt |  | приманка, наживка | food used to attract animals or fish | They used a mouse as *bait* to catch the snake. | В качестве приманки для змеи использовали мышь.
- bet | v | bet |  | держать пари, спорить | to risk money on the result of something | I *bet* you ten dollars that he'll be late. | Спорим на десять долларов, что он опоздает. | I bet… — Уверен, что…
- dive | v | daɪv |  | нырять | to jump into water head first | The boy *dived* into the pool. | Мальчик нырнул в бассейн. | амер. dove/dived
- gaming | n | ˈɡeɪmɪŋ |  | видеоигры, гейминг | playing computer games | He spends hours *gaming*. | Он часами играет в видеоигры.
- hunting | n | ˈhʌntɪŋ |  | охота | chasing and killing animals | *Hunting* is banned here. | Охота здесь запрещена.
- judo | n | ˈdʒuːdəʊ | ˈdʒuːdoʊ | дзюдо | a Japanese fighting sport | He has a black belt in *judo*. | У него чёрный пояс по дзюдо.
- lottery | n | ˈlɒtəri | ˈlɑːtəri | лотерея | a game where you buy tickets to win money | He won the *lottery*. | Он выиграл в лотерею.
- marathon | n | ˈmærəθən | ˈmerəθɑːn | марафон | a race of about 42 km | She ran the London *Marathon*. | Она пробежала Лондонский марафон.
- martial art | n | ˈmɑːʃl ɑːt | ˈmɑːrʃl ɑːrt | боевое искусство | a fighting sport like karate | Karate is a *martial art*. | Карате — боевое искусство.
- outdoor activities | n | aʊtˈdɔː ækˈtɪvɪtiz | ˈaʊtdɔːr ækˈtɪvətiːz | активный отдых на природе | sports and hobbies done outside | The camp offers many *outdoor activities*. | В лагере много активностей на природе.
- puzzle | n | ˈpʌzl |  | головоломка, загадка | a game or problem that you have to think hard to solve | My grandfather does a crossword *puzzle* every morning. | Дедушка каждое утро разгадывает кроссворд.
- spare time | n | speə taɪm | sper taɪm | свободное время | time when you are not working | What do you do in your *spare time*? | Чем ты занимаешься в свободное время?
- spectator | n | spekˈteɪtə | ˈspekteɪtər | зритель | a person who watches an event | *Spectators* gathered to watch the feeding. | Зрители собрались посмотреть на кормление.
- sponsorship | n | ˈspɒnsəʃɪp | ˈspɑːnsərʃɪp | спонсорство | financial support | The event gets *sponsorship* from local businesses. | Мероприятие спонсируют местные компании.
- target | v | ˈtɑːɡɪt | ˈtɑːrɡɪt | нацеливать(ся), ориентироваться на | to aim at | The advert *targets* young people. | Реклама нацелена на молодёжь.
- victory | n | ˈvɪktəri |  | победа | success in a war or competition | The team celebrated their *victory*. | Команда праздновала победу.
- wrestle | v | ˈresl |  | бороться (в борьбе) | to fight by holding and pushing someone | The boys *wrestled* on the grass. | Мальчишки боролись на траве. | t не читается; wrestling — борьба (спорт)
