title: 'Describing: same, different, true'
title_ru: 'Описание: сходство, точность, вероятность'
topic: describing
words:
- absolute | adj | ˈæbsəluːt |  | абсолютный, полный | complete | It was an *absolute* disaster. | Это была полная катастрофа.
- accurate | adj | ˈækjərət |  | точный | correct and exact | The measurements were extremely *accurate*. | Измерения были чрезвычайно точными.
- actual | adj | ˈæktʃuəl |  | действительный, фактический | real; true | The *actual* price was higher than on the website. | Реальная цена оказалась выше, чем на сайте. | actually — на самом деле (а не «актуально»!)
- associated | adj | əˈsəʊsɪeɪtɪd | əˈsoʊsiːeɪtɪd | связанный | connected | Smoking and *associated* health risks. | Курение и связанные с ним риски.
- concrete | adj | ˈkɒŋkriːt | ˈkɑːnkriːt | конкретный; бетонный | based on facts; made of concrete | We need *concrete* evidence. | Нам нужны конкретные доказательства. | сущ. concrete — бетон
- consistent | adj | kənˈsɪstənt |  | последовательный, постоянный | always behaving or happening in the same way | The winds were strong and *consistent*. | Ветер был сильным и постоянным.
- constant | adj | ˈkɒnstənt | ˈkɑːnstənt | постоянный | happening all the time; not changing | The *constant* noise gave me a headache. | От постоянного шума у меня разболелась голова.
- equivalent | n | ɪˈkwɪvələnt |  | эквивалент | something that has the same value or meaning | Is there an English *equivalent* of this Russian word? | Есть ли у этого русского слова английский эквивалент?
- estimated | adj | ˈestɪmeɪtɪd | ˈestəmeɪtəd | приблизительный, расчётный | calculated roughly | The *estimated* cost is £1 million. | Ориентировочная стоимость — 1 миллион фунтов.
- exclusive | adj | ɪkˈskluːsɪv |  | эксклюзивный; исключительный | expensive and only for a few people; not shared | The brand sells *exclusive* designer bags. | Бренд продаёт эксклюзивные дизайнерские сумки.
- random | adj | ˈrændəm |  | случайный | happening without a pattern | Death seemed completely *random*. | Смерть казалась совершенно случайной.
- relevant | adj | ˈreləvənt |  | актуальный, относящийся к делу | connected with what is being discussed | Her advice is still *relevant* today. | Её совет актуален и сегодня.
- representative | n | ˌreprɪˈzentətɪv | ˌreprəˈzenətɪv | представитель | a person who acts for others | She's our sales *representative*. | Она наш торговый представитель.
- simultaneous | adj | ˌsɪməlˈteɪniəs | ˌsaɪməlˈteɪniəs | одновременный | happening at the same time | There was a *simultaneous* explosion. | Одновременно прогремел взрыв.
- subject | adj | ˈsʌbdʒɪkt | ˈsʌbdʒekt | подверженный, зависящий | likely to be affected | Flights are *subject* to delay. | Рейсы могут задерживаться.
- timeless | adj | ˈtaɪmləs |  | вечный, вне времени | not affected by time | It's a *timeless* classic. | Это вечная классика.
- transient | adj | ˈtrænsiənt | ˈtrænʒənt | мимолётный, временный | lasting a short time | His happiness was *transient*. | Его счастье было мимолётным.
- understanding | adj | ˌʌndəˈstændɪŋ | ˌʌndərˈstændɪŋ | понимающий | kind and forgiving | My boss is very *understanding*. | Мой начальник очень понимающий.
- unique | adj | juˈniːk |  | уникальный | the only one of its kind | Every person's fingerprints are *unique*. | Отпечатки пальцев каждого человека уникальны.
- valid | adj | ˈvælɪd |  | действительный, обоснованный | based on good reasons; legally acceptable | Is your passport still *valid*? | Твой паспорт ещё действителен? | validity — обоснованность
