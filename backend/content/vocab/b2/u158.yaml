title: 'Describing: society and science'
title_ru: 'Описание: общество, наука, право'
topic: describing
words:
- dairy | adj | ˈdeəri | ˈderi | молочный | made from milk | I don't eat *dairy* products. | Я не ем молочные продукты. | не путайте с diary — дневник
- ethnic | adj | ˈeθnɪk |  | этнический | connected with a group of people with a shared culture | The city has many *ethnic* communities. | В городе много этнических общин.
- intellectual | adj | ˌɪntəˈlektʃuəl |  | интеллектуальный | connected with the ability to think | Humans have great *intellectual* abilities. | У людей большие интеллектуальные способности.
- literary | adj | ˈlɪtərəri | ˈlɪtəreri | литературный | connected with literature | She won a famous *literary* prize. | Она получила известную литературную премию.
- mutual | adj | ˈmjuːtʃuəl |  | взаимный, общий | felt or done by two or more people equally | They have a *mutual* respect for each other. | Они испытывают взаимное уважение. | a mutual friend — общий друг
- sacred | adj | ˈseɪkrɪd |  | священный | connected with God or religion; very important | The first games were part of *sacred* funeral rites. | Первые игры были частью священных погребальных обрядов.
- virtual | adj | ˈvɜːtʃuəl | ˈvɜːrtʃuəl | виртуальный | created by a computer; almost | We took a *virtual* tour of the museum. | Мы совершили виртуальную экскурсию по музею.
- voluntary | adj | ˈvɒləntri | ˈvɑːlənteri | добровольный | done willingly, without being paid or forced | She does *voluntary* work at the hospital. | Она работает волонтёром в больнице.
