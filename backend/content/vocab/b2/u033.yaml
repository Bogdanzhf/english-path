title: Travel and transport
title_ru: Путешествия и транспорт
topic: travel
words:
- abandoned | adj | əˈbændənd |  | заброшенный, брошенный | left empty or alone | They found an *abandoned* house. | Они нашли заброшенный дом.
- aircraft | n | ˈeəkrɑːft | ˈerkræft | воздушное судно, самолёт | a plane, helicopter or other flying vehicle | The bird flew further than many small *aircraft*. | Птица пролетела дальше многих небольших самолётов. | мн. ч. = ед. ч.
- bumper | n | ˈbʌmpə | ˈbʌmpər | бампер | the bar at the front or back of a car | The *bumper* was damaged. | Бампер был повреждён.
- caravan | n | ˈkærəvæn |  | дом на колёсах (брит.); караван | a vehicle you can live in; a group travelling together | We spent the summer in a *caravan*. | Мы провели лето в доме на колёсах.
- carriage | n | ˈkærɪdʒ |  | карета, экипаж; вагон | a vehicle pulled by horses; a part of a train | The queen arrived in a golden *carriage*. | Королева прибыла в золотой карете.
- commute | v | kəˈmjuːt |  | ездить на работу (издалека) | to travel regularly between home and work | She *commutes* to London every day by train. | Она каждый день ездит на работу в Лондон на поезде.
- cyclist | n | ˈsaɪklɪst | ˈsaɪkəlɪst | велосипедист | a person who rides a bike | The road has a lane for *cyclists*. | На дороге есть полоса для велосипедистов.
- motorbike | n | ˈməʊtəbaɪk | ˈmoʊtərbaɪk | мотоцикл | a motorcycle | He rides a *motorbike* to work. | Он ездит на работу на мотоцикле.
- overtake | v | ˌəʊvəˈteɪk | ˈoʊvərteɪk | обгонять | to go past a vehicle | Don't *overtake* on a bend. | Не обгоняйте на повороте. | overtake – overtook – overtaken
- pedal | n | ˈpedl |  | педаль | a part you push with your foot | Press the brake *pedal*. | Нажмите на педаль тормоза.
- scooter | n | ˈskuːtə | ˈskuːtər | самокат; мотороллер | a small vehicle with two wheels | Kids love riding *scooters*. | Дети любят кататься на самокатах.
- shipwreck | n | ˈʃɪprek |  | кораблекрушение; обломки корабля | the sinking of a ship | Divers explored the *shipwreck*. | Дайверы обследовали затонувший корабль.
- skateboard | n | ˈskeɪtbɔːd | ˈskeɪtbɔːrd | скейтборд | a board with wheels | He rides his *skateboard* in the park. | Он катается на скейте в парке.
- trolley | n | ˈtrɒli | ˈtrɑːli | тележка (брит.) | a cart for shopping or luggage | Get a *trolley* for the bags. | Возьми тележку для сумок. | амер. cart
- windshield | n | ˈwɪndʃiːld |  | лобовое стекло (амер.) | the front window of a car | Clean the *windshield*. | Протри лобовое стекло. | брит. windscreen
- yacht | n | jɒt | jɑːt | яхта | a boat for racing or pleasure | They sailed around the island on a *yacht*. | Они обошли остров на яхте.
