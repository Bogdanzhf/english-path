title: Time and dates
title_ru: Время и даты
topic: time
words:
- afterwards | adv | ˈɑːftəwədz | ˈæftərwərdz | потом, после этого | later | We had dinner and went home *afterwards*. | Мы поужинали, а потом пошли домой.
- annual | adj | ˈænjuəl |  | ежегодный | happening once every year | The *annual* festival takes place in June. | Ежегодный фестиваль проходит в июне.
- annually | adv | ˈænjuːəli |  | ежегодно | once a year | The festival is held *annually*. | Фестиваль проводится ежегодно.
- constantly | adv | ˈkɒnstəntli | ˈkɑːnstəntli | постоянно | all the time | The weather on the mountain changes *constantly*. | Погода в горах постоянно меняется.
- distant | adj | ˈdɪstənt |  | далёкий, отдалённый | far away | He's a *distant* relative. | Он дальний родственник.
- endless | adj | ˈendləs |  | бесконечный | without an end | We had *endless* arguments. | У нас были бесконечные споры.
- eternal | adj | ɪˈtɜːnl | iːˈtɜːrnl | вечный | lasting for ever | They promised *eternal* love. | Они поклялись в вечной любви.
- extension | n | ɪkˈstenʃn |  | пристройка; продление; добавочный номер | an extra room added to a building; extra time | They built an *extension* at the back of the house. | Они сделали пристройку к дому сзади. | extension 214 — добавочный 214
- formerly | adv | ˈfɔːməli | ˈfɔːrmərli | ранее, прежде | in the past | The hotel was *formerly* a castle. | Раньше отель был замком.
- frequency | n | ˈfriːkwənsi |  | частота | how often something happens | The *frequency* of droughts has increased. | Частота засух увеличилась.
- frequent | adj | ˈfriːkwənt |  | частый | happening often | Misquotes are *frequent* on social media. | Неверные цитаты часто встречаются в соцсетях.
- instantly | adv | ˈɪnstəntli |  | мгновенно | immediately | She recognised him *instantly*. | Она узнала его мгновенно.
- last minute | n | lɑːst ˈmɪnət | læs ˈmɪnət | последний момент | the latest possible time | He always leaves things to the *last minute*. | Он всегда откладывает всё на последний момент.
- lately | adv | ˈleɪtli |  | в последнее время | recently | Have you seen him *lately*? | Ты видел его в последнее время?
- occasionally | adv | əˈkeɪʒənəli |  | изредка, время от времени | sometimes but not often | We *occasionally* go to the theatre. | Мы изредка ходим в театр.
- pace | n | peɪs |  | темп, скорость | the speed at which something happens | Life in a big city moves at a fast *pace*. | Жизнь в большом городе течёт в быстром темпе.
- permanently | adv | ˈpɜːmənəntli | ˈpɜːrmənəntli | навсегда, постоянно | for ever | They moved abroad *permanently*. | Они переехали за границу насовсем.
- schedule | v | ˈʃedjuːl | ˈskedʒuːl | планировать, назначать | to arrange for a certain time | The meeting is *scheduled* for Monday. | Встреча назначена на понедельник.
- temporarily | adv | ˌtempəˈrerəli |  | временно | for a short time | The shop is *temporarily* closed. | Магазин временно закрыт.
