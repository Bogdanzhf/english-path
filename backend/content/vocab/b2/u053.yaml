title: Nature and weather
title_ru: Природа и погода
topic: nature
words:
- canal | n | kəˈnæl |  | канал | a long man-made waterway for boats | Venice is famous for its *canals*. | Венеция славится своими каналами.
- cascade | n | kəˈskeɪd | kæˈskeɪd | каскад, водопад | a small waterfall | Water fell in a *cascade* over the rocks. | Вода каскадом падала по камням.
- cave | n | keɪv |  | пещера | a large hole in a cliff or under the ground | They sheltered from the storm in a *cave*. | Они укрылись от бури в пещере.
- cliff | n | klɪf |  | утёс, обрыв | a high steep rock, often by the sea | The castle stood on top of a *cliff*. | Замок стоял на вершине утёса.
- crater | n | ˈkreɪtə | ˈkreɪtər | кратер | a large hole in the ground | There are many *craters* on the moon. | На Луне много кратеров.
- creek | n | kriːk |  | ручей; бухта | a small river or stream | The chimps came down to drink at the *creek*. | Шимпанзе спускались попить к ручью.
- cyclone | n | ˈsaɪkləʊn | ˈsaɪkloʊn | циклон | a violent tropical storm with very strong winds (in the Indian Ocean) | A *cyclone* hit the coast of India. | На побережье Индии обрушился циклон.
- desert | v | dɪˈzɜːt | dɪˈzɜːrt | покидать, бросать; дезертировать | to leave someone or a place | He *deserted* his family. | Он бросил семью.
- flame | n | fleɪm |  | пламя | the hot bright burning gas of a fire | The house went up in *flames*. | Дом охватило пламя.
- glacier | n | ˈɡlæsiə | ˈɡleɪʃər | ледник | a large mass of ice that moves slowly | The *glacier* has shrunk in recent years. | Ледник в последние годы уменьшился.
- gorge | n | ɡɔːdʒ | ɡɔːrdʒ | ущелье | a deep narrow valley | A river runs through the *gorge*. | По ущелью течёт река.
- growing | adj | ˈɡrəʊɪŋ | ˈɡroʊɪŋ | растущий | increasing | There's a *growing* interest in yoga. | Интерес к йоге растёт.
- gulf | n | ɡʌlf |  | залив | a large area of sea that is partly surrounded by land | The ship sailed into the *gulf* at sunrise. | На рассвете корабль вошёл в залив.
- horizon | n | həˈraɪzn |  | горизонт | the line where the sky seems to meet the land or sea | The sun disappeared below the *horizon*. | Солнце скрылось за горизонтом.
- lowland | n | ˈləʊlənd | ˈloʊlænd | низменность | flat low land | The *lowlands* are good for farming. | Низменности хороши для земледелия.
- pit | n | pɪt |  | яма; косточка | a deep hole; a seed in fruit | They dug a *pit* for the fire. | Они вырыли яму для костра.
- pond | n | pɒnd | pɑːnd | пруд | a small area of still water | Children were feeding ducks at the *pond*. | Дети кормили уток у пруда.
- puff | n | pʌf |  | облачко (дыма), затяжка, дуновение | a small amount of smoke, air or steam | A *puff* of smoke came out of the chimney. | Из трубы вылетело облачко дыма.
- slope | n | sləʊp | sloʊp | склон | ground that goes up or down | They skied down the *slope*. | Они съехали по склону на лыжах.
- strait | n | streɪt |  | пролив | a narrow sea passage | The ship sailed through the *strait*. | Корабль прошёл через пролив.
- subcontinent | n | ˈsʌbkəntɪnənt | səbˈkɑːntɪnənt | субконтинент | a large part of a continent | India is part of the Indian *subcontinent*. | Индия — часть Индийского субконтинента.
- tide | n | taɪd |  | прилив, отлив | the regular rise and fall of the sea | The *tide* is coming in. | Начинается прилив. | high tide — прилив, low tide — отлив
- typhoon | n | taɪˈfuːn |  | тайфун | a violent tropical storm (in the western Pacific) | The *typhoon* hit the Philippines. | Тайфун обрушился на Филиппины.
