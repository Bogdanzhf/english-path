title: Free time and sport
title_ru: Досуг и спорт
topic: leisure
words:
- bait | n | beɪt |  | приманка, наживка | food used to attract animals or fish | They used a mouse as *bait* to catch the snake. | В качестве приманки для змеи использовали мышь.
- bet | v | bet |  | держать пари, спорить | to risk money on the result of something | I *bet* you ten dollars that he'll be late. | Спорим на десять долларов, что он опоздает. | I bet… — Уверен, что…
- dive | v | daɪv |  | нырять | to jump into water head first | The boy *dived* into the pool. | Мальчик нырнул в бассейн. | амер. dove/dived
- puzzle | n | ˈpʌzl |  | головоломка, загадка | a game or problem that you have to think hard to solve | My grandfather does a crossword *puzzle* every morning. | Дедушка каждое утро разгадывает кроссворд.
- spectator | n | spekˈteɪtə | ˈspekteɪtər | зритель | a person who watches an event | *Spectators* gathered to watch the feeding. | Зрители собрались посмотреть на кормление.
- victory | n | ˈvɪktəri |  | победа | success in a war or competition | The team celebrated their *victory*. | Команда праздновала победу.
- wrestle | v | ˈresl |  | бороться (в борьбе) | to fight by holding and pushing someone | The boys *wrestled* on the grass. | Мальчишки боролись на траве. | t не читается; wrestling — борьба (спорт)
