title: Food and drink
title_ru: Еда и напитки
topic: food
words:
- alcoholic | n | ˌælkəˈhɒlɪk | ˌælkəˈhɑːlɪk | алкоголик | a person who cannot stop drinking alcohol | He's a recovering *alcoholic*. | Он бывший алкоголик, проходит лечение.
- beverage | n | ˈbevərɪdʒ |  | напиток | a drink other than water (formal) | Hot *beverages* are served in the lounge. | Горячие напитки подаются в гостиной.
- carbohydrate | n | ˌkɑːbəʊˈhaɪdreɪt | ˌkɑːrboʊˈhaɪdreɪt | углевод | a substance in food like bread and rice that gives energy | Athletes eat a lot of *carbohydrates* before a race. | Спортсмены едят много углеводов перед забегом. | разг. carbs
- catering | n | ˈkeɪtərɪŋ |  | общественное питание, кейтеринг | providing food for events | Who did the *catering* for the wedding? | Кто готовил еду на свадьбу?
- chew | v | tʃuː |  | жевать | to bite food many times before you swallow it | *Chew* your food slowly. | Жуй еду медленно. | chewing gum — жвачка
- dine | v | daɪn |  | обедать, ужинать (формально) | to eat dinner | We *dined* at an expensive restaurant. | Мы ужинали в дорогом ресторане. | dining room — столовая
- hay | n | heɪ |  | сено | dried grass used to feed animals | The horses were eating *hay*. | Лошади ели сено.
- lentil | n | ˈlentl |  | чечевица | a small round dried seed cooked in soups | Roman soldiers often ate *lentil* soup. | Римские солдаты часто ели чечевичный суп.
- mandarin | n | ˈmændərɪn |  | мандарин; (Mandarin) путунхуа, китайский язык | a small orange fruit; the official language of China | She speaks *Mandarin* and English. | Она говорит на китайском и английском.
- nourish | v | ˈnʌrɪʃ | ˈnɜːrɪʃ | питать | to give food needed for health and growth | Milk *nourishes* young animals. | Молоко питает детёнышей.
- olive | n | ˈɒlɪv | ˈɑːlɪv | оливка, маслина | a small green or black fruit eaten or used to make oil | *Olive* oil is part of the Mediterranean diet. | Оливковое масло — часть средиземноморской диеты.
- plantation | n | plænˈteɪʃn |  | плантация | a large farm where crops like coffee or tea are grown | We visited a coffee *plantation* in Colombia. | Мы побывали на кофейной плантации в Колумбии.
- produce | n | ˈprɒdjuːs | ˈproʊduːs | продукция (с/х) | food grown on farms | The market sells local *produce*. | На рынке продаются местные фермерские продукты.
- pudding | n | ˈpʊdɪŋ |  | пудинг; десерт (брит.) | a sweet dish | What's for *pudding*? | Что на десерт?
- 'squash | n | skwɒʃ | skwɑːʃ | сквош; тыква; сок (брит.) | a racket sport; a vegetable | We play *squash* every Monday. | Мы играем в сквош каждый понедельник. | гл.: squash — раздавить'
- starve | v | stɑːv | stɑːrv | голодать | to suffer or die because there is not enough food | Many animals *starve* in a hard winter. | В суровую зиму многие животные голодают. | I'm starving! — Умираю с голоду!
- sticky | adj | ˈstɪki |  | липкий | made of or covered with a substance that sticks | His fingers were *sticky* with honey. | Его пальцы были липкими от мёда.
- walnut | n | ˈwɒlnʌt | ˈwɔːlnʌt | грецкий орех | a nut with a hard shell | She put *walnuts* in the cake. | Она добавила в торт грецкие орехи.
- whiskey | n | ˈwɪski | ˈhwɪski | виски | a strong alcoholic drink | He drinks *whiskey* with ice. | Он пьёт виски со льдом. | брит. whisky
- whole grains | n | həʊl ɡreɪnz | hoʊl ɡreɪnz | цельные злаки | grains with nothing removed | Eat more fruit and *whole grains*. | Ешьте больше фруктов и цельнозерновых продуктов.
- yeast | n | jiːst |  | дрожжи | a substance used to make bread rise | Add the *yeast* to warm water. | Добавьте дрожжи в тёплую воду.
