title: 'Describing: society and science'
title_ru: 'Описание: общество, наука, право'
topic: describing
words:
- core | n | kɔː | kɔːr | ядро, сердцевина, суть | the central and most important part | Honesty is at the *core* of our values. | Честность — основа наших ценностей.
- domestic | adj | dəˈmestɪk |  | внутренний; домашний | inside one country; connected with the home | We took a *domestic* flight from London to Edinburgh. | Мы летели внутренним рейсом из Лондона в Эдинбург. | domestic animals — домашние животные
- external | adj | ɪkˈstɜːnl | ɪkˈstɜːrnl | внешний | outside | The animals are protected from *external* threats. | Животные защищены от внешних угроз.
- internal | adj | ɪnˈtɜːnl | ɪnˈtɜːrnl | внутренний | inside the body or an organization | He suffered *internal* injuries in the accident. | В аварии он получил внутренние травмы.
- joint | adj | dʒɔɪnt |  | совместный | shared or done by two or more people or groups | It was a *joint* operation between Britain and the USA. | Это была совместная операция Великобритании и США. | сущ. joint — сустав
- moral | adj | ˈmɒrəl | ˈmɔːrəl | моральный, нравственный | connected with right and wrong | It was a difficult *moral* question. | Это был сложный нравственный вопрос. | сущ. morals — мораль
- sector | n | ˈsektə | ˈsektər | сектор, отрасль | a part of an economy or society | He works in the energy *sector*. | Он работает в энергетической отрасли.
- visual | adj | ˈvɪʒuəl |  | визуальный, зрительный | connected with seeing | The *visual* appeal of food is very important. | Внешний вид еды очень важен.
