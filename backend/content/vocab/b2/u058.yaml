title: Animals
title_ru: Животные
topic: animals
words:
- beast | n | biːst |  | зверь, чудовище | a large or dangerous animal; a cruel person | The story is about a beauty and a *beast*. | Это история о красавице и чудовище.
- cattle | n | ˈkætl |  | крупный рогатый скот | cows and bulls | The farmer keeps *cattle*. | Фермер держит скот. | только мн. ч.
- crab | n | kræb |  | краб | a sea animal with claws | We caught a *crab* on the beach. | Мы поймали краба на пляже.
- crocodile | n | ˈkrɒkədaɪl | ˈkrɑːkədaɪl | крокодил | a large reptile with big teeth | The *crocodile* opened its mouth. | Крокодил открыл пасть.
- deer | n | ˈdiə | dɪr | олень | a wild animal with antlers | We saw a *deer* in the forest. | Мы видели оленя в лесу. | мн. ч. deer
- dove | n | dəv | dʌv | голубь (белый) | a white bird, a symbol of peace | The *dove* is a symbol of peace. | Голубь — символ мира.
- eagle | n | ˈiːɡl |  | орёл | a large bird of prey | An *eagle* flew over the mountains. | Над горами пролетел орёл.
- fox | n | fɒks | fɑːks | лиса | a wild animal with a red coat and bushy tail | A *fox* stole our chickens. | Лиса утащила наших кур.
- goat | n | ɡəʊt | ɡoʊt | коза | an animal with horns, kept for milk | We drank *goat's* milk. | Мы пили козье молоко.
- hawk | n | hɔːk |  | ястреб | a bird of prey | A *hawk* was circling above. | Над нами кружил ястреб.
- kangaroo | n | ˈkæŋɡəruː | ˌkæŋɡəˈruː | кенгуру | an Australian animal that jumps | *Kangaroos* carry babies in a pouch. | Кенгуру носят детёнышей в сумке.
- owl | n | aʊl |  | сова | a bird that hunts at night | I'm a night *owl*. | Я сова.
- ox | n | ɒks | ɑːks | вол, бык | a bull used for work | The *ox* pulled the cart. | Вол тянул телегу. | мн. ч. oxen
- penguin | n | ˈpeŋɡwɪn | ˈpeŋɡwən | пингвин | a black and white bird that can't fly | *Penguins* live in Antarctica. | Пингвины живут в Антарктиде.
- polar bear | n | ˈpəʊlə beə | ˈpoʊlər ber | белый медведь | a large white bear of the Arctic | *Polar bears* are excellent swimmers. | Белые медведи отлично плавают.
- poultry | n | ˈpəʊltri | ˈpoʊltri | домашняя птица | chickens, ducks and other farm birds | The storm killed thousands of *poultry*. | Шторм погубил тысячи голов домашней птицы.
- sparrow | n | ˈspærəʊ | ˈsperoʊ | воробей | a small brown bird | A *sparrow* landed on the window. | На окно сел воробей.
- swan | n | swɒn | swɑːn | лебедь | a large white water bird | *Swans* were swimming on the lake. | По озеру плавали лебеди.
- wolf | n | wʊlf |  | волк | a wild animal like a large dog | We heard a *wolf* howl. | Мы слышали вой волка. | мн. ч. wolves
- worm | n | wɜːm | wɜːrm | червь | a small long animal with a soft body and no legs | The bird pulled a *worm* out of the ground. | Птица вытащила из земли червяка.
