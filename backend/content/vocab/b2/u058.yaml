title: Actions and movement
title_ru: Действия и движение
topic: actions
words:
- adapt | v | əˈdæpt |  | приспосабливаться, адаптировать | to change to suit new conditions | Children *adapt* quickly to new schools. | Дети быстро привыкают к новой школе.
- alter | v | ˈɔːltə | ˈɔːltər | изменять, переделывать | to change something slightly | I had my wedding dress *altered*. | Я отдала свадебное платье на подгонку.
- alternate | adj | ɔːlˈtɜːnət | ˈɔːltərnət | чередующийся; альтернативный | happening every second time; (US) alternative | Bins are collected on *alternate* weeks. | Мусор вывозят через неделю.
- burst | v | bɜːst | bɜːrst | лопнуть, разорваться | to break open suddenly | The balloon *burst* with a loud bang. | Шарик лопнул с громким хлопком. | burst — burst — burst; burst into tears — расплакаться
- convert | v | kənˈvɜːt | kənˈvɜːrt | превращать, переделывать | to change something into a different form | They *converted* the old church into a café. | Старую церковь переделали в кафе.
- crack | v | kræk |  | раскалываться; раскрыть (дело), взломать | to break without separating into pieces; to solve a difficult problem | Detectives finally *cracked* the case. | Детективы наконец раскрыли дело.
- decrease | v | dɪˈkriːs |  | уменьшаться, снижать | to become smaller in number or amount | The number of visitors *decreased* last year. | В прошлом году число посетителей снизилось. | ≠ increase
- edit | v | ˈedɪt |  | редактировать | to correct and change a text or film | She *edited* her essay three times. | Она трижды правила своё эссе. | editor — редактор
- eliminate | v | ɪˈlɪmɪneɪt |  | устранять, исключать | to remove completely | The new system *eliminates* the need for paper. | Новая система полностью исключает необходимость в бумаге.
- enable | v | ɪˈneɪbl |  | давать возможность, позволять | to make it possible for someone to do something | The grant *enabled* her to finish her research. | Грант позволил ей закончить исследование.
- enhance | v | ɪnˈhɑːns | ɪnˈhæns | улучшать, усиливать | to improve the quality of something | New batteries *enhanced* the car's range. | Новые аккумуляторы увеличили запас хода машины.
- heal | v | hiːl |  | заживать, излечивать | to become healthy again; to make healthy again | The wound took weeks to *heal*. | Рана заживала несколько недель.
- transform | v | trænsˈfɔːm | trænsˈfɔːrm | преобразовывать, менять | to change completely | Vaccines *transformed* medicine. | Вакцины преобразили медицину.
- vary | v | ˈveəri | ˈveri | различаться, варьироваться | to be different in different situations | Prices *vary* from shop to shop. | Цены различаются от магазина к магазину. | variety — разнообразие
