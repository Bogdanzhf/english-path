title: Society and politics
title_ru: Общество и политика
topic: society
words:
- empire | n | ˈempaɪə | ˈempaɪər | империя | a group of countries ruled by one emperor or government | The Roman *Empire* lasted for centuries. | Римская империя просуществовала века.
- funeral | n | ˈfjuːnərəl |  | похороны | a ceremony for a person who has died | Many people came to the *funeral*. | На похороны пришло много людей.
- heaven | n | ˈhevn |  | рай, небеса | the place where some people believe good people go after death | This beach is like *heaven*! | Этот пляж — просто рай!
- multicultural | adj | ˌmʌltiˈkʌltʃərəl |  | многокультурный | including people of many different cultures | London is a very *multicultural* city. | Лондон — очень многокультурный город.
- soul | n | səʊl | soʊl | душа | the spiritual part of a person | She put her heart and *soul* into the project. | Она вложила в проект всю душу.
- status | n | ˈsteɪtəs | ˈstætəs | статус, положение | position or rank in a group or society | Money doesn't always give you high *status*. | Деньги не всегда дают высокий статус.
- territory | n | ˈterətri | ˈterətɔːri | территория | an area of land; an area of knowledge or activity | Electric trucks are new *territory* for the company. | Электрогрузовики — новая для компании область.
