title: Society and politics
title_ru: Общество и политика
topic: society
words:
- appoint | v | əˈpɔɪnt |  | назначать | to choose someone for a job | She was *appointed* head of the research team. | Её назначили руководителем исследовательской группы.
- assign | v | əˈsaɪn |  | назначать, поручать | to give someone a job or task | Each student was *assigned* a partner. | Каждому ученику назначили партнёра.
- attain | v | əˈteɪn |  | достигать | to succeed in getting something after effort | The islanders *attained* a high level of skill. | Островитяне достигли высокого мастерства.
- cope | v | kəʊp | koʊp | справляться | to deal successfully with a difficult situation | She *copes* well with stress. | Она хорошо справляется со стрессом. | cope with
- deceive | v | dɪˈsiːv |  | обманывать | to make someone believe something that is not true | He *deceived* everyone with his lies. | Он обманул всех своей ложью. | deception — обман
- elect | v | ɪˈlekt |  | избирать | to choose by voting | She was *elected* president. | Её избрали президентом.
- gamble | v | ˈɡæmbl |  | играть в азартные игры; рисковать | to risk money on a game or race | He *gambled* away all his money. | Он проиграл все свои деньги. | gambling — азартные игры
- govern | v | ˈɡʌvən | ˈɡʌvərn | управлять, править | to control a country | The party *governs* the country. | Партия управляет страной.
- impose | v | ɪmˈpəʊz | ɪmˈpoʊz | навязывать, вводить | to force a rule, tax or punishment on people | The government *imposed* harsh penalties. | Правительство ввело суровые наказания.
- interact | v | ˌɪntərˈækt |  | взаимодействовать | to communicate or work together | Drivers *interact* with the car using a touchscreen. | Водители взаимодействуют с машиной через сенсорный экран.
- legislate | v | ˈledʒɪsleɪt |  | издавать законы | to make laws | Parliament must *legislate* to protect workers. | Парламент должен принять законы для защиты работников. | legislation — законодательство
- obey | v | əˈbeɪ |  | подчиняться, слушаться | to do what someone tells you to do | Soldiers must *obey* orders. | Солдаты должны подчиняться приказам.
- occupy | v | ˈɒkjupaɪ | ˈɑːkjupaɪ | занимать | to live in or use a place; to fill time | The family *occupies* the top floor of the house. | Семья занимает верхний этаж дома.
- overthrow | v | ˈəʊvɜːθrəʊ | ˈoʊvərθroʊ | свергать | to remove a ruler by force | The rebels *overthrew* the king. | Повстанцы свергли короля.
- penalize | v | ˈpiːnəlaɪz |  | наказывать, штрафовать | to punish someone for breaking a rule | Companies that pollute will be *penalized*. | Загрязняющие природу компании будут оштрафованы. | брит. также penalise
- recruit | v | rɪˈkruːt |  | набирать, вербовать | to find new people to join an organization | The army *recruited* art experts. | Армия набирала экспертов по искусству.
- restore | v | rɪˈstɔː | rɪˈstɔːr | восстанавливать, реставрировать | to bring back to a good condition | They *restored* the old church. | Старую церковь отреставрировали.
- socialize | v | ˈsəʊʃəlaɪz | ˈsoʊʃəlaɪz | общаться | to spend time with other people for fun | Shopping centres are places where teenagers *socialize*. | Торговые центры — места, где общаются подростки.
- unite | v | juˈnaɪt |  | объединять(ся) | to join together | The bad news *united* the whole town. | Плохая новость сплотила весь город.
