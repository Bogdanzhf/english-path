title: Arts and media
title_ru: Искусство и медиа
topic: arts
words:
- artistry | n | ˈɑːtɪstri | ˈɑːrtɪstri | мастерство, артистизм | great artistic skill | We admired the *artistry* of the dancers. | Мы восхищались мастерством танцоров.
- arts and crafts | n | ɑːts ən krɑːfts | ɑːrts ən kræfs | декоративно-прикладное искусство, рукоделие | making things by hand | The kids love *arts and crafts*. | Дети обожают творческие поделки.
- ballet | n | ˈbæleɪ | bæˈleɪ | балет | a dance performance telling a story | We went to the *ballet*. | Мы ходили на балет.
- broadcast | n | ˈbrɔːdkɑːst | ˈbrɔːdkæst | передача, трансляция | a programme on radio or TV | The match will be shown in a live *broadcast*. | Матч покажут в прямой трансляции.
- coverage | n | ˈkʌvərɪdʒ | ˈkʌvərədʒ | освещение (в СМИ); охват | reporting of news; how much is covered | The election got a lot of *coverage*. | Выборы широко освещались.
- edition | n | ɪˈdɪʃən | əˈdɪʃən | издание, выпуск | one version of a book or paper | This is the first *edition*. | Это первое издание.
- fantasy | n | ˈfæntəsi |  | фантазия, вымысел | something you imagine that is not real | For years, a heart transplant was pure *fantasy*. | Многие годы пересадка сердца была чистой фантастикой.
- fine art | n | faɪn ɑːt | faɪn ɑːrt | изобразительное искусство | painting, sculpture, etc. | She studied *fine art*. | Она изучала изобразительное искусство.
- genre | n | ˈʒɒnrə | ˈʒɑːnrə | жанр | a type of art, music or writing | War films are a popular *genre*. | Военные фильмы — популярный жанр.
- influencer | n | ˈɪnfluənsə | ˈɪnfluənsər | блогер-инфлюенсер | a person who affects others' opinions online | She's a fashion *influencer*. | Она модная блогерша.
- installation | n | ˌɪnstəˈleɪʃən |  | установка; инсталляция | putting in equipment; a work of modern art | The *installation* of the software took an hour. | Установка программы заняла час.
- journalism | n | ˈdʒɜːnəlɪzəm | ˈdʒɜːrnəlɪzəm | журналистика | the work of collecting and writing news | She studied *journalism* at university. | Она изучала журналистику в университете.
- masterpiece | n | ˈmɑːstəpiːs | ˈmæstərpiːs | шедевр | an extremely good work of art | The Ninth Symphony is a *masterpiece*. | Девятая симфония — шедевр.
- novel | adj | ˈnɒvl | ˈnɑːvl | новый, оригинальный | new and different | That's a *novel* idea. | Это оригинальная идея.
- publicity | n | pʌbˈlɪsəti |  | публичность, реклама | public attention given to someone or something | The new film got a lot of *publicity*. | Новому фильму уделили много внимания в прессе.
- replica | n | ˈreplɪkə |  | копия, реплика | an exact copy | It's a *replica* of the Eiffel Tower. | Это копия Эйфелевой башни.
- reprint | n | rɪˈprɪnt | riːˈprɪnt | переиздание | a new printing of a book | The book is now in its third *reprint*. | Книга выходит уже третьим тиражом.
- scandal | n | ˈskændl |  | скандал | an event that shocks people | The minister resigned after the *scandal*. | Министр ушёл в отставку после скандала.
- tabloid | n | ˈtæblɔɪd |  | бульварная газета, таблоид | a newspaper with short stories and gossip | The story was in all the *tabloids*. | Эта история была во всех таблоидах.
- tragedy | n | ˈtrædʒədi |  | трагедия | a very sad event | The accident was a terrible *tragedy*. | Авария стала ужасной трагедией.
- watercolour | n | ˈwɔːtəkʌlə | wˈɔːtəkʌlɐ | акварель | paint mixed with water; a painting made with it | She paints in *watercolour*. | Она пишет акварелью. | амер. watercolor
