title: Idioms
title_ru: Идиомы
topic: idioms
words:
- let the cat out of the bag | phr |  |  | проболтаться | to tell a secret by mistake | Who *let the cat out of the bag*? | Кто проболтался?
- miss the boat | phr |  |  | упустить шанс | to lose an opportunity | Hurry, or you'll *miss the boat*. | Поторопись, а то упустишь шанс.
- on cloud nine | phr |  |  | на седьмом небе | very happy | She was *on cloud nine* after the wedding. | После свадьбы она была на седьмом небе.
- on the fence | phr |  |  | в нерешительности | not decided | I'm still *on the fence* about it. | Я пока не определился.
- once in a blue moon | phr |  |  | очень редко, раз в сто лет | very rarely | We go out *once in a blue moon*. | Мы выбираемся куда-то раз в сто лет.
- pull someone's leg | phr |  |  | разыгрывать, подшучивать | to joke with someone | Relax, I'm just *pulling your leg*. | Расслабься, я просто шучу.
- see eye to eye | phr |  |  | сходиться во мнениях | to agree | We don't always *see eye to eye*. | Мы не всегда сходимся во мнениях.
- sit on the fence | phr |  |  | занимать нейтральную позицию | to avoid choosing a side | You can't *sit on the fence* forever. | Нельзя вечно оставаться в стороне.
- spill the beans | phr |  |  | выдать секрет | to tell a secret | Come on, *spill the beans*! | Ну давай, выкладывай!
- take with a pinch of salt | phr |  |  | относиться скептически | to not completely believe | Take his stories *with a pinch of salt*. | Его рассказы делите на два.
- the ball is in your court | phr |  |  | теперь твой ход, решать тебе | it's your turn to act | I've made my offer — *the ball is in your court*. | Я сделал предложение — теперь решать тебе.
- the last straw | phr |  |  | последняя капля | the final problem that makes you lose patience | His lateness was *the last straw*. | Его опоздание стало последней каплей.
- the tip of the iceberg | phr |  |  | верхушка айсберга | a small part of a bigger problem | These problems are just *the tip of the iceberg*. | Эти проблемы — лишь верхушка айсберга.
- through thick and thin | phr |  |  | в горе и в радости, несмотря ни на что | in good times and bad | She stayed with him *through thick and thin*. | Она была с ним и в горе, и в радости.
- under pressure | phr |  |  | под давлением | feeling stress | I work well *under pressure*. | Я хорошо работаю в условиях стресса.
