reading:
  title: "The Priest and the Pastor"
  title_ru: "Священник и пастор"
  text: |
    During the Second World War, the Netherlands was occupied by German forces. The new authorities began to arrest Jewish families and send them to camps in the east. Many Dutch people were outraged, but few dared to act. In one small town, however, two men decided they could not stand by.

    One was the priest of the local Catholic parish. The other was the Protestant pastor of the church across the square. Before the war, the two men had rarely spoken. Their churches had argued for centuries about the Bible and how to read it. But now they agreed to cooperate. Together they built a secret network that helped Jewish families to flee.

    The system was simple but dangerous. Families arrived at night and were hidden in a barn outside the town. Under the barn, farmers had dug a narrow tunnel that led to a passage beneath the church. From there, members of the network took them, with false papers, to the rail station, where friendly train workers helped them travel to the coast.

    Several times, soldiers raided the farm. Once, a patrol searched the barn for two hours while twelve people waited silently in the tunnel below. The soldiers found nothing and left by the main exit, laughing.

    In 1944, someone betrayed the network. The pastor was detained and sent to a prison camp. The priest managed to escape and hid until the end of the war. The pastor survived too, and when he returned, the two men embraced in the square. Historians believe they helped more than three hundred people. After the war, both were honoured for their exceptional courage. When journalists asked why they had aligned themselves with each other, the priest smiled. "When people are in danger," he said, "there is only one church."
  ru: |
    Во время Второй мировой войны Нидерланды были оккупированы немецкими войсками. Новые власти начали арестовывать еврейские семьи и отправлять их в лагеря на востоке. Многие голландцы были возмущены, но мало кто осмеливался действовать. Однако в одном маленьком городке двое мужчин решили, что не могут оставаться в стороне.

    Один был священником местного католического прихода. Другой — протестантским пастором церкви на противоположной стороне площади. До войны они почти не разговаривали. Их церкви веками спорили о Библии и о том, как её толковать. Но теперь они договорились действовать сообща. Вместе они создали тайную сеть, которая помогала еврейским семьям бежать.

    Система была простой, но опасной. Семьи приходили ночью, и их прятали в амбаре за городом. Под амбаром фермеры вырыли узкий туннель, который вёл в подземный ход под церковью. Оттуда участники сети с поддельными документами провожали людей на железнодорожную станцию, где сочувствующие железнодорожники помогали им добраться до побережья.

    Несколько раз солдаты устраивали облавы на ферме. Однажды патруль два часа обыскивал амбар, пока двенадцать человек молча ждали в туннеле внизу. Солдаты ничего не нашли и со смехом ушли через главный выход.

    В 1944 году кто-то выдал сеть. Пастора арестовали и отправили в лагерь. Священнику удалось бежать, и он скрывался до конца войны. Пастор тоже выжил, и когда он вернулся, двое мужчин обнялись на площади. Историки считают, что они помогли более чем тремстам людям. После войны обоих наградили за исключительное мужество. Когда журналисты спросили, почему они объединились, священник улыбнулся. «Когда люди в опасности, — сказал он, — церковь только одна».
  questions:
    - q: "What was unusual about the two men working together?"
      options: ["They were brothers", "Their churches had disagreed for centuries", "They were both soldiers", "They lived in different countries"]
      answer: 1
    - q: "Where were the families hidden first?"
      options: ["In the church", "In a barn outside the town", "At the station", "On a boat"]
      answer: 1
    - q: "What happened in 1944?"
      options: ["The war ended", "Someone betrayed the network", "The barn burned down", "The priest was arrested"]
      answer: 1
    - tf: "The soldiers found the people in the tunnel."
      answer: false
    - tf: "Both men survived the war."
      answer: true
