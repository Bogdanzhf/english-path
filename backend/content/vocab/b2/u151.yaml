title: 'Describing: society and science'
title_ru: 'Описание: общество, наука, право'
topic: describing
words:
- alphabetical | adj | ˌælfəˈbetɪkl |  | алфавитный | in the order of the alphabet | The names are in *alphabetical* order. | Имена в алфавитном порядке.
- charitable | adj | ˈtʃærətəbl |  | благотворительный | helping people in need | She works for a *charitable* organisation. | Она работает в благотворительной организации. | charity — благотворительность
- dairy | adj | ˈdeəri | ˈderi | молочный | made from milk | I don't eat *dairy* products. | Я не ем молочные продукты. | не путайте с diary — дневник
- elective | adj | ɪˈlektɪv |  | факультативный, выборный | chosen; not required | Art is an *elective* subject. | Рисование — предмет по выбору.
- governmental | adj | ˌɡʌvənˈmentl | ˈɡʌvərmentl | правительственный | relating to government | It's a *governmental* organisation. | Это правительственная организация.
- interpersonal | adj | ˌɪntəˈpɜːsənl | ˌɪntərˈpɜːrsənl | межличностный | between people | Good *interpersonal* skills are important. | Важны навыки общения.
