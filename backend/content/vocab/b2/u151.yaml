title: Thinking and opinions
title_ru: Мысли и мнения
topic: mind
words:
- aroma | n | əˈrəʊmə | əˈroʊmə | аромат | a strong pleasant smell, especially of food or drink | The *aroma* of fresh coffee filled the kitchen. | Кухню наполнил аромат свежего кофе.
- camouflage | n | ˈkæməflɑːʒ |  | камуфляж, маскировка | a way of hiding things by making them look like their surroundings | The soldiers wore *camouflage* to hide in the jungle. | Солдаты носили камуфляж, чтобы прятаться в джунглях.
- glamour | n | ˈɡlæmə | ˈɡlæmər | гламур, блеск, очарование | the exciting and attractive quality of rich or famous people | She was attracted by the *glamour* of Hollywood. | Её привлекал блеск Голливуда. | амер. также glamor
- gleam | v | ɡliːm |  | блестеть, мерцать | to shine softly | The statues' eyes once *gleamed* with white coral. | Когда-то глаза статуй блестели белым кораллом.
- haste | n | heɪst |  | спешка, поспешность | doing something too quickly | In his *haste*, he forgot his keys. | В спешке он забыл ключи. | Haste makes waste. — Поспешишь — людей насмешишь.
- odor | n | ˈəʊdə | ˈoʊdər | запах (часто неприятный) | a smell, often an unpleasant one | There was a strange *odor* in the room. | В комнате стоял странный запах. | брит. odour
- permanence | n | ˈpɜːmənəns | ˈpɜːrmənəns | постоянство | the state of lasting for a long time | Nothing has *permanence* in politics. | В политике нет ничего постоянного. | permanent — постоянный
