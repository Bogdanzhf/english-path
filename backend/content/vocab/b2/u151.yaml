- nationwide | adv | ˈneɪʃənwaɪd | ˈneɪʃənˈwaɪd | по всей стране | across a whole country | The film opens *nationwide* next week. | Фильм выходит в прокат по всей стране на следующей неделе.
- numerical | adj | njuːˈmerɪkl | nuːˈmerəkl | числовой | relating to numbers | Arrange them in *numerical* order. | Расположите их по номерам.
- offshore | adj | ˈɒfʃɔː | ˈɔːfˈʃɔːr | морской, офшорный | at sea away from the coast | There's an *offshore* oil rig. | В море есть нефтяная вышка.
- overcrowded | adj | ˌəʊvəˈkraʊdɪd | ˌoʊvərˈkraʊdɪd | переполненный, перенаселённый | having too many people | The poor lived in *overcrowded* houses. | Бедняки жили в перенаселённых домах.
- paramedic | n | ˌpærəˈmedɪk | ˌperəˈmedɪk | фельдшер скорой помощи | a person who gives emergency medical care | The *paramedics* arrived quickly. | Медики скорой приехали быстро.
- patriotic | adj | ˌpætrɪˈɒtɪk | ˌpeɪtriːˈɑːtɪk | патриотический | loving your country | They sang *patriotic* songs. | Они пели патриотические песни.
- postal | adj | ˈpəʊstl | ˈpoʊstl | почтовый | relating to post | What's your *postal* address? | Какой у вас почтовый адрес?
- respiratory | adj | rɪˈspɪrətəri | ˈrespərətɔːri | дыхательный, респираторный | relating to breathing | He has a *respiratory* infection. | У него респираторная инфекция.
- sanitary | adj | ˈsænɪtəri | ˈsænɪteri | санитарный, гигиенический | relating to health and cleanliness | *Sanitary* conditions were poor. | Санитарные условия были плохими.
- technological | adj | ˌteknəˈlɒdʒɪkl | ˌteknəˈlɑːdʒɪkl | технологический | relating to technology | We live in a time of rapid *technological* change. | Мы живём во время быстрых технологических изменений.
- unofficial | adj | ʌnəˈfɪʃl | ˌʌnəˈfɪʃl | неофициальный | not official | It's an *unofficial* report. | Это неофициальный отчёт.
- voluntary | adj | ˈvɒləntri | ˈvɑːlənteri | добровольный | done willingly, without being paid or forced | She does *voluntary* work at the hospital. | Она работает волонтёром в больнице.
