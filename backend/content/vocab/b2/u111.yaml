title: Economy and business
title_ru: Экономика и бизнес
topic: economy
words:
- accounting | n | əˈkaʊntɪŋ |  | бухгалтерия, бухучёт | the job of keeping records of money for a business | She studied *accounting* at college. | Она изучала бухгалтерский учёт в колледже. | accountant — бухгалтер
- consumption | n | kənˈsʌmpʃn |  | потребление | the amount of something used or eaten | Meat *consumption* has risen worldwide. | Потребление мяса выросло во всём мире.
- corporate | adj | ˈkɔːpərət | ˈkɔːrpərət | корпоративный | connected with a large company | The company's *corporate* strategy changed. | Корпоративная стратегия компании изменилась.
- debt | n | det |  | долг | money that you owe | He is trying to pay off his *debts*. | Он пытается расплатиться с долгами. | b не произносится; be in debt
- decline | v | dɪˈklaɪn |  | отказываться; снижаться | to politely refuse; to become less | He *declined* to answer the question. | Он отказался отвечать на вопрос.
- entrepreneur | n | ˌɒntrəprəˈnɜː | ˌɑːntrəprəˈnɜːr | предприниматель | a person who starts a business | She's a young *entrepreneur* with big ideas. | Она молодой предприниматель с большими планами.
- finance | n | ˈfaɪnæns | fəˈnæns | финансы, финансирование | money and how it is managed | Poor people had no access to *finance*. | У бедных не было доступа к финансам.
- fiscal | adj | ˈfɪskl |  | финансовый, фискальный | connected with government money and taxes | The city is facing *fiscal* problems. | Город сталкивается с финансовыми трудностями. | fiscal year — финансовый год
- loan | n | ləʊn | loʊn | заём, кредит | money that you borrow and must pay back | They got a bank *loan* to buy a house. | Они взяли в банке кредит на покупку дома.
- millionaire | n | ˌmɪljəˈneə | ˌmɪljəˈner | миллионер | a very rich person who has at least a million | He became a *millionaire* at thirty. | Он стал миллионером в тридцать лет.
- revenue | n | ˈrevənjuː | ˈrevənuː | доход, выручка | the money a company or government receives | The company's *revenue* rose by 20%. | Выручка компании выросла на 20%.
