title: Everyday phrases
title_ru: Разговорные фразы
topic: phrases
words:
- prove to be something | phr |  |  | оказаться | to turn out to be | The test *proved to be* easy. | Тест оказался лёгким.
- put something together | phr |  |  | собирать, составлять | to assemble | I *put together* the new desk. | Я собрал новый стол.
- quality of life | phr |  |  | качество жизни | how good your life is | Moving to the country improved our *quality of life*. | Переезд за город улучшил качество нашей жизни.
- ranging from | phr |  |  | от … до | including things between two limits | Prices are *ranging from* £5 to £50. | Цены варьируются от 5 до 50 фунтов.
- regarded as something | phr |  |  | считающийся | thought of as | He is *regarded as* the best player. | Его считают лучшим игроком.
- relevant to somebody/something | phr |  |  | имеющий отношение к | connected with | This is not *relevant to* the discussion. | Это не имеет отношения к обсуждению.
- rely on somebody/something | phr |  |  | полагаться на | to depend on | You can *rely on* me. | Можешь на меня положиться.
- short of something | phr |  |  | не хватает (чего-либо) | not having enough | We're *short of* money. | У нас не хватает денег.
- so as to do something | phr |  |  | чтобы, для того чтобы | in order to | We left early *so as to* avoid traffic. | Мы выехали рано, чтобы не попасть в пробки.
- something like... | phr |  |  | что-то вроде; около | approximately; similar to | It costs *something like* £100. | Это стоит около 100 фунтов.
- stick to something | phr |  |  | придерживаться | to continue doing or using | *Stick to* the plan. | Придерживайся плана.
- subject to something | phr |  |  | подлежащий; в зависимости от | likely to be affected by | Prices are *subject to* change. | Цены могут меняться.
- take advantage of somebody/something | phr |  |  | воспользоваться | to use an opportunity; to use unfairly | *Take advantage of* the good weather. | Воспользуйся хорошей погодой.
- take something into account | phr |  |  | учитывать | to consider | We must *take into account* the cost. | Нужно учесть стоимость.
- that is | phr |  |  | то есть | in other words | We leave tomorrow, *that is*, Monday. | Мы уезжаем завтра, то есть в понедельник. | сокр. i.e.
- the vast majority of something | phr |  |  | подавляющее большинство | almost all | *The vast majority of* students passed. | Подавляющее большинство студентов сдали.
- turn into something | phr |  |  | превращаться в | to become | The caterpillar *turned into* a butterfly. | Гусеница превратилась в бабочку.
- up to somebody | phr |  |  | решать (кому-либо) | someone's decision | It's *up to* you. | Решать тебе.
- when it comes to something | phr |  |  | когда дело доходит до | when the subject is | *When it comes to* cooking, he's the best. | Когда дело доходит до готовки, ему нет равных.
- whether or not... | phr |  |  | так или иначе, независимо от того | in either case | I'm going *whether or not* you come. | Я пойду, придёшь ты или нет.
- would rather... | phr |  |  | предпочёл бы | would prefer | I *would rather* stay at home. | Я бы лучше остался дома.
