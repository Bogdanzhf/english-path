title: 'Describing: amount and degree'
title_ru: 'Описание: количество и степень'
topic: describing
words:
- ample | adj | ˈæmpl |  | достаточный, обильный | more than enough | There was *ample* land for everyone. | Земли хватало на всех.
- excess | n | ɪkˈses |  | избыток, излишество | an amount that is more than needed | The court was famous for its *excess*. | Двор славился своими излишествами. | in excess of — свыше
- executive | n | ɪɡˈzekjətɪv |  | руководитель | a senior manager in a company | She's a top *executive* at a tech company. | Она топ-менеджер в технологической компании.
- mere | adj | mɪə | mɪr | всего лишь, простой | used to say how small or unimportant something is | Women make up a *mere* 15% of engineers. | Женщины составляют всего лишь 15% инженеров. | merely — лишь
- moderate | adj | ˈmɒdərət | ˈmɑːdərət | умеренный | not too much and not too little | Drive at a *moderate* speed in the rain. | В дождь езжайте с умеренной скоростью.
- sheer | adj | ʃɪə | ʃɪr | чистый, абсолютный; отвесный | complete, used to emphasize; very steep | The *sheer* power of the wind was terrifying. | Сама мощь ветра внушала ужас.
- tremendous | adj | trəˈmendəs |  | огромный, потрясающий | very great in amount or level | There was a *tremendous* noise. | Раздался страшный грохот.
- utter | v | ˈʌtə | ˈʌtər | произносить | to say something | He didn't *utter* a word all evening. | За весь вечер он не произнёс ни слова. | прил. utter — полный, совершенный
- widespread | adj | ˈwaɪdspred |  | широко распространённый | existing in many places or among many people | The disease was *widespread* in Asia and Africa. | Болезнь была широко распространена в Азии и Африке.
