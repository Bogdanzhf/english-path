title: Actions and movement
title_ru: Действия и движение
topic: actions
words:
- dare | v | deə | der | осмеливаться, сметь | to be brave enough to do something | I didn't *dare* to tell her the truth. | Я не осмелился сказать ей правду. | How dare you! — Как ты смеешь!
- motion | n | ˈməʊʃn | ˈmoʊʃn | движение | movement | The *motion* of the ship made me feel sick. | От качки корабля меня укачало. | in slow motion — в замедленной съёмке
- overcome | v | ˌəʊvəˈkʌm | ˌoʊvərˈkʌm | преодолевать | to succeed in dealing with a problem | She *overcame* her fear of flying. | Она преодолела страх перед полётами. | overcome — overcame — overcome
- rid | v | rɪd |  | избавлять | to remove something unwanted | We need to get *rid* of these old clothes. | Нам нужно избавиться от этой старой одежды. | get rid of — избавиться от
- stable | adj | ˈsteɪbl |  | стабильный, устойчивый | firmly fixed; not likely to change | The patient's condition is *stable*. | Состояние пациента стабильное. | сущ. stable — конюшня
- stretch | v | stretʃ |  | растягивать(ся), потягиваться | to make your body or something longer by pulling | *Stretch* your arms above your head. | Потянитесь руками вверх.
- strip | n | strɪp |  | полоска | a long narrow piece | Cut the paper into thin *strips*. | Разрежьте бумагу на тонкие полоски.
