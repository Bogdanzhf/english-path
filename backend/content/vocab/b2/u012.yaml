title: Actions and movement
title_ru: Действия и движение
topic: actions
words:
- abandon | v | əˈbændən |  | бросать, покидать | to leave someone or something and not come back | They had to *abandon* the car in the snow. | Им пришлось бросить машину в снегу.
- accessible | adj | əkˈsesəbl | ækˈsesəbl | доступный | easy to reach or use | The building is *accessible* to wheelchair users. | Здание доступно для людей на колясках.
- adopt | v | əˈdɒpt | əˈdɑːpt | усыновлять; принимать | to take a child as your own; to start using | They *adopted* a little girl. | Они удочерили девочку.
- cancel | v | ˈkænsl |  | отменять | to decide that something planned will not happen | The flight was *cancelled* because of the snow. | Рейс отменили из-за снега. | брит. cancelled, амер. canceled
- dare | v | deə | der | осмеливаться, сметь | to be brave enough to do something | I didn't *dare* to tell her the truth. | Я не осмелился сказать ей правду. | How dare you! — Как ты смеешь!
- improved | adj | ɪmˈpruːvd | ˌɪmˈpruːvd | улучшенный | better than before | The *improved* version is faster. | Улучшенная версия работает быстрее.
- intended | adj | ɪnˈtendɪd | ˌɪnˈtendɪd | предназначенный | planned | The film is *intended* for adults. | Фильм предназначен для взрослых.
- motion | n | ˈməʊʃn | ˈmoʊʃn | движение | movement | The *motion* of the ship made me feel sick. | От качки корабля меня укачало. | in slow motion — в замедленной съёмке
- overcome | v | ˌəʊvəˈkʌm | ˌoʊvərˈkʌm | преодолевать | to succeed in dealing with a problem | She *overcame* her fear of flying. | Она преодолела страх перед полётами. | overcome — overcame — overcome
- recover | v | rɪˈkəvɜː | rɪˈkʌvər | выздоравливать; восстанавливать | to get better; to get back | She *recovered* from the flu quickly. | Она быстро выздоровела после гриппа.
- removed | adj | rɪˈmuːvd | riːˈmuːvd | удалённый, далёкий | far from | His story is far *removed* from reality. | Его рассказ далёк от реальности.
- rid | v | rɪd |  | избавлять | to remove something unwanted | We need to get *rid* of these old clothes. | Нам нужно избавиться от этой старой одежды. | get rid of — избавиться от
- side-step | v | ˈsaɪdstep |  | уклоняться, обходить | to avoid | He *side-stepped* the question. | Он уклонился от ответа. | также sidestep
- stable | adj | ˈsteɪbl |  | стабильный, устойчивый | firmly fixed; not likely to change | The patient's condition is *stable*. | Состояние пациента стабильное. | сущ. stable — конюшня
- strain | v | streɪn |  | напрягать(ся); растягивать | to try very hard; to injure a muscle by using it too much | He *strained* his back lifting the box. | Он потянул спину, поднимая коробку.
- stretch | v | stretʃ |  | растягивать(ся), потягиваться | to make your body or something longer by pulling | *Stretch* your arms above your head. | Потянитесь руками вверх.
- strip | n | strɪp |  | полоска | a long narrow piece | Cut the paper into thin *strips*. | Разрежьте бумагу на тонкие полоски.
- tackle | v | ˈtækl |  | решать, браться за (проблему) | to deal with a difficult problem | The barons wanted to *tackle* the king's abuse of power. | Бароны хотели справиться со злоупотреблениями короля.
- trap | v | træp |  | ловить, заманивать в ловушку | to catch; to keep someone in a place | Several people were *trapped* in the lift. | Несколько человек застряли в лифте.
- unlimited | adj | ʌnˈlɪmɪtɪd | ənˈlɪmətɪd | неограниченный, безлимитный | with no limit | The plan includes *unlimited* data. | В тариф входит безлимитный интернет.
