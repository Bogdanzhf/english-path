title: Thinking and opinions
title_ru: Мысли и мнения
topic: mind
words:
- abundance | n | əˈbʌndəns |  | изобилие | a large amount | There's an *abundance* of fruit in summer. | Летом изобилие фруктов.
- accuracy | n | ˈækjʊrəsi | ˈækjərəsi | точность | being correct | Check the *accuracy* of the figures. | Проверьте точность цифр.
- altitude | n | ˈæltɪtjuːd | ˈæltətuːd | высота (над уровнем моря) | the height above the sea | The plane flew at a high *altitude*. | Самолёт летел на большой высоте.
- asset | n | ˈæset |  | ценное качество; актив | a useful quality or skill; something valuable that you own | Her language skills are a great *asset*. | Знание языков — её большое преимущество.
- caution | n | ˈkɔːʃn |  | осторожность | great care to avoid danger | Drive with *caution* — the road is icy. | Ведите осторожно — дорога скользкая.
- charm | n | tʃɑːm | tʃɑːrm | обаяние, шарм; талисман | a quality that makes people like you; a lucky object | The singer won the audience over with her *charm*. | Певица покорила публику своим обаянием.
- conjunction | n | kənˈdʒʌŋkʃən |  | союз (грам.); сочетание | a word like "and" or "but" | "But" is a *conjunction*. | «But» — союз. | in conjunction with — совместно с
- excellence | n | ˈeksələns |  | превосходство, высокое качество | being excellent | The school is known for academic *excellence*. | Школа славится высоким уровнем обучения.
- honesty | n | ˈɒnəsti | ˈɑːnəsti | честность | the quality of telling the truth | *Honesty* is the most important thing in a friendship. | Честность — самое важное в дружбе. | h не произносится
- loyalty | n | ˈlɔɪəlti |  | верность, лояльность | being loyal | Dogs are known for their *loyalty*. | Собаки славятся верностью.
- majesty | n | ˈmædʒəsti |  | величие; величество | impressive beauty; a title for a king or queen | The *majesty* of the painting impressed everyone. | Величие картины впечатлило всех. | Your Majesty — Ваше Величество
- placement | n | ˈpleɪsmənt |  | размещение; практика | putting in a place; work experience | She did a work *placement* at a bank. | Она проходила практику в банке.
- popularity | n | ˌpɒpjʊˈlærɪti | ˌpɑːpjəˈlerəti | популярность | being popular | The band's *popularity* is growing. | Популярность группы растёт.
- probability | n | ˌprɒbəˈbɪlɪti | ˌprɑːbəˈbɪlətiː | вероятность | how likely something is | The *probability* of rain is high. | Вероятность дождя высока.
- proximity | n | prɒkˈsɪməti | prɑːkˈsɪməti | близость | nearness in space or time | The hotel's main attraction is its *proximity* to the beach. | Главное достоинство отеля — близость к пляжу.
- scope | n | skəʊp | skoʊp | рамки, масштаб; возможности | the range of a subject or activity | That question is beyond the *scope* of this book. | Этот вопрос выходит за рамки данной книги.
- significance | n | sɪɡˈnɪfɪkəns |  | значение, важность | the importance of something | Nobody understood the *significance* of the discovery. | Никто не понимал значения открытия.
- specialty | n | ˈspeɪʃəlti |  | фирменное блюдо; специальность | something someone is known for | Fish soup is the *specialty* of the house. | Уха — фирменное блюдо заведения. | брит. также speciality
- stance | n | stæns |  | позиция, точка зрения | an opinion that you state publicly | The weather service took a firm *stance*. | Метеослужба заняла твёрдую позицию.
- uncertainty | n | ʌnˈsɜːtənti | ənˈsɜːrtənti | неопределённость | not being sure | There's a lot of *uncertainty* about the future. | Будущее очень неопределённо.
