title: Travel and transport
title_ru: Путешествия и транспорт
topic: travel
words:
- booking | n | ˈbʊkɪŋ |  | бронирование | a reservation | I made a *booking* for two. | Я забронировал на двоих.
- crash | v | kræʃ |  | разбиться, врезаться | to hit something with force and break | The car *crashed* into a tree. | Машина врезалась в дерево. | сущ. crash — авария
- deck | n | dek |  | палуба; терраса | the floor of a ship; a wooden floor outside a house | We had dinner on the *deck* of the ship. | Мы ужинали на палубе корабля.
- depot | n | ˈdepəʊ | ˈdiːpoʊ | депо, склад | a place where vehicles or goods are kept | The buses return to the *depot* at night. | Ночью автобусы возвращаются в депо. | t не читается
- liner | n | ˈlaɪnə | ˈlaɪnər | лайнер | a large passenger ship | They crossed the ocean on a *liner*. | Они пересекли океан на лайнере.
- local cuisine | n | ˈləʊkl kwɪˈziːn | ˈloʊkl kwɪˈziːn | местная кухня | food typical of an area | Try the *local cuisine*. | Попробуйте местную кухню.
- navigation | n | ˌnævɪˈɡeɪʃən | ˈnævəˈɡeɪʃən | навигация | finding your way | The car has satellite *navigation*. | В машине есть спутниковая навигация.
- package holiday | n | ˈpækɪdʒ ˈhɒlɪdeɪ | ˈpækədʒ ˈhɑːlədeɪ | турпакет, пакетный тур | a holiday with travel and hotel included | We booked a *package holiday* to Turkey. | Мы купили пакетный тур в Турцию.
- pedestrian | n | pəˈdestriən |  | пешеход | a person walking, not in a vehicle | The path is for *pedestrians* only. | Эта дорожка только для пешеходов.
- rider | n | ˈraɪdə | ˈraɪdər | всадник; ездок | a person riding a horse, bike, etc. | The *rider* fell off his horse. | Всадник упал с лошади.
- rush hour | n | rʌʃ ˈaʊə | rʌʃ ˈaʊər | час пик | the busy time when people travel to and from work | Avoid driving in *rush hour*. | Не ездите в час пик.
- steering wheel | n | ˈstiərɪŋ wiːl | ˈstɪrɪŋ hwiːl | руль | the wheel used to steer a car | Keep both hands on the *steering wheel*. | Держите обе руки на руле.
- terminal | adj | ˈtɜːmɪnl | ˈtɜːrmɪnl | смертельный, неизлечимый; конечный | (of a disease) that cannot be cured and will cause death | She was diagnosed with *terminal* cancer. | У неё обнаружили неизлечимый рак. | сущ. terminal — терминал
- transportation | n | ˌtrænspɔːˈteɪʃn | ˌtrænspərˈteɪʃn | транспорт, перевозка | the system of moving people and goods | Public *transportation* in the city is excellent. | Общественный транспорт в городе отличный. | брит. чаще transport
- trip | v | trɪp |  | спотыкаться | to hit your foot and almost fall | I *tripped* over the cable. | Я споткнулся о провод.
- visa | n | ˈviːzə |  | виза | a document that lets you enter a country | Do I need a *visa* for India? | Нужна ли мне виза в Индию?
- walker | n | ˈwɔːkə | ˈwɔːkər | ходок, любитель пеших прогулок | a person who walks | The path is popular with *walkers*. | Эта тропа популярна среди туристов.
