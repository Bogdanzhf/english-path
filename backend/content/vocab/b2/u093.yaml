title: Communication and language
title_ru: Общение и язык
topic: communication
words:
- applaud | v | əˈplɔːd |  | аплодировать; одобрять | to clap; to praise | Scientists *applauded* the discovery. | Учёные приветствовали это открытие.
- boast | v | bəʊst | boʊst | хвастаться | to talk too proudly about yourself | He always *boasts* about his expensive car. | Он вечно хвастается своей дорогой машиной. | boast about/of something
- certify | v | ˈsɜːtɪfaɪ | ˈsɜːrtɪfaɪ | удостоверять, официально подтверждать | to state officially that something is true | The doctor *certified* that he was fit to work. | Врач официально подтвердил, что он трудоспособен. | certificate — свидетельство
- characterize | v | ˈkerəktɜːaɪz | ˈkerəktəraɪz | характеризовать | to describe the qualities of | The period was *characterized* by war. | Тот период отличался войнами. | брит. также characterise
- congratulate | v | kənˈɡrætʃuleɪt |  | поздравлять | to tell someone you are happy about their success | I *congratulated* her on her new job. | Я поздравил её с новой работой. | congratulate on; Congratulations! — Поздравляю!
- devote | v | dɪˈvəʊt | dɪˈvoʊt | посвящать | to give your time or energy to something | She *devoted* her life to helping children. | Она посвятила жизнь помощи детям. | devote to
- discourage | v | dɪsˈkʌrɪdʒ | dɪsˈkɜːrɪdʒ | обескураживать, отговаривать | to make someone feel less confident or less willing | Don't let one failure *discourage* you. | Не позволяй одной неудаче тебя расстроить. | ≠ encourage
- exclaim | v | ɪkˈskleɪm |  | восклицать | to say something suddenly and loudly | 'That's amazing!' she *exclaimed*. | «Это потрясающе!» — воскликнула она.
- generalize | v | ˈdʒenɜːəlaɪz | ˈdʒenərəlaɪz | обобщать | to make a general statement | You can't *generalize* about all teenagers. | Нельзя обобщать насчёт всех подростков. | брит. также generalise
- glorify | v | ˈɡlɔːrɪfaɪ | ˈɡlɔːrəfaɪ | прославлять, восхвалять | to praise too much | The film *glorifies* violence. | Фильм прославляет насилие.
- hum | v | hʌm |  | напевать без слов; гудеть | to sing with your lips closed; to make a low continuous sound | She *hummed* a tune while she worked. | Работая, она напевала мелодию.
- inquire | v | ɪnˈkwaɪə | ɪnˈkwaɪər | осведомляться, наводить справки | to ask for information | I'm writing to *inquire* about the job. | Пишу, чтобы узнать о вакансии. | брит. также enquire
- interrupt | v | ˈɪntərʌpt | ˌɪntəˈrʌpt | перебивать, прерывать | to stop someone speaking | Sorry to *interrupt*. | Простите, что перебиваю.
- mumble | v | ˈmʌmbl |  | бормотать | to speak quietly and unclearly | He *mumbled* an apology. | Он пробормотал извинение.
- paraphrase | v | ˈpærəfreɪz |  | перефразировать | to say something in different words | Can you *paraphrase* the text in your own words? | Можешь пересказать текст своими словами?
- proclaim | v | prəˈkleɪm | proʊˈkleɪm | провозглашать | to announce publicly and officially | The newspaper *proclaimed* it a national scandal. | Газета объявила это общенациональным скандалом.
- prohibit | v | prəˈhɪbɪt | proʊˈhɪbɪt | запрещать | to officially forbid something | Smoking is *prohibited* in this building. | Курение в этом здании запрещено.
- publicize | v | ˈpʌblɪsaɪz |  | предавать огласке, рекламировать | to make something known to the public | He didn't *publicize* his ideas for twenty years. | Он двадцать лет не обнародовал свои идеи. | брит. также publicise
- quarrel | v | ˈkwɒrəl | ˈkwɔːrəl | ссориться | to argue angrily | The two brothers often *quarrel* about money. | Братья часто ссорятся из-за денег. | сущ. quarrel — ссора
- refute | v | rɪˈfjuːt |  | опровергать | to prove that something is wrong | Historians have *refuted* the idea that the Luddites hated all technology. | Историки опровергли представление, что луддиты ненавидели любую технику.
- signify | v | ˈsɪɡnɪfaɪ |  | означать, показывать | to be a sign of something | A white flag *signifies* surrender. | Белый флаг означает капитуляцию.
