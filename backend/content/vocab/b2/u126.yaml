title: Actions and movement
title_ru: Действия и движение
topic: actions
words:
- accommodate | v | əˈkɒmədeɪt | əˈkɑːmədeɪt | вмещать; размещать | to have enough space for people or things | The hotel can *accommodate* 200 guests. | Отель может разместить 200 гостей. | accommodation — жильё
- blur | v | blɜː | blɜːr | размывать, затуманивать | to make something less clear | Tears *blurred* her vision. | Слёзы застилали ей глаза. | blurred — размытый
- chatter | v | ˈtʃætə | ˈtʃætər | болтать; стучать (о зубах) | to talk quickly about unimportant things; (of teeth) to knock together from cold | My teeth were *chattering* with cold. | У меня стучали зубы от холода.
- deserve | v | dɪˈzɜːv | dɪˈzɜːrv | заслуживать | to have earned something because of what you did | You worked hard — you *deserve* a rest. | Ты много работал — ты заслуживаешь отдыха.
- differ | v | ˈdɪfə | ˈdɪfər | различаться | to be different | Prices *differ* from shop to shop. | Цены различаются от магазина к магазину.
- embrace | v | ɪmˈbreɪs |  | обнимать; принимать (идею) | to hold someone in your arms; to accept an idea happily | They *embraced* at the airport. | Они обнялись в аэропорту.
- exhibit | v | ɪɡˈzɪbɪt |  | выставлять, экспонировать | to show something in a public place | The gallery *exhibits* work by young artists. | Галерея выставляет работы молодых художников. | exhibition — выставка
- itch | v | ɪtʃ |  | чесаться, зудеть | to have a feeling on your skin that makes you want to scratch | The mosquito bite *itched* all night. | Укус комара чесался всю ночь.
- maintain | v | meɪnˈteɪn |  | поддерживать, сохранять | to keep something in good condition or at the same level | It's important to *maintain* a healthy weight. | Важно поддерживать здоровый вес.
- perceive | v | pəˈsiːv | pərˈsiːv | воспринимать | to notice or understand something in a particular way | Animals were *perceived* as machines. | Животных воспринимали как машины.
- pose | v | pəʊz | poʊz | позировать | to sit or stand still to be painted or photographed | We *posed* for a family photo. | Мы позировали для семейного фото. | pose a problem — создавать проблему
- preserve | v | prɪˈzɜːv | prɪˈzɜːrv | сохранять | to keep something in its original state | We must *preserve* old buildings. | Мы должны сохранять старые здания.
- resist | v | rɪˈzɪst |  | сопротивляться, устоять | to fight against something; to stop yourself from doing something | I can't *resist* chocolate. | Не могу устоять перед шоколадом.
- retain | v | rɪˈteɪn |  | сохранять, удерживать | to keep | Try to *retain* your sense of humour. | Постарайтесь сохранять чувство юмора.
- stem | n | stem |  | стебель | the long thin part of a plant that holds the flower | Cut the *stems* before you put the flowers in water. | Подрежьте стебли, прежде чем ставить цветы в воду.
