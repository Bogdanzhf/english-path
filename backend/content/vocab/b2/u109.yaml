title: Actions and movement
title_ru: Действия и движение
topic: actions
words:
- bounce | v | baʊns |  | отскакивать, подпрыгивать | to move up or away after hitting a surface | The ball *bounced* off the wall. | Мяч отскочил от стены.
- collapse | v | kəˈlæps |  | рушиться; падать без сил | to fall down suddenly | The old bridge *collapsed* in the storm. | Старый мост рухнул во время бури.
- dash | v | dæʃ |  | мчаться, бросаться | to run somewhere very quickly | She *dashed* to the station to catch the train. | Она помчалась на вокзал, чтобы успеть на поезд.
- depart | v | dɪˈpɑːt | dɪˈpɑːrt | отправляться, отбывать | to leave, especially on a trip | The plane *departs* at 7:45. | Самолёт вылетает в 7:45. | departure — отправление
- drip | v | drɪp |  | капать | to fall in small drops | Water was *dripping* from the roof. | С крыши капала вода.
- encounter | v | ɪnˈkaʊntə | ɪnˈkaʊntər | сталкиваться, встречать | to meet someone or something, often unexpectedly | We *encountered* many problems on the trip. | В поездке мы столкнулись со многими проблемами.
- escort | v | ɪˈskɔːt | ɪˈskɔːrt | сопровождать | to go with someone to protect or guide them | Rangers *escort* visitors through the reserve. | Рейнджеры сопровождают посетителей по заповеднику.
- flip | v | flɪp |  | переворачивать, листать | to turn over quickly | She nervously *flipped* through the magazine. | Она нервно листала журнал.
- jam | v | dʒæm |  | застревать, заклинивать | to become stuck | The printer *jammed* again. | Принтер снова зажевал бумагу.
- leap | v | liːp |  | прыгать, скакать | to jump high or far | The deer *leapt* over the fence. | Олень перепрыгнул через забор. | leap — leapt/leaped
- navigate | v | ˈnævɪɡeɪt |  | прокладывать путь, ориентироваться | to find the way to a place | Sailors used the stars to *navigate*. | Моряки ориентировались по звёздам.
- shove | v | ʃʌv |  | пихать, толкать | to push roughly | Stop *shoving* — wait your turn! | Перестань толкаться — жди своей очереди!
- slip | v | slɪp |  | поскользнуться; ускользнуть | to slide and fall; to move quietly | I *slipped* on the ice. | Я поскользнулся на льду.
- sneak | v | sniːk |  | красться, пробираться тайком | to go somewhere quietly and secretly | He *sneaked* out of the house at night. | Ночью он тайком выбрался из дома. | амер. прош. часто snuck
- stir | v | stɜː | stɜːr | помешивать | to mix a liquid by moving a spoon round | *Stir* the soup slowly. | Медленно помешивайте суп.
- stroll | v | strəʊl | stroʊl | прогуливаться | to walk slowly for pleasure | We *strolled* along the river after dinner. | После ужина мы прогулялись вдоль реки.
- sweep | v | swiːp |  | подметать | to clean with a brush | *Sweep* the floor, please. | Подмети пол, пожалуйста. | sweep – swept – swept
- tread | v | tred |  | ступать | to step | Don't *tread* on the flowers. | Не наступи на цветы.
- twist | v | twɪst |  | крутить, поворачивать; подвернуть | to turn something round; to hurt a joint by turning it | She *twisted* her ankle while running. | Она подвернула лодыжку во время бега.
- withdraw | v | wɪðˈdrɔː |  | отводить, выводить; снимать (деньги) | to take back or move away; to take money from a bank | The army *withdrew* from the city. | Армия ушла из города. | withdraw — withdrew — withdrawn
