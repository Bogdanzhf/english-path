title: Language for essays
title_ru: Язык аргументации
topic: essay
words:
- beneficial | adj | ˌbenɪˈfɪʃl |  | полезный, благотворный | having a good effect | Exercise is *beneficial* to your health. | Физические упражнения полезны для здоровья.
- considerable | adj | kənˈsɪdərəbl |  | значительный | large in size or amount | The repairs cost a *considerable* amount of money. | Ремонт обошёлся в значительную сумму.
- crucial | adj | ˈkruːʃl |  | крайне важный, решающий | extremely important | The forest plays a *crucial* role in the climate. | Лес играет решающую роль в климате.
- furthermore | adv | ˌfɜːðəˈmɔː | ˈfɜːrðərmɔːr | кроме того, более того | also; in addition | The hotel was cheap. *Furthermore*, it was near the beach. | Отель был дешёвым. Кроме того, он был рядом с пляжем.
- inevitable | adj | ɪnˈevɪtəbl |  | неизбежный | certain to happen | Change is *inevitable*. | Перемены неизбежны.
- justify | v | ˈdʒʌstɪfaɪ |  | оправдывать, обосновывать | to give a good reason for something | How can you *justify* spending so much? | Как ты можешь оправдать такие траты?
- moreover | adv | mɔːrˈəʊvə | mɔːrˈoʊvər | более того, кроме того | used to add more information that supports what you said | The plan is cheap. *Moreover*, it's easy to carry out. | План дешёвый. Более того, его легко осуществить.
- nevertheless | adv | ˌnevəðəˈles | ˌnevərðəˈles | тем не менее | despite what was just said | The weather was bad. *Nevertheless*, we went out. | Погода была плохая. Тем не менее мы пошли гулять.
- nonetheless | adv | ˌnʌnðəˈles |  | тем не менее | despite this | It was hard. *Nonetheless*, they stayed. | Было тяжело. Тем не менее они остались.
- overall | adv | ˌəʊvərˈɔːl | ˌoʊvərˈɔːl | в целом | considering everything | *Overall*, the concert was a great success. | В целом концерт прошёл с огромным успехом.
- substantial | adj | səbˈstænʃl |  | значительный, существенный | large in amount or importance | He received a *substantial* sum as compensation. | Он получил значительную сумму в качестве компенсации.
- whereas | conj | weərˈæz | werˈæz | тогда как, в то время как | used to compare two different facts | Some people want revenge, *whereas* others choose to forgive. | Одни хотят мести, тогда как другие предпочитают прощать.
