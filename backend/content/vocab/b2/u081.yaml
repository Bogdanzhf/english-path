title: Feelings and character
title_ru: Чувства и характер
topic: feelings
words:
- amuse | v | əˈmjuːz |  | забавлять, развлекать | to make someone laugh or smile | His jokes *amused* everyone. | Его шутки всех развеселили. | amusing — забавный
- bad-tempered | adj | ˌbæd ˈtempəd | ˌbæd ˈtempərd | раздражительный, вспыльчивый | easily annoyed | He's *bad-tempered* in the mornings. | По утрам он не в духе.
- bossy | adj | ˈbɒsi | ˈbɔːsi | любящий командовать | always telling others what to do | My sister is so *bossy*! | Моя сестра такая командирша!
- caring | adj | ˈkeərɪŋ | ˈkerɪŋ | заботливый | kind and helpful | She's a very *caring* person. | Она очень заботливый человек.
- clumsy | adj | ˈklʌmzi |  | неуклюжий | moving in an awkward way and often dropping things | I'm so *clumsy* — I've broken another glass. | Я такой неуклюжий — опять разбил стакан.
- cowardly | adj | ˈkaʊədli | ˈkaʊərdli | трусливый | not brave | It was a *cowardly* thing to do. | Это был трусливый поступок.
- daft | adj | dɑːft | dæft | глупый, дурацкий (брит.) | silly | Don't be *daft*! | Не глупи!
- devoted | adj | dɪˈvəʊtɪd | dɪˈvoʊtɪd | преданный | very loving and loyal | He's a *devoted* father. | Он преданный отец.
- eager | adj | ˈiːɡə | ˈiːɡər | жаждущий, нетерпеливый | wanting very much to do something | The children were *eager* to open their presents. | Детям не терпелось открыть подарки.
- emotional | adj | ɪˈməʊʃənl | ˈiːmoʊʃənl | эмоциональный | showing strong feelings | She got very *emotional* at the wedding. | На свадьбе она очень расчувствовалась.
- enthusiastic | adj | ɪnˌθjuːziˈæstɪk | ɪnˌθuːziˈæstɪk | полный энтузиазма | very interested and excited | The students were very *enthusiastic* about the trip. | Студенты были в восторге от поездки.
- fond | adj | fɒnd | fɑːnd | любящий | having feelings of affection | He has *fond* memories of his first climb. | У него остались тёплые воспоминания о первом восхождении. | be fond of — любить
- hilarious | adj | hɪˈleərɪəs | hɪˈleriəs | уморительный | extremely funny | The film was *hilarious*. | Фильм был уморительный.
- irritable | adj | ˈɪrɪtəbl |  | раздражительный | easily annoyed | I get *irritable* when I'm tired. | Когда я устаю, становлюсь раздражительным.
- obsessive | adj | ɒbˈsesɪv | əbˈsesɪv | навязчивый, одержимый | thinking too much about something | He's *obsessive* about cleaning. | Он помешан на чистоте.
- optimistic | adj | ˌɒptɪˈmɪstɪk | ˌɑːptəˈmɪstɪk | оптимистичный | hopeful about the future | I'm *optimistic* about the future. | Я с оптимизмом смотрю в будущее.
- passionate | adj | ˈpæʃənət |  | страстный, увлечённый | having strong feelings | She's *passionate* about music. | Она страстно увлечена музыкой.
- selfless | adj | ˈselfləs |  | самоотверженный | caring about others more than yourself | It was a *selfless* act. | Это был самоотверженный поступок.
- sly | adj | slaɪ |  | хитрый, лукавый | clever at tricking people | He gave me a *sly* smile. | Он хитро мне улыбнулся.
- tempt | v | tempt |  | соблазнять, искушать | to make someone want to do something, often bad | Can I *tempt* you with a piece of cake? | Соблазнить тебя кусочком торта? | tempting — заманчивый
