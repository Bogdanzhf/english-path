title: Everyday phrases
title_ru: Разговорные фразы
topic: phrases
words:
- draw attention to somebody/something | phr |  |  | привлекать внимание к | to make people notice | The campaign *draws attention to* poverty. | Кампания привлекает внимание к бедности.
- engage in something | phr |  |  | заниматься, участвовать в | to take part in | Children should *engage in* sport. | Детям стоит заниматься спортом.
- engaged in something | phr |  |  | занятый (чем-либо) | busy with | They are *engaged in* research. | Они заняты исследованиями.
- ever since | phr |  |  | с тех пор (как) | from that time until now | We've been friends *ever since* school. | Мы дружим со школы.
- exposure to something | phr |  |  | воздействие (чего-либо) | being in contact with | *Exposure to* the sun can damage your skin. | Солнце может повредить кожу.
- far from something | phr |  |  | далеко не | not at all | The work is *far from* finished. | Работа далеко не закончена.
- find yourself doing something | phr |  |  | обнаружить, что делаешь | to realise you are doing something | I *found myself* smiling. | Я поймал себя на том, что улыбаюсь.
- get in | phr |  |  | войти, сесть (в машину); прибыть | to enter; to arrive | What time does the train *get in*? | Во сколько прибывает поезд?
- go off | phr |  |  | сработать (о сигнале); испортиться | to ring; to become bad | My alarm *went off* at six. | Будильник зазвонил в шесть.
- go on to do something | phr |  |  | затем (сделать что-то) | to do something after something else | She *went on to* become a doctor. | Впоследствии она стала врачом.
- had better | phr |  |  | лучше бы, следует | should | You *had better* hurry. | Тебе лучше поторопиться.
- hang on | phr |  |  | подожди(те); держаться | to wait; to hold tightly | *Hang on* a minute! | Подожди минутку!
- human being | phr |  |  | человек | a person | Every *human being* has rights. | У каждого человека есть права.
- i have to say... | phr |  |  | должен сказать… | used to give an honest opinion | *I have to say*, I'm impressed. | Должен сказать, я впечатлён.
- i would say... | phr |  |  | я бы сказал… | used to give a careful opinion | *I would say* she's about forty. | Я бы сказал, ей лет сорок.
- if only... | phr |  |  | если бы только | used to express a wish | *If only* I had more time! | Если бы только у меня было больше времени!
- in action | phr |  |  | в действии | doing an activity | I'd love to see the team *in action*. | Хотел бы я увидеть команду в деле.
- in advance | phr |  |  | заранее | before | Book tickets *in advance*. | Бронируйте билеты заранее.
- in an attempt to do something | phr |  |  | в попытке, пытаясь | trying to | He ran *in an attempt to* catch the bus. | Он побежал, пытаясь успеть на автобус.
- in part | phr |  |  | отчасти | partly | The delay was *in part* my fault. | Задержка отчасти произошла по моей вине.
- in place | phr |  |  | на месте; в силе | in the correct position; existing | The new rules are now *in place*. | Новые правила уже действуют.
- in relation to somebody/something | phr |  |  | по отношению к, касательно | concerning | I have questions *in relation to* the contract. | У меня есть вопросы по договору.
