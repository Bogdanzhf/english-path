- rectangular | adj | rekˈtænɡjʊlə | rekˈtæŋɡjələr | прямоугольный | shaped like a rectangle | We have a *rectangular* table. | У нас прямоугольный стол.
- rusty | adj | ˈrʌsti |  | ржавый; подзабытый | covered in rust; not as good as before | My French is a bit *rusty*. | Мой французский немного подзабылся.
- shabby | adj | ˈʃæbi |  | потрёпанный, обшарпанный | old and in bad condition | He wore a *shabby* coat. | На нём было потрёпанное пальто.
