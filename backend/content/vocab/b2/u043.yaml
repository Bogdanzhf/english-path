title: 'Describing: size, shape and looks'
title_ru: 'Описание: размер, форма, внешний вид'
topic: describing
words:
- barren | adj | ˈbærən |  | бесплодный, голый | not able to produce plants | It's a *barren* desert. | Это бесплодная пустыня.
- blooming | adj | ˈbluːmɪŋ |  | цветущий | having flowers | The garden is full of *blooming* roses. | Сад полон цветущих роз.
