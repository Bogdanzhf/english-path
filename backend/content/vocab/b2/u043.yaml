title: 'Describing: size, shape and looks'
title_ru: 'Описание: размер, форма, внешний вид'
topic: describing
words:
- erect | v | ɪˈrekt |  | воздвигать, возводить | to build or put up something | The stones were *erected* around 2500 BC. | Камни были установлены около 2500 года до н. э.
- glamorous | adj | ˈɡlæmərəs |  | эффектный, гламурный | attractive and exciting | Working all night is not as *glamorous* as it sounds. | Работать ночи напролёт не так эффектно, как кажется.
- lush | adj | lʌʃ |  | пышный, буйный (о растительности) | (of plants) growing thickly and healthily | The island is covered in *lush* jungle. | Остров покрыт буйными джунглями.
- majestic | adj | məˈdʒestɪk |  | величественный | beautiful and impressive | The *majestic* mountains rose above the valley. | Над долиной возвышались величественные горы.
- masculine | adj | ˈmæskjəlɪn |  | мужской, мужественный | having qualities thought typical of men | Tattoos were once seen as *masculine*. | Когда-то татуировки считались мужским делом. | feminine — женственный
- mold | n | məʊld | moʊld | форма (для отливки); плесень | a container used to give a shape to something | The heads were made using *molds*. | Головы изготавливали с помощью форм. | брит. mould
- upright | adj | ˈʌpraɪt |  | вертикальный, прямой | standing straight up | Keep your back *upright*. | Держите спину прямо.
- winding | adj | ˈwaɪndɪŋ |  | извилистый | having many bends | A *winding* path led up the mountain. | В гору вела извилистая тропа.
