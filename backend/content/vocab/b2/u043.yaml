- erect | v | ɪˈrekt |  | воздвигать, возводить | to build or put up something | The stones were *erected* around 2500 BC. | Камни были установлены около 2500 года до н. э.
- glamorous | adj | ˈɡlæmərəs |  | эффектный, гламурный | attractive and exciting | Working all night is not as *glamorous* as it sounds. | Работать ночи напролёт не так эффектно, как кажется.
- lush | adj | lʌʃ |  | пышный, буйный (о растительности) | (of plants) growing thickly and healthily | The island is covered in *lush* jungle. | Остров покрыт буйными джунглями.
- luxurious | adj | lʌɡʒˈjʊrɪəs | ləɡˈʒɜːriəs | роскошный | very comfortable and expensive | They stayed in a *luxurious* hotel. | Они жили в роскошном отеле.
- majestic | adj | məˈdʒestɪk |  | величественный | beautiful and impressive | The *majestic* mountains rose above the valley. | Над долиной возвышались величественные горы.
- microscopic | adj | ˌmaɪkrəˈskɒpɪk | ˌmaɪkrəˈskɑːpɪk | микроскопический | extremely small | *Microscopic* organisms live in water. | В воде живут микроскопические организмы.
- picturesque | adj | ˌpɪktʃəˈresk | ˈpɪktʃərəsk | живописный | pretty to look at | It's a *picturesque* village. | Это живописная деревня.
- plum | n | plʌm |  | слива | a soft purple fruit | I made *plum* jam. | Я сварила сливовое варенье.
