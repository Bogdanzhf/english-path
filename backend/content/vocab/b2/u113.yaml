title: Environment and energy
title_ru: Экология и энергия
topic: environment
words:
- biodegradable | adj | ˌbaɪəʊdɪˈɡreɪdəbl | ˌbaɪoʊdɪˈɡreɪdəbl | биоразлагаемый | able to be broken down naturally by bacteria | These bags are fully *biodegradable*. | Эти пакеты полностью биоразлагаемы.
- biodiversity | n | ˌbaɪəʊdaɪˈvɜːsɪti | ˌbaɪoʊdaɪˈvɜːrsəti | биоразнообразие | the variety of life in an area | Rainforests have great *biodiversity*. | В тропических лесах огромное биоразнообразие.
- carbon dioxide | n | ˌkɑːbən daɪˈɒksaɪd | ˌkɑːrbən daɪˈɑːksaɪd | углекислый газ | the gas produced when people breathe out or when fuel is burned (CO₂) | Trees absorb *carbon dioxide* from the air. | Деревья поглощают углекислый газ из воздуха.
- carbon footprint | n | ˈkɑːbən ˈfʊtprɪnt | ˈkɑːrbən ˈfʊtprɪnt | углеродный след | the amount of CO2 you produce | Flying increases your *carbon footprint*. | Перелёты увеличивают углеродный след.
- climate change | n | ˈklaɪmət tʃeɪndʒ |  | изменение климата | long-term changes in weather | *Climate change* is a global problem. | Изменение климата — глобальная проблема.
- conservation | n | ˌkɒnsəˈveɪʃən | ˌkɑːnsərˈveɪʃən | охрана (природы), сохранение | protecting nature | She works in wildlife *conservation*. | Она занимается охраной дикой природы.
- deforestation | n | dɪˌfɒrɪˈsteɪʃən | dɪˌfɔːrɪˈsteɪʃən | вырубка лесов | cutting down forests | *Deforestation* destroys habitats. | Вырубка лесов разрушает среду обитания.
- 'demand | n | dɪˈmɑːnd | dɪˈmænd | спрос; требование | the need for goods; a firm request | There''s a high *demand* for nurses. | Медсёстры очень востребованы. | гл.: demand — требовать'
- drought | n | draʊt |  | засуха | a long period without rain | The *drought* lasted for years. | Засуха длилась годами. | gh не читается
- eco-friendly | adj | ˌiːkəʊ ˈfrendli | ˌiːkoʊ ˈfrendli | экологичный | not harmful to the environment | We use *eco-friendly* products. | Мы пользуемся экологичными товарами.
- ecological | adj | ˌekəˈlɒdʒɪkl | ekəˈlɑːdʒɪkl | экологический | relating to ecology | It's an *ecological* disaster. | Это экологическая катастрофа.
- emissions | n | ɪˈmɪʃənz |  | выбросы | gases sent into the air | Cars produce harmful *emissions*. | Машины производят вредные выбросы.
- environmentally friendly | adj | ɪnˌvaɪrənˈmentəli ˈfrendli | ɪnˌvaɪrənˈmenəli ˈfrendli | экологичный | not harming the environment | Electric cars are more *environmentally friendly*. | Электромобили экологичнее.
- fuel | v | ˈfjuːəl |  | подпитывать, разжигать | to make stronger | His words *fuelled* the argument. | Его слова подлили масла в огонь.
- generate | v | ˈdʒenəreɪt |  | порождать, производить | to produce or create something | The new menu *generated* a lot of interest. | Новое меню вызвало большой интерес.
- global warming | n | ˈɡləʊbl ˈwɔːmɪŋ | ˈɡloʊbl ˈwɔːrmɪŋ | глобальное потепление | the rise in the earth's temperature | *Global warming* is melting the ice. | Глобальное потепление растапливает льды.
- habitat | n | ˈhæbɪtæt |  | среда обитания | the natural home of an animal or plant | Pollution is destroying the bird's *habitat*. | Загрязнение уничтожает среду обитания птицы.
- landfill | n | ˈlændfɪl |  | свалка, полигон (отходов) | a place where rubbish is buried | Most plastic ends up in *landfill*. | Большая часть пластика оказывается на свалках.
- organic | adj | ɔːˈɡænɪk | ɔːrˈɡænɪk | органический | produced without chemicals; coming from living things | We buy *organic* vegetables. | Мы покупаем органические овощи.
- shortage | n | ˈʃɔːtɪdʒ | ˈʃɔːrtɪdʒ | нехватка, дефицит | a lack of something you need | There is a *shortage* of clean water. | Не хватает чистой воды.
- sustainable | adj | səˈsteɪnəbl |  | устойчивый, экологически рациональный | able to continue without harming nature | We need *sustainable* energy. | Нам нужна устойчивая энергетика.
- wildlife | n | ˈwaɪldlaɪf |  | дикая природа | wild animals and plants | The park is full of *wildlife*. | В парке много диких животных.
