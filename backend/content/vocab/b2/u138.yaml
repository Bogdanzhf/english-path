title: 'Describing: time and age'
title_ru: 'Описание: время, новизна, возраст'
topic: describing
words:
- advance | v | ədˈvɑːns | ədˈvæns | продвигаться вперёд | to move forward; to make progress | Our team *advanced* to the final. | Наша команда вышла в финал. | in advance — заранее
- contemporary | adj | kənˈtemprəri | kənˈtempəreri | современный | belonging to the present time | The café has a *contemporary* design. | У кафе современный дизайн. | сущ. contemporary — современник
- ongoing | adj | ˈɒnɡəʊɪŋ | ˈɑːnɡoʊɪŋ | продолжающийся, текущий | continuing to happen | Research into the drug is *ongoing*. | Исследования препарата продолжаются.
- permanent | adj | ˈpɜːmənənt | ˈpɜːrmənənt | постоянный | lasting for a long time or for ever | She finally got a *permanent* job. | Наконец она нашла постоянную работу.
- prior | adj | ˈpraɪə | ˈpraɪər | предшествующий, прежний | happening before | No *prior* experience is needed. | Предварительный опыт не требуется. | prior to — до
- subsequent | adj | ˈsʌbsɪkwənt |  | последующий | happening after something else | The *subsequent* tests confirmed the results. | Последующие испытания подтвердили результаты. | subsequently — впоследствии
- temporary | adj | ˈtemprəri | ˈtempəreri | временный | lasting only for a short time | I have a *temporary* job for the summer. | У меня временная работа на лето.
