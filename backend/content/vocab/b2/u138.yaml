title: Thinking and opinions
title_ru: Мысли и мнения
topic: mind
words:
- bias | n | ˈbaɪəs |  | предвзятость | an unfair preference for or against something | There was a clear *bias* against women in science. | В науке существовала явная предвзятость по отношению к женщинам.
- capacity | n | kəˈpæsəti |  | способность; вместимость | the ability to do something; the amount something can hold | The forest has a huge *capacity* to store carbon. | Лес обладает огромной способностью накапливать углерод.
- combination | n | ˌkɒmbɪˈneɪʃən | ˌkɑːmbəˈneɪʃən | сочетание, комбинация | things mixed together | It's a *combination* of luck and skill. | Это сочетание удачи и мастерства.
- composition | n | ˌkɒmpəˈzɪʃən | ˌkɑːmpəˈzɪʃən | состав; сочинение | the parts something is made of; a piece of writing or music | Write a *composition* about your family. | Напишите сочинение о своей семье.
- concentration | n | ˌkɒnsənˈtreɪʃən | ˌkɑːnsənˈtreɪʃən | концентрация, сосредоточенность | giving full attention | This job needs total *concentration*. | Эта работа требует полной сосредоточенности.
- courage | n | ˈkʌrɪdʒ | ˈkɜːrɪdʒ | смелость, мужество | the ability to do something dangerous or difficult | It takes *courage* to say you were wrong. | Нужно мужество, чтобы признать свою ошибку.
- exposure | n | ɪkˈspəʊʒə | ɪkˈspoʊʒər | воздействие; разоблачение | being in contact with something; revealing | Too much *exposure* to the sun is harmful. | Чрезмерное пребывание на солнце вредно.
- humanity | n | hjuːˈmænɪti |  | человечество; человечность | all people; kindness | It's a crime against *humanity*. | Это преступление против человечества.
- infinite | adj | ˈɪnfɪnət |  | бесконечный | without limits | The universe may be *infinite*. | Вселенная, возможно, бесконечна.
- initiative | n | ɪˈnɪʃiətɪv | ˌɪˈnɪʃətɪv | инициатива | the ability to act without being told; a new plan | She showed great *initiative*. | Она проявила большую инициативу.
- justice | n | ˈdʒʌstɪs |  | справедливость, правосудие | fair treatment; the legal system | The victims' families want *justice*. | Семьи пострадавших требуют справедливости.
- majority | n | məˈdʒɒrəti | məˈdʒɔːrəti | большинство | more than half | The *majority* of species died out. | Большинство видов вымерло.
- mode | n | məʊd | moʊd | режим, способ | a particular way of doing something | Switch your phone to silent *mode*. | Переключи телефон в беззвучный режим.
- motivation | n | ˌməʊtɪˈveɪʃən | ˌmoʊtəˈveɪʃən | мотивация | the reason or desire to do something | He lacks *motivation*. | Ему не хватает мотивации.
- motive | n | ˈməʊtɪv | ˈmoʊtɪv | мотив, побуждение | a reason for doing something | What was his *motive* for lying? | Каков был его мотив для лжи?
- origin | n | ˈɒrɪdʒɪn | ˈɔːrədʒən | происхождение | where something comes from | What is the *origin* of this word? | Каково происхождение этого слова?
- overload | n | ˈəʊvələʊd | ˈoʊvərloʊd | перегрузка | too much of something | Information *overload* can cause stress. | Информационная перегрузка может вызывать стресс.
- polish | v | ˈpɒlɪʃ | ˈpɑːlɪʃ | полировать, начищать | to rub something to make it shine | He *polished* his shoes before the interview. | Он начистил ботинки перед собеседованием. | Polish [ˈpəʊlɪʃ] — польский
- sequence | n | ˈsiːkwəns |  | последовательность | a series of things in a particular order | Follow the steps in the correct *sequence*. | Выполняйте шаги в правильной последовательности.
- timing | n | ˈtaɪmɪŋ |  | выбор времени, тайминг | choosing when to do something | Good *timing* is important in comedy. | В комедии важно чувство времени.
