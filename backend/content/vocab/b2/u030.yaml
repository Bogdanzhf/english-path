title: Places and the city
title_ru: Город и места
topic: city
words:
- auditorium | n | ˌɔːdɪˈtɔːriəm |  | зрительный зал, аудитория | the part of a theatre where people sit | The *auditorium* holds 2,000 people. | Зрительный зал вмещает 2000 человек.
- backyard | n | ˈbækjɑːd | ˈbækjɑːrd | задний двор | the area behind a house | The kids are playing in the *backyard*. | Дети играют на заднем дворе.
- barbershop | n | ˈbɑːbəʃɒp | ˈbɑːrbərʃɑːp | парикмахерская (мужская) | a shop where men get haircuts | He goes to the *barbershop* every month. | Он ходит в барбершоп каждый месяц.
- barrier | n | ˈbæriə | ˈbæriər | барьер, преграда | something that stops people moving or doing something | Language can be a *barrier* to making friends. | Язык может мешать заводить друзей.
- basement | n | ˈbeɪsmənt |  | подвал, цокольный этаж | a room below the ground floor | We keep old furniture in the *basement*. | Старую мебель мы храним в подвале.
- brewery | n | ˈbruːəri |  | пивоварня | a place where beer is made | We visited a local *brewery*. | Мы побывали на местной пивоварне.
- cellar | n | ˈselə | ˈselər | подвал, погреб | a room under a house | We keep wine in the *cellar*. | Мы храним вино в погребе.
- corridor | n | ˈkɒrɪdɔː | ˈkɔːrɪdər | коридор | a long narrow passage in a building | Her office is at the end of the *corridor*. | Её кабинет в конце коридора.
- courtyard | n | ˈkɔːtjɑːd | ˈkɔːrtjɑːrd | внутренний двор | an open space surrounded by walls or buildings | The hotel has a lovely *courtyard* with a fountain. | В отеле чудесный внутренний дворик с фонтаном.
- dock | n | dɒk | dɑːk | док, причал; скамья подсудимых | a place where ships are loaded or repaired | The ship was in *dock* for repairs. | Корабль стоял в доке на ремонте. | гл. dock — причаливать
- doorway | n | ˈdɔːweɪ | ˈdɔːrweɪ | дверной проём | the space where a door is | She stood in the *doorway*. | Она стояла в дверях.
- frontier | n | ˈfrʌntɪə | frʌnˈtɪr | граница; рубеж | a border between countries; the edge of known territory | Space is the final *frontier*. | Космос — последний рубеж.
- gateway | n | ˈɡeɪtweɪ |  | ворота; путь (к чему-либо) | an entrance; a way to reach something | The city is the *gateway* to the north. | Город — ворота на север.
- ghetto | n | ˈɡetəʊ | ˈɡetoʊ | гетто | a poor area where one group of people live | He grew up in a *ghetto*. | Он вырос в гетто.
- headquarters | n | ˌhedˈkwɔːtəz | ˈhedkwɔːrtərz | штаб-квартира | the main office of an organization | The company's *headquarters* is in London. | Штаб-квартира компании в Лондоне. | сокр. HQ
- hoop | n | huːp |  | обруч, кольцо | a large ring of wood, metal or plastic | Children played with *hoops* in the playground. | Дети играли с обручами на площадке.
- monument | n | ˈmɒnjumənt | ˈmɑːnjumənt | памятник, монумент | a structure built to remember a person or event | A *monument* marks the place where he was found. | На месте находки установлен памятник.
- nightclub | n | ˈnaɪtklʌb |  | ночной клуб | a club open late for dancing | They went to a *nightclub*. | Они пошли в ночной клуб.
- outskirts | n | ˈaʊtskɜːts | ˈaʊtskɜːrts | окраина | the outer areas of a city | They live on the *outskirts* of Moscow. | Они живут на окраине Москвы.
- porch | n | pɔːtʃ | pɔːrtʃ | крыльцо, веранда | a covered area at the entrance of a house | We sat on the *porch* in the evening. | Вечером мы сидели на крыльце.
- shelter | n | ˈʃeltə | ˈʃeltər | укрытие, приют | a place that protects from danger or bad weather | They took *shelter* from the rain under a tree. | Они укрылись от дождя под деревом.
- spa | n | spɑː |  | спа, курорт | a place for health and beauty treatments | We spent a day at the *spa*. | Мы провели день в спа.
- terrace | n | ˈterəs |  | терраса; ряд домов | a flat area outside a building; a row of joined houses | We had lunch on the *terrace*. | Мы обедали на террасе.
- tunnel | n | ˈtʌnl |  | туннель | an underground passage | The train went into a long *tunnel*. | Поезд въехал в длинный туннель.
