title: Thinking and opinions
title_ru: Мысли и мнения
topic: mind
words:
- bravery | n | ˈbreɪvəri |  | храбрость | courage | He received a medal for *bravery*. | Он получил медаль за храбрость.
- disguise | n | dɪsˈɡaɪz |  | маскировка, переодевание | clothes or things used to hide who you are | The thief wore a *disguise*. | Вор был переодет. | in disguise — переодетый
- greed | n | ɡriːd |  | жадность | a strong desire for more than you need | *Greed* destroyed the forest, according to one theory. | Согласно одной теории, лес погубила жадность.
- innocence | n | ˈɪnəsns |  | невиновность; наивность | not being guilty; not knowing about bad things in life | The child's *innocence* made everyone smile. | Детская наивность заставила всех улыбнуться.
- novelty | n | ˈnɒvlti | ˈnɑːvlti | новизна, новинка | the quality of being new and unusual | The *novelty* of the new phone soon wore off. | Новизна нового телефона быстро прошла.
- proximity | n | prɒkˈsɪməti | prɑːkˈsɪməti | близость | nearness in space or time | The hotel's main attraction is its *proximity* to the beach. | Главное достоинство отеля — близость к пляжу.
- stain | n | steɪn |  | пятно | a dirty mark that is difficult to remove | There's a coffee *stain* on my shirt. | У меня на рубашке пятно от кофе.
- trait | n | treɪt |  | черта (характера) | a quality that is part of someone's character | Kindness is her best *trait*. | Доброта — её лучшая черта.
