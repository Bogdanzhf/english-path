- hygienic | adj | haɪˈdʒiːnɪk | haɪˈdʒenɪk | гигиеничный | clean and not likely to spread disease | The kitchen wasn't very *hygienic*. | Кухня была не очень чистой.
- lunar | adj | ˈluːnə | ˈluːnər | лунный | connected with the Moon | A *lunar* eclipse is visible tonight. | Сегодня ночью будет видно лунное затмение.
- mechanism | n | ˈmekənɪzəm |  | механизм | a system of parts or a process that makes something work | The body has natural *mechanisms* to control temperature. | В организме есть естественные механизмы регуляции температуры.
- psychology | n | saɪˈkɒlədʒi | saɪˈkɑːlədʒi | психология | the study of the mind and behaviour | She's doing a degree in *psychology*. | Она получает степень по психологии. | p не читается
