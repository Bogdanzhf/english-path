title: Science and research
title_ru: Наука и исследования
topic: science
words:
- archaeology | n | ˌɑːkiˈɒlədʒi | ˌɑːrkiˈɑːlədʒi | археология | the study of the past through old objects and buildings | She studied *archaeology* at Cambridge. | Она изучала археологию в Кембридже. | амер. также archeology
- astronomy | n | əˈstrɒnəmi | əˈstrɑːnəmi | астрономия | the study of stars and planets | He got a telescope because he loves *astronomy*. | Он купил телескоп, потому что обожает астрономию.
