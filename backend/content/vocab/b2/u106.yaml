title: 'Describing: qualities'
title_ru: 'Описание: свойства и признаки'
topic: describing
words:
- adopted | adj | əˈdɒptɪd | əˈdɑːptɪd | приёмный | taken into a family | She is their *adopted* daughter. | Она их приёмная дочь.
- brief | adj | briːf |  | краткий, короткий | lasting only a short time | We had a *brief* conversation in the corridor. | Мы коротко поговорили в коридоре. | briefly — кратко
- complicated | adj | ˈkɒmplɪkeɪtɪd | ˈkɑːmpləkeɪtəd | сложный, запутанный | difficult to understand | The rules are *complicated*. | Правила сложные.
- detailed | adj | ˈdiːteɪld | dɪˈteɪld | подробный | with many details | She gave a *detailed* description. | Она дала подробное описание.
- divided | adj | dɪˈvaɪdɪd |  | разделённый | separated into parts; disagreeing | The country is *divided* on this issue. | Страна разделилась по этому вопросу.
- evil | adj | ˈiːvl |  | злой, злобный | very bad and cruel | In the film, the *evil* king wants to rule the world. | В фильме злой король хочет править миром.
- fake | adj | feɪk |  | поддельный, фальшивый | not real; made to look real | The police found *fake* money in his car. | Полиция нашла в его машине фальшивые деньги.
- hidden | adj | ˈhɪdn |  | спрятанный, скрытый | not easy to see or find | There's a *hidden* camera in the room. | В комнате спрятана камера.
- high-profile | adj | ˌhaɪˈprəʊfaɪl | ˌhaɪˈproʊfaɪl | громкий, известный | well known | It's a *high-profile* case. | Это громкое дело.
- offensive | adj | əˈfensɪv |  | оскорбительный; наступательный | rude; attacking | His jokes were *offensive*. | Его шутки были оскорбительными.
- opposed | adj | əˈpəʊzd | əˈpoʊzd | противоположный; против | disagreeing | I'm *opposed* to the idea. | Я против этой идеи.
- pure | adj | pjʊə | pjʊr | чистый | not mixed with anything | This sweater is made of *pure* wool. | Этот свитер из чистой шерсти.
- reasonable | adj | ˈriːzənəbl |  | разумный; приемлемый | fair and sensible; not too expensive | The prices are *reasonable*. | Цены разумные.
- secure | adj | sɪˈkjʊə | sɪˈkjʊr | надёжный, безопасный | safe; protected | Keep your passport in a *secure* place. | Храните паспорт в надёжном месте. | гл. secure — обеспечить, получить
- 'solo | adj | ˈsəʊləʊ | ˈsoʊloʊ | сольный | done alone | She made a *solo* album. | Она выпустила сольный альбом. | сущ.: solo — соло'
- superior | adj | suːˈpɪəriə | suːˈpɪriər | превосходящий, лучший | better than others | This camera is *superior* to the old model. | Эта камера лучше старой модели. | superior to
- surrounding | adj | səˈraʊndɪŋ |  | окружающий | around | The *surrounding* countryside is beautiful. | Окрестности прекрасны.
- upper | adj | ˈʌpə | ˈʌpər | верхний | higher in position | Our room is on the *upper* floor. | Наша комната на верхнем этаже.
- visible | adj | ˈvɪzəbl |  | видимый | able to be seen | The island is *visible* from here. | Отсюда виден остров.
- vital | adj | ˈvaɪtl |  | жизненно важный | extremely important; necessary | Water is *vital* for life. | Вода жизненно важна.
