title: 'Describing: qualities'
title_ru: 'Описание: свойства и признаки'
topic: describing
words:
- deceptive | adj | dɪˈseptɪv |  | обманчивый, вводящий в заблуждение | likely to make you believe something that is not true | Appearances can be *deceptive*. | Внешность бывает обманчива.
- disgraceful | adj | dɪsˈɡreɪsfl |  | позорный, возмутительный | very bad and shocking | His behaviour at the party was *disgraceful*. | Его поведение на вечеринке было возмутительным.
- disobedient | adj | ˌdɪsəˈbiːdiənt |  | непослушный | refusing to do what you are told | The *disobedient* pupils were sent to the head teacher. | Непослушных учеников отправили к директору.
- evil | adj | ˈiːvl |  | злой, злобный | very bad and cruel | In the film, the *evil* king wants to rule the world. | В фильме злой король хочет править миром.
- fake | adj | feɪk |  | поддельный, фальшивый | not real; made to look real | The police found *fake* money in his car. | Полиция нашла в его машине фальшивые деньги.
- prime | adj | praɪm |  | главный, основной | most important | Safety is our *prime* concern. | Безопасность — наша главная забота. | Prime Minister — премьер-министр
- upper | adj | ˈʌpə | ˈʌpər | верхний | higher in position | Our room is on the *upper* floor. | Наша комната на верхнем этаже.
