title: Free time and sport
title_ru: Досуг и спорт
topic: leisure
words:
- animation | n | ˌænɪˈmeɪʃən | ˌænəˈmeɪʃən | анимация, мультипликация | making cartoons | She studies *animation*. | Она изучает анимацию.
- auction | n | ˈɔːkʃən | ˈɑːkʃən | аукцион | a sale where people bid | The painting was sold at *auction*. | Картину продали на аукционе.
- carnival | n | ˈkɑːnɪvl | ˈkɑːrnəvl | карнавал | a public festival with music and costumes | We went to the *carnival* in Rio. | Мы побывали на карнавале в Рио.
- endurance | n | ɪnˈdjɔːrəns | ˈendərəns | выносливость | the ability to keep going | Running a marathon takes *endurance*. | Бег на марафон требует выносливости.
- excursion | n | ɪkˈskɜːʃən | ɪkˈskɜːrʒən | экскурсия, поездка | a short trip | We went on an *excursion* to the castle. | Мы съездили на экскурсию в замок.
- firework | n | ˈfaɪəwɜːk | ˈfaɪrwɜːrk | фейерверк | a device that explodes in coloured lights | We watched the *fireworks*. | Мы смотрели фейерверк.
- karaoke | n | ˌkærɪˈəʊki | ˌkeriːˈoʊki | караоке | singing to recorded music | Let's go to *karaoke*! | Пойдём в караоке!
- orchestra | n | ˈɔːkestrə | ˈɔːrkəstrə | оркестр | a large group of musicians | She plays violin in an *orchestra*. | Она играет на скрипке в оркестре.
- parade | n | pəˈreɪd |  | парад, шествие | a public procession | A colourful *parade* marks the annual festival. | Красочное шествие открывает ежегодный фестиваль.
- recreation | n | ˌrekrɪˈeɪʃən | ˌrekriːˈeɪʃən | отдых, развлечение | activities for fun | The park is used for *recreation*. | Парк используется для отдыха.
- referee | n | ˌrefəˈriː |  | судья (в спорте); рекомендатель | an official who controls a sports game; a person who gives a reference | The *referee* showed him a red card. | Судья показал ему красную карточку.
- rehearsal | n | rɪˈhɜːsl | riːˈhɜːrsl | репетиция | practice before a performance | We have a *rehearsal* tonight. | Вечером у нас репетиция.
- relaxation | n | rɪləkˈseɪʃən | ˌriːlækˈseɪʃən | отдых, расслабление | rest and calm | I read for *relaxation*. | Я читаю, чтобы расслабиться.
- scuba | n | ˈskuːbə |  | акваланг | equipment for breathing under water | We went *scuba* diving. | Мы ныряли с аквалангом.
- snowball | n | ˈsnəʊbɔːl | ˈsnoʊbɔːl | снежок | a ball of snow | The children had a *snowball* fight. | Дети играли в снежки.
- soundtrack | n | ˈsaʊndtræk | ˈsaʊntræk | саундтрек | the music of a film | The film has a great *soundtrack*. | У фильма отличный саундтрек.
- sprint | v | sprɪnt |  | бежать на короткую дистанцию, мчаться | to run very fast for a short distance | He *sprinted* to catch the bus. | Он помчался, чтобы успеть на автобус.
- tournament | n | ˈtʊənəmənt | ˈtʊrnəmənt | турнир | a competition with many games | Electric cars now race in their own *tournament*. | Электромобили теперь участвуют в собственных соревнованиях.
- trek | n | trek |  | поход, долгое путешествие | a long hard walk | We went on a *trek* in the mountains. | Мы ходили в поход в горы.
