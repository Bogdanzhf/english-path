title: Thinking and opinions
title_ru: Мысли и мнения
topic: mind
words:
- acceleration | n | əkˌseləˈreɪʃən | ˌækˌseləˈreɪʃən | ускорение | getting faster | The car has fast *acceleration*. | Машина быстро разгоняется.
- accessibility | n | əkˌsesəˈbɪlɪti | ˌæksesəˈbɪlɪti | доступность | being easy to reach or use | We need to improve *accessibility* for disabled people. | Нужно улучшить доступность для людей с инвалидностью.
- bravery | n | ˈbreɪvəri |  | храбрость | courage | He received a medal for *bravery*. | Он получил медаль за храбрость.
- disguise | n | dɪsˈɡaɪz |  | маскировка, переодевание | clothes or things used to hide who you are | The thief wore a *disguise*. | Вор был переодет. | in disguise — переодетый
- functionality | n | ˌfʌŋkʃəˈnælɪti |  | функциональность | the range of functions | The new version has more *functionality*. | В новой версии больше функций.
- generosity | n | ˌdʒenəˈrɒsɪti | ˌdʒenəˈrɑːsəti | щедрость | being generous | Thank you for your *generosity*. | Спасибо за вашу щедрость.
- getaway | n | ˈɡetəweɪ |  | побег; короткий отдых | an escape; a short holiday | We planned a weekend *getaway*. | Мы запланировали отдых на выходные.
- glamour | n | ˈɡlæmə | ˈɡlæmər | гламур, блеск, очарование | the exciting and attractive quality of rich or famous people | She was attracted by the *glamour* of Hollywood. | Её привлекал блеск Голливуда. | амер. также glamor
- greatness | n | ˈɡreɪtnəs |  | величие | being great | He achieved *greatness* as a writer. | Он достиг величия как писатель.
- greed | n | ɡriːd |  | жадность | a strong desire for more than you need | *Greed* destroyed the forest, according to one theory. | Согласно одной теории, лес погубила жадность.
- innocence | n | ˈɪnəsns |  | невиновность; наивность | not being guilty; not knowing about bad things in life | The child's *innocence* made everyone smile. | Детская наивность заставила всех улыбнуться.
- novelty | n | ˈnɒvlti | ˈnɑːvlti | новизна, новинка | the quality of being new and unusual | The *novelty* of the new phone soon wore off. | Новизна нового телефона быстро прошла.
- patriotism | n | ˈpætrɪətɪzəm | ˈpeɪtriətɪzəm | патриотизм | love of your country | The song is full of *patriotism*. | Песня полна патриотизма.
- persistence | n | pəˈsɪstəns | pərˈsɪstəns | настойчивость, упорство | continuing despite difficulty | Success needs *persistence*. | Успех требует упорства.
- radius | n | ˈreɪdɪəs | ˈreɪdiəs | радиус | the distance from the centre of a circle to its edge | Shops within a two-mile *radius*. | Магазины в радиусе двух миль.
- scarlet | adj | ˈskɑːlət | ˈskɑːrlət | алый | bright red | She wore a *scarlet* dress. | На ней было алое платье.
- stain | n | steɪn |  | пятно | a dirty mark that is difficult to remove | There's a coffee *stain* on my shirt. | У меня на рубашке пятно от кофе.
- thickness | n | ˈθɪknəs |  | толщина | how thick something is | The walls are a metre in *thickness*. | Толщина стен — метр.
- trait | n | treɪt |  | черта (характера) | a quality that is part of someone's character | Kindness is her best *trait*. | Доброта — её лучшая черта.
- willingness | n | ˈwɪlɪŋnəs |  | готовность, желание | being willing | She showed a *willingness* to learn. | Она проявила желание учиться.
