- cell | n | sel |  | клетка; камера | the smallest living part of a plant or animal; a small room in a prison | Your body is made of billions of *cells*. | Ваше тело состоит из миллиардов клеток. | cell phone — мобильный (амер.)
- chemotherapy | n | ˌkiːməʊˈθerəpi | ˌkiːmoʊˈθerəpi | химиотерапия | treatment for cancer with drugs | She's having *chemotherapy*. | Она проходит химиотерапию.
- eclipse | n | ɪˈklɪps | əˈklɪps | затмение | when the moon or earth blocks the sun's light | We watched the solar *eclipse*. | Мы наблюдали солнечное затмение.
- hypothesis | n | haɪˈpɒθəsɪs | haɪˈpɑːθəsɪs | гипотеза | an idea that has not yet been proved | The experiment supported his *hypothesis*. | Эксперимент подтвердил его гипотезу. | мн. hypotheses
- launch | v | lɔːntʃ |  | запускать | to send a rocket into space; to start something | The first shuttle was *launched* in 1981. | Первый шаттл был запущен в 1981 году.
- light year | n | laɪt ˈjiə | laɪt jɪr | световой год | the distance light travels in a year | The star is ten *light years* away. | Звезда находится в десяти световых годах.
- mercury | n | ˈmɜːkjʊri | ˈmɜːrkjəri | ртуть; Меркурий | a liquid metal; the closest planet to the sun | Old thermometers contained *mercury*. | В старых градусниках была ртуть.
- meteorite | n | ˈmiːtɪɔːraɪt | ˈmiːtiːɔːraɪt | метеорит | a rock from space that hits the earth | A *meteorite* fell in Siberia. | В Сибири упал метеорит.
- nitrogen | n | ˈnaɪtrədʒən |  | азот | a gas that makes up most of the air | Air is 78% *nitrogen*. | Воздух на 78% состоит из азота.
- oxygen | n | ˈɒksɪdʒən | ˈɑːksɪdʒən | кислород | the gas in the air that we need to breathe | Plants produce *oxygen*. | Растения вырабатывают кислород.
- phenomenon | n | fəˈnɒmɪnən | fəˈnɑːmɪnɑːn | явление, феномен | something that happens or exists, often unusual | Electric cars have become a global *phenomenon*. | Электромобили стали мировым явлением. | мн. phenomena
- rocket | n | ˈrɒkɪt | ˈrɑːkət | ракета | a vehicle that flies into space | The *rocket* was launched successfully. | Ракета успешно стартовала.
