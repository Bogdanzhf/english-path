- telescope | n | ˈtelɪskəʊp | ˈtelɪskoʊp | телескоп | an instrument for looking at faraway things | Through the *telescope*, we saw the rings of Saturn. | В телескоп мы увидели кольца Сатурна.
- the Milky Way | n | ðə ˈmɪlki weɪ |  | Млечный Путь | our galaxy | Our sun is a star in *the Milky Way*. | Наше Солнце — звезда Млечного Пути.
- universe | n | ˈjuːnɪvɜːs | ˈjuːnəvɜːrs | вселенная | everything that exists in space | The *universe* is billions of years old. | Вселенной миллиарды лет.
