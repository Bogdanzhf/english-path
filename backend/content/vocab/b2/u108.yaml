words:
- aluminum | n | əˈluːmɪnəm |  | алюминий | a light silver-coloured metal | The bikes have *aluminum* frames. | У велосипедов алюминиевые рамы. | брит. aluminium [ˌæljəˈmɪniəm]
- asteroid | n | ˈæstərɔɪd |  | астероид | a large rock that travels around the Sun | An *asteroid* hit the Earth 66 million years ago. | 66 миллионов лет назад в Землю врезался астероид.
- calcium | n | ˈkælsiəm |  | кальций | a mineral in bones and milk | Milk is rich in *calcium*. | В молоке много кальция.
