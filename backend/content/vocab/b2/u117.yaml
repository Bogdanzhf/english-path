title: Science and research
title_ru: Наука и исследования
topic: science
words:
- coral | n | ˈkɒrəl | ˈkɔːrəl | коралл | a hard substance made by small sea animals | The *coral* was red, pink and orange. | Кораллы были красными, розовыми и оранжевыми.
- fossil | n | ˈfɒsl | ˈfɑːsl | окаменелость | the remains of an ancient animal or plant in rock | They found a dinosaur *fossil*. | Они нашли окаменелость динозавра.
- latitude | n | ˈlætɪtjuːd | ˈlætɪtuːd | широта | the distance north or south of the equator | The city lies at a *latitude* of 55 degrees north. | Город расположен на 55 градусе северной широты. | longitude — долгота
- lava | n | ˈlɑːvə |  | лава | hot liquid rock that comes out of a volcano | Red-hot *lava* flowed down the mountain. | Раскалённая лава текла вниз по склону.
- microbe | n | ˈmaɪkrəʊb | ˈmaɪkroʊb | микроб | a very small living thing that can only be seen under a microscope | Some *microbes* cause disease. | Некоторые микробы вызывают болезни.
- microscope | n | ˈmaɪkrəskəʊp | ˈmaɪkrəskoʊp | микроскоп | an instrument that makes very small things look bigger | Look at the cells under the *microscope*. | Посмотрите на клетки под микроскопом.
- particle | n | ˈpɑːtɪkl | ˈpɑːrtɪkl | частица | a very small piece of something | *Particles* of dust floated in the sunlight. | В солнечном свете плавали пылинки.
- relativity | n | ˌreləˈtɪvəti |  | относительность | Einstein's theory about space, time and motion | Einstein published his theory of *relativity* in 1905. | Эйнштейн опубликовал теорию относительности в 1905 году.
