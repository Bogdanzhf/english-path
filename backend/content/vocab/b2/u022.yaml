title: Body and health
title_ru: Тело и здоровье
topic: body
words:
- bleed | v | bliːd |  | кровоточить | to lose blood | Your finger is *bleeding*! | У тебя палец кровоточит! | bleed — bled — bled
- blink | v | blɪŋk |  | моргать | to close and open your eyes quickly | He *blinked* in the bright sunlight. | Он заморгал от яркого солнца.
- cramp | n | kræmp |  | судорога | a sudden pain in a muscle | I got *cramp* in my leg while swimming. | Во время плавания у меня свело ногу.
- flush | v | flʌʃ |  | краснеть; смывать | to become red in the face; to clean with water | He *flushed* with anger. | Он покраснел от гнева.
- frown | v | fraʊn |  | хмуриться | to move your eyebrows together when angry or worried | The teacher *frowned* at the noisy students. | Учитель нахмурился, глядя на шумных учеников.
- scar | n | skɑː | skɑːr | шрам | a mark left on the skin after a wound | He has a *scar* on his forehead. | У него на лбу шрам.
- snore | v | snɔː | snɔːr | храпеть | to breathe noisily while sleeping | My husband *snores* loudly. | Мой муж громко храпит.
- sob | v | sɒb | sɑːb | рыдать | to cry noisily | She *sobbed* with relief when she heard the news. | Услышав новость, она разрыдалась от облегчения.
- spit | v | spɪt |  | плевать(ся) | to force liquid or food out of your mouth | It's rude to *spit* in the street. | Плевать на улице невежливо. | spit — spat — spat
- wound | v | wuːnd |  | ранить | to injure someone with a weapon | He was badly *wounded* in the leg. | Он был тяжело ранен в ногу. | сущ. wound — рана
- yawn | v | jɔːn |  | зевать | to open your mouth wide and breathe in deeply when tired or bored | Seeing someone yawn makes me *yawn* too. | Когда кто-то зевает, мне тоже хочется зевнуть. | сущ. yawn — зевок
