title: Function words
title_ru: Служебные слова
topic: grammar
words:
- alongside | prep | əˌlɒŋˈsaɪd | əˌlɔːŋˈsaɪd | рядом, бок о бок | next to; together with | He worked *alongside* his former enemies. | Он работал бок о бок с бывшими врагами.
- amongst | prep | əˈmʌŋst |  | среди | among | She was *amongst* the winners. | Она была среди победителей. | брит., книжн.
- aside | adv | əˈsaɪd |  | в сторону | to one side; for later use | She put some money *aside* for a holiday. | Она отложила немного денег на отпуск. | aside from — кроме
- beneath | prep | bɪˈniːθ |  | под, внизу | under or below something | The cat slept *beneath* the table. | Кошка спала под столом.
- besides | prep | bɪˈsaɪdz | ˌbiːˈsaɪdz | кроме, помимо | in addition to | *Besides* English, she speaks French. | Кроме английского, она говорит по-французски.
- concerning | prep | kənˈsɜːnɪŋ | kənˈsɜːrnɪŋ | относительно, касательно | about | I have a question *concerning* my bill. | У меня вопрос по поводу счёта.
- considering | prep | kənˈsɪdərɪŋ |  | учитывая | taking into account | *Considering* the weather, we did well. | Учитывая погоду, мы справились хорошо.
- economically | adv | ˌiːkəˈnɒmɪkli | ˌekəˈnɑːmɪkli | экономически; экономно | in terms of money; without waste | The country is *economically* strong. | Страна экономически сильна.
- exit | n | ˈeksɪt | ˈeɡzɪt | выход | a way out of a building or place | The emergency *exit* is at the back. | Запасной выход сзади.
- historically | adv | hɪˈstɒrɪkli | hɪˈstɔːrɪkəli | исторически | in history | *Historically*, the city was a port. | Исторически город был портом.
- individually | adv | ˌɪndɪˈvɪdʒuːəli | ˌɪndɪˈvɪdʒəli | по отдельности, индивидуально | separately | The teacher spoke to each student *individually*. | Учитель поговорил с каждым учеником отдельно.
- interestingly | adv | ˈɪntrəstɪŋli | ˈɪntərestɪŋli | что интересно | used to say something is interesting | *Interestingly*, nobody noticed. | Что интересно, никто не заметил.
- locally | adv | ˈləʊkəli | ˈloʊkəli | на месте, поблизости | in the local area | We buy vegetables *locally*. | Мы покупаем овощи у местных.
- nearby | adj | niəˈbaɪ | ˈnɪrˈbaɪ | близлежащий, соседний | close | We stayed in a *nearby* hotel. | Мы остановились в соседнем отеле.
- onwards | adv | ˈɒnwədz | ˈɑːnwərdz | и далее, начиная с | from a time and after | The shop is open from 9 am *onwards*. | Магазин открыт с 9 утра. | амер. onward
- overseas | adj | ˈəʊvɜːˈsiz | ˈoʊvərˈsiːz | зарубежный, заграничный | from or in another country | We have many *overseas* students. | У нас много иностранных студентов.
- owing to | prep | ˈəʊɪŋ tə | ˈoʊɪŋ tə | из-за, вследствие | because of | The match was cancelled *owing to* rain. | Матч отменили из-за дождя.
- sideways | adv | ˈsaɪdweɪz |  | вбок, боком | to or from the side | Swim *sideways* to escape a strong current. | Чтобы выбраться из сильного течения, плывите в сторону.
- wherever | conj | weəˈrevə | hweˈrevər | где бы ни, куда бы ни | in any place | Sit *wherever* you like. | Садитесь где хотите.
- whoever | pron | huːˈevə | huːˈevər | кто бы ни | any person who | *Whoever* wins will get £100. | Победитель получит 100 фунтов.
