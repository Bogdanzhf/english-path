title: Events and situations
title_ru: События и ситуации
topic: events
words:
- advent | n | ˈædvent |  | появление, приход | the arrival or start of something important | The *advent* of the internet changed everything. | Появление интернета изменило всё.
- completion | n | kəmˈpliːʃən |  | завершение | finishing | The building is near *completion*. | Строительство близится к завершению.
- construction | n | kənˈstrʌkʃən |  | строительство; конструкция | building | The bridge is under *construction*. | Мост строится.
- decision-making | n | dɪˈsɪʒənmeɪkɪŋ |  | принятие решений | the process of making decisions | Everyone takes part in *decision-making*. | Все участвуют в принятии решений.
- exaggerate | v | ɪɡˈzædʒəreɪt |  | преувеличивать | to say something is bigger or worse than it is | Don't *exaggerate* — it wasn't that bad! | Не преувеличивай — всё было не так уж плохо!
- failure | n | ˈfeɪljə | ˈfeɪljər | неудача, провал | a lack of success | The first business was a *failure*. | Первый бизнес оказался провальным.
- finding | n | ˈfaɪndɪŋ |  | вывод, результат (исследования) | something discovered | The *findings* were published. | Результаты были опубликованы.
- hazard | n | ˈhæzəd | ˈhæzərd | опасность, риск | something that could be dangerous | Wet floors are a safety *hazard*. | Мокрый пол — угроза безопасности.
- hearing | n | ˈhiərɪŋ | ˈhiːrɪŋ | слух; слушание (суда) | the ability to hear; a meeting in court | His *hearing* is poor. | У него плохой слух.
- leadership | n | ˈliːdəʃɪp | ˈliːdərʃɪp | лидерство, руководство | being a leader | She showed great *leadership*. | Она проявила себя как сильный лидер.
- opening | n | ˈəʊpənɪŋ | ˈoʊpənɪŋ | открытие; отверстие; вакансия | the start; a hole | We went to the *opening* of the new museum. | Мы были на открытии нового музея.
- passing | n | ˈpɑːsɪŋ | ˈpæsɪŋ | ход (времени); кончина | going by; death | With the *passing* of time, things changed. | Со временем всё изменилось.
- protection | n | prəˈtekʃən |  | защита | keeping safe | Sunscreen gives *protection* from the sun. | Солнцезащитный крем защищает от солнца.
- refresh | v | rɪˈfreʃ |  | освежать; обновлять (страницу) | to make fresh; to reload a web page | *Refresh* the page. | Обновите страницу.
- roam | v | rəʊm | roʊm | бродить, странствовать | to move around without a plan | Wild horses *roam* the hills. | По холмам бродят дикие лошади.
- semi-final | n | ˌsemɪˈfaɪnl | ˌsemaɪˈfaɪnl | полуфинал | the round before the final | They lost in the *semi-final*. | Они проиграли в полуфинале.
- shooting | n | ˈʃuːtɪŋ |  | стрельба; съёмка | firing a gun; filming | There was a *shooting* in the city centre. | В центре города была стрельба.
- showbiz | n | ˈʃəʊbɪz | ˈʃoʊbɪz | шоу-бизнес | show business | She's a big name in *showbiz*. | Она большая звезда шоу-бизнеса.
- testing | n | ˈtestɪŋ |  | тестирование, испытание | checking how something works | The drug is still in *testing*. | Лекарство ещё проходит испытания.
- trading | n | ˈtreɪdɪŋ |  | торговля | buying and selling | *Trading* on the stock market was slow. | Торги на бирже шли вяло.
- worldview | n | ˈwɜːldvjuː | ˈwɜːrldvjuː | мировоззрение | a way of seeing the world | Travel changed his *worldview*. | Путешествия изменили его мировоззрение.
