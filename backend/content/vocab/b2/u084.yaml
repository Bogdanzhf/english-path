title: Feelings and character
title_ru: Чувства и характер
topic: feelings
words:
- adore | v | əˈdɔː | əˈdɔːr | обожать | to love very much | I *adore* chocolate. | Обожаю шоколад.
- animate | v | ˈænɪmeɪt |  | оживлять; создавать анимацию | to make drawings or models appear to move | It took four years to *animate* the film. | На создание анимации к фильму ушло четыре года. | animation — мультипликация
- arouse | v | əˈraʊz |  | вызывать, пробуждать | to cause a feeling or reaction | The strange noise *aroused* our curiosity. | Странный шум пробудил наше любопытство.
- console | v | kənˈsəʊl | kənˈsoʊl | утешать | to comfort someone who is sad | She tried to *console* the crying child. | Она пыталась утешить плачущего ребёнка. | сущ. console [ˈkɒnsəʊl] — пульт, приставка
- depress | v | dɪˈpres |  | угнетать, наводить тоску | to make someone feel sad | Grey winter days *depress* me. | Серые зимние дни наводят на меня тоску. | depressed — подавленный
- despise | v | dɪˈspaɪz |  | презирать | to hate | She *despises* liars. | Она презирает лжецов.
- disappoint | v | ˌdɪsəˈpɔɪnt |  | разочаровывать | to make someone sad because something is not as good as hoped | I don't want to *disappoint* my parents. | Я не хочу разочаровывать родителей.
- distract | v | dɪˈstrækt |  | отвлекать | to take someone's attention away | The games *distracted* people from political problems. | Игры отвлекали людей от политических проблем.
- dread | n | dred |  | ужас, страх | great fear of something that may happen | People lived in *dread* of the disease. | Люди жили в страхе перед болезнью.
- grieve | v | ɡriːv |  | горевать, скорбеть | to feel sad after someone dies | She is still *grieving* for her husband. | Она всё ещё скорбит по мужу.
- humiliate | v | hjuːˈmɪlieɪt |  | унижать | to make someone feel ashamed and stupid | The experts were *humiliated* by the forger. | Фальсификатор выставил экспертов на посмешище.
- inspire | v | ɪnˈspaɪə | ɪnˈspaɪər | вдохновлять | to give someone the desire and confidence to do something | Her story *inspired* thousands of young women. | Её история вдохновила тысячи молодых женщин.
- lighten | v | ˈlaɪtn |  | облегчать; светлеть | to make lighter | A joke can *lighten* the mood. | Шутка может разрядить обстановку.
- offend | v | əˈfend |  | обижать, оскорблять | to make someone upset or angry | I'm sorry if I *offended* you. | Прости, если я тебя обидел.
- overwhelm | v | ˌəʊvəˈwelm | ˌoʊvərˈwelm | переполнять, ошеломлять | to have a very strong effect on someone's feelings | She was *overwhelmed* by all the kind messages. | Её переполнили чувства от всех добрых сообщений.
- scare | v | skeə | sker | пугать | to make someone feel afraid | The dark forest *scared* the little boy. | Тёмный лес напугал маленького мальчика. | be scared of — бояться
- startle | v | ˈstɑːtl | ˈstɑːrtl | испугать, напугать (неожиданно) | to surprise and frighten someone suddenly | The loud noise *startled* the horses. | Громкий шум напугал лошадей.
- sympathize | v | ˈsɪmpəθaɪz |  | сочувствовать | to understand and feel sorry for | I *sympathize* with you. | Я тебе сочувствую. | брит. также sympathise
- yearn | v | jɜːn | jɜːrn | тосковать, жаждать | to want very much | She *yearned* for home. | Она тосковала по дому.
