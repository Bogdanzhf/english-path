title: Feelings and character
title_ru: Чувства и характер
topic: feelings
words:
- arrogant | adj | ˈærəɡənt |  | высокомерный | behaving as if you are more important than others | The scientists were *arrogant* about her lack of training. | Учёные высокомерно относились к отсутствию у неё образования.
- clumsy | adj | ˈklʌmzi |  | неуклюжий | moving in an awkward way and often dropping things | I'm so *clumsy* — I've broken another glass. | Я такой неуклюжий — опять разбил стакан.
- sly | adj | slaɪ |  | хитрый, лукавый | clever at tricking people | He gave me a *sly* smile. | Он хитро мне улыбнулся.
- tempt | v | tempt |  | соблазнять, искушать | to make someone want to do something, often bad | Can I *tempt* you with a piece of cake? | Соблазнить тебя кусочком торта? | tempting — заманчивый
