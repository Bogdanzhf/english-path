title: Actions and movement
title_ru: Действия и движение
topic: actions
words:
- contaminate | v | kənˈtæmɪneɪt |  | загрязнять, заражать | to make something dirty or poisonous | The river was *contaminated* with chemicals. | Река была загрязнена химикатами.
- delete | v | dɪˈliːt |  | удалять | to remove something written or stored on a computer | I accidentally *deleted* the file. | Я случайно удалил файл.
- devastate | v | ˈdevəsteɪt |  | опустошать, разорять; потрясать | to destroy completely; to make someone very sad | The earthquake *devastated* the city. | Землетрясение опустошило город. | devastated — убитый горем
- drag | v | dræɡ |  | тащить, волочить | to pull something heavy along the ground | He *dragged* the heavy box across the floor. | Он протащил тяжёлую коробку по полу.
- erupt | v | ɪˈrʌpt |  | извергаться | to explode and send out fire, lava and smoke | The volcano last *erupted* in 1980. | Последний раз вулкан извергался в 1980 году. | eruption — извержение
- grab | v | ɡræb |  | хватать | to take hold of something quickly and roughly | He *grabbed* his coat and ran out. | Он схватил пальто и выбежал.
- inflate | v | ɪnˈfleɪt |  | надувать; завышать | to fill with air; to make bigger than it really is | The English *inflated* the story of their victory. | Англичане преувеличили историю своей победы.
- load | v | ləʊd | loʊd | грузить, загружать | to put things onto or into | They *loaded* the van. | Они загрузили фургон.
- magnify | v | ˈmæɡnɪfaɪ |  | увеличивать | to make something look bigger than it is | The microscope *magnifies* objects 1,000 times. | Микроскоп увеличивает объекты в 1000 раз. | magnifying glass — лупа
- "modernize | v | ˈm\x01ːdɜːnaɪz | ˈmɑːdərnaɪz | модернизировать | to make modern | They *modernized* the kitchen. | Они модернизировали кухню. | брит. также modernise"
- pat | v | pæt |  | похлопывать, гладить | to touch gently several times with a flat hand | He *patted* the dog on the head. | Он погладил собаку по голове.
- personalize | v | ˈpɜːsənəlaɪz | ˈpɜːrsənəlaɪz | персонализировать | to make something suitable for a particular person | You can *personalize* the app with your own photos. | Приложение можно настроить под себя, добавив свои фото.
- 'pitch | n | pɪtʃ |  | поле (спортивное); высота тона; презентация | a sports field; how high a sound is | The players ran onto the *pitch*. | Игроки выбежали на поле. | гл.: pitch — ставить (палатку); бросать'
- pound | v | paʊnd |  | колотить, стучать | to hit hard many times | My heart was *pounding*. | Моё сердце колотилось.
- refrigerate | v | rɪˈfrɪdʒəreɪt |  | охлаждать, хранить в холодильнике | to keep food cold so it stays fresh | *Refrigerate* the cake after opening. | После вскрытия храните торт в холодильнике. | refrigerator (fridge) — холодильник
- renovate | v | ˈrenəveɪt |  | ремонтировать, реставрировать | to repair and improve an old building | They *renovated* the old farmhouse. | Они отреставрировали старый фермерский дом.
- strike | v | straɪk |  | ударять; бастовать; поражать | to hit; to stop work as a protest | Lightning *struck* the tree. | В дерево ударила молния. | strike – struck – struck
- 'tag | n | tæɡ |  | ярлык, бирка; тег | a small label | Check the price *tag*. | Посмотри на ценник. | гл.: tag — отмечать'
- tap | v | tæp |  | постукивать | to hit gently | Someone *tapped* me on the shoulder. | Кто-то похлопал меня по плечу.
- tear | v | teə | ter | рвать | to pull apart | Don't *tear* the paper. | Не порви бумагу. | tear [teə] – tore – torn; ср. tear [tɪə] — слеза
