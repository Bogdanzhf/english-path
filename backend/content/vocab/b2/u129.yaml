title: 'Describing: qualities'
title_ru: 'Описание: свойства и признаки'
topic: describing
words:
- ambiguous | adj | æmˈbɪɡjuəs |  | двусмысленный, неоднозначный | having more than one possible meaning | The evidence is *ambiguous*. | Данные неоднозначны.
- atypical | adj | eɪˈtɪpɪkl | ˌeɪˈtɪpɪkl | нетипичный | not typical | His behaviour was *atypical*. | Его поведение было нетипичным.
- bustling | adj | ˈbʌslɪŋ | ˈbʌsəlɪŋ | оживлённый, шумный | full of busy people | It's a *bustling* city. | Это оживлённый город.
- cherished | adj | ˈtʃerɪʃt |  | заветный, дорогой | loved and protected | It's my most *cherished* memory. | Это моё самое дорогое воспоминание.
- descriptive | adj | dɪˈskrɪptɪv | dɪsˈkrɪptɪv | описательный | describing | Use *descriptive* language in your essay. | Используйте образный язык в сочинении.
- expressive | adj | ɪkˈspresɪv | ɪksˈpresɪv | выразительный | showing feelings clearly | She has very *expressive* eyes. | У неё очень выразительные глаза.
- flammable | adj | ˈflæməbl |  | легковоспламеняющийся | burning easily | Hydrogen is extremely *flammable*. | Водород чрезвычайно легко воспламеняется. | = inflammable
- frantic | adj | ˈfræntɪk |  | отчаянный, неистовый | done quickly and with a lot of worry | There was a *frantic* search for the missing child. | Начались отчаянные поиски пропавшего ребёнка.
- gloomy | adj | ˈɡluːmi |  | мрачный | dark; sad | It was a *gloomy* day. | Был пасмурный день.
- immoral | adj | ɪˈmɒrəl | ˌɪˈmɔːrəl | безнравственный | morally wrong | Lying is *immoral*. | Лгать безнравственно.
- incurable | adj | ɪnˈkjɔːrəbl | ˌɪnˈkjʊrəbl | неизлечимый | impossible to cure | He has an *incurable* disease. | У него неизлечимая болезнь.
- indescribable | adj | ˌɪndɪˈskraɪbəbl | ˌɪndɪsˈkraɪbəbl | неописуемый | impossible to describe | The joy was *indescribable*. | Радость была неописуемой.
- inert | adj | ɪˈnɜːt | ˌɪˈnɜːrt | инертный, неподвижный | not moving; not reacting | The body lay *inert*. | Тело лежало неподвижно.
- inseparable | adj | ɪnˈseprəbl |  | неразлучный, неотделимый | unable to be separated | The two friends were *inseparable*. | Двое друзей были неразлучны.
- irresistible | adj | ɪrɪˈsɪstəbl | ˌɪrɪˈzɪstəbl | неотразимый, непреодолимый | too strong to resist | The cake looked *irresistible*. | Перед тортом было не устоять.
- purposeful | adj | ˈpɜːpəsfl | ˈpɜːrpəsfl | целеустремлённый | having a clear aim | She walked with *purposeful* steps. | Она шла решительным шагом.
- repetitive | adj | rɪˈpetətɪv |  | однообразный, повторяющийся | doing or saying the same thing many times | The work in the lab was *repetitive*. | Работа в лаборатории была однообразной.
- rosy | adj | ˈrəʊzi | ˈroʊzi | розовый; радужный | pink; hopeful | The future looks *rosy*. | Будущее выглядит радужным.
- standby | adj | ˈstændbaɪ | ˈstændˈbaɪ | резервный, запасной | ready to be used if needed | We have a *standby* generator. | У нас есть резервный генератор. | on standby — в режиме ожидания
- vigorous | adj | ˈvɪɡərəs |  | энергичный, интенсивный | strong, active and full of energy | Thirty minutes of *vigorous* exercise is enough. | Достаточно тридцати минут интенсивных упражнений.
