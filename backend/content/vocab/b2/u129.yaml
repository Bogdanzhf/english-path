title: 'Describing: qualities'
title_ru: 'Описание: свойства и признаки'
topic: describing
words:
- ambiguous | adj | æmˈbɪɡjuəs |  | двусмысленный, неоднозначный | having more than one possible meaning | The evidence is *ambiguous*. | Данные неоднозначны.
- chaotic | adj | keɪˈɒtɪk | keɪˈɑːtɪk | хаотичный | completely confused and disorganized | The first day of the sale was *chaotic*. | Первый день распродажи был хаотичным. | chaos [ˈkeɪɒs] — хаос
- confidential | adj | ˌkɒnfɪˈdenʃl | ˌkɑːnfɪˈdenʃl | конфиденциальный | meant to be kept secret | The documents were strictly *confidential*. | Документы были строго конфиденциальными.
- deliberate | adj | dɪˈlɪbərət |  | преднамеренный, умышленный | done on purpose | It wasn't an accident — it was a *deliberate* attack. | Это была не случайность — это было умышленное нападение. | deliberately — нарочно
- exhausting | adj | ɪɡˈzɔːstɪŋ |  | изнурительный | making you very tired | The climb was *exhausting*. | Подъём был изнурительным. | exhausted — измученный
- exotic | adj | ɪɡˈzɒtɪk | ɪɡˈzɑːtɪk | экзотический | unusual and coming from a distant country | The forest is full of *exotic* birds. | Лес полон экзотических птиц.
- fertile | adj | ˈfɜːtaɪl | ˈfɜːrtl | плодородный | able to produce good crops | The land near the river is very *fertile*. | Земля у реки очень плодородная.
- grim | adj | ɡrɪm |  | мрачный, суровый | very serious and depressing | The situation in the hospital was *grim*. | Положение в госпитале было удручающим.
- idle | adj | ˈaɪdl |  | праздный, бездействующий | not working or active | The engines were *idle* while we waited. | Пока мы ждали, двигатели работали вхолостую. | idle talk — пустая болтовня
- mock | v | mɒk | mɑːk | высмеивать, передразнивать | to laugh at someone unkindly | The other children *mocked* him. | Другие дети смеялись над ним.
- supernatural | adj | ˌsuːpəˈnætʃrəl | ˌsuːpərˈnætʃrəl | сверхъестественный | impossible to explain by science | People believed she had *supernatural* powers. | Люди верили, что она обладает сверхъестественной силой.
