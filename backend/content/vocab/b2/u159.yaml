title: Thinking and opinions
title_ru: Мысли и мнения
topic: mind
words:
- amaze | v | əˈmeɪz |  | изумлять, поражать | to surprise someone very much | Her talent *amazed* everyone. | Её талант поразил всех. | amazing — потрясающий
- anticipate | v | ænˈtɪsɪpeɪt |  | предвидеть, ожидать | to expect something and prepare for it | We didn't *anticipate* so many problems. | Мы не ожидали столько проблем.
- astonish | v | əˈstɒnɪʃ | əˈstɑːnɪʃ | изумлять, поражать | to surprise someone very much | The results *astonished* the scientists. | Результаты поразили учёных. | astonishing — поразительный
- beware | v | bɪˈweə | bɪˈwer | остерегаться | to be careful of something dangerous | *Beware* of the dog! | Осторожно, злая собака! | только в повелит. и инфинитиве
- classify | v | ˈklæsɪfaɪ |  | классифицировать | to put into groups by type | Films are *classified* by age group. | Фильмы классифицируются по возрастным категориям.
- derive | v | dɪˈraɪv |  | происходить, получать | to come from something | Many English words *derive* from Latin. | Многие английские слова происходят из латыни.
- endure | v | ɪnˈdjʊə | ɪnˈdʊr | выдерживать, терпеть | to suffer something difficult for a long time | They *endured* a long, cold winter. | Они пережили долгую холодную зиму.
- exclude | v | ɪkˈskluːd |  | исключать | to keep out or not include | Children who didn't speak the language felt *excluded*. | Дети, не знавшие языка, чувствовали себя изгоями.
- foresee | v | fɔːˈsiː | fɔːrˈsiː | предвидеть | to know about something before it happens | Nobody could *foresee* the problems. | Никто не мог предвидеть проблем.
- infer | v | ɪnˈfɜː | ɪnˈfɜːr | делать вывод | to form an opinion from evidence | From the letters, we can *infer* that the king was worried. | Из писем можно сделать вывод, что король был обеспокоен.
- interpret | v | ɪnˈtɜːprɪt | ɪnˈtɜːrprɪt | толковать, интерпретировать; переводить устно | to explain the meaning of something; to translate speech | How do you *interpret* this dream? | Как ты толкуешь этот сон?
- ponder | v | ˈpɒndə | ˈpɑːndər | обдумывать, размышлять | to think carefully about something | She *pondered* the question for a long time. | Она долго размышляла над вопросом.
- speculate | v | ˈspekjuleɪt |  | строить догадки; спекулировать | to guess possible answers; to buy and sell to make a profit | Scientists *speculate* that it could happen again. | Учёные предполагают, что это может повториться.
- underestimate | v | ˌʌndərˈestɪmeɪt |  | недооценивать | to think something is smaller or less important than it is | They *underestimated* the danger. | Они недооценили опасность.
