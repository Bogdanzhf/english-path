title: Actions and movement
title_ru: Действия и движение
topic: actions
words:
- achievable | adj | əˈtʃiːvəbl |  | достижимый | possible to achieve | Set *achievable* goals. | Ставьте достижимые цели.
- attainable | adj | əˈteɪnəbl |  | достижимый | possible to reach | The target is *attainable*. | Цель достижима.
- compress | v | kəmˈpres |  | сжимать | to press something into a smaller space | The software *compresses* large files. | Программа сжимает большие файлы.
- crack | v | kræk |  | раскалываться; раскрыть (дело), взломать | to break without separating into pieces; to solve a difficult problem | Detectives finally *cracked* the case. | Детективы наконец раскрыли дело.
- delay | v | dɪˈleɪ |  | откладывать, задерживать | to make late; to put off | The flight was *delayed* by two hours. | Рейс задержали на два часа.
- deprive | v | dɪˈpraɪv |  | лишать | to take something important away from someone | The drought *deprived* farmers of their income. | Засуха лишила фермеров дохода.
- duplication | n | ˌdjuːplɪˈkeɪʃən | ˌdjuːpləˈkeɪʃən | дублирование | doing the same thing twice | Avoid *duplication* of work. | Избегайте дублирования работы.
- edit | v | ˈedɪt |  | редактировать | to correct and change a text or film | She *edited* her essay three times. | Она трижды правила своё эссе. | editor — редактор
- enable | v | ɪˈneɪbl |  | давать возможность, позволять | to make it possible for someone to do something | The grant *enabled* her to finish her research. | Грант позволил ей закончить исследование.
- equip | v | ɪˈkwɪp |  | оснащать, снаряжать | to provide the tools or skills needed | Each soldier was *equipped* with a radio. | Каждого солдата снабдили рацией. | equipment — оборудование
- extend | v | ɪkˈstend |  | продлевать; расширять | to make longer or bigger | We *extended* our stay by a week. | Мы продлили своё пребывание на неделю.
- hone | v | həʊn | hoʊn | оттачивать | to improve a skill over time | He spent years *honing* his skills as a magician. | Он годами оттачивал мастерство фокусника.
- progress | v | prəˈɡres |  | продвигаться, прогрессировать | to move forward; to improve | The work is *progressing* well. | Работа продвигается хорошо.
- reusable | adj | ˌriːˈjuːzəbl |  | многоразовый | able to be used again | Bring a *reusable* bag when you go shopping. | Берите с собой в магазин многоразовую сумку.
- shift | v | ʃɪft |  | сдвигать, перемещать(ся) | to move; to change | Can you help me *shift* the sofa? | Поможешь подвинуть диван?
- traverse | v | trəˈvɜːs | trəˈvɜːrs | пересекать | to travel across | The bird *traversed* the entire Pacific Ocean. | Птица пересекла весь Тихий океан.
- unnatural | adj | ʌnˈnætʃərəl | ənˈnætʃərəl | неестественный | not natural | Her smile looked *unnatural*. | Её улыбка выглядела неестественно.
- unreliable | adj | ˌʌnrɪˈlaɪəbl | ˌʌnriːˈlaɪəbl | ненадёжный | not able to be trusted | The trains are *unreliable*. | Поезда ходят ненадёжно.
- unstoppable | adj | ʌnˈstɒpəbl | ənˈstɑːpəbl | неудержимый | impossible to stop | The team seems *unstoppable*. | Команда кажется неудержимой.
- untreated | adj | ʌnˈtriːtɪd | ənˈtriːtɪd | необработанный; не леченный | not dealt with | *Untreated* water can be dangerous. | Неочищенная вода может быть опасна.
