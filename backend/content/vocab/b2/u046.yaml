title: Actions and movement
title_ru: Действия и движение
topic: actions
words:
- compress | v | kəmˈpres |  | сжимать | to press something into a smaller space | The software *compresses* large files. | Программа сжимает большие файлы.
- deprive | v | dɪˈpraɪv |  | лишать | to take something important away from someone | The drought *deprived* farmers of their income. | Засуха лишила фермеров дохода.
- duplicate | v | ˈdjuːplɪkeɪt | ˈduːplɪkeɪt | дублировать, копировать | to make an exact copy | Important systems were *duplicated* for safety. | Важные системы дублировались для безопасности.
- equip | v | ɪˈkwɪp |  | оснащать, снаряжать | to provide the tools or skills needed | Each soldier was *equipped* with a radio. | Каждого солдата снабдили рацией. | equipment — оборудование
- hone | v | həʊn | hoʊn | оттачивать | to improve a skill over time | He spent years *honing* his skills as a magician. | Он годами оттачивал мастерство фокусника.
- reusable | adj | ˌriːˈjuːzəbl |  | многоразовый | able to be used again | Bring a *reusable* bag when you go shopping. | Берите с собой в магазин многоразовую сумку.
- traverse | v | trəˈvɜːs | trəˈvɜːrs | пересекать | to travel across | The bird *traversed* the entire Pacific Ocean. | Птица пересекла весь Тихий океан.
