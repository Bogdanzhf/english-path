title: Objects and materials
title_ru: Предметы и материалы
topic: objects
words:
- arrow | n | ˈærəʊ | ˈæroʊ | стрела | a thin stick with a sharp point that you shoot from a bow | The *arrow* hit the centre of the target. | Стрела попала в центр мишени.
- badge | n | bædʒ |  | значок, бейдж | a small sign you wear | All visitors must wear a *badge*. | Все посетители должны носить бейдж.
- barrel | n | ˈbærəl |  | бочка | a large round container with flat ends | They stored the wine in oak *barrels*. | Вино хранили в дубовых бочках. | a barrel of oil — баррель нефти
- 'bolt | n | bəʊlt | boʊlt | засов; болт; молния | a metal bar for locking; a flash of lightning | He slid the *bolt* across the door. | Он задвинул засов на двери. | гл.: bolt — запирать на засов; рвануть'
- bow | n | bəʊ | boʊ | лук (оружие) | a curved piece of wood with a string, used to shoot arrows | Robin Hood was famous for his *bow* and arrows. | Робин Гуд прославился своим луком и стрелами. | гл. bow [baʊ] — кланяться
- bunch | n | bʌntʃ |  | связка, пучок, букет | a group of things fastened or growing together | He gave her a *bunch* of flowers. | Он подарил ей букет цветов. | a bunch of keys, a bunch of grapes
- bundle | n | ˈbʌndl |  | связка, пачка | things tied together | She carried a *bundle* of clothes. | Она несла узел с одеждой.
- cylinder | n | ˈsɪlɪndə | ˈsɪləndər | цилиндр; баллон | a tube shape; a gas container | The engine has four *cylinders*. | У двигателя четыре цилиндра.
- 'dot | n | dɒt | dɑːt | точка | a small round mark | My email is anna *dot* smith at gmail. | Мой адрес: anna точка smith собака gmail.'
- ladder | n | ˈlædə | ˈlædər | лестница (приставная) | a set of steps you can move, used for climbing | He climbed the *ladder* to fix the roof. | Он залез по лестнице, чтобы починить крышу.
- 'mass | n | mæs |  | масса; множество | a large amount; the amount of matter | A *mass* of people gathered. | Собралась масса людей. | прил.: mass — массовый'
- plug | n | plʌɡ |  | вилка (электрическая); пробка | a device to connect to electricity; a stopper | Pull out the *plug*. | Выдерни вилку из розетки.
- pouch | n | paʊtʃ |  | мешочек, сумка | a small bag | He kept his coins in a leather *pouch*. | Он хранил монеты в кожаном мешочке.
- rail | n | reɪl |  | железная дорога; рельс; перила | a system of trains and tracks; a metal bar | Travelling by *rail* is greener than flying. | Путешествовать поездом экологичнее, чем самолётом.
- slot | n | slɒt | slɑːt | слот, отверстие; время в расписании | a narrow opening; a place in a schedule | The show moved to a later time *slot*. | Передачу перенесли на более позднее время.
- stack | n | stæk |  | стопка, кипа | a neat pile of things | There's a *stack* of books on my desk. | На моём столе стопка книг.
- tray | n | treɪ |  | поднос, столик | a flat object for carrying food | Please put your *tray* table up for landing. | Пожалуйста, поднимите столик перед посадкой.
- tub | n | tʌb |  | ванна; контейнер | a bath; a small container | I bought a *tub* of ice cream. | Я купил ведёрко мороженого.
- wire | n | ˈwaɪə | ˈwaɪər | проволока, провод | a long thin piece of metal | The lights were held up with *wire*. | Гирлянды держались на проволоке.
