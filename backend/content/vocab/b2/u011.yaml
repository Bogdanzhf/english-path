title: Home and everyday life
title_ru: Дом и быт
topic: home
words:
- brick | n | brɪk |  | кирпич | a hard block of baked clay used for building | The bread is baked in an old *brick* oven. | Хлеб пекут в старой кирпичной печи.
- cabin | n | ˈkæbɪn |  | хижина; кабина, каюта | a small wooden house; a room on a ship or plane | They spent the night in a mountain *cabin*. | Они переночевали в горной хижине.
- candle | n | ˈkændl |  | свеча | a stick of wax that you burn for light | She lit a *candle* on the table. | Она зажгла свечу на столе.
- chair | v | tʃeə | tʃer | председательствовать | to lead a meeting | Who will *chair* the meeting? | Кто будет вести собрание?
- chimney | n | ˈtʃɪmni |  | дымоход, труба | a pipe that takes smoke out of a building | Smoke was rising from the *chimney*. | Из трубы поднимался дым.
- cot | n | kɒt | kɑːt | раскладушка; детская кроватка | a narrow folding bed; (UK) a baby's bed | He slept on a simple *cot*. | Он спал на простой раскладушке.
- decoration | n | ˌdekəˈreɪʃən |  | украшение | something that makes a place look nicer | We put up Christmas *decorations*. | Мы развесили рождественские украшения.
- estate | n | ɪˈsteɪt |  | поместье; имущество | a large area of land in the country owned by one person | They own a huge *estate* in Scotland. | Им принадлежит огромное поместье в Шотландии. | real estate — недвижимость
- fireplace | n | ˈfaɪəpleɪs | ˈfaɪərpleɪs | камин | a place for a fire in a room | We sat by the *fireplace*. | Мы сидели у камина.
- furnace | n | ˈfɜːnɪs | ˈfɜːrnɪs | печь, топка | a very hot container for burning fuel or melting metal | The surface of Venus is like a *furnace*. | Поверхность Венеры похожа на раскалённую печь.
- housekeeping | n | ˈhaʊskiːpɪŋ |  | ведение хозяйства | the work of looking after a house | The *housekeeping* took up most of her day. | Хозяйство отнимало у неё большую часть дня.
- ink | n | ɪŋk |  | чернила | coloured liquid for writing | Write in black *ink*. | Пишите чёрными чернилами.
- lease | n | liːs |  | договор аренды | a legal agreement to rent property | We signed a two-year *lease*. | Мы подписали договор аренды на два года.
- manor | n | ˈmænə | ˈmænər | поместье, усадьба | a large country house with land | The *manor* had been empty for years. | Усадьба много лет пустовала.
- mess | v | mes |  | портить, напортачить (mess up) | to make untidy or spoil | Don't *mess* up my hair! | Не растрёпывай мне волосы! | mess up — испортить
- microwave | n | ˈmaɪkrəʊweɪv | ˈmaɪkrəweɪv | микроволновка | an oven that cooks food quickly | Heat the soup in the *microwave*. | Разогрей суп в микроволновке.
- ornament | n | ˈɔːnəmənt | ˈɔːrnəmənt | украшение, орнамент | a decorative object | Ivory was once used for *ornaments*. | Когда-то из слоновой кости делали украшения.
- packet | n | ˈpækɪt | ˈpækət | пачка, пакетик | a small box or bag | I bought a *packet* of biscuits. | Я купил пачку печенья.
- rug | n | rʌɡ |  | коврик | a small carpet | The dog sleeps on the *rug*. | Собака спит на коврике.
- silverware | n | ˈsɪlvəweə | ˈsɪlvərwer | столовое серебро; столовые приборы (амер.) | knives, forks and spoons | Put the *silverware* on the table. | Разложи приборы на столе.
- stool | n | stuːl |  | табурет | a seat without a back or arms | He sat on a wooden *stool* in the kitchen. | Он сидел на деревянном табурете на кухне.
- teaspoon | n | ˈtiːspuːn |  | чайная ложка | a small spoon | Add a *teaspoon* of sugar. | Добавьте чайную ложку сахара.
- villa | n | ˈvɪlə |  | вилла | a large house, often for holidays | We rented a *villa* in Spain. | Мы сняли виллу в Испании.
