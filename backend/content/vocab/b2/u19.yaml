      options: ["A new engine", "A filter for carbon dioxide", "A radio", "A map"]
      answer: 1
    - q: "How did the astronauts check their direction?"
      options: ["With their computers", "By lining up the ship with the Sun", "Using astrology", "Using GPS"]
      answer: 1
