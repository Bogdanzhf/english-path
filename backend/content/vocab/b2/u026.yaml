- elegant | adj | ˈelɪɡənt |  | элегантный | stylish and attractive | She wore an *elegant* black dress. | На ней было элегантное чёрное платье.
- feminine | adj | ˈfemənɪn |  | женственный; женский | having qualities thought typical of women | She wore a soft, *feminine* dress. | На ней было мягкое, женственное платье. | masculine — мужественный
- folding | adj | ˈfəʊldɪŋ | ˈfoʊldɪŋ | складной | able to be folded | We need a *folding* chair. | Нам нужен складной стул.
- horizontal | adj | ˌhɒrɪˈzɒntl | ˌhɔːrəˈzɑːntl | горизонтальный | flat and level | Draw a *horizontal* line across the page. | Проведите горизонтальную линию через страницу.
- masculine | adj | ˈmæskjəlɪn |  | мужской, мужественный | having qualities thought typical of men | Tattoos were once seen as *masculine*. | Когда-то татуировки считались мужским делом. | feminine — женственный
- miniature | adj | ˈmɪnɪtʃə | ˈmɪniətʃʊr | миниатюрный | very small | He collects *miniature* cars. | Он собирает миниатюрные машинки.
- mold | n | məʊld | moʊld | форма (для отливки); плесень | a container used to give a shape to something | The heads were made using *molds*. | Головы изготавливали с помощью форм. | брит. mould
