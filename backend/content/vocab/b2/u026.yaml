title: 'Describing: size, shape and looks'
title_ru: 'Описание: размер, форма, внешний вид'
topic: describing
words:
- aerial | adj | ˈeəriəl | ˈeriəl | воздушный, с воздуха | from the air or sky | *Aerial* photographs showed the size of the avalanche. | Снимки с воздуха показали масштабы лавины. | сущ. aerial (брит.) — антенна
- bent | adj | bent |  | согнутый, изогнутый | not straight | The nail was *bent*. | Гвоздь был погнут.
- "compact | adj | k\x01ːmpækt | ˈkɑːmpækt | компактный | small and neat | It's a *compact* car. | Это компактная машина."
- curved | adj | kɜːvd | kɜːrvd | изогнутый | having a curve | The road is *curved*. | Дорога извилистая.
