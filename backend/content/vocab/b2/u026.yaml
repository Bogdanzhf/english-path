title: 'Describing: size, shape and looks'
title_ru: 'Описание: размер, форма, внешний вид'
topic: describing
words:
- aerial | adj | ˈeəriəl | ˈeriəl | воздушный, с воздуха | from the air or sky | *Aerial* photographs showed the size of the avalanche. | Снимки с воздуха показали масштабы лавины. | сущ. aerial (брит.) — антенна
- curve | v | kɜːv | kɜːrv | изгибаться | to bend in a round shape | The road *curves* to the left. | Дорога изгибается влево. | сущ. curve — изгиб, кривая
- elegant | adj | ˈelɪɡənt |  | элегантный | stylish and attractive | She wore an *elegant* black dress. | На ней было элегантное чёрное платье.
- feminine | adj | ˈfemənɪn |  | женственный; женский | having qualities thought typical of women | She wore a soft, *feminine* dress. | На ней было мягкое, женственное платье. | masculine — мужественный
- horizontal | adj | ˌhɒrɪˈzɒntl | ˌhɔːrəˈzɑːntl | горизонтальный | flat and level | Draw a *horizontal* line across the page. | Проведите горизонтальную линию через страницу.
- steep | adj | stiːp |  | крутой | rising or falling quickly | The path up the hill was very *steep*. | Тропа на холм была очень крутой.
