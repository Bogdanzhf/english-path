title: 'Describing: good or bad'
title_ru: 'Описание: оценка — хорошо или плохо'
topic: describing
words:
- charming | adj | ˈtʃɑːmɪŋ | ˈtʃɑːrmɪŋ | очаровательный | very pleasant and attractive | What a *charming* little town! | Какой очаровательный городок!
- confusing | adj | kənˈfjuːzɪŋ |  | запутанный, сбивающий с толку | hard to understand | The instructions are *confusing*. | Инструкции запутанные.
- convincing | adj | kənˈvɪnsɪŋ |  | убедительный | making you believe | She gave a *convincing* answer. | Она дала убедительный ответ.
- delicate | adj | ˈdelɪkət |  | нежный, хрупкий | easily damaged; soft and fine | Wash *delicate* clothes by hand. | Деликатные вещи стирайте вручную.
- demanding | adj | dɪˈmɑːndɪŋ | dɪˈmændɪŋ | требовательный; трудный | needing a lot of effort | It's a very *demanding* job. | Это очень тяжёлая работа.
- entertaining | adj | ˌentəˈteɪnɪŋ | ˌenərˈteɪnɪŋ | занимательный, развлекательный | fun and interesting | It was a very *entertaining* film. | Это был очень увлекательный фильм.
- fabulous | adj | ˈfæbjələs |  | потрясающий, баснословный | extremely good; extremely large | The company made a *fabulous* profit. | Компания получила баснословную прибыль.
- glorious | adj | ˈɡlɔːrɪəs | ˈɡlɔːriəs | великолепный; славный | beautiful; famous and admired | We had *glorious* weather. | Погода была великолепной.
- handy | adj | ˈhændi |  | удобный, полезный | useful and easy to use | This app is really *handy*. | Это приложение очень удобное. | come in handy — пригодиться
- magnificent | adj | mæɡˈnɪfɪsnt |  | великолепный | very beautiful and impressive | The view from the top was *magnificent*. | Вид с вершины был великолепным.
- memorable | adj | ˈmemərəbl |  | запоминающийся | easy to remember because it is special | It was a *memorable* evening. | Это был незабываемый вечер.
- miserable | adj | ˈmɪzrəbl |  | несчастный, жалкий | very unhappy | I felt *miserable* when I had the flu. | Когда у меня был грипп, мне было очень плохо.
- overwhelming | adj | ˌəʊvəˈwelmɪŋ | ˌoʊvərˈwelmɪŋ | подавляющий, огромный | very strong or large | The response was *overwhelming*. | Отклик был ошеломляющим.
- petty | adj | ˈpeti | ˈpetiː | мелочный; мелкий | small and unimportant; mean about small things | Don't be so *petty*! | Не будь таким мелочным!
- promising | adj | ˈprɒmɪsɪŋ | ˈprɑːməsɪŋ | многообещающий | likely to be successful | She's a *promising* young writer. | Она многообещающая молодая писательница.
- shocking | adj | ˈʃɒkɪŋ | ˈʃɑːkɪŋ | шокирующий | very surprising and upsetting | The news was *shocking*. | Новость была шокирующей.
- spectacular | adj | spekˈtækjələ | spekˈtækjələr | впечатляющий, эффектный | very impressive | The growth of the cities was *spectacular*. | Рост городов был впечатляющим.
- tragic | adj | ˈtrædʒɪk |  | трагический | very sad, often involving death | The whale's death was *tragic* and avoidable. | Гибель кита была трагичной и предотвратимой.
- tricky | adj | ˈtrɪki |  | хитрый; каверзный, сложный | difficult; needing skill | It's a *tricky* question. | Это каверзный вопрос.
- unfortunate | adj | ʌnˈfɔːtʃənət | ʌnˈfɔːrtʃənət | неудачный, несчастный | unlucky; regrettable | It was an *unfortunate* mistake. | Это была досадная ошибка.
- worrying | adj | ˈwʌrɪɪŋ | ˈwɜːriːɪŋ | тревожный | causing worry | The situation is very *worrying*. | Ситуация очень тревожная.
