title: 'Describing: good or bad'
title_ru: 'Описание: оценка — хорошо или плохо'
topic: describing
words:
- awkward | adj | ˈɔːkwəd | ˈɔːkwərd | неловкий | uncomfortable or embarrassing | There was an *awkward* silence after his joke. | После его шутки повисло неловкое молчание.
- decent | adj | ˈdiːsnt |  | приличный, порядочный | good enough; honest and polite | He earns a *decent* salary. | Он получает приличную зарплату.
- extraordinary | adj | ɪkˈstrɔːdnri | ɪkˈstrɔːrdəneri | необычайный, выдающийся | very unusual and surprising | She has an *extraordinary* voice. | У неё необыкновенный голос.
- fabulous | adj | ˈfæbjələs |  | потрясающий, баснословный | extremely good; extremely large | The company made a *fabulous* profit. | Компания получила баснословную прибыль.
- nasty | adj | ˈnɑːsti | ˈnæsti | противный, мерзкий; злой | very unpleasant; unkind | It was a *nasty* fight between two males. | Это была жестокая драка двух самцов.
- unfortunate | adj | ʌnˈfɔːtʃənət | ʌnˈfɔːrtʃənət | неудачный, несчастный | unlucky; regrettable | It was an *unfortunate* mistake. | Это была досадная ошибка.
