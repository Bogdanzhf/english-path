title: Feelings and character
title_ru: Чувства и характер
topic: feelings
words:
- affection | n | əˈfekʃn |  | привязанность, нежность | a feeling of liking and caring for someone | She looked at her son with great *affection*. | Она смотрела на сына с большой нежностью.
- agony | n | ˈæɡəni |  | агония, мучение | extreme pain or suffering | He lay in *agony* until the ambulance arrived. | Он мучился от боли, пока не приехала скорая.
- anticipation | n | ænˈtɪsɪˈpeɪʃən | ænˌtɪsəˈpeɪʃən | предвкушение, ожидание | excitement about something that will happen | The children waited in *anticipation*. | Дети ждали в предвкушении.
- appetite | n | ˈæpɪtaɪt |  | аппетит; тяга | the desire for food; a strong desire for something | The public had no *appetite* for more war. | У общества не было желания продолжать войну.
- attachment | n | əˈtætʃmənt |  | привязанность; вложение (в письме) | a feeling of love; a file sent with an email | I've sent the photos as an *attachment*. | Я отправил фото во вложении.
- awe | n | ɔː | ɑː | благоговение, трепет | a feeling of great respect and wonder | We stood in *awe* of the mountains. | Мы стояли в благоговении перед горами.
- consolation | n | kɒnsəˈleɪʃən | ˌkɑːnsəˈleɪʃən | утешение | something that makes you feel better | If it's any *consolation*, I failed too. | Если тебя это утешит, я тоже провалился.
- delight | n | dɪˈlaɪt |  | восторг, радость | great pleasure | The children screamed with *delight*. | Дети визжали от восторга.
- detachment | n | dɪˈtætʃmənt | diːˈtætʃmənt | отстранённость | not being emotionally involved | She spoke with calm *detachment*. | Она говорила со спокойной отстранённостью.
- disappointment | n | ˌdɪsəˈpɔɪntmənt |  | разочарование | sadness because something was not as good as hoped | The film was a big *disappointment*. | Фильм сильно разочаровал.
- disgust | n | dɪsˈɡʌst |  | отвращение | a strong feeling that something is very unpleasant | He looked at the dirty kitchen with *disgust*. | Он с отвращением посмотрел на грязную кухню.
- embarrassment | n | ɪmˈbærəsmənt | ɪmˈberəsmənt | смущение, неловкость | feeling shy or ashamed | Her face went red with *embarrassment*. | Она покраснела от смущения.
- enthusiasm | n | ɪnˈθjuːziæzəm | ɪnˈθuːziæzəm | энтузиазм | great interest and excitement | She showed great *enthusiasm* for the project. | Она проявила большой энтузиазм к проекту.
- frustration | n | frʌˈstreɪʃən | frəˈstreɪʃən | разочарование, досада | feeling annoyed because you can't do something | I shouted in *frustration*. | Я закричал от досады.
- glee | n | ɡliː |  | ликование, злорадство | great happiness | The kids laughed with *glee*. | Дети радостно смеялись.
- hatred | n | ˈheɪtrɪd |  | ненависть | a very strong feeling of not liking someone | The war was full of *hatred*. | Война была полна ненависти.
- jealousy | n | ˈdʒeləsi |  | ревность, зависть | an unhappy feeling of wanting what someone else has | Pilots joked about their *jealousy* of the bird. | Пилоты шутили, что завидуют птице.
- spite | n | spaɪt |  | злоба, назло | a wish to hurt or annoy someone | He broke my toy out of *spite*. | Он сломал мою игрушку назло. | in spite of — несмотря на
- thrill | n | θrɪl |  | трепет, восторг | a strong feeling of excitement | Riding a rollercoaster gives me a real *thrill*. | Катание на американских горках вызывает у меня настоящий восторг. | thrilling — захватывающий
- vanity | n | ˈvænəti |  | тщеславие | too much pride in your appearance or achievements | His *vanity* made him spend hours in front of the mirror. | Из-за тщеславия он часами стоял перед зеркалом.
