title: Character and personality
title_ru: Характер и личность
topic: feelings
words:
- authoritative | adj | ɔːˈθɒrətətɪv | əˈθɔːrəteɪtɪv | авторитетный, властный | reliable and respected; showing that you expect to be obeyed | This is the most *authoritative* book on the subject. | Это самая авторитетная книга по теме.
- considerate | adj | kənˈsɪdərət |  | внимательный, заботливый | thinking about other people's feelings | Please be *considerate* and keep noise to a minimum. | Пожалуйста, будьте внимательны к другим и не шумите.
- innate | adj | ɪˈneɪt |  | врождённый | present from birth | She had an *innate* talent for leadership. | У неё был врождённый талант лидера.
- inventive | adj | ɪnˈventɪv |  | изобретательный | good at thinking of new ideas | The show was full of *inventive* ideas. | Шоу было полно изобретательных идей.
- tame | adj | teɪm |  | ручной, приручённый | not wild; not afraid of people | The birds were so *tame* that they ate from my hand. | Птицы были такими ручными, что ели у меня с руки.
- tolerant | adj | ˈtɒlərənt | ˈtɑːlərənt | терпимый | accepting of other people's behaviour and beliefs | Be *tolerant* of other people's opinions. | Будьте терпимы к чужим мнениям.
