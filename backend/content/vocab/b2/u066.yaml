title: 'Describing: good or bad'
title_ru: 'Описание: оценка — хорошо или плохо'
topic: describing
words:
- affordable | adj | əˈfɔːdəbl | əˈfɔːrdəbl | доступный (по цене) | cheap enough to buy | We need more *affordable* housing. | Нужно больше доступного жилья.
- awkward | adj | ˈɔːkwəd | ˈɔːkwərd | неловкий | uncomfortable or embarrassing | There was an *awkward* silence after his joke. | После его шутки повисло неловкое молчание.
- breezy | adj | ˈbriːzi |  | ветреный; беззаботный | with a light wind; cheerful | It was a *breezy* day. | Был ветреный день.
- challenging | adj | ˈtʃælɪndʒɪŋ | ˈtʃæləndʒɪŋ | трудный, требующий усилий | difficult but interesting | It's a *challenging* job. | Это непростая работа.
- cost-effective | adj | ˌkɒst ɪˈfektɪv | ˌkɔːst ɪˈfektɪv | экономически эффективный | giving good value for money | Solar power is very *cost-effective*. | Солнечная энергия очень выгодна.
- decent | adj | ˈdiːsnt |  | приличный, порядочный | good enough; honest and polite | He earns a *decent* salary. | Он получает приличную зарплату.
- dramatic | adj | drəˈmætɪk |  | драматический; резкий, разительный | exciting; sudden and big | There's been a *dramatic* change. | Произошли разительные перемены.
- efficiency | n | ɪˈfɪʃənsi |  | эффективность | working well without waste | We need to improve *efficiency*. | Нам нужно повысить эффективность.
- encouraging | adj | ɪnˈkʌrɪdʒɪŋ | enˈkɜːrɪdʒɪŋ | обнадёживающий | giving hope | The results are *encouraging*. | Результаты обнадёживают.
- extraordinary | adj | ɪkˈstrɔːdnri | ɪkˈstrɔːrdəneri | необычайный, выдающийся | very unusual and surprising | She has an *extraordinary* voice. | У неё необыкновенный голос.
- grand | adj | ɡrænd |  | великолепный, грандиозный | big and impressive | They stayed in a *grand* old hotel. | Они остановились в великолепном старом отеле.
- nasty | adj | ˈnɑːsti | ˈnæsti | противный, мерзкий; злой | very unpleasant; unkind | It was a *nasty* fight between two males. | Это была жестокая драка двух самцов.
- outstanding | adj | aʊtˈstændɪŋ | ˌaʊtˈstændɪŋ | выдающийся | excellent | She's an *outstanding* student. | Она выдающаяся студентка.
- productive | adj | prəˈdʌktɪv | pərˈdʌktɪv | продуктивный | achieving a lot | We had a *productive* meeting. | У нас была продуктивная встреча.
- remarkable | adj | rɪˈmɑːkəbl | riːˈmɑːrkəbl | замечательный, удивительный | unusual and impressive | It's a *remarkable* achievement. | Это замечательное достижение.
- ridiculous | adj | rɪˈdɪkjələs |  | нелепый, смешной | very silly or unreasonable | That's a *ridiculous* idea! | Это нелепая идея!
- stunning | adj | ˈstʌnɪŋ |  | потрясающий, ошеломляющий | extremely beautiful | She looked *stunning* in that dress. | Она выглядела потрясающе в этом платье.
- tactile | adj | ˈtæktaɪl |  | тактильный | relating to touch | Babies love *tactile* toys. | Малыши любят тактильные игрушки.
- tough | adj | tʌf |  | трудный; крепкий, стойкий | difficult; strong | It was a *tough* decision. | Это было трудное решение. | gh читается как f
- useless | adj | ˈjuːsləs |  | бесполезный | not useful | This old phone is *useless*. | Этот старый телефон бесполезен.
- weird | adj | wɪəd | wɪrd | странный, чудной | very strange | It's *weird* to think we used to live without phones. | Странно думать, что когда-то мы жили без телефонов.
