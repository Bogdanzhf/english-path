title: 'Describing: senses'
title_ru: 'Описание: ощущения — температура, звук, свет, вкус'
topic: describing
words:
- coarse | adj | kɔːs | kɔːrs | грубый, крупный | rough to touch; made of large pieces | The beach was covered in *coarse* sand. | Пляж был покрыт крупным песком.
- cozy | adj | ˈkəʊzi | ˈkoʊzi | уютный | warm and comfortable | We stayed in a *cozy* little hotel. | Мы остановились в уютной маленькой гостинице. | брит. cosy
- grand | adj | ɡrænd |  | великолепный, грандиозный | big and impressive | They stayed in a *grand* old hotel. | Они остановились в великолепном старом отеле.
- ridiculous | adj | rɪˈdɪkjələs |  | нелепый, смешной | very silly or unreasonable | That's a *ridiculous* idea! | Это нелепая идея!
- soothing | adj | ˈsuːðɪŋ |  | успокаивающий | making you feel calm | She has a *soothing* voice. | У неё успокаивающий голос.
- stale | adj | steɪl |  | чёрствый, несвежий | (of bread) no longer fresh and soft | This bread is *stale*. | Этот хлеб зачерствел.
- tough | adj | tʌf |  | трудный; крепкий, стойкий | difficult; strong | It was a *tough* decision. | Это было трудное решение. | gh читается как f
- weird | adj | wɪəd | wɪrd | странный, чудной | very strange | It's *weird* to think we used to live without phones. | Странно думать, что когда-то мы жили без телефонов.
