title: People and relationships
title_ru: Люди и отношения
topic: people
words:
- absentee | n | ˌæbsənˈtiː |  | отсутствующий | a person who is not present | There were three *absentees* today. | Сегодня отсутствовали трое.
- acrobat | n | ˈækrəbæt |  | акробат | a performer who does difficult jumps and balancing acts | The *acrobats* flew through the air. | Акробаты летали по воздуху.
- brother-in-law | n | ˈbrəðɜːɪnlɔː | ˈbrʌðərɪnlɔː | шурин, зять, деверь | your sister's husband or your partner's brother | My *brother-in-law* is a doctor. | Мой шурин — врач.
- daughter-in-law | n | ˈdɔːtɜːɪnlɔː | ˈdɔːtərɪnlɔː | невестка, сноха | your son's wife | Her *daughter-in-law* is very kind. | Её невестка очень добрая.
- dissident | n | ˈdɪsɪdənt | ˈdɪsədənt | диссидент | a person who opposes the government | The writer was a political *dissident*. | Писатель был политическим диссидентом.
- dropout | n | ˈdrɒpaʊt | ˈdrɑːpaʊt | бросивший учёбу | a person who leaves school early | He was a college *dropout*. | Он бросил колледж.
- housewife | n | ˈhaʊswaɪf |  | домохозяйка | a woman who looks after the home | My grandmother was a *housewife*. | Моя бабушка была домохозяйкой.
- narcissistic | adj | ˌnɑːsɪˈsɪstɪk | ˌnɑːrsɪˈsɪstɪk | самовлюблённый | too interested in yourself | He's selfish and *narcissistic*. | Он эгоистичный и самовлюблённый.
- nomad | n | ˈnəʊmæd | ˈnoʊmæd | кочевник | a person who moves from place to place | Desert *nomads* travel with camels. | Кочевники пустыни путешествуют с верблюдами.
- optimist | n | ˈɒptɪmɪst | ˈɑːptɪmɪst | оптимист | a person who expects good things to happen | I'm an *optimist* — I believe we'll make it. | Я оптимист — верю, что у нас получится.
- proponent | n | prəˈpəʊnənt | prəˈpoʊnənt | сторонник | a person who supports an idea | He was a leading *proponent* of the theory. | Он был ведущим сторонником этой теории.
- protester | n | prəˈtestə | ˈproʊtestər | протестующий | a person who protests | *Protesters* marched through the city. | Протестующие прошли маршем по городу.
- schoolgirl | n | ˈskuːlɡɜːl | ˈskuːlɡɜːrl | школьница | a girl at school | She was just a *schoolgirl* then. | Тогда она была ещё школьницей.
- settler | n | ˈsetlə | ˈsetələr | поселенец | a person who goes to live in a new place | The first *settlers* arrived in 1620. | Первые поселенцы прибыли в 1620 году.
- sister-in-law | n | ˈsɪstɜːɪnlɔː | ˈsɪstərɪnlɔː | невестка, золовка, свояченица | your brother's wife or your partner's sister | My *sister-in-law* lives in Spain. | Моя невестка живёт в Испании.
- stepfather | n | ˈstepfɑːðə | ˈstepfɑːðər | отчим | your mother's new husband | My *stepfather* is very kind to me. | Отчим очень добр ко мне.
- stepmother | n | ˈstepmʌðə | ˈstepmʌðər | мачеха | your father's new wife | Cinderella had a cruel *stepmother*. | У Золушки была злая мачеха.
- tramp | n | træmp |  | бродяга | a person without a home who travels around | A *tramp* was sleeping on the bench. | На скамейке спал бродяга.
