title: People and relationships
title_ru: Люди и отношения
topic: people
words:
- acrobat | n | ˈækrəbæt |  | акробат | a performer who does difficult jumps and balancing acts | The *acrobats* flew through the air. | Акробаты летали по воздуху.
- optimist | n | ˈɒptɪmɪst | ˈɑːptɪmɪst | оптимист | a person who expects good things to happen | I'm an *optimist* — I believe we'll make it. | Я оптимист — верю, что у нас получится.
- proponent | n | prəˈpəʊnənt | prəˈpoʊnənt | сторонник | a person who supports an idea | He was a leading *proponent* of the theory. | Он был ведущим сторонником этой теории.
