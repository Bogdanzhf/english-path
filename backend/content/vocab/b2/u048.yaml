title: Education
title_ru: Учёба
topic: education
words:
- appendix | n | əˈpendɪks |  | приложение; аппендикс | a section at the end of a book; a small organ | See the *appendix* for more details. | Подробности см. в приложении.
- bracket | n | ˈbrækɪt |  | скобка; категория | the marks ( ) ; a group | Put the verb in *brackets*. | Поставьте глагол в скобки.
- certificate | n | səˈtɪfɪkət | sərˈtɪfɪkət | свидетельство, сертификат | an official document that proves something | You'll get a *certificate* at the end of the course. | В конце курса вы получите сертификат. | birth certificate — свидетельство о рождении
- comparative | adj | kəmˈpærətɪv |  | сравнительный | measured against others | It's a *comparative* study of two cities. | Это сравнительное исследование двух городов.
- dissertation | n | dɪsəˈteɪʃən | ˌdɪsərˈteɪʃən | диссертация, дипломная работа | a long essay for a degree | She's writing her *dissertation*. | Она пишет диплом.
- document | v | ˈdɒkjument | ˈdɑːkjument | документировать, фиксировать | to record in writing or photos | The film *documents* their journey. | Фильм документирует их путешествие.
- dorm | n | dɔːm | dɔːrm | общежитие (разг.) | a dormitory | He lives in a college *dorm*. | Он живёт в общежитии колледжа.
- dormitory | n | ˈdɔːmətri | ˈdɔːrmətɔːri | общежитие | a building where students live | I lived in a *dormitory* in my first year. | На первом курсе я жил в общежитии. | разг. dorm
- file | v | faɪl |  | подшивать, подавать (документ) | to put in a file; to submit officially | She *filed* a complaint. | Она подала жалобу.
- footnote | n | ˈfʊtnəʊt | ˈfʊtnoʊt | сноска | a note at the bottom of a page | See *footnote* 3. | См. сноску 3.
- handout | n | ˈhændaʊt |  | раздаточный материал; подачка | a sheet of information given out | Read the *handout* before class. | Прочитайте раздаточный материал перед занятием.
- marker | n | ˈmɑːkə | ˈmɑːrkər | маркер | a thick pen | Write your name with a *marker*. | Подпишите своё имя маркером.
- outline | n | ˈaʊtlaɪn |  | план, набросок | a short plan of the main ideas | First, write an *outline* of your essay. | Сначала напишите план своего сочинения.
- prom | n | prɒm | prɑːm | выпускной бал | a formal dance at the end of school | What are you wearing to the *prom*? | Что ты наденешь на выпускной?
- questionnaire | n | ˌkwestʃəˈneə | ˌkwestʃəˈner | анкета, опросник | a list of questions | Please fill in this *questionnaire*. | Пожалуйста, заполните анкету.
- secondary education | n | ˈsekəndəri ˌedʒuːˈkeɪʃən | ˈsekənderi ˌedʒəˈkeɪʃən | среднее образование | education for students aged 11–18 | *Secondary education* is free. | Среднее образование бесплатное.
- session | n | ˈseʃn |  | сеанс, занятие, сессия | a period of time spent doing one activity | Each therapy *session* lasts an hour. | Каждый сеанс терапии длится час.
- state school | n | steɪt skuːl |  | государственная школа | a free school paid for by the government | Most children go to a *state school*. | Большинство детей ходят в государственные школы.
- syllable | n | ˈsɪləbl |  | слог | a part of a word with one vowel sound | "Water" has two *syllables*. | В слове «water» два слога.
- thesis | n | ˈθiːsɪs |  | диссертация, дипломная работа; тезис | a long piece of writing for a university degree | He is writing his *thesis* on climate change. | Он пишет дипломную работу об изменении климата. | мн. ч. theses
- tuition fees | n | tjuːˈɪʃən fiːz |  | плата за обучение | money paid for teaching | *Tuition fees* have gone up. | Плата за обучение выросла.
