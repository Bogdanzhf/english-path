    - q: "What was the 'ring' strategy?"
      options: ["Vaccinating everyone in the world", "Vaccinating everyone around each patient", "Closing borders", "Building hospitals in a circle"]
      answer: 1
    - q: "When was smallpox officially declared eradicated?"
      options: ["1796", "1967", "1977", "1980"]
      answer: 3
