title: Law and crime
title_ru: Закон и преступность
topic: law
words:
- assassin | n | əˈsæsɪn |  | убийца (политический) | a person who kills an important person | The *assassin* was arrested within hours. | Убийцу арестовали в течение нескольких часов. | assassination — убийство (политика)
- attorney | n | əˈtɜːni | əˈtɜːrni | адвокат, юрист | a lawyer (US) | His *attorney* advised him to say nothing. | Адвокат посоветовал ему ничего не говорить.
- burglary | n | ˈbɜːɡləri | ˈbɜːrɡləri | кража со взломом | breaking into a building to steal | There was a *burglary* next door. | У соседей была кража со взломом.
- constitution | n | ˌkɒnstɪˈtjuːʃn | ˌkɑːnstɪˈtuːʃn | конституция; телосложение | the basic laws of a country | The US *Constitution* was written in 1787. | Конституция США была написана в 1787 году.
- contract | n | ˈkɒntrækt | ˈkɑːntrækt | контракт, договор | a written legal agreement | He signed a two-year *contract*. | Он подписал контракт на два года.
- copyright | n | ˈkɒpɪraɪt | ˈkɑːpiːraɪt | авторское право | the legal right to a book, song, etc. | The *copyright* belongs to the author. | Авторские права принадлежат автору.
- deed | n | diːd |  | поступок, деяние | an action, especially a very good or bad one | He was praised for his good *deeds*. | Его хвалили за добрые дела.
- fraud | n | frɔːd |  | мошенничество; подделка | the crime of deceiving people to get money or advantage | He was arrested for credit card *fraud*. | Его арестовали за мошенничество с кредитными картами.
- gangster | n | ˈɡæŋstə | ˈɡæŋstər | гангстер | a member of a criminal gang | He played a *gangster* in the film. | В фильме он сыграл гангстера.
- hijack | v | ˈhaɪdʒæk |  | захватывать (самолёт и т. п.) | to take control of a vehicle by force | Terrorists *hijacked* the plane. | Террористы захватили самолёт.
- jail | n | dʒeɪl |  | тюрьма | a place where criminals are kept | The thief spent two years in *jail*. | Вор провёл два года в тюрьме. | = prison
- judgement | n | ˈdʒʌdʒmənt |  | суждение; решение суда | an opinion; a decision of a court | I trust your *judgement*. | Я доверяю твоему мнению. | амер. judgment
- juror | n | ˈdʒjʊrə | ˈdʒʊrər | присяжный | a member of a jury | The *jurors* found him guilty. | Присяжные признали его виновным.
- jury | n | ˈdʒʊəri | ˈdʒʊri | присяжные; жюри | a group of people who decide if someone is guilty in court | The *jury* found him not guilty. | Присяжные признали его невиновным.
- licence | n | ˈlaɪsəns |  | лицензия, права (брит.) | an official document that allows you to do something | Can I see your driving *licence*? | Можно ваши права? | амер. license
- oath | n | əʊθ | oʊθ | клятва, присяга | a formal promise | He took an *oath* never to leave his land. | Он поклялся никогда не покидать свою землю.
- offence | n | əˈfens |  | правонарушение; обида | a crime; a feeling of being upset | It's an *offence* to drive without insurance. | Ездить без страховки — правонарушение. | амер. offense
- offender | n | əˈfendə | əˈfendər | правонарушитель | a person who commits a crime | Young *offenders* need help. | Молодым правонарушителям нужна помощь.
- offense | n | əˈfens |  | преступление, правонарушение; обида | an illegal act; the feeling of being insulted | Driving without a license is an *offense*. | Езда без прав — правонарушение. | брит. offence; take offense — обидеться
- piracy | n | ˈpaɪərəsi | ˈpaɪrəsi | пиратство | copying films, music, etc. illegally; robbing ships | Online *piracy* costs the film industry billions. | Онлайн-пиратство обходится киноиндустрии в миллиарды.
- shoplifting | n | ˈʃɒplɪftɪŋ | ˈʃɑːplɪftɪŋ | магазинная кража | stealing from a shop | He was arrested for *shoplifting*. | Его задержали за кражу в магазине.
- suspect | v | səˈspekt |  | подозревать | to think that something is probably true, often something bad | I *suspect* he is not telling the truth. | Подозреваю, что он говорит неправду. | сущ. suspect [ˈsʌspekt] — подозреваемый
- theft | n | θeft |  | кража | the crime of stealing | He reported the *theft* of his bike to the police. | Он заявил в полицию о краже велосипеда. | thief — вор
- traitor | n | ˈtreɪtə | ˈtreɪtər | предатель | a person who betrays their country or friends | He was called a *traitor*. | Его назвали предателем.
- trial | n | ˈtraɪəl |  | суд, судебный процесс; испытание | the process in court to decide if someone is guilty | The *trial* lasted three weeks. | Судебный процесс длился три недели.
- vandalism | n | ˈvændəlɪzəm |  | вандализм | damaging property on purpose | *Vandalism* is a problem in the area. | В районе проблема с вандализмом.
- violence | n | ˈvaɪələns |  | насилие | physical force intended to hurt | The film contains scenes of *violence*. | В фильме есть сцены насилия.
- witness | n | ˈwɪtnəs |  | свидетель | a person who sees a crime or an accident | Police are looking for *witnesses* to the accident. | Полиция ищет свидетелей аварии.
