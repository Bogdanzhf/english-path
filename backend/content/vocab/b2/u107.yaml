title: Society and politics
title_ru: Общество и политика
topic: society
words:
- Catholic | adj | ˈkæθlɪk |  | католический | belonging to the Roman Catholic Church | The village had a small *Catholic* church. | В деревне была маленькая католическая церковь.
- colony | n | ˈkɒləni | ˈkɑːləni | колония | a country or area controlled by another country; a group of animals living together | Australia was once a British *colony*. | Австралия когда-то была британской колонией.
- congress | n | ˈkɒŋɡres | ˈkɑːŋɡrəs | конгресс, съезд | a large formal meeting; the law-making body of the USA | The plan must be approved by *Congress*. | План должен одобрить Конгресс.
- formation | n | fɔːˈmeɪʃn | fɔːrˈmeɪʃn | образование, формирование | the process of forming | Trees help the *formation* of rain clouds. | Деревья способствуют образованию дождевых облаков.
- forum | n | ˈfɔːrəm |  | форум | a place where people can discuss things, especially online | He posted his theory on an online *forum*. | Он выложил свою теорию на интернет-форуме.
- institution | n | ˌɪnstɪˈtjuːʃn | ˌɪnstɪˈtuːʃn | учреждение, институт | a large important organization | Banks and universities are important *institutions*. | Банки и университеты — важные учреждения.
- ministry | n | ˈmɪnɪstri |  | министерство | a government department | The health *ministry* launched a sleep campaign. | Министерство здравоохранения запустило кампанию о сне.
- mission | n | ˈmɪʃn |  | миссия, задание | an important job, often in another place | The astronauts returned from their *mission*. | Астронавты вернулись из полёта.
- patrol | n | pəˈtrəʊl | pəˈtroʊl | патруль | a group of soldiers or police who move around an area to guard it | A police *patrol* stopped the car. | Полицейский патруль остановил машину. | гл. patrol — патрулировать
- racial | adj | ˈreɪʃl |  | расовый | connected with race | The law bans *racial* discrimination. | Закон запрещает расовую дискриминацию.
- rank | n | ræŋk |  | ранг, звание | a position in a group or organisation | He reached the *rank* of captain. | Он дослужился до звания капитана.
- senate | n | ˈsenət |  | сенат | a group of people who make laws or advise a ruler | The Roman *Senate* met in a large building in the city centre. | Римский сенат заседал в большом здании в центре города.
- troops | n | truːps |  | войска | soldiers | The government sent *troops* to the border. | Правительство направило войска к границе.
