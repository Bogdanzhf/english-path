title: 'Describing: good or bad'
title_ru: 'Описание: оценка — хорошо или плохо'
topic: describing
words:
- delicate | adj | ˈdelɪkət |  | нежный, хрупкий | easily damaged; soft and fine | Wash *delicate* clothes by hand. | Деликатные вещи стирайте вручную.
- handy | adj | ˈhændi |  | удобный, полезный | useful and easy to use | This app is really *handy*. | Это приложение очень удобное. | come in handy — пригодиться
- magnificent | adj | mæɡˈnɪfɪsnt |  | великолепный | very beautiful and impressive | The view from the top was *magnificent*. | Вид с вершины был великолепным.
- memorable | adj | ˈmemərəbl |  | запоминающийся | easy to remember because it is special | It was a *memorable* evening. | Это был незабываемый вечер.
- miserable | adj | ˈmɪzrəbl |  | несчастный, жалкий | very unhappy | I felt *miserable* when I had the flu. | Когда у меня был грипп, мне было очень плохо.
- spectacular | adj | spekˈtækjələ | spekˈtækjələr | впечатляющий, эффектный | very impressive | The growth of the cities was *spectacular*. | Рост городов был впечатляющим.
- terrific | adj | təˈrɪfɪk |  | потрясающий, отличный | very good | You look *terrific*! | Ты потрясающе выглядишь! | не «ужасный»!
- tragic | adj | ˈtrædʒɪk |  | трагический | very sad, often involving death | The whale's death was *tragic* and avoidable. | Гибель кита была трагичной и предотвратимой.
