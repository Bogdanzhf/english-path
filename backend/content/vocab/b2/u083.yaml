title: 'Describing: good or bad'
title_ru: 'Описание: оценка — хорошо или плохо'
topic: describing
words:
- amusing | adj | əˈmjuːsɪŋ | əmˈjuːzɪŋ | забавный | funny | He told an *amusing* story. | Он рассказал забавную историю.
- astonishing | adj | əˈstɒnɪʃɪŋ | əˈstɑːnɪʃɪŋ | поразительный | very surprising | It's an *astonishing* story. | Это поразительная история.
- decorative | adj | ˈdekrətɪv |  | декоративный | for decoration | These plates are just *decorative*. | Эти тарелки просто для красоты.
- destructive | adj | dɪˈstrʌktɪv |  | разрушительный | causing damage | The storm was very *destructive*. | Буря была очень разрушительной.
- disastrous | adj | ˌdɪˈsæstrəs | dɪˈzæstrəs | катастрофический, губительный | very bad | The results were *disastrous*. | Результаты были плачевными.
- enjoyable | adj | ɪnˈdʒɔɪəbl | ˌenˈdʒɔɪəbl | приятный | giving pleasure | We had an *enjoyable* evening. | Мы приятно провели вечер.
- harmless | adj | ˈhɑːmləs | ˈhɑːrmləs | безвредный, безобидный | not dangerous | The snake is *harmless*. | Эта змея безвредна.
- hazardous | adj | ˈhæzədəs | ˈhæzərdəs | опасный | dangerous | *Hazardous* waste must be handled carefully. | С опасными отходами нужно обращаться осторожно.
- inspirational | adj | ˌɪnspəˈreɪʃənl |  | вдохновляющий | giving inspiration | She's an *inspirational* teacher. | Она вдохновляющий учитель.
- notorious | adj | nəʊˈtɔːriəs | noʊˈtɔːriəs | печально известный, пресловутый | famous for something bad | He was *notorious* for his bad temper. | Он был печально известен своим скверным характером.
- outrageous | adj | aʊˈtreɪdʒəs |  | возмутительный | shocking and unfair | The prices are *outrageous*. | Цены возмутительные.
- pointless | adj | ˈpɔɪntləs |  | бессмысленный | without purpose | It's *pointless* to argue. | Спорить бессмысленно.
- risky | adj | ˈrɪski |  | рискованный | dangerous | It's a *risky* plan. | Это рискованный план.
- splendid | adj | ˈsplendɪd |  | великолепный | very impressive; excellent | The view from the hill was *splendid*. | Вид с холма был великолепным.
- terrific | adj | təˈrɪfɪk |  | потрясающий, отличный | very good | You look *terrific*! | Ты потрясающе выглядишь! | не «ужасный»!
- terrifying | adj | ˈterɪfaɪɪŋ | ˈterəfaɪɪŋ | ужасающий | very frightening | It was a *terrifying* experience. | Это было ужасно.
- unacceptable | adj | ʌnəkˈseptəbl | ˌʌnækˈseptəbl | неприемлемый | not acceptable | Your behaviour is *unacceptable*. | Твоё поведение недопустимо.
- understandable | adj | ˌʌndəˈstændəbl | ˌʌndərˈstændəbl | понятный, объяснимый | easy to understand; reasonable | His anger is *understandable*. | Его гнев понятен.
- unreasonable | adj | ʌnˈriːzənəbl | ənˈriːznəbl | неразумный, необоснованный | not fair or sensible | That's an *unreasonable* request. | Это необоснованная просьба.
- worthless | adj | ˈwɜːθləs | ˈwɜːrθləs | ничего не стоящий | having no value | The painting turned out to be *worthless*. | Картина оказалась ничего не стоящей.
- worthwhile | adj | ˈwɜːθwaɪl | ˈwɜːrθwaɪl | стоящий, имеющий смысл | worth the time or effort | All the hard work was *worthwhile*. | Весь тяжёлый труд был не напрасен.
