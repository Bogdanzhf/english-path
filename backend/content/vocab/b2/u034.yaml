title: Shopping and money
title_ru: Покупки и деньги
topic: shopping
words:
- allowance | n | əˈlaʊəns |  | пособие; карманные деньги; норма | money given regularly; an amount allowed | The baggage *allowance* is 20 kg. | Норма багажа — 20 кг.
- booth | n | buːθ |  | кабинка; стенд | a small enclosed space | I called from a phone *booth*. | Я позвонил из телефонной будки.
- 'debit | n | ˈdebɪt |  | дебет, списание | money taken from an account | Pay by direct *debit*. | Оплачивайте автоматическим списанием. | гл.: debit — списывать'
- debit card | n | ˈdebɪt kɑːd | ˈdebɪt kɑːrd | дебетовая карта | a card that takes money from your bank account | Can I pay by *debit card*? | Можно расплатиться дебетовой картой?
- delivery | n | dɪˈlɪvəri |  | доставка | taking goods to a place | *Delivery* is free. | Доставка бесплатная.
- deposit | n | dɪˈpɒzɪt | dɪˈpɑːzɪt | залежь; депозит, залог | a layer of a substance in the ground; money paid as a first payment | Gold *deposits* attract illegal miners. | Месторождения золота привлекают незаконных старателей.
- donation | n | dəʊˈneɪʃən | doʊˈneɪʃən | пожертвование | money given to help | We made a *donation* to the hospital. | Мы сделали пожертвование больнице.
- equity | n | ˈekwɪti | ˈekwəti | равенство, справедливость; капитал | fairness; the value of shares | We believe in *equity* for all. | Мы выступаем за равенство для всех.
- expense | n | ɪkˈspens |  | расход, трата | money that you spend on something | Travel *expenses* will be paid by the company. | Командировочные расходы оплатит компания.
- fund | n | fʌnd |  | фонд, средства | an amount of money collected for a purpose | The school started a *fund* to buy new computers. | Школа открыла фонд для покупки новых компьютеров.
- funding | n | ˈfʌndɪŋ |  | финансирование | money for a project | The project needs more *funding*. | Проекту нужно больше финансирования.
- goodwill | n | ˈɡʊdwɪl | ˈɡʊdˈwɪl | доброжелательность | friendly feelings | The gift was a sign of *goodwill*. | Подарок был знаком доброй воли.
- merchandise | n | ˈmɜːtʃəndaɪs | ˈmɜːrtʃəndaɪs | товары | goods that are bought and sold | All *merchandise* must be paid for at the till. | Все товары нужно оплатить на кассе. | разг. merch — фирменная продукция
- mortgage | n | ˈmɔːɡɪdʒ | ˈmɔːrɡɪdʒ | ипотека | a loan from a bank to buy a house | They took out a *mortgage* to buy their first home. | Они взяли ипотеку, чтобы купить первое жильё. | t не читается
- overhead | adv | ˌəʊvəˈhed | ˌoʊvərˈhed | над головой, наверху | above your head | A flock of geese flew *overhead*. | Над головой пролетела стая гусей.
- ownership | n | ˈəʊnəʃɪp | ˈoʊnərʃɪp | собственность, владение | owning something | Home *ownership* is rising. | Всё больше людей владеют жильём.
- ransom | n | ˈrænsəm |  | выкуп | money demanded for the release of a kidnapped person | The kidnappers demanded a *ransom*. | Похитители потребовали выкуп.
- real estate | n | ril ɪˈsteɪt | riːl ɪˈsteɪt | недвижимость | land and buildings | He works in *real estate*. | Он работает в сфере недвижимости.
- retail | n | ˈriːteɪl |  | розничная торговля | the business of selling goods to the public in shops | She works in *retail*. | Она работает в розничной торговле. | wholesale — оптовая
- salon | n | ˈsælɒn | səˈlɑːn | салон (красоты) | a shop for hair or beauty | She went to a beauty *salon*. | Она сходила в салон красоты.
- stall | n | stɔːl |  | прилавок, ларёк; стойло | a table or small shop in a market | Traders sold souvenirs from *stalls*. | Торговцы продавали сувениры с прилавков.
