title: People and relationships
title_ru: Люди и отношения
topic: people
words:
- beloved | adj | bɪˈlʌvɪd |  | любимый, возлюбленный | loved very much | He returned to his *beloved* hometown. | Он вернулся в свой любимый родной город.
- buddy | n | ˈbʌdi |  | приятель, дружище (амер.) | a friend | He's my best *buddy*. | Он мой лучший друг.
- bully | n | ˈbʊli |  | задира, хулиган | a person who hurts or frightens weaker people | The school has a strict policy against *bullies*. | В школе строгие правила против травли. | гл. bully — запугивать, травить
- chancellor | n | ˈtʃɑːnselə | ˈtʃænsələr | канцлер | the head of government in some countries | The German *Chancellor* visited Paris. | Канцлер Германии посетил Париж.
- countryman | n | ˈkʌntrɪmən | ˈkʌntriːmən | соотечественник | a person from the same country | He beat his *countryman* in the final. | В финале он обыграл своего соотечественника.
- dependent | adj | dɪˈpendənt |  | зависимый | needing someone or something | The country is *dependent* on tourism. | Страна зависит от туризма.
- dwarf | n | dwɔːf | dwɔːrf | гном, карлик | a very small person in stories | Snow White and the seven *dwarfs*. | Белоснежка и семь гномов.
- freak | n | friːk |  | фанат, помешанный; урод | a person very interested in something; something very unusual | He's a fitness *freak*. | Он помешан на фитнесе.
- genius | n | ˈdʒiːniəs |  | гений | a very clever or talented person | Einstein was a *genius*. | Эйнштейн был гением.
- guardian | n | ˈɡɑːdiən | ˈɡɑːrdiən | опекун, хранитель | a person who protects someone or something | The museum is the *guardian* of the city's art. | Музей — хранитель городского искусства.
- host | v | həʊst | hoʊst | принимать (гостей), проводить; вести | to organise an event; to present a show | Which city will *host* the next Olympics? | Какой город примет следующую Олимпиаду?
- mate | n | meɪt |  | приятель (брит.); товарищ | a friend | I'm going out with my *mates*. | Я иду гулять с друзьями. | flatmate, classmate — сосед по квартире, одноклассник
- naked | adj | ˈneɪkɪd | ˈneɪkəd | голый | without clothes | You can't see it with the *naked* eye. | Этого не видно невооружённым глазом.
- needy | adj | ˈniːdi |  | нуждающийся | poor and needing help | The charity helps *needy* families. | Благотворительный фонд помогает нуждающимся семьям.
- opponent | n | əˈpəʊnənt | əˈpoʊnənt | противник, соперник | a person you play or fight against | He shook hands with his *opponent* after the match. | После матча он пожал руку сопернику.
- peer | v | pɪə | pɪr | вглядываться | to look closely because it's hard to see | She *peered* into the dark room. | Она всматривалась в тёмную комнату. | сущ. peer — ровесник
- resident | n | ˈrezɪdənt |  | житель, проживающий | a person who lives in a place | Local *residents* complained about the noise. | Местные жители жаловались на шум.
- warrior | n | ˈwɒriə | ˈwɔːriər | воин | a brave soldier, especially in the past | The Vikings were fierce *warriors*. | Викинги были свирепыми воинами.
- wed | v | wed |  | вступать в брак (книжн.) | to marry | They *wed* in a small church. | Они обвенчались в маленькой церкви.
