title: 'How and how much: adverbs'
title_ru: 'Как и насколько: наречия'
topic: manner
words:
- hence | adv | hens |  | следовательно, отсюда | for this reason (formal) | He was tired, *hence* his mistakes. | Он устал, отсюда и ошибки.
- rapidly | adv | ˈræpɪdli |  | быстро, стремительно | very quickly | The town is growing *rapidly*. | Город стремительно растёт.
