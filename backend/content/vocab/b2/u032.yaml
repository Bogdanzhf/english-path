title: 'How and how much: adverbs'
title_ru: 'Как и насколько: наречия'
topic: manner
words:
- accidentally | adv | ˌæksɪˈdentəli | ˌæksəˈdenəli | случайно | by accident | I *accidentally* deleted the file. | Я случайно удалил файл.
- actively | adv | ˈæktɪvli |  | активно | in an active way | She is *actively* looking for a job. | Она активно ищет работу.
- additionally | adv | əˈdɪʃənəli | əˈdɪʃənʌli | кроме того, дополнительно | also | *Additionally*, we offer free delivery. | Кроме того, доставка бесплатная.
- briefly | adv | ˈbriːfli |  | кратко; ненадолго | for a short time; in a few words | He spoke *briefly* about his trip. | Он кратко рассказал о поездке.
- commonly | adv | ˈkɒmənli | ˈkɑːmənli | обычно, часто | usually; often | This word is *commonly* used. | Это слово часто употребляется.
- consistently | adv | kənˈsɪstəntli |  | последовательно, неизменно | always in the same way | She has *consistently* got good marks. | Она неизменно получает хорошие оценки.
- hence | adv | hens |  | следовательно, отсюда | for this reason (formal) | He was tired, *hence* his mistakes. | Он устал, отсюда и ошибки.
- increasingly | adv | ɪnˈkriːsɪŋli | ɪnˈkriːsɪŋɡli | всё более | more and more | It's becoming *increasingly* difficult. | Это становится всё сложнее.
- merely | adv | ˈmiəli | ˈmɪrli | лишь, просто | only | I *merely* asked a question. | Я всего лишь задал вопрос.
- openly | adv | ˈəʊpənli | ˈoʊpənli | открыто | without hiding | They talked *openly* about the problem. | Они открыто говорили о проблеме.
- potentially | adv | pəˈtenʃəli |  | потенциально | possibly | This is a *potentially* dangerous situation. | Это потенциально опасная ситуация.
- practically | adv | ˈpræktɪkli | ˈpræktɪkəli | практически; на практике | almost; in a practical way | I've *practically* finished. | Я практически закончил.
- precisely | adv | prɪˈsaɪsli | priːˈsaɪsli | точно, именно | exactly | That's *precisely* what I mean. | Именно это я и имею в виду.
- rapidly | adv | ˈræpɪdli |  | быстро, стремительно | very quickly | The town is growing *rapidly*. | Город стремительно растёт.
- simultaneously | adv | ˌsɪməlˈteɪniəsli | ˌsaɪməlˈteɪniəsli | одновременно | at the same time | The two events happened *simultaneously*. | Оба события произошли одновременно.
- sometime | adv | ˈsʌmtaɪm |  | когда-нибудь, как-нибудь | at some time | Let's meet *sometime* next week. | Давай встретимся как-нибудь на следующей неделе.
- strictly | adv | ˈstrɪktli |  | строго | in a strict way | Smoking is *strictly* forbidden. | Курение строго запрещено.
- subsequently | adv | ˈsʌbsɪkwəntli | ˈsʌbsəkwəntli | впоследствии | later | He was *subsequently* arrested. | Впоследствии его арестовали.
- virtually | adv | ˈvɜːtʃuːəli | ˈvɜːrtʃuːəli | практически, фактически | almost | The town was *virtually* empty. | Город был практически пуст.
