title: 'How and how much: adverbs'
title_ru: 'Как и насколько: наречия'
topic: manner
words:
- clockwise | adv | ˈklɒkwaɪz | ˈklɑːkwaɪz | по часовой стрелке | in the same direction as the hands of a clock | Turn the lid *clockwise* to close it. | Поверните крышку по часовой стрелке, чтобы закрыть. | anticlockwise — против часовой
- ecologically | adv | ˌiːkəˈlɒdʒɪkli | ˌiːkəˈlɑːdʒɪkli | экологически | in a way connected with the environment | The coral reef is *ecologically* important. | Коралловый риф важен с экологической точки зрения.
