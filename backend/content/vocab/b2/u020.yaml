title: Idioms
title_ru: Идиомы
topic: idioms
words:
- a blessing in disguise | phr |  |  | не было бы счастья, да несчастье помогло | something bad that turns out good | Losing that job was *a blessing in disguise*. | Потеря той работы оказалась к лучшему.
- a drop in the ocean | phr |  |  | капля в море | a very small amount compared to what is needed | £100 is *a drop in the ocean*. | 100 фунтов — капля в море.
- beat around the bush | phr |  |  | ходить вокруг да около | to avoid saying something directly | Stop *beating around the bush*! | Хватит ходить вокруг да около!
- break the ice | phr |  |  | растопить лёд, разрядить обстановку | to make people feel relaxed | He told a joke to *break the ice*. | Он рассказал шутку, чтобы разрядить обстановку.
- burn the midnight oil | phr |  |  | засиживаться за работой допоздна | to work late into the night | I *burned the midnight oil* before the exam. | Перед экзаменом я сидел до глубокой ночи.
- cost an arm and a leg | phr |  |  | стоить целое состояние | to be very expensive | That car *cost an arm and a leg*. | Эта машина стоила целое состояние.
- cut corners | phr |  |  | халтурить, экономить на качестве | to do something badly to save time or money | Don't *cut corners* on safety. | Не экономьте на безопасности.
- face the music | phr |  |  | отвечать за последствия | to accept punishment | You'll have to *face the music*. | Тебе придётся ответить за это.
- get the hang of | phr |  |  | наловчиться, освоить | to learn how to do something | You'll soon *get the hang of* it. | Ты скоро освоишься.
- go the extra mile | phr |  |  | сделать больше, чем требуется | to make extra effort | She always *goes the extra mile* for her clients. | Она всегда делает для клиентов больше, чем нужно.
- hit the books | phr |  |  | засесть за учёбу | to study hard | I need to *hit the books* tonight. | Сегодня мне надо засесть за учёбу.
- hit the nail on the head | phr |  |  | попасть в точку | to say exactly the right thing | You've *hit the nail on the head*. | Ты попал в самую точку.
- in hot water | phr |  |  | в беде, в неприятностях | in trouble | He's *in hot water* with his boss. | У него неприятности с начальником.
- in the nick of time | phr |  |  | в последний момент | just in time | We arrived *in the nick of time*. | Мы приехали в самый последний момент.
- keep your fingers crossed | phr |  |  | держать кулачки (скрестить пальцы) | to hope for good luck | *Keep your fingers crossed* for me! | Держи за меня кулачки!
