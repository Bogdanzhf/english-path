title: Objects and materials
title_ru: Предметы и материалы
topic: objects
words:
- ax | n | æks |  | топор | a tool with a heavy blade for cutting wood | He cut the wood with an *ax*. | Он колол дрова топором. | брит. axe
- binoculars | n | bɪˈnɒkjələz | bɪˈnɑːkjələrz | бинокль | a device with two lenses for seeing things far away | He scanned the horizon with his *binoculars*. | Он осматривал горизонт в бинокль.
- cardboard | n | ˈkɑːdbɔːd | ˈkɑːrdbɔːrd | картон | thick stiff paper | The model ships were made of *cardboard*. | Модели кораблей были сделаны из картона.
- dye | v | daɪ |  | красить (ткань, волосы) | to change the colour of something with a special liquid | She *dyed* her hair blue. | Она покрасила волосы в синий. | не путайте с die — умирать
- grease | n | ɡriːs |  | смазка, жир | a thick oily substance | His hands were covered in *grease*. | Его руки были в смазке.
- kerosene | n | ˈkerəsiːn |  | керосин | an oil used as fuel for lamps and engines | They lit the *kerosene* lamp. | Они зажгли керосиновую лампу. | брит. также paraffin
- raft | n | rɑːft | ræft | плот | a flat boat made of pieces of wood tied together | They crossed the river on a *raft*. | Они переправились через реку на плоту.
- rubble | n | ˈrʌbl |  | обломки, щебень | broken pieces of stone and brick | They searched through the *rubble* for survivors. | Они искали выживших среди обломков.
- rust | n | rʌst |  | ржавчина | the red-brown substance on old iron | The old sword was covered in *rust*. | Старый меч был покрыт ржавчиной.
- shovel | n | ˈʃʌvl |  | лопата (совковая) | a tool for lifting and moving soil | The farmers dug with *shovels*. | Фермеры копали лопатами.
- spade | n | speɪd |  | лопата | a tool for digging | He bought a new *spade* with the loan. | На заём он купил новую лопату.
- starch | n | stɑːtʃ | stɑːrtʃ | крахмал | a white substance found in potatoes, rice and bread | Potatoes are full of *starch*. | В картофеле много крахмала.
- steel | n | stiːl |  | сталь | a strong hard metal made from iron | The bridge is made of *steel*. | Мост сделан из стали. | не путайте с steal — красть
- thermometer | n | θəˈmɒmɪtə | θərˈmɑːmɪtər | термометр | an instrument for measuring temperature | The *thermometer* showed 45 degrees. | Термометр показывал 45 градусов.
- tusk | n | tʌsk |  | бивень | a long pointed tooth of an elephant | Ivory comes from elephant *tusks*. | Слоновая кость добывается из слоновьих бивней.
