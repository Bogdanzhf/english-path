title: Events and situations
title_ru: События и ситуации
topic: events
words:
- attainment | n | əˈteɪnmənt |  | достижение | reaching a goal | Pupils' *attainment* has improved. | Успеваемость учеников улучшилась.
- defeat | n | dɪˈfiːt |  | поражение | the fact of losing a game, fight or war | It was the team's first *defeat* of the season. | Это было первое поражение команды в сезоне. | гл. defeat — победить, нанести поражение
- endeavour | n | ɪnˈdevə | ɪnˈdevər | стремление, усилие | an attempt | Good luck in your future *endeavours*. | Удачи в ваших начинаниях. | амер. endeavor
- errand | n | ˈerənd |  | поручение | a short trip to do a job, like buying something | I have some *errands* to run in town. | Мне нужно сделать кое-какие дела в городе.
- flutter | n | ˈflʌtə | ˈflʌtər | трепет, порхание | a quick light movement | I felt a *flutter* of excitement. | Я почувствовал трепет волнения.
- gasp | n | ɡɑːsp | ɡæsp | вздох (от удивления), удушье | a sudden breath in | There was a *gasp* from the audience. | Публика ахнула.
- gulp | n | ɡʌlp |  | глоток | a large swallow | He drank it in one *gulp*. | Он выпил это одним глотком.
- incident | n | ˈɪnsɪdənt |  | случай, происшествие | an event, often unpleasant | The police are investigating the *incident*. | Полиция расследует происшествие.
- instance | n | ˈɪnstəns |  | пример, случай | an example | There are many *instances* of kindness in this story. | В этой истории много примеров доброты. | for instance — например
- interruption | n | ˌɪntəˈrʌpʃən |  | перерыв, помеха | stopping something | Sorry for the *interruption*. | Извините, что перебиваю.
- "modernization | n | ˌm\x01ːdɜːnaɪˈzeɪʃə | ˌmɑːdərnaɪˈzeɪʃə | модернизация | making modern | The factory needs *modernization*. | Заводу нужна модернизация."
- outcome | n | ˈaʊtkʌm |  | результат, исход | the result of an event | Nobody could predict the *outcome* of the election. | Никто не мог предсказать исход выборов.
- overuse | n | ˌəʊvəˈjuːs | ˌoʊvərˈjuːs | чрезмерное использование | using too much of something | The *overuse* of plastic is a global problem. | Чрезмерное использование пластика — глобальная проблема.
- pastime | n | ˈpɑːstaɪm | ˈpæstaɪm | времяпрепровождение, хобби | an activity you do for fun | Fishing is his favourite *pastime*. | Рыбалка — его любимое занятие.
- precaution | n | prɪˈkɔːʃn |  | мера предосторожности | something done to prevent harm | As a *precaution*, borrowers worked in small groups. | В качестве меры предосторожности заёмщики работали небольшими группами.
- reflex | n | ˈriːfleks |  | рефлекс | an action your body does automatically | Blinking is a *reflex*. | Моргание — это рефлекс.
- reinforcement | n | ˌriːɪnˈfɔːsmənt | ˌriːɪnˈfɔːrsmənt | подкрепление; укрепление | extra help; making stronger | Positive *reinforcement* helps children learn. | Похвала помогает детям учиться.
- revolution | n | ˌrevəˈluːʃn |  | революция | a big change, often when people remove their government by force | The French *Revolution* began in 1789. | Французская революция началась в 1789 году.
- taunt | n | tɔːnt |  | насмешка | a cruel remark | He ignored their *taunts*. | Он не обращал внимания на их насмешки.
- transfusion | n | trænsˈfjuːʒən |  | переливание (крови) | putting blood into a person | He needed a blood *transfusion*. | Ему потребовалось переливание крови.
- tremor | n | ˈtremə | ˈtremər | дрожь; толчок (подземный) | shaking | We felt a small earth *tremor*. | Мы почувствовали небольшой подземный толчок.
