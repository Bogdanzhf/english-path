title: Events and situations
title_ru: События и ситуации
topic: events
words:
- absence | n | ˈæbsəns |  | отсутствие | the fact of not being somewhere | Nobody noticed his *absence* from the meeting. | Никто не заметил его отсутствия на собрании. | absent — отсутствующий
- anxiety | n | æŋˈzaɪəti |  | тревога, беспокойство | a feeling of worry and fear | Exams cause a lot of *anxiety* for students. | Экзамены вызывают у студентов сильную тревогу.
- darkness | n | ˈdɑːknəs | ˈdɑːrknəs | темнота | the lack of light | The room was in *darkness*. | В комнате было темно.
- existence | n | ɪɡˈzɪstəns | eɡˈzɪstəns | существование | being real | Do you believe in the *existence* of ghosts? | Ты веришь в существование призраков?
- extent | n | ɪkˈstent |  | степень, размер | how big or important something is | We don't know the full *extent* of the damage. | Мы не знаем полного масштаба ущерба. | to some extent — в некоторой степени
- fame | n | feɪm |  | слава, известность | being known by many people | She found *fame* as a singer when she was only sixteen. | Она прославилась как певица, когда ей было всего шестнадцать.
- glory | n | ˈɡlɔːri |  | слава, великолепие | great fame, honour or beauty | The old palace has been restored to its former *glory*. | Старому дворцу вернули былое великолепие.
- lighting | n | ˈlaɪtɪŋ |  | освещение | the lights in a place | The *lighting* in the room is poor. | В комнате плохое освещение.
- murmur | n | ˈmɜːmə | ˈmɜːrmər | шёпот, ропот | a quiet low sound | There was a *murmur* of agreement. | Раздался одобрительный гул.
- presence | n | ˈprezns |  | присутствие | being in a place; being noticed | The company has a strong online *presence*. | У компании сильное присутствие в интернете.
- priority | n | praɪˈɒrəti | praɪˈɔːrəti | приоритет | something more important than other things | Safety is our top *priority*. | Безопасность — наш главный приоритет.
- rattle | n | ˈrætl |  | погремушка; грохот | a baby's toy that makes noise; a rattling sound | The baby shook its *rattle*. | Малыш тряс погремушку.
- recognition | n | ˌrekəɡˈnɪʃn |  | признание | praise and respect for something you have done | She received *recognition* for her work with children. | Её работа с детьми получила признание.
- reputation | n | ˌrepjuːˈteɪʃən | ˌrepjəˈteɪʃən | репутация | what people think of you | The hotel has a good *reputation*. | У отеля хорошая репутация.
- setback | n | ˈsetbæk |  | неудача, препятствие | a problem that delays progress | The injury was a big *setback*. | Травма стала серьёзной неудачей.
- summit | n | ˈsʌmɪt |  | вершина; саммит | the top of a mountain; a meeting of leaders | They reached the *summit* at noon. | Они достигли вершины в полдень.
- survival | n | səˈvaɪvl | sərˈvaɪvl | выживание | continuing to live | The animals' *survival* is in danger. | Выживание животных под угрозой.
- tension | n | ˈtenʃən |  | напряжение, напряжённость | stress; tightness | There's *tension* between the two countries. | Между двумя странами напряжённость.
- twinkle | n | ˈtwɪŋkl |  | мерцание, искорка | a small light that shines and fades | She had a *twinkle* in her eye. | В её глазах мелькала искорка.
- unity | n | ˈjuːnəti |  | единство | the state of being united | The king called for national *unity*. | Король призвал к национальному единству.
