title: Events and situations
title_ru: События и ситуации
topic: events
words:
- adversity | n | ædˈvəsɪti | ædˈvɜːrsɪtiː | невзгоды, трудности | difficult situations | She showed courage in the face of *adversity*. | Она проявила мужество перед лицом невзгод.
- blindness | n | ˈblaɪndnəs |  | слепота | being unable to see | The disease can cause *blindness*. | Болезнь может вызвать слепоту.
- circumstance | n | ˈsɜːkəmstəns | ˈsɜːrkəmstæns | обстоятельство | a fact or condition that affects a situation | Under the *circumstances*, we did our best. | В сложившихся обстоятельствах мы сделали всё, что могли.
- coherence | n | kəʊˈhiərəns | koʊˈhɪrəns | связность, последовательность | being logical and clear | The essay lacks *coherence*. | В сочинении не хватает связности.
- deficiency | n | dɪˈfɪʃnsi |  | недостаток, дефицит | a lack of something that is needed | Vitamin D *deficiency* is common in winter. | Зимой часто бывает дефицит витамина D.
- desolation | n | ˌdesəˈleɪʃən |  | запустение; отчаяние | emptiness; great sadness | The landscape was one of total *desolation*. | Местность была совершенно пустынной.
- desperation | n | ˌdespəˈreɪʃən |  | отчаяние | the feeling of having no hope | In *desperation*, he called the police. | В отчаянии он позвонил в полицию.
- disagreement | n | ˌdɪsəˈɡriːmənt | dɪsəˈɡriːmənt | разногласие | not agreeing | We had a *disagreement* about money. | У нас были разногласия из-за денег.
- disgrace | n | dɪsˈɡreɪs |  | позор | loss of respect | His behaviour is a *disgrace*. | Его поведение — позор.
- exhaustion | n | ɪɡˈzɔːstʃən |  | изнеможение | extreme tiredness | She collapsed from *exhaustion*. | Она упала от изнеможения.
- fascination | n | ˌfæsɪˈneɪʃən | ˌfæsəˈneɪʃən | очарование, увлечение | great interest | He has a *fascination* with trains. | Он увлечён поездами.
- handicap | n | ˈhændikæp |  | помеха, препятствие; инвалидность | something that makes progress difficult | Not speaking the language was a big *handicap*. | Незнание языка было серьёзной помехой.
- humiliation | n | ˌhjuːmɪlɪˈeɪʃən | hjuːˌmɪliːˈeɪʃən | унижение | feeling ashamed | He suffered public *humiliation*. | Он пережил публичное унижение.
- irritation | n | ˌɪrɪˈteɪʃən |  | раздражение | annoyance; a sore feeling on skin | The cream may cause skin *irritation*. | Крем может вызвать раздражение кожи.
- loneliness | n | ˈləʊnlinəs | ˈloʊnlinəs | одиночество | the unhappy feeling of being alone | Many elderly people suffer from *loneliness*. | Многие пожилые люди страдают от одиночества.
- predicament | n | prɪˈdɪkəmənt | priːˈdɪkəmənt | затруднительное положение | a difficult situation | We're in a real *predicament*. | Мы в затруднительном положении.
- prominence | n | ˈprɒmɪnəns | ˈprɑːmənəns | известность, видное место | being important or famous | She rose to *prominence* in the 1990s. | Она прославилась в 1990-х.
- repression | n | rɪˈpreʃən | riːˈpreʃən | подавление, репрессия | controlling people by force | The people suffered years of *repression*. | Народ годами страдал от репрессий.
- standstill | n | ˈstændstɪl |  | остановка, застой | a complete stop | Traffic came to a *standstill*. | Движение остановилось.
- unrest | n | ʌnˈrest |  | беспорядки, волнения | angry protests or fighting in a country | There was growing *unrest* in the capital. | В столице нарастали волнения.
