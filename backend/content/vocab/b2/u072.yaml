title: 'How and how much: adverbs'
title_ru: 'Как и насколько: наречия'
topic: manner
words:
- adequately | adv | ˈædɪkwətli | ˈædəkwətli | адекватно, достаточно | well enough | Are you *adequately* prepared? | Ты достаточно подготовлен?
- appropriately | adv | əˈprəʊprɪətli | əˈproʊpriːɪtli | соответственно, уместно | in a suitable way | Please dress *appropriately*. | Пожалуйста, одевайтесь соответственно.
- backward | adv | ˈbækwəd | ˈbækwərd | назад | towards the back | She took a step *backward*. | Она сделала шаг назад. | также backwards
- casually | adv | ˈkæʒuːəli | ˈkæʒəwəli | небрежно, повседневно | in a relaxed way | He was dressed *casually*. | Он был одет повседневно.
- comfortably | adv | ˈkʌmftəbli | ˈkʌmfərtəbli | удобно, комфортно | in a comfortable way | Are you sitting *comfortably*? | Вам удобно сидеть?
- efficiently | adv | ɪˈfɪʃəntli |  | эффективно | without waste | The system works *efficiently*. | Система работает эффективно.
- exceptionally | adv | ɪkˈsepʃənəli |  | исключительно | unusually; very | She's *exceptionally* talented. | Она исключительно талантлива.
- fundamentally | adv | ˌfʌndəˈmentəli | ˌfʌndəˈmenəli | в корне, фундаментально | in a basic way | The two plans are *fundamentally* different. | Эти два плана в корне различаются.
- hugely | adv | ˈhjuːdʒli |  | чрезвычайно, очень | very | The show was *hugely* popular. | Шоу было чрезвычайно популярно.
- ideally | adv | aɪˈdiəli | aɪˈdiːli | в идеале | in the best situation | *Ideally*, we'd leave at eight. | В идеале нам стоит выехать в восемь.
- lastly | adv | ˈlɑːstli | ˈlæstli | наконец, в заключение | finally | *Lastly*, I'd like to thank my family. | И наконец, я хочу поблагодарить семью.
- narrowly | adv | ˈnærəʊli | ˈneroʊli | едва, чуть-чуть | only just | He *narrowly* missed the bus. | Он чуть-чуть не успел на автобус.
- negatively | adv | ˈneɡətɪvli |  | отрицательно, негативно | in a bad way | Stress affects your health *negatively*. | Стресс негативно влияет на здоровье.
- preferably | adv | ˈprefrəbli | ˈprefərəbli | желательно, предпочтительно | if possible | Come early, *preferably* before nine. | Приходите пораньше, желательно до девяти.
- proudly | adv | ˈpraʊdli |  | гордо, с гордостью | with pride | She *proudly* showed us her medal. | Она с гордостью показала нам медаль.
- remarkably | adv | rɪˈmɑːkəbli | riːˈmɑːrkəbli | удивительно, на редкость | unusually | She looks *remarkably* young. | Она выглядит на удивление молодо.
- rightly | adv | ˈraɪtli |  | справедливо, правильно | correctly | He was *rightly* proud of his work. | Он по праву гордился своей работой.
- upwards | adv | ˈʌpwədz | ˈʌpwərdz | вверх | towards a higher place | The smoke rose *upwards* into the sky. | Дым поднимался вверх в небо. | амер. чаще upward
- vice versa | adv | ˌvaɪs ˈvɜːsə | ˌvaɪs ˈvɜːrsə | наоборот | the other way around | Cats chase mice, not *vice versa*. | Кошки гоняются за мышами, а не наоборот.
