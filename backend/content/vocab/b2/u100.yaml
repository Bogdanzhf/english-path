title: 'Describing: good or bad'
title_ru: 'Описание: оценка — хорошо или плохо'
topic: describing
words:
- "complex | n | k\x01ːmpleks | ˈkɑːmpleks | комплекс | a group of buildings; a strong feeling | They live in a new apartment *complex*. | Они живут в новом жилом комплексе."
- critical | adj | ˈkrɪtɪkl |  | критический; критикующий | very important; saying what is wrong | He's very *critical* of my work. | Он очень критично относится к моей работе.
- deceptive | adj | dɪˈseptɪv |  | обманчивый, вводящий в заблуждение | likely to make you believe something that is not true | Appearances can be *deceptive*. | Внешность бывает обманчива.
- disgraceful | adj | dɪsˈɡreɪsfl |  | позорный, возмутительный | very bad and shocking | His behaviour at the party was *disgraceful*. | Его поведение на вечеринке было возмутительным.
- disobedient | adj | ˌdɪsəˈbiːdiənt |  | непослушный | refusing to do what you are told | The *disobedient* pupils were sent to the head teacher. | Непослушных учеников отправили к директору.
- distressing | adj | dɪˈstresɪŋ |  | огорчительный, тягостный | very upsetting | The news was very *distressing*. | Новость была очень печальной.
- failed | adj | feɪld |  | неудавшийся | unsuccessful | It was a *failed* attempt. | Это была неудавшаяся попытка.
- heartwarming | adj | ˈhɑːtwɔːmɪŋ | ˈhɑːrtwɔːrmɪŋ | трогательный | making you feel happy | It's a *heartwarming* film. | Это трогательный фильм.
- horrifying | adj | ˈhɒrɪfaɪɪŋ | ˈhɔːrɪfaɪɪŋ | ужасающий | extremely shocking | The death rate was *horrifying*. | Смертность была ужасающей.
- humiliating | adj | hjuːˈmɪlɪeɪtɪŋ | hjuːˈmɪliːeɪtɪŋ | унизительный | making you feel ashamed | It was a *humiliating* defeat. | Это было унизительное поражение.
- long-distance | adj | ˌlɔːŋˈdistəns | ˌlɔːŋˈdiːstəns | дальний, междугородний | over a long distance | She's in a *long-distance* relationship. | У неё отношения на расстоянии.
- lousy | adj | ˈlaʊsi | ˈlaʊzi | паршивый (разг.) | very bad | The food was *lousy*. | Еда была паршивой.
- preferable | adj | prɪˈfɜːrəbl | ˈprefərəbl | предпочтительный | better | A train is *preferable* to a bus. | Поезд предпочтительнее автобуса.
- prime | adj | praɪm |  | главный, основной | most important | Safety is our *prime* concern. | Безопасность — наша главная забота. | Prime Minister — премьер-министр
- standing | n | ˈstændɪŋ |  | положение, репутация | position in society | He has high *standing* in the community. | У него высокое положение в обществе.
- troublesome | adj | ˈtrʌbəlsʌm | ˈtrʌbəlsəm | хлопотный, причиняющий беспокойство | causing problems | It's a *troublesome* knee injury. | Это неприятная травма колена.
- unattractive | adj | ʌnəˈtræktɪv | ˌʌnəˈtræktɪv | непривлекательный | not attractive | The offer is *unattractive*. | Предложение непривлекательное.
- unbeatable | adj | ʌnˈbiːtəbl | ˌʌnˈbiːtəbl | непревзойдённый | impossible to beat | The prices are *unbeatable*. | Цены вне конкуренции.
- unimaginable | adj | ˌʌnɪˈmædʒɪnəbl |  | невообразимый | impossible to imagine | The scale of the disaster is *unimaginable*. | Масштаб катастрофы невообразим.
- wondrous | adj | ˈwʌndrəs |  | чудесный, удивительный | wonderful | It was a *wondrous* sight. | Это было чудесное зрелище.
