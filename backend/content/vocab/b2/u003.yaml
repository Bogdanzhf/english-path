title: Everyday phrases
title_ru: Разговорные фразы
topic: phrases
words:
- a bit of a... | phr |  |  | немного, в некотором роде | rather | It was *a bit of a* shock. | Это было своего рода потрясением.
- a means of something | phr |  |  | средство (чего-либо) | a way of doing | Music is *a means of* expression. | Музыка — средство самовыражения.
- accused of something | phr |  |  | обвиняемый в | said to have done something wrong | He was *accused of* stealing. | Его обвинили в краже.
- act as something | phr |  |  | выступать в роли | to have a particular role | She *acted as* our guide. | Она была нашим гидом.
- aimed at doing something | phr |  |  | направленный на (что-либо) | intended to | The plan is *aimed at* reducing traffic. | План направлен на сокращение пробок.
- aimed at somebody | phr |  |  | рассчитанный на (кого-либо) | intended for | The book is *aimed at* teenagers. | Книга рассчитана на подростков.
- all the way | phr |  |  | всю дорогу; полностью | the whole distance; completely | We walked *all the way* home. | Мы шли пешком всю дорогу до дома.
- appeal to somebody | phr |  |  | нравиться, привлекать | to attract or interest | The idea doesn't *appeal to* me. | Мне эта идея не нравится.
- apply to somebody/something | phr |  |  | относиться к, касаться | to affect or be relevant to | The rules *apply to* everyone. | Правила касаются всех.
- as a whole | phr |  |  | в целом | considering all parts together | The country *as a whole* is doing well. | Страна в целом развивается хорошо.
- as far as i am concerned | phr |  |  | что касается меня | in my opinion | *As far as I am concerned*, it's a mistake. | По-моему, это ошибка.
- as follows... | phr |  |  | следующий, как указано ниже | used before a list | The rules are *as follows*. | Правила следующие.
- as for somebody/something | phr |  |  | что касается | used to start talking about something else | *As for* the money, don't worry. | Что касается денег, не волнуйся.
- as long as... | phr |  |  | при условии что, если | only if | You can go *as long as* you're back by ten. | Можешь идти, если вернёшься к десяти.
- as though... | phr |  |  | как будто | as if | She looked *as though* she was tired. | Она выглядела так, будто устала.
- associated with something | phr |  |  | связанный с | connected with | The risks *associated with* smoking are well known. | Риски, связанные с курением, хорошо известны.
- at once | phr |  |  | сразу, немедленно; одновременно | immediately; at the same time | Come here *at once*! | Иди сюда немедленно!
- at present | phr |  |  | в настоящее время | now | *At present*, she's working in Paris. | Сейчас она работает в Париже.
- at some point | phr |  |  | в какой-то момент | at a time that is not known | *At some point*, you'll have to decide. | Рано или поздно тебе придётся решить.
- at the end of the day | phr |  |  | в конечном счёте | when everything is considered | *At the end of the day*, it's your choice. | В конечном итоге это твой выбор.
- at this point | phr |  |  | на данном этапе, в этот момент | now; at this moment | *At this point*, we can't say more. | На данный момент мы больше ничего сказать не можем.
- at this stage | phr |  |  | на этом этапе | at this time in a process | It's too early to decide *at this stage*. | На этом этапе решать слишком рано.
