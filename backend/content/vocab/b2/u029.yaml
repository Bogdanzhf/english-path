title: Actions and movement
title_ru: Действия и движение
topic: actions
words:
- abandon | v | əˈbændən |  | бросать, покидать | to leave someone or something and not come back | They had to *abandon* the car in the snow. | Им пришлось бросить машину в снегу.
- cancel | v | ˈkænsl |  | отменять | to decide that something planned will not happen | The flight was *cancelled* because of the snow. | Рейс отменили из-за снега. | брит. cancelled, амер. canceled
- exploit | v | ɪkˈsplɔɪt |  | эксплуатировать; использовать | to use something fully; to use people unfairly | The company *exploited* its workers. | Компания эксплуатировала своих работников.
- extract | v | ɪkˈstrækt |  | извлекать, добывать | to remove or take out something, especially with effort | Oil is *extracted* from olives. | Масло получают из оливок. | сущ. extract [ˈekstrækt] — экстракт; отрывок
- spoil | v | spɔɪl |  | портить(ся); баловать | to ruin something; to become bad (food) | The rain *spoiled* our picnic. | Дождь испортил нам пикник.
- strain | v | streɪn |  | напрягать(ся); растягивать | to try very hard; to injure a muscle by using it too much | He *strained* his back lifting the box. | Он потянул спину, поднимая коробку.
- tackle | v | ˈtækl |  | решать, браться за (проблему) | to deal with a difficult problem | The barons wanted to *tackle* the king's abuse of power. | Бароны хотели справиться со злоупотреблениями короля.
- transmit | v | trænzˈmɪt |  | передавать | to pass something from one person or place to another | The disease is *transmitted* through the air. | Болезнь передаётся воздушно-капельным путём.
