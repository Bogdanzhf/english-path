title: Actions and movement
title_ru: Действия и движение
topic: actions
words:
- duplicate | v | ˈdjuːplɪkeɪt | ˈduːplɪkeɪt | дублировать, копировать | to make an exact copy | Important systems were *duplicated* for safety. | Важные системы дублировались для безопасности.
- exploit | v | ɪkˈsplɔɪt |  | эксплуатировать; использовать | to use something fully; to use people unfairly | The company *exploited* its workers. | Компания эксплуатировала своих работников.
- extract | v | ɪkˈstrækt |  | извлекать, добывать | to remove or take out something, especially with effort | Oil is *extracted* from olives. | Масло получают из оливок. | сущ. extract [ˈekstrækt] — экстракт; отрывок
- float | v | fləʊt | floʊt | плавать (на поверхности), держаться на воде | to stay on top of water | Wood *floats* on water. | Дерево плавает в воде.
- regain | v | rɪˈɡeɪn |  | вернуть, восстановить | to get back | She *regained* consciousness. | Она пришла в сознание.
- resistant | adj | rɪˈsɪstənt | riːˈzɪstənt | устойчивый, стойкий | not harmed by something | This watch is water-*resistant*. | Эти часы водонепроницаемы.
- safeguard | v | ˈseɪfɡɑːd | ˈseɪfɡɑːrd | защищать, охранять | to protect | We must *safeguard* our children's future. | Мы должны защитить будущее наших детей.
- soak | v | səʊk | soʊk | замачивать; промокать насквозь | to put in water for a long time | *Soak* the beans overnight. | Замочите фасоль на ночь.
- spoil | v | spɔɪl |  | портить(ся); баловать | to ruin something; to become bad (food) | The rain *spoiled* our picnic. | Дождь испортил нам пикник.
- transmit | v | trænzˈmɪt |  | передавать | to pass something from one person or place to another | The disease is *transmitted* through the air. | Болезнь передаётся воздушно-капельным путём.
- unauthorized | adj | əˈnɔːθɜːaɪzd | əˈnɔːθəraɪzd | несанкционированный | without permission | *Unauthorized* access is forbidden. | Несанкционированный доступ запрещён. | брит. также unauthorised
- unavailable | adj | ʌnəˈveɪləbl | ˌʌnəˈveɪləbl | недоступный, занятый | not available | The manager is *unavailable* right now. | Менеджер сейчас недоступен.
- unchanged | adj | ʌnˈtʃeɪndʒd | ənˈtʃeɪndʒd | неизменный | not changed | The town has remained *unchanged* for years. | Город годами не меняется.
- uncommon | adj | ʌnˈkɒmən | ənˈkɑːmən | необычный, редкий | not common | It's not *uncommon* to see deer here. | Оленей здесь видят нередко.
- unpopular | adj | ʌnˈpɒpjʊlə | ˌʌnˈpɑːpjələr | непопулярный | not liked | The new law is very *unpopular*. | Новый закон очень непопулярен.
- unrealistic | adj | ʌnriəˈlɪstɪk | ənˌriːˈlɪstɪk | нереалистичный | not sensible or likely | That's an *unrealistic* plan. | Это нереалистичный план.
- unsafe | adj | ʌnˈseɪf | ənˈseɪf | небезопасный | dangerous | The bridge is *unsafe*. | Мост небезопасен.
- unstable | adj | ʌnˈsteɪbl | ənˈsteɪbl | нестабильный, неустойчивый | likely to change or fall | The ladder is *unstable*. | Лестница неустойчива.
- unsuccessful | adj | ʌnsəkˈsesfl | ˌʌnsəkˈsesfl | неудачный, безуспешный | not successful | His attempt was *unsuccessful*. | Его попытка была неудачной.
- vacant | adj | ˈveɪkənt |  | свободный, незанятый | empty; not used | Is this seat *vacant*? | Это место свободно?
