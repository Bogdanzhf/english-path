title: Actions and movement
title_ru: Действия и движение
topic: actions
words:
- blend | v | blend |  | смешивать | to mix two or more things together | *Blend* the fruit with some yoghurt. | Смешайте фрукты с йогуртом. | blender — блендер
- delete | v | dɪˈliːt |  | удалять | to remove something written or stored on a computer | I accidentally *deleted* the file. | Я случайно удалил файл.
- drag | v | dræɡ |  | тащить, волочить | to pull something heavy along the ground | He *dragged* the heavy box across the floor. | Он протащил тяжёлую коробку по полу.
- grab | v | ɡræb |  | хватать | to take hold of something quickly and roughly | He *grabbed* his coat and ran out. | Он схватил пальто и выбежал.
- insert | v | ɪnˈsɜːt | ɪnˈsɜːrt | вставлять | to put something into something else | *Insert* your card into the machine. | Вставьте карту в банкомат.
- pat | v | pæt |  | похлопывать, гладить | to touch gently several times with a flat hand | He *patted* the dog on the head. | Он погладил собаку по голове.
- pierce | v | pɪəs | pɪrs | прокалывать, пронзать | to make a hole in something with a sharp point | *Pierce* the potatoes with a fork before baking. | Перед запеканием наколите картошку вилкой.
- rub | v | rʌb |  | тереть, потирать | to move your hand or something over a surface while pressing | He *rubbed* his eyes and yawned. | Он потёр глаза и зевнул.
- toss | v | tɒs | tɔːs | подбрасывать, бросать | to throw something lightly | He *tossed* the keys to me. | Он кинул мне ключи. | toss a coin — подбросить монетку
