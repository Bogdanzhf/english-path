title: Work and jobs
title_ru: Работа и профессии
topic: work
words:
- analyst | n | ˈænəlɪst |  | аналитик | a person who analyses data | She's a financial *analyst*. | Она финансовый аналитик.
- biologist | n | baɪˈɒlədʒɪst | baɪˈɑːlədʒɪst | биолог | a scientist who studies living things | The *biologist* studied frogs. | Биолог изучал лягушек.
- caretaker | n | ˈkeəteɪkə | ˈkerteɪkər | смотритель, сторож | a person who looks after a building or property | The school *caretaker* locks the doors every night. | Школьный сторож каждый вечер запирает двери.
- clerical | adj | ˈklerɪkl | ˈklerəkl | канцелярский, конторский | relating to office work | She does *clerical* work. | Она выполняет канцелярскую работу.
- conductor | n | kənˈdʌktə | kənˈdʌktər | дирижёр; кондуктор | a person who leads an orchestra; a person who checks tickets | The *conductor* raised his baton. | Дирижёр поднял палочку.
- consultant | n | kənˈsʌltənt |  | консультант | an expert who gives advice | He's a management *consultant*. | Он консультант по управлению.
- courier | n | ˈkʊriə | ˈkʊriər | курьер | a person or company that delivers parcels | The *courier* left the parcel at the door. | Курьер оставил посылку у двери.
- economist | n | ɪˈkɒnəmɪst | iːˈkɑːnəmɪst | экономист | an expert in economics | *Economists* expect prices to rise. | Экономисты ожидают роста цен.
- fire brigade | n | ˈfaɪə brɪˈɡeɪd | ˈfaɪər brəˈɡeɪd | пожарная команда (брит.) | the group of firefighters | Call the *fire brigade*! | Вызовите пожарных! | амер. fire department
- inventor | n | ɪnˈventə | ˌɪnˈventər | изобретатель | a person who invents things | Edison was a great *inventor*. | Эдисон был великим изобретателем.
- operator | n | ˈɒpəreɪtə | ˈɑːpəreɪtər | оператор | a person who operates a machine or service | Ask the *operator* for help. | Попросите помощи у оператора.
- planner | n | ˈplænə | ˈplænər | планировщик; ежедневник | a person who plans; a diary | She's a wedding *planner*. | Она организатор свадеб.
- presenter | n | prɪˈzentə | ˈprezəntər | ведущий | a person who presents a TV or radio show | He's a TV *presenter*. | Он телеведущий.
- refinery | n | rɪˈfaɪnəri |  | нефтеперерабатывающий завод | a factory where oil or sugar is made pure | He works at an oil *refinery*. | Он работает на НПЗ.
- retailer | n | ˈriːteɪlə | ˈriːteɪlər | розничный продавец, ритейлер | a shop or company that sells to the public | It's the UK's biggest *retailer*. | Это крупнейший ритейлер в Великобритании.
- shepherd | n | ˈʃepəd | ˈʃepərd | пастух | a person who looks after sheep | The *shepherd* led his sheep down the hill. | Пастух вёл овец с холма.
- steward | n | ˈstjuːəd | ˈstuːərd | стюард, распорядитель | a person who looks after passengers on a ship or plane | The *steward* brought us some water. | Стюард принёс нам воды.
- supplier | n | səˈplaɪə | səˈplaɪər | поставщик | a company that provides goods | We changed our *supplier*. | Мы сменили поставщика.
- trader | n | ˈtreɪdə | ˈtreɪdər | торговец; трейдер | a person who buys and sells | He's a market *trader*. | Он торгует на рынке.
- workshop | n | ˈwɜːkʃɒp | ˈwɜːrkʃɑːp | мастерская; семинар | a room for making things; a practical class | I went to a writing *workshop*. | Я сходил на писательский семинар.
