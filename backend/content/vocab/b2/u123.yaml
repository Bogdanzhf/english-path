title: 'Describing: qualities'
title_ru: 'Описание: свойства и признаки'
topic: describing
words:
- adequate | adj | ˈædɪkwət |  | достаточный, подходящий | good enough | The hotel was not luxurious, but it was *adequate*. | Отель не был роскошным, но вполне сносным.
- ethical | adj | ˈeθɪkl |  | этичный, этический | morally right | Is it *ethical* to put tracking devices on wild animals? | Этично ли крепить на диких животных датчики?
- flexible | adj | ˈfleksəbl |  | гибкий | able to bend or change easily | I have *flexible* working hours. | У меня гибкий рабочий график.
- fortunate | adj | ˈfɔːtʃənət | ˈfɔːrtʃənət | удачливый, счастливый | lucky | We were *fortunate* to find a hotel so late. | Нам повезло найти отель так поздно.
- foul | adj | faʊl |  | мерзкий, отвратительный; ненастный | very unpleasant; (of weather) stormy | The weather was *foul*. | Погода была отвратительной. | сущ. foul — нарушение (в спорте)
- innovative | adj | ˈɪnəveɪtɪv |  | инновационный, новаторский | using new methods and ideas | It was an *innovative* design. | Это была новаторская конструкция.
- oriented | adj | ˈɔːrientɪd |  | ориентированный | focused on something | The company is very profit-*oriented*. | Компания очень ориентирована на прибыль. | брит. также orientated
- polar | adj | ˈpəʊlə | ˈpoʊlər | полярный | connected with the North or South Pole | The *polar* regions are extremely cold. | Полярные районы чрезвычайно холодные.
- sophisticated | adj | səˈfɪstɪkeɪtɪd |  | сложный, изощрённый; утончённый | advanced and complicated; having experience of culture | The software is extremely *sophisticated*. | Это программное обеспечение чрезвычайно сложное.
- swift | adj | swɪft |  | быстрый, стремительный | happening or moving quickly | Thank you for your *swift* reply. | Спасибо за быстрый ответ.
- thorough | adj | ˈθʌrə | ˈθɜːroʊ | тщательный | complete and careful | The police made a *thorough* search of the house. | Полиция тщательно обыскала дом.
- urgent | adj | ˈɜːdʒənt | ˈɜːrdʒənt | срочный, неотложный | needing attention immediately | I have an *urgent* message for the doctor. | У меня срочное сообщение для врача.
