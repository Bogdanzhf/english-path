title: Character and personality
title_ru: Характер и личность
topic: feelings
words:
- cautious | adj | ˈkɔːʃəs |  | осторожный | careful to avoid danger or risks | Be *cautious* when you walk home at night. | Будь осторожен, когда идёшь домой ночью.
- childish | adj | ˈtʃaɪldɪʃ |  | ребяческий, детский | behaving like a child | Don't be so *childish*! | Не будь таким ребёнком!
- funky | adj | ˈfʌŋki |  | модный, клёвый; фанковый | fashionable and unusual; with a strong beat | She has a *funky* haircut. | У неё прикольная стрижка.
- honorable | adj | ˈɒnərəbl | ˈɑːnərəbl | почётный, благородный (амер.) | deserving respect | He's an *honorable* man. | Он благородный человек. | брит. honourable
- humane | adj | hjuːˈmeɪn |  | гуманный | kind and not causing unnecessary suffering | We need a more *humane* way of treating prisoners. | Нам нужно более гуманное обращение с заключёнными. | не путайте с human
- ignorant | adj | ˈɪɡnərənt |  | несведущий, невежественный | not knowing about something | I'm totally *ignorant* about cars. | Я совершенно не разбираюсь в машинах.
- irresponsible | adj | ɪrɪˈspɒnsəbl | ˌɪrəˈspɑːnsəbl | безответственный | not responsible | It was *irresponsible* to leave the child alone. | Было безответственно оставить ребёнка одного.
- lone | adj | ləʊn | loʊn | одинокий, единственный | only one; alone | A *lone* tree stood in the middle of the field. | Посреди поля стояло одинокое дерево.
- modest | adj | ˈmɒdɪst | ˈmɑːdɪst | скромный | not talking much about your success; not large | She's very *modest* about her achievements. | Она очень скромно говорит о своих достижениях.
- naughty | adj | ˈnɔːti |  | непослушный, озорной | (of children) behaving badly | The *naughty* boy hid his grandmother's glasses. | Озорной мальчишка спрятал бабушкины очки.
- passive | adj | ˈpæsɪv |  | пассивный | not active; letting things happen | Don't be so *passive* — tell them what you want! | Не будь таким пассивным — скажи им, чего ты хочешь!
- 'rash | adj | ræʃ |  | опрометчивый | done too quickly without thinking | Don''t make any *rash* decisions. | Не принимай опрометчивых решений. | сущ.: rash — сыпь'
- rational | adj | ˈræʃənl |  | рациональный, разумный | based on reason | There must be a *rational* explanation. | Должно быть разумное объяснение.
- reckless | adj | ˈrekləs |  | безрассудный | not caring about danger | It was *reckless* to buy a house without seeing it. | Безрассудно было покупать дом, не посмотрев его.
- respected | adj | rɪˈspektɪd | riːˈspektɪd | уважаемый | admired by people | He's a *respected* doctor. | Он уважаемый врач.
- sincere | adj | sɪnˈsɪə | sɪnˈsɪr | искренний | honest; saying what you really feel | Please accept my *sincere* apologies. | Пожалуйста, примите мои искренние извинения.
- sloppy | adj | ˈslɒpi | ˈslɑːpi | небрежный, неряшливый | careless | Your work is *sloppy*. | Твоя работа сделана небрежно.
- stern | adj | stɜːn | stɜːrn | строгий, суровый | serious and strict | The headmaster had a *stern* face. | У директора было суровое лицо.
- supportive | adj | səˈpɔːtɪv | səˈpɔːrtɪv | поддерживающий | giving help and encouragement | My family is very *supportive*. | Моя семья меня очень поддерживает.
- tolerant | adj | ˈtɒlərənt | ˈtɑːlərənt | терпимый | accepting of other people's behaviour and beliefs | Be *tolerant* of other people's opinions. | Будьте терпимы к чужим мнениям.
