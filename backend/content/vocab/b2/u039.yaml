title: Work and jobs
title_ru: Работа и профессии
topic: work
words:
- accountant | n | əˈkaʊntənt |  | бухгалтер | a person who keeps or checks financial records | Our *accountant* prepares the tax returns. | Наш бухгалтер готовит налоговые декларации.
- archaeologist | n | ˌɑːkiːˈɒlədʒɪst | ˌɑːrkiːˈɑːlədʒɪst | археолог | a person who studies ancient remains | *Archaeologists* found an ancient tomb. | Археологи нашли древнюю гробницу.
- banker | n | ˈbæŋkə | ˈbæŋkər | банкир | a person who works in a bank | Her father is a *banker*. | Её отец — банкир.
- boxer | n | ˈbɒksə | ˈbɑːksər | боксёр | a person who boxes | He's a professional *boxer*. | Он профессиональный боксёр.
- broadcaster | n | ˈbrɔːdkɑːstə | ˈbrɔːdkæstər | телерадиокомпания; ведущий | a company or person that broadcasts | The BBC is a public *broadcaster*. | Би-би-си — общественная телерадиокомпания.
- columnist | n | ˈkɒləmnɪst | ˈkɑːləmnəst | обозреватель, колумнист | a person who writes a regular article | She's a newspaper *columnist*. | Она колумнистка газеты.
- distributor | n | dɪˈstrɪbjuːtə | dɪˈstrɪbjətər | дистрибьютор | a company that supplies goods to shops | He's a wine *distributor*. | Он дистрибьютор вина.
- firefighter | n | ˈfaɪəfaɪtə | ˈfaɪrfaɪtər | пожарный | a person who puts out fires | The *firefighters* saved the building. | Пожарные спасли здание.
- foreman | n | ˈfɔːmən | ˈfɔːrmən | бригадир, мастер | a worker who leads other workers | The *foreman* checked our work. | Бригадир проверил нашу работу.
- gardener | n | ˈɡɑːdənə | ˈɡɑːrdənər | садовник | a person who works in gardens | We hired a *gardener*. | Мы наняли садовника.
- interpreter | n | ɪnˈtɜːprɪtə | ˌɪnˈtɜːrprətər | (устный) переводчик | a person who translates speech | The president spoke through an *interpreter*. | Президент говорил через переводчика.
- legislator | n | ˈledʒɪsleɪtə | ˈledʒəsleɪtər | законодатель | a person who makes laws | *Legislators* voted for the new law. | Законодатели проголосовали за новый закон.
- philosopher | n | fɪˈlɒsəfə | fəˈlɑːsəfər | философ | a person who studies philosophy | Plato was a Greek *philosopher*. | Платон был греческим философом.
- playwright | n | ˈpleɪraɪt |  | драматург | a person who writes plays | Shakespeare is the greatest English *playwright*. | Шекспир — величайший английский драматург.
- programmer | n | ˈprəʊɡræmə | ˈproʊɡræmər | программист | a person who writes computer programs | She works as a *programmer*. | Она работает программистом.
- stylist | n | ˈstaɪlɪst |  | стилист | a person who styles hair or clothes | My *stylist* cut my hair short. | Стилист коротко меня подстриг.
- theorist | n | ˈθiərɪst | ˈθiːərɪst | теоретик | a person who develops theories | He's a political *theorist*. | Он политический теоретик.
- thinker | n | ˈθɪŋkə | ˈθɪŋkər | мыслитель | a person who thinks deeply | She is one of the great *thinkers* of our time. | Она — один из великих мыслителей нашего времени.
- trainee | n | ˈtreɪniː | ˈtreɪˈniː | стажёр, практикант | a person being trained | She's a *trainee* at the bank. | Она стажёр в банке.
- translator | n | trænˈsleɪtə | trænˈsleɪtər | переводчик (письменный) | a person who translates texts | She works as a *translator*. | Она работает переводчиком.
- vocalist | n | ˈvəʊkəlɪst | ˈvoʊkəlɪst | вокалист | a singer in a band | He's the band's lead *vocalist*. | Он солист группы.
