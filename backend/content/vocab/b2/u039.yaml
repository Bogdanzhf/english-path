title: Work and jobs
title_ru: Работа и профессии
topic: work
words:
- agenda | n | əˈdʒendə |  | повестка дня; цели, планы | a list of things to discuss; a set of hidden aims | The first item on the *agenda* is the budget. | Первый пункт повестки дня — бюджет. | hidden agenda — скрытые мотивы
- crew | n | kruː |  | экипаж, команда | a group of people who work together, e.g. on a ship | The *crew* of the plane were very friendly. | Экипаж самолёта был очень дружелюбным.
- landlord | n | ˈlændlɔːd | ˈlændlɔːrd | арендодатель, хозяин | a person who rents out a house or flat | Our *landlord* raised the rent again. | Наш хозяин квартиры снова поднял арендную плату. | landlady — хозяйка
- mayor | n | meə | ˈmeɪər | мэр | the head of a town or city | The *mayor* opened the new park. | Мэр открыл новый парк.
- merchant | n | ˈmɜːtʃənt | ˈmɜːrtʃənt | купец, торговец | a person who buys and sells goods | The *merchant* sold silk and spices. | Купец торговал шёлком и пряностями.
- messenger | n | ˈmesɪndʒə | ˈmesɪndʒər | посыльный, курьер | a person who carries messages | The king sent a *messenger* with the news. | Король отправил гонца с известием.
- reward | n | rɪˈwɔːd | rɪˈwɔːrd | награда, вознаграждение | something you get for doing something good | They offered a *reward* for finding the lost dog. | За найденную собаку обещали вознаграждение.
- superintendent | n | ˌsuːpərɪnˈtendənt |  | управляющий, начальник | a person who manages a place or department | The school *superintendent* agreed to change start times. | Руководитель школьного округа согласился перенести начало уроков.
- workplace | n | ˈwɜːkpleɪs | ˈwɜːrkpleɪs | рабочее место | the building or room where people work | Bullying in the *workplace* is a serious problem. | Травля на рабочем месте — серьёзная проблема.
