    q: "He's a ___ driver."
    options: ["dangerous", "dangerously", "danger"]
    answer: 0
  - type: choice
    q: "You speak English very ___!"
    options: ["good", "well", "goodly"]
    answer: 1
  - type: choice
    q: "I studied ___ for the exam."
    options: ["hard", "hardly", "hardy"]
    answer: 0
  - type: choice
    q: "This music sounds ___."
    options: ["great", "greatly", "greatful"]
    answer: 0
    explain: "After sound (linking verb) → adjective."
    explain_ru: "После sound (глагол-связка) → прилагательное."
  - type: input
    q: "easy → ___ (наречие)"
    answer: ["easily"]
  - type: input
    q: "She answered the question ___ (correct)."
    answer: ["correctly"]
  - type: input
    q: "He runs very ___ (fast)."
    answer: ["fast"]
