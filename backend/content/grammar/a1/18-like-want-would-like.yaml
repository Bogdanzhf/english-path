    text: "I enjoy {{to play=>playing}} tennis."
  - type: error
    text: "I want {{go=>to go}} home."
  - type: choice
    q: "In a café, which is the most polite?"
    options: ["I want a coffee.", "Give me a coffee.", "I'd like a coffee, please."]
    answer: 2
