  - type: choice
    q: "I enjoy ___ to music."
    options: ["listen", "to listen", "listening"]
    answer: 2
  - type: choice
    q: "We want ___ a new car."
    options: ["buy", "to buy", "buying"]
    answer: 1
  - type: choice
    q: "___ you like a sandwich? — Yes, please."
    options: ["Do", "Would", "Are"]
    answer: 1
  - type: choice
    q: "Do you like ___? — Yes, I love it!"
    options: ["dance", "dancing", "to dancing"]
    answer: 1
  - type: input
    q: "She decided ___ (stay) at home."
    answer: ["to stay"]
  - type: input
    q: "My dad doesn't mind ___ (cook)."
    answer: ["cooking"]
  - type: input
    q: "I ___ like to speak to the manager, please. (вежливо)"
    answer: ["would", "'d"]
