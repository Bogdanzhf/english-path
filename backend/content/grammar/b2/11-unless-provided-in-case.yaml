title: "unless, as long as, provided, in case"
title_ru: "unless, as long as, provided, in case — другие условия"
section: conditionals
summary: "I'll go unless it rains. You can borrow it as long as you return it. Take a coat in case it gets cold."
summary_ru: "Пойду, если не будет дождя. Бери, только верни. Возьми куртку на случай холода."
theory: |
  ## unless = if … not
  - *I'll go **unless** it rains.* = I'll go **if** it **doesn't** rain.
  - ***Unless** you hurry, you'll miss the bus.*
  - Don't use a negative after unless: ~~unless it doesn't rain~~.

  ## as long as / so long as / provided (that) / providing — only if
  These mean "on condition that":
  - *You can borrow my car **as long as** you drive carefully.*
  - *We'll have the party in the garden, **provided** the weather is good.*

  ## in case — as a precaution
  **in case** is NOT the same as if. It means "because it might happen":
  - *Take an umbrella **in case** it rains.* (it might rain, so take it now)
  - *Take an umbrella **if** it rains.* (take it only when it is raining)
  - **in case of** + noun (formal, signs): ***In case of** fire, use the stairs.*

  ## even if — the result doesn't change
  - *I'll go **even if** it rains.*

  ## suppose / supposing / what if — imagining
  - ***Supposing** you won the lottery, what would you do?*
  - ***What if** we get lost?*

  ## Tense after these words
  Like after if, use the **present** for the future: *as long as you **return** it* (not ~~will return~~).
theory_ru: |
  ## unless = если … не
  - *I'll go **unless** it rains.* = I'll go **if** it **doesn't** rain. — Я пойду, если не будет дождя.
  - ***Unless** you hurry, you'll miss the bus.* — Если не поторопишься, опоздаешь на автобус.
  - После unless не ставим отрицание: ~~unless it doesn't rain~~.

  ## as long as / so long as / provided (that) / providing — только при условии, что
  - *You can borrow my car **as long as** you drive carefully.* — Можешь взять мою машину, если только будешь ездить аккуратно.
  - *We'll have the party in the garden, **provided** the weather is good.* — Мы устроим вечеринку в саду при условии, что будет хорошая погода.

  ## in case — на случай, если
  **in case** — это НЕ «если». Это мера предосторожности: «потому что может случиться».
  - *Take an umbrella **in case** it rains.* — Возьми зонт на случай дождя (дождь может пойти — возьми сейчас).
  - *Take an umbrella **if** it rains.* — Возьми зонт, если пойдёт дождь (только когда пойдёт).
  - **in case of** + существительное (официально, таблички): ***In case of** fire, use the stairs.* — В случае пожара пользуйтесь лестницей.

  ## even if — даже если
  - *I'll go **even if** it rains.* — Я пойду, даже если будет дождь.

  ## suppose / supposing / what if — допустим, а что если
  - ***Supposing** you won the lottery, what would you do?* — Допустим, ты выиграл в лотерею, что бы ты сделал?
  - ***What if** we get lost?* — А что если мы заблудимся?

  ## Время после этих слов
  Как и после if, для будущего используем **настоящее** время: *as long as you **return** it* (не ~~will return~~).
examples:
  - "We'll be late *unless* we leave now. | Мы опоздаем, если не выйдем сейчас."
  - "You can stay *as long as* you're quiet. | Можешь остаться, если будешь вести себя тихо."
  - "I'll lend you the money *provided* you pay me back next week. | Я одолжу тебе денег при условии, что вернёшь на следующей неделе."
  - "Write down my number *in case* you need help. | Запиши мой номер на случай, если понадобится помощь."
  - "I wouldn't eat it *even if* you paid me. | Я бы это не съел, даже если бы ты мне заплатил."
  - "*What if* nobody comes to the party? | А что если никто не придёт на вечеринку?"
exercises:
  - type: choice
    q: "You won't pass ___ you study harder."
    options: ["if", "unless", "in case"]
    answer: 1
  - type: choice
    q: "Take some water ___ you get thirsty on the way."
    options: ["unless", "in case", "provided"]
    answer: 1
  - type: choice
    q: "You can use my laptop ___ you're careful with it."
    options: ["as long as", "unless", "in case"]
    answer: 0
  - type: choice
    q: "I'm going to the beach ___ it's cold. I don't care!"
    options: ["unless", "even if", "provided"]
    answer: 1
  - type: choice
    q: "___ fire, break the glass."
    options: ["In case", "In case of", "Unless"]
    answer: 1
  - type: input
    q: "I'll call you unless I ___ (be) too busy."
    answer: ["am", "'m"]
  - type: input
    q: "Rewrite with unless: If you don't hurry, you'll miss the train. → ___ you hurry, you'll miss the train."
    answer: ["Unless"]
  - type: cloze
    text: "I'll take my phone [[*in case/if/unless]] anyone needs to contact me."
  - type: cloze
    text: "We can go out provided the rain [[*stops/will stop/stopped]]."
  - type: error
    text: "I won't go unless you {{don't come=>come}} with me."
    explain: "unless already means “if not” — no extra negative."
    explain_ru: "unless уже означает «если не» — второе отрицание не нужно."
  - type: error
    text: "You can borrow it as long as you {{will bring=>bring}} it back tomorrow."
  - type: order
    q: "Составьте: «Возьми куртку на случай, если похолодает»."
    answer: "Take a jacket in case it gets cold."
  - type: match
    q: "Match the word and its meaning"
    pairs:
      - ["unless", "if not"]
      - ["provided", "only on this condition"]
      - ["in case", "as a precaution"]
      - ["even if", "it doesn't matter whether"]
  - type: tf
    items:
      - ["“Take a coat in case it's cold” and “Take a coat if it's cold” mean the same.", false]
      - ["“unless” means “if not”.", true]
  - type: listen
    audio: "I'll come to the barbecue as long as it doesn't rain, but I'll bring a jacket in case it gets windy."
    q: "Why will the speaker bring a jacket?"
    options: ["Because it's raining", "In case it gets windy", "Because it's cold now"]
    answer: 1
  - type: speak
    answer: "You can borrow my car as long as you drive carefully."
    ru: "Можешь взять мою машину, если будешь ездить аккуратно."
writing:
  - "transform | Перепишите с unless | I'll go if it doesn't rain. | I'll go unless it rains."
  - "transform | Перепишите с as long as | You can borrow it, but you must return it. | You can borrow it as long as you return it."
  - "transform | Перепишите с in case | Take a coat because it might get cold. | Take a coat in case it gets cold."
  - "translate | Я возьму зонт на случай дождя. | I'll take an umbrella in case it rains."
  - "translate | Можешь взять машину при условии, что вернёшь её к вечеру. | You can take the car provided that you bring it back by the evening. || You can take the car as long as you return it by the evening. || You can take the car provided you bring it back by evening."
  - "compose | Что вы всегда берёте с собой в поездку на всякий случай? (in case) | in case | I always take a power bank in case my phone battery dies."
