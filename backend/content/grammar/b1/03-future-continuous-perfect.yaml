title: "Future Continuous and Future Perfect"
title_ru: "Future Continuous и Future Perfect"
section: tenses
summary: "This time tomorrow I'll be flying; by Friday I'll have finished"
summary_ru: "Завтра в это время я буду лететь; к пятнице я уже закончу"
theory: |
  ## Future Continuous: will be + -ing
  | | |
  |---|---|
  | + | I **will be working** (I'll be working). |
  | − | I **won't be working**. |
  | ? | **Will** you **be working**? |

  Use:
  1. An action **in progress at a moment in the future**: *This time tomorrow, **I'll be lying** on a beach. At 8 pm, **we'll be having** dinner.*
  2. Something that will happen as part of the normal course of events: ***I'll be seeing** Tom at work tomorrow — I can give him the message.*
  3. Polite questions about plans: ***Will** you **be using** the car this evening?*

  ## Future Perfect: will have + V3
  | | |
  |---|---|
  | + | I **will have finished** (I'll have finished). |
  | − | I **won't have finished**. |
  | ? | **Will** you **have finished**? |

  Use: an action that will be **complete before a moment in the future**. Typical words: **by** (by Friday, by then, by the time), **in** (in two years).
  - *By 2030, **I'll have finished** university.*
  - *Call me at 7 — **I'll have got** home by then.*
  - *By the time you arrive, we **won't have finished** cooking.*
theory_ru: |
  ## Future Continuous: will be + -ing
  | | |
  |---|---|
  | + | I **will be working** (I'll be working). |
  | − | I **won't be working**. |
  | ? | **Will** you **be working**? |

  Когда употребляется:
  1. Действие будет **в процессе в определённый момент в будущем**: *This time tomorrow, **I'll be lying** on a beach.* — Завтра в это время я буду лежать на пляже. *At 8 pm, **we'll be having** dinner.* — В восемь вечера мы будем ужинать.
  2. Что-то, что произойдёт само собой, в обычном порядке вещей: ***I'll be seeing** Tom at work tomorrow.* — Я завтра увижу Тома на работе (могу передать ему).
  3. Вежливый вопрос о планах: ***Will** you **be using** the car this evening?* — Ты будешь пользоваться машиной сегодня вечером?

  ## Future Perfect: will have + V3
  | | |
  |---|---|
  | + | I **will have finished** (I'll have finished). |
  | − | I **won't have finished**. |
  | ? | **Will** you **have finished**? |

  Когда употребляется: действие **завершится к определённому моменту в будущем**. Типичные слова: **by** (by Friday — к пятнице, by then — к тому времени, by the time — к тому моменту как), **in** (in two years — через два года).
  - *By 2030, **I'll have finished** university.* — К 2030 году я уже окончу университет.
  - *Call me at 7 — **I'll have got** home by then.* — Позвони в 7 — к этому времени я уже буду дома.
  - *By the time you arrive, we **won't have finished** cooking.* — К твоему приходу мы ещё не закончим готовить.

  > После **by the time**, **when**, **before** само придаточное стоит в Present Simple: *by the time you **arrive*** (не ~~will arrive~~).
examples:
  - "Don't call at nine — *I'll be watching* the match. | Не звони в девять — я буду смотреть матч."
  - "This time next week, *we'll be flying* to Rome. | В это же время на следующей неделе мы будем лететь в Рим."
  - "*Will* you *be using* your laptop tonight? | Ты будешь пользоваться ноутбуком сегодня вечером?"
  - "By the end of the year, *I'll have read* fifty books. | К концу года я прочитаю пятьдесят книг."
  - "The film *will have started* by the time we get there. | Фильм уже начнётся, когда мы туда доберёмся."
  - "In ten years, they *will have paid* for the house. | Через десять лет они расплатятся за дом."
exercises:
  - type: choice
    q: "At 10 am tomorrow, I ___ an exam, so I can't talk."
    options: ["will take", "will be taking", "will have taken"]
    answer: 1
  - type: choice
    q: "By the time you get home, I ___ the cleaning."
    options: ["will be doing", "will have done", "do"]
    answer: 1
  - type: choice
    q: "Don't phone at 7 — we ___ dinner then."
    options: ["will be having", "will have had", "have"]
    answer: 0
  - type: choice
    q: "By 2040, scientists ___ a cure for this disease."
    options: ["will be finding", "will have found", "found"]
    answer: 1
  - type: choice
    q: "___ you be using the printer this afternoon?"
    options: ["Do", "Will", "Are"]
    answer: 1
  - type: input
    q: "This time next month, I ___ (lie) on a beach in Greece."
    answer: ["will be lying", "'ll be lying"]
  - type: input
    q: "By Friday, she ___ (finish) the report."
    answer: ["will have finished", "'ll have finished"]
  - type: cloze
    text: "By the time you [[*arrive/will arrive/arrived]], we will have eaten everything!"
  - type: cloze
    text: "In June I [[will have worked|'ll have worked]] (work) here for exactly five years."
  - type: error
    text: "By next summer, I {{will finish=>will have finished}} my course."
    explain: "“By next summer” = completed before then → Future Perfect."
    explain_ru: "«К следующему лету» — завершится к моменту → Future Perfect."
  - type: error
    text: "Call me after the film — I'll be home by the time it {{will end=>ends}}."
  - type: order
    q: "Составьте: «Завтра в это время я буду работать»."
    answer: "This time tomorrow I will be working."
  - type: match
    q: "Match the tense and the meaning"
    pairs:
      - ["I'll be working at 5.", "in progress at a future moment"]
      - ["I'll have finished by 5.", "complete before a future moment"]
      - ["I'll finish at 5.", "a simple future fact"]
  - type: tf
    items:
      - ["The Future Perfect is formed with “will have” + V3.", true]
      - ["“By Monday” often goes with the Future Continuous.", false]
  - type: listen
    audio: "Don't worry, by the time you land, I'll have parked the car and I'll be waiting at the exit."
    q: "Where will the speaker be?"
    options: ["in the car park", "at the exit", "on the plane"]
    answer: 1
  - type: speak
    answer: "By next year I will have finished my course."
    ru: "К следующему году я закончу свой курс."
writing:
  - "transform | Перепишите с Future Continuous (this time tomorrow) | Tomorrow at this time I'm on a plane to Rome. | This time tomorrow I'll be flying to Rome."
  - "transform | Перепишите с Future Perfect (by Friday) | I will finish the report before Friday. | I will have finished the report by Friday."
  - "transform | Сделайте вопросом (Future Continuous) | You will be using the car tonight. | Will you be using the car tonight?"
  - "translate | К лету я накоплю на новый ноутбук. | By the summer I will have saved enough for a new laptop. || By summer I'll have saved for a new laptop."
  - "translate | Не звони в восемь — я буду ужинать. | Don't call at eight — I'll be having dinner. || Don't call me at eight — I'll be having dinner."
  - "complete | Что вы будете делать завтра в это же время? | This time tomorrow I'll be | This time tomorrow I'll be sitting in a meeting at work."
