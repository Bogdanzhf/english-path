      - ["“I've lost my key.”", "He said he had lost his key."]
      - ["“Are you ready?”", "He asked if I was ready."]
  - type: tf
    items:
      - ["In reported questions we use normal word order: “She asked where I lived.”", true]
      - ["“tomorrow” often changes to “the next day” in reported speech.", true]
