    q: "“Where do you live?” → She asked me where ___."
    options: ["do I live", "I lived", "did I live"]
    answer: 1
  - type: choice
    q: "“Are you OK?” → He asked ___ I was OK."
    options: ["that", "if", "what"]
    answer: 1
