  - "transform | Ответьте «я тоже» | I'm going to the party. | So am I."
  - "transform | Ответьте «а я нет» | I like getting up early. | I don't."
  - "translate | Я не умею петь. — Я тоже. | I can't sing. — Neither can I. || I can't sing. — Nor can I."
