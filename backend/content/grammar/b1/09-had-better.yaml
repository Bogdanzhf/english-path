  - "transform | Перепишите с had better not | Don't forget your passport! | You had better not forget your passport. || You'd better not forget your passport."
  - "translate | Тебе лучше позвонить ей сегодня. | You had better call her today. || You'd better call her today. || You'd better phone her today."
  - "translate | Нам лучше не опаздывать. | We had better not be late. || We'd better not be late."
  - "translate | Мне лучше пойти домой. | I had better go home. || I'd better go home."
  - "compose | Дайте срочный совет другу, у которого завтра экзамен | better | You'd better go to bed early tonight."
