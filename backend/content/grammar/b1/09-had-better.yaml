    q: "It's going to rain. You'd better ___ a coat."
    options: ["take", "to take", "taking"]
    answer: 0
  - type: choice
    q: "You'd better ___ late for the interview."
    options: ["don't be", "not be", "not to be"]
    answer: 1
  - type: choice
    q: "Which is a general opinion, not urgent advice?"
    options: ["You'd better call him now.", "You should read more books.", "You'd better not touch that."]
    answer: 1
  - type: choice
    q: "'d better is short for ___."
    options: ["would better", "had better", "did better"]
    answer: 1
  - type: choice
    q: "The shop closes at six. We'd better ___ now."
    options: ["go", "went", "going"]
    answer: 0
  - type: input
    q: "Тебе лучше отдохнуть. → You ___ better rest."
    answer: ["had", "'d"]
  - type: input
    q: "Лучше не говори ему. → You'd better ___ tell him."
    answer: ["not"]
  - type: error
    text: "You'd better {{to call=>call}} the police."
  - type: error
    text: "We {{hadn't better=>'d better not}} wake the baby."
  - type: order
    q: "Составьте: «Нам лучше уехать пораньше.»"
    answer: "We had better leave early."
  - type: tf
    items:
      - ["“You'd better” refers to the past.", false]
      - ["“had better” warns that something bad may happen.", true]
