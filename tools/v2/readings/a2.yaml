  v1_unit: Tales and Trials
  title: The Giant in the Fog
  title_ru: Великан в тумане
  text: 'This is an old tale from a town in the north. Long ago, the town was often covered in thick fog. One autumn, the citizens began to hear strange noises at night: heavy steps, broken trees and a sound like crying. In the morning, they found enormous footprints in the mud.


    People were scared. "It''s a giant," they said. "He is violent and mad. He wants to destroy our town." The town council met and declared that the giant must be caught. The young men took their swords, and the farmers built a huge trap in the forest with a sheep inside.


    The giant could not resist the sheep. One foggy night, the trap closed, and the giant was caught. In the morning, the whole town came to see him. He was extraordinary — as tall as a house — but he was not trying to fight. He was sitting quietly with tears in his eyes.


    There was a trial in the town square. The judge asked the giant about his intentions. The giant revealed his sad story. His mother had died, and he had walked for weeks after her funeral, looking for someone to talk to. "I ought to say sorry for the trees," he said. "I only wanted friends."


    His words made a strong impression on everyone. The citizens let him go and decided to get rid of their fear. The giant stayed and helped the town for many years. He carried heavy stones for new houses and, on foggy nights, he held a big lamp so that boats could find their way home.

    '
  ru: 'Это старая сказка из одного северного городка. Давным-давно город часто окутывал густой туман. Однажды осенью жители стали слышать по ночам странные звуки: тяжёлые шаги, треск деревьев и звук, похожий на плач. Утром в грязи они находили огромные следы.


    Люди испугались. «Это великан, — говорили они. — Он жестокий и безумный. Он хочет разрушить наш город». Городской совет собрался и объявил, что великана нужно поймать. Молодые мужчины взяли мечи, а крестьяне построили в лесу огромную ловушку с овцой внутри.


    Великан не смог устоять перед овцой. Одной туманной ночью ловушка захлопнулась, и великан попался. Утром весь город пришёл на него посмотреть. Он был необыкновенным — высотой с дом, — но и не пытался драться. Он тихо сидел со слезами на глазах.


    На городской площади состоялся суд. Судья спросил великана о его намерениях. Великан рассказал свою грустную историю. Его мать умерла, и после похорон он несколько недель бродил в поисках того, с кем можно поговорить. «Мне следует извиниться за деревья, — сказал он. — Я только хотел найти друзей».


    Его слова произвели на всех сильное впечатление. Жители отпустили его и решили избавиться от своего страха. Великан остался и много лет помогал городу. Он носил тяжёлые камни для новых домов, а туманными ночами держал большой фонарь, чтобы лодки могли найти дорогу домой.

    '
