  v1_unit: Languages and Customs
  title: Twins in Two Countries
  title_ru: Близнецы в двух странах
  text: 'Ana and Sofia are twins. When they were babies, they looked completely the same, like a girl and her mirror. But when they were ten, their family moved, and the girls grew up apart. Ana stayed with their grandmother in Spain, and Sofia moved with their parents to a city on the Gulf of Mexico.


    Nowadays, both sisters are twenty years old. Sofia is bilingual. Her spoken English is natural and fast, and she loves fashionable clothes. Ana speaks only a little English. She studies sport at university and is a participant in many races.


    Last summer, Ana visited Sofia for the first time in many years. At the airport, she felt tense. Her memories of her sister were vague. But when Sofia dashed towards her, Ana was surprised: they still had the same smile!


    Everything in the foreign city was new for Ana. Some things she liked, but some she looked at with disgust, like the huge plates of fried food. The sisters also had different rituals: Ana always had a long lunch, but Sofia ate a sandwich at her desk.


    "We are totally different," said Sofia on the last day. "But our most important attribute is the same. We love each other."

    '
  ru: 'Ана и София — близнецы. Когда они были малышками, они выглядели совершенно одинаково, как девочка и её отражение в зеркале. Но когда им было десять, семья переехала, и девочки выросли вдали друг от друга. Ана осталась с бабушкой в Испании, а София с родителями переехала в город на берегу Мексиканского залива.


    Сейчас обеим сёстрам по двадцать лет. София двуязычная. По-английски она говорит естественно и быстро, а ещё она любит модную одежду. Ана говорит по-английски совсем немного. Она изучает спорт в университете и участвует во многих забегах.


    Прошлым летом Ана впервые за много лет приехала к Софии. В аэропорту она нервничала. Воспоминания о сестре были смутными. Но когда София бросилась к ней, Ана удивилась: улыбка у них всё ещё была одинаковая!


    Всё в чужом городе было для Аны новым. Кое-что ей нравилось, а на кое-что она смотрела с отвращением — например, на огромные тарелки жареной еды. А ещё у сестёр были разные ритуалы: Ана всегда долго обедала, а София ела бутерброд за рабочим столом.


    «Мы совершенно разные, — сказала София в последний день. — Но самое главное качество у нас общее. Мы любим друг друга».

    '
