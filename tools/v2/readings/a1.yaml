  v1_unit: Justice and the Sea
  title: The Captain's Boat
  title_ru: Лодка капитана
  text: 'Captain Harris was eighty years old. For fifty years, he sailed international ships and explored the oceans of the world. Now he lived in a small house by the sea with his old wooden boat, the Lucky Star.


    One day, a man from the city came to his door. "The town has a new policy," he said. "Old boats are not allowed on the beach. You have to destroy it." The captain could not believe it. The boat was like a friend to him. It had saved his life in a storm many years ago, when he broke a bone in his leg and was barely alive.


    The captain did not want to bother anyone, but this was an injustice. His granddaughter Lisa was a lawyer. When she heard the story, she was angry. "Don''t worry, Grandpa," she said. "I''ll help you."


    Lisa explored the town''s rules for a week. She found that the new policy did not mention boats that were part of the town''s history. And there was no doubt: the Lucky Star was the oldest boat in town.


    At the town meeting, Lisa gave a speech. The staff of the town hall and many people listened. "This boat is not rubbish," she said. "It is our history." The meeting came to a conclusion: the boat could stay. However, the town decided to do more. Today, the Lucky Star is in a small museum, and the captain tells visitors his stories every Sunday. "I''m glad I didn''t give up," he says.

    '
  ru: 'Капитану Харрису было восемьдесят лет. Пятьдесят лет он ходил на международных судах и исследовал океаны мира. Теперь он жил в маленьком доме у моря вместе со своей старой деревянной лодкой «Счастливая звезда».


    Однажды к нему пришёл человек из города. «В городе новые правила, — сказал он. — Старые лодки на пляже держать нельзя. Вам придётся её уничтожить». Капитан не мог поверить. Лодка была ему как друг. Много лет назад она спасла ему жизнь в шторм, когда он сломал ногу и едва остался жив.


    Капитан не хотел никого беспокоить, но это была несправедливость. Его внучка Лиза была юристом. Услышав эту историю, она рассердилась. «Не волнуйся, дедушка, — сказала она. — Я помогу тебе».


    Неделю Лиза изучала городские правила. Она обнаружила, что в новых правилах не упоминаются лодки, которые являются частью истории города. А сомнений не было: «Счастливая звезда» — самая старая лодка в городе.


    На городском собрании Лиза выступила с речью. Её слушали сотрудники мэрии и много горожан. «Эта лодка — не мусор, — сказала она. — Это наша история». Собрание пришло к выводу: лодка может остаться. Однако город решил сделать больше. Сегодня «Счастливая звезда» стоит в маленьком музее, и каждое воскресенье капитан рассказывает посетителям свои истории. «Я рад, что не сдался», — говорит он.

    '
