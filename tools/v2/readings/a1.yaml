  v1_unit: Truth and Evidence
  title: The Missing Ring
  title_ru: Пропавшее кольцо
  text: 'Mrs. Lee owned a small jewellery shop in the center of town. One morning, she discovered that a gold ring was missing. It cost more than three thousand dollars. The only other person in the shop the day before was her new assistant, a young man called Tom.


    Mrs. Lee called the police. "There''s no evidence," said the detective, a master of his job. "But he''s the only one who was inside the shop. It''s common for thieves to work in shops." Tom was shocked. He was honest, independent and proud. "I didn''t take anything," he said. "My belief in honesty is everything to me."


    The detective asked them to demonstrate what happened the day before. Tom showed how he cleaned the glass cases and helped a customer. Then the detective looked up. Above the window, there was a small hole and a bird''s nest.


    The detective smiled. "There''s an old idiom," he said. "Don''t count your chickens before they hatch. I think we were too quick." He climbed a ladder and looked inside the nest. There was the ring! A magpie — a bird that loves shiny things — took it through the open window.


    Mrs. Lee was very embarrassed. "I''m sorry, Tom," she said. "You''re not going to jail — you''re going to get a raise." Tom forgave her, but he kept one memory from that day: he now checks the window and every pocket of his coat before he goes home. And the ring? It was soon for sale again — at the proper price.

    '
  ru: 'Миссис Ли владела небольшим ювелирным магазином в центре города. Однажды утром она обнаружила, что пропало золотое кольцо. Оно стоило больше трёх тысяч долларов. Единственным, кроме неё, человеком в магазине накануне был её новый помощник — молодой человек по имени Том.


    Миссис Ли вызвала полицию. «Доказательств нет, — сказал детектив, мастер своего дела. — Но он единственный, кто был внутри магазина. Воры часто работают в магазинах». Том был потрясён. Он был честным, самостоятельным и гордым. «Я ничего не брал, — сказал он. — Честность для меня — всё».


    Детектив попросил их показать, что происходило накануне. Том показал, как протирал стеклянные витрины и помогал покупателю. Тут детектив поднял глаза. Над окном была маленькая дыра и птичье гнездо.


    Детектив улыбнулся. «Есть старая идиома, — сказал он. — Цыплят по осени считают. Думаю, мы поспешили с выводами». Он поднялся по лестнице и заглянул в гнездо. Там лежало кольцо! Его утащила через открытое окно сорока — птица, которая любит блестящие вещи.


    Миссис Ли было очень стыдно. «Прости меня, Том, — сказала она. — Ты не отправишься в тюрьму — ты получишь прибавку к зарплате». Том её простил, но одно воспоминание о том дне осталось: теперь перед уходом домой он проверяет окно и все карманы пальто. А кольцо? Вскоре оно снова продавалось — по правильной цене.

    '
