    - Paint
    answer: 1
  - q: What happens when sunlight hits the powder?
    options:
    - It changes colour
    - It turns pollutants into harmless substances
    - It produces electricity
    - It melts
    answer: 1
  - q: Why do some environmental groups object to these technologies?
    options:
    - They are too expensive
    - They may make governments ignore the need to burn less fuel
    - They don't work at all
    - They are ugly
    answer: 1
  - tf: Transport is responsible for about a quarter of carbon emissions.
    answer: true
  - tf: 'The skeptics were right: the building had no effect.'
    answer: false
