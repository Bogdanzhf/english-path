    answer: true
- id: b2-02
  v1_unit: Cleaner Air
  title: The Building That Eats Smog
  title_ru: Здание, которое поедает смог
  text: 'In many of the world''s biggest cities, the air is dangerous to breathe. Cars, factories and power stations emit huge amounts of carbon dioxide and other pollutants. Tiny pieces of dust and smoke enter our lungs and can cause serious illnesses. Moreover, transport alone is responsible for about a quarter of the world''s carbon emissions.


    For years, scientists have looked for ways to clean the air, and one of the most unusual ideas comes from Italy. A leading architecture firm designed a building whose walls are covered with a special cement. The cement contains a white powder called titanium dioxide. When sunlight hits the powder, it reacts with pollutants in the air and turns them into harmless substances, which are washed away by the rain.


    At first, many skeptics rejected the idea. They argued that a single building could never clean a whole city. However, the results were surprising. Tests showed that the concrete substantially reduced pollution in the streets around the building. Similar materials have since been integrated into roads, roof tiles and even paint.


    Other cities are trying different approaches. In some places, engineers have built giant towers that suck in dirty air and remove the dust. In others, factories grind old rocks into a fine powder that absorbs carbon from the air. One company claims its machines can remove thousands of tons of carbon dioxide every year.


    Not everyone is convinced. Some environmental groups object to these technologies, saying they prompt governments to ignore the real problem: we need to burn less fuel. They may be right. But new materials could enable cities to breathe a little more easily while the planet heals.

    '
  ru: 'Во многих крупнейших городах мира дышать воздухом опасно. Автомобили, заводы и электростанции выбрасывают огромное количество углекислого газа и других загрязняющих веществ. Крошечные частицы пыли и дыма попадают в лёгкие и могут вызывать серьёзные болезни. Более того, на один только транспорт приходится около четверти мировых выбросов углерода.


    Учёные давно ищут способы очистить воздух, и одна из самых необычных идей пришла из Италии. Ведущее архитектурное бюро спроектировало здание, стены которого покрыты особым цементом. Цемент содержит белый порошок — диоксид титана. Когда на порошок падает солнечный свет, он вступает в реакцию с загрязняющими веществами в воздухе и превращает их в безвредные вещества, которые смывает дождь.


    Сначала многие скептики отвергли эту идею. Они утверждали, что одно здание никогда не очистит целый город. Однако результаты удивили. Испытания показали, что бетон значительно снизил загрязнение на улицах вокруг здания. С тех пор подобные материалы стали использовать в дорогах, черепице и даже краске.


    Другие города пробуют иные подходы. Где-то инженеры построили гигантские башни, которые втягивают грязный воздух и очищают его от пыли. Где-то заводы перемалывают старые камни в мелкий порошок, поглощающий углерод из воздуха. Одна компания утверждает, что её установки могут удалять тысячи тонн углекислого газа в год.


    Убеждены не все. Некоторые экологические организации возражают против таких технологий: по их словам, они побуждают правительства игнорировать настоящую проблему — нам нужно сжигать меньше топлива. Возможно, они правы. Но новые материалы помогут городам дышать чуть свободнее, пока планета восстанавливается.

    '
