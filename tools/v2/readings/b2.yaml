  v1_unit: From Tree to Tablet
  title: The Story of Aspirin
  title_ru: История аспирина
  text: 'For thousands of years, people have chewed the bark of the willow tree to ease pain and fever. Ancient Egyptian and Greek doctors wrote about it, and in many cultures it became a traditional remedy. Nobody knew why it worked, but the essence of the cure was clear: willow bark made people feel better.


    In 1763, an English priest called Edward Stone decided to test the remedy scientifically. Living in close proximity to a river lined with willow trees, he dried and powdered the bark and gave it to fifty patients with fever. He carefully assessed the results and was astonished: most patients improved. However, his report received little publicity, and nobody understood its significance at the time.


    In the nineteenth century, chemists managed to extract the active substance from willow bark. They called it salicin. In the subsequent years, they produced a stronger chemical, salicylic acid. There was a problem, though: it was very hard on the stomach. Some patients said the cure was worse than the illness.


    In 1897, a young chemist working for the German company Bayer found a solution. By changing the molecule slightly, he created a synthetic version that was much gentler. The company called it "aspirin", and it went on sale in 1899. Sales were fabulous. Within a few years, aspirin was the most popular medicine in the world.


    Even then, nobody knew exactly how it worked. It took until the 1970s for a British scientist to discover the precise answer: aspirin inhibits substances in the body that cause pain and swelling. He won a Nobel Prize for this work.


    Research on aspirin is ongoing. Today, millions of people take a small daily dose to reduce the risk of heart attacks — though doctors warn against taking it on impulse or in haste, without medical advice. Not bad for a tree.

    '
  ru: 'Тысячи лет люди жевали кору ивы, чтобы облегчить боль и снять жар. О ней писали древнеегипетские и древнегреческие врачи, и во многих культурах она стала традиционным средством. Никто не знал, почему она действует, но суть лечения была ясна: ивовая кора помогала людям почувствовать себя лучше.


    В 1763 году английский священник Эдвард Стоун решил проверить это средство научно. Живя неподалёку от реки, по берегам которой росли ивы, он высушил и истолок кору и дал её пятидесяти пациентам с жаром. Он тщательно оценил результаты и был поражён: большинству пациентов стало лучше. Однако его отчёт почти не привлёк внимания, и в то время никто не понял его значения.


    В XIX веке химикам удалось выделить из ивовой коры действующее вещество. Его назвали салицином. В последующие годы получили более сильное вещество — салициловую кислоту. Но была проблема: она сильно раздражала желудок. Некоторые пациенты говорили, что лечение хуже болезни.


    В 1897 году молодой химик, работавший в немецкой компании Bayer, нашёл решение. Слегка изменив молекулу, он создал синтетический вариант, который был гораздо мягче. Компания назвала его «аспирин», и в 1899 году он поступил в продажу. Продажи были баснословными. За несколько лет аспирин стал самым популярным лекарством в мире.


    Но даже тогда никто точно не знал, как он действует. Лишь в 1970-х британский учёный нашёл точный ответ: аспирин подавляет в организме вещества, вызывающие боль и отёк. За эту работу он получил Нобелевскую премию.


    Исследования аспирина продолжаются. Сегодня миллионы людей ежедневно принимают небольшую дозу, чтобы снизить риск инфаркта, — хотя врачи предостерегают от того, чтобы принимать его импульсивно или второпях, без консультации. Неплохо для дерева.

    '
