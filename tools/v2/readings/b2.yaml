  v1_unit: Corruption Scandal
  title: The Recycling Scandal
  title_ru: Скандал с переработкой
  text: 'For years, GreenWay was one of the country''s most admired companies. It ran a large chain of retail stores selling household merchandise, and it proudly told customers that it recycled all its packaging. Its headquarters, a modern glass building in the capital, was covered in solar panels. Its revenue grew every year.


    The company also received generous government subsidies for recycling. The idea was simple: the government wanted to give businesses an incentive to dispose of their rubbish responsibly. GreenWay claimed to have built a modern, automated recycling plant and to process thousands of tons of plastic every month.


    Then, a young journalist received an anonymous tip. She followed GreenWay''s lorries at night and discovered that they were not going to a recycling plant at all. Instead, they were dumping the rubbish in a field outside a poor village, hundreds of kilometres away. The "automated plant" existed only on paper.


    When officials audited the company, they found more problems. Managers had manipulated the figures to make the operation look legitimate. Hundreds of transactions had been hidden in foreign bank accounts. Worse, investigators discovered that several administrators at the environment ministry had been bribed to approve the subsidies without checking. These corrupt officials had bought houses in affluent neighbourhoods with the money.


    The scandal shocked the public. GreenWay''s chief executive resigned, and several managers were arrested for violating environmental laws. Parliament quickly legislated to make companies prove what happens to their waste. Some of the money was used to improve recycling infrastructure in the village that had suffered.


    The journalist later won a major prize for her work. "People trust companies that look green," she said. "But we have to ask questions, even about the businesses we like."

    '
  ru: 'Много лет компания GreenWay была одной из самых уважаемых в стране. Ей принадлежала крупная розничная сеть магазинов товаров для дома, и она с гордостью сообщала покупателям, что перерабатывает всю свою упаковку. Её штаб-квартира — современное стеклянное здание в столице — была покрыта солнечными панелями. Выручка росла с каждым годом.


    Компания также получала щедрые государственные субсидии на переработку. Идея была простой: правительство хотело дать бизнесу стимул ответственно утилизировать отходы. GreenWay утверждала, что построила современный автоматизированный перерабатывающий завод и ежемесячно перерабатывает тысячи тонн пластика.


    А потом молодая журналистка получила анонимную наводку. Она проследила ночью за грузовиками GreenWay и обнаружила, что они едут вовсе не на перерабатывающий завод. Вместо этого они сваливали мусор на поле возле бедной деревни в сотнях километров от города. «Автоматизированный завод» существовал только на бумаге.


    Когда чиновники провели аудит компании, всплыли новые проблемы. Менеджеры подтасовывали цифры, чтобы деятельность выглядела законной. Сотни операций были скрыты на зарубежных банковских счетах. Хуже того, следователи выяснили, что несколько чиновников министерства экологии получили взятки за то, чтобы одобрять субсидии без проверки. На эти деньги продажные чиновники купили дома в богатых районах.


    Скандал потряс общество. Генеральный директор GreenWay ушёл в отставку, а нескольких менеджеров арестовали за нарушение природоохранного законодательства. Парламент быстро принял закон, обязывающий компании доказывать, что происходит с их отходами. Часть денег направили на улучшение инфраструктуры переработки в пострадавшей деревне.


    Позже журналистка получила за свою работу крупную премию. «Люди доверяют компаниям, которые выглядят экологичными, — сказала она. — Но мы должны задавать вопросы даже о тех, кто нам нравится».

    '
