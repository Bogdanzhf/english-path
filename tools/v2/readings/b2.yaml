  v1_unit: The Hidden Network
  title: The Priest and the Pastor
  title_ru: Священник и пастор
  text: 'During the Second World War, the Netherlands was occupied by German forces. The new authorities began to arrest Jewish families and send them to camps in the east. Many Dutch people were outraged, but few dared to act. In one small town, however, two men decided they could not stand by.


    One was the priest of the local Catholic parish. The other was the Protestant pastor of the church across the square. Before the war, the two men had rarely spoken. Their churches had argued for centuries about the Bible and how to read it. But now they agreed to cooperate. Together they built a secret network that helped Jewish families to flee.


    The system was simple but dangerous. Families arrived at night and were hidden in a barn outside the town. Under the barn, farmers had dug a narrow tunnel that led to a passage beneath the church. From there, members of the network took them, with false papers, to the rail station, where friendly train workers helped them travel to the coast.


    Several times, soldiers raided the farm. Once, a patrol searched the barn for two hours while twelve people waited silently in the tunnel below. The soldiers found nothing and left by the main exit, laughing.


    In 1944, someone betrayed the network. The pastor was detained and sent to a prison camp. The priest managed to escape and hid until the end of the war. The pastor survived too, and when he returned, the two men embraced in the square. Historians believe they helped more than three hundred people. After the war, both were honoured for their exceptional courage. When journalists asked why they had aligned themselves with each other, the priest smiled. "When people are in danger," he said, "there is only one church."

    '
  ru: 'Во время Второй мировой войны Нидерланды были оккупированы немецкими войсками. Новые власти начали арестовывать еврейские семьи и отправлять их в лагеря на востоке. Многие голландцы были возмущены, но мало кто осмеливался действовать. Однако в одном маленьком городке двое мужчин решили, что не могут оставаться в стороне.


    Один был священником местного католического прихода. Другой — протестантским пастором церкви на противоположной стороне площади. До войны они почти не разговаривали. Их церкви веками спорили о Библии и о том, как её толковать. Но теперь они договорились действовать сообща. Вместе они создали тайную сеть, которая помогала еврейским семьям бежать.


    Система была простой, но опасной. Семьи приходили ночью, и их прятали в амбаре за городом. Под амбаром фермеры вырыли узкий туннель, который вёл в подземный ход под церковью. Оттуда участники сети с поддельными документами провожали людей на железнодорожную станцию, где сочувствующие железнодорожники помогали им добраться до побережья.


    Несколько раз солдаты устраивали облавы на ферме. Однажды патруль два часа обыскивал амбар, пока двенадцать человек молча ждали в туннеле внизу. Солдаты ничего не нашли и со смехом ушли через главный выход.


    В 1944 году кто-то выдал сеть. Пастора арестовали и отправили в лагерь. Священнику удалось бежать, и он скрывался до конца войны. Пастор тоже выжил, и когда он вернулся, двое мужчин обнялись на площади. Историки считают, что они помогли более чем тремстам людям. После войны обоих наградили за исключительное мужество. Когда журналисты спросили, почему они объединились, священник улыбнулся. «Когда люди в опасности, — сказал он, — церковь только одна».

    '
  questions:
  - q: What was unusual about the two men working together?
    options:
    - They were brothers
    - Their churches had disagreed for centuries
    - They were both soldiers
    - They lived in different countries
    answer: 1
  - q: Where were the families hidden first?
    options:
    - In the church
    - In a barn outside the town
    - At the station
    - On a boat
    answer: 1
  - q: What happened in 1944?
    options:
    - The war ended
    - Someone betrayed the network
    - The barn burned down
    - The priest was arrested
    answer: 1
  - tf: The soldiers found the people in the tunnel.
    answer: false
  - tf: Both men survived the war.
    answer: true
- id: b2-04
  v1_unit: Equality at Work
  title: Breaking the Glass Ceiling
  title_ru: Пробить стеклянный потолок
  text: 'A hundred years ago, women in most countries could not vote, and very few received a university education. Today, in many parts of the world, more women than men graduate from university. In some fields, such as medicine and law, the number of female students has soared. Yet women still face a "glass ceiling" — an invisible barrier that stops them from reaching top positions.


    The numbers tell the story. Women make up nearly half of the workforce, but they hold a mere 10% of top leadership positions in large companies. In science and engineering, the gap is even wider. Why is this?


    Experts point to several reasons. One is that women often carry more responsibility for children and elderly parents, which makes long working hours difficult. Another is that many workplaces were designed by men, for men. Women who are vocal and confident are sometimes seen as "aggressive", while men with the same qualities are called "strong leaders". Many women also say they lack guidance from senior colleagues who could help them make the right career decisions.


    Many organizations are now trying to change this. Some offer flexible working hours, so that employees can feel comfortable balancing work and family. Others have created mentoring programmes, in which experienced managers give younger employees encouragement and advice. A growing number of governments have endorsed laws that require equal pay for equal work. Inclusion is no longer just a nice idea; it is a tool for better business. Research shows that teams with a mix of men and women make better decisions.


    Role models matter too. When girls see women in power — as scientists, CEOs or presidents — it inspires them to aim higher. As one engineer put it: "You can''t be what you can''t see." Fostering the next generation of female leaders may be the most important step of all.

    '
  ru: 'Сто лет назад в большинстве стран женщины не могли голосовать, и очень немногие получали высшее образование. Сегодня во многих частях мира университеты оканчивает больше женщин, чем мужчин. В некоторых областях, например в медицине и юриспруденции, число студенток резко выросло. И всё же женщины по-прежнему сталкиваются со «стеклянным потолком» — невидимым барьером, который не даёт им занять высшие должности.


    Цифры говорят сами за себя. Женщины составляют почти половину работающих, но занимают лишь 10% высших руководящих должностей в крупных компаниях. В науке и инженерии разрыв ещё больше. Почему так?


    Эксперты называют несколько причин. Одна из них — на женщинах часто лежит больше обязанностей по уходу за детьми и пожилыми родителями, из-за чего долгий рабочий день даётся им тяжело. Другая — многие рабочие места создавались мужчинами и для мужчин. Женщин, которые открыто высказываются и уверены в себе, порой считают «агрессивными», тогда как мужчин с теми же качествами называют «сильными лидерами». Многие женщины также говорят, что им не хватает наставничества со стороны старших коллег, которые помогли бы принять правильные карьерные решения.


    Многие организации сейчас пытаются это изменить. Некоторые предлагают гибкий график, чтобы сотрудникам было комфортно совмещать работу и семью. Другие создали программы наставничества, в которых опытные руководители поддерживают и консультируют молодых сотрудников. Всё больше правительств одобряют законы, требующие равной оплаты за равный труд. Инклюзивность — уже не просто красивая идея, а инструмент для более успешного бизнеса. Исследования показывают, что смешанные команды из мужчин и женщин принимают более удачные решения.


    Важны и образцы для подражания. Когда девочки видят женщин у власти — учёных, руководителей компаний, президентов, — это вдохновляет их ставить более высокие цели. Как сказала одна инженер: «Нельзя стать тем, кого не видишь». Воспитание следующего поколения женщин-лидеров, возможно, самый важный шаг из всех.

    '
