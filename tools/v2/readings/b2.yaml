  v1_unit: Fuel for the Body
  title: The Truth About Low-Carb Diets
  title_ru: Правда о низкоуглеводных диетах
  text: 'Our bodies need energy, and most of it comes from food. Normally, the body burns glucose, a type of sugar that comes from carbohydrates such as bread, rice, pasta and other foods high in starch. When there isn''t enough glucose, however, the body can switch to another fuel: fat.


    This is the idea behind the "ketogenic" or "keto" diet, which is very high in fat and extremely low in carbohydrates. People on the diet eat meat, fish, eggs, cheese, nuts and plenty of olive oil and coconut oil, but very little bread, fruit or sugar. After a few days, the liver begins to turn fat into substances called ketones, which the brain and muscles can use instead of glucose. This metabolic state is known as ketosis.


    The diet is not new. In the 1920s, doctors discovered that it was a powerful treatment for children with epilepsy, and it is still used for this purpose today. Recently, it has become popular for weight loss. Many people find that they lose weight quickly at first and feel less hungry. Some studies suggest it may also help with the management of type 2 diabetes.


    But experts warn that the diet is not for everyone. It is hard to keep to, and many people gain the weight back when they stop. Some athletes report that their performance gets worse, especially in sports that need short bursts of energy. There are also concerns about eating too much saturated fat, and about the long-term effects, which are not yet well known.


    In summary: low-carb diets can work for some people, but they are not magic. Before making big changes to what you eat, it is always a good idea to check with a doctor. And for most of us, the best diet is still the simplest one — plenty of vegetables, not too much sugar, and food that we actually enjoy.

    '
  ru: 'Нашему организму нужна энергия, и большую её часть мы получаем из пищи. Обычно организм сжигает глюкозу — вид сахара, который поступает из углеводов: хлеба, риса, макарон и других продуктов, богатых крахмалом. Однако когда глюкозы не хватает, организм может переключиться на другое топливо — жир.


    На этом и основана «кетогенная», или «кето»-диета, в которой очень много жиров и крайне мало углеводов. Люди на этой диете едят мясо, рыбу, яйца, сыр, орехи и много оливкового и кокосового масла, но очень мало хлеба, фруктов и сахара. Через несколько дней печень начинает превращать жир в вещества под названием кетоны, которые мозг и мышцы могут использовать вместо глюкозы. Это метаболическое состояние называется кетозом.


    Диета не нова. В 1920-х годах врачи обнаружили, что она сильно помогает детям с эпилепсией, и её используют для этого до сих пор. В последнее время она стала популярна для похудения. Многие замечают, что поначалу быстро теряют вес и меньше чувствуют голод. Некоторые исследования предполагают, что она может помогать и в контроле диабета второго типа.


    Но специалисты предупреждают, что диета подходит не всем. Её трудно соблюдать, и многие снова набирают вес, когда прекращают её. Некоторые спортсмены отмечают, что их результаты ухудшаются, особенно в видах спорта, где нужны короткие всплески энергии. Есть также опасения по поводу избытка насыщенных жиров и долгосрочных последствий, которые пока плохо изучены.


    Итак: низкоуглеводные диеты могут подойти некоторым людям, но это не волшебство. Прежде чем сильно менять рацион, всегда стоит посоветоваться с врачом. А для большинства из нас лучшей остаётся самая простая диета — много овощей, немного сахара и еда, которая нам действительно нравится.

    '
