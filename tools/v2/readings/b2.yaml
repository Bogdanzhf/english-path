  v1_unit: The Renaissance Mind
  title: Leonardo's Notebooks
  title_ru: Записные книжки Леонардо
  text: 'Leonardo da Vinci is best known for the "Mona Lisa", but painting was only one aspect of his extraordinary mind. He was the perfect "Renaissance man": an artist, engineer, scientist and inventor who believed that everything in nature was tied together.


    Leonardo filled more than 7,000 pages of notebooks with drawings and ideas. He wrote in mirror writing, from right to left, perhaps to keep his ideas secret. The notebooks are incredibly informative. They show studies of birds in flight, designs for flying machines, plans for bridges and drawings of buds and leaves. Long before the invention of the parachute, he sketched one made of cloth tied to a wooden frame.


    His most important work may have been in anatomy. Leonardo undertook detailed studies of the human body, drawing muscles, bones and organs with amazing accuracy. He was fascinated by the eye. He studied how light enters it and travels along the optic nerve to the brain. To see the shape of the brain, he filled its empty spaces with melted wax — a technique that was centuries ahead of its time.


    Leonardo''s method was surprisingly modern. He would start with a hypothesis, then test it through careful observation. If an experiment disproved his idea, he changed it. His spatial imagination was an enormous asset: he could picture complex machines in three dimensions before building them.


    Unfortunately, Leonardo rarely finished his projects, and most of his notebooks were not published. For centuries, other scientists received the credit for discoveries that he had made first. Today, however, there is a much greater awareness of his genius. His notebooks are studied by engineers, doctors and artists alike, and many of his machines have been built from his drawings. As one historian put it, Leonardo did not just live in the Renaissance — he was the Renaissance.

    '
  ru: 'Леонардо да Винчи больше всего известен «Моной Лизой», но живопись была лишь одной стороной его необыкновенного ума. Он был идеальным «человеком Возрождения»: художником, инженером, учёным и изобретателем, считавшим, что всё в природе связано между собой.


    Леонардо заполнил более 7000 страниц записных книжек рисунками и идеями. Он писал зеркальным почерком, справа налево, — возможно, чтобы сохранить свои идеи в тайне. Записные книжки удивительно содержательны. В них — наблюдения за полётом птиц, проекты летательных машин, планы мостов и рисунки почек и листьев. Задолго до изобретения парашюта он набросал его — из ткани, привязанной к деревянной раме.


    Его важнейшей работой, возможно, была анатомия. Леонардо предпринял подробные исследования человеческого тела, рисуя мышцы, кости и органы с поразительной точностью. Его завораживал глаз. Он изучал, как свет попадает в глаз и идёт по зрительному нерву к мозгу. Чтобы увидеть форму мозга, он заполнил его полости расплавленным воском — метод, на века опередивший своё время.


    Метод Леонардо был удивительно современным. Он начинал с гипотезы, а затем проверял её тщательными наблюдениями. Если эксперимент опровергал его идею, он её менял. Его пространственное воображение было огромным преимуществом: он мог представить сложные машины в трёх измерениях до того, как их построить.


    К сожалению, Леонардо редко доводил проекты до конца, и большая часть его записей не была опубликована. Веками другие учёные получали признание за открытия, которые он сделал первым. Однако сегодня о его гениальности знают гораздо больше. Его записные книжки изучают и инженеры, и врачи, и художники, а многие его машины построены по его чертежам. Как сказал один историк, Леонардо не просто жил в эпоху Возрождения — он и был Возрождением.

    '
