  v1_unit: The Invisible Enemy
  title: Pasteur and the Boy
  title_ru: Пастер и мальчик
  text: 'In the nineteenth century, most doctors had no idea what caused disease. Many believed that illnesses came from "bad air". The French scientist Louis Pasteur had a different theory: he believed that tiny living things — microbes — were responsible. Under the microscope, which could magnify objects hundreds of times, he could see bacteria that were invisible to the eye. At first, his ideas were far from mainstream, and many doctors laughed at him.


    One of the most feared diseases at the time was rabies. Animals such as dogs and wolves passed it to humans through bites. After a few weeks, victims suffered terrible pain, paralysis and death. A cure was elusive; nearly everyone who developed symptoms died. Pasteur could not see the cause of rabies under his microscope — it was a virus, far too small — but he was determined to find a way to fight it.


    For years, Pasteur worked on a vaccine. He took tissue from infected rabbits and dried it to weaken the disease. When he gave a series of injections to dogs, they became resistant to rabies. But he had never tested it on a human.


    In July 1885, a mother arrived at his laboratory with her nine-year-old son, Joseph Meister. Two days earlier, the boy had been attacked by a savage dog and bitten fourteen times. Without treatment, he would almost certainly die. Pasteur was not a doctor, and treating the boy was legally risky. But he decided to try. Over ten days, Joseph received thirteen injections. Pasteur hardly slept, waiting for any sign of deterioration.


    Joseph survived. The news stunned the world, and people bitten by rabid animals travelled from as far away as Russia to be treated. Pasteur''s pursuit of science prevailed over doubt, and his ideas became inseparable from modern medicine. Joseph Meister later worked as a caretaker at the Pasteur Institute in Paris for the rest of his life.

    '
  ru: 'В XIX веке большинство врачей понятия не имели, что вызывает болезни. Многие считали, что болезни берутся из «дурного воздуха». У французского учёного Луи Пастера была другая теория: он считал, что виной всему крошечные живые существа — микробы. Под микроскопом, увеличивавшим предметы в сотни раз, он видел бактерии, невидимые глазу. Поначалу его идеи были далеки от общепринятых, и многие врачи над ним смеялись.


    Одной из самых страшных болезней того времени было бешенство. Животные — собаки, волки — передавали его людям через укусы. Через несколько недель у пострадавших начинались страшные боли, паралич, а затем смерть. Лекарства не было; почти все, у кого появлялись симптомы, умирали. Пастер не мог разглядеть возбудителя бешенства в микроскоп — это был вирус, слишком маленький, — но он был полон решимости найти способ с ним бороться.


    Годами Пастер работал над вакциной. Он брал ткани заражённых кроликов и высушивал их, чтобы ослабить болезнь. Когда он сделал серию прививок собакам, они стали невосприимчивы к бешенству. Но на человеке он вакцину никогда не испытывал.


    В июле 1885 года в его лабораторию пришла мать с девятилетним сыном Жозефом Мейстером. За два дня до этого на мальчика напала бешеная собака и укусила его четырнадцать раз. Без лечения он почти наверняка умер бы. Пастер не был врачом, и лечить мальчика было рискованно с точки зрения закона. Но он решил попробовать. За десять дней Жозеф получил тринадцать уколов. Пастер почти не спал, ожидая любых признаков ухудшения.


    Жозеф выжил. Новость потрясла мир, и люди, покусанные бешеными животными, приезжали лечиться даже из далёкой России. Стремление Пастера к знаниям одержало верх над сомнениями, и его идеи стали неотделимы от современной медицины. Жозеф Мейстер впоследствии всю жизнь проработал смотрителем в Институте Пастера в Париже.

    '
