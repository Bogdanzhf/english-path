  v1_unit: The Iceman's Tattoos
  title: A 5,300-Year-Old Patient
  title_ru: Пациент возрастом 5300 лет
  text: 'In September 1991, two hikers in the Alps on the border between Austria and Italy noticed a body sticking out of the melting ice. At first, they assumed it was a modern climber who had died in an accident. In fact, they had found one of the most important discoveries in the history of anthropology: a man who had died about 5,300 years ago. Scientists named him Ötzi.


    Because the ice had preserved his body so well, researchers could study him in incredible detail. He was around forty-five years old, about 1.60 metres tall, with a strong, muscular build from a life of walking in the mountains. Analysis of his teeth and bones showed that he had grown up in a valley situated not far from where he was found. He carried a copper axe, a bow, arrows and a small kit of crude tools.


    One of the most surprising findings was on his skin. Ötzi had sixty-one tattoos — simple lines and crosses made by rubbing charcoal into small cuts. Interestingly, they were not decorative. Most were located on his lower back, knees and ankles, exactly where X-rays revealed that he suffered from worn joints and arthritis, probably caused by years of walking and poor posture. Many researchers believe the tattoos were a form of medical treatment, similar to acupuncture.


    For years, Ötzi''s death was a mystery. Then, in 2001, a new X-ray revealed an arrowhead in his shoulder. He had been shot from behind and probably died within minutes. After several consecutive years of study, a team supervised by an Italian professor concluded that he had been murdered.


    Today, Ötzi is displayed in a special cold room in a museum in Bolzano, Italy, which attracts thousands of visitors, from undergraduates to tourists. A monument marks the place where he was found. His tattoos also challenge our ignorance about the past: tattoos were not merely masculine decoration or modern fashion, but may have been one of humanity''s oldest medical practices.

    '
  ru: 'В сентябре 1991 года двое туристов в Альпах на границе Австрии и Италии заметили тело, торчащее из тающего льда. Сначала они решили, что это современный альпинист, погибший в результате несчастного случая. На самом деле они сделали одно из важнейших открытий в истории антропологии: перед ними был человек, умерший около 5300 лет назад. Учёные назвали его Эци.


    Поскольку лёд прекрасно сохранил его тело, исследователи смогли изучить его невероятно подробно. Ему было около сорока пяти лет, рост — около 1,60 метра, он был крепким и мускулистым от постоянной ходьбы по горам. Анализ зубов и костей показал, что он вырос в долине, расположенной неподалёку от места находки. При нём были медный топор, лук, стрелы и небольшой набор примитивных орудий.


    Одно из самых удивительных открытий касалось его кожи. У Эци была шестьдесят одна татуировка — простые линии и крестики, сделанные втиранием угля в небольшие надрезы. Интересно, что они не были украшением. Большинство располагалось на пояснице, коленях и лодыжках — именно там, где рентген выявил изношенные суставы и артрит, вероятно, от многолетней ходьбы и плохой осанки. Многие исследователи считают, что татуировки были формой лечения, похожей на иглоукалывание.


    Долгие годы смерть Эци оставалась загадкой. А в 2001 году новый рентгеновский снимок обнаружил наконечник стрелы в его плече. В него выстрелили сзади, и он, вероятно, умер в течение нескольких минут. После нескольких лет исследований подряд группа под руководством итальянского профессора пришла к выводу, что он был убит.


    Сегодня Эци выставлен в специальной холодной камере музея в Больцано (Италия), куда приходят тысячи посетителей — от студентов до туристов. На месте находки стоит памятник. Его татуировки также опровергают наше невежество в отношении прошлого: татуировки были не просто мужским украшением или современной модой, а, возможно, одной из древнейших медицинских практик человечества.

    '
