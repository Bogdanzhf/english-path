  v1_unit: The Mystery of the Yawn
  title: Why Is Yawning Contagious?
  title_ru: Почему зевота заразительна?
  text: 'Try this experiment: next time you are with friends, yawn widely and watch what happens. There is a good chance that at least one of them will yawn too. You might even be yawning right now, simply because you are reading about it. Contagious yawning is one of the strangest and most familiar human behaviours, yet scientists still argue about why it happens.


    We all yawn, from before birth to old age. Even animals do it — dogs, cats, lions, snakes and even fish. For a long time, people believed that we yawn because our blood needs more oxygen. However, experiments have failed to support this idea: breathing extra oxygen does not reduce yawning. Another theory suggests that yawning cools the brain, which may help us stay alert. People yawn more often when the air is cool than when it is very hot, which fits this theory.


    The contagious part is even more puzzling. One popular explanation is that it is linked to empathy — our ability to understand and share the feelings of others. Studies suggest that people tend to catch yawns more easily from family and friends than from strangers. Young children under four rarely catch yawns, and some research suggests that this ability develops as children learn to understand other people''s feelings. Some animals that live in close social groups, such as chimpanzees and dogs, also catch yawns, perhaps because they emulate those they are close to.


    However, not all scientists agree. Some studies found that the link with empathy is weak and that age is a more important factor: older people catch yawns less often. Research has also been constrained by the difficulty of measuring something so automatic. You can try to restrain a yawn, but it is almost impossible to stop one completely.


    Whatever the explanation, yawning seems to be an inherent part of being a social animal. So if a colleague yawns during your presentation, try to be tolerant. They may not be bored — they might just be showing that they care.

    '
  ru: 'Попробуйте провести эксперимент: в следующий раз, когда будете с друзьями, широко зевните и посмотрите, что произойдёт. Велика вероятность, что хотя бы один из них тоже зевнёт. Возможно, вы зеваете прямо сейчас — просто потому, что читаете об этом. Заразительная зевота — одно из самых странных и привычных проявлений человеческого поведения, и всё же учёные до сих пор спорят, почему так происходит.


    Зевают все — от внутриутробного возраста до старости. Зевают даже животные: собаки, кошки, львы, змеи и даже рыбы. Долгое время считалось, что мы зеваем, потому что крови нужно больше кислорода. Однако эксперименты эту идею не подтвердили: дополнительный кислород не уменьшает зевоту. Другая теория предполагает, что зевота охлаждает мозг, что может помогать нам сохранять бодрость. Люди зевают чаще, когда воздух прохладный, чем когда очень жарко, и это согласуется с теорией.


    Заразительность зевоты ещё загадочнее. Одно из популярных объяснений связывает её с эмпатией — способностью понимать и разделять чувства других. Исследования показывают, что люди легче «заражаются» зевотой от родных и друзей, чем от незнакомцев. Дети младше четырёх лет редко подхватывают зевоту, и некоторые исследования предполагают, что эта способность развивается по мере того, как дети учатся понимать чувства других. Некоторые животные, живущие тесными социальными группами, — например, шимпанзе и собаки, — тоже подхватывают зевоту, возможно, потому что подражают близким.


    Однако согласны не все учёные. Некоторые исследования показали, что связь с эмпатией слабая, а важнее возраст: пожилые люди реже заражаются зевотой. Исследования также ограничивает то, что так трудно измерить нечто настолько автоматическое. Можно попытаться сдержать зевок, но остановить его полностью почти невозможно.


    Каким бы ни было объяснение, зевота, похоже, неотъемлемая часть жизни социального животного. Так что если коллега зевает во время вашей презентации, будьте снисходительны. Возможно, ему не скучно — возможно, он просто показывает, что ему не всё равно.

    '
