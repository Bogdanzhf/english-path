  v1_unit: The Toughest Animal on Earth
  title: The Water Bear
  title_ru: Водяной медведь
  text: 'If you could look through a microscope at a piece of wet moss, you might see a bizarre creature slowly walking on eight stubby legs. It looks a little like a chubby bear with a tiny face. Scientists call it a tardigrade; most people call it a water bear. It is less than a millimetre long, and it may be the toughest animal on Earth.


    Tardigrades are aquatic animals, but they live almost everywhere in the biosphere: in mountains and deep oceans, in tropical forests and temperate gardens, even in the ice of Antarctica. Over 1,000 species have been identified. Most feed on plants or bacteria, which they digest using a special mouthpart, and some are parasites.


    What makes them remarkable is their extraordinary tolerance to extreme conditions. When their environment dries out, they undergo a dramatic transformation. They pull in their legs, curl into a dry ball called a "tun", and slow their metabolism to almost nothing. In this state, they can survive for years. Laboratory experiments have shown that tardigrades can withstand temperatures from almost −272 degrees Celsius to around 150 degrees, pressures six times greater than in the deepest ocean, and doses of radiation hundreds of times higher than would kill a human.


    Their most famous feat came in 2007, when scientists sent tardigrades into space on a satellite. They were exposed to the vacuum and radiation of space for ten days. After returning to Earth, many of them were rehydrated, woke up and even produced healthy young, showing that their reproductive systems had survived.


    How do they do it? Prominent researchers have found that tardigrades produce special proteins that protect the DNA in each cell''s nucleus. Studying these proteins could help scientists preserve vaccines without refrigeration or protect astronauts on long journeys. Tardigrades are not indestructible — they are vulnerable when active and can be killed by long-term heat — but their resilience seems almost infinite. Some scientists believe they will be among the last survivors on Earth.

    '
  ru: 'Если бы вы посмотрели в микроскоп на кусочек влажного мха, вы могли бы увидеть причудливое существо, медленно шагающее на восьми коротких лапках. Оно немного похоже на пухлого медведя с крошечной мордочкой. Учёные называют его тихоходкой, а в народе — водяным медведем. Его длина меньше миллиметра, и, возможно, это самое выносливое животное на Земле.


    Тихоходки — водные животные, но живут они почти повсюду в биосфере: в горах и океанских глубинах, в тропических лесах и садах умеренного пояса, даже во льдах Антарктиды. Описано более 1000 видов. Большинство питается растениями или бактериями, которые переваривает с помощью особого ротового аппарата, а некоторые — паразиты.


    Удивительными их делает невероятная устойчивость к экстремальным условиям. Когда среда пересыхает, они претерпевают резкое превращение. Они втягивают лапки, сворачиваются в сухой комочек — так называемую «бочонковую форму» — и замедляют обмен веществ почти до нуля. В таком состоянии они могут жить годами. Лабораторные эксперименты показали, что тихоходки выдерживают температуру от почти −272 до примерно 150 градусов Цельсия, давление в шесть раз выше, чем в самой глубокой точке океана, и дозы радиации в сотни раз выше смертельных для человека.


    Их самый знаменитый подвиг случился в 2007 году, когда учёные отправили тихоходок в космос на спутнике. Десять дней они находились в вакууме и под космическим излучением. Вернувшись на Землю, многие из них после увлажнения ожили и даже дали здоровое потомство — значит, их репродуктивная система тоже уцелела.


    Как им это удаётся? Видные исследователи обнаружили, что тихоходки вырабатывают особые белки, защищающие ДНК в ядре каждой клетки. Изучение этих белков может помочь учёным хранить вакцины без холодильников или защищать астронавтов в долгих полётах. Тихоходки не неуязвимы: в активном состоянии они уязвимы, и их может убить длительная жара, — но их живучесть кажется почти бесконечной. Некоторые учёные считают, что они будут среди последних выживших на Земле.

    '
