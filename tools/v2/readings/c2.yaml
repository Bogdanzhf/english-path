  v1_unit: The Sanctuary
  title: The Elephant Orphanage
  title_ru: Приют для слонят
  text: 'In Nairobi National Park, just outside the capital of Kenya, an unusual crowd gathers every morning at eleven o''clock. Tourists, school groups and local families line up as spectators behind a rope. Then, one by one, baby elephants come running out of the bushes towards their keepers, who are holding giant bottles of milk. This is the elephant orphanage of the Sheldrick Wildlife Trust.


    For decades, Africa''s elephants were hounded by poachers. Their tusks were sold for ivory, which was carved into ornaments and jewellery. When a mother elephant is killed, her baby cannot survive alone; young elephants depend on their mothers'' milk for at least two years. The orphanage was founded in 1977 by Daphne Sheldrick, who spent years discovering a formula that baby elephants could safely digest. Her success came after many failures and heartbreaking losses.


    The sanctuary caters for elephants who have lost their families to poaching, drought or conflict with farmers. Each baby is cared for by human keepers who stay with it day and night. They feed it every three hours, play football with it and even sleep next to it, covering it with a blanket. The keepers must be patient and considerate; elephants are sensitive animals that suffer from grief. Experts say that elephants have an extraordinary faculty for memory and emotion, so the care cannot be cold or impersonal.


    The orphanage is not a zoo. The aim is to return every elephant to the wild. When they are older, the young elephants are moved to facilities in Tsavo National Park, where rangers escort them as they gradually meet wild herds. Remarkably, many orphans who have returned to the wild later come back to visit their former keepers, sometimes with their own babies. Some gently lick their keepers'' hands, as if remembering them.


    Since 1977, the Trust has raised more than 300 orphans. Visitors are entitled to watch the feeding, but they are asked not to yell or touch the animals. Many leave with a new determination to reduce the consumption of ivory and protect elephants from external threats.

    '
  ru: 'В национальном парке Найроби, сразу за столицей Кении, каждое утро в одиннадцать часов собирается необычная толпа. Туристы, школьники и местные семьи выстраиваются за верёвкой, как зрители. А затем из кустов один за другим выбегают слонята и мчатся к своим смотрителям, держащим огромные бутылки с молоком. Это слоновий приют фонда дикой природы Шелдрик.


    Десятилетиями африканских слонов преследовали браконьеры. Их бивни продавали как слоновую кость, из которой вырезали украшения и безделушки. Когда слониху убивают, её детёныш не может выжить один: слонята питаются материнским молоком как минимум два года. Приют основала в 1977 году Дафна Шелдрик, которая потратила годы на то, чтобы подобрать смесь, которую слонята могли бы безопасно переваривать. Успех пришёл к ней после множества неудач и душераздирающих потерь.


    Заповедник принимает слонят, потерявших семьи из-за браконьеров, засухи или конфликтов с фермерами. За каждым малышом ухаживают смотрители, которые находятся рядом с ним днём и ночью. Они кормят его каждые три часа, играют с ним в футбол и даже спят рядом, укрывая одеялом. Смотрители должны быть терпеливыми и чуткими: слоны — ранимые животные, которые страдают от горя. Эксперты говорят, что у слонов поразительная способность к запоминанию и переживанию эмоций, поэтому забота не может быть холодной и формальной.


    Приют — не зоопарк. Цель — вернуть каждого слона в дикую природу. Подросших слонят переводят в центры национального парка Цаво, где рейнджеры сопровождают их, пока они постепенно знакомятся с дикими стадами. Удивительно, но многие сироты, вернувшиеся в дикую природу, потом приходят навестить своих бывших смотрителей, иногда со своими детёнышами. Некоторые ласково лижут руки смотрителей, словно вспоминая их.


    С 1977 года фонд вырастил более 300 сирот. Посетители могут наблюдать за кормлением, но их просят не кричать и не трогать животных. Многие уходят с новой решимостью сократить потребление слоновой кости и защитить слонов от внешних угроз.

    '
