  v1_unit: Oh, the Humanity!
  title: The Hindenburg Disaster
  title_ru: Катастрофа «Гинденбурга»
  text: 'In the 1930s, the fastest way to cross the Atlantic was not by ship or plane, but by airship. The most famous of these giant flying machines was the German Hindenburg. At 245 metres long, it was the largest aircraft ever built — almost as long as the Titanic. Inside, wealthy passengers enjoyed a dining room, a lounge with a piano and cabins with views of the ocean below.


    The Hindenburg was lifted by hydrogen, a gas that is lighter than air but extremely flammable. Its designers had wanted to use helium, which does not burn, but the USA controlled most of the world''s supply and refused to sell it to Nazi Germany. The risks of hydrogen were known, but many experts underestimated them. To reduce the danger, the airship had a smoking room with special safety features, and crew members wore shoes that could not cause sparks.


    On 6 May 1937, after crossing the Atlantic, the Hindenburg arrived at Lakehurst, New Jersey, amid storms. A crowd had gathered to watch, including journalists and a mob of photographers. As the airship approached its mooring mast, flames suddenly appeared near its tail. In just over thirty seconds, the whole ship was burning and crashed to the ground. In the tumult, passengers jumped from windows, and ground crew rushed to help, while others evacuated the area. Amazingly, sixty-two of the ninety-seven people on board survived. A radio reporter, describing the scene live, cried the famous words: "Oh, the humanity!"


    The disaster caused an international uproar. Investigators examined the wreck with intense scrutiny, and dozens of witnesses testified. Some suggested sabotage, but it seemed premature to blame anyone without evidence. The most likely culprit was static electricity from the stormy air, which ignited leaking hydrogen. Some historians think the ship''s outer skin may also have burned easily.


    The images, filmed and photographed in dramatic detail, shocked the world. Public trust collapsed, and the age of passenger airships ended almost overnight. Today, the Hindenburg remains a powerful symbol of how quickly confidence in new technology can turn to fear.

    '
  ru: 'В 1930-х годах быстрее всего пересечь Атлантику можно было не на корабле и не на самолёте, а на дирижабле. Самым знаменитым из этих гигантских летательных аппаратов был немецкий «Гинденбург». Длиной 245 метров, это было крупнейшее воздушное судно из когда-либо построенных — почти таким же длинным был «Титаник». Внутри богатые пассажиры наслаждались столовой, гостиной с роялем и каютами с видом на океан.


    «Гинденбург» поднимался в воздух благодаря водороду — газу легче воздуха, но чрезвычайно горючему. Конструкторы хотели использовать гелий, который не горит, но США контролировали большую часть его мировых запасов и отказались продавать его нацистской Германии. Опасность водорода была известна, но многие специалисты её недооценивали. Чтобы снизить риск, на борту устроили курительную комнату с особыми мерами безопасности, а члены экипажа носили обувь, не высекавшую искр.


    6 мая 1937 года, пересёкши Атлантику, «Гинденбург» прибыл в Лейкхерст (Нью-Джерси) в разгар грозы. Посмотреть собралась толпа, в том числе журналисты и масса фотографов. Когда дирижабль приближался к причальной мачте, у его хвоста внезапно появилось пламя. Всего за тридцать с небольшим секунд весь корабль охватил огонь, и он рухнул на землю. В суматохе пассажиры прыгали из окон, наземная команда бросалась на помощь, а другие покидали опасную зону. Удивительно, но шестьдесят два человека из девяноста семи, находившихся на борту, выжили. Радиорепортёр, ведший прямой репортаж, выкрикнул знаменитые слова: «О, человечество!»


    Катастрофа вызвала международный резонанс. Следователи пристально изучали обломки, десятки свидетелей дали показания. Некоторые предполагали диверсию, но обвинять кого-либо без доказательств было преждевременно. Наиболее вероятным виновником было статическое электричество в грозовом воздухе, воспламенившее протекающий водород. Некоторые историки считают, что легко могла загореться и внешняя оболочка корабля.


    Кадры, снятые и сфотографированные во всех драматических подробностях, потрясли мир. Доверие публики рухнуло, и эпоха пассажирских дирижаблей закончилась почти в одночасье. Сегодня «Гинденбург» остаётся мощным символом того, как быстро доверие к новой технологии может смениться страхом.

    '
