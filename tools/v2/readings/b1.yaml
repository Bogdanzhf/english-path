  v1_unit: A Visit to the City
  title: A Week in Copenhagen
  title_ru: Неделя в Копенгагене
  text: 'Last July, I flew to Copenhagen to visit my cousin Freya. It was my first time on a plane alone, and I was a bit nervous. But when I arrived, Freya was waiting for me with a big pink sign that said "WELCOME!" I laughed and immediately felt better.


    Freya and her husband were wonderful hosts. Their flat was small but modern, with a soft grey carpet and a huge window in the upper part of the living room. On my first evening, they welcomed me with a traditional Danish dinner. There were other guests too — friends from Freya''s work — and we talked until midnight.


    The temperature in Copenhagen was perfect: about twenty-two degrees every day. We spent the mornings walking around the city. I loved the architecture: old colourful houses next to modern glass buildings. In the parks, the flowers were blooming everywhere. We visited a museum about the Vikings, where I saw an ancient boat that looked like a long canoe. In the afternoon, we went to an art gallery. One evening, we even went to the theater, although I didn''t understand a word of the Danish play!


    On Saturday, we took a basket of food to the beach and had a picnic. Freya''s husband had packed it the night before and kept it in the refrigerator, so the drinks were still cold.


    On my last day, I sat at Freya''s desk and wrote a thank-you card. "You must come to visit me next year," I wrote. It was the best holiday of my life.

    '
  ru: 'Прошлым июлем я полетел в Копенгаген в гости к двоюродной сестре Фрейе. Я впервые летел один и немного нервничал. Но когда я прилетел, Фрейя ждала меня с большой розовой табличкой «ДОБРО ПОЖАЛОВАТЬ!». Я рассмеялся и сразу почувствовал себя лучше.


    Фрейя и её муж оказались чудесными хозяевами. Их квартира была небольшой, но современной, с мягким серым ковролином и огромным окном в верхней части гостиной. В первый вечер они угостили меня традиционным датским ужином. Были и другие гости — друзья Фрейи с работы, — и мы проговорили до полуночи.


    Погода в Копенгагене была идеальной: около двадцати двух градусов каждый день. По утрам мы гуляли по городу. Мне очень понравилась архитектура: старые разноцветные дома рядом с современными стеклянными зданиями. В парках повсюду цвели цветы. Мы побывали в музее викингов, где я увидел древнюю лодку, похожую на длинное каноэ. После обеда мы пошли в художественную галерею. Однажды вечером мы даже сходили в театр, хотя я не понял ни слова из датской пьесы!


    В субботу мы взяли корзину с едой на пляж и устроили пикник. Муж Фрейи собрал её накануне вечером и поставил в холодильник, так что напитки были ещё холодными.


    В последний день я сел за стол Фрейи и написал открытку с благодарностью. «Обязательно приезжайте ко мне в следующем году», — написал я. Это был лучший отпуск в моей жизни.

    '
