  v1_unit: The Stubborn Merchant
  title: The Merchant of Venice Street
  title_ru: Купец с Венецианской улицы
  text: 'Mr. Rossi was the most stubborn merchant in the whole suburb. For forty years, he had run a small grocer''s shop next to the old canal. He sold bread, fruit and dairy products, and he always did things his own way. He refused to take cards, he never opened on Sundays, and he never, ever hesitated to tell customers what he thought.


    One winter, a big supermarket company wanted to build a shopping centre on his street. They offered to buy all the shops. Everyone sold — except Mr. Rossi. "This shop is an institution," he said. "My father opened it. I''m not leaving."


    The company tried everything. They made a bigger offer. They postponed the building work again and again, hoping he would give up. Mr. Rossi''s back ached, and his doctor told him to rest. The chemist next door gave him medicine for the chill he had caught. But every morning he still opened the shop at six.


    Then came the storm. An arctic wind blew for three days, and on the third night, a very high tide pushed water from the canal into the streets. Water splashed against the doors and descended into the cellars. Many houses were flooded. It could have been a tragedy.


    But Mr. Rossi''s shop was on higher ground, and it was the only shop still open. For a whole week, he gave food to families who had lost everything. He jogged up and down the street with bags of bread, poking his head into every house to check on the old people.


    After the flood, the story even reached the national congress of shopkeepers, who gave him a prize. And the company? They built their shopping centre one street away. Mr. Rossi''s shop is still there. And yes — he now accepts cards.

    '
  ru: 'Мистер Росси был самым упрямым купцом во всём пригороде. Сорок лет он держал маленькую продуктовую лавку у старого канала. Он продавал хлеб, фрукты и молочные продукты и всегда всё делал по-своему. Он не принимал карты, никогда не открывался по воскресеньям и никогда, ни за что не стеснялся говорить покупателям, что о них думает.


    Однажды зимой крупная сеть супермаркетов задумала построить на его улице торговый центр. Компания предложила выкупить все магазины. Продали все — кроме мистера Росси. «Эта лавка — целое учреждение, — сказал он. — Её открыл мой отец. Я никуда не уйду».


    Компания перепробовала всё. Она предложила больше денег. Снова и снова откладывала строительство в надежде, что он сдастся. У мистера Росси болела спина, и врач велел ему отдыхать. Аптекарь по соседству дал ему лекарство от простуды. Но каждое утро он по-прежнему открывал лавку в шесть.


    А потом пришла буря. Три дня дул арктический ветер, а на третью ночь очень высокий прилив вытолкнул воду из канала на улицы. Вода плескалась о двери и стекала в подвалы. Многие дома затопило. Могла случиться трагедия.


    Но лавка мистера Росси стояла на возвышении, и только она одна оставалась открытой. Целую неделю он кормил семьи, потерявшие всё. Он трусцой бегал по улице с пакетами хлеба, заглядывая в каждый дом, чтобы проверить, как там старики.


    После наводнения эта история дошла даже до национального съезда владельцев магазинов, и ему вручили премию. А компания? Она построила свой торговый центр через улицу. Лавка мистера Росси всё ещё на месте. И да — теперь он принимает карты.

    '
