  v1_unit: The Black Death
  title: The Plague That Changed Europe
  title_ru: Чума, изменившая Европу
  text: 'In 1347, ships arrived in Sicily carrying sailors who were dying of a terrible illness. Within weeks, the disease had spread to the mainland. Over the next five years, the Black Death swept across Europe, killing between a third and a half of its population. It was the deadliest pandemic in recorded history.


    The symptoms were horrifying: high fever, painful black swellings and, often, death within days. People lived in constant dread. Death seemed random; it took the young and old, rich and poor alike. A writer in Florence scribbled that people "ate lunch with their friends and dinner with their ancestors". Doctors tried everything — bleeding patients, burning herbs, carrying flowers to block the "bad air" — but to no avail. Desperate crowds visited shrines to pray, while some people fled to the countryside in search of safety and solitude.


    Nobody understood the cause. Many believed it was a punishment from God. Others blamed minorities, and in some cities, Jewish communities were attacked by angry mobs. Today we know that the plague was caused by a tiny organism, a bacterium called Yersinia pestis, carried by fleas that lived on rats and spread through crowded towns.


    The consequences were fundamental. With so many workers dead, those who survived could demand higher wages. When rulers tried to stop wages from rising, there were riots, such as the Peasants'' Revolt in England in 1381. Land became cheaper, and ordinary people gained new freedoms. Some historians define the Black Death as the beginning of the end of the medieval world.


    The fear lingered for centuries; outbreaks continued to return until the 1700s. When modern people are incredulous that a disease could change history, historians point to the plague as a stark example. To paraphrase one scholar: pandemics do not just kill people; they reshape societies. The success of modern medicine — antibiotics now cure the plague — should not make us forget how quickly the situation can worsen when a new disease appears.

    '
  ru: 'В 1347 году в Сицилию прибыли корабли с моряками, умиравшими от ужасной болезни. Через несколько недель болезнь перекинулась на материк. За следующие пять лет Чёрная смерть пронеслась по Европе, унеся от трети до половины её населения. Это была самая смертоносная пандемия в истории.


    Симптомы были ужасающими: сильный жар, болезненные чёрные опухоли и часто смерть в течение нескольких дней. Люди жили в постоянном страхе. Смерть казалась случайной: она забирала молодых и старых, богатых и бедных без разбора. Один флорентийский писатель записал, что люди «обедали с друзьями, а ужинали с предками». Врачи перепробовали всё — пускали кровь, жгли травы, носили цветы, чтобы защититься от «дурного воздуха», — но тщетно. Отчаявшиеся толпы шли к святыням молиться, а некоторые бежали в деревни в поисках безопасности и уединения.


    Причину никто не понимал. Многие считали это Божьей карой. Другие обвиняли меньшинства, и в некоторых городах разъярённые толпы нападали на еврейские общины. Сегодня мы знаем, что чуму вызывал крошечный организм — бактерия Yersinia pestis, которую переносили блохи, жившие на крысах и распространявшиеся по тесным городам.


    Последствия были коренными. Поскольку погибло так много работников, выжившие могли требовать более высокой оплаты. Когда правители пытались не допустить роста заработков, вспыхивали восстания — например, крестьянское восстание в Англии в 1381 году. Земля подешевела, а простые люди получили новые свободы. Некоторые историки считают Чёрную смерть началом конца средневекового мира.


    Страх сохранялся веками: вспышки возвращались вплоть до XVIII века. Когда современные люди с недоверием относятся к тому, что болезнь может изменить ход истории, историки приводят чуму как наглядный пример. Перефразируя одного учёного: пандемии не просто убивают людей — они меняют общества. Успехи современной медицины — сегодня чуму излечивают антибиотиками — не должны заставлять нас забывать, как быстро всё может ухудшиться, когда появляется новая болезнь.

    '
