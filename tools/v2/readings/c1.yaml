  v1_unit: Discipline Then and Now
  title: Spare the Rod?
  title_ru: Пожалеть розгу?
  text: 'In a small museum in northern England, visitors can step into a classroom from 1900. There are wooden desks in neat rows, slates for writing, and hoops that children played with during break. On the teacher''s desk lies a long, thin stick called a cane. It offers a glimpse into a time when physical punishment was a normal part of school life.


    For centuries, it was the custom in many countries for teachers to hit children who were disobedient, lazy or simply slow. Pupils could be caned for talking, for being late or even for writing with their left hand. School records, an excellent source for historians, show some teachers recording dozens of punishments per week. Many adults who went to school in the mid-twentieth century still remember the misfortune of facing a stern headmaster, pleading for mercy, and going home with bruises on their hands.


    People who supported the practice argued that it was for the children''s own sake. "Spare the rod and spoil the child," went a well-known saying: without punishment, children would grow up badly behaved. Few could foresee the negative effects it would have.


    However, from the 1960s onwards, attitudes began to change. Researchers found that physical punishment did not improve behaviour in the long term. Instead, it was linked to anxiety, aggression and poorer learning. Parents and teachers became increasingly vehement in their opposition. Gradually, countries began to ban it. Sweden banned smacking children altogether, even at home, in 1979. Britain banned it in state schools in 1987.


    Today, more than sixty countries have banned all forms of physical punishment of children, and international agreements bind many governments to protect children from violence. Modern teachers use very different methods: praise, clear rules and conversation. Of course, discipline is still needed. But most experts agree that a child who feels respected is far more likely to learn than one who is afraid.

    '
  ru: 'В небольшом музее на севере Англии посетители могут войти в класс 1900 года. Там стоят ровные ряды деревянных парт, грифельные доски для письма и обручи, с которыми дети играли на перемене. На учительском столе лежит длинная тонкая палка — трость для наказаний. Она позволяет заглянуть во времена, когда телесные наказания были обычной частью школьной жизни.


    Веками во многих странах учителя по обычаю били детей, которые были непослушными, ленивыми или просто медлительными. Учеников могли наказать тростью за разговоры, опоздание или даже за то, что они писали левой рукой. Школьные журналы — превосходный источник для историков — показывают, что некоторые учителя записывали десятки наказаний в неделю. Многие взрослые, ходившие в школу в середине XX века, до сих пор помнят, как им не повезло оказаться перед суровым директором, как они умоляли о пощаде и уходили домой с синяками на руках.


    Сторонники этой практики утверждали, что это делается для блага самих детей. «Пожалеешь розгу — испортишь ребёнка», — гласила известная поговорка: без наказаний дети вырастут невоспитанными. Мало кто мог предвидеть, к каким негативным последствиям это приведёт.


    Однако с 1960-х годов отношение начало меняться. Исследователи обнаружили, что телесные наказания не улучшают поведение в долгосрочной перспективе. Напротив, они связаны с тревожностью, агрессией и худшей успеваемостью. Родители и учителя всё яростнее выступали против. Постепенно страны начали их запрещать. Швеция в 1979 году полностью запретила шлепать детей, даже дома. Британия запретила телесные наказания в государственных школах в 1987 году.


    Сегодня более шестидесяти стран запретили все формы телесных наказаний детей, а международные соглашения обязывают многие правительства защищать детей от насилия. Современные учителя используют совсем другие методы: похвалу, чёткие правила и разговор. Конечно, дисциплина по-прежнему нужна. Но большинство экспертов согласны: ребёнок, который чувствует уважение, учится гораздо охотнее, чем тот, кто боится.

    '
